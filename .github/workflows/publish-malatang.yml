# 麻辣湯チャレンジの予約公開（一度きり）
# publish-malatang ブランチを main に取り込み、GitHub Pages で公開する。
# GitHub の時刻指定実行は遅れることがあるため、X 投稿（19:00 JST）より早めに起動する。
name: Publish 麻辣湯チャレンジ

on:
  schedule:
    - cron: '15 9 7 10 *' # 2026-10-07 18:15 JST（09:15 UTC）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge publish-malatang into main
        id: merge
        run: |
          if ! git ls-remote --exit-code origin publish-malatang >/dev/null; then
            echo "publish-malatang branch not found; already published."
            exit 0
          fi
          git fetch origin publish-malatang
          git merge --ff-only origin/publish-malatang
          git push origin main
          git push origin --delete publish-malatang
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Wait until the game page is live
        if: steps.merge.outputs.published == 'true'
        run: |
          for i in $(seq 1 30); do
            if curl -fsSL https://keifurukawafunnych.com/games/malatang-250g/ | grep -q 'malatang'; then
              echo "Live!"
              exit 0
            fi
            sleep 20
          done
          echo "Game page is not live after 10 minutes." >&2
          exit 1
