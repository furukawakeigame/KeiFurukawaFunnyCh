<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>人間モデル確認</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe0ee; font-family: system-ui, sans-serif; }
  canvas { display: block; touch-action: none; }
  .bar { position: fixed; left: 8px; top: 8px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 16px); }
  button { font: inherit; font-size: 13px; padding: 6px 10px; border: 0; border-radius: 6px; background: #fff; box-shadow: 0 1px 3px #0003; cursor: pointer; }
  button.on { background: #2f3e5c; color: #fff; }
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { makeHuman } from './human.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#cfe0ee'); scene.fog = new THREE.Fog('#cfe0ee', 12, 30);
const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 100);
scene.add(new THREE.HemisphereLight('#dbeaff', '#8a7a62', 1.1));
const sun = new THREE.DirectionalLight('#fff1dc', 2.4); sun.position.set(3, 6, 5); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024); sun.shadow.normalBias = 0.02; Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -2 }); scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(20, 48), new THREE.MeshStandardMaterial({ color: '#b9b2a2', roughness: 0.95 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

const params = new URLSearchParams(location.search);
let seed = +(params.get('seed') || 1);
let people = [];
const LINEUP = [
  { sex: 'male', age: 'adult' }, { sex: 'female', age: 'adult' }, { age: 'child' }, { sex: 'female', age: 'elder' },
  { sex: 'male', age: 'elder' }, { sex: 'female', age: 'adult' }, { sex: 'male', age: 'adult' }, { age: 'child' },
];
function build() {
  people.forEach(p => { scene.remove(p.root); p.dispose(); });
  people = LINEUP.map((o, i) => {
    const h = makeHuman({ ...o, seed: seed * 100 + i });
    h.root.position.x = (i - (LINEUP.length - 1) / 2) * 0.75;
    h.pose = pose; scene.add(h.root); return h;
  });
}
let pose = params.get('pose') || 'stand', walking = false, smile = 0.1, talk = false;
const bar = document.getElementById('bar');
const btn = (label, fn, group) => { const b = document.createElement('button'); b.textContent = label; b.dataset.g = group || ''; b.onclick = () => { if (group) bar.querySelectorAll(`[data-g="${group}"]`).forEach(x => x.classList.remove('on')); b.classList.add('on'); fn(); }; bar.appendChild(b); return b; };
for (const p of ['stand', 'wave', 'cheer', 'peace', 'point', 'hips', 'sit']) { const b = btn(p, () => { pose = p; people.forEach(h => h.pose = p); }, 'pose'); if (p === pose) b.classList.add('on'); }
btn('歩く', () => { walking = !walking; });
btn('笑顔', () => { smile = smile > 0.5 ? 0.1 : 0.9; });
btn('しゃべる', () => { talk = !talk; });
btn('別の人たち', () => { seed++; build(); });
build();

// カメラ（ドラッグで回す、ホイール・ピンチで寄る）
let yaw = 0, pitch = 0.05, dist = +(params.get('dist') || 7.5), ty = +(params.get('ty') || 0.95), drag = null;
if (params.get('yaw')) yaw = +params.get('yaw');
addEventListener('pointerdown', e => { if (e.target === renderer.domElement) drag = { x: e.clientX, y: e.clientY }; });
addEventListener('pointermove', e => { if (!drag) return; yaw -= (e.clientX - drag.x) * 0.008; pitch = Math.max(-0.3, Math.min(1.2, pitch + (e.clientY - drag.y) * 0.006)); drag = { x: e.clientX, y: e.clientY }; });
addEventListener('pointerup', () => drag = null);
addEventListener('wheel', e => { dist = Math.max(0.6, Math.min(20, dist * (1 + e.deltaY * 0.001))); ty = dist < 2.5 ? 1.45 : 0.95; });
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const look = new THREE.Vector3();
let last = performance.now();
renderer.setAnimationLoop(now => {
  const dt = (now - last) / 1000; last = now;
  const t = now / 1000;
  camera.position.set(Math.sin(yaw) * Math.cos(pitch) * dist, ty + Math.sin(pitch) * dist, Math.cos(yaw) * Math.cos(pitch) * dist);
  camera.lookAt(0, ty, 0);
  people.forEach((h, i) => {
    h.walkSpeed = walking ? 1.2 : 0;
    h.face.smile = smile;
    h.face.open = talk ? Math.max(0, Math.sin(t * 11 + i) * 0.5 + Math.sin(t * 7.3 + i * 2) * 0.3) : 0;
    h.lookAt(camera.position);
    h.update(dt);
  });
  renderer.render(scene, camera);
});
window.__people = () => people;
</script>
</body>
</html>
