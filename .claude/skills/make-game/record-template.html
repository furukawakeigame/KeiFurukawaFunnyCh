<!doctype html>
<meta charset="utf-8">
<title>record</title>
<style>body{margin:0;background:#222}#out{width:270px;height:480px;display:block}iframe{position:fixed;right:0;bottom:0;width:540px;height:960px;border:0;opacity:.02}</style>
<canvas id="out" width="1080" height="1920"></canvas>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script>
// 9:16 promo recorder: drives the real game in an iframe and composes the phone-style frame.
// 麻辣湯チャレンジ用に書いたもの。別のゲームでは frame()（画面の描き方）と take()（自動操作の台本）をそのゲームに合わせて書き換える。
// 使い方: .claude/ にコピーし、serve.ps1 で配信して http://localhost:8000/.claude/record.html を開き、run(plan) を呼ぶ。
// 録画は WebCodecs + mp4-muxer で正しい長さ情報の MP4 を作り、serve.ps1 の PUT で .claude/out/ に保存する。
// （MediaRecorder の MP4 は長さ情報が壊れるので使わない。serve.ps1 は途中シーク非対応なので、確認は通常再生で行う）
const out=document.getElementById('out'),o=out.getContext('2d'),W=1080,H=1920,FONT='"Yu Gothic UI","Hiragino Sans",sans-serif';
const STAGE={x:24,y:190,w:1032,h:1032*570/540};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let win,ghost=null,pressed=null,icons=[];
function rr(x,y,w,h,r){o.beginPath();o.roundRect(x,y,w,h,r)}
function wrap(text,x,y,max,lh){let line='',lines=[];for(const ch of text){if(o.measureText(line+ch).width>max){lines.push(line);line=''}line+=ch}lines.push(line);lines.forEach((l,i)=>o.fillText(l,x,y+i*lh));return lines.length}
function cell(i){const col=i%4,row=Math.floor(i/4),cw=(W-48)/4;return{x:24+col*cw+cw/2,y:1300+row*200}}
function frame(){
 const d=win&&win.document;o.fillStyle='#faf9f6';o.fillRect(0,0,W,H);if(!d||!d.getElementById('game'))return;
 o.fillStyle='#333';o.textAlign='left';o.font=`bold 56px ${FONT}`;o.fillText('麻辣湯チャレンジ',40,130);
 o.textAlign='right';o.font=`32px ${FONT}`;o.fillStyle='#333';const tw=o.measureText(' 250g').width;o.fillText('目標',W-40-150,130);o.fillStyle='#ad3026';o.font=`bold 64px ${FONT}`;o.fillText('250',W-40-40,130);o.font=`bold 38px ${FONT}`;o.fillText('g',W-40,130);
 o.save();rr(STAGE.x,STAGE.y,STAGE.w,STAGE.h,24);o.clip();o.drawImage(d.getElementById('game'),STAGE.x,STAGE.y,STAGE.w,STAGE.h);o.restore();
 const sp=d.getElementById('chef-speech'),text=sp.textContent,angry=sp.classList.contains('angry');
 if(text){o.font=`${angry?'bold ':''}40px ${FONT}`;o.textAlign='left';const lines=[];let line='';for(const ch of text){if(o.measureText(line+ch).width>480){lines.push(line);line=''}line+=ch}lines.push(line);const bh=lines.length*58+44;rr(50,STAGE.y+30,540,bh,28);o.fillStyle=angry?'#fff0ee':'#fffdf8';o.fill();o.lineWidth=angry?5:2;o.strokeStyle=angry?'#ad3026':'#dacdb9';o.stroke();o.fillStyle=angry?'#ad3026':'#574737';lines.forEach((l,i)=>o.fillText(l,80,STAGE.y+30+64+i*58))}
 const res=d.getElementById('result');
 if(!res.hidden){const cx=W/2,cy=STAGE.y+STAGE.h-470;rr(90,cy,W-180,420,32);o.fillStyle='#fff9edf2';o.fill();o.lineWidth=2;o.strokeStyle='#dacdb9';o.stroke();o.textAlign='center';o.fillStyle='#333';o.font=`bold 48px ${FONT}`;o.fillText(d.getElementById('result-title').textContent,cx-150,cy+120);o.fillStyle='#dacdb9';o.fillRect(cx-10,cy+60,3,80);o.fillStyle='#ad3026';o.font=`bold 110px ${FONT}`;o.fillText(d.getElementById('result-number').textContent.replace('g',''),cx+120,cy+135);o.font=`bold 50px ${FONT}`;o.fillText('g',cx+235,cy+135);o.fillStyle='#555';o.font=`34px ${FONT}`;o.fillText(d.getElementById('result-copy').textContent,cx,cy+210);rr(140,cy+260,380,100,18);o.fillStyle='#ad3026';o.fill();o.fillStyle='#fff';o.font=`bold 40px ${FONT}`;o.fillText('もう一度',330,cy+325);rr(560,cy+260,380,100,18);o.strokeStyle='#ddd';o.lineWidth=2;o.stroke();o.fillStyle='#666';o.fillText('𝕏 で投稿',750,cy+325)}
 o.textAlign='center';icons.forEach((f,i)=>{const c=cell(i),k=Math.min(150/f.image.naturalWidth,110/f.image.naturalHeight)*Math.min(1.35,f.w/80);o.drawImage(f.image,c.x-f.image.naturalWidth*k/2,c.y+60-f.image.naturalHeight*k/2,f.image.naturalWidth*k,f.image.naturalHeight*k);o.fillStyle='#333';o.font=`bold 36px ${FONT}`;o.fillText(f.label,c.x,c.y+170)});
 const weighOn=!d.getElementById('weigh').disabled;rr(24,1740,700,130,20);o.fillStyle=pressed==='weigh'?'#7d221b':weighOn?'#ad3026':'#d9a19c';o.fill();o.fillStyle='#fff';o.font=`bold 48px ${FONT}`;o.fillText('計量',374,1822);rr(750,1740,306,130,20);o.strokeStyle='#ddd';o.lineWidth=2;o.stroke();o.fillStyle='#666';o.font=`44px ${FONT}`;o.fillText('やり直す',903,1822);
 if(ghost){const f=ghost.f,s=STAGE.w/540*1.22;o.globalAlpha=.95;o.drawImage(f.image,ghost.x-f.w*s/2,ghost.y-f.h*s/2,f.w*s,f.h*s);o.globalAlpha=1}
}
function loop(){frame();requestAnimationFrame(loop)}
async function dragTo(i,cx){const f=icons[i],c=cell(i),sx=c.x,sy=c.y+60,ex=STAGE.x+cx*STAGE.w/540,ey=STAGE.y+260*STAGE.w/540,t0=performance.now(),T=420;
 ghost={f,x:sx,y:sy};while(true){const p=Math.min(1,(performance.now()-t0)/T),e=1-Math.pow(1-p,3);ghost.x=sx+(ex-sx)*e;ghost.y=sy+(ey-sy)*e-Math.sin(p*Math.PI)*120;if(p>=1)break;await sleep(16)}
 ghost=null;win.eval(`selected=${i};dropX=${cx};drop(260)`)}
async function take(plan){
 const fr=document.querySelector('iframe');fr.src='/games/malatang-250g/?rec='+Math.random();await new Promise(r=>fr.onload=r);win=fr.contentWindow;
 while(win.eval('mode')!=='play')await sleep(100);
 const foods=win.eval('foods');const F=win.eval('L.ja.foods');icons=foods.slice(0,8).map(f=>({...f,image:f.image,label:F[f.id],f}));icons.forEach(ic=>{ic.w=ic.f.w;ic.h=ic.f.h});
 win.eval(`chefSay(t('quizzes')[0])`);
 const muxer=new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),video:{codec:'avc',width:W,height:H},fastStart:'in-memory'}),enc=new VideoEncoder({output:(c,m)=>muxer.addVideoChunk(c,m),error:e=>console.error(e)});enc.configure({codec:'avc1.640028',width:W,height:H,bitrate:8e6,framerate:30});let n=0;const grab=setInterval(()=>{frame();const vf=new VideoFrame(out,{timestamp:n*1e6/30,duration:1e6/30});enc.encode(vf,{keyFrame:n%60===0});vf.close();n++},1000/30);
 await sleep(1400);
 for(const [i,x,wait] of plan){await dragTo(i,x);await sleep(wait)}
 await sleep(1500);pressed='weigh';await sleep(180);pressed=null;win.document.getElementById('weigh').click();
 await sleep(4200);clearInterval(grab);await enc.flush();muxer.finalize();
 const total=win.eval('bowlWeight()'),angry=win.eval('chefPhase');return{blob:new Blob([muxer.target.buffer],{type:'video/mp4'}),total,angry}}
window.run=async plan=>{const r=await take(plan);await fetch('/.claude/out/malatang-promo.mp4',{method:'PUT',body:r.blob});return{total:r.total,angry:r.angry,size:r.blob.size}};
try{localStorage.setItem('malatang250-lang','ja')}catch{}
loop();
</script>
<iframe></iframe>
