    // ---------- 結果画像（Xに添付） ----------
    function takeShot() {
      const W = renderer.domElement.width, H = renderer.domElement.height, dpr = W / stage.clientWidth;
      const top = VIEW_TOP * dpr, bot = H - reserve * dpr, side = Math.min(W, bot - top) * 1.0;
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const cy = (top + bot) / 2;
      c.getContext('2d').drawImage(renderer.domElement, (W - side) / 2, cy - side / 2, side, side, 0, 0, 1080, 1080);
      snap = c;
    }
    const font = s => `900 ${s}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans KR", "Noto Sans Thai", sans-serif`;
    function resultImage() {
      if (!snap) return null;
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const g = c.getContext('2d');
      g.drawImage(snap, 0, 0);
      const gr = g.createLinearGradient(0, 0, 0, 380); gr.addColorStop(0, 'rgba(30,18,10,.55)'); gr.addColorStop(1, 'rgba(30,18,10,0)'); g.fillStyle = gr; g.fillRect(0, 0, 1080, 380);
      g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.lineJoin = 'round';
      const num = t('count')(score);
      g.font = font(230); let w = g.measureText(num).width; if (w > 980) g.font = font(230 * 980 / w);
      g.lineWidth = 26; g.strokeStyle = '#3a2216'; g.strokeText(num, 540, 250); g.fillStyle = '#ffffff'; g.fillText(num, 540, 250);
      g.font = font(46); g.lineWidth = 10; g.strokeText(t('title'), 540, 1040); g.fillText(t('title'), 540, 1040);
      return c;
    }
    const shareText = () => t('share')(score);
    function renderControls() {
      controls.innerHTML = '';
      controls.classList.toggle('hide', state !== 'result');
      if (state !== 'result') return;
      const b = document.createElement('button');
      b.className = 'go'; b.textContent = t('again');
      b.addEventListener('click', reset);
      controls.append(b);
      const a = document.createElement('a');
      a.className = 'post'; a.textContent = t('post');
      a.href = `https://x.com/intent/post?text=${encodeURIComponent(shareText())}&url=${encodeURIComponent(SHARE_URL)}`;
      const coarse = matchMedia('(pointer: coarse)').matches;
      if (!coarse) { a.target = '_blank'; a.rel = 'noopener'; }
      // スマホは画像ごと共有シートへ。PCは画像を保存してから投稿画面を開く
      a.addEventListener('click', e => {
        const text = shareText();
        if (coarse && navigator.share) {
          e.preventDefault();
          const file = shareFile();
          const data = file && navigator.canShare?.({ files: [file] }) ? { files: [file], text: `${text}\n${SHARE_URL}` } : { text: `${text}\n${SHARE_URL}` };
          navigator.share(data).catch(() => {});
          return;
        }
        const img = resultImage();
        if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'sumo-sharehouse.png'; d.click(); }
      });
      controls.append(a);
    }
    function prepareShare() {
      if (!snap) return;
      const key = lang + score;
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'sumo-sharehouse.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang + score ? shareCache.file : null;

    // ---------- ループ ----------
    let last = performance.now(), acc = 0;
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      acc += dt;
      while (acc >= STEP) { step(STEP); acc -= STEP; }
      draw(acc / STEP);
      updateHumans(dt);
      // 最初の矢印: 待っている力士から部屋へ
      const waiting = rikishi.find(R => R.state === 'wait');
      hint.visible = !started && state === 'play' && !!waiting;
      if (hint.visible) {
        const k = (clock * 0.8) % 1;
        hint.position.set(WAIT.x, 0, WAIT.z);
        hint.userData.arrow.position.z = -0.7 - k * 0.4; hint.userData.arrow.material.opacity = 0.75 * Math.sin(k * Math.PI);
        hint.userData.ring.scale.setScalar(1 + 0.08 * Math.sin(clock * 5));
      }
      camera.position.copy(camBase);
      if (shake > 0) camera.position.add(V.set(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)).multiplyScalar(shake * 0.25));
      renderer.render(scene, camera);
      if (needShot) { needShot = false; takeShot(); }
      requestAnimationFrame(loop);
    }

    window.__sumo = { rikishi, camera, get state() { return state; }, get pressure() { return pressure; }, get score() { return score; }, WAIT, room: () => ({ X0, X1, Z0, Z1 }), V3: THREE.Vector3, advance: s => { for (let i = 0; i < s / STEP; i++) step(STEP); } }; // DEBUG
    reset();
    applyLang();
    prepareNext();
    renderer.compile(scene, camera);
    renderer.render(scene, camera);
    requestAnimationFrame(t0 => { last = t0; loop(t0); });
  </script>
</body>
</html>
