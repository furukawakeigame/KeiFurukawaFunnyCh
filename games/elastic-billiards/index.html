  <script type="module">
    import * as THREE from 'three';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    window.BILL_READY = true;

    const SHARE_URL = 'https://keifurukawafunnych.com/games/elastic-billiards/';
    const NAME = 'elastic-billiards';

    // ---------- 言語 ----------
    const store = {
      get(k, d) { try { const v = localStorage.getItem(NAME + ':' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
      set(k, v) { try { localStorage.setItem(NAME + ':' + k, JSON.stringify(v)); } catch {} },
    };
    const autoLang = () => { for (const l of navigator.languages?.length ? navigator.languages : [navigator.language || '']) { const c = l.toLowerCase().slice(0, 2); if (['ja', 'ko', 'en', 'th'].includes(c)) return c; } return 'en'; };
    const DICT = {
      ja: { title: '無限反発ビリアード', back: '← トップへ戻る', again: 'もう一度', post: 'Xに投稿', count: n => `${n}個`,
        share: n => `反発係数1・摩擦ゼロのビリヤードで、手球が落ちるまでに${n}個落とした #無限反発ビリアードゲーム` },
      ko: { title: '무한 반발 당구', back: '← 처음으로', again: '다시 하기', post: 'X에 게시', count: n => `${n}개`,
        share: n => `반발계수 1, 마찰 0인 당구에서 흰 공이 빠지기 전까지 ${n}개를 넣었다 #無限反発ビリアードゲーム` },
      en: { title: 'Infinite Bounce Billiards', back: '← Back to top', again: 'Play again', post: 'Post on X', count: n => `${n} ball${n === 1 ? '' : 's'}`,
        share: n => `Frictionless billiards with a restitution of 1: I sank ${n} ball${n === 1 ? '' : 's'} before the cue ball fell #無限反発ビリアードゲーム` },
      th: { title: 'บิลเลียดเด้งไม่รู้จบ', back: '← กลับหน้าแรก', again: 'เล่นอีกครั้ง', post: 'โพสต์ลง X', count: n => `${n} ลูก`,
        share: n => `บิลเลียดไร้แรงเสียดทาน สัมประสิทธิ์การคืนตัวเท่ากับ 1 ลงได้ ${n} ลูกก่อนลูกขาวตกหลุม #無限反発ビリアードゲーム` },
    };
    let lang = store.get('lang', null) || autoLang();
    const t = k => DICT[lang][k];
    const langSel = document.getElementById('lang');
    langSel.value = lang;
    langSel.addEventListener('change', () => { lang = langSel.value; store.set('lang', lang); applyLang(); });
    function applyLang() {
      document.documentElement.lang = lang;
      document.title = t('title');
      document.getElementById('back').textContent = t('back');
      renderControls();
      if (state === 'result') { showResult(); prepareShare(); }
    }

    // ---------- 音 ----------
    let soundOn = store.get('sound', true);
    const soundBtn = document.getElementById('sound');
    const drawSoundBtn = () => {
      soundBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>${soundOn ? '<path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>' : '<path d="M17 9l5 6M22 9l-5 6"/>'}</svg>`;
    };
    drawSoundBtn();
    soundBtn.addEventListener('click', () => { soundOn = !soundOn; store.set('sound', soundOn); drawSoundBtn(); });
    let ac = null, rollGain = null, rollLp = null, clickBuf = null;
    const noiseBuf = dur => { const b = ac.createBuffer(1, Math.floor(ac.sampleRate * dur), ac.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b; };
    // iPhone の消音モードでも鳴るようにする
    function unmuteIOS() {
      try { if (navigator.audioSession) { navigator.audioSession.type = 'playback'; return; } } catch {}
      try {
        const n = 4410, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
        const w = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
        w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
        v.setUint32(24, 44100, true); v.setUint32(28, 88200, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
        const a = document.createElement('audio');
        a.src = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' })); a.loop = true; a.setAttribute('playsinline', '');
        a.play().catch(() => {});
      } catch {}
    }
    function initAudio() {
      if (ac) return;
      unmuteIOS();
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        const o = ac.createOscillator(), g = ac.createGain(); g.gain.value = 0;
        o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.05);
        // 球が布の上を転がる「ゴロゴロ」: ずっと鳴らしておき、速さで音量を変える
        const s = ac.createBufferSource(); s.buffer = noiseBuf(2); s.loop = true;
        rollLp = ac.createBiquadFilter(); rollLp.type = 'lowpass'; rollLp.frequency.value = 160; rollLp.Q.value = 1.5;
        rollGain = ac.createGain(); rollGain.gain.value = 0;
        s.connect(rollLp).connect(rollGain).connect(ac.destination); s.start();
        // 「カチッ」の元になる短いノイズ
        clickBuf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.05), ac.sampleRate);
        const d = clickBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ac.sampleRate * 0.0025));
      } catch { ac = null; }
    }
    const wake = () => { initAudio(); if (ac && ac.state !== 'running') ac.resume().catch(() => {}); };
    for (const ev of ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown']) addEventListener(ev, wake, { capture: true });
    const ok = () => soundOn && ac;
    let rollVol = -1;
    function setRoll(v) {
      if (!ac) return;
      v = soundOn ? Math.min(0.35, v) : 0;
      if (Math.abs(v - rollVol) < 0.01) return;
      rollVol = v;
      rollGain.gain.setTargetAtTime(v, ac.currentTime, 0.1);
      rollLp.frequency.setTargetAtTime(120 + v * 500, ac.currentTime, 0.1);
    }
    function tone(type, f0, f1, dur, vol, delay = 0) {
      if (!ok()) return;
      const now = ac.currentTime + delay;
      const o = ac.createOscillator(); o.type = type;
      o.frequency.setValueAtTime(f0, now); o.frequency.exponentialRampToValueAtTime(f1, now + dur);
      const g = ac.createGain(); g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      o.connect(g).connect(ac.destination); o.start(now); o.stop(now + dur + 0.02);
    }
    // 樹脂の球どうしの「カチッ」: 硬くて高い共鳴をいくつか
    function clack(k) {
      if (!ok()) return;
      const now = ac.currentTime;
      const s = ac.createBufferSource(); s.buffer = clickBuf; s.playbackRate.value = 0.9 + Math.random() * 0.2;
      for (const [f, q, g0] of [[3600, 22, 1.0], [5400, 26, 0.6], [2300, 14, 0.5], [7800, 20, 0.25]]) {
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f * (0.95 + Math.random() * 0.1); bp.Q.value = q;
        const g = ac.createGain(); g.gain.value = g0 * k * 2.2; s.connect(bp).connect(g).connect(ac.destination);
      }
      s.start(now);
    }
    // クッションの「トン」: ゴムに当たる鈍い音＋台の胴鳴り
    function thud(k) {
      if (!ok()) return;
      const now = ac.currentTime;
      const s = ac.createBufferSource(); s.buffer = noiseBuf(0.08);
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700; lp.Q.value = 3;
      const g = ac.createGain(); g.gain.setValueAtTime(0.5 * k, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
      s.connect(lp).connect(g).connect(ac.destination); s.start(now);
      tone('sine', 140 + Math.random() * 20, 80, 0.14, 0.3 * k);
    }
    // ポケットに落ちる「ゴトン」＋中を転がる「ゴロゴロ」
    function pocketSnd() {
      if (!ok()) return;
      const now = ac.currentTime;
      const s = ac.createBufferSource(); s.buffer = noiseBuf(0.12);
      for (const [f, q, g0] of [[420, 6, 1], [900, 9, 0.5], [1800, 12, 0.2]]) {
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q;
        const g = ac.createGain(); g.gain.setValueAtTime(0.9 * g0, now + 0.05); g.gain.exponentialRampToValueAtTime(0.001, now + 0.17);
        s.connect(bp).connect(g).connect(ac.destination);
      }
      s.start(now + 0.05);
      tone('sine', 110, 60, 0.25, 0.4, 0.05);
      const r = ac.createBufferSource(); r.buffer = noiseBuf(0.7);
      const lp = ac.createBiquadFilter(); lp.type = 'bandpass'; lp.frequency.value = 260; lp.Q.value = 2;
      const am = ac.createGain(); am.gain.value = 0;
      const lfo = ac.createOscillator(); lfo.frequency.value = 22; const lg = ac.createGain(); lg.gain.value = 0.3; lfo.connect(lg).connect(am.gain);
      const rg = ac.createGain(); rg.gain.setValueAtTime(0.001, now + 0.15); rg.gain.linearRampToValueAtTime(0.6, now + 0.25); rg.gain.exponentialRampToValueAtTime(0.001, now + 0.85);
      r.connect(lp).connect(am).connect(rg).connect(ac.destination);
      r.start(now + 0.15); lfo.start(now + 0.15); lfo.stop(now + 0.9);
    }
    // キューで突く「コッ」
    function cueSnd(k) {
      if (!ok()) return;
      const now = ac.currentTime;
      const s = ac.createBufferSource(); s.buffer = clickBuf;
      for (const [f, q, g0] of [[1500, 10, 1], [3100, 14, 0.5]]) {
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q;
        const g = ac.createGain(); g.gain.value = g0 * (0.8 + k) * 1.6; s.connect(bp).connect(g).connect(ac.destination);
      }
      s.start(now);
      tone('triangle', 300, 150, 0.06, 0.15 * (0.5 + k));
    }
    // 声: 声帯の振動（のこぎり波＋ゆらぎ）を、母音ごとの共鳴（フォルマント）に通す
    const VOWEL = { a: [800, 1200, 2600], i: [300, 2300, 3000], u: [350, 1250, 2500], e: [500, 1900, 2600], o: [500, 850, 2500] };
    function voice(f0, seq, dur, vol, { rise = 1.3, fall = 0.7, shake = 0.04, breath = 0.15, vib = 6, delay = 0 } = {}) {
      if (!ok()) return;
      const now = ac.currentTime + delay;
      const o = ac.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(f0 * rise, now);
      o.frequency.linearRampToValueAtTime(f0 * rise * 1.08, now + dur * 0.2);
      o.frequency.exponentialRampToValueAtTime(f0 * fall, now + dur);
      const v = ac.createOscillator(); v.frequency.value = vib + Math.random() * 2;
      const vg = ac.createGain(); vg.gain.value = f0 * shake; v.connect(vg).connect(o.frequency);
      const ns = ac.createBufferSource(); ns.buffer = noiseBuf(dur);
      const ng = ac.createGain(); ng.gain.value = breath;
      const og = ac.createGain(); og.gain.value = 1 - Math.min(0.9, breath);
      const src = ac.createGain();
      o.connect(og).connect(src); ns.connect(ng).connect(src);
      const out = ac.createGain();
      out.gain.setValueAtTime(0, now);
      out.gain.linearRampToValueAtTime(vol, now + Math.min(0.04, dur * 0.2));
      out.gain.setValueAtTime(vol, now + dur * 0.5);

      [1, 0.6, 0.25].forEach((amp, fi) => {
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = fi === 0 ? 6 : 9;
        seq.forEach((s, si) => { const tt = now + dur * si / Math.max(1, seq.length - 1) * 0.8; bp.frequency[si ? 'linearRampToValueAtTime' : 'setValueAtTime'](VOWEL[s][fi], tt); });
        const g = ac.createGain(); g.gain.value = amp * 3;
        src.connect(bp).connect(g).connect(out);
      });
      out.connect(ac.destination);
      o.start(now); v.start(now); ns.start(now);
      o.stop(now + dur); v.stop(now + dur); ns.stop(now + dur);
    }
    const pick = a => a[Math.floor(Math.random() * a.length)];
    // 猫（8番）の声: 落ちると「ニャーッ」、強く当たると「ニャッ」
    function meow(big) {
      const f0 = 520 + Math.random() * 120;
      if (big) voice(f0, pick([['i', 'a', 'a', 'o'], ['e', 'a', 'o', 'u'], ['i', 'a', 'u']]), 0.6 + Math.random() * 0.25, 0.4, { rise: 1.25, fall: 0.6, shake: 0.05, breath: 0.2, vib: 7 });
      else voice(f0 * 1.15, pick([['i', 'a'], ['e', 'a'], ['i', 'a', 'u']]), 0.2 + Math.random() * 0.08, 0.32, { rise: 1.1, fall: 0.8, breath: 0.25 });
    }

    // ---------- 3D ----------
    const stage = document.getElementById('stage');
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(2, devicePixelRatio));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    stage.prepend(renderer.domElement);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 40);
    const fitCam = new THREE.PerspectiveCamera(40, 1, 0.05, 40);
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    // 背景: 薄暗いビリヤード場（天井の暗がりから床の明るさへ）
    {
      const c = document.createElement('canvas'); c.width = 4; c.height = 256;
      const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
      gr.addColorStop(0, '#0e0a08'); gr.addColorStop(0.6, '#2a1d16'); gr.addColorStop(1, '#3d2a1e');
      g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
      const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
      scene.background = tex;
    }
    scene.fog = new THREE.Fog('#23180f', 3.5, 9);

    const hemi = new THREE.HemisphereLight('#bcd6ff', '#5a4030', 0.75);
    scene.add(hemi);
    const lamp = new THREE.DirectionalLight('#ffe2b8', 2.6);
    lamp.position.set(0.5, 3.2, 0.7);
    lamp.castShadow = true;
    lamp.shadow.mapSize.set(1024, 1024);
    Object.assign(lamp.shadow.camera, { left: -1.7, right: 1.7, top: 1.7, bottom: -1.7, near: 0.5, far: 6 });
    lamp.shadow.bias = -0.0004; lamp.shadow.normalBias = 0.01;
    scene.add(lamp, lamp.target);

    function canvasTex(w, h, draw, repeat) {
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      draw(c.getContext('2d'), w, h);
      const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      if (repeat) { tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(...repeat); }
      return tex;

          const d = Math.sqrt(d2), nx = dx / d, nz = dz / d;
          const vr = (a.vx - b.vx) * nx + (a.vz - b.vz) * nz;
          if (vr < 0) {
            // 同じ重さの完全弾性衝突: 法線方向の速さを入れ替える（運動エネルギーはそのまま）
            a.vx -= vr * nx; a.vz -= vr * nz; b.vx += vr * nx; b.vz += vr * nz;
            if (-vr > pend.ball) { pend.ball = -vr; pend.bx = (a.x + b.x) / 2; pend.bz = (a.z + b.z) / 2; }
            if (-vr > 0.25) burst((a.x + b.x) / 2, R, (a.z + b.z) / 2, Math.min(14, 2 + (-vr) * 4), 0.3 + (-vr) * 0.25, '#fff3c8');
            if ((a.n === 8 || b.n === 8) && -vr > 1.2 && clock - lastCat > 1.5) { lastCat = clock; meow(false); }
          }
          const o = (D - d) / 2;
          a.x += nx * o; a.z += nz * o; b.x -= nx * o; b.z -= nz * o;
        }
      }
    }
    function cush(v, b) { if (v > pend.cush) pend.cush = v; if (v > 0.6) burst(b.x, R, b.z, Math.min(8, v * 3), 0.2, '#d8ffe0', 0.3, 0.3); }
    function fall(b, p) {
      b.st = 'fall'; b.ft = 0; b.sx = b.x; b.sz = b.z; b.pk = p;
      pocketSnd();
      if (b.n === 8) meow(true);
      if (b === cue) { capture = false; state = 'ending'; endT = 0; }
      else { b.slot = potted.length; potted.push(b); score = potted.length; if (score === 15) { capture = false; state = 'ending'; endT = 0; } }
    }
    const _q = new THREE.Quaternion(), _ax = new THREE.Vector3();
    function step(dt) {
      clock += dt;
      for (const b of balls) { b.px = b.x; b.pz = b.z; }
      if (state === 'run' || state === 'ending' || state === 'result') {
        for (let k = 0; k < SUB; k++) physStep(dt / SUB);
      }
      if (state === 'stroke') {
        stroke.t += dt;
        if (stroke.t >= 0.07) strike();
      }
      if (state === 'ending') { endT += dt; if (endT > 1.0) finish(); }
      // 転がる向きに回す／落ちる・トレーへ転がる
      for (const b of balls) {
        if (b.st === 'on') {
          const sp = Math.hypot(b.vx, b.vz);
          if (sp > 1e-6) { _ax.set(b.vz, 0, -b.vx).divideScalar(sp); _q.setFromAxisAngle(_ax, sp * dt / R); b.q.premultiply(_q); }
        } else if (b.st === 'fall') {
          b.ft += dt;
          const k = Math.min(1, b.ft / 0.12);
          b.x = b.sx + (b.pk.vx - b.sx) * k; b.z = b.sz + (b.pk.vz - b.sz) * k;
          b.y = R - Math.max(0, b.ft - 0.05) ** 2 * 6;
          if (b.ft > 0.3) {
            if (b === cue) { b.st = 'gone'; b.mesh.visible = false; }
            else { b.st = 'tray'; b.ft = 0; b.px = b.x = TRAY_X0 + b.slot * SLOT + 0.4; b.pz = b.z = TRAY_Z; b.y = TRAY_Y + R; }
          }
        } else if (b.st === 'tray') {
          b.ft += dt;
          const tx = TRAY_X0 + b.slot * SLOT, k = 1 - Math.exp(-6 * b.ft);
          const nx = tx + 0.4 * (1 - k), d = nx - b.x;
          b.x = nx; b.z = TRAY_Z; b.y = TRAY_Y + R;
          if (Math.abs(d) > 1e-6) { _ax.set(0, 0, -1); _q.setFromAxisAngle(_ax, d / R); b.q.premultiply(_q); }
        }
      }
      stepFx(dt);
    }
    function strike() {
      const v = 0.5 + stroke.p * 3.5;
      cue.vx = aim.dx * v; cue.vz = aim.dz * v;
      state = 'run'; shotOnce = true;
      cueSnd(stroke.p);
      burst(cue.x - aim.dx * R, R, cue.z - aim.dz * R, 14, 0.25, '#5aa0ff', 0.15, 0.5);
      updateHints();
    }
    // 狙いの線: 最初に当たる球かクッションまで
    function rayHit(ox, oz, dx, dz) {
      let tm = Infinity, hitB = null;
      const XL = L / 2 - R, ZL = W / 2 - R;
      if (dx > 1e-9) tm = Math.min(tm, (XL - ox) / dx); else if (dx < -1e-9) tm = Math.min(tm, (-XL - ox) / dx);
      if (dz > 1e-9) tm = Math.min(tm, (ZL - oz) / dz); else if (dz < -1e-9) tm = Math.min(tm, (-ZL - oz) / dz);
      for (const b of balls) {
        if (b === cue || b.st !== 'on') continue;
        const fx_ = b.x - ox, fz = b.z - oz, tc = fx_ * dx + fz * dz;
        if (tc <= 0) continue;
        const d2 = fx_ * fx_ + fz * fz - tc * tc, rr = 4 * R * R;
        if (d2 > rr) continue;
        const th = tc - Math.sqrt(rr - d2);
        if (th < tm) { tm = th; hitB = b; }
      }
      return { t: Math.max(0, tm), b: hitB };
    }

    // ---------- 入力 ----------
    const canvas = renderer.domElement;
    const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -R), _hit = new THREE.Vector3();
    function toTable(e) {
      const r = canvas.getBoundingClientRect();
      ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
      ray.setFromCamera(ndc, camera);
      return ray.ray.intersectPlane(plane, _hit) ? _hit.clone() : null;
    }
    let dragId = null, drag0 = null, dragPx = { x: 0, y: 0 };
    const minDim = () => Math.min(stage.clientWidth, stage.clientHeight);
    canvas.addEventListener('pointerdown', e => {
      e.preventDefault();
      if (dragId !== null || state !== 'ready') return;
      const p = toTable(e); if (!p) return;
      dragId = e.pointerId; canvas.setPointerCapture?.(e.pointerId);
      drag0 = p; dragPx = { x: e.clientX, y: e.clientY };
      state = 'aim'; aim.p = 0; updateHints();
    });
    canvas.addEventListener('pointermove', e => {
      if (e.pointerId !== dragId || state !== 'aim') return;
      const p = toTable(e); if (!p) return;
      const dx = drag0.x - p.x, dz = drag0.z - p.z, len = Math.hypot(dx, dz);
      const px = Math.hypot(e.clientX - dragPx.x, e.clientY - dragPx.y);
      if (len > 1e-4 && px > 4) { aim.dx = dx / len; aim.dz = dz / len; }
      aim.p = THREE.MathUtils.clamp(px / (0.38 * minDim()), 0, 1);
    });
    const endDrag = e => {
      if (e.pointerId !== dragId) return;
      dragId = null;
      if (state !== 'aim') return;
      if (aim.p > 0.05) { state = 'stroke'; stroke = { t: 0, g0: cueGap, p: aim.p }; }
      else { state = 'ready'; updateHints(); }
    };
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);

    // ---------- 画面サイズとカメラ ----------
    const controls = document.getElementById('controls');
    const resultEl = document.getElementById('result');
    const sideMQ = matchMedia('(max-height: 520px) and (min-aspect-ratio: 4/3)');
    let view = { w: 1, H: 1, L: 0, T: 50, uw: 1, uh: 1 };
    function resize() {
      const w = stage.clientWidth, Hh = stage.clientHeight;
      renderer.setSize(w, Hh, false);
      const side = sideMQ.matches;
      // ボタンが出るのは結果の時だけ。横に並べる時は台の下を空けなくてよい
      const btnH = state === 'result' && !side ? Math.min(72, Math.max(56, 0.08 * Math.min(innerWidth, innerHeight))) + 12 : 8;
      const reserve = Math.max(0, stage.getBoundingClientRect().bottom - controls.getBoundingClientRect().bottom) + btnH;
      stage.style.setProperty('--reserve', reserve + 'px');
      let Lf = 0, T = side ? 50 : 66, uw = w, uh = Math.max(120, Hh - reserve - T);
      if (state === 'result') {
        if (side) { Lf = w * 0.32; uw = w - Lf; }
        else { const ph = resultEl.offsetHeight + 12; T += ph - 14; uh = Math.max(120, uh - ph + 14); }
      }
      view = { w, H: Hh, L: Lf, T, uw, uh };
      camera.aspect = fitCam.aspect = uw / uh;
      camera.setViewOffset(uw, uh, -Lf, -T, w, Hh);
      fitCam.updateProjectionMatrix();
    }
    addEventListener('resize', () => { resize(); snapCam = true; });
    const camPos = new THREE.Vector3(0, 3, 2), camLook = new THREE.Vector3();
    const desPos = new THREE.Vector3(), desLook = new THREE.Vector3(), tmpV = new THREE.Vector3();
    let snapCam = true;
    const keys = [];
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) keys.push(new THREE.Vector3(sx * OL / 2, RAIL_H, sz * OW / 2));
    for (const sx of [-1, 1]) keys.push(new THREE.Vector3(sx * 0.54, TRAY_Y, TRAY_Z + 0.05));
    function fit(look, dir) {
      let lo = 0.5, hi = 20;
      for (let k = 0; k < 22; k++) {
        const d = (lo + hi) / 2;
        fitCam.position.copy(look).addScaledVector(dir, d); fitCam.lookAt(look); fitCam.updateMatrixWorld();
        const fits = keys.every(p => { const q = tmpV.copy(p).project(fitCam); return q.z < 1 && Math.abs(q.x) < 0.96 && Math.abs(q.y) < 0.96; });
        if (fits) hi = d; else lo = d;
      }
      desLook.copy(look); desPos.copy(look).addScaledVector(dir, hi);
    }
    // 横長の画面は手前から、縦長の画面は手球の側から（台を縦に置いて）見る
    const dirWide = new THREE.Vector3(0, 1.7, 1).normalize(), dirTall = new THREE.Vector3(-1, 2.6, 0).normalize();
    const fitUp = new THREE.Vector3();
    function updateCamera(dt) {
      const tall = view.uw / view.uh < 1.05;
      const dir = tall ? dirTall : dirWide;
      fit(new THREE.Vector3(0, 0, tall ? 0.03 : 0.04), dir);
      const k = snapCam ? 1 : 1 - Math.exp(-3 * dt);
      snapCam = false;
      camPos.lerp(desPos, k); camLook.lerp(desLook, k);
      camera.position.copy(camPos); camera.lookAt(camLook);
      camera.updateMatrixWorld();
    }

    // ---------- 画面 ----------
    const hintEl = document.getElementById('hint');
    function updateHints() { hintEl.style.display = state === 'ready' && !shotOnce ? 'block' : 'none'; }
    let hintKey = '';
    function placeHint() {
      if (hintEl.style.display === 'none') return;
      // 手球から、狙いと反対の向き（手前）へ引く手
      const a = tmpV.set(cue.x, R, cue.z).project(camera);
      const ax = (a.x + 1) / 2 * view.w, ay = (1 - a.y) / 2 * view.H;
      const b = tmpV.set(cue.x - 0.3, R, cue.z).project(camera);
      const bx = (b.x + 1) / 2 * view.w, by = (1 - b.y) / 2 * view.H;
      const ang = Math.atan2(by - ay, bx - ax) * 180 / Math.PI - 90;
      const w = hintEl.offsetWidth;
      const key = `${Math.round(ax)},${Math.round(ay)},${Math.round(ang)},${w}`;
      if (key === hintKey) return;
      hintKey = key;
      hintEl.style.transform = `translate(${ax - w / 2}px, ${ay - w * 8 / 60}px) rotate(${ang}deg)`;
      hintEl.style.transformOrigin = `50% ${w * 8 / 60}px`;
    }
    // 打ったあとは、いつでもやり直せる
    const retryBtn = document.getElementById('retry');
    retryBtn.addEventListener('click', () => start());
    let retryShown = false;
    function updateRetry() {
      const show = state === 'run' || state === 'ending';
      if (show !== retryShown) { retryShown = show; retryBtn.hidden = !show; }
    }
    function renderControls() {
      controls.innerHTML = '';
      controls.classList.toggle('hide', state !== 'result');
      if (state !== 'result') return;
      const b = document.createElement('button');
      b.className = 'go'; b.textContent = t('again');
      b.addEventListener('click', start);
      controls.append(b);
      const a = document.createElement('a');
      a.className = 'post'; a.textContent = t('post');
      a.href = `https://x.com/intent/post?text=${encodeURIComponent(t('share')(score))}&url=${encodeURIComponent(SHARE_URL)}`;
      const coarse = matchMedia('(pointer: coarse)').matches;
      if (!coarse) { a.target = '_blank'; a.rel = 'noopener'; }
      // スマホは画像ごと共有シートへ。PCは画像を保存してから投稿画面を開く
      a.addEventListener('click', e => {
        const text = t('share')(score);
        if (coarse && navigator.share) {
          e.preventDefault();
          const file = shareFile();
          const data = file && navigator.canShare?.({ files: [file] }) ? { files: [file], text: `${text}\n${SHARE_URL}` } : { text: `${text}\n${SHARE_URL}` };
          navigator.share(data).catch(() => {});
          return;
        }
        const img = resultImage();
        if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = NAME + '.png'; d.click(); }
      });
      controls.append(a);
    }
    // 結果画像: 台をまるごと切り抜き、落とした数を重ねる
    let snap = null, shareCache = null, needSnap = false;
    function takeSnap() {
      const src = renderer.domElement;
      let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
      for (const k of keys) {
        const q = tmpV.copy(k).project(camera), px = (q.x + 1) / 2 * src.width, py = (1 - q.y) / 2 * src.height;
        x0 = Math.min(x0, px); x1 = Math.max(x1, px); y0 = Math.min(y0, py); y1 = Math.max(y1, py);
      }
      const side = Math.max(x1 - x0, y1 - y0) * 1.12;
      const sx = (x0 + x1) / 2 - side / 2, sy = (y0 + y1) / 2 - side * 0.5;
      snap = document.createElement('canvas'); snap.width = snap.height = 1080;
      const g = snap.getContext('2d'), k = 1080 / side;
      g.fillStyle = '#2a1d16'; g.fillRect(0, 0, 1080, 1080);
      const ax = Math.max(0, sx), ay = Math.max(0, sy), bx = Math.min(src.width, sx + side), by = Math.min(src.height, sy + side);
      if (bx > ax && by > ay) g.drawImage(src, ax, ay, bx - ax, by - ay, (ax - sx) * k, (ay - sy) * k, (bx - ax) * k, (by - ay) * k);
      shareCache = null;
    }
    function resultImage() {
      if (!snap) return null;
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const g = c.getContext('2d');
      g.drawImage(snap, 0, 0);
      const sh = g.createLinearGradient(0, 760, 0, 1080); sh.addColorStop(0, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(0,0,0,.55)');
      g.fillStyle = sh; g.fillRect(0, 760, 1080, 320);
      const sh2 = g.createLinearGradient(0, 0, 0, 180); sh2.addColorStop(0, 'rgba(0,0,0,.5)'); sh2.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = sh2; g.fillRect(0, 0, 1080, 180);
      g.textAlign = 'center'; g.fillStyle = '#fff'; g.lineJoin = 'round';
      const font = px => `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans Thai", sans-serif`;
      const text = (str, y, px, max) => {
        g.font = font(px);
        const w = g.measureText(str).width; if (w > max) { px *= max / w; g.font = font(px); }
        g.lineWidth = px * .16; g.strokeStyle = '#6b3c1e'; g.strokeText(str, 540, y); g.fillText(str, 540, y);
      };
      text(t('count')(score), 1030, 160, 960);
      text(t('title'), 88, 60, 900);
      return c;
    }
    function prepareShare() {
      if (!snap) return;
      const key = lang;
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], NAME + '.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;
    function showResult() {
      resultEl.querySelector('b').textContent = t('count')(score);
    }
    let resultStart = 0;
    function start() {
      rack();
      state = 'ready'; capture = true; score = 0; potted = [];
      aim = { dx: 1, dz: 0, p: 0 }; cueGap = 0.03; cueShow = 1;
      snap = null; shareCache = null;
      resultEl.style.display = 'none';
      renderControls(); resize(); updateHints();
    }
    function finish() {
      state = 'result';
      resultStart = clock;
      resultEl.style.display = 'flex';
      renderControls(); resize(); updateHints();
      requestAnimationFrame(showResult);
    }

    // ---------- ループ ----------
    let last = performance.now(), acc = 0;
    function render(alpha, dt) {
      for (const b of balls) {
        b.mesh.position.set(b.px + (b.x - b.px) * alpha, b.y, b.pz + (b.z - b.pz) * alpha);
        b.mesh.quaternion.copy(b.q);
      }
      // キュー
      const aiming = state === 'ready' || state === 'aim';
      if (aiming) {
        const tg = state === 'aim' ? 0.03 + aim.p * 0.26 : 0.03 + 0.008 * Math.sin(clock * 3);
        cueGap += (tg - cueGap) * (1 - Math.exp(-25 * dt));

      } else if (state === 'stroke') {
        cueGap = stroke.g0 * Math.max(0, 1 - stroke.t / 0.07) ** 1.5;
      } else {
        cueGap += (0.35 - cueGap) * (1 - Math.exp(-4 * dt));

      }

      if (cueStick.visible) { poseCue(aim.dx, aim.dz, cueGap); cueStick.position.y += (1 - cueShow) * 0.15; }
      // 狙いの線
      const showGuide = aiming && cue.st === 'on';
      guide.visible = guide2.visible = ghost.visible = false;
      if (showGuide) {
        const h = rayHit(cue.x, cue.z, aim.dx, aim.dz);
        guide.visible = ghost.visible = true;
        guide.position.set(cue.x, 0.0015, cue.z); guide.rotation.y = Math.atan2(aim.dx, aim.dz); guide.scale.z = Math.max(0.001, h.t);
        const gx = cue.x + aim.dx * h.t, gz = cue.z + aim.dz * h.t;
        ghost.position.set(gx, 0.0016, gz);
        if (h.b) {
          const nx = h.b.x - gx, nz = h.b.z - gz, nl = Math.hypot(nx, nz) || 1;
          guide2.visible = true; guide2.position.set(h.b.x, 0.0015, h.b.z); guide2.rotation.y = Math.atan2(nx / nl, nz / nl); guide2.scale.z = 0.12 + aim.p * 0.25;
        }
      }
      updateCamera(dt);
      placeHint();
      updateRetry();
      // 音: 1コマに1回だけ、いちばん強い当たりを鳴らす
      if (pend.ball > 0.03) clack(Math.min(1, 0.12 + pend.ball / 2.5));
      if (pend.cush > 0.05) thud(Math.min(1, 0.15 + pend.cush / 3));
      pend.ball = pend.cush = 0;
      let v = 0; for (const b of balls) if (b.st === 'on') v += Math.hypot(b.vx, b.vz);
      setRoll(state === 'ready' || state === 'aim' ? 0 : Math.min(1, v / 12) * 0.3);
      renderer.render(scene, camera);
      if (state === 'result' && !snap && clock - resultStart > 0.15) needSnap = true;
      if (needSnap) { needSnap = false; takeSnap(); prepareShare(); }
    }
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      acc += dt;
      while (acc >= STEP) { step(STEP); acc -= STEP; }
      render(acc / STEP, dt);
      requestAnimationFrame(loop);
    }

    window.__bill = {
      balls, get state() { return state; }, get score() { return score; }, camera, renderer,
      shoot: (dx, dz, p) => { const l = Math.hypot(dx, dz); aim.dx = dx / l; aim.dz = dz / l; aim.p = p; state = 'stroke'; stroke = { t: 0, g0: cueGap, p }; },
      ff: sec => { for (let i = 0; i < sec / STEP; i++) step(STEP); },
      // アイコン用: 猫の8番を大きく写す
      iconShot: () => {
        state = 'icon';
        const set = (n, x, z, yaw) => { const b = balls[n]; b.st = 'on'; b.x = b.px = x; b.z = b.pz = z; b.y = R; b.mesh.visible = true; b.q.setFromEuler(new THREE.Euler(-Math.PI / 2 + 0.3, 0, yaw)); };
        balls.forEach(b => { b.mesh.visible = false; });
        const c8 = balls[8]; c8.st = 'on'; c8.x = c8.px = 0; c8.z = c8.pz = 0; c8.y = R; c8.mesh.visible = true;
        c8.q.setFromEuler(new THREE.Euler(-0.55, 0, 0));
        set(0, -0.045, -0.075, 0); set(3, 0.07, -0.05, 0.4); set(11, -0.085, 0.02, -0.5); set(1, 0.03, -0.13, 0.2); set(9, 0.11, 0.035, 1.2);
        cueStick.visible = guide.visible = guide2.visible = ghost.visible = false;
        for (const b of balls) { b.mesh.position.set(b.x, b.y, b.z); b.mesh.quaternion.copy(b.q); }
        const cam = new THREE.PerspectiveCamera(30, 1, 0.01, 20);
        cam.position.set(0, 0.11, 0.18); cam.lookAt(0, R * 0.9, -0.01);
        renderer.setPixelRatio(1); renderer.setSize(512, 512, false);
        renderer.render(scene, cam);
        return renderer.domElement.toDataURL('image/png');
      },
      energy: () => balls.filter(b => b.st === 'on').reduce((s, b) => s + b.vx * b.vx + b.vz * b.vz, 0),
      shareImage: () => resultImage()?.toDataURL('image/png'),
    };
    resize();
    start();
    applyLang();
    for (let i = 0; i < 4; i++) step(STEP);
    renderer.compile(scene, camera); render(0, 0.016);
    requestAnimationFrame(t0 => { last = t0; loop(t0); });
  </script>
