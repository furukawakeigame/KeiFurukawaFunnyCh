    let last = performance.now();
    const tmpQ = new THREE.Quaternion(), tmpV = new THREE.Vector3();
    function tick(ts) {
      const dt = Math.min(0.05, (ts - last) / 1000); last = ts; clockT += dt;
      const T0 = clockT;
      // 箱が空から落ちてくる
      if (intro) {
        const k = Math.max(0, (T0 - intro.t0) / 0.42);
        if (k < 1) block.position.y = intro.from + (intro.to - intro.from) * (k * k);
        else {
          if (!intro.landed) { intro.landed = true; intro.t1 = T0; knock(1.1, 0.8); burst(block.position.x, block.position.z, 8, [5, 6], 1.2); }
          const b = (T0 - intro.t1) / 0.22;
          block.position.y = intro.to + Math.sin(Math.min(1, b) * Math.PI) * 0.12 * (1 - Math.min(1, b));
          if (b >= 1) { block.position.y = intro.to; intro = null; if (queued.length) tryMove(queued.shift()); }
        }
      }
      // 転がる
      if (anim) {
        const k = Math.min(1, (T0 - anim.t0) / anim.dur);
        const ang = anim.blocked ? 0.2 * Math.sin(Math.PI * k) : Math.PI / 2 * easeIO(k);
        tmpQ.setFromAxisAngle(anim.axis, ang);
        tmpV.copy(anim.c0).sub(anim.P).applyQuaternion(tmpQ).add(anim.P);
        block.position.copy(tmpV);
        block.quaternion.copy(tmpQ).multiply(anim.q0);
        if (k >= 1) {
          const a = anim; anim = null;
          if (a.blocked) { block.position.copy(a.c0); block.quaternion.copy(a.q0); }
          else { block.quaternion.copy(snapQuat(block.quaternion)); block.position.copy(blockCenter(a.target)); }
          a.onLand?.();
          if (queued.length && mode === 'play') tryMove(queued.shift());
        }
      }
      // クリアで箱が跳ねる
      if (block.userData.jump !== undefined && !anim) {
        const k = (T0 - block.userData.jump) / 0.5;
        if (k < 1) block.position.y = blockCenter(st).y + Math.sin(k * Math.PI) * 0.6;
        else { block.position.y = blockCenter(st).y; block.userData.jump = undefined; }
      }
      // 床がせり上がる・花が咲く・揺れる
      for (const tl of tiles) {
        if (tl.rise) {
          const k = (T0 - tl.rise.t0) / 0.5;
          if (k >= 1) { tl.g.position.y = 0; tl.rise = null; }
          else tl.g.position.y = k <= 0 ? -6 : -6 * (1 - easeOutBack(k)) ;
        }
        if (tl.pop !== undefined) {
          const k = (T0 - tl.pop) / 0.35;
          if (k >= 1) { tl.top.scale.set(1, 1, 1); tl.pop = undefined; }
          else { const s = 1 + Math.sin(k * Math.PI) * 0.08 * (1 - k); tl.top.scale.set(s, 1 - (s - 1) * 1.5, s); }
        }
        for (const f of tl.fl) {
          const u = f.userData;
          if (u.t0 >= 0) {
            const k = (T0 - u.t0) / (u.to ? 0.42 : 0.22);
            if (k >= 0) {
              const e = k >= 1 ? 1 : (u.to ? easeOutBack(k) : k);
              const s = Math.max(0.0001, (u.from + (u.to - u.from) * e) * u.big);
              f.scale.setScalar(s);
              if (k >= 1) { u.t0 = -1; if (!u.to) f.visible = false; }
            }
          }
          if (f.visible) f.rotation.z = Math.sin(T0 * 2 + u.ph) * 0.08;
        }
      }
      // 前のステージの盤面は下へ落として消す
      for (let i = oldBoards.length - 1; i >= 0; i--) {
        const o = oldBoards[i], k = (T0 - o.t0) / 0.6;
        o.g.position.y = -12 * k * k;
        if (k >= 1) { scene.remove(o.g); oldBoards.splice(i, 1); }
      }
      // ヒントの影
      if (ghost.visible) ghost.material.opacity = 0.25 + 0.2 * Math.sin((T0 - hintT) * 6);
      // 粒
      for (const p of parts) {
        if (!p.visible) continue;
        const u = p.userData; u.life += dt;
        u.vy -= 6 * dt; p.position.x += u.vx * dt; p.position.y += u.vy * dt; p.position.z += u.vz * dt;
        p.material.opacity = 1;
        if (u.life > u.max || p.position.y < -2) p.visible = false;
        else p.scale.multiplyScalar(u.life > u.max * 0.6 ? 0.96 : 1);
      }
      for (const c of clouds) { c.position.x += c.userData.v * dt; if (c.position.x > 30) c.position.x = -30; }
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }

    // ---------- 開始 ----------
    applyLang();
    let startAt = store.get('cur', 0);
    if (!(startAt >= 0 && startAt < LEVELS.length) || !unlocked(startAt)) startAt = 0;
    loadLevel(startAt, true);
    renderer.compile(scene, camera);
    renderer.render(scene, camera);
    requestAnimationFrame(t0 => { last = t0; tick(t0); });
  </script>
</body>
</html>
