// 透明部分に周りの色をにじませる（ふちの継ぎ目が黒くならないように）

      const c = restN[i * 3] * ln.x + restN[i * 3 + 1] * ln.y + restN[i * 3 + 2] * ln.z;
      const u = Math.min(1, Math.max(0, (c + 0.2) / 1.0)); sp[i] = u * u * (3 - 2 * u);
    }
    grab = { id: e.pointerId, plane, start: hit.point.clone(), w, sp, R, thick: Math.abs(hz) * 2, base: Float32Array.from(disp), press: 0, moved: 0, ln, sx: e.clientX, sy: e.clientY, cur: hit.point.clone() };
    puni(520, 260, 0.1);
  } else {
    rotating = { id: e.pointerId, x: e.clientX, y: e.clientY };
  }
});
cv.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pointers.size >= 2) {
    const [a, b] = [...pointers.values()];
    zoom = Math.min(2.5, Math.max(0.5, pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d));
    return;
  }
  if (grab && grab.id === e.pointerId) {
    const v = planePoint(e, grab.plane); if (v) grab.cur = v;
    grab.moved = Math.max(grab.moved, Math.hypot(e.clientX - grab.sx, e.clientY - grab.sy));
  } else if (rotating && rotating.id === e.pointerId) {
    const dx = e.clientX - rotating.x, dy = e.clientY - rotating.y;
    rotY += dx * 0.01; rotX += dy * 0.01; rvY = dx * 0.01; rvX = dy * 0.01;
    rotX = Math.max(-1.4, Math.min(1.4, rotX));
    rotating.x = e.clientX; rotating.y = e.clientY;
  }
});
function release() {
  if (!grab) return;
  // 離した瞬間の勢いを少しだけ付ける
  puni(300, 620, 0.14, 0.2);
  grab = null;
}
function up(e) {
  pointers.delete(e.pointerId);
  if (grab && grab.id === e.pointerId) release();
  if (rotating && rotating.id === e.pointerId) rotating = null;
  if (pointers.size < 2) pinch = null;
}
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('wheel', e => { e.preventDefault(); zoom = Math.min(2.5, Math.max(0.5, zoom * Math.exp(-e.deltaY * 0.001))); }, { passive: false });

// ---- 物理 ----
const inv = new THREE.Matrix4();
function step(dt) {
  if (!geo) return;
  const p = geo.attributes.position, N = p.count;
  if (grab) {
    // ドラッグ量（ローカル座標）
    inv.copy(mesh.matrixWorld).invert();
    const a = grab.start.clone().applyMatrix4(inv), b = grab.cur.clone().applyMatrix4(inv);
    const d = b.sub(a);
    // 引っ張りすぎて面が折り返さないよう、なめらかに頭打ちにする
    const len = d.length(), max = grab.R * 1.05;
    if (len > 1e-6) d.multiplyScalar(max * Math.tanh(len / max) / len);
    if (grab.moved < 8) grab.press = Math.min(1, grab.press + dt * 1.5);
    else grab.press = Math.max(0, grab.press - dt * 3);
    const pd = grab.press * Math.min(grab.R * 0.8, grab.thick * 0.7 + 0.05);
    const k = Math.min(1, dt * 18);
    for (let i = 0; i < N; i++) {
      const w = grab.w[i]; if (w < 0.002) continue;
      const j = i * 3, pw = pd * w * grab.sp[i];
      const tx = grab.base[j] + d.x * w - grab.ln.x * pw;
      const ty = grab.base[j + 1] + d.y * w - grab.ln.y * pw;
      const tz = grab.base[j + 2] + d.z * w - grab.ln.z * pw;
      vel[j] = (tx - disp[j]) * k / dt; vel[j + 1] = (ty - disp[j + 1]) * k / dt; vel[j + 2] = (tz - disp[j + 2]) * k / dt;
    }
  }
  // となりの頂点とならす（しわ・とがりを防ぐ）
  const a = 0.12;
  for (let i = 0; i < N; i++) {
    if (grab && grab.w[i] >= 0.002) continue;
    const s0 = nbStart[i], s1 = nbStart[i + 1]; if (s1 === s0) continue;
    let ax = 0, ay = 0, az = 0;
    for (let k = s0; k < s1; k++) { const j = nbList[k] * 3; ax += disp[j]; ay += disp[j + 1]; az += disp[j + 2]; }
    const n = s1 - s0, j = i * 3;
    disp[j] += (ax / n - disp[j]) * a; disp[j + 1] += (ay / n - disp[j + 1]) * a; disp[j + 2] += (az / n - disp[j + 2]) * a;
  }
  // ゆっくり戻るばね（つかんでいない頂点）
  const K = 5, C = 3.2;
  for (let i = 0; i < N; i++) {
    const j = i * 3;
    if (grab && grab.w[i] >= 0.002) {
      disp[j] += vel[j] * dt; disp[j + 1] += vel[j + 1] * dt; disp[j + 2] += vel[j + 2] * dt;
    } else {
      for (let c = 0; c < 3; c++) {
        vel[j + c] += (-K * disp[j + c] - C * vel[j + c]) * dt;
        disp[j + c] += vel[j + c] * dt;
      }
    }
    p.array[j] = rest[j] + disp[j]; p.array[j + 1] = rest[j + 1] + disp[j + 1]; p.array[j + 2] = rest[j + 2] + disp[j + 2];
  }
  p.needsUpdate = true;
  geo.computeVertexNormals();
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (!rotating) { rotY += rvY; rotX += rvX; rvY *= 0.92; rvX *= 0.92; rotX = Math.max(-1.4, Math.min(1.4, rotX)); }
  group.rotation.set(rotX, rotY, 0);
  group.updateMatrixWorld();
  const dist = baseDist / zoom;
  camera.position.set(0, 0, dist); camera.lookAt(0, 0, 0);
  for (let s = 0; s < 2; s++) step(dt / 2);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

// ---- 画像 ----
function loadDataURL(url) {
  return new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = url; });
}
async function setImage(img) { build(img); resize(); }
// ---- 切り抜き（指でなぞった所だけ残す） ----
const cc = $('cropcv'), cx2 = cc.getContext('2d');
let src = null, mask = null, mctx = null, tmpC = null, view = null, CW = 300, CH = 300;
let brushIdx = 1, erasing = false, undoStack = [];
const BRUSH = [8, 22, 50];
$('pick').onclick = () => { $('file').value = ''; $('file').click(); };
$('file').onchange = async () => {
  const f = $('file').files[0]; if (!f) return;
  const url = URL.createObjectURL(f);
  const im = await loadDataURL(url); URL.revokeObjectURL(url);
  if (!im) return;
  const k = Math.min(1, 1600 / Math.max(im.width, im.height));
  src = document.createElement('canvas');
  src.width = Math.max(1, Math.round(im.width * k)); src.height = Math.max(1, Math.round(im.height * k));
  src.getContext('2d').drawImage(im, 0, 0, src.width, src.height);
  mask = document.createElement('canvas'); mask.width = src.width; mask.height = src.height;
  mctx = mask.getContext('2d', { willReadFrequently: true });
  tmpC = document.createElement('canvas'); tmpC.width = src.width; tmpC.height = src.height;
  undoStack = []; erasing = false; cptrs.clear(); cpinch = null;
  $('crop').classList.add('on');
  CW = Math.min(560, innerWidth - 24); CH = Math.max(160, innerHeight - 280);
  const d = Math.min(2, devicePixelRatio || 1);
  cc.width = CW * d; cc.height = CH * d; cc.style.width = CW + 'px'; cc.style.height = CH + 'px';
  const fit = Math.min(CW / src.width, CH / src.height);
  view = { k: fit, fit, x: (CW - src.width * fit) / 2, y: (CH - src.height * fit) / 2 };
  updateTools(); drawCrop();
};
function drawCrop() {
  const d = cc.width / CW, { k, x, y } = view, w = src.width * k, h = src.height * k;
  cx2.setTransform(d, 0, 0, d, 0, 0);
  cx2.clearRect(0, 0, CW, CH);
  cx2.fillStyle = '#3a1f2b'; cx2.fillRect(x, y, w, h);
  cx2.globalAlpha = 0.35; cx2.drawImage(src, x, y, w, h); cx2.globalAlpha = 1;
  const g = tmpC.getContext('2d');
  g.globalCompositeOperation = 'source-over';
  g.clearRect(0, 0, tmpC.width, tmpC.height);
  g.drawImage(mask, 0, 0);
  g.globalCompositeOperation = 'source-in'; g.drawImage(src, 0, 0);
  g.globalCompositeOperation = 'source-atop'; g.fillStyle = 'rgba(255,111,145,.35)'; g.fillRect(0, 0, tmpC.width, tmpC.height);
  cx2.drawImage(tmpC, x, y, w, h);
}
function maskBox() {
  const dd = mctx.getImageData(0, 0, mask.width, mask.height).data;
  let x0 = mask.width, y0 = mask.height, x1 = -1, y1 = -1;
  for (let y = 0; y < mask.height; y++) for (let x = 0; x < mask.width; x++) {
    if (dd[(y * mask.width + x) * 4 + 3] > 20) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  return x1 < 0 ? null : { x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1 };
}
function updateTools() {
  const sz = [8, 13, 20][brushIdx];
  $('brush').firstChild.style.width = $('brush').firstChild.style.height = sz + 'px';
  $('erase').classList.toggle('on', erasing);
  $('undo').disabled = !undoStack.length;
  $('ok').disabled = !undoStack.length || !maskBox();
}
const pushUndo = () => { undoStack.push(mctx.getImageData(0, 0, mask.width, mask.height)); if (undoStack.length > 20) undoStack.shift(); };
$('brush').onclick = () => { brushIdx = (brushIdx + 1) % BRUSH.length; updateTools(); };
$('erase').onclick = () => { erasing = !erasing; updateTools(); };
$('undo').onclick = () => { const dd = undoStack.pop(); if (dd) mctx.putImageData(dd, 0, 0); updateTools(); drawCrop(); };
$('all').onclick = () => { pushUndo(); mctx.fillStyle = '#000'; mctx.fillRect(0, 0, mask.width, mask.height); updateTools(); drawCrop(); };
const toImg = e => { const r = cc.getBoundingClientRect(); return { x: (e.clientX - r.left - view.x) / view.k, y: (e.clientY - r.top - view.y) / view.k }; };
function stroke(a, b) {
  const lw = BRUSH[brushIdx] / view.k;
  mctx.save();
  mctx.globalCompositeOperation = erasing ? 'destination-out' : 'source-over';
  mctx.strokeStyle = mctx.fillStyle = '#000';
  mctx.lineCap = mctx.lineJoin = 'round'; mctx.lineWidth = lw;
  mctx.beginPath(); mctx.moveTo(a.x, a.y); mctx.lineTo(b.x, b.y); mctx.stroke();
  mctx.beginPath(); mctx.arc(b.x, b.y, lw / 2, 0, Math.PI * 2); mctx.fill();
  mctx.restore();
}
const cptrs = new Map(); let cpinch = null, lastPt = null;
const mid = (a, b) => { const r = cc.getBoundingClientRect(); return { x: (a.x + b.x) / 2 - r.left, y: (a.y + b.y) / 2 - r.top }; };
cc.addEventListener('pointerdown', e => {
  e.preventDefault(); cc.setPointerCapture(e.pointerId);
  cptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (cptrs.size === 1) {
    pushUndo(); lastPt = toImg(e); stroke(lastPt, lastPt); drawCrop();
  } else if (cptrs.size === 2) {
    // 2本目の指: 描きかけを取り消して拡大縮小に切り替える
    if (lastPt) { const dd = undoStack.pop(); if (dd) mctx.putImageData(dd, 0, 0); lastPt = null; }
    const [a, b] = [...cptrs.values()];
    cpinch = { d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, m0: mid(a, b), k0: view.k, x0: view.x, y0: view.y };
    drawCrop();
  }
});
cc.addEventListener('pointermove', e => {
  if (!cptrs.has(e.pointerId)) return;
  cptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (cpinch && cptrs.size >= 2) {
    const [a, b] = [...cptrs.values()], m = mid(a, b);
    const k = Math.max(view.fit, Math.min(view.fit * 12, cpinch.k0 * Math.hypot(a.x - b.x, a.y - b.y) / cpinch.d0));
    view.x = m.x - (cpinch.m0.x - cpinch.x0) / cpinch.k0 * k;
    view.y = m.y - (cpinch.m0.y - cpinch.y0) / cpinch.k0 * k;
    view.k = k; drawCrop();
  } else if (lastPt) { const p = toImg(e); stroke(lastPt, p); lastPt = p; drawCrop(); }
});
const cup = e => {
  cptrs.delete(e.pointerId);
  if (!cptrs.size) { cpinch = null; lastPt = null; updateTools(); }
};
cc.addEventListener('pointerup', cup); cc.addEventListener('pointercancel', cup);
cc.addEventListener('wheel', e => {
  e.preventDefault();
  const r = cc.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const k = Math.max(view.fit, Math.min(view.fit * 12, view.k * Math.exp(-e.deltaY * 0.0015)));
  view.x = mx - (mx - view.x) / view.k * k; view.y = my - (my - view.y) / view.k * k; view.k = k;
  if (k <= view.fit * 1.001) { view.x = (CW - src.width * k) / 2; view.y = (CH - src.height * k) / 2; }
  drawCrop();
}, { passive: false });
$('cancel').onclick = () => $('crop').classList.remove('on');
$('ok').onclick = () => {
  const b = maskBox(); if (!b) return;
  const out = document.createElement('canvas');
  const k = Math.min(1, 640 / Math.max(b.w, b.h));
  out.width = Math.max(1, Math.round(b.w * k)); out.height = Math.max(1, Math.round(b.h * k));
  const o = out.getContext('2d');
  o.drawImage(src, b.x, b.y, b.w, b.h, 0, 0, out.width, out.height);
  o.globalCompositeOperation = 'destination-in';
  o.drawImage(mask, b.x, b.y, b.w, b.h, 0, 0, out.width, out.height);
  $('crop').classList.remove('on');
  // 保存（入りきらないときは小さくする）
  let c = out;
  while (!store.set('img', c.toDataURL('image/png')) && c.width > 64) {
    const c2 = document.createElement('canvas'); c2.width = c.width >> 1; c2.height = c.height >> 1;
    c2.getContext('2d').drawImage(c, 0, 0, c2.width, c2.height); c = c2;
  }
  setImage(out); rotX = -0.25; rotY = 0.35; rvX = rvY = 0; puni(400, 800, 0.15);
};
$('reset').onclick = () => {
  if (!disp) return;
  for (let i = 0; i < disp.length; i++) vel[i] = -disp[i] * 3; // ぷるんと戻す
  rotX = -0.25; rotY = 0.35; rvX = rvY = 0; zoom = 1;
  puni(700, 350, 0.12);
};

(async () => {
  const saved = store.get('img', null);
  const im = saved ? await loadDataURL(saved) : null;
  await setImage(im || sampleImage());
  requestAnimationFrame(loop);
})();
</script>
</body>
