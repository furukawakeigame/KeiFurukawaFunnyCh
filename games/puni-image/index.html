<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ぷにぷに画像</title>
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ふるかわけい面白チャンネル">
  <meta property="og:title" content="ぷにぷに画像">
  <meta property="og:url" content="https://keifurukawafunnych.com/games/puni-image/">
  <meta property="og:image" content="https://keifurukawafunnych.com/games/puni-image/icon.png">
  <meta name="twitter:card" content="summary">
  <style>
    html, body { margin: 0; height: 100%; background: #ffe9ef; color: #6a3348; }
    body {
      display: flex; flex-direction: column; height: 100dvh; box-sizing: border-box;
      padding-bottom: calc(80px + env(safe-area-inset-bottom));
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic UI", system-ui, sans-serif;
      overflow: hidden; touch-action: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    }
    header { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; }
    header a { color: #6a3348; text-decoration: none; font-size: 14px; }
    .hbtns { display: flex; gap: 6px; }
    .pill {
      height: 34px; min-width: 34px; border: 2px solid #6a3348; border-radius: 17px;
      background: #fff6f8; color: #6a3348; font: inherit; font-size: 15px; font-weight: bold;
      padding: 0 12px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    }
    .pill svg { width: 20px; height: 20px; }
    #sound { padding: 0 6px; }
    #stage { flex: 1; position: relative; min-height: 0; }
    #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .bar { display: flex; justify-content: center; gap: 12px; padding: 8px; }
    .bar .pill { height: 52px; width: 52px; border-radius: 26px; padding: 0; }
    .bar .pill svg { width: 26px; height: 26px; }
    .main { background: #6a3348 !important; color: #fff6f8 !important; }
    #file { display: none; }
    #err { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 20px; }
  </style>
</head>
<body>
  <header>
    <a href="../../" id="back">← トップへ戻る</a>
    <div class="hbtns">
      <button id="lang" class="pill">EN</button>
      <button id="sound" class="pill"></button>
    </div>
  </header>
  <div id="stage"><canvas id="cv"></canvas><div id="err"></div></div>
  <div class="bar">
    <button id="pick" class="pill main"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6" fill="currentColor"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg></button>
    <button id="reset" class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v5h5"/></svg></button>
  </div>
  <input type="file" id="file" accept="image/*">

<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<script>
  window.__t = setTimeout(() => { if (!window.__ok) { const e = document.getElementById('err'); e.style.display = 'flex';
    e.textContent = (navigator.language || '').startsWith('ja') ? '読み込みに失敗しました。通信状況を確認して再読み込みしてください。' : 'Failed to load. Please check your connection and reload.'; } }, 8000);
</script>
<script type="module">
import * as THREE from 'three';
window.__ok = true;
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem('puni-' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('puni-' + k, JSON.stringify(v)); return true; } catch { return false; } }
};

// ---- 言語 ----
const L = {
  ja: { title: 'ぷにぷに画像', back: '← トップへ戻る', lang: 'EN', langLabel: 'Switch to English', pick: '画像をえらぶ', reset: '元に戻す', sound: '音のオン/オフ' },
  en: { title: 'Squishy Image', back: '← Top', lang: '日本語', langLabel: '日本語に切り替え', pick: 'Pick image', reset: 'Reset', sound: 'Sound on/off' }
};
let lang = store.get('lang', (navigator.language || '').startsWith('ja') ? 'ja' : 'en');
if (!L[lang]) lang = 'ja';
const t = k => L[lang][k];
function applyLang() {
  document.documentElement.lang = lang; document.title = t('title');
  $('back').textContent = t('back');
  $('lang').textContent = t('lang'); $('lang').setAttribute('aria-label', t('langLabel'));
  $('sound').setAttribute('aria-label', t('sound'));
  $('pick').setAttribute('aria-label', t('pick')); $('pick').title = t('pick');
  $('reset').setAttribute('aria-label', t('reset')); $('reset').title = t('reset');
}
$('lang').onclick = () => { lang = lang === 'ja' ? 'en' : 'ja'; store.set('lang', lang); applyLang(); };
applyLang();

// ---- 音 ----
let soundOn = store.get('sound', true);
const SPK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>';
const updateSoundBtn = () => {
  $('sound').innerHTML = SPK + (soundOn
    ? '<path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg>'
    : '<path d="M16 9l5 6M21 9l-5 6"/></svg>');
};
$('sound').onclick = () => { soundOn = !soundOn; store.set('sound', soundOn); updateSoundBtn(); };
updateSoundBtn();
let ac;
function puni(f0, f1, dur = 0.12, vol = 0.25) {
  if (!soundOn) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const o = ac.createOscillator(), g = ac.createGain(), now = ac.currentTime;
    o.type = 'sine';
    o.frequency.setValueAtTime(f0, now); o.frequency.exponentialRampToValueAtTime(f1, now + dur);
    g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(vol, now + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    o.connect(g).connect(ac.destination); o.start(now); o.stop(now + dur + 0.02);
  } catch {}
}

// ---- サンプル画像（コードで描く顔）----
function sampleImage() {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d');
  const bg = g.createRadialGradient(256, 220, 40, 256, 256, 360);
  bg.addColorStop(0, '#ffe08a'); bg.addColorStop(1, '#ffb347');
  g.fillStyle = bg; g.fillRect(0, 0, 512, 512);
  g.fillStyle = '#ff8fa3'; g.globalAlpha = .7;
  g.beginPath(); g.ellipse(140, 300, 46, 30, 0, 0, 7); g.fill();
  g.beginPath(); g.ellipse(372, 300, 46, 30, 0, 0, 7); g.fill();
  g.globalAlpha = 1; g.fillStyle = '#3a2230';
  g.beginPath(); g.ellipse(172, 228, 30, 40, 0, 0, 7); g.fill();
  g.beginPath(); g.ellipse(340, 228, 30, 40, 0, 0, 7); g.fill();
  g.fillStyle = '#fff';
  g.beginPath(); g.arc(182, 212, 11, 0, 7); g.fill();
  g.beginPath(); g.arc(350, 212, 11, 0, 7); g.fill();
  g.strokeStyle = '#3a2230'; g.lineWidth = 14; g.lineCap = 'round';
  g.beginPath(); g.arc(256, 300, 50, 0.2 * Math.PI, 0.8 * Math.PI); g.stroke();
  return c;
}

// ---- three.js ----
const cv = $('cv');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0xffe9ef);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
let camDist = 7;
scene.add(new THREE.HemisphereLight(0xffffff, 0xffc4d2, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(2, 3, 5); scene.add(sun);
const group = new THREE.Group(); scene.add(group);

const SEG = 48, DEPTH = 0.55;
let mesh, geo, rest, disp, vel, normals, tex;
const sideMat = new THREE.MeshStandardMaterial({ color: 0xfff1f4, roughness: .55 });
const faceMat = new THREE.MeshStandardMaterial({ roughness: .45 });
const backMat = new THREE.MeshStandardMaterial({ roughness: .5, color: 0xffd9e2 });

function build(img) {
  const aspect = (img.width || 1) / (img.height || 1);
  const W = aspect >= 1 ? 3 : 3 * aspect, H = aspect >= 1 ? 3 / aspect : 3;
  if (mesh) { group.remove(mesh); geo.dispose(); }
  if (tex) tex.dispose();
  tex = new THREE.Texture(img); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4; tex.needsUpdate = true;
  faceMat.map = tex; faceMat.needsUpdate = true;
  geo = new THREE.BoxGeometry(2, 2, 2, SEG, SEG, 8);
  const p = geo.attributes.position, n = 4; // 丸みのある箱（超楕円体）
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const r = Math.pow(Math.abs(x) ** n + Math.abs(y) ** n + Math.abs(z) ** 2.4, 1 / n) || 1;
    const k = 1 / r;
    p.setXYZ(i, x * k * W / 2, y * k * H / 2, z * k * DEPTH / 2);
  }
  // 表面を少しふくらませる（ほんのり球）
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i) / (W / 2), y = p.getY(i) / (H / 2), z = p.getZ(i);
    const b = Math.max(0, 1 - (x * x + y * y) * 0.7);
    p.setZ(i, z * (1 + b * 0.9));
  }
  rest = Float32Array.from(p.array);
  disp = new Float32Array(p.count * 3); vel = new Float32Array(p.count * 3);
  geo.computeVertexNormals();
  normals = Float32Array.from(geo.attributes.normal.array);
  mesh = new THREE.Mesh(geo, [sideMat, sideMat, sideMat, sideMat, faceMat, backMat]);
  group.add(mesh);
  size = Math.max(W, H);
}
let size = 3;

function resize() {
  const w = cv.clientWidth, h = cv.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  // 画面に収まる距離
  const fov = camera.fov * Math.PI / 180;
  const fit = (size * 0.75) / Math.tan(fov / 2) / Math.min(1, camera.aspect);
  baseDist = fit; 
}
let baseDist = 7, zoom = 1;
addEventListener('resize', resize);

// ---- 操作 ----
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const pointers = new Map();
let grab = null, rotating = null, pinch = null;
let rotX = -0.25, rotY = 0.35, rvX = 0, rvY = 0;
function setNdc(e) { const r = cv.getBoundingClientRect(); ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); }
function planePoint(e, plane) {
  setNdc(e); ray.setFromCamera(ndc, camera);
  const v = new THREE.Vector3(); return ray.ray.intersectPlane(plane, v) ? v : null;
}
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    if (grab) release();
    rotating = null;
    const [a, b] = [...pointers.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: zoom };
    return;
  }
  if (pointers.size > 2) return;
  setNdc(e); ray.setFromCamera(ndc, camera);
  const hit = e.button === 0 && mesh ? ray.intersectObject(mesh)[0] : null;
  if (hit) {
    const local = mesh.worldToLocal(hit.point.clone());
    const camDir = new THREE.Vector3(); camera.getWorldDirection(camDir);
    const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(camDir.negate(), hit.point);
    // 各頂点の重み
    const p = geo.attributes.position, R = size * 0.28, w = new Float32Array(p.count);
    for (let i = 0; i < p.count; i++) {
      const dx = p.array[i * 3] - local.x, dy = p.array[i * 3 + 1] - local.y, dz = p.array[i * 3 + 2] - local.z;
      w[i] = Math.exp(-(dx * dx + dy * dy + dz * dz) / (R * R));
    }
    const ln = hit.face.normal.clone(); // ローカル法線
    grab = { id: e.pointerId, plane, start: hit.point.clone(), w, base: Float32Array.from(disp), press: 0, moved: 0, ln, sx: e.clientX, sy: e.clientY, cur: hit.point.clone() };
    puni(520, 260, 0.1);
  } else {
    rotating = { id: e.pointerId, x: e.clientX, y: e.clientY };
  }
});
cv.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pointers.size >= 2) {
    const [a, b] = [...pointers.values()];
    zoom = Math.min(2.5, Math.max(0.5, pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d));
    return;
  }
  if (grab && grab.id === e.pointerId) {
    const v = planePoint(e, grab.plane); if (v) grab.cur = v;
    grab.moved = Math.max(grab.moved, Math.hypot(e.clientX - grab.sx, e.clientY - grab.sy));
  } else if (rotating && rotating.id === e.pointerId) {
    const dx = e.clientX - rotating.x, dy = e.clientY - rotating.y;
    rotY += dx * 0.01; rotX += dy * 0.01; rvY = dx * 0.01; rvX = dy * 0.01;
    rotX = Math.max(-1.4, Math.min(1.4, rotX));
    rotating.x = e.clientX; rotating.y = e.clientY;
  }
});
function release() {
  if (!grab) return;
  // 離した瞬間の勢いを少しだけ付ける
  puni(300, 620, 0.14, 0.2);
  grab = null;
}
function up(e) {
  pointers.delete(e.pointerId);
  if (grab && grab.id === e.pointerId) release();
  if (rotating && rotating.id === e.pointerId) rotating = null;
  if (pointers.size < 2) pinch = null;
}
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('wheel', e => { e.preventDefault(); zoom = Math.min(2.5, Math.max(0.5, zoom * Math.exp(-e.deltaY * 0.001))); }, { passive: false });

// ---- 物理 ----
const inv = new THREE.Matrix4();
function step(dt) {
  if (!geo) return;
  const p = geo.attributes.position, N = p.count;
  if (grab) {
    // ドラッグ量（ローカル座標）
    inv.copy(mesh.matrixWorld).invert();
    const a = grab.start.clone().applyMatrix4(inv), b = grab.cur.clone().applyMatrix4(inv);
    const d = b.sub(a);
    const len = d.length(), max = size * 0.9;
    if (len > max) d.multiplyScalar(max / len);
    if (grab.moved < 8) grab.press = Math.min(1, grab.press + dt * 1.5);
    else grab.press = Math.max(0, grab.press - dt * 3);
    const pd = grab.press * DEPTH * 1.1;
    const k = Math.min(1, dt * 18);
    for (let i = 0; i < N; i++) {
      const w = grab.w[i]; if (w < 0.002) continue;
      const j = i * 3;
      const tx = grab.base[j] + (d.x - grab.ln.x * pd) * w;
      const ty = grab.base[j + 1] + (d.y - grab.ln.y * pd) * w;
      const tz = grab.base[j + 2] + (d.z - grab.ln.z * pd) * w;
      vel[j] = (tx - disp[j]) * k / dt; vel[j + 1] = (ty - disp[j + 1]) * k / dt; vel[j + 2] = (tz - disp[j + 2]) * k / dt;
    }
  }
  // ゆっくり戻るばね（つかんでいない頂点）
  const K = 5, C = 3.2;
  for (let i = 0; i < N; i++) {
    const j = i * 3;
    if (grab && grab.w[i] >= 0.002) {
      disp[j] += vel[j] * dt; disp[j + 1] += vel[j + 1] * dt; disp[j + 2] += vel[j + 2] * dt;
    } else {
      for (let c = 0; c < 3; c++) {
        vel[j + c] += (-K * disp[j + c] - C * vel[j + c]) * dt;
        disp[j + c] += vel[j + c] * dt;
      }
    }
    p.array[j] = rest[j] + disp[j]; p.array[j + 1] = rest[j + 1] + disp[j + 1]; p.array[j + 2] = rest[j + 2] + disp[j + 2];
  }
  p.needsUpdate = true;
  geo.computeVertexNormals();
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (!rotating) { rotY += rvY; rotX += rvX; rvY *= 0.92; rvX *= 0.92; rotX = Math.max(-1.4, Math.min(1.4, rotX)); }
  group.rotation.set(rotX, rotY, 0);
  group.updateMatrixWorld();
  const dist = baseDist / zoom;
  camera.position.set(0, 0, dist); camera.lookAt(0, 0, 0);
  for (let s = 0; s < 2; s++) step(dt / 2);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

// ---- 画像 ----
function loadDataURL(url) {
  return new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = url; });
}
async function setImage(img) { build(img); resize(); }
$('pick').onclick = () => $('file').click();
$('file').onchange = async () => {
  const f = $('file').files[0]; if (!f) return;
  const url = URL.createObjectURL(f);
  const im = await loadDataURL(url); URL.revokeObjectURL(url);
  $('file').value = '';
  if (!im) return;
  const s = Math.min(1, 1024 / Math.max(im.width, im.height));
  const c = document.createElement('canvas'); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
  c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
  let data = c.toDataURL('image/jpeg', 0.85);
  if (!store.set('img', data)) { // 大きすぎるときはもう少し小さく
    const c2 = document.createElement('canvas'); c2.width = c.width >> 1; c2.height = c.height >> 1;
    c2.getContext('2d').drawImage(c, 0, 0, c2.width, c2.height); store.set('img', c2.toDataURL('image/jpeg', 0.8));
  }
  setImage(c); puni(400, 800, 0.15);
};
$('reset').onclick = () => {
  if (!disp) return;
  for (let i = 0; i < disp.length; i++) vel[i] = -disp[i] * 3; // ぷるんと戻す
  rotX = -0.25; rotY = 0.35; rvX = rvY = 0; zoom = 1;
  puni(700, 350, 0.12);
};

(async () => {
  const saved = store.get('img', null);
  const im = saved ? await loadDataURL(saved) : null;
  await setImage(im || sampleImage());
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
