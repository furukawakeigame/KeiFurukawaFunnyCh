        ring(3200 + Math.random() * 400, Math.min(0.25, Math.abs(c.vy) * 0.06), 0.9);
        puff(c.x, FLOOR, 0, 8, 0xffe08a, 0.25);
        c.vy = -c.vy * 0.32; c.v *= 0.55; c.wz *= -0.5; c.bounces++;
        if (state === 'fall') die();
        else if (state === 'kill' && c.bounces === 1) ring(3000, 0.08, 0.5);
      } else { c.vy = 0; c.v *= Math.exp(-dt * 6); c.wz = 0; const flat = Math.round(c.rz / Math.PI) * Math.PI; c.rz += (flat - c.rz) * Math.min(1, dt * 12); }
    }
  }
  if (ragdoll) ragStep(dt);
  if (state === 'kill') {
    dropT += dt;
    mouthOpen(Math.min(1, dropT * 4));
    catShake = Math.max(0, catShake - dt);
    if (dropT > 3 && endT === 0) { endT = 1; finish('kill'); }
  }
  if (state === 'dead') {
    dropT += dt; catShake = Math.max(0, catShake - dt);
    if (dropT > 1.6 && endT === 0) { endT = 1; finish(true); }
  }
}
let thud = false;
// "guehhh": a low, long, strangled voice
const gue = () => { voice(120 + Math.random() * 25, ['g', 'u', 'e', 'e', 'e'], 1.6, 0.6, 0.09, 0.35); voice(240 + Math.random() * 30, ['u', 'e', 'e'], 1.5, 0.12, 0.12, 0.5); };
function hit() {
  state = 'kill'; dropT = 0; thud = false; catShake = 0.5;
  burst(900, 1.2, 0.08, 0.9); burst(250, 2, 0.12, 0.8); // smack on the face
  c.v = -Math.abs(c.v) * 0.4 - 0.1; c.vy = 0.6; c.wz = 14;
  puff(c.x, c.y, 0, 10, 0xffffff, 0.3);
  fling(); hitT = 0; flashK = 1; burst(70, 0.8, 0.7, 1); // a deep thump under the smack
  setTimeout(gue, FREEZE * 1000);
  fxOn = true; crack = null;
}
function die() {
  state = 'dead'; dropT = 0; catShake = 0.8;
  setTimeout(scream, 120);
  drawCrack(); fxOn = true;
}
function finish(dead) {
  if (!dead) {
    const gap = Math.max(0, EDGE - (c.x + R)) * 1000;
    result = { dead: false, mm: gap };
    if (best === null || gap < best) { best = gap; store.set('best', best); }
    const from = Math.min(EDGE, c.x + R);
    gapLine.scale.x = Math.max(0.0005, EDGE - from); gapLine.position.set((from + EDGE) / 2, 0.0012, 0.03); gapLine.visible = gap > 0.05;
    edgeMark.position.set(EDGE, 0.004, 0.03); edgeMark.visible = true;
    ring(1800, 0.06, 0.4); ring(2700, 0.05, 0.5, 0.12);
  } else result = { dead: true, kill: dead === 'kill' };
  state = 'done';
  needSnap = true;
}

// ---------- red flash + crack overlay ----------
const fx = $('fx'), fxCtx = fx.getContext('2d');
let fxOn = false, redK = 0, crack = null, flashK = 0, shake = 0, hitT = -1;
function drawCrack() {
  // a crack from a random point near the coin's fall, branching outward
  const W = fx.width, H = fx.height, o = { x: 0.4 + Math.random() * 0.2, y: 0.5 + Math.random() * 0.15 };
  crack = [];
  for (let b = 0; b < 9; b++) {
    let x = o.x * W, y = o.y * H, a = Math.random() * 7, pts = [[x, y]];
    const len = (0.15 + Math.random() * 0.35) * Math.max(W, H);
    for (let s = 0; s < 14; s++) { a += (Math.random() - 0.5) * 0.9; x += Math.cos(a) * len / 14; y += Math.sin(a) * len / 14; pts.push([x, y]); }
    crack.push(pts);
  }
}
function paintFx() {
  const W = fx.width, H = fx.height;
  fxCtx.clearRect(0, 0, W, H);
  if (!fxOn) return;
  if (flashK > 0) { fxCtx.fillStyle = `rgba(255,255,255,${flashK * 0.7})`; fxCtx.fillRect(0, 0, W, H); }
  const g = fxCtx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.2, W / 2, H / 2, Math.max(W, H) * 0.75);
  g.addColorStop(0, `rgba(200,0,0,${0.15 * redK})`); g.addColorStop(1, `rgba(120,0,0,${0.75 * redK})`);
  fxCtx.fillStyle = g; fxCtx.fillRect(0, 0, W, H);
  if (crack) {
    fxCtx.lineJoin = 'round'; fxCtx.lineCap = 'round';
    for (const [lw, col] of [[5, 'rgba(255,255,255,.55)'], [2, 'rgba(20,0,0,.9)']]) {
      fxCtx.lineWidth = lw * (W / fx.clientWidth || 1); fxCtx.strokeStyle = col;
      for (const pts of crack) { fxCtx.beginPath(); pts.forEach(([x, y], i) => i ? fxCtx.lineTo(x, y) : fxCtx.moveTo(x, y)); fxCtx.stroke(); }
    }
  }
}

// ---------- layout ----------
// the tabletop from the start to just past the edge must fit above the bottom 80px
const TOP = 52, BOTTOM = 130, FOCUS = new THREE.Vector3(0.05, -0.02, 0), SPAN_W = 1.35, SPAN_H = 0.5;
const camDir = new THREE.Vector3(-0.15, 1.0, 0.8).normalize(); // from high up in front
let camDist = 1, viewH = 1, follow = 0, killF = 0, tv = 0.3, camX = FOCUS.x, camD = 1;
function resize() {
  const W = stage.clientWidth, H = stage.clientHeight;
  renderer.setSize(W, H, false);
  const dpr = renderer.getPixelRatio(); fx.width = W * dpr; fx.height = H * dpr;
  viewH = Math.max(120, H - TOP - BOTTOM);
  camera.aspect = W / viewH;
  camera.setViewOffset(W, viewH, 0, -TOP, W, H);
  tv = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2);
  // the whole table and the person: used as the widest shot
  camDist = Math.min(4, Math.max(SPAN_H / (2 * tv), SPAN_W / (2 * tv * camera.aspect)));
  camera.updateProjectionMatrix();
  if (crack) drawCrack();
  paintFx();
}
addEventListener('resize', resize);
const bodyC = new THREE.Vector3(), camTarget = new THREE.Vector3(), tmpV = new THREE.Vector3();
function placeCamera(dt) {
  // after falling, look down to the floor where the coin lies
  const want = state === 'dead' || (state === 'fall' && c.y < -0.25) || (state === 'done' && result?.dead && !result.kill) ? 1 : 0;
  follow += (want - follow) * Math.min(1, dt * 3);
  // after a hit, pull back to show the person lying on the floor
  const wantK = state === 'kill' && dropT > 0.1 || (state === 'done' && result?.kill) ? 1 : 0;
  killF += (wantK - killF) * Math.min(1, dt * 6);
  // frame just the coin and the face: the closer the coin gets, the tighter the shot
  const l = Math.min(c.x, EDGE) - R - 0.12, r = HEAD.x + 0.16, sw = r - l, sh = Math.max(0.32, sw * 0.45);
  const d = Math.min(camDist, Math.max(sh / (2 * tv), sw / (2 * tv * camera.aspect)));
  const k = Math.min(1, dt * 3); camX += ((l + r) / 2 - camX) * k; camD += (d - camD) * k;
  // tall screens: the spare height goes to the wall above, not to the floor below
  const slackUp = Math.max(0, 2 * tv * camD - sh) * 0.3;
  camTarget.set(camX, FOCUS.y + slackUp, 0); camTarget.x += follow * (Math.min(c.x, 1.2) - camX); camTarget.y += follow * (-TABLE_Y * 0.7);
  // follow the flying body closely: aim at the middle of the chest and hips
  bodyC.copy(J.chest.p).add(J.pelvis.p).multiplyScalar(0.5);
  camTarget.lerp(bodyC, killF);
  // a hit pulls back wider than the whole table
  const dist = camD * (1 + follow * 0.25) * (1 - killF) + Math.max(1.5, camDist * 0.8) * killF;
  camera.position.copy(camTarget).addScaledVector(camDir, dist);
  scene.fog.near = dist + 0.8; scene.fog.far = dist + 4; // haze only far behind what we look at
  if (catShake > 0) camera.position.x += Math.sin(performance.now() / 18) * catShake * 0.01;
  // the hit shakes the camera hard, rattling while frozen and dying away in the slow motion
  if (shake > 0.002) camera.position.add(tmpV.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).multiplyScalar(shake * dist * 0.06));
  camera.lookAt(camTarget);
  if (shake > 0.002) camera.rotateZ((Math.random() - 0.5) * shake * 0.12);
}
function toScreen(x, y, z) { tmpV.set(x, y, z).project(camera); return { x: (tmpV.x + 1) / 2, y: (1 - tmpV.y) / 2 }; }

// ---------- result ----------
const coarse = matchMedia('(pointer: coarse)').matches;
const fmt = v => v.toFixed(1);
function showResult() {
  const r = $('rVal');
  r.textContent = result.dead ? t('dead') : L[lang].mm(fmt(result.mm));
  r.classList.toggle('dead', result.dead);
  $('rBest').textContent = best === null ? '' : `${t('best')} ${L[lang].mm(fmt(best))}`;
  $('rBest').hidden = best === null;
  const a = $('share');
  a.href = `https://x.com/intent/post?text=${encodeURIComponent(postText())}&url=${encodeURIComponent(URL_)}`;
  if (coarse) { a.removeAttribute('target'); a.removeAttribute('rel'); } else { a.target = '_blank'; a.rel = 'noopener'; }
  prepareShare();
}
const postText = () => result.kill ? L[lang].postKill() : result.dead ? L[lang].postDead() : L[lang].post(fmt(result.mm));
$('share').addEventListener('click', e => {
  const text = `${postText()}\n${URL_}`;
  if (coarse && navigator.share) {
    e.preventDefault();
    const file = shareFile();
    navigator.share(file && navigator.canShare?.({ files: [file] }) ? { files: [file], text } : { text }).catch(() => {});
    return;
  }
  const img = resultImage();
  if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'coin-edge.png'; d.click(); }
});
// result image: the scene squared around the coin, with the result big and the title small
let snap = null, shareCache = null, needSnap = false;
function takeSnap() {
  const W = cv.width, H = cv.height, side = Math.min(W, H);
  const p = result.kill ? toScreen(J.pelvis.p.x, J.pelvis.p.y, J.pelvis.p.z) : toScreen(result.dead ? c.x : EDGE - 0.03, result.dead ? -TABLE_Y + 0.15 : 0, 0);
  const sx = Math.max(0, Math.min(W - side, p.x * W - side / 2)), sy = Math.max(0, Math.min(H - side, p.y * H - side * 0.6));
  snap = document.createElement('canvas'); snap.width = snap.height = 1080;
  const g = snap.getContext('2d');
  g.drawImage(cv, sx, sy, side, side, 0, 0, 1080, 1080);
  if (fxOn) g.drawImage(fx, sx, sy, side, side, 0, 0, 1080, 1080);
  shareCache = null;
}
function resultImage() {
  if (!snap) return null;
  const cc = document.createElement('canvas'); cc.width = cc.height = 1080;
  const g = cc.getContext('2d');
  g.drawImage(snap, 0, 0);
  g.textAlign = 'center'; g.lineJoin = 'round';
  const font = px => `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans Thai", sans-serif`;
  const text = (str, y, px, max, fill, line) => {
    g.font = font(px);
    const w = g.measureText(str).width; if (w > max) { px *= max / w; g.font = font(px); }
    g.lineWidth = px * .16; g.strokeStyle = line; g.strokeText(str, 540, y); g.fillStyle = fill; g.fillText(str, 540, y);
  };
  text(result.dead ? t('dead') : L[lang].mm(fmt(result.mm)), 250, 210, 960, result.dead ? '#ff4040' : '#fff', '#223');
  text(t('title'), 1030, 56, 900, '#fff', '#223');
  return cc;
}
function prepareShare() {
  if (!snap) return;
  const key = lang;
  if (shareCache?.key === key) return;
  shareCache = { key, file: null };
  resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'coin-edge.png', { type: 'image/png' }); }, 'image/png');
}
const shareFile = () => shareCache?.key === lang ? shareCache.file : null;

// ---------- loop ----------
function draw(k) {
  const x = cp.x + (c.x - cp.x) * k, y = cp.y + (c.y - cp.y) * k, rz = cp.rz + (c.rz - cp.rz) * k;
  // pivot around the coin's back edge while it tips over the table edge, else around its centre
  coinPivot.position.set(x, y, 0); coinPivot.rotation.set(0, 0, rz);
  coin.rotation.set(Math.sin(c.wobT * (10 + c.wobT * 30)) * c.wob, c.spin, 0);
  updateBand(x); drawHuman();
  renderer.render(scene, camera);
}
// hit stop: on the hit the world freezes for a moment, then carries on at full speed
const FREEZE = 0.45;
const timeScale = () => hitT >= 0 && hitT < FREEZE ? 0 : 1;
let last = performance.now(), acc = 0, lastFx = -1;
function loop(now) {
  const fdt = Math.min(0.05, (now - last) / 1000); last = now;
  if (hitT >= 0) hitT += fdt;
  const ts = timeScale();
  acc = Math.min(acc + fdt * ts, 0.25);
  while (acc >= DT) { step(DT); acc -= DT; }
  tickSparks(fdt * ts);
  if (fxOn && redK < 1 && ts > 0) redK = Math.min(1, redK + fdt * 3);
  flashK = Math.max(0, flashK - fdt * (hitT >= 0 && hitT < FREEZE ? 0.6 : 4));
  shake = hitT >= 0 && hitT < FREEZE ? 1 : shake * Math.exp(-fdt * 2.2);
  const fk = fxOn ? Math.round(redK * 100) * 1000 + Math.round(flashK * 100) : -1;
  if (fk !== lastFx) { lastFx = fk; paintFx(); }
  placeCamera(fdt);
  draw(acc / DT);
  if (needSnap) { needSnap = false; takeSnap(); showResult(); $('result').hidden = false; }
  requestAnimationFrame(loop);
}
reset(); resize(); applyLang(); placeCamera(1); draw(1);
renderer.compileAsync?.(scene, camera).catch(() => {});
requestAnimationFrame(loop);
</script>
