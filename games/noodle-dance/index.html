  <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
  <script type="module">
    const DICT = {
      ja: { title: '麺ダンス', back: '← トップへ戻る', post: 'Xに投稿', rec: '撮影', erase: '消す', undo: '戻す', done: 'できた', err: '画像を読み込めませんでした', load: '読み込めませんでした。通信を確認してください。',
            share: '火鍋の麺を踊りながら伸ばしました #麺ダンスゲーム' },
      ko: { title: '면 댄스', back: '← 처음으로', post: 'X에 게시', rec: '촬영', erase: '지우기', undo: '되돌리기', done: '완성', err: '이미지를 불러오지 못했습니다', load: '불러오지 못했습니다. 연결을 확인해 주세요.',
            share: '훠궈 면을 춤추며 늘렸어요 #麺ダンスゲーム' },
      en: { title: 'Noodle Dance', back: '← Back to top', post: 'Post', rec: 'Record', erase: 'Erase', undo: 'Undo', done: 'Done', err: 'Could not load the image', load: 'Could not load. Please check your connection.',
            share: 'I danced and stretched hot pot noodles #麺ダンスゲーム' },
      th: { title: 'เต้นดึงเส้น', back: '← กลับหน้าแรก', post: 'โพสต์ลง X', rec: 'บันทึก', erase: 'ลบ', undo: 'ย้อนกลับ', done: 'เสร็จ', err: 'โหลดรูปไม่สำเร็จ', load: 'โหลดไม่สำเร็จ โปรดตรวจสอบการเชื่อมต่อ',
            share: 'เต้นไปดึงเส้นหม้อไฟไป #麺ダンスゲーム' },
    };
    const SHARE_URL = 'https://keifurukawafunnych.com/games/noodle-dance/';
    const store = {
      get(k, d) { try { const v = localStorage.getItem('noodle-dance:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
      set(k, v) { try { localStorage.setItem('noodle-dance:' + k, JSON.stringify(v)); } catch {} },
    };
    const autoLang = () => { for (const l of navigator.languages?.length ? navigator.languages : [navigator.language || '']) { const c = l.toLowerCase().slice(0, 2); if (['ja', 'ko', 'en', 'th'].includes(c)) return c; } return 'en'; };
    let lang = store.get('lang', autoLang());
    if (!DICT[lang]) lang = 'en';
    let muted = store.get('muted', false);
    const t = k => DICT[lang][k];

    let THREE;
    try { THREE = await import('three'); } catch {
      const m = document.getElementById('msg'); m.textContent = t('load'); m.style.display = 'flex';
      throw new Error('three.js load failed');
    }

    // ---------- 画面 ----------
    const stage = document.getElementById('stage');
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    stage.append(renderer.domElement);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x5a1e18);
    scene.fog = new THREE.Fog(0x5a1e18, 9, 18);
    const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 50);
    scene.add(new THREE.HemisphereLight(0xfff0dd, 0x502018, 1.1));
    const sun = new THREE.DirectionalLight(0xffffff, 1.8);
    sun.position.set(2.5, 6, 4); sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -2, near: 1, far: 15 });
    scene.add(sun);

    const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: .7, ...o });
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), std(0x7a4a2a));
    floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
    const wall = new THREE.Mesh(new THREE.PlaneGeometry(40, 12), std(0x8e2a1e));
    wall.position.set(0, 6, -4); scene.add(wall);
    // 奥の火鍋テーブル
    const steamMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .25, depthWrite: false });
    const steams = [];
    for (const x of [-3.4, 3.4]) {
      const g = new THREE.Group(); g.position.set(x, 0, -2.2); scene.add(g);
      const top = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, .08, 32), std(0x3b2418)); top.position.y = .8; g.add(top);
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(.1, .1, .8, 12), std(0x2a1a10)); leg.position.y = .4; g.add(leg);
      const pot = new THREE.Mesh(new THREE.CylinderGeometry(.5, .42, .28, 32), std(0xb8b8b8, { metalness: .8, roughness: .3 })); pot.position.y = .98; g.add(pot);
      const soup = new THREE.Mesh(new THREE.CircleGeometry(.47, 32), std(0xd8261a, { roughness: .2 })); soup.rotation.x = -Math.PI / 2; soup.position.y = 1.1; g.add(soup);
      for (let i = 0; i < 3; i++) { const s = new THREE.Mesh(new THREE.SphereGeometry(.25, 12, 8), steamMat); s.userData.p = i / 3; g.add(s); steams.push(s); }
    }
    // ---------- 踊る店員さん ----------
    const skin = std(0xf2c9a0), shirt = std(0x1c1c1c), pants = std(0x2a2a3a), glove = std(0xffffff, { roughness: .5 });
    const cyl = new THREE.CylinderGeometry(1, 1, 1, 14), ball = new THREE.SphereGeometry(1, 18, 12);
    function limb(mat, r) {
      const m = new THREE.Mesh(cyl, mat); m.castShadow = true; scene.add(m); m.userData.r = r; return m;
    }
    function joint(mat, r) { const m = new THREE.Mesh(ball, mat); m.scale.setScalar(r); m.castShadow = true; scene.add(m); return m; }
    const UP = new THREE.Vector3(0, 1, 0);
    function placeLimb(m, a, b) {
      const d = b.clone().sub(a), len = d.length();
      m.position.copy(a).add(b).multiplyScalar(.5);
      m.quaternion.setFromUnitVectors(UP, d.normalize());
      m.scale.set(m.userData.r, len, m.userData.r);
    }
    const torso = new THREE.Group(); scene.add(torso);
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(.26, .38, 6, 16), shirt); body.position.y = .36; body.castShadow = true; torso.add(body);
    const apron = new THREE.Mesh(new THREE.BoxGeometry(.4, .42, .04), std(0xc8231a)); apron.position.set(0, .22, .25); torso.add(apron);
    const head = new THREE.Group(); head.position.y = .9; torso.add(head);
    const face = new THREE.Mesh(ball, skin); face.scale.setScalar(.21); face.castShadow = true; head.add(face);
    const hair = new THREE.Mesh(new THREE.SphereGeometry(.22, 18, 12, 0, Math.PI * 2, 0, Math.PI * .45), std(0x111111)); hair.position.y = .02; hair.rotation.x = -.25; head.add(hair);
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(.2, .22, .1, 18), std(0xc8231a)); cap.position.set(0, .18, -.02); head.add(cap);
    const eyes = [-1, 1].map(s => { const e = new THREE.Mesh(ball, std(0x111111)); e.scale.set(.025, .035, .02); e.position.set(s * .07, .03, .195); head.add(e); return e; });
    const mouth = new THREE.Mesh(new THREE.TorusGeometry(.05, .012, 6, 12, Math.PI), std(0x7a1a10)); mouth.rotation.z = Math.PI; mouth.position.set(0, -.06, .195); head.add(mouth);
    // 好きな画像の顔
    const facePlane = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ transparent: true, alphaTest: .05, side: THREE.DoubleSide }));
    facePlane.position.set(0, 0, .23); facePlane.visible = false; head.add(facePlane);
    function setFace(canvas) {
      facePlane.material.map?.dispose();
      if (!canvas) { facePlane.visible = false; eyes.forEach(e => e.visible = true); mouth.visible = true; return; }
      const tex = new THREE.CanvasTexture(canvas); tex.colorSpace = THREE.SRGBColorSpace;
      facePlane.material.map = tex; facePlane.material.needsUpdate = true;
      const a = canvas.width / canvas.height, H = .56;
      facePlane.scale.set(Math.min(H * a, .8), Math.min(H * a, .8) / a, 1);
      facePlane.visible = true; eyes.forEach(e => e.visible = false); mouth.visible = false;
    }
    const neck = new THREE.Mesh(cyl, skin); neck.scale.set(.07, .2, .07); neck.position.y = .72; torso.add(neck);

    const ARM = .46, LEG = .48;
    const arms = [-1, 1].map(s => ({ s, up: limb(shirt, .075), fo: limb(skin, .06), el: joint(shirt, .075), sh: joint(shirt, .085), hand: joint(glove, .1) }));
    const legs = [-1, 1].map(s => ({ s, th: limb(pants, .1), sn: limb(pants, .085), kn: joint(pants, .1), foot: new THREE.Mesh(new THREE.BoxGeometry(.16, .1, .3), std(0x111111)), f: new THREE.Vector3(s * .2, .05, .05), ft: new THREE.Vector3(s * .2, .05, .05) }));
    legs.forEach(l => { l.foot.castShadow = true; scene.add(l.foot); });
    const hip = joint(pants, .22);

    // 2本の骨の IK。pole は曲げる向き
    function ik(a, b, l1, l2, pole) {
      const d = b.clone().sub(a); let len = d.length();
      len = Math.min(len, (l1 + l2) * .999); d.normalize();
      const ca = (l1 * l1 + len * len - l2 * l2) / (2 * l1 * len);
      const sa = Math.sqrt(Math.max(0, 1 - ca * ca));
      const p = pole.clone().sub(d.clone().multiplyScalar(pole.dot(d))).normalize();
      return a.clone().add(d.multiplyScalar(l1 * ca)).add(p.multiplyScalar(l1 * sa));
    }

    // 手：ドラッグで動かす目標と、実際の位置
    const HZ = .45;
    const hands = [-1, 1].map(s => ({ s, pos: new THREE.Vector3(s * .38, 1.3, HZ), target: new THREE.Vector3(s * .38, 1.3, HZ), vel: new THREE.Vector3(), ptr: null, off: new THREE.Vector3() }));
    const hipPos = new THREE.Vector3(0, 1.0, 0), hipVel = new THREE.Vector3();
    let tilt = 0, tiltV = 0, beat = 0;
    const shoulderW = (side) => torso.localToWorld(new THREE.Vector3(side * .33, .6, 0));

    function updateBody(dt, time) {
      // 手を目標へ。肩から届く範囲に収める
      for (const h of hands) {
        const prev = h.pos.clone();
        h.pos.lerp(h.target, 1 - Math.exp(-dt * 25));
        const sh = shoulderW(h.s), d = h.pos.clone().sub(sh);
        if (d.length() > ARM * 2 * .97) h.pos.copy(sh).add(d.setLength(ARM * 2 * .97));
        h.pos.y = Math.max(h.pos.y, .25);
        h.vel.copy(h.pos).sub(prev).divideScalar(Math.max(dt, 1e-4));
      }
      const act = Math.min(1, (hands[0].vel.length() + hands[1].vel.length()) / 6);
      beat += dt * (5 + act * 4);
      // 腰は両手の真ん中を追いかける（ばねで揺れる）
      const mx = (hands[0].pos.x + hands[1].pos.x) / 2, low = Math.min(hands[0].pos.y, hands[1].pos.y);
      const crouch = THREE.MathUtils.clamp(1.25 - low, 0, .38);
      const tx = mx, ty = 1.0 - crouch + Math.abs(Math.sin(beat)) * .04 * (.3 + act);
      hipVel.x += ((tx - hipPos.x) * 60 - hipVel.x * 9) * dt;
      hipVel.y += ((ty - hipPos.y) * 120 - hipVel.y * 14) * dt;
      hipPos.addScaledVector(hipVel, dt);
      const tt = THREE.MathUtils.clamp((hands[1].pos.y - hands[0].pos.y) * .25 - hipVel.x * .08, -.5, .5) + Math.sin(beat) * .05;
      tiltV += ((tt - tilt) * 80 - tiltV * 10) * dt; tilt += tiltV * dt;
      torso.position.copy(hipPos); torso.rotation.z = tilt;
      torso.rotation.y = Math.sin(beat * .5) * .15 * (.4 + act);
      head.rotation.z = -tilt * .6 + Math.sin(beat) * .12;
      head.rotation.x = Math.sin(beat * 2) * .06;
      mouth.scale.y = 1 + act * 1.5;
      hip.position.copy(hipPos); hip.scale.set(.24, .15, .2);
      // 腕
      for (const a of arms) {
        const h = hands[(a.s + 1) / 2], sh = shoulderW(a.s);
        const el = ik(sh, h.pos, ARM, ARM, new THREE.Vector3(a.s * 1, -1, -.4));
        placeLimb(a.up, sh, el); placeLimb(a.fo, el, h.pos);
        a.sh.position.copy(sh); a.el.position.copy(el); a.hand.position.copy(h.pos);
      }
      // 足：腰が離れたらステップ
      const fc = (legs[0].ft.x + legs[1].ft.x) / 2;
      if (Math.abs(hipPos.x - fc) > .22) { legs[0].ft.x = hipPos.x - .2; legs[1].ft.x = hipPos.x + .2; }
      for (const l of legs) {
        const k = 1 - Math.exp(-dt * 14), lift = l.f.distanceTo(l.ft);
        l.f.lerp(l.ft, k); l.f.y = .05 + Math.min(.15, lift * .8);
        const hp = new THREE.Vector3(hipPos.x + l.s * .14, hipPos.y - .05, 0);
        const ank = l.f.clone().add(new THREE.Vector3(0, .05, -.05));
        const kn = ik(hp, ank, LEG, LEG, new THREE.Vector3(l.s * .3, 0, 1));
        placeLimb(l.th, hp, kn); placeLimb(l.sn, kn, ank);
        l.kn.position.copy(kn); l.foot.position.copy(l.f).add(new THREE.Vector3(0, 0, .05));
      }
    }

    // ---------- 麺（自作の物理：粒をつないだひも。引っ張ると伸びて細くなり、細くなりすぎると切れる） ----------
    const STRETCH = 3.5, N = 160, R0 = .07, L0 = .8, VOL = Math.PI * R0 * R0 * L0, RAD = 12;
    const noodleMat = std(0xf3e2b6, { roughness: .45 });
    const strands = [];
    function makeStrand(pts, rest, vol, pinA, pinB) {
      const n = pts.length;
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * RAD * 3), 3));
      geo.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(n * RAD * 3), 3));
      const idx = [];
      for (let i = 0; i < n - 1; i++) for (let j = 0; j < RAD; j++) {
        const a = i * RAD + j, b = i * RAD + (j + 1) % RAD, c = a + RAD, d = b + RAD;
        idx.push(a, c, b, b, c, d);
      }
      geo.setIndex(idx);
      const mesh = new THREE.Mesh(geo, noodleMat); mesh.castShadow = true; mesh.frustumCulled = false; scene.add(mesh);
      const caps = [joint(noodleMat, R0), joint(noodleMat, R0)];
      const s = { n, p: pts.map(v => v.clone()), q: pts.map(v => v.clone()), rest, vol, pinA, pinB, mesh, caps, age: 0, fade: 1 };
      strands.push(s); return s;
    }
    function spawnNoodle() {
      const a = hands[0].pos, b = hands[1].pos, d = Math.max(a.distanceTo(b), .3);
      const pts = [], rest = [], vol = [];
      for (let i = 0; i < N; i++) pts.push(a.clone().lerp(b, i / (N - 1)));
      for (let i = 0; i < N - 1; i++) { rest.push(d / (N - 1)); vol.push(Math.max(VOL, Math.PI * R0 * R0 * d) / (N - 1)); }
      makeStrand(pts, rest, vol, 0, 1).age = 0;
      pop(.5);
    }
    const segR = (s, i) => Math.sqrt(s.vol[i] / (Math.PI * s.rest[i]));
    let stretchAmt = 0, respawnAt = -1;
    function breakStrand(s, k, time) {
      // k 番目の区間で切る
      const A = s.p.slice(0, k + 1), B = s.p.slice(k + 1);
      if (A.length < 2 || B.length < 2) return;
      const a = makeStrand(A, s.rest.slice(0, k), s.vol.slice(0, k), s.pinA, -1);
      const b = makeStrand(B, s.rest.slice(k + 1), s.vol.slice(k + 1), -1, s.pinB);
      a.q = s.q.slice(0, k + 1).map(v => v.clone()); b.q = s.q.slice(k + 1).map(v => v.clone());
      removeStrand(s);
      a.dropAt = b.dropAt = time + 1.2;
      respawnAt = time + 1.8;
      snap();
    }
    function removeStrand(s) {
      scene.remove(s.mesh); s.mesh.geometry.dispose(); s.caps.forEach(c => scene.remove(c));
      strands.splice(strands.indexOf(s), 1);
    }
    const tmp = new THREE.Vector3();

      e.preventDefault();
      const r = ecv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
      const k = Math.max(eview.fit, Math.min(eview.fit * 12, eview.k * Math.exp(-e.deltaY * .0015)));
      eview.x = mx - (mx - eview.x) / eview.k * k; eview.y = my - (my - eview.y) / eview.k * k; eview.k = k; snapFit(); erender();
    }, { passive: false });
    $('ebrush').addEventListener('click', () => { brushIdx = (brushIdx + 1) % BRUSH.length; const d = $('ebrush').firstChild; d.style.width = d.style.height = [5, 11, 20][brushIdx] + 'px'; });
    $('eerase').addEventListener('click', () => { erasing = !erasing; $('eerase').classList.toggle('on', erasing); });
    $('eundo').addEventListener('click', () => { const d = undoStack.pop(); if (d) { emctx.putImageData(d, 0, 0); erender(); updateDone(); } });
    $('ecancel').addEventListener('click', () => { edit.hidden = true; eimg = null; });
    $('edone').addEventListener('click', () => {
      const b = maskBox(); if (!b) return;
      const k = Math.min(1, 256 / Math.max(b.w, b.h)), c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(b.w * k)); c.height = Math.max(1, Math.round(b.h * k));
      const g = c.getContext('2d');
      g.drawImage(eimg, b.x, b.y, b.w, b.h, 0, 0, c.width, c.height);
      g.globalCompositeOperation = 'destination-in'; g.drawImage(emask, b.x, b.y, b.w, b.h, 0, 0, c.width, c.height);
      faceCanvas = c; setFace(c); store.set('face', c.toDataURL('image/png'));
      edit.hidden = true; eimg = null; drawFaceBtn();
    });
    drawFaceBtn(); loadSavedFace();

    // ---------- ループ ----------
    updateBody(1 / 60, 0);
    spawnNoodle();
    let last = performance.now(), time = 0;
    function loop(now) {
      const dt = Math.min(.033, (now - last) / 1000); last = now; time += dt;
      updateBody(dt, time);
      stepNoodles(dt, time);
      strands.forEach(drawStrand);
      for (const s of steams) {
        const k = (s.userData.p + time * .25) % 1;
        s.position.set(Math.sin(k * 9 + s.userData.p * 5) * .12, 1.2 + k * 1.4, 0);
        s.scale.setScalar(.6 + k); s.material.opacity = .25;
      }
      steamMat.opacity = .1;
      updateHum();
      renderer.render(scene, camera);
      recFrame(now);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
    window.__nd = { hands, strands };
  </script>
</body>
