  <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
  <script type="module">
    const DICT = {
      ja: { title: '麺ダンス', back: '← トップへ戻る', post: 'Xに投稿', rec: '撮影', load: '読み込めませんでした。通信を確認してください。',
            share: '火鍋の麺を踊りながら伸ばしました #麺ダンスゲーム' },
      ko: { title: '면 댄스', back: '← 처음으로', post: 'X에 게시', rec: '촬영', load: '불러오지 못했습니다. 연결을 확인해 주세요.',
            share: '훠궈 면을 춤추며 늘렸어요 #麺ダンスゲーム' },
      en: { title: 'Noodle Dance', back: '← Back to top', post: 'Post', rec: 'Record', load: 'Could not load. Please check your connection.',
            share: 'I danced and stretched hot pot noodles #麺ダンスゲーム' },
      th: { title: 'เต้นดึงเส้น', back: '← กลับหน้าแรก', post: 'โพสต์ลง X', rec: 'บันทึก', load: 'โหลดไม่สำเร็จ โปรดตรวจสอบการเชื่อมต่อ',
            share: 'เต้นไปดึงเส้นหม้อไฟไป #麺ダンスゲーム' },
    };
    const SHARE_URL = 'https://keifurukawafunnych.com/games/noodle-dance/';
    const store = {
      get(k, d) { try { const v = localStorage.getItem('noodle-dance:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
      set(k, v) { try { localStorage.setItem('noodle-dance:' + k, JSON.stringify(v)); } catch {} },
    };
    const autoLang = () => { for (const l of navigator.languages?.length ? navigator.languages : [navigator.language || '']) { const c = l.toLowerCase().slice(0, 2); if (['ja', 'ko', 'en', 'th'].includes(c)) return c; } return 'en'; };
    let lang = store.get('lang', autoLang());
    if (!DICT[lang]) lang = 'en';
    let muted = store.get('muted', false);
    const t = k => DICT[lang][k];

    let THREE;
    try { THREE = await import('three'); } catch {
      const m = document.getElementById('msg'); m.textContent = t('load'); m.style.display = 'flex';
      throw new Error('three.js load failed');
    }

    // ---------- 画面 ----------
    const stage = document.getElementById('stage');
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    stage.append(renderer.domElement);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x5a1e18);
    scene.fog = new THREE.Fog(0x5a1e18, 9, 18);
    const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 50);
    scene.add(new THREE.HemisphereLight(0xfff0dd, 0x502018, 1.1));
    const sun = new THREE.DirectionalLight(0xffffff, 1.8);
    sun.position.set(2.5, 6, 4); sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -2, near: 1, far: 15 });
    scene.add(sun);

    const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: .7, ...o });
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), std(0x7a4a2a));
    floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
    const wall = new THREE.Mesh(new THREE.PlaneGeometry(40, 12), std(0x8e2a1e));
    wall.position.set(0, 6, -4); scene.add(wall);
    // 奥の火鍋テーブル
    const steamMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .25, depthWrite: false });
    const steams = [];
    for (const x of [-3.4, 3.4]) {
      const g = new THREE.Group(); g.position.set(x, 0, -2.2); scene.add(g);
      const top = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, .08, 32), std(0x3b2418)); top.position.y = .8; g.add(top);
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(.1, .1, .8, 12), std(0x2a1a10)); leg.position.y = .4; g.add(leg);
      const pot = new THREE.Mesh(new THREE.CylinderGeometry(.5, .42, .28, 32), std(0xb8b8b8, { metalness: .8, roughness: .3 })); pot.position.y = .98; g.add(pot);
      const soup = new THREE.Mesh(new THREE.CircleGeometry(.47, 32), std(0xd8261a, { roughness: .2 })); soup.rotation.x = -Math.PI / 2; soup.position.y = 1.1; g.add(soup);
      for (let i = 0; i < 3; i++) { const s = new THREE.Mesh(new THREE.SphereGeometry(.25, 12, 8), steamMat); s.userData.p = i / 3; g.add(s); steams.push(s); }
    }
    // ちょうちん
    for (const x of [-2, 2]) {
      const l = new THREE.Mesh(new THREE.SphereGeometry(.3, 20, 14), new THREE.MeshStandardMaterial({ color: 0xff3a20, emissive: 0xc01808, emissiveIntensity: .8 }));
      l.scale.y = 1.25; l.position.set(x, 3.6, -3); scene.add(l);
    }

    // ---------- 踊る店員さん ----------
    const skin = std(0xf2c9a0), shirt = std(0x1c1c1c), pants = std(0x2a2a3a), glove = std(0xffffff, { roughness: .5 });
    const cyl = new THREE.CylinderGeometry(1, 1, 1, 14), ball = new THREE.SphereGeometry(1, 18, 12);
    function limb(mat, r) {
      const m = new THREE.Mesh(cyl, mat); m.castShadow = true; scene.add(m); m.userData.r = r; return m;
    }
    function joint(mat, r) { const m = new THREE.Mesh(ball, mat); m.scale.setScalar(r); m.castShadow = true; scene.add(m); return m; }
    const UP = new THREE.Vector3(0, 1, 0);
    function placeLimb(m, a, b) {
      const d = b.clone().sub(a), len = d.length();
      m.position.copy(a).add(b).multiplyScalar(.5);
      m.quaternion.setFromUnitVectors(UP, d.normalize());
      m.scale.set(m.userData.r, len, m.userData.r);
    }
    const torso = new THREE.Group(); scene.add(torso);
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(.26, .38, 6, 16), shirt); body.position.y = .36; body.castShadow = true; torso.add(body);
    const apron = new THREE.Mesh(new THREE.BoxGeometry(.4, .42, .04), std(0xc8231a)); apron.position.set(0, .22, .25); torso.add(apron);
    const head = new THREE.Group(); head.position.y = .9; torso.add(head);
    const face = new THREE.Mesh(ball, skin); face.scale.setScalar(.21); face.castShadow = true; head.add(face);
    const hair = new THREE.Mesh(new THREE.SphereGeometry(.22, 18, 12, 0, Math.PI * 2, 0, Math.PI * .45), std(0x111111)); hair.position.y = .02; hair.rotation.x = -.25; head.add(hair);
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(.2, .22, .1, 18), std(0xc8231a)); cap.position.set(0, .18, -.02); head.add(cap);
    for (const s of [-1, 1]) { const e = new THREE.Mesh(ball, std(0x111111)); e.scale.set(.025, .035, .02); e.position.set(s * .07, .03, .195); head.add(e); }
    const mouth = new THREE.Mesh(new THREE.TorusGeometry(.05, .012, 6, 12, Math.PI), std(0x7a1a10)); mouth.rotation.z = Math.PI; mouth.position.set(0, -.06, .195); head.add(mouth);
    const neck = new THREE.Mesh(cyl, skin); neck.scale.set(.07, .2, .07); neck.position.y = .72; torso.add(neck);

    const ARM = .46, LEG = .48;
    const arms = [-1, 1].map(s => ({ s, up: limb(shirt, .075), fo: limb(skin, .06), el: joint(shirt, .075), sh: joint(shirt, .085), hand: joint(glove, .1) }));
    const legs = [-1, 1].map(s => ({ s, th: limb(pants, .1), sn: limb(pants, .085), kn: joint(pants, .1), foot: new THREE.Mesh(new THREE.BoxGeometry(.16, .1, .3), std(0x111111)), f: new THREE.Vector3(s * .2, .05, .05), ft: new THREE.Vector3(s * .2, .05, .05) }));
    legs.forEach(l => { l.foot.castShadow = true; scene.add(l.foot); });
    const hip = joint(pants, .22);

    // 2本の骨の IK。pole は曲げる向き
    function ik(a, b, l1, l2, pole) {
      const d = b.clone().sub(a); let len = d.length();
      len = Math.min(len, (l1 + l2) * .999); d.normalize();
      const ca = (l1 * l1 + len * len - l2 * l2) / (2 * l1 * len);
      const sa = Math.sqrt(Math.max(0, 1 - ca * ca));
      const p = pole.clone().sub(d.clone().multiplyScalar(pole.dot(d))).normalize();
      return a.clone().add(d.multiplyScalar(l1 * ca)).add(p.multiplyScalar(l1 * sa));
    }

    // 手：ドラッグで動かす目標と、実際の位置
    const HZ = .45;
    const hands = [-1, 1].map(s => ({ s, pos: new THREE.Vector3(s * .38, 1.3, HZ), target: new THREE.Vector3(s * .38, 1.3, HZ), vel: new THREE.Vector3(), ptr: null, off: new THREE.Vector3() }));
    const hipPos = new THREE.Vector3(0, 1.0, 0), hipVel = new THREE.Vector3();
    let tilt = 0, tiltV = 0, beat = 0;
    const shoulderW = (side) => torso.localToWorld(new THREE.Vector3(side * .33, .6, 0));

    function updateBody(dt, time) {
      // 手を目標へ。肩から届く範囲に収める
      for (const h of hands) {
        const prev = h.pos.clone();
        h.pos.lerp(h.target, 1 - Math.exp(-dt * 25));
        const sh = shoulderW(h.s), d = h.pos.clone().sub(sh);
        if (d.length() > ARM * 2 * .97) h.pos.copy(sh).add(d.setLength(ARM * 2 * .97));
        h.pos.y = Math.max(h.pos.y, .25);
        h.vel.copy(h.pos).sub(prev).divideScalar(Math.max(dt, 1e-4));
      }
      const act = Math.min(1, (hands[0].vel.length() + hands[1].vel.length()) / 6);
      beat += dt * (5 + act * 4);
      // 腰は両手の真ん中を追いかける（ばねで揺れる）
      const mx = (hands[0].pos.x + hands[1].pos.x) / 2, low = Math.min(hands[0].pos.y, hands[1].pos.y);
      const crouch = THREE.MathUtils.clamp(1.25 - low, 0, .38);
      const tx = mx, ty = 1.0 - crouch + Math.abs(Math.sin(beat)) * .04 * (.3 + act);
      hipVel.x += ((tx - hipPos.x) * 60 - hipVel.x * 9) * dt;
      hipVel.y += ((ty - hipPos.y) * 120 - hipVel.y * 14) * dt;
      hipPos.addScaledVector(hipVel, dt);
      const tt = THREE.MathUtils.clamp((hands[1].pos.y - hands[0].pos.y) * .25 - hipVel.x * .08, -.5, .5) + Math.sin(beat) * .05;
      tiltV += ((tt - tilt) * 80 - tiltV * 10) * dt; tilt += tiltV * dt;
      torso.position.copy(hipPos); torso.rotation.z = tilt;
      torso.rotation.y = Math.sin(beat * .5) * .15 * (.4 + act);
      head.rotation.z = -tilt * .6 + Math.sin(beat) * .12;
      head.rotation.x = Math.sin(beat * 2) * .06;
      mouth.scale.y = 1 + act * 1.5;
      hip.position.copy(hipPos); hip.scale.set(.24, .15, .2);
      // 腕
      for (const a of arms) {
        const h = hands[(a.s + 1) / 2], sh = shoulderW(a.s);
        const el = ik(sh, h.pos, ARM, ARM, new THREE.Vector3(a.s * 1, -1, -.4));
        placeLimb(a.up, sh, el); placeLimb(a.fo, el, h.pos);
        a.sh.position.copy(sh); a.el.position.copy(el); a.hand.position.copy(h.pos);
      }
      // 足：腰が離れたらステップ
      const fc = (legs[0].ft.x + legs[1].ft.x) / 2;
      if (Math.abs(hipPos.x - fc) > .22) { legs[0].ft.x = hipPos.x - .2; legs[1].ft.x = hipPos.x + .2; }
      for (const l of legs) {
        const k = 1 - Math.exp(-dt * 14), lift = l.f.distanceTo(l.ft);
        l.f.lerp(l.ft, k); l.f.y = .05 + Math.min(.15, lift * .8);
        const hp = new THREE.Vector3(hipPos.x + l.s * .14, hipPos.y - .05, 0);
        const ank = l.f.clone().add(new THREE.Vector3(0, .05, -.05));
        const kn = ik(hp, ank, LEG, LEG, new THREE.Vector3(l.s * .3, 0, 1));
        placeLimb(l.th, hp, kn); placeLimb(l.sn, kn, ank);
        l.kn.position.copy(kn); l.foot.position.copy(l.f).add(new THREE.Vector3(0, 0, .05));
      }
    }

    // ---------- 麺（自作の物理：粒をつないだひも。引っ張ると伸びて細くなり、細くなりすぎると切れる） ----------
    const STRETCH = 6, N = 64, R0 = .07, L0 = .8, VOL = Math.PI * R0 * R0 * L0, RAD = 8;
    const noodleMat = std(0xf3e2b6, { roughness: .45 });
    const strands = [];
    function makeStrand(pts, rest, vol, pinA, pinB) {
      const n = pts.length;
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * RAD * 3), 3));
      geo.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(n * RAD * 3), 3));
      const idx = [];
      for (let i = 0; i < n - 1; i++) for (let j = 0; j < RAD; j++) {
        const a = i * RAD + j, b = i * RAD + (j + 1) % RAD, c = a + RAD, d = b + RAD;
        idx.push(a, c, b, b, c, d);
      }
      geo.setIndex(idx);
      const mesh = new THREE.Mesh(geo, noodleMat); mesh.castShadow = true; mesh.frustumCulled = false; scene.add(mesh);
      const caps = [joint(noodleMat, R0), joint(noodleMat, R0)];
      const s = { n, p: pts.map(v => v.clone()), q: pts.map(v => v.clone()), rest, vol, pinA, pinB, mesh, caps, age: 0, fade: 1 };
      strands.push(s); return s;
    }
    function spawnNoodle() {
      const a = hands[0].pos, b = hands[1].pos, d = Math.max(a.distanceTo(b), .3);
      const pts = [], rest = [], vol = [];
      for (let i = 0; i < N; i++) pts.push(a.clone().lerp(b, i / (N - 1)));
      for (let i = 0; i < N - 1; i++) { rest.push(d / (N - 1)); vol.push(Math.max(VOL, Math.PI * R0 * R0 * d) / (N - 1)); }
      makeStrand(pts, rest, vol, 0, 1).age = 0;
      pop(.5);
    }
    const segR = (s, i) => Math.sqrt(s.vol[i] / (Math.PI * s.rest[i]));
    let stretchAmt = 0, respawnAt = -1;
    function breakStrand(s, k, time) {
      // k 番目の区間で切る
      const A = s.p.slice(0, k + 1), B = s.p.slice(k + 1);
      if (A.length < 2 || B.length < 2) return;
      const a = makeStrand(A, s.rest.slice(0, k), s.vol.slice(0, k), s.pinA, -1);
      const b = makeStrand(B, s.rest.slice(k + 1), s.vol.slice(k + 1), -1, s.pinB);
      a.q = s.q.slice(0, k + 1).map(v => v.clone()); b.q = s.q.slice(k + 1).map(v => v.clone());
      removeStrand(s);
      a.dropAt = b.dropAt = time + 1.2;
      respawnAt = time + 1.8;
      snap();
    }
    function removeStrand(s) {
      scene.remove(s.mesh); s.mesh.geometry.dispose(); s.caps.forEach(c => scene.remove(c));
      strands.splice(strands.indexOf(s), 1);
    }
    const tmp = new THREE.Vector3();
    function stepNoodles(dt, time) {
      const SUB = 4, h = dt / SUB;
      stretchAmt = 0;
      for (const s of [...strands]) {
        s.age += dt;
        if (s.dropAt && time > s.dropAt) { s.pinA = s.pinB = -1; }
        const free = s.pinA < 0 && s.pinB < 0;
        if (free) { s.fade -= dt * .5; if (s.fade <= 0) { removeStrand(s); continue; } }
        const { p, q, rest, n } = s;
        for (let sub = 0; sub < SUB; sub++) {
          for (let i = 0; i < n; i++) {
            const v = p[i], o = q[i];
            tmp.copy(v).sub(o).multiplyScalar(.995);
            o.copy(v); v.add(tmp); v.y -= 9.8 * h * h;
            if (v.y < .02) { v.y = .02; o.x = v.x * .2 + o.x * .8; o.z = v.z * .2 + o.z * .8; }
          }
          if (s.pinA >= 0) p[0].copy(hands[s.pinA].pos);
          if (s.pinB >= 0) p[n - 1].copy(hands[s.pinB].pos);
          // 張っている区間は伸びる（細い所ほど伸びやすい）
          if (!free) {
            for (let i = 0; i < n - 1; i++) {
              const d = p[i].distanceTo(p[i + 1]), st = d / rest[i] - 1;
              if (st > .04) {
                const r = segR(s, i), g = rest[i] * Math.min(st - .04, .5) * STRETCH * Math.sqrt(R0 / r) * h;
                rest[i] += g; stretchAmt += g;
              }
            }
          }
          for (let it = 0; it < 12; it++) {
            const fwd = it % 2 === 0;
            for (let jj = 0; jj < n - 1; jj++) {
              const i = fwd ? jj : n - 2 - jj;
              const a = p[i], b = p[i + 1];
              tmp.copy(b).sub(a); const d = tmp.length() || 1e-6;
              const wa = (i === 0 && s.pinA >= 0) ? 0 : 1, wb = (i + 1 === n - 1 && s.pinB >= 0) ? 0 : 1;
              if (wa + wb === 0) continue;
              const c = (d - rest[i]) / d * .9 / (wa + wb);
              a.addScaledVector(tmp, c * wa); b.addScaledVector(tmp, -c * wb);
            }
          }
        }
        // 切れる？
        if (!free) {
          let k = -1, mr = 1e9;
          // 5区間ならした太さで見る。切る場所は端に寄りすぎないように
          for (let i = 2; i < n - 3; i++) { let r = 0; for (let j = -2; j <= 2; j++) r += segR(s, i + j); r /= 5; if (r < mr) { mr = r; k = i; } }
          if (mr < R0 * .2) breakStrand(s, Math.round(THREE.MathUtils.clamp(k, n * .2, n * .8)), time);
        }
      }
      if (respawnAt > 0 && time > respawnAt) { respawnAt = -1; spawnNoodle(); }
    }

    // 太さの違う管を毎フレーム作り直す
    const T = new THREE.Vector3(), Nn = new THREE.Vector3(), Bn = new THREE.Vector3(), ref = new THREE.Vector3();
    function drawStrand(s) {
      const { p, n } = s, pos = s.mesh.geometry.attributes.position.array, nor = s.mesh.geometry.attributes.normal.array;
      ref.set(0, 0, 1);
      const shrink = Math.min(1, s.fade * 2);
      let r0 = 0, r1 = 0;
      for (let i = 0; i < n; i++) {
        T.copy(p[Math.min(i + 1, n - 1)]).sub(p[Math.max(i - 1, 0)]).normalize();
        // 前の輪の向きを引き継ぐ（ねじれないように）
        Nn.copy(ref).addScaledVector(T, -ref.dot(T)); if (Nn.lengthSq() < 1e-6) Nn.set(1, 0, 0).cross(T); Nn.normalize();
        Bn.crossVectors(T, Nn).normalize(); ref.copy(Nn);
        const r = (i === 0 ? segR(s, 0) : i === n - 1 ? segR(s, n - 2) : (segR(s, i - 1) + segR(s, i)) / 2) * shrink;
        if (i === 0) r0 = r; if (i === n - 1) r1 = r;
        for (let j = 0; j < RAD; j++) {
          const an = j / RAD * Math.PI * 2, cx = Math.cos(an), cy = Math.sin(an);
          const nx = Nn.x * cx + Bn.x * cy, ny = Nn.y * cx + Bn.y * cy, nz = Nn.z * cx + Bn.z * cy;
          const o = (i * RAD + j) * 3;
          nor[o] = nx; nor[o + 1] = ny; nor[o + 2] = nz;
          pos[o] = p[i].x + nx * r; pos[o + 1] = p[i].y + ny * r; pos[o + 2] = p[i].z + nz * r;
        }
      }
      s.mesh.geometry.attributes.position.needsUpdate = true; s.mesh.geometry.attributes.normal.needsUpdate = true;
      s.caps[0].position.copy(p[0]); s.caps[0].scale.setScalar(r0);
      s.caps[1].position.copy(p[n - 1]); s.caps[1].scale.setScalar(r1);
    }

    // ---------- 音 ----------
    let ac = null, hum = null, humGain = null;
    function audio() {
      if (ac) return ac;
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        hum = ac.createOscillator(); hum.type = 'triangle'; humGain = ac.createGain(); humGain.gain.value = 0;
        hum.connect(humGain).connect(ac.destination); hum.start();
      } catch { ac = null; }
      return ac;
    }
    function snap() {
      if (muted || !ac) return;
      const len = .12, buf = ac.createBuffer(1, ac.sampleRate * len, ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 4);
      const src = ac.createBufferSource(); src.buffer = buf;
      const g = ac.createGain(); g.gain.value = .6; src.connect(g).connect(ac.destination); src.start();
    }
    function pop(v) {
      if (muted || !ac) return;
      const o = ac.createOscillator(), g = ac.createGain(), now = ac.currentTime;
      o.frequency.setValueAtTime(300, now); o.frequency.exponentialRampToValueAtTime(700, now + .12);
      g.gain.setValueAtTime(.25 * v, now); g.gain.exponentialRampToValueAtTime(.001, now + .15);
      o.connect(g).connect(ac.destination); o.start(now); o.stop(now + .16);
    }
    function updateHum() {
      if (!ac) return;
      const total = strands.reduce((m, s) => Math.max(m, s.pinA >= 0 || s.pinB >= 0 ? s.rest.reduce((a, b) => a + b, 0) : 0), 0);
      const v = muted ? 0 : Math.min(.12, stretchAmt * 6);
      humGain.gain.setTargetAtTime(v, ac.currentTime, .04);
      hum.frequency.setTargetAtTime(160 + Math.min(total, 8) * 70, ac.currentTime, .05);
    }

    // ---------- ドラッグ ----------
    const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -HZ);
    function hit(e) {
      const r = renderer.domElement.getBoundingClientRect();
      ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
      ray.setFromCamera(ndc, camera);
      return ray.ray.intersectPlane(plane, new THREE.Vector3());
    }
    const cv = renderer.domElement;
    cv.addEventListener('pointerdown', e => {
      audio(); ac?.resume?.();
      const p = hit(e); if (!p) return;
      const free = hands.filter(h => h.ptr === null);
      if (!free.length) return;
      free.sort((a, b) => a.pos.distanceTo(p) - b.pos.distanceTo(p));
      const h = free[0]; h.ptr = e.pointerId;
      h.off.copy(h.pos).sub(p);
      if (h.off.length() > .35) h.off.set(0, 0, 0);
      try { cv.setPointerCapture(e.pointerId); } catch {}
      e.preventDefault();
    });
    cv.addEventListener('pointermove', e => {
      const h = hands.find(h => h.ptr === e.pointerId); if (!h) return;
      const p = hit(e); if (p) h.target.copy(p).add(h.off);
    });
    const up = e => { const h = hands.find(h => h.ptr === e.pointerId); if (h) { h.ptr = null; h.target.copy(h.pos); } };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
    document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

    // ---------- カメラ ----------
    function resize() {
      const w = innerWidth, h = innerHeight;
      renderer.setSize(w, h); camera.aspect = w / h;
      const tn = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
      const D = Math.max(1.7 / tn, 1.3 / (tn * camera.aspect));
      camera.position.set(D * .15, 1.45 + D * .04, D); camera.lookAt(0, 1.05, 0);
      camera.updateProjectionMatrix();
    }
    addEventListener('resize', resize); resize();

    // ---------- 動画撮影 ----------
    const VFPS = 30, VSEC = 6, VW = 720, VH = 1280;
    let rec = null, shareFile = null, noVideo = false;
    async function startRec() {
      if (rec) return;
      shareFile = null; noVideo = false;
      if (!('VideoEncoder' in window) || !window.Mp4Muxer) { noVideo = true; rec = { fake: true, t0: performance.now() }; render(); return; }
      let cfg = null;
      for (const codec of ['avc1.640028', 'avc1.4d0028', 'avc1.42001f']) {
        const c = { codec, width: VW, height: VH, bitrate: 5e6, framerate: VFPS };
        try { if ((await VideoEncoder.isConfigSupported(c)).supported) { cfg = c; break; } } catch {}
      }
      if (!cfg) { noVideo = true; rec = { fake: true, t0: performance.now() }; render(); return; }
      const out = document.createElement('canvas'); out.width = VW; out.height = VH;
      const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec: 'avc', width: VW, height: VH, frameRate: VFPS }, fastStart: 'in-memory' });
      rec = { out, ctx: out.getContext('2d'), muxer, i: 0, failed: false, t0: performance.now() };
      rec.enc = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: () => { rec && (rec.failed = true); } });
      rec.enc.configure(cfg);
      render();
    }
    // 描いた直後に呼ぶ。経過時間に合わせてコマを足す
    function recFrame(now) {
      const r = rec; if (!r) return;
      const el = (now - r.t0) / 1000;
      drawRecRing(Math.min(1, el / VSEC));
      if (r.fake) { if (el >= VSEC) { rec = null; render(); } return; }
      if (r.failed) { try { r.enc.close(); } catch {} rec = null; noVideo = true; render(); return; }
      if (r.i < Math.min(VFPS * VSEC, Math.floor(el * VFPS) + 1)) {
        const cw = cv.width, ch = cv.height, sc = Math.max(VW / cw, VH / ch);
        const sw = VW / sc, sh = VH / sc;
        r.ctx.drawImage(cv, (cw - sw) / 2, (ch - sh) / 2, sw, sh, 0, 0, VW, VH);
        const f = new VideoFrame(r.out, { timestamp: Math.round(r.i * 1e6 / VFPS), duration: Math.round(1e6 / VFPS) });
        r.enc.encode(f, { keyFrame: r.i % 60 === 0 }); f.close();
        r.i++;
      }
      if (r.i >= VFPS * VSEC) {
        rec = null;
        (async () => {
          await r.enc.flush(); r.enc.close(); r.muxer.finalize();
          if (r.failed) { noVideo = true; render(); return; }
          shareFile = new File([r.muxer.target.buffer], 'noodle-dance.mp4', { type: 'video/mp4' });
          render();
        })().catch(() => render());
      }
    }

    // ---------- UI ----------
    const recBtn = document.getElementById('rec'), post = document.getElementById('post');
    let everRec = false;
    function drawRecRing(k) {
      const C = 2 * Math.PI * 30;
      recBtn.innerHTML = `<svg viewBox="0 0 68 68"><circle cx="34" cy="34" r="30" fill="none" stroke="#e8d8c8" stroke-width="5"/>`
        + (rec ? `<circle cx="34" cy="34" r="30" fill="none" stroke="#e0281a" stroke-width="5" stroke-dasharray="${C * k} ${C}" transform="rotate(-90 34 34)"/><rect x="25" y="25" width="18" height="18" rx="3" fill="#e0281a"/>`
               : `<circle cx="34" cy="34" r="16" fill="#e0281a"/>`) + `</svg>`;
    }
    function render() {
      document.documentElement.lang = lang;
      document.title = t('title');
      document.getElementById('back').textContent = t('back');
      document.getElementById('lang').value = lang;
      document.getElementById('sound').innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>${muted ? '<path d="M17 9l5 6M22 9l-5 6"/>' : '<path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>'}</svg>`;
      recBtn.setAttribute('aria-label', t('rec')); recBtn.disabled = !!rec;
      drawRecRing(0);
      post.hidden = !everRec;
      post.textContent = t('post');
      post.href = `https://x.com/intent/post?text=${encodeURIComponent(t('share'))}&url=${encodeURIComponent(SHARE_URL)}`;
      if (!matchMedia('(pointer: coarse)').matches) { post.target = '_blank'; post.rel = 'noopener'; } else { post.removeAttribute('target'); }
      post.classList.toggle('wait', !shareFile && !noVideo);
    }
    recBtn.addEventListener('click', () => { everRec = true; audio(); startRec(); });
    post.addEventListener('click', e => {
      const coarse = matchMedia('(pointer: coarse)').matches;
      if (coarse && navigator.share) {
        e.preventDefault();
        const text = `${t('share')}\n${SHARE_URL}`;
        const data = shareFile && navigator.canShare?.({ files: [shareFile] }) ? { files: [shareFile], text } : { text };
        navigator.share(data).catch(() => {});
        return;
      }
      if (!coarse && shareFile) {
        const d = document.createElement('a');
        d.href = URL.createObjectURL(shareFile); d.download = shareFile.name; d.click();
        setTimeout(() => URL.revokeObjectURL(d.href), 10000);
      }
    });
    document.getElementById('lang').addEventListener('change', e => { lang = e.target.value; store.set('lang', lang); render(); });
    document.getElementById('sound').addEventListener('click', () => { muted = !muted; store.set('muted', muted); audio(); render(); });
    render();

    // ---------- ループ ----------
    updateBody(1 / 60, 0);
    spawnNoodle();
    let last = performance.now(), time = 0;
    function loop(now) {
      const dt = Math.min(.033, (now - last) / 1000); last = now; time += dt;
      updateBody(dt, time);
      stepNoodles(dt, time);
      strands.forEach(drawStrand);
      for (const s of steams) {
        const k = (s.userData.p + time * .25) % 1;
        s.position.set(Math.sin(k * 9 + s.userData.p * 5) * .12, 1.2 + k * 1.4, 0);
        s.scale.setScalar(.6 + k); s.material.opacity = .25;
      }
      steamMat.opacity = .1;
      updateHum();
      renderer.render(scene, camera);
      recFrame(now);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
    window.__nd = { hands, strands };
  </script>
</body>
</html>
