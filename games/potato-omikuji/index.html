  <header>
    <a id="back" href="../../">← トップへ戻る</a>
    <button id="sound" aria-label="sound"></button>

  </header>
  <div id="stage"><div id="result"><b></b><span></span></div><div id="msg"></div></div>
  <div id="controls"></div>

  <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
  <script>
    // CDN が読めないときの一言
    setTimeout(() => { if (!window.POTATO_READY) { const m = document.getElementById('msg'); m.style.display = 'flex'; m.textContent = 'Failed to load. Please reload. / 読み込めませんでした。再読み込みしてください。'; } }, 8000);
  </script>
  <script type="module">
    import * as THREE from 'three';
    window.POTATO_READY = true;

    const SHARE_URL = 'https://keifurukawafunnych.com/games/potato-omikuji/';

    // ---------- 言語 ----------
    const store = {
      get(k, d) { try { const v = localStorage.getItem('potato-omikuji:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
      set(k, v) { try { localStorage.setItem('potato-omikuji:' + k, JSON.stringify(v)); } catch {} },
    };
    const autoLang = () => { for (const l of navigator.languages?.length ? navigator.languages : [navigator.language || '']) { const c = l.toLowerCase().slice(0, 2); if (['ja', 'ko', 'en', 'th'].includes(c)) return c; } return 'en'; };
    const DICT = {
      ja: { title: 'ポテトおみくじ', back: '← トップへ戻る', again: 'もう一回', post: 'Xに投稿', best: s => `自己ベスト ${s}`, share: s => `${s}のポテトが出た #ポテトおみくじゲーム` },
      ko: { title: '감자튀김 뽑기', back: '← 처음으로', again: '다시 뽑기', post: 'X에 게시', best: s => `최고 기록 ${s}`, share: s => `${s}짜리 감자튀김이 나왔다 #ポテトおみくじゲーム` },
      en: { title: 'Fry Fortune', back: '← Back to top', again: 'Pull again', post: 'Post on X', best: s => `Best ${s}`, share: s => `I pulled a ${s} fry #ポテトおみくじゲーム` },
      th: { title: 'เสี่ยงทายเฟรนช์ฟราย', back: '← กลับหน้าแรก', again: 'ดึงอีกครั้ง', post: 'โพสต์ลง X', best: s => `สถิติดีที่สุด ${s}`, share: s => `ได้เฟรนช์ฟรายยาว ${s} #ポテトおみくじゲーム` },
    };
    let lang = store.get('lang', null) || autoLang();
    const t = k => DICT[lang][k];
    const langSel = document.getElementById('lang');
    langSel.value = lang;
    langSel.addEventListener('change', () => { lang = langSel.value; store.set('lang', lang); applyLang(); });
    function applyLang() {
      document.documentElement.lang = lang;
      document.title = t('title');
      document.getElementById('back').textContent = t('back');
      renderControls();
      if (state === 'result') { showResult(); prepareShare(); }
    }

    // ---------- 音 ----------
    let soundOn = store.get('sound', true);
    const soundBtn = document.getElementById('sound');
    const drawSoundBtn = () => {
      soundBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>${soundOn ? '<path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>' : '<path d="M17 9l5 6M22 9l-5 6"/>'}</svg>`;
    };
    drawSoundBtn();
    soundBtn.addEventListener('click', () => { soundOn = !soundOn; store.set('sound', soundOn); drawSoundBtn(); });
    let ac = null;
    function initAudio() {
      if (ac) return;
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        const o = ac.createOscillator(), g = ac.createGain(); g.gain.value = 0;
        o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.05);
      } catch { ac = null; }
    }
    addEventListener('pointerdown', initAudio, { capture: true });
    addEventListener('keydown', initAudio, { capture: true });
    // 引く音: 1cmごとに短くキュッと鳴り、だんだん高くなる
    function tick(cm) {
      if (!soundOn || !ac) return;
      const now = ac.currentTime, f = 260 * Math.pow(2, Math.min(cm, 60) / 24);
      const o = ac.createOscillator(); o.type = 'triangle';
      o.frequency.setValueAtTime(f, now);
      o.frequency.linearRampToValueAtTime(f * 1.15, now + 0.06);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.12, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      o.connect(g).connect(ac.destination);
      o.start(now); o.stop(now + 0.1);
    }
    function popSound(big) {
      if (!soundOn || !ac) return;
      const now = ac.currentTime;
      const o = ac.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(big ? 900 : 600, now);
      o.frequency.exponentialRampToValueAtTime(big ? 1800 : 1100, now + 0.08);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.3, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + (big ? 0.6 : 0.25));
      o.connect(g).connect(ac.destination);
      o.start(now); o.stop(now + 0.7);
      if (big) [1320, 1760, 2200].forEach((f, i) => {
        const o2 = ac.createOscillator(), g2 = ac.createGain(), t0 = now + 0.12 + i * 0.1;
        o2.frequency.value = f; g2.gain.setValueAtTime(0.15, t0); g2.gain.exponentialRampToValueAtTime(0.001, t0 + 0.4);
        o2.connect(g2).connect(ac.destination); o2.start(t0); o2.stop(t0 + 0.45);
      });
    }

    // ---------- 3D（1単位 = 1cm） ----------
    const stage = document.getElementById('stage');
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    stage.prepend(renderer.domElement);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#ffe6b8');
    const camera = new THREE.PerspectiveCamera(35, 1, 0.5, 2000);
    scene.add(new THREE.HemisphereLight('#fff6e0', '#c08850', 1.6));
    const sun = new THREE.DirectionalLight('#ffffff', 1.8);
    sun.position.set(20, 40, 30);
    scene.add(sun);

    const floor = new THREE.Mesh(new THREE.CircleGeometry(400, 64), new THREE.MeshStandardMaterial({ color: '#f5c98a', roughness: 1 }));
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    // ポテトの入れ物（赤い紙の箱。上が広い四角すい台）
    const BOX_H = 11, BOX_TOP_W = 10, BOX_BOT_W = 7, BOX_D = 0.55;
    const box = new THREE.Group();
    scene.add(box);
    const boxGeo = new THREE.CylinderGeometry(BOX_TOP_W / Math.SQRT2, BOX_BOT_W / Math.SQRT2, BOX_H, 4, 1, true);
    boxGeo.rotateY(Math.PI / 4);
    boxGeo.scale(1, 1, BOX_D);
    boxGeo.translate(0, BOX_H / 2, 0);
    const red = new THREE.MeshStandardMaterial({ color: '#d9302a', roughness: 0.6, side: THREE.DoubleSide });
    box.add(new THREE.Mesh(boxGeo, red));
    const bottom = new THREE.Mesh(new THREE.PlaneGeometry(BOX_BOT_W, BOX_BOT_W * BOX_D), red);
    bottom.rotation.x = -Math.PI / 2; bottom.position.y = 0.01;
    box.add(bottom);
    // 正面の黄色いアーチ模様
    const arch = new THREE.Mesh(new THREE.TorusGeometry(2.2, 0.35, 8, 32, Math.PI), new THREE.MeshStandardMaterial({ color: '#ffc81e', roughness: 0.5 }));
    arch.position.set(0, 3.8, BOX_TOP_W * BOX_D / 2 * 0.86 + 0.25);
    arch.rotation.x = -0.14;
    box.add(arch);

    const FRY_W = 0.8;
    const fryGeo = new THREE.BoxGeometry(FRY_W, 1, FRY_W); fryGeo.translate(0, 0.5, 0);
    const fryMat = new THREE.MeshStandardMaterial({ color: '#f4c552', roughness: 0.75 });
    // 箱の中のポテト（飾り）
    const rand = (a, b) => a + Math.random() * (b - a);
    for (let i = 0; i < 26; i++) {
      const m = new THREE.Mesh(fryGeo, fryMat);
      const x = rand(-2.6, 2.6), z = rand(-1.1, 1.1);
      if (Math.abs(x) < 1 && Math.abs(z) < 1) continue;
      m.scale.y = rand(11, 16);
      m.position.set(x, 1, z);
      m.rotation.set(rand(-0.06, 0.06), rand(0, Math.PI), x * -0.06 + rand(-0.05, 0.05));
      box.add(m);
    }

    // 引くポテト
    const pickMat = new THREE.MeshStandardMaterial({ color: '#f4c552', roughness: 0.7, emissive: '#000000' });
    const pick = new THREE.Mesh(fryGeo, pickMat);
    box.add(pick);

    // ものさし（10cmごとの目盛りの絵をくり返す）
    const rc = document.createElement('canvas'); rc.width = 64; rc.height = 640;
    {
      const g = rc.getContext('2d');
      g.fillStyle = '#fffbe8'; g.fillRect(0, 0, 64, 640);
      g.fillStyle = '#5a2a10';
      for (let i = 0; i < 20; i++) {
        const y = 640 - i * 32, w = i % 10 === 0 ? 40 : i % 2 === 0 ? 26 : 16;
        g.fillRect(0, y - 3, w, 6);
      }
    }
    const rulerTex = new THREE.CanvasTexture(rc);
    rulerTex.colorSpace = THREE.SRGBColorSpace;
    rulerTex.wrapT = THREE.RepeatWrapping;
    rulerTex.anisotropy = 4;
    const ruler = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 1), new THREE.MeshBasicMaterial({ map: rulerTex }));
    ruler.geometry.translate(0, 0.5, 0);
    scene.add(ruler);

    // ---------- 長さ ----------
    // ほとんどは5〜12cm、まれに20cm超え、ごくまれに40cm超え
    const rollLength = () => Math.round((3.5 + -Math.log(1 - Math.random()) * 4.5) * 10) / 10;
    const fmt = L => `${L.toFixed(1)}cm`;
    const RIM = BOX_H - 0.5;

    let state = 'idle', L = 8, best = store.get('best', 0), isNewBest = false;
    let pulled = 0, grabbing = false, lastY = 0, keyHold = false, lastTick = 0, needSnap = false;
    const cam = { y: 9, d: 60, x: 0 };
    // 引く前に箱から出ている長さと、抜けきるまでに引く長さ
    const PEEK = 2.5;
    const needPull = () => L - PEEK + 0.6;
    const pickBase = () => RIM + PEEK - L;

    function reset() {
      state = 'idle';
      L = rollLength();
      pulled = 0; grabbing = false; lastTick = 0;
      pick.scale.y = L;
      pick.position.set(0, pickBase(), 0);
      pick.rotation.set(0, 0, 0);
      pickMat.emissive.set('#000000');
      pickMat.color.set('#f4c552');
      ruler.visible = false;
      resultEl.style.display = 'none';
      snap = null; needSnap = false;
      renderControls();
    }
    // 自分で引いた分だけ抜ける
    function pullBy(dy) {
      if (state === 'result' || dy === 0) return;
      state = 'pull';
      pulled = Math.max(0, Math.min(needPull(), pulled + dy));
      // 1cm引くごとにキュッと鳴る（少しずつ高く）
      const cm = Math.floor(pulled);
      if (cm > lastTick) { lastTick = cm; tick(cm); }
      if (cm < lastTick) lastTick = cm;
      if (pulled >= needPull()) finish();
    }
    function finish() {
      state = 'result'; grabbing = false; keyHold = false;
      isNewBest = L > best;
      if (isNewBest) { best = L; store.set('best', best); }
      // 長いほどきつね色、40cm超えは光る
      pickMat.color.set(L >= 20 ? '#f0a83a' : '#f4c552');
      pickMat.emissive.set(L >= 40 ? '#7a4a00' : '#000000');
      ruler.visible = true;
      ruler.scale.y = Math.ceil(L) + 1;
      rulerTex.repeat.set(1, ruler.scale.y / 10);
      rulerTex.offset.set(0, 0);
      popSound(L >= 20);
      showResult();
      resultEl.style.display = 'flex';
      needSnap = true;
      renderControls();
    }

    // 画面サイズに合わせて、見せたい範囲（下端〜上端、幅）が入るカメラ位置を求める
    const resultEl = document.getElementById('result');
    function frameFor(y0, y1, w) {
      const aspect = camera.aspect, tan = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
      // 結果の文字のぶん、縦長なら上を、横長なら左を空ける
      const side = state === 'result' && aspect >= 1.25 && !shooting;
      const topFrac = state === 'result' && !side ? 0.26 : 0.08;
      const bot = shooting ? 0.1 : 0.04;
      const h = (y1 - y0) / (1 - topFrac - bot);
      const wFrac = side ? 0.45 : 1;
      const d = Math.max(h / 2 / tan, w / 2 / (tan * aspect * wFrac)) * 1.02;
      // 横長のときは、中身が画面の右寄り（75%の位置）に来るようカメラを左へずらす
      const x = side ? -0.5 * tan * aspect * d : 0;
      return { y: y0 - h * bot + h / 2, d, x };
    }
    function resize() {
      const w = stage.clientWidth, h = stage.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / Math.max(1, h);
      camera.updateProjectionMatrix();
    }
    addEventListener('resize', resize);
    resize();

    let time = 0;
    function update(dt) {
      time += dt;
      if (keyHold) pullBy(dt * 12);
      let y = pickBase() + pulled;
      if (state === 'idle') {
        // 引けそうに見えるよう、ときどきポテトが少し浮く
        const k = time % 1.6;
        y += k < 0.5 ? Math.sin(k / 0.5 * Math.PI) * 0.8 : 0;
      }
      if (state === 'result') y += 0.6;
      pick.position.y += (y - pick.position.y) * (state === 'result' ? 1 - Math.exp(-dt * 12) : 1);
      pick.rotation.z = state === 'pull' && grabbing ? Math.sin(time * 30) * 0.01 : 0;
      const top = Math.max(17, pick.position.y + L + 1), wid = 14;
      if (state === 'result') {
        ruler.position.set(FRY_W / 2 + 1.1, pick.position.y, 0);
        pickMat.emissiveIntensity = L >= 40 ? 0.7 + Math.sin(time * 5) * 0.3 : 1;
      }
      const f = frameFor(0, top, wid);
      const k = 1 - Math.exp(-dt * 6);
      cam.y += (f.y - cam.y) * k; cam.d += (f.d - cam.d) * k; cam.x += (f.x - cam.x) * k;
    }
    function draw() {
      camera.position.set(cam.x, cam.y + cam.d * 0.12, cam.d);
      camera.lookAt(cam.x, cam.y, 0);
      renderer.render(scene, camera);
      if (needSnap && state === 'result') {
        // カメラが落ち着いてから撮る
        const f = frameFor(0, Math.max(17, pick.position.y + L + 1), 14);
        if (Math.abs(f.d - cam.d) < f.d * 0.01) { needSnap = false; setTimeout(() => { if (state === 'result') { takeSnap(); prepareShare(); } }); }
      }
    }
    let last = 0;
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    // ---------- 操作 ----------
    stage.addEventListener('pointerdown', e => {
      if (state === 'result' || (e.pointerType === 'mouse' && e.button !== 0)) return;
      grabbing = true; lastY = e.clientY;
      stage.setPointerCapture?.(e.pointerId);
    });
    stage.addEventListener('pointermove', e => {
      if (!grabbing) return;
      // 画面上の指の移動を、3D空間のcmに直す
      const perPx = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * cam.d / stage.clientHeight;
      pullBy((lastY - e.clientY) * perPx);
      lastY = e.clientY;
    });
    const release = () => { grabbing = false; };
    stage.addEventListener('pointerup', release);
    stage.addEventListener('pointercancel', release);
    const isKey = e => (e.code === 'Space' || e.code === 'ArrowUp') && !['SELECT', 'A', 'BUTTON'].includes(e.target.tagName);
    addEventListener('keydown', e => { if (isKey(e)) { e.preventDefault(); if (state !== 'result') keyHold = true; } });
    addEventListener('keyup', e => { if (isKey(e)) keyHold = false; });

    // ---------- 画面 ----------
    const controls = document.getElementById('controls');
    function renderControls() {
      controls.innerHTML = '';
      controls.classList.toggle('hide', state !== 'result');
      if (state !== 'result') return;
      const b = document.createElement('button');
      b.className = 'go'; b.textContent = t('again');
      b.addEventListener('click', reset);
      controls.append(b);
      if (state === 'result') {
        const a = document.createElement('a');
        a.className = 'post'; a.textContent = t('post');
        a.href = `https://x.com/intent/post?text=${encodeURIComponent(t('share')(fmt(L)))}&url=${encodeURIComponent(SHARE_URL)}`;
        const coarse = matchMedia('(pointer: coarse)').matches;
        if (!coarse) { a.target = '_blank'; a.rel = 'noopener'; }
        // スマホは画像ごと共有シートへ。PCは画像を保存してから投稿画面を開く
        a.addEventListener('click', e => {
          const text = t('share')(fmt(L));
          if (coarse && navigator.share) {
            e.preventDefault();
            const file = shareFile();
            const data = file && navigator.canShare?.({ files: [file] }) ? { files: [file], text: `${text}\n${SHARE_URL}` } : { text: `${text}\n${SHARE_URL}` };
            navigator.share(data).catch(() => {});
            return;
          }
          const img = resultImage();
          if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'potato-omikuji.png'; d.click(); }
        });
        controls.append(a);
      }
    }
    function showResult() {
      resultEl.children[0].textContent = fmt(L);
      resultEl.children[1].textContent = t('best')(fmt(best));
      resultEl.children[1].className = isNewBest ? 'new' : '';
    }

    // 結果画像: 結果の3D画面を正方形に切り抜き、長さを重ねる
    let snap = null, shareCache = null, shooting = false;
    function takeSnap() {
      // 正方形の画面で、上に文字の余白をとって撮り直す
      const pr = renderer.getPixelRatio();
      renderer.setPixelRatio(1); renderer.setSize(1080, 1080, false);
      camera.aspect = 1; camera.updateProjectionMatrix();
      shooting = true;
      const f = frameFor(0, Math.max(17, pick.position.y + L + 1), 14);
      camera.position.set(0, f.y + f.d * 0.12, f.d); camera.lookAt(0, f.y, 0);
      renderer.render(scene, camera);
      shooting = false;
      snap = document.createElement('canvas'); snap.width = snap.height = 1080;
      snap.getContext('2d').drawImage(renderer.domElement, 0, 0, 1080, 1080);
      renderer.setPixelRatio(pr); resize();
      draw();
      shareCache = null;
    }
    function resultImage() {
      if (!snap) return null;
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const g = c.getContext('2d');
      g.drawImage(snap, 0, 0);
      g.textAlign = 'center'; g.fillStyle = '#fff'; g.lineJoin = 'round';
      const font = px => `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans Thai", sans-serif`;
      const text = (str, x, y, px, max, align = 'center') => {
        g.textAlign = align; g.font = font(px);
        const w = g.measureText(str).width; if (w > max) { px *= max / w; g.font = font(px); }
        g.lineWidth = px * .16; g.strokeStyle = '#b3261e'; g.strokeText(str, x, y); g.fillText(str, x, y);
      };
      text(fmt(L), 540, 200, 180, 960);
      text(t('title'), 540, 1040, 52, 900);
      return c;
    }
    // 共有用ファイルは言語ごとに作っておく（クリック時に待つと Safari で共有が止まるため）
    function prepareShare() {
      if (!snap) return;
      const key = lang;
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'potato-omikuji.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;

    reset();
    applyLang();
    // 最初のフレームで固まらないよう、先に1回描いておく
    { const f = frameFor(0, 17, 14); cam.y = f.y; cam.d = f.d; cam.x = f.x; }
    draw();
    requestAnimationFrame(t0 => { last = t0; requestAnimationFrame(loop); });
  </script>
</body>
</html>
