  <script type="module">

    function applyLang() {

      document.getElementById('back').textContent = t('back');
      renderControls();
      if (state === 'result') { showResult(); prepareShare(); }
    }

    // ---------- 音 ----------
    let soundOn = store.get('sound', true);
    const soundBtn = document.getElementById('sound');
    const drawSoundBtn = () => {
      soundBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>${soundOn ? '<path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>' : '<path d="M17 9l5 6M22 9l-5 6"/>'}</svg>`;

    let ac = null, master = null, noiseBuf = null;

        const a = document.createElement('audio');

    }
    function initAudio() {

        noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
        const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

    }

    const live = () => soundOn && ac;
    function burst(dur, vol, type, freq, q = 1, delay = 0) {
      if (!live()) return;
      const now = ac.currentTime + delay;
      const s = ac.createBufferSource(); s.buffer = noiseBuf;
      const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;

    }
    function tone(type, f0, f1, dur, vol, delay = 0) {
      if (!live()) return;
      const now = ac.currentTime + delay;
      const o = ac.createOscillator(); o.type = type;
      o.frequency.setValueAtTime(f0, now); o.frequency.exponentialRampToValueAtTime(f1, now + dur);
      const g = ac.createGain(); g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.001, now + dur);

    }
    // 声: のこぎり波（声帯）＋息を、母音ごとの共鳴（フォルマント）に通す
    const VOWEL = { a: [800, 1200, 2600], i: [300, 2300, 3000], u: [350, 1250, 2500], e: [500, 1900, 2600], o: [500, 850, 2500], w: [300, 700, 2400] };
    function voice(f0, seq, dur, vol = 0.4, { delay = 0, p0 = 1.2, p1 = 0.75, shake = 0.04, breath = 0.12 } = {}) {
      if (!live()) return;
      const now = ac.currentTime + delay;
      const o = ac.createOscillator(); o.type = 'sawtooth';

    const sThrow = p => voice(p.f0 * 1.15, ['w', 'a', 'a', 'a'], 0.9, 0.45, { p0: 1.3, p1: 0.85, shake: 0.08 });
    const sThud = v => { burst(0.12, Math.min(0.7, v * 0.09), 'lowpass', 260 + Math.random() * 80); burst(0.05, Math.min(0.3, v * 0.04), 'bandpass', 900, 1.2); };
    const sOof = p => voice(p.f0 * 0.95, ['u', 'o'], 0.25, 0.35, { p0: 1.0, p1: 0.75, breath: 0.35 });

    function sShutter() { burst(0.025, 0.6, 'highpass', 2500, 0.8); burst(0.05, 0.35, 'bandpass', 1200, 2, 0.06); burst(0.03, 0.4, 'highpass', 3000, 0.8, 0.11); tone('sine', 180, 90, 0.08, 0.2, 0.02); }

    const scene = new THREE.Scene();
    const canvasTex = (w, h, draw, rep) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; if (rep) { tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.repeat.set(rep[0], rep[1]); tx.anisotropy = 8; } return tx; };
    scene.background = canvasTex(4, 256, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#3f86cf'); gr.addColorStop(0.55, '#9cc8ea'); gr.addColorStop(1, '#e6f0f2'); g.fillStyle = gr; g.fillRect(0, 0, w, h); });

    const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
    scene.add(new THREE.HemisphereLight('#e6f2ff', '#7a6a58', 1.2));
    const sun = new THREE.DirectionalLight('#fff2dc', 2.5);
    sun.position.set(5, 11, 8); sun.target.position.set(0, 0, -0.5);
    sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.normalBias = 0.02; sun.shadow.bias = -0.0004;
    Object.assign(sun.shadow.camera, { left: -7, right: 7, top: 7, bottom: -5, near: 1, far: 40 });
    scene.add(sun, sun.target);
    const mat = (c, rough = 0.8) => new THREE.MeshStandardMaterial({ color: c, roughness: rough });
    const shade = o => { o.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); return o; };
    const rnd = (a, b) => a + Math.random() * (b - a);

    world.defaultContactMaterial.restitution = 0.05;
    { const g = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() }); g.quaternion.setFromEuler(-Math.PI / 2, 0, 0); world.addBody(g); }
    const staticBox = (x, y, z, hx, hy, hz, ry = 0) => { const b = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(hx, hy, hz)) }); b.position.set(x, y, z); b.quaternion.setFromEuler(0, ry, 0); world.addBody(b); return b; };

    // ---------- 背景: 観光地の記念撮影スポット ----------
    const PANEL_Z = -1.1;
    {
      // 石畳

      // 奥の芝生と山
      const grass = canvasTex(256, 256, (c, w, h) => { c.fillStyle = '#5f8a3a'; c.fillRect(0, 0, w, h); for (let i = 0; i < 2600; i++) { c.fillStyle = `hsl(${85 + Math.random() * 20},${35 + Math.random() * 20}%,${24 + Math.random() * 20}%)`; c.fillRect(Math.random() * w, Math.random() * h, 1.5, 3 + Math.random() * 3); } }, [20, 6]);
      const gr = new THREE.Mesh(new THREE.PlaneGeometry(120, 30), new THREE.MeshStandardMaterial({ map: grass, roughness: 1 }));
      gr.rotation.x = -Math.PI / 2; gr.position.set(0, 0.01, -22); gr.receiveShadow = true; scene.add(gr);
      const mtM = [mat('#5f7f8f', 1), mat('#6f8f9a', 1), mat('#7e9aa4', 1)];
      for (let i = 0; i < 9; i++) { const h = rnd(10, 22), m = new THREE.Mesh(new THREE.ConeGeometry(rnd(14, 22), h, 7), pick(mtM)); m.position.set(rnd(-50, 50), h / 2 - 1, rnd(-58, -45)); m.rotation.y = rnd(0, 3); scene.add(m); }

    // ---------- 人とラグドール ----------
    const PARENT = { spine: 'pelvis', neck: 'spine', head: 'neck', shoulderL: 'spine', shoulderR: 'spine', elbowL: 'shoulderL', elbowR: 'shoulderR', wristL: 'elbowL', wristR: 'elbowR', hipL: 'pelvis', hipR: 'pelvis', kneeL: 'hipL', kneeR: 'hipR', ankleL: 'kneeL', ankleR: 'kneeR' };

      const k = h.height / 1.7, parts = {}, joints = [];

      parts.head = { bone: 'head', center: V3(0, P.head.y + a * 0.95, 0.012 * k), radius: a * 0.92, mass: 5 * k };

        J('chest', 'uarm' + s, P['shoulder' + s], { axisA: V3(sg * Math.sin(0.9), -Math.cos(0.9), 0.15), axisB: down, angle: 1.45, twist: 0.8 });

        J('thigh' + s, 'shin' + s, P['knee' + s], { axisA: V3(0, -Math.cos(1.15), -Math.sin(1.15)), axisB: down, angle: 1.2, twist: 0.2, hinge: true });
      }
      const rest = {};
      for (const n in parts) rest[n] = parts[n].center.clone().sub(P[parts[n].bone]); // 骨の位置から体の中心まで（骨の向きで）

    }

    const people = [];
    const ages = ['adult', 'adult', 'child', 'adult', 'elder', 'adult', 'adult', 'child', 'adult', 'adult', 'elder', 'adult', 'child', 'adult'];
    for (let i = 0; i < POOL; i++) {
      const h = makeHuman({ age: ages[i], seed: Math.floor(Math.random() * 1e9) });
      scene.add(h.root);
      const f0 = h.age === 'child' ? rnd(290, 360) : h.sex === 'female' ? rnd(200, 250) : rnd(105, 140);
      people.push({ h, f0, rig: buildRig(h), side: i % 2 ? 1 : -1, bodies: null, cons: [] });
    }

    const TQ = new THREE.Quaternion(), TQ2 = new THREE.Quaternion(), TV = new THREE.Vector3();
    function ragdoll(p) {
      const h = p.h, rig = p.rig;
      h.root.updateMatrixWorld(true);
      p.bodies = {};
      for (const n in rig.parts) {
        const part = rig.parts[n], bone = h.j[part.bone];
        bone.getWorldPosition(TV); bone.getWorldQuaternion(TQ);
        const c = rig.rest[n].clone().applyQuaternion(TQ).add(TV);
        const shape = part.radius ? new CANNON.Sphere(part.radius) : new CANNON.Box(cv(part.half));
        const b = new CANNON.Body({ mass: part.mass, shape, position: cv(c), quaternion: new CANNON.Quaternion(TQ.x, TQ.y, TQ.z, TQ.w), linearDamping: 0.04, angularDamping: 0.25 });
        b.sleepSpeedLimit = 0.25; b.sleepTimeLimit = 0.6;
        b.person = p; b.part = n;
        b.addEventListener('collide', onCollide);
        world.addBody(b); p.bodies[n] = b;
      }
      p.cons = [];
      for (const jn of rig.joints) {

        const c = new CANNON.ConeTwistConstraint(A, B, { pivotA: pa, pivotB: pb, axisA: cv(jn.axisA.clone().normalize()), axisB: cv(jn.axisB), angle: jn.angle, twistAngle: jn.twist });
        world.addConstraint(c); p.cons.push(c);

      }

      p.bodies = null; p.cons = [];
    }

    const W = {};
    const bq = (p, n) => { const q = p.bodies[n].quaternion; return new THREE.Quaternion(q.x, q.y, q.z, q.w); };
    function syncRagdoll(p) {
      const h = p.h, j = h.j, rig = p.rig;
      const pq = bq(p, 'pelvis'), pb = p.bodies.pelvis.position;
      j.pelvis.quaternion.copy(pq);
      j.pelvis.position.set(pb.x, pb.y, pb.z).sub(rig.rest.pelvis.clone().applyQuaternion(pq));
      W.pelvis = pq; W.spine = bq(p, 'chest');
      j.spine.quaternion.copy(TQ.copy(W.pelvis).invert().multiply(W.spine));
      j.neck.quaternion.identity();
      j.head.quaternion.copy(TQ.copy(W.spine).invert().multiply(bq(p, 'head')));
      for (const s of ['L', 'R']) {
        const ua = bq(p, 'uarm' + s), fa = bq(p, 'farm' + s), th = bq(p, 'thigh' + s), sh = bq(p, 'shin' + s);
        j['shoulder' + s].quaternion.copy(TQ.copy(W.spine).invert().multiply(ua));
        j['elbow' + s].quaternion.copy(TQ.copy(ua).invert().multiply(fa));
        j['wrist' + s].quaternion.identity();
        j['hip' + s].quaternion.copy(TQ.copy(W.pelvis).invert().multiply(th));
        j['knee' + s].quaternion.copy(TQ.copy(th).invert().multiply(sh));

    }
    // ぶつかった音とうめき声
    let thudCD = 0;

      const v = Math.abs(e.contact.getImpactVelocityAlongNormal());
      const p = e.target.person;
      if (v > 2.2 && thudCD <= 0 && state !== 'result') { sThud(v); thudCD = 0.06; if (v > 4 && p.oofCD <= 0 && (e.target.part === 'pelvis' || e.target.part === 'chest' || e.target.part === 'head')) { sOof(p); p.oofCD = 1.2; p.h.face.open = 0.3; p.h.face.brow = -0.6; p.h.face.smile = -0.5; } }
    }

    // ---------- 写真の枠と並び ----------
    let FW = 4, FH = 2.8;
    const frameEl = document.getElementById('frame'), ledEl = document.getElementById('led'), leds = [...ledEl.querySelectorAll('b')];
    let frameRect = { x: 0, y: 0, w: 1, h: 1 };
    const queueSlot = (side, k) => V3(side * (FW / 2 + 0.75 + k * 0.5), 0, -0.1 - k * 0.5);
    function layoutQueue(instant) {
      for (const s of [-1, 1]) {
        let k = 0;
        for (const p of people) if (p.mode === 'wait' && p.side === s) { p.slot = queueSlot(s, k++); if (instant) p.pos = p.slot.clone(); }
      }

    // ---------- 画面サイズ ----------
    const controls = document.getElementById('controls');
    let reserve = 160;
    function resize() {
      const w = stage.clientWidth, H = stage.clientHeight;
      renderer.setSize(w, H, false);
      const btnH = Math.min(72, Math.max(56, 0.08 * Math.min(innerWidth, innerHeight))) + 12;
      reserve = Math.max(0, stage.getBoundingClientRect().bottom - controls.getBoundingClientRect().bottom) + btnH;
      const top = 56, h = Math.max(140, H - reserve - top);
      // 写真の形は画面に合わせる（横長なら横長、縦長なら縦長）
      const fa = THREE.MathUtils.clamp(w / h, 0.72, 1.55);
      FW = Math.sqrt(10.5 * fa); FH = 10.5 / FW;

      const vf = THREE.MathUtils.degToRad(camera.fov), hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);
      const halfW = FW / 2 + 0.75 + 0.55 + 0.35, halfH = FH / 2 + 0.25;

      const a = pr(V3(-FW / 2, FH, 0)), b = pr(V3(FW / 2, 0, 0));

    // ---------- 入力: つかんで投げる ----------
    const hand = new CANNON.Body({ mass: 0, type: CANNON.Body.KINEMATIC }); hand.collisionResponse = false; world.addBody(hand);

    const pointer = new THREE.Vector3(), handTarget = new THREE.Vector3(), handPrev = new THREE.Vector3();
    function toNdc(e) { const r = renderer.domElement.getBoundingClientRect(); ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); return r; }
    renderer.domElement.addEventListener('pointerdown', e => {
      e.preventDefault();
      if (!(state === 'ready' || state === 'play') || grab) return;
      const r = toNdc(e);
      const px = e.clientX - r.left, py = e.clientY - r.top;
      // 画面上でいちばん近い体の部分をつかむ
      let best = null, bestD = Infinity;
      const tryPt = (p, part, wpos, size) => {
        const q = wpos.clone().project(camera); if (q.z > 1) return;
        const sx = (q.x + 1) / 2 * r.width, sy = (1 - q.y) / 2 * r.height, d = Math.hypot(sx - px, sy - py);
        const lim = Math.max(34, size);
        if (d < lim && d < bestD) { bestD = d; best = { p, part, wpos }; }
      };
      const pxPerM = r.height / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) * camera.position.length());
      for (const p of people) {
        if (p.mode === 'rag') for (const n in p.bodies) { const b = p.bodies[n].position; tryPt(p, n, V3(b.x, b.y, b.z), pxPerM * 0.1); }
        else if (p.mode === 'wait') {
          p.h.root.updateMatrixWorld(true);
          for (const n in p.rig.parts) { const part = p.rig.parts[n]; const bone = p.h.j[part.bone]; bone.getWorldPosition(TV); bone.getWorldQuaternion(TQ); tryPt(p, n, p.rig.rest[n].clone().applyQuaternion(TQ).add(TV), pxPerM * 0.1); }
        }
      }
      if (!best) return;
      const p = best.p;
      if (state === 'ready') { state = 'play'; timer = TIMER; beepT = 0; }
      if (p.mode === 'wait') { ragdoll(p); layoutQueue(false); sGrab(p); }
      const body = p.bodies[best.part];
      body.wakeUp();
      const bp = V3(body.position.x, body.position.y, body.position.z);
      const n = new THREE.Vector3(); camera.getWorldDirection(n);
      grab = { p, body, plane: new THREE.Plane().setFromNormalAndCoplanarPoint(n.negate(), bp) };
      hand.position.copy(body.position); handTarget.copy(bp); handPrev.copy(bp);
      grab.con = new CANNON.PointToPointConstraint(body, new CANNON.Vec3(0, 0, 0), hand, new CANNON.Vec3(0, 0, 0), 2600 * p.h.height / 1.7);
      world.addConstraint(grab.con);
      p.h.face.open = 0.6; p.h.face.brow = 1; p.h.face.smile = -0.2;
      renderer.domElement.setPointerCapture?.(e.pointerId);
    }, { passive: false });
    renderer.domElement.addEventListener('pointermove', e => {
      if (!grab) return;
      toNdc(e); ray.setFromCamera(ndc, camera);

    });
    const drop = () => {
      if (!grab) return;

      grab.body.velocity.set(v.x * 1.15, v.y * 1.15 + (speed > 2 ? 1 : 0), v.z * 1.15 - (speed > 2 ? 1.3 : 0));

    // ---------- ゲーム ----------

    const flashEl = document.getElementById('flash'), resultEl = document.getElementById('result');
    function shutter() {
      state = 'shot'; endT = 0;
      drop();
      sShutter();
      flashEl.style.transition = 'none'; flashEl.style.opacity = '1';
      requestAnimationFrame(() => { flashEl.style.transition = 'opacity .6s'; flashEl.style.opacity = '0'; });
      // シャッターの瞬間だけ、みんなカメラを見てにっこり
      for (const p of people) { p.h.face.smile = 1; p.h.face.open = 0.25; p.h.face.brow = 0.3; p.h.face.blink = 0; p.h.lookAt(camera.position); if (p.mode === 'wait') p.h.pose = 'peace'; }
      score = countInFrame();
      setLeds(false);
    }
    function countInFrame() {
      const r = renderer.domElement.getBoundingClientRect();
      let n = 0;
      for (const p of people) {
        let hp;
        if (p.mode === 'rag') { const b = p.bodies.head.position; hp = V3(b.x, b.y, b.z); }
        else { p.h.j.head.getWorldPosition(TV); hp = TV.clone().add(V3(0, 0.1, 0)); }
        const q = hp.project(camera); if (q.z > 1) continue;
        const x = (q.x + 1) / 2 * r.width, y = (1 - q.y) / 2 * r.height;
        if (x > frameRect.x && x < frameRect.x + frameRect.w && y > frameRect.y && y < frameRect.y + frameRect.h) n++;
      }
      return n;
    }
    function setLeds(on, k = 0) { leds.forEach((l, i) => l.classList.toggle('on', on && i <= k)); }
    const STEP = 1 / 60;
    function step(dt) {
      thudCD -= dt;
      if (state === 'play') {
        timer -= dt;
        // セルフタイマー: ランプの点滅とピッがだんだん速くなる
        const period = Math.max(0.12, 0.9 * (timer / TIMER) + 0.1);
        beepT -= dt;
        if (beepT <= 0) { beepT = period; ledOn = true; setLeds(true, timer < 3 ? 2 : timer < 6 ? 1 : 0); sBeep(timer < 3); }
        else if (ledOn && beepT < period * 0.5) { ledOn = false; setLeds(false); }
        if (timer <= 0) shutter();
      }
      if (grab) {
        handPrev.set(hand.position.x, hand.position.y, hand.position.z);
        const k = Math.min(1, dt * 30);
        const nx = handPrev.x + (handTarget.x - handPrev.x) * k, ny = handPrev.y + (handTarget.y - handPrev.y) * k, nz = handPrev.z + (handTarget.z - handPrev.z) * k;
        hand.velocity.set((nx - handPrev.x) / dt, (ny - handPrev.y) / dt, (nz - handPrev.z) / dt);
        hand.position.set(nx, ny, nz);
      }
      if (state !== 'shot' && state !== 'result') world.step(STEP);
      for (const p of people) {
        p.oofCD = (p.oofCD || 0) - dt;
        if (p.mode === 'rag') {
          syncRagdoll(p);
          p.ragT += dt;
          // 飛んでいる間は叫び顔、止まったらぼんやり
          if (state === 'play' && p.ragT > 1.6 && p.oofCD < 0 && (!grab || grab.p !== p)) { p.h.face.open = 0.12; p.h.face.brow = -0.3; p.h.face.smile = -0.15; }
          // 遠くへ飛んでいった人は消えたことにする
          const pb = p.bodies.pelvis.position;
          if (pb.y < -5) { unragdoll(p); p.mode = 'gone'; p.h.root.visible = false; }
        } else if (p.mode === 'wait') {
          const h = p.h, d = p.slot.clone().sub(p.pos), dist = d.length();
          if (dist > 0.03) { const v = Math.min(dist, dt * 1.3); p.pos.addScaledVector(d.normalize(), v); h.walkSpeed = 1.2; h.root.rotation.y = Math.atan2(d.x, d.z); }
          else { h.walkSpeed = 0; h.root.rotation.y += (Math.atan2(-p.pos.x, camera.position.z - p.pos.z) - h.root.rotation.y) * Math.min(1, dt * 4); }
          h.root.position.copy(p.pos);
          // 待っている人は時々手を振る
          if (state !== 'shot' && state !== 'result') { p.waveT -= dt; if (p.waveT < 0) { h.pose = h.pose === 'wave' ? 'stand' : Math.random() < 0.35 ? 'wave' : 'stand'; p.waveT = rnd(1.2, 3.5); if (h.pose === 'wave' && Math.random() < 0.3) sPick(p); } }
          h.lookAt(camera.position);
        }
        p.h.update(dt);
      }
      if (state === 'shot') { endT += dt; if (endT > 0.9) finish(); }
    }

    // ---------- 表示 ----------
    function renderControls() {
      controls.innerHTML = '';
      controls.classList.toggle('hide', state !== 'result');
      if (state !== 'result') return;
      const b = document.createElement('button');
      b.className = 'go'; b.textContent = t('again');
      b.addEventListener('click', start);
      controls.append(b);
      const a = document.createElement('a');
      a.className = 'post'; a.textContent = t('post');
      a.href = `https://x.com/intent/post?text=${encodeURIComponent(t('share')(score))}&url=${encodeURIComponent(SHARE_URL)}`;
      const coarse = matchMedia('(pointer: coarse)').matches;
      if (!coarse) { a.target = '_blank'; a.rel = 'noopener'; }
      // スマホは画像ごと共有シートへ。PCは画像を保存してから投稿画面を開く
      a.addEventListener('click', e => {
        const text = t('share')(score);
        if (coarse && navigator.share) {
          e.preventDefault();
          const file = shareFile();
          const data = file && navigator.canShare?.({ files: [file] }) ? { files: [file], text: `${text}\n${SHARE_URL}` } : { text: `${text}\n${SHARE_URL}` };
          navigator.share(data).catch(() => {});
          return;
        }
        const img = resultImage();
        if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'nagekomi-photo.png'; d.click(); }
      });
      controls.append(a);
    }
    function showResult() { resultEl.children[0].textContent = t('count')(score); }

    // 結果画像: 撮れた写真をプリント風にして人数を書く
    let snap = null, shareCache = null;
    function takeSnap() {
      const src = renderer.domElement, sc = src.width / stage.clientWidth;
      const fr = frameRect;
      snap = document.createElement('canvas');
      const aspect = fr.w / fr.h;
      snap.width = aspect >= 1 ? 1000 : Math.round(820 * aspect); snap.height = aspect >= 1 ? Math.round(1000 / aspect) : 820;
      snap.getContext('2d').drawImage(src, fr.x * sc, fr.y * sc, fr.w * sc, fr.h * sc, 0, 0, snap.width, snap.height);
      shareCache = null;
    }
    function resultImage() {
      if (!snap) return null;
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const g = c.getContext('2d');
      const bg = g.createLinearGradient(0, 0, 0, 1080); bg.addColorStop(0, '#5a9ad8'); bg.addColorStop(1, '#2f6fb0'); g.fillStyle = bg; g.fillRect(0, 0, 1080, 1080);
      // 白いふちのプリント
      const pw = snap.width + 40, ph = snap.height + 150, px = (1080 - pw) / 2, py = Math.max(30, (1080 - ph) / 2 - 10);
      g.save(); g.translate(540, py + ph / 2); g.rotate(-0.025); g.translate(-540, -(py + ph / 2));
      g.shadowColor = 'rgba(0,0,0,.35)'; g.shadowBlur = 30; g.shadowOffsetY = 10;
      g.fillStyle = '#fbfaf6'; g.fillRect(px, py, pw, ph);
      g.shadowColor = 'transparent';
      g.drawImage(snap, px + 20, py + 20);
      const font = px2 => `900 ${px2}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans KR", "Noto Sans Thai", sans-serif`;
      const fit = (str, x, y, size, max, color, align = 'center') => { g.font = font(size); const w = g.measureText(str).width; if (w > max) g.font = font(size * max / w); g.fillStyle = color; g.textAlign = align; g.fillText(str, x, y); };
      fit(t('count')(score), px + pw - 30, py + ph - 38, 92, pw * 0.5, '#1f3550', 'right');
      fit(t('title'), px + 30, py + ph - 48, 44, pw * 0.45, '#6a7a8a', 'left');
      g.restore();
      return c;
    }
    function prepareShare() {
      if (!snap) return;
      const key = lang;
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'nagekomi-photo.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;

    function start() {
      if (grab) drop();
      for (const p of people) {
        unragdoll(p);
        const h = p.h;
        p.mode = 'wait'; p.thrown = false; p.waveT = rnd(0.5, 3); p.oofCD = 0;
        h.root.visible = true; h.root.rotation.set(0, 0, 0);
        h.j.pelvis.position.copy(p.rig.P.pelvis);
        for (const b of BONES) h.j[b].quaternion.identity();
        h.auto = true; h.pose = 'stand'; h.walkSpeed = 0;
        h.face.smile = 0.5; h.face.open = 0; h.face.brow = 0.2;
      }
      // 並ぶ順番はばらばらに
      people.sort(() => Math.random() - 0.5);
      people.forEach((p, i) => p.side = i % 2 ? 1 : -1);
      state = 'ready'; timer = TIMER; score = 0; setLeds(false);
      resultEl.style.display = 'none';
      renderControls(); resize(); layoutQueue(true);
      for (const p of people) { p.h.root.position.copy(p.pos); for (let i = 0; i < 6; i++) p.h.update(0.1); }
    }
    function finish() {
      state = 'result';
      showResult();
      resultEl.style.display = 'flex';
      snap = null; needSnap = true;
      renderControls();
    }

    // ---------- ループ ----------
    let last = performance.now(), acc = 0;
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      acc += dt;
      while (acc >= STEP) { step(STEP); acc -= STEP; }
      if (needSnap) { renderer.render(scene, camera); needSnap = false; takeSnap(); prepareShare(); }
      renderer.render(scene, camera);
      requestAnimationFrame(loop);
    }

    resize();
    start();
    applyLang();
    renderer.compile(scene, camera);
    renderer.render(scene, camera);
    // 物理を一度空回ししておく
    world.step(STEP);
    requestAnimationFrame(t0 => { last = t0; loop(t0); });
    /*TEST*/if (location.search.includes('test')) window.__t = { people, world, ragdoll, get state() { return state; }, set timer(v) { timer = v; }, camera, frameRect: () => frameRect };
  </script>
</body>
