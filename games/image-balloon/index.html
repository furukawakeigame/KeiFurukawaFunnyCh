    #stock button { width: 46px; height: 46px; border-radius: 12px; border: 2px solid #2d4a6b; background: #ffffffd0; padding: 3px; cursor: pointer; touch-action: none; }

<body>
  <canvas id="cv"></canvas>
  <header>
    <a id="back" href="../../">← トップへ戻る</a>
    <div class="hbtns">
      <button id="sound" class="pill" aria-label="音のオン/オフ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path id="wave" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/><path id="mute" d="M16 9l6 6M22 9l-6 6" style="display:none"/></svg></button>

<script>
setTimeout(() => { if (!window.__ok) { document.getElementById('err').textContent = (navigator.language || '').startsWith('ja') ? '読み込みに失敗しました。通信状況を確認して再読み込みしてください。' : 'Failed to load. Please check your connection and reload.'; } }, 8000);
</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
window.__ok = true;

const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem('balloon-' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('balloon-' + k, JSON.stringify(v)); } catch {} }
};

// ---- 言語 ----
const L = {
  ja: { title: '画像ふうせん', back: '← トップへ戻る', lang: 'EN', langLabel: 'Switch to English', pick: '画像をえらぶ', erase: '消す', undo: '戻す', done: 'できた', cancel: 'やめる', sound: '音のオン/オフ' },
  en: { title: 'Image Balloon', back: '← Top', lang: '日本語', langLabel: '日本語に切り替え', pick: 'Pick image', erase: 'Erase', undo: 'Undo', done: 'Done', cancel: 'Cancel', sound: 'Sound on/off' }
};
let lang = store.get('lang', (navigator.language || '').startsWith('ja') ? 'ja' : 'en');
if (!L[lang]) lang = 'ja';
const t = k => L[lang][k];
function applyLang() {
  document.documentElement.lang = lang; document.title = t('title');
  $('back').textContent = t('back');
  $('lang').textContent = t('lang'); $('lang').setAttribute('aria-label', t('langLabel'));
  $('pick').textContent = t('pick');
  for (const k of ['erase', 'undo', 'done']) $(k).textContent = t(k);
  $('cancel').setAttribute('aria-label', t('cancel'));
  $('sound').setAttribute('aria-label', t('sound'));
}
$('lang').onclick = () => { lang = lang === 'ja' ? 'en' : 'ja'; store.set('lang', lang); applyLang(); };
applyLang();

// ---- 音 ----
let soundOn = store.get('sound', true);
let actx = null;
function showSound() { $('wave').style.display = soundOn ? '' : 'none'; $('mute').style.display = soundOn ? 'none' : ''; }
$('sound').onclick = () => { soundOn = !soundOn; store.set('sound', soundOn); showSound(); };
showSound();
function ac() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }
  if (actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function popSound(size) {
  if (!soundOn || !ac()) return;
  const now = actx.currentTime, len = 0.35;
  const buf = actx.createBuffer(1, actx.sampleRate * len, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 6);
  const src = actx.createBufferSource(); src.buffer = buf;
  const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 2500 + Math.random() * 2500;
  const g = actx.createGain(); g.gain.value = 0.9;
  src.connect(f).connect(g).connect(actx.destination); src.start(now);
  const o = actx.createOscillator(), og = actx.createGain();
  o.frequency.setValueAtTime(160 / size, now); o.frequency.exponentialRampToValueAtTime(40, now + 0.15);
  og.gain.setValueAtTime(0.7, now); og.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
  o.connect(og).connect(actx.destination); o.start(now); o.stop(now + 0.2);
}
function puffSound() {
  if (!soundOn || !ac()) return;
  const now = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(300, now); o.frequency.exponentialRampToValueAtTime(700, now + 0.25);
  g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(0.12, now + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);
  o.connect(g).connect(actx.destination); o.start(now); o.stop(now + 0.32);
}

// ---- 3D ----
const renderer = new THREE.WebGLRenderer({ canvas: $('cv'), antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
camera.position.set(0, 0, 14);
scene.add(new THREE.HemisphereLight(0xffffff, 0xbcd8ff, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(-4, 6, 8); scene.add(sun);
const rim = new THREE.DirectionalLight(0xffffff, 0.6); rim.position.set(5, -2, -6); scene.add(rim);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enablePan = false; controls.enableZoom = false; controls.enableDamping = true;
controls.minAzimuthAngle = -0.9; controls.maxAzimuthAngle = 0.9;
controls.minPolarAngle = Math.PI / 2 - 0.5; controls.maxPolarAngle = Math.PI / 2 + 0.4;

let viewW = 8, viewH = 10;
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  viewH = 2 * Math.tan(THREE.MathUtils.degToRad(22.5)) * 14; viewW = viewH * camera.aspect;
  // 狭い画面では少し引く
  camera.position.setLength(camera.aspect < 0.7 ? 17 : 14);
  viewH = 2 * Math.tan(THREE.MathUtils.degToRad(22.5)) * camera.position.length(); viewW = viewH * camera.aspect;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// 切り抜き済み（透過）の canvas から風船のジオメトリを作る
function buildShape(canvas) {
  const W = canvas.width, H = canvas.height, N = 64;
  const alpha = canvas.getContext('2d').getImageData(0, 0, W, H).data;
  // 内側の各点から、いちばん近い透明な点までの距離（px）
  const D = new Float32Array(W * H);
  for (let i = 0; i < W * H; i++) D[i] = alpha[i * 4 + 3] > 127 ? 1e9 : 0;
  const S2 = Math.SQRT2;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x; if (!D[i]) continue;
    let v = D[i];
    if (x > 0) v = Math.min(v, D[i - 1] + 1); else v = Math.min(v, 1);
    if (y > 0) { v = Math.min(v, D[i - W] + 1); if (x > 0) v = Math.min(v, D[i - W - 1] + S2); if (x < W - 1) v = Math.min(v, D[i - W + 1] + S2); } else v = Math.min(v, 1);
    D[i] = v;
  }
  for (let y = H - 1; y >= 0; y--) for (let x = W - 1; x >= 0; x--) {
    const i = y * W + x; if (!D[i]) continue;
    let v = D[i];
    if (x < W - 1) v = Math.min(v, D[i + 1] + 1); else v = Math.min(v, 1);
    if (y < H - 1) { v = Math.min(v, D[i + W] + 1); if (x < W - 1) v = Math.min(v, D[i + W + 1] + S2); if (x > 0) v = Math.min(v, D[i + W - 1] + S2); } else v = Math.min(v, 1);
    D[i] = v;
  }
  const sdist = (x, y) => D[Math.min(H - 1, Math.round(y)) * W + Math.min(W - 1, Math.round(x))];
  const size = 3.2, w = W >= H ? size : size * W / H, h = W >= H ? size * H / W : size;
  const k = w / W; // px → world
  const ds = [];
  let dmax = 0;
  for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) {
    const d = sdist(i / N * W, (1 - j / N) * H); ds.push(d); dmax = Math.max(dmax, d);
  }
  const R = Math.min(dmax * k, 1.1);
  const pos = [], uv = [], idx = [], V = (N + 1) * (N + 1);
  let low = null;
  for (const side of [1, -1]) for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) {
    const d = ds[j * (N + 1) + i], tt = Math.max(0, Math.min(1, d / dmax));
    const z = side * R * Math.sqrt(1 - (1 - tt) * (1 - tt));
    const x = (i / N - 0.5) * w, y = (j / N - 0.5) * h;
    pos.push(x, y, z); uv.push(i / N, j / N);
    if (side === 1 && d > 2 && (!low || y < low.y)) low = { x, y };
  }
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const a = j * (N + 1) + i, b = a + 1, c = a + N + 1, e = c + 1;
    idx.push(a, b, e, a, e, c);
    idx.push(V + a, V + e, V + b, V + a, V + c, V + e);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  // パンパンになった形（モーフ）: ふくらんだところほど法線方向へさらに押し出す。ふちは動かない
  const nrm = g.attributes.normal.array, pos2 = new Float32Array(pos.length);
  for (let n = 0; n < pos.length; n += 3) {
    const hgt = Math.abs(pos[n + 2]) / (R || 1), push = R * 0.7 * Math.pow(hgt, 0.8);
    pos2[n] = pos[n] + nrm[n] * push * 0.6;
    pos2[n + 1] = pos[n + 1] + nrm[n + 1] * push * 0.6;
    pos2[n + 2] = pos[n + 2] * 1.25 + nrm[n + 2] * push;
  }
  const gm = new THREE.BufferGeometry();
  gm.setAttribute('position', new THREE.BufferAttribute(pos2, 3)); gm.setIndex(idx); gm.computeVertexNormals();
  g.morphAttributes.position = [gm.attributes.position];
  g.morphAttributes.normal = [gm.attributes.normal];
  const tex = new THREE.CanvasTexture(canvas); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  // 破片の色
  const colors = [];
  for (let n = 0; n < 200 && colors.length < 24; n++) {
    const px = Math.random() * W | 0, py = Math.random() * H | 0, o = (py * W + px) * 4;
    if (alpha[o + 3] > 128) colors.push(new THREE.Color(`rgb(${alpha[o]},${alpha[o + 1]},${alpha[o + 2]})`).convertSRGBToLinear());
  }
  if (!colors.length) colors.push(new THREE.Color(0xff5577));
  return { g, tex, alpha, W, H, knot: low || { x: 0, y: -h / 2 }, colors, w, h, pos, pos2, ds, N };
}

const balloons = [], shards = [];
const knotGeo = new THREE.ConeGeometry(0.09, 0.18, 10);

// ほかの風船となるべく重ならない位置
function pickHome() {
  let best = null, bd = -1;
  for (let n = 0; n < 12; n++) {
    const v = new THREE.Vector3((Math.random() - 0.5) * Math.max(viewW - 3.2, 0.5), viewH * (Math.random() * 0.42 - 0.1), (Math.random() - 0.5) * 1.2);
    let d = Infinity;
    for (const b of balloons) d = Math.min(d, Math.hypot(b.home.x - v.x, (b.home.y - v.y) * 1.2));
    if (d > bd) { bd = d; best = v; }
  }
  return best;
}
function spawn(shape, delay = 0) {
  const mat = new THREE.MeshPhysicalMaterial({ map: shape.tex, alphaTest: 0.5, roughness: 0.35, clearcoat: 1, clearcoatRoughness: 0.15, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(shape.g, mat);
  const group = new THREE.Group(); group.add(mesh);
  const knot = new THREE.Mesh(knotGeo, new THREE.MeshStandardMaterial({ color: shape.colors[0], roughness: 0.5 }));
  knot.position.set(shape.knot.x, shape.knot.y - 0.05, 0); group.add(knot);
  const lineGeo = new THREE.BufferGeometry(); lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(new Array(16 * 3).fill(0), 3));
  const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: 0x5a6b7d }));
  scene.add(group, line);
  const s = (0.75 + Math.random() * 0.4) * Math.min(1, viewW / 8);
  const home = pickHome();
  const b = {
    shape, group, mesh, line, s, home, rx: 0.46 * shape.w * s, ry: 0.46 * shape.h * s, inf: 0,
    pos: new THREE.Vector3(home.x, -viewH / 2 - 3, home.z), vel: new THREE.Vector3(0, 5, 0),
    phase: Math.random() * 10, born: performance.now() / 1000 + delay, hold: -1
  };
  group.visible = false; line.visible = false;
  balloons.push(b);
  if (balloons.length > 14) remove(balloons[0]);
  return b;
}
function remove(b) {
  scene.remove(b.group, b.line); b.mesh.material.dispose(); b.line.geometry.dispose();
  balloons.splice(balloons.indexOf(b), 1);
}

// ---- 破裂: 風船のゴムを不規則な切れ端に分ける ----
function tear(shape, inf) {
  const { N, pos: p0, pos2, ds } = shape;
  const pos = p0.map((v, n) => v + (pos2[n] - v) * inf);
  const V = (N + 1) * (N + 1);
  const cells = [];
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const a = j * (N + 1) + i;
    if (ds[a] > 0 || ds[a + 1] > 0 || ds[a + N + 1] > 0 || ds[a + N + 2] > 0) cells.push([i, j]);
  }
  const K = Math.min(cells.length, 18 + (Math.random() * 10 | 0));
  const seeds = [];
  for (let n = 0; n < K; n++) seeds.push(cells[Math.random() * cells.length | 0]);
  const groups = seeds.map(() => []);
  const f1 = 0.3 + Math.random() * 0.3, f2 = 0.3 + Math.random() * 0.3, o1 = Math.random() * 9, o2 = Math.random() * 9;
  for (const [i, j] of cells) {
    let bi = 0, bd = Infinity;
    for (let n = 0; n < K; n++) {
      // ゆがんだ距離で切れ目をギザギザに
      const d = Math.hypot(i - seeds[n][0], (j - seeds[n][1]) * 1.3) * (1 + 0.35 * Math.sin(i * f1 + o1 + n) * Math.cos(j * f2 + o2 - n));
      if (d < bd) { bd = d; bi = n; }
    }
    groups[bi].push([i, j]);
  }
  const pieces = [];
  for (const side of [0, 1]) for (const cs of groups) {
    if (!cs.length) continue;
    const p = [], u = [], off = side * V;
    for (const [i, j] of cs) {
      const a = j * (N + 1) + i, b = a + 1, c = a + N + 1, e = c + 1;
      const tri = side ? [a, e, b, a, c, e] : [a, b, e, a, e, c];
      for (const v of tri) { const q = (off + v) * 3; p.push(pos[q], pos[q + 1], pos[q + 2]); u.push(i / N + (v === b || v === e ? 1 / N : 0), j / N + (v === c || v === e ? 1 / N : 0)); }
    }
    const c = new THREE.Vector3();
    for (let n = 0; n < p.length; n += 3) { c.x += p[n]; c.y += p[n + 1]; c.z += p[n + 2]; }
    c.divideScalar(p.length / 3);
    for (let n = 0; n < p.length; n += 3) { p[n] -= c.x; p[n + 1] -= c.y; p[n + 2] -= c.z; }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(u, 2));
    g.computeVertexNormals();
    pieces.push({ g, c });
  }
  return pieces;
}
function burst(b) {
  const grp = b.group; grp.updateMatrixWorld();
  const sc = grp.scale.x, q = grp.quaternion, mat = b.mesh.material;
  const pieces = tear(b.shape, Math.max(0, Math.min(1, b.inf)));
  const life = { mat, left: pieces.length };
  for (const pc of pieces) {
    const m = new THREE.Mesh(pc.g, mat);
    m.position.copy(pc.c).applyMatrix4(grp.matrixWorld);
    m.quaternion.copy(q); m.scale.setScalar(sc);
    scene.add(m);
    // 中心から外へ。ゴムは縮みながら飛び、空気に止められてひらひら落ちる
    const dir = new THREE.Vector3(pc.c.x, pc.c.y, pc.c.z * 2.5).normalize().applyQuaternion(q);
    shards.push({
      m, life, t: 0, sc, snap: 0.35 + Math.random() * 0.3, ph: Math.random() * 6,
      v: dir.multiplyScalar((9 + Math.random() * 8) * Math.sqrt(sc)),
      w: new THREE.Vector3((Math.random() - 0.5) * 30, (Math.random() - 0.5) * 30, (Math.random() - 0.5) * 30),
      end: 2.4 + Math.random() * 1.2
    });
  }
  // まわりの風船は爆風で押される
  for (const o of balloons) {
    if (o === b) continue;
    const d = o.pos.clone().sub(b.pos); d.z = 0; const l = d.length();

// ---- ループ ----
const clock = new THREE.Clock();
let autoT = 3, ready = false;
const tmp = new THREE.Vector3(), n3 = new THREE.Vector3();
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05), now = performance.now() / 1000;
  if ($('crop').classList.contains('show')) { requestAnimationFrame(loop); return; }
  const live = balloons.filter(b => now >= b.born);
  // 少なくなったら勝手に次の風船が上がってくる
  autoT -= dt;
  if (autoT <= 0 && ready) {
    autoT = 1.2 + Math.random() * 1.8;
    if (balloons.length < (viewW < 7 ? 5 : 8)) spawn(randomShape());
  }
  // ふわふわ浮かぶ（バネで定位置へ）
  for (const b of live) {
    const tgt = tmp.set(b.home.x + Math.sin(now * 0.4 + b.phase) * 0.4, b.home.y + Math.sin(now * 0.9 + b.phase) * 0.25, b.home.z);
    b.vel.addScaledVector(tgt.sub(b.pos), 1.4 * dt).multiplyScalar(1 - 1.1 * dt);
    if (b.vel.length() > 12) b.vel.setLength(12);

  const rad = (b, nx, ny) => { const rx = b.rx * (b.cur || 1), ry = b.ry * (b.cur || 1); return rx * ry / Math.hypot(ry * nx, rx * ny); };

    const a = live[i], c = live[j];
    n3.set(c.pos.x - a.pos.x, c.pos.y - a.pos.y, 0);
    const d = n3.length();
    if (d < 1e-4) { n3.set(1, 0, 0); } else n3.divideScalar(d);
    const rs = rad(a, n3.x, n3.y) + rad(c, n3.x, n3.y);
    if (d >= rs) continue;
    const push = Math.min(rs - d, 0.5) * 0.25;
    a.pos.addScaledVector(n3, -push); c.pos.addScaledVector(n3, push);

    const top = viewH / 2 - b.ry - 0.6;
    if (b.pos.y > top && now - b.born > 1) { b.pos.y = top; b.vel.y = -Math.abs(b.vel.y) * 0.6; }

    b.group.position.copy(b.pos).add(tmp.set((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake, 0));

    const arr = b.line.geometry.attributes.position.array;
    for (let i = 0; i < 16; i++) {
      const f = i / 15;

      arr[i * 3 + 1] = k.y - f * 2.6 * b.s;
