      padding: 56px 12px calc(80px + env(safe-area-inset-bottom)); box-sizing: border-box; }

<body>
  <canvas id="cv"></canvas>
  <header>
    <a id="back" href="../../">← トップへ戻る</a>

<script>
setTimeout(() => { if (!window.__ok) { document.getElementById('err').textContent = (navigator.language || '').startsWith('ja') ? '読み込みに失敗しました。通信状況を確認して再読み込みしてください。' : 'Failed to load. Please check your connection and reload.'; } }, 8000);
</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
window.__ok = true;

const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem('balloon-' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('balloon-' + k, JSON.stringify(v)); } catch {} }
};

// ---- 言語 ----
const L = {
  ja: { title: '画像ふうせん', back: '← トップへ戻る', lang: 'EN', langLabel: 'Switch to English', pick: '画像をえらぶ', more: 'もうひとつ', hint: 'なぞって囲む', all: '全体', cancel: 'やめる', sound: '音のオン/オフ' },
  en: { title: 'Image Balloon', back: '← Top', lang: '日本語', langLabel: '日本語に切り替え', pick: 'Pick image', more: 'One more', hint: 'Trace around it', all: 'Whole', cancel: 'Cancel', sound: 'Sound on/off' }
};
let lang = store.get('lang', (navigator.language || '').startsWith('ja') ? 'ja' : 'en');
if (!L[lang]) lang = 'ja';
const t = k => L[lang][k];
function applyLang() {
  document.documentElement.lang = lang; document.title = t('title');
  $('back').textContent = t('back');
  $('lang').textContent = t('lang'); $('lang').setAttribute('aria-label', t('langLabel'));
  $('pick').textContent = t('pick'); $('more').setAttribute('aria-label', t('more'));
  $('hint').textContent = t('hint'); $('all').textContent = t('all'); $('cancel').textContent = t('cancel');
  $('sound').setAttribute('aria-label', t('sound'));
}
$('lang').onclick = () => { lang = lang === 'ja' ? 'en' : 'ja'; store.set('lang', lang); applyLang(); };
applyLang();

// ---- 音 ----
let soundOn = store.get('sound', true);
let actx = null;
function showSound() { $('wave').style.display = soundOn ? '' : 'none'; $('mute').style.display = soundOn ? 'none' : ''; }
$('sound').onclick = () => { soundOn = !soundOn; store.set('sound', soundOn); showSound(); };
showSound();
function ac() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }
  if (actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function popSound(size) {
  if (!soundOn || !ac()) return;
  const now = actx.currentTime, len = 0.35;
  const buf = actx.createBuffer(1, actx.sampleRate * len, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 6);
  const src = actx.createBufferSource(); src.buffer = buf;
  const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 2500 + Math.random() * 2500;
  const g = actx.createGain(); g.gain.value = 0.9;
  src.connect(f).connect(g).connect(actx.destination); src.start(now);
  const o = actx.createOscillator(), og = actx.createGain();
  o.frequency.setValueAtTime(160 / size, now); o.frequency.exponentialRampToValueAtTime(40, now + 0.15);
  og.gain.setValueAtTime(0.7, now); og.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
  o.connect(og).connect(actx.destination); o.start(now); o.stop(now + 0.2);
}
function puffSound() {
  if (!soundOn || !ac()) return;
  const now = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(300, now); o.frequency.exponentialRampToValueAtTime(700, now + 0.25);
  g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(0.12, now + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);
  o.connect(g).connect(actx.destination); o.start(now); o.stop(now + 0.32);
}

// ---- 3D ----
const renderer = new THREE.WebGLRenderer({ canvas: $('cv'), antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
camera.position.set(0, 0, 14);
scene.add(new THREE.HemisphereLight(0xffffff, 0xbcd8ff, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(-4, 6, 8); scene.add(sun);
const rim = new THREE.DirectionalLight(0xffffff, 0.6); rim.position.set(5, -2, -6); scene.add(rim);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enablePan = false; controls.enableZoom = false; controls.enableDamping = true;
controls.minAzimuthAngle = -0.9; controls.maxAzimuthAngle = 0.9;
controls.minPolarAngle = Math.PI / 2 - 0.5; controls.maxPolarAngle = Math.PI / 2 + 0.4;

let viewW = 8, viewH = 10;
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  viewH = 2 * Math.tan(THREE.MathUtils.degToRad(22.5)) * 14; viewW = viewH * camera.aspect;
  // 狭い画面では少し引く
  camera.position.setLength(camera.aspect < 0.7 ? 17 : 14);
  viewH = 2 * Math.tan(THREE.MathUtils.degToRad(22.5)) * camera.position.length(); viewW = viewH * camera.aspect;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// 点と多角形の符号付き距離（内側が正）
function sdist(x, y, poly) {
  let inside = false, md = Infinity;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
    const dx = xj - xi, dy = yj - yi, l = dx * dx + dy * dy || 1;
    const tt = Math.max(0, Math.min(1, ((x - xi) * dx + (y - yi) * dy) / l));
    const ex = xi + tt * dx - x, ey = yi + tt * dy - y;
    md = Math.min(md, ex * ex + ey * ey);
  }
  return (inside ? 1 : -1) * Math.sqrt(md);
}

// shape: { canvas(切り抜き済み・透過), poly(canvas座標) } からジオメトリを作る
function buildShape(canvas, poly) {
  const W = canvas.width, H = canvas.height, N = 64;
  const size = 3.2, w = W >= H ? size : size * W / H, h = W >= H ? size * H / W : size;
  const k = w / W; // px → world
  const ds = [];
  let dmax = 0;
  for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) {
    const d = sdist(i / N * W, (1 - j / N) * H, poly); ds.push(d); dmax = Math.max(dmax, d);
  }
  const R = Math.min(dmax * k, 1.1);
  const pos = [], uv = [], idx = [], V = (N + 1) * (N + 1);
  let low = null;
  for (const side of [1, -1]) for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) {
    const d = ds[j * (N + 1) + i], tt = Math.max(0, Math.min(1, d / dmax));
    const z = side * R * Math.sqrt(1 - (1 - tt) * (1 - tt));
    const x = (i / N - 0.5) * w, y = (j / N - 0.5) * h;
    pos.push(x, y, z); uv.push(i / N, j / N);
    if (side === 1 && d > 2 && (!low || y < low.y)) low = { x, y };
  }
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const a = j * (N + 1) + i, b = a + 1, c = a + N + 1, e = c + 1;
    idx.push(a, b, e, a, e, c);
    idx.push(V + a, V + e, V + b, V + a, V + c, V + e);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  const tex = new THREE.CanvasTexture(canvas); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  const alpha = canvas.getContext('2d').getImageData(0, 0, W, H).data;
  // 破片の色
  const colors = [];
  for (let n = 0; n < 200 && colors.length < 24; n++) {
    const px = Math.random() * W | 0, py = Math.random() * H | 0, o = (py * W + px) * 4;
    if (alpha[o + 3] > 128) colors.push(new THREE.Color(`rgb(${alpha[o]},${alpha[o + 1]},${alpha[o + 2]})`).convertSRGBToLinear());
  }
  if (!colors.length) colors.push(new THREE.Color(0xff5577));
  return { g, tex, alpha, W, H, knot: low || { x: 0, y: -h / 2 }, colors, w, h };
}

const balloons = [], shards = [];
let current = null;
const knotGeo = new THREE.ConeGeometry(0.09, 0.18, 10);

// ほかの風船となるべく重ならない位置
function pickHome() {
  let best = null, bd = -1;
  for (let n = 0; n < 12; n++) {
    const v = new THREE.Vector3((Math.random() - 0.5) * Math.max(viewW - 3.2, 0.5), viewH * (Math.random() * 0.42 - 0.1), (Math.random() - 0.5) * 3);
    let d = Infinity;
    for (const b of balloons) d = Math.min(d, Math.hypot(b.home.x - v.x, (b.home.y - v.y) * 1.2));
    if (d > bd) { bd = d; best = v; }
  }
  return best;
}
function spawn(shape, delay = 0) {
  const mat = new THREE.MeshPhysicalMaterial({ map: shape.tex, alphaTest: 0.5, roughness: 0.35, clearcoat: 1, clearcoatRoughness: 0.15, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(shape.g, mat);
  const group = new THREE.Group(); group.add(mesh);
  const knot = new THREE.Mesh(knotGeo, new THREE.MeshStandardMaterial({ color: shape.colors[0], roughness: 0.5 }));
  knot.position.set(shape.knot.x, shape.knot.y - 0.05, 0); group.add(knot);
  const lineGeo = new THREE.BufferGeometry(); lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(new Array(16 * 3).fill(0), 3));
  const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: 0x5a6b7d }));
  scene.add(group, line);
  const s = (0.75 + Math.random() * 0.4) * Math.min(1, viewW / 8);
  const b = {
    shape, group, mesh, line, s, scale: s,
    home: pickHome(),
    phase: Math.random() * 10, born: performance.now() / 1000 + delay, pop: -1
  };
  group.position.set(b.home.x, -viewH / 2 - 4, b.home.z);
  group.scale.setScalar(0.01);
  balloons.push(b);
  if (balloons.length > 14) remove(balloons[0]);
  return b;
}
function remove(b) {
  scene.remove(b.group, b.line); b.mesh.material.dispose(); b.line.geometry.dispose();
  balloons.splice(balloons.indexOf(b), 1);
}

const shardGeo = new THREE.BufferGeometry();
shardGeo.setAttribute('position', new THREE.Float32BufferAttribute([0, 0.12, 0, -0.1, -0.08, 0, 0.11, -0.06, 0], 3));
shardGeo.computeVertexNormals();
function burst(b) {
  const p = b.group.position, sc = b.group.scale.x;
  for (let n = 0; n < 46; n++) {
    const m = new THREE.Mesh(shardGeo, new THREE.MeshStandardMaterial({ color: b.shape.colors[n % b.shape.colors.length], side: THREE.DoubleSide, transparent: true, roughness: 0.4 }));
    m.position.set(p.x + (Math.random() - 0.5) * b.shape.w * sc, p.y + (Math.random() - 0.5) * b.shape.h * sc, p.z + (Math.random() - 0.5) * 0.6);
    const dir = m.position.clone().sub(p).normalize();
    m.scale.setScalar(0.6 + Math.random() * 1.4);
    m.rotation.set(Math.random() * 6, Math.random() * 6, Math.random() * 6);
    scene.add(m);
    shards.push({ m, v: dir.multiplyScalar(5 + Math.random() * 7).add(new THREE.Vector3(0, 2, (Math.random() - 0.5) * 6)), r: new THREE.Vector3(Math.random() * 12, Math.random() * 12, Math.random() * 12), life: 0 });
  }
  // ひもは落ちる
  const lp = b.line.geometry.attributes.position.array.slice();
  shards.push({ line: b.line, lp, life: 0 });
  scene.remove(b.group); b.mesh.material.dispose();
  balloons.splice(balloons.indexOf(b), 1);
  popSound(sc);
}

// ---- タップで割る ----
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; ac(); });
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 10) { down = null; return; }
  down = null;
  ndc.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(balloons.filter(b => b.pop < 0).map(b => b.mesh));
  for (const hit of hits) {
    const b = balloons.find(b => b.mesh === hit.object), sh = b.shape;
    const px = Math.min(sh.W - 1, hit.uv.x * sh.W | 0), py = Math.min(sh.H - 1, (1 - hit.uv.y) * sh.H | 0);
    if (sh.alpha[(py * sh.W + px) * 4 + 3] > 128) { b.pop = performance.now() / 1000; break; }
  }
});

// ---- ループ ----
const clock = new THREE.Clock();
const tmp = new THREE.Vector3();
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05), now = performance.now() / 1000;
  for (const b of [...balloons]) {
    const age = now - b.born;
    if (age < 0) continue;
    const rise = Math.min(1, age / 1.6), e = 1 - Math.pow(1 - rise, 3);
    const tgt = tmp.set(b.home.x + Math.sin(now * 0.4 + b.phase) * 0.4, b.home.y + Math.sin(now * 0.9 + b.phase) * 0.25, b.home.z);
    const startY = -viewH / 2 - 4;
    b.group.position.set(tgt.x, startY + (tgt.y - startY) * e, tgt.z);
    let sc = b.s * Math.min(1, age * 3);
    if (b.pop > 0) {
      const pa = now - b.pop;
      sc *= 1 + pa * 2.2 + Math.sin(pa * 90) * 0.02;
      if (pa > 0.09) { burst(b); continue; }
    }
    b.group.scale.setScalar(Math.max(sc, 0.01));
    b.group.rotation.set(Math.sin(now * 0.7 + b.phase) * 0.08, Math.sin(now * 0.5 + b.phase * 2) * 0.35, Math.sin(now * 0.8 + b.phase) * 0.1);
    // ひも
    b.group.updateMatrixWorld();
    const k = new THREE.Vector3(b.shape.knot.x, b.shape.knot.y - 0.12, 0).applyMatrix4(b.group.matrixWorld);
    const arr = b.line.geometry.attributes.position.array;
    for (let i = 0; i < 16; i++) {
      const f = i / 15;
      arr[i * 3] = k.x + Math.sin(now * 2 + b.phase + f * 4) * 0.15 * f;
      arr[i * 3 + 1] = k.y - f * 2.6 * b.s;
      arr[i * 3 + 2] = k.z + Math.cos(now * 1.5 + b.phase + f * 3) * 0.1 * f;
    }
    b.line.geometry.attributes.position.needsUpdate = true;
  }
  for (const s of [...shards]) {
    s.life += dt;
    if (s.m) {
      s.v.y -= 9 * dt; s.v.multiplyScalar(1 - 1.5 * dt);
      s.m.position.addScaledVector(s.v, dt);
      s.m.rotation.x += s.r.x * dt; s.m.rotation.y += s.r.y * dt;
      s.m.material.opacity = Math.max(0, 1 - s.life / 1.2);
      if (s.life > 1.2) { scene.remove(s.m); s.m.material.dispose(); shards.splice(shards.indexOf(s), 1); }
    } else {
      const arr = s.line.geometry.attributes.position.array;
      for (let i = 0; i < 16; i++) arr[i * 3 + 1] = s.lp[i * 3 + 1] - 6 * s.life * s.life * (1 + i * 0.01);
      s.line.geometry.attributes.position.needsUpdate = true;
      s.line.material.transparent = true; s.line.material.opacity = Math.max(0, 1 - s.life);
      if (s.life > 1) { scene.remove(s.line); s.line.geometry.dispose(); s.line.material.dispose(); shards.splice(shards.indexOf(s), 1); }
    }
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

// ---- 形を作る ----
function makeFromImage(img, poly) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const [x, y] of poly) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
  const bw = x1 - x0, bh = y1 - y0, sc = 512 / Math.max(bw, bh), pad = 4;
  const c = document.createElement('canvas');
  c.width = Math.round(bw * sc) + pad * 2; c.height = Math.round(bh * sc) + pad * 2;
  const g = c.getContext('2d');
  const p = poly.map(([x, y]) => [(x - x0) * sc + pad, (y - y0) * sc + pad]);
  g.beginPath(); p.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath();
  g.save(); g.clip(); g.drawImage(img, -x0 * sc + pad, -y0 * sc + pad, img.width * sc, img.height * sc); g.restore();
  return buildShape(c, p);
}
function sample(kind, c1, c2) {
  const S = 400, c = document.createElement('canvas'); c.width = c.height = S;
  const pts = [];
  for (let i = 0; i < 120; i++) {
    const a = i / 120 * Math.PI * 2;
    let x, y;
    if (kind === 'heart') { x = 16 * Math.pow(Math.sin(a), 3); y = -(13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)); x = S / 2 + x * 11; y = S / 2 + y * 11 - 10; }
    else if (kind === 'star') { const ang = a - Math.PI / 2; const m = Math.abs(((i / 120 * 5) % 1) - 0.5) * 2; const rr = 90 + 100 * m; x = S / 2 + Math.cos(ang) * rr; y = S / 2 + Math.sin(ang) * rr + 10; }
    else { x = S / 2 + Math.cos(a) * 170; y = S / 2 + Math.sin(a) * 185; }
    pts.push([x, y]);
  }
  const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, S, S); gr.addColorStop(0, c1); gr.addColorStop(1, c2);
  g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath();
  g.fillStyle = gr; g.fill();
  return buildShape(c, pts);
}

// ---- 切り抜き ----
let img = null, path = [];
const cc = $('cc'), cg = cc.getContext('2d');
$('pick').onclick = () => { ac(); $('file').click(); };
$('file').onchange = () => {
  const f = $('file').files[0]; $('file').value = ''; if (!f) return;
  const url = URL.createObjectURL(f), im = new Image();
  im.onload = () => {
    const sc = Math.min(1, 1200 / Math.max(im.width, im.height));
    const c = document.createElement('canvas'); c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url); img = c; openCrop();
  };
  im.src = url;
};
function openCrop() {
  $('crop').classList.add('show');
  cc.width = img.width; cc.height = img.height; path = []; drawCrop();
}
function drawCrop() {
  cg.drawImage(img, 0, 0);
  if (path.length > 1) {
    cg.lineWidth = Math.max(img.width, img.height) / 120; cg.lineJoin = 'round';
    cg.strokeStyle = '#fff'; cg.setLineDash([cg.lineWidth * 2, cg.lineWidth * 1.5]);
    cg.beginPath(); path.forEach(([x, y], i) => i ? cg.lineTo(x, y) : cg.moveTo(x, y)); cg.stroke();
  }
}
function cpt(e) { const r = cc.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * cc.width, (e.clientY - r.top) / r.height * cc.height]; }
let drawing = false;
cc.addEventListener('pointerdown', e => { drawing = true; cc.setPointerCapture(e.pointerId); path = [cpt(e)]; drawCrop(); });
cc.addEventListener('pointermove', e => {
  if (!drawing) return;
  const p = cpt(e), q = path[path.length - 1];
  if (Math.hypot(p[0] - q[0], p[1] - q[1]) > Math.max(cc.width, cc.height) / 200) { path.push(p); drawCrop(); }
});
cc.addEventListener('pointerup', () => {
  if (!drawing) return; drawing = false;
  let area = 0;
  for (let i = 0, j = path.length - 1; i < path.length; j = i++) area += (path[j][0] - path[i][0]) * (path[j][1] + path[i][1]);
  if (path.length < 8 || Math.abs(area / 2) < cc.width * cc.height * 0.005) { path = []; drawCrop(); return; }
  const step = Math.max(1, Math.ceil(path.length / 160));
  finish(path.filter((_, i) => i % step === 0));
});
$('all').onclick = () => {
  const w = img.width, h = img.height, r = Math.min(w, h) * 0.12, poly = [];
  const corners = [[w - r, h - r, 0], [r, h - r, 1], [r, r, 2], [w - r, r, 3]];
  for (const [cx, cy, q] of corners) for (let i = 0; i <= 8; i++) { const a = (q + i / 8) * Math.PI / 2; poly.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  finish(poly);
};
$('cancel').onclick = () => $('crop').classList.remove('show');
function finish(poly) {
  $('crop').classList.remove('show');
  current = makeFromImage(img, poly);
  spawn(current); puffSound();
}
$('more').onclick = () => {
  ac();
  spawn(current || [sampleA, sampleB, sampleC][Math.random() * 3 | 0]); puffSound();
};

const sampleA = sample('heart', '#ff7a9a', '#e8264f');
const sampleB = sample('star', '#ffe46b', '#ffa51f');
const sampleC = sample('circle', '#7fd0ff', '#2f7de0');
[sampleA, sampleB, sampleC, sampleA, sampleC].slice(0, viewW < 7 ? 3 : 5).forEach((s, i) => spawn(s, i * 0.25));
loop();
</script>
