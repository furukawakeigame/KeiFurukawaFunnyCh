<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>円周率レース</title>
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <!-- X などにURLを貼ったときのカード表示（ここだけは https:// から書く） -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ふるかわけい面白チャンネル">
  <meta property="og:title" content="円周率レース">
  <meta property="og:url" content="https://keifurukawafunnych.com/games/pi-race/">
  <meta property="og:image" content="https://keifurukawafunnych.com/games/pi-race/icon.png">
  <meta name="twitter:card" content="summary">
  <style>
    html, body { margin: 0; height: 100%; background: #f2f4ff; color: #2a2a4a; }
    body {
      display: flex; flex-direction: column; height: 100dvh;
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic UI", system-ui, sans-serif;
      overflow: hidden; touch-action: manipulation;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; width: 100%; max-width: 480px; margin: 0 auto; box-sizing: border-box;
    }
    header a { color: #4a5ad0; text-decoration: none; font-weight: bold; }
    .hbtns { display: flex; gap: 6px; }
    #lang { font-size: 15px; padding: 0 10px; }
    .pill {
      font-size: 20px; background: #fff; border: 2px solid #c8cff5; border-radius: 999px;
      min-width: 44px; height: 36px; cursor: pointer; font-weight: bold; color: #4a5ad0;
    }
    main {
      flex: 1; min-height: 0; width: 100%; max-width: 480px; margin: 0 auto;
      display: flex; flex-direction: column; box-sizing: border-box; gap: 10px;
      padding: 0 12px calc(80px + env(safe-area-inset-bottom));
    }
    .screen { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
    [hidden] { display: none !important; }
    .logo { text-align: center; font-size: 44px; font-weight: bold; color: #4a5ad0; line-height: 1; margin-top: 4px; }
    .lens { display: flex; gap: 6px; }
    .lens button {
      flex: 1; font: inherit; font-size: 18px; font-weight: bold; padding: 8px 0; border-radius: 12px;
      border: 2px solid #c8cff5; background: #fff; color: #4a5ad0; cursor: pointer;
    }
    .lens button.on { background: #4a5ad0; color: #fff; border-color: #4a5ad0; }
    .boxes { display: flex; justify-content: center; gap: 8px; }
    .boxes span {
      width: 52px; height: 64px; border-radius: 12px; background: #fff; border: 3px solid #c8cff5;
      display: flex; align-items: center; justify-content: center; font-size: 38px; font-weight: bold;
      font-family: ui-monospace, Menlo, Consolas, monospace;
    }
    .boxes span.cur { border-color: #4a5ad0; }
    .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; flex: 1; min-height: 0; max-height: 300px; }
    .pad button {
      font: inherit; font-size: 26px; font-weight: bold; border-radius: 14px; border: none; background: #fff;
      color: #2a2a4a; box-shadow: 0 3px 0 #c8cff5; cursor: pointer; min-height: 40px;
    }
    .pad button:active { transform: translateY(2px); box-shadow: 0 1px 0 #c8cff5; }
    .big {
      font: inherit; font-size: 22px; font-weight: bold; padding: 14px 8px; border-radius: 16px;
      border: none; cursor: pointer; color: #fff; background: #4a5ad0;
      box-shadow: 0 4px 0 #2e3a96; display: block; text-align: center; text-decoration: none; line-height: normal;
    }
    .big:active { transform: translateY(3px); box-shadow: 0 1px 0 #2e3a96; }
    button.big:disabled { opacity: .35; cursor: default; }
    .big.sub { background: #fff; color: #4a5ad0; box-shadow: 0 4px 0 #c8cff5; }
    .big.x { background: #222; box-shadow: 0 4px 0 #000; }
    .row2 { display: flex; gap: 8px; }
    .row2 > * { flex: 1; }

    #tape {
      background: #1d2150; color: #9aa3e6; border-radius: 14px; padding: 10px 0 8px; text-align: center;
      font-family: ui-monospace, Menlo, Consolas, monospace; overflow: hidden;
    }
    #digits { font-size: min(30px, 7.4vw); letter-spacing: .06em; white-space: nowrap; font-weight: bold; }
    #digits b { color: #fff; border-radius: 4px; padding: 0 1px; }
    #pos { font-size: 16px; margin-top: 4px; color: #fff; }
    #players { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; flex: 1; min-height: 0; }
    #players li {
      display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 12px; padding: 4px 8px;
      border-left: 8px solid var(--c); transition: opacity .3s, transform .3s; flex: 1; max-height: 56px; min-height: 0;
    }
    #players li.out { opacity: .4; }
    #players li.me { box-shadow: 0 0 0 2px #4a5ad0 inset; }
    #players li.hit { transform: scale(1.05); }
    #players .face { font-size: 24px; }
    #players li > span { white-space: nowrap; }
    #players .num { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 22px; font-weight: bold; }
    #players .st { margin-left: auto; text-align: right; font-size: 13px; font-weight: bold; white-space: nowrap; }
    #players .rk { font-size: 17px; color: #4a5ad0; }
    #verdict { text-align: center; font-size: 24px; font-weight: bold; color: #4a5ad0; min-height: 30px; }
    #verdict small { display: block; font-size: 15px; color: #2a2a4a; }
  </style>
</head>
<body>
  <header>
    <a href="../../" id="back">← トップへ戻る</a>
    <div class="hbtns"><button id="lang" class="pill">EN</button><button id="sound" class="pill" aria-label="音のオン/オフ">🔊</button></div>
  </header>
  <main>
    <section id="pick" class="screen">
      <div class="logo">π</div>
      <div class="lens" id="lens"></div>
      <div class="boxes" id="boxes"></div>
      <div class="pad" id="pad"></div>
      <button class="big" id="go" disabled>スタート</button>
    </section>
    <section id="race" class="screen" hidden>
      <div id="tape"><div id="digits"></div><div id="pos"></div></div>
      <div id="verdict"></div>
      <ul id="players"></ul>
      <div class="row2" id="after" hidden>
        <button class="big sub" id="retry">もう一度</button>
        <a class="big x" id="share">Xに投稿</a>
      </div>
      <button class="big sub" id="skip">早送り ▶▶</button>
    </section>
  </main>
  <script>
    const SHARE_URL = 'https://keifurukawafunnych.com/games/pi-race/';
    const COLORS = ['#4a5ad0', '#e85a70', '#f0a020', '#2db07a', '#a05ad0', '#20a8d0'];
    const FACES = ['😀', '🐱', '🐶', '🐸', '🐵', '🐼'];

    const store = {
      get(k, d) { try { const v = localStorage.getItem('pi-race:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
      set(k, v) { try { localStorage.setItem('pi-race:' + k, JSON.stringify(v)); } catch {} },
    };
    let soundOn = store.get('sound', true);
    const soundBtn = document.getElementById('sound');
    const updateSoundBtn = () => { soundBtn.textContent = soundOn ? '🔊' : '🔇'; };
    soundBtn.onclick = () => { soundOn = !soundOn; store.set('sound', soundOn); updateSoundBtn(); };
    updateSoundBtn();
    let actx;
    function beep(freq, dur, type = 'sine', vol = 0.15, slide = 0) {
      if (!soundOn) return;
      try {
        actx = actx || new (window.AudioContext || window.webkitAudioContext)();
        const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (slide) o.frequency.linearRampToValueAtTime(freq + slide, t + dur);
        g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
      } catch {}
    }

    // 文言（日本語／英語）
    const L = {
      ja: {
        title: '円周率レース', back: '← トップへ戻る', lang: 'EN', langLabel: 'Switch to English',
        len: n => `${n}桁`, go: 'スタート', skip: '早送り ▶▶', retry: 'もう一度', share: 'Xに投稿',
        names: ['あなた', 'ねこ', 'いぬ', 'かえる', 'さる', 'ぱんだ'],
        pos: n => `小数点以下 ${n.toLocaleString()}桁目`,
        found: n => `${n.toLocaleString()}桁目`, none: '100万桁以内に出ず', rank: r => `${r}位`,
        wait: 'まだ出てない…',
        verdict: r => `あなたは ${r}位`,
        msg: ['円周率の奥深くに潜んだ！', 'あと少しで最深部だった', 'なかなかしぶとい', 'ふつうの数字', '割とすぐ見つかった', '真っ先に見つかった…'],
        shareText: (num, pos, r) => `円周率レースで「${num}」は円周率の${pos}に出てきて、6人中${r}位でした`,
        shareNone: '100万桁以内',
      },
      en: {
        title: 'Pi Race', back: '← Top', lang: '日本語', langLabel: '日本語に切り替え',
        len: n => `${n} digits`, go: 'Start', skip: 'Fast ▶▶', retry: 'Again', share: 'Post on X',
        names: ['You', 'Cat', 'Dog', 'Frog', 'Monkey', 'Panda'],
        pos: n => `decimal place ${n.toLocaleString()}`,
        found: n => `#${n.toLocaleString()}`, none: 'not in 1M digits', rank: r => ['1st', '2nd', '3rd'][r - 1] || `${r}th`,
        wait: 'not yet…',
        verdict: r => `You placed ${['1st', '2nd', '3rd'][r - 1] || r + 'th'}`,
        msg: ['Hidden deepest in pi!', 'So close to the deepest', 'Pretty stubborn', 'An ordinary number', 'Found fairly quickly', 'Found first…'],
        shareText: (num, pos, r) => `In Pi Race, "${num}" first appears at digit ${pos} of pi — I placed ${r} of 6`,
        shareNone: 'beyond 1,000,000',
      },
    };
    let lang = store.get('lang', navigator.language.startsWith('ja') ? 'ja' : 'en');
    if (!L[lang]) lang = 'ja';
    const t = k => L[lang][k];
    const $ = id => document.getElementById(id);
    const langBtn = $('lang');
    function applyLang() {
      document.documentElement.lang = lang;
      document.title = t('title');
      $('back').textContent = t('back');
      langBtn.textContent = t('lang'); langBtn.setAttribute('aria-label', t('langLabel'));
      $('go').textContent = t('go'); $('skip').textContent = t('skip');
      $('retry').textContent = t('retry'); $('share').textContent = t('share');
      renderLens(); renderPlayers(); renderVerdict();
    }
    langBtn.onclick = () => { lang = lang === 'ja' ? 'en' : 'ja'; store.set('lang', lang); applyLang(); };

    // 円周率（小数点以下100万桁）
    let PI = null;
    const piReady = fetch('pi.txt').then(r => r.text()).then(s => { PI = s.trim(); });

    // ---- 数字を選ぶ ----
    let len = store.get('len', 3);
    let input = '';
    function renderLens() {
      const el = $('lens'); el.innerHTML = '';
      for (const n of [2, 3, 4, 5]) {
        const b = document.createElement('button');
        b.textContent = t('len')(n); b.className = n === len ? 'on' : '';
        b.onclick = () => { len = n; store.set('len', n); input = input.slice(0, n); renderLens(); renderBoxes(); };
        el.appendChild(b);
      }
    }
    function renderBoxes() {
      const el = $('boxes'); el.innerHTML = '';
      for (let i = 0; i < len; i++) {
        const s = document.createElement('span');
        s.textContent = input[i] || ''; if (i === input.length) s.className = 'cur';
        el.appendChild(s);
      }
      $('go').disabled = input.length !== len;
    }
    function press(k) {
      if (k === 'del') input = input.slice(0, -1);
      else if (k === 'rnd') input = Array.from({ length: len }, () => Math.floor(Math.random() * 10)).join('');
      else if (input.length < len) input += k;
      beep(660 + input.length * 60, 0.05, 'square', 0.04);
      renderBoxes();
    }
    for (const k of ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'rnd', '0', 'del']) {
      const b = document.createElement('button');
      b.textContent = k === 'del' ? '⌫' : k === 'rnd' ? '🎲' : k;
      b.onclick = () => press(k);
      $('pad').appendChild(b);
    }
    document.addEventListener('keydown', e => {
      if ($('pick').hidden) return;
      if (/^[0-9]$/.test(e.key)) press(e.key);
      else if (e.key === 'Backspace') press('del');
      else if (e.key === 'Enter' && !$('go').disabled) start();
    });
    $('go').onclick = () => start();

    // ---- レース ----
    let players = [], cursor = 0, events = [], timer = 0, fast = false, done = false, myRank = 0;
    async function start() {
      await piReady;
      const used = new Set([input]);
      players = [{ num: input, i: 0 }];
      while (players.length < 6) {
        const n = Array.from({ length: len }, () => Math.floor(Math.random() * 10)).join('');
        if (!used.has(n)) { used.add(n); players.push({ num: n, i: players.length }); }
      }
      for (const p of players) {
        const k = PI.indexOf(p.num);
        p.pos = k < 0 ? Infinity : k + 1;   // 小数点以下何桁目から始まるか
        p.out = false; p.rank = 0;
      }
      // 先に出た人から脱落。最後まで出なかった人が1位
      events = [...players].sort((a, b) => a.pos - b.pos);
      events.forEach((p, j) => { p.rank = 6 - j; });
      myRank = players[0].rank;
      cursor = 0; fast = false; done = false;
      $('pick').hidden = true; $('race').hidden = false;
      $('after').hidden = true; $('skip').hidden = false;
      renderPlayers(); renderVerdict(); renderTape(1, null);
      step();
    }
    $('skip').onclick = () => { fast = true; };
    $('retry').onclick = () => {
      clearTimeout(timer); $('race').hidden = true; $('pick').hidden = false; renderBoxes();
    };

    function renderTape(at, hit) {
      // at の位置を中心に数字を並べる
      const W = 11, half = 5;
      const s = Math.max(1, at - half);
      let html = '';
      for (let k = s; k < s + W; k++) {
        const d = PI[k - 1] ?? '';
        if (hit && k >= hit.pos && k < hit.pos + len) html += `<b style="background:${COLORS[hit.i]}">${d}</b>`;
        else html += d;
      }
      $('digits').innerHTML = (s === 1 ? '3.' : '…') + html + '…';
      $('pos').textContent = t('pos')(at);
    }

    function step() {
      const next = events.find(p => !p.out && p.pos !== Infinity);
      const remaining = events.filter(p => !p.out);
      if (!next || remaining.length === 1) {
        // 残った人が1位
        remaining.forEach(p => { p.out = true; });
        if (!next) renderTape(PI.length - 5, null);
        return finish();
      }
      // 次の出現位置まで、対数スケールで進む
      const from = Math.max(1, cursor), to = next.pos;
      const dur = fast ? 250 : 1600;
      const t0 = performance.now();
      const anim = now => {
        const r = Math.min(1, (now - t0) / dur);
        const e = 1 - Math.pow(1 - r, 3);
        const at = Math.round(Math.exp(Math.log(from) + (Math.log(to) - Math.log(from)) * e));
        renderTape(at, null);
        if (r < 1) { requestAnimationFrame(anim); return; }
        cursor = to; next.out = true;
        renderTape(to, next);
        renderPlayers(next);
        beep(next.i === 0 ? 300 : 520, 0.25, 'triangle', 0.15, next.i === 0 ? -150 : 200);
        timer = setTimeout(step, fast ? 350 : 1100);
      };
      requestAnimationFrame(anim);
    }

    function finish() {
      done = true;
      renderPlayers(); renderVerdict();
      $('skip').hidden = true; $('after').hidden = false;
      if (myRank === 1) { beep(523, 0.15, 'square', 0.08); setTimeout(() => beep(659, 0.15, 'square', 0.08), 150); setTimeout(() => beep(784, 0.3, 'square', 0.08), 300); }
      else beep(200, 0.4, 'sawtooth', 0.06, -80);
    }

    function renderPlayers(hit) {
      const el = $('players'); if (!players.length) return;
      el.innerHTML = '';
      const list = done ? [...players].sort((a, b) => a.rank - b.rank) : players;
      for (const p of list) {
        const li = document.createElement('li');
        li.style.setProperty('--c', COLORS[p.i]);
        li.className = (p.i === 0 ? 'me ' : '') + (p.out && !done ? 'out ' : '') + (hit === p ? 'hit' : '');
        const st = p.out || done
          ? `<span class="rk">${t('rank')(p.rank)}</span> ${p.pos === Infinity ? t('none') : t('found')(p.pos)}`
          : t('wait');
        li.innerHTML = `<span class="face">${FACES[p.i]}</span><span>${t('names')[p.i]}</span><span class="num">${p.num}</span><span class="st">${st}</span>`;
        el.appendChild(li);
      }
      if (hit) setTimeout(() => el.querySelector('.hit')?.classList.remove('hit'), 300);
    }

    function renderVerdict() {
      const v = $('verdict');
      if (!done) { v.innerHTML = ''; return; }
      v.innerHTML = `${t('verdict')(myRank)}<small>${t('msg')[myRank - 1]}</small>`;
      const me = players[0];
      const pos = me.pos === Infinity ? t('shareNone') : (lang === 'ja' ? me.pos.toLocaleString() + '桁目' : me.pos.toLocaleString());
      const text = t('shareText')(me.num, pos, t('rank')(myRank));
      const a = $('share');
      a.href = `https://x.com/intent/post?text=${encodeURIComponent(text)}&url=${encodeURIComponent(SHARE_URL)}`;
      if (matchMedia('(pointer: coarse)').matches) { a.removeAttribute('target'); a.removeAttribute('rel'); }
      else { a.target = '_blank'; a.rel = 'noopener'; }
    }

    applyLang(); renderBoxes();
  </script>
</body>
</html>
