<script>
(() => {
  const SHARE_URL = 'https://keifurukawafunnych.com/games/fukuwarai/';
  const store = {
    get(k, d) { try { const v = localStorage.getItem('fukuwarai:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('fukuwarai:' + k, JSON.stringify(v)); } catch {} },
  };
  const DICT = {
    ja: {
      title: '福笑いメーカー', back: '← トップへ戻る', pick: '画像をえらぶ', erase: '消す', undo: '戻す',

    },
    ko: {
      title: '후쿠와라이 메이커', back: '← 처음으로', pick: '이미지 선택', erase: '지우기', undo: '되돌리기',
      next: '다음', skip: '건너뛰기', save: '저장', post: 'X에 게시', again: '한 번 더', newimg: '이미지 변경',
      parts: ['눈썹', '눈썹', '눈', '눈', '코', '입'],
      shareText: '후쿠와라이를 만들었어요\n#福笑いメーカーゲーム', err: '이미지를 불러올 수 없습니다',
    },
    en: {
      title: 'Fukuwarai Maker', back: '← Back to top', pick: 'Choose image', erase: 'Erase', undo: 'Undo',
      next: 'Next', skip: 'Skip', save: 'Save', post: 'Post on X', again: 'Again', newimg: 'New image',
      parts: ['Brow', 'Brow', 'Eye', 'Eye', 'Nose', 'Mouth'],
      shareText: 'I made a Fukuwarai face\n#福笑いメーカーゲーム', err: 'Could not load the image',
    },
    th: {
      title: 'ฟุกุวาไรเมกเกอร์', back: '← กลับหน้าแรก', pick: 'เลือกรูป', erase: 'ลบ', undo: 'ย้อน',
      next: 'ถัดไป', skip: 'ข้าม', save: 'บันทึก', post: 'โพสต์บน X', again: 'อีกครั้ง', newimg: 'เปลี่ยนรูป',
      parts: ['คิ้ว', 'คิ้ว', 'ตา', 'ตา', 'จมูก', 'ปาก'],
      shareText: 'ฉันทำหน้าฟุกุวาไรแล้ว\n#福笑いメーカーゲーム', err: 'โหลดรูปไม่ได้',
    },
  };
  const autoLang = () => { for (const l of navigator.languages?.length ? navigator.languages : [navigator.language || '']) { const c = l.toLowerCase().slice(0, 2); if (DICT[c]) return c; } return 'en'; };
  let lang = store.get('lang', autoLang());
  if (!DICT[lang]) lang = 'en';
  const t = k => DICT[lang][k];
  const $ = id => document.getElementById(id);

  // ---------- sound ----------
  let soundOn = store.get('sound', true), actx = null;
  const SPK = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>';
  function drawSnd() {
    $('snd').innerHTML = SPK + (soundOn ? '<path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>' : '<path d="M17 9l5 6M22 9l-5 6"/>') + '</svg>';
  }
  function tone(f0, f1, dur, vol, type) {
    if (!soundOn) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain(), now = actx.currentTime;
      o.type = type || 'sine';
      o.frequency.setValueAtTime(f0, now);
      o.frequency.exponentialRampToValueAtTime(f1, now + dur * 0.8);
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(vol, now + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      o.connect(g).connect(actx.destination); o.start(now); o.stop(now + dur + 0.01);
    } catch {}
  }
  const pon = () => tone(520, 200, 0.14, 0.3);
  const fanfare = () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, f, 0.18, 0.15, 'triangle'), i * 110));

  // ---------- state ----------
  const cv = $('cv'), ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  let mode = 'start';
  let img = null;                       // source canvas (downscaled)
  let masks = [], mctx = null;          // one paint mask per part
  let partIdx = 0;
  let view = null;                      // image placement on screen
  let brushIdx = 1, erasing = false, undoStack = [];
  let blank = null;                     // face with the parts filled in
  let parts = [];                       // cut-out parts {spr, x, y, rot, ...}
  let cur = 0, waitT = 0;               // index of the moving part
  const NPARTS = 6;

  // ---------- layout ----------
  function resize() {
    const r = $('stage').getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    if (img) placeImage();
    render();
  }
  function placeImage() {
    const pad = 12, k = Math.min((W - pad * 2) / img.width, (H - pad * 2 - (mode === 'paint' ? 30 : 0)) / img.height);
    view = { k, fit: k, x: (W - img.width * k) / 2, y: (H - img.height * k) / 2 + (mode === 'paint' ? 15 : 0) };
  }
  function snapFit() { if (view.k <= view.fit * 1.001) placeImage(); }

  // ---------- image loading ----------
  function loadFile(f) {
    if (!f || !f.type.startsWith('image/')) return;
    const url = URL.createObjectURL(f);
    const im = new Image();
    im.onload = () => {
      URL.revokeObjectURL(url);
      const k = Math.min(1, 1200 / Math.max(im.width, im.height));
      img = document.createElement('canvas');
      img.width = Math.max(1, Math.round(im.width * k)); img.height = Math.max(1, Math.round(im.height * k));
      img.getContext('2d').drawImage(im, 0, 0, img.width, img.height);
      masks = [];
      for (let i = 0; i < NPARTS; i++) { const m = document.createElement('canvas'); m.width = img.width; m.height = img.height; masks.push(m); }
      startPaint(0);
    };
    im.onerror = () => { URL.revokeObjectURL(url); flashErr(); };
    im.src = url;
  }
  function flashErr() {
    const d = document.createElement('div'); d.id = 'err'; d.textContent = t('err');
    $('stage').appendChild(d); setTimeout(() => d.remove(), 2000);
  }
  function startPaint(i) {
    partIdx = i; mctx = masks[i].getContext('2d');
    undoStack = []; erasing = false; touches.clear(); pinch = null; lastPt = null;
    setMode('paint'); placeImage(); render();
  }

  // ---------- painting ----------
  let lastPt = null, pinch = null;
  const touches = new Map();
  const mid = (a, b) => { const r = cv.getBoundingClientRect(); return { x: (a.x + b.x) / 2 - r.left, y: (a.y + b.y) / 2 - r.top }; };
  function toImg(e) {
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left - view.x) / view.k, y: (e.clientY - r.top - view.y) / view.k };
  }
  const BRUSH = [8, 22, 50];
  const brushPx = () => BRUSH[brushIdx] / view.k;
  function stroke(a, b) {
    mctx.save();
    mctx.globalCompositeOperation = erasing ? 'destination-out' : 'source-over';
    mctx.strokeStyle = '#000'; mctx.fillStyle = '#000';
    mctx.lineCap = 'round'; mctx.lineJoin = 'round'; mctx.lineWidth = brushPx();
    mctx.beginPath(); mctx.moveTo(a.x, a.y); mctx.lineTo(b.x, b.y); mctx.stroke();
    mctx.beginPath(); mctx.arc(b.x, b.y, brushPx() / 2, 0, Math.PI * 2); mctx.fill();
    mctx.restore();
  }
  function maskBox(m) {
    const d = m.getContext('2d').getImageData(0, 0, m.width, m.height).data;
    let x0 = m.width, y0 = m.height, x1 = -1, y1 = -1;
    for (let y = 0; y < m.height; y++) for (let x = 0; x < m.width; x++) {
      if (d[(y * m.width + x) * 4 + 3] > 20) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
    return x1 < 0 ? null : { x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1 };
  }
  let painted = false;
  function updateNext() {
    painted = !!maskBox(masks[partIdx]);
    $('next').textContent = painted ? t('next') : t('skip');
    // the last part can only be skipped if some other part was cut
    $('next').disabled = !painted && partIdx === NPARTS - 1 && !masks.slice(0, -1).some(m => maskBox(m));
  }

  // ---------- making the blank face ----------
  // pull-push fill: holes take a smooth blend of the colors around them
  function fillHoles(src, hole) {
    const w = src.width, h = src.height;
    const sd = src.getContext('2d').getImageData(0, 0, w, h), s = sd.data;
    const m = hole.getContext('2d').getImageData(0, 0, w, h).data;
    const levels = [];
    let L = { w, h, c: new Float32Array(w * h * 3), a: new Float32Array(w * h) };
    for (let i = 0; i < w * h; i++) {
      if (m[i * 4 + 3] > 10) continue;
      L.a[i] = 1; L.c[i * 3] = s[i * 4]; L.c[i * 3 + 1] = s[i * 4 + 1]; L.c[i * 3 + 2] = s[i * 4 + 2];
    }
    levels.push(L);
    while (L.w > 1 || L.h > 1) {
      const nw = Math.ceil(L.w / 2), nh = Math.ceil(L.h / 2);
      const N = { w: nw, h: nh, c: new Float32Array(nw * nh * 3), a: new Float32Array(nw * nh) };
      for (let y = 0; y < nh; y++) for (let x = 0; x < nw; x++) {
        let ws = 0, r = 0, g = 0, b = 0;
        for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 2; dx++) {
          const sx = x * 2 + dx, sy = y * 2 + dy;
          if (sx >= L.w || sy >= L.h) continue;
          const j = sy * L.w + sx, a = L.a[j];
          ws += a; r += L.c[j * 3] * a; g += L.c[j * 3 + 1] * a; b += L.c[j * 3 + 2] * a;
        }
        const i = y * nw + x;
        if (ws > 0) { N.c[i * 3] = r / ws; N.c[i * 3 + 1] = g / ws; N.c[i * 3 + 2] = b / ws; }
        N.a[i] = Math.min(1, ws);
      }
      levels.push(N); L = N;
    }
    for (let l = levels.length - 2; l >= 0; l--) {
      const A = levels[l], B = levels[l + 1];
      for (let y = 0; y < A.h; y++) for (let x = 0; x < A.w; x++) {
        const i = y * A.w + x, a = A.a[i];
        if (a >= 1) continue;
        // bilinear sample of the coarser level
        const fx = Math.max(0, Math.min(B.w - 1, (x + 0.5) / 2 - 0.5)), fy = Math.max(0, Math.min(B.h - 1, (y + 0.5) / 2 - 0.5));
        const x0 = Math.floor(fx), y0 = Math.floor(fy), x1 = Math.min(B.w - 1, x0 + 1), y1 = Math.min(B.h - 1, y0 + 1);
        const tx = fx - x0, ty = fy - y0;
        for (let k = 0; k < 3; k++) {
          const v = (B.c[(y0 * B.w + x0) * 3 + k] * (1 - tx) + B.c[(y0 * B.w + x1) * 3 + k] * tx) * (1 - ty)
                  + (B.c[(y1 * B.w + x0) * 3 + k] * (1 - tx) + B.c[(y1 * B.w + x1) * 3 + k] * tx) * ty;
          A.c[i * 3 + k] = A.c[i * 3 + k] * a + v * (1 - a);
        }
        A.a[i] = 1;
      }
    }
    const F = levels[0];
    for (let i = 0; i < w * h; i++) {
      if (m[i * 4 + 3] <= 10) continue;
      s[i * 4] = F.c[i * 3]; s[i * 4 + 1] = F.c[i * 3 + 1]; s[i * 4 + 2] = F.c[i * 3 + 2]; s[i * 4 + 3] = 255;
    }
    const out = document.createElement('canvas'); out.width = w; out.height = h;
    out.getContext('2d').putImageData(sd, 0, 0);
    return out;
  }
  function buildPlay() {
    parts = [];
    const hole = document.createElement('canvas'); hole.width = img.width; hole.height = img.height;
    const hg = hole.getContext('2d');
    const r = Math.max(2, Math.round(Math.max(img.width, img.height) * 0.008));
    masks.forEach(m => {
      const b = maskBox(m); if (!b) return;
      // the hole is a little bigger than the part so no edge of it is left behind
      for (let a = 0; a < 16; a++) hg.drawImage(m, Math.cos(a / 8 * Math.PI) * r, Math.sin(a / 8 * Math.PI) * r);
      hg.drawImage(m, 0, 0);
      const c = document.createElement('canvas'); c.width = b.w; c.height = b.h;
      const g = c.getContext('2d');
      g.drawImage(img, b.x, b.y, b.w, b.h, 0, 0, b.w, b.h);
      g.globalCompositeOperation = 'destination-in';
      g.drawImage(m, b.x, b.y, b.w, b.h, 0, 0, b.w, b.h);
      parts.push({ spr: c, x: 0, y: 0, rot: 0, stopped: false });
    });
    blank = fillHoles(img, hole);
    cur = 0; launch(parts[0]);
  }
  function launch(p) {
    const ang = Math.random() * Math.PI * 2;
    p.x = img.width * (0.2 + Math.random() * 0.6); p.y = img.height * (0.2 + Math.random() * 0.6);
    p.dir = ang; p.t = Math.random() * 10;
    p.spd = 0.55 + Math.random() * 0.35;          // image diagonals per second
    p.rotA = 0.25 + Math.random() * 0.5; p.rotW = 2 + Math.random() * 3;
    p.started = performance.now();
  }
  function movePart(p, dt) {
    const D = Math.hypot(img.width, img.height);
    p.t += dt;
    p.dir += (Math.random() - 0.5) * 9 * dt + Math.sin(p.t * 1.7) * 2 * dt;
    const sp = p.spd * D * (0.7 + 0.5 * Math.sin(p.t * 2.3));
    p.x += Math.cos(p.dir) * sp * dt; p.y += Math.sin(p.dir) * sp * dt;
    const mx = img.width * 0.08, my = img.height * 0.08;
    if (p.x < mx) { p.x = mx; p.dir = Math.PI - p.dir; }
    if (p.x > img.width - mx) { p.x = img.width - mx; p.dir = Math.PI - p.dir; }
    if (p.y < my) { p.y = my; p.dir = -p.dir; }
    if (p.y > img.height - my) { p.y = img.height - my; p.dir = -p.dir; }
    p.rot = p.rotA * Math.sin(p.t * p.rotW);
  }
  function stopPart() {
    if (mode !== 'play' || waitT > 0) return;
    const p = parts[cur]; if (!p || performance.now() - p.started < 250) return;
    p.stopped = true; pon();
    if (cur === parts.length - 1) { waitT = 0.6; } else { cur++; launch(parts[cur]); waitT = 0.25; }
  }

  // ---------- drawing ----------
  function drawFace(g, ox, oy, k, all) {
    g.drawImage(blank, ox, oy, img.width * k, img.height * k);
    parts.forEach((p, i) => {
      if (!all && i > cur) return;
      g.save();
      g.translate(ox + p.x * k, oy + p.y * k); g.rotate(p.rot);
      g.drawImage(p.spr, -p.spr.width / 2 * k, -p.spr.height / 2 * k, p.spr.width * k, p.spr.height * k);
      g.restore();
    });
  }
  const tint = (m, color) => {
    const c = document.createElement('canvas'); c.width = m.width; c.height = m.height;
    const g = c.getContext('2d'); g.drawImage(m, 0, 0);
    g.globalCompositeOperation = 'source-in'; g.fillStyle = color; g.fillRect(0, 0, c.width, c.height);
    return c;
  };
  // small face diagram that shows which part to paint
  function drawGuide(g, cx, cy, s, idx) {
    g.save(); g.translate(cx, cy);
    g.fillStyle = '#fff'; g.strokeStyle = '#d9b9a4'; g.lineWidth = 2;
    g.beginPath(); g.ellipse(0, 0, s * 0.42, s * 0.5, 0, 0, Math.PI * 2); g.fill(); g.stroke();
    const col = i => (i === idx ? '#e8763c' : '#d9c6b8');
    g.lineCap = 'round';
    [[-1, 0], [1, 1]].forEach(([sx, i]) => {
      g.strokeStyle = col(i); g.lineWidth = s * 0.06;
      g.beginPath(); g.moveTo(sx * s * 0.08, -s * 0.2); g.lineTo(sx * s * 0.26, -s * 0.22); g.stroke();
    });
    [[-1, 2], [1, 3]].forEach(([sx, i]) => {
      g.fillStyle = col(i); g.beginPath(); g.ellipse(sx * s * 0.17, -s * 0.07, s * 0.075, s * 0.05, 0, 0, Math.PI * 2); g.fill();
    });
    g.fillStyle = col(4); g.beginPath(); g.moveTo(0, -s * 0.02); g.lineTo(s * 0.06, s * 0.14); g.lineTo(-s * 0.06, s * 0.14); g.closePath(); g.fill();
    g.strokeStyle = col(5); g.lineWidth = s * 0.06;
    g.beginPath(); g.moveTo(-s * 0.13, s * 0.27); g.quadraticCurveTo(0, s * 0.36, s * 0.13, s * 0.27); g.stroke();
    g.restore();
  }
  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    if (mode === 'start') {
      drawGuide(ctx, W / 2, H / 2, Math.min(W, H) * 0.6, -1);
      return;
    }
    if (mode === 'paint') {
      ctx.drawImage(img, view.x, view.y, img.width * view.k, img.height * view.k);
      masks.forEach((m, i) => {
        if (i === partIdx) return;
        ctx.globalAlpha = 0.45; ctx.drawImage(tint(m, '#777'), view.x, view.y, img.width * view.k, img.height * view.k);
      });
      ctx.globalAlpha = 0.55;
      ctx.drawImage(tint(masks[partIdx], '#ff7a2e'), view.x, view.y, img.width * view.k, img.height * view.k);
      ctx.globalAlpha = 1;
      const s = Math.min(70, W * 0.18);
      drawGuide(ctx, s / 2 + 8, s / 2 + 8, s, partIdx);
      return;
    }
    drawFace(ctx, view.x, view.y, view.k, mode === 'result');
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (mode === 'play') {
      if (waitT > 0) {
        waitT -= dt;
        if (waitT <= 0 && parts.every(p => p.stopped)) { setMode('result'); fanfare(); }
      }
      const p = parts[cur];
      if (p && !p.stopped) movePart(p, dt);
      render();
    }
    requestAnimationFrame(loop);
  }

  // ---------- input ----------
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (mode === 'start') { $('file').click(); return; }
    if (mode === 'play') { stopPart(); return; }
    if (mode !== 'paint') return;
    cv.setPointerCapture(e.pointerId);
    touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (touches.size === 1 && !pinch) {
      undoStack.push(mctx.getImageData(0, 0, img.width, img.height));
      if (undoStack.length > 20) undoStack.shift();
      lastPt = toImg(e); stroke(lastPt, lastPt); render();
    } else if (touches.size === 2) {
      // second finger: cancel the stroke just started and zoom instead
      if (lastPt) { const d = undoStack.pop(); if (d) mctx.putImageData(d, 0, 0); lastPt = null; }
      const [a, b] = [...touches.values()];
      pinch = { d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, m0: mid(a, b), k0: view.k, x0: view.x, y0: view.y };
      render();
    }
  });
  cv.addEventListener('pointermove', e => {
    if (mode !== 'paint' || !touches.has(e.pointerId)) return;
    touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && touches.size >= 2) {
      const [a, b] = [...touches.values()], m = mid(a, b);
      const k = Math.max(view.fit, Math.min(view.fit * 12, pinch.k0 * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d0));
      view.x = m.x - (pinch.m0.x - pinch.x0) / pinch.k0 * k;
      view.y = m.y - (pinch.m0.y - pinch.y0) / pinch.k0 * k;
      view.k = k; snapFit(); render();
    } else if (lastPt) { const p = toImg(e); stroke(lastPt, p); lastPt = p; render(); }
  });
  const up = e => {
    if (mode !== 'paint') return;
    touches.delete(e.pointerId);
    if (touches.size === 0) pinch = null;
    if (lastPt) { lastPt = null; updateNext(); }
  };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  // PC: wheel zooms around the cursor
  cv.addEventListener('wheel', e => {
    if (mode !== 'paint') return;
    e.preventDefault();
    const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
    const k = Math.max(view.fit, Math.min(view.fit * 12, view.k * Math.exp(-e.deltaY * 0.0015)));
    view.x = mx - (mx - view.x) / view.k * k; view.y = my - (my - view.y) / view.k * k; view.k = k; snapFit();
    render();
  }, { passive: false });
  window.addEventListener('keydown', e => {
    if (mode === 'play' && (e.code === 'Space' || e.code === 'Enter')) { e.preventDefault(); stopPart(); }
  });

  $('pick').onclick = () => $('file').click();
  $('newimg').onclick = () => $('file').click();
  $('file').onchange = e => { loadFile(e.target.files[0]); e.target.value = ''; };
  $('brush').onclick = () => {
    brushIdx = (brushIdx + 1) % BRUSH.length;
    const d = $('brush').firstChild; d.style.width = d.style.height = [5, 11, 20][brushIdx] + 'px';
  };
  $('erase').onclick = () => { erasing = !erasing; $('erase').classList.toggle('on', erasing); };
  $('undo').onclick = () => {
    const d = undoStack.pop(); if (d) { mctx.putImageData(d, 0, 0); render(); updateNext(); }
  };
  $('next').onclick = () => {
    if (partIdx < NPARTS - 1) { startPaint(partIdx + 1); return; }
    if (!masks.some(m => maskBox(m))) return;
    buildPlay(); waitT = 0; setMode('play');
  };
  $('again').onclick = () => {
    parts.forEach(p => { p.stopped = false; p.rot = 0; });
    cur = 0; launch(parts[0]); waitT = 0; setMode('play');
  };

  // drag & drop
  ['dragenter', 'dragover'].forEach(ev => window.addEventListener(ev, e => { e.preventDefault(); $('drop').classList.remove('hide'); }));
  ['dragleave', 'drop'].forEach(ev => window.addEventListener(ev, e => { e.preventDefault(); $('drop').classList.add('hide'); }));
  window.addEventListener('drop', e => { const f = e.dataTransfer && e.dataTransfer.files[0]; if (f) loadFile(f); });

  // ---------- export ----------
  function exportCanvas() {
    const Wc = 1080, k = Math.min(Wc / img.width, 1600 / img.height);
    const c = document.createElement('canvas'); c.width = Wc; c.height = Math.round(img.height * k) + 90;
    const g = c.getContext('2d');
    g.fillStyle = '#fbf1e6'; g.fillRect(0, 0, c.width, c.height);
    drawFace(g, (Wc - img.width * k) / 2, 0, k, true);
    g.fillStyle = '#b0402a'; g.font = 'bold 34px sans-serif'; g.textAlign = 'right';
    g.fillText('keifurukawafunnych.com', c.width - 30, c.height - 32);
    return c;
  }
  $('save').onclick = () => {
    exportCanvas().toBlob(async blob => {
      const file = new File([blob], 'fukuwarai.png', { type: 'image/png' });
      if (matchMedia('(pointer: coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file] }); return; } catch (err) { if (err.name === 'AbortError') return; }
      }
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'fukuwarai.png';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, 'image/png');
  };

  // ---------- UI text / modes ----------
  function updatePost() {
    const a = $('post');
    a.href = `https://x.com/intent/post?text=${encodeURIComponent(t('shareText'))}&url=${encodeURIComponent(SHARE_URL)}`;
    if (!matchMedia('(pointer: coarse)').matches) { a.target = '_blank'; a.rel = 'noopener'; }
  }
  function updateLabel() { $('part').textContent = mode === 'paint' ? t('parts')[partIdx] : ''; }
  function setMode(m) {
    mode = m;
    $('barStart').classList.toggle('hide', m !== 'start');
    $('barPaint').classList.toggle('hide', m !== 'paint');
    $('barResult').classList.toggle('hide', m !== 'result');
    if (m === 'paint') { $('erase').classList.remove('on'); updateNext(); }
    if (img) placeImage();
    updateLabel(); render();
  }
  function applyLang() {
    document.documentElement.lang = lang;
    document.title = t('title');
    $('back').textContent = t('back');
    $('lang').value = lang;
    for (const k of ['pick', 'erase', 'undo', 'save', 'post', 'again', 'newimg']) $(k).textContent = t(k);
    if (mode === 'paint') updateNext();
    updateLabel(); updatePost();
  }
  $('lang').onchange = () => { lang = $('lang').value; store.set('lang', lang); applyLang(); };
  $('snd').onclick = () => { soundOn = !soundOn; store.set('sound', soundOn); drawSnd(); };

  drawSnd(); applyLang();
  new ResizeObserver(resize).observe($('stage'));
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
