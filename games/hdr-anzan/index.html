      // 結果は K 側に出す
      const r = $('result').style;
      r.left = K.x + 'px'; r.top = K.y + 'px'; r.width = K.w + 'px'; r.height = K.h + 'px';
      renderer.compile(scene, camera);
    }
    addEventListener('resize', resize);

    // ---------- ゲームの流れ ----------
    // idle → count（充電）→ flash（数字が光る）→ answer（入力）→ judge → count ... / result
    let state = 'idle', stage = 1, nums = [], B = 1, ft = 0, lit = false;
    let typed = '', judgeT = 0, correct = false, solved = 0, best = store.get('best', 0), flashDur = 0.25, ghostDur = 2.5, expr = '';
    let ghostA = 0, ghostT = 0, flashK = 0, strobeK = 0, adapt = 1, catHop = 0, catShake = 0, idleT = 0;
    const answer = () => nums.reduce((a, b) => a + b, 0);
    // 式が最大の眩しさで一瞬だけ光り、あとは目に焼き付いた残像だけで読む
    // 進むほど項・桁が増え、光る時間と残像が短くなる
    function makeStage(k) {
      const cnt = Math.min(2 + Math.floor((k - 1) / 3), 4), dg = k <= 2 ? 1 : k <= 7 ? 2 : 3;
      const lo = dg === 1 ? 1 : 10 ** (dg - 1), hi = 10 ** dg - 1;
      nums = [];
      while (nums.length < cnt) nums.push(lo + Math.floor(Math.random() * (hi - lo + 1)));
      expr = nums.join('+');
      flashDur = Math.max(0.05, 0.25 - 0.025 * (k - 1));
      ghostDur = Math.max(0.9, 2.6 - 0.18 * (k - 1));
      B = 100;
    }
    function toIdle() {
      state = 'idle'; stage = 1; solved = 0; typed = ''; lit = false; ghostA = 0;
      clearChan(0); clearChan(1); drawDots(2, 0); padTarget = 0;
      $('result').hidden = true; snap = null;
    }
    function startCount() {
      state = 'count'; ft = 0; typed = ''; makeStage(stage);
      clearChan(0); drawDots(2, 0); padTarget = 0;
      sCharge(1.25);
    }
    function startFlash() { state = 'flash'; ft = 0; lit = true; clearChan(2); clearChan(1); ghostA = 0; drawNum(0, expr); flashK = 1; strobeK = 1; sStrobe(1); }
    function toAnswer() { state = 'answer'; typed = ''; drawNum(2, ''); padTarget = 1; padT = 0; }
    function press(l) {
      if (state !== 'answer') return;
      const k = keys.find(k => k.l === l); if (k) k.press = 1;
      sKey();
      if (l === 'del') typed = typed.slice(0, -1);
      else if (l === 'ok') { if (typed) judge(); return; }
      else if (typed.length < 5) typed = (typed === '0' ? '' : typed) + l;
      drawNum(2, typed);
    }
    function judge() {
      state = 'judge'; judgeT = 0; correct = +typed === answer(); padTarget = 0;
      if (correct) { solved++; sOk(); catHop = 1; setTimeout(sHappy, 120); }
      else { sBuzz(); catShake = 1; setTimeout(sNya, 150); }
    }
    function finish() { if (solved > best) { best = solved; store.set('best', best); } state = 'result'; showResult(); $('result').hidden = false; prepareShare(); }

    function update(dt) {
      idleT += dt;
      // 残像は時間で薄れる
      // 残像: はじめはくっきり、だんだん速く消える
      ghostA = Math.max(0, ghostA - dt / ghostDur * (0.25 + ghostA));
      flashK = Math.max(0, flashK - dt * 14);
      strobeK = Math.max(0, strobeK - dt * 9);
      if (state === 'idle') {
        drawDots(2, 1 + Math.floor(idleT * 2.5) % 3);
      } else if (state === 'count') {
        ft += dt;
        const n = Math.min(3, Math.floor(ft / 0.4) + 1);
        drawDots(2, n);
        if (ft >= 1.3) startFlash();
      } else if (state === 'flash') {
        ft += dt;
        if (lit && ft >= flashDur) { off(); toAnswer(); }
      } else if (state === 'judge') {
        judgeT += dt;
        // 不正解: 答えと、何が光っていたかを見せる
        if (!correct && judgeT > 0.7 && judgeT - dt <= 0.7) { drawNum(2, String(answer())); drawNum(1, expr); ghostA = 0.6; ghostDur = 99; }
        if (correct && judgeT > 0.9) { stage++; startCount(); }
        else if (!correct && judgeT > 1.9) finish();
      }
      // 猫
      catHop = Math.max(0, catHop - dt * 2.2); catShake = Math.max(0, catShake - dt * 1.4);
      catBody.position.y = Math.sin(catHop * Math.PI) * 0.45 + Math.sin(idleT * 2.2) * 0.012;
      catBody.rotation.z = Math.sin(idleT * 30) * 0.12 * catShake;
      catBody.scale.y = 1 + Math.sin(idleT * 2.2) * 0.012;
      armL.rotation.z = 0.32 + strobeK * 0.12 + (state === 'idle' ? Math.sin(idleT * 3) * 0.04 : 0);
      // ほこり
      for (let i = 0; i < DUST; i++) {
        const p = i * 3, v = dustVel[i];
        dustPos[p] += v[0] * dt; dustPos[p + 1] += v[1] * dt; dustPos[p + 2] += v[2] * dt;
        if (dustPos[p + 1] > 6) dustPos[p + 1] = 0; if (dustPos[p + 1] < 0) dustPos[p + 1] = 6;
        if (Math.abs(dustPos[p]) > 6.5) v[0] *= -1; if (Math.abs(dustPos[p + 2]) > 3) v[2] *= -1;
      }
      dustGeo.attributes.position.needsUpdate = true;
      // テンキー
      padK += (padTarget - padK) * Math.min(1, dt * (padTarget ? 7 : 10));
      if (padTarget) padT += dt;
      pad.visible = padK > 0.01;
      for (const k of keys) {
        const e = padTarget ? Math.min(1, Math.max(0, (padT - k.delay) / 0.35)) : padK;
        const ease = 1 - Math.pow(1 - e, 3);
        k.g.position.set(k.home.x, k.home.y - (1 - ease) * 8, k.home.z - k.press * 0.16);
        k.press = Math.max(0, k.press - dt * 8);
        k.lab.material.color.setScalar(0.85 + k.press * 0.6);
      }
      const be = padTarget ? Math.min(1, padT / 0.3) : padK;
      base.position.y = -(1 - (1 - Math.pow(1 - be, 3))) * 8;
    }
    function off() { lit = false; drawNum(1, expr); clearChan(0); ghostA = 0.62; }

    // 光り方を uniform に
    function applyLight() {
      const on = lit ? 1 : 0, lb = Math.log2(B + 1);
      // 光る数字: 段が進むほどにじみが広がる（SDR では白で頭打ちなので、にじみで眩しさを見せる）
      neons[0].g.visible = !!on;
      gMainA.uniforms.k.value = on * 0.95 + flashK * 0.4;
      gMainB.uniforms.k.value = on * 0.42 + flashK * 0.25;
      // HDR: 白く光る所を最初から最大の明るさに
      hdrGain = 1 + 99 * Math.max(on, strobeK); // 画面が出せる限界まで（それ以上は画面側で頭打ち）
      // 残像: 色が変わりながら薄れていく
      const hue = 0.5 + 0.5 * Math.sin(idleT * 1.7);
      const gc = [0.25 + 0.35 * hue, 0.75 - 0.3 * hue, 0.75 + 0.15 * hue];
      coreGhost.color.setRGB(gc[0] * ghostA * 0.7, gc[1] * ghostA * 0.7, gc[2] * ghostA * 0.7);
      gGhostA.uniforms.c.value.setRGB(...gc); gGhostA.uniforms.k.value = ghostA * 0.35;
      gGhostB.uniforms.c.value.setRGB(...gc); gGhostB.uniforms.k.value = ghostA * 0.1;
      neons[1].g.visible = ghostA > 0.01;
      // 入力・答え（アンバー → 正解は緑、不正解は赤く点滅）
      let ac3 = [1, 0.55, 0.12], ab = state === 'idle' || state === 'count' ? 0.55 + (state === 'idle' ? 0.25 * Math.sin(idleT * 5) : 0.3) : 0.9;
      if (state === 'judge' || state === 'result') {
        if (correct) ac3 = [0.35, 1, 0.45];
        else if (judgeT < 0.7) { ac3 = [1, 0.2, 0.15]; ab = Math.floor(judgeT * 8) % 2 ? 0.35 : 0.9; }
        else ac3 = [0.35, 1, 0.45];
      }
      coreAns.color.setRGB(ac3[0] * ab, ac3[1] * ab, ac3[2] * ab);
      gAnsA.uniforms.c.value.setRGB(...ac3); gAnsA.uniforms.k.value = ab * 0.4;
      gAnsB.uniforms.c.value.setRGB(...ac3); gAnsB.uniforms.k.value = ab * 0.1;
      // 3D の部屋にも光を
      const pk = on;
      panelLight.intensity = pk * 45 + flashK * 40;
      halo.material.opacity = on * 1 + flashK * 0.4;
      strobeLight.intensity = strobeK * strobeK * 90;
      strobeFaceMat.emissiveIntensity = strobeK * 6;
      dustMat.opacity = 0.12 + pk * 0.8 + strobeK * 0.4;
      dustMat.size = 0.05 + pk * 0.04;
      beamMat.uniforms.k.value = 0.1 * (1 - pk * 0.5);
      // 目が眩しさに慣れる: 明るい間は部屋が暗く見える
      const target = 1 / (1 + pk * 2.5 + strobeK * 1.5);
      adapt += (target - adapt) * (target < adapt ? 0.5 : 0.04);
      renderer.toneMappingExposure = 1.15 * adapt;
    }

    // ---------- 入力 ----------
    const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
    glCanvas.addEventListener('pointerdown', e => {
      e.preventDefault();
      if (state === 'idle') { startCount(); return; }
      if (state !== 'answer') return;
      ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
      ray.setFromCamera(ndc, padCam);
      const h = ray.intersectObjects(keys.map(k => k.body), false)[0];
      if (h) press(h.object.userData.key);
    });
    addEventListener('keydown', e => {
      if (e.target.tagName === 'SELECT' || e.metaKey || e.ctrlKey || e.altKey) return;
      if (state === 'idle' && (e.key === 'Enter' || e.key === ' ' || /^[0-9]$/.test(e.key))) { e.preventDefault(); startCount(); return; }
      if (state === 'result' && e.key === 'Enter' && document.activeElement === document.body) { e.preventDefault(); $('again').click(); return; }
      if (state !== 'answer') return;
      if (/^[0-9]$/.test(e.key)) press(e.key);
      else if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); press('del'); }
      else if (e.key === 'Enter') { e.preventDefault(); press('ok'); }
    });

    // ---------- 結果 ----------
    const coarse = matchMedia('(pointer: coarse)').matches;
    function showResult() {
      $('rNit').textContent = L[lang].score(solved);
      $('rSub').textContent = L[lang].best(best);
      const a = $('share');
      a.href = `https://x.com/intent/post?text=${encodeURIComponent(L[lang].post(solved))}&url=${encodeURIComponent(URL_)}`;
      if (coarse) { a.removeAttribute('target'); a.removeAttribute('rel'); } else { a.target = '_blank'; a.rel = 'noopener'; }
    }
    $('again').onclick = () => { toIdle(); tone('sine', 600, 900, 0.1, 0.1); };
    $('share').addEventListener('click', e => {
      const text = `${L[lang].post(solved)}\n${URL_}`;
      if (coarse && navigator.share) {
        e.preventDefault();
        const file = snap?.key === lang ? snap.file : null;
        navigator.share(file && navigator.canShare?.({ files: [file] }) ? { files: [file], text } : { text }).catch(() => {});
        return;
      }
      const c = resultImage(); if (!c) return;
      const d = document.createElement('a'); d.href = c.toDataURL('image/png'); d.download = 'hdr-anzan.png'; d.click();
    });
    // 結果画像: パネルと猫のまわりを切り抜き、明るさを大きく、タイトルを小さく
    function resultImage() {
      const W = innerWidth, H = innerHeight, cw = glCanvas.width / W;
      const savedPad = pad.visible; pad.visible = false;
      render();
      pad.visible = savedPad;
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const g = c.getContext('2d');
      g.fillStyle = '#07060a'; g.fillRect(0, 0, 1080, 1080);
      // 面の中心を少し下げて、上に数字を書く余白をつくる
      const side = Math.min(Math.max(faceR.w * 1.75, P.h * 1.1), Math.max(W, H));
      const cx = faceR.x + faceR.w * 0.72, cy = faceR.y + faceR.h * 0.5 - side * 0.04;
      g.drawImage(glCanvas, (cx - side / 2) * cw, (cy - side * 0.42) * cw, side * cw, side * cw, 0, 0, 1080, 1080);
      const sh = g.createLinearGradient(0, 0, 0, 380); sh.addColorStop(0, 'rgba(7,6,10,.9)'); sh.addColorStop(1, 'rgba(7,6,10,0)'); g.fillStyle = sh; g.fillRect(0, 0, 1080, 380);
      const sb = g.createLinearGradient(0, 900, 0, 1080); sb.addColorStop(0, 'rgba(7,6,10,0)'); sb.addColorStop(1, 'rgba(7,6,10,.9)'); g.fillStyle = sb; g.fillRect(0, 900, 1080, 180);
      const font = px => `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans Thai", sans-serif`;
      const text = (s, y, px, max, col, glow) => {
        g.font = font(px); const w = g.measureText(s).width; if (w > max) { px *= max / w; g.font = font(px); }
        g.textAlign = 'center'; g.fillStyle = col; g.shadowColor = glow; g.shadowBlur = px * 0.35; g.fillText(s, 540, y); g.shadowBlur = 0; g.fillText(s, 540, y);
      };
      text(L[lang].score(solved), 200, 150, 980, '#ffffff', 'rgba(255,225,180,.95)');
      text(t('title'), 1045, 50, 900, '#f2ece4', 'rgba(0,0,0,0)');
      return c;
    }
    let snap = null;
    function prepareShare() {
      const key = lang;
      if (snap?.key === key) return;
      snap = { key, file: null };
      setTimeout(() => {
        const c = resultImage();
        c?.toBlob(b => { if (b && snap?.key === key) snap.file = new File([b], 'hdr-anzan.png', { type: 'image/png' }); }, 'image/png');
      }, 60);
    }

    // ---------- 描画 ----------
    function render() {
      renderer.autoClear = true;
      renderer.render(scene, camera);
      if (pad.visible) { renderer.autoClear = false; renderer.clearDepth(); renderer.render(padScene, padCam); renderer.autoClear = true; }
    }
    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      update(dt);
      applyLight();
      render();
      drawHDR();
      requestAnimationFrame(loop);
    }
    toIdle(); resize(); applyLang(); applyLight(); render(); updMode();
    renderer.compile(padScene, padCam);
    requestAnimationFrame(loop);
    initHDR();
  </script>
</body>
</html>
