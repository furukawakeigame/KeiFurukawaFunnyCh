      // カメラ: ドラッグを離したあとは少し流れる
      if (!ptr || ptr.kind !== 'pan') {
        if (Math.abs(camVel) > 0.01) { camTarget = clamp(camTarget + camVel * dt, -panLimit, panLimit); camVel *= Math.exp(-5 * dt); }
        camX += (camTarget - camX) * (1 - Math.exp(-6 * dt));
      }
      camera.position.set(camX, RACK_CY - 0.05, camD);
      camera.lookAt(camX, RACK_CY, 0);
      sun.position.set(camX - 6, 7, 8); sun.target.position.set(camX, 1, 0);
      for (const e of hung) {
        e.pivot.rotation.set(lerp(e.pax, e.ax, alpha), lerp(e.ptw, e.tw, alpha), lerp(e.paz, e.az, alpha));
      }
      // 手元の絵馬: 裏返す・出てくる・ふわふわ
      if (handBody) {
        handRise = Math.min(1, handRise + dt / 0.5);
        const target = handFlip * Math.PI;
        handYaw += (target - handYaw) * (1 - Math.exp(-12 * dt));
        if (Math.abs(target - handYaw) < 0.002) handYaw = target;
        const k = ease(handRise);
        // 出てくるときは小さい所からぽんと膨らむ
        const pop = handRise >= 1 ? 1 : 1 + 2.2 * (k - 1) ** 3 + 1.2 * (k - 1) ** 2;
        handBody.scale.setScalar(Math.max(0.01, pop));
        handBody.position.set(0, Math.sin(time * 1.4) * 0.006, 0);
        handBody.rotation.set(Math.sin(time * 0.9) * 0.008, handYaw, Math.sin(time * 1.1) * 0.008);
      }
      if (fly) stepFly(dt);
      if (zoom) {
        zoom.appear = Math.min(1, zoom.appear + dt / 0.25);
        if (!ptr || ptr.kind !== 'zoom') zoom.yaw += (zoom.target - zoom.yaw) * (1 - Math.exp(-10 * dt));
        zoom.body.rotation.set(0, zoom.yaw, 0);
        dimmer.material.opacity = 0.6 * zoom.appear;
        const z = screenToCam(zoomRect.x, zoomRect.y, zoomRect.w, HAND_D);
        zoom.body.scale.setScalar(z.s * (0.6 + 0.4 * ease(zoom.appear)));
      }
      handGroup.visible = mode === 'draw';
      stepLeaves(dt, time); stepSparks(dt);
      for (const m of lanternLights) m.emissiveIntensity = 1.5 + Math.sin(time * 7 + m.id) * 0.06 + Math.sin(time * 13) * 0.04;
      if (ac) {
        windGain.gain.setTargetAtTime(0.015 + wind * 0.05, ac.currentTime, 0.3);
        penLevel *= Math.exp(-10 * dt);
        penGain.gain.setTargetAtTime(drawing ? penLevel * 0.12 : 0, ac.currentTime, 0.03);
      }
      const show = !hintDone && mode === 'draw' && !fly && handBody ? 'block' : 'none';
      if (hintEl.style.display !== show) hintEl.style.display = show;
    }
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      acc += dt;
      while (acc >= STEP) { step(STEP); acc -= STEP; }
      frameUpdate(dt, acc / STEP);
      renderer.render(scene, camera);
      requestAnimationFrame(loop);
    }

    // ---------- はじめ ----------
    newHand(); handRise = 1;
    applyLang();
    resize();
    arrange();
    // 手書き文字のフォントが届いたら、お手本の絵馬を描き直す
    document.fonts?.load(`40px Yomogi`, '願いますように').then(redrawSamples).catch(() => {});
    loadShared();
    for (let i = 0; i < 120; i++) step(STEP); // 最初から少し揺れている状態に
    frameUpdate(0, 1);
    renderer.compile(scene, camera);
    renderer.render(scene, camera);
    requestAnimationFrame(t0 => { last = t0; loop(t0); });
  </script>
</body>
</html>
