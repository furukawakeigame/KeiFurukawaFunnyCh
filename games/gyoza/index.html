            title: 'เกี๊ยวซ่า', catch: 'ปิดฉากเกี๊ยวซ่าชิ้นสุดท้าย!', back: '← กลับหน้าแรก', again: 'เล่นอีกครั้ง', post: 'โพสต์ลง X', win: 'ชนะ', lose: 'แพ้',
            ate: n => `กินเกี๊ยวซ่าไป ${n} ชิ้น`,
            share: (w, n) => w ? `กินเกี๊ยวซ่าชิ้นสุดท้ายได้ในเกมเกี๊ยวซ่า (กินไป ${n} ชิ้น)` : `โดนแย่งเกี๊ยวซ่าชิ้นสุดท้ายในเกมเกี๊ยวซ่า (กินไป ${n} ชิ้น)` },
    };
    let lang = store.get('lang', null) || autoLang();
    if (!DICT[lang]) lang = 'en';
    const t = k => DICT[lang][k];
    const langSel = document.getElementById('lang');
    langSel.value = lang;
    langSel.addEventListener('change', () => { lang = langSel.value; store.set('lang', lang); applyLang(); });
    function applyLang() {
      document.documentElement.lang = lang;
      document.title = t('title');
      document.getElementById('back').textContent = t('back');
      catchEl.textContent = t('catch');
      bubbles.forEach(b => b.el.textContent = lineText(b));
      renderControls();
      resize();
      if (state === 'result') { showResult(); prepareShare(); }
    }

    // ---------- 音 ----------
    let soundOn = store.get('sound', true);
    const soundBtn = document.getElementById('sound');
    const drawSoundBtn = () => {
      soundBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>${soundOn ? '<path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>' : '<path d="M17 9l5 6M22 9l-5 6"/>'}</svg>`;
    };
    drawSoundBtn();
    soundBtn.addEventListener('click', () => { soundOn = !soundOn; store.set('sound', soundOn); drawSoundBtn(); });
    let ac = null, noiseBuf = null, rumbleG = null;
    // iPhone の消音モードでも鳴るようにする
    function unmuteIOS() {
      try { if (navigator.audioSession) { navigator.audioSession.type = 'playback'; return; } } catch {}
      try {
        const n = 4410, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
        const w = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
        w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
        v.setUint32(24, 44100, true); v.setUint32(28, 88200, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
        const a = document.createElement('audio');
        a.src = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' })); a.loop = true; a.setAttribute('playsinline', '');
        a.play().catch(() => {});
      } catch {}
    }
    function initAudio() {
      if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
      unmuteIOS();
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        const o = ac.createOscillator(), g = ac.createGain(); g.gain.value = 0;
        o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.05);
        noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
        const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        // 回転テーブルが回るゴーッという低い音（回る速さで音量が変わる）
        const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
        const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 260;
        rumbleG = ac.createGain(); rumbleG.gain.value = 0;
        s.connect(lp).connect(rumbleG).connect(ac.destination); s.start();
      } catch { ac = null; }
    }
    addEventListener('pointerdown', initAudio, { capture: true });
    addEventListener('keydown', initAudio, { capture: true });
    const on = () => soundOn && ac;
    function tone(type, f0, f1, dur, vol, delay = 0) {
      if (!on()) return;
      const now = ac.currentTime + delay;
      const o = ac.createOscillator(); o.type = type;
      o.frequency.setValueAtTime(f0, now); o.frequency.exponentialRampToValueAtTime(f1, now + dur);
      const g = ac.createGain(); g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      o.connect(g).connect(ac.destination); o.start(now); o.stop(now + dur + 0.02);
    }
    function noise(dur, vol, freq, type = 'lowpass', q = 1, delay = 0) {
      if (!on()) return;
      const now = ac.currentTime + delay;
      const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
      const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.value = freq; fl.Q.value = q;
      const g = ac.createGain(); g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      s.connect(fl).connect(g).connect(ac.destination); s.start(now, Math.random()); s.stop(now + dur + 0.02);
    }
    // 声: 声帯の振動（のこぎり波＋ゆらぎ）を、母音ごとの共鳴（フォルマント）に通す
    const VOWEL = { a: [800, 1200, 2600], i: [300, 2300, 3000], u: [350, 1250, 2500], e: [500, 1900, 2600], o: [500, 850, 2500], n: [280, 1600, 2500] };
    function voice(f0, seq, dur, vol = 0.4, shake = 0.04, breath = 0.15, delay = 0, rise = 1.4) {
      if (!on()) return;
      const now = ac.currentTime + delay;
      const o = ac.createOscillator(); o.type = 'sawtooth';
      // 高く出て下がる抑揚
      o.frequency.setValueAtTime(f0 * 1.2, now);
      o.frequency.linearRampToValueAtTime(f0 * rise, now + dur * 0.2);
      o.frequency.exponentialRampToValueAtTime(f0 * 0.75, now + dur);
      const vib = ac.createOscillator(); vib.frequency.value = 5.5 + Math.random() * 3;
      const vg = ac.createGain(); vg.gain.value = f0 * shake; vib.connect(vg).connect(o.frequency);
      const ns = ac.createBufferSource(); ns.buffer = noiseBuf; ns.loop = true;
      const ng = ac.createGain(); ng.gain.value = breath;
      const src = ac.createGain();
      o.connect(src); ns.connect(ng).connect(src);
      const out = ac.createGain();
      out.gain.setValueAtTime(0, now);
      out.gain.linearRampToValueAtTime(vol, now + 0.02);
      out.gain.setValueAtTime(vol, now + dur * 0.55);
      out.gain.exponentialRampToValueAtTime(0.001, now + dur);
      const k = f0 > 260 ? 1.15 : 1;
      [1, 0.6, 0.25].forEach((amp, fi) => {
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = fi === 0 ? 6 : 9;
        seq.forEach((v, si) => { const tt = now + dur * si / Math.max(1, seq.length - 1) * 0.7; bp.frequency[si ? 'linearRampToValueAtTime' : 'setValueAtTime'](VOWEL[v][fi] * k, tt); });
        const g = ac.createGain(); g.gain.value = amp * 3;
        src.connect(bp).connect(g).connect(out);
      });
      out.connect(ac.destination);
      o.start(now); vib.start(now); ns.start(now, Math.random());
      o.stop(now + dur); vib.stop(now + dur); ns.stop(now + dur);
    }
    const pick = a => a[Math.floor(Math.random() * a.length)];
    const rnd = (a, b) => a + Math.random() * (b - a);
    // 回転テーブルの引っかかる「カチ」: 短いノイズを硬い共鳴に通す
    function click(vol) {
      if (!on()) return;
      const now = ac.currentTime;
      const s = ac.createBufferSource(); s.buffer = noiseBuf;
      for (const [f, q, g0] of [[2400, 12, 1], [4100, 10, 0.5], [900, 6, 0.4]]) {
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f * rnd(0.95, 1.05); bp.Q.value = q;
        const g = ac.createGain(); g.gain.setValueAtTime(g0 * vol, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
        s.connect(bp).connect(g).connect(ac.destination);
      }
      s.start(now, Math.random()); s.stop(now + 0.05);
    }
    // 吹き出し: 3D の頭の上に、セリフを少しの間だけ出す
    const bubbles = [];
    const lineText = b => (b.cat ? DICT[lang].cat : DICT[lang].lines)[b.key];
    function say(c, key, delay = 0, dur = 1.1) {
      const el = document.createElement('div'); el.className = 'bubble'; el.style.visibility = 'hidden';
      const b = { el, obj: c.head, cat: c.cat, key, t: -delay, dur, up: c.cat ? 0.62 : 0.5 };
      el.textContent = lineText(b);
      stage.append(el); bubbles.push(b);
    }
    const bv = new THREE.Vector3();
    function drawBubbles(dt) {
      for (let k = bubbles.length - 1; k >= 0; k--) {
        const b = bubbles[k]; b.t += dt;
        if (b.t >= b.dur || !b.obj.parent) { b.el.remove(); bubbles.splice(k, 1); continue; }
        if (b.t < 0) continue;
        b.obj.getWorldPosition(bv); bv.y += b.up; bv.project(camera);
        const r = renderer.domElement;
        const x = (bv.x + 1) / 2 * r.clientWidth, y = (1 - bv.y) / 2 * r.clientHeight;
        const pop = b.t < 0.15 ? 0.6 + 0.5 * Math.sin(b.t / 0.15 * Math.PI / 2) * 1.1 : 1;
        b.el.style.visibility = bv.z < 1 ? 'visible' : 'hidden';
        b.el.style.opacity = Math.min(1, (b.dur - b.t) / 0.2);
        b.el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) translate(-50%, -100%) scale(${pop.toFixed(3)})`;
      }

    // もぐもぐ: 口を閉じた短い声＋羽根のパリッとした音
    function sChew(c) {
      say(c, 'chew', 0, 0.8); say(c, 'yum', 0.85, 0.9);
      for (let k = 0; k < 4; k++) {
        voice(c.f0 * rnd(0.95, 1.08), pick([['n', 'u'], ['u', 'n'], ['n', 'o']]), rnd(0.1, 0.14), 0.22, 0.02, 0.25, k * 0.2, 1.15);
        if (k < 2) noise(0.05, 0.12, 3500, 'bandpass', 2, k * 0.2 + 0.02);
      }

      voice(c.f0 * 1.05, ['n', 'n'], 0.45, 0.22, 0.05, 0.2, 0.85, 1.3);
    }
    const sCheer = c => { say(c, 'cheer', 0, 1.8); voice(c.f0 * 1.15, c.cat ? ['i', 'a'] : ['i', 'a'], 0.22, 0.45, 0.04, 0.15); voice(c.f0 * 1.3, c.cat ? ['i', 'a', 'u'] : ['a', 'a', 'a'], 0.75, 0.45, 0.08, 0.15, 0.25, 1.5); };
    const sGroan = (c, d) => say(c, 'groan', d, 1.5) || voice(c.f0 * 0.9, c.cat ? ['i', 'a', 'u'] : ['e', 'e'], 0.8, 0.3, 0.07, 0.25, d, 1.1);
    const sSigh = c => say(c, 'sigh', 0, 0.9) || voice(c.f0 * 0.95, c.cat ? ['i', 'u'] : ['a', 'a'], 0.35, 0.18, 0.03, 0.35, 0, 1.1);
    const sHeave = c => say(c, 'heave', 0, 0.7) || voice(c.f0 * 1.05, c.cat ? ['i', 'a'] : ['e', 'i'], 0.16, 0.25, 0.02, 0.2);
    const sWhoosh = w => noise(0.4, Math.min(0.25, 0.05 + Math.abs(w) * 0.012), 900, 'bandpass', 0.7);

    const stage = document.getElementById('stage');

        f.position.copy(from); f.visible = false; scene.add(f);
        const to = chars[i].head.localToWorld(new THREE.Vector3(0, -0.12, chars[i].cat ? 0.2 : 0.36));
        if (d.gyoza && d.items.length === 0) lastBy = i;
        eats.push({ i, d, f, from, to, delay: eats.length * 0.14, done: false });
      });
      if (!eats.length) { state = 'none'; nobodySigh = Math.random() < 0.6; return; }
      state = 'eat';
      tone('sine', 500, 820, 0.08, 0.08);
    }
    function win(i) {
      state = 'win'; timer = 0; winner = i; camK = 0;
      resize();
      chars.forEach((c, k) => { c.mood = k === i ? 'win' : 'sad'; });
      sCheer(chars[i]);
      chars.forEach((c, k) => { if (k !== i) sGroan(c, 0.5 + k * 0.15); });
    }
    const K_DET = 3, C1 = 0.6, C0 = 1.0;
    const STEP = 1 / 60;
    function step(dt) {
      prevTheta = theta;
      timer += dt;
      idleT = state === 'wait' ? idleT + dt : 0;
      if (state === 'ret') { const k = Math.min(1, timer / 0.3); theta = retFrom + (retTo - retFrom) * (1 - (1 - k) ** 3); if (k >= 1) { state = 'wait'; timer = 0; } }
      else if (state === 'cpu') {
        if (timer >= 0.75 && timer - dt < 0.75) sHeave(chars[cur]);
        if (timer >= 0.85) startSpin(cpuW);
      }
      else if (state === 'spin') {
        // ルーレット: 摩擦で遅くなり、皿の位置（45°ごと）で引っかかる
        const sub = 4, h = dt / sub;
        for (let s = 0; s < sub; s++) {
          const det = -K_DET * Math.sin(8 * theta);
          if (Math.abs(omega) < 0.06) {
            if (Math.abs(det) < C0 * fric && Math.cos(8 * theta) > 0) { omega = 0; break; }
            if (Math.cos(8 * theta) <= 0 && Math.abs(det) < 0.3) omega += (Math.random() < 0.5 ? -1 : 1) * 0.3; // 境目で止まらない
          }
          const a = det - C1 * fric * omega - Math.sign(omega) * C0 * fric;
          omega += a * h; theta += omega * h;
        }
        if (omega === 0 && timer > 0.3) { state = 'settle'; timer = 0; settleFrom = theta; settleTo = slotOf(theta) * SLOT; }
      }
      else if (state === 'settle') { const k = Math.min(1, timer / 0.2); theta = settleFrom + (settleTo - settleFrom) * k; if (k >= 1) land(); }
      else if (state === 'eat') {
        const FLY = 0.55;
        for (const e of eats) {
          const tt = timer - e.delay;
          if (tt < 0 || e.done) continue;
          if (tt < FLY) {
            const k = tt / FLY; e.f.visible = true;
            e.f.position.lerpVectors(e.from, e.to, k); e.f.position.y += Math.sin(k * Math.PI) * 0.6;
            e.f.rotation.y = k * 4;
          } else {
            e.done = true; scene.remove(e.f);
            const c = chars[e.i];
            if (e.d.gyoza) eaten[e.i]++;
            bites[e.i]++;
            for (let k = 0; k < 6; k++) puff(e.to, pick(['#e8b860', '#f2e2bf']), new THREE.Vector3(rnd(-0.6, 0.6), rnd(0.2, 1), rnd(-0.6, 0.6)), 0.02, 0.5, 1, 0, 4);
            sChew(c); c.chewT = 0;
            const g = Math.min(1.7, 1 + 0.06 * bites[e.i]);
            c.body.scale.set(c.bodyScale.x * g, c.bodyScale.y, c.bodyScale.z * (1 + (g - 1) * 1.3));
          }
        }
        if (timer >= 1.5 + eats[eats.length - 1].delay) {
          if (lastBy >= 0) win(lastBy);
          else {
            const empty = dishes.filter(d => !d.gone && !d.gyoza && d.items.length === 0);
            if (empty.length) { empty.forEach(sendWaiter); state = 'waiter'; timer = 0; }
            else nextTurn();
          }
        }
      }
      else if (state === 'waiter') {
        if (waiters.every(w => w.phase === 'out')) nextTurn();
      }
      else if (state === 'none') {
        if (nobodySigh && timer >= 0.15 && timer - dt < 0.15) sSigh(chars[cur]);
        if (timer >= 0.75) nextTurn();
      }
      else if (state === 'win') {
        camK = Math.min(1, camK + dt / 1.1);
        if (timer >= 1.9) finish();
      }
      // 皿が針を通るたびに「カチ」
      const sl = Math.floor(theta / SLOT + 0.5);
      if (sl !== lastSlot) { lastSlot = sl; click(Math.min(0.9, 0.25 + Math.abs(omega) * 0.05) || 0.3); }
      if (rumbleG && ac) rumbleG.gain.setTargetAtTime(soundOn ? Math.min(0.22, Math.abs(state === 'drag' ? dragW : omega) * 0.018) : 0, ac.currentTime, 0.05);
      animChars(dt);
      stepWaiters(dt);
      emitSteam(dt);
      stepFx(dt);
    }
    // しぐさ: CPU が回す手、食べるときのもぐもぐ、勝ち負け
    let clock = 0;
    function animChars(dt) {
      clock += dt;
      chars.forEach((c, i) => {
        // 回す手
        const hand = c.hands[1], rest = c.rest[1];
        let reach = 0, swipe = 0;
        if (state === 'cpu' && cur === i) { reach = Math.min(1, timer / 0.5); swipe = timer > 0.6 ? Math.min(1, (timer - 0.6) / 0.25) : 0; }
        else if (state === 'spin' && cur === i && timer < 0.4) { reach = 1 - timer / 0.4; swipe = 1; }
        const dir = Math.sign(cpuW) || 1;
        hand.position.set(rest.x + (-0.2 - rest.x) * reach * 0 + reach * (-0.15) + swipe * dir * 0.45 * reach, rest.y + reach * 0.08, rest.z + reach * 0.55);
        // 食べている人
        if (c.chewT >= 0) { c.chewT += dt; if (c.chewT > 0.85) c.chewT = -1; }
        const chew = c.chewT;
        if (c.mouth) c.mouth.scale.y = chew >= 0 && chew < 0.85 ? 0.02 + 0.03 * Math.abs(Math.sin(chew * 16)) : 0.02;
        let bob = chew >= 0 && chew < 0.85 ? Math.abs(Math.sin(chew * 16)) * 0.03 : 0;
        // 待っている間も少し体をゆらす
        bob += Math.sin(clock * 1.3 + i * 1.7) * 0.008;
        if (c.cat) c.sprite.scale.set(1 + bob * 2, 1 - bob * 2, 1);
        if (c.mood === 'win') {
          const j = Math.abs(Math.sin(timer * 7)) * 0.25;
          c.g.position.y = j;
          c.hands.forEach((h, k) => h.position.set((k ? 1 : -1) * 0.38, 1.3, 0.1));
          if (c.mouth) c.mouth.scale.set(0.09, 0.06, 0.03);
          c.head.rotation.x = -0.15;
          c.eyes.forEach(e => e.scale.y = 0.02);
        } else if (c.mood === 'sad') {
          c.head.rotation.x = Math.min(0.45, timer * 0.8); c.head.rotation.z = Math.sin(timer * 2 + i) * 0.05;
          c.eyes.forEach(e => e.scale.y = 0.025);
          if (c.cat) c.sprite.material.rotation = Math.min(0.25, timer * 0.4);
        } else {
          c.head.position.y = 0.85 + bob;
          if (c.cat) c.sprite.material.rotation = 0;
        }
      });
    }

    // ---------- 入力 ----------
    const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -0.1);
    function onTable(e) {
      const r = renderer.domElement.getBoundingClientRect();
      ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      ray.setFromCamera(ndc, camera);
      const p = new THREE.Vector3();
      return ray.ray.intersectPlane(plane, p) ? p : null;
    }
    const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));
    let drag = null, dragW = 0;
    // つかんで回す: 指の動いた角度だけテーブルが回り、離した時の速さで勢いよく回る
    renderer.domElement.addEventListener('pointerdown', e => {
      e.preventDefault();
      if (state !== 'wait') return;
      const p = onTable(e); if (!p) return;
      renderer.domElement.setPointerCapture(e.pointerId);
      drag = { id: e.pointerId, theta0: theta, last: Math.atan2(p.x, p.z), acc: 0, samples: [{ t: performance.now(), a: 0 }] };
      state = 'drag'; dragW = 0;
    }, { passive: false });
    renderer.domElement.addEventListener('pointermove', e => {
      if (!drag || e.pointerId !== drag.id) return;
      const p = onTable(e); if (!p) return;
      const a = Math.atan2(p.x, p.z);
      let da = wrap(a - drag.last); drag.last = a;
      const r = Math.hypot(p.x, p.z);
      if (r < 0.3) da = 0; // 真ん中付近は角度が暴れるので無視
      drag.acc += da;
      theta = drag.theta0 + drag.acc;
      const now = performance.now();
      drag.samples.push({ t: now, a: drag.acc });
      while (drag.samples.length > 2 && now - drag.samples[0].t > 120) drag.samples.shift();
      const s0 = drag.samples[0], dt = (now - s0.t) / 1000;
      dragW = dt > 0.01 ? (drag.acc - s0.a) / dt : 0;
    });
    function release(e) {
      if (!drag || e.pointerId !== drag.id) return;
      const now = performance.now();
      const ss = drag.samples.filter(s => now - s.t < 110);
      let w = 0;
      if (ss.length >= 2) { const dt = (ss[ss.length - 1].t - ss[0].t) / 1000; if (dt > 0.015) w = (ss[ss.length - 1].a - ss[0].a) / dt; }
      const d = drag; drag = null; dragW = 0;
      if (Math.abs(w) < 2.5) { state = 'ret'; timer = 0; retFrom = theta; retTo = d.theta0; return; }
      // 弱くても最低限は回り、ぴったり狙えないように少しぶれる
      const mag = THREE.MathUtils.clamp(Math.abs(w) * 1.1 + rnd(-0.6, 0.6), 5, 16);
      startSpin(Math.sign(w) * mag);
    }
    renderer.domElement.addEventListener('pointerup', release);
    renderer.domElement.addEventListener('pointercancel', release);
    addEventListener('keydown', e => {
      if ((e.key === ' ' || e.key === 'Enter') && state === 'wait') { e.preventDefault(); startSpin((Math.random() < 0.5 ? -1 : 1) * rnd(6, 13)); }
    });
    stage.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

    // ---------- 結果 ----------
    const resultEl = document.getElementById('result');
    const coarse = matchMedia('(pointer: coarse)').matches;
    const shareText = () => `${t('share')(winner === 0, eaten[0])}\n${TAG}`;
    function renderControls() {
      controls.innerHTML = '';
      controls.classList.toggle('hide', state !== 'result');
      if (state !== 'result') return;
      const b = document.createElement('button');
      b.className = 'go'; b.textContent = t('again');
      b.addEventListener('click', start);
      controls.append(b);
      const a = document.createElement('a');
      a.className = 'post'; a.textContent = t('post');
      a.href = `https://x.com/intent/post?text=${encodeURIComponent(shareText())}&url=${encodeURIComponent(SHARE_URL)}`;
      if (!coarse) { a.target = '_blank'; a.rel = 'noopener'; }
      // スマホは画像ごと共有シートへ。PCは画像を保存してから投稿画面を開く
      a.addEventListener('click', e => {
        const text = `${shareText()}\n${SHARE_URL}`;
        if (coarse && navigator.share) {
          e.preventDefault();
          const file = shareFile();
          navigator.share(file && navigator.canShare?.({ files: [file] }) ? { files: [file], text } : { text }).catch(() => {});
          return;
        }
        const img = resultImage();
        if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'gyoza.png'; d.click(); }
      });
      controls.append(a);
    }
    let snap = null, shareCache = null;
    function takeSnap() {
      const src = renderer.domElement;
      const focus = camWin.look.clone().project(camera);
      const fx = (focus.x + 1) / 2 * src.width, fy = (1 - focus.y) / 2 * src.height;
      const side = Math.min(src.width, src.height);
      const sx = THREE.MathUtils.clamp(fx - side / 2, 0, src.width - side), sy = THREE.MathUtils.clamp(fy - side * 0.55, 0, src.height - side);
      snap = document.createElement('canvas'); snap.width = snap.height = 1080;
      snap.getContext('2d').drawImage(src, sx, sy, side, side, 0, 0, 1080, 1080);
      shareCache = null;
    }
    function resultImage() {
      if (!snap) return null;
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const g = c.getContext('2d');
      g.drawImage(snap, 0, 0);
      g.textAlign = 'center'; g.lineJoin = 'round';
      const font = px => `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans Thai", sans-serif`;
      const text = (str, y, px, max, fill, line) => {
        g.font = font(px);
        const w = g.measureText(str).width; if (w > max) { px *= max / w; g.font = font(px); }
        g.lineWidth = px * .16; g.strokeStyle = line; g.strokeText(str, 540, y); g.fillStyle = fill; g.fillText(str, 540, y);
      };
      text(t(winner === 0 ? 'win' : 'lose'), 210, 170, 960, '#fff', '#7a1a10');
      text(t('ate')(eaten[0]), 320, 70, 900, '#3a1a0e', '#fff8eb');
      text(t('title'), 1030, 54, 900, '#fff', '#7a1a10');
      return c;
    }
    function prepareShare() {
      if (!snap) return;
      const key = lang;
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'gyoza.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;
    function showResult() {
      resultEl.children[0].textContent = t(winner === 0 ? 'win' : 'lose');
      resultEl.children[1].textContent = t('ate')(eaten[0]);
    }
    function finish() {
      state = 'result';
      showResult();
      resultEl.style.display = 'flex';
      renderControls(); resize();
      snap = null; needSnap = true;
    }
    function start() {
      reset();
      resultEl.style.display = 'none';
      renderControls(); resize();
    }

    // ---------- ループ ----------
    const ease = k => k < 0.5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2;
    function render(alpha) {
      turn.rotation.y = prevTheta + (theta - prevTheta) * alpha;
      const k = ease(camK);
      camera.position.lerpVectors(camDef.pos, camWin.pos, k);
      tmpV.lerpVectors(camDef.look, camWin.look, k);
      camera.lookAt(tmpV);
      // 自分の番の矢印と、番の人の針を光らせる
      const now = performance.now() / 1000;
      arrow.visible = left() > 0 && state !== 'win' && state !== 'result';
      arrow.position.y = 0.32 + Math.abs(Math.sin(now * 3)) * 0.15;
      arrow.rotation.y = now * 1.5;
      drawFinger(now);
      drawBubbles(Math.min(0.05, now - (render.last ?? now))); render.last = now;
      hint.visible = state === 'wait';
      if (hint.visible) { hint.userData.m.opacity = 0.55 + 0.4 * Math.sin(now * 5); hint.rotation.y = Math.sin(now * 2.2) * 0.12; }
      markers.forEach((m, i) => { const act = i === cur && ['wait', 'drag', 'ret', 'cpu', 'spin', 'settle'].includes(state); m.material.emissiveIntensity = act ? 0.6 + 0.4 * Math.sin(now * 6) : 0; m.scale.setScalar(act ? 1.25 : 1); m.scale.y = 0.4; });
      renderer.render(scene, camera);
      if (needSnap) { needSnap = false; takeSnap(); prepareShare(); }
    }
    let last = performance.now(), acc = 0;
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      acc += dt;
      while (acc >= STEP) { step(STEP); acc -= STEP; }
      render(acc / STEP);
      requestAnimationFrame(loop);
    }

    reset();
    resize();
    applyLang();
    // 最初の1回が重くならないように、全部の形を一度描いておく
    { const w = makeWaiter(); scene.add(shade(w.g)); finger.visible = true; renderer.compile(scene, camera); render(1); scene.remove(w.g); }
    requestAnimationFrame(t0 => { last = t0; loop(t0); });
  </script>
</body>
