<script type="module">

// ===== 言語 =====
const L = {
  ja: { say: 'ワタシ　ショドウ　スキ', sayV: ['aai', 'oou', 'ui'], title: '書道ロボ', back: '← トップへ戻る', share: 'ポスト', again: 'もう一度', score: '似てる度', finish: '完成', loadErr: '読み込みに失敗しました。通信状況を確かめて再読み込みしてください。' },

  en: { say: 'I　LIKE　SHODO', sayV: ['ai', 'ai', 'oo'], title: 'Calligraphy Robot', back: '← Top', share: 'Post', again: 'Again', score: 'Match', finish: 'Finish', loadErr: 'Failed to load. Check your connection and reload.' },
  th: { say: 'ฉัน　ชอบ　เขียนพู่กัน', sayV: ['an', 'o', 'iauan'], title: 'หุ่นยนต์เขียนพู่กัน', back: '← กลับหน้าแรก', share: 'โพสต์', again: 'อีกครั้ง', score: 'ความเหมือน', finish: 'เสร็จ', loadErr: 'โหลดไม่สำเร็จ ตรวจสอบการเชื่อมต่อแล้วโหลดใหม่' },
};
const autoLang = () => { for (const l of navigator.languages?.length ? navigator.languages : [navigator.language || '']) { const c = l.toLowerCase().slice(0, 2); if (L[c]) return c; } return 'en'; };
let lang = store.get('lang', null) || autoLang();
if (!L[lang]) lang = 'en';
const t = k => L[lang][k];
function applyLang() {
  document.documentElement.lang = lang;
  document.title = t('title');
  $('lang').value = lang;
  $('back').textContent = t('back');
  if ($('msg').dataset.err) $('msg').textContent = t('loadErr');
  $('shareLabel').textContent = t('share');
  $('again').textContent = t('again');
  $('scoreLbl').textContent = t('score');
  $('hanko').setAttribute('aria-label', t('finish'));
  $('bubbleText').textContent = t('say');
  if (window.updateShare) window.updateShare();

$('lang').onchange = () => { lang = $('lang').value; store.set('lang', lang); applyLang(); };
applyLang();

// 長押しの拡大鏡・メニューを出さない
document.addEventListener('touchstart', e => { if (!e.target.closest('a, button, select, input')) e.preventDefault(); }, { passive: false });
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('selectstart', e => e.preventDefault());

// ===== 音 =====
let soundOn = store.get('sound', true), ac = null, master = null, noiseBuf = null;
function updSound() { $('wave').style.display = soundOn ? '' : 'none'; $('mute').style.display = soundOn ? 'none' : ''; if (brushSnd) brushSnd.out.gain.value = soundOn ? 1 : 0; }
$('sound').onclick = () => { soundOn = !soundOn; store.set('sound', soundOn); updSound(); };
function unmuteIOS() {
  try { if (navigator.audioSession) { navigator.audioSession.type = 'playback'; return; } } catch {}

    const n = 4410, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);

    w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);

    const a = document.createElement('audio');

let brushSnd = null;
function initAudio() {

    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createDynamicsCompressor(); master.connect(ac.destination);
    const g = ac.createGain(); g.gain.value = 0; g.connect(ac.destination);
    const o = ac.createOscillator(); o.connect(g); o.start(); o.stop(ac.currentTime + 0.05);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // 筆が紙をこする音: ずっと鳴らしておき、音量だけを筆の速さで変える
    const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 900;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2600; bp.Q.value = 0.7;
    const vol = ac.createGain(); vol.gain.value = 0;
    const out = ac.createGain(); out.gain.value = soundOn ? 1 : 0;
    src.connect(hp).connect(bp).connect(vol).connect(out).connect(master); src.start();

addEventListener('pointerdown', initAudio, true);
addEventListener('keydown', initAudio, true);
updSound();
const on = () => soundOn && ac;
let voiceEnds = [];
function slot(dur) { const n = ac.currentTime; voiceEnds = voiceEnds.filter(x => x > n); if (voiceEnds.length >= 24) return false; voiceEnds.push(n + dur); return true; }
const gate = {};
function every(key, ms) { const n = performance.now(); if (n - (gate[key] || 0) < ms) return false; gate[key] = n; return true; }
const unplug = nodes => () => { for (const x of nodes) { try { x.disconnect(); } catch {} } };
function noiseSrc(n, dur) { const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true; s.start(n, Math.random() * 0.5); s.stop(n + dur + 0.05); return s; }
// 金属を叩いた音
function clank(v, pitch = 1, delay = 0) {

  const n = ac.currentTime + delay, dur = 0.25 + 0.5 * v;

  out.gain.value = 0.5 * v;
  src.connect(env);
  for (const [f, q, g] of [[640, 30, 1], [1410, 45, 0.8], [2380, 60, 0.6], [3570, 70, 0.45], [5200, 60, 0.25]]) {
    const bp = ac.createBiquadFilter(), gg = ac.createGain();
    bp.type = 'bandpass'; bp.frequency.value = f * pitch * (0.97 + Math.random() * 0.06); bp.Q.value = q;
    gg.gain.setValueAtTime(g * 6, n); gg.gain.exponentialRampToValueAtTime(0.001, n + dur * (1.2 - f / 6000));

// 判子: 木の「コッ」＋紙に押しつける「ポン」
function stampSnd() {

  const n = ac.currentTime, src = noiseSrc(n, 0.08), nodes = [src];
  const env = ac.createGain(); env.gain.setValueAtTime(1, n); env.gain.exponentialRampToValueAtTime(0.001, n + 0.05); src.connect(env); nodes.push(env);

for (const k of ['shPR', 'shRR', 'elbR', 'shPL', 'shRL', 'elbL']) sim.joints[k].kp *= 0.5;
// 両手を体の真ん中へ寄せられるよう、肩の内側への限界を広げる
sim.joints.shRR.j.setLimits(-2.6, 0.85); sim.joints.shRL.j.setLimits(-0.85, 2.6);

// ===== 画面の大きさとカメラ =====
// 遊ぶ時は半紙とロボット、結果では半紙だけが、上下のボタン・パネルを除いた範囲に収まるようにする
const PITCH = 1.42; // ほぼ真上から（ロボの体で筆先が隠れないように） // 見下ろす角度（ラジアン）
const camT = new THREE.Vector3(0, 0.4, 0.6), camGoal = { t: new THREE.Vector3(0, 0.4, 0.6), d: 4 };
let camDist = 4, topPad = 52, botPad = 160;
const fitCam = new THREE.PerspectiveCamera(36, 1, 0.1, 60);
const PLAY_PTS = [[-1.05, 0, PZ0 - 0.17], [1.05, 0, PZ0 - 0.17], [-1.05, 0, PZ0 + PW + 0.17], [1.05, 0, PZ0 + PW + 0.17], [-0.32, 1.72, 0.12], [0.32, 1.72, 0.12], [-PW * 0.45 - 0.3, 1.3, 0.1], [PW * 0.45 + 0.3, 1.3, 0.1]];
const RES_PTS = [[-0.97, 0, PZ0 - 0.08], [0.97, 0, PZ0 - 0.08], [-0.97, 0, PZ0 + PW + 0.08], [0.97, 0, PZ0 + PW + 0.08]];
function fitFor(pts, w, h) {
  fitCam.aspect = w / h; fitCam.updateProjectionMatrix();
  // 見る点は、収めたい点の外接の箱の真ん中
  const lo3 = new THREE.Vector3(Infinity, Infinity, Infinity), hi3 = new THREE.Vector3(-Infinity, -Infinity, -Infinity);
  for (const p of pts) { tv.set(...p); lo3.min(tv); hi3.max(tv); }
  const c = lo3.add(hi3).multiplyScalar(0.5); c.y = 0;
  const dir = new THREE.Vector3(0, Math.sin(PITCH), -Math.cos(PITCH));
  let lo = 0.5, hi = 20;
  const tmp = new THREE.Vector3();
  for (let it = 0; it < 26; it++) {
    const d = (lo + hi) / 2;
    fitCam.position.copy(c).addScaledVector(dir, d); fitCam.lookAt(c); fitCam.updateMatrixWorld();
    let ok = true;
    for (const p of pts) { tmp.set(...p).project(fitCam); if (Math.abs(tmp.x) > 0.94 || Math.abs(tmp.y) > 0.94 || tmp.z > 1) { ok = false; break; } }
    if (ok) hi = d; else lo = d;
  }
  return { t: c, d: Math.min(hi, 12) };
}
function layout(snap) {
  const w = innerWidth, H = innerHeight;
  renderer.setSize(w, H, false);
  const res = finished && !$('result').hidden;
  topPad = res ? Math.max(60, $('result').getBoundingClientRect().bottom + 6) : 52;
  if (res && matchMedia('(max-height: 520px) and (min-aspect-ratio: 4/3)').matches) topPad = 52;
  botPad = 80 + 64 + 16;
  let wL = 0, wR = 0;
  const shortWide = matchMedia('(max-height: 520px) and (min-aspect-ratio: 4/3)').matches;
  if (res && shortWide) { wR = 284; botPad = 70; }
  else if (shortWide) { wL = 96; wR = 110; botPad = 70; } // 判子は左下、筆は右下
  const vw = Math.max(160, w - wL - wR), h = Math.max(160, H - topPad - botPad);
  camera.aspect = vw / h;
  camera.setViewOffset(vw, h, -wL, -topPad, w, H);
  camera.updateProjectionMatrix();
  const f = fitFor(res ? RES_PTS : PLAY_PTS, vw, h);
  camGoal.t.copy(f.t); camGoal.d = f.d;
  if (snap) { camT.copy(f.t); camDist = f.d; }
}
addEventListener('resize', () => layout(false));
layout(true);
function placeCamera() {
  camera.position.set(camT.x, camT.y + Math.sin(PITCH) * camDist, camT.z - Math.cos(PITCH) * camDist);
  camera.lookAt(camT);
  camera.updateMatrixWorld();
}
placeCamera();

// ===== 似てる度: お手本と墨をぼかして重ね、重なり具合（ソフト Dice 係数）を出す =====
function alphaGrid(src, S) {
  const c = document.createElement('canvas'); c.width = c.height = S; const x = c.getContext('2d');
  x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high';
  x.drawImage(src, 0, 0, S, S);
  const d = x.getImageData(0, 0, S, S).data, a = new Float32Array(S * S);
  for (let i = 0; i < S * S; i++) a[i] = d[i * 4 + 3] / 255;
  return a;
}
function blur(a, S, r) {
  const b = new Float32Array(S * S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) { let s = 0, n = 0; for (let k = -r; k <= r; k++) { const xx = x + k; if (xx >= 0 && xx < S) { s += a[y * S + xx]; n++; } } b[y * S + x] = s / n; }
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) { let s = 0, n = 0; for (let k = -r; k <= r; k++) { const yy = y + k; if (yy >= 0 && yy < S) { s += b[yy * S + x]; n++; } } a[y * S + x] = s / n; }
}
function similarity() {
  const S = 96, a = alphaGrid(inkCv, S), b = alphaGrid(tplCv, S);
  for (let i = 0; i < S * S; i++) a[i] = Math.min(1, a[i] * 1.15);
  blur(a, S, 2); blur(b, S, 2); blur(a, S, 1); blur(b, S, 1);
  let ab = 0, aa = 0, bb = 0;
  for (let i = 0; i < S * S; i++) { ab += a[i] * b[i]; aa += a[i] * a[i]; bb += b[i] * b[i]; }
  return aa < 1e-6 ? 0 : 2 * ab / (aa + bb);
}

// ===== 完成（判子）→ 結果 =====
let score = 0, phase = 'play', phaseT = 0;
$('hanko').onclick = () => {
  if (finished || inkUsed < 0.05) return;
  finished = true; fudeOn(false); keys.clear(); stick.id = null; $('stick').classList.remove('on'); updMove();
  score = similarity();
  phase = 'stamp'; phaseT = 0;
  $('hanko').hidden = true; $('fude').hidden = true;
  setFace('focus');
};
function showResult() {
  $('pct').textContent = Math.round(score * 100);
  $('result').hidden = false; $('resBtns').hidden = false;
  layout(true);
  updateShare();
}
$('again').onclick = () => {
  $('result').hidden = true; $('resBtns').hidden = true; $('hanko').hidden = false; $('fude').hidden = false;
  ictx.clearRect(0, 0, N, N); sealT = -1; guideA = 0.13; inkUsed = 0; newStroke(); wet.fill(-99); for (const f of feet) f.ink = 0;
  newChar();
  finished = false; phase = 'play'; started = true;
  $('hanko').disabled = true;
  setFace('normal');
  layout(true);
};

// ===== Xに投稿（半紙の絵に数値とタイトルを重ねた画像つき）=====
const SHARE_URL = 'https://keifurukawafunnych.com/games/robot-shodo/', TAG = '#書道ロボゲーム';
let shareFile = null, shareKey = '';
const snapCv = document.createElement('canvas'); snapCv.width = snapCv.height = 1080;
window.updateShare = function updateShare() {
  const pct = Math.round(score * 100);
  const text = `${t('title')} 「${char}」 ${t('score')} ${pct}%\n${TAG}`;
  const a = $('share');
  a.href = 'https://x.com/intent/post?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(SHARE_URL);
  if (matchMedia('(pointer: coarse)').matches) a.removeAttribute('target'); else { a.target = '_blank'; a.rel = 'noopener'; }
  a.dataset.text = text;
  if (!finished) return;
  const x = snapCv.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 1080); g.addColorStop(0, '#2f271f'); g.addColorStop(1, '#4f4030');
  x.fillStyle = g; x.fillRect(0, 0, 1080, 1080);
  // 半紙（お手本の透かしなし）
  x.save(); x.shadowColor = 'rgba(0,0,0,.45)'; x.shadowBlur = 30; x.shadowOffsetY = 10;
  x.drawImage(washiCv, 150, 40, 780, 780); x.restore();
  // 紙の絵は180°回っているので、カメラから見た向きに戻して描く
  const k = 780 / N; x.save(); x.translate(150 + 780, 40 + 780); x.rotate(Math.PI);
  x.drawImage(inkCv, 0, 0, 780, 780); x.globalAlpha = 0.92; drawSeal(x, k); x.globalAlpha = 1; x.restore();
  // お手本の字（小さく）・数値・タイトル
  const F = 'system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", "Noto Sans Thai", sans-serif';
  x.fillStyle = '#f6efe0'; x.fillRect(150, 862, 150, 150);
  x.fillStyle = '#1b1712'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = `120px ${fontOk ? "'Yuji Syuku'," : ''} serif`; x.fillText(char, 225, 940);
  x.textAlign = 'left'; x.textBaseline = 'alphabetic'; x.fillStyle = '#f6efe0';
  x.font = `600 40px ${F}`; x.globalAlpha = 0.85; x.fillText(t('score'), 340, 900); x.globalAlpha = 1;
  x.font = `800 130px ${F}`; const pw = x.measureText(String(pct)).width; x.fillText(String(pct), 334, 1012);
  x.font = `800 64px ${F}`; x.fillText('%', 340 + pw, 1012);
  x.textAlign = 'right'; x.font = `700 40px ${F}`; x.globalAlpha = 0.8; x.fillText(t('title'), 930, 1012); x.globalAlpha = 1;
  // 共有用ファイルは先に作っておく（押した時に作ると Safari で共有が止まる）
  const key = shareKey = lang + pct + char + strokeNo;
  snapCv.toBlob(b => { if (b && key === shareKey) shareFile = new File([b], 'robot-shodo.png', { type: 'image/png' }); }, 'image/png');
};
$('share').addEventListener('click', e => {
  const text = $('share').dataset.text;
  if (matchMedia('(pointer: coarse)').matches) {
    if (navigator.share && shareFile && navigator.canShare?.({ files: [shareFile] })) {
      e.preventDefault();
      navigator.share({ files: [shareFile], text: `${text}\n${SHARE_URL}` }).catch(() => {});
    }
  } else if (shareFile) {
    const u = URL.createObjectURL(shareFile), d = document.createElement('a');
    d.href = u; d.download = 'robot-shodo.png'; document.body.appendChild(d); d.click(); d.remove();
    setTimeout(() => URL.revokeObjectURL(u), 4000);
  }
});

// ===== 反応 =====
let lastState = sim.state, crashCool = 0, effortCool = 0;
sim.onStep = () => { if (every('step', 120)) servo(0.16, 260, 330, 0.025); };
sim.onLand = () => { if (every('land', 90)) clank(0.14, 0.55); };
sim.onFall = () => { wail(); setFace('dizzy'); tgt.down = false; };
sim.onPhase = ph => {
  if (ph === 'roll') servo(0.9, 120, 220, 0.05);
  else if (ph === 'push') servo(0.8, 150, 280, 0.055);
  else if (ph === 'knees') servo(0.6, 180, 260, 0.045);
  else if (ph === 'squat') { servo(0.8, 160, 300, 0.055); clank(0.15, 0.6, 0.5); }
  else if (ph === 'rise') servo(1.0, 140, 360, 0.06);
};
function handleHits() {
  for (const h of sim.hits) {
    if (h.part && sim.state === 'fallen' && crashCool <= 0) {
      const n = h.part.name;
      if (n === 'torso' || n === 'head' || n === 'pelvis') {
        const v = h.part.body.linvel(), sp = Math.hypot(v.x, v.y, v.z);
        if (sp > 0.8) { const p = h.part.body.translation(); clank(Math.min(1, 0.4 + sp / 4), 0.7); clank(0.5, 0.9, 0.06); spawnDust(p, 8, 1); crashCool = 0.35; }
      }
    }
  }
}
// 筆先の処理（物理の1きざみごと）: 紙に付いていれば墨を引く。毛の長さぶん（TOUCH_H）浮いていても先は紙に触れる
const TOUCH_H = 0.03;
let touchSpeed = 0, poolT = 0;
function afterStep() {
  updateFeet();
  tipState();
  const onPaper = tip.x > PX0 - 0.02 && tip.x < PX0 + PW + 0.02 && tip.z > PZ0 - 0.02 && tip.z < PZ0 + PW + 0.02;
  const touch = tip.y < TIP_R + TOUCH_H && onPaper && !finished;
  const sp = Math.hypot(tipV.x, tipV.z);
  if (touch) {
    if (!wasTouch) {
      const vy = -tipV.y;
      touchSnd(Math.min(1, 0.3 + vy));
      if (vy > 1.6) spawnDrops(tip, tipV, Math.min(6, Math.round(vy * 2)));
      prevTip = { x: tip.x, z: tip.z };
    }
    const press = Math.max(0, Math.min(1, (TIP_R + TOUCH_H - tip.y) / TOUCH_H));
    if (Math.hypot(tip.x - prevTip.x, tip.z - prevTip.z) > 0.002) { inkSeg(prevTip, tip, sp, press); prevTip = { x: tip.x, z: tip.z }; }
    else if (!wasTouch) inkSeg(prevTip, { x: tip.x + 0.0005, z: tip.z }, 0, press);
    else if ((poolT += sim.DT) > 0.08) { poolT = 0; inkSeg(prevTip, { x: prevTip.x + 0.0003, z: prevTip.z }, 0, press); } // 止めている間も墨がにじんで広がる
    touchSpeed = sp;
  } else {
    if (wasTouch) newStroke();
    touchSpeed = 0;
  }
  wasTouch = touch;
}

// カットシーンのカメラと吹き出し・口
const hv = new THREE.Vector3(), hf = new THREE.Vector3(), cpos = new THREE.Vector3(), ctgt = new THREE.Vector3(), hq = new THREE.Quaternion();
function introFrame(dt) {
  intro.t += dt;
  const hb = sim.parts.head.body, ht = hb.translation(), q = hb.rotation();
  hq.set(q.x, q.y, q.z, q.w); hv.set(ht.x, ht.y, ht.z);
  hf.set(0, 0, 1).applyQuaternion(hq); hf.y = 0; hf.normalize();
  // 顔が画面に収まる距離
  const vf = THREE.MathUtils.degToRad(camera.fov) / 2, hfov = Math.atan(Math.tan(vf) * camera.aspect);
  const d = Math.max(0.3 / Math.tan(vf), 0.24 / Math.tan(hfov));
  cpos.copy(hv).addScaledVector(hf, d); cpos.y += 0.03; ctgt.copy(hv); ctgt.y += 0.04;
  if (intro.phase === 'play') {
    // しゃべる
    for (const w of intro.words) if (!w.said && intro.t >= w.t0) { w.said = true; if (intro.voiced) speak(185, w.v, INTRO.mora, 0.5, 0.1); $('bubble').hidden = false; }
    if (intro.t > intro.end + INTRO.hold && intro.voiced) { intro.phase = 'out'; intro.t = 0; $('bubble').hidden = true; }
    camera.position.copy(cpos); camera.lookAt(ctgt);
  } else if (intro.phase === 'out') {
    // 頭の上を回って、いつもの見下ろしへ
    const u = Math.min(1, intro.t / INTRO.out), k = u * u * (3 - 2 * u);
    const px = camera.position.x, py = camera.position.y, pz = camera.position.z; // placeCamera() が置いた遊ぶ時の位置
    camera.position.set(cpos.x + (px - cpos.x) * k, cpos.y + (py - cpos.y) * k + Math.sin(Math.PI * k) * 0.9, cpos.z + (pz - cpos.z) * k);
    camera.lookAt(ctgt.x + (camT.x - ctgt.x) * k, ctgt.y + (camT.y - ctgt.y) * k, ctgt.z + (camT.z - ctgt.z) * k);
    if (u >= 1) { introDone(); placeCamera(); }
  }
  camera.updateMatrixWorld();
  if (!$('bubble').hidden) {
    hv.y += 0.2; hv.project(camera);
    const x = Math.max(130, Math.min(innerWidth - 130, (hv.x + 1) / 2 * innerWidth)), y = Math.max(110, (1 - hv.y) / 2 * innerHeight);
    $('bubble').style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)`;
  }
}

// ===== ループ（物理は 1/120 秒きざみ・描画は補間）=====
let acc = 0, last = performance.now(), faceTimer = 0;
const hintPos = new THREE.Vector3();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  acc += dt;
  while (acc >= sim.DT) {
    for (const v of visuals) { v.pp.copy(v.cp); v.pq.copy(v.cq); }
    sim.step();
    handleHits();
    afterStep();
    for (const v of visuals) readPose(v);
    acc -= sim.DT;
  }
  const a = acc / sim.DT;
  for (const v of visuals) { v.group.position.lerpVectors(v.pp, v.cp, a); v.group.quaternion.slerpQuaternions(v.pq, v.cq, a); }
  // 毛は紙に押しつけるとつぶれて広がる
  const sq = wasTouch ? Math.min(1, (TIP_R + TOUCH_H - tip.y) / TOUCH_H) : 0;
  bristle.scale.set(1.6 * (1 + 0.35 * sq), 1.6 * (1 - 0.3 * sq), 1.6 * (1 + 0.35 * sq));
  // 音
  if (brushSnd) {
    const v = Math.min(1, touchSpeed / 1.5);
    brushSnd.vol.gain.setTargetAtTime(wasTouch ? 0.02 + 0.22 * v : 0, ac.currentTime, 0.03);
    brushSnd.bp.frequency.setTargetAtTime(1800 + 2400 * v, ac.currentTime, 0.05);
  }
  crashCool -= dt; effortCool -= dt;
  if (pull > 0.8 && effortCool <= 0 && sim.state === 'stand') { effort(); effortCool = 2.5; }
  if (sim.state !== lastState) {
    if (sim.state === 'stand' && lastState === 'getup') { setFace(finished ? 'happy' : 'normal'); beep(880, 0.07, 0); beep(1320, 0.1, 0.09); }
    if (sim.state === 'getup') hum();
    lastState = sim.state;
  }
  if (faceMode === 'dizzy') { faceTimer += dt; faceSpin += dt * 5; if (faceTimer > 1 / 15) { faceTimer = 0; drawFace(); } if (sim.state === 'stand') setFace('normal'); }
  else if (!finished && sim.state === 'stand') setFace(tgt.down ? 'focus' : 'normal');
  if (!finished && $('hanko').disabled && inkUsed >= 0.05) $('hanko').disabled = false;
  // 判子を押す流れ
  phaseT += dt;
  if (phase === 'stamp') {
    const T1 = 0.35, T2 = 0.55;
    sealObj.visible = true;
    const yy = phaseT < T1 ? 0.6 * Math.pow(1 - phaseT / T1, 2) : phaseT < T2 ? 0 : Math.min(0.8, (phaseT - T2) * 2);
    sealObj.position.set(sealWorld.x, 0.0065 + yy, sealWorld.z);
    if (phaseT >= T1 && sealT < 0) { sealT = 0; stampSnd(); }
    if (sealT >= 0 && sealT < 1) { sealT = Math.min(1, sealT + dt * 8); paperDirty = true; }
    if (phaseT > T2) { guideA = Math.max(0, guideA - dt * 0.3); paperDirty = true; }
    if (phaseT > 1.0) { sealObj.visible = false; phase = 'result'; phaseT = 0; showResult(); judge(score); setFace(score >= 0.45 ? 'happy' : 'normal'); }
  }
  if (phase === 'result' && guideA > 0) { guideA = Math.max(0, guideA - dt * 0.3); paperDirty = true; }
  if (paperDirty) compose();
  // カメラ
  const kf = 1 - Math.exp(-dt * 3);
  camT.lerp(camGoal.t, kf); camDist += (camGoal.d - camDist) * kf;
  placeCamera();
  if (intro.phase !== 'done') introFrame(dt);
  updateParticles(dt);
  if (!$('hint').classList.contains('off')) {
    hintPos.set(0, 0, PZC).project(camera);
    $('hint').style.left = ((hintPos.x + 1) / 2 * innerWidth) + 'px'; $('hint').style.top = ((1 - hintPos.y) / 2 * innerHeight) + 'px';
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

compose();
renderer.compile(scene, camera);
renderer.render(scene, camera);
requestAnimationFrame(t0 => { last = t0; frame(t0); });
window.__game = { get fontOk() { return fontOk; }, char: () => char, sim, tgt, move, updMove, keys, similarity, get score() { return score; }, camera, layout, tip, hand, handGoal, camGoal, get camDist() { return camDist; }, get topPad() { return topPad; }, inkCv, tplCv, setDirty() { paperDirty = true; } };
</script>
