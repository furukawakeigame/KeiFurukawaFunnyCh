      // 震え・寝息
      const j = shake * 0.025;
      person.position.set(Math.sin(clock * 47) * j, 0, Math.cos(clock * 39) * j * 0.5);
      head.rotation.z = Math.sin(clock * 23) * shake * 0.04 + (cleared ? Math.sin(clock * 1.5) * 0.05 : 0);
    }
    function render(alpha, dt) {
      clock += dt;
      updateBelly(alpha);
      updateFace(dt);
      // 手: マウスなら乗せている所、タッチなら触っている間だけ。最初は見本の手が動く
      let show = false;
      if (state === 'play' && handOn && (pressing || hovering)) {
        show = true; setHandOpacity(1);
        const k = Math.min(1, speed / FAST);
        placeHand(hit.x, hit.z, pressing ? -0.02 : 0.12);
        HSKIN.color.copy(HAND_OK).lerp(HAND_RED, Math.max(0, k - 0.55) / 0.45);
        fingers.forEach((f, i) => f.rotation.x = pressing ? Math.sin(clock * 14 + i) * 0.12 * Math.min(1, speed / 3) - 0.08 : 0.15);
      } else if (state === 'play' && !armed && lumps.length) {
        show = true; setHandOpacity(0.85); HSKIN.color.copy(HAND_OK);
        const l = lumps[0], tt = clock * 6;
        let x = l.x + Math.sin(tt) * 0.32, z = l.z + Math.sin(tt * 2) * 0.08;
        const q = inZone(x, z); if (q > 1.2) { x *= 1.1 / Math.sqrt(q); }
        placeHand(x, z, 0.02);
        fingers.forEach((f, i) => f.rotation.x = Math.sin(clock * 14 + i) * 0.1 - 0.08);
      }
      hand.visible = show;
      renderer.render(scene, camera);
      if (needSnap) { needSnap = false; takeSnap(); prepareShare(); }
    }

    // ---------- 画面 ----------
    function renderControls() {
      controls.innerHTML = '';
      controls.classList.toggle('hide', state !== 'result');
      hud.style.visibility = state === 'result' ? 'hidden' : 'visible';
      if (state !== 'result') return;
      const b = document.createElement('button');
      b.className = 'go'; b.textContent = t('again');
      b.addEventListener('click', start);
      controls.append(b);
      const a = document.createElement('a');
      a.className = 'post'; a.textContent = t('post');
      a.href = `https://x.com/intent/post?text=${encodeURIComponent(t('share')(count, cleared))}&url=${encodeURIComponent(SHARE_URL)}`;
      const coarse = matchMedia('(pointer: coarse)').matches;
      if (!coarse) { a.target = '_blank'; a.rel = 'noopener'; }
      // スマホは画像ごと共有シートへ。PCは画像を保存してから投稿画面を開く
      a.addEventListener('click', e => {
        const text = t('share')(count, cleared);
        if (coarse && navigator.share) {
          e.preventDefault();
          const file = shareFile();
          const data = file && navigator.canShare?.({ files: [file] }) ? { files: [file], text: `${text}\n${SHARE_URL}` } : { text: `${text}\n${SHARE_URL}` };
          navigator.share(data).catch(() => {});
          return;
        }
        const img = resultImage();
        if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'onaka-sasuri.png'; d.click(); }
      });
      controls.append(a);
    }
    // 結果画像: 顔とお腹が入るように切り抜き、個数を重ねる
    let snap = null, shareCache = null, needSnap = false;
    function takeSnap() {
      const src = renderer.domElement;
      const a = new THREE.Vector3(0, 1.0, -3.4).project(camera), b = new THREE.Vector3(0, 0.9, 0.9).project(camera);
      const fx = ((a.x + b.x) / 2 + 1) / 2 * src.width, fy = (1 - (a.y + b.y) / 2) / 2 * src.height;
      const side = Math.min(src.width, src.height, Math.max(Math.abs(a.y - b.y) / 2 * src.height * 1.45, 10));
      const sx = THREE.MathUtils.clamp(fx - side / 2, 0, src.width - side), sy = THREE.MathUtils.clamp(fy - side / 2, 0, src.height - side);
      snap = document.createElement('canvas'); snap.width = snap.height = 1080;
      snap.getContext('2d').drawImage(src, sx, sy, side, side, 0, 0, 1080, 1080);
      shareCache = null;
    }
    function resultImage() {
      if (!snap) return null;
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const g = c.getContext('2d');
      g.drawImage(snap, 0, 0);
      g.textAlign = 'center'; g.fillStyle = '#fff'; g.lineJoin = 'round';
      const font = px => `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans Thai", sans-serif`;
      const text = (str, y, px, max) => {
        g.font = font(px);
        const w = g.measureText(str).width; if (w > max) { px *= max / w; g.font = font(px); }
        g.lineWidth = px * .16; g.strokeStyle = '#6b2a3c'; g.strokeText(str, 540, y); g.fillText(str, 540, y);
      };
      text(t('count')(count), 960, 170, 960);
      text(t('title'), 95, 60, 900);
      return c;
    }
    function prepareShare() {
      if (!snap) return;
      const key = lang;
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'onaka-sasuri.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;
    function start() {
      reset();
      state = 'play';
      resultEl.style.display = 'none';
      renderControls(); resize(); drawHud();
    }
    function showResult() { resultEl.children[0].textContent = t('count')(count); }
    function finish() {
      state = 'result'; hand.visible = false;
      showResult();
      resultEl.style.display = 'flex';
      snap = null; needSnap = true;
      renderControls(); resize();
    }

    // ---------- ループ ----------
    let last = performance.now(), acc = 0;
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      acc += dt;
      while (acc >= STEP) { step(STEP); acc -= STEP; }
      render(acc / STEP, dt);
      requestAnimationFrame(loop);
    }

    reset();
    resize();
    applyLang();
    // 最初の1回が重くならないように、全部の形を一度描いておく
    {
      hand.visible = true; burst(new THREE.Vector3(0, -5, 0), 1, '#fff', 0, 0.01, 0.01, 0, starG); burst(new THREE.Vector3(0, -5, 0), 1, '#fff', 0, 0.01, 0.01, 0);
      for (const o of [...face.squint, ...face.happy, face.smile, face.open, ...face.sweat]) o.visible = true;
      updateBelly(1); renderer.compile(scene, camera); renderer.render(scene, camera);
    }
    requestAnimationFrame(t0 => { last = t0; loop(t0); });
  </script>
</body>
</html>
