    // ---------- 言語 ----------
    const store = {

    const LI = { ja: 1, ko: 2, en: 3, th: 4 };
    const DICT = {
      ja: { title: '魚へん湯呑み', back: '← トップへ戻る', again: 'もう一度', post: 'Xに投稿', count: n => `${n}匹`, share: n => `湯呑みから魚の漢字を${n}匹見つけた #魚へん湯呑みゲーム` },

    const t = k => DICT[lang][k];
    const langSel = document.getElementById('lang');

    langSel.addEventListener('change', () => { lang = langSel.value; store.set('lang', lang); applyLang(); });
    function applyLang() {
      document.documentElement.lang = lang;
      document.title = t('title');
      document.getElementById('back').textContent = t('back');
      drawFuda();
      renderControls();
      if (state === 'result') prepareShare();
    }

    // ---------- 音 ----------
    let soundOn = store.get('sound', true);
    const soundBtn = document.getElementById('sound');
    const drawSoundBtn = () => {
      soundBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>${soundOn ? '<path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>' : '<path d="M17 9l5 6M22 9l-5 6"/>'}</svg>`;
    };
    drawSoundBtn();
    soundBtn.addEventListener('click', () => { soundOn = !soundOn; store.set('sound', soundOn); drawSoundBtn(); });
    let ac = null, scrapeGain = null;
    function unmuteIOS() {
      try { if (navigator.audioSession) { navigator.audioSession.type = 'playback'; return; } } catch {}
      try {
        const n = 4410, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
        const w = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
        w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
        v.setUint32(24, 44100, true); v.setUint32(28, 88200, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
        const a = document.createElement('audio');
        a.src = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' })); a.loop = true; a.setAttribute('playsinline', '');
        a.play().catch(() => {});
      } catch {}
    }
    function initAudio() {
      if (ac) return;
      unmuteIOS();
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        const o = ac.createOscillator(), g = ac.createGain(); g.gain.value = 0;
        o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.05);
        // 湯呑みを回すときの、陶器が木の上で擦れる音（回す速さで大きさを変える）
        const len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
        let b = 0; for (let i = 0; i < len; i++) { b = b * 0.6 + (Math.random() * 2 - 1) * 0.4; d[i] = b * (0.7 + 0.3 * Math.random()); }
        const s = ac.createBufferSource(); s.buffer = buf; s.loop = true;
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.8;
        const bp2 = ac.createBiquadFilter(); bp2.type = 'peaking'; bp2.frequency.value = 2600; bp2.gain.value = 8; bp2.Q.value = 3;
        scrapeGain = ac.createGain(); scrapeGain.gain.value = 0;
        s.connect(bp).connect(bp2).connect(scrapeGain).connect(ac.destination); s.start();

    addEventListener('pointerdown', initAudio, { capture: true });
    addEventListener('keydown', initAudio, { capture: true });
    const on = () => soundOn && ac;
    function tone(type, f0, f1, dur, vol, delay = 0) {
      if (!on()) return;
      const now = ac.currentTime + delay;
      const o = ac.createOscillator(); o.type = type;
      o.frequency.setValueAtTime(f0, now); o.frequency.exponentialRampToValueAtTime(f1, now + dur);
      const g = ac.createGain(); g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      o.connect(g).connect(ac.destination); o.start(now); o.stop(now + dur + 0.02);
    }
    function noise(dur, vol, freq, type = 'lowpass', q = 1) {
      if (!on()) return;
      const now = ac.currentTime;
      const buf = ac.createBuffer(1, Math.floor(ac.sampleRate * dur), ac.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) ** 2;
      const s = ac.createBufferSource(); s.buffer = buf;
      const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.value = freq; fl.Q.value = q;
      const g = ac.createGain(); g.gain.value = vol;
      s.connect(fl).connect(g).connect(ac.destination); s.start(now);

    // 声: 声帯の振動（のこぎり波＋ゆらぎ）と息を、母音ごとの共鳴（フォルマント）に通す
    const VOWEL = { a: [800, 1200, 2600], i: [300, 2300, 3000], u: [350, 1250, 2500], e: [500, 1900, 2600], o: [500, 850, 2500] };
    function voice(f0, seq, dur, vol = 0.5, shake = 0.04, breath = 0.15, k = 1) {
      if (!on()) return;
      const now = ac.currentTime;
      const o = ac.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(f0 * 1.25, now);
      o.frequency.linearRampToValueAtTime(f0 * 1.4, now + dur * 0.15);
      o.frequency.exponentialRampToValueAtTime(f0 * 0.7, now + dur);
      const vib = ac.createOscillator(); vib.frequency.value = 5.5 + Math.random() * 3;
      const vg = ac.createGain(); vg.gain.value = f0 * shake; vib.connect(vg).connect(o.frequency);
      const nb = ac.createBuffer(1, Math.floor(ac.sampleRate * dur), ac.sampleRate), nd = nb.getChannelData(0);
      for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

      const ng = ac.createGain(); ng.gain.value = breath;
      const src = ac.createGain();
      o.connect(src); ns.connect(ng).connect(src);
      const out = ac.createGain();
      out.gain.setValueAtTime(0, now);
      out.gain.linearRampToValueAtTime(vol, now + 0.02);
      out.gain.setValueAtTime(vol, now + dur * 0.55);
      out.gain.exponentialRampToValueAtTime(0.001, now + dur);
      [1, 0.6, 0.25].forEach((amp, fi) => {
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = fi === 0 ? 6 : 9;
        seq.forEach((v, si) => { const tt = now + dur * si / Math.max(1, seq.length - 1) * 0.7; bp.frequency[si ? 'linearRampToValueAtTime' : 'setValueAtTime'](VOWEL[v][fi] * k, tt); });
        const g = ac.createGain(); g.gain.value = amp * 3;
        src.connect(bp).connect(g).connect(out);
      });
      out.connect(ac.destination);
      o.start(now); vib.start(now); ns.start(now);
      o.stop(now + dur); vib.stop(now + dur); ns.stop(now + dur);
    }
    const pick = a => a[Math.floor(Math.random() * a.length)];
    // 湯呑みを爪で弾いた「チン」: 陶器の鳴り（倍音がずれた正弦波）＋当たる瞬間のカチッ
    function chin() {
      if (!on()) return;
      const now = ac.currentTime, f = 1500 + Math.random() * 120;
      [[1, 0.22, 0.9], [2.32, 0.12, 0.6], [4.25, 0.06, 0.35], [6.8, 0.03, 0.2]].forEach(([m, v, d]) => {
        const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = f * m;
        const g = ac.createGain(); g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(v, now + 0.003); g.gain.exponentialRampToValueAtTime(0.0005, now + d);
        o.connect(g).connect(ac.destination); o.start(now); o.stop(now + d + 0.05);

    // 板前の「へいっ！」
    const sHei = () => { const f0 = 120 + Math.random() * 40; voice(f0, pick([['e', 'i'], ['e', 'e', 'i'], ['a', 'i']]), 0.22 + Math.random() * 0.1, 0.5, 0.03, 0.2); };

    // ---------- 画面サイズ ----------

      if (!drag || e.pointerId !== drag.id) return;
      const dx = e.clientX - drag.x, now = performance.now();
      if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 8) { if (!drag.moved) begin(); drag.moved = true; }
      if (drag.moved) {
        const da = dx / (pxPerUnit * R_TOP);
        cup.rotation.y += da;
        const dtm = Math.max(1, now - drag.lt) / 1000;
        drag.v = drag.v * 0.6 + (da / dtm) * 0.4;
        setScrape(Math.abs(da / dtm));
      }
      drag.x = e.clientX; drag.lt = now;
    });
    const endDrag = e => {
      if (!drag || e.pointerId !== drag.id) return;
      if (!drag.moved) { if (state === 'play') tap(e); }
      else if (performance.now() - drag.lt < 80) spin = THREE.MathUtils.clamp(drag.v, -12, 12);
      drag = null;
    };
    cv.addEventListener('pointerup', endDrag);
    cv.addEventListener('pointercancel', e => { if (drag && e.pointerId === drag.id) drag = null; });
    stage.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
    const keys = {};
    addEventListener('keydown', e => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { keys[e.key] = true; if (state === 'play') begin(); e.preventDefault(); } });
    addEventListener('keyup', e => { keys[e.key] = false; });
    let scrapeShown = 0;
    function setScrape(v) { if (!scrapeGain || !ac) return; const g = soundOn ? Math.min(0.12, v * 0.025) : 0; if (Math.abs(g - scrapeShown) > 0.004) { scrapeShown = g; scrapeGain.gain.setTargetAtTime(g, ac.currentTime, 0.04); } }

    // ---------- ゲーム ----------
    let state = 'play', timeLeft = TIME, score = 0, order = [], target = -1, hintT = 0, catUsed = false, endT = 0, needSnap = false, shake = 0;
    const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    function begin() { if (!armed && state === 'play') armed = true; }
    function nextTarget() {
      target = order.length ? order.shift() : -1;
      hintT = 0;
      drawFuda(true);
    }
    function tap(e) {
      begin();
      const i = cellAt(e);
      if (i < 0) return;
      const id = cells[i];
      if (id === CAT) {
        if (!catUsed) { catUsed = true; timeLeft = Math.min(TIME, timeLeft + BONUS); flash(i, '#ffe08a', 0.6, 0.85); sCat(); jump(i); }
        else sCat();
        return;
      }
      if (found.has(i)) return;
      if (id === target) {
        found.add(i); score++;
        flash(i, '#ffd84a', 0.6, 0.9); jump(i); sCorrect();
        drawCup();
        // 当たった字が正面に来るように少し回す
        nextTarget();
        if (target < 0) finishSoon();
      } else {
        timeLeft = Math.max(0, timeLeft - PENALTY);
        flash(i, '#ff3a2a', 0.45, 0.75); shake = 0.3; sWrong();
      }
    }
    function finishSoon() { state = 'over'; endT = 0; sEnd(); setScrape(0); drawGauge(); }
    function reset() {
      const ids = shuffle([...FISH.keys()]).slice(0, NC * NR - 1);
      ids.splice(Math.floor(Math.random() * (NC * NR)), 0, CAT);
      cells = ids; found = new Set();
      const easy = shuffle(ids.filter(id => id >= 0 && id < EASY)), hard = shuffle(ids.filter(id => id >= EASY));
      order = [...easy, ...hard];
      for (const p of patches) { cup.remove(p); p.geometry.dispose(); p.material.dispose(); }
      patches = cells.map((_, i) => makePatch(i));
      flashes.length = 0;
      score = 0; timeLeft = TIME; armed = false; catUsed = false; hintT = 0; spin = 0;
      cup.rotation.y = Math.random() * Math.PI * 2;
      drawCup();
    }
    let shownGauge = -1;
    function drawGauge() {
      const v = Math.round(timeLeft / TIME * 300) / 300;
      if (v !== shownGauge) { shownGauge = v; gaugeBar.style.transform = `scaleX(${v})`; gauge.classList.toggle('low', timeLeft < 10); }
    }
    function drawFuda(pop) {
      if (state === 'result') { fuda.className = 'result'; fuda.textContent = t('count')(score); fitFuda(); return; }
      fuda.className = '';
      fuda.textContent = target >= 0 ? FISH[target][LI[lang]] : '';
      fitFuda();
      if (pop) { void fuda.offsetWidth; fuda.classList.add('pop'); }
    }
    // 長い名前（英語など）は、札が画面からはみ出さないよう文字を小さくする
    function fitFuda() {
      fuda.style.fontSize = '';
      const max = topEl.clientWidth - 32, w = fuda.offsetWidth;
      if (w > max) fuda.style.fontSize = parseFloat(getComputedStyle(fuda).fontSize) * max / w * 0.97 + 'px';
    }
    const STEP = 1 / 60;
    function step(dt) {
      if (state === 'play') {
        if (armed) {
          timeLeft -= dt; hintT += dt;
          if (timeLeft <= 0) { timeLeft = 0; finishSoon(); }
          // しばらく見つからないと、正解の字がうっすら光る
          if (hintT > HINT_AFTER && target >= 0) {
            const i = cells.indexOf(target), p = patches[i];
            if (p && !flashes.some(f => f.m === p)) { p.material.color.set('#ffa800'); p.material.opacity = Math.min(0.75, (hintT - HINT_AFTER) * 0.25) * (0.6 + 0.4 * Math.sin(hintT * 5)); }
          }
          drawGauge();
        }
        const kd = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0);
        if (kd) { spin += kd * dt * 18; spin = THREE.MathUtils.clamp(spin, -3, 3); }
      } else if (state === 'over') {
        endT += dt;
        if (endT > 0.9) finish();
      }
      if (!drag) {
        cup.rotation.y += spin * dt;
        spin *= Math.exp(-dt * 2.6);
        if (Math.abs(spin) < 0.02) spin = 0;
        setScrape(Math.abs(spin));
      }
      shake = Math.max(0, shake - dt);
      cup.position.x = Math.sin(shake * 70) * shake * 0.12;
      stepFx(dt); stepSteam(dt);
    }
    // ヒントの光は、お題が変わったら消す
    function clearHints() { for (const p of patches) if (!flashes.some(f => f.m === p)) p.material.opacity = 0; }

    // ---------- 画面 ----------
    function renderControls() {
      controls.innerHTML = '';
      controls.classList.toggle('hide', state !== 'result');
      gauge.style.visibility = state === 'result' ? 'hidden' : 'visible';
      if (state !== 'result') return;
      const b = document.createElement('button');
      b.className = 'go'; b.textContent = t('again');
      b.addEventListener('click', start);
      controls.append(b);
      const a = document.createElement('a');
      a.className = 'post'; a.textContent = t('post');
      a.href = `https://x.com/intent/post?text=${encodeURIComponent(t('share')(score))}&url=${encodeURIComponent(SHARE_URL)}`;
      const coarse = matchMedia('(pointer: coarse)').matches;
      if (!coarse) { a.target = '_blank'; a.rel = 'noopener'; }
      // スマホは画像ごと共有シートへ。PCは画像を保存してから投稿画面を開く
      a.addEventListener('click', e => {
        const text = t('share')(score);
        if (coarse && navigator.share) {
          e.preventDefault();
          const file = shareFile();
          const data = file && navigator.canShare?.({ files: [file] }) ? { files: [file], text: `${text}\n${SHARE_URL}` } : { text: `${text}\n${SHARE_URL}` };
          navigator.share(data).catch(() => {});
          return;
        }
        const img = resultImage();
        if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'sushi-yunomi.png'; d.click(); }
      });
      controls.append(a);
    }
    // 結果画像: 朱丸の付いた湯呑みに、見つけた数を重ねる
    let snap = null, shareCache = null;
    function takeSnap() {
      const src = renderer.domElement;
      const focus = CENTER.clone().project(camera);
      const fx = (focus.x + 1) / 2 * src.width, fy = (1 - focus.y) / 2 * src.height;
      const sideLen = Math.min(src.width, src.height);
      const sx = THREE.MathUtils.clamp(fx - sideLen / 2, 0, src.width - sideLen), sy = THREE.MathUtils.clamp(fy - sideLen / 2, 0, src.height - sideLen);
      snap = mkCanvas(1080, 1080);
      snap.getContext('2d').drawImage(src, sx, sy, sideLen, sideLen, 0, 0, 1080, 1080);
      shareCache = null;
    }
    function resultImage() {
      if (!snap) return null;
      const c = mkCanvas(1080, 1080), g = c.getContext('2d');
      g.drawImage(snap, 0, 0);
      const gr = g.createLinearGradient(0, 700, 0, 1080); gr.addColorStop(0, 'rgba(30,15,5,0)'); gr.addColorStop(1, 'rgba(30,15,5,.6)'); g.fillStyle = gr; g.fillRect(0, 700, 1080, 380);
      g.textAlign = 'center'; g.fillStyle = '#fff'; g.lineJoin = 'round';
      const font = px => `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans KR", "Noto Sans Thai", sans-serif`;
      const text = (str, y, px, max) => {
        g.font = font(px);
        const w = g.measureText(str).width; if (w > max) { px *= max / w; g.font = font(px); }
        g.lineWidth = px * .16; g.strokeStyle = '#4a2a12'; g.strokeText(str, 540, y); g.fillText(str, 540, y);
      };
      text(t('count')(score), 980, 190, 960);
      text(t('title'), 90, 56, 900);
      return c;
    }
    function prepareShare() {
      if (!snap) return;
      const key = lang;
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'sushi-yunomi.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;
    function start() {
      state = 'play';
      reset();
      nextTarget();
      shownGauge = -1; drawGauge();
      renderControls(); resize();
    }
    function finish() {
      state = 'result'; clearHints();
      drawFuda();
      snap = null; needSnap = true;
      renderControls(); resize();
    }

    // ---------- ループ ----------
    let last = performance.now(), acc = 0, lastTarget = -2, swayT = 0;
    function render() {
      if (target !== lastTarget) { lastTarget = target; clearHints(); }
      renderer.render(scene, camera);
      if (needSnap) { needSnap = false; takeSnap(); prepareShare(); }
    }
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      acc += dt;
      // 回転は固定の刻みで進め、刻みの端数は描く直前に足して滑らかにする
      while (acc >= STEP) { step(STEP); acc -= STEP; }
      const extra = drag ? 0 : spin * acc;
      cup.rotation.y += extra;
      swayT += dt;
      scene.children.forEach(o => { if (o.userData.sway !== undefined) o.rotation.x = Math.sin(swayT * 0.8 + o.userData.sway) * 0.04; });
      render();
      cup.rotation.y -= extra;
      requestAnimationFrame(loop);
    }

    start();
    applyLang();
    // 筆の字体を読み込んだら湯呑みを描き直す（読めなくても明朝で描いておく）
    document.fonts?.addEventListener?.('loadingdone', () => fitFuda());
    if (document.fonts?.load) {
      document.fonts.load(KFONT(100), FISH.map(f => f[0]).join('')).then(() => drawCup()).catch(() => {});
      document.fonts.load('40px "Yuji Syuku"', FISH.map(f => f[1]).join('')).catch(() => {});
    }
    // 最初の1回が重くならないように、魚ときらきらを一度描いておく
    { jump(0); renderer.compile(scene, camera); renderer.render(scene, camera); for (const j of jumpers) scene.remove(j.f); for (const s of sparks) scene.remove(s.s); jumpers.length = 0; sparks.length = 0; }
    requestAnimationFrame(t0 => { last = t0; loop(t0); });
  </script>
</body>
