    };
    drawSoundBtn();
    soundBtn.addEventListener('click', () => { soundOn = !soundOn; store.set('sound', soundOn); drawSoundBtn(); });
    let ac = null, scrapeGain = null;
    function unmuteIOS() {
      try { if (navigator.audioSession) { navigator.audioSession.type = 'playback'; return; } } catch {}
      try {
        const n = 4410, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);

    function initAudio() {

      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        const o = ac.createOscillator(), g = ac.createGain(); g.gain.value = 0;

        // 湯呑みを回すときの、陶器が木の上で擦れる音（回す速さで大きさを変える）
        const len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
        let b = 0; for (let i = 0; i < len; i++) { b = b * 0.6 + (Math.random() * 2 - 1) * 0.4; d[i] = b * (0.7 + 0.3 * Math.random()); }
        const s = ac.createBufferSource(); s.buffer = buf; s.loop = true;
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.8;

    function tone(type, f0, f1, dur, vol, delay = 0) {
      if (!on()) return;
      const now = ac.currentTime + delay;
      const o = ac.createOscillator(); o.type = type;
      o.frequency.setValueAtTime(f0, now); o.frequency.exponentialRampToValueAtTime(f1, now + dur);

    function noise(dur, vol, freq, type = 'lowpass', q = 1) {

    const VOWEL = { a: [800, 1200, 2600], i: [300, 2300, 3000], u: [350, 1250, 2500], e: [500, 1900, 2600], o: [500, 850, 2500] };

      out.gain.setValueAtTime(vol, now + dur * 0.55);
      out.gain.exponentialRampToValueAtTime(0.001, now + dur);
      [1, 0.6, 0.25].forEach((amp, fi) => {
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = fi === 0 ? 6 : 9;
        seq.forEach((v, si) => { const tt = now + dur * si / Math.max(1, seq.length - 1) * 0.7; bp.frequency[si ? 'linearRampToValueAtTime' : 'setValueAtTime'](VOWEL[v][fi] * k, tt); });

    // 湯呑みを爪で弾いた「チン」: 陶器の鳴り（倍音がずれた正弦波）＋当たる瞬間のカチッ
    function chin() {
      if (!on()) return;
      const now = ac.currentTime, f = 1500 + Math.random() * 120;
      [[1, 0.22, 0.9], [2.32, 0.12, 0.6], [4.25, 0.06, 0.35], [6.8, 0.03, 0.2]].forEach(([m, v, d]) => {
        const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = f * m;

    const sCorrect = () => { chin(); const w = pick(HEI), f0 = 125 + Math.random() * 15; setTimeout(() => speak(w, { f0, rate: 1.15, shout: 1.2 }), 120); return 0.12 + parseKana(w).length * 0.13 / 1.15 + 0.15; };

    // ---------- 大将の声（Web Audio で合成して、ひらがなを1音ずつ発音する） ----------
    // 声帯（のこぎり波）と息（ノイズ）を母音ごとの共鳴に通し、子音は破裂・摩擦のノイズと口の形の動きで作る

    function drawGauge() {
      const v = Math.round(timeLeft / TIME * 300) / 300;
      if (v !== shownGauge) { shownGauge = v; gaugeBar.style.transform = `scaleX(${v})`; gauge.classList.toggle('low', timeLeft < 10); }
    }
    function drawBubble(pop) {
      if (state === 'result') { bubble.className = 'result'; bubble.textContent = t('count')(score); }
      else { bubble.className = ''; bubble.textContent = target >= 0 ? FISH[target][LI[lang]] : ''; }
      placeBubble();
      if (pop) { void bubble.offsetWidth; bubble.classList.add('pop'); }
    }
    const STEP = 1 / 60;
    function step(dt) {
      if (state === 'play') {
        if (armed) {
          timeLeft -= dt;
          if (timeLeft <= 0) { timeLeft = 0; finishSoon(); }
          drawGauge();
        }
        const kd = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0);
        if (kd) { spin += kd * dt * 18; spin = THREE.MathUtils.clamp(spin, -3, 3); }
      } else if (state === 'over') {
        endT += dt;
        if (endT > 0.9) finish();
      }
      if (!drag) {
        cup.rotation.y += spin * dt;
        spin *= Math.exp(-dt * 2.6);
        if (Math.abs(spin) < 0.02) spin = 0;
        setScrape(Math.abs(spin));
      }
      shake = Math.max(0, shake - dt);
      cup.position.x = Math.sin(shake * 70) * shake * 0.12;
      stepFx(dt); stepSteam(dt); stepChef(dt);
    }

    // ---------- 画面 ----------
    function renderControls() {
      controls.innerHTML = '';
      controls.classList.toggle('hide', state !== 'result');
      gauge.style.visibility = state === 'result' ? 'hidden' : 'visible';
      if (state !== 'result') return;
      const b = document.createElement('button');
      b.className = 'go'; b.textContent = t('again');
      b.addEventListener('click', start);
      controls.append(b);
      const a = document.createElement('a');
      a.className = 'post'; a.textContent = t('post');
      a.href = `https://x.com/intent/post?text=${encodeURIComponent(t('share')(score))}&url=${encodeURIComponent(SHARE_URL)}`;
      const coarse = matchMedia('(pointer: coarse)').matches;
      if (!coarse) { a.target = '_blank'; a.rel = 'noopener'; }
      // スマホは画像ごと共有シートへ。PCは画像を保存してから投稿画面を開く
      a.addEventListener('click', e => {
        const text = t('share')(score);
        if (coarse && navigator.share) {
          e.preventDefault();
          const file = shareFile();
          const data = file && navigator.canShare?.({ files: [file] }) ? { files: [file], text: `${text}\n${SHARE_URL}` } : { text: `${text}\n${SHARE_URL}` };
          navigator.share(data).catch(() => {});
          return;
        }
        const img = resultImage();
        if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'sushi-yunomi.png'; d.click(); }
      });
      controls.append(a);
    }
    // 結果画像: 大将と朱丸の付いた湯呑みに、見つけた数を重ねる
    let snap = null, shareCache = null;
    function takeSnap() {
      const src = renderer.domElement;
      // 大将と湯呑みの入る範囲の真ん中で切り抜く
      const k = src.width / region.rw, fx = src.width / 2, fy = (region.top + region.rh / 2) * k;
      const sideLen = Math.min(src.width, src.height);
      const sx = THREE.MathUtils.clamp(fx - sideLen / 2, 0, src.width - sideLen), sy = THREE.MathUtils.clamp(fy - sideLen / 2, 0, src.height - sideLen);
      snap = mkCanvas(1080, 1080);
      snap.getContext('2d').drawImage(src, sx, sy, sideLen, sideLen, 0, 0, 1080, 1080);
      shareCache = null;
    }
    function resultImage() {
      if (!snap) return null;
      const c = mkCanvas(1080, 1080), g = c.getContext('2d');
      g.drawImage(snap, 0, 0);
      const gr = g.createLinearGradient(0, 700, 0, 1080); gr.addColorStop(0, 'rgba(30,15,5,0)'); gr.addColorStop(1, 'rgba(30,15,5,.6)'); g.fillStyle = gr; g.fillRect(0, 700, 1080, 380);
      g.textAlign = 'center'; g.fillStyle = '#fff'; g.lineJoin = 'round';
      const font = px => `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans KR", "Noto Sans Thai", sans-serif`;
      const text = (str, y, px, max) => {
        g.font = font(px);
        const w = g.measureText(str).width; if (w > max) { px *= max / w; g.font = font(px); }
        g.lineWidth = px * .16; g.strokeStyle = '#4a2a12'; g.strokeText(str, 540, y); g.fillText(str, 540, y);
      };
      text(t('count')(score), 980, 190, 960);
      text(t('title'), 90, 56, 900);
      return c;
    }
    function prepareShare() {
      if (!snap) return;
      const key = lang;
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'sushi-yunomi.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;
    function start() {
      state = 'play';
      reset();
      nextTarget();
      shownGauge = -1; drawGauge();
      renderControls(); resize();
    }
    function finish() {
      state = 'result';
      renderControls(); resize();
      drawBubble(true); say(countReading(score));
      snap = null; needSnap = true;
    }

    // ---------- ループ ----------
    let last = performance.now(), acc = 0, swayT = 0;
    function render() {
      renderer.render(scene, camera);
      if (needSnap) { needSnap = false; takeSnap(); prepareShare(); }
    }
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      acc += dt;
      // 回転は固定の刻みで進め、刻みの端数は描く直前に足して滑らかにする
      while (acc >= STEP) { step(STEP); acc -= STEP; }
      const extra = drag ? 0 : spin * acc;
      cup.rotation.y += extra;
      swayT += dt;
      scene.children.forEach(o => { if (o.userData.sway !== undefined) o.rotation.x = Math.sin(swayT * 0.8 + o.userData.sway) * 0.04; });
      render();
      cup.rotation.y -= extra;
      requestAnimationFrame(loop);
    }

    start();
    applyLang();
    // 筆の字体を読み込んだら湯呑みを描き直す（読めなくても明朝で描いておく）
    document.fonts?.addEventListener?.('loadingdone', () => placeBubble());
    if (document.fonts?.load) {
      document.fonts.load(KFONT(100), FISH.map(f => f[0]).join('')).then(() => drawCup()).catch(() => {});
      document.fonts.load('40px "Yuji Syuku"', FISH.map(f => f[1]).join('')).catch(() => {});
    }
    // 最初の1回が重くならないように、魚ときらきらを一度描いておく
    { jump(0); renderer.compile(scene, camera); renderer.render(scene, camera); for (const j of jumpers) scene.remove(j.f); for (const s of sparks) scene.remove(s.s); jumpers.length = 0; sparks.length = 0; }
    requestAnimationFrame(t0 => { last = t0; loop(t0); });
  </script>
</body>
