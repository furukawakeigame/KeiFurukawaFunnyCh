    }
    function checkFail() {

    function step(dt) {

    // ---------- 進行 ----------
    function start() {
      state = 'play'; playT = 0; basketHighT = 0; G = 6.2;
      for (const b of BALL_LIST) b.frozen = false;
      balls.basket.v.set(0, -3.4, 0);
      balls.soccer.v.set(0, 3.4, 0.05);
      balls.tennis.p.copy(LIMB.racket.pos).addScaledVector(FACE, 0.08);
      balls.tennis.v.set(0, 0, 0); launchTennis(balls.tennis, 5);
      tennisS.bounces = 0; tennisS.lastBy = 'racket';

      hideHints();
    }
    function fail(who) {

      h.face.open = 0.65; h.face.brow = 0.7; h.face.smile = -0.2;

    }

      resultEl.style.display = 'flex'; controlsEl.style.display = 'flex';
      shareCache = null; snap = null; needSnap = 2;
      layoutCam();
    }
    function reset() {
      state = 'ready'; relaxed.k = 0; score = 0; playT = 0;
      h.face.open = 0; h.face.brow = 0; h.face.smile = 0;
      for (const k in LIMB) { const L = LIMB[k]; L.target.copy(L.home); L.pos.copy(L.home); L.prev.copy(L.home); L.vel.set(0, 0, 0); L.rPrev.copy(L.home); L.ptr = null; }
      for (const b of BALL_LIST) { b.frozen = true; b.q.identity(); }
      placeReady();
      resultEl.style.display = 'none'; controlsEl.style.display = 'none';
      setDusk(0); camBlend = 0;
      layoutCam(); showHints();
    }
    function showResult() {
      document.getElementById('rTime').textContent = t('sec')(fmt(score));
      document.getElementById('rBest').textContent = t('best')(fmt(best));
      shareEl.href = `https://x.com/intent/post?text=${encodeURIComponent(t('share')(fmt(score)))}&url=${encodeURIComponent(SHARE_URL)}`;
    }
    document.getElementById('again').addEventListener('click', reset);

    // ---------- 操作: 画面を縦に3つに分け、置いた指で手足を動かす ----------
    const pointers = new Map();
    const zoneOf = x => x < innerWidth / 3 ? 'hand' : x < innerWidth * 2 / 3 ? 'foot' : 'racket';
    function pxPerMeter() {

      return Math.max(40, Math.hypot((_b.x - _a.x) * layout.w / 2, (_b.y - _a.y) * layout.H / 2));
    }
    renderer.domElement.addEventListener('pointerdown', e => {

      const k = zoneOf(e.clientX), L = LIMB[k];

    renderer.domElement.addEventListener('pointermove', e => {
      const p = pointers.get(e.pointerId); if (!p) return;
      const L = LIMB[p.k], dx = (e.clientX - p.x) / p.ppm, dy = (e.clientY - p.y) / p.ppm;
      if (p.k === 'racket') L.target.set(p.base.x - dx * 1.1, L.home.y, p.base.z - dy * 1.5);
      else L.target.set(p.base.x - dx, p.base.y - dy, p.base.z);

    });
    const up = e => { const p = pointers.get(e.pointerId); if (!p) return; pointers.delete(e.pointerId); if (LIMB[p.k].ptr === e.pointerId) LIMB[p.k].ptr = null; };
    renderer.domElement.addEventListener('pointerup', up);
    renderer.domElement.addEventListener('pointercancel', up);

    // 案内: 手足の上に、ドラッグする指
    const HINT_SVG = dir => `<svg viewBox="0 0 60 84"><path d="M30 2l-7 9h14zM30 82l-7-9h14z" fill="#fff" stroke="#24304a" stroke-width="2" stroke-linejoin="round" opacity=".9"/><g class="hand"><path d="M24 64V24a5 5 0 0 1 10 0v20l1-3a4 4 0 0 1 7 1v3a4 4 0 0 1 7 1v3a4 4 0 0 1 6 2v10c0 8-6 14-14 14h-4c-6 0-9-3-11-7l-7-11a4 4 0 0 1 7-5z" fill="#fff" stroke="#24304a" stroke-width="2.5" stroke-linejoin="round"/></g></svg>`;
    const hints = { hand: document.getElementById('hintHand'), foot: document.getElementById('hintFoot'), racket: document.getElementById('hintRacket') };
    for (const k in hints) hints[k].innerHTML = HINT_SVG(k);
    let hintsOn = true;
    const showHints = () => { hintsOn = true; };
    const hideHints = () => { hintsOn = false; for (const k in hints) hints[k].style.display = 'none'; };
    let hintShown = false;
    function placeHints() {
      if (!hintsOn) return;
      const at = { hand: LIMB.hand.pos.clone().add(V(0, -0.25, 0)), foot: LIMB.foot.pos.clone().add(V(0, 0.18, 0.05)), racket: LIMB.racket.pos.clone() };
      for (const k in hints) {
        at[k].project(camera);
        hints[k].style.left = Math.round((at[k].x + 1) / 2 * layout.w) + 'px';
        hints[k].style.top = Math.round((1 - at[k].y) / 2 * layout.H) + 'px';

      }
      hintShown = true;
    }
    const _showHints = showHints;

    // ---------- 自動プレイ（調整・確認用。window.__bot = true で動く） ----------
    function bot() {
      const s = balls.soccer, bk = balls.basket, tn = balls.tennis;
      const F = LIMB.foot, H = LIMB.hand, R = LIMB.racket;
      F.ptr = H.ptr = R.ptr = 'bot';
      const fy = F.pos.y, gap = s.p.y - s.r - fy;
      F.target.set(s.p.x, s.v.y < 0 && gap < 0.22 ? 0.4 : 0.1, 0.4); reach('foot', F.target);
      H.target.set(bk.p.x, bk.v.y > 0 && bk.p.y + bk.r > H.pos.y - 0.2 ? 0.6 : 0.95, 0.22); reach('hand', H.target);
      let tx = R.home.x, tz = 0.05;
      if (tn.v.z < 0) { const T = (tn.p.z - 0.35) / -tn.v.z; tx = tn.p.x + tn.v.x * T; if (T < 0.18) tz = 0.75; }

    // ---------- カメラ（後ろから / 失敗したら正面へ回り込む） ----------
    const layout = { w: 1, H: 1 };
    const LOOK = V(0, 0.95, 0.6);
    const VIEWS = {
      back: { bottomAlign: true, yaw: Math.PI + 0.3, pitch: 0.6, look: V(-0.2, 0.9, 1.2), keys: [V(0.7, 0, 0.05), V(-1.15, 0, 0.1), V(0.8, 0, 1.0), V(-1.3, 0, 1.0), V(0.45, 1.9, 0), V(-0.45, 1.9, 0), V(0, 2.1, 0.4), V(0, 0.2, 2.6), V(0, 1.9, WALL_Z)] },
      front: { yaw: 0.25, pitch: 0.12, look: V(0, 0.9, 0), keys: [V(0.75, 0, 0.35), V(-0.95, 0, 0.35), V(0.55, 1.85, 0), V(-0.55, 1.85, 0), V(0.75, 0, -0.3), V(-0.95, 0, -0.3)] },

    // region: 大事な物を入れる画面の範囲（上端・下端の px）

    }
    function layoutCam() {

      let top = 54, bottom = H - 84, l = 0, r = w;

    // ---------- 結果画像（X投稿用） ----------
    let snap = null, shareCache = null, needSnap = 0;
    function takeSnap() {

    }

    }

      shareEl.addEventListener('click', e => {
        const text = t('share')(fmt(score));
        if (coarse && navigator.share) {
          e.preventDefault();
          const file = shareFile();
          const data = file && navigator.canShare?.({ files: [file] }) ? { files: [file], text: `${text}\n${SHARE_URL}` } : { text: `${text}\n${SHARE_URL}` };

        if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'santoryu.png'; d.click(); }
      });
    }

    // ---------- ループ ----------
    let lastT = performance.now(), acc = 0, timeScale = 1;
    const shownPos = { hand: V(), foot: V(), racket: V() };
    function render(dt) {
      const alpha = acc / STEP;
      for (const k in LIMB) shownPos[k].lerpVectors(LIMB[k].prev, LIMB[k].pos, alpha);
      poseBody(shownPos);
      for (const b of BALL_LIST) {
        b.rp.lerpVectors(b.prevP, b.p, alpha);

      }

    }
    function loop(now) {
      const dt = Math.min(0.05, (now - lastT) / 1000) * timeScale; lastT = now;
      acc += dt;

      requestAnimationFrame(loop);
    }

    addEventListener('resize', layoutCam);
    setDusk(0);
    placeReady();
    layoutCam();
    applyLang();
    // テスト用の入口
    window.__game = {
      get state() { return state; }, get t() { return playT; }, get score() { return score; }, get failWho() { return failWho; },
      set timeScale(v) { timeScale = v; }, balls, LIMB, camera, hideHints, fail: w => fail(w || 'soccer'), start, sim(n) { for (let i = 0; i < n && state === 'play'; i++) step(STEP); return { state, t: playT, who: failWho }; }, reset: () => reset(),
    };
    // 最初の1回が重くならないように、一度描いておく

  </script>
