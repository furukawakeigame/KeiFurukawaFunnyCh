<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>動肝日</title>
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <!-- X などにURLを貼ったときのカード表示（ここだけは https:// から書く） -->
  <meta name="description" content="遺伝子で決まる酒の強さ。30日間でどれだけ飲める？">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="KeiFurukawaFunnyCh">
  <meta property="og:title" content="動肝日">
  <meta property="og:description" content="遺伝子で決まる酒の強さ。30日間でどれだけ飲める？">
  <meta property="og:url" content="https://keifurukawafunnych.com/games/doukanbi/">
  <meta property="og:image" content="https://keifurukawafunnych.com/games/doukanbi/icon.png">
  <meta name="twitter:card" content="summary">
  <style>
    html, body { margin: 0; height: 100%; background: #fdf3e4; color: #4a3020; }
    body {
      display: flex; flex-direction: column; height: 100dvh;
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic UI", system-ui, sans-serif;
      overflow: hidden;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; width: 100%; max-width: 480px; margin: 0 auto; box-sizing: border-box;
    }
    header a { color: #a0523d; text-decoration: none; font-weight: bold; }
    #sound {
      font-size: 20px; background: #fff; border: 2px solid #ecc9a8; border-radius: 999px;
      width: 44px; height: 36px; cursor: pointer;
    }
    main {
      flex: 1; min-height: 0; width: 100%; max-width: 480px; margin: 0 auto;
      display: flex; flex-direction: column; padding: 0 12px calc(80px + env(safe-area-inset-bottom)); box-sizing: border-box; gap: 8px;
    }
    #hud { display: flex; flex-direction: column; align-items: center; font-weight: bold; min-height: 92px; }
    #day { font-size: 44px; line-height: 1.1; }
    #day small { font-size: 18px; color: #8a6a50; }
    #total { font-size: 28px; color: #b5651d; }
    #stage {
      flex: 1; min-height: 0; display: flex; justify-content: center; align-items: center;
      touch-action: manipulation; cursor: pointer;
    }
    canvas { display: block; }
    #ctrl { min-height: 160px; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }
    button.big {
      font: inherit; font-size: 26px; font-weight: bold; padding: 22px 8px; border-radius: 18px;
      border: none; cursor: pointer; color: #fff; background: #b5651d;
      box-shadow: 0 4px 0 #7c4212; touch-action: manipulation;
    }
    button.big:active { transform: translateY(3px); box-shadow: 0 1px 0 #7c4212; }
    button.rest { background: #4f9a5a; box-shadow: 0 4px 0 #2f6a38; }
    button.sub { background: #fff; color: #7c4212; box-shadow: 0 4px 0 #ecc9a8; font-size: 22px; }
    .seed {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      font-size: 14px; color: #8a6a50;
    }
    .seed b { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 22px; color: #4a3020; letter-spacing: 2px; }
    .seed button {
      font: inherit; font-size: 14px; border: 2px solid #ecc9a8; background: #fff; color: #7c4212;
      border-radius: 999px; padding: 4px 10px; cursor: pointer;
    }
    .hidden { display: none !important; }
    /* 結果・かけ合わせのパネル */
    #panel {
      position: fixed; inset: 0; background: rgba(60, 35, 20, 0.45);
      display: flex; align-items: center; justify-content: center; padding: 12px 12px calc(80px + env(safe-area-inset-bottom)); box-sizing: border-box;
    }
    #panel > div {
      background: #fffaf2; border-radius: 20px; padding: 14px 14px; width: 100%; max-width: 420px;
      max-height: 100%; overflow-y: auto; box-sizing: border-box; text-align: center;
      display: flex; flex-direction: column; gap: 8px;
    }
    #panel button.big { font-size: 19px; padding: 16px 6px; }
    .msg { font-size: 20px; font-weight: bold; }
    .score { font-size: 40px; font-weight: bold; color: #b5651d; line-height: 1.1; }
    .stats { font-size: 16px; }
    button.x { background: #111; box-shadow: 0 4px 0 #555; }
    input#partner {
      font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 24px; text-align: center;
      text-transform: uppercase; letter-spacing: 2px; padding: 10px; border-radius: 12px;
      border: 2px solid #ecc9a8; width: 100%; box-sizing: border-box; background: #fff; color: #4a3020;
    }
    .cross { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 18px; line-height: 1.8; }
    .cross b { font-size: 26px; color: #b5651d; letter-spacing: 2px; }
  </style>
</head>
<body>
  <header>
    <a href="../../">← トップへ戻る</a>
    <button id="sound" aria-label="音のオン/オフ">🔊</button>
  </header>
  <main>
    <div id="hud"><span id="day"></span><span id="total"></span></div>
    <div id="stage"><canvas id="game"></canvas></div>
    <div id="ctrl">
      <div id="titleCtrl">
        <div class="seed" style="margin-bottom:8px"><span id="gen"></span><b id="mySeed"></b><button id="copy">コピー</button></div>
        <div class="row" style="margin-bottom:8px"><button class="big" id="start">はじめる</button></div>
        <div class="row"><button class="big sub" id="toCross">子どもを作る</button></div>
      </div>
      <div id="choiceCtrl" class="row hidden">
        <button class="big rest" id="restBtn">休肝日</button>
        <button class="big" id="drinkBtn">動肝日</button>
      </div>
    </div>
  </main>
  <div id="panel" class="hidden"><div id="panelBody"></div></div>

  <script>
    // ===== 遺伝子とシード値 =====
    // 13個の遺伝子をそれぞれ2本ずつ持つ。1 が「強い」側のアレル
    //   0: ALDH2 (1=N, 0=D)  1: ADH1B (1=F, 0=S)  2: 肝臓 (1=L, 0=S)  3〜12: 体質 (1=＋, 0=−)
    const LOCI = 13;
    const ALPHA = '0123456789ABCDEFGHJKMNPQRSTVWXYZ'; // Crockford Base32（I L O U を使わない）
    // 初めての人・ランダムな相手のアレル頻度（日本人の頻度を参考に）
    const FREQ = [0.75, 0.7, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5];

    function randomGenes() {
      const g = [];
      for (let i = 0; i < LOCI; i++) g.push([+(Math.random() < FREQ[i]), +(Math.random() < FREQ[i])]);
      return g;
    }
    // メンデルの法則：遺伝子ごとに、両親から1本ずつ 50% で受け継ぐ
    function crossGenes(a, b) {
      const g = [];
      for (let i = 0; i < LOCI; i++) g.push([a[i][Math.random() < 0.5 ? 0 : 1], b[i][Math.random() < 0.5 ? 0 : 1]]);
      return g;
    }
    // ソルトから遺伝子を隠すための鍵を作る
    function mask(salt) {
      let x = (salt * 2654435761 + 0x9e3779b9) >>> 0;
      for (let i = 0; i < 3; i++) { x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0; }
      return x & 0x3ffffff;
    }
    // 遺伝子26ビット＋ソルト14ビット＝40ビットを8文字にする
    function encode(genes) {
      let bits = 0;
      for (let i = 0; i < LOCI; i++) bits |= (genes[i][0] << (2 * i)) | (genes[i][1] << (2 * i + 1));
      const salt = Math.floor(Math.random() * 16384);
      let v = salt * 67108864 + ((bits ^ mask(salt)) & 0x3ffffff);
      let s = '';
      for (let i = 0; i < 8; i++) { s = ALPHA[v % 32] + s; v = Math.floor(v / 32); }
      return s;
    }
    function normalizeSeed(str) {
      return str.toUpperCase().replace(/[\s-]/g, '').replace(/O/g, '0').replace(/[IL]/g, '1');
    }
    function decode(str) {
      const s = normalizeSeed(str);
      if (s.length !== 8) return null;
      let v = 0;
      for (const c of s) {
        const k = ALPHA.indexOf(c);
        if (k < 0) return null;
        v = v * 32 + k;
      }
      const salt = Math.floor(v / 67108864);
      const bits = (v % 67108864) ^ mask(salt);
      const g = [];
      for (let i = 0; i < LOCI; i++) g.push([(bits >> (2 * i)) & 1, (bits >> (2 * i + 1)) & 1]);
      return g;
    }

    // ===== 体質 =====
    const BASE = [25, 90, 200];        // ALDH2 の強いアレルの数 0(DD) / 1(ND) / 2(NN) の基本許容量 g
    const CARRY = [0.55, 0.4, 0.25];   // ADH1B：翌日に残るダメージの割合 SS / FS / FF
    const RECOVER = [0.5, 0.3, 0.1];   // 肝臓：休肝日のあとに残るダメージの割合 SS / LS / LL
    const count = (g, i) => g[i][0] + g[i][1];
    function plusCount(g) { let n = 0; for (let i = 3; i < LOCI; i++) n += count(g, i); return n; }
    function traits(g) {
      const plus = plusCount(g);
      return {
        limit: Math.round(BASE[count(g, 0)] * (0.6 + 0.04 * plus)),
        carry: CARRY[count(g, 1)],
        recover: RECOVER[count(g, 2)],
        plus,
      };
    }

    // ===== お酒 =====
    // [種類, 量の名前, 純アルコール g, 出やすさ, 絵, 大きさ]
    const DRINKS = [
      ['ビール', 'グラス', 14, 3, 'beer', 0.75],
      ['ビール', '中ジョッキ', 20, 4, 'beer', 1],
      ['ビール', '大ジョッキ', 32, 1, 'beer', 1.3],
      ['日本酒', '1合', 22, 2, 'sake', 1],
      ['日本酒', '2合', 44, 1, 'sake', 1.3],
      ['ワイン', 'グラス', 12, 2, 'wine', 1],
      ['ワイン', 'ボトル', 72, 0.3, 'bottle', 1.25],
      ['ハイボール', '', 14, 3, 'highball', 1],
      ['ハイボール', 'メガ', 28, 1, 'highball', 1.35],
      ['焼酎ロック', '', 20, 2, 'rock', 1],
      ['テキーラ', 'ショット', 10, 2, 'shot', 1],
      ['ストロング缶', '500ml', 36, 1, 'can', 1],
    ];
    const DRINK_W = DRINKS.reduce((s, d) => s + d[3], 0);
    function pickDrink() {
      let r = Math.random() * DRINK_W;
      for (const d of DRINKS) { r -= d[3]; if (r <= 0) return d; }
      return DRINKS[0];
    }

    // ===== 保存 =====
    const store = {
      get(k, d) { try { const v = localStorage.getItem('doukanbi_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
      set(k, v) { try { localStorage.setItem('doukanbi_' + k, JSON.stringify(v)); } catch (e) {} },
    };

    // ===== 音 =====
    let soundOn = store.get('sound', true);
    let actx = null;
    const soundBtn = document.getElementById('sound');
    function updateSoundBtn() { soundBtn.textContent = soundOn ? '🔊' : '🔇'; }
    soundBtn.onclick = () => { soundOn = !soundOn; store.set('sound', soundOn); updateSoundBtn(); };
    updateSoundBtn();
    function tone(freq, dur, type = 'sine', vol = 0.2, delay = 0, slideTo = null) {
      if (!soundOn) return;
      try {
        actx = actx || new (window.AudioContext || window.webkitAudioContext)();
        if (actx.state === 'suspended') actx.resume();
        const t = actx.currentTime + delay;
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
        g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
      } catch (e) {}
    }
    const sfx = {
      gulp() { tone(260, 0.09, 'sine', 0.25, 0, 140); tone(220, 0.09, 'sine', 0.25, 0.11, 120); },
      click() { tone(660, 0.06, 'triangle', 0.15); },
      rest() { tone(523, 0.3, 'sine', 0.15); tone(784, 0.4, 'sine', 0.12, 0.15); },
      dead() { tone(300, 0.9, 'sawtooth', 0.15, 0, 60); },
      clear() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.25, 'triangle', 0.18, i * 0.12)); },
      born() { [784, 988, 1175].forEach((f, i) => tone(f, 0.2, 'sine', 0.15, i * 0.1)); },
    };

    // ===== 状態 =====
    const DAYS = 30;
    let seed = store.get('seed', null);
    if (!seed || !decode(seed)) { seed = encode(randomGenes()); store.set('seed', seed); }
    let gen = store.get('gen', 1);
    let genes, tr;
    let game = null; // { day, damage, total, drinkDays, history[], over }

    // 描画用
    const view = {
      mode: 'title',   // title | idle | drink | rest | dead | clear
      drink: null,     // { d, x, y, s, a }
      label: '',
      fall: 0,         // 倒れる角度 0〜1
      t: 0,
    };
    let speed = 1;

    // ===== DOM =====
    const $ = id => document.getElementById(id);
    const dayEl = $('day'), totalEl = $('total');

    function setSeed(s, g) {
      seed = s; store.set('seed', s);
      if (g !== undefined) { gen = g; store.set('gen', g); }
      genes = decode(seed); tr = traits(genes);
    }
    setSeed(seed);

    function updateHud() {
      if (!game) {
        dayEl.textContent = '';
        totalEl.textContent = '';
      } else {
        dayEl.innerHTML = Math.min(game.day, DAYS) + '日目<small> / ' + DAYS + '</small>';
        totalEl.textContent = game.total.toLocaleString() + 'g';
      }
    }

    function showCtrl(which) {
      $('titleCtrl').classList.toggle('hidden', which !== 'title');
      $('choiceCtrl').classList.toggle('hidden', which !== 'choice');
    }

    function showTitle() {
      game = null;
      view.mode = 'title'; view.fall = 0; view.drink = null; view.label = '';
      $('mySeed').textContent = seed;
      $('gen').textContent = gen > 1 ? '第' + gen + '世代' : '';
      updateHud();
      showCtrl('title');
      hidePanel();
    }

    // ===== ゲームの進行 =====
    const sleep = ms => new Promise(r => setTimeout(r, ms / speed));
    function tween(ms, fn) {
      return new Promise(res => {
        const start = performance.now();
        function step(now) {
          const p = Math.min(1, (now - start) * speed / ms);
          fn(p);
          if (p < 1) requestAnimationFrame(step); else res();
        }
        requestAnimationFrame(step);
      });
    }

    function startGame() {
      sfx.click();
      game = { day: 1, damage: 0, total: 0, drinkDays: 0, history: [], over: false };
      view.fall = 0;
      hidePanel();
      drinkDay();
    }

    async function drinkDay() {
      showCtrl('none');
      speed = 1;
      game.history[game.day - 1] = 'drink';
      game.drinkDays++;
      updateHud();
      view.mode = 'drink';
      const n = 1 + Math.floor(Math.random() * 7);
      let m = game.damage;
      for (let i = 0; i < n; i++) {
        const d = pickDrink();
        view.label = d[0] + (d[1] ? ' ' + d[1] : '') + ' ' + d[2] + 'g';
        view.drink = { d, x: 340, y: 90, s: d[5], a: 0 };
        await tween(260, p => { view.drink.a = p; view.drink.x = 340 - 40 * p; });
        await sleep(140);
        m += d[2];
        game.total += d[2];
        sfx.gulp();
        await tween(320, p => {
          const e = p * p;
          view.drink.x = 300 - 100 * e; view.drink.y = 90 + 110 * e;
          view.drink.s = d[5] * (1 - 0.6 * e); view.drink.a = 1 - e;
        });
        view.drink = null;
        updateHud();
        if (m > tr.limit) return die();
        await sleep(160);
      }
      view.label = '';
      game.damage = m * tr.carry;
      await sleep(800);
      nextDay();
    }

    async function restDay() {
      showCtrl('none');
      speed = 1;
      game.history[game.day - 1] = 'rest';
      updateHud();
      view.mode = 'rest';
      sfx.rest();
      game.damage *= tr.recover;
      await sleep(1100);
      await sleep(250);
      nextDay();
    }

    function nextDay() {
      if (game.day >= DAYS) return finish(true);
      game.day++;
      view.mode = 'idle';
      updateHud();
      showCtrl('choice');
    }

    async function die() {
      game.history[game.day - 1] = 'dead';
      game.over = true;
      view.mode = 'dead'; view.label = '';
      updateHud();
      sfx.dead();
      speed = 1;
      await tween(700, p => { view.fall = p; });
      await sleep(1300);
      finish(false);
    }

    function finish(survived) {
      game.over = true;
      if (survived) { view.mode = 'clear'; sfx.clear(); }
      updateHud();
      showCtrl('none');
      const al = count(genes, 0);
      let msg;
      if (survived) msg = game.total >= 2400 ? '鉄の肝臓！' : '30日完走！';
      else if (al === 0) msg = '下戸でした';
      else msg = game.day + '日目に死んだ';
      const aldh = ['DD', 'ND', 'NN'][al] + '（' + ['下戸', '弱い', '強い'][al] + '）';
      const restDays = game.history.filter(h => h === 'rest').length;
      const result = { msg, restDays, total: game.total, drinkDays: game.drinkDays, aldh, limit: tr.limit, seed, dead: !survived };
      const html = `
        <div class="msg">${msg}</div>
        <div class="score">${result.total.toLocaleString()}g</div>
        <div class="stats">動肝日 ${result.drinkDays}日・休肝日 ${restDays}日</div>
        <div class="stats">ALDH2 ${aldh}・許容量 ${result.limit}g</div>
        <div class="row"><button class="big x" id="share">𝕏 で投稿</button></div>
        <div class="row"><button class="big sub" id="again">もう一度</button><button class="big" id="cross">子どもを作る</button></div>
      `;
      showResult = () => {
        openPanel(html);
        $('share').onclick = () => share(result);
        $('again').onclick = startGame;
        $('cross').onclick = openCross;
      };
      showResult();
    }
    // ===== X投稿 =====
    const SHARE_URL = 'https://keifurukawafunnych.com/games/doukanbi/';
    const shareText = r => `動肝日\n${r.msg} ${r.total.toLocaleString()}g飲んだ\nシード値 ${r.seed}\n#動肝日`;
    function share(r) {
      sfx.click();
      const intent = `https://x.com/intent/post?text=${encodeURIComponent(shareText(r))}&url=${encodeURIComponent(SHARE_URL)}`;
      // noopener を付けると戻り値が null になり判定できないので、開いてから切り離す
      const w = window.open(intent, '_blank');
      if (w) w.opener = null; else location.href = intent;
    }
    let showResult = null;

    // ===== かけ合わせ =====
    function openCross() {
      sfx.click();
      openPanel(`
        <div class="msg">👶 子どもを作る</div>
        <div class="cross">${seed}<br>×</div>
        <input id="partner" maxlength="9" placeholder="相手のシード値" autocomplete="off" autocapitalize="characters" spellcheck="false">
        <div class="row"><button class="big sub" id="randPartner">ランダムな相手</button><button class="big" id="doCross">かけ合わせる</button></div>
        <div class="row"><button class="big sub" id="back">もどる</button></div>
      `);
      const input = $('partner');
      $('randPartner').onclick = () => { sfx.click(); input.value = encode(randomGenes()); };
      $('doCross').onclick = () => {
        const pg = decode(input.value);
        if (!pg) { input.style.borderColor = '#d0453a'; input.focus(); tone(160, 0.2, 'square', 0.1); return; }
        const p = normalizeSeed(input.value);
        const child = encode(crossGenes(genes, pg));
        const parent = seed;
        setSeed(child, gen + 1);
        sfx.born();
        openPanel(`
          <div class="msg">👶 生まれました</div>
          <div class="cross">${parent} × ${p}<br>↓<br><b>${child}</b></div>
          <div class="row"><button class="big" id="playChild">この子ではじめる</button></div>
        `);
        $('playChild').onclick = () => { showTitle(); startGame(); };
      };
      $('back').onclick = () => { sfx.click(); game && game.over ? showResult() : showTitle(); };
    }

    function openPanel(html) { $('panelBody').innerHTML = html; $('panel').classList.remove('hidden'); }
    function hidePanel() { $('panel').classList.add('hidden'); }

    $('start').onclick = startGame;
    $('toCross').onclick = openCross;
    $('copy').onclick = () => {
      const done = () => { $('copy').textContent = 'コピーした'; setTimeout(() => $('copy').textContent = 'コピー', 1200); };
      try { navigator.clipboard.writeText(seed).then(done, () => {}); } catch (e) {}
    };
    $('restBtn').onclick = () => { sfx.click(); restDay(); };
    $('drinkBtn').onclick = () => { sfx.click(); drinkDay(); };
    // 飲んでいる最中に画面をタップすると早送り
    $('stage').addEventListener('pointerdown', () => { if (view.mode === 'drink' || view.mode === 'rest') speed = 3; });

    // ===== 描画 =====
    const canvas = $('game');
    const ctx = canvas.getContext('2d');
    const CW = 400, CH = 340;
    function resize() {
      const st = $('stage');
      const scale = Math.min(st.clientWidth / CW, st.clientHeight / CH);
      const dpr = window.devicePixelRatio || 1;
      canvas.style.width = CW * scale + 'px';
      canvas.style.height = CH * scale + 'px';
      canvas.width = Math.round(CW * scale * dpr);
      canvas.height = Math.round(CH * scale * dpr);
      ctx.setTransform(canvas.width / CW, 0, 0, canvas.height / CH, 0, 0);
    }
    window.addEventListener('resize', resize);

    // 512×512の透過画像。読み込み中・失敗時は下のCanvas描画を使う。
    const liverImage = new Image();
    liverImage.src = 'liver.png';

    // 肝臓くん
    function drawLiver(c, x, y, s, opt) {
      const { dead = false } = opt;
      c.save();
      c.translate(x, y);
      c.scale(s, s);
      if (liverImage.complete && liverImage.naturalWidth > 0) {
        if (dead) c.filter = 'grayscale(1) brightness(0.8)';
        c.drawImage(liverImage, -120, -132, 240, 240);
        c.restore();
        return;
      }
      // 正面から見た大きな右葉と、薄く先細りする左葉。
      const body = new Path2D();
      body.moveTo(-110, -16);
      body.bezierCurveTo(-113, -51, -82, -68, -43, -65);
      body.bezierCurveTo(-17, -65, -2, -56, 20, -52);
      body.bezierCurveTo(53, -47, 91, -49, 112, -36);
      body.bezierCurveTo(126, -26, 96, -7, 72, 4);
      body.bezierCurveTo(48, 15, 30, 23, 13, 25);
      body.bezierCurveTo(2, 27, -1, 20, -7, 25);
      body.bezierCurveTo(-25, 46, -49, 65, -70, 59);
      body.bezierCurveTo(-101, 51, -112, 18, -110, -16);
      body.closePath();
      const flesh = c.createLinearGradient(-35, -65, 22, 65);
      const colors = dead
        ? ['#aaa39a', '#817974', '#625959', '#423c40']
        : ['#b86755', '#934335', '#702a26', '#43191e'];
      colors.forEach((color, i) => flesh.addColorStop(i / 3, color));
      c.fillStyle = flesh; c.fill(body);
      c.save();
      c.clip(body);
      const dome = c.createRadialGradient(-56, -34, 3, -45, -18, 82);
      dome.addColorStop(0, dead ? 'rgba(225,215,199,0.23)' : 'rgba(242,162,125,0.35)');
      dome.addColorStop(0.65, 'rgba(190,104,78,0)');
      dome.addColorStop(1, 'rgba(35,9,18,0.24)');
      c.fillStyle = dome; c.fill(body);
      // 固定の模様で、アニメーション中も表面がちらつかないようにする。
      for (let i = 0; i < 180; i++) {
        const tx = -111 + ((i * 73.37) % 229);
        const ty = -66 + ((i * 37.19) % 130);
        c.fillStyle = i % 3 === 0 ? 'rgba(255,207,172,0.055)' : 'rgba(42,10,19,0.055)';
        c.beginPath(); c.ellipse(tx, ty, 0.6 + (i % 4) * 0.35, 0.45 + (i % 3) * 0.25, i, 0, Math.PI * 2); c.fill();
      }
      // 葉の境界は黒い線ではなく、柔らかな窪みと反射で描く。
      c.beginPath();
      c.moveTo(-14, -58);
      c.bezierCurveTo(-4, -37, -2, -5, -10, 26);
      c.bezierCurveTo(6, 15, 9, -22, -7, -55);
      c.closePath();
      c.fillStyle = 'rgba(39,12,19,0.23)'; c.fill();
      c.beginPath(); c.moveTo(-16, -55); c.bezierCurveTo(-7, -34, -6, -8, -13, 15);
      c.strokeStyle = 'rgba(239,181,146,0.22)'; c.lineWidth = 1.5; c.stroke();
      // 被膜の湿った光沢。輪郭に沿った細い反射と広い淡いハイライト。
      const sheen = c.createRadialGradient(-58, -43, 1, -58, -43, 43);
      sheen.addColorStop(0, 'rgba(255,225,196,0.3)');
      sheen.addColorStop(1, 'rgba(255,225,196,0)');
      c.save(); c.translate(-58, -43); c.scale(1, 0.38); c.translate(58, 43);
      c.fillStyle = sheen; c.fillRect(-104, -89, 92, 92); c.restore();
      c.beginPath(); c.moveTo(-98, -34); c.bezierCurveTo(-87, -55, -57, -60, -33, -55);
      c.strokeStyle = 'rgba(255,220,190,0.35)'; c.lineWidth = 1.8; c.lineCap = 'round'; c.stroke();
      c.beginPath(); c.moveTo(25, -43); c.quadraticCurveTo(73, -40, 99, -33);
      c.strokeStyle = 'rgba(255,209,169,0.2)'; c.lineWidth = 1.2; c.stroke();
      c.restore();
      c.lineWidth = 1.6; c.strokeStyle = dead ? '#51494a' : '#54251f'; c.stroke(body);
      c.restore();
    }

    // お酒の絵（底の中心が (0,0)）
    function drawDrink(c, kind) {
      c.lineWidth = 3; c.strokeStyle = '#5a3a28'; c.lineJoin = 'round';
      const glass = 'rgba(220,240,255,0.55)';
      if (kind === 'beer') {
        c.beginPath(); c.roundRect(10, -50, 16, 30, 8); c.lineWidth = 6; c.strokeStyle = '#5a3a28'; c.stroke();
        c.lineWidth = 3;
        c.fillStyle = '#f2b632'; c.beginPath(); c.roundRect(-22, -62, 40, 62, 4); c.fill(); c.stroke();
        c.fillStyle = '#fff';
        c.beginPath(); c.arc(-14, -64, 9, 0, Math.PI * 2); c.arc(-2, -68, 10, 0, Math.PI * 2); c.arc(10, -64, 9, 0, Math.PI * 2); c.fill();
        c.fillStyle = 'rgba(255,255,255,0.6)'; c.fillRect(-14, -48, 4, 38);
      } else if (kind === 'sake') {
        c.fillStyle = '#f6f2ea';
        c.beginPath(); c.moveTo(-6, -64); c.lineTo(6, -64); c.quadraticCurveTo(4, -44, 18, -24); c.quadraticCurveTo(26, 0, 0, 0);
        c.quadraticCurveTo(-26, 0, -18, -24); c.quadraticCurveTo(-4, -44, -6, -64); c.fill(); c.stroke();
        c.fillStyle = '#2f5d9e'; c.fillRect(-15, -30, 30, 7);
        c.fillStyle = '#f6f2ea'; c.beginPath(); c.roundRect(24, -14, 18, 14, 3); c.fill(); c.stroke();
      } else if (kind === 'wine') {
        c.fillStyle = glass;
        c.beginPath(); c.moveTo(-18, -70); c.quadraticCurveTo(-20, -36, 0, -34); c.quadraticCurveTo(20, -36, 18, -70); c.closePath(); c.fill(); c.stroke();
        c.fillStyle = '#8e1d3a';
        c.beginPath(); c.moveTo(-17, -55); c.quadraticCurveTo(-16, -36, 0, -36); c.quadraticCurveTo(16, -36, 17, -55); c.closePath(); c.fill();
        c.beginPath(); c.moveTo(0, -34); c.lineTo(0, -4); c.stroke();
        c.beginPath(); c.ellipse(0, -2, 14, 3, 0, 0, Math.PI * 2); c.fillStyle = glass; c.fill(); c.stroke();
      } else if (kind === 'bottle') {
        c.fillStyle = '#2d5a3a';
        c.beginPath(); c.moveTo(-6, -96); c.lineTo(6, -96); c.lineTo(6, -70); c.quadraticCurveTo(16, -64, 16, -52); c.lineTo(16, 0); c.lineTo(-16, 0); c.lineTo(-16, -52);
        c.quadraticCurveTo(-16, -64, -6, -70); c.closePath(); c.fill(); c.stroke();
        c.fillStyle = '#8e1d3a'; c.fillRect(-6, -100, 12, 8);
        c.fillStyle = '#f3e7cf'; c.fillRect(-13, -40, 26, 22);
      } else if (kind === 'highball') {
        c.fillStyle = glass; c.beginPath(); c.roundRect(-16, -80, 32, 80, 3); c.fill(); c.stroke();
        c.fillStyle = 'rgba(232,190,90,0.75)'; c.fillRect(-14, -66, 28, 64);
        c.fillStyle = 'rgba(255,255,255,0.85)'; c.strokeStyle = 'rgba(90,58,40,0.4)'; c.lineWidth = 2;
        for (const [ix, iy] of [[-10, -62], [0, -48], [-8, -32]]) { c.beginPath(); c.roundRect(ix, iy, 14, 12, 2); c.fill(); c.stroke(); }
        c.fillStyle = 'rgba(255,255,255,0.8)';
        for (let i = 0; i < 4; i++) { c.beginPath(); c.arc(6 + (i % 2) * 3, -14 - i * 12, 1.8, 0, Math.PI * 2); c.fill(); }
      } else if (kind === 'rock') {
        c.fillStyle = glass; c.beginPath(); c.moveTo(-24, -44); c.lineTo(24, -44); c.lineTo(21, 0); c.lineTo(-21, 0); c.closePath(); c.fill(); c.stroke();
        c.fillStyle = 'rgba(240,235,215,0.8)'; c.fillRect(-21, -26, 42, 24);
        c.fillStyle = 'rgba(255,255,255,0.9)'; c.strokeStyle = 'rgba(90,58,40,0.4)'; c.lineWidth = 2;
        c.beginPath(); c.roundRect(-12, -38, 24, 22, 3); c.fill(); c.stroke();
      } else if (kind === 'shot') {
        c.fillStyle = glass; c.beginPath(); c.moveTo(-13, -34); c.lineTo(13, -34); c.lineTo(10, 0); c.lineTo(-10, 0); c.closePath(); c.fill(); c.stroke();
        c.fillStyle = 'rgba(240,215,140,0.9)'; c.fillRect(-11, -22, 22, 20);
        c.fillStyle = '#9ccc4a'; c.beginPath(); c.arc(12, -34, 10, Math.PI, 2 * Math.PI); c.fill(); c.stroke();
        c.fillStyle = '#fff'; c.beginPath(); c.arc(-14, -4, 4, 0, Math.PI * 2); c.fill();
      } else if (kind === 'can') {
        c.fillStyle = '#d9dde3'; c.beginPath(); c.roundRect(-17, -76, 34, 76, 6); c.fill(); c.stroke();
        c.fillStyle = '#1c4fa3'; c.fillRect(-15, -60, 30, 44);
        c.fillStyle = '#ffd400'; c.font = 'bold 15px sans-serif'; c.textAlign = 'center'; c.fillText('9%', 0, -32);
        c.fillStyle = '#e5e8ec'; c.fillRect(-15, -22, 30, 4);
      }
    }

    function draw(now) {
      view.t = now / 1000;
      const c = ctx;
      c.clearRect(0, 0, CW, CH);
      const dead = view.mode === 'dead' || (game && game.over && game.history[game.day - 1] === 'dead');
      const sleeping = view.mode === 'rest';
      const t = view.t;

      // 肝臓くん
      const bob = dead ? 0 : Math.sin(t * 2) * 2;
      c.save();
      c.translate(195, 200);
      c.rotate(-view.fall * 0.3);
      c.translate(0, view.fall * 8);
      drawLiver(c, 0, bob, 1.1, { dead });
      c.restore();
      if (dead) {
        // 魂
        const p = Math.min(1, view.fall);
        c.globalAlpha = 0.85 * p;
        c.fillStyle = '#fff'; c.strokeStyle = '#a99';
        const gy = 120 - p * 50 + Math.sin(t * 2) * 4;
        c.beginPath(); c.arc(200, gy, 16, Math.PI, 0); c.quadraticCurveTo(220, gy + 26, 206, gy + 30); c.quadraticCurveTo(196, gy + 20, 184, gy + 20); c.lineTo(184, gy); c.fill(); c.stroke();
        c.globalAlpha = 1;
      }
      if (sleeping) {
        c.fillStyle = '#4f9a5a'; c.font = 'bold 28px sans-serif'; c.textAlign = 'center';
        for (let i = 0; i < 3; i++) {
          const ph = (t * 0.8 + i / 3) % 1;
          c.globalAlpha = 1 - ph;
          c.fillText('z', 300 + ph * 40, 140 - ph * 70 - i * 4);
        }
        c.globalAlpha = 1;
        // お茶
        c.save(); c.translate(320, 250); drawTea(c); c.restore();
      }
      if (view.mode === 'title' || view.mode === 'clear') {
        c.save(); c.translate(330, 240); c.rotate(0.12); drawDrink(c, 'beer'); c.restore();
      }
      if (view.mode === 'title') {
        c.fillStyle = '#4a3020'; c.font = 'bold 56px "Hiragino Maru Gothic ProN", "Yu Gothic UI", system-ui, sans-serif';
        c.textAlign = 'center'; c.fillText('動肝日', 200, 64);
      }

      if (dead) {
        const p = Math.min(1, view.fall * 1.5);
        c.save(); c.translate(200, 175); c.scale(0.6 + 0.4 * p, 0.6 + 0.4 * p); c.globalAlpha = p;
        c.font = 'bold 110px "Hiragino Maru Gothic ProN", "Yu Gothic UI", system-ui, sans-serif';
        c.textAlign = 'center'; c.textBaseline = 'middle';
        c.lineWidth = 12; c.strokeStyle = '#fff'; c.strokeText('死んだ', 0, 0);
        c.fillStyle = '#c0281e'; c.fillText('死んだ', 0, 0);
        c.restore();
      }
      // お酒
      if (view.drink) {
        const d = view.drink;
        c.save(); c.globalAlpha = Math.max(0, d.a); c.translate(d.x, d.y + 60); c.scale(d.s, d.s); c.rotate(-0.5 * (1 - d.a) * (d.x < 300 ? 1 : 0));
        drawDrink(c, d.d[4]); c.restore();
      }
      if (view.label) {
        c.fillStyle = '#4a3020'; c.font = 'bold 20px "Hiragino Maru Gothic ProN", "Yu Gothic UI", system-ui, sans-serif';
        c.textAlign = 'center'; c.fillText(view.label, 200, 30);
      }

      requestAnimationFrame(draw);
    }
    function drawTea(c) {
      c.lineWidth = 3; c.strokeStyle = '#5a3a28';
      c.fillStyle = '#e9e2d0'; c.beginPath(); c.moveTo(-20, -36); c.lineTo(20, -36); c.lineTo(16, 0); c.lineTo(-16, 0); c.closePath(); c.fill(); c.stroke();
      c.fillStyle = '#8fbf5a'; c.fillRect(-18, -32, 36, 6);
      c.strokeStyle = 'rgba(150,150,150,0.6)'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(-6, -44); c.quadraticCurveTo(-12, -54, -6, -62); c.moveTo(6, -44); c.quadraticCurveTo(0, -54, 6, -62); c.stroke();
    }

    resize();
    showTitle();
    requestAnimationFrame(draw);
    // アイコン作成用（ブラウザのコンソールから呼ぶ）
    window.makeIcon = size => {
      const cv = document.createElement('canvas'); cv.width = cv.height = size;
      const c = cv.getContext('2d'); c.scale(size / 512, size / 512);
      c.fillStyle = '#fdf3e4'; c.fillRect(0, 0, 512, 512);
      drawLiver(c, 236, 256, 1.85, {});
      c.save(); c.translate(410, 440); c.rotate(0.15); c.scale(2, 2); drawDrink(c, 'beer'); c.restore();
      return cv.toDataURL('image/png');
    };
  </script>
</body>
