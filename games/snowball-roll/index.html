      render(acc / STEP, dt);
      requestAnimationFrame(loop);
    }
    reset();
    resize();
    applyLang();
    drawTimer();
    // 最初の1回が重くならないように、頭や粒も含めて一度描いておく
    {
      head.visible = arms.visible = scarf.visible = tail.visible = true; arrow.visible = true;
      burst(new THREE.Vector3(0, 1, 7), 3, 0.1, 1, new THREE.Vector3(0, 1, 0), true); drawFx();
      world.step(STEP);
      ballBody.position.set(0, R0, 7); ballBody.velocity.setZero();
      renderer.compile(scene, camera); renderer.render(scene, camera);
      head.visible = arms.visible = scarf.visible = tail.visible = false; arrow.visible = false; fx.length = 0;
    }
    requestAnimationFrame(t0 => { last = t0; loop(t0); });
  </script>
</body>
</html>
