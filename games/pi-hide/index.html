<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>円周率デスゲーム</title>
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <!-- X などにURLを貼ったときのカード表示（ここだけは https:// から書く） -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ふるかわけい面白チャンネル">
  <meta property="og:title" content="円周率デスゲーム">
  <meta property="og:url" content="https://keifurukawafunnych.com/games/pi-hide/">
  <meta property="og:image" content="https://keifurukawafunnych.com/games/pi-hide/icon.png">
  <meta name="twitter:card" content="summary">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap">
  <style>
    /* 黒と血の赤。円周率の帯の上に参加者が立ち、数字が出た人から帯の下の闇へ落ちる */
    :root {
      --bg: #0c0c0e; --panel: #1b1b20; --line: #34343c; --text: #ece9e4; --dim: #7d7d87;
      --red: #e0283f; --red-dk: #7a0d1c; --band: #141417; --digit: #4d4d56;
      --display: "Dela Gothic One", "Hiragino Kaku Gothic StdN", "Yu Gothic UI", system-ui, sans-serif;
      --mono: ui-monospace, Menlo, Consolas, monospace;
    }
    /* 画面に収まらないときは縦にスクロールできるようにする（どの画面サイズでも全部見える） */
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body {
      display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic UI", system-ui, sans-serif;
      overflow-x: hidden; touch-action: manipulation;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      background: radial-gradient(ellipse at 50% 55%, #2a0a10 0%, var(--bg) 60%) fixed;
    }
    body.hit { animation: quake .35s; }
    @keyframes quake { 20% { transform: translate(-6px, 3px); } 40% { transform: translate(5px, -4px); } 60% { transform: translate(-4px, 2px); } 80% { transform: translate(3px, -1px); } }
    #flash { position: fixed; inset: 0; background: var(--red); opacity: 0; pointer-events: none; z-index: 10; }
    #flash.on { animation: flash .45s; }
    @keyframes flash { 0% { opacity: .55; } 100% { opacity: 0; } }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; width: 100%; max-width: 480px; margin: 0 auto; box-sizing: border-box;
    }
    header a { color: var(--dim); text-decoration: none; font-weight: bold; }
    .hbtns { display: flex; gap: 6px; }
    #lang { font-size: 15px; padding: 0 10px; }
    .pill {
      font-size: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
      min-width: 44px; height: 36px; cursor: pointer; font-weight: bold; color: var(--text);
    }
    main {
      flex: 1 0 auto; width: 100%; max-width: 480px; margin: 0 auto;
      display: flex; flex-direction: column; box-sizing: border-box; gap: 10px;
      padding: 0 12px calc(80px + env(safe-area-inset-bottom));
    }
    .screen { flex: 1 0 auto; display: flex; flex-direction: column; gap: 10px; }
    [hidden] { display: none !important; }
    .lens { display: flex; gap: 6px; }
    .lens button {
      flex: 1; font: inherit; font-size: 18px; font-weight: bold; padding: 8px 0; border-radius: 6px;
      border: 1px solid var(--line); background: var(--panel); color: var(--dim); cursor: pointer;
    }
    .lens button.on { background: var(--red); color: #fff; border-color: var(--red); }
    .boxes { display: flex; justify-content: center; gap: 8px; }
    .boxes span {
      width: 52px; height: 64px; border-radius: 6px; background: #000; border: 2px solid var(--line);
      display: flex; align-items: center; justify-content: center; font-size: 38px; font-weight: bold;
      font-family: var(--mono); color: var(--red); text-shadow: 0 0 10px rgba(224,40,63,.6);
    }
    .boxes span.cur { border-color: var(--red); }
    .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; flex: 1 0 auto; max-height: 300px; grid-auto-rows: minmax(40px, 1fr); }
    .pad button {
      font: inherit; font-size: 26px; font-weight: bold; border-radius: 6px; border: 1px solid var(--line); background: var(--panel);
      color: var(--text); box-shadow: 0 3px 0 #000; cursor: pointer; min-height: 40px; font-family: var(--mono);
    }
    .pad button:active { transform: translateY(2px); box-shadow: 0 1px 0 #000; }
    .big {
      font: inherit; font-family: var(--display); font-size: 22px; padding: 14px 8px; border-radius: 6px;
      border: none; cursor: pointer; color: #fff; background: var(--red); letter-spacing: .08em;
      box-shadow: 0 4px 0 var(--red-dk); display: block; text-align: center; text-decoration: none; line-height: normal;
    }
    .big:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--red-dk); }
    button.big:disabled { opacity: .3; cursor: default; }
    .big.sub { background: var(--panel); color: var(--text); box-shadow: 0 4px 0 #000; border: 1px solid var(--line); }
    .big.x { background: #fff; color: #000; box-shadow: 0 4px 0 #555; }
    .row2 { display: flex; gap: 8px; }
    .row2 > * { flex: 1; }

    /* 主役：横に流れる円周率の帯 */
    #tape { position: relative; flex: 1 0 auto; min-height: 350px; --band: min(76px, 19vw); --top: max(52%, 190px); }
    #band {
      position: absolute; left: -12px; right: -12px; top: var(--top); height: var(--band); margin-top: calc(var(--band) / -2);
      background: var(--band); color: var(--digit); z-index: 2; overflow: hidden;
      border-top: 2px solid var(--red-dk); border-bottom: 2px solid var(--red-dk);
      font-family: var(--mono); font-weight: bold; font-size: calc(var(--band) * .68); line-height: var(--band);
      box-shadow: 0 18px 30px #000;
    }
    #line { position: absolute; left: 50%; top: 0; white-space: nowrap; will-change: transform; }
    #band .mid { color: var(--text); }
    #line b { color: #fff; border-radius: 4px; background: var(--red); animation: pop .35s; text-shadow: none; }
    @keyframes pop { 0% { transform: scale(1.6); } }
    #band::before, #band::after { content: ''; position: absolute; top: 0; bottom: 0; width: 22%; z-index: 1; }
    #band::before { left: 0; background: linear-gradient(90deg, var(--band), transparent); }
    #band::after { right: 0; background: linear-gradient(-90deg, var(--band), transparent); }
    #scope {
      position: absolute; left: 50%; top: 3px; bottom: 3px; width: calc(var(--len) * 1ch + 10px); transform: translateX(-50%);
      border: 2px solid var(--red); border-radius: 4px; background: rgba(224,40,63,.10); z-index: 2; box-sizing: border-box;
      box-shadow: 0 0 18px rgba(224,40,63,.55), inset 0 0 12px rgba(224,40,63,.35);
      animation: scan 1.2s ease-in-out infinite;
    }
    @keyframes scan { 50% { box-shadow: 0 0 6px rgba(224,40,63,.3), inset 0 0 4px rgba(224,40,63,.2); } }
    /* 3D：絵は2Dのまま、舞台ごと奥行きをつけてゆっくり首を振る。帯は床のように手前へ倒し、脱落した札は奥へ倒れる */
    #tape { perspective: 620px; perspective-origin: 50% 30%; }
    #stage3d { position: absolute; inset: 0; transform-style: preserve-3d; animation: sway 10s ease-in-out infinite; }
    @keyframes sway { 0%, 100% { transform: rotateY(-9deg) rotateX(4deg); } 50% { transform: rotateY(9deg) rotateX(-2deg); } }
    body.hit #stage3d { animation: sway 10s ease-in-out infinite, jolt .35s; }
    @keyframes jolt { 30% { translate: 0 0 -60px; } }
    #band { transform: rotateX(38deg); transform-origin: 50% 0; }
    #players { list-style: none; margin: 0; padding: 0; position: absolute; inset: 0; transform-style: preserve-3d; }
    #players li, #players .who { transform-style: preserve-3d; }
    #players li { position: absolute; top: var(--top); left: var(--x); width: 0; }
    /* 参加者の札。立っている状態がふつうで、脱落すると帯の下へ落ちて消える */
    #players .who {
      position: absolute; left: 0; bottom: calc(var(--band) / 2 + 4px); z-index: 1; line-height: 1.2;
      display: flex; flex-direction: column; align-items: center;
      transform: translate(-50%, 0); transform-origin: 50% 100%; transition: transform .7s cubic-bezier(.55,-0.2,.85,.4), opacity .7s .2s;
    }
    #players .bob { display: block; }
    #players li:not(.out) .bob { animation: shiver 2.2s ease-in-out infinite; }
    #players li:nth-child(even):not(.out) .bob { animation-delay: -1.1s; }
    @keyframes shiver { 0%, 100% { transform: translateX(0); } 48% { transform: translateX(0); } 50% { transform: translateX(-1.5px); } 52% { transform: translateX(1.5px); } 54% { transform: translateX(0); } }
    #players .tag {
      display: block; text-align: center; line-height: 1.1; min-width: 1.2em;
      font-size: 15px; font-weight: bold; color: var(--text); background: var(--panel); border: 2px solid var(--c);
      border-radius: 4px; padding: 6px 4px; box-shadow: 0 0 10px rgba(0,0,0,.6);
    }
    #players .tag::before { content: attr(data-no); display: block; font-size: 9px; color: var(--c); font-family: var(--mono); margin-bottom: 3px; }
    #players.many .tag { font-size: 12px; padding: 5px 2px; }
    #players li.out .who { transform: translate(-50%, 0) rotateX(-88deg); opacity: .25; }
    #players li.win .tag { border-color: #fff; box-shadow: 0 0 16px rgba(255,255,255,.5); }
    #players .say {
      position: absolute; left: 0; bottom: calc(var(--band) / 2 + 6px); transform: translateX(-50%) rotate(-8deg); white-space: nowrap; z-index: 4;
      opacity: 0; transition: opacity .2s .25s;
      font-family: var(--display); font-size: 17px; color: var(--red); border: 2px solid var(--red); border-radius: 4px; padding: 0 6px;
      background: rgba(12,12,14,.85);
    }
    #players li.out .say, #players li.done .say { opacity: 1; }
    #players li.win .say { display: none; }
    #players .crown { display: none; margin-bottom: 4px; font-family: var(--display); font-size: 16px; color: #fff; white-space: nowrap; text-shadow: 0 0 10px rgba(255,255,255,.6); }
    #players li.win .crown { display: block; }
    #players.many .crown { font-size: 12px; }
    #players .info {
      position: absolute; left: 0; top: calc(var(--band) / 2 + 12px); transform: translateX(-50%); text-align: center; white-space: nowrap;
      background: var(--panel); border-radius: 4px; padding: 1px 5px; border-bottom: 3px solid var(--c); z-index: 3;
    }
    #players.stagger li:nth-child(even) .info { top: calc(var(--band) / 2 + 52px); }
    #players li.me .info { box-shadow: 0 0 0 2px #fff; }
    #players li.out .num { color: var(--dim); text-decoration: line-through var(--red) 2px; }
    #players .num { display: block; font-family: var(--mono); font-size: 17px; font-weight: bold; line-height: 1.2; }
    #players .st { display: block; font-size: 10px; font-weight: bold; color: var(--dim); }
    #players.many .num { font-size: 12px; }
    #players.many .info { padding: 1px 3px; }
    #players.many .st { font-size: 9px; }
    #players.many .say { font-size: 12px; padding: 0 3px; }
    #pos { position: absolute; left: 0; right: 0; top: calc(var(--top) + var(--band) / 2 + 100px); text-align: center; font-size: 13px; color: var(--dim); font-family: var(--mono); letter-spacing: .1em; }
    @media (prefers-reduced-motion: reduce) { #players .bob, #scope, body.hit, #stage3d { animation: none !important; } }
    #verdict { text-align: center; font-family: var(--display); font-size: min(34px, 8.6vw); color: var(--red); min-height: 1.3em; line-height: 1.3; margin-top: min(48px, 7vh); text-shadow: 0 0 14px rgba(224,40,63,.5); }
    #verdict span { display: inline-block; animation: pop .35s; }
    #verdict small { display: block; font-family: inherit; font-size: 16px; color: var(--text); text-shadow: none; letter-spacing: .05em; }
    #verdict.win { color: #fff; text-shadow: 0 0 16px rgba(255,255,255,.5); }
    #ttl { margin: 0; text-align: center; font-family: var(--display); font-weight: normal; font-size: 26px; line-height: 1.2; color: var(--red); letter-spacing: .06em; text-shadow: 0 0 12px rgba(224,40,63,.45); }
    .counter { display: flex; align-items: center; justify-content: center; gap: 14px; font-size: 20px; font-weight: bold; }
    .counter button { font: inherit; width: 44px; height: 40px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; }
    .counter button:disabled { opacity: .3; cursor: default; }
    .namerow { display: flex; align-items: center; gap: 8px; }
    #turn { flex: none; font-size: 17px; font-weight: bold; color: var(--c, var(--red)); white-space: nowrap; font-family: var(--mono); }
    #turn:empty { display: none; }
    #name {
      font: inherit; font-size: 18px; font-weight: bold; text-align: center; padding: 6px 10px; border-radius: 6px;
      border: 2px solid var(--c, var(--line)); background: #000; color: var(--text); flex: 1; min-width: 0; box-sizing: border-box; user-select: text;
    }
    #name::placeholder { color: var(--dim); }
    #turn.err { animation: shake .3s; }
    @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    @media (max-height: 620px) {
      .screen { gap: 6px; }
      .boxes span { height: 42px; width: 40px; font-size: 28px; }
      .lens button { padding: 5px 0; font-size: 16px; }
      .counter button { height: 34px; }
      #ttl { font-size: 20px; }
      main { gap: 6px; }
      #name { padding: 3px 8px; font-size: 16px; }
      .pad { gap: 5px; }
      .pad button { min-height: 28px; font-size: 20px; }
      .big { padding: 10px 8px; font-size: 20px; }
    }
  </style>
</head>
<body>
  <div id="flash"></div>
  <header>
    <a href="../../" id="back">← トップへ戻る</a>
    <div class="hbtns"><button id="lang" class="pill">EN</button><button id="sound" class="pill" aria-label="音のオン/オフ">🔊</button></div>
  </header>
  <main>
    <h1 id="ttl">円周率デスゲーム</h1>
    <section id="pick" class="screen">
      <div class="lens" id="modes"></div>
      <div class="counter" id="counter" hidden><button id="minus">−</button><span id="count"></span><button id="plus">＋</button></div>
      <div class="lens" id="lens"></div>
      <div class="namerow"><div id="turn"></div><input id="name" type="text" autocomplete="off" enterkeyhint="done"></div>
      <div class="boxes" id="boxes"></div>
      <div class="pad" id="pad"></div>
      <button class="big" id="go" disabled>スタート</button>
    </section>
    <section id="race" class="screen" hidden>
      <div id="verdict"></div>
      <div id="tape"><div id="stage3d"><div id="band"><div id="line"></div><div id="scope"></div></div><ul id="players"></ul></div><div id="pos"></div></div>
      <div class="row2" id="after" hidden>
        <button class="big sub" id="retry">もう一度</button>
        <a class="big x" id="share">Xに投稿</a>
      </div>
      <button class="big sub" id="skip">早送り ▶▶</button>
    </section>
  </main>
  <script>
    const SHARE_URL = 'https://keifurukawafunnych.com/games/pi-hide/';
    const COLORS = ['#4a5ad0', '#e85a70', '#f0a020', '#2db07a', '#a05ad0', '#20a8d0', '#d06a2a', '#7a8a20', '#d04aa0', '#506070'];
    // CPU は大学生っぽい名前から5人選ぶ
    const CPU_JA = ['けんた', 'みさき', 'りょう', 'あやか', 'しゅん', 'なつき', 'ゆうと', 'まい', 'たくみ', 'はるか', 'そうた', 'えりか'];
    const CPU_EN = ['Kenta', 'Misaki', 'Ryo', 'Ayaka', 'Shun', 'Natsuki', 'Yuto', 'Mai', 'Takumi', 'Haruka', 'Sota', 'Erika'];
    const NAME_MAX = 6;
    const MIN_P = 2, MAX_P = 10;

    const store = {
      get(k, d) { try { const v = localStorage.getItem('pi-hide:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
      set(k, v) { try { localStorage.setItem('pi-hide:' + k, JSON.stringify(v)); } catch {} },
    };
    let soundOn = store.get('sound', true);
    const soundBtn = document.getElementById('sound');
    const updateSoundBtn = () => { soundBtn.textContent = soundOn ? '🔊' : '🔇'; };
    soundBtn.onclick = () => { soundOn = !soundOn; store.set('sound', soundOn); updateSoundBtn(); };
    updateSoundBtn();
    let actx;
    function beep(freq, dur, type = 'sine', vol = 0.15, slide = 0) {
      if (!soundOn) return;
      try {
        actx = actx || new (window.AudioContext || window.webkitAudioContext)();
        const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (slide) o.frequency.linearRampToValueAtTime(freq + slide, t + dur);
        g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
      } catch {}
    }

    // 文言（日本語／英語）
    const rankEn = r => ['1st', '2nd', '3rd'][r - 1] || `${r}th`;
    const L = {
      ja: {
        title: '円周率デスゲーム', back: '← トップへ戻る', lang: 'EN', langLabel: 'Switch to English',
        modes: ['🤖 CPU戦', '👥 対面戦'], count: n => `${n}人`,
        len: n => `${n}桁`, go: 'ゲーム開始', next: '次の参加者へ', skip: '早送り ▶▶', retry: 'もう一度', share: 'Xに投稿',
        you: 'あなた', cpu: CPU_JA, pname: k => `P${k}`, namePh: k => `参加者名（P${k}）`, myPh: '参加者名（あなた）',
        turn: k => `P${k}`, dup: '同じ数字は選べない',
        pos: n => `小数点以下 ${n.toLocaleString()}桁目`,
        found: n => `${n.toLocaleString()}桁目`, none: '生還', rank: r => `${r}位`,
        out: '脱落', crown: '👑生存',
        outWho: n => `${n} 脱落`, surviveWho: n => `${n} 生存`, ask: 'ゲームを開始します', ready: '生き残れ',
        verdict: (n, r) => r === 1 ? `${n} 生存` : `${n} ${r}位で脱落`, winner: n => `生存者 ${n}`,
        msg: ['最後の1人になった', 'あと一歩で生き残れた', 'よく粘った', 'ここまでだった', '早すぎる脱落', '真っ先に脱落…'],
        pvpMsg: n => `${n}人の中で唯一の生存者`,
        posText: p => p === Infinity ? '100万桁以内に出なかった' : `${p.toLocaleString()}桁目`,
        shareText: (num, pos, r) => `円周率デスゲームで「${num}」を選んだら、出てきたのは${pos}。6人中${r}でした`,
        sharePvp: (n, num, pos) => `円周率デスゲーム（${n}人）の生存者は「${num}」！${pos}まで生き残った`,
      },
      en: {
        title: 'Pi Death Game', back: '← Top', lang: '日本語', langLabel: '日本語に切り替え',
        modes: ['🤖 vs CPU', '👥 Pass & play'], count: n => `${n} players`,
        len: n => `${n} digits`, go: 'Begin', next: 'Next player', skip: 'Fast ▶▶', retry: 'Again', share: 'Post on X',
        you: 'You', cpu: CPU_EN, pname: k => `P${k}`, namePh: k => `Name (P${k})`, myPh: 'Your name',
        turn: k => `P${k}`, dup: 'Already taken',
        pos: n => `decimal place ${n.toLocaleString()}`,
        found: n => `#${n.toLocaleString()}`, none: 'survived', rank: rankEn,
        out: 'OUT', crown: '👑ALIVE',
        outWho: n => `${n} is out`, surviveWho: n => `${n} survives`, ask: 'The game begins', ready: 'Survive.',
        verdict: (n, r) => r === 1 ? `${n} survives` : `${n}: out in ${rankEn(r)}`, winner: n => `Survivor: ${n}`,
        msg: ['Last one standing', 'One step from survival', 'Held on well', 'This was the end', 'Out too soon', 'First to fall…'],
        pvpMsg: n => `The only survivor of ${n}`,
        posText: p => p === Infinity ? 'beyond 1,000,000' : p.toLocaleString(),
        shareText: (num, pos, r) => `In Pi Death Game I picked "${num}" — it showed up at digit ${pos}. ${r} of 6`,
        sharePvp: (n, num, pos) => `Pi Death Game (${n} players): "${num}" survived until digit ${pos} of pi`,
      },
    };
    let lang = store.get('lang', navigator.language.startsWith('ja') ? 'ja' : 'en');
    if (!L[lang]) lang = 'ja';
    const t = k => L[lang][k];
    const $ = id => document.getElementById(id);
    const langBtn = $('lang');
    function applyLang() {
      document.documentElement.lang = lang;
      document.title = t('title'); $('ttl').textContent = t('title');
      $('back').textContent = t('back');
      langBtn.textContent = t('lang'); langBtn.setAttribute('aria-label', t('langLabel'));
      $('skip').textContent = t('skip');
      $('retry').textContent = t('retry'); $('share').textContent = t('share');
      renderPick(); renderPlayers(); renderVerdict();
    }
    langBtn.onclick = () => { lang = lang === 'ja' ? 'en' : 'ja'; store.set('lang', lang); applyLang(); };

    // 円周率（小数点以下100万桁）
    let PI = null;
    const piReady = fetch('pi.txt').then(r => r.text()).then(s => { PI = s.trim(); });

    // ---- モード・人数・数字を選ぶ ----
    let mode = store.get('mode', 'cpu');          // 'cpu' | 'pvp'
    let count = store.get('count', 3);            // となりの人モードの人数
    let len = store.get('len', 3);
    let input = '';
    let entries = [];                             // となりの人モードで入力済みの {num, name}
    const reset = () => { input = ''; entries = []; $('name').value = mode === 'cpu' ? myName : ''; };
    const randNum = () => Array.from({ length: len }, () => Math.floor(Math.random() * 10)).join('');
    // 名前：入力があればそれ、なければ「あなた」「P1」、CPU は選ばれた名前
    const nameOf = i => {
      const p = players[i];
      if (p?.cpu != null) return t('cpu')[p.cpu];
      return p?.name || (mode === 'cpu' ? t('you') : t('pname')(i + 1));
    };
    const esc = x => String(x).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
    let myName = store.get('name', '');
    const colorOf = i => COLORS[i % COLORS.length];

    function chips(el, items, isOn, onPick) {
      el.innerHTML = '';
      items.forEach((label, k) => {
        const b = document.createElement('button');
        b.textContent = label; b.className = isOn(k) ? 'on' : '';
        b.onclick = () => { onPick(k); renderPick(); };
        el.appendChild(b);
      });
    }
    function renderPick() {
      chips($('modes'), t('modes'), k => (k === 0) === (mode === 'cpu'),
        k => { mode = k === 0 ? 'cpu' : 'pvp'; store.set('mode', mode); reset(); });
      chips($('lens'), [2, 3, 4, 5].map(t('len')), k => k + 2 === len,
        k => { len = k + 2; store.set('len', len); reset(); });
      $('counter').hidden = mode !== 'pvp';
      $('count').textContent = t('count')(count);
      $('minus').disabled = count <= MIN_P; $('plus').disabled = count >= MAX_P;
      const turn = $('turn');
      turn.textContent = mode === 'pvp' ? t('turn')(entries.length + 1) : '';
      $('name').placeholder = mode === 'pvp' ? t('namePh')(entries.length + 1) : t('myPh');
      $('name').style.setProperty('--c', colorOf(entries.length));
      turn.style.setProperty('--c', colorOf(entries.length));
      const el = $('boxes'); el.innerHTML = '';
      for (let i = 0; i < len; i++) {
        const s = document.createElement('span');
        s.textContent = input[i] || ''; if (i === input.length) s.className = 'cur';
        el.appendChild(s);
      }
      const last = mode === 'cpu' || entries.length + 1 >= count;
      $('go').textContent = last ? t('go') : t('next');
      $('go').disabled = input.length !== len;
    }
    $('minus').onclick = () => { count = Math.max(MIN_P, count - 1); store.set('count', count); entries = entries.slice(0, count - 1); renderPick(); };
    $('plus').onclick = () => { count = Math.min(MAX_P, count + 1); store.set('count', count); renderPick(); };

    function press(k) {
      if (k === 'del') input = input.slice(0, -1);
      else if (k === 'rnd') input = randNum();
      else if (input.length < len) input += k;
      beep(660 + input.length * 60, 0.05, 'square', 0.04);
      renderPick();
    }
    for (const k of ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'rnd', '0', 'del']) {
      const b = document.createElement('button');
      b.textContent = k === 'del' ? '⌫' : k === 'rnd' ? '🎲' : k;
      b.onclick = () => press(k);
      $('pad').appendChild(b);
    }
    $('name').maxLength = NAME_MAX;
    $('name').addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') e.target.blur(); });
    document.addEventListener('keydown', e => {
      if ($('pick').hidden) return;
      if (/^[0-9]$/.test(e.key)) press(e.key);
      else if (e.key === 'Backspace') press('del');
      else if (e.key === 'Enter' && !$('go').disabled) submit();
    });
    $('go').onclick = () => submit();

    function submit() {
      const name = $('name').value.trim().slice(0, NAME_MAX);
      if (mode === 'cpu') { myName = name; store.set('name', name); return start([{ num: input, name }]); }
      const turn = $('turn');
      if (entries.some(e => e.num === input)) {
        turn.textContent = t('dup'); turn.classList.remove('err'); void turn.offsetWidth; turn.classList.add('err');
        beep(180, 0.2, 'sawtooth', 0.06); return;
      }
      entries.push({ num: input, name }); input = ''; $('name').value = '';
      beep(880, 0.08, 'square', 0.05);
      if (entries.length >= count) start(entries.slice());
      else renderPick();
    }

    // ---- かくれんぼ ----
    let players = [], cursor = 0, events = [], timer = 0, fast = false, done = false, myRank = 0, runId = 0;
    async function start(nums) {
      await piReady;
      const used = new Set(nums.map(e => e.num));
      if (mode === 'cpu') {
        const pool = [...CPU_JA.keys()].sort(() => Math.random() - 0.5);
        while (nums.length < 6) {
          const n = randNum();
          if (!used.has(n)) { used.add(n); nums.push({ num: n, cpu: pool.pop() }); }
        }
      }
      players = nums.map(({ num, name, cpu }, i) => {
        const k = PI.indexOf(num);
        return { num, name, cpu, i, pos: k < 0 ? Infinity : k + 1, out: false, rank: 0 };   // pos = 小数点以下何桁目から始まるか
      });
      // 先に出た人から脱落。最後まで出なかった人が1位
      events = [...players].sort((a, b) => a.pos - b.pos);
      events.forEach((p, j) => { p.rank = players.length - j; });
      myRank = players[0].rank;
      cursor = -1; fast = false; done = false; reset();
      $('pick').hidden = true; $('race').hidden = false;
      $('tape').style.setProperty('--len', len);
      $('after').hidden = true; $('skip').hidden = false;
      renderPlayers(); renderVerdict(); renderTape(-1, null);
      // もういいかい？ → もういいよ！ → 探しはじめる
      const id = ++runId, v = $('verdict');
      v.textContent = t('ask'); beep(440, 0.3, 'sine', 0.1, 120);
      timer = setTimeout(() => {
        if (id !== runId) return;
        v.textContent = t('ready'); beep(660, 0.3, 'sine', 0.1, -120);
        timer = setTimeout(() => { if (id === runId) { v.textContent = ''; step(id); } }, 900);
      }, 900);
    }
    $('skip').onclick = () => { fast = true; };
    $('retry').onclick = () => {
      runId++; clearTimeout(timer); $('race').hidden = true; $('pick').hidden = false; reset(); renderPick();
    };

    // 横一列の帯。at（小数でもよい）の桁がレンズの左端に来るよう左へ流す
    const SIDE = 18;
    const ch = k => k >= 1 ? (PI[k - 1] ?? '') : k === 0 ? '.' : k === -1 ? '3' : '\u00a0';
    function renderTape(at, hit) {
      const base = Math.floor(at);
      let html = '';
      for (let k = base - SIDE; k <= base + SIDE; k++) {
        const d = ch(k);
        html += hit && k >= hit.pos && k < hit.pos + hit.num.length ? `<b>${d}</b>` : d;
      }
      const line = $('line');
      line.innerHTML = html;
      line.style.transform = `translateX(calc(${-(len / 2 + SIDE + (at - base))} * 1ch))`;
      $('pos').textContent = at < 0.5 ? '' : t('pos')(Math.round(at));
    }

    function step(id) {
      if (id !== runId) return;
      const remaining = events.filter(p => !p.out);
      if (!remaining.length) return finish();
      // 1位の人も最後までスクロールして見つける（100万桁以内にいなければ端まで）
      const next = remaining[0].pos !== Infinity ? remaining[0] : null;
      // 次の出現位置まで、対数スケールで進む（3.14 の「3」から始める）
      const from = cursor, to = next ? next.pos : PI.length - 5;
      const lg = x => Math.log(x + 3);
      const dur = fast ? 250 : cursor < 1 ? 2400 : 1600;
      const t0 = performance.now();
      const anim = now => {
        if (id !== runId) return;
        const r = Math.min(1, (now - t0) / dur);
        const e = 1 - Math.pow(1 - r, 3);
        const at = Math.exp(lg(from) + (lg(to) - lg(from)) * e) - 3;
        renderTape(at, null);
        if (r < 1) { requestAnimationFrame(anim); return; }
        cursor = to;
        if (!next) { remaining.forEach(p => { p.out = true; }); return finish(); }
        next.out = true;
        renderTape(to, next);
        renderPlayers(next);
        const last = remaining.length === 1;   // 最後の1人は落ちずに生き残る
        $('verdict').innerHTML = `<span>${(last ? t('surviveWho') : t('outWho'))(esc(nameOf(next.i)))}</span>`;
        if (last) beep(880, 0.4, 'sine', 0.1, 220);
        else {
          // 脱落：赤く光って画面が揺れ、低いブザー
          beep(110, 0.45, 'sawtooth', 0.12, -40); beep(55, 0.5, 'square', 0.08);
          const f = $('flash'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
          document.body.classList.remove('hit'); void document.body.offsetWidth; document.body.classList.add('hit');
        }
        timer = setTimeout(() => step(id), remaining.length === 1 ? 1300 : fast ? 350 : 1100);
      };
      requestAnimationFrame(anim);
    }

    function finish() {
      done = true;
      renderPlayers(); renderVerdict();
      $('skip').hidden = true; $('after').hidden = false;
      if (mode === 'pvp' || myRank === 1) { beep(392, 0.3, 'sine', 0.08); setTimeout(() => beep(523, 0.6, 'sine', 0.08), 250); }
      else beep(70, 0.9, 'sawtooth', 0.08, -30);
    }

    // 札は最初に1回だけ作り、あとは中身とクラスだけ変える（作り直すと動きがリセットされてワープする）
    function renderPlayers(hit) {
      const el = $('players'); if (!players.length) return;
      const n = players.length;
      if (el.childElementCount !== n || hit === undefined && !players.some(p => p.out)) {
        el.innerHTML = '';
        el.classList.toggle('many', n > 6);
        // 数字の札が横に並びきらないときは2段にずらす
        el.classList.toggle('stagger', n * (len * 11 + 12) > el.clientWidth);
        for (const p of players) {
          const li = document.createElement('li');
          li.style.setProperty('--c', colorOf(p.i));
          li.style.setProperty('--x', `${(p.i + 0.5) / n * 100}%`);
          // .say（脱落・順位のはんこ）は帯のすぐ上に残し、札（.who）だけが帯の下へ落ちる
          li.innerHTML = `<span class="say"></span><span class="who"><span class="crown"></span><span class="bob"><span class="tag" data-no="No.${String(p.i + 1).padStart(3, '0')}"></span></span></span>`
            + `<span class="info"><span class="num">${p.num}</span><span class="st"></span></span>`;
          el.appendChild(li);
        }
      }
      players.forEach((p, k) => {
        const li = el.children[k];
        const found = p.out && p.pos !== Infinity;
        const dead = found && p.rank !== 1;            // 最後の1人は見つかっても落ちない
        li.classList.toggle('me', mode === 'cpu' && p.i === 0);
        li.classList.toggle('out', dead);
        li.classList.toggle('done', done);
        li.classList.toggle('win', done && p.rank === 1);
        li.querySelector('.tag').innerHTML = [...nameOf(p.i)].map(esc).join('<br>');   // 1文字ずつ縦に積む
        li.querySelector('.crown').textContent = t('crown');
        li.querySelector('.say').textContent = done ? t('rank')(p.rank) : dead ? t('out') : '';
        const st = li.querySelector('.st');
        st.textContent = found ? t('found')(p.pos) : done ? t('none') : '';
        st.hidden = !st.textContent;
      });
    }

    function renderVerdict() {
      const v = $('verdict');
      v.classList.toggle('win', done && (mode === 'pvp' || myRank === 1));
      if (!done) { v.innerHTML = ''; return; }
      const win = players.find(p => p.rank === 1);
      let text;
      if (mode === 'cpu') {
        v.innerHTML = `${t('verdict')(esc(nameOf(0)), myRank)}<small>${t('msg')[myRank - 1]}</small>`;
        const me = players[0];
        text = t('shareText')(me.num, t('posText')(me.pos), t('rank')(myRank));
      } else {
        v.innerHTML = `${t('winner')(esc(nameOf(win.i)))}<small>${t('pvpMsg')(players.length)}</small>`;
        text = t('sharePvp')(players.length, win.num, t('posText')(win.pos));
      }
      const a = $('share');
      a.href = `https://x.com/intent/post?text=${encodeURIComponent(text)}&url=${encodeURIComponent(SHARE_URL)}`;
      if (matchMedia('(pointer: coarse)').matches) { a.removeAttribute('target'); a.removeAttribute('rel'); }
      else { a.target = '_blank'; a.rel = 'noopener'; }
    }

    applyLang();
  </script>
</body>
</html>
