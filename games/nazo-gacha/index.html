    const awning = new THREE.Mesh(new THREE.PlaneGeometry(24, 1.6, 1, 1), new THREE.MeshStandardMaterial({ map: awnTex, roughness: 0.8, side: THREE.DoubleSide }));

    const roof = new THREE.Mesh(new THREE.BoxGeometry(24, 0.3, 1.6), new THREE.MeshStandardMaterial({ color: '#5d4a3c', roughness: 0.9 }));
    roof.position.set(0, 4.75, -3.2); scene.add(roof);
    // いつもの猫のポスター

    {

    for (const x of [-4.4, 4.6]) {

    // ---------- ガチャの機械 ----------
    const CAP_COLORS = ['#ff5a5a', '#ffb13d', '#ffe14d', '#5ed16a', '#3db7ff', '#8b6bff', '#ff6bd0'];
    const capTopMats = CAP_COLORS.map(c => new THREE.MeshPhysicalMaterial({ color: c, roughness: 0.25, clearcoat: 0.6, transparent: true, opacity: 0.92 }));
    const capBotMat = new THREE.MeshPhysicalMaterial({ color: '#ffffff', roughness: 0.15, transparent: true, opacity: 0.55, clearcoat: 1 });
    const HALF_TOP = new THREE.SphereGeometry(1, 28, 14, 0, Math.PI * 2, 0, Math.PI / 2);
    const HALF_BOT = new THREE.SphereGeometry(1, 28, 14, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2);
    const BAND = new THREE.CylinderGeometry(1.01, 1.01, 0.08, 28, 1, true);
    function makeCapsule(ci) {
      const g = new THREE.Group();
      const top = new THREE.Mesh(HALF_TOP, capTopMats[ci]), bot = new THREE.Mesh(HALF_BOT, capBotMat), band = new THREE.Mesh(BAND, capTopMats[ci]);
      g.add(top, bot, band); g.userData = { top, bot, band };

    }
    function makeMachine(bodyColor) {
      const m = new THREE.Group();
      const body = new THREE.MeshPhysicalMaterial({ color: bodyColor, roughness: 0.35, clearcoat: 0.5 });
      const chrome = new THREE.MeshStandardMaterial({ color: '#e8e8ee', metalness: 0.95, roughness: 0.2 });
      const dark = new THREE.MeshStandardMaterial({ color: '#1b1410', roughness: 0.9 });
      const base = new THREE.Mesh(new RoundedBoxGeometry(1.6, 1.5, 1.35, 4, 0.12), body); base.position.y = 0.85; m.add(base);
      const plinth = new THREE.Mesh(new RoundedBoxGeometry(1.7, 0.12, 1.45, 2, 0.04), dark); plinth.position.y = 0.06; m.add(plinth);
      // 表示板（大きな「？」の模様）
      const panelTex = canvasTex(256, 96, (g, w, h) => {
        g.fillStyle = '#fff8e6'; g.fillRect(0, 0, w, h);
        for (let i = 0; i < 7; i++) { g.fillStyle = CAP_COLORS[i]; g.font = '900 64px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.save(); g.translate(20 + i * 36, h / 2 + (i % 2 ? 8 : -8)); g.rotate((i % 3 - 1) * 0.3); g.fillText('?', 0, 0); g.restore(); }
      });
      const panel = new THREE.Mesh(new THREE.PlaneGeometry(1.3, 0.42), new THREE.MeshStandardMaterial({ map: panelTex, roughness: 0.5 }));
      panel.position.set(0, 1.35, 0.68); m.add(panel);
      // ハンドル
      const handle = new THREE.Group(); handle.position.set(0.25, 0.86, 0.7);
      const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.07, 36), chrome); disc.rotation.x = Math.PI / 2; handle.add(disc);
      const grip = new THREE.Mesh(new RoundedBoxGeometry(0.5, 0.12, 0.14, 2, 0.05), new THREE.MeshPhysicalMaterial({ color: '#fff2c0', roughness: 0.3, clearcoat: 0.6 })); grip.position.z = 0.08; handle.add(grip);
      const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.12, 16), chrome); hub.rotation.x = Math.PI / 2; hub.position.z = 0.14; handle.add(hub);
      m.add(handle);
      // コインの投入口
      const slot = new THREE.Mesh(new RoundedBoxGeometry(0.26, 0.4, 0.06, 2, 0.02), chrome); slot.position.set(-0.4, 0.86, 0.69); m.add(slot);
      const slit = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.24, 0.02), dark); slit.position.set(-0.4, 0.86, 0.725); m.add(slit);
      // 取り出し口
      const chute = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.36, 0.1), dark); chute.position.set(0, 0.32, 0.65); m.add(chute);
      const flap = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.05, 0.3), chrome); flap.position.set(0, 0.15, 0.78); m.add(flap);
      // 首とドーム
      const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.72, 0.8, 0.16, 36), chrome); collar.position.y = 1.68; m.add(collar);
      const inner = new THREE.Group(); inner.position.y = 2.42; m.add(inner);
      const dome = new THREE.Mesh(new THREE.SphereGeometry(0.82, 40, 28), new THREE.MeshPhysicalMaterial({ color: '#ffffff', roughness: 0.03, transparent: true, opacity: 0.22, clearcoat: 1, depthWrite: false }));
      dome.position.y = 2.42; dome.renderOrder = 2; m.add(dome);
      const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.36, 0.16, 28), body); cap.position.y = 3.27; m.add(cap);
      const knob = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 12), chrome); knob.position.y = 3.38; m.add(knob);
      // 中に詰まったカプセル
      const caps = [];
      for (let k = 0; k < 34; k++) {
        const c = makeCapsule(k % CAP_COLORS.length); c.scale.setScalar(0.17);
        const lay = Math.floor(k / 8), ang = k * 2.39;
        const r = 0.5 * Math.sqrt(Math.max(0, 1 - ((lay * 0.19 - 0.5) / 0.75) ** 2));
        c.position.set(Math.cos(ang) * r * (0.4 + (k % 3) * 0.3), -0.55 + lay * 0.19, Math.sin(ang) * r * (0.4 + (k % 3) * 0.3));
        c.rotation.set(Math.random() * 6, Math.random() * 6, Math.random() * 6);
        c.userData.home = c.position.clone(); inner.add(c); caps.push(c);
      }
      m.userData = { handle, inner, caps };
      return shade(m);
    }
    const machine = makeMachine('#e8423a'); scene.add(machine);
    for (const [x, c] of [[-2.25, '#2f8be0'], [2.25, '#f0b62e']]) { const mm = makeMachine(c); mm.position.set(x, 0, -0.9); mm.rotation.y = -x * 0.08; scene.add(mm); }
    const { handle, inner: domeInner } = machine.userData;

    // ---------- アイテム ----------
    // 1件 = { n: {ja,en,...}, c: ["#rrggbb 印"...], p: [[形, 引数, 色番号, 位置, 回転(度), 拡大]...] }
    // 色の印: m=金属 s=つや g=ガラス e=光る r=ざらざら w=針金
    function itemMat(spec) {
      const [hex, flags = ''] = spec.split(' ');
      const o = { color: hex, roughness: 0.55, metalness: 0 };
      if (flags.includes('m')) { o.metalness = 0.9; o.roughness = 0.25; }
      if (flags.includes('s')) o.roughness = 0.12;
      if (flags.includes('r')) o.roughness = 1;
      if (flags.includes('g')) { o.transparent = true; o.opacity = 0.45; o.roughness = 0.05; }
      if (flags.includes('e')) { o.emissive = hex; o.emissiveIntensity = 0.8; }
      if (flags.includes('w')) o.wireframe = true;
      return new THREE.MeshStandardMaterial(o);
    }
    const v2 = a => { const r = []; for (let i = 0; i + 1 < a.length; i += 2) r.push(new THREE.Vector2(a[i], a[i + 1])); return r; };
    const v3 = a => { const r = []; for (let i = 0; i + 2 < a.length; i += 3) r.push(new THREE.Vector3(a[i], a[i + 1], a[i + 2])); return r; };
    function itemGeo(kind, a) {
      switch (kind) {
        case 'box': return a[3] ? new RoundedBoxGeometry(a[0], a[1], a[2], 3, Math.min(a[3], Math.min(a[0], a[1], a[2]) / 2 - 0.001)) : new THREE.BoxGeometry(a[0], a[1], a[2]);
        case 'sph': return new THREE.SphereGeometry(a[0], 32, 20, 0, Math.PI * 2, 0, Math.PI * (a[1] ?? 1));
        case 'cyl': return new THREE.CylinderGeometry(a[0], a[1], a[2], a[3] ?? 32);
        case 'cone': return new THREE.ConeGeometry(a[0], a[1], a[2] ?? 32);
        case 'tor': return new THREE.TorusGeometry(a[0], a[1], 16, 48, THREE.MathUtils.degToRad(a[2] ?? 360));
        case 'cap': return new THREE.CapsuleGeometry(a[0], a[1], 8, 20);
        case 'lat': return new THREE.LatheGeometry(v2(a), 40);
        case 'ext': { const g = new THREE.ExtrudeGeometry(new THREE.Shape(v2(a[0])), { depth: a[1], bevelEnabled: true, bevelSize: Math.min(0.03, a[1] / 3), bevelThickness: Math.min(0.03, a[1] / 3), bevelSegments: 2, curveSegments: 16 }); g.center(); return g; }
        case 'tube': return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(v3(a[0])), 80, a[1], 12, false);
        case 'knot': return new THREE.TorusKnotGeometry(a[0], a[1], 128, 16, a[2] ?? 2, a[3] ?? 3);
        case 'ico': return new THREE.IcosahedronGeometry(a[0], a[1] ?? 0);
        case 'oct': return new THREE.OctahedronGeometry(a[0], a[1] ?? 0);
        case 'tet': return new THREE.TetrahedronGeometry(a[0], a[1] ?? 0);
        case 'dod': return new THREE.DodecahedronGeometry(a[0], a[1] ?? 0);
        case 'pl': return new THREE.PlaneGeometry(a[0], a[1]);
        case 'cat': return new THREE.PlaneGeometry(a[0], a[0]);
      }
      return new THREE.BoxGeometry(0.3, 0.3, 0.3);
    }
    const DEG = Math.PI / 180;
    function buildItem(def) {
      const mats = def.c.map(itemMat);
      const g = new THREE.Group(), body = new THREE.Group(); g.add(body);
      for (const [kind, args, ci = 0, pos = [0, 0, 0], rot = [0, 0, 0], scl = 1] of def.p) {
        const mat = kind === 'cat' ? new THREE.MeshStandardMaterial({ map: catTex, transparent: true, alphaTest: 0.1, side: THREE.DoubleSide, roughness: 0.7 }) : (kind === 'pl' ? mats[ci].clone() : mats[ci]);
        if (kind === 'pl') mat.side = THREE.DoubleSide;
        const mesh = new THREE.Mesh(itemGeo(kind, args), mat);
        mesh.position.set(...pos); mesh.rotation.set(rot[0] * DEG, rot[1] * DEG, rot[2] * DEG);
        if (Array.isArray(scl)) mesh.scale.set(...scl); else mesh.scale.setScalar(scl);
        body.add(mesh);
      }
      // 大きさをそろえて真ん中に置く
      const box = new THREE.Box3().setFromObject(body), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
      const s = 1.5 / Math.max(size.x, size.y, size.z, 0.01);
      body.scale.setScalar(s); body.position.copy(c).multiplyScalar(-s);
      return shade(g);
    }
    function disposeItem(g) { g.traverse(m => { if (m.isMesh) { m.geometry.dispose(); } }); }
    const chunks = new Map();
    function loadChunk(ci) {
      if (!chunks.has(ci)) chunks.set(ci, fetch(`items/${String(ci).padStart(3, '0')}.json`).then(r => r.json()).catch(e => { chunks.delete(ci); throw e; }));
      return chunks.get(ci);
    }
    const loadItem = id => loadChunk(Math.floor(id / CHUNK)).then(a => a[id % CHUNK]);
    const nameOf = (def, l = lang) => def.n[l] || def.n.en || def.n.ja;
    const no4 = id => String(id + 1).padStart(4, '0');

    // ---------- 集めた記録 ----------
    let got = new Set(store.get('got', []));
    const dexBar = document.querySelector('#dex i'), dexNum = document.querySelector('#dex span');
    const drawDex = () => { dexBar.style.width = (got.size / TOTAL * 100) + '%'; dexNum.textContent = `${got.size} / ${TOTAL}`; };
    drawDex();

    // ---------- 粒（紙吹雪・きらきら） ----------
    const bits = [];
    const BIT_GEO = new THREE.PlaneGeometry(0.06, 0.1);
    const bitMats = CAP_COLORS.map(c => new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide, transparent: true }));
    function confetti(p, n) {
      for (let k = 0; k < n; k++) {
        const m = new THREE.Mesh(BIT_GEO, bitMats[k % bitMats.length].clone());
        m.position.copy(p);
        const a = Math.random() * Math.PI * 2, up = 2 + Math.random() * 3;
        m.userData = { v: new THREE.Vector3(Math.cos(a) * (1 + Math.random() * 2.5), up, Math.sin(a) * 1.5 + 0.8), w: new THREE.Vector3(Math.random() * 10, Math.random() * 10, Math.random() * 10), life: 1.6 + Math.random() * 0.8, age: 0 };
        scene.add(m); bits.push(m);
      }
    }
    function updateBits(dt) {
      for (let i = bits.length - 1; i >= 0; i--) {

        u.v.y -= 6 * dt; u.v.multiplyScalar(1 - 1.6 * dt);

        m.material.opacity = Math.max(0, 1 - u.age / u.life);
        if (u.age >= u.life) { scene.remove(m); m.material.dispose(); bits.splice(i, 1); }
      }
    }

    // ---------- 進行 ----------
    // idle → turning → out（カプセルが出た） → opening → reveal
    let state = 'idle';
    let turn = 0, turnAuto = false, lastClick = 0;
    let capsule = null, capT = 0, capColor = 0;
    let item = null, itemDef = null, itemId = -1, itemPromise = null, itemFailed = false, openT = 0;
    const TRAY = new THREE.Vector3(0, 0.3, 0.98), REVEAL = new THREE.Vector3(0, 1.85, 1.35);
    const nameEl = document.getElementById('name');

    function pickId() {
      // まだ持っていない物が少し出やすい
      for (let k = 0; k < 3; k++) { const id = Math.floor(Math.random() * ITEM_COUNT); if (!got.has(id)) return id; }
      return Math.floor(Math.random() * ITEM_COUNT);
    }
    function startTurn() {
      if (state !== 'idle') return;
      state = 'turning'; turn = 0; lastClick = 0;
      itemId = pickId(); itemDef = null;
      itemFailed = false;
      itemPromise = loadItem(itemId).then(d => { itemDef = d; return d; });
      itemPromise.catch(() => { itemFailed = true; });
    }
    function addTurn(a) {
      turn = Math.min(Math.PI * 2, turn + Math.max(0, a));
      while (turn - lastClick >= Math.PI / 4) { lastClick += Math.PI / 4; sRatchet(); }
      if (turn >= Math.PI * 2 - 1e-4) dispense();
    }
    function dispense() {
      state = 'out'; capT = 0; turnAuto = false;
      capColor = Math.floor(Math.random() * CAP_COLORS.length);
      capsule = makeCapsule(capColor); capsule.scale.setScalar(0.24); scene.add(capsule);
    }
    function openCapsule() {
      if (state !== 'out' || capT < 0.7) return;
      state = 'opening'; openT = 0; sFly();
      capsule.userData.from = capsule.position.clone();
    }
    function again() {
      if (state !== 'reveal') return;
      if (item) { scene.remove(item); disposeItem(item); item = null; }
      if (capsule) { scene.remove(capsule); capsule = null; }
      state = 'idle'; turn = 0; handle.rotation.z = 0; halo.visible = false;
      nameEl.style.display = 'none'; snap = null; shareFile = null;
      renderControls(); resize();
    }
    // アイテムの後ろの光の放射
    const halo = new THREE.Mesh(new THREE.PlaneGeometry(4.2, 4.2), new THREE.MeshBasicMaterial({
      map: canvasTex(512, 512, (g, w, h) => {
        const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
        gr.addColorStop(0, 'rgba(255,250,220,1)'); gr.addColorStop(0.35, 'rgba(255,220,120,.75)'); gr.addColorStop(1, 'rgba(255,200,80,0)');
        g.fillStyle = gr; g.translate(w / 2, h / 2);
        for (let k = 0; k < 16; k++) { g.rotate(Math.PI / 8); g.beginPath(); g.moveTo(0, 0); g.lineTo(w, -w * 0.12); g.lineTo(w, w * 0.12); g.closePath(); g.fill(); }
        g.beginPath(); g.arc(0, 0, w * 0.22, 0, Math.PI * 2); g.fill();
      }), transparent: true, depthWrite: false, opacity: 0 }));
    halo.renderOrder = 3; scene.add(halo); halo.visible = false;
    function reveal(def) {
      halo.visible = true;
      item = buildItem(def); item.position.copy(REVEAL); item.scale.setScalar(0.01); scene.add(item);
      const isNew = !got.has(itemId);
      got.add(itemId); store.set('got', [...got]); drawDex();
      confetti(REVEAL, isNew ? 90 : 40); sOpen(); sChime(); setTimeout(() => itemVoice(itemId), 450);
      state = 'reveal'; openT = 0;
      showName(); renderControls(); resize();
      setTimeout(() => { if (state === 'reveal') { takeSnap(); prepareShare(); } }, 900);
    }
    function showName() {
      if (!itemDef) return;
      nameEl.querySelector('small').textContent = `No.${no4(itemId)}`;
      nameEl.querySelector('b').textContent = nameOf(itemDef);
      nameEl.style.display = 'flex';
    }

    // ---------- 操作 ----------
    const canvas = renderer.domElement;
    let drag = null;
    const handleScreen = () => { const p = handle.getWorldPosition(new THREE.Vector3()).project(camera); const r = canvas.getBoundingClientRect(); return { x: r.left + (p.x + 1) / 2 * r.width, y: r.top + (1 - p.y) / 2 * r.height }; };
    canvas.addEventListener('pointerdown', e => {
      e.preventDefault();
      if (state === 'idle') startTurn();
      if (state === 'turning') {
        const c = handleScreen();
        drag = { id: e.pointerId, a: Math.atan2(e.clientY - c.y, e.clientX - c.x), x: e.clientX, y: e.clientY, moved: 0, c };
        turnAuto = false; canvas.setPointerCapture(e.pointerId);
      } else if (state === 'out') openCapsule();
    });
    canvas.addEventListener('pointermove', e => {
      if (!drag || drag.id !== e.pointerId || state !== 'turning') return;
      const a = Math.atan2(e.clientY - drag.c.y, e.clientX - drag.c.x);
      let d = a - drag.a; if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2;
      drag.a = a; drag.moved += Math.hypot(e.clientX - drag.x, e.clientY - drag.y); drag.x = e.clientX; drag.y = e.clientY;
      addTurn(Math.abs(d));
    });
    const endDrag = e => { if (!drag || drag.id !== e.pointerId) return; drag = null; if (state === 'turning') turnAuto = true; };
    canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);
    addEventListener('keydown', e => {
      if (e.repeat || !['Space', 'Enter'].includes(e.code) || shelfView.style.display === 'flex') return;
      if (e.target.tagName === 'SELECT' || e.target.tagName === 'BUTTON' || e.target.tagName === 'A') return;
      e.preventDefault();
      if (state === 'idle') { startTurn(); turnAuto = true; } else if (state === 'out') openCapsule(); else if (state === 'reveal') again();
    });

    // ---------- 画面サイズ ----------
    const controls = document.getElementById('controls');
    const CENTER = new THREE.Vector3(0, 1.55, 0.3);
    function resize() {
      const w = stage.clientWidth, H = stage.clientHeight;
      renderer.setSize(w, H, false);
      const btnH = Math.min(72, Math.max(56, 0.08 * Math.min(innerWidth, innerHeight))) + 12;
      const reserve = Math.max(0, stage.getBoundingClientRect().bottom - controls.getBoundingClientRect().bottom) + btnH;
      stage.style.setProperty('--reserve', reserve + 'px');
      const h = Math.max(120, H - reserve);
      const wide = h <= 520 && w / h >= 4 / 3;
      // 上の方はゲージとアイテム名を出す所にして、機械はその下に収める
      const band = Math.round(h * (wide ? 0.06 : 0.16)), fh = h - band;
      camera.aspect = w / fh;
      camera.setViewOffset(w, fh, 0, -band, w, H);
      const vf = THREE.MathUtils.degToRad(camera.fov), hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);
      // 縦は機械の上から受け皿まで、横は機械の幅が入る距離
      const d = Math.min(Math.max(2.0 / Math.sin(vf / 2), 1.3 / Math.sin(hf / 2)), 22);
      const dir = new THREE.Vector3(0, 0.32, 1).normalize();
      // 背の低い横長でアイテム名を左に出すときは、機械を右へ
      const side = (state === 'reveal' && wide) ? -1.6 : 0;
      camera.position.copy(CENTER).addScaledVector(dir, d).add(new THREE.Vector3(side, 0, 0));
      camera.lookAt(CENTER.x + side, CENTER.y, CENTER.z);
      camera.updateProjectionMatrix();
    }
    addEventListener('resize', resize);

    // ---------- ボタン ----------
    const ICON_SHELF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 4h18v16H3zM3 12h18"/><circle cx="8" cy="9" r="2" fill="currentColor"/><path d="M14 10l2-3 2 3z" fill="currentColor"/><path d="M6 17h3v-2H6zM13 17a2 2 0 1 0 4 0z" fill="currentColor"/></svg>';
    function renderControls() {
      controls.innerHTML = '';
      const sb = document.createElement('button'); sb.className = 'shelf'; sb.innerHTML = ICON_SHELF; sb.setAttribute('aria-label', 'shelf');
      sb.addEventListener('click', openShelf); controls.append(sb);
      if (state !== 'reveal') { controls.style.justifyContent = 'flex-start'; return; }
      const b = document.createElement('button'); b.className = 'go'; b.textContent = t('again'); b.addEventListener('click', again); controls.append(b);
      const a = document.createElement('a'); a.className = 'post'; a.textContent = t('post');
      const text = t('share')(nameOf(itemDef), no4(itemId));
      a.href = `https://x.com/intent/post?text=${encodeURIComponent(text)}&url=${encodeURIComponent(SHARE_URL)}`;
      const coarse = matchMedia('(pointer: coarse)').matches;
      if (!coarse) { a.target = '_blank'; a.rel = 'noopener'; }
      // スマホは画像ごと共有シートへ。PCは画像を保存してから投稿画面を開く
      a.addEventListener('click', e => {
        if (coarse && navigator.share) {
          e.preventDefault();
          const data = shareFile && navigator.canShare?.({ files: [shareFile] }) ? { files: [shareFile], text: `${text}\n${SHARE_URL}` } : { text: `${text}\n${SHARE_URL}` };
          navigator.share(data).catch(() => {});
          return;
        }
        const img = resultImage();
        if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = `nazo-gacha-${no4(itemId)}.png`; d.click(); }
      });
      controls.append(a);
    }

    // ---------- 共有画像 ----------
    let snap = null, shareFile = null;
    function takeSnap() {
      renderer.render(scene, camera);
      const src = renderer.domElement;
      const f = REVEAL.clone().project(camera);
      const fx = (f.x + 1) / 2 * src.width, fy = (1 - f.y) / 2 * src.height;
      const side = Math.min(src.width, src.height);
      const sx = THREE.MathUtils.clamp(fx - side / 2, 0, src.width - side), sy = THREE.MathUtils.clamp(fy - side * 0.42, 0, src.height - side);
      snap = document.createElement('canvas'); snap.width = snap.height = 1080;
      snap.getContext('2d').drawImage(src, sx, sy, side, side, 0, 0, 1080, 1080);
    }
    const FONT = px => `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans SC", "Noto Sans Devanagari", "Noto Sans Bengali", "Noto Sans Arabic", sans-serif`;
    function resultImage() {
      if (!snap || !itemDef) return null;
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const g = c.getContext('2d');
      g.drawImage(snap, 0, 0);
      const gr = g.createLinearGradient(0, 640, 0, 1080); gr.addColorStop(0, 'rgba(40,20,5,0)'); gr.addColorStop(1, 'rgba(40,20,5,.75)'); g.fillStyle = gr; g.fillRect(0, 640, 1080, 440);
      g.textAlign = 'center'; g.lineJoin = 'round'; g.direction = lang === 'ar' ? 'rtl' : 'ltr';
      const text = (str, y, px, max, fill = '#fff') => {
        g.font = FONT(px); const w = g.measureText(str).width; if (w > max) { px = Math.floor(px * max / w); g.font = FONT(px); }
        g.lineWidth = px * 0.16; g.strokeStyle = '#4a2a10'; g.strokeText(str, 540, y); g.fillStyle = fill; g.fillText(str, 540, y);
      };
      text(`No.${no4(itemId)}`, 860, 64, 900, '#ffd23d');
      text(nameOf(itemDef), 960, 92, 980);
      text(t('title'), 1040, 40, 900);
      return c;
    }
    function prepareShare() {
      const c = resultImage(); if (!c) return;
      c.toBlob(b => { if (b) shareFile = new File([b], `nazo-gacha-${no4(itemId)}.png`, { type: 'image/png' }); }, 'image/png');
    }

    // ---------- 棚 ----------
    const shelfView = document.getElementById('shelfView'), grid = document.getElementById('grid');
    let thumbR = null, thumbScene = null, thumbCam = null;
    const thumbCache = new Map();
    function thumb(def) {
      if (!thumbR) {
        thumbR = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true }); thumbR.setSize(192, 192, false);
        thumbR.toneMapping = THREE.ACESFilmicToneMapping; thumbR.outputColorSpace = THREE.SRGBColorSpace;
        thumbScene = new THREE.Scene(); thumbScene.add(new THREE.HemisphereLight('#ffffff', '#8a6a44', 1.6));
        const l = new THREE.DirectionalLight('#fff0dc', 2.2); l.position.set(2, 3, 4); thumbScene.add(l);
        thumbCam = new THREE.PerspectiveCamera(30, 1, 0.1, 20); thumbCam.position.set(0, 0.6, 3.4); thumbCam.lookAt(0, 0, 0);
      }
      const g = buildItem(def); g.rotation.y = 0.5; thumbScene.add(g);
      thumbR.render(thumbScene, thumbCam);
      const url = thumbR.domElement.toDataURL('image/png');
      thumbScene.remove(g); disposeItem(g);
      return url;
    }
    let shelfJob = 0;
    function openShelf() {
      shelfView.style.display = 'flex'; grid.innerHTML = '';
      const ids = [...got].sort((a, b) => a - b), job = ++shelfJob;
      const figs = ids.map(id => {
        const f = document.createElement('figure');
        f.innerHTML = `<div class="ph"></div><figcaption>No.${no4(id)}</figcaption>`; grid.append(f); return f;
      });
      let k = 0;
      const step = async () => {
        if (job !== shelfJob || k >= ids.length) return;
        const id = ids[k], f = figs[k]; k++;
        try {
          const def = await loadItem(id);
          if (!thumbCache.has(id)) thumbCache.set(id, thumb(def));
          const img = new Image(); img.src = thumbCache.get(id); img.alt = ''; f.title = nameOf(def); f.firstChild.replaceWith(img);
        } catch {}
        setTimeout(step, 0);
      };
      step();
    }
    document.getElementById('shelfClose').addEventListener('click', () => { shelfView.style.display = 'none'; shelfJob++; });

    // ---------- ループ ----------
    const ease = x => 1 - Math.pow(1 - x, 3);
    const back = x => { const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
    let last = performance.now(), time = 0;
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
      if (state === 'turning' && turnAuto) addTurn(dt * Math.PI * 2 / 1.1);
      // ハンドルとドームの中身
      handle.rotation.z = -turn;
      const shake = state === 'turning' ? Math.sin(turn * 8) * 0.04 : 0;
      machine.userData.caps.forEach((c, i) => { c.position.y = c.userData.home.y + Math.abs(Math.sin(turn * 3 + i)) * shake * 1.5; c.rotation.y += shake * 0.5; });
      domeInner.rotation.y = turn * 0.15;
      // 待っている間はハンドルが少しだけ揺れて「回して」と伝える
      if (state === 'idle') handle.rotation.z = Math.sin(time * 3) * 0.12 * Math.max(0, Math.sin(time * 1.2));
      // 出てくるカプセル
      if (capsule && state === 'out') {
        capT += dt;
        const k = Math.min(1, capT / 0.45);
        const from = new THREE.Vector3(0, 0.4, 0.55);
        capsule.position.lerpVectors(from, TRAY, ease(k));
        capsule.position.y = THREE.MathUtils.lerp(from.y, TRAY.y, k) + Math.abs(Math.sin(Math.min(capT, 0.9) * 9)) * 0.12 * Math.max(0, 1 - capT / 0.9);
        if (capT - dt < 0.45 && capT >= 0.45) sDrop();
        capsule.rotation.x = -capT * 6 * Math.max(0, 1 - capT / 0.9);
        if (capT > 0.9) { capsule.rotation.z = Math.sin(time * 6) * 0.08; capsule.scale.setScalar(0.24 * (1 + Math.sin(time * 5) * 0.03)); }
      }
      if (capsule && state === 'opening') {
        openT += dt;
        const k = Math.min(1, openT / 0.55);
        capsule.position.lerpVectors(capsule.userData.from, REVEAL, ease(k));
        capsule.position.y += Math.sin(k * Math.PI) * 0.4;
        capsule.scale.setScalar(THREE.MathUtils.lerp(0.24, 0.62, ease(k)));
        capsule.rotation.set(0, 0, openT > 0.55 ? Math.sin(openT * 40) * 0.12 * Math.min(1, (openT - 0.55) * 4) : -k * Math.PI * 2);
        if (openT > 0.95 && itemDef) {
          capsule.userData.split = 0; capsule.rotation.set(0, 0, 0); reveal(itemDef);
        } else if (openT > 0.95 && itemFailed) { state = 'reveal'; again(); } // 読めなければやり直し
      }
      if (state === 'reveal') {
        openT += dt;
        if (capsule) {
          const u = capsule.userData, s = Math.min(1, openT / 0.6);
          u.top.position.y = ease(s) * 1.6; u.top.rotation.z = s * 0.9; u.band.position.y = ease(s) * 1.6;
          u.bot.position.y = -ease(s) * 1.6; u.bot.rotation.z = -s * 0.6;
          capsule.visible = s < 1;
        }
        // 光の放射はカメラに向けて、アイテムの少し後ろでゆっくり回す
        halo.position.copy(REVEAL).addScaledVector(camera.getWorldDirection(new THREE.Vector3()), 0.9);
        halo.quaternion.copy(camera.quaternion); halo.rotateZ(time * 0.3);
        halo.material.opacity = Math.min(0.85, openT * 2);
        if (item) {
          const s = Math.min(1, openT / 0.6);
          item.scale.setScalar(Math.max(0.01, back(s)));
          item.rotation.y += dt * 0.8;
          item.position.y = REVEAL.y + Math.sin(time * 2) * 0.05;
        }
      }
      updateBits(dt);
      if (shelfView.style.display !== 'flex') renderer.render(scene, camera); // 棚を開いている間は裏を描かない
      requestAnimationFrame(frame);
    }
    resize(); renderControls(); applyLang();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
    // 最初の1回のアイテムを読んでおく
    loadChunk(0).catch(() => {});
  </script>
</body>
</html>
