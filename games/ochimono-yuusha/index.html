    soundBtn.addEventListener('click', () => { soundOn = !soundOn; store.set('sound', soundOn); drawSoundBtn(); soundBtn.blur(); });
    let ac = null, master = null;
    // iPhone の消音モードでも鳴るようにする

    function initAudio() {

    addEventListener('keydown', initAudio, { capture: true });
    const ok = () => soundOn && ac;
    function tone(type, f0, f1, dur, vol, delay = 0) {
      if (!ok()) return;
      const now = ac.currentTime + delay;
      const o = ac.createOscillator(); o.type = type;
      o.frequency.setValueAtTime(f0, now); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), now + dur);
      const g = ac.createGain(); g.gain.setValueAtTime(0.0001, now); g.gain.linearRampToValueAtTime(vol, now + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      o.connect(g).connect(master); o.start(now); o.stop(now + dur + 0.02);

    const noiseBuf = {};
    function nbuf(dur) { const k = Math.round(dur * 100); if (!noiseBuf[k]) { const b = ac.createBuffer(1, Math.max(1, Math.floor(ac.sampleRate * dur)), ac.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; noiseBuf[k] = b; } return noiseBuf[k]; }
    // ノイズを1つのフィルターに通す（f1 へ周波数を動かせる）
    function nz(dur, vol, type, f0, f1 = f0, q = 1, delay = 0, attack = 0.004) {
      if (!ok()) return;
      const now = ac.currentTime + delay;
      const s = ac.createBufferSource(); s.buffer = nbuf(dur);
      const fl = ac.createBiquadFilter(); fl.type = type; fl.Q.value = q;
      fl.frequency.setValueAtTime(f0, now); fl.frequency.exponentialRampToValueAtTime(f1, now + dur);
      const g = ac.createGain(); g.gain.setValueAtTime(0.0001, now); g.gain.linearRampToValueAtTime(vol, now + attack); g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      s.connect(fl).connect(g).connect(master); s.start(now); s.stop(now + dur);
    }
    // 声: のこぎり波（声帯）＋息のノイズを、母音ごとの共鳴（フォルマント）に通す
    const VOWEL = { a: [800, 1200, 2600], i: [300, 2300, 3000], u: [350, 1250, 2500], e: [500, 1900, 2600], o: [500, 850, 2500], g: [450, 1100, 2400] };
    function voice(f0, seq, dur, vol = 0.5, shake = 0.04, breath = 0.15, delay = 0) {
      if (!ok()) return;
      const now = ac.currentTime + delay;
      const o = ac.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(f0 * 1.2, now);

      o.frequency.exponentialRampToValueAtTime(f0 * 0.72, now + dur);
      const vib = ac.createOscillator(); vib.frequency.value = 5.5 + Math.random() * 3;
      const vg = ac.createGain(); vg.gain.value = f0 * shake; vib.connect(vg).connect(o.frequency);
      const ns = ac.createBufferSource(); ns.buffer = nbuf(dur);
      const ng = ac.createGain(); ng.gain.value = breath;

      o.connect(src); ns.connect(ng).connect(src);

      out.gain.setValueAtTime(vol, now + dur * 0.55);
      out.gain.exponentialRampToValueAtTime(0.001, now + dur);
      const k = f0 > 300 ? 1.2 : 1;
      [1, 0.6, 0.25].forEach((amp, fi) => {
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = fi === 0 ? 6 : 9;
        seq.forEach((v, si) => { const tt = now + dur * si / Math.max(1, seq.length - 1) * 0.7; bp.frequency[si ? 'linearRampToValueAtTime' : 'setValueAtTime'](VOWEL[v][fi] * k, tt); });
        const g = ac.createGain(); g.gain.value = amp * 3;

    const pick = a => a[Math.floor(Math.random() * a.length)];
    const rnd = (a, b) => a + Math.random() * (b - a);
    // 石がぶつかる「コツ」: 短いノイズを複数の共鳴に通す＋低い胴鳴り

      const len = 0.06, buf = ac.createBuffer(1, Math.floor(ac.sampleRate * len), ac.sampleRate), d = buf.getChannelData(0);

      for (const [f, q, g0] of [[480, 7, 1.1], [1150, 9, 0.55], [2600, 6, 0.25]]) {

    const sMove = () => { if (!ok()) return; nz(0.03, 0.08, 'bandpass', 2400, 2000, 3); };
    const sRot = () => { if (!ok()) return; nz(0.05, 0.09, 'bandpass', 1500, 3000, 4); tone('sine', 900, 1100, 0.04, 0.03); };
    const sLand = () => knock(0.7, 1);

      nz(0.5, 0.18, 'bandpass', 3000, 800, 1.2);

    }
    const HERO_F0 = 230;
    const sSlash = () => { if (!ok()) return; nz(0.16, 0.25, 'bandpass', 900, 5000, 2, 0, 0.06); voice(HERO_F0 * rnd(0.95, 1.08), pick([['e', 'a'], ['a', 'a'], ['o', 'a']]), rnd(0.18, 0.26), 0.35, 0.03); };
    function sImpact(el, strong) {
      if (!ok()) return;

        for (let i = 0; i < 6; i++) nz(0.02, 0.2 * v, 'highpass', 3000, 3000, 1, 0.05 + Math.random() * 0.35);

      } else if (el === 2) { // 水: ざばっ、と泡

    const sMeow = (k = 1) => { voice(rnd(480, 560) * k, pick([['i', 'a', 'u'], ['e', 'a', 'o'], ['i', 'a', 'o']]), rnd(0.5, 0.7), 0.45, 0.06, 0.12); };

    const sRise = () => { if (!ok()) return; nz(0.45, 0.3, 'lowpass', 300, 90, 1, 0, 0.05); for (let i = 0; i < 3; i++) setTimeout(() => knock(0.3, 0.6), 60 + i * 90); };
    const sWin = () => { if (!ok()) return; [523, 659, 784, 1046].forEach((f, i) => { tone('triangle', f, f, 0.22, 0.12, i * 0.09); tone('sine', f * 2, f * 2, 0.15, 0.03, i * 0.09); }); voice(HERO_F0 * 1.1, ['a', 'a'], 0.35, 0.3, 0.02, 0.1, 0.3); };
    const sOver = () => { voice(HERO_F0 * 0.95, ['a', 'o', 'u'], 0.9, 0.45, 0.06, 0.25); tone('triangle', 330, 110, 1.0, 0.12, 0.2); };

    // ---------- 3D ----------

    const sun = new THREE.DirectionalLight('#fff0d8', 2.3);

    const shade = o => { o.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); return o; };
    const SPH = new THREE.SphereGeometry(1, 28, 18), CYL = new THREE.CylinderGeometry(1, 1, 1, 24), CAP = new THREE.CapsuleGeometry(1, 1, 8, 20);

    const catTex = new THREE.TextureLoader().load('cat.png'); catTex.colorSpace = THREE.SRGBColorSpace;

    // ---------- 盤面 ----------
    const COLS = 8, ROWS = 14;
    const EL_COLOR = { 1: '#ff5a2a', 2: '#2f8cff', 3: '#3cc24a', 4: '#8a8c94' };
    // ブロックの模様（属性の印）
    function blockTex(el) {
      return canvasTex(128, 128, (g, w, h) => {
        const base = { 1: ['#ffb070', '#e8401c', '#a01e0a'], 2: ['#a8d8ff', '#2f7ee8', '#123f9a'], 3: ['#b8f0a0', '#34b040', '#16661e'], 4: ['#b4b6bc', '#86888e', '#55575e'] }[el];

      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'ochimono-yuusha.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;
    function showResult() { resultEl.children[0].textContent = t('floor')(floorN); }
    function start() {
      state = 'play';
      reset();
      resultEl.style.display = 'none';
      drawFloor();
      renderControls(); resize();
    }
    function finish() {
      state = 'result'; resultT = 0;
      showResult();
      resultEl.style.display = 'flex';
      drawFloor();
      snap = null; needSnap = true;
      renderControls(); resize();
    }

    // ---------- ループ ----------
    let last = performance.now(), acc = 0;
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      acc += dt;
      while (acc >= STEP) { step(STEP); acc -= STEP; }
      animate();
      renderer.render(scene, camera);
      if (needSnap) { needSnap = false; takeSnap(); prepareShare(); }
      requestAnimationFrame(loop);
    }

    reset();
    resize();
    applyLang();
    // 最初の1回が重くならないように、使う形と質感を一度描いておく
    {
      const tmp = [makeFoe(1, 1), makeFoe(2, 2), makeFoe(0, 3)];
      tmp.forEach((f, i) => { f.g.position.set(i * 2 - 2, 0, 0); arena.add(f.g); });
      boss.g.position.set(FOE_X, 0, -2); arena.add(boss.g);
      for (const el of [1, 2, 3, 4]) cellMeshes[el - 1].visible = true, cellMeshes[el - 1].material = BMAT[el];
      elementBurst(1, new THREE.Vector3(0, 1, 0), 0.3); elementBurst(2, new THREE.Vector3(0, 1, 0), 0.3); elementBurst(3, new THREE.Vector3(0, 1, 0), 0.3);
      flashes[0].visible = true; slash.visible = true;
      renderer.compile(scene, camera); renderer.render(scene, camera);
      tmp.forEach(f => arena.remove(f.g)); arena.remove(boss.g); flashes[0].visible = false;
      for (const f of fx) f.parent.remove(f.m); fx.length = 0;
      gridDirty = true;
    }
    requestAnimationFrame(t0 => { last = t0; loop(t0); });
  </script>
</body>
