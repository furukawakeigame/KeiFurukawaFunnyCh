  <script type="module">

    // ---------- 保存・言語 ----------
    const store = {
      get(k, d) { try { const v = localStorage.getItem('three-body:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },

    const LANGS = ['ja', 'ko', 'en', 'th'];
    const autoLang = () => { for (const l of navigator.languages?.length ? navigator.languages : [navigator.language || '']) { const c = l.toLowerCase().slice(0, 2); if (LANGS.includes(c)) return c; } return 'en'; };
    const DICT = {
      ja: { title: '三体問題', back: '← トップへ戻る', again: 'もう一度', post: 'Xに投稿', sec: s => `${s}秒`, best: s => `ベスト ${s}`,

      en: { title: 'Three-Body Problem', back: '← Back to top', again: 'Play again', post: 'Post on X', sec: s => `${s} s`, best: s => `Best ${s}`,
            share: s => `Kept three stars in orbit for ${s} without falling apart #三体問題ゲーム` },
      th: { title: 'ปัญหาสามวัตถุ', back: '← กลับหน้าแรก', again: 'เล่นอีกครั้ง', post: 'โพสต์ลง X', sec: s => `${s} วินาที`, best: s => `ดีที่สุด ${s}`,
            share: s => `ประคองดาวสามดวงให้โคจรไม่แตกได้ ${s} #三体問題ゲーム` },
    };
    let lang = store.get('lang', null) || autoLang();
    const t = k => DICT[lang][k];
    const fmtSec = v => t('sec')((Math.floor(v * 10) / 10).toFixed(1));
    const langSel = document.getElementById('lang');
    langSel.value = lang;
    langSel.addEventListener('change', () => { lang = langSel.value; store.set('lang', lang); applyLang(); });
    function applyLang() {
      document.documentElement.lang = lang;
      document.title = t('title');
      document.getElementById('back').textContent = t('back');
      if (state === 'result') { showResult(); prepareShare(); }

    }

    // ---------- 音 ----------
    let soundOn = store.get('sound', true);
    const soundBtn = document.getElementById('sound');
    const drawSoundBtn = () => {
      soundBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>${soundOn ? '<path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>' : '<path d="M17 9l5 6M22 9l-5 6"/>'}</svg>`;
    };
    drawSoundBtn();
    soundBtn.addEventListener('click', () => { soundOn = !soundOn; store.set('sound', soundOn); drawSoundBtn(); if (!soundOn) humStop(); else if (state === 'play') humStart(); });
    let ac = null, master = null;
    function unmuteIOS() {
      try { if (navigator.audioSession) { navigator.audioSession.type = 'playback'; return; } } catch {}
      try {
        const n = 4410, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
        const w = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
        w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
        v.setUint32(24, 44100, true); v.setUint32(28, 88200, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
        const a = document.createElement('audio');
        a.src = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' })); a.loop = true; a.setAttribute('playsinline', '');
        a.play().catch(() => {});
      } catch {}
    }
    function initAudio() {
      if (ac) return;
      unmuteIOS();
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        master = ac.createDynamicsCompressor(); master.connect(ac.destination);
        const o = ac.createOscillator(), g = ac.createGain(); g.gain.value = 0;
        o.connect(g).connect(master); o.start(); o.stop(ac.currentTime + 0.05);
      } catch { ac = null; }
    }
    addEventListener('pointerdown', initAudio, { capture: true });
    addEventListener('keydown', initAudio, { capture: true });
    const on = () => soundOn && ac;
    function tone(type, f0, f1, dur, vol, delay = 0) {
      if (!on()) return;
      const now = ac.currentTime + delay;
      const o = ac.createOscillator(); o.type = type;
      o.frequency.setValueAtTime(f0, now); o.frequency.exponentialRampToValueAtTime(f1, now + dur);
      const g = ac.createGain(); g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(vol, now + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      o.connect(g).connect(master); o.start(now); o.stop(now + dur + 0.02);
    }
    const noiseBuf = {};
    function getNoise(dur) {
      const key = Math.ceil(dur * 10);
      if (noiseBuf[key]) return noiseBuf[key];
      const b = ac.createBuffer(1, Math.floor(ac.sampleRate * key / 10), ac.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      return noiseBuf[key] = b;
    }
    function noise(dur, vol, f0, f1 = f0, type = 'lowpass', q = 1, delay = 0, attack = 0.005) {
      if (!on()) return;
      const now = ac.currentTime + delay;
      const s = ac.createBufferSource(); s.buffer = getNoise(dur);
      const fl = ac.createBiquadFilter(); fl.type = type; fl.Q.value = q;
      fl.frequency.setValueAtTime(f0, now); fl.frequency.exponentialRampToValueAtTime(f1, now + dur);
      const g = ac.createGain(); g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(vol, now + attack); g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      s.connect(fl).connect(g).connect(master); s.start(now); s.stop(now + dur + 0.05);
    }
    // 声: 声帯の振動（のこぎり波＋息のノイズ）を、母音ごとの共鳴（フォルマント）に通す
    const VOWEL = { a: [800, 1200, 2600], i: [300, 2300, 3000], u: [350, 1250, 2500], e: [500, 1900, 2600], o: [500, 850, 2500] };
    function voice(f0, seq, dur, vol = 0.4, { rise = 1.3, fall = 0.75, shake = 0.05, breath = 0.12, delay = 0, fmul = 1.25 } = {}) {
      if (!on()) return;
      const now = ac.currentTime + delay;
      const o = ac.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(f0 * rise * 0.95, now);
      o.frequency.linearRampToValueAtTime(f0 * rise, now + dur * 0.25);
      o.frequency.exponentialRampToValueAtTime(f0 * fall, now + dur);
      const vib = ac.createOscillator(); vib.frequency.value = 6 + Math.random() * 3;
      const vg = ac.createGain(); vg.gain.value = f0 * shake; vib.connect(vg).connect(o.frequency);
      const ns = ac.createBufferSource(); ns.buffer = getNoise(dur);
      const ng = ac.createGain(); ng.gain.value = breath;
      const src = ac.createGain();
      o.connect(src); ns.connect(ng).connect(src);
      const out = ac.createGain();
      out.gain.setValueAtTime(0, now);
      out.gain.linearRampToValueAtTime(vol, now + 0.025);
      out.gain.setValueAtTime(vol, now + dur * 0.55);
      out.gain.exponentialRampToValueAtTime(0.001, now + dur);
      [1, 0.6, 0.25].forEach((amp, fi) => {
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = fi === 0 ? 6 : 9;
        seq.forEach((v, si) => { const tt = now + dur * si / Math.max(1, seq.length - 1) * 0.75; bp.frequency[si ? 'linearRampToValueAtTime' : 'setValueAtTime'](VOWEL[v][fi] * fmul, tt); });
        const g = ac.createGain(); g.gain.value = amp * 3;
        src.connect(bp).connect(g).connect(out);
      });
      out.connect(master);
      o.start(now); vib.start(now); ns.start(now);
      o.stop(now + dur); vib.stop(now + dur); ns.stop(now + dur);
    }
    const pick = a => a[Math.floor(Math.random() * a.length)];
    const CAT_F0 = 620;
    // 猫の「にゃー」（ぶつかった・飛ばされた）
    function sMeow(big = true, delay = 0) {
      const f = CAT_F0 * (0.9 + Math.random() * 0.2);
      if (big) voice(f, pick([['i', 'a', 'a', 'o'], ['i', 'e', 'a', 'u'], ['e', 'a', 'a', 'o']]), 0.6 + Math.random() * 0.3, 0.32, { rise: 1.25, fall: 0.62, shake: 0.06, breath: 0.1, delay, fmul: 1.45 });
      else voice(f * 1.1, pick([['i', 'a'], ['e', 'a'], ['i', 'u']]), 0.16 + Math.random() * 0.08, 0.24, { rise: 1.15, fall: 0.9, shake: 0.03, delay, fmul: 1.45 });
    }
    // 星をつかむ「コッ」
    function sGrab() { noise(0.05, 0.12, 2400, 1400, 'bandpass', 8); tone('sine', 520, 380, 0.08, 0.08); }
    function sRelease() { noise(0.04, 0.08, 1700, 1100, 'bandpass', 8); }
    // 再生「フォン」: 下からせり上がる風の音と和音
    function sLaunch() {
      noise(0.9, 0.22, 200, 2400, 'bandpass', 2.5, 0, 0.25);
      [220, 330, 440].forEach((f, i) => tone('sine', f * 0.5, f, 0.9, 0.07, i * 0.04));
      tone('sine', 60, 110, 0.7, 0.3);
    }
    // すれ違う「ヒュン」
    function sPass(p) { noise(0.32, 0.05 + p * 0.12, 600 + p * 800, 2600 + p * 2000, 'bandpass', 3, 0, 0.12); }
    // 衝突: 爆発のゴォッ＋低い衝撃＋パチパチ
    function sCrash() {
      noise(1.8, 0.6, 1600, 80, 'lowpass', 0.8, 0, 0.003);
      noise(0.35, 0.35, 4000, 600, 'bandpass', 1.5);
      tone('sine', 70, 22, 1.1, 0.75);
      for (let i = 0; i < 9; i++) noise(0.04, 0.12, 2500 + Math.random() * 2500, 1500, 'bandpass', 4, 0.1 + Math.random() * 0.9);
    }
    // 飛ばされる: 遠ざかるヒュー
    function sLost() { tone('sine', 1200, 240, 1.4, 0.12); tone('triangle', 1800, 360, 1.4, 0.05); noise(1.2, 0.12, 3000, 400, 'bandpass', 2); }
    function bell(f, delay, vol) { [[1, 1], [2.76, 0.4], [5.4, 0.2]].forEach(([m, a]) => tone('sine', f * m, f * m * 0.998, 1.8, vol * a, delay)); }
    function sPerfect() { [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => bell(f, 0.1 + i * 0.12, 0.13)); }
    function sBest() { bell(1047, 0, 0.1); bell(1568, 0.12, 0.1); }
    // 星どうしの重力のうなり（近いほど高く大きく）
    let hum = null;
    function humStart() {
      if (!on() || hum) return;
      const now = ac.currentTime;
      const g = ac.createGain(); g.gain.value = 0;
      const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = 200; fl.Q.value = 4;
      const o1 = ac.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = 55;
      const o2 = ac.createOscillator(); o2.type = 'sawtooth'; o2.frequency.value = 82.6;
      const o3 = ac.createOscillator(); o3.type = 'sine'; o3.frequency.value = 110;
      o1.connect(fl); o2.connect(fl); o3.connect(fl); fl.connect(g).connect(master);
      g.gain.setTargetAtTime(0.05, now, 0.3);
      o1.start(now); o2.start(now); o3.start(now);
      hum = { g, fl, o1, o2, o3 };
    }
    function humSet(close) {
      if (!hum) return;
      const now = ac.currentTime;
      hum.g.gain.setTargetAtTime(0.04 + close * 0.16, now, 0.08);
      hum.fl.frequency.setTargetAtTime(160 + close * 900, now, 0.08);
      hum.o1.frequency.setTargetAtTime(55 * (1 + close * 0.5), now, 0.1);
      hum.o2.frequency.setTargetAtTime(82.6 * (1 + close * 0.5), now, 0.1);
      hum.o3.frequency.setTargetAtTime(110 * (1 + close * 0.8), now, 0.1);
    }
    function humStop() {
      if (!hum) return;
      const h = hum; hum = null;
      const now = ac.currentTime;
      h.g.gain.setTargetAtTime(0, now, 0.15);
      [h.o1, h.o2, h.o3].forEach(n => n.stop(now + 0.8));
    }

    // ---------- 物理（G=1、質量1の星が3つ。平面の上だけを動く） ----------
    const RATE = 1.6;          // 1秒あたりに進むシミュレーションの時間
    const STEP = 1 / 120;      // 固定の時間刻み（実時間）
    const WS = 1.6;            // 物理の長さ → 3D の長さ
    const R_ESC = 3.2;         // この輪の外に出たら「飛ばされた」
    const EDIT_R = 2.4;        // 置ける範囲
    const STAR_R = 0.23;       // 星の見た目の半径（物理）
    const COLL = 0.32;         // これより近づくと衝突
    const VMAX = 1.8;
    const ARW = 0.75;          // 速さ1 → 矢印の長さ（物理）
    const D0 = 0.42;           // 矢印のつまみは、速さ0でも星の外に出しておく
    const CAP = 180;           // 記録の上限（秒）
    const EPS2 = 1e-4;
    const CAT = 2;             // 猫の星

    const sim = { x: new Float64Array(6), v: new Float64Array(6), m: [1, 1, 1], alive: [true, true, true], t: 0 };
    const accBuf = new Float64Array(6);
    function accel(x, a) {
      a.fill(0);
      for (let i = 0; i < 3; i++) {
        if (!sim.alive[i]) continue;
        for (let j = i + 1; j < 3; j++) {

    const tipOf = i => { const v = setup.v[i], s = Math.hypot(v[0], v[1]), d = s > 1e-6 ? [v[0] / s, v[1] / s] : [0, -1], L = D0 + s * ARW; return [setup.p[i][0] + d[0] * L, setup.p[i][1] + d[1] * L]; };
    let drag = null;
    renderer.domElement.addEventListener('pointerdown', e => {
      if (state !== 'edit') return;
      const r = renderer.domElement.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
      const [ax, ay] = toScreen(0, 0), [bx, by] = toScreen(STAR_R, 0), starPx = Math.hypot(bx - ax, by - ay);
      const grabR = Math.max(30, starPx * 1.6);
      let bestD = Infinity, cand = null;
      for (let i = 0; i < 3; i++) {
        const [tx, ty] = toScreen(...tipOf(i)), dt = Math.hypot(mx - tx, my - ty) * 0.85;
        if (dt < grabR && dt < bestD) { bestD = dt; cand = { type: 'vel', i }; }
        const [sx, sy] = toScreen(...setup.p[i]), ds = Math.hypot(mx - sx, my - sy);
        if (ds < grabR && ds < bestD) { bestD = ds; cand = { type: 'pos', i }; }
      }
      if (!cand) return;
      const p = toPhys(e.clientX, e.clientY); if (!p) return;
      if (cand.type === 'pos') cand.off = [setup.p[cand.i][0] - p[0], setup.p[cand.i][1] - p[1]];
      else { const tp = tipOf(cand.i); cand.off = [tp[0] - p[0], tp[1] - p[1]]; }
      drag = cand; drag.id = e.pointerId;
      renderer.domElement.setPointerCapture(e.pointerId);
      sGrab();
    });
    renderer.domElement.addEventListener('pointermove', e => {
      if (!drag || e.pointerId !== drag.id || state !== 'edit') return;
      const q = toPhys(e.clientX, e.clientY); if (!q) return;
      const p = [q[0] + drag.off[0], q[1] + drag.off[1]], i = drag.i;
      if (drag.type === 'pos') {
        const r = Math.hypot(p[0], p[1]), k = r > EDIT_R ? EDIT_R / r : 1;
        setup.p[i] = [p[0] * k, p[1] * k];
      } else {
        const dx = p[0] - setup.p[i][0], dy = p[1] - setup.p[i][1], L = Math.hypot(dx, dy) || 1;
        const s = Math.min(VMAX, Math.max(0, L - D0) / ARW);
        setup.v[i] = [dx / L * s, dy / L * s];
      }
      for (let k = 0; k < 3; k++) { sim.x[k * 2] = setup.p[k][0]; sim.x[k * 2 + 1] = setup.p[k][1]; }
      prevX.set(sim.x);
      predDirty = true;
    });
    const endDrag = e => { if (drag && e.pointerId === drag.id) { drag = null; sRelease(); } };
    renderer.domElement.addEventListener('pointerup', endDrag);
    renderer.domElement.addEventListener('pointercancel', endDrag);
    addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter') { if (e.target.closest?.('button, a, select')) return; e.preventDefault(); if (state === 'edit') play(); else if (state === 'result') enterEdit(lastSetup); } });

    // ---------- 毎フレーム ----------
    let last = performance.now(), clockT = 0;
    const rp = [[0, 0], [0, 0], [0, 0]];
    function simStep() {
      prevX.set(sim.x);
      if (state === 'play') {
        const ev = advance(sim, STEP * RATE, true);
        if (sim.t / RATE >= CAP) { score = CAP; perfect = true; humStop(); sPerfect(); state = 'end'; endEv = { type: 'perfect' }; endT = 0.9; return; }
        if (ev) { if (ev.type === 'crash') prevX.set(sim.x); endGame(ev); }
      } else {
        advance(sim, STEP * RATE, false);
      }
      for (let i = 0; i < 3; i++) {
        if (sim.alive[i] && Math.hypot(sim.x[i * 2], sim.x[i * 2 + 1]) < 60) trailPts[i].push([sim.x[i * 2], sim.x[i * 2 + 1]]);
        else if (trailPts[i].length) trailPts[i].shift();
        if (trailPts[i].length > TRAIL_MAX) trailPts[i].shift();
      }
    }
    function frame(now) {
      requestAnimationFrame(frame);
      const dt = Math.min(0.05, (now - last) / 1000) * (window.__speed || 1); last = now; clockT += dt;
      const running = state !== 'edit';
      if (running) {
        accT += dt;
        while (accT >= STEP) { simStep(); accT -= STEP; }
      }
      const al = running ? accT / STEP : 1;
      for (let i = 0; i < 3; i++) { rp[i][0] = prevX[i * 2] + (sim.x[i * 2] - prevX[i * 2]) * al; rp[i][1] = prevX[i * 2 + 1] + (sim.x[i * 2 + 1] - prevX[i * 2 + 1]) * al; }

      // 星
      for (let i = 0; i < 3; i++) {
        const s = stars[i];
        s.g.position.set(rp[i][0] * WS, 0, rp[i][1] * WS);
        const cur = s.g.scale.x, target = s.scale;
        s.g.scale.setScalar(cur + (target - cur) * Math.min(1, dt * 6));
        if (i === CAT) s.body.lookAt(camera.position); else s.body.rotation.y += dt * (0.25 + i * 0.1);
        const flick = 1 + Math.sin(clockT * (5 + i) + i * 2) * 0.03 + Math.sin(clockT * 13.7 + i) * 0.02;
        s.glow.scale.setScalar(STAR_R * WS * 5.2 * flick);
      }
      // 尾・予測・矢印
      if (state === 'edit') {
        if (predDirty) { predict(setup); predDirty = false; }
        for (let i = 0; i < 3; i++) {
          ghosts[i].set(predPts[i], 0.005, 0.0001);
          // 予測の帯は、先ほど薄く
          const n = predPts[i].length, col = ghosts[i].col;
          for (let k = 0; k < Math.min(n, ghosts[i].max); k++) { const f = 1 - k / Math.max(1, n - 1), a = 0.45 * (0.25 + 0.75 * f); col[k * 6] = col[k * 6 + 3] = ghosts[i].color.r * a; col[k * 6 + 1] = col[k * 6 + 4] = ghosts[i].color.g * a; col[k * 6 + 2] = col[k * 6 + 5] = ghosts[i].color.b * a; }
          ghosts[i].mesh.geometry.attributes.color.needsUpdate = true;
          const A = arrows[i], v = setup.v[i], sp = Math.hypot(v[0], v[1]), tip = tipOf(i);
          A.g.visible = true;
          const px = setup.p[i][0] * WS, pz = setup.p[i][1] * WS, tx = tip[0] * WS, tz = tip[1] * WS;
          const dx = tx - px, dz = tz - pz, L = Math.hypot(dx, dz);
          A.g.position.set(px, 0.02, pz);
          A.g.rotation.y = Math.atan2(-dz, dx);
          const startR = STAR_R * WS * 1.15, len = Math.max(0.001, L - startR - 0.24);
          A.shaft.visible = A.head.visible = sp > 0.02;
          A.shaft.scale.x = len; A.shaft.position.x = startR + len / 2;
          A.head.position.x = L - 0.12;
          A.ring.position.x = A.pulse.position.x = L;
          const ph = (clockT * 0.9 + i * 0.33) % 1, active = drag && drag.i === i && drag.type === 'vel';
          A.pulse.scale.setScalar(1 + ph * 1.4); A.pulse.material.opacity = (1 - ph) * 0.7;
          A.ring.scale.setScalar(active ? 1.3 : 1);
        }
      } else {
        for (let i = 0; i < 3; i++) {
          arrows[i].g.visible = false; ghosts[i].hide();
          const pts = sim.alive[i] ? trailPts[i].concat([[rp[i][0], rp[i][1]]]) : trailPts[i];
          trails[i].set(pts, 0.01);
        }
      }
      // 境界: 近づいた星があると赤く光る
      let near = 0;
      for (let i = 0; i < 3; i++) if (state === 'edit' || sim.alive[i]) near = Math.max(near, smooth(R_ESC * 0.7, R_ESC, Math.hypot(rp[i][0], rp[i][1])));
      if (state === 'end' || state === 'result') near *= 0.4;
      bound.material.color.setRGB(0.44 + near * 0.56, 0.55 - near * 0.3, 1 - near * 0.65);
      bound.material.opacity = 0.3 + near * 0.5;
      boundTicks.rotation.y += dt * 0.03;

      // プレイ中: ゲージ・音・すれ違い
      if (state === 'play') {
        const tsec = sim.t / RATE, ref = Math.max(best, 10);
        gaugeFill.style.width = Math.min(100, tsec / ref * 100).toFixed(1) + '%';
        const over = best > 0 && tsec > best;
        if (over !== gaugeEl.classList.contains('over')) gaugeEl.classList.toggle('over', over);
        const [d, a, b] = minPair(sim.x);
        humSet(clamp01((1.1 - d) / 0.9));
        for (let k = 0; k < 3; k++) passCool[k] -= dt;
        meowCool -= dt;
        if (d < 0.62 && passCool[a] <= 0 && passCool[b] <= 0) {
          const p = clamp01((0.62 - d) / 0.33);
          sPass(p); passCool[a] = passCool[b] = 0.5;
          if ((a === CAT || b === CAT) && meowCool <= 0 && d < 0.5) { sMeow(false); meowCool = 2.2; }
        }
      }
      if (state === 'end') {
        endT += dt;
        if (!snapCanvas && endT > 0.55) snapPending = true;
        if (endT > 1.35) finish();
      }
      // 演出
      if (pulseT >= 0) {
        pulseT += dt;
        for (let i = 0; i < 3; i++) { const m = pulses[i]; m.position.set(rp[i][0] * WS, 0.03, rp[i][1] * WS); m.scale.setScalar(0.3 + pulseT * 2.4); m.material.opacity = Math.max(0, 0.8 - pulseT * 1.4); }
        if (pulseT > 0.7) { pulseT = -1; pulses.forEach(m => m.material.opacity = 0); }
      }
      if (shockT >= 0) {
        shockT += dt;
        shock.scale.setScalar(0.2 + shockT * 6); shock.material.opacity = Math.max(0, 1 - shockT * 0.9);
        flash.scale.setScalar(2 + shockT * 10); flash.material.opacity = Math.max(0, 1 - shockT * 2.2);
        if (shockT > 1.2) { shockT = -1; shock.material.opacity = 0; flash.material.opacity = 0; }
      }
      updateParts(dt);
      updateGrid(rp);
      composer.render();
      if (snapPending) { snapPending = false; takeSnap(); }
    }

    // ---------- 開始 ----------
    window.__state = () => ({ state, score, best, setup });
    window.__play = () => play();
    window.__setup = s => enterEdit(normalize(cloneSetup(s)));
    layout();
    applyLang();
    enterEdit(setup);
    updateGrid(rp);
    composer.render(); // 空回しして、最初のフレームで固まらないように
    renderer.compileAsync?.(scene, camera).catch(() => {});
    requestAnimationFrame(t0 => { last = t0; frame(t0); });
  </script>
</body>
</html>
