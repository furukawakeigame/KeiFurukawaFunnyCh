  <script type="module">
    import * as THREE from 'three';
    import * as CANNON from 'cannon-es';
    window.__ok = true;

    const SHARE_URL = 'https://keifurukawafunnych.com/games/naguriai/';
    const store = {
      get(k, d) { try { const v = localStorage.getItem('naguriai:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
      set(k, v) { try { localStorage.setItem('naguriai:' + k, JSON.stringify(v)); } catch {} },
    };

    // ---------- 言語 ----------
    const DICT = {
      ja: { title: '殴り合いゲーム', back: '← トップへ戻る', start: 'スタート', retry: 'もう一度', share: 'Xに投稿',
        n: n => `${n}人`, shareText: n => `殴り合いゲームで${n}人倒した！ #殴り合いゲーム` },
      ko: { title: '난투 게임', back: '← 처음으로', start: '시작', retry: '다시 하기', share: 'X에 게시',
        n: n => `${n}명`, shareText: n => `난투 게임에서 ${n}명을 쓰러뜨렸다! #殴り合いゲーム` },
      en: { title: 'Brawl Game', back: '← Top', start: 'Start', retry: 'Play again', share: 'Post on X',
        n: n => `${n} KO`, shareText: n => `I knocked out ${n} in Brawl Game! #殴り合いゲーム` },
      th: { title: 'เกมต่อยกัน', back: '← หน้าแรก', start: 'เริ่ม', retry: 'เล่นอีกครั้ง', share: 'โพสต์ลง X',
        n: n => `${n} คน`, shareText: n => `ล้มคู่ต่อสู้ได้ ${n} คนในเกมต่อยกัน! #殴り合いゲーム` },
    };
    const autoLang = () => { for (const l of navigator.languages?.length ? navigator.languages : [navigator.language || '']) { const c = l.toLowerCase().slice(0, 2); if (DICT[c]) return c; } return 'en'; };
    let lang = store.get('lang', autoLang());
    if (!DICT[lang]) lang = 'en';
    const t = k => DICT[lang][k];
    const $ = id => document.getElementById(id);
    function applyLang() {
      document.documentElement.lang = lang;
      document.title = t('title');
      $('lang').value = lang;
      $('back').textContent = t('back');
      $('startBtn').textContent = t('start');
      $('retry').textContent = t('retry');
      $('share').textContent = t('share');
      if (state === 'result') showResult();
    }
    $('lang').addEventListener('change', e => { lang = e.target.value; store.set('lang', lang); applyLang(); });

    // ---------- 音 ----------
    let muted = store.get('muted', false);
    const soundBtn = $('sound');
    const updateSoundBtn = () => {
      soundBtn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9h3l4-4v14l-4-4H4z" fill="currentColor"/>${
        muted ? '<path d="M16 9l5 6M21 9l-5 6"/>' : '<path d="M15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12"/>'}</svg>`;
    };
    soundBtn.onclick = () => { muted = !muted; store.set('muted', muted); updateSoundBtn(); };
    updateSoundBtn();
    let ac = null;
    // 最初の操作で AudioContext を作り、無音を1回鳴らしておく
    addEventListener('pointerdown', () => {
      if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        const o = ac.createOscillator(), g = ac.createGain(); g.gain.value = 0;
        o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.05);
      } catch { ac = null; }
    }, { capture: true });
    function tone(type, f0, f1, dur, vol) {
      if (muted || !ac) return;
      const o = ac.createOscillator(), g = ac.createGain(), now = ac.currentTime;
      o.type = type;
      o.frequency.setValueAtTime(f0, now); o.frequency.exponentialRampToValueAtTime(f1, now + dur);
      g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      o.connect(g).connect(ac.destination); o.start(now); o.stop(now + dur + 0.02);
    }
    function noise(dur, vol, freq) {
      if (muted || !ac) return;
      const now = ac.currentTime;
      const buf = ac.createBuffer(1, Math.ceil(ac.sampleRate * dur), ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) ** 2;
      const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      s.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; g.gain.value = vol;
      s.connect(f).connect(g).connect(ac.destination); s.start(now);
    }
    const sndPoka = v => { tone('square', 520, 140, 0.12, Math.min(0.35, 0.08 + v * 0.025)); noise(0.08, 0.5, 1800); };
    const sndPon = () => { tone('triangle', 900, 600, 0.15, 0.3); tone('sine', 1350, 900, 0.12, 0.15); };
    const sndClash = () => noise(0.12, 0.6, 3000);
    const sndPop = () => { tone('sine', 300, 1400, 0.25, 0.4); noise(0.3, 0.6, 900); };
    const sndFall = () => tone('sine', 700, 120, 0.8, 0.3);

    // ---------- 3D ----------
    const stage = $('stage');
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    stage.appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    {
      const c = document.createElement('canvas'); c.width = 2; c.height = 256;
      const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
      gr.addColorStop(0, '#4aa8ee'); gr.addColorStop(0.75, '#bfe6ff'); gr.addColorStop(1, '#e8f6ff');
      g.fillStyle = gr; g.fillRect(0, 0, 2, 256);
      const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
      scene.background = tex;
    }
    scene.fog = new THREE.Fog(0xcfeaff, 18, 60);
    const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x88a070, 1.3));
    const sun = new THREE.DirectionalLight(0xffffff, 1.7);
    sun.position.set(3, 8, 6); sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024); sun.shadow.bias = -0.002; sun.shadow.normalBias = 0.03;
    Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 1, far: 30 });
    scene.add(sun);
    const lam = c => new THREE.MeshLambertMaterial({ color: c });

    // 足場：細い台と、下に柱。遠くに地面
    const PLAT_W = 4.2, PLAT_D = 1.6, PLAT_H = 0.4;
    const plat = new THREE.Mesh(new THREE.BoxGeometry(PLAT_W, PLAT_H, PLAT_D), lam(0xc9935a));
    plat.position.y = -PLAT_H / 2; plat.receiveShadow = true; plat.castShadow = true; scene.add(plat);
    const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.7, 12, 20), lam(0x9a7048));
    pillar.position.y = -6.4; scene.add(pillar);
    const ground = new THREE.Mesh(new THREE.CircleGeometry(80, 40), lam(0x8fcf6a));
    ground.rotation.x = -Math.PI / 2; ground.position.y = -12; scene.add(ground);

    // ---------- 物理 ----------
    const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -20, 0) });
    world.solver.iterations = 14;
    const mat = new CANNON.Material();
    world.addContactMaterial(new CANNON.ContactMaterial(mat, mat, { friction: 0, restitution: 0.1 }));
    // 当たりのグループ：台 / 自分の体 / 自分の道具 / 相手の体 / 相手の道具
    const G = { plat: 1, body: [2, 8], tool: [4, 16] };
    const platBody = new CANNON.Body({ mass: 0, material: mat, shape: new CANNON.Box(new CANNON.Vec3(PLAT_W / 2, PLAT_H / 2, PLAT_D / 2)) });
    platBody.position.set(0, -PLAT_H / 2, 0);
    platBody.collisionFilterGroup = G.plat; platBody.collisionFilterMask = 0xff;
    world.addBody(platBody);

    const H = 1 / 60;
    // 速いバットが体をすり抜けないよう、1刻みを4回に分けて計算する
    const SUBS = 4, SUB = H / SUBS;
    const tmpV = new CANNON.Vec3();
    const zAngle = q => 2 * Math.atan2(q.z, q.w);
    const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    // 補間して描くための一覧
    const tracked = [];
    function track(body, mesh) {
      const o = { body, mesh, pp: new THREE.Vector3(), pq: new THREE.Quaternion(), cp: new THREE.Vector3(), cq: new THREE.Quaternion() };
      o.cp.copy(body.position); o.cq.copy(body.quaternion); o.pp.copy(o.cp); o.pq.copy(o.cq);
      tracked.push(o); return o;
    }
    function untrack(body) { const i = tracked.findIndex(o => o.body === body); if (i >= 0) tracked.splice(i, 1); }

    const COLORS = [0x2f7de1, 0xe2453a, 0xf0a020, 0x8a4fd8, 0x2aa868, 0x333333, 0xe0609a];
    const SKIN = 0xf3c9a0;
    const SHOULDER = new CANNON.Vec3(0.05, 1.38, 0);  // 体の原点（足元）からの肩
    const BAT_LEN = 1.3, BAT_OFF = 0.12;
    const BAT_Z = 0.18;

    class Fighter {
      // side: 0 = 自分（左・右向き）, 1 = 相手（右・左向き）
      constructor(side, color, x) {
        this.side = side; this.s = side === 0 ? 1 : -1;
        this.alive = true; this.headOn = true; this.down = false;
        this.stagger = 0; this.neck = 0; this.guard = true;
        this.batAim = -2.3; this.maxW = 24;
        const grp = G.body[side], tgrp = G.tool[side], og = G.body[1 - side], ot = G.tool[1 - side];
        this.parts = [];

        // 体（足＋胴）
        const b = this.body = new CANNON.Body({ mass: 6, material: mat, linearDamping: 0.05, angularDamping: 0.3 });
        b.addShape(new CANNON.Box(new CANNON.Vec3(0.2, 0.42, 0.22)), new CANNON.Vec3(0, 0.42, 0));
        b.addShape(new CANNON.Box(new CANNON.Vec3(0.26, 0.36, 0.22)), new CANNON.Vec3(0, 1.2, 0));
        b.position.set(x, 0.01, 0);
        b.linearFactor.set(1, 1, 0); b.angularFactor.set(0, 0, 1);
        b.collisionFilterGroup = grp; b.collisionFilterMask = G.plat | og | ot;
        world.addBody(b);
        const bm = new THREE.Group();
        const legG = new THREE.CylinderGeometry(0.09, 0.08, 0.84, 10);
        for (const z of [-0.12, 0.12]) { const l = new THREE.Mesh(legG, lam(0x3a3f50)); l.position.set(0, 0.42, z); l.castShadow = true; bm.add(l); }
        const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.25, 0.42, 6, 14), lam(color));
        torso.position.y = 1.18; torso.scale.z = 0.85; torso.castShadow = true; bm.add(torso);
        scene.add(bm); this.parts.push(track(b, bm));

        // 頭（首は弱めのロックでつなぐ。叩かれるほど弱る）
        const hb = this.head = new CANNON.Body({ mass: 0.7, material: mat, linearDamping: 0.05, angularDamping: 0.2, shape: new CANNON.Sphere(0.23) });
        hb.position.set(x, 1.86, 0);
        hb.linearFactor.set(1, 1, 0); hb.angularFactor.set(0, 0, 1);
        hb.collisionFilterGroup = grp; hb.collisionFilterMask = G.plat | og | ot;
        world.addBody(hb);
        const hm = new THREE.Group();
        const skull = new THREE.Mesh(new THREE.SphereGeometry(0.23, 20, 14), lam(SKIN)); skull.castShadow = true; hm.add(skull);
        const eyeG = new THREE.SphereGeometry(0.035, 8, 6), eyeM = lam(0x111111);
        for (const z of [-0.08, 0.08]) { const e = new THREE.Mesh(eyeG, eyeM); e.position.set(0.2 * this.s, 0.04, z); hm.add(e); }
        const hair = new THREE.Mesh(new THREE.SphereGeometry(0.24, 20, 10, 0, Math.PI * 2, 0, Math.PI * 0.42), lam(0x2a1a10));
        hair.rotation.z = 0.35 * this.s; hm.add(hair);
        scene.add(hm); this.parts.push(track(hb, hm));
        this.neckC = new CANNON.LockConstraint(b, hb, { maxForce: 900 });
        world.addConstraint(this.neckC);

        // バット
        const bat = this.bat = new CANNON.Body({ mass: 1, material: mat, shape: new CANNON.Box(new CANNON.Vec3(BAT_LEN / 2, 0.07, 0.08)) });
        bat.linearFactor.set(1, 1, 0); bat.angularFactor.set(0, 0, 1);
        bat.collisionFilterGroup = tgrp; bat.collisionFilterMask = og | ot;
        bat.gravityOff = true;
        world.addBody(bat);
        const batM = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.035, BAT_LEN, 12).rotateZ(Math.PI / 2), lam(0xd6a564));
        batM.castShadow = true; scene.add(batM); this.parts.push(track(bat, batM));
        this.placeBat(true);

        // 盾（構えると前へ、振っている間は体の奥へ下げる）
        const sh = this.shield = new CANNON.Body({ mass: 3, material: mat, shape: new CANNON.Box(new CANNON.Vec3(0.05, 0.55, 0.36)) });
        sh.angularFactor.set(0, 0, 0);
        sh.collisionFilterGroup = tgrp; sh.collisionFilterMask = ot;
        world.addBody(sh);
        const shM = new THREE.Group();
        const plate = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.1, 0.72), lam(0xb8c2cc)); plate.castShadow = true; shM.add(plate);
        const rim = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.9, 0.5), lam(color)); shM.add(rim);
        scene.add(shM); this.parts.push(track(sh, shM));
        this.placeShield(true);

        // 腕（肩からバットの握りへ、肩から盾へ）
        const armG = new THREE.CylinderGeometry(0.06, 0.06, 1, 8).translate(0, 0.5, 0);
        this.armBat = new THREE.Mesh(armG, lam(color)); this.armSh = new THREE.Mesh(armG, lam(color));
        this.armBat.castShadow = this.armSh.castShadow = true;
        scene.add(this.armBat, this.armSh);

        // 当たり
        bat.addEventListener('collide', e => this.onBatHit(e));
      }
      shoulder(out = new CANNON.Vec3()) {
        const sp = new CANNON.Vec3(SHOULDER.x * this.s, SHOULDER.y, 0);
        this.body.quaternion.vmult(sp, out); out.vadd(this.body.position, out);
        out.z = BAT_Z; return out;
      }
      angle() { return zAngle(this.body.quaternion); }
      // バットの向き（自分から見た角度 a → 世界の角度）
      worldAim() { const a = this.batAim; return Math.atan2(Math.sin(a), Math.cos(a) * this.s) + this.angle(); }
      batTarget() {
        const sp = this.shoulder(), phi = this.worldAim();
        const d = BAT_OFF + BAT_LEN / 2;
        return { x: sp.x + Math.cos(phi) * d, y: sp.y + Math.sin(phi) * d, phi };
      }
      placeBat(snap) {
        const tg = this.batTarget(), b = this.bat;
        if (snap || !this.alive) {
          if (snap) { b.position.set(tg.x, tg.y, BAT_Z); b.quaternion.setFromEuler(0, 0, tg.phi); }
          return;
        }
        const k = 28, vmax = 26;
        let vx = (tg.x - b.position.x) * k, vy = (tg.y - b.position.y) * k;
        const m = Math.hypot(vx, vy); if (m > vmax) { vx *= vmax / m; vy *= vmax / m; }
        b.velocity.set(vx, vy, 0);
        b.angularVelocity.set(0, 0, clamp(wrap(tg.phi - zAngle(b.quaternion)) * 30, -this.maxW, this.maxW));
      }
      shieldTarget() {
        const p = this.body.position, a = this.angle();
        if (this.guard) return { x: p.x + this.s * 0.5 - Math.sin(a) * 1.4, y: p.y + 1.4 + Math.sin(a * this.s) * 0.0, z: 0.12 };
        return { x: p.x - this.s * 0.05, y: p.y + 0.9, z: -0.75 };
      }
      placeShield(snap) {
        const tg = this.shieldTarget(), b = this.shield;
        if (snap) { b.position.set(tg.x, tg.y, tg.z); return; }
        if (!this.alive) return;
        const k = 30, vmax = 14;
        let vx = (tg.x - b.position.x) * k, vy = (tg.y - b.position.y) * k, vz = (tg.z - b.position.z) * k;
        const m = Math.hypot(vx, vy, vz); if (m > vmax) { vx *= vmax / m; vy *= vmax / m; vz *= vmax / m; }
        b.velocity.set(vx, vy, vz);
      }
      onBatHit(e) {
        if (!this.alive || state !== 'fight') return;
        const o = e.body, foe = this.foe;
        if (!foe) return;
        const v = Math.abs(e.contact.getImpactVelocityAlongNormal());
        const now = performance.now();
        if (now - (this.lastHit || 0) < 90) return;
        if (o === foe.shield) {
          if (v < 1.5) return;
          this.lastHit = now; sndPon();
          // 盾で弾かれると、叩いた側がよろける
          hits.push(() => { this.stagger = Math.max(this.stagger, 0.4 + v * 0.03); this.body.applyImpulse(new CANNON.Vec3(-this.s * (3 + v * 0.35), 0, 0)); });
          return;
        }
        if (o === foe.bat) { if (v > 2) { this.lastHit = now; sndClash(); } return; }
        if (o !== foe.body && o !== foe.head) return;
        if (v < 2) return;
        this.lastHit = now;
        sndPoka(v);
        const dir = Math.sign(this.bat.velocity.x) || this.s;
        hits.push(() => {
          if (!foe.alive) return;
          foe.stagger = Math.max(foe.stagger, 0.25 + v * 0.06);
          if (o === foe.head && foe.headOn) {
            foe.neck += v;
            foe.neckC.equations.forEach(eq => { eq.maxForce = Math.max(150, 900 - foe.neck * 28); eq.minForce = -eq.maxForce; });
            foe.head.applyImpulse(new CANNON.Vec3(dir * v * 0.5, v * 0.15, 0));
            if (v > 15 || foe.neck > 30) foe.popHead(dir, v);
            else foe.body.applyImpulse(new CANNON.Vec3(dir * v * 0.9, 0, 0), new CANNON.Vec3(foe.body.position.x, foe.body.position.y + 1.6, 0));
          } else {
            foe.body.applyImpulse(new CANNON.Vec3(dir * v * 0.8, 0, 0), new CANNON.Vec3(foe.body.position.x, foe.body.position.y + 1.1, 0));
          }
        });
      }
      popHead(dir, v) {
        if (!this.headOn) return;
        this.headOn = false;
        world.removeConstraint(this.neckC);
        const h = this.head;
        h.linearFactor.set(1, 1, 1); h.angularFactor.set(1, 1, 1);
        h.collisionFilterMask = G.plat;
        h.velocity.set(dir * (8 + v * 0.5), 9 + v * 0.3, (Math.random() - 0.3) * 4);
        h.angularVelocity.set(Math.random() * 20 - 10, Math.random() * 20 - 10, -dir * 15);
        sndPop();
        this.ko('head');
      }
      ko(why) {
        if (!this.alive) return;
        this.alive = false;
        // 力が抜けて、そのままの勢いで崩れる
        this.body.linearFactor.set(1, 1, 1); this.body.angularFactor.set(1, 1, 1);
        this.bat.gravityOff = false; this.shield.angularFactor.set(1, 1, 1);
        for (const b of [this.bat, this.shield]) b.collisionFilterMask = G.plat | G.body[1 - this.side];
        this.bat.collisionFilterMask |= G.plat; this.shield.collisionFilterMask |= G.plat;
        if (why !== 'head') sndFall();
        onKO(this);
      }
      control() {
        const b = this.body;
        if (!this.alive) return;
        // 立ち直ろうとする力（よろけ中は弱い）
        const a = this.angle(), bal = this.stagger > 0 ? 0.25 : 1;
        b.torque.z += -(380 * bal) * a - 28 * b.angularVelocity.z;
        // 相手との間合いを保とうと、少しずつ歩く
        if (this.stagger <= 0 && this.foe?.alive && b.position.y > -0.05) {
          const dist = Math.abs(this.foe.body.position.x - b.position.x);
          let want = clamp((dist - 1.45) * 2, -0.7, 0.7) * this.s;
          // 台の端へは歩いていかない
          if (want * b.position.x > 0 && Math.abs(b.position.x) > 1.4) want = 0;
          b.velocity.x += (want - b.velocity.x) * 0.04;
        } else if (b.position.y > -0.05) {
          // 足は台の上で滑る（摩擦は物理エンジンに任せず、ここでゆるく止める）
          b.velocity.x *= 1 - 1.6 * SUB;
        }
        this.placeBat(false);
        this.placeShield(false);
      }
      tick(dt) {
        this.stagger = Math.max(0, this.stagger - dt);
        if (!this.alive) return;
        if (this.body.position.y < -0.6) this.ko('fall');
        else if (Math.abs(this.angle()) > 1.15) this.ko('down');
      }
      updateArms() {
        const sp = new THREE.Vector3().copy(this.parts[0].mesh.position);
        const q = this.parts[0].mesh.quaternion;
        const sh = new THREE.Vector3(SHOULDER.x * this.s, SHOULDER.y, 0).applyQuaternion(q).add(sp);
        const grip = new THREE.Vector3(-BAT_LEN / 2 + 0.05, 0, 0).applyQuaternion(this.parts[2].mesh.quaternion).add(this.parts[2].mesh.position);
        const shp = this.parts[3].mesh.position.clone().add(new THREE.Vector3(-this.s * 0.06, -0.1, 0));
        const show = this.alive;
        this.armBat.visible = this.armSh.visible = show;
        if (!show) return;
        aim(this.armBat, sh.clone().setZ(0.24), grip);
        aim(this.armSh, sh.clone().setZ(0.0), shp);
      }
      remove() {
        if (this.headOn) world.removeConstraint(this.neckC);
        for (const o of this.parts) { world.removeBody(o.body); scene.remove(o.mesh); untrack(o.body); }
        scene.remove(this.armBat, this.armSh);
      }
    }
    const UP = new THREE.Vector3(0, 1, 0);
    function aim(mesh, a, b) {
      const d = b.clone().sub(a), len = Math.max(0.01, d.length());
      mesh.position.copy(a); mesh.scale.set(1, len, 1);
      mesh.quaternion.setFromUnitVectors(UP, d.divideScalar(len));
    }
    // バットは重さを打ち消して浮かせて持つ
    world.addEventListener('preStep', () => {
      for (const f of fighters) {
        if (f.bat.gravityOff) { tmpV.set(0, 20 * f.bat.mass, 0); f.bat.force.vadd(tmpV, f.bat.force); }
        f.control();
      }
    });

    // ---------- 相手の動き ----------
    class CPU {
      constructor(f, level) {
        this.f = f; this.lv = level;
        this.mode = 'wait'; this.t = 1.2 + Math.random();
        this.react = Math.max(0.12, 0.45 - level * 0.05);   // 盾を出すまでの遅れ
        this.guardRate = Math.min(0.85, 0.3 + level * 0.08);
        this.windup = Math.max(0.25, 0.7 - level * 0.06);
        f.maxW = Math.min(28, 13 + level * 2.5);
        this.seen = -1;
      }
      tick(dt, me) {
        const f = this.f;
        if (!f.alive) return;
        this.t -= dt;
        if (f.stagger > 0 && this.mode !== 'wait') { this.mode = 'wait'; this.t = 0.5 + Math.random() * 0.5; f.guard = true; f.batAim = -2.3; }
        // 相手が振りかぶったら、少し遅れて盾
        const threat = me.alive && !me.guard && Math.abs(me.bat.angularVelocity.z) > 6;
        if (threat && this.mode === 'wait' && this.seen < 0) this.seen = Math.random() < this.guardRate ? this.react : -2;
        if (!threat && this.seen < -1) this.seen = -1;
        if (this.seen >= 0) { this.seen -= dt; if (this.seen < 0) { this.seen = -3; f.guard = true; this.mode = 'wait'; this.t = Math.max(this.t, 0.4); } }
        if (this.seen === -3 && !threat) this.seen = -1;
        switch (this.mode) {
          case 'wait':
            f.batAim = -2.3;
            if (this.t <= 0) {
              if (Math.random() < 0.65) { this.mode = 'up'; this.t = this.windup; f.guard = false; }
              else { f.guard = Math.random() < this.guardRate; this.t = 0.6 + Math.random() * 1.2; }
            }
            break;
          case 'up':  // 振りかぶる
            f.batAim = 1.9 + Math.random() * 0.02;
            if (this.t <= 0) { this.mode = 'swing'; this.t = 0.35; this.low = Math.random() < 0.35; }
            break;
          case 'swing':  // 振り下ろす
            f.batAim = this.low ? -0.9 : -0.35;
            if (this.t <= 0) { this.mode = 'wait'; this.t = Math.max(0.3, 1.4 - this.lv * 0.12) + Math.random() * 0.8; f.guard = true; }
            break;
        }
      }
    }

    // ---------- 入力 ----------
    let dragging = false;
    const ptr = { x: 0, y: 0 };
    const canvas = renderer.domElement;
    canvas.addEventListener('pointerdown', e => {
      if (state !== 'fight') return;
      dragging = true; canvas.setPointerCapture(e.pointerId);
      ptr.x = e.clientX; ptr.y = e.clientY;
    });
    canvas.addEventListener('pointermove', e => { ptr.x = e.clientX; ptr.y = e.clientY; });
    const up = () => { dragging = false; };
    canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
    addEventListener('blur', up);
    const pv = new THREE.Vector3();
    function playerAim() {
      const p = fighters[0];
      if (!p || !p.alive) return;
      p.guard = !dragging;
      if (!dragging) { p.batAim = -2.3; return; }
      // 肩から指へ向かう方向にバットを向ける
      const sp = p.shoulder();
      pv.set(sp.x, sp.y, sp.z).project(camera);
      const r = canvas.getBoundingClientRect();
      const sx = (pv.x + 1) / 2 * r.width + r.left, sy = (1 - pv.y) / 2 * r.height + r.top;
      const wa = Math.atan2(-(ptr.y - sy), ptr.x - sx) - p.angle();
      p.batAim = Math.atan2(Math.sin(wa), Math.cos(wa));
    }

    // ---------- ゲーム進行 ----------
    let fighters = [], cpu = null, hits = [];
    let state = 'title', wins = 0, level = 0, koTimer = 0, loser = null;
    function spawn() {
      for (const f of fighters) f.remove();
      // 前の試合で飛んでいった頭なども片付ける
      fighters = [new Fighter(0, COLORS[0], -0.75), new Fighter(1, COLORS[1 + (level % (COLORS.length - 1))], 0.75)];
      fighters[0].foe = fighters[1]; fighters[1].foe = fighters[0];
      cpu = new CPU(fighters[1], level);
      hits = []; loser = null; koTimer = 0;
    }
    function onKO(f) { if (!loser) { loser = f; koTimer = f.side === 1 ? 1.6 : 2.2; } }
    function drawWins() {
      const el = $('wins');
      el.innerHTML = '';
      for (let i = 0; i < wins; i++) el.insertAdjacentHTML('beforeend', headIcon(COLORS[1 + (i % (COLORS.length - 1))]));
    }
    const headIcon = c => `<svg width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="9" fill="#f3c9a0" stroke="#${c.toString(16).padStart(6, '0')}" stroke-width="3"/><path d="M7 8l3 3M10 8l-3 3M12 8l3 3M15 8l-3 3" stroke="#222" stroke-width="1.5"/></svg>`;
    function startGame() {
      wins = 0; level = 0; drawWins();
      $('title').hidden = true; $('result').hidden = true;
      spawn(); state = 'fight';
    }
    function showResult() {
      $('rIcons').innerHTML = Array.from({ length: wins }, (_, i) => headIcon(COLORS[1 + (i % (COLORS.length - 1))])).join('');
      $('rN').textContent = t('n')(wins);
      const a = $('share');
      a.href = `https://x.com/intent/post?text=${encodeURIComponent(t('shareText')(wins))}&url=${encodeURIComponent(SHARE_URL)}`;
      if (matchMedia('(pointer: coarse)').matches) { a.removeAttribute('target'); a.removeAttribute('rel'); }
      else { a.target = '_blank'; a.rel = 'noopener'; }
      $('result').hidden = false;
    }
    $('startBtn').onclick = startGame;
    $('retry').onclick = startGame;

    function step(dt) {
      if (state === 'fight' || state === 'ko') {
        playerAim();
        if (cpu) cpu.tick(dt, fighters[0]);
      }
      for (let i = 0; i < SUBS; i++) world.step(SUB);
      const q = hits; hits = []; q.forEach(fn => fn());
      for (const f of fighters) f.tick(dt);
      if (loser) {
        state = 'ko';
        koTimer -= dt;
        if (koTimer <= 0) {
          if (loser.side === 1) { wins++; level++; drawWins(); spawn(); state = 'fight'; }
          else { state = 'result'; loser = null; showResult(); }
        }
      }
    }

    // ---------- 画面 ----------
    let camX = 0;
    function resize() {
      const w = stage.clientWidth, h = stage.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      // 縦長でも台の端まで入るよう、横の見える幅から距離を決める
      const hf = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect);
      camDist = Math.max(2.3 / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)), 2.5 / Math.tan(hf / 2));
      camera.updateProjectionMatrix();
    }
    let camDist = 6;
    addEventListener('resize', resize);
    resize();

    function render(alpha) {
      for (const o of tracked) {
        o.mesh.position.lerpVectors(o.pp, o.cp, alpha);
        o.mesh.quaternion.slerpQuaternions(o.pq, o.cq, alpha);
      }
      for (const f of fighters) f.updateArms();
      const mid = fighters.length ? (fighters[0].body.position.x + fighters[1].body.position.x) / 2 : 0;
      camX += (clamp(mid, -1, 1) * 0.6 - camX) * 0.05;
      const camY = 1.4 + camDist * 0.1;
      // 少し自分の後ろ側から見て、盾の面が見えるようにする
      camera.position.set(camX - camDist * 0.22, camY, camDist * 0.97);
      camera.lookAt(camX - 0.15, 1.0, 0);
      renderer.render(scene, camera);
    }
    function snapshot() {
      for (const o of tracked) { o.pp.copy(o.cp); o.pq.copy(o.cq); o.cp.copy(o.body.position); o.cq.copy(o.body.quaternion); }
    }

    let last = performance.now(), acc = 0;
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      acc += dt;
      while (acc >= H) { step(H); snapshot(); acc -= H; }
      // 遠くへ落ちたものは止める
      for (const o of tracked) if (o.body.position.y < -11 && o.body.type !== CANNON.Body.STATIC) { o.body.velocity.set(0, 0, 0); o.body.type = CANNON.Body.STATIC; o.body.updateMassProperties(); }
      render(acc / H);
      requestAnimationFrame(loop);
    }

    // タイトル画面でも2人を立たせておく（読み込み時に1回空回しも兼ねる）
    spawn(); cpu = null;
    for (let i = 0; i < 30; i++) { step(H); snapshot(); }
    render(1);
    applyLang();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
