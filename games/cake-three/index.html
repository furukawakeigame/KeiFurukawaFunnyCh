<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ケーキ三等分</title>
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <!-- X などにURLを貼ったときのカード表示（ここだけは https:// から書く） -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="KeiFurukawaFunnyCh">
  <meta property="og:title" content="ケーキ三等分">
  <meta property="og:url" content="https://keifurukawafunnych.com/games/cake-three/">
  <meta property="og:image" content="https://keifurukawafunnych.com/games/cake-three/icon.png">
  <meta name="twitter:card" content="summary">
  <style>
    html, body { margin: 0; height: 100%; background: #fdf0f2; color: #5a3a3a; }
    body {
      display: flex; flex-direction: column; height: 100dvh;
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic UI", system-ui, sans-serif;
      overflow: hidden; touch-action: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; width: 100%; max-width: 480px; margin: 0 auto; box-sizing: border-box;
    }
    header a { color: #c0506a; text-decoration: none; font-weight: bold; }
    .hbtns { display: flex; gap: 6px; }
    #lang { font-size: 15px; padding: 0 10px; }
    .pill {
      font-size: 20px; background: #fff; border: 2px solid #f2c4cf; border-radius: 999px;
      min-width: 44px; height: 36px; cursor: pointer; font-weight: bold; color: #a8445c;
    }
    main {
      flex: 1; min-height: 0; width: 100%; max-width: 480px; margin: 0 auto;
      display: flex; flex-direction: column; box-sizing: border-box; gap: 8px;
      padding: 0 12px calc(80px + env(safe-area-inset-bottom));
    }
    #hud { text-align: center; font-weight: bold; min-height: 76px; display: flex; flex-direction: column; justify-content: center; }
    #hud[hidden] { display: none; }
    #count { font-size: min(36px, 6.8vw); line-height: 1.2; }
    #msg { font-size: 22px; color: #c0506a; }
    #stage { position: relative; cursor: crosshair; flex: 1; min-height: 0; display: flex; justify-content: center; align-items: center; touch-action: none; }
    #stage.result { align-items: flex-end; }
    #resultPortrait { position: absolute; left: 50%; transform: translateX(-50%); height: auto; pointer-events: none; }
    #resultPortrait[hidden] { display: none; }
    #ov { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
    canvas { position: relative; display: block; touch-action: none; cursor: crosshair; }
    #ctrl { min-height: 84px; display: flex; gap: 8px; align-items: center; }
    #ctrl > * { flex: 1; }
    .big {
      font: inherit; font-size: 24px; font-weight: bold; padding: 18px 8px; border-radius: 18px;
      border: none; cursor: pointer; color: #fff; background: #e06a86;
      box-shadow: 0 4px 0 #a8445c; touch-action: manipulation;
      display: block; text-align: center; text-decoration: none; line-height: normal;
    }
    .big:active { transform: translateY(3px); box-shadow: 0 1px 0 #a8445c; }
    button.big:disabled { opacity: .35; cursor: default; }
    button.sub { background: #fff; color: #a8445c; box-shadow: 0 4px 0 #f2c4cf; }
    .big.x { background: #222; box-shadow: 0 4px 0 #000; }
  </style>
</head>
<body>
  <header>
    <a href="../../" id="back">← トップへ戻る</a>
    <div class="hbtns"><button id="lang" class="pill">EN</button><button id="sound" class="pill" aria-label="音のオン/オフ">🔊</button></div>
  </header>
  <main>
    <div id="hud"><div id="count"></div><div id="msg"></div></div>
    <div id="stage"><img id="resultPortrait" width="256" height="256" alt="" hidden><canvas id="cv"></canvas></div>
    <div id="ctrl"></div>
  </main>
  <svg id="ov"></svg>
  <script>
    const SHARE_URL = 'https://keifurukawafunnych.com/games/cake-three/';
    const SNAP = 0.12;            // 端点スナップ距離（ケーキ半径=1）
    const COLORS = ['#ffb3c1', '#b8e0ff', '#c8f0b0', '#ffe39a', '#e0c8ff', '#ffd0a8'];

    const store = {
      get(k, d) { try { const v = localStorage.getItem('cake-three:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
      set(k, v) { try { localStorage.setItem('cake-three:' + k, JSON.stringify(v)); } catch {} },
    };
    let soundOn = store.get('sound', true);
    const soundBtn = document.getElementById('sound');
    const updateSoundBtn = () => { soundBtn.textContent = soundOn ? '🔊' : '🔇'; };
    soundBtn.onclick = () => { soundOn = !soundOn; store.set('sound', soundOn); updateSoundBtn(); };
    updateSoundBtn();
    let actx;
    function beep(freq, dur, type = 'sine', vol = 0.15, slide = 0) {
      if (!soundOn) return;
      try {
        actx = actx || new (window.AudioContext || window.webkitAudioContext)();
        const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (slide) o.frequency.linearRampToValueAtTime(freq + slide, t + dur);
        g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
      } catch {}
    }
    const sndCut = () => beep(900, 0.18, 'sawtooth', 0.06, -600);

    const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
    const stage = document.getElementById('stage');
    const resultPortrait = document.getElementById('resultPortrait');
    const PORTRAITS = {
      honor: 'honor-student.png',
      ordinary: 'ordinary-boy.png',
      slight: 'slight-delinquent.png',
      delinquent: 'delinquent.png',
      leader: 'gang-leader.png',
    };

    // 文言（日本語／英語）
    const L = {
      ja: {
        title: 'ケーキ三等分', back: '← トップへ戻る', lang: 'EN', langLabel: 'Switch to English',
        undo: '戻す', ok: '決定', retry: 'もう一度', share: 'Xに投稿',
        ranks: { honor: '優等生', ordinary: 'ふつうの少年', slight: 'ちょっと非行', delinquent: '非行少年', leader: '番長' },
        diff: d => `差 ${d}%`, pieces: n => `${n}個になった…`,
        shareText: (rank, detail) => `ケーキを三等分した結果「${rank}」\n${detail}\n#ケーキ三等分`,
        sharePieces: n => `${n}個になった`,
        saved: '画像を保存しました。投稿に添付してね',
      },
      en: {
        title: 'Cake in Thirds', back: '← Top', lang: '日本語', langLabel: '日本語に切り替え',
        undo: 'Undo', ok: 'Done', retry: 'Retry', share: 'Post on X',
        ranks: { honor: 'Honor Student', ordinary: 'Ordinary Boy', slight: 'A Bit Rebellious', delinquent: 'Delinquent', leader: 'Gang Leader' },
        diff: d => `Gap ${d}%`, pieces: n => `${n} pieces…`,
        shareText: (rank, detail) => `I cut a cake into thirds: "${rank}"\n${detail}\n#CakeInThirds`,
        sharePieces: n => `Ended up with ${n} pieces`,
        saved: 'Image saved. Attach it to your post',
      },
    };
    let lang = store.get('lang', navigator.language.startsWith('ja') ? 'ja' : 'en');
    if (!L[lang]) lang = 'ja';
    const t = k => L[lang][k];
    const langBtn = document.getElementById('lang');
    function applyLang() {
      document.documentElement.lang = lang;
      document.title = t('title');
      document.getElementById('back').textContent = t('back');
      langBtn.textContent = t('lang'); langBtn.setAttribute('aria-label', t('langLabel'));
      if (result) showResult();
      renderCtrl();
    }
    langBtn.onclick = () => { lang = lang === 'ja' ? 'en' : 'ja'; store.set('lang', lang); applyLang(); };
    const countEl = document.getElementById('count'), msgEl = document.getElementById('msg');
    const ctrl = document.getElementById('ctrl');
    const ov = document.getElementById('ov');
    let S = 300, dpr = 1;

    let lines = [], preview = null, drag = null, result = null, pieceImg = null;

    function resize() {
      const r = stage.getBoundingClientRect();
      const showP = !resultPortrait.hidden;
      stage.classList.toggle('result', showP);
      S = Math.max(1, Math.floor(Math.min(r.width, showP ? r.height * 0.62 : r.height)));
      if (showP) {
        // イラストは円の後ろ。肩から下を円で隠し、顔が円の上に出るように置く
        const w = Math.min(r.width, S * 0.85);
        resultPortrait.style.width = w + 'px';
        resultPortrait.style.top = Math.max(0, r.height - S * 0.9 - w * 0.8) + 'px';
      }
      dpr = window.devicePixelRatio || 1;
      cv.style.width = cv.style.height = S + 'px';
      cv.width = cv.height = Math.round(S * dpr);
      draw();
    }
    // ケーキ座標（中心0、半径1）⇔ 画面座標
    const R = () => S * 0.4;
    const toCake = (x, y) => ({ x: (x - S / 2) / R(), y: (y - S / 2) / R() });
    const toPx = p => [S / 2 + p.x * R(), S / 2 + p.y * R()];

    function snap(p) {
      let best = null, bd = SNAP;
      for (const l of lines) for (const q of [l.a, l.b]) {
        const d = Math.hypot(p.x - q.x, p.y - q.y);
        if (d < bd) { bd = d; best = q; }
      }
      return best ? { x: best.x, y: best.y, snapped: true } : p;
    }

    function draw() {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, S, S);
      const c = S / 2, r = R();
      // ケーキ（ただの円）
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(c, c, r, 0, 7); ctx.fill();
      if (pieceImg) {
        ctx.save(); ctx.beginPath(); ctx.arc(c, c, r, 0, 7); ctx.clip();
        ctx.imageSmoothingEnabled = true;
        ctx.drawImage(pieceImg, c - r, c - r, r * 2, r * 2); ctx.restore();
      }
      ctx.strokeStyle = '#e8b4c0'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(c, c, r, 0, 7); ctx.stroke();
      // 結果のときは、線をケーキの上だけに描く
      if (result) {
        ctx.save(); ctx.beginPath(); ctx.arc(c, c, r, 0, 7); ctx.clip();
        ctx.strokeStyle = '#8a4a3a'; ctx.lineWidth = 3; ctx.lineCap = 'round';
        for (const l of lines) {
          const [x1, y1] = toPx(l.a), [x2, y2] = toPx(l.b);
          ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        }
        ctx.restore();
      }
      // 線と端点（スナップ先）は画面全体に重ねたSVGに描く
      const b = cv.getBoundingClientRect();
      const sx = q => b.left + toPx(q)[0], sy = q => b.top + toPx(q)[1];
      let svg = '';
      if (!result) for (const l of lines) svg += `<line x1="${sx(l.a)}" y1="${sy(l.a)}" x2="${sx(l.b)}" y2="${sy(l.b)}" stroke="#8a4a3a" stroke-width="3" stroke-linecap="round"/>`;
      if (preview) svg += `<line x1="${sx(preview.a)}" y1="${sy(preview.a)}" x2="${sx(preview.b)}" y2="${sy(preview.b)}" stroke="#e06a86" stroke-width="3" stroke-dasharray="8 6" stroke-linecap="round"/>`;
      if (!result) for (const l of lines) for (const q of [l.a, l.b]) svg += `<circle cx="${sx(q)}" cy="${sy(q)}" r="5" fill="#8a4a3a"/>`;
      if (preview) for (const q of [preview.a, preview.b]) if (q.snapped) svg += `<circle cx="${sx(q)}" cy="${sy(q)}" r="11" fill="none" stroke="#e06a86" stroke-width="3"/>`;
      ov.innerHTML = svg;
      // 割合ラベル
      if (result) for (const p of result.pieces) {
        const [x, y] = toPx(p.center);
        ctx.font = `bold ${Math.round(S * 0.075)}px system-ui, sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineWidth = 5; ctx.strokeStyle = '#fff'; ctx.strokeText(p.pct.toFixed(1) + '%', x, y);
        ctx.fillStyle = '#5a3a3a'; ctx.fillText(p.pct.toFixed(1) + '%', x, y);
      }
    }

    // 入力
    function pos(e) { const b = cv.getBoundingClientRect(); return toCake(e.clientX - b.left, e.clientY - b.top); }
    window.addEventListener('pointerdown', e => {
      if (result || e.target.closest('button, a')) return;
      e.preventDefault();
      drag = snap(pos(e)); preview = null; draw(); renderCtrl();
    });
    window.addEventListener('pointermove', e => {
      if (!drag) return;
      preview = { a: drag, b: snap(pos(e)) }; draw();
    });
    const end = e => {
      if (!drag) return;
      preview = { a: drag, b: snap(pos(e)) }; drag = null;
      if (Math.hypot(preview.a.x - preview.b.x, preview.a.y - preview.b.y) < 0.05) { preview = null; draw(); return; }
      commit();
    };
    window.addEventListener('pointerup', end);
    window.addEventListener('pointercancel', () => { drag = null; preview = null; draw(); renderCtrl(); });

    function btn(label, cls, fn, disabled) {
      const b = document.createElement('button');
      b.className = 'big ' + cls; b.textContent = label; b.onclick = fn; b.disabled = !!disabled;
      ctrl.appendChild(b);
    }
    function renderCtrl() {
      ctrl.innerHTML = '';
      if (result) {
        btn(t('retry'), '', start);
        shareLink();
        return;
      }
      btn(t('undo'), 'sub', () => { lines.pop(); hud(); draw(); renderCtrl(); }, !lines.length);
      btn(t('ok'), '', finish, !lines.length);
    }
    function hud() {
      if (result) return;
      countEl.textContent = '';
      msgEl.textContent = '';
      document.getElementById('hud').hidden = true;
    }

    function commit() {
      if (!preview) return;
      lines.push({ a: { x: preview.a.x, y: preview.a.y }, b: { x: preview.b.x, y: preview.b.y } });
      preview = null; sndCut();
      hud(); draw(); renderCtrl();
    }

    // ピースの面積：格子に塗り分けて数える
    function measure() {
      const N = 360, wall = 1.2 / N * 2; // 線の太さ（ケーキ座標）
      const lab = new Int32Array(N * N).fill(-1); // -1未処理, -2外/壁
      const cell = i => -1 + (i + 0.5) * 2 / N;
      const distSeg = (px, py, l) => {
        const dx = l.b.x - l.a.x, dy = l.b.y - l.a.y;
        const t = Math.max(0, Math.min(1, ((px - l.a.x) * dx + (py - l.a.y) * dy) / (dx * dx + dy * dy)));
        return Math.hypot(px - l.a.x - t * dx, py - l.a.y - t * dy);
      };
      for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
        const x = cell(i), y = cell(j);
        if (x * x + y * y > 1 || lines.some(l => distSeg(x, y, l) < wall)) lab[j * N + i] = -2;
      }
      const comps = [];
      const stack = [];
      for (let s = 0; s < N * N; s++) {
        if (lab[s] !== -1) continue;
        const id = comps.length; let n = 0, sx = 0, sy = 0;
        lab[s] = id; stack.push(s);
        while (stack.length) {
          const k = stack.pop(), i = k % N, j = (k / N) | 0;
          n++; sx += i; sy += j;
          if (i > 0 && lab[k - 1] === -1) { lab[k - 1] = id; stack.push(k - 1); }
          if (i < N - 1 && lab[k + 1] === -1) { lab[k + 1] = id; stack.push(k + 1); }
          if (j > 0 && lab[k - N] === -1) { lab[k - N] = id; stack.push(k - N); }
          if (j < N - 1 && lab[k + N] === -1) { lab[k + N] = id; stack.push(k + N); }
        }
        comps.push({ id, n, center: { x: cell(sx / n), y: cell(sy / n) } });
      }
      const total = comps.reduce((a, c) => a + c.n, 0);
      // 線の際にできる極小のかけらは無視
      const pieces = comps.filter(c => c.n / total > 0.003);
      const sum = pieces.reduce((a, c) => a + c.n, 0);
      pieces.forEach(p => p.pct = p.n / sum * 100);
      // 色分け画像
      const oc = document.createElement('canvas'); oc.width = oc.height = N;
      const im = oc.getContext('2d').createImageData(N, N);
      const rgb = pieces.map((p, k) => { const h = COLORS[k % COLORS.length]; return [1, 3, 5].map(o => parseInt(h.substr(o, 2), 16)); });
      const idx = new Map(pieces.map((p, k) => [p.id, k]));
      for (let s = 0; s < N * N; s++) {
        const k = idx.get(lab[s]);
        if (k === undefined) continue;
        im.data.set([...rgb[k], 255], s * 4);
      }
      oc.getContext('2d').putImageData(im, 0, 0);
      return { pieces, img: oc };
    }

    function finish() {
      const m = measure();
      pieceImg = m.img;
      const pcts = m.pieces.map(p => p.pct).sort((a, b) => b - a);
      const diff = pcts.length === 3 ? pcts[0] - pcts[2] : null;
      let rank;
      const good = fs => fs.forEach((f, i) => setTimeout(() => beep(f, 0.2), i * 120));
      const bad = () => beep(150, 0.7, 'square', 0.08, -60);
      if (diff === null) { rank = 'leader'; bad(); }
      else if (diff < 3) { rank = 'honor'; good([660, 880, 1320]); }
      else if (diff < 7) { rank = 'ordinary'; good([660, 880]); }
      else if (diff < 15) { rank = 'slight'; beep(440, 0.3, 'triangle'); }
      else if (diff < 25) { rank = 'delinquent'; beep(220, 0.5, 'square', 0.08, -60); }
      else { rank = 'leader'; bad(); }
      result = { pieces: m.pieces, diff, rank, count: pcts.length };
      document.getElementById('hud').hidden = false;
      resultPortrait.src = PORTRAITS[rank];
      resultPortrait.hidden = false;
      showResult();
      resize(); renderCtrl();
    }
    function showResult() {
      const r = result, name = t('ranks')[r.rank];
      countEl.textContent = name;
      msgEl.textContent = r.diff === null ? t('pieces')(r.count) : t('diff')(r.diff.toFixed(1));
      resultPortrait.alt = name;
      prepareShare();
    }

    function shareBody() {
      const r = result;
      const detail = r.diff === null
        ? t('sharePieces')(r.count)
        : `${r.pieces.map(p => p.pct.toFixed(1) + '%').join(' / ')} (${t('diff')(r.diff.toFixed(1))})`;
      return t('shareText')(t('ranks')[r.rank], detail);
    }
    const shareUrl = () => `https://x.com/intent/post?text=${encodeURIComponent(shareBody())}&url=${encodeURIComponent(SHARE_URL)}`;

    // 結果画像（1080×1350）。見出し・少年・切ったケーキを描く
    function resultImage() {
      const W = 1080, H = 1350, c = document.createElement('canvas');
      c.width = W; c.height = H;
      const g = c.getContext('2d'), r = result, font = 'system-ui, sans-serif';
      g.fillStyle = '#fdf0f2'; g.fillRect(0, 0, W, H);
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillStyle = '#c0506a'; g.font = `bold 40px ${font}`; g.fillText(t('title'), W / 2, 70);
      g.fillStyle = '#5a3a3a'; g.font = `bold 96px ${font}`; g.fillText(t('ranks')[r.rank], W / 2, 170);
      g.fillStyle = '#c0506a'; g.font = `bold 52px ${font}`;
      g.fillText(r.diff === null ? t('pieces')(r.count) : t('diff')(r.diff.toFixed(1)), W / 2, 255);
      // ゲーム画面と同じ並び：少年の顔を円の上に出し、肩から下を円で隠す
      const C = 640, cy = H - 30 - C, w = C * 0.85;
      g.drawImage(resultPortrait, (W - w) / 2, cy + C * 0.1 - w * 0.8, w, w);
      g.drawImage(cv, (W - C) / 2, cy, C, C);
      return c;
    }
    let shareFile = null, shareKey = '';
    function prepareShare() {
      if (!result) return;
      const key = lang + JSON.stringify(result.pieces.map(p => p.pct)) + resultPortrait.src;
      if (key === shareKey) return;
      shareKey = key; shareFile = null;
      const make = () => resultImage().toBlob(b => {
        if (b && shareKey === key) shareFile = new File([b], 'cake-three.png', { type: 'image/png' });
      }, 'image/png');
      // ケーキの描き直し（resize）が終わってから描く
      setTimeout(() => resultPortrait.complete ? make() : resultPortrait.addEventListener('load', make, { once: true }));
    }

    // X投稿は本物のリンクにする。Xの投稿URLには画像を付けられないので：
    // スマホは共有シートに画像と文を渡す（使えなければ同じタブで x.com へ飛び、X アプリを開く）。
    // PCは画像を保存してから、新しいタブで投稿画面を開く。
    function shareLink() {
      const a = document.createElement('a');
      a.className = 'big x'; a.textContent = t('share'); a.href = shareUrl();
      const mobile = matchMedia('(pointer: coarse)').matches;
      if (!mobile) { a.target = '_blank'; a.rel = 'noopener'; }
      a.onclick = e => {
        if (mobile) {
          if (shareFile && navigator.canShare?.({ files: [shareFile] })) {
            e.preventDefault();
            navigator.share({ files: [shareFile], text: `${shareBody()}\n${SHARE_URL}` })
              .catch(err => { if (err.name !== 'AbortError') location.href = a.href; });
          }
          return;
        }
        const d = document.createElement('a');
        d.href = resultImage().toDataURL('image/png'); d.download = 'cake-three.png'; d.click();
        msgEl.textContent = t('saved');
      };
      ctrl.appendChild(a);
    }

    function start() {
      lines = []; preview = null; drag = null; result = null; pieceImg = null;
      resultPortrait.src = PORTRAITS.ordinary;
      resultPortrait.alt = '';
      resultPortrait.hidden = false;
      hud(); resize(); renderCtrl();
    }
    window.addEventListener('resize', resize);
    start(); applyLang(); resize();
  </script>
</body>
</html>
