<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ケーキ三等分</title>
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <!-- X などにURLを貼ったときのカード表示（ここだけは https:// から書く） -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="KeiFurukawaFunnyCh">
  <meta property="og:title" content="ケーキ三等分">
  <meta property="og:url" content="https://keifurukawafunnych.com/games/cake-three/">
  <meta property="og:image" content="https://keifurukawafunnych.com/games/cake-three/icon.png">
  <meta name="twitter:card" content="summary">
  <style>
    html, body { margin: 0; height: 100%; background: #fdf0f2; color: #5a3a3a; }
    body {
      display: flex; flex-direction: column; height: 100dvh;
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic UI", system-ui, sans-serif;
      overflow: hidden;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; width: 100%; max-width: 480px; margin: 0 auto; box-sizing: border-box;
    }
    header a { color: #c0506a; text-decoration: none; font-weight: bold; }
    #sound {
      font-size: 20px; background: #fff; border: 2px solid #f2c4cf; border-radius: 999px;
      width: 44px; height: 36px; cursor: pointer;
    }
    main {
      flex: 1; min-height: 0; width: 100%; max-width: 480px; margin: 0 auto;
      display: flex; flex-direction: column; box-sizing: border-box; gap: 8px;
      padding: 0 12px calc(80px + env(safe-area-inset-bottom));
    }
    #hud { text-align: center; font-weight: bold; min-height: 76px; display: flex; flex-direction: column; justify-content: center; }
    #count { font-size: min(36px, 6.8vw); line-height: 1.2; }
    #msg { font-size: 22px; color: #c0506a; }
    #stage { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: center; touch-action: none; }
    canvas { display: block; touch-action: none; cursor: crosshair; }
    #ctrl { min-height: 84px; display: flex; gap: 8px; align-items: center; }
    #ctrl > * { flex: 1; }
    button.big {
      font: inherit; font-size: 24px; font-weight: bold; padding: 18px 8px; border-radius: 18px;
      border: none; cursor: pointer; color: #fff; background: #e06a86;
      box-shadow: 0 4px 0 #a8445c; touch-action: manipulation;
    }
    button.big:active { transform: translateY(3px); box-shadow: 0 1px 0 #a8445c; }
    button.big:disabled { opacity: .35; cursor: default; }
    button.sub { background: #fff; color: #a8445c; box-shadow: 0 4px 0 #f2c4cf; }
    button.x { background: #222; box-shadow: 0 4px 0 #000; }
  </style>
</head>
<body>
  <header>
    <a href="../../">← トップへ戻る</a>
    <button id="sound" aria-label="音のオン/オフ">🔊</button>
  </header>
  <main>
    <div id="hud"><div id="count"></div><div id="msg"></div></div>
    <div id="stage"><canvas id="cv"></canvas></div>
    <div id="ctrl"></div>
  </main>
  <script>
    const SHARE_URL = 'https://keifurukawafunnych.com/games/cake-three/';
    const CUTS = 3;
    const SNAP = 0.12;            // 端点スナップ距離（ケーキ半径=1）
    const COLORS = ['#ffb3c1', '#b8e0ff', '#c8f0b0', '#ffe39a', '#e0c8ff', '#ffd0a8'];

    const store = {
      get(k, d) { try { const v = localStorage.getItem('cake-three:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
      set(k, v) { try { localStorage.setItem('cake-three:' + k, JSON.stringify(v)); } catch {} },
    };
    let soundOn = store.get('sound', true);
    const soundBtn = document.getElementById('sound');
    const updateSoundBtn = () => { soundBtn.textContent = soundOn ? '🔊' : '🔇'; };
    soundBtn.onclick = () => { soundOn = !soundOn; store.set('sound', soundOn); updateSoundBtn(); };
    updateSoundBtn();
    let actx;
    function beep(freq, dur, type = 'sine', vol = 0.15, slide = 0) {
      if (!soundOn) return;
      try {
        actx = actx || new (window.AudioContext || window.webkitAudioContext)();
        const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (slide) o.frequency.linearRampToValueAtTime(freq + slide, t + dur);
        g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
      } catch {}
    }
    const sndCut = () => beep(900, 0.18, 'sawtooth', 0.06, -600);

    const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
    const stage = document.getElementById('stage');
    const countEl = document.getElementById('count'), msgEl = document.getElementById('msg');
    const ctrl = document.getElementById('ctrl');
    let S = 300, dpr = 1;

    let lines = [], preview = null, drag = null, result = null, pieceImg = null;

    function resize() {
      const r = stage.getBoundingClientRect();
      S = Math.max(160, Math.floor(Math.min(r.width, r.height)));
      dpr = window.devicePixelRatio || 1;
      cv.style.width = cv.style.height = S + 'px';
      cv.width = cv.height = Math.round(S * dpr);
      draw();
    }
    // ケーキ座標（中心0、半径1）⇔ 画面座標
    const R = () => S * 0.4;
    const toCake = (x, y) => ({ x: (x - S / 2) / R(), y: (y - S / 2) / R() });
    const toPx = p => [S / 2 + p.x * R(), S / 2 + p.y * R()];

    function snap(p) {
      let best = null, bd = SNAP;
      for (const l of lines) for (const q of [l.a, l.b]) {
        const d = Math.hypot(p.x - q.x, p.y - q.y);
        if (d < bd) { bd = d; best = q; }
      }
      return best ? { x: best.x, y: best.y, snapped: true } : p;
    }

    function draw() {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, S, S);
      const c = S / 2, r = R();
      // ケーキ（ただの円）
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(c, c, r, 0, 7); ctx.fill();
      if (pieceImg) {
        ctx.save(); ctx.beginPath(); ctx.arc(c, c, r, 0, 7); ctx.clip();
        ctx.imageSmoothingEnabled = true;
        ctx.drawImage(pieceImg, c - r, c - r, r * 2, r * 2); ctx.restore();
      }
      ctx.strokeStyle = '#e8b4c0'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(c, c, r, 0, 7); ctx.stroke();
      // 切り線
      const drawLine = (l, color, w, dash) => {
        const [x1, y1] = toPx(l.a), [x2, y2] = toPx(l.b);
        ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
        if (dash) ctx.setLineDash([8, 6]);
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore();
      };
      for (const l of lines) drawLine(l, '#8a4a3a', 3);
      if (preview) drawLine(preview, '#e06a86', 3, true);
      // 端点（スナップ先）
      if (!result) for (const l of lines) for (const q of [l.a, l.b]) {
        const [x, y] = toPx(q);
        ctx.fillStyle = '#8a4a3a'; ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.fill();
      }
      if (preview) for (const q of [preview.a, preview.b]) if (q.snapped) {
        const [x, y] = toPx(q);
        ctx.strokeStyle = '#e06a86'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, 11, 0, 7); ctx.stroke();
      }
      // 割合ラベル
      if (result) for (const p of result.pieces) {
        const [x, y] = toPx(p.center);
        ctx.font = `bold ${Math.round(S * 0.075)}px system-ui, sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineWidth = 5; ctx.strokeStyle = '#fff'; ctx.strokeText(p.pct.toFixed(1) + '%', x, y);
        ctx.fillStyle = '#5a3a3a'; ctx.fillText(p.pct.toFixed(1) + '%', x, y);
      }
    }

    // 入力
    function pos(e) { const b = cv.getBoundingClientRect(); return toCake(e.clientX - b.left, e.clientY - b.top); }
    cv.addEventListener('pointerdown', e => {
      if (result || lines.length >= CUTS) return;
      e.preventDefault(); cv.setPointerCapture(e.pointerId);
      drag = snap(pos(e)); preview = null; draw(); renderCtrl();
    });
    cv.addEventListener('pointermove', e => {
      if (!drag) return;
      preview = { a: drag, b: snap(pos(e)) }; draw();
    });
    const end = e => {
      if (!drag) return;
      preview = { a: drag, b: snap(pos(e)) }; drag = null;
      if (Math.hypot(preview.a.x - preview.b.x, preview.a.y - preview.b.y) < 0.05) { preview = null; draw(); return; }
      commit();
    };
    cv.addEventListener('pointerup', end);
    cv.addEventListener('pointercancel', () => { drag = null; preview = null; draw(); renderCtrl(); });

    function btn(label, cls, fn, disabled) {
      const b = document.createElement('button');
      b.className = 'big ' + cls; b.textContent = label; b.onclick = fn; b.disabled = !!disabled;
      ctrl.appendChild(b);
    }
    function renderCtrl() {
      ctrl.innerHTML = '';
      if (result) {
        btn('もう一度', '', start);
        btn('Xに投稿', 'x', share);
        return;
      }
      btn('戻す', 'sub', () => { lines.pop(); hud(); draw(); renderCtrl(); }, !lines.length);
    }
    function hud() {
      if (result) return;
      countEl.textContent = `${lines.length + 1} / ${CUTS} 本目`;
      msgEl.textContent = '';
    }

    function commit() {
      if (!preview) return;
      lines.push({ a: { x: preview.a.x, y: preview.a.y }, b: { x: preview.b.x, y: preview.b.y } });
      preview = null; sndCut();
      if (lines.length >= CUTS) finish(); else { hud(); draw(); renderCtrl(); }
    }

    // ピースの面積：格子に塗り分けて数える
    function measure() {
      const N = 360, wall = 1.2 / N * 2; // 線の太さ（ケーキ座標）
      const lab = new Int32Array(N * N).fill(-1); // -1未処理, -2外/壁
      const cell = i => -1 + (i + 0.5) * 2 / N;
      const distSeg = (px, py, l) => {
        const dx = l.b.x - l.a.x, dy = l.b.y - l.a.y;
        const t = Math.max(0, Math.min(1, ((px - l.a.x) * dx + (py - l.a.y) * dy) / (dx * dx + dy * dy)));
        return Math.hypot(px - l.a.x - t * dx, py - l.a.y - t * dy);
      };
      for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
        const x = cell(i), y = cell(j);
        if (x * x + y * y > 1 || lines.some(l => distSeg(x, y, l) < wall)) lab[j * N + i] = -2;
      }
      const comps = [];
      const stack = [];
      for (let s = 0; s < N * N; s++) {
        if (lab[s] !== -1) continue;
        const id = comps.length; let n = 0, sx = 0, sy = 0;
        lab[s] = id; stack.push(s);
        while (stack.length) {
          const k = stack.pop(), i = k % N, j = (k / N) | 0;
          n++; sx += i; sy += j;
          if (i > 0 && lab[k - 1] === -1) { lab[k - 1] = id; stack.push(k - 1); }
          if (i < N - 1 && lab[k + 1] === -1) { lab[k + 1] = id; stack.push(k + 1); }
          if (j > 0 && lab[k - N] === -1) { lab[k - N] = id; stack.push(k - N); }
          if (j < N - 1 && lab[k + N] === -1) { lab[k + N] = id; stack.push(k + N); }
        }
        comps.push({ id, n, center: { x: cell(sx / n), y: cell(sy / n) } });
      }
      const total = comps.reduce((a, c) => a + c.n, 0);
      // 線の際にできる極小のかけらは無視
      const pieces = comps.filter(c => c.n / total > 0.003);
      const sum = pieces.reduce((a, c) => a + c.n, 0);
      pieces.forEach(p => p.pct = p.n / sum * 100);
      // 色分け画像
      const oc = document.createElement('canvas'); oc.width = oc.height = N;
      const im = oc.getContext('2d').createImageData(N, N);
      const rgb = pieces.map((p, k) => { const h = COLORS[k % COLORS.length]; return [1, 3, 5].map(o => parseInt(h.substr(o, 2), 16)); });
      const idx = new Map(pieces.map((p, k) => [p.id, k]));
      for (let s = 0; s < N * N; s++) {
        const k = idx.get(lab[s]);
        if (k === undefined) continue;
        im.data.set([...rgb[k], 255], s * 4);
      }
      oc.getContext('2d').putImageData(im, 0, 0);
      return { pieces, img: oc };
    }

    function finish() {
      const m = measure();
      pieceImg = m.img;
      const pcts = m.pieces.map(p => p.pct).sort((a, b) => b - a);
      const diff = pcts.length === 3 ? pcts[0] - pcts[2] : null;
      let text, sub;
      const good = fs => fs.forEach((f, i) => setTimeout(() => beep(f, 0.2), i * 120));
      const bad = () => beep(150, 0.7, 'square', 0.08, -60);
      sub = diff === null ? `${pcts.length}個になった…` : `差 ${diff.toFixed(1)}%`;
      if (diff === null) { text = '番長'; bad(); }
      else if (diff < 3) { text = '優等生'; good([660, 880, 1320]); }
      else if (diff < 7) { text = 'ふつうの少年'; good([660, 880]); }
      else if (diff < 15) { text = 'ちょっと不良'; beep(440, 0.3, 'triangle'); }
      else if (diff < 25) { text = '不良少年'; beep(220, 0.5, 'square', 0.08, -60); }
      else { text = '番長'; bad(); }
      result = { pieces: m.pieces, diff, text, count: pcts.length };
      countEl.textContent = text; msgEl.textContent = sub;
      draw(); renderCtrl();
    }

    function share() {
      const r = result;
      const body = `ケーキを三等分した結果「${r.text}」\n` + (r.diff === null
        ? `${r.count}個になった`
        : `${r.pieces.map(p => p.pct.toFixed(1) + '%').join(' / ')}（差 ${r.diff.toFixed(1)}%）`);
      const intent = `https://x.com/intent/post?text=${encodeURIComponent(body + '\n#ケーキ三等分')}&url=${encodeURIComponent(SHARE_URL)}`;
      const w = window.open(intent, '_blank');
      if (w) w.opener = null; else location.href = intent;
    }

    function start() {
      lines = []; preview = null; drag = null; result = null; pieceImg = null;
      hud(); draw(); renderCtrl();
    }
    window.addEventListener('resize', resize);
    start(); resize();
  </script>
</body>
</html>
