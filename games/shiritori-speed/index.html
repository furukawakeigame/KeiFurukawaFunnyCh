<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <!-- X などにURLを貼ったときのカード表示（ここだけは https:// から書く） -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ふるかわけい面白チャンネル">

  <style>
    html, body { margin: 0; height: 100%; background: #2b2230; color: #fff; }
    body {
      display: flex; flex-direction: column; height: 100dvh;
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic UI", system-ui, sans-serif;
      overflow: hidden; touch-action: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      padding-bottom: calc(80px + env(safe-area-inset-bottom)); box-sizing: border-box;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; width: 100%; box-sizing: border-box; position: relative; z-index: 30;
    }
    header a { color: #ffe9a8; text-decoration: none; font-weight: bold; }
    .hbtns { display: flex; gap: 6px; }
    .pill {
      height: 34px; min-width: 34px; border-radius: 17px; border: 2px solid #ffe9a8;
      background: transparent; color: #ffe9a8; font-weight: bold; font-size: 15px; padding: 0 10px;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .pill svg { width: 20px; height: 20px; }
    main { flex: 1; min-height: 0; position: relative; }
    #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .info {
      position: absolute; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center;
      padding: 0 14px; font-weight: bold; font-size: 15px; pointer-events: none; text-shadow: 0 1px 2px rgba(0,0,0,.6);
      max-width: 560px; margin: 0 auto; box-sizing: border-box;
    }
    .info b { font-size: 22px; }
    #topInfo { top: 4px; }
    #botInfo { bottom: 4px; }
    .overlay {
      position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; background: rgba(30,22,36,.82); z-index: 20; text-align: center; padding: 0 16px;
    }
    .overlay h1 { margin: 0; font-size: clamp(30px, 9vw, 44px); color: #ffe9a8; }
    .overlay .big { font-size: clamp(28px, 9vw, 42px); font-weight: bold; color: #ffe9a8; }
    .overlay p { margin: 0; font-size: 17px; }

      min-width: 200px; padding: 13px 20px; border-radius: 28px; border: none; font-weight: bold; font-size: 18px;
      background: #ffe9a8; color: #2b2230; cursor: pointer; text-decoration: none; box-shadow: 0 3px 0 rgba(0,0,0,.3);
    }
    .btn.sub { background: transparent; color: #ffe9a8; border: 2px solid #ffe9a8; box-shadow: none; }
    .lv { display: flex; gap: 6px; }
    .lv button { padding: 8px 12px; border-radius: 18px; border: 2px solid #ffe9a8; background: transparent; color: #ffe9a8; font-weight: bold; font-size: 15px; cursor: pointer; }
    .lv button.on { background: #ffe9a8; color: #2b2230; }
    .hidden { display: none !important; }
    .msg { position: absolute; left: 0; right: 0; top: 40%; text-align: center; font-size: 34px; font-weight: bold; color: #ffe9a8; text-shadow: 0 2px 4px rgba(0,0,0,.6); pointer-events: none; opacity: 0; transition: opacity .2s; z-index: 5; }
    .msg.show { opacity: 1; }
    #loadErr { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; }
  </style>
  <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
</head>
<body>
  <header>
    <a id="back" href="../../">← トップへ戻る</a>
    <div class="hbtns"><button id="lang" class="pill">EN</button><button id="sound" class="pill"></button></div>
  </header>
  <main>
    <canvas id="cv"></canvas>
    <div class="info" id="topInfo"><span id="leftInfo"></span><span id="rightInfo"></span></div>
    <div class="info" id="botInfo"><span id="myDeck"></span><span></span></div>
    <div class="msg" id="msg"></div>

    <div class="overlay" id="title">
      <h1 id="tTitle"></h1>
      <button class="btn" id="bCpu"></button>
      <div class="lv" id="lv"><button data-l="0"></button><button data-l="1"></button><button data-l="2"></button></div>
      <button class="btn" id="bTa"></button>
    </div>
    <div class="overlay hidden" id="result">
      <div class="big" id="rBig"></div>
      <p id="rSub"></p>
      <a class="btn" id="share"></a>
      <button class="btn" id="again"></button>
      <button class="btn sub" id="toTitle"></button>
    </div>
  </main>

  <script type="module">
    import * as THREE from 'three';

    const store = {
      get(k, d) { try { const v = localStorage.getItem('shiritori-speed:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
      set(k, v) { try { localStorage.setItem('shiritori-speed:' + k, JSON.stringify(v)); } catch {} },
    };
    const $ = id => document.getElementById(id);

    // 音
    let soundOn = store.get('sound', true);
    const soundBtn = $('sound');
    const SPK = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9h4l5-4v14l-5-4H3z"/>';
    const updateSoundBtn = () => {
      soundBtn.innerHTML = SPK + (soundOn
        ? '<path d="M15 8.5a5 5 0 0 1 0 7M17.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>'
        : '<path d="M15 9l6 6M21 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>');
    };
    soundBtn.onclick = () => { soundOn = !soundOn; store.set('sound', soundOn); updateSoundBtn(); };
    updateSoundBtn();
    let actx;
    function beep(freq, dur, type = 'sine', vol = 0.15, slide = 0, delay = 0) {
      if (!soundOn) return;
      try {
        actx = actx || new (window.AudioContext || window.webkitAudioContext)();
        const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + delay;
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (slide) o.frequency.linearRampToValueAtTime(freq + slide, t + dur);
        g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
      } catch {}
    }
    const sndPlay = () => beep(660, 0.1, 'triangle', 0.2, 300);
    const sndCpu = () => beep(330, 0.1, 'triangle', 0.12, 100);
    const sndMiss = () => beep(160, 0.25, 'square', 0.08, -60);
    const sndFlip = () => { beep(520, 0.08, 'sine', 0.15); beep(780, 0.1, 'sine', 0.15, 0, 0.09); };
    const sndWin = () => [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.18, 'triangle', 0.18, 0, i * 0.12));
    const sndLose = () => [392, 330, 262].forEach((f, i) => beep(f, 0.25, 'sawtooth', 0.07, 0, i * 0.18));

    // 文言（日本語／英語）
    const LV = ['よわい', 'ふつう', 'つよい'], LVE = ['Easy', 'Normal', 'Hard'];
    const L = {
      ja: {
        title: 'しりとりスピード', back: '← トップへ戻る', lang: 'EN', langLabel: 'Switch to English', sound: '音のオン/オフ',
        cpu: 'CPUと対戦', ta: 'タイムアタック', lv: i => LV[i],
        time: s => `${s}秒`, best: s => `ベスト${s}秒`,
        flip: 'せーの！', win: '勝ち！', lose: '負け…',
        winSub: (n, l) => n >= 15 ? `${l}のCPUに${n}枚差で圧勝` : n >= 6 ? `${l}のCPUに${n}枚差で勝利` : `${l}のCPUに${n}枚差で辛勝`,
        loseSub: (n, l) => n <= 3 ? `あと${n}枚だった…（${l}）` : n <= 10 ? `残り${n}枚。${l}のCPUに負けた` : `残り${n}枚。${l}のCPUに完敗`,
        taBig: s => `${s}秒`,
        taSub: (s, nb) => (nb ? 'ベスト更新！ ' : '') + (s < 30 ? 'しりとりの鬼' : s < 45 ? 'かなり速い' : s < 70 ? 'いい調子' : 'まだまだ'),
        shareWin: (n, l) => `しりとりスピードで${l}のCPUに勝った！（${n}枚差）`,
        shareLose: (n, l) => `しりとりスピードで${l}のCPUに負けた…（残り${n}枚）`,
        shareTa: s => `しりとりスピードのタイムアタックで、山札を${s}秒で出し切った！`,
        share: 'Xに投稿', again: 'もう一度', toTitle: 'モード選択へ', loadErr: '読み込みに失敗しました。通信環境を確認して再読み込みしてください。',
      },
      en: {
        title: 'Shiritori Speed', back: '← Top', lang: '日本語', langLabel: '日本語に切り替え', sound: 'Sound on/off',
        cpu: 'Play vs CPU', ta: 'Time Attack', lv: i => LVE[i],
        time: s => `${s}s`, best: s => `Best ${s}s`,
        flip: 'Flip!', win: 'You win!', lose: 'You lose...',
        winSub: (n, l) => n >= 15 ? `Crushed the ${l} CPU by ${n} cards` : n >= 6 ? `Beat the ${l} CPU by ${n} cards` : `Barely beat the ${l} CPU by ${n} cards`,
        loseSub: (n, l) => n <= 3 ? `Only ${n} cards to go... (${l})` : n <= 10 ? `${n} cards left. Lost to the ${l} CPU` : `${n} cards left. Crushed by the ${l} CPU`,
        taBig: s => `${s}s`,
        taSub: (s, nb) => (nb ? 'New best! ' : '') + (s < 30 ? 'Shiritori demon' : s < 45 ? 'Very fast' : s < 70 ? 'Nice pace' : 'Keep practicing'),
        shareWin: (n, l) => `I beat the ${l} CPU in Shiritori Speed! (by ${n} cards)`,
        shareLose: (n, l) => `I lost to the ${l} CPU in Shiritori Speed... (${n} cards left)`,
        shareTa: s => `I emptied my deck in ${s}s in Shiritori Speed Time Attack!`,
        share: 'Post on X', again: 'Play again', toTitle: 'Modes', loadErr: 'Failed to load. Check your connection and reload.',
      },
    };
    let lang = store.get('lang', (navigator.language || '').startsWith('ja') ? 'ja' : 'en');
    if (!L[lang]) lang = 'ja';
    const t = k => L[lang][k];
    const langBtn = $('lang');
    function applyLang() {
      document.documentElement.lang = lang;
      document.title = t('title');
      $('back').textContent = t('back');
      langBtn.textContent = t('lang'); langBtn.setAttribute('aria-label', t('langLabel'));
      soundBtn.setAttribute('aria-label', t('sound'));
      $('tTitle').textContent = t('title');
      $('bCpu').textContent = t('cpu'); $('bTa').textContent = t('ta');
      document.querySelectorAll('#lv button').forEach((b, i) => { b.textContent = t('lv')(i); b.classList.toggle('on', i === level); });
      $('share').textContent = t('share'); $('again').textContent = t('again'); $('toTitle').textContent = t('toTitle');
      renderInfo();
      if (result) showResult();
    }
    langBtn.onclick = () => { lang = lang === 'ja' ? 'en' : 'ja'; store.set('lang', lang); applyLang(); };

    // 単語（「ん」で終わるものは入れない）
    const WORDS = (`いろは りんご ごりら らっぱ ぱんだ だるま まくら らくだ だちょう うさぎ ぎたー たぬき きつね ねこ こあら
      らいおん いるか かめ めだか かばん すいか かき きのこ こま まめ めがね ねずみ みかん みみ みず ずぼん
      いぬ ぬいぐるみ みそしる るすばん とけい いちご ごはん はさみ みどり りす すし しか かに にんじん
      にわとり りょうり りかい いか かさ さる るびー びーる るーる くじら らーめん めろん ろうそく くつ つくえ
      えんぴつ つみき きりん うま まり りゅう うし しまうま まど どんぐり りぼん ぼうし しお おに にじ
      じかん じしゃく くま まつり とまと とら らじお おばけ けいと とり りれー れもん もも もぐら
      らっこ こおり りんかく くり りそう うみ みち ちず ずかん かぜ ぜりー りか かお おかし しろ ろけっと
      とんぼ ぼたん たまご ごま まんが がっこう うどん そら らんどせる るーぺ ぺんぎん たこ こども もち ちょう
      うちゅう うで でんわ わに にもつ つばめ めいろ ろば ばなな なす すな なつ つき きって てがみ みらい いす
      すみれ れいぞうこ こけし しっぽ ぽすと とうふ ふね ねぎ ぎんこう うなぎ ぎゅうにゅう うちわ わさび びわ
      わなげ げた たき きもの のり りんどう うき きく くも もり りく くさ さかな なべ べんとう うめ めじろ ろく
      くし しま まつ つな なわ わた たけ けむし しかく くるま まほう うそ そば ばす すず ずつう うた たいこ こい
      いのしし しじみ みみず ずこう さくら らく くぎ ぎょうざ ざる るり じてんしゃ やかん かえる るす
      すいとう うがい いし しゃもじ じゃがいも もみじ じどうしゃ やま まぐろ ろうか かいだん だんご ごぼう うめぼし
      しんごう うずら らいむ むし しいたけ けしごむ むぎ ぎふ ふくろう うんどう うりぼう おでん てんぐ ぐみ
      みこし しょうゆ ゆき きっぷ ぷりん ゆびわ わかめ めんこ こたつ つる るつぼ ぼーる るい いと とげ げんき
      きじ じゅーす すいか かいがら らくがき きびだんご ごみ みかづき きた たいやき きせつ つの のこぎり りんぐ
      ぐらす すけーと とびら らっきょう うに にく くじゃく くすり りす すきやき きゃべつ つばさ さめ めいし
      しゃしん てぶくろ ろっく くっきー きーほるだー だいこん こうもり りゅっく くちびる るーと とけい えき
      きゅうり りんぷん はな なまず ずきん かがみ みるく くらげ げーむ むかで でんしゃ やぎ ぎんなん のりまき
      きんぎょ こすもす すずめ めだま まいく くわがた たんぽぽ ぽてと とかげ げんかん かたつむり りょかん`)
      .split(/\s+/).filter(w => w && !w.endsWith('ん') && w[0] !== 'ん' && !/^[ゃゅょっー]/.test(w));
    const SMALL = { 'ゃ': 'や', 'ゅ': 'ゆ', 'ょ': 'よ', 'っ': 'つ', 'ぁ': 'あ', 'ぃ': 'い', 'ぅ': 'う', 'ぇ': 'え', 'ぉ': 'お' };
    function tailOf(w) {
      let i = w.length - 1;
      while (i > 0 && w[i] === 'ー') i--;
      return SMALL[w[i]] || w[i];
    }
    const byHead = {};
    for (const w of WORDS) (byHead[w[0]] = byHead[w[0]] || []).push(w);
    const fmtSec = ms => (ms / 1000).toFixed(1);
    const pick = a => a[Math.floor(Math.random() * a.length)];

    // 山札から1枚引く。場につながる言葉が出やすいように少しだけ寄せる
    function draw() {
      // 手札に同じ言葉が並ばないよう、何度か引き直す
      for (let i = 0; i < 8; i++) {
        const heads = piles.map(tailOf).filter(h => byHead[h]);
        const w = Math.random() < 0.45 && heads.length ? pick(byHead[pick(heads)]) : pick(WORDS);
        if (!hand.includes(w)) return w;
      }
      return pick(WORDS);
    }
    function pileWord() {
      for (let i = 0; i < 50; i++) { const w = pick(WORDS); if (byHead[tailOf(w)]) return w; }
      return 'りんご';
    }
    // 誰も出せずにめくり直すときは、手札のどれかが必ずつながる言葉を場に出す
    const byTail = {};
    for (const w of WORDS) (byTail[tailOf(w)] = byTail[tailOf(w)] || []).push(w);
    function flipWords() {
      const heads = [...hand, ...cpuHand].filter(Boolean).map(w => w[0]).filter(h => byTail[h]);
      const ws = [pileWord(), pileWord()];
      if (heads.length) ws[Math.floor(Math.random() * 2)] = pick(byTail[pick(heads)]);
      return ws;
    }

    // ===== 3D =====
    const cv = $('cv');
    const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x2b2230);
    scene.fog = new THREE.Fog(0x2b2230, 12, 22);
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 50);
    scene.add(new THREE.HemisphereLight(0xfff4e0, 0x3a2a40, 1.1));
    const lamp = new THREE.DirectionalLight(0xfff0d8, 1.6);
    lamp.position.set(2.5, 9, 3);
    lamp.castShadow = true;
    lamp.shadow.mapSize.set(1024, 1024);
    Object.assign(lamp.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 20 });
    scene.add(lamp);

    const lam = c => new THREE.MeshLambertMaterial({ color: c });
    // テーブル
    const felt = new THREE.Mesh(new THREE.BoxGeometry(8, 0.3, 8.6), lam(0x1f7a52));
    felt.position.set(0, -0.15, 0.2); felt.receiveShadow = true; scene.add(felt);
    const rim = new THREE.Mesh(new THREE.BoxGeometry(8.6, 0.3, 9.2), lam(0x7a4a2a));
    rim.position.set(0, -0.32, 0.2); scene.add(rim);
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), lam(0x3a2c34));
    floor.rotation.x = -Math.PI / 2; floor.position.y = -2.5; scene.add(floor);
    const wall = new THREE.Mesh(new THREE.PlaneGeometry(40, 20), lam(0x4a3a48));
    wall.position.set(0, 3, -9); scene.add(wall);

    // 相手
    const opp = new THREE.Group();
    const skin = lam(0xf2c9a0), shirt = lam(0xe0705a), hairM = lam(0x3a2a22), black = lam(0x222222);
    const chair = new THREE.Mesh(new THREE.BoxGeometry(2.2, 2.6, 0.25), lam(0x5a3420));
    chair.position.set(0, 1.0, -1.2); opp.add(chair);
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.75, 0.8, 6, 16), shirt);
    body.position.set(0, 0.85, -0.6); body.castShadow = true; opp.add(body);
    const headG = new THREE.Group(); headG.position.set(0, 2.25, -0.55); opp.add(headG);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.62, 24, 18), skin); head.castShadow = true; headG.add(head);
    const hair = new THREE.Mesh(new THREE.SphereGeometry(0.66, 24, 12, 0, Math.PI * 2, 0, Math.PI * 0.5), hairM);
    hair.rotation.x = -0.35; hair.position.y = 0.05; headG.add(hair);
    const eyes = [];
    for (const s of [-1, 1]) {
      const e = new THREE.Mesh(new THREE.SphereGeometry(0.08, 10, 8), black);
      e.position.set(s * 0.22, 0.02, 0.56); e.scale.z = 0.5; headG.add(e); eyes.push(e);
      const ch = new THREE.Mesh(new THREE.CircleGeometry(0.1, 12), new THREE.MeshBasicMaterial({ color: 0xf29a9a, transparent: true, opacity: 0.6 }));
      ch.position.set(s * 0.36, -0.16, 0.53); ch.rotation.y = s * 0.5; headG.add(ch);
    }
    const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.12, 0.025, 6, 12, Math.PI), black);
    mouth.position.set(0, -0.2, 0.58); mouth.rotation.z = Math.PI; headG.add(mouth);
    const arms = [];
    for (const s of [-1, 1]) {
      const sh = new THREE.Group(); sh.position.set(s * 0.8, 1.45, -0.55); opp.add(sh);
      const a = new THREE.Mesh(new THREE.CapsuleGeometry(0.2, 1.0, 4, 10), shirt);
      a.position.y = -0.6; a.castShadow = true; sh.add(a);
      const hnd = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 10), skin); hnd.position.y = -1.25; sh.add(hnd);
      arms.push(sh);
    }
    opp.position.set(0, 0, -3.9);
    scene.add(opp);
    const oppState = { reach: 0, reachX: 0, mood: 'idle', blink: 0 };

    // カードの絵（Canvas テクスチャ）
    const CW = 1.2, CH = 1.68;
    const texCache = new Map();
    function faceTex(w, kind) {
      const key = kind + w;
      if (texCache.has(key)) return texCache.get(key);
      const c = document.createElement('canvas'); c.width = 256; c.height = 358;
      const g = c.getContext('2d');
      g.fillStyle = '#fffdf6'; g.fillRect(0, 0, 256, 358);
      g.strokeStyle = '#e4dccb'; g.lineWidth = 8; g.strokeRect(10, 10, 236, 338);
      const font = s => `bold ${s}px "Hiragino Maru Gothic ProN", "Yu Gothic", "Noto Sans CJK JP", sans-serif`;
      const size = Math.min(96, 232 / w.length);
      g.font = font(size); g.textBaseline = 'middle';
      const tl = w.length - 1 - [...w].reverse().findIndex(ch => ch !== 'ー');
      const parts = kind === 'pile'
        ? [[w.slice(0, tl), '#333'], [w.slice(tl), '#2a63c7']]
        : [[w[0], '#d2433b'], [w.slice(1), '#333']];
      const total = parts.reduce((s, p) => s + g.measureText(p[0]).width, 0);
      let x = 128 - total / 2;
      for (const [s, col] of parts) { g.fillStyle = col; g.fillText(s, x, 179); x += g.measureText(s).width; }
      if (kind === 'pile') {
        g.fillStyle = '#2a63c7'; g.beginPath(); g.arc(196, 300, 40, 0, Math.PI * 2); g.fill();
        g.fillStyle = '#fff'; g.font = font(48); g.textAlign = 'center'; g.fillText(tailOf(w), 196, 302);
      }
      const tx = new THREE.CanvasTexture(c);
      tx.colorSpace = THREE.SRGBColorSpace; tx.anisotropy = 4;
      texCache.set(key, tx);
      return tx;
    }
    const backTex = (() => {
      const c = document.createElement('canvas'); c.width = 128; c.height = 179;
      const g = c.getContext('2d');
      g.fillStyle = '#fffdf6'; g.fillRect(0, 0, 128, 179);
      g.fillStyle = '#b8322c'; g.fillRect(8, 8, 112, 163);
      g.strokeStyle = '#9e2924'; g.lineWidth = 6;
      for (let i = -200; i < 200; i += 16) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i + 179, 179); g.stroke(); }
      const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; return tx;
    })();
    const cardGeo = new THREE.BoxGeometry(CW, 0.03, CH);
    const edgeMat = lam(0xf2ead8), backMat = new THREE.MeshBasicMaterial({ map: backTex });
    const cards = new Set();
    function makeCard(w, kind, pos) {
      const face = w ? new THREE.MeshBasicMaterial({ map: faceTex(w, kind) }) : backMat;
      const m = new THREE.Mesh(cardGeo, [edgeMat, edgeMat, face, backMat, edgeMat, edgeMat]);
      m.castShadow = true;
      m.position.copy(pos);
      m.userData = { word: w, to: pos.clone(), rx: 0, rz: 0, ry: 0, s: 1, shake: 0 };
      scene.add(m); cards.add(m);
      return m;
    }
    function setFace(m, w, kind) { m.material[2] = new THREE.MeshBasicMaterial({ map: faceTex(w, kind) }); m.userData.word = w; }
    function removeCard(m) { scene.remove(m); cards.delete(m); }

    // 置き場所
    const HAND_Z = 3.15, HAND_Y = 0.75, HAND_TILT = 0.75;
    const handPos = i => new THREE.Vector3((i - 1.5) * 1.32, HAND_Y, HAND_Z);
    const PILE_X = [-0.95, 0.95], PILE_Z = 0.2;
    const cpuPos = i => new THREE.Vector3((i - 1.5) * 0.95 + 0.4, 0.05, -2.2);
    const myDeckPos = new THREE.Vector3(2.35, 0.1, 1.05), cpuDeckPos = new THREE.Vector3(-2.5, 0.1, -2.2);
    // 山札：残り枚数ぶんの厚みで積み、いちばん上に枚数を描く
    function deckTopTex(n) {
      const c = document.createElement('canvas'); c.width = 128; c.height = 179;
      const g = c.getContext('2d');
      g.drawImage(backTex.image, 0, 0);
      g.fillStyle = '#fffdf6'; g.beginPath(); g.arc(64, 90, 34, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#b8322c'; g.font = 'bold 40px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(n, 64, 92);
      const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; return tx;
    }
    const decks = [myDeckPos, cpuDeckPos].map(pos => {
      const top = new THREE.MeshBasicMaterial();
      const m = new THREE.Mesh(new THREE.BoxGeometry(CW, 1, CH), [edgeMat, edgeMat, top, edgeMat, edgeMat, edgeMat]);
      m.castShadow = true; m.position.copy(pos); m.visible = false; m.userData.n = -1;
      scene.add(m);
      return m;
    });
    function setDeck(d, n, show) {
      d.visible = show && n > 0;
      if (!d.visible || d.userData.n === n) return;
      d.userData.n = n;
      const h = 0.03 + n * 0.022;
      d.scale.y = h; d.position.y = h / 2;
      d.material[2].map?.dispose(); d.material[2].map = deckTopTex(n); d.material[2].needsUpdate = true;
    }
    const rings = PILE_X.map(x => {
      const r = new THREE.Mesh(new THREE.PlaneGeometry(CW + 0.3, CH + 0.3), new THREE.MeshBasicMaterial({ color: 0xffe9a8, transparent: true, opacity: 0 }));
      r.rotation.x = -Math.PI / 2; r.position.set(x, 0.005, PILE_Z); scene.add(r); return r;
    });

    function aimHand(m, i) { Object.assign(m.userData, { rx: HAND_TILT, rz: 0, ry: 0, s: 1 }); m.userData.to.copy(handPos(i)); }
    function aimPile(m, p) {
      const st = pileStacks[p];
      st.push(m);
      while (st.length > 6) removeCard(st.shift());
      Object.assign(m.userData, { rx: 0, ry: (Math.random() - 0.5) * 0.12, rz: 0, s: 1.04, pile: true });
      // 重ねた高さを毎回振り直して、いちばん上のカードが必ず上に来るようにする
      st.forEach((c, j) => c.userData.to.set(PILE_X[p], 0.04 + j * 0.04, PILE_Z));
      setFace(m, m.userData.word, 'pile');
    }
    function aimCpu(m, i) { Object.assign(m.userData, { rx: 0, ry: 0, rz: 0, s: 0.78 }); m.userData.to.copy(cpuPos(i)); }

    function resize() {
      const w = cv.clientWidth, h = cv.clientHeight;
      if (!w || !h) return;
      renderer.setSize(w, h, false);
      const aspect = w / h;
      camera.aspect = aspect;
      // 縦長の画面でも手札の4枚が横に収まるよう、画角を広げる
      const k = Math.max(0, Math.min(1, (0.8 - aspect) / 0.35));
      camera.position.set(0, 8.4 + k * 0.4, 6.2 - k * 0.6);
      camera.lookAt(0, 0.6 - k * 0.6, 0.1 + k * 0.9);
      const needHalfW = 2.75, dist = camera.position.distanceTo(handPos(1.5));
      const vfov = 2 * Math.atan(Math.max(Math.tan(THREE.MathUtils.degToRad(24)), needHalfW / dist / aspect));
      camera.fov = Math.min(80, THREE.MathUtils.radToDeg(vfov));

      camera.updateProjectionMatrix();
    }
    new ResizeObserver(resize).observe(cv);
    resize();

    // ===== 状態 =====
    const DECK = 20, HAND = 4;
    const CPU_MS = [[2600, 4200], [1600, 2800], [900, 1600]];
    let mode = null, level = store.get('level', 1), result = null;
    let piles = ['', ''], hand = [], myDeck = 0, cpuHand = [], cpuDeck = 0, played = 0;
    let handM = [], cpuM = [], pileStacks = [[], []];
    let stunUntil = 0, startAt = 0, finishedAt = 0, cpuTimer = 0, stallTimer = 0, tick = 0, running = false;

    document.querySelectorAll('#lv button').forEach((b, i) => b.onclick = () => { level = i; store.set('level', i); applyLang(); });

    function start(m) {
      mode = m; result = null; running = true; played = 0; stunUntil = 0;
      cancelDrag();
      for (const c of [...cards]) removeCard(c);
      pileStacks = [[], []];
      piles = [pileWord(), pileWord()];
      piles.forEach((w, p) => aimPile(makeCard(w, 'pile', new THREE.Vector3(PILE_X[p], 0.6, PILE_Z)), p));
      myDeck = DECK; cpuDeck = DECK;
      hand = []; handM = []; cpuHand = []; cpuM = [];
      for (let i = 0; i < HAND; i++) {
        hand[i] = draw(); myDeck--;
        handM[i] = makeCard(hand[i], 'hand', myDeckPos); aimHand(handM[i], i);
        if (m === 'cpu') { cpuHand[i] = draw(); cpuDeck--; cpuM[i] = makeCard(null, 'back', cpuDeckPos); aimCpu(cpuM[i], i); }
      }
      opp.visible = m === 'cpu'; oppState.mood = 'idle';
      $('title').classList.add('hidden'); $('result').classList.add('hidden');
      clearTimeout(cpuTimer); clearTimeout(stallTimer); clearInterval(tick);
      if (m === 'cpu') scheduleCpu();
      if (m === 'ta') { startAt = performance.now(); tick = setInterval(renderInfo, 100); }
      renderInfo(); checkStall();
    }
    const canPlay = w => piles.findIndex(p => w && w[0] === tailOf(p));
    const anyMove = h => h.some(w => canPlay(w) >= 0);
    const myLeft = () => hand.filter(Boolean).length + myDeck;
    const cpuLeft = () => cpuHand.filter(Boolean).length + cpuDeck;

    function playerPlay(idx, pi) {
      const w = hand[idx], m = handM[idx];
      if (!running || !w) return false;
      if (performance.now() < stunUntil || w[0] !== tailOf(piles[pi])) {
        if (w[0] !== tailOf(piles[pi])) { stunUntil = performance.now() + 500; sndMiss(); }
        aimHand(m, idx); m.userData.shake = 1;
        pileStacks[pi].at(-1).userData.shake = 1;
        return false;
      }
      piles[pi] = w; aimPile(m, pi); sndPlay(); played++;
      hand[idx] = null; handM[idx] = null;
      if (myDeck > 0) {
        hand[idx] = draw(); myDeck--;
        handM[idx] = makeCard(hand[idx], 'hand', myDeckPos); aimHand(handM[idx], idx);
      }
      renderInfo();
      if (myLeft() === 0) return finish(true), true;
      checkStall();
      return true;
    }
    function scheduleCpu() {
      const [a, b] = CPU_MS[level];
      cpuTimer = setTimeout(cpuMove, a + Math.random() * (b - a));
    }
    function cpuMove() {
      if (!running) return;
      for (let i = 0; i < HAND; i++) {
        const pi = canPlay(cpuHand[i]);
        if (pi < 0) continue;
        const m = cpuM[i];
        piles[pi] = cpuHand[i]; m.userData.word = cpuHand[i]; aimPile(m, pi); sndCpu();
        oppState.reach = 1; oppState.reachX = PILE_X[pi];
        if (cpuDeck > 0) { cpuDeck--; cpuHand[i] = draw(); cpuM[i] = makeCard(null, 'back', cpuDeckPos); aimCpu(cpuM[i], i); }
        else { cpuHand[i] = null; cpuM[i] = null; }
        renderInfo();
        if (cpuLeft() === 0) return finish(false);
        checkStall();
        break;
      }
      scheduleCpu();
    }
    // 誰も出せないときは、少し待って場をめくり直す
    function checkStall() {
      clearTimeout(stallTimer);
      if (!running) return;
      if (anyMove(hand) || (mode === 'cpu' && anyMove(cpuHand))) return;
      stallTimer = setTimeout(() => {
        if (!running || anyMove(hand) || (mode === 'cpu' && anyMove(cpuHand))) return;
        piles = flipWords(); sndFlip();
        piles.forEach((w, p) => aimPile(makeCard(w, 'pile', new THREE.Vector3(PILE_X[p], 0.6, PILE_Z)), p));
        const msg = $('msg'); msg.textContent = t('flip'); msg.classList.add('show'); setTimeout(() => msg.classList.remove('show'), 700);
        checkStall();
      }, 1500);
    }
    function finish(win) {
      running = false; finishedAt = performance.now(); clearTimeout(cpuTimer); clearTimeout(stallTimer); clearInterval(tick); cancelDrag();
      if (mode === 'ta') {
        const ms = performance.now() - startAt, best = store.get('bestMs', null);
        result = { mode: 'ta', n: fmtSec(ms), newBest: best === null || ms < best };
        if (result.newBest) store.set('bestMs', ms);
        sndWin();
      } else {
        result = { mode: 'cpu', win, n: win ? cpuLeft() : myLeft(), level };
        oppState.mood = win ? 'sad' : 'happy';
        win ? sndWin() : sndLose();
      }
      setTimeout(showResult, 1100);
    }
    function showResult() {
      if (!result) return;
      const r = result, lv = t('lv')(r.level ?? 0);
      let big, sub, text;
      if (r.mode === 'ta') { big = t('taBig')(r.n); sub = t('taSub')(+r.n, r.newBest); text = t('shareTa')(r.n); }
      else if (r.win) { big = t('win'); sub = t('winSub')(r.n, lv); text = t('shareWin')(r.n, lv); }
      else { big = t('lose'); sub = t('loseSub')(r.n, lv); text = t('shareLose')(r.n, lv); }
      $('rBig').textContent = big; $('rSub').textContent = sub;
      const a = $('share');
      a.href = `https://x.com/intent/post?text=${encodeURIComponent(text)}&url=${encodeURIComponent('https://keifurukawafunnych.com/games/shiritori-speed/')}`;
      if (matchMedia('(pointer: coarse)').matches) { a.removeAttribute('target'); a.removeAttribute('rel'); }
      else { a.target = '_blank'; a.rel = 'noopener'; }
      $('result').classList.remove('hidden');
    }
    $('bCpu').onclick = () => start('cpu');
    $('bTa').onclick = () => start('ta');
    $('again').onclick = () => start(mode);
    $('toTitle').onclick = () => { result = null; $('result').classList.add('hidden'); $('title').classList.remove('hidden'); };

    function renderInfo() {
      if (!mode) return;
      setDeck(decks[0], myDeck, true);
      setDeck(decks[1], cpuDeck, mode === 'cpu');
      if (mode === 'cpu') {
        $('leftInfo').textContent = '';
        $('rightInfo').textContent = t('lv')(level);
        $('myDeck').textContent = '';
      } else {
        const best = store.get('bestMs', null);
        $('leftInfo').textContent = best === null ? '' : t('best')(fmtSec(best));
        $('rightInfo').textContent = t('time')(fmtSec((running ? performance.now() : finishedAt) - startAt));
        $('myDeck').textContent = '';
      }
    }

    // ===== ドラッグ＆ドロップ =====
    const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
    const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -0.9), hit = new THREE.Vector3();
    let drag = null;
    function toNdc(e) {
      const r = cv.getBoundingClientRect();
      ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      ray.setFromCamera(ndc, camera);
    }
    function pileNear(p) {
      let best = -1, bd = 1.25;
      PILE_X.forEach((x, i) => { const d = Math.hypot(p.x - x, (p.z - PILE_Z) * 0.8); if (d < bd) { bd = d; best = i; } });
      return best;
    }
    cv.addEventListener('pointerdown', e => {
      if (!running || drag) return;
      toNdc(e);
      const live = handM.filter(Boolean);
      const h = ray.intersectObjects(live)[0];
      if (!h) return;
      e.preventDefault();
      const i = handM.indexOf(h.object);
      drag = { i, m: h.object, id: e.pointerId };
      Object.assign(drag.m.userData, { rx: 0.35, s: 1.08 });
      onMove(e);
    });
    function onMove(e) {
      if (!drag || e.pointerId !== drag.id) return;
      toNdc(e);
      if (ray.ray.intersectPlane(dragPlane, hit)) {
        drag.m.userData.to.set(hit.x, 0.9, hit.z - 0.35);
        drag.over = pileNear(drag.m.userData.to);
      }
    }
    function cancelDrag() {
      if (!drag) return;
      if (handM[drag.i] === drag.m) aimHand(drag.m, drag.i);
      drag = null;
    }
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', e => {
      if (!drag || e.pointerId !== drag.id) return;
      const { i, over } = drag;
      drag = null;
      if (over >= 0) playerPlay(i, over); else aimHand(handM[i], i);
    });
    window.addEventListener('pointercancel', cancelDrag);

    // ===== 毎フレーム =====
    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      const k = 1 - Math.pow(0.0005, dt);
      const stunned = now < stunUntil;
      for (const m of cards) {
        const u = m.userData;
        if (u.pile) {
          // 場へ向かうカードは、山より上を通ってから着地させる
          const far = Math.hypot(u.to.x - m.position.x, u.to.z - m.position.z);
          m.position.x += (u.to.x - m.position.x) * k;
          m.position.z += (u.to.z - m.position.z) * k;
          m.position.y += ((far > 0.12 || Math.abs(m.rotation.x) > 0.05 ? u.to.y + 0.35 : u.to.y) - m.position.y) * k * 1.6;
        } else m.position.lerp(u.to, k);
        if (u.shake > 0) { u.shake = Math.max(0, u.shake - dt * 3); m.position.x += Math.sin(now / 25) * 0.08 * u.shake; }
        m.rotation.x += (u.rx - m.rotation.x) * k;
        m.rotation.y += (u.ry - m.rotation.y) * k;
        m.rotation.z += (u.rz - m.rotation.z) * k;
        if (u.s > 1 && !(drag && drag.m === m)) u.s = Math.max(1, u.s - dt * 0.8);
        m.scale.setScalar(m.scale.x + (u.s - m.scale.x) * k);
        if (m.material[2].color) m.material[2].color.setScalar(stunned && handM.includes(m) ? 0.6 : 1);
      }
      rings.forEach((r, i) => { r.material.opacity += ((drag && drag.over === i ? 0.55 : 0) - r.material.opacity) * k; });
      // 相手の動き
      const tt = now / 1000;
      oppState.reach = Math.max(0, oppState.reach - dt * 2.2);
      const reach = Math.sin(Math.min(1, oppState.reach) * Math.PI);
      const mood = oppState.mood;
      headG.position.y = 2.25 + Math.sin(tt * 2) * 0.03 - (mood === 'sad' ? 0.15 : 0);
      headG.rotation.x += ((mood === 'sad' ? 0.5 : mood === 'happy' ? -0.25 : 0.15) - headG.rotation.x) * k;
      headG.rotation.y = mood === 'idle' && running ? Math.sin(tt * 0.7) * 0.15 : 0;
      const blink = (tt % 3.2) < 0.12 ? 0.15 : 1;
      eyes.forEach(e => e.scale.y = blink);
      mouth.rotation.z = mood === 'sad' ? 0 : Math.PI;
      mouth.position.y = mood === 'sad' ? -0.28 : -0.2;
      arms.forEach((a, i) => {
        const s = i ? 1 : -1;
        let rx = -1.0, rz = s * 0.15;
        if (mood === 'happy') { rx = 0; rz = s * 2.6 + Math.sin(tt * 10) * 0.2; }
        else if (mood === 'sad') { rx = -0.3; rz = s * 0.1; }
        else if (reach && (oppState.reachX < 0) === (s < 0)) { rx = -1.0 - reach * 0.6; rz = s * 0.15 - oppState.reachX * 0.15 * reach; }
        a.rotation.x += (rx - a.rotation.x) * k * 1.5;
        a.rotation.z += (rz - a.rotation.z) * k * 1.5;
      });
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    window.__game = { state: () => ({ hand, piles, played, running, cpuHand }), canPlay, finish, camera, handM, pileX: PILE_X, pileZ: PILE_Z, get handMeshes() { return handM; }, get stacks() { return pileStacks; } };
    applyLang();
  </script>
  <script>
    // three.js が読めなかったとき
    setTimeout(() => { if (!window.__game) document.querySelector('main').insertAdjacentHTML('beforeend', '<div id="loadErr">' + ((navigator.language || '').startsWith('ja') ? '読み込みに失敗しました。再読み込みしてください。' : 'Failed to load. Please reload.') + '</div>'); }, 8000);
  </script>
</body>
</html>
