const rid = () => { const c = 'abcdefghijkmnpqrstuvwxyz23456789'; let r = ''; for (const x of crypto.getRandomValues(new Uint8Array(10))) r += c[x % c.length]; return r; };

// ホスト: ゲストが抜けた。その席はコンピューターに戻す（だれもいなくなったら、ひとりに戻る。招待は続ける）

// ゲスト: ホストとの接続が切れた → ひとりに戻る

// 招待リンクで開いた時: ホストにつなぐ（ゲストになる）
async function joinRoom(room) {
  $('onM').hidden = false; $('onInvite').hidden = true; setStatus('joining', true); updOnlineUI();

    await loadPeer();
    peer = new window.Peer();
    let done = false, tries = 0, lastErr = '';
    const fail = () => { if (done || mode === 'guest') return; done = true; setStatus('fail', false, lastErr || 'timeout'); if (peer) { peer.destroy(); peer = null; } };
    const timer = setTimeout(fail, 30000);
    // 相手（招待した人）が見つからない時は、少し待ってからつなぎ直す（相手が仲介サーバーにつなぎ直している途中のことがある）
    const tryConnect = () => {
      if (done || mode === 'guest' || !peer) return;
      tries++;
      const c = peer.connect('kfrsoccer-' + room, { reliable: true, metadata: { ch: 'ctl' } });
      c.on('data', m => { if (m && m.t === 'full') { lastErr = 'full'; clearTimeout(timer); fail(); return; } onNet(m); });
      c.on('error', () => {});
      c.on('open', () => {
        if (done) return;
        done = true; clearTimeout(timer);
        conn = c; mode = 'guest';
        c.on('close', onLeave); c.on('error', onLeave);
        $('onM').hidden = true; toast(t('joined'));
        const sc = peer.connect('kfrsoccer-' + room, { reliable: false, metadata: { ch: 'str' } });
        sc.on('data', m => onNet(m)); sc.on('open', () => { sconn = sc; });
      });
    };

}
// 受け取った知らせ（ホストでは from = 送ってきたゲスト）
function onNet(m, from) {

    if (m.t === 'pi') { streamSend({ t: 'po', c: m.c, h: performance.now() / 1000 }, from); return; }
    if (m.t === 'i') {
      const r = remote[from.seat]; if (!r || m.n <= r.n) return; r.n = m.n;
      r.walk = { x: +m.x || 0, z: +m.z || 0 };
      if ((m.x || m.z) && state === 'ready') beginPlay();
      if (m.k > r.kick) { r.kick = m.k; if (sims[from.seat]) kickFor(sims[from.seat]); }
    } else if (m.t === 'retry') { reset(); welcomeAll(); netSend({ t: 'reset' }); }
  } else if (mode === 'guest') {
    if (m.t === 'bye') { onLeave(); return; }

      mySeat = m.seat; fmt = m.fmt === 2 ? 2 : 1; reset(); updateCamera(0, true);
      if (changed) toast(t(teamOf(mySeat) ? 'youBlue' : 'youOrange'), 2600);
    }
    else if (m.t === 'reset') reset();
    else if (m.t === 'fx') { for (const [n, a] of m.l) if (SFX[n]) SFX[n](...a); }
    else if (m.t === 'goal') { goals = m.g; opp = m.o; goalFx(m.e, m.c, m.g, m.o); }

    else if (m.t === 'golden') goldenUI();

// ホスト: 状態を1秒に30回送る（2体の部位13個ずつとボールの位置・向き、試合の状態）
