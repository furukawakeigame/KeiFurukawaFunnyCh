    let ang = Math.atan2(f.fx, f.fz);
    if (r === R_ME) ang += Math.max(-0.4, Math.min(0.4, side / 0.12 * 0.18));
    else { const g = Math.atan2(0 - bp.x, -HZ - bp.z); let d = Math.atan2(Math.sin(g - ang), Math.cos(g - ang)); ang += Math.max(-0.6, Math.min(0.6, d)) + (Math.random() - 0.5) * 0.3; }
    const pw = r === R_ME ? 10.5 : 8.5;
    ball.body.setLinvel({ x: Math.sin(ang) * pw, y: 1.0 + Math.random() * 1.2, z: Math.cos(ang) * pw }, true);
    kickSnd(1); spawnBits(tmpA.set(bp.x, 0.05, bp.z), 10, [0x3f8a3a, 0x58a84f, 0x2d6b2a], 1.5, 0.03, 0.6);
  }
}

// ===== ループ（物理は 1/120 秒きざみ・描画は補間）=====
let acc = 0, last = performance.now(), faceTimer = 0, snapWant = -1, snapDone = false;
const hintPos = new THREE.Vector3();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const d = inputDir();
  if (state === 'ready' && (d.x || d.z)) beginPlay();
  me.walk = state === 'play' || state === 'goal' ? d : { x: 0, z: 0 };
  updateAI(dt);
  if (state === 'play') {
    // ゴールに入った？（口の内側を、ボールが全部こえた）
    const b = ball.body.translation();
    if (state === 'play' && Math.abs(b.z) > HZ + BALL_R && Math.abs(b.x) < GW && b.y < GH) scoreGoal(Math.sign(b.z));
    // ボールが長く止まったまま（板ぎわで取り合いになった時など）なら、真ん中に戻す
    const bv = ball.body.linvel();
    stuckT = Math.hypot(bv.x, bv.z) < 0.25 && (Math.abs(b.x) > HX - 0.8 || Math.abs(b.z) > HZ - 0.8) ? stuckT + dt : 0;
    if (stuckT > 5) { stuckT = 0; dropBall(); }
  } else if (state === 'goal') {
    goalT += dt; scrT += dt;
    if (goalT > 1.8) finish();
  }
  acc += dt;
  while (acc >= me.DT) {
    for (const r of robots) for (const v of r.visuals) { v.pp.copy(v.cp); v.pq.copy(v.cq); }
    ballV.pp.copy(ballV.cp); ballV.pq.copy(ballV.cq);
    stepAll();
    handleHits();
    checkKicks();
    for (const r of robots) for (const v of r.visuals) readBody(r.getSim().parts[v.name].body, v.cp, v.cq);
    readBody(ball.body, ballV.cp, ballV.cq);
    acc -= me.DT;
  }
  const a = acc / me.DT;
  for (const r of robots) for (const v of r.visuals) { v.group.position.lerpVectors(v.pp, v.cp, a); v.group.quaternion.slerpQuaternions(v.pq, v.cq, a); }
  ballMesh.position.lerpVectors(ballV.pp, ballV.cp, a); ballMesh.quaternion.slerpQuaternions(ballV.pq, ballV.cq, a);
  ballMark.position.x = ballMesh.position.x; ballMark.position.z = ballMesh.position.z; ballMark.material.opacity = 0.35 * Math.max(0, 1 - (ballMesh.position.y - BALL_R) / 2);
  // 時間のゲージ（変わった時だけ書く）
  // 顔
  for (const r of robots) {
    const s = r.getSim();
    r.voiceCool -= dt; r.crashCool -= dt;
    if (s.state !== r.lastState) { if (s.state === 'stand' && r.lastState === 'getup') { setFace(r.face, 'normal'); beep(r.hi ? 880 : 660, 0.07, 0, 0.05); } if (s.state === 'getup') hum(r.hi); r.lastState = s.state; }
    if (r.face.mode === 'hit') { r.faceT -= dt; if (r.faceT <= 0) setFace(r.face, 'normal'); }
    if (r.face.mode === 'dizzy') { r.face.t += dt; r.face.spin += dt * 5; if (r.face.t > 1 / 15) { r.face.t = 0; drawFace(r.face); } if (s.state === 'stand') setFace(r.face, 'normal'); }
  }
  if (scrMode !== 'idle') { faceTimer += dt; if (faceTimer > 1 / 15) { faceTimer = 0; drawScreen(); } } else if (faceTimer >= 0) { faceTimer = -1; drawScreen(); }
  updateCamera(dt);
  updateBallArrow();
  updateNet(dt);
  updateParticles(dt);
  if (state === 'ready') {
    const pt = me.parts.pelvis.body.translation();
    hintPos.set(pt.x, 0, pt.z - 0.5).project(camera);
    $('hint').style.left = ((hintPos.x + 1) / 2 * innerWidth).toFixed(1) + 'px'; $('hint').style.top = ((1 - hintPos.y) / 2 * innerHeight).toFixed(1) + 'px';
  }
  renderer.render(scene, camera);
  if (snapWant >= 0) { snapWant -= dt; if (snapWant < 0) { snapShot(); } }
  requestAnimationFrame(frame);
}

// ===== Xに投稿（ゴールが決まった瞬間の画面を画像にして付ける）=====
const SHARE_URL = 'https://keifurukawafunnych.com/games/robo-soccer/', TAG = '#ロボサッカーゲーム';
let shareFile = null;
const snapCv = document.createElement('canvas'); snapCv.width = snapCv.height = 1080;
const rawCv = document.createElement('canvas'); rawCv.width = rawCv.height = 1080;
function snapShot() {
  // ゴールのあたりが入るように正方形で切り抜く（描画した直後なので canvas から読める）
  const src = renderer.domElement, W = src.width, H = src.height;
  const v = tmpA.set(ballMesh.position.x * 0.5, 0.7, (ballMesh.position.z + me.parts.pelvis.body.translation().z) / 2).project(camera);
  const side = Math.min(W, H) * 0.92;
  let sx = (v.x + 1) / 2 * W - side / 2, sy = (1 - v.y) / 2 * H - side / 2;
  sx = Math.max(0, Math.min(W - side, sx)); sy = Math.max(0, Math.min(H - side, sy));
  const r = rawCv.getContext('2d'); r.fillStyle = '#132038'; r.fillRect(0, 0, 1080, 1080);
  r.drawImage(src, sx, sy, side, side, 0, 0, 1080, 1080);
  snapDone = true;
  updateShare();
}
function updateShare() {
  const done = state === 'over';
  const text = `${t('title')} ${done ? `${goals}-${opp} ${t(goals > opp ? 'win' : 'lose')}${streak > 1 ? ' ' + t('streak')(streak) : ''}` : ''}\n${TAG}`;
  const a = $('share');
  a.href = 'https://x.com/intent/post?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(SHARE_URL);
  if (matchMedia('(pointer: coarse)').matches) a.removeAttribute('target'); else { a.target = '_blank'; a.rel = 'noopener'; }
  a.dataset.text = text;
  if (!snapDone) return;
  const x = snapCv.getContext('2d');
  x.drawImage(rawCv, 0, 0);
  const g = x.createLinearGradient(0, 760, 0, 1080); g.addColorStop(0, 'rgba(7,11,22,0)'); g.addColorStop(1, 'rgba(7,11,22,0.88)');
  x.fillStyle = g; x.fillRect(0, 760, 1080, 320);
  x.fillStyle = '#fff'; x.textBaseline = 'alphabetic';
  const F = 'system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif';
  // 「3 - 2」（自分はオレンジ、相手は青）
  x.font = `900 180px ${F}`;
  let px = 64;
  for (const [str, col] of [[String(goals), '#ffb37a'], [' - ', 'rgba(255,255,255,.8)'], [String(opp), '#8ab8ff']]) { x.fillStyle = col; x.fillText(str, px, 1004); px += x.measureText(str).width; }
  x.fillStyle = '#fff';
  x.font = `700 50px ${F}`; x.globalAlpha = 0.85; x.textAlign = 'right';
  x.fillText(t('title'), 1016, 1004); x.globalAlpha = 1; x.textAlign = 'left';
  // 共有用ファイルは先に作っておく（押した時に作ると Safari で共有が止まる）
  snapCv.toBlob(b => { if (b) shareFile = new File([b], 'robo-soccer.png', { type: 'image/png' }); }, 'image/png');
}
$('share').addEventListener('click', e => {
  const text = $('share').dataset.text;
  if (matchMedia('(pointer: coarse)').matches) {
    if (navigator.share && shareFile && navigator.canShare?.({ files: [shareFile] })) {
      e.preventDefault();
      navigator.share({ files: [shareFile], text: `${text}\n${SHARE_URL}` }).catch(() => {});
    }
  } else if (shareFile) {
    const u = URL.createObjectURL(shareFile), d = document.createElement('a');
    d.href = u; d.download = 'robo-soccer.png'; document.body.appendChild(d); d.click(); d.remove();
    setTimeout(() => URL.revokeObjectURL(u), 4000);
  }
});

// ===== はじめ =====
updateShare();
renderer.compile(scene, camera);
renderer.render(scene, camera);
requestAnimationFrame(t0 => { last = t0; frame(t0); });
</script>
<script src="../../ad.js" data-result="#result" data-inline="#adSlot"></script>
