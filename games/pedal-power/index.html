    let ac = null, whirOsc = null, whirGain = null;
    function initAudio() {
      if (ac) return;

        ac = new (window.AudioContext || window.webkitAudioContext)();

    addEventListener('pointerdown', initAudio, { capture: true });
    addEventListener('keydown', initAudio, { capture: true });
    let lastWhir = -1;
    function setWhir(w) {
      if (!ac) return;

      const q = Math.round(v * 1000) + Math.round(w);
      if (q === lastWhir) return; lastWhir = q;
      const now = ac.currentTime;
      whirGain.gain.setTargetAtTime(v, now, 0.05);
      whirOsc.frequency.setTargetAtTime(50 + w * 9, now, 0.05);
    }
    function chime(level) {
      if (!soundOn || !ac) return;
      const now = ac.currentTime;
      [0, 4, 7, 12].forEach((s, i) => {
        const o = ac.createOscillator(); o.type = 'triangle';

        g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.18, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.4);

      const d = buf.getChannelData(0);

    // ---------- 3D ----------

      seat: mat(0x222222), gen: mat(0xf2b531), cable: mat(0x333333),
      white: mat(0xf6f2ea), gray: mat(0x8a8f96), wood: mat(0x9a6a3a), red: mat(0xd83a2e), blue: mat(0x3a6ad8), green: mat(0x4aa84a),
      cream: mat(0xf2e6c8), screen: new THREE.MeshBasicMaterial({ color: 0x223040 }), glass: new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.55 }),
      flame: new THREE.MeshBasicMaterial({ color: 0xffa020 }), cyan: new THREE.MeshBasicMaterial({ color: 0x9adfff, transparent: true, opacity: 0.8 }),

    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    const UP = new THREE.Vector3(0, 1, 0);

    const cylGeo = new THREE.CylinderGeometry(1, 1, 1, 10);
    // 2点の間に丸い棒を置く
    function rod(m, r) { const c = new THREE.Mesh(cylGeo, m); c.userData.r = r; return c; }
    const _d = new THREE.Vector3();

    // ---------- 自転車（+x が前） ----------
    const bike = new THREE.Group(); scene.add(bike);

      for (let i = 0; i < 6; i++) { const s = box(0.012, WR * 2 - 0.06, 0.012, M.metal); s.rotation.z = i * Math.PI / 6; g.add(s); }
      g.add(new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.1, 10).rotateX(Math.PI / 2), M.dark));

    }
    const rearWheel = wheel(); rearWheel.position.copy(REAR); bike.add(rearWheel);
    const frontWheel = wheel(); frontWheel.position.copy(FRONT); bike.add(frontWheel);

    fixedRod(bike, M.frame, 0.026, CRANK, V(HEAD.x, HEAD.y - 0.06));
    fixedRod(bike, M.frame, 0.022, V(SEAT.x + 0.02, SEAT.y - 0.1), HEAD);
    fixedRod(bike, M.frame, 0.02, HEAD, BAR);
    fixedRod(bike, M.dark, 0.016, V(BAR.x, BAR.y, -0.24), V(BAR.x, BAR.y, 0.24));
    for (const z of [-0.2, 0.2]) fixedRod(bike, M.black, 0.024, V(BAR.x, BAR.y, z), V(BAR.x, BAR.y, z + Math.sign(z) * 0.06));

      fixedRod(bike, M.gray, 0.02, V(REAR.x + 0.25, 0.01, z), V(REAR.x, REAR.y, z * 0.4));
    }
    const gen = new THREE.Group(); gen.position.set(REAR.x - 0.12, 0.07, 0); bike.add(gen);
    gen.add(box(0.26, 0.14, 0.22, M.gen, 0, 0, 0));
    const genRoller = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.05, 10).rotateX(Math.PI / 2), M.dark); genRoller.position.set(0.06, 0.06, 0); gen.add(genRoller);
    const genLamp = new THREE.Mesh(new THREE.SphereGeometry(0.03, 8, 6), new THREE.MeshBasicMaterial({ color: 0x553300 })); genLamp.position.set(-0.08, 0.08, 0.1); gen.add(genLamp);
    // クランクとペダル

    const arms = [], pedals = [];
    for (const s of [1, -1]) {
      const arm = box(0.035, CR, 0.02, M.metal); arm.geometry.translate(0, CR / 2, 0); arm.position.z = s * 0.1; crankG.add(arm); arms.push(arm);
      const p = box(0.1, 0.025, 0.08, M.dark); p.position.z = s * 0.15; bike.add(p); pedals.push(p);
    }

    const man = new THREE.Group(); scene.add(man);

    const armsH = [1, -1].map(s => ({ s, up: rod(M.shirt, 0.05), fore: rod(M.skin, 0.04), elbow: new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 6), M.skin), hand: new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 6), M.skin) }));
    for (const l of legs) man.add(l.thigh, l.shin, l.knee, l.foot);

    const torso = new THREE.Group(); man.add(torso);
    const body = box(0.26, 0.52, 0.34, M.shirt, 0, 0.26, 0); torso.add(body);

    // 2関節の逆運動学: 根元 a から先端 p に届く関節の位置（dir=+1 で前に曲がる）
    function ik2(a, p, l1, l2, dir) {
      const dx = p.x - a.x, dy = p.y - a.y;
      let d = Math.hypot(dx, dy); d = Math.min(Math.max(d, Math.abs(l1 - l2) + 1e-3), l1 + l2 - 1e-3);

      tg.setTransform(1, 0, 0, 1, 0, 0); tg.clearRect(0, 0, trailCv.width, trailCv.height);
      tg.setTransform(k, 0, 0, k, 0, 0); tg.lineCap = 'round';
      for (let i = 1; i < trail.length; i++) {
        const p = trail[i], q = trail[i - 1];
        if (p.start) continue;
        const f = 1 - (now - p.t) / life;
        tg.strokeStyle = `rgba(255, 150, 60, ${f * 0.85})`; tg.lineWidth = 4 + f * 14;
        tg.beginPath(); tg.moveTo(q.x, q.y); tg.lineTo(p.x, p.y); tg.stroke();
      }
      trailDrawn = trail.length > 0;
    }
    function draw(alpha, dtReal) {
      const th = prevTheta + (theta - prevTheta) * alpha;
      const now = performance.now() / 1000;
      crankG.rotation.z = th - Math.PI / 2;
      arms[1].rotation.z = Math.PI;
      rearWheel.rotation.z = th * 2.6;
      genRoller.rotation.z = -th * 18;
      genLamp.material.color.setRGB(0.3 + Math.min(1, watt / 300) * 0.7, 0.2 + Math.min(1, watt / 300) * 0.7, 0);
      poseMan(th, watt, now);
      // 汗: 強く漕ぐと飛ぶ
      const hard = watt > 500;
      for (const s of sweat) {
        s.t += dtReal * 1.8;
        if (s.t >= 1) { if (hard) { s.t = 0; const p = headG.getWorldPosition(new THREE.Vector3()); s.m.position.set(p.x - 0.05, p.y + 0.1, (Math.random() - 0.5) * 0.2); s.vx = -0.3 - Math.random() * 0.4; s.vy = 0.8 + Math.random() * 0.5; s.m.visible = true; } else s.m.visible = false; }
        else { s.vy -= 4 * dtReal; s.m.position.x += s.vx * dtReal; s.m.position.y += s.vy * dtReal; }
      }
      if (cur) {
        // 新しい機械は上から落ちてくる
        const k = Math.min(1, enter / 0.2);
        cur.g.position.y = (1 - k) * (1 - k) * 2.5;
        const lv = state === 'play' ? charge : 0;
        cur.g.rotation.z = act < 0 ? (Math.random() - 0.5) * lv * 0.03 : 0;
        cur.tick(lv, act, dtReal);
      }
      flash = Math.max(0, flash - dtReal * 3);
      hemi.intensity = 1.2 + flash * 1.2;

      if (state === 'play') {
        const g = Math.max(0, timeLeft / PLAY_TIME), q = Math.round(g * 400);
        if (q !== lastTimer) { lastTimer = q; timerBar.style.transform = `scaleX(${g})`; timerBar.style.background = g < .2 ? '#e0473a' : '#f2a531'; }
        // メーター: 必要な電力の線を 2/3 の高さに
        const need = MACHINES[mi].need;
        const f = Math.min(1, watt / (need * 1.5));
        const ok = watt >= need;
        const key = Math.round(f * 200) + (ok ? 'o' : 'x') + (act >= 0 ? 'a' : '');
        if (key !== lastMeter) { lastMeter = key; meterBar.style.transform = `scaleY(${f})`; meterBar.style.background = act >= 0 ? '#ffd040' : ok ? '#4aa84a' : '#f2a531'; }
      }
      if (state === 'play') {
        const wt = `${Math.round(watt)}W`;
        if (wt !== lastWatt) { lastWatt = wt; wattEl.textContent = wt; }
      }
      drawTrail();
      // 遊び方は回る矢印で見せる
      const showHint = state === 'title' || (state === 'play' && !everDragged);
      const [hx, hy] = crankScreen();
      const hk = showHint ? `${Math.round(hx)},${Math.round(hy)}` : 'none';
      if (hk !== lastHint) { lastHint = hk; hint.style.display = showHint ? 'block' : 'none'; if (showHint) { hint.style.left = hx + 'px'; hint.style.top = hy + 'px'; } }
      if (whirOsc) setWhir(Math.sqrt(watt));
      renderer.render(scene, camera);
    }

    function resize() {
      const w = stage.clientWidth, h = stage.clientHeight;
      renderer.setSize(w, h, false);
      const pr = Math.min(devicePixelRatio, 2); trailCv.width = w * pr; trailCv.height = h * pr; trailDrawn = true;
      camera.aspect = w / Math.max(1, h); camera.updateProjectionMatrix();
      layout();
      const hs = Math.max(70, Math.min(160, Math.min(w, h) * 0.28));
      hint.style.width = hint.style.height = hs + 'px'; hint.style.margin = `${-hs / 2}px 0 0 ${-hs / 2}px`;
      lastHint = '';
    }
    new ResizeObserver(resize).observe(stage);
    resize();

    let needSnap = false;
    let acc = 0, last = performance.now();
    function loop(tm) {
      const dt = Math.min(0.05, (tm - last) / 1000); last = tm;
      acc += dt;
      while (acc >= DT) { step(); acc -= DT; }
      draw(acc / DT, dt);
      if (needSnap) { needSnap = false; takeSnap(); prepareShare(); }
      requestAnimationFrame(loop);
    }

    // ---------- 画面 ----------
    const controls = document.getElementById('controls');
    const resultEl = document.getElementById('result');
    let finalN = 0, finalW = 0;
    const shareText = () => t('share')(finalN, finalW);
    function renderControls() {
      controls.innerHTML = '';
      controls.classList.toggle('hide', state === 'play');
      if (state === 'play') return;
      const b = document.createElement('button');
      b.className = 'go'; b.textContent = state === 'result' ? t('again') : t('start');
      b.addEventListener('click', start);
      controls.append(b);
      if (state === 'result') {
        const a = document.createElement('a');
        a.className = 'post'; a.textContent = t('post');
        a.href = `https://x.com/intent/post?text=${encodeURIComponent(shareText())}&url=${encodeURIComponent(SHARE_URL)}`;
        const coarse = matchMedia('(pointer: coarse)').matches;
        if (!coarse) { a.target = '_blank'; a.rel = 'noopener'; }
        // スマホは画像ごと共有シートへ。PCは画像を保存してから投稿画面を開く
        a.addEventListener('click', e => {
          const text = shareText();
          if (coarse && navigator.share) {
            e.preventDefault();
            const file = shareFile();
            const data = file && navigator.canShare?.({ files: [file] }) ? { files: [file], text: `${text}\n${SHARE_URL}` } : { text: `${text}\n${SHARE_URL}` };
            navigator.share(data).catch(() => {});
            return;
          }
          const img = resultImage();
          if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'pedal-power.png'; d.click(); }
        });
        controls.append(a);
      }
    }
    // 結果画像: 結果が出た瞬間の3D画面（自転車を中心に）に、台数と最高出力を重ねる
    let snap = null, shareCache = null;
    function takeSnap() {
      const src = renderer.domElement, side = Math.min(src.width, src.height);
      const [cx, cy] = crankScreen(), sc = src.width / stage.clientWidth;
      let sx = cx * sc - side / 2, sy = cy * sc - side * 0.58;
      sx = Math.max(0, Math.min(src.width - side, sx)); sy = Math.max(0, Math.min(src.height - side, sy));
      snap = document.createElement('canvas'); snap.width = snap.height = 1080;
      snap.getContext('2d').drawImage(src, sx, sy, side, side, 0, 0, 1080, 1080);
      shareCache = null;
    }
    function resultImage() {
      if (!snap) return null;
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const g = c.getContext('2d');
      g.drawImage(snap, 0, 0);
      g.textAlign = 'center'; g.fillStyle = '#fff'; g.lineJoin = 'round';
      const font = px => `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans Thai", sans-serif`;
      const text = (str, y, px, max) => {
        g.font = font(px);
        const w = g.measureText(str).width; if (w > max) { px *= max / w; g.font = font(px); }
        g.lineWidth = px * .16; g.strokeStyle = '#8a5a1a'; g.strokeText(str, 540, y); g.fillText(str, 540, y);
      };
      text(t('count')(finalN), 200, 170, 960);
      text(t('peak')(finalW), 300, 76, 960);
      text(t('title'), 1030, 52, 900);
      return c;
    }
    function prepareShare() {
      if (!snap) return;
      const key = lang;
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'pedal-power.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;
    function start() {
      reset();
      state = 'play'; lastTimer = -1; lastMeter = ''; everDragged = false;
      timerEl.style.display = 'block'; meterEl.style.display = 'block'; wattEl.style.display = 'block'; lastWatt = ''; resultEl.style.display = 'none';
      renderControls();
    }
    function showResult() {
      resultEl.children[0].textContent = t('count')(finalN);
      resultEl.children[1].textContent = t('peak')(finalW);
    }
    function finish() {
      state = 'result'; finalN = done; finalW = Math.round(peak);
      ptr = null; dragging = false;
      timerEl.style.display = 'none'; meterEl.style.display = 'none'; wattEl.style.display = 'none';
      showResult();
      resultEl.style.display = 'flex';
      snap = null; needSnap = true;
      renderControls();
    }

    reset();
    applyLang();
    // 最初のフレームで固まらないよう、先に1回描いておく
    draw(1, 0);
    requestAnimationFrame(t0 => { last = t0; requestAnimationFrame(loop); });
  </script>
</body>
</html>
