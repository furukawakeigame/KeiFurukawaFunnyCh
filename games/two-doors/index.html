<script type="module">

 ja:{title:'2択ゲーム',loadErr:'3Dの読み込みに失敗しました。通信を確認して再読み込みしてください',back:'← トップへ戻る',retry:'もう一度',share:'X に投稿',rooms:n=>`${n}部屋`,best:n=>`自己ベスト ${n}部屋`,newBest:'自己ベスト更新',saved:'画像を保存しました',dex:(n,m)=>`死 ${n}/${m}`,shareText:n=>`2択ゲームで${n}部屋まで進んだ\n${TAG}`},

};
const LANGS=['ja','ko','en','th'];
let lang=null;try{lang=localStorage.getItem('two-doors-lang')}catch{}
if(!LANGS.includes(lang)){lang='en';for(const l of navigator.languages||[navigator.language||'']){const k=String(l).toLowerCase().slice(0,2);if(LANGS.includes(k)){lang=k;break}}}
const t=k=>L[lang][k];

let sound=true;try{sound=localStorage.getItem('two-doors-sound')!=='0'}catch{}

// ---- 音 ----
let ac=null;
function tone(f,d,v=.08,type='square',slide=0,delay=0){if(!sound)return;try{ac=ac||new AudioContext();if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,s);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),s+d);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g).connect(ac.destination);o.start(s);o.stop(s+d)}catch{}}
function noise(d,v=.15,delay=0){if(!sound)return;try{ac=ac||new AudioContext();const b=ac.createBuffer(1,ac.sampleRate*d,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=ac.createBufferSource(),g=ac.createGain();s.buffer=b;g.gain.value=v;s.connect(g).connect(ac.destination);s.start(ac.currentTime+delay)}catch{}}
const SFX={
 creak:()=>tone(180,.18,.05,'sawtooth',-80),
 win:()=>{tone(880,.08,.06);tone(1320,.12,.05,'square',0,.06)},
 pit:()=>tone(700,.7,.08,'triangle',-640),crush:()=>{noise(.5,.4,.2);tone(60,.4,.2,'sine',-30,.2)},
 spikes:()=>{tone(1200,.08,.08,'sawtooth',-400,.1);noise(.2,.2,.12)},fire:()=>noise(.8,.25),
 monster:()=>{tone(90,.6,.15,'sawtooth',-40);noise(.15,.4,.33)},bolt:()=>{noise(.8,.5,.12);tone(50,.6,.2,'square',0,.12)},
 flood:()=>noise(.9,.2),boulder:()=>{tone(50,1,.18,'sine',20);noise(.4,.4,.3)},
 ghost:()=>{tone(500,1,.05,'sine',300);tone(510,1,.04,'sine',290)},arrows:()=>{for(let i=0;i<4;i++)tone(900,.07,.06,'square',-500,.12+i*.07)}
};

// ---- 3D ----
const THREE=await import('three').catch(()=>null);
const W=360,H=560,RW=7,RH=4,RD=9,DXW=1.6,DOW=1.2,DOH=2.4,EYE=1.55,BACK=1.3;
// 開けたドアの画面上の位置（死に方の2D演出はこれに合わせて描く）
let FL=400,DW=88,DH=170,DY=315;
const cv=$('c'),cx=cv.getContext('2d');let gl=null,renderer,scene,camera,scale=1,rooms=[];
function ell(c,x,y,rx,ry,col){c.fillStyle=col;c.beginPath();c.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,7);c.fill()}
// ---- 質感（テクスチャはすべて Canvas で描く） ----
const rnd=(a,b)=>a+Math.random()*(b-a);
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;return t}
function speckle(g,w,h,n,a){for(let i=0;i<n;i++){g.fillStyle=Math.random()<.5?`rgba(0,0,0,${a})`:`rgba(255,255,255,${a})`;g.fillRect(Math.random()*w,Math.random()*h,1.5,1.5)}}
// 壁紙：縦じまと小さな菱形の模様
const wallTex=hue=>canvasTex(256,256,(g,w,h)=>{
 g.fillStyle=`hsl(${hue},26%,58%)`;g.fillRect(0,0,w,h);
 for(let x=0;x<w;x+=64){g.fillStyle=`hsl(${hue},26%,62%)`;g.fillRect(x+16,0,32,h);g.fillStyle=`hsla(${hue},30%,40%,.35)`;g.fillRect(x+15,0,1,h);g.fillRect(x+48,0,1,h);
  for(let y=0;y<h;y+=64){g.fillStyle=`hsla(${hue},30%,45%,.35)`;g.beginPath();g.moveTo(x+32,y+24);g.lineTo(x+40,y+32);g.lineTo(x+32,y+40);g.lineTo(x+24,y+32);g.fill()}}
 speckle(g,w,h,5000,.05)});
// 床：木の板張り（板の継ぎ目と木目）
const floorTex=()=>canvasTex(512,512,(g,w,h)=>{
 // 板の並びが上下でつながるように、1枚分の列を作ってから上下にずらして3回描く
 const pw=w/6;for(let i=0;i<6;i++){const y0=-rnd(0,300),segs=[];let y=y0;while(y<y0+h){const len=Math.min(rnd(180,360),y0+h-y);segs.push([y,len,`hsl(${rnd(25,30)},${rnd(40,46)}%,${rnd(27,32)}%)`,Math.random()*9]);y+=len}
  for(const sh of[-h,0,h])for(const [y,len,col,ph] of segs){const yy=y+sh;g.fillStyle=col;g.fillRect(i*pw,yy,pw,len);
   for(let k=0;k<14;k++){g.strokeStyle=`rgba(40,20,5,${.08+((k*7+ph)%5)*.03})`;g.lineWidth=.5+(k%3)*.5;g.beginPath();const x0=i*pw+2+((k*37+ph*11)%(pw-4));g.moveTo(x0,yy);for(let q=yy;q<yy+len;q+=20)g.lineTo(x0+Math.sin(q*.03+k)*2,q);g.stroke()}
   g.fillStyle='rgba(0,0,0,.55)';g.fillRect(i*pw,yy,pw,1.5)}
  g.fillStyle='rgba(0,0,0,.6)';g.fillRect(i*pw,0,1.5,h)}
 speckle(g,w,h,4000,.05)});
const ceilTex=()=>canvasTex(128,128,(g,w,h)=>{g.fillStyle='#d9d3c7';g.fillRect(0,0,w,h);speckle(g,w,h,1500,.06)});
// ドアの木目
const woodTex=col=>canvasTex(256,512,(g,w,h)=>{g.fillStyle=col;g.fillRect(0,0,w,h);for(let k=0;k<70;k++){g.strokeStyle=`rgba(${Math.random()<.5?'40,20,5':'255,230,200'},${rnd(.05,.16)})`;g.lineWidth=rnd(.6,2.2);g.beginPath();const x0=rnd(0,w);g.moveTo(x0,0);for(let y=0;y<=h;y+=16)g.lineTo(x0+Math.sin(y*.012+k*1.7)*rnd(2,5),y);g.stroke()}speckle(g,w,h,3000,.05)});
const std=o=>new THREE.MeshStandardMaterial({envMapIntensity:.35,...o});
// 壁は面ごとに分かれているので、模様の位置（offset）を揃えてつなぎ目を消す
const rep=(t,x,y,ox=0,oy=0)=>{const c=t.clone();c.repeat.set(x,y);c.offset.set(ox,oy);c.needsUpdate=true;return c};
const plane=(w,h,m)=>new THREE.Mesh(new THREE.PlaneGeometry(w,h),m);
const box=(w,h,d,m)=>{const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);b.castShadow=b.receiveShadow=true;return b};
// ドアの色は固定：左が青、右が赤（ペンキ塗り）
const doorMat=i=>std({color:i?'#a3222a':'#1f4f94',roughness:.38});
// 部屋：奥の壁(z=oz)にドアが2枚。手前側は開いていて、前の部屋のドアからそのまま入ってこられる
function buildRoom(rx,oz,lv){
 const hue=(28+lv*37)%360,g=new THREE.Group(),wt=wallTex(hue),trim=std({color:'#ece6da',roughness:.55}),brass=std({color:'#c9a85a',metalness:1,roughness:.25,envMapIntensity:1});
 g.position.set(rx,0,oz);
 const fl=floorTex();fl.repeat.set(RW/1.8,RD/1.8);const f=plane(RW,RD,std({map:fl,roughness:.5}));f.rotation.x=-Math.PI/2;f.position.set(0,0,RD/2);f.receiveShadow=true;g.add(f);
 const ct=ceilTex();ct.repeat.set(3,4);const ce=plane(RW,RD,std({map:ct,roughness:1}));ce.rotation.x=Math.PI/2;ce.position.set(0,RH,RD/2);g.add(ce);
 for(const sd of[-1,1]){const w=plane(RD,RH,std({map:rep(wt,RD/1.1,RH/1.1),roughness:.92}));w.rotation.y=-sd*Math.PI/2;w.position.set(sd*RW/2,RH/2,RD/2);w.receiveShadow=true;g.add(w);
  const bb=box(.03,.14,RD,trim);bb.position.set(sd*(RW/2-.015),.07,RD/2);g.add(bb);const cr=box(.06,.08,RD,trim);cr.position.set(sd*(RW/2-.03),RH-.04,RD/2);g.add(cr)}
 const a=DXW-DOW/2,b=DXW+DOW/2;
 for(const [x0,x1] of [[-RW/2,-b],[-a,a],[b,RW/2]]){const w=plane(x1-x0,DOH,std({map:rep(wt,(x1-x0)/1.1,DOH/1.1,(x0+RW/2)/1.1,0),roughness:.92}));w.position.set((x0+x1)/2,DOH/2,0);w.receiveShadow=true;g.add(w);const bb=box(x1-x0,.14,.03,trim);bb.position.set((x0+x1)/2,.07,.015);g.add(bb)}
 const top=plane(RW,RH-DOH,std({map:rep(wt,RW/1.1,(RH-DOH)/1.1,0,DOH/1.1),roughness:.92}));top.position.set(0,(RH+DOH)/2,0);top.receiveShadow=true;g.add(top);
 const cr=box(RW,.08,.06,trim);cr.position.set(0,RH-.04,.03);g.add(cr);
 // 天井の照明
 const base=new THREE.Mesh(new THREE.CylinderGeometry(.18,.22,.06,24),trim);base.position.set(0,RH-.03,RD/2);g.add(base);
 const bulb=new THREE.Mesh(new THREE.SphereGeometry(.16,24,16),new THREE.MeshStandardMaterial({color:'#fff',emissive:'#ffe2b0',emissiveIntensity:3}));bulb.position.set(0,RH-.2,RD/2);g.add(bulb);
 const doors=[];
 for(const [di,dx] of[[0,-DXW],[1,DXW]]){const dm=doorMat(di);
  for(const sx of[-1,1]){const j=box(.1,DOH+.1,.08,trim);j.position.set(dx+sx*(DOW/2+.05),DOH/2,.04);g.add(j);const jamb=box(.04,DOH,.2,trim);jamb.position.set(dx+sx*(DOW/2-.02),DOH/2,-.1);g.add(jamb)}
  const l=box(DOW+.3,.12,.08,trim);l.position.set(dx,DOH+.06,.04);g.add(l);
  const pv=new THREE.Group();pv.position.set(dx-DOW/2,0,-.04);
  const leaf=box(DOW-.04,DOH-.02,.05,dm);leaf.position.set(DOW/2,DOH/2,0);pv.add(leaf);
  const dm2=dm.clone();dm2.color.multiplyScalar(.82);for(const py of[.3,.73]){const pn=box(DOW*.66,DOH*.33,.03,dm);pn.position.set(DOW/2,DOH*py,.035);pv.add(pn);const pn2=box(DOW*.56,DOH*.28,.03,dm2);pn2.position.set(DOW/2,DOH*py,.055);pv.add(pn2)}
  const rose=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,.02,20),brass);rose.rotation.x=Math.PI/2;rose.position.set(DOW*.86,DOH*.45,.035);pv.add(rose);
  const k=new THREE.Mesh(new THREE.SphereGeometry(.045,20,14),brass);k.position.set(DOW*.86,DOH*.45,.08);k.castShadow=true;pv.add(k);
  for(const hy of[.15,.85]){const hg=box(.02,.1,.03,brass);hg.position.set(.01,DOH*hy,.02);pv.add(hg)}
  g.add(pv);doors.push(pv)}
 scene.add(g);return{g,rx,oz,doors,floor:f};
}
function disposeRoom(r){scene.remove(r.g);r.g.traverse(o=>{o.geometry?.dispose();if(o.material){o.material.map?.dispose();o.material.dispose()}})}
function resetRooms(){if(!scene)return;rooms.forEach(disposeRoom);rooms=[buildRoom(0,0,0)]}
let mainL,nextL;
async function initGL(){
 renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});gl=renderer.domElement;$('stage').insertBefore(gl,cv);
 renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 scene=new THREE.Scene();scene.background=new THREE.Color(0);scene.fog=new THREE.Fog(0,9,24);
 try{const {RoomEnvironment}=await import('three/addons/environments/RoomEnvironment.js');scene.environment=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),.04).texture}catch{}
 camera=new THREE.PerspectiveCamera(60,W/H,.05,60);scene.add(camera);
 const fill=new THREE.PointLight(0xfff0dd,3,0,2);camera.add(fill);
 scene.add(new THREE.HemisphereLight(0xfff2e0,0x2a2018,.4));
 // 光の数が変わるとシェーダーの作り直しで固まるので、照明は2つを使い回す（今の部屋＝影あり、次の部屋）
 mainL=new THREE.PointLight(0xffd6a0,32,0,2);mainL.castShadow=true;mainL.shadow.mapSize.set(512,512);mainL.shadow.bias=-.002;mainL.shadow.normalBias=.03;scene.add(mainL);
 nextL=new THREE.PointLight(0xffd6a0,0,0,2);scene.add(nextL);
 resetRooms();
}
function placeLights(){nextL.color.set(0xffd6a0);const a=rooms[0],b=rooms[1];mainL.position.set(a.rx,RH-.45,a.oz+RD/2);if(b){nextL.position.set(b.rx,RH-.45,b.oz+RD/2);nextL.intensity=32}else nextL.intensity=0}
function fit(){const r=$('stage').getBoundingClientRect(),s=Math.min(r.width/W,r.height/H),dpr=Math.min(devicePixelRatio||1,2);for(const el of[cv,gl]){el.style.width=W*s+'px';el.style.height=H*s+'px'}cv.width=Math.round(W*s*dpr);cv.height=Math.round(H*s*dpr);scale=s*dpr;renderer.setPixelRatio(dpr);renderer.setSize(W*s,H*s,false)}
const lerp=(a,b,k)=>a+(b-a)*k,cl=k=>Math.max(0,Math.min(1,k)),ease=k=>k*k*(3-2*k);
const CZ=RD-BACK;
function redEdge(c,a){const g=c.createRadialGradient(W/2,H/2,H*.15,W/2,H/2,H*.7);g.addColorStop(0,'rgba(120,0,0,0)');g.addColorStop(1,`rgba(120,0,0,${a})`);c.fillStyle=g;c.fillRect(0,0,W,H)}
const veil=(c,col)=>{c.fillStyle=col;c.fillRect(0,0,W,H)};
const shake=a=>{camera.position.x+=(Math.random()-.5)*a;camera.position.y+=(Math.random()-.5)*a};
const softTex=stops=>canvasTex(128,128,(g,w,h)=>{const r=g.createRadialGradient(64,64,0,64,64,64);stops.forEach(([o,c])=>r.addColorStop(o,c));g.fillStyle=r;g.fillRect(0,0,w,h)});
const sprite=(tex,add)=>new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false,fog:false,blending:add?THREE.AdditiveBlending:THREE.NormalBlending}));
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
// 死に方：部屋の中(ローカル座標)に物を置き、k(0〜1)で動かす。カメラはワールド座標なので r.rx / r.oz を足す
// 3Dの後に2Dで重ねるのは、赤み・暗転・閃光だけ
const DEATH3D={
 // 吊り天井：石の天井が落ちてきて床まで押しつぶされる
 crush(r,dx,g){const tex=canvasTex(256,256,(c,w,h)=>{c.fillStyle='#6d6a64';c.fillRect(0,0,w,h);speckle(c,w,h,9000,.14)});tex.repeat.set(3,2);

  const leaves=[];for(const sd of[-1,1]){const pv=new THREE.Group();pv.position.set(sd*HW,0,0);const t=fm.map.clone();t.repeat.set(HW/1.8,2*HW/1.8);t.needsUpdate=true;const l=box(HW,.05,2*HW,std({map:t,roughness:.5}));l.position.set(-sd*HW/2,-.025,0);pv.add(l);g.add(pv);leaves.push(pv)}
  // 石積みの縦穴
  const stone=canvasTex(256,256,(c,w,h)=>{c.fillStyle='#3a332c';c.fillRect(0,0,w,h);for(let y=0;y<h;y+=32)for(let x=-(y/32%2)*32;x<w;x+=64){c.fillStyle=`hsl(30,${rnd(8,16)}%,${rnd(30,42)}%)`;c.fillRect(x+2,y+2,60,28)}speckle(c,w,h,9000,.18)});
  const D=14;for(let i=0;i<4;i++){const t=stone.clone();t.repeat.set(1,D/1.4);t.needsUpdate=true;const m=plane(2*HW,D,std({map:t,roughness:.95}));const a=i*Math.PI/2;m.position.set(-Math.sin(a)*HW,-D/2,-Math.cos(a)*HW);m.rotation.y=a;m.receiveShadow=true;g.add(m)}
  const bot=plane(2*HW,2*HW,std({color:'#1a1612',roughness:1}));bot.rotation.x=-Math.PI/2;bot.position.y=-D;g.add(bot);
  r.pit={g,leaves}}
 // ガタッと足元を見る → 床が割れて開く → 落ちながら仰向けになり、入口を見上げる
 const look=ease(cl(dk/.1)),op=ease(cl((dk-.1)/.12));r.pit.leaves.forEach((l,i)=>l.rotation.z=(i?1:-1)*op*1.55);
 const f=cl((dk-.2)/.75),fallY=12*f*f;camera.position.y=EYE-fallY;camera.position.z=hz+.25*look;
 camera.rotation.x=dk<.28?-1.05*look:lerp(-1.05,1.45,ease(cl((dk-.28)/.3)));camera.rotation.z=Math.sin(dk*7)*.1*cl((dk-.2)*4);if(dk>.08&&dk<.2)shake(.035)
}
// カメラとドアを動かし、開けたドアの画面上の中心xを返す
function update(dk){
 const r=rooms[0],dx=r.rx+(side?DXW:-DXW),hz=r.oz+RD-BACK;
 r.doors.forEach((d,i)=>d.rotation.y=phase!=='idle'&&i===side?(phase==='open'?ease(cl(pt/.22)):1)*1.75:0);
 camera.position.set(r.rx,EYE,hz);camera.rotation.set(0,0,0);
 placeLights();
 if(phase==='idle'){const tm=performance.now()/1000;camera.position.y+=Math.sin(tm*1.4)*.012;camera.position.x+=Math.sin(tm*.9)*.01}
 scene.fog.color.set(0);scene.fog.near=9;scene.fog.far=24;
 if(phase==='death'){if(death==='pit')fall(r,dk,hz);else{if(r.fx?.name!==death){const g=new THREE.Group();r.g.add(g);r.fx={name:death,fn:DEATH3D[death](r,side?DXW:-DXW,g)}}r.fx.fn(dk)}}
 // 当たり：先に横へ寄ってから、ドアをくぐって次の部屋の定位置まで歩く
 if(phase==='enter'){const k=cl(pt/.5);camera.position.x=lerp(r.rx,dx,ease(cl(k*1.8)));camera.position.z=lerp(hz,r.oz-BACK,ease(k));camera.position.y=EYE+Math.sin(k*Math.PI*3)*.04}
 camera.updateMatrixWorld();
 pv=pv||new THREE.Vector3();const pr=(x,y)=>{pv.set(x,y,r.oz).project(camera);return[(pv.x+1)/2*W,(1-pv.y)/2*H]};
 const [x0,y0]=pr(dx-DOW/2,DOH),[x1,y1]=pr(dx+DOW/2,0);DW=x1-x0;DH=y1-y0;FL=y1;DY=(y0+y1)/2;return(x0+x1)/2;
}
function render(){
 const dk=phase==='death'?cl(pt/1.3):0,x=update(dk);renderer.render(scene,camera);
 cx.setTransform(scale,0,0,scale,0,0);cx.clearRect(0,0,W,H);cx.fillStyle=vig||(vig=(()=>{const v=cx.createRadialGradient(W/2,H*.45,H*.25,W/2,H*.45,H*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.55)');return v})());cx.fillRect(0,0,W,H);
 if(phase==='death'){OVERLAY[death](cx,dk)}
}
let last=performance.now();
function loop(now){const dt=Math.min(.1,(now-last)/1000);last=now;step(dt);render();requestAnimationFrame(loop)}

// ---- 入力 ----
$('stage').addEventListener('pointerdown',e=>{if(e.target.closest('.panel'))return;e.preventDefault();const r=e.currentTarget.getBoundingClientRect();choose((e.clientX-r.left)<r.width/2?0:1)});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')choose(0);else if(e.key==='ArrowRight')choose(1);else if((e.key==='Enter'||e.key===' ')&&mode!=='play'&&document.activeElement.tagName!=='A'&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();begin()}});
function begin(){mode='play';level=0;phase='idle';pt=0;death=null;resetRooms();$('result').hidden=true;tone(440,.1,.05)}
$('retry').onclick=begin;

// ---- 結果・共有 ----
function resultImage(){
 const S=1080,c=document.createElement('canvas');c.width=c.height=S;const g=c.getContext('2d');
 g.fillStyle='#000';g.fillRect(0,0,S,S);
 render();const k=S/H*.86,ox=(S-W*k)/2;g.drawImage(gl,ox,0,W*k,H*k);g.drawImage(cv,ox,0,W*k,H*k);
 g.fillStyle='rgba(0,0,0,.6)';g.fillRect(0,S*.8,S,S*.2);
 g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';
 g.font='800 96px system-ui,"Hiragino Sans","Noto Sans JP","Noto Sans KR","Noto Sans Thai",sans-serif';g.fillText(t('rooms')(level),S/2,S*.87);g.font='700 48px system-ui,"Hiragino Sans","Noto Sans JP","Noto Sans KR","Noto Sans Thai",sans-serif';g.fillText(t('dex')(seen.length,DKEYS.length),S/2,S*.955);
 return c;
}
let shareFile=null,shareKey='';
function prepareShare(){if(mode!=='result')return;const key=lang+':'+level+':'+death;if(key===shareKey)return;shareKey=key;shareFile=null;resultImage().toBlob(b=>{if(b&&shareKey===key)shareFile=new File([b],SHARE_NAME,{type:'image/png'})},'image/png')}
const coarse=()=>matchMedia('(pointer: coarse)').matches;
const intent=()=>`https://x.com/intent/post?text=${encodeURIComponent(t('shareText')(level))}&url=${encodeURIComponent(SHARE_URL)}`;
function showResult(){renderResult();$('result').hidden=false;setTimeout(prepareShare,30)}
function renderResult(){$('rooms').textContent=t('rooms')(level);$('dex').textContent=t('dex')(seen.length,DKEYS.length);$('dex').classList.toggle('new',newDeath);$('best').textContent=isNew&&level>0?t('newBest'):t('best')(best);const a=$('share');a.textContent=t('share');a.href=intent();if(coarse()){a.removeAttribute('target');a.removeAttribute('rel')}else{a.target='_blank';a.rel='noopener'}}
$('share').onclick=e=>{
 if(coarse()&&typeof navigator.share==='function'&&shareFile&&navigator.canShare?.({files:[shareFile]})){e.preventDefault();navigator.share({files:[shareFile],text:`${t('shareText')(level)}\n${SHARE_URL}`}).catch(err=>{if(err.name!=='AbortError')location.href=intent()});return}
 if(coarse())return;
 const a=document.createElement('a');a.href=resultImage().toDataURL('image/png');a.download=SHARE_NAME;a.click();$('best').textContent=t('saved')};

// ---- 言語・音 ----
function drawSpeaker(){$('sound').innerHTML=`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>${sound?'<path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/>':'<path d="M16 9l6 6M22 9l-6 6"/>'}</svg>`}
$('sound').onclick=()=>{sound=!sound;try{localStorage.setItem('two-doors-sound',sound?'1':'0')}catch{}drawSpeaker();tone(660,.08,.05)};
function applyLang(){document.documentElement.lang=lang;document.title=t('title');$('lang').value=lang;$('back').textContent=t('back');if(!THREE)$('msg').textContent=t('loadErr');$('retry').textContent=t('retry');if(mode==='result'){renderResult();prepareShare()}}
$('lang').onchange=()=>{lang=$('lang').value;try{localStorage.setItem('two-doors-lang',lang)}catch{}applyLang()};
drawSpeaker();applyLang();
if(THREE){await initGL();addEventListener('resize',fit);fit();requestAnimationFrame(loop)}else{$('msg').hidden=false;$('msg').textContent=t('loadErr')}
</script>
</body>
</html>
