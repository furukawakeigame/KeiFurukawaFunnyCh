          for (const e of EVENTS) { if (e.s < frames[0]) continue; const off = offOfReplay(e.s); if (off >= replayLen()) continue; try { e.f(oc, m, off, 1 / replayRate(e.s)); } catch {} }
          audioBuf = await oc.startRendering();
        } catch { acfg = null; }
      }
      if (job.gen !== videoGen) return;
      const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec: 'avc', width: VW, height: VH, frameRate: REPLAY_FPS },
        ...(acfg ? { audio: { codec: 'aac', numberOfChannels: 2, sampleRate: 44100 } } : {}), fastStart: 'in-memory' });
      job.muxer = muxer; job.failed = false;
      job.enc = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: () => { job.failed = true; } });
      job.enc.configure(cfg);
      if (acfg && audioBuf) {
        try {
          const aenc = new AudioEncoder({ output: (c, m) => muxer.addAudioChunk(c, m), error: () => {} });
          aenc.configure(acfg);
          const L = audioBuf.getChannelData(0), R = audioBuf.getChannelData(1), N = Math.floor(replayLen() * 44100), CH = 4410;
          for (let o = 0; o < N; o += CH) {
            const n = Math.min(CH, N - o), data = new Float32Array(n * 2);
            data.set(L.subarray(o, o + n), 0); data.set(R.subarray(o, o + n), n);
            const ad = new AudioData({ format: 'f32-planar', sampleRate: 44100, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round(o / 44100 * 1e6), data });
            aenc.encode(ad); ad.close();
          }
          job.aenc = aenc;
        } catch {}
      }
      videoJob = job;
    }
    // 録画の映像には、今のキラキラや足もとの光を映さない
    function liveFx(on) { for (const p of sparks) p.s.visible = on && p.life > 0; glow.visible = on; }
    function renderVidFrame(s, n) {
      poseLesson(s, results); liveFx(false);
      screen.material = offMat; recDot.visible = playMark.visible = missGlow.visible = false;
      const pr = renderer.getPixelRatio(), cw = cv.width, ch = cv.height;
      const k = Math.min(1, cw / VW, ch / VH), w = Math.floor(VW * k), h = Math.floor(VH * k);
      fogFor(vidCam);
      renderer.setScissorTest(true);
      renderer.setViewport(0, 0, w / pr, h / pr); renderer.setScissor(0, 0, w / pr, h / pr);
      renderer.render(scene, vidCam);
      renderer.setScissorTest(false); renderer.setViewport(0, 0, innerWidth, innerHeight);
      vctx.drawImage(cv, 0, ch - h, w, h, 0, 0, VW, VH);
      drawOverlay(s, n);
      screen.material = screenMat; liveFx(true);
    }
    // ループの中から呼ぶ。1回で1コマ
    function videoStep() {
      const job = videoJob;
      if (job.cancel) { try { job.enc?.close(); job.aenc?.close(); } catch {} videoJob = null; return; }
      if (job.imageOnly) {
        renderVidFrame(SONG_END + .3, job.n);
        videoJob = null;
        vOut.toBlob(b => { if (!job.cancel && b) { shareImg = new File([b], 'hotpot-dance.png', { type: 'image/png' }); render(); } }, 'image/png');
        return;
      }
      if (job.failed) { try { job.enc.close(); } catch {} videoJob = { ...job, imageOnly: true, failed: false }; return; }
      renderVidFrame(frames[job.i], job.n);
      const f = new VideoFrame(vOut, { timestamp: Math.round(job.i * 1e6 / REPLAY_FPS), duration: Math.round(1e6 / REPLAY_FPS) });
      job.enc.encode(f, { keyFrame: job.i % 60 === 0 }); f.close();
      job.i++;
      if (job.i === frames.length - 1) vOut.toBlob(b => { if (!job.cancel && b) shareImg = new File([b], 'hotpot-dance.png', { type: 'image/png' }); }, 'image/png');
      if (job.i < frames.length) return;
      videoJob = null;
      (async () => {
        await job.enc.flush(); job.enc.close();
        if (job.aenc) { await job.aenc.flush(); job.aenc.close(); }
        job.muxer.finalize();
        if (job.cancel || job.failed || job.gen !== videoGen) return;
        shareFile = new File([job.muxer.target.buffer], 'hotpot-dance.mp4', { type: 'video/mp4' });
        render();
      })().catch(() => {});
    }

    // ---------- UI ----------
    const post = $('post');
    function render() {
      document.documentElement.lang = lang;
      document.title = t('title');
      $('back').textContent = t('back');
      $('lang').value = lang;
      $('sound').innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>${muted ? '<path d="M17 9l5 6M22 9l-5 6"/>' : '<path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>'}</svg>`;
      $('again').querySelector('span').textContent = t('again');
      $('rateL').textContent = t('rate');
      const n = results.length ? score() : 0;
      $('rate').textContent = `${n}%`;
      post.textContent = t('post');
      post.href = `https://x.com/intent/post?text=${encodeURIComponent(t('share')(n))}&url=${encodeURIComponent(SHARE_URL)}`;
      if (!matchMedia('(pointer: coarse)').matches) { post.target = '_blank'; post.rel = 'noopener'; } else post.removeAttribute('target');
      post.classList.toggle('wait', !shareFile && !shareImg);
      if (phase === 'tv' || phase === 'result' || phase === 'outro') layoutPanel();
    }
    function save(file) {
      const d = document.createElement('a');
      d.href = URL.createObjectURL(file); d.download = file.name; d.click();
      setTimeout(() => URL.revokeObjectURL(d.href), 60000);
    }
    let noteTimer = 0;
    function note(k) {
      const m = $('msg'); m.textContent = t(k); m.style.display = 'flex';
      clearTimeout(noteTimer); noteTimer = setTimeout(() => { m.style.display = 'none'; }, 5000);
    }
    post.addEventListener('click', e => {
      const file = shareFile || shareImg;
      if (matchMedia('(pointer: coarse)').matches && navigator.share) {
        // スマホは必ず共有メニュー。動画ができていれば動画つき
        e.preventDefault();
        const text = `${t('share')(score())}\n${SHARE_URL}`;
        const data = file && navigator.canShare?.({ files: [file] }) ? { files: [file], text } : { text };
        navigator.share(data).catch(() => {});
        return;
      }
      if (file) { save(file); note(shareFile ? 'savedPc' : 'savedImg'); }
    });
    $('lang').addEventListener('change', e => { lang = e.target.value; store.set('lang', lang); render(); });
    $('sound').addEventListener('click', () => { muted = !muted; store.set('muted', muted); initAudio(); if (master) master.gain.value = muted ? 0 : .9; render(); });
    render();

    // ---------- ループ ----------
    try { renderer.compile(scene, camera); } catch {}
    let last = performance.now();
    function loop(now) {
      const dt = Math.min(.05, (now - last) / 1000); last = now;
      const clock = now / 1000;
      // 曲
      if (phase === 'play') {
        tickSched(liveSched, now);
        const s = songT(now);
        while (nextJudge < POSES.length && s >= POSES[nextJudge].t) {
          const r = judge(nextJudge, s);
          if (!r) break;
          onJudge(nextJudge, r); nextJudge++;
        }
        paintBar(nextJudge);
        if (s >= SONG_END + .3) endSong();
      }
      if (phase === 'outro') {
        camMix = clamp01((now - outroStart) / 2200);
        if (now - outroStart > 2300) startTV();
      }
      if (phase === 'tv' || phase === 'result') {
        tickSched(replaySched, now);
        camMix = 1;
        if (phase === 'tv' && (now - tvStart) / 1000 - latency() > replayLen()) showPanel();
      }
      // 動画のコマ（画面の描画より先に）
      // 速い端末では時間の余裕があるだけ進める
      const vt0 = performance.now();
      while (videoJob && (videoJob.cancel || phase === 'tv' || phase === 'result' || phase === 'outro')) { videoStep(); if (performance.now() - vt0 > 7) break; }
      // テレビの中身
      let tvS = null;
      if (phase === 'tv' || phase === 'result') {
        const el = (now - tvStart) / 1000 - latency();
        tvS = replaySongAt(phase === 'result' && el > replayLen() ? el % replayLen() : el);
        poseLesson(tvS, results);
        missGlow.visible = false;
      } else if (phase === 'play' || phase === 'outro') poseLesson(songT(now), results.slice(0, nextJudge));
      else for (const d of dancers) applyPose(d, clock, SEN_TL.slice(0, 1), { g: .35 });
      screen.material = offMat; recDot.visible = playMark.visible = false;
      fogFor(tvCam);
      if (tvS !== null) liveFx(false);
      renderer.setRenderTarget(tvRT); renderer.render(scene, tvCam); renderer.setRenderTarget(null);
      screen.material = screenMat; liveFx(true);
      recDot.visible = (phase === 'idle' || phase === 'play') && Math.floor(clock * 1.5) % 2 === 0;
      playMark.visible = phase === 'tv' || phase === 'result';
      missGlow.visible = tvS !== null && inSlow(tvS) && Math.floor(clock * 6) % 2 === 0;
      // 部屋の店員さん（研修が終わったらテレビの方を向く）
      if (phase === 'tv' || phase === 'result' || phase === 'outro') {
        const s = songT(now), turn = smooth((s - SONG_END - 1.0) / .9);
        const tl = [...SEN_TL, { t: SONG_END + .9, p: 'N' }];
        const plTL = [{ t: -1e9, p: 'N' }, ...inputs, { t: SONG_END + .9, p: 'N' }];
        applyPose(me, s, plTL, { g: grooveAt(s), rot: Math.PI * turn });
        seniors.forEach(d => applyPose(d, s, tl, { g: grooveAt(s), rot: Math.PI * turn }));
      }
      // 演出
      fx.glow = Math.max(0, fx.glow - dt * 2.2);
      glowMat.color.setHex(fx.glowCol); glowMat.opacity = fx.glow * .7;
      for (const p of sparks) {
        if (p.life <= 0) continue;
        p.life -= dt; p.v.y -= dt * 2.5; p.s.position.addScaledVector(p.v, dt);
        const k = clamp01(p.life); p.s.scale.setScalar(.12 + .1 * k); p.s.material.opacity = k;
        if (p.life <= 0) p.s.visible = false;
      }
      for (const s of steams) {
        const k = (s.userData.p + clock * .22) % 1;
        s.position.set(Math.sin(k * 9 + s.userData.p * 5) * .12, 1.2 + k * 1.5, 0);
        s.scale.setScalar(.5 + k); s.material.opacity = .14;
      }
      steamMat.opacity = .14 * 1;
      for (const l of lanterns) l.rotation.z = Math.sin(clock * 1.2 + l.userData.ph) * .04;
      if (window.__camOv) window.__camOv(camera, THREE); else placeCamera();
      fogFor(camera);
      renderer.render(scene, camera);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
    window.__hd = { POSES, get phase() { return phase; }, songT: () => songT(performance.now()), get results() { return results; }, input, get shareFile() { return shareFile; }, get shareImg() { return shareImg; }, get frames() { return frames; }, showPanel, skip: sec => { perfStart -= sec * 1000; }, vj: () => videoJob && videoJob.i };
  </script>
</body>
