        p.t += dt;
        if (p.waveT > 0) { p.waveT -= dt; if (p.waveT <= 0) h.pose = 'stand'; }
        if (p.offT > 0) { p.offT -= dt; if (p.offT <= 0 && !p.moving) { h.face.brow = 0.6; h.face.smile = -0.1; } }
        let moveSpeed = 0;
        if (play && p.mode !== 'caught') {
          // 鬼が向こうを向いたら少し遅れて動き出す
          if (holding && !p.moving && p.go !== undefined) { p.go -= dt; if (p.go <= 0 && !(p.kind === 'cautious' && chantP > 0.85) && !(chantDone && p.kind !== 'reckless')) resume(p); }
          if (p.mode === 'move') {
            moveSpeed = p.speed;
            // 慎重な人は「だ」が近づくと止まる。かけ声が終わったら無鉄砲な人以外は止まる
            const stopEarly = holding && ((p.kind === 'cautious' && chantP > 0.85) || (chantDone && p.kind !== 'reckless'));
            const late = !holding && releaseT > p.react + (earlyRelease ? p.surprise : 0);
            if (stopEarly) freeze(p, false);
            else if (late) freeze(p, releaseT > p.react + 0.12);
          }
          if (p.mode === 'settle') {
            // 止まる途中（ここまでは動いている扱い）
            const k = Math.min(1, p.t / 0.22);
            if (p.target) for (const n in p.target) { const b = p.base[n], tg = p.target[n]; h.j[n].rotation.set(b.x + (tg[0] - b.x) * k, b.y + (tg[1] - b.y) * k, b.z + (tg[2] - b.z) * k); }
            if (p.kind === 'sneaky' && watching) moveSpeed = 0.35 * (1 - k * 0.3);
            if (k >= 1 && !(p.kind === 'sneaky' && p.t < 0.9 && watching)) {
              if (p.target) p.base = snapPose(h);
              p.mode = 'frozen'; p.t = 0; p.moving = false;
            }
          }
          if (p.mode === 'frozen') {
            p.frozenT += dt;
            // ぐらぐら揺れて、見られ続けるとこらえきれずに動く
            const a = p.inst * (0.03 + p.frozenT * 0.012);
            const w = p.t * (2.2 + p.inst * 2) + p.wob;
            const b = p.base;
            h.j.spine.rotation.z = b.spine.z + Math.sin(w) * a;
            h.j.pelvis.rotation.z = b.pelvis.z - Math.sin(w) * a * 0.5;
            h.j.shoulderL.rotation.z = b.shoulderL.z + Math.sin(w * 1.3) * a * 1.5;
            h.j.shoulderR.rotation.z = b.shoulderR.z + Math.sin(w * 1.3 + 1) * a * 1.5;
            if (watching && Math.random() < dt * (p.inst * 0.25 + p.frozenT * 0.012)) {
              p.mode = 'slip'; p.t = 0; p.moving = true; sSlip(p);
              h.auto = true; h.pose = 'stand'; h.walkSpeed = 0.9; h.face.open = 0.5; h.face.brow = 1;
            }
          }
          if (p.mode === 'slip') { moveSpeed = 0.6; if (p.t > 0.5) { dust(p.x, p.z + 0.1, 3, 0.25); freeze(p, false); p.inst *= 0.5; } }
        }
        if (p.mode === 'caught') {
          const sx = 1.7 + p.slot * 0.5, sz = -3.0 - p.slot * 0.55;
          const dx = sx - p.x, dz = sz - p.z, d = Math.hypot(dx, dz);
          if (d > 0.05) { const v = Math.min(d, dt * 1.2); p.x += dx / d * v; p.z += dz / d * v; h.root.rotation.y = Math.atan2(dx, dz); h.walkSpeed = 1.1; }
          else { h.walkSpeed = 0; h.root.rotation.y += (Math.atan2(-p.x, -p.z) - h.root.rotation.y) * Math.min(1, dt * 4); }
        }
        if (p.mode === 'run') {
          if (p.t > 0.3) { h.auto = true; h.pose = 'stand'; h.walkSpeed = 3; h.face.smile = 1; h.face.open = 0.5 + 0.3 * Math.sin(p.t * 18); h.root.rotation.y += (Math.PI - h.root.rotation.y) * Math.min(1, dt * 8); p.z -= dt * 3.4; if (!p.laughed) { p.laughed = true; sLaugh(p, 5, rnd(0, 0.3), 0.22); } }
        }
        if (p.mode === 'touch') { h.face.open = 0.45 + 0.35 * Math.sin(p.t * 16); }
        if (moveSpeed > 0) {
          const dz = moveSpeed * dt; p.z += dz;
          // 近づくほど列の間をつめる
          const tz = Math.max(0, Math.min(1, (p.z - TOUCH_Z) / (START_Z - TOUCH_Z)));
          p.x += ((p.lane * (0.15 + 0.85 * tz)) - p.x) * Math.min(1, dt * 2);
          p.stepAcc += dz;
          if (p.stepAcc > h.stepLength * 0.5) { p.stepAcc = 0; sStep(-p.z, p.speed > 1.8); if (p.kind === 'runner') dust(p.x, p.z, 1, 0.25); }
          if (play && p.z >= TOUCH_Z) { touched(p); }
        }
        h.root.position.set(p.x, 0, p.z);
        if (p.mode !== 'run') h.lookAt(camera.position); else h.lookAt(null);
      }
      // 鬼が向こうを向くたびに、驚きやすさを決め直す
      if (holding && holdT < dt * 1.5) people.forEach(p => p.surprise = rnd(0.05, 0.3));

      if (state === 'won' || state === 'touched') {
        endT += dt;
        if (endT > (state === 'won' ? 1.4 : 2.4)) finish();
      }
      stepDust(dt);
    }

    // ---------- 画面サイズ・カメラ ----------
    let viewH = 1;
    function resize() {
      const w = stage.clientWidth, H = stage.clientHeight;
      renderer.setSize(w, H, false);
      const btnH = Math.min(80, Math.max(60, 0.09 * Math.min(innerWidth, innerHeight))) + 14;
      const reserve = Math.max(0, stage.getBoundingClientRect().bottom - controls.getBoundingClientRect().bottom) + btnH;
      stage.style.setProperty('--reserve', reserve + 'px');
      const h = Math.max(140, H - reserve);
      viewH = h;
      camera.aspect = w / h;
      // 横は約58度（縦長の画面では約48度）見えるようにして、縦長では縦を広げる
      const half = THREE.MathUtils.lerp(24, 29, THREE.MathUtils.clamp((camera.aspect - 0.6) / 0.6, 0, 1));
      const vf = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(half)) / camera.aspect);
      camera.fov = THREE.MathUtils.clamp(THREE.MathUtils.radToDeg(vf), 42, 82);
      camera.setViewOffset(w, h, 0, 0, w, H);
      camera.updateProjectionMatrix();
    }
    addEventListener('resize', resize);
    const look = new THREE.Vector3();
    function placeCamera(time) {
      const e = turnP < 0.5 ? 2 * turnP * turnP : 1 - (-2 * turnP + 2) ** 2 / 2;
      const yaw = e * Math.PI;
      let shake = 0;
      if (state === 'touched') shake = Math.max(0, 0.04 * (1 - endT * 2));
      camera.position.set(Math.sin(yaw) * 0.08 + Math.sin(time * 60) * shake, EYE + Math.sin(time * 1.3) * 0.006, 0);
      const pitch = THREE.MathUtils.lerp(-0.07, -0.16, e) + (state === 'touched' ? 0.05 : 0);
      look.set(Math.sin(yaw), 0, -Math.cos(yaw)).multiplyScalar(Math.cos(pitch)).setY(Math.sin(pitch)).add(camera.position);
      camera.lookAt(look);
    }

    // ---------- 表示 ----------
    const facesEl = document.getElementById('faces'), resultEl = document.getElementById('result');
    function drawFaces() {
      facesEl.innerHTML = order.map(i => {
        const p = people[i], c = p.mode === 'caught';
        return `<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="${c ? p.color : 'rgba(255,255,255,.35)'}" stroke="#fff" stroke-width="2.5"/>${c ? '<circle cx="14" cy="18" r="2" fill="#2a1a10"/><circle cx="26" cy="18" r="2" fill="#2a1a10"/><path d="M13 28q7-5 14 0" stroke="#2a1a10" stroke-width="2.2" fill="none" stroke-linecap="round"/>' : '<circle cx="20" cy="17" r="6" fill="rgba(255,255,255,.75)"/><path d="M9 33q11-14 22 0" fill="rgba(255,255,255,.75)"/>'}</svg>`;
      }).join('');
    }
    function renderControls() {
      controls.innerHTML = '';
      controls.classList.toggle('hide', state === 'won' || state === 'touched');
      facesEl.style.display = state === 'result' ? 'none' : 'flex';
      if (state === 'ready' || state === 'play') {
        const b = document.createElement('button');
        b.className = 'hold' + (holding ? ' on' : ''); b.textContent = t('hold');
        b.addEventListener('pointerdown', e => { e.preventDefault(); b.setPointerCapture?.(e.pointerId); press(); });
        for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) b.addEventListener(ev, release);
        b.addEventListener('contextmenu', e => e.preventDefault());
        controls.append(b);
        return;
      }
      if (state !== 'result') return;
      const b = document.createElement('button');
      b.className = 'go'; b.textContent = t('again');
      b.addEventListener('click', start);
      controls.append(b);
      const a = document.createElement('a');
      a.className = 'post'; a.textContent = t('post');
      a.href = `https://x.com/intent/post?text=${encodeURIComponent(shareText())}&url=${encodeURIComponent(SHARE_URL)}`;
      const coarse = matchMedia('(pointer: coarse)').matches;
      if (!coarse) { a.target = '_blank'; a.rel = 'noopener'; }
      // スマホは画像ごと共有シートへ。PCは画像を保存してから投稿画面を開く
      a.addEventListener('click', e => {
        const text = shareText();
        if (coarse && navigator.share) {
          e.preventDefault();
          const file = shareFile();
          const data = file && navigator.canShare?.({ files: [file] }) ? { files: [file], text: `${text}\n${SHARE_URL}` } : { text: `${text}\n${SHARE_URL}` };
          navigator.share(data).catch(() => {});
          return;
        }
        const img = resultImage();
        if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'daruma-san.png'; d.click(); }
      });
      controls.append(a);
    }
    const timeStr = () => elapsed.toFixed(1);
    const resultStr = () => resultKind === 'win' ? t('time')(timeStr()) : t('of')(caughtCount, N);
    const shareText = () => resultKind === 'win' ? t('shareWin')(timeStr()) : t('shareLose')(caughtCount, N);
    function showResult() { resultEl.children[0].textContent = resultStr(); }

    // 結果画像: 最後の場面に結果を重ねる
    let snap = null, shareCache = null;
    function takeSnap() {
      const src = renderer.domElement, side = Math.min(src.width, src.height * viewH / stage.clientHeight);
      const sx = (src.width - side) / 2, sy = Math.max(0, (src.height * viewH / stage.clientHeight - side) / 2);
      snap = document.createElement('canvas'); snap.width = snap.height = 1080;
      snap.getContext('2d').drawImage(src, sx, sy, side, side, 0, 0, 1080, 1080);
      shareCache = null;
    }
    function resultImage() {
      if (!snap) return null;
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const g = c.getContext('2d');
      g.drawImage(snap, 0, 0);
      g.textAlign = 'center'; g.fillStyle = '#fff'; g.lineJoin = 'round';
      const font = px => `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans KR", "Noto Sans Thai", sans-serif`;
      const text = (str, y, px, max) => {
        g.font = font(px);
        const w = g.measureText(str).width; if (w > max) { px *= max / w; g.font = font(px); }
        g.lineWidth = px * .16; g.strokeStyle = '#7a2e18'; g.strokeText(str, 540, y); g.fillText(str, 540, y);
      };
      text(resultStr(), 960, 160, 960);
      text(t('title'), 90, 56, 900);
      return c;
    }
    function prepareShare() {
      if (!snap) return;
      const key = lang;
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'daruma-san.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;

    function start() {
      resetPeople();
      state = 'ready'; elapsed = 0; caughtCount = 0; toucher = null; holding = false; turnP = 0; tapCD = 0;
      resultEl.style.display = 'none';
      drawFaces(); renderControls(); resize();
    }
    function finish() {
      state = 'result';
      showResult();
      resultEl.style.display = 'flex';
      snap = null; needSnap = true;
      renderControls(); resize();
    }

    // ---------- ループ ----------
    const STEP = 1 / 60;
    let last = performance.now(), acc = 0, clock = 0;
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      acc += dt;
      while (acc >= STEP) { step(STEP); for (const p of people) p.h.update(STEP); clock += STEP; acc -= STEP; }
      placeCamera(clock);
      renderer.render(scene, camera);
      if (needSnap) { needSnap = false; takeSnap(); prepareShare(); }
      requestAnimationFrame(loop);
    }

    resize();
    start();
    applyLang();
    placeCamera(0);
    // 最初の1回が重くならないように、木の方も含めて一度描いておく
    renderer.compile(scene, camera);
    renderer.render(scene, camera);
    turnP = 1; placeCamera(0); renderer.render(scene, camera); turnP = 0;
    requestAnimationFrame(t0 => { last = t0; loop(t0); });
    /*TEST*/if (location.search.includes('test')) window.__t = { press, release, people, catchP, get state() { return state; }, get turnP() { return turnP; } };
  </script>
</body>
