  function applySound() { $('snd').innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z" fill="#3a1d4a"/>${soundOn ? '<path d="M15 8q3 4 0 8M18 5q5 7 0 14" stroke="#3a1d4a" stroke-width="2" fill="none" stroke-linecap="round"/>' : '<path d="M15 9l6 6M21 9l-6 6" stroke="#3a1d4a" stroke-width="2" stroke-linecap="round"/>'}</svg>`; if (V) V.master.gain.setTargetAtTime(soundOn ? 1 : 0, actx.currentTime, 0.02); }

  // ---------- 顔 ----------

  let face = withLine({ img: catImg, cat: true }, CAT_LINE);
  const saved = store.get('photo', null);
  if (saved) { const im = new Image(); im.onload = () => { face = withLine({ img: im, cat: false, src: saved.src }, saved.line || []); resize(); }; im.src = saved.src; }

  // ---------- 状態 ----------
  const cv = $('cv'), ctx = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1, L = null;
  let mode = 'play'; // play / mouth / result
  let open = 0, target = 0, pitchT = 0.5, press = false, keyDown = null, bob = 0, tm = 0;
  const parts = [];
  // 茎の位置: 0（下・低い）〜1（頭の近く・高い）
  const freqOf = tt => mtof(55 + tt * 26);
  function layout(w, h, top, bottom) {
    const ah = h - top - bottom, cxm = w / 2;
    const ar = (face.img.naturalWidth || 1) / (face.img.naturalHeight || 1);
    const portrait = ah > w * 1.05;
    let fw, fh, fx, fy, s0, s1, sw;
    if (portrait) {
      const fhMax = Math.min(ah * 0.5, w * 0.82 / ar, 560);

      const stemLen = Math.min(ah * 0.42, fh * 1.2);

  function resize() {

  }
  addEventListener('resize', resize);

  // ---------- 描画 ----------
  function drawBg(c, w, h) {
    const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#3b1f6b'); g.addColorStop(0.6, '#7a3a7e'); g.addColorStop(1, '#f08a6a');

    c.globalAlpha = 1;

    c.fillStyle = sg; c.fillRect(0, 0, w, h);
  }
  function drawStem(c, l, tt, pressed) {
    const { s0, s1, sw } = l;

    c.strokeStyle = 'rgba(0,0,0,.25)'; c.lineWidth = sw; c.beginPath(); c.moveTo(s1.x + 6, s1.y + 8); c.lineTo(s0.x + 6, s0.y + 8); c.stroke();

    c.strokeStyle = '#141018'; c.lineWidth = sw; c.beginPath(); c.moveTo(s1.x, s1.y); c.lineTo(s0.x, s0.y); c.stroke();

  function drawFace(c, l, op, showLine) {

    if (face.cat || !catImg.naturalWidth) return;
    const s = Math.min(w, h) * 0.2; c.save(); c.globalAlpha = 0.9;
    c.translate(w - s * 0.6, h - s * 0.45); c.rotate(-0.15 + Math.sin(tm * 2) * 0.05);
    c.drawImage(catImg, -s / 2, -s / 2, s, s); c.restore();
  }
  function drawScene(c, w, h, l, line) {
    drawBg(c, w, h);
    drawCat(c, w, h);
    drawStem(c, l, pitchT, press || keyDown !== null);
    drawFace(c, l, open, line);
    drawParts(c, l, l.fh / 300);
  }

  // ---------- 録画 ----------
  const RS = 720, rc = document.createElement('canvas'); rc.width = rc.height = RS; const rctx = rc.getContext('2d');
  let rec = null, recStart = 0, chunks = [], recBlob = null, recFile = null, recUrl = null;
  function pickMime() {
    const list = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
    for (const m of list) if (window.MediaRecorder && MediaRecorder.isTypeSupported?.(m)) return m;
    return '';
  }
  function startRec() {
    initAudio();
    if (!window.MediaRecorder || !rc.captureStream) { showErr(t('norec')); return; }
    const vs = rc.captureStream(30);
    const tracks = [...vs.getVideoTracks(), ...(recDest ? recDest.stream.getAudioTracks() : [])];
    const mime = pickMime();
    try { rec = new MediaRecorder(new MediaStream(tracks), mime ? { mimeType: mime, videoBitsPerSecond: 4e6 } : undefined); }
    catch { showErr(t('norec')); return; }
    chunks = []; rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = finishRec; rec.start(250); recStart = performance.now();
    $('dot').classList.add('hide'); $('sq').classList.remove('hide'); $('pick').disabled = true;
  }
  function stopRec() { if (rec && rec.state !== 'inactive') rec.stop(); }
  function finishRec() {
    const type = (rec.mimeType || 'video/webm').split(';')[0]; rec = null;
    $('ring').style.strokeDashoffset = 213.6; $('dot').classList.remove('hide'); $('sq').classList.add('hide'); $('pick').disabled = false;
    recBlob = new Blob(chunks, { type });
    const ext = type.includes('mp4') ? 'mp4' : 'webm';
    try { recFile = new File([recBlob], 'otama-face.' + ext, { type }); } catch { recFile = null; }
    if (recUrl) URL.revokeObjectURL(recUrl); recUrl = URL.createObjectURL(recBlob);
    press = false; keyDown = null; target = 0; voice(freqOf(pitchT), 0, false);
    mode = 'result'; $('vid').src = recUrl; $('vid').play().catch(() => {});
    $('panel').classList.remove('hide'); $('ui').classList.add('hide'); applyLang();
  }
  $('rec').onclick = () => { if (mode !== 'play') return; rec ? stopRec() : startRec(); };
  $('again').onclick = () => { $('panel').classList.add('hide'); $('ui').classList.remove('hide'); $('vid').pause(); mode = 'play'; };
  $('post').onclick = e => {
    const text = t('share');
    if (coarse && navigator.share) {
      e.preventDefault();
      const data = { text: text + '\n' + SHARE_URL };
      if (recFile && navigator.canShare?.({ files: [recFile] })) data.files = [recFile];
      navigator.share(data).catch(() => {});
      return;
    }
    if (recUrl) { const a = document.createElement('a'); a.href = recUrl; a.download = recFile ? recFile.name : 'otama-face.webm'; document.body.appendChild(a); a.click(); a.remove(); }
  };

  // ---------- 操作 ----------
  function stemHit(x, y, l, slack) {
    const { s0, s1, sw } = l, dx = s1.x - s0.x, dy = s1.y - s0.y, len2 = dx * dx + dy * dy;
    let u = ((x - s0.x) * dx + (y - s0.y) * dy) / len2; const uc = Math.max(0, Math.min(1, u));
    const d = Math.hypot(x - (s0.x + dx * uc), y - (s0.y + dy * uc));
    return { u: uc, d, hit: d < sw * slack && u > -0.15 && u < 1.1 };
  }
  function inFace(x, y) { return x > L.fx && x < L.fx + L.fw && y > L.fy && y < L.fy + L.fh * 1.2; }
  let ptr = null, dragMouth = false, dragCut = false, lasso = [];
  const cutPt = e => [(e.clientX - L.fx) / L.fw, (e.clientY - L.fy) / L.fh];
  cv.addEventListener('pointerdown', e => {
    initAudio(); if (actx?.state === 'suspended') actx.resume();
    if (mode === 'cut') { dragCut = true; lasso = [cutPt(e)]; cv.setPointerCapture(e.pointerId); return; }
    if (mode === 'mouth') { dragMouth = true; withLine(face, []); setMouth(e); cv.setPointerCapture(e.pointerId); return; }
    if (mode !== 'play') return;
    const h = stemHit(e.clientX, e.clientY, L, 1.6);
    if (h.hit) { ptr = e.pointerId; pitchT = h.u; press = true; cv.setPointerCapture(e.pointerId); }
    else if (inFace(e.clientX, e.clientY)) { ptr = e.pointerId; press = true; cv.setPointerCapture(e.pointerId); } // 顔をつまむとワウ
  });
  cv.addEventListener('pointermove', e => {
    if (dragMouth) { setMouth(e); return; }
    if (dragCut) { const p = cutPt(e), q = lasso[lasso.length - 1]; if (Math.hypot((p[0] - q[0]) * L.fw, (p[1] - q[1]) * L.fh) > 4) lasso.push(p); return; }
    if (e.pointerId !== ptr) return;
    const h = stemHit(e.clientX, e.clientY, L, 99); pitchT = h.u;
  });
  const up = e => { if (dragCut) { dragCut = false; if (lasso.length < 3) lasso = []; return; } if (dragMouth) { dragMouth = false; endMouth(); return; } if (e.pointerId === ptr) { ptr = null; press = false; } };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  function setMouth(e) {
    const x = Math.max(0, Math.min(1, (e.clientX - L.fx) / L.fw)), y = Math.max(0.02, Math.min(0.98, (e.clientY - L.fy) / L.fh));
    const ln = face.line, q = ln[ln.length - 1];
    if (!q || Math.hypot((x - q[0]) * L.fw, (y - q[1]) * L.fh) > 4) withLine(face, [...ln, [x, y]]);
  }
  // 描き終わったら左→右にそろえる。短すぎる線は無効
  function endMouth() {
    let ln = face.line; if (ln.length > 1 && ln[0][0] > ln[ln.length - 1][0]) ln = ln.slice().reverse();
    if (ln.length < 2 || Math.abs(ln[ln.length - 1][0] - ln[0][0]) < 0.05) ln = [];
    withLine(face, ln); $('ok').disabled = !ln.length;
  }
  const KEYS = 'asdfghjk', SCALE = [0, 2, 4, 5, 7, 9, 11, 12];
  addEventListener('keydown', e => {
    if (mode !== 'play' || e.repeat) return; const i = KEYS.indexOf(e.key.toLowerCase()); if (i < 0) return;
    initAudio(); if (actx?.state === 'suspended') actx.resume();
    keyDown = e.key.toLowerCase(); pitchT = (5 + SCALE[i]) / 26;
  });
  addEventListener('keyup', e => { if (e.key.toLowerCase() === keyDown) keyDown = null; });

  // ---------- 写真 ----------
  $('pick').onclick = () => { if (mode === 'play' && !rec) $('file').click(); };
  $('file').onchange = () => {
    const f = $('file').files[0]; $('file').value = ''; if (!f) return;
    const url = URL.createObjectURL(f), im = new Image();
    im.onload = () => {
      const s = Math.min(1, 640 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * s); c.height = Math.round(im.height * s); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      const src = c.toDataURL(f.type === 'image/png' ? 'image/png' : 'image/jpeg', 0.85);
      const im2 = new Image(); im2.onload = () => { face = withLine({ img: im2, cat: false, src }, []); resize(); mode = 'cut'; lasso = []; $('ok').disabled = false; $('ok').classList.remove('hide'); $('pick').classList.add('hide'); $('rec').classList.add('hide'); }; im2.src = src;
    };
    im.onerror = () => { URL.revokeObjectURL(url); showErr(t('err')); };
    im.src = url;
  };
  $('ok').onclick = () => {
    if (mode === 'cut') { applyCut(); return; }
    mode = 'play'; $('ok').classList.add('hide'); $('pick').classList.remove('hide'); $('rec').classList.remove('hide');
    if (face.src) store.set('photo', { src: face.src, line: face.line });
  };

  // 囲んだ形で切り抜く（外側は透明に）。囲まなければそのまま
  function applyCut() {
    const img = face.img, iw = img.naturalWidth, ih = img.naturalHeight;
    const toMouth = () => { mode = 'mouth'; withLine(face, []); $('ok').disabled = true; };
    if (lasso.length < 3) { toMouth(); return; }
    const xs = lasso.map(p => Math.max(0, Math.min(1, p[0])) * iw), ys = lasso.map(p => Math.max(0, Math.min(1, p[1])) * ih);
    const x0 = Math.floor(Math.min(...xs)), y0 = Math.floor(Math.min(...ys)), w = Math.ceil(Math.max(...xs)) - x0, h = Math.ceil(Math.max(...ys)) - y0;
    if (w < 8 || h < 8) { toMouth(); return; }
    const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
    x.beginPath(); xs.forEach((v, i) => i ? x.lineTo(v - x0, ys[i] - y0) : x.moveTo(v - x0, ys[i] - y0)); x.closePath(); x.clip();
    x.drawImage(img, -x0, -y0);
    const src = c.toDataURL('image/png'), im = new Image();
    im.onload = () => { face = withLine({ img: im, cat: false, src }, []); lasso = []; resize(); toMouth(); };
    im.src = src;
  }
  function drawLasso(c) {
    if (lasso.length < 2) return;
    const P = p => [L.fx + L.fw * p[0], L.fy + L.fh * p[1]];
    c.save(); c.beginPath(); c.rect(0, 0, W, H); lasso.forEach((p, i) => i ? c.lineTo(...P(p)) : c.moveTo(...P(p))); c.closePath();
    if (!dragCut) { c.fillStyle = 'rgba(20,10,40,.6)'; c.fill('evenodd'); }
    c.beginPath(); lasso.forEach((p, i) => i ? c.lineTo(...P(p)) : c.moveTo(...P(p))); if (!dragCut) c.closePath();
    c.lineWidth = 4; c.lineJoin = c.lineCap = 'round'; c.setLineDash([10, 7]); c.strokeStyle = '#fff'; c.shadowColor = '#000'; c.shadowBlur = 5; c.stroke(); c.restore();
  }

  // ---------- 言語 ----------
  function applyLang() {
    document.documentElement.lang = lang; document.title = t('title');
    $('back').textContent = t('back'); $('pickT').textContent = t('pick'); $('ok').textContent = t('ok'); $('again').textContent = t('again');
    $('lang').value = lang;
    const p = $('post');
    p.href = 'https://x.com/intent/post?text=' + encodeURIComponent(t('share')) + '&url=' + encodeURIComponent(SHARE_URL);
    if (coarse) { p.removeAttribute('target'); p.removeAttribute('rel'); } else { p.target = '_blank'; p.rel = 'noopener'; }
    p.innerHTML = '<svg viewBox="0 0 24 24"><path d="M3 3h5l13 18h-5z M20 3h-2.5L4 21h2.5z" fill="#fff"/></svg>' + (coarse ? t('post') : t('save') + ' / ' + t('post'));
  }
  $('lang').onchange = e => { lang = e.target.value; store.set('lang', lang); applyLang(); };

  // ---------- ループ ----------
  let last = performance.now(), spawnT = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; tm += dt;
    const on = mode === 'play' && (press || keyDown !== null);
    target = on ? 1 : 0;
    // オタマトーンらしく、開くのは速く・閉じるのは少しゆっくり
    open += (target - open) * (1 - Math.exp(-dt * (on ? 16 : 10)));
    bob = on ? Math.sin(tm * 11) * 2 : bob * 0.9;
    if (V) { V.lfoG.gain.setTargetAtTime(on ? 18 + open * 22 : 0, actx.currentTime, 0.15); voice(freqOf(pitchT), open, on); }
    if (on) { spawnT += dt; while (spawnT > 0.16) { spawnT -= 0.16; parts.push({ x: face.mx + (Math.random() - 0.5) * 0.3, y: face.my + 0.05, vx: (Math.random() - 0.5) * 0.5, vy: -0.6 - Math.random() * 0.4, rot: (Math.random() - 0.5) * 0.6, s: 0.8 + Math.random() * 0.6, age: 0, life: 1.4, two: Math.random() < 0.4, col: ['#ffcf5a', '#ff8fb0', '#8fe3ff', '#b6ff8f'][Math.floor(Math.random() * 4)] }); } }
    for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += dt * 0.8 * Math.sign(p.vx); if (p.age > p.life) parts.splice(i, 1); }

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawScene(ctx, W, H, L, mode === 'mouth');
    if (mode === 'cut') drawLasso(ctx);
    if (rec) {
      const rl = layout(RS, RS, 30, 30);
      rctx.setTransform(1, 0, 0, 1, 0, 0); drawScene(rctx, RS, RS, rl, false);
      rctx.fillStyle = 'rgba(255,255,255,.85)'; rctx.font = 'bold 26px sans-serif'; rctx.textAlign = 'right'; rctx.fillText('#' + DICT.ja.title + 'ゲーム', RS - 20, RS - 18);
      const el = (now - recStart) / 1000;
      $('ring').style.strokeDashoffset = 213.6 * (1 - Math.min(1, el / REC_SEC));
      if (el >= REC_SEC) stopRec();
    }
    requestAnimationFrame(frame);
  }
  resize(); applySound(); applyLang();
  catImg.onload = resize;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
