      const span = Math.max(0.05, x1 - x0);
      // 横はなめらかに広がりを足す（線の外側も引っぱられる）
      const blur = u => { let s = 0, n = 0; for (let k = -3; k <= 3; k++) { const uu = u + k * span * 0.08, ww = Math.exp(-k * k / 4); s += wx(uu) * ww; n += ww; } return s / n; };
      const Wb = []; for (let i = 0; i <= GX; i++) Wb.push(blur(i / GX));
      const vert = (i, j, lower) => {
        const u = i / GX, ly = lineY(ln, u), w = Wb[i];

        const dy = lower ? gap * w * (1 - 0.35 * (j / GB)) : (() => { const k = Math.max(0, 1 - (ly - v) / (span * 0.5)); return -gap * 0.18 * w * k * k; })();

      };

      c.fillStyle = '#d4485e'; c.beginPath(); c.ellipse(mb[0], mb[1], fw * span * 0.28, gap * 0.45, 0, 0, 7); c.fill();
      c.restore();

        for (let j = 0; j < R; j++) for (let i = 0; i < GX; i++) {
          const a = row[j][i], b = row[j][i + 1], d = row[j + 1][i], e = row[j + 1][i + 1];
          tri(c, img, [...a.s, ...b.s, ...d.s], [...a.d, ...b.d, ...d.d]);
          tri(c, img, [...b.s, ...e.s, ...d.s], [...b.d, ...e.d, ...d.d]);
        }

    }
    if (showLine && ln.length > 1) {

      c.beginPath(); ln.forEach((p, i) => { const [x, y] = P(p); i ? c.lineTo(x, y) : c.moveTo(x, y); }); c.stroke(); c.restore();
    }
  }
  function drawParts(c, l, sc) {
    for (const p of parts) {
      const a = Math.max(0, 1 - p.age / p.life);
      c.save(); c.globalAlpha = a; c.fillStyle = p.col;
      c.translate(l.fx + l.fw * p.x, l.fy + l.fh * p.y); c.rotate(p.rot); c.scale(sc * p.s, sc * p.s);
      c.beginPath(); c.ellipse(0, 0, 7, 5.4, -0.4, 0, 7); c.fill(); c.fillRect(5, -22, 2.6, 22);
      if (p.two) { c.beginPath(); c.ellipse(16, -3, 7, 5.4, -0.4, 0, 7); c.fill(); c.fillRect(21, -25, 2.6, 22); c.fillRect(5, -24, 18.6, 4); }

  }
  // 後ろの観客の猫（写真を使っているときも出す作者の目印）
  function drawCat(c, w, h) {

  }
  function drawScene(c, w, h, l, line) {
    drawBg(c, w, h);
    drawCat(c, w, h);
    drawStem(c, l, pitchT, press || keyDown !== null);
    drawFace(c, l, open, line);
    drawParts(c, l, l.fh / 300);

  // ---------- 録画 ----------
  const RS = 720, rc = document.createElement('canvas'); rc.width = rc.height = RS; const rctx = rc.getContext('2d');
  let rec = null, recStart = 0, chunks = [], recBlob = null, recFile = null, recUrl = null;
  function pickMime() {
    const list = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];

    return '';
  }
  function startRec() {
    initAudio();
    if (!window.MediaRecorder || !rc.captureStream) { showErr(t('norec')); return; }
    const vs = rc.captureStream(30);
    const tracks = [...vs.getVideoTracks(), ...(recDest ? recDest.stream.getAudioTracks() : [])];
    const mime = pickMime();

    rec.onstop = finishRec; rec.start(250); recStart = performance.now();
    $('dot').classList.add('hide'); $('sq').classList.remove('hide'); $('pick').disabled = true;
  }
  function stopRec() { if (rec && rec.state !== 'inactive') rec.stop(); }
  function finishRec() {
    const type = (rec.mimeType || 'video/webm').split(';')[0]; rec = null;
    $('ring').style.strokeDashoffset = 213.6; $('dot').classList.remove('hide'); $('sq').classList.add('hide'); $('pick').disabled = false;
    recBlob = new Blob(chunks, { type });
    const ext = type.includes('mp4') ? 'mp4' : 'webm';
    try { recFile = new File([recBlob], 'otama-face.' + ext, { type }); } catch { recFile = null; }
    if (recUrl) URL.revokeObjectURL(recUrl); recUrl = URL.createObjectURL(recBlob);
    press = false; keyDown = null; target = 0; voice(freqOf(pitchT), 0, false);
    mode = 'result'; $('vid').src = recUrl; $('vid').play().catch(() => {});
    $('panel').classList.remove('hide'); $('ui').classList.add('hide'); applyLang();
  }
  $('rec').onclick = () => { if (mode !== 'play') return; rec ? stopRec() : startRec(); };
  $('again').onclick = () => { $('panel').classList.add('hide'); $('ui').classList.remove('hide'); $('vid').pause(); mode = 'play'; };
  $('post').onclick = e => {
    const text = t('share');
    if (coarse && navigator.share) {
      e.preventDefault();
      const data = { text: text + '\n' + SHARE_URL };
      if (recFile && navigator.canShare?.({ files: [recFile] })) data.files = [recFile];
      navigator.share(data).catch(() => {});
      return;
    }
    if (recUrl) { const a = document.createElement('a'); a.href = recUrl; a.download = recFile ? recFile.name : 'otama-face.webm'; document.body.appendChild(a); a.click(); a.remove(); }
  };

  // ---------- 操作 ----------
  function stemHit(x, y, l, slack) {
    const { s0, s1, sw } = l, dx = s1.x - s0.x, dy = s1.y - s0.y, len2 = dx * dx + dy * dy;
    let u = ((x - s0.x) * dx + (y - s0.y) * dy) / len2; const uc = Math.max(0, Math.min(1, u));
    const d = Math.hypot(x - (s0.x + dx * uc), y - (s0.y + dy * uc));

  }
  function inFace(x, y) { return x > L.fx && x < L.fx + L.fw && y > L.fy && y < L.fy + L.fh * 1.2; }
  let ptr = null;
  cv.addEventListener('pointerdown', e => {
    initAudio(); if (actx?.state === 'suspended') actx.resume();
    if (mode === 'cut' || mode === 'mouth') { cutDown(e); return; }
    if (mode !== 'play') return;
    const h = stemHit(e.clientX, e.clientY, L, 1.6);
    if (h.hit) { ptr = e.pointerId; pitchT = h.u; press = true; cv.setPointerCapture(e.pointerId); }
    else if (inFace(e.clientX, e.clientY)) { ptr = e.pointerId; press = true; cv.setPointerCapture(e.pointerId); } // 顔をつまむとワウ
  });
  cv.addEventListener('pointermove', e => {
    if (mode === 'cut' || mode === 'mouth') { cutMove(e); return; }
    if (e.pointerId !== ptr) return;
    const h = stemHit(e.clientX, e.clientY, L, 99); pitchT = h.u;
  });
  const up = e => { if (mode === 'cut' || mode === 'mouth') { cutUp(e); return; } if (e.pointerId === ptr) { ptr = null; press = false; } };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  function setMouth(e) {
    const fw = vimg.width * view.k, fh = vimg.height * view.k;
    const x = Math.max(0, Math.min(1, (e.clientX - view.x) / fw)), y = Math.max(0.02, Math.min(0.98, (e.clientY - view.y) / fh));
    const ln = face.line, q = ln[ln.length - 1];
    if (!q || Math.hypot((x - q[0]) * fw, (y - q[1]) * fh) > 3) withLine(face, [...ln, [x, y]]);
  }
  // 描き終わったら左→右にそろえる。短すぎる線は無効
  function endMouth() {
    let ln = face.line; if (ln.length > 1 && ln[0][0] > ln[ln.length - 1][0]) ln = ln.slice().reverse();
    if (ln.length < 2 || Math.abs(ln[ln.length - 1][0] - ln[0][0]) < 0.05) ln = [];
    withLine(face, ln); $('ok').disabled = !ln.length;
  }
  const KEYS = 'asdfghjk', SCALE = [0, 2, 4, 5, 7, 9, 11, 12];
  addEventListener('keydown', e => {
    if (mode !== 'play' || e.repeat) return; const i = KEYS.indexOf(e.key.toLowerCase()); if (i < 0) return;
    initAudio(); if (actx?.state === 'suspended') actx.resume();
    keyDown = e.key.toLowerCase(); pitchT = (5 + SCALE[i]) / 26;
  });
  addEventListener('keyup', e => { if (e.key.toLowerCase() === keyDown) keyDown = null; });

  // ---------- 写真 ----------
  $('pick').onclick = () => { if (mode === 'play' && !rec) $('file').click(); };
  $('file').onchange = () => {
    const f = $('file').files[0]; $('file').value = ''; if (!f) return;
    const url = URL.createObjectURL(f), im = new Image();
    im.onload = () => { URL.revokeObjectURL(url); startCut(im); };
    im.onerror = () => { URL.revokeObjectURL(url); showErr(t('err')); };
    im.src = url;
  };
  $('ok').onclick = () => {
    if (mode === 'cut') { if (makeSprite()) { setBar('mouth'); } return; }
    setBar('play');
    if (face.src) store.set('photo', { src: face.src, line: face.line });
  };

  // ---------- 切り抜き（タピオカメーカーと同じ: 残す所を指で塗る・ピンチ／ホイールで拡大） ----------
  let vimg = null, pimg = null, mask = null, mctx = null, view = null, brushIdx = 1, erasing = false, undoStack = [], lastPt = null, pinch = null;
  const touches = new Map(), BRUSH = [8, 22, 50];
  function setBar(m) {
    mode = m;
    const cut = m === 'cut', mouth = m === 'mouth';
    for (const k of ['brush', 'erase', 'undo']) $(k).classList.toggle('hide', !cut);
    $('ok').classList.toggle('hide', !(cut || mouth)); $('pick').classList.toggle('hide', cut || mouth); $('rec').classList.toggle('hide', cut || mouth);
    if (cut) { $('erase').classList.remove('on'); updateDone(); }
    if (mouth) { withLine(face, []); $('ok').disabled = true; vimg = face.img; touches.clear(); pinch = null; lastPt = null; placeImage(); }
  }
  function startCut(im) {
    const k = Math.min(1, 1600 / Math.max(im.width, im.height));
    pimg = document.createElement('canvas'); pimg.width = Math.max(1, Math.round(im.width * k)); pimg.height = Math.max(1, Math.round(im.height * k));
    pimg.getContext('2d').drawImage(im, 0, 0, pimg.width, pimg.height);
    mask = document.createElement('canvas'); mask.width = pimg.width; mask.height = pimg.height; mctx = mask.getContext('2d');
    undoStack = []; erasing = false; touches.clear(); pinch = null; lastPt = null;
    vimg = pimg; placeImage(); setBar('cut');
  }
  function placeImage() {
    const top = 56, bot = 80 + 90, pad = 12, k = Math.min((W - pad * 2) / vimg.width, (H - top - bot - pad * 2) / vimg.height);
    view = { k, fit: k, x: (W - vimg.width * k) / 2, y: top + (H - top - bot - vimg.height * k) / 2 };
  }
  function snapFit() { if (view.k <= view.fit * 1.001) placeImage(); }
  const toImg = e => ({ x: (e.clientX - view.x) / view.k, y: (e.clientY - view.y) / view.k });
  const midP = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
  const brushPx = () => BRUSH[brushIdx] / view.k;
  function stroke(a, b) {
    mctx.save(); mctx.globalCompositeOperation = erasing ? 'destination-out' : 'source-over';
    mctx.strokeStyle = mctx.fillStyle = '#000'; mctx.lineCap = mctx.lineJoin = 'round'; mctx.lineWidth = brushPx();
    mctx.beginPath(); mctx.moveTo(a.x, a.y); mctx.lineTo(b.x, b.y); mctx.stroke();
    mctx.beginPath(); mctx.arc(b.x, b.y, brushPx() / 2, 0, Math.PI * 2); mctx.fill(); mctx.restore();
  }
  function maskBox() {
    const d = mctx.getImageData(0, 0, mask.width, mask.height).data;
    let x0 = mask.width, y0 = mask.height, x1 = -1, y1 = -1;
    for (let y = 0; y < mask.height; y++) for (let x = 0; x < mask.width; x++) {
      if (d[(y * mask.width + x) * 4 + 3] > 20) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
    return x1 < 0 ? null : { x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1 };
  }
  function updateDone() { $('ok').disabled = !maskBox(); }
  function makeSprite() {
    const b = maskBox(); if (!b) return false;
    const k = Math.min(1, 640 / Math.max(b.w, b.h)), c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(b.w * k)); c.height = Math.max(1, Math.round(b.h * k));
    const g = c.getContext('2d');
    g.drawImage(pimg, b.x, b.y, b.w, b.h, 0, 0, c.width, c.height);
    g.globalCompositeOperation = 'destination-in'; g.drawImage(mask, b.x, b.y, b.w, b.h, 0, 0, c.width, c.height);
    const src = c.toDataURL('image/png');
    face = withLine({ img: c, cat: false, src }, []); face.img.naturalWidth = c.width; face.img.naturalHeight = c.height;
    resize(); return true;
  }
  function cutDown(e) {
    cv.setPointerCapture(e.pointerId); touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (touches.size === 1 && !pinch && mode === 'mouth') { lastPt = true; withLine(face, []); setMouth(e); }
    else if (touches.size === 1 && !pinch) {
      undoStack.push(mctx.getImageData(0, 0, mask.width, mask.height)); if (undoStack.length > 20) undoStack.shift();
      lastPt = toImg(e); stroke(lastPt, lastPt);
    } else if (touches.size === 2) {
      // 2本目の指: 塗り始めを取り消して拡大へ
      if (lastPt && mode === 'mouth') { withLine(face, []); lastPt = null; }
      if (lastPt) { const d = undoStack.pop(); if (d) mctx.putImageData(d, 0, 0); lastPt = null; }
      const [a, b] = [...touches.values()];
      pinch = { d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, m0: midP(a, b), k0: view.k, x0: view.x, y0: view.y };
    }
  }
  function cutMove(e) {
    if (!touches.has(e.pointerId)) return;
    touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && touches.size >= 2) {
      const [a, b] = [...touches.values()], m = midP(a, b);
      const k = Math.max(view.fit, Math.min(view.fit * 12, pinch.k0 * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d0));
      view.x = m.x - (pinch.m0.x - pinch.x0) / pinch.k0 * k; view.y = m.y - (pinch.m0.y - pinch.y0) / pinch.k0 * k; view.k = k; snapFit();
    } else if (lastPt && mode === 'mouth') setMouth(e);
    else if (lastPt) { const p = toImg(e); stroke(lastPt, p); lastPt = p; }
  }
  function cutUp(e) {
    touches.delete(e.pointerId); if (touches.size === 0) pinch = null;
    if (lastPt) { lastPt = null; if (mode === 'mouth') endMouth(); else updateDone(); }
  }
  cv.addEventListener('wheel', e => {
    if (mode !== 'cut' && mode !== 'mouth') return; e.preventDefault();
    const k = Math.max(view.fit, Math.min(view.fit * 12, view.k * Math.exp(-e.deltaY * 0.0015)));

  }, { passive: false });
  $('brush').onclick = () => { brushIdx = (brushIdx + 1) % BRUSH.length; $('bdot').style.width = $('bdot').style.height = [5, 11, 20][brushIdx] + 'px'; };
  $('erase').onclick = () => { erasing = !erasing; $('erase').classList.toggle('on', erasing); };
  $('undo').onclick = () => { const d = undoStack.pop(); if (d) { mctx.putImageData(d, 0, 0); updateDone(); } };
  // 塗った所は緑がかって見える。残りは薄く
  let tmpC = null;
  function drawCut(c) {
    const { k, x, y } = view, w = pimg.width * k, hh = pimg.height * k;
    c.fillStyle = '#20123a'; c.fillRect(0, 0, W, H);
    c.fillStyle = '#3b2a20'; c.fillRect(x, y, w, hh);
    c.globalAlpha = 0.35; c.drawImage(pimg, x, y, w, hh); c.globalAlpha = 1;
    if (!tmpC || tmpC.width !== pimg.width || tmpC.height !== pimg.height) { tmpC = document.createElement('canvas'); tmpC.width = pimg.width; tmpC.height = pimg.height; }
    const g = tmpC.getContext('2d');
    g.globalCompositeOperation = 'source-over'; g.clearRect(0, 0, tmpC.width, tmpC.height); g.drawImage(mask, 0, 0);
    g.globalCompositeOperation = 'source-in'; g.drawImage(pimg, 0, 0);
    g.globalCompositeOperation = 'source-atop'; g.fillStyle = 'rgba(60, 220, 110, 0.45)'; g.fillRect(0, 0, tmpC.width, tmpC.height);
    c.drawImage(tmpC, x, y, w, hh);
  }

  // ---------- 言語 ----------
  function applyLang() {
    document.documentElement.lang = lang; document.title = t('title');
    $('back').textContent = t('back'); $('pickT').textContent = t('pick'); $('ok').textContent = t('ok'); $('erase').textContent = t('erase'); $('undo').textContent = t('undo'); $('again').textContent = t('again');
    $('lang').value = lang;
    const p = $('post');
    p.href = 'https://x.com/intent/post?text=' + encodeURIComponent(t('share')) + '&url=' + encodeURIComponent(SHARE_URL);
    if (coarse) { p.removeAttribute('target'); p.removeAttribute('rel'); } else { p.target = '_blank'; p.rel = 'noopener'; }
    p.innerHTML = '<svg viewBox="0 0 24 24"><path d="M3 3h5l13 18h-5z M20 3h-2.5L4 21h2.5z" fill="#fff"/></svg>' + (coarse ? t('post') : t('save') + ' / ' + t('post'));
  }
  $('lang').onchange = e => { lang = e.target.value; store.set('lang', lang); applyLang(); };

  // ---------- ループ ----------
  let last = performance.now(), spawnT = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; tm += dt;
    const on = mode === 'play' && (press || keyDown !== null);
    target = on ? 1 : 0;
    // オタマトーンらしく、開くのは速く・閉じるのは少しゆっくり
    open += (target - open) * (1 - Math.exp(-dt * (on ? 16 : 10)));
    bob = on ? Math.sin(tm * 11) * 2 : bob * 0.9;
    if (V) { V.lfoG.gain.setTargetAtTime(on ? 18 + open * 22 : 0, actx.currentTime, 0.15); voice(freqOf(pitchT), open, on); }
    if (on) { spawnT += dt; while (spawnT > 0.16) { spawnT -= 0.16; parts.push({ x: face.mx + (Math.random() - 0.5) * 0.3, y: face.my + 0.05, vx: (Math.random() - 0.5) * 0.5, vy: -0.6 - Math.random() * 0.4, rot: (Math.random() - 0.5) * 0.6, s: 0.8 + Math.random() * 0.6, age: 0, life: 1.4, two: Math.random() < 0.4, col: ['#ffcf5a', '#ff8fb0', '#8fe3ff', '#b6ff8f'][Math.floor(Math.random() * 4)] }); } }
    for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += dt * 0.8 * Math.sign(p.vx); if (p.age > p.life) parts.splice(i, 1); }

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (mode === 'cut') drawCut(ctx);
    else if (mode === 'mouth') { drawBg(ctx, W, H); drawFace(ctx, { fx: view.x, fy: view.y, fw: vimg.width * view.k, fh: vimg.height * view.k }, 0, true); }
    else drawScene(ctx, W, H, L, false);
    if (rec) {
      const rl = layout(RS, RS, 30, 30);
      rctx.setTransform(1, 0, 0, 1, 0, 0); drawScene(rctx, RS, RS, rl, false);
      rctx.fillStyle = 'rgba(255,255,255,.85)'; rctx.font = 'bold 26px sans-serif'; rctx.textAlign = 'right'; rctx.fillText('#' + DICT.ja.title + 'ゲーム', RS - 20, RS - 18);
      const el = (now - recStart) / 1000;
      $('ring').style.strokeDashoffset = 213.6 * (1 - Math.min(1, el / REC_SEC));
      if (el >= REC_SEC) stopRec();
    }
    requestAnimationFrame(frame);
  }
  resize(); applySound(); applyLang();
  catImg.onload = resize;
  requestAnimationFrame(frame);
})();
