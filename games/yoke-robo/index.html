function updateParticles(dt) {

// 画面の向き（右・下）→ 台の上の向き（カメラは -z を向いているので、画面の右 = +x、画面の下 = +z）
function inputDir() {

const HEADISH = /^(head|torso|upper)/;
function handleHits() {
  for (const h of sim.hits) {
    if (h.ball) {
      const b = h.ball, o = b.view, pv = b.prevVel || { x: 0, y: 0, z: 0 };
      const bp = b.body.translation();
      if (h.part) {
        const v = h.part.body.linvel();
        const rel = Math.hypot(pv.x - v.x, pv.y - v.y, pv.z - v.z);
        if (rel < 1.5) continue;
        const k = Math.min(1, rel / 12);
        const pp = h.part.body.translation();
        tmpA.set(bp.x, bp.y, bp.z).lerp(tmpB.set(pp.x, pp.y, pp.z), 0.35);
        spawnSpark(tmpA, Math.round(4 + 10 * k), 0.4 + k);
        if (b.kind === 'tarai') {
          // タライが頭（か上半身）に当たったら、その場でばったり
          if (HEADISH.test(h.part.name) && rel > 2.5 && !b.done) { b.done = true; gwan(1); sim.knockDown(); setFace('dizzy'); }
          else clank(0.4 * k, 0.8);

        }
        // ボールの勢いで体ごと押し出す（物理だけだと軽く押されるだけなので、台から落ちる怖さが出るように足す）
        if (!b.pushed) {

        const sp = Math.abs(pv.y);

  }
}

// ===== ループ（物理は 1/120 秒きざみ・描画は補間）=====
let acc = 0, last = performance.now(), faceTimer = 0, shownT = '';
const hintPos = new THREE.Vector3();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  // 操作 → 歩く向き
  const d = inputDir();
  if (state === 'ready' && (d.x || d.z)) beginPlay();
  sim.walk = state === 'play' ? d : { x: 0, z: 0 };
  updateGame(dt);
  acc += dt;
  while (acc >= sim.DT) {
    for (const v of visuals) { v.pp.copy(v.cp); v.pq.copy(v.cq); }
    for (const o of objs) { o.pp.copy(o.cp); o.pq.copy(o.cq); const lv = o.ball.body.linvel(); o.ball.prevVel = { x: lv.x, y: lv.y, z: lv.z }; }
    sim.step();
    handleHits();
    for (const v of visuals) readBody(sim.parts[v.name].body, v.cp, v.cq);
    for (const o of objs) { readBody(o.ball.body, o.cp, o.cq); o.ball.age += sim.DT; }
    acc -= sim.DT;
  }
  const a = acc / sim.DT;
  for (const v of visuals) { v.group.position.lerpVectors(v.pp, v.cp, a); v.group.quaternion.slerpQuaternions(v.pq, v.cq, a); }
  for (let i = objs.length - 1; i >= 0; i--) {
    const o = objs[i];
    o.mesh.position.lerpVectors(o.pp, o.cp, a); o.mesh.quaternion.slerpQuaternions(o.pq, o.cq, a);
    const age = o.ball.age, life = o.kind === 'tarai' ? 3.2 : 5;
    if (age > life) o.mesh.scale.setScalar(o.base * Math.max(0.01, 1 - (age - life) / 0.4));
    if (age > life + 0.4 || o.cp.y < FLOOR_Y - 2) removeObj(o);
  }
  // 台から落ちた？
  const pt = sim.parts.pelvis.body.translation();
  if (state === 'play' && pt.y < -0.45) fellOff();
  if (state === 'falling') {
    fallT += dt;
    if (fallT > 0.3 && !snapDone) snapAt = true;
    if (fallT > 1.7) showResult();
  }
  // 時間の表示（変わった時だけ書く）
  const ts = fmt(state === 'play' ? elapsed : state === 'ready' ? 0 : score);
  if (ts !== shownT) { shownT = ts; $('timeN').textContent = ts; }
  // 顔
  voiceCool -= dt; crashCool -= dt;
  if (sim.state !== lastState) {
    if (sim.state === 'stand' && lastState === 'getup') { setFace('normal'); beep(880, 0.07, 0); beep(1320, 0.1, 0.09); }
    if (sim.state === 'getup' && state !== 'over' && state !== 'falling') hum();

  }
  if (faceMode === 'hit') { faceT -= dt; if (faceT <= 0) setFace('normal'); }

  // カメラ: ふだんは台の真ん中。落ちたらロボットを追って少し下を見る
  const ty = state === 'falling' || state === 'over' ? Math.max(-2.6, Math.min(0.2, pt.y * 0.4)) : 0.2;
  const kf = 1 - Math.exp(-dt * (state === 'falling' ? 3 : 2));

  const tx = state === 'falling' || state === 'over' ? pt.x * 0.3 : 0, tz = state === 'falling' || state === 'over' ? pt.z * 0.3 : 0;
  camT.x += (tx - camT.x) * kf; camT.z += (tz - camT.z) * kf;

  updateMarks(dt);
  updateParticles(dt);

  if (state === 'ready') {
    hintPos.set(pt.x, 0, pt.z + 0.55).project(camera);
    $('hint').style.left = ((hintPos.x + 1) / 2 * innerWidth).toFixed(1) + 'px'; $('hint').style.top = ((1 - hintPos.y) / 2 * innerHeight).toFixed(1) + 'px';

const snapCv = document.createElement('canvas'); snapCv.width = snapCv.height = 1080;
const rawCv = document.createElement('canvas'); rawCv.width = rawCv.height = 1080;
function snapShot() {
  // 台のふちと落ちていくロボットが入るように、正方形で切り抜く（描画した直後なので canvas から読める）
  const src = renderer.domElement, W = src.width, H = src.height;
  const tp = sim.parts.pelvis.body.translation();
  const v = new THREE.Vector3(tp.x * 0.8, tp.y * 0.7 + 0.3, tp.z * 0.8).project(camera);
  const side = Math.min(W, H) * 0.9;
  let sx = (v.x + 1) / 2 * W - side / 2, sy = (1 - v.y) / 2 * H - side / 2;
  sx = Math.max(0, Math.min(W - side, sx)); sy = Math.max(0, Math.min(H - side, sy));
  const r = rawCv.getContext('2d'); r.fillStyle = '#1d2430'; r.fillRect(0, 0, 1080, 1080);
  r.drawImage(src, sx, sy, side, side, 0, 0, 1080, 1080);
  updateShare();
}
function updateShare() {
  const sc = state === 'over' || state === 'falling' ? t('secT')(fmt(score)) : '';
  const text = `${t('title')} ${sc}\n${TAG}`;
  const a = $('share');
  a.href = 'https://x.com/intent/post?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(SHARE_URL);
  if (matchMedia('(pointer: coarse)').matches) a.removeAttribute('target'); else { a.target = '_blank'; a.rel = 'noopener'; }
  a.dataset.text = text;
  if (!snapDone) return;
  const x = snapCv.getContext('2d');
  x.drawImage(rawCv, 0, 0);
  const g = x.createLinearGradient(0, 760, 0, 1080); g.addColorStop(0, 'rgba(14,18,25,0)'); g.addColorStop(1, 'rgba(14,18,25,0.88)');
  x.fillStyle = g; x.fillRect(0, 760, 1080, 320);
  x.fillStyle = '#fff'; x.textBaseline = 'alphabetic';
  const F = 'system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif';
  x.font = `900 170px ${F}`; const num = fmt(score);
  x.fillText(num, 64, 1000);
  const nw = x.measureText(num).width;
  x.font = `800 72px ${F}`; x.fillText(t('unit').trim(), 64 + nw + 14, 1000);
  x.font = `700 50px ${F}`; x.globalAlpha = 0.85; x.textAlign = 'right';
  x.fillText(t('title'), 1016, 1000); x.globalAlpha = 1; x.textAlign = 'left';
  // 共有用ファイルは先に作っておく（押した時に作ると Safari で共有が止まる）
  snapCv.toBlob(b => { if (b) shareFile = new File([b], 'yoke-robo.png', { type: 'image/png' }); }, 'image/png');
}
$('share').addEventListener('click', e => {
  const text = $('share').dataset.text;
  if (matchMedia('(pointer: coarse)').matches) {
    if (navigator.share && shareFile && navigator.canShare?.({ files: [shareFile] })) {
      e.preventDefault();
      navigator.share({ files: [shareFile], text: `${text}\n${SHARE_URL}` }).catch(() => {});
    }
  } else if (shareFile) {
    const u = URL.createObjectURL(shareFile), d = document.createElement('a');
    d.href = u; d.download = 'yoke-robo.png'; document.body.appendChild(d); d.click(); d.remove();
    setTimeout(() => URL.revokeObjectURL(u), 4000);
  }
});

// ===== ランキング（サーバーは ../../.claude/ranking.gs。生き残った時間を0.1秒単位で「距離」として送る）=====
// ズルを通さないための流れ: start で整理券 → 最初の操作で go → 10秒ごとに cp → 落ちたら submit
const RANK_URL = 'https://script.google.com/macros/s/AKfycbyAE0TZe6QHNZHmRVlMaf2yG6FnfKSyhSrBR57AyhpkJjVmhWfHSz9mL2Tar__EUihGwA/exec';
const GAME = 'yoke-robo', CP_SEC = 10;
let devId = store.get('dev', '');
if (!devId) { devId = Math.random().toString(36).slice(2) + Date.now().toString(36); store.set('dev', devId); }
async function rpost(body, tries = 1) {
  for (let i = 0; i < tries; i++) {
    try { const r = await fetch(RANK_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }); return await r.json(); }
    catch (e) { if (i === tries - 1) throw e; await new Promise(ok => setTimeout(ok, 600)); }
  }
}
let rk = null, rkCp = 0, lastRes = null;
let tokNext = null;
function fetchTok() {
  const tk = { at: Date.now(), tok: null, ok: true };
  tk.p = rpost({ act: 'start', game: GAME, dev: devId }, 3).then(j => { if (j && j.ok) tk.tok = j.tok; else tk.ok = false; }).catch(() => { tk.ok = false; });
  return tk;
}
// 整理券の先取り: 開いた時と、やり直すたびに次の回の分をもらっておく
function rkPrefetch() {
  rk = null;
  if (!RANK_URL) return;
  let tk = tokNext;
  if (!tk || !tk.ok || Date.now() - tk.at > 50 * 60 * 1000) tk = fetchTok();
  tokNext = null;
  rk = { tk, ok: true, tok: null, goAt: 0, chain: tk.p };
}
function rkGo() {
  const me = rk; if (!me) return;
  tokNext = fetchTok();
  me.chain = me.chain.then(() => {
    if (!me.tk.ok || !me.tk.tok) { me.ok = false; return; }
    me.tok = me.tk.tok;
    return rpost({ act: 'go', tok: me.tok }, 3).then(j => { if (j && j.ok) me.goAt = performance.now(); else me.ok = false; });
  }).catch(() => { me.ok = false; });
}
function rkCheckpoint() {
  const me = rk; if (!me || !me.ok) return;
  const n = Math.floor(elapsed / CP_SEC);
  while (rkCp < n) {
    const k = ++rkCp, crossT = performance.now();
    me.chain = me.chain.then(() => {
      if (!me.ok || !me.goAt) { me.ok = false; return; }
      return rpost({ act: 'cp', tok: me.tok, n: k, sec: Math.max(0, (crossT - me.goAt) / 1000) }, 3).then(j => { if (!j || !j.ok) me.ok = false; });
    }).catch(() => { me.ok = false; });
  }
}
function rkFinish() {
  lastRes = { dist: Math.floor(score * 10), ok: !!RANK_URL && !!(rk && rk.ok), sent: false, rk, endT: performance.now() };
  updRankBtn();
}
function updRankBtn() {
  const can = lastRes && lastRes.ok && !lastRes.sent;
  $('rankBtnT').textContent = can ? t('rankReg') : t('rank');
  $('rankBtn').classList.toggle('pulse', !!can);
  $('rankBtn').hidden = !RANK_URL;
}
const rank = { tab: 'today', data: null, msg: '', busy: false, err: '', me: null };
function renderRank() {
  $('tabToday').classList.toggle('on', rank.tab === 'today'); $('tabAll').classList.toggle('on', rank.tab === 'all');
  $('rkNote').textContent = rank.tab === 'today' ? t('rkNote') : '';
  const ol = $('rkList'); ol.textContent = '';
  const list = rank.data && rank.data[rank.tab];
  const empty = s => { const li = document.createElement('li'); li.className = 'empty'; li.textContent = s; ol.appendChild(li); };
  if (!list) empty(rank.err || t('rkLoad'));
  else if (!list.length) empty(t('rkEmpty'));
  else list.forEach((r, i) => {
    const li = document.createElement('li');
    if (rank.me && r.name === rank.me.name && r.wave === rank.me.dist) li.className = 'me';
    const n = document.createElement('span'); n.className = 'n'; n.textContent = i + 1;
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = r.name;
    const d = document.createElement('span'); d.className = 'd'; d.textContent = t('secT')((r.wave / 10).toFixed(1));
    li.append(n, nm, d); ol.appendChild(li);
  });
  let msg = rank.msg;
  if (!msg && lastRes && !lastRes.sent && lastRes.ok === false && state === 'over') msg = 'rkOff';
  $('rkMsg').textContent = !msg ? '' : typeof msg === 'object' ? t('rkYou')(msg.today, msg.all) : t(msg);
  $('rkForm').hidden = !(state === 'over' && lastRes && lastRes.ok && !lastRes.sent);
  $('rkSend').disabled = rank.busy;
}
async function loadRank() {
  rank.err = ''; renderRank();
  try { const r = await fetch(`${RANK_URL}?game=${GAME}`); const j = await r.json(); rank.data = { today: j.today || [], all: j.all || [] }; }
  catch { rank.err = t('rkFail'); }
  renderRank();
}
$('rankBtn').onclick = () => { rank.msg = ''; $('rank').hidden = false; $('rkName').value = $('rkName').value || store.get('name', ''); renderRank(); loadRank(); };
$('rkX').onclick = () => { $('rank').hidden = true; };
$('tabToday').onclick = () => { rank.tab = 'today'; renderRank(); };
$('tabAll').onclick = () => { rank.tab = 'all'; renderRank(); };
$('rkForm').onsubmit = async e => {
  e.preventDefault();
  if (rank.busy || !lastRes || lastRes.sent || !lastRes.ok) return;
  const name = $('rkName').value.replace(/[\u0000-\u001f<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, 8);
  if (!name) return;
  store.set('name', name);
  rank.msg = ''; rank.busy = true; renderRank();
  const res = lastRes, me = res.rk;
  try {
    await me.chain;
    if (!me.ok) { rank.busy = false; res.ok = false; rank.msg = 'rkBad'; renderRank(); updRankBtn(); return; }
    const j = await rpost({ act: 'submit', tok: me.tok, name, dist: res.dist, sec: Math.floor((res.endT - me.goAt) / 1000), dev: devId }, 3);
    rank.busy = false;
    if (j && j.ok) { res.sent = true; rank.me = { name, dist: res.dist }; rank.data = { today: j.today || [], all: j.all || [] }; rank.msg = j.rank; }
    else rank.msg = j && j.error === 'ng' ? 'rkNg' : j && j.error === 'wait' ? 'rkWait' : 'rkBad';
  } catch { rank.busy = false; rank.msg = 'rkFail'; }
  renderRank(); updRankBtn();
};

// ===== はじめ =====
updateShare();
rkPrefetch();
renderer.compile(scene, camera);
// 物理と描画を1回ずつ空回しして、最初の操作でカクつかないようにする
sim.step(); syncVisuals();
renderer.render(scene, camera);
requestAnimationFrame(t0 => { last = t0; frame(t0); });
</script>
