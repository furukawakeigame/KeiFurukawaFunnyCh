    };

    const t = k => DICT[lang][k];
    const langSel = document.getElementById('lang');

      renderControls();

    // ---------- 音 ----------

    const soundBtn = document.getElementById('sound');
    const drawSoundBtn = () => {

    };
    drawSoundBtn();
    soundBtn.addEventListener('click', () => { soundOn = !soundOn; store.set('sound', soundOn); drawSoundBtn(); });
    let ac = null, master = null;
    // iPhone の消音モードでも鳴るように
    function unmuteIOS() {

        v.setUint32(24, 44100, true); v.setUint32(28, 88200, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
        const a = document.createElement('audio');
        a.src = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' })); a.loop = true; a.setAttribute('playsinline', '');

    let noiseBuf = null;
    function initAudio() {
      if (ac) return;
      unmuteIOS();

        ac = new (window.AudioContext || window.webkitAudioContext)();

        noiseBuf = ac.createBuffer(1, ac.sampleRate * 1.5, ac.sampleRate);
        const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

    function tone(type, f0, f1, dur, vol, delay = 0) {

      const o = ac.createOscillator(); o.type = type;

    // ノイズを共鳴（bandpass）に通す。bands: [周波数, Q, 音量]
    function hit(dur, decay, bands, vol = 1, delay = 0) {
      if (!ok()) return;

    // 声: 声帯（のこぎり波）＋息（ノイズ）を、母音ごとの共鳴（フォルマント）に通す
    const VOWEL = { a: [800, 1200, 2600], i: [300, 2300, 3000], u: [350, 1250, 2500], e: [500, 1900, 2600], o: [500, 850, 2500], g: [450, 1100, 2400] };

      if (!ok()) return;
      const now = ac.currentTime;
      const o = ac.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(f0 * 1.1, now);
      o.frequency.linearRampToValueAtTime(f0 * rise, now + dur * 0.2);
      o.frequency.exponentialRampToValueAtTime(f0 * 0.7, now + dur);
      const vib = ac.createOscillator(); vib.frequency.value = 5.5 + Math.random() * 3;
      const vg = ac.createGain(); vg.gain.value = f0 * shake; vib.connect(vg).connect(o.frequency);
      const ns = ac.createBufferSource(); ns.buffer = noiseBuf;
      const ng = ac.createGain(); ng.gain.value = breath;
      const src = ac.createGain();
      o.connect(src); ns.connect(ng).connect(src);
      const out = ac.createGain();
      out.gain.setValueAtTime(0, now);

        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = fi === 0 ? 6 : 9;

        const g = ac.createGain(); g.gain.value = amp * 3;
        src.connect(bp).connect(g).connect(out);
      });
      out.connect(master);
      o.start(now); vib.start(now); ns.start(now, Math.random());
      o.stop(now + dur); vib.stop(now + dur); ns.stop(now + dur);
    }
    const pick = a => a[Math.floor(Math.random() * a.length)];
    const SHOUTS = [['o', 'i', 'a'], ['u', 'o'], ['o', 'a'], ['a', 'a'], ['g', 'a'], ['u', 'a', 'a']];
    const sShout = () => voice(105 + Math.random() * 30, pick(SHOUTS), 0.28 + Math.random() * 0.2, 0.5, 0.06, 0.35);
    // 木のちゃぶ台が床に当たる「ゴトッ」
    function sThud(v) {
      const k = Math.min(1, v / 7);
      hit(0.12, 0.09, [[180, 4, 1.4], [420, 6, 0.7], [1100, 8, 0.25]], 0.3 + 0.9 * k);
      tone('sine', 110, 55, 0.18, 0.35 * k);
    }
    // 食器が割れる「ガシャン」: 高い共鳴をいくつか重ね、破片の小さな「チリン」を足す
    function sCrash(vol = 1) {
      hit(0.35, 0.3, [[2400, 3, 0.9], [4200, 5, 0.6], [6800, 6, 0.4], [1300, 4, 0.4]], vol);
      for (let i = 0; i < 4; i++) tone('sine', 2500 + Math.random() * 3000, 2000 + Math.random() * 2000, 0.08 + Math.random() * 0.12, 0.05 * vol, 0.02 + Math.random() * 0.2);
    }
    // 木がきしむ「ミシッ」
    function sCreak(vol = 1) {
      for (let i = 0; i < 5; i++) hit(0.03, 0.025, [[700 + Math.random() * 900, 7, 1], [260, 5, 0.5]], vol * 0.9, i * 0.02 + Math.random() * 0.02);
      tone('sawtooth', 180, 120, 0.12, 0.05 * vol);
    }
    // ちゃぶ台が割れる「バキッ」
    function sBreak() {
      hit(0.08, 0.07, [[1400, 2, 1], [500, 3, 0.9], [3000, 3, 0.4]], 1.3);

      sCrash(0.6);

    const sSplash = () => hit(0.25, 0.22, [[700, 1.5, 0.6], [1800, 2, 0.4]], 0.6);
    // ふすまが破れる「バリッ」
    function sRip() {
      for (let i = 0; i < 6; i++) hit(0.05, 0.04, [[1800 + Math.random() * 2500, 2, 0.8], [600, 2, 0.4]], 0.9, i * 0.025 + Math.random() * 0.015);
      hit(0.2, 0.18, [[900, 1.2, 0.6]], 0.6, 0.02);
      tone('sine', 140, 60, 0.15, 0.3);
    }
    function sPickup() { if (!ok()) return; tone('sine', 520, 900, 0.08, 0.15); tone('triangle', 1320, 1320, 0.25, 0.08, 0.06); tone('triangle', 1760, 1760, 0.3, 0.06, 0.12); }
    const sNya = () => { voice(560 + Math.random() * 120, ['i', 'a', 'a'], 0.32, 0.32, 0.03, 0.12, 1.3); };
    const sWhoosh = () => hit(0.2, 0.18, [[500, 0.8, 0.5], [1200, 1, 0.3]], 0.35);

    // ---------- 3D ----------
    const stage = document.getElementById('stage');
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const canvasTex = (w, h, draw, rep) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; tx.anisotropy = 4; if (rep) tx.wrapS = tx.wrapT = THREE.RepeatWrapping; return tx; };

    const mat = (c, rough = 0.75, extra) => new THREE.MeshStandardMaterial({ color: c, roughness: rough, ...extra });

    const SPH = new THREE.SphereGeometry(1, 24, 16), CYL = new THREE.CylinderGeometry(1, 1, 1, 24), BOX = new THREE.BoxGeometry(1, 1, 1);
    const CAPS = new THREE.CapsuleGeometry(1, 1, 6, 16);
    const part = (geo, m, x, y, z, sx, sy = sx, sz = sx, parent) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.scale.set(sx, sy, sz); parent?.add(o); return o; };
    const rnd = (a, b) => a + Math.random() * (b - a);

    // 模様（キャンバスで描く）
    const woodDraw = (base, dark) => (c, w, h) => { c.fillStyle = base; c.fillRect(0, 0, w, h); for (let i = 0; i < 60; i++) { c.strokeStyle = `rgba(${dark},${0.08 + Math.random() * 0.22})`; c.lineWidth = 0.6 + Math.random() * 2; const y = Math.random() * h; c.beginPath(); c.moveTo(0, y); c.bezierCurveTo(w * .3, y + rnd(-5, 5), w * .6, y + rnd(-5, 5), w, y + rnd(-3, 3)); c.stroke(); } };
    const darkWoodTex = canvasTex(256, 64, woodDraw('#4a2a16', '20,8,2'), true);
    // ちゃぶ台の天板: 同心円の木目
    const topTex = canvasTex(512, 512, (c, w, h) => {
      c.fillStyle = '#9a5a2c'; c.fillRect(0, 0, w, h);
      for (let r = 4; r < 360; r += 3 + Math.random() * 6) { c.strokeStyle = `rgba(70,30,8,${0.06 + Math.random() * 0.16})`; c.lineWidth = 1 + Math.random() * 2; c.beginPath(); c.ellipse(w * 0.46, h * 0.52, r, r * 0.92, 0.3, 0, Math.PI * 2); c.stroke(); }
      const gr = c.createRadialGradient(w / 2, h / 2, w * 0.2, w / 2, h / 2, w * 0.5); gr.addColorStop(0, 'rgba(255,200,140,.12)'); gr.addColorStop(1, 'rgba(40,15,0,.35)'); c.fillStyle = gr; c.fillRect(0, 0, w, h);

    const sideTex = canvasTex(512, 48, woodDraw('#8a5530', '60,28,10'));
    // ヒビは模様の上に描き足す（もう一度の時は元の模様に戻す）
    const copyCanvas = src => { const c = document.createElement('canvas'); c.width = src.width; c.height = src.height; c.getContext('2d').drawImage(src, 0, 0); return c; };

    function clearCracks() {

    function jag(c, x, y, ang, len, w, depth) {

      const g = c.getContext('2d');
      g.drawImage(snap, 0, 0);
      const gr = g.createLinearGradient(0, 0, 0, 420); gr.addColorStop(0, 'rgba(20,8,0,.55)'); gr.addColorStop(1, 'rgba(20,8,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, 1080, 420);
      g.textAlign = 'center'; g.fillStyle = '#fff'; g.lineJoin = 'round';
      const font = px => `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans Thai", sans-serif`;
      const text = (str, y, px, max) => {
        g.font = font(px);
        const w = g.measureText(str).width; if (w > max) { px *= max / w; g.font = font(px); }
        g.lineWidth = px * .16; g.strokeStyle = '#7a2e10'; g.strokeText(str, 540, y); g.fillText(str, 540, y);
      };
      text(`${score()}m`, 300, 220, 960);
      text(t('title'), 90, 56, 900);
      return c;
    }
    function prepareShare() {
      if (!snap) return;
      const key = lang;
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], `${SLUG}.png`, { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;
    function start() {
      state = 'play';
      reset();
      resultEl.style.display = 'none';
      renderControls(); resize();
    }
    function gameOver() { state = 'over'; overT = 0; }
    let newBest = false;
    function showResult() {
      resultEl.children[0].textContent = `${score()}m`;
      resultEl.children[1].textContent = t('best')(best);
    }
    function finish() {
      state = 'result';
      newBest = score() > best;
      if (newBest) { best = score(); store.set('best', best); }
      showResult();
      resultEl.style.display = 'flex';
      snap = null; needSnap = true;
      renderControls(); resize();
    }

    // ---------- ループ ----------
    const lerpA = (a, b, k) => a + (b - a) * k;
    function render(alpha, dt) {
      const x = lerpA(B.px, B.x, alpha), y = lerpA(B.py, B.y, alpha), a = lerpA(B.pa, B.a, alpha);
      table.position.set(x, y, 0); table.rotation.z = a;
      // カメラはなめらかに追いかける
      const tx = camTX(), ty = camTY();
      camX += (tx - camX) * Math.min(1, dt * (state === 'play' ? 5 : 3));
      camY += (ty - camY) * Math.min(1, dt * 3);
      placeCamera();
      // 浮いているお膳
      for (const [, s] of segs) {
        for (const p of s.pickups) if (!p.got) { p.o.position.y = p.y + Math.sin(nowT * 2 + p.ph) * 0.08; p.o.rotation.y = nowT * 0.8 + p.ph; p.o.userData.ring.rotation.x = Math.PI / 2 + Math.sin(nowT * 3 + p.ph) * 0.2; }
        for (const c of s.cats) { const u = c.o.userData; u.cat.position.y = 0.1 + u.y; u.cat.rotation.z = u.y > 0 ? Math.min(0.6, u.y) : 0; u.face.lookAt(camera.position); }
      }
      // 親父
      const run = Math.min(1, Math.abs(oyajiV) / 4), ph = oyajiPh;
      oyaji.position.set(oyajiX, 0, -0.95);
      oyaji.rotation.y = state === 'result' ? -0.6 : -0.35;
      OY.root.position.y = Math.abs(Math.sin(ph)) * 0.08 * run;
      OY.root.rotation.z = -0.25 * run;
      OY.legs.forEach((l, i) => { const s = Math.sin(ph + i * Math.PI); l.rotation.z = s * 0.9 * run; l.userData.shin.rotation.z = -Math.max(0, -Math.cos(ph + i * Math.PI)) * 1.2 * run; });
      const fl = Math.max(0, 1 - oyajiFlipT / 0.35);
      const angry = state === 'result' ? 1 : 0;
      OY.arms.forEach((ar, i) => {
        const s = Math.sin(ph + i * Math.PI + Math.PI);
        ar.rotation.z = s * 0.9 * run + fl * 2.6 + angry * (0.5 + Math.sin(nowT * 14 + i) * 0.15);
        ar.rotation.x = (i ? 1 : -1) * (0.15 + angry * 0.4);
        ar.userData.fa.rotation.z = 0.6 * run + fl * 0.3 + angry * 1.8;
      });
      OY.mouth.scale.y = 0.025 + (fl + angry * 0.6) * 0.03;
      OY.head.rotation.z = angry * Math.sin(nowT * 9) * 0.08;
      window.__camHook?.(camera);
      renderer.render(scene, camera);
      if (needSnap) { needSnap = false; takeSnap(); prepareShare(); }
    }
    let last = performance.now(), acc = 0;
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      acc += dt;
      if (window.__pause) acc = 0;
      while (acc >= STEP) { step(STEP); acc -= STEP; }
      render(acc / STEP, dt);
      requestAnimationFrame(loop);
    }

    // 開いた時点でちゃぶ台が置いてあり、最初のタップで返して始まる
    state = 'play';
    reset();
    resize();
    applyLang();
    // 最初の1回が重くならないよう、粒や料理を一度描いておく
    {
      const at = new THREE.Vector3(B.x, 1, 0);
      burst(at, 1, GRAIN, fxMat.rice, 0, 0.01, 0.01); burst(at, 1, SHARD, fxMat.white, 0, 0.01, 0.01); burst(at, 1, FLAKE, fxMat.paper, 0, 0.01, 0.01); burst(at, 1, FLAKE, fxMat.fusuma, 0, 0.01, 0.01); burst(at, 1, BOX, fxMat.wood, 0, 0.01, 0.01); burst(at, 1, GRAIN, fxMat.soup, 0, 0.01, 0.01); burst(at, 1, GRAIN, fxMat.dust, 0, 0.01, 0.01); burst(at, 1, GRAIN, fxMat.gold, 0, 0.01, 0.01); burst(at, 1, GRAIN, fxMat.tea, 0, 0.01, 0.01);
      const c = makeCat(); c.position.set(B.x, 0, -1); scene.add(c);
      renderer.compile(scene, camera); renderer.render(scene, camera);
      scene.remove(c);
    }
    requestAnimationFrame(t0 => { last = t0; loop(t0); });
    window.__dbg = { scene, makeFood, THREE, burst, GRAIN, fxMat };
    window.__game = { B, flip, step, start, get hp() { return hp; }, get broken() { return broken; }, get segs() { return segs; }, get state() { return state; }, get ammo() { return ammo; }, score };
  </script>
</body>
