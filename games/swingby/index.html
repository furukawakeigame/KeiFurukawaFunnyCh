    let ac = null, master = null;

    function tone(type, f0, f1, dur, vol, delay = 0) {

      const now = ac.currentTime + delay;

      o.frequency.setValueAtTime(f0, now); o.frequency.exponentialRampToValueAtTime(f1, now + dur);

      const o = ac.createOscillator(); o.type = 'sawtooth';

        courier.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(right, up, fwd));
        throwT += dt;
        const pw = drag ? drag.pow : 0, arm = courier.userData['arm-1'], arm2 = courier.userData.arm1;
        arm.rotation.x = throwT < 0.25 ? -2.6 + throwT / 0.25 * 3.6 : throwT < 0.6 ? 1.0 - (throwT - 0.25) / 0.35 * 1.0 : (drag ? -0.6 - pw * 2.0 : 0);
        arm2.rotation.x = drag ? 0.5 : 0; arm2.rotation.z = state === 'fail' ? -0.3 : 0;
        if (state === 'deliver' || state === 'result') { arm.rotation.z = Math.sin(animT * 10) * 0.3 + 0.4; arm.rotation.x = -2.8; } else arm.rotation.z = 0;
        // 注文の吹き出し: 届け先の衛星の上（画面の上側）に浮かべる
        const mp = cur.tg.getWorldPosition(new THREE.Vector3());
        const upS = new THREE.Vector3(0, Math.cos(EL), -Math.sin(EL));
        const bob = Math.sin(animT * 2.2) * 0.05;
        const delivered = state === 'deliver' || state === 'result';
        const ds = delivered ? Math.min(1, timer / 0.4) : 0;
        const pop = delivered ? 1 + Math.sin(Math.min(1, ds) * Math.PI) * 0.3 : 1;
        bubbleAt.copy(mp).addScaledVector(upS, 0.62 + bob).addScaledVector(CAM_DIR, 0.4);
        bubblePop = pop; bubbleShow = state !== 'result' && state !== 'between' && state !== 'loading' && !(state === 'intro' && introT < introHoldEnd() + 0.4);
        starsShow = state === 'deliver' ? Math.min(1, Math.max(0, (timer - 0.5) / 0.3)) : 0;
      }
      // 点滅するランプ
      launcher.children.forEach(c => { if (c.userData.blink !== undefined) c.visible = Math.sin(animT * 4 + c.userData.blink * 2) > -0.2; });

      // 小包
      predict.clear();
      if (state === 'aim') {
        const st = cur.st, pow = drag ? drag.pow : 0, dir = drag ? drag.dir : aimDir;
        if (drag) aimDir = drag.dir;
        // 小包は地球の表面に乗っていて、狙う向きへ回る。引くほど少し沈む
        const rr = HOME_R + 0.13 - pow * 0.06;
        parcel.position.set(st.L[0] + dir[0] * rr, 0, st.L[1] + dir[1] * rr);
        parcel.rotation.set(0, -Math.atan2(dir[1], dir[0]), 0);
        if (drag && pow >= 0.08) {
          // 引っぱり帯（後ろ）と、最初の少しだけの予測点（前）
          const s = launchState(st, Math.atan2(dir[1], dir[0]), pow, worldT + acc);
          let len = 0, next = 0.32, k = 0;
          for (let i = 0; i < 1500 && len < 3.6; i++) {
            const px = s.x, pz = s.z, h = cur.sim.step(s);
            len += Math.hypot(s.x - px, s.z - pz);
            if (len >= next) { next += 0.3; const f = 1 - len / 3.6; predict.add({ x: s.x, y: 0, z: s.z, vx: 0, vy: 0, vz: 0, life: 1, max: 1, s: 0.16 * (0.4 + f * 0.6), c: [0.8, 1.2, 2.2], a: 0.35 + f * 0.65 }); k++; }
            if (h && h.type !== 'timeout') break;
          }
        } else band.set([], () => 0);
      } else band.set([], () => 0);
      if (shot && (state === 'fly' || state === 'deliver')) {
        const x = prevShot.x + (shot.x - prevShot.x) * alpha, z = prevShot.z + (shot.z - prevShot.z) * alpha;
        parcel.position.set(x, 0.0, z);
        if (state === 'fly') { parcel.rotation.x += dt * 1.3 * speed; parcel.rotation.y += dt * 0.8 * speed; }
        // 大気に近いと熱で赤く光る
        let close = 0, heat = 0;
        if (state === 'fly') {
          for (const b of cur.sim.bodies) {
            if (b.target || b.home) continue;
            posAt(b, shot.t, hitTmp);
            const d = Math.hypot(x - hitTmp[0], z - hitTmp[1]);
            close = Math.max(close, clamp01(1.4 - d / (b.r * 2.4)));
            if (ATMO[b.k]) heat = Math.max(heat, clamp01(1 - (d - b.r) / (b.r * 0.32)) * clamp01(Math.hypot(shot.vx, shot.vz) / 7));
          }
          humSet(close, heat);
          boxMats.forEach(m => m.emissiveIntensity = heat * 2.5);
          if (heat > 0.15 && Math.random() < heat * speed) sparks.add({ x, y: 0, z, vx: -shot.vx * 0.15 + (Math.random() - 0.5), vy: (Math.random() - 0.5), vz: -shot.vz * 0.15 + (Math.random() - 0.5), life: 0.4, max: 0.4, s: 0.12, c: [2, 0.9, 0.3], cool: true, drag: 2 });
        }
      }
      if (state === 'fail' || state === 'fly' || state === 'deliver') {
        const pts = trailPts.concat(state === 'fly' && shot ? [[parcel.position.x, parcel.position.z]] : []);
        trail.set(pts, f => f * f * (state === 'fail' ? Math.max(0, 1 - timer / 1.2) : 1));
      }
      if (state === 'fail') {
        timer += dt;
        // 宇宙の彼方へ: 小さくなって消える
        if (shot && parcel.visible) {
          shot.x += shot.vx * dt * 0.4; shot.z += shot.vz * dt * 0.4;
          parcel.position.set(shot.x, 0, shot.z);
          parcel.scale.setScalar(Math.max(0.001, 1 - timer / 1.1));
        }
        if (timer > 1.6) resetShot();
      }
      if (state === 'intro') introFrame(dt);
      if (state === 'deliver' || state === 'result') {
        timer += dt;
        closeK = Math.min(1, closeK + dt / 1.1);
        const al = cur.house.userData.alien;
        const k = Math.min(1, Math.max(0, (timer - 0.25) / 0.35));
        al.scale.setScalar(Math.max(0.001, k < 1 ? k * (1 + Math.sin(k * Math.PI) * 0.4) : 1));
        al.position.y = 0.02 + Math.abs(Math.sin(timer * 7)) * 0.06 * (timer > 0.6 ? 1 : 0);
        for (const s of [-1, 1]) { const arm = al.userData['arm' + s]; arm.rotation.z = -s * (2.4 + Math.sin(timer * 14 + s) * 0.5); }
        // 家の方を向く
        al.rotation.y = 0;
        if (state === 'deliver' && timer > 2.6) { state = 'between'; nextStage(); }
      }
      if (state === 'result') {
        timer += 0;
      }
      if (cur) cur.house.children.forEach(c => { if (c.userData.blink) c.visible = Math.sin(animT * 3) > -0.3; });
      sparks.update(dt); smoke.update(dt); predict.update(0);
      stars.material.uniforms.time.value = animT;
      updateCamera(dt);
      placeBubble(); placeSay();
      composer.render();
      if (snapPending && closeK >= 1) { snapPending = false; takeSnap(); prepareShare(); }
    }

    // 吹き出しを衛星の上の画面位置に置く（値が変わった時だけDOMを書く）
    const projV = new THREE.Vector3();
    function placeBubble() {
      projV.copy(bubbleAt).project(camera);
      const r = renderer.domElement.getBoundingClientRect();
      const x = (projV.x * 0.5 + 0.5) * r.width, y = (-projV.y * 0.5 + 0.5) * r.height;
      const depth = camera.position.distanceTo(bubbleAt);
      const focal = view.fh / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
      const w = Math.max(48, Math.min(150, 1.0 * focal / depth)) * bubblePop;
      const key = bubbleShow ? `${x | 0},${y | 0},${w | 0},${starsShow.toFixed(2)}` : 'off';
      if (key === lastBubble) return; lastBubble = key;
      orderEl.style.display = bubbleShow ? 'block' : 'none';
      orderEl.style.width = w + 'px';
      orderEl.style.transform = `translate(${x - w / 2}px, ${y - w * 1.125}px)`;
      starsEl.style.display = starsShow > 0 && bubbleShow ? 'block' : 'none';
      starsEl.style.width = w * 1.1 + 'px'; starsEl.style.opacity = starsShow;
      starsEl.style.transform = `translate(${x - w * 0.55}px, ${y - w * 1.125 - w * 0.3}px)`;
    }

    // ---------- はじめ ----------
    (async () => {
      await catReady;
      applyLang();
      buildBackground();
      chooseOrientation();
      layout();
      await buildStage(0);
      chooseOrientation(); layout();
      resetShot(); startIntro();
      composer.render(); // 空回しして、最初のフレームで固まらないように
      requestAnimationFrame(frame);
    })();
    requestAnimationFrame(t0 => { clock.last = t0; });
    window.__game = { get state() { return state; }, get stage() { return stageIdx; }, launch: (a, p) => launch(a, p), jump: async i => { stageIdx = i; await buildStage(i); resetShot(); }, finish: () => { shots = 23; bestDist = 42; finish(); } };
  </script>
</body>
</html>
