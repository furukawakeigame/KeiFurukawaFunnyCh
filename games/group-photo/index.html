  <script type="module">
    import * as THREE from 'three';
    window.PHOTO_READY = true;

    const SHARE_URL = 'https://keifurukawafunnych.com/games/group-photo/';

    const store = {

      en: { title: 'Group Photo', back: '← Back to top', again: 'Play again', post: 'Post on X', count: n => `${n} ${n === 1 ? 'person' : 'people'}`, share: n => `Took a ${n}-person group photo with nobody blinking #集合写真ゲーム` },

    };
    let lang = store.get('lang', null) || autoLang();
    const t = k => DICT[lang][k];
    const langSel = document.getElementById('lang');
    langSel.value = lang;
    langSel.addEventListener('change', () => { lang = langSel.value; store.set('lang', lang); applyLang(); });
    function applyLang() {
      document.documentElement.lang = lang;
      document.title = t('title');
      document.getElementById('back').textContent = t('back');
      renderControls();
      if (state === 'result') { showCount(); shareCache = null; prepareShare(); }
    }

    // ---------- 音 ----------
    let soundOn = store.get('sound', true);
    const soundBtn = document.getElementById('sound');
    const drawSoundBtn = () => {
      soundBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>${soundOn ? '<path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>' : '<path d="M17 9l5 6M22 9l-5 6"/>'}</svg>`;
    };
    drawSoundBtn();
    soundBtn.addEventListener('click', () => { soundOn = !soundOn; store.set('sound', soundOn); drawSoundBtn(); });
    let ac = null;
    // iPhone の消音モードでも鳴らす: 音の種類を「再生」にし、対応していない端末では無音の <audio> をループ再生する
    function unmuteIOS() {

        const n = 4410, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
        const w = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
        w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
        v.setUint32(24, 44100, true); v.setUint32(28, 88200, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
        const a = document.createElement('audio');
        a.src = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' })); a.loop = true; a.setAttribute('playsinline', '');

    }
    function initAudio() {
      if (ac) return;
      unmuteIOS();
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        const o = ac.createOscillator(), g = ac.createGain(); g.gain.value = 0;
        o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.05);
      } catch { ac = null; }
    }
    addEventListener('pointerdown', initAudio, { capture: true });
    addEventListener('keydown', initAudio, { capture: true });
    const on = () => soundOn && ac;
    function tone(type, f0, f1, dur, vol, delay = 0) {
      if (!on()) return;
      const now = ac.currentTime + delay;
      const o = ac.createOscillator(); o.type = type;
      o.frequency.setValueAtTime(f0, now); o.frequency.exponentialRampToValueAtTime(f1, now + dur);
      const g = ac.createGain(); g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      o.connect(g).connect(ac.destination); o.start(now); o.stop(now + dur + 0.02);
    }
    // 短いノイズを複数の共鳴に通す（カシャ・パチ など）
    function hit(delay, len, decay, bands, vol) {
      if (!on()) return;
      const now = ac.currentTime + delay;
      const buf = ac.createBuffer(1, Math.floor(ac.sampleRate * len), ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ac.sampleRate * decay));
      const s = ac.createBufferSource(); s.buffer = buf;
      for (const [f, q, g0] of bands) {
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f * (0.95 + Math.random() * 0.1); bp.Q.value = q;
        const g = ac.createGain(); g.gain.value = g0 * vol; s.connect(bp).connect(g).connect(ac.destination);
      }
      s.start(now);
    }
    // シャッター: 幕が走る「カ」とミラーが戻る「シャ」、本体の小さな胴鳴り
    function sShutter() {
      hit(0, 0.04, 0.004, [[2400, 3, 1.4], [5200, 4, 0.8], [900, 5, 0.6]], 1);
      hit(0.075, 0.09, 0.012, [[3200, 1.5, 0.9], [6500, 2, 0.6], [1400, 4, 0.5]], 0.9);
      tone('sine', 140, 60, 0.09, 0.25);
    }
    // 声: 声帯の振動（のこぎり波＋ゆらぎ）を、母音ごとの共鳴（フォルマント）に通す
    const VOWEL = { a: [800, 1200, 2600], i: [300, 2300, 3000], u: [350, 1250, 2500], e: [500, 1900, 2600], o: [500, 850, 2500] };
    function voice(f0, seq, dur, vol = 0.5, shake = 0.04, breath = 0.15, delay = 0, rise = false) {
      if (!on()) return;
      const now = ac.currentTime + delay;
      const o = ac.createOscillator(); o.type = 'sawtooth';
      if (rise) { // 不満げに上がって落ちる「えー↑↓」
        o.frequency.setValueAtTime(f0 * 0.95, now);
        o.frequency.linearRampToValueAtTime(f0 * 1.3, now + dur * 0.55);
        o.frequency.exponentialRampToValueAtTime(f0 * 0.85, now + dur);
      } else { // 高く出て下がる抑揚
        o.frequency.setValueAtTime(f0 * 1.25, now);
        o.frequency.linearRampToValueAtTime(f0 * 1.4, now + dur * 0.15);
        o.frequency.exponentialRampToValueAtTime(f0 * 0.7, now + dur);
      }
      const vib = ac.createOscillator(); vib.frequency.value = 5.5 + Math.random() * 3;
      const vg = ac.createGain(); vg.gain.value = f0 * shake; vib.connect(vg).connect(o.frequency);
      const nb = ac.createBuffer(1, Math.floor(ac.sampleRate * dur), ac.sampleRate), nd = nb.getChannelData(0);
      for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
      const ns = ac.createBufferSource(); ns.buffer = nb;
      const ng = ac.createGain(); ng.gain.value = breath;
      const src = ac.createGain();
      o.connect(src); ns.connect(ng).connect(src);
      const out = ac.createGain();
      out.gain.setValueAtTime(0, now);
      out.gain.linearRampToValueAtTime(vol, now + 0.02);
      out.gain.setValueAtTime(vol, now + dur * 0.6);
      out.gain.exponentialRampToValueAtTime(0.001, now + dur);
      const k = f0 > 260 ? 1.15 : 1;
      [1, 0.6, 0.25].forEach((amp, fi) => {
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = fi === 0 ? 6 : 9;
        seq.forEach((v, si) => { const tt = now + dur * si / Math.max(1, seq.length - 1) * 0.7; bp.frequency[si ? 'linearRampToValueAtTime' : 'setValueAtTime'](VOWEL[v][fi] * k, tt); });
        const g = ac.createGain(); g.gain.value = amp * 3;
        src.connect(bp).connect(g).connect(out);
      });
      out.connect(ac.destination);
      o.start(now); vib.start(now); ns.start(now);
      o.stop(now + dur); vib.stop(now + dur); ns.stop(now + dur);
    }
    // 撮れた: 小さな歓声と拍手
    function sCheer() {
      if (!on()) return;
      const ps = persons.slice().sort(() => Math.random() - 0.5).slice(0, 5);
      ps.forEach((p, i) => {
        if (p.cat) voice(560, ['i', 'a', 'u'], 0.4, 0.25, 0.03, 0.1, 0.05 + Math.random() * 0.15);
        else voice(p.f0 * 1.25, pick([['i', 'e'], ['e', 'i'], ['a', 'a'], ['i', 'a']]), 0.22 + Math.random() * 0.12, 0.2, 0.05, 0.2, Math.random() * 0.2);
      });
      for (let i = 0; i < 14; i++) hit(0.05 + Math.random() * 0.6, 0.03, 0.005, [[1300, 2, 1], [2600, 3, 0.5]], 0.25 + Math.random() * 0.2);
    }
    // 目をつぶった人の「えー」
    function sComplain(p, delay) {
      if (p.cat) { voice(520, ['i', 'a', 'u'], 0.55, 0.45, 0.03, 0.1, delay); return; }
      voice(p.f0 * 1.05, ['e', 'e'], 0.5 + Math.random() * 0.15, 0.5, 0.05, 0.15, delay, true);
    }
    const sPop = () => { tone('sine', 280 + Math.random() * 80, 640, 0.07, 0.1); };

    // ---------- 3D ----------
    const stage = document.getElementById('stage');
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    stage.prepend(renderer.domElement);
    const scene = new THREE.Scene();
    const canvasTex = (w, h, draw) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; return tx; };
    scene.background = canvasTex(4, 256, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#5aa8ea'); gr.addColorStop(0.55, '#a9d8f4'); gr.addColorStop(1, '#eaf6ea'); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
    scene.fog = new THREE.Fog('#d6ecdf', 22, 60);
    const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 200);
    scene.add(new THREE.HemisphereLight('#e2f1ff', '#5a7a3a', 1.15));
    const sun = new THREE.DirectionalLight('#fff1dc', 2.3); sun.position.set(-5, 11, 9);
    sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); sun.shadow.radius = 4; sun.shadow.bias = -0.0006;
    Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -6, near: 1, far: 40 });
    scene.add(sun);

    const mat = (c, rough = 0.75) => new THREE.MeshStandardMaterial({ color: c, roughness: rough });
    const shade = o => { o.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); return o; };
    const pick = a => a[Math.floor(Math.random() * a.length)];
    const rnd = (a, b) => a + Math.random() * (b - a);
    const SPH = new THREE.SphereGeometry(1, 28, 18), CYL = new THREE.CylinderGeometry(1, 1, 1, 20);
    const TORSO = new THREE.CapsuleGeometry(1, 1, 8, 20), BOX = new THREE.BoxGeometry(1, 1, 1);
    const CAP = new THREE.SphereGeometry(1, 24, 12, 0, Math.PI * 2, 0, Math.PI * 0.5);
    const LID = new THREE.SphereGeometry(1, 24, 12, 0, Math.PI * 2, 0, Math.PI * 0.5);
    const LASH = new THREE.TorusGeometry(1, 0.07, 4, 24, Math.PI);
    const part = (geo, m, x, y, z, sx, sy = sx, sz = sx, parent) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.scale.set(sx, sy, sz); parent?.add(o); return o; };

    // 地面・ひな壇・まわりの木
    const SP = 1.08, STEP_H = 0.42, STEP_D = 0.8;
    {
      const grass = canvasTex(256, 256, (c, w, h) => { c.fillStyle = '#6cbf4a'; c.fillRect(0, 0, w, h); for (let i = 0; i < 2600; i++) { c.fillStyle = `hsl(${95 + Math.random() * 20},${45 + Math.random() * 20}%,${34 + Math.random() * 22}%)`; c.fillRect(Math.random() * w, Math.random() * h, 1.5, 3 + Math.random() * 3); } });
      grass.wrapS = grass.wrapT = THREE.RepeatWrapping; grass.repeat.set(24, 24);
      const ground = new THREE.Mesh(new THREE.CircleGeometry(60, 48), new THREE.MeshStandardMaterial({ map: grass, roughness: 1 }));
      ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
      // ひな壇: 木目の段
      const wood = canvasTex(256, 64, (c, w, h) => { c.fillStyle = '#b07a48'; c.fillRect(0, 0, w, h); for (let i = 0; i < 40; i++) { c.strokeStyle = `rgba(80,40,12,${0.1 + Math.random() * 0.2})`; c.lineWidth = 1 + Math.random() * 2; const y = Math.random() * h; c.beginPath(); c.moveTo(0, y); c.bezierCurveTo(w * .3, y + Math.random() * 6 - 3, w * .6, y + Math.random() * 6 - 3, w, y); c.stroke(); } for (let x = 0; x < w; x += 64) { c.fillStyle = 'rgba(60,30,10,.35)'; c.fillRect(x, 0, 2, h); } });
      wood.wrapS = wood.wrapT = THREE.RepeatWrapping; wood.repeat.set(3, 1);
      const woodM = new THREE.MeshStandardMaterial({ map: wood, roughness: 0.8 });
      for (let k = 1; k <= 3; k++) {
        const b = new THREE.Mesh(BOX, woodM);
        b.scale.set(7.4, STEP_H * k, STEP_D); b.position.set(0, STEP_H * k / 2, -STEP_D * k);
        b.castShadow = b.receiveShadow = true; scene.add(b);
      }
      const back = part(BOX, woodM, 0, STEP_H * 1.5, -STEP_D * 4 + 0.1, 7.4, STEP_H * 3, 0.6); back.castShadow = back.receiveShadow = true; scene.add(back);
      // 草と花
      const tuft = new THREE.ConeGeometry(0.06, 0.35, 5), tuftM = mat('#4f9a35');
      const petal = new THREE.SphereGeometry(0.09, 8, 6);
      for (let i = 0; i < 110; i++) {
        const x = rnd(-14, 14), z = rnd(-14, 6);
        if (Math.abs(x) < 4.2 && z > -4 && z < 2.6) continue; // ひな壇と手前は空ける
        if (Math.random() < 0.3) {

    let shotReq = false;
    stage.addEventListener('pointerdown', e => { e.preventDefault(); if (state === 'play') shotReq = true; }, { passive: false });
    addEventListener('keydown', e => { if ((e.code === 'Space' || e.code === 'Enter') && state === 'play' && document.activeElement?.tagName !== 'SELECT') { e.preventDefault(); shotReq = true; } });
    stage.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

    // ---------- ゲーム ----------
    let state = 'play', armed = false, roundT = 0, shotT = 0, shotOk = false, closedOnes = [], score = 0, flown = false;
    const print = document.getElementById('print'), printCv = print.querySelector('canvas');
    const pile = document.getElementById('pile'), flash = document.getElementById('flash'), countEl = document.getElementById('count');
    let photo = null, printTilt = 0;

    function pickKind(n) {
      if (n === 4) return 'double';
      if (n === 5) return 'quick';
      if (n === 6) return 'sleepy';
      if (n < 4) return 'normal';
      const r = Math.random();
      return r < 0.4 ? 'normal' : r < 0.6 ? 'quick' : r < 0.8 ? 'double' : 'sleepy';
    }
    function start() {
      clearPersons();
      addPerson(makeCat(), false);
      addPerson(makeHuman('normal'), false);
      addPerson(makeHuman('normal'), false);
      arrange(true);
      for (const p of persons) p.prevPos.copy(p.pos);
      state = 'play'; armed = false; roundT = 0; score = 0;
      pile.innerHTML = '';
      print.style.display = 'none'; countEl.style.display = 'none';
      finder.style.display = '';
      renderControls(); resize();
    }

    function takePhoto() {
      // ファインダーの中をそのまま写真にする
      const src = renderer.domElement, pr = src.width / W;
      const scale = Math.min(1, 1000 / (frame.w * pr));
      const pw = Math.round(frame.w * pr * scale), ph = Math.round(frame.h * pr * scale);
      photo = document.createElement('canvas'); photo.width = pw; photo.height = ph;
      const g = photo.getContext('2d');
      g.drawImage(src, frame.x * pr, frame.y * pr, frame.w * pr, frame.h * pr, 0, 0, pw, ph);
      return { g, k: pw / frame.w };
    }
    function markClosed(g, k) {
      // 目をつぶった人を赤丸で囲む
      for (const p of closedOnes) {
        const c = p.head.localToWorld(new THREE.Vector3(0, p.cat ? 0.05 : 0.06, 0.45));
        const e = p.head.localToWorld(new THREE.Vector3(p.cat ? 0.5 : 0.42, p.cat ? 0.05 : 0.06, 0.45));
        const a = c.clone().project(camera), b = e.clone().project(camera);
        const sx = v => ((v.x + 1) / 2 * W - frame.x) * k, sy = v => ((1 - v.y) / 2 * H - frame.y) * k;
        const r = Math.hypot(sx(b) - sx(a), sy(b) - sy(a)) * 1.05;
        g.strokeStyle = '#e8202a'; g.lineWidth = Math.max(3, r * 0.12); g.lineCap = 'round';
        g.beginPath(); g.ellipse(sx(a), sy(a), r * 1.1, r * 0.85, -0.1, 0.15, Math.PI * 2 + 0.05); g.stroke();
      }
    }

    function doShot() {
      armed = true;
      sShutter();
      render(1); // 写真に写る瞬間を描き、その状態で判定する
      // ファインダーに目が写っている人だけを判定する
      const inFrame = p => {
        const v = p.head.localToWorld(new THREE.Vector3(0, 0.06, 0.45)).project(camera);
        const x = (v.x + 1) / 2 * W, y = (1 - v.y) / 2 * H;
        return x > frame.x && x < frame.x + frame.w && y > frame.y && y < frame.y + frame.h;
      };
      closedOnes = persons.filter(p => p.o < OPEN && inFrame(p));
      shotOk = closedOnes.length === 0;
      const { g, k } = takePhoto();
      if (!shotOk) markClosed(g, k);
      // フラッシュ
      flash.animate([{ opacity: 0.95 }, { opacity: 0 }], { duration: 380, easing: 'ease-out' });
      // 写真がプリントされて出てくる
      printCv.width = photo.width; printCv.height = photo.height;
      printCv.getContext('2d').drawImage(photo, 0, 0);
      printTilt = rnd(-4, 4);
      const w = Math.min(frame.w * 0.62, 520);
      placePrint(frame.x + frame.w / 2 - w / 2, frame.y + frame.h * 0.5 - (w / (frame.w / frame.h) + w * 0.12) / 2, w, printTilt);
      print.className = 'print';
      print.style.display = 'block';
      void print.offsetWidth;
      print.className = 'print develop pop';
      state = 'shot'; shotT = 0; flown = false;
      if (shotOk) score = persons.length;
      // フラッシュにつられて、みんな少しあとでまばたき
      for (const p of persons) if (p.bt < 0 && (shotOk || !closedOnes.includes(p))) p.next = rnd(0.12, 0.4);
    }
    function placePrint(x, y, w, tilt) {
      const pad = w * 0.04;
      Object.assign(print.style, { left: x + 'px', top: y + 'px', width: w + 'px', padding: `${pad}px ${pad}px ${pad * 3}px`, transform: `rotate(${tilt}deg)` });
    }
    function flyToPile() {
      const n = pile.children.length;
      print.className = 'print fly';
      placePrint(12 + Math.min(n, 8) * 3, 8 + Math.min(n, 8) * 2, 56, rnd(-10, 10));
      setTimeout(() => {
        if (state === 'result') return;
        const c = document.createElement('canvas'); c.width = 160; c.height = Math.round(160 * photo.height / photo.width);
        c.getContext('2d').drawImage(printCv, 0, 0, c.width, c.height);
        c.style.transform = print.style.transform;
        c.style.left = Math.min(n, 8) * 3 + 'px'; c.style.top = Math.min(n, 8) * 2 + 'px';
        pile.append(c);
        if (print.classList.contains('fly')) print.style.display = 'none';
      }, 460);
    }
    function join() {
      if (persons.length >= MAX) return;
      const p = makeHuman(pickKind(persons.length + 1));
      addPerson(p, true);
      arrange(false);
      sPop();
    }

    function stepGame(dt) {
      if (state === 'play' && armed) roundT += dt;
      const fat = 1 + Math.min(2, roundT * 0.09); // 待つほど疲れてまばたきが増える
      for (const p of persons) {
        stepEyes(p, dt, state === 'play' ? fat : 1);
        // 位置の移動（段を移るときはぴょんと跳ぶ）
        p.prevPos.copy(p.pos);
        if (p.mt < 1) {
          const dist = p.from.distanceTo(p.to);
          p.mt = Math.min(1, p.mt + dt / Math.max(0.35, dist * 0.08));
          const e = ease(p.mt);
          p.pos.lerpVectors(p.from, p.to, e);
          p.pos.y += Math.abs(Math.sin(p.mt * Math.PI * Math.max(1, Math.round(dist / 1.2)))) * 0.25;
        }
      }
      // カメラの寄り引き
      const kf = 1 - Math.exp(-dt * 3);
      for (const key of ['w', 'h', 'cy', 'cz']) fit[key] += (fitTarget[key] - fit[key]) * kf;
      if (state === 'shot') {
        shotT += dt;
        if (shotOk) {
          if (shotT > 0.25 && !flown) { flown = true; sCheer(); }
          if (shotT > 0.95 && print.classList.contains('develop')) { flyToPile(); join(); }
          if (shotT > 1.05) { state = 'play'; roundT = 0; }
        } else {
          if (shotT > 0.3 && !flown) {
            flown = true;
            closedOnes.forEach((p, i) => {
              sComplain(p, i * 0.12);
              if (!p.cat) { p.smile.visible = false; p.ooh.visible = true; p.brows.forEach((b, s) => b.rotation.z = (s ? 1 : -1) * 0.3); }
              p.base = 1; p.drowse = 0; p.waking = false; p.complain = 0;
            });
          }
          if (shotT > 1.5) finish();
        }
      }
      for (const p of closedOnes) if (p.complain !== undefined && state !== 'play') p.complain += dt;
    }

    // ---------- 画面 ----------
    function renderControls() {
      controls.innerHTML = '';
      controls.classList.toggle('hide', state !== 'result');
      if (state !== 'result') return;
      const b = document.createElement('button');
      b.className = 'go'; b.textContent = t('again');
      b.addEventListener('click', start);
      controls.append(b);
      const a = document.createElement('a');
      a.className = 'post'; a.textContent = t('post');
      a.href = `https://x.com/intent/post?text=${encodeURIComponent(t('share')(score))}&url=${encodeURIComponent(SHARE_URL)}`;
      const coarse = matchMedia('(pointer: coarse)').matches;
      if (!coarse) { a.target = '_blank'; a.rel = 'noopener'; }
      // スマホは画像ごと共有シートへ。PCは画像を保存してから投稿画面を開く
      a.addEventListener('click', e => {
        const text = t('share')(score);
        if (coarse && navigator.share) {
          e.preventDefault();
          const file = shareFile();
          const data = file && navigator.canShare?.({ files: [file] }) ? { files: [file], text: `${text}\n${SHARE_URL}` } : { text: `${text}\n${SHARE_URL}` };
          navigator.share(data).catch(() => {});
          return;
        }
        const img = resultImage();
        if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'group-photo.png'; d.click(); }
      });
      controls.append(a);
    }
    function showCount() { countEl.textContent = t('count')(score); }
    function layoutResult() {
      // 写真を大きく、その下（背の低い横長では右）に人数
      const top = 8, bottom = btnReserve() + 8, aw = W - 24, ah = Math.max(100, H - top - bottom);
      const a = photo.width / photo.height;
      const fs = Math.round(THREE.MathUtils.clamp(Math.min(W, H) * 0.11, 40, 100));
      countEl.style.fontSize = fs + 'px';
      const ratio = w => (w * 0.92) / a + w * 0.16; // プリントの高さ（余白込み）
      const side = H <= 520 && W / H >= 4 / 3;
      if (side) {
        const w = Math.min(aw * 0.62, ah / ratio(1), 900), h = ratio(w);
        const x = 12 + (aw * 0.66 - w) / 2;
        placePrint(x, top + (ah - h) / 2, w, -2);
        Object.assign(countEl.style, { left: (x + w + 12) + 'px', width: (W - x - w - 24) + 'px', top: top + 'px', height: ah + 'px' });
      } else {
        const ch = fs * 1.4;
        const w = Math.min(aw * 0.92, (ah - ch) / ratio(1), 760), h = ratio(w);
        const y = top + (ah - ch - h) / 2;
        placePrint((W - w) / 2, y, w, -2);
        Object.assign(countEl.style, { left: '0px', width: W + 'px', top: (y + h + 6) + 'px', height: ch + 'px' });
      }
    }
    function finish() {
      state = 'result';
      finder.style.display = 'none';
      print.className = 'print move';
      print.style.display = 'block';
      layoutResult();
      showCount(); countEl.style.display = 'flex';
      renderControls();
      shareCache = null; prepareShare();
    }

    // 結果画像: 撮った写真をプリントにして、人数を重ねる
    let shareCache = null;
    function resultImage() {
      if (!photo) return null;
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const g = c.getContext('2d');
      // 背景: 写真を大きく薄く敷く
      g.fillStyle = '#3d5a34'; g.fillRect(0, 0, 1080, 1080);
      const s = Math.max(1080 / photo.width, 1080 / photo.height);
      g.globalAlpha = 0.35; g.drawImage(photo, (1080 - photo.width * s) / 2, (1080 - photo.height * s) / 2, photo.width * s, photo.height * s); g.globalAlpha = 1;
      const a = photo.width / photo.height;
      let pw = 820, ph = pw / a; if (ph > 640) { ph = 640; pw = ph * a; }
      const pad = pw * 0.04;
      g.save(); g.translate(540, 130 + (ph + pad * 4) / 2); g.rotate(-0.03);
      g.shadowColor = 'rgba(0,0,0,.45)'; g.shadowBlur = 30; g.shadowOffsetY = 10;
      g.fillStyle = '#fbfaf6'; g.fillRect(-pw / 2 - pad, -(ph + pad * 4) / 2, pw + pad * 2, ph + pad * 4);
      g.shadowColor = 'transparent';
      g.drawImage(photo, -pw / 2, -(ph + pad * 4) / 2 + pad, pw, ph);
      g.restore();
      g.textAlign = 'center'; g.fillStyle = '#fff'; g.lineJoin = 'round';
      const font = px => `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans Thai", sans-serif`;
      const text = (str, y, px, max) => {
        g.font = font(px);
        const w = g.measureText(str).width; if (w > max) { px *= max / w; g.font = font(px); }
        g.lineWidth = px * .16; g.strokeStyle = '#6b3d1c'; g.strokeText(str, 540, y); g.fillText(str, 540, y);
      };
      text(t('count')(score), 1030, 150, 960);
      text(t('title'), 80, 52, 900);
      return c;
    }
    function prepareShare() {
      if (!photo) return;
      const key = lang;
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'group-photo.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;

    // ---------- ループ ----------
    const STEP = 1 / 60;
    function render(alpha) {
      for (const p of persons) {
        p.g.position.lerpVectors(p.prevPos, p.pos, alpha);
        const tt = performance.now() / 1000 + p.sway;
        p.g.rotation.z = Math.sin(tt * 1.3) * 0.015;
        p.head.rotation.z = Math.sin(tt * 0.9) * 0.04;
        if (p.complain !== undefined && state !== 'play') p.head.rotation.y = Math.sin(p.complain * 22) * 0.12 * Math.max(0, 1 - p.complain * 1.2);
        else p.head.rotation.y = Math.sin(tt * 0.6) * 0.05;
        if (p.cat) { drawCat(p.o); continue; }
        const a = OPEN_A + (CLOSE_A - OPEN_A) * (1 - p.o);
        for (const e of p.eyes) { e.lid.rotation.x = a; e.look.rotation.y += (p.lx - e.look.rotation.y) * 0.3; e.look.rotation.x += (-p.ly - e.look.rotation.x) * 0.3; }
      }
      updateCamera();
      renderer.render(scene, camera);
    }
    let last = performance.now(), acc = 0;
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      acc += dt;
      while (acc >= STEP) { stepGame(STEP); acc -= STEP; }
      if (shotReq) { shotReq = false; if (state === 'play') { doShot(); requestAnimationFrame(loop); return; } }
      render(acc / STEP);
      requestAnimationFrame(loop);
    }

    resize();
    start();
    applyLang();
    // 最初の1回が重くならないように、一度描いておく
    { const extra = makeHuman('normal'); scene.add(shade(extra.g)); extra.g.position.set(0, 0, -30); renderer.compile(scene, camera); renderer.render(scene, camera); scene.remove(extra.g); }
    requestAnimationFrame(t0 => { last = t0; loop(t0); });
  </script>
</body>
</html>
