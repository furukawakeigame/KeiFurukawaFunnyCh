    bullets.push(newBullet(POUCH.x, POUCH.y, v.ang, sp * 0.85, { r: S.r * 2.2, dmg: S.dmg * (2 + lv.charge * 1.5), pierce: 999, bounce: S.bounce, boom: S.boom, charged: true }));

    shots++;

    volley(v.ang, sp, gold ? 4 : 1, gold);
    // 二連射: 少し遅れて、もう一度（少し弱い）
    for (let j = 1; j <= lv.double; j++) volleys.push({ t: j * 0.11, ang: v.ang, sp, k: 0.6 });

function volley(ang, sp, k, gold) {
  const S = stats(), n = S.multi, spread = 0.13;

// ===== 3択 =====
let choices = [];
function offer() {
  const afterBoss = wave % 5 === 0;
  let pool = UPS.filter(k => lv[k] < UP[k].max && (k !== 'heal' || life < maxLife || maxLife < 8) && (k !== 'glass' || (maxLife >= 4 && wave >= 3)) && (k !== 'sacrifice' || (maxLife >= 3 && wave >= 3)) && (k !== 'heavy' || wave >= 3));
  const w8 = k => RW[UP[k].r] * (UP[k].r === 1 || UP[k].r === 2 ? 1 + lv.lucky * 0.6 : 1);
  const want = lv.lucky >= 2 ? 4 : 3;
  if (afterBoss && pool.filter(k => UP[k].r > 0).length >= 3) pool = pool.filter(k => UP[k].r > 0);
  const c = [];
  while (c.length < want && pool.length) {
    const tot = pool.reduce((s, k) => s + w8(k), 0);
    let x = Math.random() * tot, i = 0;
    for (; i < pool.length - 1; i++) { x -= w8(pool[i]); if (x <= 0) break; }
    c.push(pool.splice(i, 1)[0]);
  }
  choices = c;
  state = 'pick';
  renderCards();
  $('pick').hidden = false;
  requestAnimationFrame(() => requestAnimationFrame(() => $('pick').classList.add('show')));
}
function renderCards() {
  const box = $('pick'); box.innerHTML = ''; box.classList.toggle('four', choices.length > 3);
  choices.forEach((k, i) => {
    const b = document.createElement('button'); b.className = 'card r' + UP[k].r;
    const c = document.createElement('canvas'); c.width = c.height = 160; drawIcon(c.getContext('2d'), k, 160);
    const name = document.createElement('b'); name.textContent = L[lang].up[k];
    const dots = document.createElement('span'); dots.className = 'dots';
    if (k !== 'heal' && UP[k].max > 1) for (let j = 0; j < UP[k].max; j++) { const d = document.createElement('i'); if (j < lv[k]) d.className = 'on'; dots.append(d); }
    b.append(c, name, dots);
    b.onclick = () => choose(i);
    box.append(b);
  });
}
function choose(i) {
  if (state !== 'pick') return;
  const k = choices[i];
  if (k === 'heal') { if (life >= maxLife) maxLife++; life = Math.min(maxLife, life + 2); sHeal(); }
  else if (k === 'glass') { lv.glass = 1; maxLife -= 2; life = Math.min(life, maxLife); sCard(); }
  else if (k === 'sacrifice') {
    // いけにえ: ハートの最大を1つ差し出して、強化を2つもらう
    lv.sacrifice++; maxLife -= 1; life = Math.min(life, maxLife); sCard();
    for (let n = 0; n < 2; n++) {
      const pool = UPS.filter(q => UP[q].r < 3 && q !== 'heal' && lv[q] < UP[q].max);
      if (!pool.length) break;
      const q = pick(pool); lv[q]++; gains.push({ k: q, t: -n * 0.35 });
    }
  }
  else { lv[k]++; sCard(); }
  $('pick').classList.remove('show'); $('pick').hidden = true;
  wave++; startWave(); state = 'play'; reloadT = 0;
}

function hurtEnemy(e, dmg, kx, ky, b) {

      e.hp = 0; for (let i = 0; i < 6; i++) parts.push({ x: e.x, y: e.y, vx: rnd(-200, 200), vy: rnd(-200, 200), life: 0.4, max: 0.4, c: '#c92a2a', s: 3.5 });

  const s = Math.min(W / 420, 2.2, Math.max(avail / 600, Math.min(0.8, avail / 400)));

// 形を作る関数 pb で、べた塗り → 右下に斜線の影 → ペンのふち
function shape(pb, col, id, cx, cy, r, opt = {}) {
  pb(); ctx.fillStyle = col; ctx.fill();
  if (opt.hatch !== false) {
    ctx.save(); pb(); ctx.clip();
    ctx.beginPath(); ctx.arc(cx + r * 0.55, cy + r * 0.6, r * 1.05, 0, 7); ctx.clip();
    ctx.strokeStyle = opt.hc || 'rgba(46,36,24,.35)'; ctx.lineWidth = Math.max(1, r * 0.06); ctx.lineCap = 'round';
    ctx.beginPath();
    const step = Math.max(3, r * 0.22);
    for (let d = -r * 2; d < r * 2; d += step) { ctx.moveTo(cx + d - r, cy + r); ctx.lineTo(cx + d + r, cy - r); }
    ctx.stroke(); ctx.restore();

const circ = (x, y, r) => () => { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); };
const ell = (x, y, rx, ry, rot = 0) => () => { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, 7); };
// 手で引いたような線（真ん中が少しふくらむ）
function pline(x1, y1, x2, y2, id, lw = 2, col = INK) {
  const mx = (x1 + x2) / 2 + hash(id) * 1.5, my = (y1 + y2) / 2 + hash(id + 2) * 1.5;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo(mx, my, x2, y2); ink(id, lw, col);

// 紙の上にクレヨンで描いた草原（Canvasで描く）
let grassPat = null;
function makeGrass() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#c3dc96'; g.fillRect(0, 0, 256, 256);
  // 紙のざらつき
  for (let i = 0; i < 2500; i++) { g.fillStyle = Math.random() < 0.5 ? 'rgba(255,255,240,.25)' : 'rgba(80,90,40,.08)'; g.fillRect(rnd(0, 256), rnd(0, 256), 1.2, 1.2); }
  // クレヨンのむら
  for (let i = 0; i < 26; i++) {
    g.strokeStyle = `rgba(${pick(['120,170,70', '160,200,110', '100,150,60'])},.18)`; g.lineWidth = rnd(6, 12); g.lineCap = 'round';
    const x = rnd(0, 256), y = rnd(0, 256), a = rnd(-0.4, 0.4);
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * 40, y + Math.sin(a) * 40); g.stroke();
  }
  // 草のちょぼちょぼ（V字の3本線）
  g.lineCap = 'round';
  for (let i = 0; i < 70; i++) {
    const x = rnd(4, 252), y = rnd(6, 252), h = rnd(5, 9);
    g.strokeStyle = Math.random() < 0.6 ? 'rgba(70,120,40,.75)' : 'rgba(110,160,60,.8)'; g.lineWidth = 1.4;
    g.beginPath(); g.moveTo(x - 3, y - h * 0.8); g.lineTo(x, y); g.lineTo(x, y - h); g.moveTo(x, y); g.lineTo(x + 3, y - h * 0.8); g.stroke();
  }
  // らくがきの花
  for (let i = 0; i < 6; i++) {
    const x = rnd(10, 246), y = rnd(10, 246), col = pick(['#fffdf5', '#ffe066', '#ffc9de']);
    for (let k = 0; k < 5; k++) { const a = k / 5 * 7; g.beginPath(); g.arc(x + Math.cos(a) * 3.2, y + Math.sin(a) * 3.2, 2.6, 0, 7); g.fillStyle = col; g.fill(); g.strokeStyle = 'rgba(46,36,24,.6)'; g.lineWidth = 0.9; g.stroke(); }
    g.fillStyle = '#f59f00'; g.beginPath(); g.arc(x, y, 1.8, 0, 7); g.fill();
  }
  grassPat = ctx.createPattern(c, 'repeat');
}

// ===== 描画 =====
const lerp = (a, b, k) => a + (b - a) * k;
function draw(k) {
  const { s, ox, oy, W, H, dpr } = lay;
  boil = Math.floor(time * 6);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // 草原（画面いっぱい、下端まで）
  ctx.fillStyle = grassPat; ctx.fillRect(0, 0, W, H);
  const sx = shake > 0 ? Math.sin(time * 70) * shake * 14 : 0, sy = shake > 0 ? Math.cos(time * 63) * shake * 10 : 0;
  ctx.setTransform(dpr * s, 0, 0, dpr * s, dpr * (ox + sx), dpr * (oy + sy));
  const left = -ox / s - 20, right = (W - ox) / s + 20, top = -oy / s - 20, bottom = (H - oy) / s + 20;

  // 遠く（上）ほど紙の白っぽさが残る
  const fog = ctx.createLinearGradient(0, top, 0, 260);
  fog.addColorStop(0, 'rgba(255,253,240,.4)'); fog.addColorStop(1, 'rgba(255,253,240,0)');
  ctx.fillStyle = fog; ctx.fillRect(left, top, right - left, 280 - top);
  // 両脇の生け垣（弾が跳ね返る壁）
  for (const side of [0, 1]) {
    const x0 = side ? FW : left, w = side ? right - FW : -left;
    ctx.fillStyle = 'rgba(60,100,40,.28)'; ctx.fillRect(x0, top, w, WALL_Y - top);
    for (let y = Math.floor(top / 26) * 26; y < WALL_Y; y += 26) {
      const bx = (side ? FW + 6 : -6) + Math.sin(y * 0.7) * 3;
      ctx.beginPath(); ctx.arc(bx, y, 16, 0, 7); ctx.fillStyle = '#6fae46'; ctx.fill();
      ctx.beginPath(); ctx.arc(bx + (side ? 5 : -5), y + 4, 9, 0.2, 2.6); ctx.strokeStyle = 'rgba(40,80,25,.55)'; ctx.lineWidth = 1.6; ctx.stroke();
      ctx.beginPath(); ctx.arc(bx, y, 16, side ? Math.PI * 0.5 : -Math.PI * 0.5, side ? Math.PI * 1.5 : Math.PI * 0.5); ink(y + side * 50, 2);
    }
  }

  for (const p of splats) {
    ctx.globalAlpha = Math.min(1, p.life / 2) * 0.35; ctx.fillStyle = p.c;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.beginPath();

    ctx.fill(); ctx.restore();
  }
  ctx.globalAlpha = 1;

  // 狙いの点線（壁での跳ね返りも見せる）
  const v = state === 'play' || state === 'ready' ? pullVec() : null;
  if (v) drawAim(v);

  // 敵（影 → 本体）
  const es = enemies.slice().sort((a, b) => a.y - b.y);
  for (const e of es) { const x = lerp(e.px, e.x, k), y = lerp(e.py, e.y, k); ctx.fillStyle = 'rgba(46,36,24,.18)'; ctx.beginPath(); ctx.ellipse(x + 3, y + e.r * 0.75, e.r * 0.9, e.r * 0.32, 0, 0, 7); ctx.fill(); }
  for (const e of es) drawEnemy(e, lerp(e.px, e.x, k), lerp(e.py, e.y, k));

  // 弾
  bullets.forEach((b, i) => {
    const x = lerp(b.px, b.x, k), y = lerp(b.py, b.y, k);
    ctx.fillStyle = b.boom ? 'rgba(232,89,12,.55)' : 'rgba(46,36,24,.3)';
    for (let j = 0; j < b.trail.length; j += 2) { const a = j / b.trail.length; ctx.beginPath(); ctx.arc(b.trail[j], b.trail[j + 1], b.r * 0.22 + a * 1.5, 0, 7); ctx.fill(); }
    stone(x, y, b.r, b.boom, i, b.gold);
  });
  // 爆発（ギザギザの絵が広がって消える）・回復の輪
  rings.forEach((r, i) => {
    const p = r.t / 0.45, R = r.R * (0.35 + 0.65 * Math.sqrt(p));
    ctx.globalAlpha = 1 - p;
    if (r.heal) { ctx.setLineDash([5, 6]); ctx.beginPath(); ctx.arc(r.x, r.y, R, 0, 7); ctx.strokeStyle = '#37b24d'; ctx.lineWidth = 3; ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1; return; }
    const spike = (rad, n) => () => { ctx.beginPath(); for (let j = 0; j < n * 2; j++) { const a = j / (n * 2) * Math.PI * 2 + i, rr = j % 2 ? rad * 0.62 : rad; ctx.lineTo(r.x + Math.cos(a) * rr, r.y + Math.sin(a) * rr); } ctx.closePath(); };
    shape(spike(R, 9), '#ffd43b', 600 + i, r.x, r.y, R, { hatch: false, lw: 2.5 });
    shape(spike(R * 0.55, 7), '#ff922b', 650 + i, r.x, r.y, R * 0.55, { hatch: false, lw: 1.8 });
    ctx.globalAlpha = 1;
  });
  // 雷（短く光って消える）
  for (const b of bolts) {
    const a = 1 - b.t / 0.25;
    ctx.globalAlpha = a; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    for (const [w, c] of [[6, INK], [3.2, '#ffd43b']]) {
      ctx.strokeStyle = c; ctx.lineWidth = w; ctx.beginPath();
      for (let i = 0; i < b.pts.length; i += 2) ctx.lineTo(b.pts[i], b.pts[i + 1]);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  // 粒
  for (const p of parts) {
    ctx.globalAlpha = clamp(p.life / p.max * 1.5, 0, 1); ctx.fillStyle = p.c;
    if (p.conf) { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot + time * 5); ctx.fillRect(-p.s, -p.s * 0.4, p.s * 2, p.s * 0.8); ctx.strokeStyle = INK; ctx.lineWidth = 0.8; ctx.strokeRect(-p.s, -p.s * 0.4, p.s * 2, p.s * 0.8); ctx.restore(); }
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, 7); ctx.fill(); }
  }
  ctx.globalAlpha = 1;

  drawFort(left, right, bottom);
  // いけにえで手に入れた強化の絵が、猫から浮かび上がる
  for (const g of gains) {
    if (g.t < 0) continue;
    const q = g.t / 1.6, c = gainIcon(g.k);
    ctx.globalAlpha = q < 0.8 ? 1 : (1 - q) / 0.2;
    ctx.drawImage(c, FW / 2 - 32 + (gains.indexOf(g) ? 40 : -40), WALL_Y + 20 - q * 140, 64, 64);
    ctx.globalAlpha = 1;
  }
  drawRocks(k);
  drawSling(v);
  if (state === 'ready') drawHint();
  if (state !== 'done') drawHud(top);
}

// 投げられた石（石垣より手前に描いて、落ちる先の×印が隠れないようにする）
function drawRocks(k) {
  rocks.forEach((r, i) => {
    const x = lerp(r.px, r.x, k), y = lerp(r.py, r.y, k);
    const t = r.vy > 0 ? (WALL_Y - 4 - y) / r.vy : 0, lx = x + r.vx * t, ly = WALL_Y - 6;
    ctx.setLineDash([6, 6]); ctx.lineDashOffset = -time * 30;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(lx, ly); ctx.strokeStyle = 'rgba(224,49,49,.7)'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.setLineDash([]);
    pline(lx - 8, ly - 8, lx + 8, ly + 8, 900 + i, 3.5, '#e03131'); pline(lx + 8, ly - 8, lx - 8, ly + 8, 910 + i, 3.5, '#e03131');
    ctx.fillStyle = 'rgba(46,36,24,.2)'; ctx.beginPath(); ctx.ellipse(x + 7, y + 13, r.r, r.r * 0.4, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x, y, r.r + 7, 0, 7); ctx.fillStyle = 'rgba(255,107,107,.3)'; ctx.fill(); ink(700 + i, 2.5, '#e03131');
    ctx.save(); ctx.translate(x, y); ctx.rotate(r.rot);
    const pb = () => { ctx.beginPath(); for (let j = 0; j < 7; j++) { const a = j / 7 * 7, rr = r.r * (0.85 + 0.2 * Math.sin(j * 3.1)); ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); };
    shape(pb, '#a4723f', 800 + i, 0, 0, r.r, { lw: 3 });
    ctx.restore();
  });
}
function stone(x, y, r, glow, id = 0, gold = false) {
  if (glow || gold) { ctx.fillStyle = gold ? 'rgba(252,196,25,.4)' : 'rgba(255,146,43,.35)'; ctx.beginPath(); ctx.arc(x, y, r * 1.7, 0, 7); ctx.fill(); }
  shape(circ(x, y, r), gold ? '#fcc419' : glow ? '#ffb070' : '#bdb6a8', 300 + id, x, y, r, { lw: Math.max(1.6, r * 0.22) });
  ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.beginPath(); ctx.arc(x - r * 0.35, y - r * 0.35, r * 0.2, 0, 7); ctx.fill();
}

function drawAim(v) {
  const S = stats(), n = S.multi;
  const len = 120 + 380 * v.p;
  for (let m = 0; m < n; m++) {
    const a = v.ang + (m - (n - 1) / 2) * 0.13;
    let x = POUCH.x, y = POUCH.y, dx = Math.cos(a), dy = Math.sin(a), b = S.bounce, d = 0;
    const main = m === (n - 1) >> 1;
    const top = topY() + 20;
    for (let st = 0; st < len; st += 4) {
      x += dx * 4; y += dy * 4;
      if ((x < S.r && dx < 0) || (x > FW - S.r && dx > 0)) { if (b-- > 0) dx = -dx; else break; }
      if (y < top && dy < 0) { if (b-- > 0) dy = -dy; else break; }
      d += 4;
      if (d % 16 === 0) {
        ctx.globalAlpha = (1 - st / len) * (main ? 1 : 0.5);
        ctx.beginPath(); ctx.arc(x, y, main ? 3.4 : 2.6, 0, 7); ctx.fillStyle = '#fffdf5'; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1.2; ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }
}

function eyes(x, y, r, look = 0.3, angry = false, id = 0) {
  for (const sx of [-1, 1]) {
    const ex = x + sx * r * 0.36, ey = y - r * 0.1;
    ctx.beginPath(); ctx.ellipse(ex, ey, r * 0.23, r * 0.27, 0, 0, 7); ctx.fillStyle = '#fffdf5'; ctx.fill(); ink(id + sx * 7, Math.max(1.2, r * 0.07));
    ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(ex + hash(id + sx) * r * 0.03, ey + r * 0.28 * look, r * 0.11, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex - r * 0.04, ey + r * 0.28 * look - r * 0.05, r * 0.035, 0, 7); ctx.fill();
    if (angry) pline(ex - sx * r * 0.24, ey - r * 0.4, ex + sx * r * 0.16, ey - r * 0.26, id + sx * 11, Math.max(1.5, r * 0.09));
  }
}
function blobPath(x, y, r, sq) {
  return () => {
    ctx.beginPath();
    ctx.moveTo(x - r * sq, y + r * 0.55);
    ctx.bezierCurveTo(x - r * sq * 1.05, y - r * 0.6 / sq, x - r * 0.5, y - r * 1.15 / sq, x, y - r * 1.1 / sq);
    ctx.bezierCurveTo(x + r * 0.5, y - r * 1.15 / sq, x + r * sq * 1.05, y - r * 0.6 / sq, x + r * sq, y + r * 0.55);
    ctx.quadraticCurveTo(x, y + r * 0.8, x - r * sq, y + r * 0.55); ctx.closePath();
  };
}
function blob(x, y, r, col, hop, id) {
  const sq = 1 + hop * 0.12;
  shape(blobPath(x, y, r, sq), col[0], id, x, y, r, { lw: Math.max(2, r * 0.1) });
  ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = Math.max(1.5, r * 0.09); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(x - r * 0.1, y - r * 0.1, r * 0.7, Math.PI * 1.15, Math.PI * 1.4); ctx.stroke();
}
function drawEnemy(e, x, y) {
  const T = TYPES[e.type], r = e.r, hit = e.squash, id = e.id;

  ctx.scale(1 + hit * 0.18, 1 - hit * 0.15);
  ctx.globalAlpha = e.alpha;
  const lw = Math.max(2, r * 0.1);

    const walk = Math.sin(e.ph * 9) * 3;
    for (const sx of [-1, 1]) for (const yy of [-0.3, 0.2]) pline(sx * r * 0.6, yy * r, sx * r * 1.1, yy * r + walk * sx, id + sx + yy * 10, 2.2);

    eyes(0, -r * 0.2, r * 0.9, 0.5, true, id + 20);

    if (e.guard > 0) {
      const pb = () => { ctx.beginPath(); ctx.moveTo(-r * 1.15, r * 0.35); ctx.quadraticCurveTo(0, r * 1.25, r * 1.15, r * 0.35); ctx.quadraticCurveTo(0, r * 0.85, -r * 1.15, r * 0.35); ctx.closePath(); };

      const full = 3 + Math.floor(wave / 6), cracks = full - e.guard;
      for (let i = 0; i < Math.min(4, cracks); i++) { const c0 = (i % 2 ? 1 : -1) * r * (0.25 + i * 0.12); ctx.beginPath(); ctx.moveTo(c0, r * 0.62); ctx.lineTo(c0 + r * 0.08, r * 0.78); ctx.lineTo(c0 - r * 0.04, r * 0.95); ink(id + 50 + i, 1.5); }
    }
  } else if (e.type === 'thrower') {
    const throwing = e.throws < 3 && e.throwT < 0.7 && state === 'play';
    const ay = throwing ? -r * 1.3 : -r * 0.2, ax = throwing ? r * 0.4 : r * 1.05;
    pline(r * 0.6, 0, ax, ay, id + 30, 5, INK); pline(r * 0.6, 0, ax, ay, id + 31, 3, T.col[0]);
    blob(0, 0, r, T.col, 0.6, id);
    eyes(0, 0, r, 0.4, true, id + 20);
    ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(0, r * 0.35, r * 0.11, 0, 7); ctx.fill();

  } else if (e.type === 'ghost') {

    shape(pb, '#fffdf5', id, 0, 0, r, { lw });
    ctx.fillStyle = INK; for (const sx of [-1, 1]) { ctx.beginPath(); ctx.ellipse(sx * r * 0.32, -r * 0.2, r * 0.12, r * 0.19, 0, 0, 7); ctx.fill(); }
    ctx.beginPath(); ctx.ellipse(0, r * 0.2, r * 0.11, r * 0.15, 0, 0, 7); ctx.fill();
  } else if (e.type === 'healer') {
    ctx.beginPath(); ctx.ellipse(0, -r * 1.35, r * 0.55, r * 0.18, 0, 0, 7); ink(id + 70, 2.6, '#37b24d');
    blob(0, 0, r, T.col, 0.5 + 0.5 * Math.sin(e.ph * 3), id);
    eyes(0, 0, r, 0.3, false, id + 20);
    const pb = () => { ctx.beginPath(); ctx.rect(-r * 0.1, -r * 0.95, r * 0.2, r * 0.5); ctx.rect(-r * 0.25, -r * 0.8, r * 0.5, r * 0.2); };
    pb(); ctx.fillStyle = '#40c057'; ctx.fill();
    ctx.fillStyle = 'rgba(230,73,128,.55)'; for (const sx of [-1, 1]) { ctx.beginPath(); ctx.ellipse(sx * r * 0.55, r * 0.2, r * 0.13, r * 0.08, 0, 0, 7); ctx.fill(); }
  } else if (e.type === 'slime' || e.type === 'mini' || e.type === 'splitter' || e.type === 'boss') {
    const hop = Math.max(0, Math.sin(e.ph * 4));
    const lift = hop * r * 0.25;
    blob(0, -lift, r, T.col, 1 - hop, id);
    eyes(0, -lift, r, 0.4, e.type === 'boss' || e.type === 'splitter', id + 20);
    ctx.beginPath(); ctx.ellipse(0, r * 0.3 - lift, r * 0.15, r * (e.type === 'boss' ? 0.13 : 0.07), 0, 0, 7); ctx.fillStyle = INK; ctx.fill();
    if (e.type === 'splitter') { ctx.beginPath(); ctx.moveTo(0, -r * 1.05 - lift); ctx.lineTo(r * 0.08, -r * 0.7 - lift); ctx.lineTo(-r * 0.06, -r * 0.5 - lift); ink(id + 33, 2); }

      shape(pb, '#ffd43b', id + 80, 0, cy - 8, 18, { lw: 2.4 });
      ctx.fillStyle = '#e03131'; ctx.beginPath(); ctx.arc(0, cy - 4, 3.5, 0, 7); ctx.fill();
    }

    ctx.globalAlpha = e.alpha * 0.85;
    for (const sx of [-1, 1]) shape(ell(sx * r * 0.7, -r * 0.5, r * 0.72, r * (0.3 + 0.15 * flap), sx * -0.5), '#f1f8ff', id + sx * 5, 0, 0, r, { hatch: false, lw: 1.6 });
    ctx.globalAlpha = e.alpha;
    const body = ell(0, 0, r * 0.9, r);
    body(); ctx.fillStyle = T.col[0]; ctx.fill();
    ctx.save(); body(); ctx.clip(); ctx.fillStyle = INK; for (const yy of [0.12, 0.52]) ctx.fillRect(-r, yy * r, r * 2, r * 0.2); ctx.restore();
    body(); ink(id, lw);
    eyes(0, -r * 0.2, r, 0.5, false, id + 20);

  }
}

}

  const side = Math.min(cv.width, cv.height, FH * s * dpr * 0.95);
  const cx = (ox + FW / 2 * s) * dpr, by = (oy + (WALL_Y + 200) * s) * dpr;
  const sx = clamp(cx - side / 2, 0, cv.width - side), sy = clamp(by - side, 0, cv.height - side);
  snap = document.createElement('canvas'); snap.width = snap.height = 1080;
  snap.getContext('2d').drawImage(cv, sx, sy, side, side, 0, 0, 1080, 1080);
  shareCache = null;
}
function resultImage() {
  if (!snap) return null;
  const c = document.createElement('canvas'); c.width = c.height = 1080;
  const g = c.getContext('2d');
  g.drawImage(snap, 0, 0);
  g.textAlign = 'center'; g.lineJoin = 'round';
  const font = px => `700 ${px}px ${FONT}`;
  const text = (str, y, px, max, fill, line) => {
    g.font = font(px);
    const w = g.measureText(str).width; if (w > max) { px *= max / w; g.font = font(px); }
    g.lineWidth = px * .2; g.strokeStyle = line; g.strokeText(str, 540, y); g.fillStyle = fill; g.fillText(str, 540, y);
  };
  text(L[lang].wave(wave), 230, 170, 960, '#fff', INK);
  text(L[lang].kill(kills), 330, 64, 900, INK, '#fffaf0');
  text(t('title'), 1040, 52, 900, '#fff', INK);
  return c;
}
function prepareShare() {
  if (!snap) return;
  const key = lang;
  if (shareCache?.key === key) return;
  shareCache = { key, file: null };
  document.fonts.ready.then(() => resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'slingshot-wave.png', { type: 'image/png' }); }, 'image/png'));
}
const shareFile = () => shareCache?.key === lang ? shareCache.file : null;

// ===== ループ（固定刻み＋補間） =====
let last = performance.now(), acc = 0;
function loop(now) {
  const fdt = Math.min(0.05, (now - last) / 1000); last = now;
  acc += fdt;
  while (acc >= DT) { step(DT); acc -= DT; }
  draw(acc / DT);
  requestAnimationFrame(loop);
}
resize(); reset(); applyLang(); draw(1); requestAnimationFrame(loop);
</script>
