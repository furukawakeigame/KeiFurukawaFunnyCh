// 強化は掛け算で効くので、敵の体力も倍々で増やす（無限に続けても、いつかは押し切られる）
function hpMul() { return Math.pow(1.12, wave - 1) * (1 + (wave - 1) * 0.04); }

}

const cv = $('cv'), ctx = cv.getContext('2d');
let lay = { s: 1, ox: 0, oy: 0, W: 0, H: 0, dpr: 1 };
const toLocal = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
let drag = null;
cv.addEventListener('pointerdown', e => {
  if (state === 'over' || state === 'done' || state === 'pick' || state === 'clear') return;
  e.preventDefault(); cv.setPointerCapture(e.pointerId);

});
cv.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const p = toLocal(e);
  const old = Math.hypot(drag.dx, drag.dy);
  drag.dx = (p.x - drag.sx) / lay.s; drag.dy = (p.y - drag.sy) / lay.s;
  const len = Math.hypot(drag.dx, drag.dy);
  if (len > MAXPULL) { drag.dx *= MAXPULL / len; drag.dy *= MAXPULL / len; }
  if (Math.abs(Math.min(len, MAXPULL) - old) > 18) sStretch();
});
function release(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const v = pullVec();
  const charged = lv.charge > 0 && drag.charge >= stats().chargeT;
  drag = null;
  if (!v || state !== 'play') return;
  v.charged = charged;
  if (reloadT > 0 && !charged) queued = v; else fire(v);
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', e => { if (drag && e.pointerId === drag.id) drag = null; });
// 引いた向きの反対へ飛ぶ。下向きには撃てない（最低でも水平から12°上）
function pullVec() {
  if (!drag) return null;
  let dx = -drag.dx, dy = -drag.dy;
  const len = Math.hypot(dx, dy);
  if (len < 14) return null;
  let ang = Math.atan2(dy, dx); // 上は -PI/2
  const lim = 12 * Math.PI / 180;
  if (ang > -lim && ang <= Math.PI / 2) ang = -lim;
  else if (ang < -Math.PI + lim || ang > Math.PI / 2) ang = -Math.PI + lim;
  return { ang, p: Math.min(1, len / MAXPULL) };
}

function newBullet(x, y, a, sp, o) {
  return Object.assign({ x, y, px: x, py: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 8, dmg: 1, pierce: 0, bounce: 0, boom: 0,

}
function fire(v) {

    }

}

let choices = [];
function offer() {
  const afterBoss = wave % 5 === 0;

  if (afterBoss && pool.filter(k => UP[k].r > 0).length >= 3) pool = pool.filter(k => UP[k].r > 0);
  const c = [];
  while (c.length < 3 && pool.length) {
    const tot = pool.reduce((s, k) => s + RW[UP[k].r], 0);
    let x = Math.random() * tot, i = 0;
    for (; i < pool.length - 1; i++) { x -= RW[UP[pool[i]].r]; if (x <= 0) break; }
    c.push(pool.splice(i, 1)[0]);
  }
  choices = c;
  state = 'pick';
  renderCards();
  $('pick').hidden = false;
  requestAnimationFrame(() => requestAnimationFrame(() => $('pick').classList.add('show')));
}
function renderCards() {
  const box = $('pick'); box.innerHTML = '';

    const b = document.createElement('button'); b.className = 'card r' + UP[k].r;
    const c = document.createElement('canvas'); c.width = c.height = 160; drawIcon(c.getContext('2d'), k, 160);

function choose(i) {

}

// ===== 配置 =====
const TOP = 52, BOTTOM = 84;
function resize() {
  const r = cv.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  const W = r.width, H = r.height, avail = Math.max(160, H - BOTTOM - 16);

  const s = Math.min(W / 420, 2.2, Math.max(avail / 600, Math.min(0.8, avail / 400)));
  FW = clamp(W / s, 420, 760);
  const ox = (W - FW * s) / 2;

addEventListener('resize', resize);

  for (let i = 0; i < 900; i++) {
    const x = rnd(0, 256), y = rnd(0, 256), h = rnd(3, 8);
    g.strokeStyle = Math.random() < 0.5 ? 'rgba(150,210,90,.55)' : 'rgba(40,100,30,.5)'; g.lineWidth = rnd(0.8, 1.6);
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + rnd(-2, 2), y - h); g.stroke();

    g.fillStyle = col; for (let k = 0; k < 5; k++) { const a = k / 5 * 7; g.beginPath(); g.arc(x + Math.cos(a) * 2.2, y + Math.sin(a) * 2.2, 1.8, 0, 7); g.fill(); }

// ===== 描画 =====

    ctx.fillStyle = 'rgba(30,70,20,.35)'; ctx.fillRect(x0, top, w, WALL_Y - top);
    for (let y = Math.floor(top / 26) * 26; y < WALL_Y; y += 26) {
      const bx = side ? FW + 6 : -6;
      const gg = ctx.createRadialGradient(bx - 4, y - 5, 2, bx, y, 20); gg.addColorStop(0, '#5cb544'); gg.addColorStop(1, '#22571a');
      ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(bx + Math.sin(y * 0.7) * 3, y, 17, 0, 7); ctx.fill();

  }

    ctx.globalAlpha = Math.min(1, p.life / 2) * 0.35; ctx.fillStyle = p.c;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.beginPath();

  for (const e of es) drawEnemy(e, lerp(e.px, e.x, k), lerp(e.py, e.y, k));

  // 弾
  for (const b of bullets) {
    const x = lerp(b.px, b.x, k), y = lerp(b.py, b.y, k);
    for (let i = 0; i < b.trail.length; i += 2) { const a = (i / b.trail.length); ctx.fillStyle = b.boom ? `rgba(255,150,50,${a * 0.5})` : `rgba(255,255,255,${a * 0.45})`; ctx.beginPath(); ctx.arc(b.trail[i], b.trail[i + 1], b.r * (0.4 + a * 0.5), 0, 7); ctx.fill(); }

  drawFort(left, right, bottom);
  drawSling(v);
  if (state === 'ready') drawHint();
  if (state !== 'done') drawHud(top);
}

function stone(x, y, r, glow) {
  if (glow) { const gg = ctx.createRadialGradient(x, y, r * 0.5, x, y, r * 2); gg.addColorStop(0, 'rgba(255,140,40,.7)'); gg.addColorStop(1, 'rgba(255,140,40,0)'); ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(x, y, r * 2, 0, 7); ctx.fill(); }

  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
}

function drawAim(v) {
  const S = stats(), n = S.multi;
  const len = 120 + 380 * v.p;
  for (let m = 0; m < n; m++) {
    const a = v.ang + (m - (n - 1) / 2) * 0.11;
    let x = POUCH.x, y = POUCH.y, dx = Math.cos(a), dy = Math.sin(a), b = S.bounce, d = 0;
    const main = m === (n - 1) >> 1;
    ctx.fillStyle = main ? 'rgba(255,255,255,.9)' : 'rgba(255,255,255,.45)';
    const top = topY() + 10;
    for (let st = 0; st < len; st += 4) {
      x += dx * 4; y += dy * 4;
      if ((x < S.r && dx < 0) || (x > FW - S.r && dx > 0)) { if (b-- > 0) dx = -dx; else break; }
      if (y < top && dy < 0) { if (b-- > 0) dy = -dy; else break; }
      d += 4;
      if (d % 16 === 0) { const fade = 1 - st / len; ctx.globalAlpha = fade; ctx.beginPath(); ctx.arc(x, y, main ? 3.2 : 2.4, 0, 7); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
  }
}

    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex - r * 0.05, ey + r * 0.28 * look - r * 0.06, r * 0.045, 0, 7); ctx.fill();
    if (angry) { ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = r * 0.09; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(ex - sx * r * 0.22, ey - r * 0.38); ctx.lineTo(ex + sx * r * 0.18, ey - r * 0.24); ctx.stroke(); }

  dg.addColorStop(0, '#c9a46a'); dg.addColorStop(1, '#a37b45');

  ctx.fillStyle = 'rgba(90,60,30,.18)';

    const q = paw.t / 0.42, ext = q < 0.4 ? q / 0.4 : 1 - (q - 0.4) / 0.6;
    const sx0 = cx + 30, sy0 = cy + jy - 10, ex = lerp(sx0, paw.x, ext), ey = lerp(sy0, paw.y, ext);
    ctx.strokeStyle = '#7a5230'; ctx.lineWidth = 20; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(sx0, sy0); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.strokeStyle = '#c49a6c'; ctx.lineWidth = 15; ctx.stroke();
    ctx.fillStyle = '#f4dcc0'; ctx.beginPath(); ctx.arc(ex, ey, 14, 0, 7); ctx.fill();
    ctx.fillStyle = '#ff8fab'; ctx.beginPath(); ctx.ellipse(ex, ey + 2, 6, 5, 0, 0, 7); ctx.fill();
    for (const a of [-2.3, -1.6, -0.9]) { const ang = a + Math.atan2(ey - sy0, ex - sx0) + Math.PI / 2; ctx.beginPath(); ctx.arc(ex + Math.cos(ang) * 9, ey + Math.sin(ang) * 9, 3, 0, 7); ctx.fill(); }
  }
  // 石垣
  const wg = ctx.createLinearGradient(0, WALL_Y - 6, 0, WALL_Y + 30);
  wg.addColorStop(0, '#ced4da'); wg.addColorStop(1, '#6c757d');
  ctx.fillStyle = wg; ctx.fillRect(left, WALL_Y, right - left, 26);
  ctx.strokeStyle = 'rgba(52,58,64,.45)'; ctx.lineWidth = 1.5;
  for (let row = 0; row < 2; row++) {
    const y = WALL_Y + row * 13;
    ctx.beginPath(); ctx.moveTo(left, y + 13); ctx.lineTo(right, y + 13); ctx.stroke();
    for (let x = Math.floor(left / 30) * 30 + (row ? 15 : 0); x < right; x += 30) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 13); ctx.stroke(); }
  }
  // 胸壁（でこぼこ）
  for (let x = Math.floor(left / 40) * 40; x < right; x += 40) {
    const g = ctx.createLinearGradient(0, WALL_Y - 14, 0, WALL_Y); g.addColorStop(0, '#e9ecef'); g.addColorStop(1, '#adb5bd');
    ctx.fillStyle = g; ctx.fillRect(x + 4, WALL_Y - 12, 22, 13);
  }
  ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.fillRect(left, WALL_Y + 26, right - left, 5);
  // 石垣強化: 残りの回数だけ、金の盾が石垣に光る
  for (let i = 0; i < guardLeft; i++) {
    const gx = 40 + i * 30, gy = WALL_Y + 2;
    const sg = ctx.createLinearGradient(0, gy - 12, 0, gy + 12); sg.addColorStop(0, '#fff3bf'); sg.addColorStop(1, '#f08c00');
    ctx.fillStyle = sg; ctx.beginPath(); ctx.moveTo(gx, gy - 12); ctx.lineTo(gx + 10, gy - 8); ctx.lineTo(gx + 9, gy + 2); ctx.quadraticCurveTo(gx + 6, gy + 9, gx, gy + 13); ctx.quadraticCurveTo(gx - 6, gy + 9, gx - 9, gy + 2); ctx.lineTo(gx - 10, gy - 8); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  }
  // 命（ハート）を石垣の前に並べる
  const hs = 11, gap = 25, n = maxLife, x0 = FW / 2 - (n - 1) * gap / 2, hy = WALL_Y + 44;
  for (let i = 0; i < n; i++) heart(x0 + i * gap, hy, hs, i < life);
}
function heart(x, y, s, full) {
  ctx.save(); ctx.translate(x, y);
  ctx.beginPath(); ctx.moveTo(0, s * 0.9);
  ctx.bezierCurveTo(-s * 1.3, 0, -s * 0.8, -s * 1.1, 0, -s * 0.4);
  ctx.bezierCurveTo(s * 0.8, -s * 1.1, s * 1.3, 0, 0, s * 0.9);
  ctx.fillStyle = full ? '#ff4d6d' : 'rgba(40,40,40,.4)'; ctx.fill();
  ctx.strokeStyle = full ? '#fff' : 'rgba(255,255,255,.5)'; ctx.lineWidth = 2; ctx.stroke();
  if (full) { ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.ellipse(-s * 0.45, -s * 0.35, s * 0.22, s * 0.14, -0.6, 0, 7); ctx.fill(); }
  ctx.restore();
}

// パチンコ本体（Y字の木）
function drawSling(v) {
  const bx = POUCH.x, by = WALL_Y - 6;
  const tipL = { x: bx - 26, y: POUCH.y - 4 }, tipR = { x: bx + 26, y: POUCH.y - 4 };
  let pull = drag ? { x: drag.dx, y: drag.dy } : { x: 0, y: 0 };
  if (state !== 'play' && state !== 'ready') pull = { x: 0, y: 0 };
  // 引いたぶんだけ、弾受けが後ろへ
  const len = Math.hypot(pull.x, pull.y);
  if (len > MAXPULL) { pull.x *= MAXPULL / len; pull.y *= MAXPULL / len; }
  const px = POUCH.x + pull.x, py = POUCH.y + pull.y;
  const wood = (x1, y1, x2, y2, w) => { ctx.strokeStyle = '#5c3a1a'; ctx.lineWidth = w + 3; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.strokeStyle = '#a0672e'; ctx.lineWidth = w; ctx.stroke(); ctx.strokeStyle = 'rgba(255,220,170,.4)'; ctx.lineWidth = w * 0.3; ctx.beginPath(); ctx.moveTo(x1 - 1.5, y1); ctx.lineTo(x2 - 1.5, y2); ctx.stroke(); };
  // 奥側のゴム
  ctx.strokeStyle = '#7a2e12'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(tipR.x, tipR.y); ctx.lineTo(px, py); ctx.stroke();
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(bx + 4, by + 6, 16, 5, 0, 0, 7); ctx.fill();
  wood(bx, by + 4, bx, POUCH.y + 26, 9);
  wood(bx, POUCH.y + 26, tipL.x, tipL.y, 7);
  wood(bx, POUCH.y + 26, tipR.x, tipR.y, 7);
  // 弾受け（革）と装填中の弾
  ctx.save(); ctx.translate(px, py); ctx.rotate(Math.atan2(pull.x, -pull.y) * (len > 3 ? 1 : 0));
  ctx.fillStyle = '#6b3d1f'; ctx.beginPath(); ctx.ellipse(0, 2, 13, 7, 0, 0, 7); ctx.fill();
  ctx.restore();
  const S = stats();
  if (drag && lv.charge && drag.charge > 0 && reloadT === 0) {
    const q = Math.min(1, drag.charge / S.chargeT), R = 14 + q * 22;
    const g = ctx.createRadialGradient(px, py, 2, px, py, R);
    g.addColorStop(0, `rgba(255,200,90,${0.3 + q * 0.5})`); g.addColorStop(1, 'rgba(255,120,30,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, R, 0, 7); ctx.fill();
    if (q >= 1) { ctx.strokeStyle = 'rgba(255,240,200,.9)'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(px, py, 20 + Math.sin(time * 8) * 2, 0, 7); ctx.stroke(); }
  }
  if (reloadT === 0 && state !== 'over' && state !== 'done') stone(px, py, Math.min(S.r, 14), S.boom > 0);
  else if (reloadT > 0) { // 装填中: 弾が下から転がってくる
    const k = 1 - reloadT / S.reload; ctx.globalAlpha = k; stone(px, py + (1 - k) * 18, Math.min(S.r, 14) * k, false); ctx.globalAlpha = 1;
  }
  // 手前のゴム
  ctx.strokeStyle = '#a63c1a'; ctx.lineWidth = 4.5; ctx.beginPath(); ctx.moveTo(tipL.x, tipL.y); ctx.lineTo(px, py); ctx.stroke();
  for (const tp of [tipL, tipR]) { ctx.fillStyle = '#5c3a1a'; ctx.beginPath(); ctx.arc(tp.x, tp.y, 4.5, 0, 7); ctx.fill(); }
}

// 最初の操作を待つ間: 弾受けを下へ引く手本（半透明の弾が下がり、点線の矢印が上へ）
function drawHint() {
  const p = (time % 1.6) / 1.6, k = Math.min(1, p / 0.6);
  const e = k * k * (3 - 2 * k);
  const x = POUCH.x, y = POUCH.y + e * 70;
  ctx.globalAlpha = p < 0.85 ? 0.9 : (1 - p) / 0.15 * 0.9;
  ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(x, y, 20, 0, 7); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, 20, 0, 7); ctx.stroke();
  ctx.fillStyle = '#fff';
  for (let i = 1; i <= 6; i++) { ctx.globalAlpha = e * (1 - i / 7) * 0.9; ctx.beginPath(); ctx.arc(x, POUCH.y - i * 26 * e, 4, 0, 7); ctx.fill(); }
  ctx.globalAlpha = e * 0.9; ctx.beginPath(); ctx.moveTo(x, POUCH.y - 190 * e); ctx.lineTo(x - 11, POUCH.y - 172 * e); ctx.lineTo(x + 11, POUCH.y - 172 * e); ctx.fill();
  ctx.globalAlpha = 1;
}

// 上: ウェーブの旗と数字、残りの敵のゲージ
function drawHud(top) {
  const { s, oy } = lay;
  const y = Math.max(top + 20, (TOP + 8 - oy) / s) + 14;
  const x = FW / 2;
  const w = 128;
  ctx.fillStyle = 'rgba(30,50,20,.55)'; ctx.beginPath(); ctx.roundRect(x - w / 2, y - 16, w, 32, 16); ctx.fill();
  // 旗
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(x - w / 2 + 16, y - 10); ctx.lineTo(x - w / 2 + 16, y + 10); ctx.stroke();
  ctx.fillStyle = '#ff6b6b'; ctx.beginPath(); ctx.moveTo(x - w / 2 + 17, y - 10); ctx.lineTo(x - w / 2 + 31, y - 5); ctx.lineTo(x - w / 2 + 17, y); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '900 19px system-ui, sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(String(wave), x - w / 2 + 36, y + 1);
  // 残り
  const gx = x - w / 2 + 70, gw = w - 82;
  const rest = state === 'ready' ? 1 : clamp(1 - waveDone / Math.max(1, waveTotal), 0, 1);
  ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.beginPath(); ctx.roundRect(gx, y - 4, gw, 8, 4); ctx.fill();
  ctx.fillStyle = '#ffd43b'; ctx.beginPath(); ctx.roundRect(gx, y - 4, gw * rest, 8, 4); ctx.fill();
}

// ===== 結果 =====
const coarse = matchMedia('(pointer: coarse)').matches;
function finish() {
  state = 'done';
  if (wave > best) { best = wave; store.set('best', best); }
  takeSnap();
  showResult(); $('result').hidden = false;
}
function showResult() {
  $('rWave').textContent = L[lang].wave(wave);
  $('rKill').textContent = L[lang].kill(kills);
  $('rBest').textContent = L[lang].best(best);
  const a = $('share');
  a.href = `https://x.com/intent/post?text=${encodeURIComponent(L[lang].post(wave, kills))}&url=${encodeURIComponent(URL_)}`;
  if (coarse) { a.removeAttribute('target'); a.removeAttribute('rel'); }
  else { a.target = '_blank'; a.rel = 'noopener'; }
  prepareShare();
}
$('again').onclick = () => { $('result').hidden = true; reset(); };
$('share').addEventListener('click', e => {
  const text = `${L[lang].post(wave, kills)}\n${URL_}`;
  if (coarse && navigator.share) {
    e.preventDefault();
    const file = shareFile();
    navigator.share(file && navigator.canShare?.({ files: [file] }) ? { files: [file], text } : { text }).catch(() => {});
    return;
  }
  const img = resultImage();
  if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'slingshot-wave.png'; d.click(); }
});
// 結果画像: 砦と猫、押し寄せた敵が入るように正方形に切り抜く
let snap = null, shareCache = null;
function takeSnap() {
  draw(1);
  const { s, ox, oy, dpr } = lay;
  const side = Math.min(cv.width, cv.height, FH * s * dpr * 0.95);
  const cx = (ox + FW / 2 * s) * dpr, by = (oy + (WALL_Y + 140) * s) * dpr;
  const sx = clamp(cx - side / 2, 0, cv.width - side), sy = clamp(by - side, 0, cv.height - side);
  snap = document.createElement('canvas'); snap.width = snap.height = 1080;
  snap.getContext('2d').drawImage(cv, sx, sy, side, side, 0, 0, 1080, 1080);
  shareCache = null;
}
function resultImage() {
  if (!snap) return null;
  const c = document.createElement('canvas'); c.width = c.height = 1080;
  const g = c.getContext('2d');
  g.drawImage(snap, 0, 0);
  g.textAlign = 'center'; g.lineJoin = 'round';
  const font = px => `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans Thai", sans-serif`;
  const text = (str, y, px, max, fill, line) => {
    g.font = font(px);
    const w = g.measureText(str).width; if (w > max) { px *= max / w; g.font = font(px); }
    g.lineWidth = px * .18; g.strokeStyle = line; g.strokeText(str, 540, y); g.fillStyle = fill; g.fillText(str, 540, y);
  };
  text(L[lang].wave(wave), 230, 170, 960, '#fff', '#3b2510');
  text(L[lang].kill(kills), 330, 64, 900, '#3b2510', '#fff');
  text(t('title'), 1040, 52, 900, '#fff', '#3b2510');
  return c;
}
function prepareShare() {
  if (!snap) return;
  const key = lang;
  if (shareCache?.key === key) return;
  shareCache = { key, file: null };
  resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'slingshot-wave.png', { type: 'image/png' }); }, 'image/png');
}
const shareFile = () => shareCache?.key === lang ? shareCache.file : null;

// ===== ループ（固定刻み＋補間） =====
let last = performance.now(), acc = 0;
function loop(now) {
  const fdt = Math.min(0.05, (now - last) / 1000); last = now;
  acc += fdt;
  while (acc >= DT) { step(DT); acc -= DT; }
  draw(acc / DT);
  requestAnimationFrame(loop);
}
resize(); reset(); applyLang(); draw(1); requestAnimationFrame(loop);
</script>
