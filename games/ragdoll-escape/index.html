  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #2a1d14; color: #f6efe3; font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
    body { display: flex; flex-direction: column; overflow: hidden; padding-bottom: calc(80px + env(safe-area-inset-bottom)); -webkit-user-select: none; user-select: none; }
    header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; flex: none; }

<body>
  <header>
    <a href="../../" data-t="back">← トップへ戻る</a>
    <span class="sp"></span>
    <button id="sound" aria-label="sound"></button>
    <select id="lang">
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="gauge"><u></u><i></i><b></b></div>
    <svg id="tap" class="hidden" viewBox="0 0 70 70">
      <circle cx="35" cy="35" r="12" fill="#fff" opacity=".9"/>
      <circle cx="35" cy="35" r="14" fill="none" stroke="#fff" stroke-width="3">
        <animate attributeName="r" values="14;32" dur="0.9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".9;0" dur="0.9s" repeatCount="indefinite"/>
      </circle>
    </svg>
    <div id="title" class="overlay">
      <h1 data-t="title">穴から脱出</h1>
      <button class="big" id="start" data-t="start">スタート</button>
    </div>
    <div id="result" class="overlay hidden">
      <div class="panel">
        <h2 data-t="clear">脱出！</h2>
        <div class="stats">
          <span data-t="time">タイム</span><b id="rTime"></b>
          <span data-t="falls">落ちた回数</span><b id="rFalls"></b>
        </div>
        <button class="big" id="again" data-t="again">もう一度</button>
        <a class="big x" id="post" data-t="post" href="#">Xに投稿</a>
      </div>
    </div>
  </div>
<script>
(() => {
  // ---------- 言語 ----------
  const URL_ = 'https://keifurukawafunnych.com/games/ragdoll-escape/';
  const TAG = '#穴から脱出ゲーム';
  const T = {
    ja: { page: '穴から脱出', title: '穴から脱出', back: '← トップへ戻る', start: 'スタート', again: 'もう一度', post: 'Xに投稿', clear: '脱出！', time: 'タイム', falls: '落ちた回数',
      sec: v => v + '秒', cnt: v => v + '回', share: (t, f) => `穴から${t}秒で脱出した（落ちた回数 ${f}回）` },
    ko: { page: '구멍 탈출', title: '구멍 탈출', back: '← 처음으로', start: '시작', again: '다시 하기', post: 'X에 게시', clear: '탈출!', time: '타임', falls: '떨어진 횟수',
      sec: v => v + '초', cnt: v => v + '회', share: (t, f) => `구멍에서 ${t}초 만에 탈출했다 (떨어진 횟수 ${f}회)` },
    en: { page: 'Hole Escape', title: 'Hole Escape', back: '← Back to top', start: 'Start', again: 'Play again', post: 'Post on X', clear: 'Escaped!', time: 'Time', falls: 'Falls',
      sec: v => v + 's', cnt: v => v + (v === 1 ? ' time' : ' times'), share: (t, f) => `Escaped the hole in ${t}s (fell ${f} ${f === 1 ? 'time' : 'times'})` },
    th: { page: 'หนีออกจากหลุม', title: 'หนีออกจากหลุม', back: '← กลับหน้าแรก', start: 'เริ่ม', again: 'เล่นอีกครั้ง', post: 'โพสต์ลง X', clear: 'หนีออกมาได้!', time: 'เวลา', falls: 'จำนวนครั้งที่ตก',
      sec: v => v + ' วินาที', cnt: v => v + ' ครั้ง', share: (t, f) => `หนีออกจากหลุมได้ใน ${t} วินาที (ตก ${f} ครั้ง)` },
  };
  const store = {
    get(k, d) { try { const v = localStorage.getItem('ragdoll-escape:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('ragdoll-escape:' + k, JSON.stringify(v)); } catch {} },
  };
  const autoLang = () => { for (const l of navigator.languages?.length ? navigator.languages : [navigator.language || '']) { const c = l.toLowerCase().slice(0, 2); if (T[c]) return c; } return 'en'; };
  let lang = store.get('lang', null) || autoLang();
  if (!T[lang]) lang = 'en';
  const langSel = document.getElementById('lang');
  const $ = id => document.getElementById(id);
  function applyLang() {
    const d = T[lang];
    document.documentElement.lang = lang;
    document.title = d.page;
    langSel.value = lang;
    document.querySelectorAll('[data-t]').forEach(e => { e.textContent = d[e.dataset.t]; });
    if (result) showResultText();
  }
  langSel.addEventListener('change', () => { lang = langSel.value; store.set('lang', lang); applyLang(); });

  // ---------- 音 ----------
  let soundOn = store.get('sound', true), ac = null;
  const soundBtn = $('sound');
  function drawSoundIcon() {
    soundBtn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/>${soundOn ? '<path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>' : '<path d="M17 9l5 6M22 9l-5 6"/>'}</svg>`;
  }
  soundBtn.addEventListener('click', () => { soundOn = !soundOn; store.set('sound', soundOn); drawSoundIcon(); });
  drawSoundIcon();
  function audio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } if (ac && ac.state === 'suspended') ac.resume(); return ac; }
  function tone(f0, f1, dur, type = 'sine', vol = 0.2, delay = 0) {
    if (!soundOn || !audio()) return;
    const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur);
  }
  const sGrab = () => tone(220, 90, 0.09, 'triangle', 0.25);
  const sReach = () => tone(300 + Math.random() * 80, 500, 0.06, 'sine', 0.06);
  const sFall = () => tone(500, 120, 0.5, 'sawtooth', 0.07);
  const sClear = () => [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.25, 'triangle', 0.18, i * 0.11));

  // ---------- 地形 ----------
  const TOP = 1800, WALL_L = -220;
  let terr = [], topX = 0, stones = [];
  function buildTerrain() {
    terr = [{ x: WALL_L - 400, y: 0 }, { x: 160, y: 0 }];
    let x = 160, y = 0, n = 0;
    while (y < TOP) {
      const p = y / TOP;
      if (n % 5 === 4) { x += 50 + Math.random() * 30; y += 4; }
      else {
        const lo = 0.9 + p * 1.2, hi = 1.5 + p * 2.0;
        const s = lo + Math.random() * (hi - lo), dx = 50 + Math.random() * 60;
        x += dx; y += s * dx;
      }
      if (y > TOP) { const a = terr[terr.length - 1]; x = a.x + (x - a.x) * (TOP - a.y) / (y - a.y); y = TOP; }
      terr.push({ x, y }); n++;
    }
    topX = x;
    terr.push({ x: x + 2000, y: TOP });
    stones = [];
    for (let i = 0; i < 260; i++) stones.push({ x: WALL_L - 300 + Math.random() * (topX + 600), d: Math.random() * 500, r: 2 + Math.random() * 6, c: Math.random() });
  }
  function segAt(x) {
    let lo = 0, hi = terr.length - 2;
    while (lo < hi) { const m = (lo + hi + 1) >> 1; if (terr[m].x <= x) lo = m; else hi = m - 1; }
    return lo;
  }
  function hAt(x) { const i = segAt(x), a = terr[i], b = terr[i + 1]; return a.y + (b.y - a.y) * (x - a.x) / (b.x - a.x); }

  // ---------- ラグドール ----------
  // 0頭 1胸 2腰 3左ひじ 4左手 5右ひじ 6右手 7左ひざ 8左足 9右ひざ 10右足
  const R = [13, 8, 8, 6, 6, 6, 6, 6, 6, 6, 6];
  const POSE = [[96, 64], [84, 46], [50, 26], [100, 30], [116, 12], [92, 34], [108, 10], [56, 8], [34, 6], [62, 10], [40, 6]];
  let P = [], C = [];
  const ARM = [[1, 3, 0], [3, 4, 0], [1, 5, 1], [5, 6, 1]];
  const hands = [{ i: 4, pull: 0, pin: null, reach: -1, tx: 0, ty: 0, f: 1 }, { i: 6, pull: 0, pin: null, reach: -1, tx: 0, ty: 0, f: 1 }];
  function buildDoll() {
    P = POSE.map(([x, y], k) => ({ x, y, ox: x, oy: y, r: R[k], hit: false }));
    const L = (a, b) => Math.hypot(P[a].x - P[b].x, P[a].y - P[b].y);
    const pairs = [[0, 1], [1, 2], [1, 3], [3, 4], [1, 5], [5, 6], [2, 7], [7, 8], [2, 9], [9, 10], [0, 2]];
    C = pairs.map(([a, b]) => ({ a, b, l: L(a, b), base: L(a, b), side: -1 }));
    C[2].side = C[3].side = 0; C[4].side = C[5].side = 1;
    hands.forEach(h => { h.pin = null; h.reach = -1; h.f = 1; });
  }

  // ---------- 状態 ----------
  let playing = false, result = null, started = false, t0 = 0, nextHand = 0, peak = 0, falls = 0, clearT = 0;
  const cam = { x: 0, y: 0 };
  function reset() {
    buildTerrain(); buildDoll();
    playing = true; result = null; started = false; nextHand = 0; peak = 0; falls = 0; clearT = 0;
    cam.x = P[1].x; cam.y = P[1].y;
    $('tap').classList.remove('hidden');
  }

  function tap() {
    if (!playing) return;
    audio();
    if (!started) { started = true; t0 = performance.now(); $('tap').classList.add('hidden'); }
    const h = hands[nextHand]; nextHand ^= 1;
    h.pin = null; h.reach = 0;
    // 胸から坂の上へ届く場所を狙う
    const c = P[1];
    let tx = c.x;
    for (let k = 0; k < 80; k++) { tx += 4; if (Math.hypot(tx - c.x, hAt(tx) - c.y) > 62) break; }
    h.tx = tx; h.ty = hAt(tx) - 8;
    // 足で蹴る
    const kn = P[nextHand ? 9 : 7], pe = P[2];
    pe.ox -= 1.0; pe.oy -= 1.3;
    if (P[0].y < P[2].y + 10) { P[0].ox -= 1.2; P[0].oy -= 2.4; } // 頭を上に向け直す
    kn.ox -= 2.2; kn.oy -= 1.6;
    sReach();
  }

  // ---------- 物理 ----------
  const DT = 1 / 120, G = -1500;
  function collide(p, fr) {
    if (p.x < WALL_L + p.r) { p.x = WALL_L + p.r; p.ox = p.x + (p.x - p.ox) * 0; }
    const i = segAt(p.x), a = terr[i], b = terr[i + 1];
    const tx = b.x - a.x, ty = b.y - a.y, tl = Math.hypot(tx, ty);
    const nx = -ty / tl, ny = tx / tl;
    const d = (p.x - a.x) * nx + (p.y - a.y) * ny;
    if (d < p.r + 1.5) p.hit = true;
    if (d < p.r) {
      p.x += nx * (p.r - d); p.y += ny * (p.r - d);
      let vx = p.x - p.ox, vy = p.y - p.oy;
      const vn = vx * nx + vy * ny;
      let wx = vx - vn * nx, wy = vy - vn * ny;
      wx *= 1 - fr; wy *= 1 - fr;
      const pn = Math.max(vn, 0);
      p.ox = p.x - (wx + pn * nx); p.oy = p.y - (wy + pn * ny);
    }
  }
  function step() {
    // 腕の長さ: 掴んでいる腕は縮めて体を引き上げる、伸ばす腕は長く
    hands.forEach((h, s) => {
      const goal = h.pin ? 0.62 : h.reach >= 0 ? 1.15 : 1;
      h.f += (goal - h.f) * 0.06;
    });
    for (const c of C) c.l = c.side >= 0 ? c.base * hands[c.side].f : c.base;
    for (const p of P) {
      p.hit = false;
      const vx = (p.x - p.ox) * 0.996, vy = (p.y - p.oy) * 0.996;
      p.ox = p.x; p.oy = p.y;
      p.x += vx; p.y += vy + G * DT * DT;
    }
    hands.forEach(h => {
      const p = P[h.i];
      if (h.reach >= 0) {
        h.reach += DT;
        if (h.reach < 0.3) { p.x += (h.tx - p.x) * 0.12; p.y += (h.ty + 20 * (1 - h.reach / 0.3) - p.y) * 0.12; }
        if (h.reach > 0.7) h.reach = -1;
      }
      if (h.pin && h.pull > 0) {
        // つかんだ瞬間に体を引き寄せる
        h.pull -= DT;
        for (const k of [1, 2, 0]) {
          const q = P[k], dx = h.pin.x - q.x, dy = h.pin.y - q.y, d = Math.hypot(dx, dy) || 1;
          q.x += dx / d * 2.2; q.y += dy / d * 2.2;
        }
      }
      if (h.pin) {
        // 砂がくずれて手がずり落ちる
        const i = segAt(h.pin.x), a = terr[i], b = terr[i + 1];
        const s = (b.y - a.y) / (b.x - a.x), ang = Math.atan(s);
        const v = Math.max(0, ang - 0.75) * 75 * DT;
        h.pin.x -= v * Math.cos(ang); h.pin.y = hAt(h.pin.x) + p.r;
        p.x = h.pin.x; p.y = h.pin.y;
      }
    });
    for (let it = 0; it < 10; it++) {
      for (const c of C) {
        const a = P[c.a], b = P[c.b];
        const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1e-6;
        const df = (d - c.l) / d * 0.5;
        const pa = hands.find(h => h.pin && h.i === c.a), pb = hands.find(h => h.pin && h.i === c.b);
        const rch = c.side >= 0 && hands[c.side].reach >= 0; // 伸ばしている腕は体を引っぱらない
        const wa = pa ? 0 : rch ? 0.12 : 1, wb = pb ? 0 : 1, w = wa + wb || 1;
        a.x += dx * df * 2 * wa / w; a.y += dy * df * 2 * wa / w;
        b.x -= dx * df * 2 * wb / w; b.y -= dy * df * 2 * wb / w;
      }
      for (const p of P) collide(p, 0.08);
    }
    hands.forEach(h => {
      const p = P[h.i];
      if (h.pin) { p.x = h.pin.x; p.y = h.pin.y; p.ox = p.x; p.oy = p.y; return; }
      if (h.reach > 0.12 && p.hit && (Math.hypot(p.x - h.tx, p.y - h.ty) < 26 || h.reach > 0.45)) { h.pin = { x: p.x, y: p.y }; h.reach = -1; h.pull = 0.28; sGrab(); }
    });
    // 落下の判定
    const cy = P[1].y;
    if (started) {
      if (cy > peak) peak = cy;
      if (cy < peak - 150) { falls++; peak = cy; sFall(); }
    }
    if (playing && P[0].y > TOP + 10 && P[1].x > topX - 10) finish();
  }

  function finish() {
    playing = false;
    hands.forEach(h => { h.pin = null; h.reach = -1; });
    const t = started ? (performance.now() - t0) / 1000 : 0;
    result = { t: t.toFixed(1), f: falls };
    sClear();
    setTimeout(() => { if (result) { showResultText(); $('result').classList.remove('hidden'); } }, 900);
  }
  function showResultText() {
    const d = T[lang];
    $('rTime').textContent = d.sec(result.t);
    $('rFalls').textContent = d.cnt(result.f);
    const text = d.share(result.t, result.f) + '\n' + TAG;
    const a = $('post');
    a.href = 'https://x.com/intent/post?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(URL_);
    if (matchMedia('(pointer: coarse)').matches) { a.removeAttribute('target'); a.removeAttribute('rel'); }
    else { a.target = '_blank'; a.rel = 'noopener'; }
  }

  // ---------- 描画 ----------
  const cv = $('cv'), ctx = cv.getContext('2d');
  let W = 0, H = 0, S = 1, dpr = 1;
  function resize() {
    const r = cv.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    S = Math.min(W / 360, H / 540);
  }
  addEventListener('resize', resize);
  const sx = x => W * 0.42 + (x - cam.x) * S;
  const sy = y => H * 0.6 - (y - cam.y) * S;

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // 背景（深いほど暗い）
    const g = ctx.createLinearGradient(0, sy(TOP), 0, sy(0));
    g.addColorStop(0, '#6b4b33'); g.addColorStop(1, '#1e140d');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // 空
    const skyY = sy(TOP);
    if (skyY > 0) {
      const sg = ctx.createLinearGradient(0, skyY - 400 * S, 0, skyY);
      sg.addColorStop(0, '#7cc4f2'); sg.addColorStop(1, '#d6efff');
      ctx.fillStyle = sg; ctx.fillRect(0, 0, W, skyY);
      ctx.fillStyle = '#fff8d8';
      ctx.beginPath(); ctx.arc(sx(topX + 260), sy(TOP + 330), 36 * S, 0, 7); ctx.fill();
    }
    // 奥の壁の小石
    for (const s of stones) {
      const y = hAt(s.x) + 40 + s.d;
      if (y > TOP) continue;
      ctx.fillStyle = s.c < 0.5 ? 'rgba(0,0,0,.18)' : 'rgba(255,230,190,.07)';
      ctx.beginPath(); ctx.arc(sx(s.x), sy(y), s.r * S, 0, 7); ctx.fill();
    }
    // 左の壁
    ctx.fillStyle = '#4a3322';
    ctx.fillRect(0, sy(TOP), sx(WALL_L), H);
    ctx.fillStyle = '#6a8f3a'; ctx.fillRect(0, sy(TOP) - 6 * S, sx(WALL_L), 8 * S);
    // 地面
    ctx.beginPath();
    ctx.moveTo(sx(terr[0].x), sy(terr[0].y));
    for (const p of terr) ctx.lineTo(sx(p.x), sy(p.y));
    ctx.lineTo(sx(terr[terr.length - 1].x), H + 10); ctx.lineTo(sx(terr[0].x), H + 10); ctx.closePath();
    ctx.fillStyle = '#9b6f45'; ctx.fill();
    ctx.lineWidth = 6 * S; ctx.strokeStyle = '#c99a62'; ctx.lineJoin = 'round';
    ctx.beginPath();
    for (const p of terr) ctx.lineTo(sx(p.x), sy(p.y));
    ctx.stroke();
    // 地上の草
    ctx.strokeStyle = '#6a8f3a'; ctx.lineWidth = 8 * S;
    ctx.beginPath(); ctx.moveTo(sx(topX), sy(TOP)); ctx.lineTo(sx(topX + 2000), sy(TOP)); ctx.stroke();
    // 人形
    const seg = (a, b, w) => { ctx.lineWidth = w * S; ctx.beginPath(); ctx.moveTo(sx(P[a].x), sy(P[a].y)); ctx.lineTo(sx(P[b].x), sy(P[b].y)); ctx.stroke(); };
    const limbs = [[2, 7], [7, 8], [2, 9], [9, 10], [1, 3], [3, 4], [1, 5], [5, 6], [1, 2]];
    ctx.lineCap = 'round';
    for (const [col, add] of [['#3a2a20', 5], ['#f4ede0', 0]]) {
      ctx.strokeStyle = col;
      for (const [a, b] of limbs) seg(a, b, (a === 1 && b === 2 ? 20 : 11) + add);
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(sx(P[0].x), sy(P[0].y), (R[0] + add / 2) * S, 0, 7); ctx.fill();
    }
    // 目（坂の上を見る）
    const hx = P[0].x, hy = P[0].y, ux = P[0].x - P[1].x, uy = P[0].y - P[1].y, ul = Math.hypot(ux, uy) || 1;
    const fx = (ux / ul + 1) * 0.5, fy = uy / ul;
    ctx.fillStyle = '#2a1d14';
    for (const o of [-4, 4]) { ctx.beginPath(); ctx.arc(sx(hx + 5 * fx + o * -fy * 0.6), sy(hy + 2 + o * 0.5), 1.8 * S, 0, 7); ctx.fill(); }
    // 掴んでいる手
    for (const h of hands) {
      const p = P[h.i];
      ctx.fillStyle = h.pin ? '#f0c060' : '#f4ede0';
      ctx.strokeStyle = '#3a2a20'; ctx.lineWidth = 2.5 * S;
      ctx.beginPath(); ctx.arc(sx(p.x), sy(p.y), 7 * S, 0, 7); ctx.fill(); ctx.stroke();
    }
    // ゲージ
    const pr = Math.max(0, Math.min(1, P[1].y / TOP));
    gaugeFill.style.height = (pr * 100) + '%';
    gaugePeak.style.bottom = (Math.max(0, Math.min(1, peakAll / TOP)) * 100) + '%';
  }
  const gaugeFill = document.querySelector('#gauge i'), gaugePeak = document.querySelector('#gauge b');
  let peakAll = 0;

  // ---------- ループ ----------
  let last = performance.now(), acc = 0;
  function loop(now) {
    acc += Math.min(0.1, (now - last) / 1000); last = now;
    while (acc >= DT) { step(); acc -= DT; }
    if (P[1].y > peakAll) peakAll = P[1].y;
    const tx = P[1].x + 40, ty = P[1].y + 30;
    cam.x += (tx - cam.x) * 0.08; cam.y += (ty - cam.y) * 0.08;
    draw();
    requestAnimationFrame(loop);
  }

  // ---------- 入力 ----------
  const stage = $('stage');
  stage.addEventListener('pointerdown', e => { if (e.target.closest('button, a, select')) return; e.preventDefault(); tap(); });
  addEventListener('keydown', e => { if (e.repeat) return; if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowUp') { if (playing) { e.preventDefault(); tap(); } } });
  stage.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  $('start').addEventListener('click', () => { audio(); $('title').classList.add('hidden'); reset(); peakAll = 0; });
  $('again').addEventListener('click', () => { $('result').classList.add('hidden'); reset(); peakAll = 0; });

  applyLang();
  resize();
  buildTerrain(); buildDoll();
  cam.x = P[1].x; cam.y = P[1].y;
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
