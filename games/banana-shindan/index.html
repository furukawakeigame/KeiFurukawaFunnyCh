    if (m < 0.00003) l.sleep++; else l.sleep = 0;
    if (!l.landed && l.rope.p[NN * 3 / 2 | 0] < 0.04) { l.landed = true; flop(0.6); }
  }
  // かじる
  if (bite > 0) {
    bite = lerp(bite, biteTo, 1 - Math.exp(-dt * 30));
    peelU.uBite.value = bite;
    axisT(sOf(bite), _v); if (E === 0) _v.negate();
    fleshU.uCutN.value.copy(_v).transformDirection(banana.matrixWorld).transformDirection(camera.matrixWorldInverse);
    for (const c of crumbs) {
      if (!c.visible) continue;
      const u = c.userData.v; u.y -= 9.8 * dt;
      c.position.addScaledVector(u, dt);
      const fy = floorY(c.position.x, c.position.z) + 0.0012;
      if (c.position.y < fy) { c.position.y = fy; u.multiplyScalar(0.3); u.y = Math.abs(u.y) * 0.3; }
    }
  }
  // 終わり
  if (state === 'play') {
    const covered = strips.reduce((a, s) => a + s.w, 0) > TAU - 0.01;
    if (covered && strips.every(s => s.done)) { state = 'finish'; endT = 0; release(); }
  }
  if (state === 'finish' || state === 'bite') {

    if (endT > (state === 'bite' ? 1.3 : 1.0)) finishGame();

}
function tear(st) {
  rip();
  stats.tears++;
  const R = st.rope;
  // ちぎれた帯は、ひもごと落とす
  const l = { rope: makeRope(), mesh: st.mesh, a: st.a, w: st.w, d0: st.d0, d1: st.dp, sleep: 0, landed: false, n0: st.n0.clone() };
  l.rope.p.set(R.p); l.rope.q.set(R.q); l.rope.o.set(R.o); l.rope.seg = R.seg; l.rope.anchor = false; l.rope.pin = -1;
  loose.push(l);
  if (stemOn === st) stemOn = l;
  if (nubOn === st) nubOn = l;
  release();
  // 残り
  st.d0 = st.dp; st.stress = 0;
  if (st.dp > 0.9) { st.dp = 0.97; st.done = true; }
  st.mesh = flapMesh();
  initRope(st);
  packStrips();
}

// ===== 測った傾向から、タイプを決める =====
function judge(bitten) {
  const v = stats.advT > 0 ? stats.adv / stats.advT : 0.2;
  const speed = clamp((v - 0.09) / (0.32 - 0.09), 0, 1);      // 0: じっくり, 1: せっかち
  const neat = 1 - clamp(stats.tears / 3, 0, 1);
  const order = stats.trans ? clamp(stats.jumps / stats.trans, 0, 1) : 0;
  const many = clamp((stats.pieces - 2) / 5, 0, 1);
  scores = [1 - speed, E ? 0.88 : 0.12, neat, order, many];
  if (bitten) return 'glutton';
  if (E === 1) return 'monkey';
  if (speed > 0.68 && stats.tears >= 2) return 'rush';
  if (stats.pieces <= 3 && stats.tears >= 1) return 'bold';
  if (speed < 0.38 && stats.tears === 0) return 'craft';
  if (stats.pieces >= 6 && stats.tears === 0) return 'perfect';

}
let snapT = -1;
function finishGame() {
  const bitten = state === 'bite';
  state = 'result';
  resultType = judge(bitten);
  chime();
  showResult();
  $('result').hidden = false;
  setViewTargets();
  snapT = 1.3;
}
function showResult() {
  const [name, desc] = t('type')[resultType];
  $('rType').textContent = name;
  $('rDesc').textContent = desc;
  const G = $('gauges'); G.innerHTML = '';
  t('g').forEach(([l, r], i) => {
    const row = document.createElement('div'); row.className = 'g';
    row.innerHTML = '<span></span><div class="bar"><i></i></div><span></span>';
    row.children[0].textContent = l; row.children[2].textContent = r;
    row.querySelector('i').style.left = '50%';
    G.append(row);
    requestAnimationFrame(() => requestAnimationFrame(() => { row.querySelector('i').style.left = (scores[i] * 100).toFixed(1) + '%'; }));
  });
  const a = $('share');
  a.href = `https://x.com/intent/post?text=${encodeURIComponent(t('post')(name))}&url=${encodeURIComponent(URL_)}`;
  if (coarse) { a.removeAttribute('target'); a.removeAttribute('rel'); }
  else { a.target = '_blank'; a.rel = 'noopener'; }
  shareCache = null;
  prepareShare();
}
$('again').onclick = () => { $('result').hidden = true; snap0 = null; reset(); setViewTargets(true); };
$('share').addEventListener('click', e => {
  const text = `${t('post')(t('type')[resultType][0])}\n${URL_}`;
  if (coarse && navigator.share) {
    e.preventDefault();
    const file = shareFile();
    navigator.share(file && navigator.canShare?.({ files: [file] }) ? { files: [file], text } : { text }).catch(() => {});
    return;
  }
  const img = resultImage();
  if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'banana-shindan.png'; d.click(); }
});

// ===== 結果画像 =====
let snap0 = null, shareCache = null;
function takeSnap() {
  renderer.render(scene, camera);
  const c = renderer.domElement;
  const b = sceneBounds();
  _v.copy(b.c).project(camera);
  const px = (_v.x + 1) / 2 * c.width, py = (1 - _v.y) / 2 * c.height;
  // 見せ場の大きさ（画面上）に合わせて切り抜く
  let ext = 0;
  for (const p of b.pts) { _w.copy(p).project(camera); ext = Math.max(ext, Math.abs(_w.x - _v.x) * c.width / 2, Math.abs(_w.y - _v.y) * c.height / 2); }
  const side = clamp(ext * 2.5, 240, Math.min(c.width, c.height));
  const sx = clamp(px - side / 2, 0, c.width - side), sy = clamp(py - side * 0.45, 0, c.height - side);
  snap0 = document.createElement('canvas'); snap0.width = snap0.height = 1080;
  snap0.getContext('2d').drawImage(c, sx, sy, side, side, 0, 0, 1080, 1080);
  shareCache = null;
  prepareShare();
}
const FONT = 'system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans KR", "Noto Sans Thai", sans-serif';
function resultImage() {
  if (!snap0) return null;
  const c = document.createElement('canvas'); c.width = c.height = 1080;
  const g = c.getContext('2d');
  g.drawImage(snap0, 0, 0);
  const gr = g.createLinearGradient(0, 760, 0, 1080); gr.addColorStop(0, 'rgba(30,18,6,0)'); gr.addColorStop(1, 'rgba(30,18,6,.62)');
  g.fillStyle = gr; g.fillRect(0, 760, 1080, 320);
  g.textAlign = 'center';
  const text = (str, y, px, max, col) => {
    g.font = `800 ${px}px ${FONT}`;
    const w = g.measureText(str).width; if (w > max) { px *= max / w; g.font = `800 ${px}px ${FONT}`; }
    g.shadowColor = 'rgba(30,15,0,.6)'; g.shadowBlur = px * 0.2; g.shadowOffsetY = px * 0.04;
    g.fillStyle = col; g.fillText(str, 540, y);
    g.shadowColor = 'transparent';
  };
  text(t('type')[resultType][0], 960, 92, 980, '#ffd84a');
  text(t('title'), 1040, 44, 900, '#fff');
  return c;
}
function prepareShare() {
  if (!snap0) return;
  const key = lang + resultType;
  if (shareCache?.key === key) return;
  shareCache = { key, file: null };
  resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'banana-shindan.png', { type: 'image/png' }); }, 'image/png');
}
const shareFile = () => shareCache?.key === lang + resultType ? shareCache.file : null;

// ===== カメラ: 遊ぶ所（ヘッダーと下の80pxを除く）に収める =====
const stage = $('stage');
let VIEW = { w: 1, H: 1 };
const view = { cx: 0, cy: 0.03, cz: 0, hx: 0.12, hy: 0.08, top: 52, bot: 80, left: 0, right: 0, yaw: 0, pitch: 0.8 };
const viewTo = { ...view };
const _bp = [];
function sceneBounds() {
  const pts = [];
  for (let i = 0; i <= 8; i++) for (const th of [0, Math.PI]) pts.push(surf(i / 8, th + roll * 0, 0.02, new THREE.Vector3()).applyMatrix4(banana.matrixWorld));
  for (const s of strips) if (s.mesh.visible) for (let i = 0; i < NN; i += 3) pts.push(new THREE.Vector3().fromArray(s.rope.p, i * 3));
  for (const l of loose) for (let i = 0; i < NN; i += 4) { const p = new THREE.Vector3().fromArray(l.rope.p, i * 3); if (Math.hypot(p.x, p.z) < 0.3) pts.push(p); }
  const box = new THREE.Box3().setFromPoints(pts);
  return { c: box.getCenter(new THREE.Vector3()), pts, box };
}
function setViewTargets(snap) {
  const w = VIEW.w, H = VIEW.H, h = H - 80;
  const portrait = h / w > 1.15;
  viewTo.yaw = portrait ? Math.PI / 2 : 0;
  viewTo.pitch = portrait ? 1.0 : 0.82;
  if (state === 'result') {
    const wide = H <= 520 && w / H >= 4 / 3;
    let top = 52, bot = 80, left = 0, right = 0;
    if (wide) right = w / 2;
    else {
      const r = $('view').getBoundingClientRect();
      top = r.top; bot = H - r.bottom;
      if (r.height < 140) { top = Math.max(52, r.bottom - 140); bot = H - r.bottom - 0; }
    }
    // むいた皮も入るように
    const b = sceneBounds();
    camBasis(viewTo.yaw, viewTo.pitch);
    let hx = 0, hy = 0;
    for (const p of b.pts) { _v.subVectors(p, b.c); hx = Math.max(hx, Math.abs(_v.dot(camR))); hy = Math.max(hy, Math.abs(_v.dot(camU))); }
    Object.assign(viewTo, { cx: b.c.x, cy: b.c.y, cz: b.c.z, hx: hx * 1.08 + 0.008, hy: hy * 1.08 + 0.008, top, bot, left, right });
  } else {
    Object.assign(viewTo, { cx: 0, cy: 0.025, cz: 0, hx: portrait ? 0.08 : 0.145, hy: portrait ? 0.13 : 0.085, top: 52, bot: 80, left: 0, right: 0 });
  }
  if (snap) Object.assign(view, viewTo);
}
const camR = new THREE.Vector3(), camU = new THREE.Vector3(), camF = new THREE.Vector3();
function camBasis(yaw, pitch) {
  camF.set(-Math.sin(yaw) * Math.cos(pitch), -Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch));
  camR.set(Math.cos(yaw), 0, -Math.sin(yaw));
  camU.crossVectors(camR, camF);
}
function frame() {
  const w = VIEW.w, H = VIEW.H;
  const vw = Math.max(80, w - view.left - view.right), vh = Math.max(80, H - view.top - view.bot);
  camera.aspect = vw / vh;
  camera.setViewOffset(vw, vh, -view.left, -view.top, w, H);
  const vf = THREE.MathUtils.degToRad(camera.fov), tv = Math.tan(vf / 2), th = tv * camera.aspect;
  const d = Math.max(view.hx / th, view.hy / tv) + 0.04;
  camBasis(view.yaw, view.pitch);
  camera.position.set(view.cx, view.cy, view.cz).addScaledVector(camF, -d);
  camera.up.set(0, 1, 0);
  camera.lookAt(view.cx, view.cy, view.cz);
  camera.updateProjectionMatrix(); camera.updateMatrixWorld();
}
function resize() {
  const w = stage.clientWidth, H = stage.clientHeight;
  renderer.setSize(w, H, false);
  VIEW = { w, H };
  setViewTargets(state !== 'result');
}
addEventListener('resize', () => { resize(); if (state === 'result') setTimeout(() => setViewTargets(), 50); });

// ===== 毎フレーム =====
let last = performance.now(), acc = 0, frameEma = 16, slowT = 0;
const rings = [$('ring0'), $('ring1')];
function loop(now) {
  const raw = now - last;
  const fdt = Math.min(0.05, raw / 1000); last = now;
  frameEma = frameEma * 0.95 + Math.min(100, raw) * 0.05;
  if (pixelRatio > 1 && state !== 'result') { slowT = frameEma > 24 ? slowT + fdt : 0; if (slowT > 3) { pixelRatio = Math.max(1, pixelRatio * 0.7); renderer.setPixelRatio(pixelRatio); resize(); slowT = 0; } }
  acc += fdt;
  while (acc >= DT) { stepGame(DT); acc -= DT; }
  const alpha = acc / DT;
  if (stage.clientWidth !== VIEW.w || stage.clientHeight !== VIEW.H) resize();
  const k = 1 - Math.exp(-fdt * 4);
  for (const key of ['cx', 'cy', 'cz', 'hx', 'hy', 'top', 'bot', 'left', 'right', 'yaw', 'pitch']) view[key] = lerp(view[key], viewTo[key], k);
  frame();
  // 帯の形
  for (const st of strips) {
    const vis = st.dp - st.d0 > 0.002;
    st.mesh.visible = vis;
    if (!vis) continue;
    radialDir(sOf(st.dp), st.a + st.w / 2, st.n0).transformDirection(banana.matrixWorld);
    acrossDir(sOf(st.dp), st.a + st.w / 2, _A).transformDirection(banana.matrixWorld);
    if (st.rope.sleep < 40 || st.rope.pin >= 0) buildFlap(st.mesh, st.rope, st.a, st.w, st.d0, st.dp, alpha, st.n0);
  }
  for (const l of loose) if (l.sleep < 95) { _A.copy(l.n0).cross(_w.set(0, 1, 0)); buildFlap(l.mesh, l.rope, l.a, l.w, l.d0, l.d1, alpha, l.n0); }
  // 軸・お尻の先は、くっついている皮の先に付いていく
  for (const [obj, on] of [[stem, stemOn], [nub, nubOn]]) {
    if (!on) continue;
    if (obj.parent !== scene) scene.add(obj);
    const R = on.rope, k2 = (NN - 1) * 3, k1 = (NN - 2) * 3;
    obj.position.set(R.p[k2], R.p[k2 + 1], R.p[k2 + 2]);
    _v.set(R.p[k2] - R.p[k1], R.p[k2 + 1] - R.p[k1 + 1], R.p[k2 + 2] - R.p[k1 + 2]);
    if (_v.lengthSq() > 1e-12) obj.quaternion.setFromUnitVectors(_w.set(0, 1, 0), _v.normalize());
  }
  // 最初の輪: 両端
  if (state === 'ready') {
    const r = cv.getBoundingClientRect();
    [0.06, 0.94].forEach((s, i) => {
      surf(s, faceTheta(s), 0, _v).applyMatrix4(banana.matrixWorld).project(camera);
      rings[i].style.transform = `translate(${((_v.x + 1) / 2 * r.width).toFixed(1)}px, ${((1 - _v.y) / 2 * r.height).toFixed(1)}px)`;
    });
  }
  if (state === 'result' && snapT > 0) { snapT -= fdt; if (snapT <= 0) takeSnap(); }
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

// ===== はじめる =====
applyLang();
resize();
reset();
frame();
renderer.compile(scene, camera);
renderer.render(scene, camera);
// 帯の材質も先に用意しておく
{ const st = newStrip(0, 0.5, 0, 0.2); buildFlap(st.mesh, st.rope, st.a, st.w, st.d0, st.dp, 1, _v.set(0, 1, 0)); renderer.compile(scene, camera); renderer.render(scene, camera); scene.remove(st.mesh); strips = []; stats = newStats(); peelU.uN.value = 0; }
window.__banReady = true;
$('err').hidden = true;
window.__ban = {
  get state() { return state; }, stats: () => stats, strips: () => strips, judge, scores: () => scores,
  type: () => resultType, setRoll: r => { roll = r; rollV = 0; rollTo = null; },
  // テスト用: 画面の座標でつまんで動かす
  down: (x, y) => onDown({ pointerId: 99, clientX: x, clientY: y }), move: (x, y) => onMove({ pointerId: 99, clientX: x, clientY: y }), up: (x, y) => onUp({ pointerId: 99, clientX: x, clientY: y }),
  screen: (s, th, lift = 0) => { surf(s, th == null ? faceTheta(s) : th, lift, _v).applyMatrix4(banana.matrixWorld).project(camera); const r = cv.getBoundingClientRect(); return [(_v.x + 1) / 2 * r.width, (1 - _v.y) / 2 * r.height]; },
  faceTheta, finish: finishGame,
};
requestAnimationFrame(loop);
</script>
