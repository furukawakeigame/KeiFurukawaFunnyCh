$('undo').onclick = () => { const d = undoStack.pop(); if (d) { mctx.putImageData(d, 0, 0); drawCut(); updateCutDone(); } };
$('cancel').onclick = () => setMode('start');
$('cutDone').onclick = () => {
  const s = makeSprite(); if (!s) return;
  setPrint(s); resetCloth(); parkIron(); setMode('start');
};

// サンプル画像（コードで描く猫。背景は透明）
function sampleImage() {
  const c = document.createElement('canvas'); c.width = 440; c.height = 420;
  const g = c.getContext('2d'); g.translate(-80, -85);
  g.fillStyle = '#f2a347'; g.strokeStyle = '#5a3a22'; g.lineWidth = 10; g.lineJoin = 'round';
  for (const s of [-1, 1]) { g.beginPath(); g.moveTo(300 + s * 70, 210); g.lineTo(300 + s * 180, 100); g.lineTo(300 + s * 190, 270); g.closePath(); g.fill(); g.stroke(); }
  g.beginPath(); g.ellipse(300, 330, 190, 160, 0, 0, Math.PI * 2); g.fill(); g.stroke();
  g.fillStyle = '#5a3a22';
  for (const s of [-1, 1]) { g.beginPath(); g.ellipse(300 + s * 75, 310, 20, 30, 0, 0, Math.PI * 2); g.fill(); }
  g.fillStyle = '#fff'; for (const s of [-1, 1]) { g.beginPath(); g.arc(300 + s * 75 + 6, 298, 8, 0, Math.PI * 2); g.fill(); }
  g.fillStyle = '#ff7f8f'; g.beginPath(); g.moveTo(285, 360); g.lineTo(315, 360); g.lineTo(300, 378); g.closePath(); g.fill();
  g.strokeStyle = '#5a3a22'; g.lineWidth = 7; g.lineCap = 'round';
  g.beginPath(); g.moveTo(300, 378); g.quadraticCurveTo(300, 405, 270, 405); g.moveTo(300, 378); g.quadraticCurveTo(300, 405, 330, 405); g.stroke();
  for (const s of [-1, 1]) for (const d of [-14, 14]) { g.beginPath(); g.moveTo(300 + s * 140, 375 + d * 0.6); g.lineTo(300 + s * 215, 365 + d * 1.6); g.stroke(); }
  g.fillStyle = 'rgba(255,120,120,0.35)'; for (const s of [-1, 1]) { g.beginPath(); g.ellipse(300 + s * 130, 385, 30, 18, 0, 0, Math.PI * 2); g.fill(); }
  return c;
}

// ---- 操作 ----
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -SOLE_Y), hit = new THREE.Vector3();
const coarse = matchMedia('(pointer: coarse)').matches;
let ptrId = null;
function aim(e) {
  const r = gl.getBoundingClientRect();
  // 指で隠れないよう、スマホでは少し上をねらう
  const y = e.clientY - (coarse ? 40 : 0);
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(y - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ndc, camera);
  if (ray.ray.intersectPlane(floorPlane, hit)) {
    ir.tx = Math.max(-CW / 2 - 0.4, Math.min(CW / 2 + 0.4, hit.x));
    ir.tz = Math.max(-CH / 2 - 0.4, Math.min(CH / 2 + 0.4, hit.z));
  }
}
gl.addEventListener('pointerdown', e => {
  if (mode === 'start') { startPlay(); return; }
  if (mode === 'result') { gl.setPointerCapture(e.pointerId); rot.drag = e.pointerId; rot.lx = e.clientX; rot.lt = performance.now(); rot.vel = 0; rot.hinted = true; return; }
  if (mode !== 'play' && mode !== 'crumple') return;
  if (ptrId !== null) return;
  e.preventDefault(); initAudio();
  gl.setPointerCapture(e.pointerId); ptrId = e.pointerId;
  demo = 0; aim(e); ir.pressing = true;
});
gl.addEventListener('pointermove', e => {
  if (mode === 'result' && e.pointerId === rot.drag) {
    const now = performance.now(), d = (e.clientX - rot.lx) * 0.012, dt = Math.max(0.008, (now - rot.lt) / 1000);
    hangAng += d; rot.vel = rot.vel * 0.5 + d / dt * 0.5; rot.lx = e.clientX; rot.lt = now;
    return;
  }
  if (mode !== 'play' && mode !== 'crumple') return;
  if (ptrId === null && e.pointerType === 'mouse') { aim(e); return; }
  if (e.pointerId === ptrId) aim(e);
});
const up = e => {
  if (e.pointerId === rot.drag) { rot.drag = null; if (performance.now() - rot.lt > 80) rot.vel = 0; return; }
  if (e.pointerId !== ptrId) return; ptrId = null; ir.pressing = false; };
gl.addEventListener('pointerup', up);
gl.addEventListener('pointercancel', up);

// ---- X投稿用の動画（吊るした服がハンガーごと1回転する。最初と最後がつながるループ） ----
// 焼きそばパンと同じく、画面と同じ renderer で表示の合間に1コマずつ描いて MP4 にする。
// 録り始めたときの服の形を写しておき、それを回すので、きれいにループする
const VFPS = 30, VFRAMES = 150; // 5秒で1回転
let shareFile = null, videoJob = null, videoStarted = false, resultId = 0;
async function makeVideo(key) {
  if (!('VideoEncoder' in window) || !window.Mp4Muxer) return;
  const size = 720;
  let cfg = null;
  for (const codec of ['avc1.640028', 'avc1.4d0028', 'avc1.42001f']) {
    const c = { codec, width: size, height: size, bitrate: 6e6, framerate: VFPS };
    try { if ((await VideoEncoder.isConfigSupported(c)).supported) { cfg = c; break; } } catch {}
  }
  if (!cfg || key !== resultId || mode !== 'result') return;
  const cam = new THREE.PerspectiveCamera(camera.fov, 1, 0.1, 100), tf = Math.tan(cam.fov * Math.PI / 360);
  const dist = Math.max((CH + 1.4) / 2 / tf, (CW + 0.6) / 2 / tf), el = 0.12;
  cam.position.set(0, hangY() + dist * Math.sin(el), dist * Math.cos(el)); cam.lookAt(0, hangY(), 0);
  const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec: 'avc', width: size, height: size, frameRate: VFPS }, fastStart: 'in-memory' });
  const out = document.createElement('canvas'); out.width = out.height = size;
  const job = { key, cam, size, out, ctx: out.getContext('2d'), muxer, i: 0, failed: false, ang: hangAng,
    snap: [cpos.slice(), cnrm.slice(), bpos.slice(), bnrm.slice()], keep: [new Float32Array(NV * 3), new Float32Array(NV * 3), new Float32Array(NV * 3), new Float32Array(NV * 3)] };
  job.enc = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: () => { job.failed = true; } });
  job.enc.configure(cfg);
  videoJob = job;
}
// ループの中から呼ぶ。1回で1コマ
function videoFrame() {
  const job = videoJob;
  if (job.key !== resultId || job.failed || mode !== 'result') { try { job.enc.close(); } catch {} videoJob = null; return; }
  const arrs = [cpos, cnrm, bpos, bnrm], attrs = [clothGeo.attributes.position, clothGeo.attributes.normal, backGeo.attributes.position, backGeo.attributes.normal];
  // 録り始めの服の形に一時的に差しかえて、ハンガーごと回して描く
  arrs.forEach((a, n) => { job.keep[n].set(a); a.set(job.snap[n]); attrs[n].needsUpdate = true; });
  const rot = hangerRot.rotation.y;
  hangerRot.rotation.y = job.ang + job.i / VFRAMES * Math.PI * 2;
  const cw = renderer.domElement.width, ch = renderer.domElement.height, pr = renderer.getPixelRatio();
  const src = Math.floor(Math.min(cw, ch, 1440) / 2) * 2;
  renderer.setScissorTest(true);
  renderer.setViewport(0, 0, src / pr, src / pr); renderer.setScissor(0, 0, src / pr, src / pr);
  renderer.render(scene, job.cam);
  job.ctx.drawImage(renderer.domElement, 0, ch - src, src, src, 0, 0, job.size, job.size);
  renderer.setScissorTest(false); renderer.setViewport(0, 0, cw / pr, ch / pr);
  hangerRot.rotation.y = rot;
  arrs.forEach((a, n) => { a.set(job.keep[n]); attrs[n].needsUpdate = true; });
  const vf = new VideoFrame(job.out, { timestamp: Math.round(job.i * 1e6 / VFPS), duration: Math.round(1e6 / VFPS) });
  job.enc.encode(vf, { keyFrame: job.i % 60 === 0 }); vf.close();
  job.i++;
  if (job.i < VFRAMES) return;
  videoJob = null;
  (async () => {
    await job.enc.flush(); job.enc.close(); job.muxer.finalize();
    if (job.key !== resultId || job.failed) return;
    shareFile = new File([job.muxer.target.buffer], 'image-iron.mp4', { type: 'video/mp4' });
    updatePost();
  })().catch(() => {});
}
// 動画ができるまでは投稿ボタンを薄くする
function updatePost() { $('post').classList.toggle('wait', !shareFile && 'VideoEncoder' in window); }
// 押したら必ず共有メニューを開く（スマホもPCも。動画ができていれば動画つき、まだなら文とURLだけ）。
// 共有メニューがない環境だけ、動画を保存してから投稿画面を開く
$('post').addEventListener('click', e => {
  if (navigator.share) {
    e.preventDefault();
    const text = `${t('share')} ${TAG}\n${URL_GAME}`;
    const data = shareFile && navigator.canShare?.({ files: [shareFile] }) ? { title: t('title'), files: [shareFile], text } : { title: t('title'), text };
    navigator.share(data).catch(() => {});
    return;
  }
  if (shareFile) {
    const d = document.createElement('a');
    d.href = URL.createObjectURL(shareFile); d.download = shareFile.name; d.click();
    setTimeout(() => URL.revokeObjectURL(d.href), 10000);
  }
});

// ---- ループ ----
let last = performance.now();
function loop(now) {
  const dt = Math.min(1 / 30, Math.max(1e-3, (now - last) / 1000)); last = now;
  frame(dt);
  if (videoJob) videoFrame();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
function frame(dt) {
  if (mode === 'crumple') {
    // くしゃっと丸まる → お手本で少しだけかける
    anim += dt;
    const k = Math.min(1, anim / 0.7);
    amp = k < 1 ? 1 - Math.pow(1 - k, 3) * Math.cos(k * 9) : 1; dirty = true;
    if (anim > 0.9) { setMode('play'); demo = 1.6; ir.pressing = true; ir.tx = -CW * 0.05; ir.tz = CH * 0.1; }
  }
  if (mode === 'play' && demo > 0) {
    demo -= dt;
    if (demo <= 0) { ir.pressing = false; ir.tx = CW * 0.38; ir.tz = CH * 0.28; }
  }
  if (mode === 'play' || mode === 'crumple') ironStep(dt);
  if (mode === 'start' || mode === 'cut') { iron.position.set(ir.x, ir.y, ir.z); iron.rotation.y = ir.yaw; }
  if (mode === 'result') {
    anim += dt;
    const k = Math.min(1, anim / 1.1), e = k * k * (3 - 2 * k);
    const dy = CH / 2 - clothTop; // シワで縮んだぶん上げて、肩をハンガーの少し上にそろえる
    hanger.visible = true;
    if (!simOn) {
      cloth.rotation.x = e * Math.PI / 2;
      cloth.position.y = e * (hangY() + dy + LIFT);
      hs = 1 - 0.6 * e; dirty = true;
      if (k >= 1) { cloth.rotation.x = 0; cloth.position.y = 0; dirty = false; initSim(); }
    }
    if (simOn) { stepSim(dt); drawSim(); }
    // ドラッグで回す（離すと惰性で回って止まる）
    // 掛かったら一度だけ、ゆっくり1回転して正面に戻る（回せることを見せる）
    if (!rot.hinted && anim > 3) {
      const k2 = Math.min(1, (anim - 3) / 2.6);
      hangAng = Math.PI * 2 * k2 * k2 * (3 - 2 * k2);
      if (k2 >= 1) rot.hinted = true;
    } else if (!rot.drag) { hangAng += rot.vel * dt; rot.vel *= Math.exp(-dt * 1.5); }
    hangerRot.rotation.y = hangAng;
    // 吊るして落ち着いたら、X投稿用の動画を裏で作る
    if (anim > 6 && !videoStarted) { videoStarted = true; makeVideo(resultId); }
  }
  stepPuffs(dt);
  if (dirty) { updateCloth(); dirty = false; }
  placeCam(dt);
}

// テスト・アイコン作成用
window.__iron = { get mode() { return mode; }, ir, wr, burn, setMode, startPlay, frame, get shareFile() { return shareFile; }, sim: () => ({ P, sAct, sSeam, Y0, arm0: armY(0), HSEG }) };
applyLang();
setPrint(sampleImage()); makeCrumple(); resetCloth(); parkIron();
setMode('start');
resize(); placeCam(-1);
new ResizeObserver(resize).observe($('stage'));
requestAnimationFrame(loop);
</script>
