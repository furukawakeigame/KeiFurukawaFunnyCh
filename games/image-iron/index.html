{

  iron.add(new THREE.Mesh(sole, mSole), new THREE.Mesh(body, mBody));
  const handle = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([
    new THREE.Vector3(-0.5, 0.3, 0), new THREE.Vector3(-0.46, 0.62, 0), new THREE.Vector3(-0.2, 0.72, 0),
    new THREE.Vector3(0.12, 0.7, 0), new THREE.Vector3(0.3, 0.32, 0)]), 48, 0.075, 12), mWhite);
  iron.add(handle);
  const dial = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.05, 24), mWhite);
  dial.position.set(-0.08, 0.36, 0); iron.add(dial);
  const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.035, 12, 8), new THREE.MeshBasicMaterial({ color: 0xff5a3c }));
  lamp.position.set(0.12, 0.34, 0); iron.add(lamp);
  iron.traverse(o => { if (o.isMesh) o.castShadow = true; });
  scene.add(iron);
}
const ir = { x: 2.2, z: 1.4, yaw: Math.PI / 2, lift: 0.5, tx: 2.2, tz: 1.4, pressing: false, vx: 0, vz: 0 };

// ---- 湯気と煙 ----
const puffTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,0.9)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
})();
const puffs = [];
for (let i = 0; i < 60; i++) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: puffTex, transparent: true, depthWrite: false, opacity: 0 }));
  s.visible = false; scene.add(s); puffs.push({ s, life: 0, max: 1, vx: 0, vy: 0, vz: 0, o: 0.5 });
}
let puffI = 0;
function puff(x, y, z, smoke) {
  const P = puffs[puffI++ % puffs.length];
  P.s.position.set(x, y, z); P.s.visible = true;
  P.s.material.color.set(smoke ? 0x4a4038 : 0xffffff);
  P.life = 0; P.max = smoke ? 1.6 : 0.9; P.o = smoke ? 0.55 : 0.6; P.sz = smoke ? 0.35 : 0.25;
  P.vx = (Math.random() - 0.5) * 0.3; P.vz = (Math.random() - 0.5) * 0.3; P.vy = smoke ? 0.7 : 1.1;
}
function stepPuffs(dt) {
  for (const P of puffs) {
    if (!P.s.visible) continue;
    P.life += dt; const k = P.life / P.max;
    if (k >= 1) { P.s.visible = false; continue; }
    P.s.position.x += P.vx * dt; P.s.position.y += P.vy * dt; P.s.position.z += P.vz * dt;
    P.s.scale.setScalar(P.sz * (1 + k * 2.5)); P.s.material.opacity = P.o * Math.sin(Math.PI * Math.min(1, k * 1.4 + 0.1)) * (1 - k);
  }
}

// ---- アイロンがけ ----
let burnDirty = false;
function ironStep(dt) {
  // ねらった所へ滑らせる
  const k = Math.min(1, dt * 16), px = ir.x, pz = ir.z;
  ir.x += (ir.tx - ir.x) * k; ir.z += (ir.tz - ir.z) * k;
  ir.vx = (ir.x - px) / dt; ir.vz = (ir.z - pz) / dt;
  const sp = Math.hypot(ir.vx, ir.vz);
  // 動いた向きにそろえる（前後どちら向きでもよい）
  if (sp > 0.6) {
    let a = Math.atan2(-ir.vz, ir.vx), d = a - ir.yaw;
    d = Math.atan2(Math.sin(d), Math.cos(d));
    if (d > Math.PI / 2) d -= Math.PI; else if (d < -Math.PI / 2) d += Math.PI;
    ir.yaw += d * Math.min(1, dt * 5);
  }
  ir.lift += ((ir.pressing ? 0 : 0.5) - ir.lift) * Math.min(1, dt * 14);
  iron.position.set(ir.x, PRESS_Y + ir.lift, ir.z); iron.rotation.y = ir.yaw;

  press.fill(0);
  for (let v = 0; v < NV; v++) heat[v] *= Math.exp(-dt * 0.9);
  let burning = 0, touched = 0;
  if (ir.lift < 0.08) {
    const c = Math.cos(ir.yaw), s = Math.sin(ir.yaw), R = IL / 2 + 0.05;
    const i0 = Math.max(0, Math.floor(((ir.x - R) / CW + 0.5) * N)), i1 = Math.min(N, Math.ceil(((ir.x + R) / CW + 0.5) * N));
    const j0 = Math.max(0, Math.floor(((ir.z - R) / CH + 0.5) * N)), j1 = Math.min(N, Math.ceil(((ir.z + R) / CH + 0.5) * N));
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
      const v = j * (N + 1) + i, dx = bx[v] - ir.x, dz = bz[v] - ir.z;
      const u = dx * c - dz * s, w = dx * s + dz * c;
      if (u < -IL / 2 || u > IL / 2) continue;
      const hw = u < 0.05 ? IW : IW * Math.sqrt(Math.max(0, 1 - ((u - 0.05) / (IL / 2 - 0.05)) ** 2));
      const m = Math.min(hw - Math.abs(w), u + IL / 2, IL / 2 - u);
      if (m <= 0) continue;
      const wt = Math.min(1, m / 0.06);
      press[v] = wt; touched++;
      wr[v] = Math.max(0, wr[v] - dt * 2.6 * wt);
      heat[v] += dt * 1.8 * wt;
      if (heat[v] > 1.3) { burn[v] = Math.min(1, burn[v] + (heat[v] - 1.3) * dt * 1.4); burnColor(v); burnDirty = true; burning++; }
    }
  }
  if (burnDirty) { clothGeo.attributes.color.needsUpdate = true; burnDirty = false; }
  // 湯気・煙・音
  const on = touched > 0;
  if (on && Math.random() < dt * (4 + sp * 5)) {
    const a = Math.random() * Math.PI * 2;
    puff(ir.x + Math.cos(a) * 0.45, 0.12, ir.z + Math.sin(a) * 0.35, false);
  }
  if (burning > 4 && Math.random() < dt * 9) puff(ir.x + (Math.random() - 0.5) * 0.5, 0.15, ir.z + (Math.random() - 0.5) * 0.4, true);
  setSound(on ? Math.min(0.22, 0.04 + sp * 0.05) : 0, burning > 4 ? Math.min(0.25, burning / 600) : 0);
  if (on || ir.lift < 0.45) dirty = true;
}

// ---- カメラ ----
const cam = { tx: 0, ty: 0, tz: 0.25, el: 1.0, dist: 9, az: 0 };
const camGoal = { ...cam };
function fitCam() {
  const r = $('stage').getBoundingClientRect(), asp = r.width / Math.max(1, r.height);
  camera.aspect = asp; camera.updateProjectionMatrix();
  const tf = Math.tan(camera.fov * Math.PI / 360);
  if (mode === 'result') {
    Object.assign(camGoal, { tx: 0, ty: hangY(), tz: 0, el: 0.12, az: 0 });
    camGoal.dist = Math.max((CH + 1.6) / 2 / tf, (Math.max(CW, CH) + 0.8) / 2 / (tf * asp));
  } else {
    Object.assign(camGoal, { tx: 0, ty: 0, tz: 0.25, el: 0.98, az: 0 });
    camGoal.dist = Math.max(CH * 0.62 / tf + 1.4, (CW + 0.5) / 2 / (tf * asp) + 0.6);
  }
}
function placeCam(dt) {
  const k = dt < 0 ? 1 : Math.min(1, dt * 3);
  for (const key in cam) cam[key] += (camGoal[key] - cam[key]) * k;
  camera.position.set(cam.tx + cam.dist * Math.sin(cam.az) * Math.cos(cam.el), cam.ty + cam.dist * Math.sin(cam.el), cam.tz + cam.dist * Math.cos(cam.az) * Math.cos(cam.el));
  camera.lookAt(cam.tx, cam.ty, cam.tz);
}
function resize() {
  const r = $('stage').getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  fitCam();
}

// ---- 画面の流れ ----
let mode = 'start'; // start | crumple | play | result
let anim = 0, demo = 0;
const hangY = () => CH / 2 + 0.5;
function setMode(m) {
  mode = m; anim = 0;
  $('barStart').classList.toggle('hide', m !== 'start');
  $('barPlay').classList.toggle('hide', m !== 'play' && m !== 'crumple');
  $('barResult').classList.toggle('hide', m !== 'result');
  iron.visible = m !== 'result';
  hanger.visible = false;
  if (m !== 'result') { hang.rotation.set(0, 0, 0); cloth.rotation.set(0, 0, 0); cloth.position.set(0, 0, 0); }
  if (m === 'result') { ir.pressing = false; setSound(0, 0); for (const P of puffs) P.s.visible = false; }
  fitCam();
}
function startPlay() {
  initAudio();
  resetCloth(); setMode('crumple');
  ir.pressing = false; ir.tx = ir.x = CW / 2 + 0.15; ir.tz = ir.z = CH * 0.2;
}
$('play').onclick = startPlay;
$('again').onclick = startPlay;
let clothTop = 0;
$('done').onclick = () => {
  if (mode !== 'play' && mode !== 'crumple') return;
  amp = 1; press.fill(0); updateCloth();
  // シワで縮んだぶん、ハンガーを布の上の端に合わせる
  clothTop = 0; for (let v = 0; v <= N; v++) clothTop = Math.max(clothTop, -cpos[v * 3 + 2]);
  setMode('result');
};

// 画像選択
for (const b of document.querySelectorAll('.pick')) b.onclick = () => $('file').click();
$('file').onchange = e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f || !f.type.startsWith('image/')) return;
  const u = URL.createObjectURL(f), im = new Image();
  im.onload = () => { URL.revokeObjectURL(u); setImage(im); setMode('start'); amp = 0; dirty = true; };
  im.onerror = () => URL.revokeObjectURL(u);
  im.src = u;
};

// サンプル画像（コードで描く）
function sampleImage() {
  const c = document.createElement('canvas'); c.width = c.height = 600;
  const g = c.getContext('2d');
  const bg = g.createLinearGradient(0, 0, 600, 600); bg.addColorStop(0, '#ffd9e4'); bg.addColorStop(1, '#fff2b8');
  g.fillStyle = bg; g.fillRect(0, 0, 600, 600);
  g.fillStyle = 'rgba(255,255,255,0.5)';
  for (let y = 30; y < 600; y += 80) for (let x = (y / 80 % 2) * 40 + 30; x < 600; x += 80) { g.beginPath(); g.arc(x, y, 12, 0, Math.PI * 2); g.fill(); }
  g.fillStyle = '#f2a347'; g.strokeStyle = '#5a3a22'; g.lineWidth = 10; g.lineJoin = 'round';
  for (const s of [-1, 1]) { g.beginPath(); g.moveTo(300 + s * 70, 210); g.lineTo(300 + s * 180, 100); g.lineTo(300 + s * 190, 270); g.closePath(); g.fill(); g.stroke(); }
  g.beginPath(); g.ellipse(300, 330, 190, 165, 0, 0, Math.PI * 2); g.fill(); g.stroke();
  g.fillStyle = '#5a3a22';
  for (const s of [-1, 1]) { g.beginPath(); g.ellipse(300 + s * 75, 310, 20, 30, 0, 0, Math.PI * 2); g.fill(); }
  g.fillStyle = '#fff'; for (const s of [-1, 1]) { g.beginPath(); g.arc(300 + s * 75 + 6, 298, 8, 0, Math.PI * 2); g.fill(); }
  g.fillStyle = '#ff7f8f'; g.beginPath(); g.moveTo(285, 360); g.lineTo(315, 360); g.lineTo(300, 378); g.closePath(); g.fill();
  g.strokeStyle = '#5a3a22'; g.lineWidth = 7; g.lineCap = 'round';
  g.beginPath(); g.moveTo(300, 378); g.quadraticCurveTo(300, 405, 270, 405); g.moveTo(300, 378); g.quadraticCurveTo(300, 405, 330, 405); g.stroke();
  for (const s of [-1, 1]) for (const d of [-14, 14]) { g.beginPath(); g.moveTo(300 + s * 140, 375 + d * 0.6); g.lineTo(300 + s * 230, 365 + d * 1.6); g.stroke(); }
  g.fillStyle = 'rgba(255,120,120,0.35)'; for (const s of [-1, 1]) { g.beginPath(); g.ellipse(300 + s * 130, 385, 30, 18, 0, 0, Math.PI * 2); g.fill(); }
  return c;
}

// ---- 操作 ----
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -PRESS_Y), hit = new THREE.Vector3();
const coarse = matchMedia('(pointer: coarse)').matches;
let ptrId = null;
function aim(e) {
  const r = gl.getBoundingClientRect();
  // 指で隠れないよう、スマホでは少し上をねらう
  const y = e.clientY - (coarse ? 40 : 0);
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(y - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ndc, camera);
  if (ray.ray.intersectPlane(floorPlane, hit)) {
    ir.tx = Math.max(-CW / 2 - 0.6, Math.min(CW / 2 + 0.6, hit.x));
    ir.tz = Math.max(-CH / 2 - 0.5, Math.min(CH / 2 + 0.5, hit.z));
  }
}
gl.addEventListener('pointerdown', e => {
  if (mode === 'start') { startPlay(); return; }
  if (mode !== 'play' && mode !== 'crumple') return;
  if (ptrId !== null) return;
  e.preventDefault(); initAudio();
  gl.setPointerCapture(e.pointerId); ptrId = e.pointerId;
  demo = 0; aim(e); ir.pressing = true;
});
gl.addEventListener('pointermove', e => {
  if (mode !== 'play' && mode !== 'crumple') return;
  if (ptrId === null && e.pointerType === 'mouse') { aim(e); return; }
  if (e.pointerId === ptrId) aim(e);
});
const up = e => { if (e.pointerId !== ptrId) return; ptrId = null; ir.pressing = false; };
gl.addEventListener('pointerup', up);
gl.addEventListener('pointercancel', up);

// ---- ループ ----
let last = performance.now(), time = 0;
function loop(now) {
  const dt = Math.min(1 / 30, Math.max(1e-3, (now - last) / 1000)); last = now;
  frame(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
function frame(dt) {
  time += dt;
  if (mode === 'crumple') {
    // くしゃっと丸まる → お手本で少しだけかける
    anim += dt;
    const k = Math.min(1, anim / 0.7);
    amp = k < 1 ? 1 - Math.pow(1 - k, 3) * Math.cos(k * 9) : 1; dirty = true;
    if (anim > 0.9) { setMode('play'); demo = 1.5; ir.pressing = true; ir.tx = CW * 0.05; }
  }
  if (mode === 'play' && demo > 0) {
    demo -= dt;
    if (demo <= 0) { ir.pressing = false; ir.tx = CW / 2 + 0.15; }
  }
  if (mode === 'play' || mode === 'crumple') ironStep(dt);
  if (mode === 'start') { iron.position.set(ir.x, PRESS_Y + ir.lift, ir.z); iron.rotation.y = ir.yaw; }
  if (mode === 'result') {
    anim += dt;
    const k = Math.min(1, anim / 1.1), e = k * k * (3 - 2 * k);
    cloth.rotation.x = e * Math.PI / 2;
    cloth.position.y = e * hangY();
    hanger.visible = anim > 0.9;
    hanger.position.y = hangY() + clothTop + 0.02;
    hanger.scale.setScalar(Math.max(0.6, CW / 2.4) * Math.min(1, (anim - 0.9) * 5));
    hang.rotation.y = anim > 1.8 ? (anim - 1.8) * 0.7 : 0;
  }
  stepPuffs(dt);
  if (dirty) { updateCloth(); dirty = false; }
  placeCam(dt);
}

// テスト・アイコン作成用
window.__iron = { get mode() { return mode; }, ir, wr, burn, setMode, startPlay, setImage, frame };
applyLang();
setImage(sampleImage());
setMode('start');
resize(); placeCam(-1);
new ResizeObserver(resize).observe($('stage'));
requestAnimationFrame(loop);
</script>
</body>
</html>
