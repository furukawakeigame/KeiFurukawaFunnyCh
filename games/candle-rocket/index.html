  <script>

  <script type="module">
    import * as THREE from 'three';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import * as CANNON from 'cannon-es';
    window.CANDLE_READY = true;

    const SHARE_URL = 'https://keifurukawafunnych.com/games/candle-rocket/';

    // ---------- 言語 ----------
    const store = {
      get(k, d) { try { const v = localStorage.getItem('candle-rocket:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
      set(k, v) { try { localStorage.setItem('candle-rocket:' + k, JSON.stringify(v)); } catch {} },
    };
    const autoLang = () => { for (const l of navigator.languages?.length ? navigator.languages : [navigator.language || '']) { const c = l.toLowerCase().slice(0, 2); if (['ja', 'ko', 'en', 'th'].includes(c)) return c; } return 'en'; };
    const TAG = '#ロウソク立てゲーム';
    const DICT = {
      ja: { title: 'ロウソク立て', back: '← トップへ戻る', again: 'もう一度', post: 'Xに投稿', tilt: d => `傾き ${d}°`, off: c => `中心から ${c}cm`,
        shareOk: (d, c) => `ロケットみたいに飛ぶロウソクをケーキに立てた！ 傾き${d}° 中心から${c}cm ${TAG}`, shareNg: `ロケットみたいに飛ぶロウソクをケーキに立てられなかった ${TAG}` },
      ko: { title: '케이크 초 꽂기', back: '← 처음으로', again: '다시 하기', post: 'X에 게시', tilt: d => `기울기 ${d}°`, off: c => `중심에서 ${c}cm`,
        shareOk: (d, c) => `로켓처럼 나는 초를 케이크에 꽂았다! 기울기 ${d}° 중심에서 ${c}cm ${TAG}`, shareNg: `로켓처럼 나는 초를 케이크에 꽂지 못했다 ${TAG}` },
      en: { title: 'Candle Rocket', back: '← Back to top', again: 'Play again', post: 'Post on X', tilt: d => `Tilt ${d}°`, off: c => `${c}cm from center`,
        shareOk: (d, c) => `I flew a rocket candle into the cake and it stood! Tilt ${d}°, ${c}cm from center ${TAG}`, shareNg: `I flew a rocket candle at the cake and it didn't stand ${TAG}` },
      th: { title: 'ปักเทียนจรวด', back: '← กลับหน้าแรก', again: 'เล่นอีกครั้ง', post: 'โพสต์ลง X', tilt: d => `เอียง ${d}°`, off: c => `ห่างจากกลาง ${c}cm`,
        shareOk: (d, c) => `บังคับเทียนจรวดไปปักบนเค้กได้! เอียง ${d}° ห่างจากกลาง ${c}cm ${TAG}`, shareNg: `บังคับเทียนจรวดไปปักบนเค้กไม่สำเร็จ ${TAG}` },
    };
    let lang = store.get('lang', null) || autoLang();
    const t = k => DICT[lang][k];
    const langSel = document.getElementById('lang');
    langSel.value = lang;
    langSel.addEventListener('change', () => { lang = langSel.value; store.set('lang', lang); applyLang(); });
    function applyLang() {
      document.documentElement.lang = lang;
      document.title = t('title');
      document.getElementById('back').textContent = t('back');
      renderControls();
      if (state === 'result') { showResult(); prepareShare(); }
    }

    // ---------- 音 ----------
    let soundOn = store.get('sound', true);
    const soundBtn = document.getElementById('sound');
    const drawSoundBtn = () => {
      soundBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>${soundOn ? '<path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>' : '<path d="M17 9l5 6M22 9l-5 6"/>'}</svg>`;
    };
    drawSoundBtn();
    soundBtn.addEventListener('click', () => { soundOn = !soundOn; store.set('sound', soundOn); drawSoundBtn(); if (!soundOn) stopSong(); });
    let ac = null, jetGain = null, jetBp = null, jetLp = null, songBus = null;
    const noiseBuf = dur => { const b = ac.createBuffer(1, Math.floor(ac.sampleRate * dur), ac.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b; };
    function initAudio() {
      if (ac) return;
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        const o = ac.createOscillator(), g = ac.createGain(); g.gain.value = 0;
        o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.05);
        // 噴射の「ゴーッ」: ずっと鳴らしておき、炎の強さで音量を変える
        const s = ac.createBufferSource(); s.buffer = noiseBuf(2); s.loop = true;
        jetLp = ac.createBiquadFilter(); jetLp.type = 'lowpass'; jetLp.frequency.value = 700; jetLp.Q.value = 0.7;
        jetBp = ac.createBiquadFilter(); jetBp.type = 'peaking'; jetBp.frequency.value = 160; jetBp.gain.value = 10; jetBp.Q.value = 1.2;
        jetGain = ac.createGain(); jetGain.gain.value = 0;
        s.connect(jetLp).connect(jetBp).connect(jetGain).connect(ac.destination); s.start();
      } catch { ac = null; }
    }
    const wake = () => { initAudio(); if (ac && ac.state !== 'running') ac.resume().catch(() => {}); };
    for (const ev of ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown']) addEventListener(ev, wake, { capture: true });
    const ok = () => soundOn && ac;
    let jetVol = -1;
    function setJet(v) {
      if (!ac) return;
      v = soundOn ? v : 0;
      if (Math.abs(v - jetVol) < 0.01) return;
      jetVol = v;
      jetGain.gain.setTargetAtTime(v * 0.55, ac.currentTime, 0.06);
      jetLp.frequency.setTargetAtTime(500 + v * 1600, ac.currentTime, 0.08);
    }
    function tone(type, f0, f1, dur, vol, delay = 0, dest) {
      if (!ok()) return;
      const now = ac.currentTime + delay;
      const o = ac.createOscillator(); o.type = type;
      o.frequency.setValueAtTime(f0, now); o.frequency.exponentialRampToValueAtTime(f1, now + dur);
      const g = ac.createGain(); g.gain.setValueAtTime(0.0001, now); g.gain.linearRampToValueAtTime(vol, now + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      o.connect(g).connect(dest || ac.destination); o.start(now); o.stop(now + dur + 0.02);
    }
    function noise(dur, type, f0, f1, q, vol, delay = 0) {
      if (!ok()) return;
      const now = ac.currentTime + delay;
      const s = ac.createBufferSource(); s.buffer = noiseBuf(dur);
      const f = ac.createBiquadFilter(); f.type = type; f.Q.value = q;
      f.frequency.setValueAtTime(f0, now); f.frequency.exponentialRampToValueAtTime(f1, now + dur);
      const g = ac.createGain(); g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      s.connect(f).connect(g).connect(ac.destination); s.start(now);
    }
    // 点火の「ボッ」
    function igniteSnd() { noise(0.45, 'lowpass', 2600, 200, 1, 0.7); tone('sine', 110, 45, 0.35, 0.4); }
    // クリームに刺さる「ズボッ」
    function stickSnd(k) {
      noise(0.3, 'lowpass', 1400, 120, 2, 0.5 + 0.4 * k);
      noise(0.12, 'bandpass', 700, 350, 3, 0.4 * k, 0.02);
      tone('sine', 150, 55, 0.25, 0.35 + 0.2 * k);
    }
    // ぶつかる「コン」: 短いノイズを硬い共鳴に通す＋低い胴鳴り
    let lastKnock = 0;
    function knock(k, hard) {
      if (!ok()) return;
      const now = ac.currentTime;
      if (now - lastKnock < 0.06) return;
      lastKnock = now;
      const len = 0.12;
      const buf = ac.createBuffer(1, Math.floor(ac.sampleRate * len), ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ac.sampleRate * (hard ? 0.006 : 0.012)));
      const s = ac.createBufferSource(); s.buffer = buf;
      const modes = hard ? [[2400, 20, 1.0], [5100, 24, 0.5], [1300, 10, 0.4]] : [[900, 10, 1.0], [2100, 14, 0.5], [480, 6, 0.7]];
      for (const [f, q, g0] of modes) {
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f * (0.93 + Math.random() * 0.14); bp.Q.value = q;
        const g = ac.createGain(); g.gain.value = g0 * k * 1.4; s.connect(bp).connect(g).connect(ac.destination);
      }
      s.start(now);
      if (!hard) tone('sine', 140, 70, 0.16, 0.25 * k);
    }
    // 声: 声帯の振動（のこぎり波＋ゆらぎ）を、母音ごとの共鳴（フォルマント）に通す
    const VOWEL = { a: [800, 1200, 2600], i: [300, 2300, 3000], u: [350, 1250, 2500], e: [500, 1900, 2600], o: [500, 850, 2500], h: [700, 1300, 2600] };
    function voice(f0, seq, dur, vol, { rise = 1.3, fall = 0.7, shake = 0.04, breath = 0.15, vib = 6, delay = 0 } = {}) {
      if (!ok()) return;
      const now = ac.currentTime + delay;
      const o = ac.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(f0 * rise, now);
      o.frequency.linearRampToValueAtTime(f0 * rise * 1.08, now + dur * 0.2);
      o.frequency.exponentialRampToValueAtTime(f0 * fall, now + dur);
      const v = ac.createOscillator(); v.frequency.value = vib + Math.random() * 2;
      const vg = ac.createGain(); vg.gain.value = f0 * shake; v.connect(vg).connect(o.frequency);
      const ns = ac.createBufferSource(); ns.buffer = noiseBuf(dur);
      const ng = ac.createGain(); ng.gain.value = breath;
      const og = ac.createGain(); og.gain.value = 1 - Math.min(0.9, breath);
      const src = ac.createGain();
      o.connect(og).connect(src); ns.connect(ng).connect(src);
      const out = ac.createGain();
      out.gain.setValueAtTime(0, now);
      out.gain.linearRampToValueAtTime(vol, now + Math.min(0.06, dur * 0.2));
      out.gain.setValueAtTime(vol, now + dur * 0.55);
      out.gain.exponentialRampToValueAtTime(0.001, now + dur);
      [1, 0.6, 0.25].forEach((amp, fi) => {
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = fi === 0 ? 6 : 9;
        seq.forEach((s, si) => { const tt = now + dur * si / Math.max(1, seq.length - 1) * 0.85; bp.frequency[si ? 'linearRampToValueAtTime' : 'setValueAtTime'](VOWEL[s][fi], tt); });
        const g = ac.createGain(); g.gain.value = amp * 3;
        src.connect(bp).connect(g).connect(out);
      });
      out.connect(ac.destination);
      o.start(now); v.start(now); ns.start(now);
      o.stop(now + dur); v.stop(now + dur); ns.stop(now + dur);
    }
    const pick = a => a[Math.floor(Math.random() * a.length)];
    const rnd = (a, b) => a + Math.random() * (b - a);
    // 猫の声（「ミャー」= い→あ→う）
    function catVoice(kind) {
      const f0 = rnd(560, 680);
      if (kind === 'happy') {
        voice(f0 * 1.1, pick([['i', 'a', 'u'], ['i', 'a', 'a']]), rnd(0.28, 0.36), 0.42, { rise: 0.9, fall: 1.15, breath: 0.12, vib: 7 });
        voice(f0 * 1.25, pick([['i', 'a', 'u'], ['e', 'a', 'u']]), rnd(0.4, 0.5), 0.42, { rise: 0.95, fall: 1.2, breath: 0.12, vib: 7, delay: 0.42 });
      } else if (kind === 'sad') {
        voice(f0 * 0.85, pick([['i', 'a', 'a', 'u', 'u'], ['e', 'a', 'o', 'u']]), rnd(1.0, 1.3), 0.45, { rise: 1.15, fall: 0.62, shake: 0.05, breath: 0.2, vib: 5 });
      } else { // ぶつけられて怒る: 低いうなり＋シャーッ
        voice(f0 * 0.3, ['u', 'o', 'u'], 0.6, 0.5, { rise: 1, fall: 0.95, shake: 0.12, breath: 0.35, vib: 22 });
        noise(0.55, 'highpass', 3000, 2600, 0.7, 0.35, 0.55);
        voice(f0 * 1.3, ['e', 'a', 'a'], 0.35, 0.45, { rise: 1.25, fall: 0.8, breath: 0.25, delay: 1.1 });
      }
    }
    // 成功したら、オルゴールの「ハッピーバースデー」
    function stopSong() { if (songBus) { try { songBus.disconnect(); } catch {} songBus = null; } }
    function playSong() {
      if (!ok()) return;
      stopSong();
      songBus = ac.createGain(); songBus.gain.value = 0.5; songBus.connect(ac.destination);
      const N = n => 440 * Math.pow(2, n / 12); // A4 から何半音
      const G4 = N(-2), A4 = N(0), B4 = N(2), C5 = N(3), D5 = N(5), E5 = N(7), F5 = N(8), G5 = N(10);
      const notes = [[G4, .75], [G4, .25], [A4, 1], [G4, 1], [C5, 1], [B4, 2], [G4, .75], [G4, .25], [A4, 1], [G4, 1], [D5, 1], [C5, 2],
        [G4, .75], [G4, .25], [G5, 1], [E5, 1], [C5, 1], [B4, 1], [A4, 2], [F5, .75], [F5, .25], [E5, 1], [C5, 1], [D5, 1], [C5, 3]];
      let tt = 0.9;
      const beat = 0.36;
      for (const [f, b] of notes) {
        tone('sine', f, f * 0.999, 1.4, 0.22, tt, songBus);
        tone('sine', f * 4.01, f * 4, 0.3, 0.05, tt, songBus);
        tone('triangle', f * 2, f * 2, 0.5, 0.04, tt, songBus);
        tt += b * beat;
      }
    }

    // ---------- 3D ----------
    const stage = document.getElementById('stage');
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(2, devicePixelRatio));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    stage.prepend(renderer.domElement);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(55, 1, 0.05, 120);
    const fitCam = new THREE.PerspectiveCamera(50, 1, 0.05, 120);
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.background = new THREE.Color('#3a2820');
    scene.fog = new THREE.Fog('#3a2820', 22, 48);

    const hemi = new THREE.HemisphereLight('#a8bce8', '#6b4a35', 0.9);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight('#ffd9a8', 2.6);
    sun.position.set(3, 15, 5); sun.target.position.set(0, 0, -1.5);
    sun.castShadow = true;

        const up = V(Math.sin(tiltR), Math.cos(tiltR), 0), zA = V(0, 0, -1), xA = V().crossVectors(up, zA);
        const q = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(xA, up, zA));
        body.position.set(CAKE.x + x, CAKE.top + h, CAKE.z + z); body.quaternion.set(q.x, q.y, q.z, q.w);
        body.velocity.set(0, -6, 0); curPos.copy(toT(body.position)); prevPos.copy(curPos); curQ.copy(q); prevQ.copy(q);
      },
      camera, scene, cakeG, look(px, py, pz, lx, ly, lz) { camera.position.set(px, py, pz); camera.up.set(0, 1, 0); camera.lookAt(lx, ly, lz); camera.updateMatrixWorld(); renderer.render(scene, camera); },
      steer(kx, ky) { steer.on = true; steer.kx = kx; steer.ky = ky; }, release() { steer.on = false; },
    };
    resize();
    start();
    applyLang();
    for (let i = 0; i < 4; i++) step(STEP);
    renderer.compile(scene, camera); render(0, 0.016);
    requestAnimationFrame(t0 => { last = t0; loop(t0); });
  </script>
</body>
