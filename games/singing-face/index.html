  };
  const autoLang = () => { for (const l of navigator.languages?.length ? navigator.languages : [navigator.language || '']) { const c = l.toLowerCase().slice(0, 2); if (DICT[c]) return c; } return 'en'; };
  let lang = DICT[store.get('lang', '')] ? store.get('lang', '') : autoLang();
  const t = k => DICT[lang][k];
  const $ = id => document.getElementById(id);
  const coarse = matchMedia('(pointer: coarse)').matches;

  // ---------- 歌声（Web Audio で合成） ----------
  let soundOn = store.get('sound', true), actx = null, V = null, pitch = store.get('pitch', 0);
  const FORM = { a: [800, 1250, 2700], i: [300, 2300, 3000], u: [350, 1350, 2500], e: [500, 1900, 2650], o: [520, 900, 2500] };
  const OPEN = { a: 1, o: 0.8, e: 0.65, u: 0.45, i: 0.4 };
  function ensureAudio() {

    const s = actx.createBufferSource(); s.buffer = actx.createBuffer(1, 1, 22050);
    const z = actx.createGain(); z.gain.value = 0; s.connect(z); z.connect(actx.destination); s.start();
    const master = actx.createGain(); master.gain.value = soundOn ? 0.9 : 0;
    const comp = actx.createDynamicsCompressor(); master.connect(comp); comp.connect(actx.destination);
    // ステージの響き（作った残響）
    const rv = actx.createConvolver(), len = actx.sampleRate * 1.6, ir = actx.createBuffer(2, len, actx.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }

    vib.connect(vibG); vibG.connect(osc.detune);
    const nb = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate), nd = nb.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    const ns = actx.createBufferSource(); ns.buffer = nb; ns.loop = true;
    const breath = actx.createGain(); breath.gain.value = 0.015; ns.connect(breath);
    const src = actx.createGain(); osc.connect(src); breath.connect(src);
    const amp = actx.createGain(); amp.gain.value = 0;
    const F = [0, 1, 2].map(i => {
      const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = [6, 9, 12][i]; f.frequency.value = FORM.a[i];
      const g = actx.createGain(); g.gain.value = [1.8, 1.1, 0.55][i]; src.connect(f); f.connect(g); g.connect(amp); return f;
    });

    osc.start(); vib.start(); ns.start();
    V = { master, osc, vibG, amp, F, nb };
  }
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  let notes = [];        // 口の動き用 { t0, t1, v }
  function singNote(t, dur, m, v, c, tie, noVib) {
    const A = 0.24, f = mtof(m + pitch), fm = Math.pow(2, pitch / 12 * 0.35);
    V.osc.frequency.setTargetAtTime(f * 0.97, t, 0.004);
    V.osc.frequency.setTargetAtTime(f, t + 0.02, 0.03);
    FORM[v].forEach((hz, i) => V.F[i].frequency.setTargetAtTime(hz * fm, t, 0.015));
    let start = t;
    if (c === 'r' || c === 'n' || c === 'm') {

  function hush() {
    if (!V) return;
    const now = actx.currentTime;
    [V.amp.gain, V.vibG.gain, V.osc.frequency, ...V.F.map(f => f.frequency)].forEach(p => p.cancelScheduledValues(now));
    V.amp.gain.setTargetAtTime(0, now, 0.03);

  }
  const VOW = ['a', 'a', 'a', 'o', 'o', 'u', 'e', 'i'], CON = ['r', 'r', 'n', 'm', 'r', 'n', ''];   // 息の音（さ・か・は）はノイズに聞こえるので使わない
  const pick = a => a[Math.floor(Math.random() * a.length)];

  // 曲（メロディは古い童謡など）: [音の高さ（MIDI） or null（休み）, 拍]
  const C4 = 60, D4 = 62, E4 = 64, F4 = 65, G4 = 67, A4 = 69, B4 = 71, C5 = 72, G3 = 55, A3 = 57, B3 = 59;
  const SONGS = [
    { bpm: 104, n: [[C4,1],[C4,1],[G4,1],[G4,1],[A4,1],[A4,1],[G4,2],[F4,1],[F4,1],[E4,1],[E4,1],[D4,1],[D4,1],[C4,2],[null,.5],
      [G4,1],[G4,1],[F4,1],[F4,1],[E4,1],[E4,1],[D4,2],[G4,1],[G4,1],[F4,1],[F4,1],[E4,1],[E4,1],[D4,2],[null,.5],
      [C4,1],[C4,1],[G4,1],[G4,1],[A4,1],[A4,1],[G4,2],[F4,1],[F4,1],[E4,1],[E4,1],[D4,1],[D4,1],[C4,3]] },
    { bpm: 120, n: [[C4,1],[D4,1],[E4,1],[F4,1],[E4,1],[D4,1],[C4,2],[E4,1],[F4,1],[G4,1],[A4,1],[G4,1],[F4,1],[E4,2],
      [C4,2],[C4,2],[C4,2],[C4,2],[C4,.5],[C4,.5],[D4,.5],[D4,.5],[E4,.5],[E4,.5],[F4,.5],[F4,.5],[E4,1],[D4,1],[C4,3]] },
    { bpm: 112, n: [[G4,1.5],[A4,.5],[G4,1],[F4,1],[E4,1],[F4,1],[G4,2],[D4,1],[E4,1],[F4,2],[E4,1],[F4,1],[G4,2],
      [G4,1.5],[A4,.5],[G4,1],[F4,1],[E4,1],[F4,1],[G4,2],[D4,2],[G4,2],[E4,1],[C4,3]] },
    { bpm: 100, n: [[G3,.75],[G3,.25],[A3,1],[G3,1],[C4,1],[B3,2],[G3,.75],[G3,.25],[A3,1],[G3,1],[D4,1],[C4,2],

  let playing = -1, songTimer = 0;
  function markSongs() { document.querySelectorAll('.song').forEach(b => b.classList.toggle('on', +b.dataset.s === playing)); }

  function playSong(i) {
    ensureAudio(); keyUp();
    const again = playing === i; stopSong(); if (again) return;
    playing = i; markSongs();
    const S = SONGS[i], beat = 60 / S.bpm; let t = actx.currentTime + 0.12, prevRest = true;
    S.n.forEach(([m, b], k) => {

  function phrase() {
    ensureAudio(); stopSong(); keyUp();

    for (let k = 0; k < n; k++) { const d = k === n - 1 ? 0.6 : 0.2 + Math.random() * 0.12; singNote(t, d, pick(sc), pick(VOW), k ? pick(CON) : 'r', k < n - 1); t += d; }
  }
  // 鍵盤: 押している間のばす。指を滑らせると音がつながる
  let keyNote = null;

    ensureAudio(); stopSong();

    if (keyNote) {
      if (keyNote.m === m) return;

    if (actx.state !== 'running') {
      const kn = keyNote;
      actx.resume().then(() => { if (keyNote === kn) { keyNote = null; keyDown(kn.m); } }).catch(() => {});
    }
  }
  // 鍵盤を押したまま指を揺らすとビブラート（音の高さを少し上下させる）
  function bend(cents) { if (V) V.osc.detune.setTargetAtTime(cents, actx.currentTime, 0.012); }
  function keyUp() {
    bend(0);
    if (!keyNote) return;

    V.amp.gain.cancelScheduledValues(now); V.amp.gain.setTargetAtTime(0, now, 0.05); V.vibG.gain.setTargetAtTime(0, now, 0.05);
    keyNote.n.t1 = now; keyNote = null;
    document.querySelectorAll('#kb .on').forEach(k => k.classList.remove('on'));
  }
  function mouthLevel() {
    if (!actx) return 0;
    const now = actx.currentTime; let o = 0;
    notes = notes.filter(n => n.t1 + 0.3 > now);
    for (const n of notes) {
      if (now < n.t0 || now > n.t1 + 0.09) continue;
      const env = Math.min(1, (now - n.t0) / 0.05) * (now > n.t1 ? 1 - (now - n.t1) / 0.09 : 1);

  // ---------- 顔（切り抜き画像＋口） ----------
  let face = null;      // { spr, mouth: [[x,y]...], mi }
  function mouthInfo(spr, pts) {
    if (!pts || pts.length < 3) return null;
    let x0 = Infinity, x1 = -Infinity;
    pts.forEach(p => { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); });

    let maxTh = 0, ys = 0;

      const cx = x + st / 2; let yT = Infinity, yB = -Infinity;

    e.preventDefault();
    const mx = e.clientX, my = e.clientY, k = Math.max(view.fit, Math.min(view.fit * 12, view.k * Math.exp(-e.deltaY * 0.0015)));
    view.x = mx - (mx - view.x) / view.k * k; view.y = my - (my - view.y) / view.k * k; view.k = k; snapFit();
  }, { passive: false });

  $('pick').onclick = () => $('file').click();
  $('file').onchange = e => { loadFile(e.target.files[0]); e.target.value = ''; };
  $('brush').onclick = () => { brushIdx = (brushIdx + 1) % BRUSH.length; $('bdot').style.width = $('bdot').style.height = [5, 11, 20][brushIdx] + 'px'; };
  $('erase').onclick = () => { erasing = !erasing; $('erase').classList.toggle('on', erasing); };
  $('undo').onclick = () => { const d = undoStack.pop(); if (d) { mctx.putImageData(d, 0, 0); updateDone(); } };
  $('cancel1').onclick = $('cancel2').onclick = () => { img = null; draft = null; setMode('stage'); };
  $('done').onclick = () => { draft = makeSprite(); if (!draft) return; draftMouth = null; tracing = null; $('done2').disabled = true; setMode('mouth'); };
  $('retry').onclick = () => { draftMouth = null; $('done2').disabled = true; };
  $('done2').onclick = () => {
    if (!draftMouth) return;
    setFace(draft, draftMouth.map(p => [Math.round(p[0] * 10) / 10, Math.round(p[1] * 10) / 10]));
    store.set('face', { img: draft.toDataURL('image/png'), mouth: face.mouth });
    img = null; draft = null; setMode('stage');
  };
  document.querySelectorAll('.song').forEach(b => b.onclick = () => playSong(+b.dataset.s));
  $('pitchIn').value = pitch;
  $('pitchIn').oninput = e => { pitch = +e.target.value; store.set('pitch', pitch); };

  // 鍵盤（C4〜C5）
  const kb = $('kb'), WHITE = [60, 62, 64, 65, 67, 69, 71, 72], BLACK = [[61, 1], [63, 2], [66, 4], [68, 5], [70, 6]];
  WHITE.forEach((m, i) => { const k = document.createElement('div'); k.className = 'wk'; k.dataset.m = m; k.style.left = (i / 8 * 100) + '%'; k.style.width = (100 / 8) + '%'; kb.appendChild(k); });
  BLACK.forEach(([m, i]) => { const k = document.createElement('div'); k.className = 'bk'; k.dataset.m = m; k.style.left = (i / 8 * 100 - 3.2) + '%'; k.style.width = '6.4%'; kb.appendChild(k); });
  let kbPtr = null;
  function keyAt(x, y) { const el = document.elementFromPoint(x, y); return el && el.dataset && el.dataset.m && kb.contains(el) ? el : null; }
  function pressEl(el) {
    if (!el) return;
    kb.querySelectorAll('.on').forEach(k => k !== el && k.classList.remove('on'));
    el.classList.add('on'); keyDown(+el.dataset.m);
  }
  // 長押しの拡大鏡・選択・メニューを出さない
  [kb, cv].forEach(el => {
    el.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
    el.addEventListener('contextmenu', e => e.preventDefault());
  });
  // 指を離した時にも音の準備をする（iPhone はここでしか許可されないことがある）
  ['touchend', 'pointerup', 'click', 'keydown'].forEach(ev => addEventListener(ev, () => ensureAudio(), true));
  let anchor = 0;
  const keyW = () => kb.getBoundingClientRect().width / 8;
  kb.addEventListener('pointerdown', e => { e.preventDefault(); kbPtr = e.pointerId; kb.setPointerCapture(e.pointerId); anchor = e.clientX; bend(0); pressEl(keyAt(e.clientX, e.clientY)); });
  kb.addEventListener('pointermove', e => {
    if (e.pointerId !== kbPtr) return;
    const dx = e.clientX - anchor, w = keyW(), el = keyAt(e.clientX, e.clientY);
    // 小さな揺れはビブラート、大きく動かしたら隣の鍵盤へ
    if (el && !el.classList.contains('on') && Math.abs(dx) > w * 0.75) { anchor = e.clientX; bend(0); pressEl(el); return; }
    bend(Math.max(-120, Math.min(120, dx / w * 160)));
  });
  // 押しているところの軌跡
  let trail = [], trailDrawn = false, lastPos = null;
  const addTrail = e => { lastPos = { x: e.clientX, y: e.clientY }; trail.push({ ...lastPos, t: performance.now() }); };
  kb.addEventListener('pointerdown', e => { trail = []; addTrail(e); });
  kb.addEventListener('pointermove', e => { if (e.pointerId === kbPtr) addTrail(e); });
  function drawTrail(now) {
    trail = trail.filter(p => now - p.t < 450);
    if (kbPtr !== null && lastPos && !trail.length) trail.push({ ...lastPos, t: now });
    if (!trail.length && !trailDrawn) return;
    fctx.setTransform(DPR, 0, 0, DPR, 0, 0); fctx.clearRect(0, 0, W, H);
    trailDrawn = trail.length > 0; if (!trailDrawn) return;
    fctx.lineCap = 'round'; fctx.lineJoin = 'round';
    for (let i = 1; i < trail.length; i++) {
      const a = trail[i - 1], b = trail[i], k = 1 - (now - b.t) / 450;
      fctx.strokeStyle = `rgba(255,90,150,${k * 0.85})`; fctx.lineWidth = 4 + k * 14;
      fctx.beginPath(); fctx.moveTo(a.x, a.y); fctx.lineTo(b.x, b.y); fctx.stroke();
    }
    if (kbPtr !== null) {
      const p = trail[trail.length - 1];
      const gr = fctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 26);
      gr.addColorStop(0, 'rgba(255,255,255,.95)'); gr.addColorStop(0.4, 'rgba(255,90,150,.7)'); gr.addColorStop(1, 'rgba(255,90,150,0)');
      fctx.fillStyle = gr; fctx.beginPath(); fctx.arc(p.x, p.y, 26, 0, Math.PI * 2); fctx.fill();
    }
  }
  const kbUp = e => { if (e.pointerId === kbPtr) { kbPtr = null; keyUp(); } };
  kb.addEventListener('pointerup', kbUp); kb.addEventListener('pointercancel', kbUp);

  // 音ボタン
  const SPK = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>';
  function drawSnd() { $('snd').innerHTML = SPK + (soundOn ? '<path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>' : '<path d="M17 9l5 6M22 9l-5 6"/>') + '</svg>'; }
  $('snd').onclick = () => { soundOn = !soundOn; store.set('sound', soundOn); drawSnd(); if (V) V.master.gain.setTargetAtTime(soundOn ? 0.9 : 0, actx.currentTime, 0.02); };

  // drag & drop
  ['dragenter', 'dragover'].forEach(ev => window.addEventListener(ev, e => { e.preventDefault(); $('drop').classList.remove('hide'); }));
  ['dragleave', 'drop'].forEach(ev => window.addEventListener(ev, e => { e.preventDefault(); $('drop').classList.add('hide'); }));
  window.addEventListener('drop', e => { const f = e.dataTransfer && e.dataTransfer.files[0]; if (f) loadFile(f); });

  // ---------- X投稿（歌っている顔の画像つき） ----------
  let shareCache = null;
  function resultImage() {
    if (!face) return null;
    const c = document.createElement('canvas'); c.width = c.height = 1080;
    const g = c.getContext('2d');
    drawScene(g, 1080, 1080, { x: 0, y: 80, w: 1080, h: 860 }, { face, lvl: 0.8, cat: 0.6, time: 0.4, parts: [
      { x: 170, y: 330, s: 70, r: -0.2, c: '#ffd36a', life: 0.8, max: 2 }, { x: 900, y: 260, s: 56, r: 0.25, c: '#ff8fb0', life: 0.8, max: 2 },
      { x: 860, y: 470, s: 44, r: 0.1, c: '#9fe0ff', life: 0.8, max: 2 } ] });
    g.textAlign = 'center'; g.fillStyle = '#fff'; g.lineJoin = 'round';
    let px = 56; g.font = `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans Thai", sans-serif`;
    g.lineWidth = 9; g.strokeStyle = '#5a0815'; g.strokeText(t('title'), 540, 1040); g.fillText(t('title'), 540, 1040);
    return c;
  }
  function prepareShare() {
    const key = lang + (face && face.spr.width) + (face && face.mouth.length);
    shareCache = { key, file: null };
    const c = resultImage(); if (!c) return;
    c.toBlob(b => { if (b && shareCache.key === key) shareCache.file = new File([b], 'singing-face.png', { type: 'image/png' }); }, 'image/png');
  }
  const post = $('post');
  if (!coarse) { post.target = '_blank'; post.rel = 'noopener'; }
  function updatePost() { post.textContent = t('post'); post.href = `https://x.com/intent/post?text=${encodeURIComponent(t('share'))}&url=${encodeURIComponent(SHARE_URL)}`; }
  post.addEventListener('click', e => {
    if (coarse && navigator.share) {
      e.preventDefault();
      const file = shareCache && shareCache.file, text = `${t('share')}\n${SHARE_URL}`;
      navigator.share(file && navigator.canShare?.({ files: [file] }) ? { files: [file], text } : { text }).catch(() => {});
      return;
    }
    const c = resultImage();
    if (c) { const d = document.createElement('a'); d.href = c.toDataURL('image/png'); d.download = 'singing-face.png'; d.click(); }
  });

  // ---------- 言語 ----------
  function applyLang() {
    document.title = t('title'); document.documentElement.lang = lang; $('lang').value = lang;
    $('back').textContent = t('back'); $('pick').textContent = t('pick'); $('erase').textContent = t('erase'); $('undo').textContent = t('undo');
    $('done').textContent = $('done2').textContent = t('done'); $('cancel1').textContent = $('cancel2').textContent = t('cancel'); $('retry').textContent = t('retry');
    updatePost(); if (face) prepareShare(); resize();
  }
  $('lang').onchange = e => { lang = e.target.value; store.set('lang', lang); applyLang(); };

  // ---------- ループ ----------
  let lastT = performance.now(), spawn = 0;
  const COLS = ['#ffd36a', '#ff8fb0', '#9fe0ff', '#b6ff9a'];
  function loop(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now; time += dt;
    const target = mouthLevel();
    lvl += (target - lvl) * (1 - Math.exp(-dt * 30));
    catLvl += (target * 0.85 - catLvl) * (1 - Math.exp(-dt * 14));
    if (mode === 'stage') {
      spawn += dt * (lvl > 0.25 ? 3.5 : 0);
      const size = faceSize(box);
      while (spawn > 1) {
        spawn--;
        const sd = Math.random() < 0.5 ? -1 : 1;
        parts.push({ x: W / 2 + sd * size * (0.42 + Math.random() * 0.15), y: box.y + box.h * 0.5, vx: sd * (10 + Math.random() * 20), vy: -40 - Math.random() * 30,
          s: 18 + Math.random() * 16, r: (Math.random() - 0.5) * 0.6, c: pick(COLS), life: 0, max: 2.2 });
      }
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i]; p.life += dt; p.x += (p.vx + Math.sin(p.life * 4) * 12) * dt; p.y += p.vy * dt;
      if (p.life > p.max) parts.splice(i, 1);
    }
    render(); drawTrail(now);
    requestAnimationFrame(loop);
  }
  addEventListener('resize', () => { resize(); });
  drawSnd(); applyLang(); setMode('stage'); render();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
