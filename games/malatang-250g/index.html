function circles(b){const c=Math.cos(b.a),s=Math.sin(b.a);return b.f.shape.map(([x,y,r])=>({x:b.x+(x*c-y*s)*b.s,y:b.y+(x*s+y*c)*b.s,r:r*b.s}))}

function contact(a,b,px,py,nx,ny,depth){const ia=a.inv,ib=b?b.inv:0;const correction=Math.max(0,depth-.12)*.65/(ia+ib);a.x-=nx*correction*ia;a.y-=ny*correction*ia;if(b){b.x+=nx*correction*ib;b.y+=ny*correction*ib}const ax=px-a.x,ay=py-a.y,bx=b?px-b.x:0,by=b?py-b.y:0;const avx=a.vx-a.av*ay,avy=a.vy+a.av*ax,bvx=b?b.vx-b.av*by:0,bvy=b?b.vy+b.av*bx:0;const rvx=bvx-avx,rvy=bvy-avy,vn=rvx*nx+rvy*ny;if(vn>=0)return;const ca=ax*ny-ay*nx,cb=bx*ny-by*nx;const den=ia+ib+ca*ca*a.I+(b?cb*cb*b.I:0);const j=-(1+(vn<-45?.18:0))*vn/den;const tx=-ny,ty=nx,ta=ax*ty-ay*tx,tb=bx*ty-by*tx;const jt=Math.max(-j*.45,Math.min(j*.45,-(rvx*tx+rvy*ty)/(ia+ib+ta*ta*a.I+(b?tb*tb*b.I:0))));const ix=j*nx+jt*tx,iy=j*ny+jt*ty;a.vx-=ix*ia;a.vy-=iy*ia;a.av-=(ax*iy-ay*ix)*a.I;if(b){b.vx+=ix*ib;b.vy+=iy*ib;b.av+=(bx*iy-by*ix)*b.I}}
