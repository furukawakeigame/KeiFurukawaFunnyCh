<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>日の丸職人</title>
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <!-- X などにURLを貼ったときのカード表示（ここだけは https:// から書く） -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ふるかわけい面白チャンネル">
  <meta property="og:title" content="日の丸職人">
  <meta property="og:url" content="https://keifurukawafunnych.com/games/hinomaru/">
  <meta property="og:image" content="https://keifurukawafunnych.com/games/hinomaru/icon.png">
  <meta name="twitter:card" content="summary">
  <style>
    html, body { margin: 0; height: 100%; background: #e9e4dc; color: #333; }
    body {
      display: flex; flex-direction: column; height: 100dvh;
      font-family: "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
      overflow: hidden; touch-action: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      padding-bottom: calc(80px + env(safe-area-inset-bottom)); box-sizing: border-box;
    }
    header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; }
    header a { color: #333; text-decoration: none; font-size: 14px; }
    .hbtns { display: flex; gap: 8px; }
    .pill {
      height: 36px; min-width: 36px; border: 1px solid #bbb; border-radius: 18px; background: #fff;
      color: #333; font-size: 15px; padding: 0 10px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    #stage { flex: 1; position: relative; min-height: 0; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #result {
      position: fixed; left: 0; right: 0; bottom: 0; display: none; flex-direction: column; align-items: center; gap: 10px;
      padding: 16px 16px calc(96px + env(safe-area-inset-bottom)); background: rgba(255,255,255,.95);
      box-shadow: 0 -2px 12px rgba(0,0,0,.12); text-align: center;
    }
    #result.show { display: flex; }
    #score { font-size: 34px; font-weight: bold; color: #bc002d; }
    #gap { font-size: 15px; }
    #comment { font-size: 18px; font-weight: bold; }
    .btns { display: flex; gap: 10px; }
    .btn {
      font-size: 16px; padding: 10px 20px; border-radius: 24px; border: none; cursor: pointer;
      background: #bc002d; color: #fff; text-decoration: none; font-family: inherit;
    }
    .btn.x { background: #111; }
    #ctrl { display: flex; align-items: center; gap: 10px; padding: 8px 16px; max-width: 520px; width: 100%; margin: 0 auto; box-sizing: border-box; }
    #ctrl.hide { visibility: hidden; }
    #size { flex: 1; min-width: 0; height: 32px; accent-color: #bc002d; touch-action: manipulation; }
  </style>
</head>
<body>
  <header>
    <a id="back" href="../../">← トップへ戻る</a>
    <div class="hbtns">
      <button id="lang" class="pill">EN</button>
      <button id="sound" class="pill" aria-label="音のオン/オフ"></button>
    </div>
  </header>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="ctrl">
    <svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="4" fill="#bc002d"/></svg>
    <input id="size" type="range" step="1">
    <svg width="26" height="26" viewBox="0 0 26 26"><circle cx="13" cy="13" r="12" fill="#bc002d"/></svg>
    <button id="stick" class="btn"></button>
  </div>
  <div id="result">
    <div id="score"></div>
    <div id="gap"></div>
    <div id="comment"></div>
    <div class="btns">
      <button id="again" class="btn"></button>
      <a id="post" class="btn x" href="#"></a>
    </div>
  </div>
  <script>
    const store = {
      get(k, d) { try { const v = localStorage.getItem('hinomaru-' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
      set(k, v) { try { localStorage.setItem('hinomaru-' + k, JSON.stringify(v)); } catch {} },
    };
    const SHARE_URL = 'https://keifurukawafunnych.com/games/hinomaru/';

    // ---- 文言 ----
    const L = {
      ja: {
        title: '日の丸職人', back: '← トップへ戻る', lang: 'EN', langLabel: 'Switch to English', sound: '音のオン/オフ',
        again: 'もう一度', post: 'Xにポスト',
        stick: '貼る', sizeLabel: '丸の大きさ',
        score: s => `${s}点`, gap: (mm, sz) => `位置 ${mm}mm・大きさ ${sz}mm ずれ`, out: '旗の外',
        c: ['国旗検査官もうなる', '合格', '少し日が傾いている', '日没', 'それはもう国旗ではない'],
        is: n => `それは${n}`, palau: 'パラオ', laos: 'ラオス', niger: 'ニジェール',
        share: r => '日の丸職人：' + (r.out ? '日の丸を旗の外に貼りました' : r.country ? `${L.ja[r.country]}の国旗ができました` : `位置${r.mm}mm・大きさ${r.sz}mmずれ（${r.score}点）`),
      },
      en: {
        title: 'Rising Sun Craftsman', back: '← Top', lang: '日本語', langLabel: '日本語に切り替え', sound: 'Sound on/off',
        again: 'Again', post: 'Post on X',
        stick: 'Stick', sizeLabel: 'Circle size',
        score: s => `${s} pts`, gap: (mm, sz) => `Position ${mm}mm, size ${sz}mm off`, out: 'Off the flag',
        c: ['The flag inspector is impressed', 'Approved', 'The sun is tilting a bit', 'Sunset', 'That is no longer a flag'],
        is: n => `That is ${n}`, palau: 'Palau', laos: 'Laos', niger: 'Niger',
        share: r => 'Rising Sun Craftsman: ' + (r.out ? 'I stuck the sun outside the flag' : r.country ? `I made the flag of ${L.en[r.country]}` : `position ${r.mm}mm, size ${r.sz}mm off (${r.score} pts)`),
      },
    };
    let lang = store.get('lang', (navigator.language || '').startsWith('ja') ? 'ja' : 'en');
    if (!L[lang]) lang = 'ja';
    const t = k => L[lang][k];
    const $ = id => document.getElementById(id);

    // ---- 音 ----
    let soundOn = store.get('sound', true);
    const SPK = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#333"/>';
    const updateSoundBtn = () => {
      $('sound').innerHTML = SPK + (soundOn ? '<path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>' : '<path d="M16 9l5 6M21 9l-5 6"/></svg>');
    };
    $('sound').onclick = () => { soundOn = !soundOn; store.set('sound', soundOn); updateSoundBtn(); };
    let ac;
    function pita() {
      if (!soundOn) return;
      try {
        ac = ac || new (window.AudioContext || window.webkitAudioContext)();
        const o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime;
        o.type = 'triangle'; o.frequency.setValueAtTime(520, n); o.frequency.exponentialRampToValueAtTime(120, n + 0.12);
        g.gain.setValueAtTime(0.4, n); g.gain.exponentialRampToValueAtTime(0.001, n + 0.15);
        o.connect(g).connect(ac.destination); o.start(n); o.stop(n + 0.16);
      } catch {}
    }

    // ---- 盤面 ----
    // 旗は横 900mm × 縦 600mm（3:2）。日本の丸は直径 360mm（縦の 3/5）。
    // 丸の位置と大きさは mm で持ち、描くときに画面の大きさへ直す。
    const cv = $('cv'), ctx = cv.getContext('2d');
    const FW = 900, FH = 600, JP = 360, DMIN = 100, DMAX = 540;
    let W, H, dpr, flag, k, disc, state = 'ready', drag = null, result = null;
    const LIFT = 40; // タッチのドラッグ中、丸を指より少し上に出す（px）
    const size = $('size');
    size.min = DMIN; size.max = DMAX;

    function newDisc() {
      const d = Math.round(200 + Math.random() * 300);
      disc = { x: 0, y: 0, d }; size.value = d;
    }
    // 旗の中心からの mm ⇔ 画面の px
    const sx = x => flag.x + flag.w / 2 + x * k, sy = y => flag.y + flag.h / 2 + y * k;

    function layout() {
      dpr = devicePixelRatio || 1;
      const r = cv.getBoundingClientRect(); W = r.width; H = r.height;
      cv.width = W * dpr; cv.height = H * dpr;
      const fw = Math.max(60, Math.min(W - 32, H * 0.55 * 1.5, 600)), fh = fw / 1.5;
      flag = { x: (W - fw) / 2, y: Math.max(12, H * 0.06), w: fw, h: fh };
      k = fw / FW;
      if (state === 'ready' && !disc.placed) { // 最初は旗の下に置いておく
        disc.x = 0;
        disc.y = Math.min((H - flag.y - fh / 2 - DMAX / 2 * k - 8) / k, FH / 2 + DMAX / 2 + 20);
      }
      draw();
    }

    const STYLE = {
      jp: { bg: [['#fff', 1]], disc: '#bc002d' },
      palau: { bg: [['#4aadd6', 1]], disc: '#ffde00' },
      laos: { bg: [['#ce1126', .25], ['#002868', .5], ['#ce1126', .25]], disc: '#fff' },
      niger: { bg: [['#e05206', 1 / 3], ['#fff', 1 / 3], ['#0db02b', 1 / 3]], disc: '#e05206' },
    };
    function draw() {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);
      const f = flag, st = STYLE[(state === 'done' && result.country) || 'jp'];
      ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.fillRect(f.x + 3, f.y + 4, f.w, f.h);
      let y = f.y;
      for (const [c, h] of st.bg) { ctx.fillStyle = c; ctx.fillRect(f.x, y, f.w, f.h * h + 1); y += f.h * h; }
      ctx.strokeStyle = '#ccc'; ctx.lineWidth = 1; ctx.strokeRect(f.x + .5, f.y + .5, f.w - 1, f.h - 1);
      ctx.fillStyle = st.disc;
      ctx.beginPath(); ctx.arc(sx(disc.x), sy(disc.y), disc.d / 2 * k, 0, Math.PI * 2); ctx.fill();
      if (state === 'done' && !result.country) { // 正解の位置と大きさ
        ctx.setLineDash([6, 5]); ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(sx(0), sy(0), JP / 2 * k, 0, Math.PI * 2); ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    function pos(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
    cv.addEventListener('pointerdown', e => {
      if (state !== 'ready') return;
      const p = pos(e);
      if (Math.hypot(p.x - sx(disc.x), p.y - sy(disc.y)) > disc.d / 2 * k + 20) return;
      cv.setPointerCapture(e.pointerId);
      drag = { dx: sx(disc.x) - p.x, dy: sy(disc.y) - p.y - (e.pointerType === 'mouse' ? 0 : LIFT) };
      state = 'drag';
    });
    cv.addEventListener('pointermove', e => {
      if (state !== 'drag') return;
      const p = pos(e);
      disc.x = (p.x + drag.dx - flag.x - flag.w / 2) / k;
      disc.y = (p.y + drag.dy - flag.y - flag.h / 2) / k;
      draw();
    });
    const drop = () => { if (state === 'drag') { state = 'ready'; disc.placed = true; draw(); } };
    cv.addEventListener('pointerup', drop);
    cv.addEventListener('pointercancel', drop);
    size.addEventListener('input', () => { disc.d = +size.value; draw(); });

    // 中心から近く、丸の大きさが合っていれば別の国旗になる
    function judge() {
      const { x, y, d } = disc;
      if (Math.abs(x) > FW / 2 || Math.abs(y) > FH / 2) return { out: true, score: 0 };
      const mm = Math.round(Math.hypot(x, y)), sz = Math.round(Math.abs(d - JP));
      const score = Math.max(0, Math.round(100 - (mm + sz) * 0.8));
      const center = mm <= 25;
      const country =
        center && Math.abs(d - 150) <= 30 ? 'niger' :
        center && Math.abs(d - 240) <= 30 ? 'laos' :
        x <= -30 && x >= -110 && Math.abs(y) <= 20 && Math.abs(d - JP) <= 40 ? 'palau' : null; // パラオは丸が左寄り
      return { mm, sz, score, country };
    }
    $('stick').onclick = () => {
      if (state !== 'ready') return;
      state = 'done'; pita();
      result = judge();
      $('ctrl').classList.add('hide');
      draw(); showResult();
    };

    function showResult() {
      if (!result) return;
      const { out, mm, sz, score, country } = result, c = t('c');
      $('score').textContent = t('score')(score);
      $('gap').textContent = out ? t('out') : t('gap')(mm, sz);
      const e = mm + sz;
      $('comment').textContent = out ? c[4] : country ? t('is')(t(country)) : e <= 4 ? c[0] : e <= 20 ? c[1] : e <= 60 ? c[2] : c[3];
      const post = $('post');
      post.href = `https://x.com/intent/post?text=${encodeURIComponent(t('share')(result))}&url=${encodeURIComponent(SHARE_URL)}`;
      if (matchMedia('(pointer: coarse)').matches) { post.removeAttribute('target'); post.removeAttribute('rel'); }
      else { post.target = '_blank'; post.rel = 'noopener'; }
      $('result').classList.add('show');
    }

    $('again').onclick = () => {
      state = 'ready'; result = null; newDisc();
      $('result').classList.remove('show'); $('ctrl').classList.remove('hide'); layout();
    };

    function applyLang() {
      document.documentElement.lang = lang;
      document.title = t('title');
      $('back').textContent = t('back');
      $('lang').textContent = t('lang'); $('lang').setAttribute('aria-label', t('langLabel'));
      $('sound').setAttribute('aria-label', t('sound'));
      $('again').textContent = t('again'); $('stick').textContent = t('stick'); size.setAttribute('aria-label', t('sizeLabel')); $('post').textContent = t('post');
      if (state === 'done') showResult();
    }
    $('lang').onclick = () => { lang = lang === 'ja' ? 'en' : 'ja'; store.set('lang', lang); applyLang(); };

    addEventListener('resize', layout);
    newDisc(); updateSoundBtn(); applyLang(); layout();
  </script>
</body>
</html>
