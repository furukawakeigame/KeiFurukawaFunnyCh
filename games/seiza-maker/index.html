      const text = (str, y, px, max) => {
        g.font = font(px); const w = g.measureText(str).width; if (w > max) { px *= max / w; g.font = font(px); }
        g.shadowColor = 'rgba(150,190,255,.9)'; g.shadowBlur = px * 0.35; g.fillText(str, 540, y); g.shadowBlur = 0; g.fillText(str, 540, y);
      };
      if (curName()) text(curName(), 150, 100, 960);
      text(t('title'), 1040, 46, 900);
      return c;
    }
    // 共有用ファイルは言語ごとに先に作っておく（クリック時に待つと Safari で共有が止まるため）
    function prepareShare() {
      if (!snap) return;
      const key = lang + '|' + curName();
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'seiza-maker.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang + '|' + curName() ? shareCache.file : null;

    // ---------- ループ ----------
    let last = performance.now(), time = 0;
    const ease = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
      if (tween) {
        tween.t += dt / tween.dur; const k = ease(Math.min(1, tween.t));
        camYaw = tween.y0 + (tween.y1 - tween.y0) * k; camPitch = tween.p0 + (tween.p1 - tween.p0) * k; zoom = tween.z0 + (tween.z1 - tween.z0) * k;
        applyCamera();
        if (tween.t >= 1) { const f = tween.after; tween = null; f?.(); }
      } else if (!drag && (Math.abs(vel.x) + Math.abs(vel.y) > 0.001)) {
        camYaw += vel.x * dt; camPitch += vel.y * dt;
        const f = Math.exp(-dt * 5); vel.x *= f; vel.y *= f; applyCamera();
      }
      for (const m of [starMat, marks.material, sparks.material, flies.material]) m.uniforms.uTime.value = time;
      // 完成した星座の絵をふわっと出す
      for (const d of done) if (d.fade < 1) {
        d.fade = Math.min(1, d.fade + dt / 2.2);
        d.fig.mat.uniforms.uOpacity.value = ease(d.fade);
        d.mat.uniforms.uOpacity.value = 1.6 - 0.8 * ease(d.fade);
      }
      if (catFade < catTarget) { catFade = Math.min(1, catFade + dt / 3); catMat.uniforms.uOpacity.value = ease(catFade) * 0.55; }
      // ホタル
      const fp = flies.geometry.attributes.position, fc = flies.geometry.attributes.aColor, fs = flies.geometry.attributes.aSize;
      flyData.forEach((f, i) => {
        f.a += dt * f.sp * 0.08; f.s += dt;
        fp.setXYZ(i, Math.cos(f.a) * f.r + Math.sin(f.s * 0.7) * 0.6, f.y + Math.sin(f.s * 1.3) * 0.3, Math.sin(f.a) * f.r + Math.cos(f.s * 0.5) * 0.6);
        const bl = Math.max(0, Math.sin(f.s * 1.7 + i)) ** 3; fc.setXYZ(i, 0.9 * bl, 1.0 * bl, 0.35 * bl); fs.setX(i, 14);
      });
      fp.needsUpdate = fc.needsUpdate = fs.needsUpdate = true;
      updateSparks(dt);
      updateShoot(dt);
      if (ac && (nextCricket -= dt) < 0) { cricket(); nextCricket = 1 + Math.random() * 3.5; }
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }

    resize();
    renderControls();
    applyLang();
    updateMarks();
    // 最初の1回が重くならないように空回し
    renderer.compile(scene, camera);
    renderer.render(scene, camera);
    canvas.style.cursor = 'grab';
    requestAnimationFrame(t0 => { last = t0; requestAnimationFrame(frame); });
  </script>
</body>
</html>
