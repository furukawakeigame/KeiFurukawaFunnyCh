  <script>
    // CDN が読めないときの一言
    setTimeout(() => { if (!window.MEISHI_READY) { const m = document.getElementById('msg'); m.style.display = 'flex'; m.textContent = 'Failed to load. Please reload. / 読み込めませんでした。再読み込みしてください。'; } }, 8000);

  <script type="module">
    import * as THREE from 'three';
    window.MEISHI_READY = true;

    const SHARE_URL = 'https://keifurukawafunnych.com/games/meishi-koukan/';

    // ---------- 言語 ----------
    const store = {
      get(k, d) { try { const v = localStorage.getItem('meishi-koukan:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
      set(k, v) { try { localStorage.setItem('meishi-koukan:' + k, JSON.stringify(v)); } catch {} },
    };
    const autoLang = () => { for (const l of navigator.languages?.length ? navigator.languages : [navigator.language || '']) { const c = l.toLowerCase().slice(0, 2); if (['ja', 'ko', 'en', 'th'].includes(c)) return c; } return 'en'; };
    const DICT = {
      ja: { title: '名刺交換', back: '← トップへ戻る', again: 'もう一度', post: 'Xに投稿', count: n => `${n}枚`, share: n => `相手より低く名刺を${n}枚交換した #名刺交換ゲーム` },
      ko: { title: '명함 교환', back: '← 처음으로', again: '다시 하기', post: 'X에 게시', count: n => `${n}장`, share: n => `상대보다 낮게 명함을 ${n}장 교환했다 #名刺交換ゲーム` },
      en: { title: 'Business Card Bow', back: '← Back to top', again: 'Play again', post: 'Post on X', count: n => `${n} ${n === 1 ? 'card' : 'cards'}`, share: n => `I exchanged ${n} business ${n === 1 ? 'card' : 'cards'}, always lower than the other guy #名刺交換ゲーム` },
      th: { title: 'แลกนามบัตร', back: '← กลับหน้าแรก', again: 'เล่นอีกครั้ง', post: 'โพสต์ลง X', count: n => `${n} ใบ`, share: n => `แลกนามบัตรไป ${n} ใบ โดยยื่นต่ำกว่าอีกฝ่ายทุกครั้ง #名刺交換ゲーム` },
    };
    let lang = store.get('lang', null) || autoLang();
    const t = k => DICT[lang][k];
    const langSel = document.getElementById('lang');
    langSel.value = lang;
    langSel.addEventListener('change', () => { lang = langSel.value; store.set('lang', lang); applyLang(); });
    function applyLang() {
      document.documentElement.lang = lang;
      document.title = t('title');
      document.getElementById('back').textContent = t('back');
      renderControls();
      if (state === 'result') { showResult(); prepareShare(); }
    }

    // ---------- 音 ----------
    let soundOn = store.get('sound', true);
    const soundBtn = document.getElementById('sound');
    const drawSoundBtn = () => {
      soundBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>${soundOn ? '<path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>' : '<path d="M17 9l5 6M22 9l-5 6"/>'}</svg>`;
    };
    drawSoundBtn();
    soundBtn.addEventListener('click', () => { soundOn = !soundOn; store.set('sound', soundOn); drawSoundBtn(); });
    let ac = null;
    function initAudio() {
      if (ac) return;
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        const o = ac.createOscillator(), g = ac.createGain(); g.gain.value = 0;
        o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.05);
      } catch { ac = null; }
    }
    addEventListener('pointerdown', initAudio, { capture: true });
    addEventListener('keydown', initAudio, { capture: true });
    function tone(type, f0, f1, dur, vol, delay = 0) {
      if (!soundOn || !ac) return;
      const now = ac.currentTime + delay;
      const o = ac.createOscillator(); o.type = type;
      o.frequency.setValueAtTime(f0, now); o.frequency.exponentialRampToValueAtTime(f1, now + dur);
      const g = ac.createGain(); g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      o.connect(g).connect(ac.destination); o.start(now); o.stop(now + dur + 0.02);
    }
    // ノイズを共鳴に通す（紙・布の音）
    function noise(dur, vol, type, freq, q = 1, delay = 0) {
      if (!soundOn || !ac) return;
      const now = ac.currentTime + delay;
      const buf = ac.createBuffer(1, Math.floor(ac.sampleRate * dur), ac.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) { const k = i / d.length; d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * Math.min(1, k * 4)) * (1 - k); }
      const s = ac.createBufferSource(); s.buffer = buf;
      const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.value = freq; fl.Q.value = q;
      const g = ac.createGain(); g.gain.value = vol;
      s.connect(fl).connect(g).connect(ac.destination); s.start(now);
    }
    // 声: 声帯の振動（のこぎり波＋息）を、母音ごとの共鳴（フォルマント）に通す
    const VOWEL = { a: [800, 1200, 2600], i: [300, 2300, 3000], u: [350, 1250, 2500], e: [500, 1900, 2600], o: [500, 850, 2500], g: [450, 1100, 2400] };
    function voice(f0, seq, dur, vol = 0.5, shake = 0.04, breath = 0.15, delay = 0, fall = 0.7) {
      if (!soundOn || !ac) return;
      const now = ac.currentTime + delay;
      const o = ac.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(f0 * 1.15, now);
      o.frequency.linearRampToValueAtTime(f0 * 1.25, now + dur * 0.15);
      o.frequency.exponentialRampToValueAtTime(f0 * fall, now + dur);
      const vib = ac.createOscillator(); vib.frequency.value = 5.5 + Math.random() * 3;
      const vg = ac.createGain(); vg.gain.value = f0 * shake; vib.connect(vg).connect(o.frequency);
      const nb = ac.createBuffer(1, Math.floor(ac.sampleRate * dur), ac.sampleRate), nd = nb.getChannelData(0);
      for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
      const ns = ac.createBufferSource(); ns.buffer = nb;
      const ng = ac.createGain(); ng.gain.value = breath;
      const src = ac.createGain();
      o.connect(src); ns.connect(ng).connect(src);
      const out = ac.createGain();
      out.gain.setValueAtTime(0, now);
      out.gain.linearRampToValueAtTime(vol, now + 0.02);
      out.gain.setValueAtTime(vol, now + dur * 0.55);
      out.gain.exponentialRampToValueAtTime(0.001, now + dur);
      const k = f0 > 200 ? 1.15 : 1;
      [1, 0.6, 0.25].forEach((amp, fi) => {
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = fi === 0 ? 6 : 9;
        seq.forEach((v, si) => { const tt = now + dur * si / Math.max(1, seq.length - 1) * 0.7; bp.frequency[si ? 'linearRampToValueAtTime' : 'setValueAtTime'](VOWEL[v][fi] * k, tt); });
        const g = ac.createGain(); g.gain.value = amp * 3;
        src.connect(bp).connect(g).connect(out);
      });
      out.connect(ac.destination);
      o.start(now); vib.start(now); ns.start(now);
      o.stop(now + dur); vib.stop(now + dur); ns.stop(now + dur);
    }
    // 「よろしくお願いします」の母音を、少しずつ下がる抑揚で一音ずつ
    const GREET = [['o', 'o', 'i', 'u'], ['o', 'e', 'a', 'i', 'i', 'a', 'u']];
    function greet(f0, delay = 0, vol = 0.32) {
      let tt = delay, i = 0;
      for (const word of GREET) {
        for (const v of word) {
          const d = 0.085 + Math.random() * 0.04;
          voice(f0 * (1.1 - i * 0.025), [v, v], d * 1.5, vol, 0.02, 0.12, tt, 0.9);
          tt += d; i++;
        }
        tt += 0.06 + Math.random() * 0.05;
      }
    }
    const sRustle = () => noise(0.35, 0.18, 'bandpass', 1400, 0.8);
    const sPaper = (delay = 0) => { noise(0.09, 0.35, 'highpass', 3200, 0.7, delay); noise(0.04, 0.25, 'bandpass', 900, 3, delay); };
    function sAngry(f0) {
      if (!soundOn || !ac) return;
      voice(f0 * 0.7, ['g', 'a', 'o'], 1.1, 0.6, 0.18, 0.5);
      voice(f0 * 0.5, ['o', 'a'], 1.0, 0.35, 0.25, 0.6);
      noise(0.5, 0.25, 'lowpass', 300);
      tone('sine', 120, 50, 0.3, 0.3);
    }

    // ---------- 3D ----------
    const stage = document.getElementById('stage');
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    stage.prepend(renderer.domElement);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#e9e2d4');
    scene.fog = new THREE.Fog('#e9e2d4', 9, 22);
    const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 100);
    scene.add(new THREE.HemisphereLight('#dceeff', '#8a6a48', 1.1));
    const sun = new THREE.DirectionalLight('#fff0d8', 2.3); sun.position.set(-3, 7, 5);
    sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); sun.shadow.radius = 4; sun.shadow.bias = -0.0008;
    Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 1, far: 20 });
    scene.add(sun);

    const canvasTex = (w, h, draw) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; return tx; };
    const mat = (c, rough = 0.75) => new THREE.MeshStandardMaterial({ color: c, roughness: rough });
    const shade = o => { o.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); return o; };
    const pick = a => a[Math.floor(Math.random() * a.length)];
    const rnd = (a, b) => a + Math.random() * (b - a);
    const SPH = new THREE.SphereGeometry(1, 28, 18), CYL = new THREE.CylinderGeometry(1, 1, 1, 18), BOX = new THREE.BoxGeometry(1, 1, 1);
    const CAP = new THREE.SphereGeometry(1, 24, 12, 0, Math.PI * 2, 0, Math.PI * 0.55);
    const TORSO = new THREE.CapsuleGeometry(1, 1, 8, 24);
    const part = (geo, m, x, y, z, sx, sy = sx, sz = sx, parent) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.scale.set(sx, sy, sz); parent?.add(o); return o; };

    // ---------- オフィス ----------
    const WALL_Z = -2.4;
    {
      // 床: 木のフローリング
      const floorTex = canvasTex(512, 512, (c, w, h) => {
        const rows = 8;
        for (let r = 0; r < rows; r++) {
          let x = -Math.random() * 200;
          while (x < w) {
            const len = 140 + Math.random() * 160, l = 52 + Math.random() * 10;
            c.fillStyle = `hsl(${28 + Math.random() * 6},${42 + Math.random() * 10}%,${l}%)`;
            c.fillRect(x, r * h / rows, len, h / rows);
            for (let k = 0; k < 6; k++) { c.strokeStyle = `rgba(90,50,20,${0.08 + Math.random() * 0.12})`; c.lineWidth = 1; const y = r * h / rows + Math.random() * h / rows; c.beginPath(); c.moveTo(x, y); c.bezierCurveTo(x + len * .3, y + rnd(-3, 3), x + len * .6, y + rnd(-3, 3), x + len, y); c.stroke(); }
            c.fillStyle = 'rgba(60,30,10,.35)'; c.fillRect(x, r * h / rows, 2, h / rows);
            x += len;
          }
          c.fillStyle = 'rgba(60,30,10,.4)'; c.fillRect(0, r * h / rows, w, 2);
        }
      });
      floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping; floorTex.repeat.set(4, 4);
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.45 }));
      floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

      // 壁: 窓の外は空と街
      const wallTex = canvasTex(1024, 512, (c, w, h) => {
        c.fillStyle = '#efe8da'; c.fillRect(0, 0, w, h);
        for (let i = 0; i < 2000; i++) { c.fillStyle = `rgba(120,100,70,${Math.random() * 0.05})`; c.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
        for (const wx of [60, 640]) {
          const ww = 320, wy = 70, wh = 270;
          const sky = c.createLinearGradient(0, wy, 0, wy + wh); sky.addColorStop(0, '#5fa6e6'); sky.addColorStop(1, '#cfe7f7');
          c.fillStyle = sky; c.fillRect(wx, wy, ww, wh);
          // ビル
          let bx = wx;
          while (bx < wx + ww) {
            const bw = 30 + Math.random() * 50, bh = 60 + Math.random() * 150;
            c.fillStyle = `hsl(215,${12 + Math.random() * 10}%,${62 + Math.random() * 16}%)`;
            c.fillRect(bx, wy + wh - bh, bw, bh);
            c.fillStyle = 'rgba(255,255,255,.35)';
            for (let yy = wy + wh - bh + 8; yy < wy + wh - 6; yy += 14) for (let xx = bx + 5; xx < bx + bw - 6; xx += 10) c.fillRect(xx, yy, 5, 7);
            bx += bw + 4;
          }
          // 窓枠とブラインドの影
          c.strokeStyle = '#bfb6a4'; c.lineWidth = 14; c.strokeRect(wx, wy, ww, wh);
          c.lineWidth = 6; c.beginPath(); c.moveTo(wx + ww / 2, wy); c.lineTo(wx + ww / 2, wy + wh); c.stroke();
          c.fillStyle = 'rgba(255,255,255,.12)'; for (let yy = wy; yy < wy + 60; yy += 8) c.fillRect(wx, yy, ww, 4);
        }
        // 幅木
        c.fillStyle = '#8a6a48'; c.fillRect(0, h - 18, w, 18);
      });
      wallTex.wrapS = THREE.RepeatWrapping; wallTex.repeat.set(3, 1); wallTex.offset.x = 1 / 3;
      const wall = new THREE.Mesh(new THREE.PlaneGeometry(36, 6), new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.95 }));
      wall.position.set(0, 3, WALL_Z); wall.receiveShadow = true; scene.add(wall);

      // 社長の肖像（いつもの猫）
      const catTex = new THREE.TextureLoader().load('cat.png'); catTex.colorSpace = THREE.SRGBColorSpace;
      const frame = new THREE.Group(); frame.position.set(-1.45, 1.75, WALL_Z + 0.04);
      part(BOX, mat('#7a5226', 0.4), 0, 0, 0, 1.0, 1.0, 0.06, frame);
      part(BOX, mat('#d9b24a', 0.3), 0, 0, 0.02, 0.9, 0.9, 0.05, frame);
      part(BOX, mat('#f6f0e2', 0.9), 0, 0, 0.035, 0.8, 0.8, 0.04, frame);
      const cat = new THREE.Mesh(new THREE.PlaneGeometry(0.74, 0.74), new THREE.MeshStandardMaterial({ map: catTex, transparent: true, alphaTest: 0.5, roughness: 0.8 }));
      cat.position.z = 0.06; frame.add(cat);
      scene.add(shade(frame));

      // 観葉植物
      const plant = new THREE.Group(); plant.position.set(2.35, 0, WALL_Z + 0.55);
      part(new THREE.CylinderGeometry(0.22, 0.17, 0.45, 20), mat('#f2efe8', 0.35), 0, 0.225, 0, 1, 1, 1, plant);
      part(CYL, mat('#4a3020', 1), 0, 0.44, 0, 0.2, 0.02, 0.2, plant);
      const leaf = mat('#3f8a3a', 0.6), leaf2 = mat('#5aa84a', 0.6);
      for (let i = 0; i < 12; i++) {
        const a = i * 2.4, r = 0.12 + (i % 3) * 0.08;
        const l = part(SPH, i % 2 ? leaf : leaf2, Math.cos(a) * r, 0.75 + (i % 4) * 0.22, Math.sin(a) * r, 0.2, 0.06, 0.09, plant);
        l.rotation.set(rnd(-.4, .4), -a, 0.5 + rnd(-.3, .3));
      }
      part(CYL, mat('#5a4028'), 0, 0.8, 0, 0.025, 0.7, 0.025, plant);
      scene.add(shade(plant));

      // 奥の机とモニター
      const desk = new THREE.Group(); desk.position.set(-3.0, 0, WALL_Z + 0.55);
      const wood = mat('#a77a4a', 0.5), metal = mat('#555a62', 0.35);
      part(BOX, wood, 0, 0.74, 0, 1.4, 0.05, 0.7, desk);
      for (const sx of [-0.65, 0.65]) for (const sz of [-0.3, 0.3]) part(CYL, metal, sx, 0.36, sz, 0.025, 0.72, 0.025, desk);
      part(BOX, mat('#1d1f24', 0.3), 0.1, 1.05, -0.15, 0.55, 0.34, 0.03, desk);
      part(BOX, new THREE.MeshBasicMaterial({ color: '#7fb8e8' }), 0.1, 1.05, -0.133, 0.5, 0.29, 0.01, desk);
      part(BOX, metal, 0.1, 0.83, -0.15, 0.05, 0.14, 0.05, desk);
      part(BOX, mat('#f2f2f2', 0.5), 0.15, 0.775, 0.12, 0.4, 0.015, 0.13, desk);
      part(CYL, mat('#e0603a', 0.4), -0.45, 0.82, 0.1, 0.05, 0.12, 0.05, desk);
      scene.add(shade(desk));
    }

    // ---------- 名刺 ----------
    const CARD = new THREE.BoxGeometry(0.26, 0.156, 0.006);
    const cardMat = (hue) => {
      const face = canvasTex(256, 154, (c, w, h) => {
        c.fillStyle = '#fbfaf6'; c.fillRect(0, 0, w, h);
        c.fillStyle = `hsl(${hue},60%,45%)`; c.beginPath(); c.arc(30, 30, 14, 0, 7); c.fill();
        c.fillRect(0, h - 8, w, 8);
        c.fillStyle = '#2a2a2a'; c.fillRect(70, 62, 120, 14);

    function takeSnap() {
      const src = renderer.domElement;
      const focus = CENTER.clone().setY(0.95).project(camera);
      const fx = (focus.x + 1) / 2 * src.width, fy = (1 - focus.y) / 2 * src.height;
      // 二人が入る幅で切り抜く
      const span = tmpA.set(1.9, 0.95, 0).project(camera), spanPx = Math.abs(span.x - focus.x) / 2 * src.width * 2;
      const side = Math.min(src.width, src.height, Math.max(spanPx * 1.15, 200));
      const sx = THREE.MathUtils.clamp(fx - side / 2, 0, src.width - side), sy = THREE.MathUtils.clamp(fy - side / 2, 0, src.height - side);
      snap = document.createElement('canvas'); snap.width = snap.height = 1080;
      snap.getContext('2d').drawImage(src, sx, sy, side, side, 0, 0, 1080, 1080);
      shareCache = null;
    }
    function resultImage() {
      if (!snap) return null;
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const g = c.getContext('2d');
      g.drawImage(snap, 0, 0);
      g.textAlign = 'center'; g.fillStyle = '#fff'; g.lineJoin = 'round';
      const font = px => `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans Thai", sans-serif`;
      const text = (str, y, px, max) => {
        g.font = font(px);
        const w = g.measureText(str).width; if (w > max) { px *= max / w; g.font = font(px); }
        g.lineWidth = px * .16; g.strokeStyle = '#2b3550'; g.strokeText(str, 540, y); g.fillText(str, 540, y);
      };
      text(t('count')(score), 960, 170, 960);
      text(t('title'), 90, 56, 900);
      return c;
    }
    function prepareShare() {
      if (!snap) return;
      const key = lang;
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'meishi-koukan.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;
    function start() {
      opp.skin.emissiveIntensity = 0;
      reset();
      resultEl.style.display = 'none';
      renderControls(); resize();
    }
    function showResult() { resultEl.children[0].textContent = t('count')(score); }
    function finish() {
      state = 'result';
      showResult();
      resultEl.style.display = 'flex';
      snap = null; needSnap = true;
      renderControls(); resize();
    }

    // ---------- ループ ----------
    let last = performance.now(), acc = 0;
    function render(alpha) {
      placePerson(me, -POS, me.prevH + (me.h - me.prevH) * alpha, 0);
      const ox = opp.prevX + (opp.x - opp.prevX) * alpha;
      placePerson(opp, ox + (state === 'angry' ? Math.sin(timer * 50) * 0.012 : 0), opp.prevH + (opp.h - opp.prevH) * alpha, state === 'angry' ? -0.2 * opp.angry : 0);
      // 歩いている間は少し上下に揺れる
      opp.g.position.y = ox > POS + 0.01 ? Math.abs(Math.sin(ox * 9)) * 0.04 : 0;
      renderer.render(scene, camera);
      if (needSnap) { needSnap = false; takeSnap(); prepareShare(); }
    }
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      acc += dt;
      while (acc >= STEP) { step(STEP); acc -= STEP; }
      render(acc / STEP);
      requestAnimationFrame(loop);
    }

    newOpp(0); opp.x = opp.prevX = POS;
    resize();
    start();
    applyLang();
    // 最初の1回が重くならないように、一度描いておく
    { const f = new THREE.Mesh(flakeG, new THREE.MeshBasicMaterial({ transparent: true, side: THREE.DoubleSide })); scene.add(f); render(1); renderer.compile(scene, camera); scene.remove(f); }
    requestAnimationFrame(t0 => { last = t0; loop(t0); });
  </script>
</body>
