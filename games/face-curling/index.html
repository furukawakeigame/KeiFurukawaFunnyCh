  <script>

  <script type="module">
    import * as THREE from 'three';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import * as planck from 'planck';
    window.CURL_READY = true;

    const SHARE_URL = 'https://keifurukawafunnych.com/games/face-curling/';

    // ---------- 言語 ----------
    const store = {
      get(k, d) { try { const v = localStorage.getItem('face-curling:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
      set(k, v) { try { localStorage.setItem('face-curling:' + k, JSON.stringify(v)); } catch {} },
    };
    const autoLang = () => { for (const l of navigator.languages?.length ? navigator.languages : [navigator.language || '']) { const c = l.toLowerCase().slice(0, 2); if (['ja', 'ko', 'en', 'th'].includes(c)) return c; } return 'en'; };
    const DICT = {
      ja: { title: '顔カーリング', back: '← トップへ戻る', again: 'もう一度', post: 'Xに投稿', share: n => `氷の上で顔のパーツを滑らせて、似てる度${n}% #顔カーリングゲーム` },
      ko: { title: '얼굴 컬링', back: '← 처음으로', again: '다시 하기', post: 'X에 게시', share: n => `얼음 위에서 얼굴 부위를 미끄러뜨려 닮은 정도 ${n}% #顔カーリングゲーム` },
      en: { title: 'Face Curling', back: '← Back to top', again: 'Play again', post: 'Post on X', share: n => `I slid face parts across the ice and made a face ${n}% right #顔カーリングゲーム` },
      th: { title: 'เคิร์ลลิงหน้า', back: '← กลับหน้าแรก', again: 'เล่นอีกครั้ง', post: 'โพสต์ลง X', share: n => `ไถลชิ้นส่วนใบหน้าบนน้ำแข็ง ได้หน้าเหมือน ${n}% #顔カーリングゲーム` },
    };
    let lang = store.get('lang', null) || autoLang();
    const t = k => DICT[lang][k];
    const langSel = document.getElementById('lang');
    langSel.value = lang;
    langSel.addEventListener('change', () => { lang = langSel.value; store.set('lang', lang); applyLang(); });
    function applyLang() {
      document.documentElement.lang = lang;
      document.title = t('title');
      document.getElementById('back').textContent = t('back');
      renderControls();
      if (state === 'result') { showResult(); prepareShare(); }
    }

    // ---------- 音 ----------
    let soundOn = store.get('sound', true);
    const soundBtn = document.getElementById('sound');
    const drawSoundBtn = () => {
      soundBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>${soundOn ? '<path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>' : '<path d="M17 9l5 6M22 9l-5 6"/>'}</svg>`;
    };
    drawSoundBtn();
    soundBtn.addEventListener('click', () => { soundOn = !soundOn; store.set('sound', soundOn); drawSoundBtn(); });
    let ac = null, slideGain = null, slideBp = null;
    const noiseBuf = dur => { const b = ac.createBuffer(1, Math.floor(ac.sampleRate * dur), ac.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b; };
    function initAudio() {
      if (ac) return;
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        const o = ac.createOscillator(), g = ac.createGain(); g.gain.value = 0;
        o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.05);
        // 氷の上を滑る「ゴーッ」: ずっと鳴らしておき、速さで音量を変える
        const s = ac.createBufferSource(); s.buffer = noiseBuf(2); s.loop = true;
        slideBp = ac.createBiquadFilter(); slideBp.type = 'lowpass'; slideBp.frequency.value = 300; slideBp.Q.value = 2;
        const hum = ac.createBiquadFilter(); hum.type = 'peaking'; hum.frequency.value = 110; hum.gain.value = 12; hum.Q.value = 3;
        slideGain = ac.createGain(); slideGain.gain.value = 0;
        s.connect(slideBp).connect(hum).connect(slideGain).connect(ac.destination); s.start();
      } catch { ac = null; }
    }
    const wake = () => { initAudio(); if (ac && ac.state !== 'running') ac.resume().catch(() => {}); };
    for (const ev of ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown']) addEventListener(ev, wake, { capture: true });
    const ok = () => soundOn && ac;
    let slideVol = -1;
    function setSlide(v) {
      if (!ac) return;
      v = soundOn ? Math.min(0.5, v) : 0;
      if (Math.abs(v - slideVol) < 0.01) return;
      slideVol = v;
      slideGain.gain.setTargetAtTime(v, ac.currentTime, 0.08);
      slideBp.frequency.setTargetAtTime(220 + v * 900, ac.currentTime, 0.1);
    }
    function tone(type, f0, f1, dur, vol, delay = 0) {
      if (!ok()) return;
      const now = ac.currentTime + delay;
      const o = ac.createOscillator(); o.type = type;
      o.frequency.setValueAtTime(f0, now); o.frequency.exponentialRampToValueAtTime(f1, now + dur);
      const g = ac.createGain(); g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      o.connect(g).connect(ac.destination); o.start(now); o.stop(now + dur + 0.02);
    }
    // ぶつかる音: 短いノイズを硬い共鳴に通した「コン」＋低い胴鳴り
    function knock(k) {
      if (!ok()) return;
      const now = ac.currentTime, len = 0.12;
      const buf = ac.createBuffer(1, Math.floor(ac.sampleRate * len), ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ac.sampleRate * 0.008));
      const s = ac.createBufferSource(); s.buffer = buf;
      for (const [f, q, g0] of [[1250, 14, 1.0], [2900, 18, 0.5], [620, 8, 0.6]]) {
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f * (0.93 + Math.random() * 0.14); bp.Q.value = q;
        const g = ac.createGain(); g.gain.value = g0 * k; s.connect(bp).connect(g).connect(ac.destination);
      }
      s.start(now);
      tone('sine', 160, 70, 0.18, 0.25 * k);
    }
    // ゴムを引く「キュッ」: 引くほど高く
    function creak(k) {
      if (!ok()) return;
      const now = ac.currentTime, dur = 0.07;
      const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(320 + k * 500, now); o.frequency.linearRampToValueAtTime(380 + k * 560, now + dur);
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1400 + k * 800; bp.Q.value = 4;
      const g = ac.createGain(); g.gain.setValueAtTime(0.001, now); g.gain.linearRampToValueAtTime(0.06, now + 0.01); g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      o.connect(bp).connect(g).connect(ac.destination); o.start(now); o.stop(now + dur + 0.02);
    }
    // ゴムが戻る「バチン」＋低くふるえる「ビュン」
    function twang(k) {
      if (!ok()) return;
      const now = ac.currentTime;
      const buf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.05), ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ac.sampleRate * 0.006));
      const s = ac.createBufferSource(); s.buffer = buf;
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2200; bp.Q.value = 2;
      const g = ac.createGain(); g.gain.value = 0.5 + 0.5 * k; s.connect(bp).connect(g).connect(ac.destination); s.start(now);
      const o = ac.createOscillator(); o.type = 'triangle'; o.frequency.setValueAtTime(140 + k * 60, now); o.frequency.exponentialRampToValueAtTime(70, now + 0.35);
      const lfo = ac.createOscillator(); lfo.frequency.value = 28; const lg = ac.createGain(); lg.gain.value = 0.5;
      const og = ac.createGain(); og.gain.setValueAtTime(0.3 * (0.4 + k), now); og.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
      const am = ac.createGain(); am.gain.value = 0.5; lfo.connect(lg).connect(am.gain);
      o.connect(am).connect(og).connect(ac.destination); o.start(now); lfo.start(now); o.stop(now + 0.42); lfo.stop(now + 0.42);
    }
    // ブラシで氷をこする「シャッ」
    function brushSnd(k) {
      if (!ok()) return;
      const now = ac.currentTime, dur = 0.16;
      const s = ac.createBufferSource(); s.buffer = noiseBuf(dur);
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.4;
      bp.frequency.setValueAtTime(3200 + Math.random() * 1500, now); bp.frequency.linearRampToValueAtTime(2200, now + dur);
      const g = ac.createGain(); g.gain.setValueAtTime(0.001, now); g.gain.linearRampToValueAtTime(0.3 * k, now + 0.03); g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      s.connect(bp).connect(g).connect(ac.destination); s.start(now);
    }
    // 声: 声帯の振動（のこぎり波＋ゆらぎ）を、母音ごとの共鳴（フォルマント）に通す
    const VOWEL = { a: [800, 1200, 2600], i: [300, 2300, 3000], u: [350, 1250, 2500], e: [500, 1900, 2600], o: [500, 850, 2500], h: [700, 1300, 2600] };
    function voice(f0, seq, dur, vol, { rise = 1.3, fall = 0.7, shake = 0.04, breath = 0.15, vib = 6, delay = 0 } = {}) {
      if (!ok()) return;
      const now = ac.currentTime + delay;
      const o = ac.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(f0 * rise, now);
      o.frequency.linearRampToValueAtTime(f0 * rise * 1.08, now + dur * 0.15);
      o.frequency.exponentialRampToValueAtTime(f0 * fall, now + dur);
      const v = ac.createOscillator(); v.frequency.value = vib + Math.random() * 2;
      const vg = ac.createGain(); vg.gain.value = f0 * shake; v.connect(vg).connect(o.frequency);
      const ns = ac.createBufferSource(); ns.buffer = noiseBuf(dur);
      const ng = ac.createGain(); ng.gain.value = breath;
      const og = ac.createGain(); og.gain.value = 1 - Math.min(0.9, breath);
      const src = ac.createGain();
      o.connect(og).connect(src); ns.connect(ng).connect(src);
      const out = ac.createGain();
      out.gain.setValueAtTime(0, now);
      out.gain.linearRampToValueAtTime(vol, now + Math.min(0.06, dur * 0.2));
      out.gain.setValueAtTime(vol, now + dur * 0.55);
      out.gain.exponentialRampToValueAtTime(0.001, now + dur);
      [1, 0.6, 0.25].forEach((amp, fi) => {
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = fi === 0 ? 6 : 9;
        seq.forEach((s, si) => { const tt = now + dur * si / Math.max(1, seq.length - 1) * 0.8; bp.frequency[si ? 'linearRampToValueAtTime' : 'setValueAtTime'](VOWEL[s][fi], tt); });
        const g = ac.createGain(); g.gain.value = amp * 3;
        src.connect(bp).connect(g).connect(out);
      });
      out.connect(ac.destination);
      o.start(now); v.start(now); ns.start(now);
      o.stop(now + dur); v.stop(now + dur); ns.stop(now + dur);
    }
    const pick = a => a[Math.floor(Math.random() * a.length)];
    // 完成した顔がしゃべる: よく似ていれば笑い、崩れていればうめく
    function faceVoice(score) {
      const f0 = 150 + Math.random() * 40;
      if (score >= 70) {
        const n = 3 + Math.floor(Math.random() * 2);
        for (let i = 0; i < n; i++) voice(f0 * (1.3 - i * 0.06), pick([['h', 'a'], ['h', 'a', 'a'], ['a', 'h']]), 0.17 + Math.random() * 0.05, 0.55, { rise: 1.2, fall: 0.85, breath: 0.3, delay: i * 0.21 });
      } else if (score >= 40) {
        voice(f0, pick([['u', 'u', 'u'], ['o', 'u'], ['e', 'u']]), 0.7 + Math.random() * 0.3, 0.55, { rise: 0.95, fall: 0.8, shake: 0.03, breath: 0.15, vib: 4 });
        voice(f0 * 1.15, pick([['a', 'a'], ['e', 'e']]), 0.35, 0.45, { rise: 1.1, fall: 0.9, delay: 0.85 });
      } else {
        voice(f0 * 0.85, pick([['o', 'e', 'e'], ['a', 'u', 'e'], ['o', 'o', 'e']]), 1.2 + Math.random() * 0.5, 0.6, { rise: 1.0, fall: 0.6, shake: 0.12, breath: 0.25, vib: 9 });
      }
    }

    // ---------- 3D ----------
    const stage = document.getElementById('stage');
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(2, devicePixelRatio));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    stage.prepend(renderer.domElement);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 140);
    const fitCam = new THREE.PerspectiveCamera(45, 1, 0.1, 140);
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    // 背景: 天井の高い室内リンクのグラデーション
    {
      const c = document.createElement('canvas'); c.width = 4; c.height = 256;
      const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
      gr.addColorStop(0, '#5f7899'); gr.addColorStop(0.55, '#a9bcd4'); gr.addColorStop(1, '#d7e2ee');
      g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
      const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
      scene.background = tex;
    }
    scene.fog = new THREE.Fog('#c3d0e0', 24, 70);

    const hemi = new THREE.HemisphereLight('#d6eaff', '#8f8478', 1.1);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight('#fff0da', 2.2);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 30 });
    sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.02;
    scene.add(sun, sun.target);

    // ---------- リンク ----------
    const W = 2.6;           // リンクの半分の幅
    const FZ = -14;          // 顔の中心
    const BACK = -19.3;      // 奥の壁
    const FRONT = 3.2;
    function canvasTex(w, h, draw, repeat) {
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      draw(c.getContext('2d'), w, h);
      const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      if (repeat) { tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(...repeat); }

      camera.position.copy(camPos); camera.lookAt(camLook);
      camera.updateMatrixWorld();
      // 影はいま見ている所のまわりにだけ作る
      sun.target.position.copy(camLook); sun.position.copy(camLook).add(tmpV.set(4, 11, 5));
      const sc = THREE.MathUtils.clamp(camPos.distanceTo(camLook) * 0.45, 4, 9);
      const sh = sun.shadow.camera;
      if (Math.abs(sh.right - sc) > 0.05) { sh.left = sh.bottom = -sc; sh.right = sh.top = sc; sh.updateProjectionMatrix(); }
    }

    // ---------- 画面 ----------
    const leftEl = document.getElementById('left');
    leftEl.innerHTML = '<i></i>'.repeat(stones.length);
    function updateLeft() { [...leftEl.children].forEach((el, i) => el.classList.toggle('used', i < cur || state === 'result')); }
    const hintPull = document.getElementById('hintPull'), hintSweep = document.getElementById('hintSweep');
    function updateHints() {
      hintPull.style.display = state === 'ready' && !shotOnce ? 'block' : 'none';
      hintSweep.style.display = state === 'slide' && !sweptOnce ? 'block' : 'none';
    }
    function renderControls() {
      controls.innerHTML = '';
      controls.classList.toggle('hide', state !== 'result');
      if (state !== 'result') return;
      const b = document.createElement('button');
      b.className = 'go'; b.textContent = t('again');
      b.addEventListener('click', start);
      controls.append(b);
      const a = document.createElement('a');
      a.className = 'post'; a.textContent = t('post');
      a.href = `https://x.com/intent/post?text=${encodeURIComponent(t('share')(score))}&url=${encodeURIComponent(SHARE_URL)}`;
      const coarse = matchMedia('(pointer: coarse)').matches;
      if (!coarse) { a.target = '_blank'; a.rel = 'noopener'; }
      // スマホは画像ごと共有シートへ。PCは画像を保存してから投稿画面を開く
      a.addEventListener('click', e => {
        const text = t('share')(score);
        if (coarse && navigator.share) {
          e.preventDefault();
          const file = shareFile();
          const data = file && navigator.canShare?.({ files: [file] }) ? { files: [file], text: `${text}\n${SHARE_URL}` } : { text: `${text}\n${SHARE_URL}` };
          navigator.share(data).catch(() => {});
          return;
        }
        const img = resultImage();
        if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'face-curling.png'; d.click(); }
      });
      controls.append(a);
    }
    // 結果画像: できあがった顔を真ん中に切り抜き、％を重ねる
    let snap = null, shareCache = null, needSnap = false;
    function takeSnap() {
      const src = renderer.domElement;
      const f = tmpV.set(0, 0, FZ).project(camera);
      const fx2 = (f.x + 1) / 2 * src.width, fy = (1 - f.y) / 2 * src.height;
      const side = Math.min(src.width, src.height, Math.max(view.uw, view.uh) * renderer.getPixelRatio());
      const sx = THREE.MathUtils.clamp(fx2 - side / 2, 0, src.width - side), sy = THREE.MathUtils.clamp(fy - side / 2, 0, src.height - side);
      snap = document.createElement('canvas'); snap.width = snap.height = 1080;
      snap.getContext('2d').drawImage(src, sx, sy, side, side, 0, 0, 1080, 1080);
      shareCache = null;
    }
    function resultImage() {
      if (!snap) return null;
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const g = c.getContext('2d');
      g.drawImage(snap, 0, 0);
      g.textAlign = 'center'; g.fillStyle = '#fff'; g.lineJoin = 'round';
      const font = px => `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans Thai", sans-serif`;
      const text = (str, y, px, max) => {
        g.font = font(px);
        const w = g.measureText(str).width; if (w > max) { px *= max / w; g.font = font(px); }
        g.lineWidth = px * .16; g.strokeStyle = '#2b4a72'; g.strokeText(str, 540, y); g.fillText(str, 540, y);
      };
      text(`${score}%`, 1010, 170, 960);
      text(t('title'), 90, 56, 900);
      return c;
    }
    function prepareShare() {
      if (!snap) return;
      const key = lang;
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'face-curling.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;
    function showResult() {
      resultEl.querySelector('b').textContent = `${score}%`;
      resultEl.querySelector('i').style.transform = `scaleX(${score / 100})`;
    }
    function start() {
      stones.forEach((s, i) => { const [x, z] = waitPos(i); s.st = 'wait'; s.x = s.px = x; s.z = s.pz = z; s.y = 0; s.vx = s.vz = s.vy = 0; s.rot = s.prot = 0; s.w = 0; s.mesh.visible = true; s.body.setActive(false); });
      cur = 0; score = 0; voiced = false; snap = null; shareCache = null;
      resultEl.style.display = 'none';
      resultEl.querySelector('i').style.transform = 'scaleX(0)';
      readyNext();
      renderControls(); resize(); snapCam = false;
    }
    function finish() {
      state = 'result';
      score = computeScore();
      resultStart = clock;
      resultEl.style.display = 'flex';
      resultEl.querySelector('i').style.transform = 'scaleX(0)';
      renderControls(); resize(); updateLeft(); updateHints();
      requestAnimationFrame(showResult);
    }

    // ---------- ループ ----------
    let last = performance.now(), acc = 0;
    function render(alpha, dt) {
      for (const s of stones) {
        const m = s.mesh;
        m.position.set(s.px + (s.x - s.px) * alpha, s.y, s.pz + (s.z - s.pz) * alpha);
        m.rotation.y = -(s.prot + (s.rot - s.prot) * alpha);
      }
      if (state === 'aim' || state === 'ready') {
        const s = stones[cur];
        // ゴムで後ろへ引く（狙う向きと反対へ）
        const d = pullD(), ox = -Math.sin(aim.ang) * d, oz = Math.cos(aim.ang) * d;
        s.mesh.position.x = s.x + ox; s.mesh.position.z = s.z + oz;
        s.mesh.rotation.y = -aim.ang;
        pch.x = s.mesh.position.x - Math.sin(aim.ang) * 0.38; pch.z = s.mesh.position.z + Math.cos(aim.ang) * 0.38;
        pch.vx = pch.vz = 0; pch.free = false;
        arrow.visible = state === 'aim' && aim.p > 0.02;
        if (arrow.visible) {
          // 向きだけを見せる（止まる位置は見せない）。強さはパーツを引く量で見せる
          arrow.position.set(s.x, 0.012, s.mesh.position.z);
          arrow.rotation.y = -aim.ang;
          arrowLine.scale.z = 2.2;
        }
      }
      poseSling();
      hp.face.set(1, 0, 0);
      poseHuman();
      updateCamera(dt);
      // 滑る音の大きさ
      let v = 0; for (const s of stones) if (s.st === 'go') v = Math.max(v, Math.hypot(s.vx, s.vz));
      setSlide(v / VMAX * 0.6);
      renderer.render(scene, camera);
      if (state === 'result' && !snap && resultClock() > 1.6) { needSnap = true; }
      if (needSnap) { needSnap = false; takeSnap(); prepareShare(); }
    }
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      acc += dt;
      while (acc >= STEP) { step(STEP); acc -= STEP; }
      render(acc / STEP, dt);
      requestAnimationFrame(loop);
    }

    window.__curl = { stones, get state() { return state; }, get score() { return score; }, aim, launch: (p, ang) => { aim.p = p; aim.ang = ang; launch(); }, sweep: dx => sweepMove(dx), camera, renderer };
    resize();
    start();
    applyLang();
    for (let i = 0; i < 4; i++) step(STEP);
    renderer.compile(scene, camera); render(0, 0.016);
    requestAnimationFrame(t0 => { last = t0; loop(t0); });
  </script>
</body>
</html>
