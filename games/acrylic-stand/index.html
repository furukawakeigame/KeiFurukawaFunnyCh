    const langSel = document.getElementById('lang');
    langSel.value = lang;
    langSel.addEventListener('change', () => { lang = langSel.value; store.set('lang', lang); applyLang(); });
    function applyLang() {
      document.documentElement.lang = lang;

    }

    // ---------- 音 ----------
    let soundOn = store.get('sound', true);

    const drawSoundBtn = () => {
      soundBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>${soundOn ? '<path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>' : '<path d="M17 9l5 6M22 9l-5 6"/>'}</svg>`;

    let ac = null;
    // iPhone の消音モードでも鳴るようにする
    function unmuteIOS() {

    function initAudio() {
      if (ac) return;

        unmuteIOS();

        const o = ac.createOscillator(), g = ac.createGain(); g.gain.value = 0;

    }
    addEventListener('pointerdown', initAudio, { capture: true });
    function tone(type, f0, f1, dur, vol, delay = 0) {
      if (!soundOn || !ac) return;
      const now = ac.currentTime + delay;
      const o = ac.createOscillator(); o.type = type;

    // 短いノイズを、いくつかの共鳴に通す（硬い物が当たる音）
    function strike(bands, decay, vol, delay = 0, len = 0.08) {
      if (!soundOn || !ac) return;
      const now = ac.currentTime + delay;
      const buf = ac.createBuffer(1, Math.floor(ac.sampleRate * len), ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ac.sampleRate * decay));
      const s = ac.createBufferSource(); s.buffer = buf;
      for (const [f, q, g0] of bands) {
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f * (0.94 + Math.random() * 0.12); bp.Q.value = q;

      fl.frequency.setValueAtTime(f0, now); fl.frequency.exponentialRampToValueAtTime(f1, now + dur);

    }
    // 声: 声帯の振動（のこぎり波＋息）を、母音ごとの共鳴（フォルマント）に通す
    const VOWEL = { a: [800, 1200, 2600], i: [300, 2300, 3000], u: [350, 1250, 2500], e: [500, 1900, 2600], o: [500, 850, 2500] };
    function voice(f0, seq, dur, vol = 0.4, shake = 0.04, breath = 0.12) {

      const o = ac.createOscillator(); o.type = 'sawtooth';

      const vg = ac.createGain(); vg.gain.value = f0 * shake; vib.connect(vg).connect(o.frequency);
      const nb = ac.createBuffer(1, Math.floor(ac.sampleRate * dur), ac.sampleRate), nd = nb.getChannelData(0);
      for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
      const ns = ac.createBufferSource(); ns.buffer = nb;
      const ng = ac.createGain(); ng.gain.value = breath;
      const src = ac.createGain();

      const out = ac.createGain();
      out.gain.setValueAtTime(0, now);
      out.gain.linearRampToValueAtTime(vol, now + 0.03);
      out.gain.setValueAtTime(vol, now + dur * 0.55);
      out.gain.exponentialRampToValueAtTime(0.001, now + dur);
      [1, 0.6, 0.25].forEach((amp, fi) => {
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = fi === 0 ? 6 : 9;
        seq.forEach((v, si) => { const tt = now + dur * si / Math.max(1, seq.length - 1) * 0.75; bp.frequency[si ? 'linearRampToValueAtTime' : 'setValueAtTime'](VOWEL[v][fi] * 1.3, tt); });

    // アクリルが机に当たる「コトッ」: 硬く明るい当たり＋机の低い鳴り
    const sClack = (v = 1) => { strike([[2300, 7, 1.1], [4100, 9, 0.6], [1150, 6, 0.5]], 0.005, v); tone('sine', 210, 90, 0.1, 0.22 * v); };
    const sPick = () => { tone('sine', 480 + Math.random() * 60, 950, 0.06, 0.12); strike([[3200, 8, 0.3]], 0.003, 0.6); };
    // 切り抜きを閉じた「シャキッ」: 刃の当たる音2つ＋空気

    const sTrash = () => { hiss(0.3, 0.35, 3000, 400); tone('triangle', 420, 110, 0.28, 0.12); };
    const sNo = () => { tone('square', 160, 140, 0.12, 0.06); tone('square', 160, 140, 0.12, 0.06, 0.15); };
    const sMeow = () => voice(560 + Math.random() * 120, pick([['i', 'a', 'u'], ['e', 'a', 'o'], ['i', 'a', 'o']]), 0.45 + Math.random() * 0.2, 0.32, 0.05, 0.1);

    // ---------- 3D ----------
    const stage = document.getElementById('stage');
    const renderer = new THREE.WebGLRenderer({ antialias: true });

    renderer.shadowMap.enabled = true;

    renderer.toneMappingExposure = 1.05;

    const scene = new THREE.Scene();
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
    scene.background = new THREE.Color('#e9dcc6');
    scene.fog = new THREE.Fog('#e9dcc6', 14, 34);
    const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 100);
    scene.add(new THREE.HemisphereLight('#dceeff', '#8a6a4a', 0.7));
    const sun = new THREE.DirectionalLight('#ffeed6', 1.9); sun.position.set(-4, 8, 5);
    sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); sun.shadow.radius = 5; sun.shadow.bias = -0.0006;
    Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 5, bottom: -5, near: 1, far: 25 });
    scene.add(sun);

    const canvasTex = (w, h, draw) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; tx.anisotropy = 4; return tx; };

    });
    {
      const top = wood('#c98e55', '90,50,20');
      const desk = new THREE.Mesh(new THREE.BoxGeometry(DESK.x1 - DESK.x0, 0.3, DESK.z1 - DESK.z0), mat('#fff', 0.55, { map: top }));

        for (let i = 0; i < 900; i++) { c.fillStyle = `rgba(150,120,90,${Math.random() * 0.06})`; c.fillRect(Math.random() * w, Math.random() * h, 2, 2); }

    // 4近傍の塗りつぶし

    // 切り抜いた絵から、印刷面（白フチつき）とアクリル板の形を作る

    function standGeometry(art) {

      const pad = fr + mg + 4;

      const silW = tinted(art, '#fff');
      const print = mkCanvas(W, H), pg = print.getContext('2d');

      dilate(og, silW, pad, pad, fr + mg);
      const px = og.getImageData(0, 0, W, H).data;
      let m = new Uint8Array(W * H);
      for (let i = 0; i < W * H; i++) m[i] = px[i * 4 + 3] > 100 ? 1 : 0;

    const acrylicM = new THREE.MeshPhysicalMaterial({ color: '#ffffff', metalness: 0, roughness: 0.04, transmission: 1, thickness: T, ior: 1.49, envMapIntensity: 1.3, specularIntensity: 1, clearcoat: 1, clearcoatRoughness: 0.03 });

    // ---------- 保存と読み込み ----------

    const loadImg = src => new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });

    async function loadShelf() {

    // ---------- 共有画像 ----------
    let snap = null, shareCache = null, needSnap = false, snapTimer = 0;
    function scheduleSnap() { clearTimeout(snapTimer); snapTimer = setTimeout(() => { needSnap = true; }, 900); }
    function takeSnap() {
      const src = renderer.domElement;
      const visH = Math.round(src.height * fh / stage.clientHeight);
      const side = Math.min(src.width, visH);
      const f = new THREE.Vector3(cam.cx, 0.85, 0).project(camera);
      const fx = (f.x + 1) / 2 * src.width, fy = (1 - f.y) / 2 * src.height;
      const sx = THREE.MathUtils.clamp(fx - side / 2, 0, src.width - side), sy = THREE.MathUtils.clamp(fy - side / 2, 0, visH - side);
      snap = mkCanvas(1080, 1080);
      snap.getContext('2d').drawImage(src, sx, sy, side, side, 0, 0, 1080, 1080);
      shareCache = null; prepareShare();
    }
    function shareImage() {
      if (!snap) return null;
      const c = mkCanvas(1080, 1080), g = c.getContext('2d');
      g.drawImage(snap, 0, 0);
      g.textAlign = 'center'; g.fillStyle = '#fff'; g.lineJoin = 'round';
      let px = 60; const font = () => `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans Thai", sans-serif`;
      g.font = font(); const w = g.measureText(t('title')).width; if (w > 900) { px *= 900 / w; g.font = font(); }
      g.lineWidth = px * 0.18; g.strokeStyle = '#6b3d1c'; g.strokeText(t('title'), 540, 96); g.fillText(t('title'), 540, 96);
      return c;
    }
    function prepareShare() {
      if (!snap || shareCache?.key === lang) return;
      const key = lang; shareCache = { key, file: null };
      shareImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'acrylic-stand.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;

    // ---------- 動き ----------
    const STEP = 1 / 60;
    const X0 = -3.5, X1 = 3.5, Z0 = -1.05, Z1 = 1.25;
    function step(dt) {
      for (const s of stands) {
        s.px = s.x; s.pz = s.z; s.py = s.y; s.pax = s.ax; s.paz = s.az; s.plift = s.lift;
        if (s.delay > 0) { s.delay -= dt; if (s.delay <= 0) s.root.visible = true; else continue; }
        if (s.dying) {
          s.dying += dt;
          if (s.dying > 0.35) { removeStand(s); continue; }
          continue;
        }
        const dragging = drag && drag.st === s && drag.moved;
        if (dragging) {
          const nx = THREE.MathUtils.clamp(s.tx, X0 + s.bw / 2, X1 - s.bw / 2), nz = THREE.MathUtils.clamp(s.tz, Z0 + s.bd / 2, Z1 - s.bd / 2);
          const k = Math.min(1, dt * 14), vx = (nx - s.x) * k / dt, vz = (nz - s.z) * k / dt;
          s.x += (nx - s.x) * k; s.z += (nz - s.z) * k;
          s.lift += (0.28 - s.lift) * Math.min(1, dt * 12);
          // 動かす向きに少し傾く
          s.az += (THREE.MathUtils.clamp(-vx * 0.05, -0.35, 0.35) - s.az) * Math.min(1, dt * 10);
          s.ax += (THREE.MathUtils.clamp(vz * 0.05, -0.35, 0.35) - s.ax) * Math.min(1, dt * 10);
          s.vax = s.vaz = 0;
        } else {
          if (s.lift > 0) {
            s.lift = Math.max(0, s.lift - dt * 2.2);
            if (s.lift === 0) { sClack(0.8); s.vax += rnd(-1.6, 1.6); s.vaz += rnd(-1.2, 1.2); scheduleSnap(); }
          }
          // 上から落ちてくる
          if (s.y > 0 || s.vy) {
            s.vy -= 14 * dt; s.y += s.vy * dt;
            if (s.y <= 0) {
              s.y = 0;
              if (s.vy < -1.2) { sClack(Math.min(1, -s.vy / 6)); s.vax += rnd(-2.5, 2.5); s.vaz += rnd(-1.5, 1.5); s.vy = -s.vy * 0.22; }
              else { s.vy = 0; scheduleSnap(); }
            }
          }
          // ゆらゆら（ばね）
          s.vax += (-160 * s.ax - 3.2 * s.vax) * dt; s.ax += s.vax * dt;
          s.vaz += (-160 * s.az - 3.2 * s.vaz) * dt; s.az += s.vaz * dt;
        }
      }
      // 重ならないように押し合う（持ち上げているものは押す側）
      const live = stands.filter(s => !s.dying && s.delay <= 0);
      for (let i = 0; i < live.length; i++) for (let j = i + 1; j < live.length; j++) {
        const a = live[i], b = live[j];
        const dx = b.x - a.x, dz = b.z - a.z;
        const ox = (a.bw + b.bw) / 2 + 0.04 - Math.abs(dx), oz = (a.bd + b.bd) / 2 + 0.04 - Math.abs(dz);
        if (ox <= 0 || oz <= 0) continue;
        const wa = drag?.st === a && drag.moved ? 0 : 1, wb = drag?.st === b && drag.moved ? 0 : 1;
        if (!wa && !wb) continue;
        const sum = wa + wb, push = Math.min(ox, oz) * 0.35;
        if (ox < oz) { const sg = Math.sign(dx) || 1; a.x -= sg * push * wa / sum * 2; b.x += sg * push * wb / sum * 2; }
        else { const sg = Math.sign(dz) || 1; a.z -= sg * push * wa / sum * 2; b.z += sg * push * wb / sum * 2; }
        for (const s of [a, b]) { s.x = THREE.MathUtils.clamp(s.x, X0 + s.bw / 2, X1 - s.bw / 2); s.z = THREE.MathUtils.clamp(s.z, Z0 + s.bd / 2, Z1 - s.bd / 2); }
        if (wa) a.vaz += 0.05 * Math.sign(dx); if (wb) b.vaz -= 0.05 * Math.sign(dx);
        b.moved = a.moved = true;
      }
      for (const s of live) if (s.moved) { s.moved = false; s.needSave = true; }
    }

    // ---------- ループ ----------
    let last = performance.now(), acc = 0, t0 = 0;
    function render(alpha, dt) {
      t0 += dt;
      const kc = 1 - Math.exp(-dt * 4);
      if (!drag?.moved) { cam.cx += (cam.tcx - cam.cx) * kc; cam.hw += (cam.thw - cam.hw) * kc; }
      placeCamera();
      for (const s of stands) {
        const L = (a, b) => a + (b - a) * alpha;
        s.root.position.set(L(s.px, s.x), L(s.py, s.y), L(s.pz, s.z));
        s.tilt.position.y = L(s.plift, s.lift);
        s.tilt.rotation.set(L(s.pax, s.ax), 0, L(s.paz, s.az));
        if (s.dying) { const q = Math.min(1, s.dying / 0.35); s.root.scale.setScalar(1 - q * q); s.root.position.y = q * 0.3; }
        if (s.ring.visible) s.ring.material.opacity = 0.65 + 0.35 * Math.sin(t0 * 5);
      }
      if (needSnap && !cutting) {
        needSnap = false;
        const r = sel?.ring; if (r) r.visible = false;
        renderer.render(scene, camera);
        takeSnap();
        if (r) r.visible = true;
      }
      if (!cutting) renderer.render(scene, camera);
      else drawCut(dt);
    }
    let saveCheck = 0;
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      acc += dt;
      while (acc >= STEP) { step(STEP); acc -= STEP; }
      render(acc / STEP, dt);
      saveCheck += dt;
      if (saveCheck > 1 && !drag) { saveCheck = 0; if (stands.some(s => s.needSave)) { stands.forEach(s => s.needSave = false); save(); } }
      requestAnimationFrame(loop);
    }

    renderBars();
    resize();
    applyLang();
    placeCamera();
    renderer.compile(scene, camera);
    renderer.render(scene, camera);
    loadShelf().then(() => scheduleSnap());
    requestAnimationFrame(t => { last = t; loop(t); });
  </script>
</body>
</html>
