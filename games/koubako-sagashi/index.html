      floor.scale.set(RW + 10, RD + 10, 1); floor.material.map.repeat.set((RW + 10) / TATAMI_W, (RD + 10) / TATAMI_D); floor.position.z = 0;
      backWall.scale.set(RW + 10, 10, 1); backWall.position.set(0, 5, -RD / 2 - 0.5); backWall.material.map.repeat.set((RW + 10) / 4, 3);
      tokonoma.position.set(0, 0, -RD / 2 - 0.5);
      sideL.scale.set(RD + 10, 5, 1); sideL.rotation.y = Math.PI / 2; sideL.position.set(-RW / 2 - 1, 2.5, 3);
      sideR.scale.set(RD + 10, 5, 1); sideR.rotation.y = -Math.PI / 2; sideR.position.set(RW / 2 + 1, 2.5, 3);
      sideL.material.map.repeat.set((RD + 10) / 2, 1);
      sun.position.set(-FW * 0.4 - 6, 18, FD * 0.25 + 8); sun.target.position.set(0, 0, 0);
      const sc = sun.shadow.camera, R = Math.max(FW, FD) / 2 + 3;
      Object.assign(sc, { left: -R, right: R, top: R, bottom: -R, near: 1, far: 80 }); sc.updateProjectionMatrix();
      state = 'ready'; startT = 0; finalT = 0; fly = null; ring.visible = false;
      $('result').hidden = true; $('card').hidden = false;
      resize();
      view.tx = 0; view.tz = view.tz0; view.d = view.dMax; vel.x = vel.z = 0; applyCamera();
      updClock(0);
    }

    // ---------- カメラ ----------
    const PITCH = THREE.MathUtils.degToRad(56);
    const view = { tx: 0, tz: 0, d: 30, dMin: 3, dMax: 30, tz0: 0 };
    const vel = { x: 0, z: 0 };
    let fly = null, rect = { x0: 0, y0: 0, x1: 1, y1: 1 }, cardRect = { x: 0, y: 0, s: 100 };
    function applyCamera() {
      camera.position.set(view.tx, Math.sin(PITCH) * view.d, view.tz + Math.cos(PITCH) * view.d);
      camera.lookAt(view.tx, 0, view.tz);
      camera.updateMatrixWorld();
      scene.fog.near = view.d * 1.2; scene.fog.far = view.d * 3.5 + 10;
    }
    function clampView() {
      view.d = Math.min(view.dMax, Math.max(view.dMin, view.d));
      // 引くほど真ん中に寄せる（いちばん引いたら全体がちょうど入る）
      const k = Math.min(1, Math.max(0, (view.dMax - view.d) / (view.dMax - view.dMin) * 1.6));
      const hx = FW / 2 * k, hz = FD / 2 * k;
      const cz = view.tz0 * (1 - k);
      view.tx = Math.min(hx, Math.max(-hx, view.tx));
      view.tz = Math.min(cz + hz, Math.max(cz - hz, view.tz));
    }
    // 畑（猫の並び）の四隅を写したときの、画面上の範囲（-1〜1 が並べる範囲）
    const corner = new THREE.Vector3();
    function extent(d, tz) {
      const save = { tx: view.tx, tz: view.tz, d: view.d };
      view.tx = 0; view.tz = tz; view.d = d; applyCamera();
      // setViewOffset のぶんを外して、並べる範囲だけで測る
      const e = { x0: 9, x1: -9, y0: 9, y1: -9 };
      const W = innerWidth, H = innerHeight, fw = rect.x1 - rect.x0, fh = rect.y1 - rect.y0;
      for (const x of [-FW / 2 - 0.5, FW / 2 + 0.5]) for (const z of [-FD / 2 - 0.5, FD / 2 + 0.5]) for (const y of [0, 0.5]) {
        corner.set(x, y, z).project(camera);
        const px = (corner.x + 1) / 2 * W, py = (1 - corner.y) / 2 * H;
        const nx = (px - rect.x0) / fw * 2 - 1, ny = 1 - (py - rect.y0) / fh * 2;
        e.x0 = Math.min(e.x0, nx); e.x1 = Math.max(e.x1, nx); e.y0 = Math.min(e.y0, ny); e.y1 = Math.max(e.y1, ny);
      }
      Object.assign(view, save);
      return e;
    }
    const shortWide = () => innerHeight <= 520 && innerWidth / innerHeight >= 4 / 3;
    function resize() {
      const W = innerWidth, H = innerHeight;
      renderer.setSize(W, H, false);
      const top = 50, bottom = 80;
      // お手本のカード: 縦長は上のまんなか、横長は右上
      const wide = W / H > 1.1;
      const s = Math.round(Math.max(96, Math.min(wide ? H * 0.36 : W * 0.34, wide ? 230 : (H - top - bottom) * 0.24, 220)));
      cardRect = wide ? { x: W - s - 18, y: top + 8, s } : { x: Math.round((W - s) / 2), y: top + 6, s };
      Object.assign($('card').style, { left: cardRect.x - 4 + 'px', top: cardRect.y - 4 + 'px', width: s + 8 + 'px', height: s + 8 + 'px' });
      // 猫を並べる範囲（カード・上の帯・下の空白を除く）
      if (state === 'done' || state === 'found') {
        rect = shortWide() ? { x0: W * 0.46, y0: top, x1: W, y1: H - bottom }
                           : { x0: 0, y0: Math.min(H * 0.5, top + Math.max(80, H * 0.16)), x1: W, y1: H - bottom - 70 };
      } else rect = wide ? { x0: 0, y0: top, x1: W - s - 30, y1: H - bottom } : { x0: 0, y0: cardRect.y + s + 32, x1: W, y1: H - bottom };
      const fw = Math.max(80, rect.x1 - rect.x0), fh = Math.max(80, rect.y1 - rect.y0);
      camera.aspect = fw / fh;
      camera.setViewOffset(fw, fh, -rect.x0, -rect.y0, W, H);
      camera.updateProjectionMatrix();
      // 全体がちょうど入る距離と、そのときの見る位置（手前ほど大きく見えるので、角を写して確かめる）
      const fit = d => {
        // 上下の余りが同じになる位置を探す
        let lo = -FD, hi = FD;
        for (let k = 0; k < 20; k++) { const tz = (lo + hi) / 2, e = extent(d, tz); if (e.y0 + e.y1 > 0) hi = tz; else lo = tz; }
        return { tz: (lo + hi) / 2, e: extent(d, (lo + hi) / 2) };
      };
      let lo = 2, hi = 200;
      for (let k = 0; k < 24; k++) { const d = (lo + hi) / 2, f = fit(d); if (Math.max(-f.e.x0, f.e.x1, -f.e.y0, f.e.y1) > 1) lo = d; else hi = d; }
      view.dMax = hi; view.tz0 = fit(hi).tz;
      const tv = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2), th = tv * camera.aspect;
      // いちばん寄ると、狭い方の向きに猫が2匹半くらい
      view.dMin = 2.6 / (2 * Math.min(tv, th));
      if (view.dMin > view.dMax * 0.8) view.dMin = view.dMax * 0.8;
      clampView(); applyCamera();
    }
    addEventListener('resize', () => { resize(); });

    // ---------- 入力 ----------
    const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -0.2);
    function floorAt(x, y, out = new THREE.Vector3()) {
      ndc.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1);
      ray.setFromCamera(ndc, camera);
      return ray.ray.intersectPlane(floorPlane, out) || out.set(view.tx, 0, view.tz);
    }
    function pickCat(x, y) {
      ndc.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1);
      ray.setFromCamera(ndc, camera);
      const o = ray.ray.origin, d = ray.ray.direction;
      let bestI = -1, bestT = Infinity;
      for (let i = 0; i < MAXN; i++) {
        const b = base[i];
        const px = b.x - o.x, py = 0.25 - o.y, pz = b.z - o.z;
        const tt = px * d.x + py * d.y + pz * d.z;
        const qx = px - d.x * tt, qy = py - d.y * tt, qz = pz - d.z * tt;
        if (qx * qx + qy * qy + qz * qz < 0.36 * 0.36 && tt < bestT) { bestT = tt; bestI = i; }
      }
      return bestI;
    }
    function zoomAt(x, y, factor) {
      const a = floorAt(x, y);
      view.d *= factor; clampView(); applyCamera();
      const b = floorAt(x, y);
      view.tx += a.x - b.x; view.tz += a.z - b.z; clampView(); applyCamera();
    }
    function panBy(x0, y0, x1, y1) {
      const a = floorAt(x0, y0), b = floorAt(x1, y1);
      view.tx += a.x - b.x; view.tz += a.z - b.z; clampView(); applyCamera();
      return { x: a.x - b.x, z: a.z - b.z };
    }
    const ptrs = new Map();
    let gesture = null; // { moved, t, multi }
    const begin = () => { if (state === 'ready') { state = 'play'; startT = performance.now(); } };
    cv.addEventListener('pointerdown', e => {
      if (state === 'found' || state === 'done') return;
      cv.setPointerCapture(e.pointerId);
      ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY });
      if (ptrs.size === 1) gesture = { moved: 0, t: performance.now(), multi: false };
      else if (gesture) gesture.multi = true;
      vel.x = vel.z = 0;
      begin();
    });
    cv.addEventListener('pointermove', e => {
      const p = ptrs.get(e.pointerId); if (!p) return;
      if (ptrs.size === 1) {
        const mv = panBy(p.x, p.y, e.clientX, e.clientY);
        vel.x = vel.x * 0.5 + mv.x * 0.5 * 60; vel.z = vel.z * 0.5 + mv.z * 0.5 * 60;
      } else if (ptrs.size === 2) {
        const [a, b] = [...ptrs.values()];
        const o = a === p ? b : a;
        const d0 = Math.hypot(p.x - o.x, p.y - o.y), d1 = Math.hypot(e.clientX - o.x, e.clientY - o.y);
        const mx0 = (p.x + o.x) / 2, my0 = (p.y + o.y) / 2, mx1 = (e.clientX + o.x) / 2, my1 = (e.clientY + o.y) / 2;
        if (d0 > 10 && d1 > 10) zoomAt(mx0, my0, d0 / d1);
        panBy(mx0, my0, mx1, my1);
      }
      if (gesture) gesture.moved = Math.max(gesture.moved, Math.hypot(e.clientX - p.sx, e.clientY - p.sy));
      p.x = e.clientX; p.y = e.clientY;
    });
    function endPtr(e) {
      const p = ptrs.get(e.pointerId); if (!p) return;
      ptrs.delete(e.pointerId);
      if (ptrs.size === 0 && gesture) {
        if (!gesture.multi && gesture.moved < 10 && performance.now() - gesture.t < 600) { vel.x = vel.z = 0; choose(e.clientX, e.clientY); }
        gesture = null;
      }
      // 2本指から1本指に戻ったら、残った指の位置から続ける
      for (const q of ptrs.values()) { q.sx = q.x; q.sy = q.y; }
    }
    cv.addEventListener('pointerup', endPtr);
    cv.addEventListener('pointercancel', e => { ptrs.delete(e.pointerId); gesture = null; });
    cv.addEventListener('wheel', e => {
      e.preventDefault();
      if (state === 'found' || state === 'done') return;
      begin();
      zoomAt(e.clientX, e.clientY, Math.exp(e.deltaY * (e.deltaMode ? 0.05 : 0.0015)));
    }, { passive: false });
    const keys = new Set();
    addEventListener('keydown', e => {
      if (e.target.closest?.('select')) return;
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', '+', '-', '=', '_'].includes(e.key)) { e.preventDefault(); keys.add(e.key); if (state !== 'found' && state !== 'done') begin(); }
    });
    addEventListener('keyup', e => keys.delete(e.key));
    addEventListener('blur', () => keys.clear());

    function choose(x, y) {
      if (state !== 'play') return;
      const i = pickCat(x, y);
      if (i < 0) { tap(); return; }
      if (i === targetIdx) found(i);
      else {
        // ちがう猫: シャーと怒ってふくらむ（時間は増えない）
        anims.set(i, { type: 'angry', t: 0 });
        hiss();
        burst(new THREE.Vector3(base[i].x, 0.45, base[i].z), '#c9b7a0', 8, 0.6, 1.0);
      }
    }
    const elapsed = () => state === 'play' ? (performance.now() - startT) / 1000 : state === 'ready' ? 0 : finalT;
    function found(i) {
      finalT = elapsed();
      state = 'found';
      anims.set(i, { type: 'happy', t: 0 });
      meow(0.5, 620); setTimeout(chime, 250); setTimeout(() => meow(0.45, 700), 900);
      burst(new THREE.Vector3(base[i].x, 0.5, base[i].z), '#ffd84a', 30, 1.2, 2.2);
      $('card').hidden = true;
      ring.position.set(base[i].x, 0.012, base[i].z); ring.visible = true; ring.userData.t = 0;
      resize();
      fly = { t: 0, from: { ...view }, to: { tx: base[i].x, tz: base[i].z, d: Math.max(view.dMin * 1.05, Math.min(view.dMax, 3.2)) } };
      setTimeout(finish, 1500);
    }
    function finish() {
      state = 'done';
      if (best === null || finalT < best) { best = finalT; store.set('best', best); }
      $('result').hidden = false;
      resize();
      snapPending = true;
      showResult();
    }
    $('again').onclick = () => { newGame(); tap(); };

    // ---------- 結果と共有 ----------
    const coarse = matchMedia('(pointer: coarse)').matches;
    // 時間は 00:00（分:秒）で出す
    const secs = v => { const n = Math.min(5999, Math.floor(v)); return `${String(Math.floor(n / 60)).padStart(2, '0')}:${String(n % 60).padStart(2, '0')}`; };
    function showResult() {
      $('rTime').textContent = L[lang].sec(secs(finalT));
      $('rBest').textContent = `${t('best')} ${L[lang].sec(secs(best))}`;
      const a = $('share');
      a.href = `https://x.com/intent/post?text=${encodeURIComponent(L[lang].post(secs(finalT)))}&url=${encodeURIComponent(URL_)}`;
      if (coarse) { a.removeAttribute('target'); a.removeAttribute('rel'); } else { a.target = '_blank'; a.rel = 'noopener'; }
      prepareShare();
    }
    $('share').addEventListener('click', e => {
      const text = `${L[lang].post(secs(finalT))}\n${URL_}`;
      if (coarse && navigator.share) {
        e.preventDefault();
        const file = shareFile();
        navigator.share(file && navigator.canShare?.({ files: [file] }) ? { files: [file], text } : { text }).catch(() => {});
        return;
      }
      const img = resultImage();
      if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'koubako-sagashi.png'; d.click(); }
    });
    let snap = null, snapPending = false, shareCache = null;
    // 見つけた猫を真ん中にして正方形に切り抜く（描いた直後に写す）
    function takeSnap() {
      const dpr = cv.width / innerWidth;
      const cx = (rect.x0 + rect.x1) / 2, cy = (rect.y0 + rect.y1) / 2;
      const side = Math.min(innerWidth, innerHeight, Math.max(rect.x1 - rect.x0, rect.y1 - rect.y0) * 1.1);
      const sx = Math.max(0, Math.min(innerWidth - side, cx - side / 2)), sy = Math.max(0, Math.min(innerHeight - side, cy - side / 2));
      snap = document.createElement('canvas'); snap.width = snap.height = 1080;
      snap.getContext('2d').drawImage(cv, sx * dpr, sy * dpr, side * dpr, side * dpr, 0, 0, 1080, 1080);
      shareCache = null;
      prepareShare();
    }
    function resultImage() {
      if (!snap) return null;
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const g = c.getContext('2d');
      g.drawImage(snap, 0, 0);
      g.textAlign = 'center'; g.lineJoin = 'round';
      const font = px => `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans Thai", sans-serif`;
      const text = (str, y, px, max, fill, line) => {
        g.font = font(px);
        const w = g.measureText(str).width; if (w > max) { px *= max / w; g.font = font(px); }
        g.lineWidth = px * 0.16; g.strokeStyle = line; g.strokeText(str, 540, y); g.fillStyle = fill; g.fillText(str, 540, y);
      };
      text(L[lang].sec(secs(finalT)), 230, 190, 960, '#3a2a1a', '#fff8e8');
      text(t('title'), 1030, 60, 900, '#fff8e8', '#3a2a1a');
      return c;
    }
    function prepareShare() {
      if (!snap) return;
      const key = lang;
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'koubako-sagashi.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;

    // ---------- 時計（経過時間を 00:00 で） ----------
    let lastClock = '';
    function updClock(sec) {
      const str = secs(sec);
      if (str !== lastClock) { lastClock = str; $('clock').textContent = str; }
    }

    // ---------- ループ ----------
    let last = performance.now(), ambient = 4;
    const ease = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      uniforms.uTime.value = now / 1000;
      // キー操作
      if (keys.size && (state === 'play' || state === 'ready')) {
        const sp = view.d * 0.7 * dt;
        if (keys.has('ArrowLeft')) view.tx -= sp; if (keys.has('ArrowRight')) view.tx += sp;
        if (keys.has('ArrowUp')) view.tz -= sp; if (keys.has('ArrowDown')) view.tz += sp;
        if (keys.has('+') || keys.has('=')) view.d *= Math.exp(-1.5 * dt);
        if (keys.has('-') || keys.has('_')) view.d *= Math.exp(1.5 * dt);
        clampView(); applyCamera();
      }
      // 指を離したあとの惰性
      if (!ptrs.size && (vel.x || vel.z)) {
        view.tx += vel.x * dt; view.tz += vel.z * dt;
        const f = Math.exp(-6 * dt); vel.x *= f; vel.z *= f;
        if (Math.hypot(vel.x, vel.z) < 0.02) vel.x = vel.z = 0;
        clampView(); applyCamera();
      }
      if (fly) {
        fly.t = Math.min(1, fly.t + dt / 0.9);
        const k = ease(fly.t);
        view.tx = fly.from.tx + (fly.to.tx - fly.from.tx) * k;
        view.tz = fly.from.tz + (fly.to.tz - fly.from.tz) * k;
        view.d = fly.from.d + (fly.to.d - fly.from.d) * k;
        applyCamera();
        if (fly.t >= 1) fly = null;
      }
      // 動いている猫
      if (anims.size) {
        for (const [i, a] of anims) {
          a.t += dt;
          if (a.type === 'angry') {
            const k = Math.min(1, a.t / 0.8), puff = Math.sin(Math.min(1, a.t / 0.15) * Math.PI / 2) * (1 - k);
            placeMatrix(i, 0, Math.sin(a.t * 50) * 0.15 * (1 - k), 1 + 0.18 * puff, 1 + 0.1 * puff);
            if (a.t >= 0.8) { placeMatrix(i); anims.delete(i); }
          } else {
            // 見つかった猫: ぴょんぴょん跳ねてこっちを向く
            const turn = -base[i].yaw * Math.min(1, a.t * 3);
            const hop = Math.abs(Math.sin(a.t * 7)) * 0.28 * Math.max(0.25, 1 - a.t * 0.3);
            const sq = 1 + Math.cos(a.t * 14) * 0.06;
            placeMatrix(i, hop, turn, 1, sq);
          }
        }
        cats.instanceMatrix.needsUpdate = true;
      }
      updSparks(dt);
      if (ring.visible) { ring.userData.t += dt; const k = ring.userData.t; ring.scale.setScalar(1 + Math.sin(k * 5) * 0.06); ring.material.opacity = 0.65 + Math.sin(k * 5) * 0.25; }
      // ときどき、どこかの猫が小さく鳴く
      if (state === 'play') { ambient -= dt; if (ambient <= 0) { ambient = 5 + Math.random() * 8; meow(0.05, 450 + Math.random() * 300); } }
      if (state === 'play' || state === 'ready') updClock(elapsed());

      // 描画
      renderer.setScissorTest(false);
      renderer.setViewport(0, 0, innerWidth, innerHeight);
      renderer.clear();
      renderer.render(scene, camera);
      if (snapPending) { snapPending = false; takeSnap(); }
      if (!$('card').hidden) {
        const { x, y, s } = cardRect, yb = innerHeight - y - s;
        sPivot.rotation.y = Math.sin(now / 1000 * 0.7) * 0.85;
        sCam.aspect = 1; sCam.updateProjectionMatrix();
        sCam.position.set(0, Math.sin(PITCH) * 2.6 + 0.2, Math.cos(PITCH) * 2.6 + 0.05);
        sCam.lookAt(0, 0.2, 0.02);
        renderer.setScissorTest(true);
        renderer.setScissor(x, yb, s, s); renderer.setViewport(x, yb, s, s);
        renderer.render(sScene, sCam);
      }
      requestAnimationFrame(frame);
    }
    if (location.hash === '#debug') window.__dbg = { get targetIdx() { return targetIdx; }, base, view, applyCamera, camera, choose, get state() { return state; } };
    newGame(); applyLang();
    renderer.compile(scene, camera); renderer.compile(sScene, sCam);
    requestAnimationFrame(frame);
  </script>
</body>
