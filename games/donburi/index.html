<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>どんぶり屋</title>
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <!-- X などにURLを貼ったときのカード表示（ここだけは https:// から書く） -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ふるかわけい面白チャンネル">
  <meta property="og:title" content="どんぶり屋">
  <meta property="og:url" content="https://keifurukawafunnych.com/games/donburi/">
  <meta property="og:image" content="https://keifurukawafunnych.com/games/donburi/icon.png">
  <meta name="twitter:card" content="summary">
  <style>
    html, body { margin: 0; height: 100%; background: #f4e3c8; color: #4a2a12; }
    body {
      display: flex; flex-direction: column; height: 100dvh;
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic UI", system-ui, sans-serif;
      overflow: hidden; touch-action: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; width: 100%; max-width: 560px; margin: 0 auto; box-sizing: border-box;
    }
    header a { color: #b0401c; text-decoration: none; font-weight: bold; }
    .hbtns { display: flex; gap: 6px; }
    #lang { font-size: 15px; padding: 0 10px; }
    .pill {
      font-size: 20px; background: #fff; border: 2px solid #e2c08f; border-radius: 999px;
      min-width: 44px; height: 36px; cursor: pointer; font-weight: bold; color: #a3441a;
    }
    main {
      flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column;
      padding-bottom: calc(80px + env(safe-area-inset-bottom));
    }
    #stage { flex: 1; min-height: 0; position: relative; touch-action: none; }
    #stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
    #hud {
      position: absolute; top: 4px; left: 12px; right: 12px; display: flex; justify-content: space-between;
      align-items: center; font-weight: bold; font-size: 22px; pointer-events: none; z-index: 2;
      text-shadow: 0 2px 0 #fff;
    }
    #strikes { display: flex; gap: 4px; }
    #strikes i { width: 18px; height: 18px; border-radius: 50%; border: 3px solid #c43a2a; box-sizing: border-box; }
    #strikes i.on { background: #c43a2a; }
    #bubble {
      position: absolute; z-index: 2; transform: translate(-50%, -100%); pointer-events: none;
      background: #fff; border-radius: 16px; padding: 8px 14px 10px; font-weight: bold; font-size: 22px;
      white-space: nowrap; box-shadow: 0 3px 0 #d8b98c; text-align: center;
    }
    #bubble::after {
      content: ""; position: absolute; left: 50%; bottom: -10px; margin-left: -8px;
      border: 8px solid transparent; border-top-color: #fff; border-bottom: 0;
    }
    #bubble[hidden] { display: none; }
    #bubble.angry { background: #ffe1da; color: #c43a2a; }
    #bubble.angry::after { border-top-color: #ffe1da; }
    #gauge { height: 6px; background: #eee; border-radius: 3px; margin-top: 6px; overflow: hidden; }
    #gauge div { height: 100%; background: #5bb85a; width: 100%; }
    #ctrl { display: flex; gap: 10px; justify-content: center; padding: 6px 12px; }
    #ctrl button { width: min(160px, 42%); margin: 0; }
    #tray {
      display: flex; justify-content: center; gap: 4px; padding: 6px 8px;
      background: #8a5a32; box-shadow: inset 0 4px 0 #6d4424;
    }
    #tray canvas {
      width: min(13vw, 68px); height: min(13vw, 68px); background: #f8ecd6; border-radius: 14px;
      cursor: grab; touch-action: none;
    }
    #tray canvas.used { opacity: .5; }
    .overlay {
      position: absolute; inset: 0; z-index: 4; display: flex; align-items: center; justify-content: center;
      padding: 12px 12px calc(80px + env(safe-area-inset-bottom)); box-sizing: border-box;
      background: rgba(244, 227, 200, .55);
    }
    .overlay[hidden] { display: none; }
    .panel {
      background: #fff; border-radius: 24px; padding: 20px 16px; width: 100%; max-width: 360px;
      box-sizing: border-box; text-align: center; box-shadow: 0 6px 0 #e2c08f;
    }
    .panel h1 { margin: 0 0 6px; font-size: 40px; }
    #rMoney { font-size: 60px; font-weight: bold; line-height: 1.1; }
    #rServed { font-size: 18px; margin: 4px 0; color: #8a5a32; font-weight: bold; }
    #rMsg { font-size: 20px; font-weight: bold; margin: 6px 0 4px; }
    .big {
      font: inherit; font-size: 22px; font-weight: bold; padding: 12px 8px; border-radius: 18px;
      border: none; cursor: pointer; color: #fff; background: #d9532a; width: 100%;
      box-shadow: 0 4px 0 #94321a; touch-action: manipulation; margin-top: 10px;
      display: block; text-align: center; text-decoration: none; box-sizing: border-box;
    }
    .big:active { transform: translateY(3px); box-shadow: 0 1px 0 #94321a; }
    .big.sub { background: #fff; color: #8a5a32; box-shadow: 0 4px 0 #e2c08f; border: 2px solid #e2c08f; }
    .big.x { background: #222; box-shadow: 0 4px 0 #000; }
    #err { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; font-weight: bold; z-index: 9; }
  </style>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
    } }
  </script>
</head>
<body>
  <header>
    <a href="../../" id="back">← トップへ戻る</a>
    <div class="hbtns"><button id="lang" class="pill">EN</button><button id="sound" class="pill" aria-label="音のオン/オフ"></button></div>
  </header>
  <main>
    <div id="stage">
      <div id="hud"><span id="money">0円</span><span id="time">90秒</span><span id="strikes"><i></i><i></i><i></i></span></div>
      <div id="bubble" hidden><div id="order"></div><div id="gauge"><div></div></div></div>
    </div>
    <div id="ctrl"><button id="reset" class="big sub"></button><button id="serve" class="big"></button></div>
    <div id="tray"></div>
    <div id="title" class="overlay"><div class="panel"><h1 id="tTitle"></h1><button id="start" class="big"></button></div></div>
    <div id="result" class="overlay" hidden>
      <div class="panel">
        <div id="rMoney"></div>
        <div id="rServed"></div>
        <div id="rMsg"></div>
        <div id="shareBox"></div>
        <button id="retry" class="big"></button>
      </div>
    </div>
    <div id="err">読み込みに失敗しました。通信を確認して再読み込みしてください。</div>
  </main>
  <script>
    // CDN が読めないときに一言出す
    setTimeout(() => { if (!window.__ok) document.getElementById('err').style.display = 'flex'; }, 10000);
  </script>
  <script type="module">
    import * as THREE from 'three';
    import * as CANNON from 'cannon-es';
    window.__ok = true;

    const SHARE_URL = 'https://keifurukawafunnych.com/games/donburi/';
    const GAME_TIME = 90;
    const ICON_MODE = new URLSearchParams(location.search).has('icon');

    const store = {
      get(k, d) { try { const v = localStorage.getItem('donburi:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
      set(k, v) { try { localStorage.setItem('donburi:' + k, JSON.stringify(v)); } catch {} },
    };

    // ---- 注文 ----
    const RECIPES = {
      oyako: ['chicken', 'egg'],
      gyu: ['cow'],
      buta: ['pig'],
      katsu: ['pig', 'egg'],
      ten: ['shrimp'],
      kaisen: ['tuna', 'shrimp', 'squid'],
    };
    const ITEMS = ['chicken', 'egg', 'cow', 'pig', 'shrimp', 'tuna', 'squid'];

    // ---- 言語 ----
    const L = {
      ja: {
        title: 'どんぶり屋', back: '← トップへ戻る', lang: 'EN', langLabel: 'Switch to English',
        yen: n => `${n}円`, sec: n => `${n}秒`,
        start: 'スタート', serve: '出す', reset: 'やり直し', retry: 'もう一度', share: 'Xに投稿',
        oyako: '親子丼', gyu: '牛丼', buta: '豚丼', katsu: 'カツ丼', ten: '天丼', kaisen: '海鮮丼',
        yum: 'おいしい！', wrong: 'ちがう！帰る！', late: 'おそい！帰る！',
        served: n => `${n}杯 提供`,
        msg: m => m < 300 ? '店をたたもう' : m < 800 ? 'まあまあの店' : m < 1500 ? '繁盛店' : '行列のできる店',
        shareText: (n, m) => `どんぶり屋で${n}杯出して${m}円かせいだ！ #どんぶり屋`,
      },
      en: {
        title: 'Donburi Shop', back: '← Top', lang: '日本語', langLabel: '日本語に切り替え',
        yen: n => `¥${n}`, sec: n => `${n}s`,
        start: 'Start', serve: 'Serve', reset: 'Redo', retry: 'Play again', share: 'Post on X',
        oyako: 'Chicken & Egg Bowl', gyu: 'Beef Bowl', buta: 'Pork Bowl', katsu: 'Katsu Bowl', ten: 'Tempura Bowl', kaisen: 'Seafood Bowl',
        yum: 'Delicious!', wrong: 'Wrong! I\'m leaving!', late: 'Too slow! Bye!',
        served: n => `${n} bowls served`,
        msg: m => m < 300 ? 'Time to close the shop' : m < 800 ? 'A decent shop' : m < 1500 ? 'A busy shop' : 'People line up for you',
        shareText: (n, m) => `I served ${n} bowls and earned ¥${m} at the Donburi Shop! #DonburiShop`,
      },
    };
    let lang = store.get('lang', navigator.language.startsWith('ja') ? 'ja' : 'en');
    if (!L[lang]) lang = 'ja';
    const t = k => L[lang][k];
    const $ = id => document.getElementById(id);
    const langBtn = $('lang');
    function applyLang() {
      document.documentElement.lang = lang;
      document.title = t('title');
      $('back').textContent = t('back');
      langBtn.textContent = t('lang'); langBtn.setAttribute('aria-label', t('langLabel'));
      $('tTitle').textContent = t('title');
      $('start').textContent = t('start');
      $('serve').textContent = t('serve');
      $('reset').textContent = t('reset');
      $('retry').textContent = t('retry');
      updateBubbleText();
      hud();
      if (result) showResult();
    }
    langBtn.onclick = () => { lang = lang === 'ja' ? 'en' : 'ja'; store.set('lang', lang); applyLang(); };

    // ---- 音 ----
    let soundOn = store.get('sound', true);
    const soundBtn = $('sound');
    const SPEAKER = '<path d="M4 9h3l4-4v14l-4-4H4z" fill="currentColor"/>';
    const updateSoundBtn = () => {
      soundBtn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="vertical-align:middle">${SPEAKER}${
        soundOn ? '<path d="M15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12"/>' : '<path d="M16 9l5 6M21 9l-5 6"/>'}</svg>`;
    };
    soundBtn.onclick = () => { soundOn = !soundOn; store.set('sound', soundOn); updateSoundBtn(); };
    updateSoundBtn();
    let ac = null;
    function audio() {
      if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } }
      if (ac.state === 'suspended') ac.resume();
      return ac;
    }
    function tone(type, f1, f2, dur, vol, delay = 0) {
      if (!soundOn) return;
      const a = audio(); if (!a) return;
      const o = a.createOscillator(), g = a.createGain(), now = a.currentTime + delay;
      o.type = type;
      o.frequency.setValueAtTime(f1, now); o.frequency.exponentialRampToValueAtTime(f2, now + dur);
      g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      o.connect(g).connect(a.destination); o.start(now); o.stop(now + dur + 0.01);
    }
    const sPick = () => tone('triangle', 500, 900, 0.07, 0.15);
    const sLand = v => tone('sine', 220, 90, 0.12, Math.min(0.4, v * 0.06));
    const sGood = () => { tone('triangle', 880, 880, 0.12, 0.2); tone('triangle', 1320, 1320, 0.2, 0.2, 0.1); };
    const sBad = () => tone('sawtooth', 220, 110, 0.4, 0.2);

    // ---- 3D ----
    const stage = $('stage');
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: ICON_MODE });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    renderer.shadowMap.enabled = true;
    stage.prepend(renderer.domElement);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#f4e3c8');
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
    scene.add(new THREE.HemisphereLight('#fff8ee', '#a07850', 1.6));
    const sun = new THREE.DirectionalLight('#ffffff', 1.6);
    sun.position.set(3, 8, 5); sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5 });
    scene.add(sun);

    const mat = c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.7 });
    function part(geo, color, x = 0, y = 0, z = 0, sx = 1, sy = 1, sz = 1) {
      const m = new THREE.Mesh(geo, typeof color === 'string' ? mat(color) : color);
      m.position.set(x, y, z); m.scale.set(sx, sy, sz); m.castShadow = true;
      return m;
    }
    const S = r => new THREE.SphereGeometry(r, 20, 14);

    // 店：カウンター・壁・床
    const counter = part(new THREE.BoxGeometry(9, 1.6, 4.4), '#c99a62', 0, -0.8, 0.2);
    counter.receiveShadow = true; scene.add(counter);
    const wall = part(new THREE.PlaneGeometry(30, 12), '#e9d2ac', 0, 2, -6);
    scene.add(wall);
    const floor = part(new THREE.PlaneGeometry(30, 12), '#9c7448', 0, -2.2, -2);
    floor.rotation.x = -Math.PI / 2; scene.add(floor);
    // のれん
    for (let i = -2; i <= 2; i++) scene.add(part(new THREE.BoxGeometry(1.5, 1.4, 0.05), '#2c4a7a', i * 1.6, 4.3, -5.9));

    // 丼
    const BOWL = new THREE.Vector3(0, 0, 0.6);
    const bowl = new THREE.Group();
    const prof = [[0.55, 0], [0.62, 0.1], [0.78, 0.14], [1.0, 0.35], [1.22, 0.65], [1.36, 0.95], [1.42, 0.98]]
      .map(([x, y]) => new THREE.Vector2(x, y));
    const lathe = new THREE.LatheGeometry(prof, 40);
    const outer = new THREE.Mesh(lathe, new THREE.MeshStandardMaterial({ color: '#29457a', roughness: 0.4, side: THREE.FrontSide }));
    const inner = new THREE.Mesh(lathe, new THREE.MeshStandardMaterial({ color: '#fbf6ec', roughness: 0.4, side: THREE.BackSide }));
    outer.castShadow = true;
    bowl.add(outer, inner);
    bowl.add(part(new THREE.CylinderGeometry(0.62, 0.62, 0.02, 40), '#fbf6ec', 0, 0.01, 0));
    const rice = part(S(1), '#ffffff', 0, 0.3, 0, 1.05, 0.16, 1.05);
    rice.receiveShadow = true; bowl.add(rice);
    bowl.position.copy(BOWL);
    scene.add(bowl);

    // ---- 動物 ----
    const BUILD = {
      chicken() {
        const g = new THREE.Group();
        g.add(part(S(0.36), '#ffffff', 0, 0, 0, 1, 0.9, 1.15));
        g.add(part(S(0.2), '#ffffff', 0, 0.3, 0.25));
        g.add(part(S(0.08), '#e0302a', 0, 0.5, 0.25, 0.8, 1, 1.6));
        g.add(part(S(0.05), '#e0302a', 0, 0.2, 0.43, 1, 1.5, 1));
        const beak = part(new THREE.ConeGeometry(0.06, 0.16, 8), '#f0a020', 0, 0.3, 0.48); beak.rotation.x = Math.PI / 2; g.add(beak);
        g.add(part(S(0.035), '#111', 0.1, 0.36, 0.4), part(S(0.035), '#111', -0.1, 0.36, 0.4));
        g.add(part(S(0.16), '#ffffff', 0, 0.18, -0.36, 0.6, 1.2, 0.8));
        return [g, 0.4];
      },
      egg() {
        const g = new THREE.Group();
        g.add(part(S(0.26), '#fff3dc', 0, 0, 0, 0.85, 1.1, 0.85));
        return [g, 0.27];
      },
      cow() {
        const g = new THREE.Group();
        g.add(part(S(0.4), '#ffffff', 0, 0, 0, 1.05, 0.9, 1.2));
        [[0.25, 0.15, 0.1], [-0.3, 0.05, -0.15], [0.05, 0.3, -0.25], [-0.15, -0.1, 0.3]].forEach(([x, y, z]) =>
          g.add(part(S(0.13), '#222', x, y, z, 1, 0.6, 1)));
        g.add(part(S(0.24), '#ffffff', 0, 0.2, 0.45));
        g.add(part(S(0.15), '#f2a8b0', 0, 0.12, 0.64, 1.2, 0.8, 0.7));
        g.add(part(S(0.035), '#111', 0.1, 0.3, 0.64), part(S(0.035), '#111', -0.1, 0.3, 0.64));
        [1, -1].forEach(s => {
          const h = part(new THREE.ConeGeometry(0.05, 0.18, 8), '#efe2c0', 0.14 * s, 0.46, 0.42); h.rotation.z = -0.4 * s; g.add(h);
          g.add(part(S(0.08), '#222', 0.26 * s, 0.3, 0.4, 1, 0.5, 0.6));
        });
        return [g, 0.48];
      },
      pig() {
        const g = new THREE.Group();
        g.add(part(S(0.4), '#f5a6b6', 0, 0, 0, 1, 0.92, 1.1));
        const sn = part(new THREE.CylinderGeometry(0.12, 0.12, 0.1, 16), '#ee8aa0', 0, 0.02, 0.44); sn.rotation.x = Math.PI / 2; g.add(sn);
        g.add(part(S(0.025), '#7a3040', 0.05, 0.02, 0.5), part(S(0.025), '#7a3040', -0.05, 0.02, 0.5));
        g.add(part(S(0.035), '#111', 0.14, 0.15, 0.37), part(S(0.035), '#111', -0.14, 0.15, 0.37));
        [1, -1].forEach(s => {
          const e = part(new THREE.ConeGeometry(0.09, 0.16, 8), '#ee8aa0', 0.2 * s, 0.37, 0.12); e.rotation.z = -0.5 * s; g.add(e);
        });
        return [g, 0.43];
      },
      shrimp() {
        const g = new THREE.Group();
        const body = part(new THREE.TorusGeometry(0.2, 0.11, 10, 20, Math.PI * 1.3), '#f06a3a');
        body.rotation.y = Math.PI / 2; g.add(body);
        const tail = part(new THREE.ConeGeometry(0.12, 0.18, 8), '#e04a2a', 0, -0.16, -0.18);
        tail.rotation.x = 2.6; g.add(tail);
        g.add(part(S(0.03), '#111', 0.06, 0.12, 0.17), part(S(0.03), '#111', -0.06, 0.12, 0.17));
        [1, -1].forEach(s => {
          const a = part(new THREE.CylinderGeometry(0.01, 0.01, 0.4), '#e04a2a', 0.05 * s, 0.28, 0.3); a.rotation.x = 0.9; g.add(a);
        });
        return [g, 0.33];
      },
      tuna() {
        const g = new THREE.Group();
        g.add(part(S(0.28), '#2b3f6b', 0, 0.03, 0, 0.7, 0.85, 1.55));
        g.add(part(S(0.26), '#c9d2de', 0, -0.06, 0, 0.62, 0.6, 1.45));
        const tail = part(new THREE.ConeGeometry(0.18, 0.2, 4), '#2b3f6b', 0, 0, -0.5, 0.3, 1, 1); tail.rotation.x = Math.PI / 2; g.add(tail);
        const fin = part(new THREE.ConeGeometry(0.08, 0.18, 4), '#f2c230', 0, 0.28, -0.05, 0.3, 1, 1); g.add(fin);
        g.add(part(S(0.04), '#111', 0.15, 0.08, 0.3), part(S(0.04), '#111', -0.15, 0.08, 0.3));
        return [g, 0.4];
      },
      squid() {
        const g = new THREE.Group();
        g.add(part(new THREE.ConeGeometry(0.2, 0.45, 16), '#f6e6e0', 0, 0.3, 0));
        g.add(part(new THREE.ConeGeometry(0.14, 0.1, 3), '#f6e6e0', 0, 0.45, 0, 2.6, 1, 0.3));
        g.add(part(S(0.18), '#f6e6e0', 0, 0, 0));
        g.add(part(S(0.035), '#111', 0.09, 0.02, 0.15), part(S(0.035), '#111', -0.09, 0.02, 0.15));
        for (let i = 0; i < 8; i++) {
          const a = i / 8 * Math.PI * 2;
          const tl = part(new THREE.CylinderGeometry(0.03, 0.015, 0.32), '#f0d0c8', Math.cos(a) * 0.1, -0.24, Math.sin(a) * 0.1);
          tl.rotation.set(Math.sin(a) * 0.3, 0, -Math.cos(a) * 0.3); g.add(tl);
        }
        return [g, 0.36];
      },
    };

    // ---- 棚のアイコン（3Dの動物を小さく描いて画像にする） ----
    const tray = $('tray');
    {
      const r2 = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
      r2.setSize(136, 136);
      const sc = new THREE.Scene();
      sc.add(new THREE.HemisphereLight('#fff8ee', '#a07850', 1.8));
      const dl = new THREE.DirectionalLight('#fff', 1.4); dl.position.set(2, 4, 4); sc.add(dl);
      const cam = new THREE.PerspectiveCamera(35, 1, 0.1, 20);
      ITEMS.forEach(id => {
        const [g, r] = BUILD[id]();
        g.rotation.y = id === 'shrimp' ? 1.1 : 0.6;
        sc.add(g);
        cam.position.set(0, r * 1.6, r * 4.6); cam.lookAt(0, 0.02, 0);
        r2.render(sc, cam);
        const c = document.createElement('canvas'); c.width = c.height = 136; c.dataset.id = id;
        c.getContext('2d').drawImage(r2.domElement, 0, 0);
        tray.appendChild(c);
        sc.remove(g);
      });
      r2.dispose();
    }

    // ---- 物理 ----
    const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -22, 0) });
    world.defaultContactMaterial.friction = 0.35;
    world.defaultContactMaterial.restitution = 0.3;
    world.allowSleep = false;
    const ground = new CANNON.Body({ mass: 0 });
    ground.addShape(new CANNON.Box(new CANNON.Vec3(4.5, 0.8, 2.2)), new CANNON.Vec3(0, -0.8, 0.2));
    world.addBody(ground);
    const bowlBody = new CANNON.Body({ mass: 0 });
    bowlBody.addShape(new CANNON.Cylinder(1.0, 1.0, 0.3, 16), new CANNON.Vec3(0, 0.2, 0));
    {
      const N = 18, tilt = Math.atan2(0.7, 0.85);
      for (let i = 0; i < N; i++) {
        const a = i / N * Math.PI * 2;
        const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(tilt, a, 0, 'YXZ'));
        const r = 1.12, y = 0.55;
        bowlBody.addShape(new CANNON.Box(new CANNON.Vec3(0.24, 0.55, 0.06)),
          new CANNON.Vec3(Math.sin(a) * r, y, Math.cos(a) * r), new CANNON.Quaternion(q.x, q.y, q.z, q.w));
      }
    }
    bowlBody.position.set(BOWL.x, BOWL.y, BOWL.z);
    world.addBody(bowlBody);

    let things = []; // { id, mesh, body }
    let lastLand = 0;
    // held: つかんでいる間は物理世界に入れず、離したときに入れる
    function addThing(id, pos, held = false) {
      const [mesh, r] = BUILD[id]();
      scene.add(mesh);
      const body = new CANNON.Body({ mass: 1, shape: new CANNON.Sphere(r), linearDamping: 0.1, angularDamping: 0.5 });
      body.position.set(pos.x, pos.y, pos.z);
      body.quaternion.setFromEuler(0, Math.random() * Math.PI * 2, 0);
      body.sleepSpeedLimit = 0.3;
      body.addEventListener('collide', e => {
        const v = Math.abs(e.contact.getImpactVelocityAlongNormal());
        const now = performance.now();
        if (v > 2 && now - lastLand > 60) { lastLand = now; sLand(v); }
      });
      if (!held) world.addBody(body);
      const th = { id, mesh, body };
      things.push(th);
      return th;
    }
    function removeThing(th) {
      scene.remove(th.mesh); world.removeBody(th.body);
      things = things.filter(x => x !== th);
    }
    const inBowl = th => {
      const p = th.body.position;
      return Math.hypot(p.x - BOWL.x, p.z - BOWL.z) < 1.3 && p.y > 0 && p.y < 1.5;
    };
    function clearAll() { [...things].forEach(th => { if (th !== drag?.th) removeThing(th); }); }

    // ---- お客さん ----
    const SHIRTS = ['#d9532a', '#3d7bd0', '#4aa36a', '#8a5ab8', '#e0a030', '#444'];
    const HAIRS = ['#2a1a10', '#5a3a20', '#111', '#a0602a', '#ccc'];
    const SKINS = ['#f6d2b0', '#e8b890', '#c99068'];
    let cust = null;
    const pick = a => a[Math.floor(Math.random() * a.length)];
    function makeCustomer() {
      const g = new THREE.Group();
      const skin = mat(pick(SKINS));
      g.add(part(new THREE.CylinderGeometry(0.7, 0.85, 2.4, 20), pick(SHIRTS), 0, -1, 0));
      const head = new THREE.Group(); head.position.y = 0.85; g.add(head);
      head.add(part(S(0.62), skin));
      head.add(part(new THREE.SphereGeometry(0.66, 20, 10, 0, Math.PI * 2, 0, Math.PI * 0.45), pick(HAIRS), 0, 0.04, -0.04));
      head.add(part(S(0.07), '#111', 0.22, 0.05, 0.56), part(S(0.07), '#111', -0.22, 0.05, 0.56));
      const mouth = part(new THREE.TorusGeometry(0.14, 0.035, 8, 16, Math.PI), '#7a2a20', 0, -0.2, 0.57);
      mouth.rotation.z = Math.PI; head.add(mouth);
      const brows = [1, -1].map(s => {
        const b = part(new THREE.BoxGeometry(0.22, 0.05, 0.05), '#2a1a10', 0.22 * s, 0.22, 0.57);
        b.rotation.z = 0.4 * s; b.visible = false; head.add(b); return b;
      });
      g.position.set(-8, 0, -3.2);
      scene.add(g);
      return { g, head, mouth, brows, skin, mood: 'wait' };
    }
    function setMood(c, mood) {
      c.mood = mood;
      if (mood === 'angry') {
        c.skin.color.set('#e86a50');
        c.mouth.rotation.z = 0; c.mouth.position.y = -0.3;
        c.brows.forEach(b => b.visible = true);
      } else if (mood === 'happy') {
        c.mouth.scale.set(1.3, 1.3, 1);
      }
    }

    // ---- ゲーム進行 ----
    let state = 'title', timeLeft = GAME_TIME, money = 0, served = 0, strikes = 0, result = null;
    let order = null, patience = 0, patienceMax = 1, prevOrder = null;
    // phase: in（入ってくる）→ wait（注文中）→ react（反応）→ out（帰る）
    let phase = 'none', phaseT = 0, reaction = null;

    function hud() {
      $('money').textContent = t('yen')(money);
      $('time').textContent = t('sec')(Math.ceil(timeLeft));
      [...$('strikes').children].forEach((el, i) => el.classList.toggle('on', i < strikes));
    }
    function updateBubbleText() {
      if (!order) return;
      $('order').textContent = reaction ? t(reaction) : t(order);
    }
    function nextCustomer() {
      if (cust) scene.remove(cust.g);
      cust = makeCustomer();
      const keys = Object.keys(RECIPES).filter(k => k !== prevOrder);
      order = prevOrder = pick(keys);
      reaction = null;
      patienceMax = patience = Math.max(11, 20 - served * 0.8);
      phase = 'in'; phaseT = 0;
      const b = $('bubble'); b.hidden = true; b.classList.remove('angry');
      updateBubbleText();
    }
    function react(kind) {
      reaction = kind; phase = 'react'; phaseT = 0;
      $('bubble').classList.toggle('angry', kind !== 'yum');
      $('gauge').style.visibility = 'hidden';
      updateBubbleText();
      if (kind === 'yum') {
        setMood(cust, 'happy'); sGood();
        money += 100 + Math.round(patience / patienceMax * 5) * 10;
        served++;
      } else {
        setMood(cust, 'angry'); sBad();
        strikes++;
      }
      hud();
    }
    function serve() {
      if (state !== 'play' || phase !== 'wait') return;
      const got = new Set(things.filter(inBowl).map(th => th.id));
      const need = RECIPES[order];
      const ok = got.size === need.length && need.every(x => got.has(x));
      clearAll();
      react(ok ? 'yum' : 'wrong');
    }
    $('serve').onclick = serve;
    $('reset').onclick = () => { if (state === 'play') clearAll(); };

    function start() {
      audio();
      clearAll();
      state = 'play'; timeLeft = GAME_TIME; money = 0; served = 0; strikes = 0; result = null; prevOrder = null;
      $('title').hidden = true; $('result').hidden = true;
      nextCustomer();
      hud();
    }
    function endGame() {
      state = 'result';
      result = { money, served };
      $('bubble').hidden = true;
      showResult();
      $('result').hidden = false;
    }
    function showResult() {
      const r = result;
      $('rMoney').textContent = t('yen')(r.money);
      $('rServed').textContent = t('served')(r.served);
      $('rMsg').textContent = t('msg')(r.money);
      const box = $('shareBox'); box.textContent = '';
      const a = document.createElement('a');
      a.className = 'big x'; a.textContent = t('share');
      a.href = `https://x.com/intent/post?text=${encodeURIComponent(t('shareText')(r.served, r.money))}&url=${encodeURIComponent(SHARE_URL)}`;
      if (!matchMedia('(pointer: coarse)').matches) { a.target = '_blank'; a.rel = 'noopener'; }
      box.appendChild(a);
    }
    $('start').onclick = start;
    $('retry').onclick = start;

    // ---- ドラッグ ----
    const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
    const HOLD_Y = 1.7, holdPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -HOLD_Y);
    let drag = null;
    // つかんでいる動物の真下に落ちる場所の影を出す
    const marker = new THREE.Mesh(new THREE.CircleGeometry(1, 24), new THREE.MeshBasicMaterial({ color: "#000", transparent: true, opacity: 0.25, depthWrite: false }));
    marker.rotation.x = -Math.PI / 2; marker.visible = false; scene.add(marker);
    const downRay = new THREE.Raycaster(), DOWN = new THREE.Vector3(0, -1, 0);
    function updateMarker() {
      if (!drag) { marker.visible = false; return; }
      const p = drag.th.body.position;
      downRay.set(new THREE.Vector3(p.x, p.y, p.z), DOWN);
      const hit = downRay.intersectObjects([counter, rice, inner, outer], false)[0];
      marker.visible = !!hit;
      if (hit) { marker.position.copy(hit.point).y += 0.02; marker.scale.setScalar(drag.th.body.shapes[0].radius * 0.9); }
    }
    function pointerWorld(e) {
      const r = renderer.domElement.getBoundingClientRect();
      ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      ray.setFromCamera(ndc, camera);
      const p = new THREE.Vector3();
      if (!ray.ray.intersectPlane(holdPlane, p)) return null;
      p.x = THREE.MathUtils.clamp(p.x, -4, 4);
      p.z = THREE.MathUtils.clamp(p.z, -1.8, 2.6);
      return p;
    }
    tray.addEventListener('pointerdown', e => {
      const id = e.target.dataset?.id;
      if (!id || state !== 'play') return;
      e.preventDefault();
      const p = pointerWorld(e) || new THREE.Vector3(0, HOLD_Y, 2);
      const th = addThing(id, p, true);
      drag = { th, pid: e.pointerId, hist: [{ p: p.clone(), t: performance.now() }] };
      sPick();
    });
    addEventListener('pointermove', e => {
      if (!drag || e.pointerId !== drag.pid) return;
      const p = pointerWorld(e); if (!p) return;
      drag.th.body.position.set(p.x, p.y, p.z);
      drag.hist.push({ p, t: performance.now() });
      if (drag.hist.length > 8) drag.hist.shift();
    });
    function release(e) {
      if (!drag || e.pointerId !== drag.pid) return;
      const { th, hist } = drag; drag = null;
      const b = th.body;
      world.addBody(b);
      // 離す直前の手の動きで少し投げる（狙いがずれる原因）
      const now = performance.now(), recent = hist.filter(h => now - h.t < 100);
      let v = new THREE.Vector3();
      if (recent.length >= 2) {
        const a = recent[0], z = recent[recent.length - 1];
        v = z.p.clone().sub(a.p).divideScalar(Math.max(0.03, (now - a.t) / 1000)).multiplyScalar(0.6).clampLength(0, 4);
      }
      b.velocity.set(v.x, 0, v.z);
      b.angularVelocity.set(Math.random() * 4 - 2, Math.random() * 4 - 2, Math.random() * 4 - 2);
    }
    addEventListener('pointerup', release);
    addEventListener('pointercancel', release);

    // ---- 画面サイズ ----
    const LOOK = new THREE.Vector3(0, -0.2, -0.6);
    function resize() {
      if (ICON_MODE) return;
      const w = stage.clientWidth, h = stage.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      const tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
      // 横幅 5.2 が収まる距離（縦長のスマホでは遠ざかる）
      const dist = Math.max(8.2, 2.6 / (tanV * camera.aspect));
      const dir = new THREE.Vector3(0, 0.62, 0.78).normalize();
      camera.position.copy(LOOK).addScaledVector(dir, dist);
      camera.lookAt(LOOK);
      camera.updateProjectionMatrix();
    }
    new ResizeObserver(resize).observe(stage);
    resize();

    // ---- アイコン用の画面（?icon） ----
    if (ICON_MODE) {
      document.body.innerHTML = ''; document.body.appendChild(renderer.domElement);
      renderer.setPixelRatio(1); renderer.setSize(512, 512);
      camera.aspect = 1; camera.fov = 40; camera.updateProjectionMatrix();
      camera.position.set(0, 3.3, 4.1); camera.lookAt(0, 0.35, 0.6);
      const place = (id, x, y, z, ry) => { const [m] = BUILD[id](); m.position.set(x, y, z); m.rotation.y = ry; scene.add(m); };
      place('chicken', -0.35, 0.68, 0.6, 0.5);
      place('egg', 0.45, 0.6, 0.75, 0);
      place('pig', 0.25, 0.7, 0.2, -0.4);
      renderer.render(scene, camera);
      window.__iconReady = true;
    }

    // ---- ループ ----
    let last = performance.now();
    const headPos = new THREE.Vector3();
    function loop(now) {
      requestAnimationFrame(loop);
      if (ICON_MODE) return;
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      world.step(1 / 60, dt, 4);
      for (const th of [...things]) {
        th.mesh.position.copy(th.body.position);
        th.mesh.quaternion.copy(th.body.quaternion);
        if (th.body.position.y < -3) removeThing(th);
      }

      if (state === 'play') {
        timeLeft -= dt;
        phaseT += dt;
        const c = cust;
        if (phase === 'in') {
          const k = Math.min(1, phaseT / 0.6);
          c.g.position.x = -8 * (1 - k) ** 2;
          if (k >= 1) { phase = 'wait'; $('bubble').hidden = false; $('gauge').style.visibility = ''; }
        } else if (phase === 'wait') {
          patience -= dt;
          const r = Math.max(0, patience / patienceMax);
          const gd = $('gauge').firstElementChild;
          gd.style.width = `${r * 100}%`;
          gd.style.background = r > 0.5 ? '#5bb85a' : r > 0.25 ? '#e0a030' : '#d9432a';
          c.head.rotation.z = Math.sin(now / 400) * 0.05;
          if (patience <= 0) { clearAll(); react('late'); }
        } else if (phase === 'react') {
          if (c.mood === 'happy') c.g.position.y = Math.abs(Math.sin(phaseT * 10)) * 0.3;
          else c.g.position.x = Math.sin(phaseT * 50) * 0.08;
          if (phaseT > 1.1) {
            if (strikes >= 3) { endGame(); }
            else { phase = 'out'; phaseT = 0; $('bubble').hidden = true; }
          }
        } else if (phase === 'out') {
          c.g.position.x = 9 * (phaseT / 0.5) ** 2;
          c.g.rotation.y = c.mood === 'angry' ? -Math.PI / 2 : 0;
          if (phaseT > 0.5) nextCustomer();
        }
        if (timeLeft <= 0 && state === 'play') { timeLeft = 0; endGame(); }
        hud();
      }

      updateMarker();
      // 吹き出しをお客さんの頭の上に
      if (cust && !$('bubble').hidden) {
        headPos.set(cust.g.position.x, cust.g.position.y + 1.65, cust.g.position.z).project(camera);
        const b = $('bubble');
        const x = (headPos.x + 1) / 2 * stage.clientWidth, y = (1 - headPos.y) / 2 * stage.clientHeight;
        b.style.left = `${THREE.MathUtils.clamp(x, b.offsetWidth / 2 + 4, stage.clientWidth - b.offsetWidth / 2 - 4)}px`;
        b.style.top = `${Math.max(y, b.offsetHeight + 34)}px`;
      }
      renderer.render(scene, camera);
    }
    applyLang();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
