    function wake() {
      state = 'play'; timer = TIMER; beepT = 0; blanketT = 0;
      me.h.face.blink = 0;
      sWa(me);
    }
    function headInPhoto() {
      const b = me.bodies.head.position, q = V3(b.x, b.y, b.z).project(photoCam);
      // 頭の中心が写真の枠に入っていれば写れたことにする（下端ぎりぎりも含める）
      return q.z < 1 && Math.abs(q.x) < 0.99 && q.y > -1.02 && q.y < 0.95;
    }
    // どんな体勢でも、顔だけカメラの方へ向ける（首はぐいっと回る）
    const AM = new THREE.Matrix4(), AQ = new THREE.Quaternion(), AQ2 = new THREE.Quaternion(), AP = new THREE.Vector3(), AU = new THREE.Vector3();
    function faceCamera(p) {
      const j = p.h.j;
      j.head.updateWorldMatrix(true, false);
      j.head.getWorldPosition(AP); j.head.getWorldQuaternion(AQ);
      AU.set(0, 1, 0).applyQuaternion(AQ).lerp(V3(0, 1, 0), 0.5).normalize(); // 頭の傾きは少し残す
      AM.lookAt(photoCam.position, AP, AU); AQ.setFromRotationMatrix(AM);
      j.neck.getWorldQuaternion(AQ2);
      j.head.quaternion.copy(AQ2.invert().multiply(AQ));
      p.h.lookAt(null);
    }
    function shutter() {
      state = 'shot'; endT = 0; aim = null; drawDots(false);
      sShutter();
      flashEl.style.transition = 'none'; flashEl.style.opacity = '1';
      requestAnimationFrame(() => { flashEl.style.transition = 'opacity .6s'; flashEl.style.opacity = '0'; });
      // シャッターの瞬間だけ、みんな（倒れた人も自分も）カメラを見てにっこり
      for (const p of [...people, me]) { p.h.face.smile = 1; p.h.face.open = 0.25; p.h.face.brow = 0.3; p.h.face.blink = 0; p.h.lookAt(photoCam.position); if (p.rag) { syncRagdoll(p); faceCamera(p); } }
      inPhoto = headInPhoto();
      // 間に合わなければ、猫が真ん中で表紙を飾る
      if (!inPhoto) { catG.position.set(0, 0, 1.1); catG.rotation.y = 0; catG.scale.setScalar(0.62); }
      setLeds(false); tripodLed().material.emissiveIntensity = 0;
      needPhoto = true;
    }
    function setLeds() {}
    const STEP = 1 / 60;
    let clock = 0;
    function step(dt) {
      clock += dt; thudCD -= dt;
      if (state === 'play') {
        timer -= dt;
        // セルフタイマー: ランプの点滅とピッがだんだん速くなる
        const period = Math.max(0.12, 0.9 * (timer / TIMER) + 0.1);
        beepT -= dt;
        if (beepT <= 0) { beepT = period; ledOn = true; setLeds(true, timer < 3.5 ? 2 : timer < 7 ? 1 : 0); tripodLed().material.emissiveIntensity = 3; sBeep(timer < 3.5); }
        else if (ledOn && beepT < period * 0.5) { ledOn = false; setLeds(false); tripodLed().material.emissiveIntensity = 0; }
        if (timer <= 0) shutter();
      }
      drawSec();
      if (state !== 'shot' && state !== 'result') { stepMovers(STEP); world.step(STEP); }
      while (toppleQ.length) { const { p, vel } = toppleQ.shift(); topple(p, vel); }
      for (const p of [...people, me]) {
        p.oofCD = (p.oofCD || 0) - dt;
        if (p.rag) {
          syncRagdoll(p); p.ragT += dt;
          if (state === 'shot' || state === 'result') faceCamera(p);
          if (state === 'play' && p.ragT > 1.4 && p.oofCD < 0) { p.h.face.open = 0.12; p.h.face.brow = p.me ? 0.6 : -0.3; p.h.face.smile = -0.15; }
        } else {
          if (p.shockT > 0) { p.shockT -= dt; if (p.shockT <= 0) { p.h.face.brow = 0.2; p.h.face.open = 0; p.h.face.smile = 0.45; } }
          if (state !== 'shot') p.h.lookAt(photoCam.position);
        }
        p.h.update(dt);
      }
      cameraman.lookAt(photoCam.position.clone().setZ(-0.3)); cameraman.update(dt);
      // 寝ている間は目を閉じて Zzz
      if (state === 'intro') introTick(dt);
      const sleeping = state === 'intro' && introT > 2.6 && introT < 4.5;
      if (sleeping) { me.h.face.blink = 1; me.h.face.open = 0.15 + 0.08 * Math.sin(clock * 2); }
      const hp = me.bodies?.head.position;
      zzz.forEach(z => {
        z.t = (z.t + dt * 0.45) % 1;
        z.s.visible = sleeping && !!hp;
        if (hp) { z.s.position.set(hp.x + 0.1 + z.t * 0.25, hp.y + 0.15 + z.t * 0.7, hp.z + Math.sin(z.t * 6) * 0.05); z.s.material.opacity = Math.sin(z.t * Math.PI); z.s.scale.setScalar(0.1 + z.t * 0.15); }
      });
      // 起きた瞬間、布団が飛ぶ
      if (blanketT >= 0) {
        blanketT += dt;
        const q = Math.min(1, blanketT / 0.7);
        blanket.position.set(BED.x + 1.4 * q, MAT_TOP + 0.24 + Math.sin(q * Math.PI) * 0.9 - q * 0.35, BED.z + 0.35 + 0.6 * q);
        blanket.rotation.set(q * 1.2, 0, -q * 2.4);
        if (q >= 1) blanketT = -1;
      }
      for (const pt of petals) {
        pt.ph += dt; const s = pt.s.position;
        s.y -= pt.v * dt; s.x += Math.sin(pt.ph * 1.3) * 0.4 * dt + 0.15 * dt; s.z += Math.cos(pt.ph) * 0.2 * dt;
        pt.s.material.rotation = pt.ph * 2;
        if (s.y < 0) { s.y = rnd(4, 6); s.x = camTarget.x + rnd(-7, 7); s.z = camTarget.z + rnd(-5, 5); }
      }
      if (state === 'shot') { endT += dt; if (endT > 0.9) finish(); }
    }

    // ---------- 結果: 撮れた卒業写真をプリントにする ----------
    let snap = null, shareCache = null;
    function takePhoto() {
      // 三脚カメラの絵を、画面いっぱいに描いてから 3:2 で切り抜く
      const W = renderer.domElement.width, H = renderer.domElement.height;
      const cw = Math.min(W, H * PHOTO_A), ch = cw / PHOTO_A;
      photoCam.aspect = W / H;
      photoCam.fov = THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(PV / 2)) * H / ch));
      photoCam.updateProjectionMatrix();
      zzz.forEach(z => z.s.visible = false);
      renderer.render(scene, photoCam);
      snap = document.createElement('canvas'); snap.width = 900; snap.height = 1200;
      snap.getContext('2d').drawImage(renderer.domElement, (W - cw) / 2, (H - ch) / 2, cw, ch, 0, 0, 900, 1200);
      photoCam.aspect = PHOTO_A; photoCam.fov = PV; photoCam.updateProjectionMatrix();
      shareCache = null;
    }
    const font = (s, mono) => mono ? `800 ${s}px ui-monospace, "SF Mono", Menlo, Consolas, monospace` : `900 ${s}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans KR", "Noto Sans Thai", sans-serif`;
    // 写真の加工（プレイヤーが選べる）
    const FILTERS = ['film', 'soft', 'pop', 'mono', 'none'];
    let filter = store.get('filter', 'film');
    if (!FILTERS.includes(filter)) filter = 'film';
    const P = {
      // 黒の浮き, コントラスト, 彩度, 暗部の色, 明部の色, 明るさ, ビネット, 粒子, 光漏れ
      film: { lift: 0.06, con: 0.55, sat: 0.78, sh: [-0.06, 0.03, 0.09], hi: [0.1, 0.035, -0.08], ex: 0, vig: 0.58, grain: 0.08, leak: 'rgba(255,150,80,.75)' },
      soft: { lift: 0.14, con: 0.2, sat: 0.72, sh: [0.04, 0.0, 0.05], hi: [0.05, 0.02, 0.0], ex: 0.1, vig: 0.15, grain: 0.03, leak: 'rgba(255,190,200,.55)' },
      pop: { lift: 0.0, con: 0.85, sat: 1.45, sh: [0.0, -0.02, 0.04], hi: [0.05, 0.03, -0.02], ex: 0.04, vig: 0.3, grain: 0.02, leak: null },
      mono: { lift: 0.04, con: 0.8, sat: 0, sh: [0, 0, 0], hi: [0.02, 0.01, -0.01], ex: 0.02, vig: 0.6, grain: 0.1, leak: null },
    };
    function grade(g, W, H, kind) {
      const o = P[kind]; if (!o) return;
      const im = g.getImageData(0, 0, W, H), d = im.data;
      const curve = new Float32Array(256);
      for (let i = 0; i < 256; i++) { const x = i / 255, sc = x * x * (3 - 2 * x); curve[i] = Math.min(1, o.lift + (1 - o.lift * 1.6) * (x * (1 - o.con) + sc * o.con) + o.ex); }
      const cx = W / 2, cy = H * 0.52, R = Math.hypot(cx, cy);
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const i = (y * W + x) * 4;
        let r = curve[d[i]], gg = curve[d[i + 1]], b = curve[d[i + 2]];
        const l = 0.3 * r + 0.59 * gg + 0.11 * b;
        r = l + (r - l) * o.sat; gg = l + (gg - l) * o.sat; b = l + (b - l) * o.sat;
        const sh = 1 - l, hi = l;
        r += o.sh[0] * sh + o.hi[0] * hi; gg += o.sh[1] * sh + o.hi[1] * hi; b += o.sh[2] * sh + o.hi[2] * hi;
        const v = 1 - o.vig * Math.pow(Math.hypot(x - cx, y - cy) / R, 2.2);
        const n = (Math.random() - 0.5) * o.grain;
        d[i] = Math.max(0, Math.min(255, (r * v + n) * 255));
        d[i + 1] = Math.max(0, Math.min(255, (gg * v + n) * 255));
        d[i + 2] = Math.max(0, Math.min(255, (b * v + n) * 255));
      }
      g.putImageData(im, 0, 0);
      if (o.leak) {
        g.save(); g.globalCompositeOperation = 'screen';
        const lk = g.createRadialGradient(-W * 0.04, H * 0.18, 1, -W * 0.04, H * 0.18, W * 0.75);
        lk.addColorStop(0, o.leak); lk.addColorStop(1, 'rgba(255,120,80,0)');
        g.fillStyle = lk; g.fillRect(0, 0, W, H);
        const lk2 = g.createRadialGradient(W * 1.04, H * 0.85, 1, W * 1.04, H * 0.85, W * 0.6);
        lk2.addColorStop(0, 'rgba(255,210,140,.3)'); lk2.addColorStop(1, 'rgba(255,210,140,0)');
        g.fillStyle = lk2; g.fillRect(0, 0, W, H);
        g.restore();
      }
    }
    // フィルターの見本（小さい表紙）を並べる
    const filtersEl = document.getElementById('filters');
    function drawFilterButtons() {
      filtersEl.innerHTML = '';
      if (!snap || state !== 'result') { filtersEl.style.display = 'none'; return; }
      filtersEl.style.display = 'flex';
      for (const k of FILTERS) {
        const b = document.createElement('button'); b.className = 'flt' + (k === filter ? ' on' : ''); b.setAttribute('aria-label', k);
        const c = document.createElement('canvas'); c.width = 60; c.height = 80;
        const g = c.getContext('2d'); g.drawImage(snap, 0, 0, 60, 80); grade(g, 60, 80, k);
        b.append(c);
        b.addEventListener('click', () => { if (filter === k) return; filter = k; store.set('filter', k); shareCache = null; showResult(); prepareShare(); drawFilterButtons(); });
        filtersEl.append(b);
      }
    }
    // 雑誌の表紙: 写真の上に雑誌名のロゴだけ
    function printImage() {
      if (!snap) return null;
      const c = document.createElement('canvas'); c.width = 900; c.height = 1200;
      const g = c.getContext('2d');
      g.drawImage(snap, 0, 0);
      grade(g, 900, 1200, filter);
      const sh = g.createLinearGradient(0, 0, 0, 260); sh.addColorStop(0, 'rgba(0,0,0,.28)'); sh.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = sh; g.fillRect(0, 0, 900, 260);
      g.textAlign = 'center'; g.textBaseline = 'alphabetic';
      g.font = '900 210px "Didot", "Bodoni 72", "Playfair Display", Georgia, "Times New Roman", serif';
      const w = g.measureText('NEBOU').width; if (w > 840) g.font = `900 ${210 * 840 / w}px "Didot", "Bodoni 72", "Playfair Display", Georgia, "Times New Roman", serif`;
      g.shadowColor = 'rgba(0,0,0,.25)'; g.shadowBlur = 12; g.shadowOffsetY = 4;
      g.fillStyle = '#ffffff'; g.fillText('NEBOU', 450, 200);
      return c;
    }
    function resultImage() {
      const p = printImage(); if (!p) return null;
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const g = c.getContext('2d');
      const bg = g.createLinearGradient(0, 0, 0, 1080); bg.addColorStop(0, '#e8ecf2'); bg.addColorStop(1, '#a8b4c4'); g.fillStyle = bg; g.fillRect(0, 0, 1080, 1080);
      const sc = 900 / p.height, pw = p.width * sc, ph = p.height * sc;
      g.save(); g.translate(540, 540); g.rotate(-0.025);
      g.shadowColor = 'rgba(20,30,50,.35)'; g.shadowBlur = 30; g.shadowOffsetY = 10;
      g.drawImage(p, -pw / 2, -ph / 2, pw, ph); g.restore();
      return c;
    }
    function showResult() {
      const p = printImage(); if (!p) return;
      printEl.width = p.width; printEl.height = p.height; printEl.getContext('2d').drawImage(p, 0, 0);
      printEl.style.display = 'block';
      fitPrint();
    }
    const filtersH = () => state === 'result' ? Math.min(96, Math.max(70, 0.1 * Math.min(innerWidth, innerHeight))) + 10 : 0;
    // プリントの縦横比を保ったまま、ボタンの上の空いた所に収める
    function fitPrint() {
      if (!printEl.width) return;
      const w = stage.clientWidth, H = stage.clientHeight;
      const mw = Math.min(w * 0.92, 900), mh = Math.max(80, H - reserve - 76 - filtersH());
      const sc = Math.min(mw / printEl.width, mh / printEl.height);
      printEl.style.width = printEl.width * sc + 'px'; printEl.style.height = printEl.height * sc + 'px';
      stage.style.setProperty('--fh', filtersH() + 'px'); filtersEl.style.bottom = reserve + 'px';
    }
    const shareText = () => inPhoto ? t('shareHit')(knocked) : t('shareMiss');
    function renderControls() {
      controls.innerHTML = '';
      controls.classList.toggle('hide', state !== 'result');
      ledEl.style.display = state === 'result' || state === 'intro' ? 'none' : 'flex';
      if (state !== 'result') return;
      const b = document.createElement('button');
      b.className = 'go'; b.textContent = t('again');
      b.addEventListener('click', start);
      controls.append(b);
      const a = document.createElement('a');
      a.className = 'post'; a.textContent = t('post');
      a.href = `https://x.com/intent/post?text=${encodeURIComponent(shareText())}&url=${encodeURIComponent(SHARE_URL)}`;
      const coarse = matchMedia('(pointer: coarse)').matches;
      if (!coarse) { a.target = '_blank'; a.rel = 'noopener'; }
      // スマホは画像ごと共有シートへ。PCは画像を保存してから投稿画面を開く
      a.addEventListener('click', e => {
        const text = shareText();
        if (coarse && navigator.share) {
          e.preventDefault();
          const file = shareFile();
          const data = file && navigator.canShare?.({ files: [file] }) ? { files: [file], text: `${text}\n${SHARE_URL}` } : { text: `${text}\n${SHARE_URL}` };
          navigator.share(data).catch(() => {});
          return;
        }
        const img = resultImage();
        if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'nebou-model.png'; d.click(); }
      });
      controls.append(a);
    }
    function prepareShare() {
      if (!snap) return;
      const key = lang + filter;
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'nebou-model.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang + filter ? shareCache.file : null;

    function resetPerson(p) {
      unragdoll(p);
      const h = p.h;
      h.root.position.set(0, 0, 0); h.root.rotation.set(0, 0, 0);
      h.j.pelvis.position.copy(p.rig.P.pelvis);
      for (const b of BONES) h.j[b].quaternion.identity();
      h.auto = true; h.pose = 'stand'; h.walkSpeed = 0;
    }
    function start() {
      aim = null; drawDots(false);
      for (const p of people) {
        resetPerson(p);
        p.h.root.position.copy(p.home);
        p.h.face.smile = 0.5; p.h.face.open = 0; p.h.face.brow = 0.2; p.shockT = 0; p.h.pose = p.pose;
        standBox(p);
        for (let i = 0; i < 6; i++) p.h.update(0.1);
      }
      catG.position.set(1.35, 0.48, 6.0); catG.rotation.y = -0.5 + Math.PI * 0; catG.scale.setScalar(0.3);
      // 自分はベッドで仰向けに寝ている（最初からぐにゃぐにゃ）
      resetPerson(me);
      for (let i = 0; i < 6; i++) me.h.update(0.1);
      me.h.root.position.set(BED.x, MAT_TOP + 0.13, BED.z + 0.95);
      me.h.root.rotation.set(-Math.PI / 2, 0, 0);
      ragdoll(me);
      me.h.face.blink = 0; me.h.face.smile = -0.3; me.h.face.brow = 1; me.h.face.open = 0.35;
      fadeEl.style.opacity = '0'; setNight(false); dressMe(true, true);
      blanket.position.set(BED.x, MAT_TOP + 0.24, BED.z + 0.35); blanket.rotation.set(0, 0, 0); blanketT = -1;
      state = 'ready'; timer = TIMER; knocked = 0; inPhoto = false; setLeds(false); tripodLed().material.emissiveIntensity = 0;
      resetCones();
      printEl.style.display = 'none'; filtersEl.style.display = 'none';
      renderControls(); resize(); placeCamera(1, true);
    }
    function finish() {
      state = 'result';
      renderControls(); fitPrint(); drawFilterButtons();
    }

    // ---------- ループ ----------
    let last = performance.now(), acc = 0;
    function loop(now) {
      window.resultAd?.(state === 'result'); // 結果画面の広告（../../ad.js）
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      acc += dt;
      while (acc >= STEP) { step(STEP); acc -= STEP; }
      placeCamera(dt); drawArrow();
      for (const c of cones) { c.g.position.copy(c.body.position); c.g.quaternion.copy(c.body.quaternion); }
      drawMovers();
      drawBubble();
      if (needPhoto) { needPhoto = false; takePhoto(); showResult(); prepareShare(); }
      renderer.render(scene, camera);
      requestAnimationFrame(loop);
    }

    resize();
    beginIntro(false);
    applyLang();
    renderer.compile(scene, camera);
    renderer.render(scene, camera);
    world.step(STEP);
    requestAnimationFrame(t0 => { last = t0; loop(t0); });
  </script>
  <!-- 結果画面の広告（../../ad.js の説明を参照） -->
  <script src="../../ad.js"></script>
