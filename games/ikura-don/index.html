      ikuraMesh.count = N; eyeMesh.count = N;
      ikuraMesh.instanceMatrix.needsUpdate = true; eyeMesh.instanceMatrix.needsUpdate = true;
      // スプーン
      const tl = prevTilt + (tilt - prevTilt) * alpha;
      spoon.position.set(spoonPos.x, spoonY + 0.6 * (1 - tl), spoonPos.z - 1.6 * (1 - tl));
      spoonTilt.rotation.x = -tl * 1.0;
      spoon.rotation.y = Math.sin(clock * 1.3) * 0.04;
      // 猫: 新記録で身を乗り出し、こぼれると震え、終わるとしょんぼり傾く
      cat.position.copy(CAT_BASE);
      // ヨイショ: 「ヨイ」で沈み、「ショ」で持ち上がる
      const heave = heaveT < 0.3 ? -0.7 * heaveT / 0.3 : heaveT < 0.9 ? 1.7 * Math.sin(Math.PI * (heaveT - 0.3) / 0.6) - 0.7 * (1 - Math.min(1, (heaveT - 0.3) / 0.15)) : 0;
      cat.position.y += Math.sin(clock * 1.7) * 0.25 + catJoy * 1.6 - catSad * 1.8 + heave;
      cat.position.x += Math.sin(clock * 40) * catShake * 0.5;
      cat.rotation.z = catSad * 0.22 + Math.sin(clock * 0.9) * 0.02;
      cat.scale.setScalar(CAT_SIZE * (1 + catJoy * 0.06));
      cat.lookAt(camera.position.x, cat.position.y, camera.position.z);
      cat.rotateZ(catSad * 0.22);
      if (bubbleKey) { bubbleT -= 1 / 60; if (bubbleT <= 0) hideBubble(); else placeBubble(); }
      renderer.render(scene, camera);
      if (needSnap) { needSnap = false; takeSnap(); prepareShare(); }
    }
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      acc += dt; clock += dt;
      let n = 0;
      while (acc >= STEP && n < 6) { step(STEP); acc -= STEP; n++; }
      if (n === 6) acc = 0;
      // 山が高くなったら、カメラを少しずつ上げる
      const lift = Math.max(0, Math.min(12, topH));
      if (Math.abs(lift - camLift) > 0.01) { camLift += (lift - camLift) * Math.min(1, dt * 1.5); placeCamera(); }
      render(Math.min(1, acc / STEP));
      requestAnimationFrame(loop);
    }

    resize();
    start();
    applyLang();
    // 最初の1回が重くならないように、粒を置いて一度描いておく
    addIkura(0, RIM_TOP + 2, 0, 0, 0, 0); physStep(STEP); render(1);
    renderer.compile(scene, camera);
    N = 0; ikuraMesh.count = 0; eyeMesh.count = 0;
    requestAnimationFrame(t0 => { last = t0; loop(t0); });
  </script>
</body>
</html>
