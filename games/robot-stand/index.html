  const vf = THREE.MathUtils.degToRad(camera.fov), hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();

let drag = null, lastThrow = 0, thrown = 0;
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  drag = { id: e.pointerId, x: e.clientX, y: e.clientY, yaw: camYaw, pitch: camPitch, moved: false, t: performance.now() };

aimRing.renderOrder = 10; scene.add(aimRing);

function throwAt(cx, cy) {
  const now = performance.now();
  if (now - lastThrow < 110) return;
  lastThrow = now;
  ndc.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(pickables, false)[0];
  let target = new THREE.Vector3(), normal = null;
  if (hit) { target.copy(hit.point); normal = hit.face ? hit.face.normal.clone().transformDirection(hit.object.matrixWorld) : null; }
  else if (!ray.ray.intersectPlane(groundPlane, target) || target.distanceTo(camera.position) > camDist * 2.5) {
    target.copy(ray.ray.origin).addScaledVector(ray.ray.direction, camDist);
  }
  // 投げる位置: カメラの右下
  const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0), up = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1);
  const fwd = new THREE.Vector3(); camera.getWorldDirection(fwd);

  const d = target.clone().sub(from), dist = d.length(), speed = 15, T = dist / speed;
  const vel = d.divideScalar(T); vel.y += 0.5 * 9.81 * T;

  if (sim.balls.length >= MAX_BALLS) removeBall(ballPool.find(b => b.ball === sim.balls[0]));
  const ball = sim.throwBall(from, vel, BALL_R, 1.6);
  ball.prevVel = { x: vel.x, y: vel.y, z: vel.z };

}

const tmpV = new THREE.Vector3();
function handleHits() {
  for (const h of sim.hits) {
    if (h.ball) {
      const b = h.ball, pv = b.prevVel || { x: 0, y: 0, z: 0 };
      const bp = b.body.translation();
      if (h.part) {
        const v = h.part.body.linvel();
        const rel = Math.hypot(pv.x - v.x, pv.y - v.y, pv.z - v.z);
        if (rel < 1.5) continue;
        const k = Math.min(1, rel / 15);
        const pp = h.part.body.translation();
        tmpV.set(bp.x, bp.y, bp.z).lerp(new THREE.Vector3(pp.x, pp.y, pp.z), 0.35);
        spawnSpark(tmpV, Math.round(4 + 10 * k), 0.4 + k);
        clank(0.25 + 0.75 * k, h.part.name === 'head' ? 1.25 : h.part.name.startsWith('fore') || h.part.name.startsWith('upper') ? 1.4 : 1);
        if (sim.state === 'stand' && k > 0.45) {

      } else {

      }
    } else if (h.part && sim.state !== 'stand') {
      // 倒れて床にぶつかった
      const n = h.part.name;
      if ((n === 'torso' || n === 'head' || n === 'pelvis') && crashCool <= 0) {
        const v = h.part.body.linvel(), sp = Math.hypot(v.x, v.y, v.z);

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  acc += dt;

    for (const b of ballPool) if (b.ball) { b.pp.copy(b.cp); b.pq.copy(b.cq); const lv = b.ball.body.linvel(); b.ball.prevVel = { x: lv.x, y: lv.y, z: lv.z }; }
    sim.step();

    for (const v of visuals) readPose(v, { p: v.cp, q: v.cq });
    for (const b of ballPool) if (b.ball) { readPose({ part: b.ball }, { p: b.cp, q: b.cq }); b.ball.age += sim.DT; }
    acc -= sim.DT;
  }

  for (const b of ballPool) {
    if (!b.ball) continue;
    b.mesh.position.lerpVectors(b.pp, b.cp, a); b.mesh.quaternion.slerpQuaternions(b.pq, b.cq, a);
    // 古いボールは小さくなって消える
    const age = b.ball.age;
    if (age > 7) b.mesh.scale.setScalar(Math.max(0.01, 1 - (age - 7) / 0.5));
    if (age > 7.5 || b.cp.y < -3) removeBall(b);
  }
  // 顔
  voiceCool -= dt; crashCool -= dt;
  if (sim.state !== lastState) {
    if (sim.state === 'stand' && lastState === 'getup') { setFace('normal'); beep(880, 0.07, 0); beep(1320, 0.1, 0.09); }
    if (sim.state === 'getup') hum();
    lastState = sim.state;
  }
  if (faceMode === 'hit') { faceT -= dt; if (faceT <= 0) setFace('normal'); }
  if (faceMode === 'dizzy') { faceTimer += dt; faceSpin += dt * 5; if (faceTimer > 1 / 15) { faceTimer = 0; drawFace(); } if (sim.state === 'stand') setFace('normal'); }
  // カメラはロボットにゆっくりついていく
  const pt = sim.parts.pelvis.body.translation();
  const kf = 1 - Math.exp(-dt * 1.5);
  camT.x += (pt.x - camT.x) * kf; camT.z += (pt.z - camT.z) * kf;
  placeCamera();
  updateParticles(dt);
  if (aimT < 1) { aimT += dt / 0.4; aimRing.material.opacity = 0.8 * (1 - aimT); aimRing.scale.setScalar(1 + aimT * 1.5); }
  // 最初の合図は胸の位置に
  if (!$('hint').classList.contains('off')) {
    const tp = sim.parts.torso.body.translation(); hintPos.set(tp.x, tp.y + 0.05, tp.z).project(camera);
    $('hint').style.left = ((hintPos.x + 1) / 2 * innerWidth) + 'px'; $('hint').style.top = ((1 - hintPos.y) / 2 * innerHeight) + 'px';
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
renderer.compile(scene, camera);
renderer.render(scene, camera);
requestAnimationFrame(t0 => { last = t0; frame(t0); });
</script>
