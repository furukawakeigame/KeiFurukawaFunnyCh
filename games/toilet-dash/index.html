    { const p = puddleG.attributes.position; for (let i = 1; i < p.count; i++) { const a = Math.atan2(p.getY(i), p.getX(i)); const r = 1 + 0.12 * Math.sin(a * 3 + 1) + 0.08 * Math.sin(a * 5 + 2) + 0.05 * Math.sin(a * 9); p.setXY(i, Math.cos(a) * r, Math.sin(a) * r); } }
    const puddle = new THREE.Mesh(puddleG, new THREE.MeshStandardMaterial({ color: '#e8cf48', roughness: 0.05, metalness: 0.15, transparent: true, opacity: 0.82, polygonOffset: true, polygonOffsetFactor: -2 }));
    puddle.rotation.x = -Math.PI / 2; puddle.position.y = 0.01; puddle.receiveShadow = true; scene.add(puddle);

    // 汗・湯気（時間で消える小さな粒）
    const fx = [], dropG = new THREE.SphereGeometry(1, 8, 6);
    function burst(pos, n, color, speed, size, life, up, grav = 6) {
      for (let k = 0; k < n; k++) {
        const m = new THREE.Mesh(dropG, new THREE.MeshBasicMaterial({ color, transparent: true, depthWrite: false }));
        const a = Math.random() * Math.PI * 2, sp = speed * (0.5 + Math.random() * 0.7);
        m.position.copy(pos); m.scale.setScalar(size * (0.6 + Math.random() * 0.6));
        scene.add(m);
        fx.push({ m, v: new THREE.Vector3(Math.cos(a) * sp, up * (0.5 + Math.random()), Math.sin(a) * sp), t: 0, life, s0: m.scale.x, grav });
      }
    }
    function stepFx(dt) {
      for (let k = fx.length - 1; k >= 0; k--) {
        const f = fx[k]; f.t += dt;
        f.v.y -= dt * f.grav; f.m.position.addScaledVector(f.v, dt);
        const q = f.t / f.life;
        f.m.material.opacity = 1 - q; f.m.scale.setScalar(f.s0 * (1 + q * 0.8));
        if (q >= 1) { scene.remove(f.m); f.m.material.dispose(); fx.splice(k, 1); }
      }
    }
    function clearFx() { for (const f of fx) { scene.remove(f.m); f.m.material.dispose(); } fx.length = 0; }

    // ---------- 画面サイズ ----------
    const controls = document.getElementById('controls');
    let viewH = 1, viewW = 1;
    function resize() {
      const w = stage.clientWidth, H = stage.clientHeight;
      renderer.setSize(w, H, false);
      // 下の空白とボタンの所には大事な物を置かないので、その上の範囲で画角を決める（描画は下まで）
      const btnH = Math.min(72, Math.max(56, 0.08 * Math.min(innerWidth, innerHeight))) + 12;
      const reserve = Math.max(0, stage.getBoundingClientRect().bottom - controls.getBoundingClientRect().bottom) + btnH;
      stage.style.setProperty('--reserve', reserve + 'px');
      const h = Math.max(120, H - reserve);
      viewW = w; viewH = h;
      camera.aspect = w / h;
      // 横の画角を一定以上にして、左右の扉が両方入るようにする（縦長では上下に天井と床が広がる）
      const needH = THREE.MathUtils.degToRad(56);
      const vf = 2 * Math.atan(Math.tan(needH / 2) / camera.aspect);
      camera.fov = THREE.MathUtils.clamp(THREE.MathUtils.radToDeg(vf), 46, 88);
      camera.setViewOffset(w, h, 0, 0, w, H);
      camera.updateProjectionMatrix();
    }
    addEventListener('resize', resize);

    // ---------- 入力 ----------
    function steer(dir) {
      if (state === 'idle') { begin(); }
      if (state !== 'run') return;
      if (lane !== dir) { lane = dir; sWhoosh(); }
    }
    let downX = null;
    renderer.domElement.addEventListener('pointerdown', e => {
      e.preventDefault();
      const r = renderer.domElement.getBoundingClientRect();
      downX = e.clientX;
      steer(e.clientX < r.left + r.width / 2 ? -1 : 1);
    }, { passive: false });
    // スワイプでも曲がれる
    renderer.domElement.addEventListener('pointermove', e => {
      if (downX === null) return;
      const dx = e.clientX - downX;
      if (Math.abs(dx) > 30) { steer(dx < 0 ? -1 : 1); downX = e.clientX; }
    });
    addEventListener('pointerup', () => { downX = null; });
    addEventListener('pointercancel', () => { downX = null; });
    addEventListener('keydown', e => {
      if (e.repeat) return;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { e.preventDefault(); steer(-1); }
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { e.preventDefault(); steer(1); }
      if ((e.key === ' ' || e.key === 'Enter') && state === 'result') { e.preventDefault(); start(); }
    });
    stage.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

    // ---------- ゲーム ----------
    let failZ = 0, state = 'idle', score = 0, lane = 0, pz = 0, prevPz = 0, px = 0, prevPx = 0, speed = 0, animT = 0, phase = 0, failT = 0, failKind = 'f', failSeg = null, needSnap = false, stepSide = 0, sweatT = 0, urgeT = 2, turn = Math.PI;
    const speedOf = k => Math.min(16, 8 + k * 0.45);
    const hints = [...document.querySelectorAll('.hint')];
    function reset() {
      clearFx();
      score = 0; lane = 0; pz = prevPz = 0; px = prevPx = 0; speed = 0; animT = 0; phase = 0; failT = 0; turn = Math.PI; urgeT = 1.5;
      segs.forEach((s, i) => setupSeg(s, i));
      puddle.visible = false; puddle.scale.setScalar(0.01);
      for (const e of eyes) e.scale.set(0.028, 0.036, 0.018);
      mouth.scale.set(1, 1.3, 1);
      man.position.set(0, 0, 0);
    }
    function begin() { state = 'run'; speed = speedOf(0); hints.forEach(h => h.style.display = 'none'); }
    function nextSeg() { return segs.filter(s => !s.passed).sort((a, b) => a.k - b.k)[0]; }
    function fail(seg) {
      state = 'fail'; failT = 0; failSeg = seg; failZ = doorZ(seg.k) + 0.45;
      failKind = seg.other;
      const d = seg.doors.find(d => d.side === lane);
      d.target = lane * -0.35; // 少しだけ開いて、すぐ閉まる
      sBump();
      if (failKind === 'c') sMeow(); else sScream();
      sOops(); sLeak();
      renderControls();
    }
    const STEP = 1 / 60;
    function step(dt) {
      prevPz = pz; prevPx = px;
      animT += dt;
      stepFx(dt);
      for (const s of segs) for (const d of s.doors) { d.open += (d.target - d.open) * Math.min(1, dt * 22); d.hinge.rotation.y = d.open; }
      if (state === 'run') {
        speed += (speedOf(score) - speed) * Math.min(1, dt * 2);
        pz -= speed * dt;
        px += THREE.MathUtils.clamp(lane * LANE - px, -dt * 13, dt * 13);
        // 走りの足の動きと足音
        const prev = Math.sin(phase);
        phase += dt * (6 + speed * 0.9);
        if (Math.sign(Math.sin(phase)) !== Math.sign(prev)) sStep(0.7);
        // 汗と、もれそうな声
        sweatT -= dt; if (sweatT <= 0) { sweatT = rnd(0.25, 0.5); burst(new THREE.Vector3(px + rnd(-0.12, 0.12), 1.95, pz), 1, '#5cb8ff', 0.8, 0.025, 0.5, 1.5); }
        urgeT -= dt; if (urgeT <= 0) { urgeT = rnd(2.5, 4.5); sUrge(); }
        // 扉の手前で入るほうが決まる
        const seg = nextSeg();
        const dz = pz - doorZ(seg.k);
        if (dz < 0.6 + speed * 0.1) {
          px = lane * LANE;
          if (lane === seg.maleSide) {
            seg.passed = true; score++;
            seg.doors.find(d => d.side === lane).target = lane * -1.55;
            sDoor(); setTimeout(() => { if (state === 'run') { sFlush(); sRelief(); } }, 250);
            burst(new THREE.Vector3(px, 2.1, doorZ(seg.k) - 0.5), 10, '#bfe8ff', 2.2, 0.06, 0.5, 2.5);
          } else fail(seg);
        }
        // 後ろに過ぎた区間は奥へ回す
        for (const s of segs) if (s.passed && doorZ(s.k) > pz + 8) setupSeg(s, Math.max(...segs.map(x => x.k)) + 1);
      } else if (state === 'idle') {
        phase += dt * 9;
        if (Math.sin(phase) * Math.sin(phase - dt * 9) < 0) sStep(0.35);
        urgeT -= dt; if (urgeT <= 0) { urgeT = rnd(2.5, 4); sUrge(); }
      } else if (state === 'fail' || state === 'result') {
        failT += dt;
        // 扉にぶつかって少し戻り、こちらを向いて震える
        if (failT < 0.2) pz = Math.max(failZ, pz - speed * dt);
        else if (failT < 0.4) pz += dt * 1.2;
        turn = Math.max(0, Math.PI * (1 - (failT - 0.35) / 0.4));
        if (failT > 0.35) failSeg.doors.forEach(d => d.target = 0);
        if (failT > 0.5) {
          puddle.visible = true;
          const k = Math.min(1, (failT - 0.5) / 2.2);
          puddle.scale.setScalar(0.05 + 0.85 * (1 - (1 - k) ** 2));
          puddle.position.set(px, 0.01, pz + 0.05);
          if (Math.random() < dt * 8 && failT < 3) burst(new THREE.Vector3(px + rnd(-0.3, 0.3), 0.1, pz + rnd(-0.3, 0.3)), 1, '#ffffff', 0.15, 0.08, 1.4, 0.5, -0.6);
        }
        if (state === 'fail' && failT > 2.8) finish();
      }
    }
    // 体の動き（描画のたびに経過時間で決める）
    function pose() {
      const run = state === 'run', idle = state === 'idle', sad = state === 'fail' || state === 'result';
      body.rotation.y = turn;
      let bob = 0, lean = 0;
      for (const L of legs) {
        if (run) { const a = Math.sin(phase + (L.s > 0 ? Math.PI : 0)); L.hip.rotation.x = -a * 0.55; L.knee.rotation.x = 0.25 + Math.max(0, a) * 0.9; L.hip.rotation.z = -L.s * 0.06; }
        else if (idle) { const a = Math.max(0, Math.sin(phase + (L.s > 0 ? Math.PI : 0))); L.hip.rotation.x = -a * 0.45; L.knee.rotation.x = a * 0.9; L.hip.rotation.z = L.s * 0.1; }
        else { L.hip.rotation.x = -0.05; L.knee.rotation.x = 0.35; L.hip.rotation.z = L.s * 0.16; }
      }
      // 内股で両手で前を押さえる
      for (const A of arms) {
        if (sad && failT > 0.6) { A.sh.rotation.set(-0.1, 0, -A.s * 0.15); A.el.rotation.x = -0.2; }
        else { A.sh.rotation.set(-0.15, 0, -A.s * 0.38); A.el.rotation.x = -0.75; }
      }
      if (run) { bob = Math.abs(Math.sin(phase)) * 0.07; lean = 0.18; }
      else if (idle) { bob = Math.abs(Math.sin(phase)) * 0.05; lean = 0.08; body.rotation.z = Math.sin(phase * 0.5) * 0.06; }
      else { bob = -0.08; lean = 0.15; body.rotation.z = Math.sin(animT * 60) * 0.02 * (failT > 0.5 ? 1 : 0); }
      if (!idle && !sad) body.rotation.z = 0;
      body.position.y = bob;
      torso.rotation.x = 0; body.rotation.x = run ? -lean : lean;
      head.rotation.x = sad && failT > 0.8 ? 0.35 : 0;
      // 顔: こちらを向いたら目を見開いて口がぽかん
      if (sad && failT > 0.4) { for (const e of eyes) e.scale.set(0.034, 0.046, 0.018); mouth.scale.set(1.2, 1.8, 1); brows.forEach((b, i) => b.rotation.z = (i ? -1 : 1) * 0.4); }
      else brows.forEach((b, i) => b.rotation.z = (i ? 1 : -1) * 0.35);
    }

    // ---------- 画面 ----------
    const resultEl = document.getElementById('result');
    function renderControls() {
      controls.innerHTML = '';
      controls.classList.toggle('hide', state !== 'result');
      if (state !== 'result') return;
      const b = document.createElement('button');
      b.className = 'go'; b.textContent = t('again');
      b.addEventListener('click', start);
      controls.append(b);
      const a = document.createElement('a');
      a.className = 'post'; a.textContent = t('post');
      a.href = `https://x.com/intent/post?text=${encodeURIComponent(t('share')(score))}&url=${encodeURIComponent(SHARE_URL)}`;
      const coarse = matchMedia('(pointer: coarse)').matches;
      if (!coarse) { a.target = '_blank'; a.rel = 'noopener'; }
      // スマホは画像ごと共有シートへ。PCは画像を保存してから投稿画面を開く
      a.addEventListener('click', e => {
        const text = t('share')(score);
        if (coarse && navigator.share) {
          e.preventDefault();
          const file = shareFile();
          const data = file && navigator.canShare?.({ files: [file] }) ? { files: [file], text: `${text}\n${SHARE_URL}` } : { text: `${text}\n${SHARE_URL}` };
          navigator.share(data).catch(() => {});
          return;
        }
        const img = resultImage();
        if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'toilet-dash.png'; d.click(); }
      });
      controls.append(a);
    }
    // 結果画像: もらした主人公の画面に回数を重ねる
    let snap = null, shareCache = null;
    function takeSnap() {
      const src = renderer.domElement;
      const focus = new THREE.Vector3(px, 1.0, pz).project(camera);
      const fx2 = (focus.x + 1) / 2 * src.width, fy = (1 - focus.y) / 2 * src.height;
      const side = Math.min(src.width, src.height);
      const sx = THREE.MathUtils.clamp(fx2 - side / 2, 0, src.width - side), sy = THREE.MathUtils.clamp(fy - side * 0.55, 0, src.height - side);
      snap = document.createElement('canvas'); snap.width = snap.height = 1080;
      snap.getContext('2d').drawImage(src, sx, sy, side, side, 0, 0, 1080, 1080);
      shareCache = null;
    }
    function resultImage() {
      if (!snap) return null;
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const g = c.getContext('2d');
      g.drawImage(snap, 0, 0);
      g.textAlign = 'center'; g.fillStyle = '#fff'; g.lineJoin = 'round';
      const font = px2 => `900 ${px2}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans Thai", sans-serif`;
      const text = (str, y, px2, max) => {
        g.font = font(px2);
        const w = g.measureText(str).width; if (w > max) { px2 *= max / w; g.font = font(px2); }
        g.lineWidth = px2 * .16; g.strokeStyle = '#3a5a8a'; g.strokeText(str, 540, y); g.fillText(str, 540, y);
      };
      text(t('count')(score), 250, 170, 960);
      text(t('title'), 90, 56, 900);
      return c;
    }
    function prepareShare() {
      if (!snap) return;
      const key = lang;
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'toilet-dash.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;
    function start() {
      reset();
      state = 'idle';
      resultEl.style.display = 'none';
      hints.forEach(h => h.style.display = 'block');
      renderControls(); resize();
    }
    function showResult() { resultEl.children[0].textContent = t('count')(score); }
    function finish() {
      state = 'result';
      showResult();
      resultEl.style.display = 'flex';
      snap = null; needSnap = true;
      renderControls(); resize();
    }

    // ---------- カメラ ----------
    function placeCamera(x, z) {
      const sad = state === 'fail' || state === 'result';
      const k = sad ? Math.min(1, failT / 1.2) : 0;
      const e = k * k * (3 - 2 * k);
      // 背の低い横長の結果画面は、文字を左に出すので主人公を右へ
      const wide = state === 'result' && viewH <= 520 && viewW / viewH >= 4 / 3 ? -0.9 : 0;
      // 扉をくぐるときは、カメラも低くして扉の真ん中を通る
      let near = 99; for (const sg of segs) near = Math.min(near, Math.abs(z + 4.4 - doorZ(sg.k)));
      const q = sad ? 0 : THREE.MathUtils.smoothstep(4.5 - near, 0, 3.5);
      const tp = new THREE.Vector3(x * (0.45 + 0.55 * q), 2.45 - 0.55 * q, z + 4.4).lerp(new THREE.Vector3(x * 0.6 + wide * e, 1.75, z + 4.0), e);
      const tl = new THREE.Vector3(x * 0.3, 1.7, z - 8).lerp(new THREE.Vector3(x * 0.9 + wide * e, 1.0, z), e);
      camera.position.copy(tp); camera.lookAt(tl);
      hall.position.z = Math.round(z / 4.8) * 4.8; // 廊下は主人公について行く（床・壁・蛍光灯の模様がずれない間隔で）
      sun.position.set(x + 2, 7, z + 4); sun.target.position.set(x, 0, z - 1);
    }

    // ---------- ループ ----------
    let last = performance.now(), acc = 0;
    function render(alpha) {
      const z = prevPz + (pz - prevPz) * alpha, x = prevPx + (px - prevPx) * alpha;
      man.position.set(x, 0, z);
      pose();
      placeCamera(x, z);
      renderer.render(scene, camera);
      if (needSnap) { needSnap = false; takeSnap(); prepareShare(); }
    }
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      acc += dt;
      while (acc >= STEP) { step(STEP); acc -= STEP; }
      render(acc / STEP);
      requestAnimationFrame(loop);
    }

    resize();
    start();
    applyLang();
    // 最初の1回が重くならないように、全部の形を一度描いておく
    { puddle.visible = true; burst(new THREE.Vector3(0, 1, -2), 1, '#fff', 0, 0.01, 0.01, 0); placeCamera(0, 0); renderer.compile(scene, camera); renderer.render(scene, camera); puddle.visible = false; }
    requestAnimationFrame(t0 => { last = t0; loop(t0); });
  </script>
</body>
</html>
