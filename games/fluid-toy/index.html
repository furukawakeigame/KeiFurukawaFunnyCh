      // マドラーに押される
      const sx = b.x - stick.x, sz = b.z - stick.z, sd = Math.hypot(sx, sz), rr = RM + RMIN + SR;
      if (b.y + RMIN > stick.tip && sd < rr && sd > 1e-6) { b.x += sx / sd * (rr - sd); b.z += sz / sd * (rr - sd); b.vx += sx / sd * 0.5; b.vz += sz / sd * 0.5; }
      const lim = RM + RMIN;
      if (b.x < tankX - TW + lim) { b.x = tankX - TW + lim; b.vx = Math.abs(b.vx) * 0.3; }
      if (b.x > tankX + TW - lim) { b.x = tankX + TW - lim; b.vx = -Math.abs(b.vx) * 0.3; }
      if (b.z < -TD + lim) { b.z = -TD + lim; b.vz = Math.abs(b.vz) * 0.3; }
      if (b.z > TD - lim) { b.z = TD - lim; b.vz = -Math.abs(b.vz) * 0.3; }
      if (b.y < RMIN) { b.y = RMIN; b.vy = Math.abs(b.vy) * 0.2; }
      if (b.y > 2.8) { b.y = 2.8; b.vy = 0; }
    }

    // ざぶん: 水面の水を丸くすくって持ち上げ、上から落とす（全体の1割ちょっと）
    const SCOOP_R = Math.cbrt(0.13 * 2 * TW * 2 * TD * LEVEL * 3 / (4 * Math.PI)) * 1.25;
    function dropBlob() {
      const r = Math.min(SCOOP_R, TD - 0.05);
      const cx = tankX + (Math.random() * 2 - 1) * (TW - r - 0.05), cz = (Math.random() * 2 - 1) * Math.max(0, TD - r - 0.05), cy = LEVEL - r * 0.35;
      scoop = { c: new THREE.Vector4(cx, cy, cz, r), lift: 2.45 - cy };
      tone('sine', 220, 520, 0.18, 0.12);
      for (let k = 0; k < 4; k++) bubble(0.05, Math.random() * 0.15);
    }

    // ---------- 流体（WebGPU: MLS-MPM。粒と格子を行き来して計算するので、近くの粒を探さなくてよく速い） ----------
    // 計算は「格子1マス＝1」「1刻み＝MDT」の単位で行い、描く時に m と秒に直す
    function makeMPM(dev) {
      const CS = S * Math.cbrt(4);                 // 格子1マスの大きさ（1マスに4粒くらい）
      const MARG = 3, MSUB = 4, MDT = 0.15, STIFF = 20, VISC = 0.1;
      const OX = -TW - 0.25 - MARG * CS, OY = -MARG * CS, OZ = -TD - MARG * CS;
      const GX = Math.ceil((2 * TW + 0.5) / CS) + 2 * MARG, GY = Math.ceil(YMAX / CS) + 2 * MARG, GZ = Math.ceil(2 * TD / CS) + 2 * MARG, NC = GX * GY * GZ;
      const TS = 60 * MSUB * MDT;                  // 1秒が格子の時間でいくつか
      const GRAV = -G / (CS * TS * TS), VS = CS * TS; // 格子の重力 / 格子の速さ → m/s
      const f = v => { const s = (+v).toPrecision(9); return /[.e]/.test(s) ? s : s + '.0'; };
      const code = `
        struct P { x: vec3f, v: vec3f, C: mat3x3f };
        struct U { a: vec4f, b: vec4f, org: vec4f, gd: vec4f, walls: vec4f, wv: vec4f, b0: vec4f, b1: vec4f, st: vec4f, sc: vec4f, lift: vec4f, vb0: vec4f, vb1: vec4f, vst: vec4f };
        @group(0) @binding(0) var<uniform> u: U;
        @group(0) @binding(1) var<storage, read_write> ps: array<P>;
        @group(0) @binding(2) var<storage, read_write> cells: array<atomic<i32>>;
        @group(0) @binding(3) var<storage, read_write> grid: array<vec4f>;
        @group(0) @binding(4) var<storage, read_write> outp: array<vec4f>;
        const NP = ${N}u; const NCELL = ${NC}u; const GN = vec3i(${GX}, ${GY}, ${GZ});
        const FP = 10000000.0; const CS = ${f(CS)}; const VS = ${f(VS)};
        const PR = ${f(PR)}; const SR = ${f(SR)}; const RM = ${f(RM)}; const RMIN = ${f(RMIN)}; const HEAD_Y = ${f(HEAD_Y)}; const HEAD_R = ${f(HEAD_R)};
        fn cid(c: vec3i) -> i32 { return (c.x * GN.y + c.y) * GN.z + c.z; }
        fn inb(c: vec3i) -> bool { return all(c >= vec3i(0)) && all(c < GN); }
        fn weights(d: vec3f) -> array<vec3f, 3> { return array<vec3f, 3>(0.5 * (0.5 - d) * (0.5 - d), 0.75 - d * d, 0.5 * (0.5 + d) * (0.5 + d)); }
        // 浮き輪（輪＋頭）とマドラーから粒を押し出す（m 単位）
        fn bodyCollide(p0: vec3f, b: vec4f) -> vec3f {
          var p = p0; var l = p - b.xyz;
          if (b.w < 0.5 || dot(l.xz, l.xz) > 0.2 || l.y < -0.2 || l.y > 0.45) { return p; }
          let q = length(l.xz); let a = q - RM; let d = length(vec2f(a, l.y));
          if (d < RMIN + PR && d > 1e-6 && q > 1e-6) { p += vec3f(a * l.x / q, l.y, a * l.z / q) * ((RMIN + PR - d) / d); }
          l = p - b.xyz - vec3f(0.0, HEAD_Y, 0.0); let dh = length(l);
          if (dh < HEAD_R + PR && dh > 1e-6) { p += l * ((HEAD_R + PR - dh) / dh); }
          return p;
        }
        fn stickCollide(p0: vec3f) -> vec3f {
          var p = p0;
          if (p.y > u.st.z - PR) {
            let s = p.xz - u.st.xy; let rr = SR + PR;
            if (dot(s, s) < rr * rr) {
              if (p.y > u.st.z) { let d = max(length(s), 1e-6); p = vec3f(p.x + s.x * ((rr - d) / d), p.y, p.z + s.y * ((rr - d) / d)); }
              else { let s3 = vec3f(s.x, p.y - u.st.z, s.y); let d = max(length(s3), 1e-6); if (d < rr) { p += s3 * ((rr - d) / d); } }
            }
          }
          return p;
        }
        // 粒 → 格子: 重さと運動量を配る
        @compute @workgroup_size(64) fn p2g1(@builtin(global_invocation_id) id: vec3u) {
          let i = id.x; if (i >= NP) { return; }
          let p = ps[i]; let ci = vec3i(floor(p.x)); var w = weights(p.x - (vec3f(ci) + 0.5));
          for (var gx = 0; gx < 3; gx++) { for (var gy = 0; gy < 3; gy++) { for (var gz = 0; gz < 3; gz++) {
            let c = ci + vec3i(gx - 1, gy - 1, gz - 1); if (!inb(c)) { continue; }
            let wt = w[gx].x * w[gy].y * w[gz].z; let cd = (vec3f(c) + 0.5) - p.x;
            let mom = wt * (p.v + p.C * cd); let k = cid(c) * 4;
            atomicAdd(&cells[k], i32(mom.x * FP)); atomicAdd(&cells[k + 1], i32(mom.y * FP)); atomicAdd(&cells[k + 2], i32(mom.z * FP)); atomicAdd(&cells[k + 3], i32(wt * FP));
          } } }
        }
        // 粒 → 格子: 密度から圧力（押し縮められると押し返す）と粘りを求めて配る
        @compute @workgroup_size(64) fn p2g2(@builtin(global_invocation_id) id: vec3u) {
          let i = id.x; if (i >= NP) { return; }
          let p = ps[i]; let ci = vec3i(floor(p.x)); var w = weights(p.x - (vec3f(ci) + 0.5));
          var density = 0.0;
          for (var gx = 0; gx < 3; gx++) { for (var gy = 0; gy < 3; gy++) { for (var gz = 0; gz < 3; gz++) {
            let c = ci + vec3i(gx - 1, gy - 1, gz - 1); if (!inb(c)) { continue; }
            density += w[gx].x * w[gy].y * w[gz].z * f32(atomicLoad(&cells[cid(c) * 4 + 3])) / FP;
          } } }
          let pressure = max(-0.1, u.a.z * (pow(density / u.a.w, 5.0) - 1.0));
          var stress = mat3x3f(-pressure, 0.0, 0.0, 0.0, -pressure, 0.0, 0.0, 0.0, -pressure);
          stress += (p.C + transpose(p.C)) * u.b.x;
          let eq16 = stress * (-4.0 * u.a.x / max(density, 1e-3));
          for (var gx = 0; gx < 3; gx++) { for (var gy = 0; gy < 3; gy++) { for (var gz = 0; gz < 3; gz++) {
            let c = ci + vec3i(gx - 1, gy - 1, gz - 1); if (!inb(c)) { continue; }
            let wt = w[gx].x * w[gy].y * w[gz].z; let cd = (vec3f(c) + 0.5) - p.x;
            let mom = eq16 * cd * wt; let k = cid(c) * 4;
            atomicAdd(&cells[k], i32(mom.x * FP)); atomicAdd(&cells[k + 1], i32(mom.y * FP)); atomicAdd(&cells[k + 2], i32(mom.z * FP));
          } } }
        }
        // 格子: 運動量 → 速さ、重力
        @compute @workgroup_size(64) fn updateGrid(@builtin(global_invocation_id) id: vec3u) {
          let k = id.x; if (k >= NCELL) { return; }
          let m = f32(atomicLoad(&cells[k * 4 + 3])) / FP;
          var v = vec3f(0.0);
          if (m > 0.0) {
            v = vec3f(f32(atomicLoad(&cells[k * 4])), f32(atomicLoad(&cells[k * 4 + 1])), f32(atomicLoad(&cells[k * 4 + 2]))) / FP / m;
            v.y += u.a.x * u.a.y;
          }
          let c = vec3i(i32(k) / (GN.y * GN.z), (i32(k) / GN.z) % GN.y, i32(k) % GN.z);
          if (c.x < 2 || c.x > GN.x - 3) { v.x = 0.0; }
          if (c.y < 2 || c.y > GN.y - 3) { v.y = 0.0; }
          if (c.z < 2 || c.z > GN.z - 3) { v.z = 0.0; }
          grid[k] = vec4f(v, m);
        }
        // 格子 → 粒: 速さと渦（C）を集めて動かす
        @compute @workgroup_size(64) fn g2p(@builtin(global_invocation_id) id: vec3u) {
          let i = id.x; if (i >= NP) { return; }
          var p = ps[i]; let ci = vec3i(floor(p.x)); var w = weights(p.x - (vec3f(ci) + 0.5));
          var v = vec3f(0.0); var B = mat3x3f(vec3f(0.0), vec3f(0.0), vec3f(0.0));
          for (var gx = 0; gx < 3; gx++) { for (var gy = 0; gy < 3; gy++) { for (var gz = 0; gz < 3; gz++) {
            let c = ci + vec3i(gx - 1, gy - 1, gz - 1); if (!inb(c)) { continue; }
            let wt = w[gx].x * w[gy].y * w[gz].z; let cd = (vec3f(c) + 0.5) - p.x;
            let gv = grid[cid(c)].xyz * wt;
            B += mat3x3f(gv * cd.x, gv * cd.y, gv * cd.z); v += gv;
          } } }
          p.C = B * 4.0;
          // 1刻みに半マス以上は動かさない（速すぎると計算が崩れるため）
          let sp = length(v) * u.a.x; if (sp > 0.5) { v *= 0.5 / sp; }
          var x = p.x + v * u.a.x;
          // 見えない壁（ゆれる水槽）と床
          if (x.x < u.walls.x) { x.x = u.walls.x; v.x = max(v.x, u.wv.x); }
          if (x.x > u.walls.y) { x.x = u.walls.y; v.x = min(v.x, u.wv.x); }
          if (x.z < u.walls.z) { x.z = u.walls.z; v.z = max(v.z, 0.0); }
          if (x.z > u.walls.w) { x.z = u.walls.w; v.z = min(v.z, 0.0); }
          if (x.y < u.wv.z) { x.y = u.wv.z; v.y = max(v.y, 0.0); }
          if (x.y > u.wv.y) { x.y = u.wv.y; v.y = min(v.y, 0.0); }
          // 浮き輪とマドラー（押し出した分は速さにも足す）
          // 押し出した向きには、ぶつかった物と同じ速さまでしか動かさない（勢いを足しすぎない）
          var wp = u.org.xyz + x * CS; var vw = v * VS; let w0 = wp;
          for (var k = 0; k < 3; k++) {
            let q = select(select(stickCollide(wp), bodyCollide(wp, u.b1), k == 1), bodyCollide(wp, u.b0), k == 0);
            let dq = q - wp;
            if (dot(dq, dq) > 0.0) {
              let n = normalize(dq); let vo = select(select(u.vst.xyz, u.vb1.xyz, k == 1), u.vb0.xyz, k == 0);
              let rel = dot(vw - vo, n); if (rel < 0.0) { vw -= n * rel; }
              wp = q;
            }
          }
          if (any(wp != w0)) { x = (wp - u.org.xyz) / CS; v = vw / VS; }
          p.x = x; p.v = v; ps[i] = p;
        }
        // 描く用: 位置と速さを m・秒に直して書き出す
        @compute @workgroup_size(64) fn writeOut(@builtin(global_invocation_id) id: vec3u) {
          let i = id.x; if (i >= NP) { return; }
          let p = ps[i]; let vw = p.v * VS;
          outp[i] = vec4f(u.org.xyz + p.x * CS, length(vw)); outp[NP + i] = vec4f(vw, 0.0);
        }
        // ざぶん: すくった水を持ち上げ、下向きの速さを付ける
        @compute @workgroup_size(64) fn scoop(@builtin(global_invocation_id) id: vec3u) {
          let i = id.x; if (i >= NP) { return; }
          var p = ps[i];
          if (distance(u.org.xyz + p.x * CS, u.sc.xyz) < u.sc.w) {
            p.x.y += u.lift.x / CS; p.v = vec3f(0.0, -1.5 / VS, 0.0); p.C = mat3x3f(vec3f(0.0), vec3f(0.0), vec3f(0.0)); ps[i] = p;
          }
        }`;
      dev.pushErrorScope('validation');
      const SB = GPUBufferUsage;
      const pBuf = dev.createBuffer({ size: N * 80, usage: SB.STORAGE | SB.COPY_DST });
      const cellBuf = dev.createBuffer({ size: NC * 16, usage: SB.STORAGE | SB.COPY_DST });
      const gridBuf = dev.createBuffer({ size: NC * 16, usage: SB.STORAGE });
      const outBuf = dev.createBuffer({ size: N * 32, usage: SB.STORAGE | SB.COPY_SRC });
      const uBuf = dev.createBuffer({ size: 224, usage: SB.UNIFORM | SB.COPY_DST });
      const stage = [0, 1].map(() => ({ buf: dev.createBuffer({ size: N * 32, usage: SB.MAP_READ | SB.COPY_DST }), busy: false }));
      const mod = dev.createShaderModule({ code });
      const vis = GPUShaderStage.COMPUTE;
      const bgl = dev.createBindGroupLayout({ entries: [
        { binding: 0, visibility: vis, buffer: { type: 'uniform' } },
        ...[1, 2, 3, 4].map(binding => ({ binding, visibility: vis, buffer: { type: 'storage' } })),
      ] });
      const layout = dev.createPipelineLayout({ bindGroupLayouts: [bgl] });
      const pipe = name => dev.createComputePipeline({ layout, compute: { module: mod, entryPoint: name } });
      const P = { p2g1: pipe('p2g1'), p2g2: pipe('p2g2'), updateGrid: pipe('updateGrid'), g2p: pipe('g2p'), writeOut: pipe('writeOut'), scoop: pipe('scoop') };
      const bg = dev.createBindGroup({ layout: bgl, entries: [uBuf, pBuf, cellBuf, gridBuf, outBuf].map((buffer, binding) => ({ binding, resource: { buffer } })) });
      // うまく作れなかったら WebGL の計算に切り替えて読み直す
      const fallback = () => { try { sessionStorage.setItem('fluid-toy:nogpu', '1'); } catch {} location.reload(); };
      dev.popErrorScope().then(e => { if (e) { console.warn(e.message); fallback(); } });
      dev.lost.then(i => { if (i.reason !== 'destroyed') fallback(); });

      // 描く側（WebGL）に渡すテクスチャ
      const posData = new Float32Array(N * 4), velData = new Float32Array(N * 4), prevSpeed = new Float32Array(N);
      const tex = d => { const t = new THREE.DataTexture(d, TXW, TXH, THREE.RGBAFormat, THREE.FloatType); t.needsUpdate = true; return t; };
      const posTex = tex(posData), velTex = tex(velData);
      const ud = new Float32Array(56);
      let lastTank = 0;

      function onData(a) {
        posData.set(a.subarray(0, N * 4)); velData.set(a.subarray(N * 4, N * 8));
        posTex.needsUpdate = velTex.needsUpdate = true;
        // 浮き輪のまわりの水面・流れと、全体の揺れ・しぶきを集計する（PBF 版と同じ並び）
        stats.fill(0); stats[0] = stats[8] = -1;
        let sum = 0, imp = 0;
        const b0 = bodies[0], b1 = bodies[1];
        for (let i = 0; i < N; i++) {
          const x = posData[i * 4], y = posData[i * 4 + 1], z = posData[i * 4 + 2], sp = posData[i * 4 + 3];
          sum += sp;
          if (prevSpeed[i] > 2.5 && prevSpeed[i] - sp > 1.5) imp += prevSpeed[i] - sp;
          prevSpeed[i] = sp;
          for (let k = 0; k < 2; k++) {
            const b = k ? b1 : b0; if (!b.on) continue;
            const dx = x - b.x, dz = z - b.z, d2 = dx * dx + dz * dz, dy = y - b.y, o = k * 8;
            if (d2 > 0.18 && d2 < 0.36 && sp < 1.5 && y < b.y + 0.4 && y > stats[o]) stats[o] = y; // 輪のすぐ外の水面（飛んでいるしぶきは除く）
            if (d2 + dy * dy < 0.16) { stats[o + 1]++; stats[o + 2] += velData[i * 4]; stats[o + 3] += velData[i * 4 + 1]; stats[o + 4] += velData[i * 4 + 2]; }
          }
        }
        agitation = sum / N; impact = imp / N;
      }

      function init() {
        const a = new Float32Array(N * 20), pts = [];
        const nx = Math.floor(2 * TW / S), ny = Math.floor(2.2 / S), nz = Math.floor(2 * TD / S);
        for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++) for (let k = 0; k < nz; k++) {
          const x = -TW + PR + i * S, y = PR + j * S;
          pts.push([y - 0.35 * x, x, y, -TD + PR + k * S]);
        }
        pts.sort((p, q) => p[0] - q[0]); // 斜めの水面より下の粒から順に使う
        for (let i = 0; i < N; i++) {
          a[i * 20] = (pts[i][1] - OX) / CS + (Math.random() - 0.5) * 0.01; a[i * 20 + 1] = (pts[i][2] - OY) / CS; a[i * 20 + 2] = (pts[i][3] - OZ) / CS + (Math.random() - 0.5) * 0.01;
          posData[i * 4] = pts[i][1]; posData[i * 4 + 1] = pts[i][2]; posData[i * 4 + 2] = pts[i][3];
        }
        dev.queue.writeBuffer(pBuf, 0, a);
        posTex.needsUpdate = true;
      }

      function step() {
        const st = stage.find(s => !s.busy);
        if (!st) return; // GPU が追いついていないときは、この刻みを飛ばす
        // 壁は格子の単位で（粒の半径ぶん内側）
        const wall = PR / CS;
        ud.set([MDT, GRAV, STIFF, 4.0], 0);
        ud.set([VISC, 0, 0, 0], 4);
        ud.set([OX, OY, OZ, 0], 8);
        ud.set([(tankX - TW - OX) / CS + wall, (tankX + TW - OX) / CS - wall, (-TD - OZ) / CS + wall, (TD - OZ) / CS - wall], 16);
        ud.set([(tankX - lastTank) / CS / (MSUB * MDT), (YMAX - OY) / CS, (0 - OY) / CS + wall, 0], 20);
        lastTank = tankX;
        ud.set([bodies[0].x, bodies[0].y, bodies[0].z, bodies[0].on ? 1 : 0], 24);
        ud.set([bodies[1].x, bodies[1].y, bodies[1].z, bodies[1].on ? 1 : 0], 28);
        ud.set([stick.x, stick.z, stick.tip, 0], 32);
        if (scoop) { ud.set([scoop.c.x, scoop.c.y, scoop.c.z, scoop.c.w], 36); ud.set([scoop.lift, 0, 0, 0], 40); }
        ud.set([bodies[0].vx, bodies[0].vy, bodies[0].vz, 0], 44);
        ud.set([bodies[1].vx, bodies[1].vy, bodies[1].vz, 0], 48);
        ud.set([(stick.x - stick.px) / DT, (stick.tip - stick.ptip) / DT, (stick.z - stick.pz) / DT, 0], 52);
        dev.queue.writeBuffer(uBuf, 0, ud);
        const enc = dev.createCommandEncoder();
        const run = (names, count) => { const ps = enc.beginComputePass(); ps.setBindGroup(0, bg); for (const n of names) { ps.setPipeline(P[n]); ps.dispatchWorkgroups(Math.ceil((n === 'updateGrid' ? NC : N) / 64)); } ps.end(); };
        if (scoop) { run(['scoop']); scoop = null; }
        for (let s = 0; s < MSUB; s++) {
          enc.clearBuffer(cellBuf);
          run(['p2g1', 'p2g2', 'updateGrid', 'g2p']);
        }
        run(['writeOut']);
        st.busy = true;
        enc.copyBufferToBuffer(outBuf, 0, st.buf, 0, N * 32);
        dev.queue.submit([enc.finish()]);
        st.buf.mapAsync(GPUMapMode.READ).then(() => {
          onData(new Float32Array(st.buf.getMappedRange()));
          st.buf.unmap(); st.busy = false;
        }).catch(() => { st.busy = false; });
      }
      return { init, step, posTex, velTex };
    }
    const mpm = MPM ? makeMPM(GPUDEV) : null;

    // ---------- 3D ----------
    const stage = document.getElementById('stage');
    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, MOBILE ? 1.25 : 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    stage.prepend(renderer.domElement);
    const scene = new THREE.Scene();
    const canvasTex = (w, h, draw) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; return tx; };

      if (ptr && e.pointerId === ptr.id) { if (ptr.body) aimCat(ptr.body); else aimStick(); }
    });
    const up = e => {
      if (!ptr || e.pointerId !== ptr.id) return;
      const body = ptr.body;
      if (body) { body.grab = false; if (Math.hypot(body.vx, body.vy, body.vz) > 3) meow('throw', body.f0); }
      else stick.down = false;
      ptr = null;
    };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
    stage.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
    document.getElementById('shake').addEventListener('click', () => { shakeT = 0; tone('sine', 90, 55, 0.2, 0.25); });
    document.getElementById('splash').addEventListener('click', dropBlob);

    // ---------- 自分の画像（塗った所だけ切り抜いて、2つ目の浮き輪に乗せる。タピオカメーカーと同じ） ----------
    const $ = id => document.getElementById(id);
    const userCanvas = document.createElement('canvas'); userCanvas.width = userCanvas.height = 256;
    const userTex = new THREE.CanvasTexture(userCanvas); userTex.colorSpace = THREE.SRGBColorSpace;
    floats[1].face.material = faceMat(userTex);
    // 切り抜いた絵を、縦横比を保って正方形の真ん中に置く
    function setUser(url, drop) {
      const im = new Image();
      im.onload = () => {
        const g = userCanvas.getContext('2d'), k = 256 / Math.max(im.width, im.height);
        g.clearRect(0, 0, 256, 256); g.drawImage(im, (256 - im.width * k) / 2, (256 - im.height * k) / 2, im.width * k, im.height * k);
        userTex.needsUpdate = true;
        const b = bodies[1];
        if (drop || !b.on) { Object.assign(b, { x: tankX - 0.5, y: 2.2, z: 0, vx: 0, vy: 0, vz: 0, grab: false }); b.px = b.x; b.py = b.y; b.pz = b.z; }
        b.on = true;
        if (drop) meow('throw', b.f0);
      };
      im.src = url;
    }
    { const saved = store.get('face', null); if (saved) setUser(saved, false); }

    const cutCv = $('cut'), cx = cutCv.getContext('2d');
    let img = null, mask = null, mctx = null, CW = 0, CH = 0, CB = 0, DPR = 1, view = null;
    let brushIdx = 1, erasing = false, undoStack = [], lastPt = null, pinch = null;
    const touches = new Map(), BRUSH = [8, 22, 50];
    const painting = () => document.body.classList.contains('painting');
    function setPainting(on) {
      document.body.classList.toggle('painting', on);
      if (on) { erasing = false; $('erase').classList.remove('on'); updateDone(); resizeCut(); }
    }
    $('image').addEventListener('click', () => $('file').click());
    $('file').addEventListener('change', e => { loadFile(e.target.files[0]); e.target.value = ''; });
    function loadFile(f) {
      if (!f || !f.type.startsWith('image/')) return;
      const u = URL.createObjectURL(f), im = new Image();
      im.onload = () => {
        URL.revokeObjectURL(u);
        const k = Math.min(1, 1600 / Math.max(im.width, im.height));
        img = document.createElement('canvas');
        img.width = Math.max(1, Math.round(im.width * k)); img.height = Math.max(1, Math.round(im.height * k));
        img.getContext('2d').drawImage(im, 0, 0, img.width, img.height);
        mask = document.createElement('canvas'); mask.width = img.width; mask.height = img.height;
        mctx = mask.getContext('2d');
        undoStack = []; touches.clear(); pinch = null;
        setPainting(true);
      };
      im.onerror = () => URL.revokeObjectURL(u);
      im.src = u;
    }
    function resizeCut() {
      if (!painting()) return;
      const r = cutCv.getBoundingClientRect();
      DPR = Math.min(window.devicePixelRatio || 1, 2); CW = r.width; CH = r.height;
      // 下のボタンと空白の所には画像を置かない
      CB = Math.max(0, r.bottom - $('paintBar').getBoundingClientRect().top);
      cutCv.width = Math.max(1, Math.round(CW * DPR)); cutCv.height = Math.max(1, Math.round(CH * DPR));
      if (img) { const pad = 12, k = Math.min((CW - pad * 2) / img.width, (CH - CB - pad * 2) / img.height); view = { k, fit: k, x: (CW - img.width * k) / 2, y: (CH - CB - img.height * k) / 2 }; }
      drawCut();
    }
    addEventListener('resize', resizeCut);
    function snapFit() { if (view.k <= view.fit * 1.001) { view.x = (CW - img.width * view.k) / 2; view.y = (CH - CB - img.height * view.k) / 2; } }
    let tmpC = null;
    function drawCut() {
      cx.setTransform(DPR, 0, 0, DPR, 0, 0); cx.clearRect(0, 0, CW, CH);
      if (!img || !view) return;
      const { k, x, y } = view;
      cx.fillStyle = '#20343a'; cx.fillRect(x, y, img.width * k, img.height * k);
      cx.globalAlpha = 0.35; cx.drawImage(img, x, y, img.width * k, img.height * k); cx.globalAlpha = 1;
      if (!tmpC || tmpC.width !== img.width || tmpC.height !== img.height) { tmpC = document.createElement('canvas'); tmpC.width = img.width; tmpC.height = img.height; }
      const g = tmpC.getContext('2d');
      g.globalCompositeOperation = 'source-over'; g.clearRect(0, 0, tmpC.width, tmpC.height); g.drawImage(mask, 0, 0);
      g.globalCompositeOperation = 'source-in'; g.drawImage(img, 0, 0);
      g.globalCompositeOperation = 'source-atop'; g.fillStyle = 'rgba(60, 220, 110, 0.45)'; g.fillRect(0, 0, tmpC.width, tmpC.height);
      cx.drawImage(tmpC, x, y, img.width * k, img.height * k);
    }
    const brushPx = () => BRUSH[brushIdx] / view.k;
    function toImg(e) { const r = cutCv.getBoundingClientRect(); return { x: (e.clientX - r.left - view.x) / view.k, y: (e.clientY - r.top - view.y) / view.k }; }
    const mid = (a, b) => { const r = cutCv.getBoundingClientRect(); return { x: (a.x + b.x) / 2 - r.left, y: (a.y + b.y) / 2 - r.top }; };
    function stroke(a, b) {
      mctx.save();
      mctx.globalCompositeOperation = erasing ? 'destination-out' : 'source-over';
      mctx.strokeStyle = '#000'; mctx.fillStyle = '#000';
      mctx.lineCap = 'round'; mctx.lineJoin = 'round'; mctx.lineWidth = brushPx();
      mctx.beginPath(); mctx.moveTo(a.x, a.y); mctx.lineTo(b.x, b.y); mctx.stroke();
      mctx.beginPath(); mctx.arc(b.x, b.y, brushPx() / 2, 0, Math.PI * 2); mctx.fill();
      mctx.restore();
    }
    function maskBox() {
      if (!mctx) return null;
      const d = mctx.getImageData(0, 0, mask.width, mask.height).data;
      let x0 = mask.width, y0 = mask.height, x1 = -1, y1 = -1;
      for (let y = 0; y < mask.height; y++) for (let x = 0; x < mask.width; x++) {
        if (d[(y * mask.width + x) * 4 + 3] > 20) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      }
      return x1 < 0 ? null : { x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1 };
    }
    function updateDone() { $('done').disabled = !maskBox(); }
    function makeSprite() {
      const b = maskBox(); if (!b) return null;
      const k = Math.min(1, 256 / Math.max(b.w, b.h));
      const c = document.createElement('canvas');
      c.width = Math.max(2, Math.round(b.w * k)); c.height = Math.max(2, Math.round(b.h * k));
      const g = c.getContext('2d');
      g.drawImage(img, b.x, b.y, b.w, b.h, 0, 0, c.width, c.height);
      g.globalCompositeOperation = 'destination-in';
      g.drawImage(mask, b.x, b.y, b.w, b.h, 0, 0, c.width, c.height);
      return c;
    }
    cutCv.addEventListener('pointerdown', e => {
      if (!view) return;
      e.preventDefault(); cutCv.setPointerCapture(e.pointerId);
      touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (touches.size === 1 && !pinch) {
        undoStack.push(mctx.getImageData(0, 0, mask.width, mask.height));
        if (undoStack.length > 20) undoStack.shift();
        lastPt = toImg(e); stroke(lastPt, lastPt); drawCut();
      } else if (touches.size === 2) {
        // 2本目の指：塗りかけを取り消して拡大縮小
        if (lastPt) { const d = undoStack.pop(); if (d) mctx.putImageData(d, 0, 0); lastPt = null; }
        const [a, b] = [...touches.values()];
        pinch = { d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, m0: mid(a, b), k0: view.k, x0: view.x, y0: view.y };
        drawCut();
      }
    });
    cutCv.addEventListener('pointermove', e => {
      if (!touches.has(e.pointerId)) return;
      touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pinch && touches.size >= 2) {
        const [a, b] = [...touches.values()], m = mid(a, b);
        const k = Math.max(view.fit, Math.min(view.fit * 12, pinch.k0 * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d0));
        view.x = m.x - (pinch.m0.x - pinch.x0) / pinch.k0 * k;
        view.y = m.y - (pinch.m0.y - pinch.y0) / pinch.k0 * k;
        view.k = k; snapFit(); drawCut();
      } else if (lastPt) { const p = toImg(e); stroke(lastPt, p); lastPt = p; drawCut(); }
    });
    const cutUp = e => {
      touches.delete(e.pointerId);
      if (touches.size === 0) pinch = null;
      if (lastPt) { lastPt = null; updateDone(); }
    };
    cutCv.addEventListener('pointerup', cutUp);
    cutCv.addEventListener('pointercancel', cutUp);
    cutCv.addEventListener('wheel', e => {
      if (!view) return;
      e.preventDefault();
      const r = cutCv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
      const k = Math.max(view.fit, Math.min(view.fit * 12, view.k * Math.exp(-e.deltaY * 0.0015)));
      view.x = mx - (mx - view.x) / view.k * k; view.y = my - (my - view.y) / view.k * k; view.k = k; snapFit(); drawCut();
    }, { passive: false });
    $('brush').onclick = () => {
      brushIdx = (brushIdx + 1) % BRUSH.length;
      const d = $('brush').firstChild; d.style.width = d.style.height = [5, 11, 20][brushIdx] + 'px';
    };
    $('erase').onclick = () => { erasing = !erasing; $('erase').classList.toggle('on', erasing); };
    $('undo').onclick = () => { const d = undoStack.pop(); if (d) { mctx.putImageData(d, 0, 0); drawCut(); updateDone(); } };
    $('cancel').onclick = () => setPainting(false);
    $('done').onclick = () => {
      const c = makeSprite(); if (!c) return;
      const url = c.toDataURL('image/png');
      store.set('face', url); setUser(url, true);
      setPainting(false);
    };

    // ---------- 共有 ----------
    // 押した瞬間の水槽を正方形に切り抜き、タイトルを小さく重ねる
    function shareImage() {
      render(1);
      const src = cv, side = Math.min(src.width, src.height);
      const f = CENTER.clone().project(camera);
      const fx = (f.x + 1) / 2 * src.width, fy = (1 - f.y) / 2 * src.height;
      const sx = THREE.MathUtils.clamp(fx - side / 2, 0, src.width - side), sy = THREE.MathUtils.clamp(fy - side / 2, 0, src.height - side);
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const g = c.getContext('2d');
      g.drawImage(src, sx, sy, side, side, 0, 0, 1080, 1080);
      g.textAlign = 'center'; g.fillStyle = '#fff'; g.lineJoin = 'round';
      let px = 64; const font = () => `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans Thai", sans-serif`;
      g.font = font(); const tw = g.measureText(t('title')).width; if (tw > 900) { px *= 900 / tw; g.font = font(); }
      g.lineWidth = px * 0.18; g.strokeStyle = '#1d5f86'; g.strokeText(t('title'), 540, 1030); g.fillText(t('title'), 540, 1030);
      return c;
    }
    const coarse = matchMedia('(pointer: coarse)').matches;
    if (!coarse) { postA.target = '_blank'; postA.rel = 'noopener'; }
    // スマホは画像ごと共有シートへ。PCは画像を保存してから投稿画面を開く（画像は同期で作るので Safari でも共有が止まらない）
    postA.addEventListener('click', e => {
      const img = shareImage();
      if (coarse && navigator.share) {
        e.preventDefault();
        const text = `${t('share')}\n${SHARE_URL}`;
        const url = img.toDataURL('image/jpeg', 0.9), bin = atob(url.split(',')[1]), arr = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        const file = new File([arr], 'fluid-toy.jpg', { type: 'image/jpeg' });
        navigator.share(navigator.canShare?.({ files: [file] }) ? { files: [file], text } : { text }).catch(() => {});
        return;
      }
      const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'fluid-toy.png'; d.click();
    });

    // ---------- ループ ----------
    const sunView = new THREE.Vector3();
    function render(alpha) {
      if (MPM) { PTU.tX0.value = PTU.tX1.value = mpm.posTex; PTU.tVel.value = mpm.velTex; PTU.uAlpha.value = 1; }
      else { PTU.tX0.value = posRT[0].texture; PTU.tX1.value = posRT[1].texture; PTU.tVel.value = velRT.texture; PTU.uAlpha.value = alpha; }
      tank.position.x = tankX;
      BMIN.set(tankX - TW, 0, -TD); BMAX.set(tankX + TW, 10, TD);
      stickMesh.position.set(stick.px + (stick.x - stick.px) * alpha, stick.ptip + (stick.tip - stick.ptip) * alpha, stick.pz + (stick.z - stick.pz) * alpha);
      bodies.forEach((body, k) => {
        const { g, facing } = floats[k];
        g.visible = body.on; if (!body.on) return;
        g.position.set(body.px + (body.x - body.px) * alpha, body.py + (body.y - body.py) * alpha, body.pz + (body.z - body.pz) * alpha);
        // 傾きながら、顔をいつもこちらに向ける
        g.rotation.set(THREE.MathUtils.clamp(body.vz * 0.12, -0.4, 0.4), 0, THREE.MathUtils.clamp(-body.vx * 0.12, -0.4, 0.4));
        facing.rotation.y = Math.atan2(camera.position.x - g.position.x, camera.position.z - g.position.z);
      });

      renderer.setRenderTarget(sceneRT); renderer.render(scene, camera);
      const bg = scene.background; scene.background = null; camera.layers.set(1);
      renderer.setRenderTarget(occRT); renderer.render(scene, camera);
      scene.background = bg; camera.layers.set(0);
      renderer.setClearColor(0x000000, 0);
      renderer.setRenderTarget(depthRT); renderer.clear(); renderer.render(depthScene, camera);
      renderer.setRenderTarget(thickRT); renderer.clear(); renderer.render(thickScene, camera);
      quad.material = blurTMat;
      blurTMat.uniforms.tD.value = thickRT.texture; blurTMat.uniforms.uDir.value.set(1 / thickRT.width, 0);
      renderer.setRenderTarget(thickRT2); renderer.render(quadScene, quadCam);
      blurTMat.uniforms.tD.value = thickRT2.texture; blurTMat.uniforms.uDir.value.set(0, 1 / thickRT.height);
      renderer.setRenderTarget(thickRT); renderer.render(quadScene, quadCam);
      quad.material = blurMat;
      for (let k = 0; k < (MOBILE ? 1 : 2); k++) {
        blurMat.uniforms.tD.value = depthRT.texture; blurMat.uniforms.uDir.value.set(1 / depthRT.width, 0);
        renderer.setRenderTarget(blurRT); renderer.render(quadScene, quadCam);
        blurMat.uniforms.tD.value = blurRT.texture; blurMat.uniforms.uDir.value.set(0, 1 / depthRT.height);
        renderer.setRenderTarget(depthRT); renderer.render(quadScene, quadCam);
      }
      quad.material = compMat;
      compMat.uniforms.uVW.value.setFromMatrix4(camera.matrixWorld);
      compMat.uniforms.uSun.value.copy(sunView.copy(sun.position).normalize().transformDirection(camera.matrixWorldInverse));
      renderer.setRenderTarget(null); renderer.render(quadScene, quadCam);
    }

    let lastSplash = 0, lastDunk = 0, simTime = 0;
    function audioTick() {
      if (!ac) return;
      const now = ac.currentTime;
      const target = soundOn ? Math.min(0.32, Math.max(0, agitation - 0.12) * 0.35) : 0;
      slosh.gain.setTargetAtTime(target, now, 0.08);
      sloshF.frequency.setTargetAtTime(380 + agitation * 500, now, 0.1);
      if (soundOn && Math.random() < Math.min(0.5, (agitation - 0.15) * 0.6)) bubble(0.02 + Math.min(0.08, agitation * 0.04));
      if (impact > 0.05 && now - lastSplash > 0.15) { lastSplash = now; splashSound(Math.min(1, impact * 2.5)); }
      // 浮き輪を深く沈めると怒る
      for (const body of bodies) if (body.on && body.grab && body.y < LEVEL - 0.25 && now - lastDunk > 1.2) { lastDunk = now; meow('dunk', body.f0); for (let k = 0; k < 6; k++) bubble(0.07, Math.random() * 0.4); }
    }

    let last = performance.now(), acc = 0;
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      acc += dt;
      let n = 0;
      while (acc >= DT) { acc -= DT; if (n++ < 2) { simStep(); simTime += DT; } }
      if (n) audioTick();
      render(acc / DT);
      requestAnimationFrame(loop);
    }

    // GPU で計算するには、浮動小数点のテクスチャに描けることが必要
    if (!MPM && !renderer.extensions.has('EXT_color_buffer_float')) { const m = document.getElementById('msg'); m.style.display = 'flex'; m.textContent = t('nogpu'); throw new Error('no float render target'); }
    initWater();
    resize();
    applyLang();
    // 最初の1回が重くならないように、計算と描画を一度空回ししておく
    simStep(); render(1);
    requestAnimationFrame(t0 => { last = t0; requestAnimationFrame(loop); });
  </script>
</body>
