    drawSoundBtn();
    soundBtn.addEventListener('click', () => { soundOn = !soundOn; store.set('sound', soundOn); drawSoundBtn(); });
    let ac = null, slosh = null, sloshF = null, noiseBuf = null;
    function initAudio() {
      if (ac) return;

        ac = new (window.AudioContext || window.webkitAudioContext)();

        // ちゃぷちゃぷ: 水の動きの大きさに合わせて鳴り続けるざわめき
        const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
        sloshF = ac.createBiquadFilter(); sloshF.type = 'bandpass'; sloshF.frequency.value = 500; sloshF.Q.value = 0.9;

    addEventListener('keydown', initAudio, { capture: true });
    function tone(type, f0, f1, dur, vol, delay = 0) {
      if (!soundOn || !ac) return;

    }
    // 泡がはじける「ポコッ」: 小さな泡ほど高い音で、音程が上がりながら消える
    function bubble(vol = 0.08, delay = 0) {
      const f = 350 + Math.random() * 900;

      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.7;
      bp.frequency.setValueAtTime(1800, now); bp.frequency.exponentialRampToValueAtTime(500, now + dur);
      const g = ac.createGain(); g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(0.5 * vol + 0.05, now + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, now + dur);

    }
    // 声: 声帯の振動（のこぎり波＋ゆらぎ）を、母音ごとの共鳴（フォルマント）に通す
    const VOWEL = { a: [800, 1200, 2600], i: [300, 2300, 3000], u: [350, 1250, 2500], e: [500, 1900, 2600], o: [500, 850, 2500] };
    function voice(f0, seq, dur, vol = 0.5, shake = 0.04, breath = 0.15) {
      if (!soundOn || !ac) return;
      const now = ac.currentTime;
      const o = ac.createOscillator(); o.type = 'sawtooth';
      // 高く出て下がる抑揚

      o.frequency.exponentialRampToValueAtTime(f0 * 0.75, now + dur);

      const vg = ac.createGain(); vg.gain.value = f0 * shake; vib.connect(vg).connect(o.frequency);

      out.gain.setValueAtTime(0, now);
      out.gain.linearRampToValueAtTime(vol, now + 0.03);
      out.gain.setValueAtTime(vol, now + dur * 0.55);
      out.gain.exponentialRampToValueAtTime(0.001, now + dur);

    // 声（猫は「にゃ」「にゃう」「にゃあー」、自分の画像は低めの声）。毎回少しずつ変える

    function meow(kind, base = 620) {

      else if (kind === 'dunk') voice(f0 * 0.8, pick([['i', 'a', 'o'], ['e', 'a', 'u']]), 0.7 + Math.random() * 0.2, 0.4, 0.12, 0.25);

    const POLY6 = 315 / (64 * Math.PI * H ** 9), SPIKY = -45 / (Math.PI * H ** 6);
    const G = 13, DT = 1 / 60, MAXN = 64;
    // 静止状態の密度と、拘束の勾配の大きさを格子から求めておく
    let RHO0 = 0, D0 = 0;
    for (let a = -3; a <= 3; a++) for (let b = -3; b <= 3; b++) for (let c = -3; c <= 3; c++) {

      if (r >= H) continue;

    const LAM = new Float32Array(N), DP = new Float32Array(N * 3), SPD = new Float32Array(N);

    const cellStart = new Int32Array(NX * NY * NZ + 1), cellFill = new Int32Array(NX * NY * NZ), sorted = new Int32Array(N), pcell = new Int32Array(N);

    // ---------- 動かせる物（水槽のゆれ・マドラー・猫の浮き輪） ----------

    // 猫の浮き輪: 輪（トーラス）＋頭（球）
    const RM = 0.22, RMIN = 0.08, HEAD_Y = 0.2, HEAD_R = 0.16;
    const makeBody = (x, z, f0) => ({ x, y: 1.9, z, vx: 0, vy: 0, vz: 0, px: x, py: 1.9, pz: z, grab: false, tx: 0, ty: 0, tz: 0, sub: 0, on: true, f0 });
    // 1つ目はいつもの猫、2つ目は自分の画像を入れた時だけ浮かぶ
    const bodies = [makeBody(0.6, 0.05, 620), makeBody(-0.6, -0.1, 250)];
    bodies[1].on = false;

    function collide(i) {
      const i3 = i * 3;
      let x = P[i3], y = P[i3 + 1], z = P[i3 + 2];

      return x1 < 0 ? null : { x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1 };
    }
    function updateDone() { $('done').disabled = !maskBox(); }
    function makeSprite() {
      const b = maskBox(); if (!b) return null;
      const k = Math.min(1, 256 / Math.max(b.w, b.h));
      const c = document.createElement('canvas');
      c.width = Math.max(2, Math.round(b.w * k)); c.height = Math.max(2, Math.round(b.h * k));
      const g = c.getContext('2d');
      g.drawImage(img, b.x, b.y, b.w, b.h, 0, 0, c.width, c.height);
      g.globalCompositeOperation = 'destination-in';
      g.drawImage(mask, b.x, b.y, b.w, b.h, 0, 0, c.width, c.height);
      return c;
    }
    cutCv.addEventListener('pointerdown', e => {
      if (!view) return;
      e.preventDefault(); cutCv.setPointerCapture(e.pointerId);
      touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (touches.size === 1 && !pinch) {
        undoStack.push(mctx.getImageData(0, 0, mask.width, mask.height));
        if (undoStack.length > 20) undoStack.shift();
        lastPt = toImg(e); stroke(lastPt, lastPt); drawCut();
      } else if (touches.size === 2) {
        // 2本目の指：塗りかけを取り消して拡大縮小
        if (lastPt) { const d = undoStack.pop(); if (d) mctx.putImageData(d, 0, 0); lastPt = null; }
        const [a, b] = [...touches.values()];
        pinch = { d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, m0: mid(a, b), k0: view.k, x0: view.x, y0: view.y };
        drawCut();
      }
    });
    cutCv.addEventListener('pointermove', e => {
      if (!touches.has(e.pointerId)) return;
      touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pinch && touches.size >= 2) {
        const [a, b] = [...touches.values()], m = mid(a, b);
        const k = Math.max(view.fit, Math.min(view.fit * 12, pinch.k0 * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d0));
        view.x = m.x - (pinch.m0.x - pinch.x0) / pinch.k0 * k;
        view.y = m.y - (pinch.m0.y - pinch.y0) / pinch.k0 * k;
        view.k = k; snapFit(); drawCut();
      } else if (lastPt) { const p = toImg(e); stroke(lastPt, p); lastPt = p; drawCut(); }
    });
    const cutUp = e => {
      touches.delete(e.pointerId);
      if (touches.size === 0) pinch = null;
      if (lastPt) { lastPt = null; updateDone(); }
    };
    cutCv.addEventListener('pointerup', cutUp);
    cutCv.addEventListener('pointercancel', cutUp);
    cutCv.addEventListener('wheel', e => {
      if (!view) return;
      e.preventDefault();
      const r = cutCv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
      const k = Math.max(view.fit, Math.min(view.fit * 12, view.k * Math.exp(-e.deltaY * 0.0015)));
      view.x = mx - (mx - view.x) / view.k * k; view.y = my - (my - view.y) / view.k * k; view.k = k; snapFit(); drawCut();
    }, { passive: false });
    $('brush').onclick = () => {
      brushIdx = (brushIdx + 1) % BRUSH.length;
      const d = $('brush').firstChild; d.style.width = d.style.height = [5, 11, 20][brushIdx] + 'px';
    };
    $('erase').onclick = () => { erasing = !erasing; $('erase').classList.toggle('on', erasing); };
    $('undo').onclick = () => { const d = undoStack.pop(); if (d) { mctx.putImageData(d, 0, 0); drawCut(); updateDone(); } };
    $('cancel').onclick = () => setPainting(false);
    $('done').onclick = () => {
      const c = makeSprite(); if (!c) return;
      const url = c.toDataURL('image/png');
      store.set('face', url); setUser(url, true);
      setPainting(false);
    };

    // ---------- 共有 ----------
    // 押した瞬間の水槽を正方形に切り抜き、タイトルを小さく重ねる
    function shareImage() {
      render(1);
      const src = cv, side = Math.min(src.width, src.height);
      const f = CENTER.clone().project(camera);
      const fx = (f.x + 1) / 2 * src.width, fy = (1 - f.y) / 2 * src.height;
      const sx = THREE.MathUtils.clamp(fx - side / 2, 0, src.width - side), sy = THREE.MathUtils.clamp(fy - side / 2, 0, src.height - side);
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const g = c.getContext('2d');
      g.drawImage(src, sx, sy, side, side, 0, 0, 1080, 1080);
      g.textAlign = 'center'; g.fillStyle = '#fff'; g.lineJoin = 'round';
      let px = 64; const font = () => `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans Thai", sans-serif`;
      g.font = font(); const tw = g.measureText(t('title')).width; if (tw > 900) { px *= 900 / tw; g.font = font(); }
      g.lineWidth = px * 0.18; g.strokeStyle = '#1d5f86'; g.strokeText(t('title'), 540, 1030); g.fillText(t('title'), 540, 1030);
      return c;
    }
    const coarse = matchMedia('(pointer: coarse)').matches;
    if (!coarse) { postA.target = '_blank'; postA.rel = 'noopener'; }
    // スマホは画像ごと共有シートへ。PCは画像を保存してから投稿画面を開く（画像は同期で作るので Safari でも共有が止まらない）
    postA.addEventListener('click', e => {
      const img = shareImage();
      if (coarse && navigator.share) {
        e.preventDefault();
        const text = `${t('share')}\n${SHARE_URL}`;
        const url = img.toDataURL('image/jpeg', 0.9), bin = atob(url.split(',')[1]), arr = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        const file = new File([arr], 'fluid-toy.jpg', { type: 'image/jpeg' });
        navigator.share(navigator.canShare?.({ files: [file] }) ? { files: [file], text } : { text }).catch(() => {});
        return;
      }
      const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'fluid-toy.png'; d.click();
    });

    // ---------- ループ ----------
    const sunView = new THREE.Vector3();
    function render(alpha) {
      const pa = posAttr.array, sa = spdAttr.array;
      for (let i = 0; i < N * 3; i++) pa[i] = PX[i] + (X[i] - PX[i]) * alpha;
      sa.set(SPD);
      posAttr.needsUpdate = true; spdAttr.needsUpdate = true;
      tank.position.x = tankX;
      BMIN.set(tankX - TW, 0, -TD); BMAX.set(tankX + TW, 10, TD);
      stickMesh.position.set(stick.px + (stick.x - stick.px) * alpha, stick.ptip + (stick.tip - stick.ptip) * alpha, stick.pz + (stick.z - stick.pz) * alpha);
      bodies.forEach((body, k) => {
        const { g, facing } = floats[k];
        g.visible = body.on; if (!body.on) return;
        g.position.set(body.px + (body.x - body.px) * alpha, body.py + (body.y - body.py) * alpha, body.pz + (body.z - body.pz) * alpha);
        // 傾きながら、顔をいつもこちらに向ける
        g.rotation.set(THREE.MathUtils.clamp(body.vz * 0.12, -0.4, 0.4), 0, THREE.MathUtils.clamp(-body.vx * 0.12, -0.4, 0.4));
        facing.rotation.y = Math.atan2(camera.position.x - g.position.x, camera.position.z - g.position.z);
      });

      renderer.setRenderTarget(sceneRT); renderer.render(scene, camera);
      const bg = scene.background; scene.background = null; camera.layers.set(1);
      renderer.setRenderTarget(occRT); renderer.render(scene, camera);
      scene.background = bg; camera.layers.set(0);
      renderer.setClearColor(0x000000, 0);
      renderer.setRenderTarget(depthRT); renderer.clear(); renderer.render(depthScene, camera);
      renderer.setRenderTarget(thickRT); renderer.clear(); renderer.render(thickScene, camera);
      quad.material = blurTMat;
      blurTMat.uniforms.tD.value = thickRT.texture; blurTMat.uniforms.uDir.value.set(1 / thickRT.width, 0);
      renderer.setRenderTarget(thickRT2); renderer.render(quadScene, quadCam);
      blurTMat.uniforms.tD.value = thickRT2.texture; blurTMat.uniforms.uDir.value.set(0, 1 / thickRT.height);
      renderer.setRenderTarget(thickRT); renderer.render(quadScene, quadCam);
      quad.material = blurMat;
      for (let k = 0; k < 2; k++) {
        blurMat.uniforms.tD.value = depthRT.texture; blurMat.uniforms.uDir.value.set(1 / depthRT.width, 0);
        renderer.setRenderTarget(blurRT); renderer.render(quadScene, quadCam);
        blurMat.uniforms.tD.value = blurRT.texture; blurMat.uniforms.uDir.value.set(0, 1 / depthRT.height);
        renderer.setRenderTarget(depthRT); renderer.render(quadScene, quadCam);
      }
      quad.material = compMat;
      compMat.uniforms.uVW.value.setFromMatrix4(camera.matrixWorld);
      compMat.uniforms.uSun.value.copy(sunView.copy(sun.position).normalize().transformDirection(camera.matrixWorldInverse));
      renderer.setRenderTarget(null); renderer.render(quadScene, quadCam);
    }

    let lastSplash = 0, lastDunk = 0, simTime = 0;
    function audioTick() {
      if (!ac) return;
      const now = ac.currentTime;
      const target = soundOn ? Math.min(0.32, Math.max(0, agitation - 0.12) * 0.35) : 0;
      slosh.gain.setTargetAtTime(target, now, 0.08);
      sloshF.frequency.setTargetAtTime(380 + agitation * 500, now, 0.1);
      if (soundOn && Math.random() < Math.min(0.5, (agitation - 0.15) * 0.6)) bubble(0.02 + Math.min(0.08, agitation * 0.04));
      if (impact > 0.05 && now - lastSplash > 0.15) { lastSplash = now; splashSound(Math.min(1, impact * 2.5)); }
      // 浮き輪を深く沈めると怒る
      for (const body of bodies) if (body.on && body.grab && body.y < LEVEL - 0.25 && now - lastDunk > 1.2) { lastDunk = now; meow('dunk', body.f0); for (let k = 0; k < 6; k++) bubble(0.07, Math.random() * 0.4); }
    }

    let last = performance.now(), acc = 0;
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      acc += dt;
      let n = 0;
      while (acc >= DT) { acc -= DT; if (n++ < 2) { simStep(); simTime += DT; } }
      if (n) audioTick();
      render(acc / DT);
      requestAnimationFrame(loop);
    }

    initWater();
    resize();
    applyLang();
    // 最初の1回が重くならないように、計算と描画を一度空回ししておく
    simStep(); render(1);
    requestAnimationFrame(t0 => { last = t0; requestAnimationFrame(loop); });
  </script>
</body>
</html>
