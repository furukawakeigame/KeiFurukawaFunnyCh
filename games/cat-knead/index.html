    const rnd = (a, b) => a + Math.random() * (b - a);
    const texOf = (c, srgb = true) => { const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; };

    // ---------- 作業台（木） ----------
    function woodCanvas() {
      const c = mkCanvas(1024, 1024), g = c.getContext('2d');
      const strips = 9, sw = 1024 / strips;
      for (let s = 0; s < strips; s++) {
        const base = [rnd(150, 185), rnd(105, 130), rnd(68, 88)];
        const x0 = s * sw;
        g.fillStyle = `rgb(${base[0]},${base[1]},${base[2]})`;

    const spill = new THREE.Mesh(new THREE.PlaneGeometry(4.6, 4.6), new THREE.MeshStandardMaterial({ map: texOf(flourSpillCanvas()), transparent: true, depthWrite: false, roughness: 1, envMapIntensity: 0.3 }));

    {

      if (now - lastUser < 6) return;
      demoT -= dt;
      if (demoHeld && demoT < 0.42) { release(demoHeld); demoHeld = null; }
      if (demoT <= 0) {
        demoT = 0.62 + rnd(0, 0.1);
        demoSide ^= 1;
        const p = paws[demoSide];
        if (p.phase === 'rest') {
          press(p, (demoSide ? 0.3 : -0.3) + rnd(-0.06, 0.06), 0.12 + rnd(-0.06, 0.06));
          demoHeld = p;
        }
      }
    }

    // ---------- ループ ----------
    let lastT = performance.now(), smoothAcc = 0, camBob = new THREE.Vector3(), camRoll = 0;
    const posArr = doughGeo.attributes.position.array;
    function smoothD() {
      // 跡のふちを少しずつなだらかにする（生地がなじむ）
      DT.set(D);
      const S = GN + 1, k = 0.1;
      for (let i = 1; i < GN; i++) for (let j = 1; j < GN; j++) {
        const v = i * S + j;
        for (let c = 0; c < 3; c++) {
          const a = DT[(v - 1) * 3 + c] + DT[(v + 1) * 3 + c] + DT[(v - S) * 3 + c] + DT[(v + S) * 3 + c];
          D[v * 3 + c] = DT[v * 3 + c] + k * (a * 0.25 - DT[v * 3 + c]);
        }
      }
    }
    function frame(t) {
      const dt = Math.min(0.05, (t - lastT) / 1000); lastT = t;
      if (!window.__hold) update(dt);
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    function update(dt) {
      now += dt;
      demo(dt);
      for (const p of paws) updatePaw(p, dt);
      // 生地
      const decay = Math.exp(-dt / 9);
      for (let i = 0; i < NV * 3; i++) D[i] *= decay;
      smoothAcc += dt;
      while (smoothAcc > 0.05) { smoothAcc -= 0.05; smoothD(); }
      for (const p of paws) collide(p);
      for (let i = 0; i < NV * 3; i++) posArr[i] = REST[i] + D[i] + AL[i] + AR[i];
      doughGeo.attributes.position.needsUpdate = true;
      doughGeo.computeVertexNormals();
      // 体重をかける方へ少し体が沈む
      const pl = paws[0].pen / DMAX, pr = paws[1].pen / DMAX;
      const tx = (pr - pl) * 0.035, ty = -(pl + pr) * 0.03, tz = -(pl + pr) * 0.03;
      const kk = 1 - Math.exp(-dt * 7);
      camBob.x += (tx - camBob.x) * kk; camBob.y += (ty - camBob.y) * kk; camBob.z += (tz - camBob.z) * kk;
      body.set(camBob.x * 0.8, camBob.y, camBob.z);
      body.chest.position.set(body.x, 0.95 + body.y, 2.05 + body.z);
      camRoll += ((pl - pr) * 0.018 - camRoll) * kk;
      camera.position.copy(CAM_BASE).add(camBob);
      camera.lookAt(CAM_LOOK.x + camBob.x * 0.5, CAM_LOOK.y, CAM_LOOK.z);
      camera.rotateZ(camRoll);
      for (const p of paws) placePaw(p);
      updateParts(dt);
      // ゴロゴロ
      activity = Math.max(0, activity - dt * 0.25);
      activity = Math.min(1.6, activity);
      if (purr) {
        const breath = 0.7 + 0.3 * Math.sin(now * Math.PI * 2 / 2.4);
        const userish = now - lastUser < 20 ? 1 : 0.5;
        purr.out.gain.setTargetAtTime(Math.min(1, activity) * 0.32 * breath * userish, ac.currentTime, 0.08);
        purr.lfo.frequency.setTargetAtTime(24 + 3 * Math.sin(now * Math.PI * 2 / 2.4), ac.currentTime, 0.1);
      }
    }
    renderer.compile(scene, camera);
    renderer.render(scene, camera);
    requestAnimationFrame(t => { lastT = t; frame(t); });
    window.__knead = { paws, press, release, scene, camera, renderer, update, step(sec) { for (let s = 0; s < sec; s += 1 / 60) update(1 / 60); } };
  </script>
</body>
</html>
