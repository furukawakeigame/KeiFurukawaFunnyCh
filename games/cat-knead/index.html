  <script type="module">
    import * as THREE from 'three';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    window.KNEAD_READY = true;

    // ---------- 保存・言語 ----------
    const store = {
      get(k, d) { try { const v = localStorage.getItem('cat-knead:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
      set(k, v) { try { localStorage.setItem('cat-knead:' + k, JSON.stringify(v)); } catch {} },
    };
    const DICT = {
      ja: { title: 'こネコねパン', back: '← トップへ戻る', sound: '音', bake: '焼く', again: '新しい生地', post: '猫の手でパンをこねて焼いたよ' },
      ko: { title: '꾹꾹이 빵', back: '← 처음으로', sound: '소리', bake: '굽기', again: '새 반죽', post: '고양이 손으로 빵을 반죽해서 구웠어요' },
      en: { title: 'Kneading Cat', back: '← Back to top', sound: 'Sound', bake: 'Bake', again: 'New dough', post: 'I kneaded and baked bread with cat paws' },
      th: { title: 'แมวนวดแป้ง', back: '← กลับหน้าแรก', sound: 'เสียง', bake: 'อบ', again: 'แป้งก้อนใหม่', post: 'นวดแป้งด้วยอุ้งเท้าแมวแล้วอบเป็นขนมปัง' },
    };
    const autoLang = () => { for (const l of navigator.languages?.length ? navigator.languages : [navigator.language || '']) { const c = l.toLowerCase().slice(0, 2); if (DICT[c]) return c; } return 'en'; };
    let lang = store.get('lang', null) || autoLang();
    if (!DICT[lang]) lang = 'en';
    const langSel = document.getElementById('lang');
    langSel.value = lang;
    function applyLang() {
      const t = DICT[lang];
      document.documentElement.lang = lang;

      document.getElementById('back').textContent = t.back;
      document.getElementById('sound').setAttribute('aria-label', t.sound);
      window.__drawBake?.();
    }
    langSel.addEventListener('change', () => { lang = langSel.value; store.set('lang', lang); applyLang(); });
    applyLang();

    // 長押しの拡大鏡・メニューを出さない
    const okTag = el => el.closest && el.closest('a, button, select, input');
    document.addEventListener('touchstart', e => { if (!okTag(e.target)) e.preventDefault(); }, { passive: false });
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('selectstart', e => e.preventDefault());

    // ---------- 音 ----------
    let soundOn = store.get('sound', true);
    const soundBtn = document.getElementById('sound');
    const drawSoundBtn = () => {
      soundBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>${soundOn ? '<path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>' : '<path d="M17 9l5 6M22 9l-5 6"/>'}</svg>`;
    };
    drawSoundBtn();
    soundBtn.addEventListener('click', () => {
      soundOn = !soundOn; store.set('sound', soundOn); drawSoundBtn();
      if (master) master.gain.setTargetAtTime(soundOn ? 1 : 0, ac.currentTime, 0.03);
    });
    let ac = null, master = null, noiseBuf = null, brownBuf = null;
    function unmuteIOS() {
      try { if (navigator.audioSession) { navigator.audioSession.type = 'playback'; return; } } catch {}
      try {
        const n = 4410, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
        const w = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
        w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
        v.setUint32(24, 44100, true); v.setUint32(28, 88200, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
        const a = document.createElement('audio');
        a.src = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' })); a.loop = true; a.setAttribute('playsinline', '');
        a.play().catch(() => {});
      } catch {}
    }
    function initAudio() {
      if (ac) return;
      try {
        unmuteIOS();
        ac = new (window.AudioContext || window.webkitAudioContext)();
        master = ac.createGain(); master.gain.value = soundOn ? 1 : 0; master.connect(ac.destination);
        const len = ac.sampleRate * 2;
        noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        // こもった音用の茶色いノイズ
        brownBuf = ac.createBuffer(1, len, ac.sampleRate);
        const bd = brownBuf.getChannelData(0);
        let last = 0;
        for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; bd[i] = last * 3.5; }
        const o = ac.createOscillator(), g = ac.createGain(); g.gain.value = 0;
        o.connect(g).connect(master); o.start(); o.stop(ac.currentTime + 0.05);
      } catch { ac = null; }
    }
    addEventListener('pointerdown', initAudio, { capture: true });
    addEventListener('keydown', initAudio, { capture: true });
    function noiseHit(freq, q, type, vol, attack, decay, rate = 1, delay = 0, buf = noiseBuf) {
      if (!ac) return;
      const t0 = ac.currentTime + delay;
      const s = ac.createBufferSource(); s.buffer = buf; s.playbackRate.value = rate;
      const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
      const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + attack + decay);
      s.connect(f).connect(g).connect(master);
      s.start(t0, Math.random() * 1.5); s.stop(t0 + attack + decay + 0.05);
      return f;
    }
    // 生地をそっと押す「ふにゅ」（こもった柔らかい音。ゆっくり立ち上がる）
    function sSquish(str) {
      if (!ac) return;
      const r = 0.85 + Math.random() * 0.3;
      const f = noiseHit(380 * r, 0.8, 'lowpass', 0.32 * str, 0.045, 0.26, 1, 0, brownBuf);
      f.frequency.setTargetAtTime(170 * r, ac.currentTime + 0.03, 0.08);
      noiseHit(700 * r, 3, 'bandpass', 0.035 * str, 0.05, 0.18, r);
    }
    // 離すときの小さな「ぺたっ」
    function sUnstick(str) {
      if (!ac) return;
      noiseHit(900, 1.2, 'lowpass', 0.05 * str, 0.01, 0.07, 1, 0.01, brownBuf);
    }

    // オーブンの「ゴー」（焼いている間だけ、ゆっくり大きくなって消える）
    function sOven(dur) {
      if (!ac) return;
      const t0 = ac.currentTime;
      const s = ac.createBufferSource(); s.buffer = brownBuf; s.loop = true;
      const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 220; f.Q.value = 0.6;
      const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.12, t0 + 0.8);
      g.gain.setValueAtTime(0.12, t0 + dur - 0.9);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      s.connect(f).connect(g).connect(master); s.start(t0); s.stop(t0 + dur + 0.1);
    }
    // 焼き上がりの「チン」
    function sDing() {
      if (!ac) return;
      const t0 = ac.currentTime;
      for (const [fr, v, d] of [[2093, 0.13, 1.4], [2093 * 2.76, 0.05, 0.6], [2093 * 5.4, 0.025, 0.3]]) {
        const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = fr;
        g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v, t0 + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
        o.connect(g).connect(master); o.start(t0); o.stop(t0 + d + 0.05);
      }
    }
    // 焼けたパンを押す「ぽふ」
    function sPat() {
      if (!ac) return;
      const r = 0.9 + Math.random() * 0.2;
      noiseHit(600 * r, 0.8, 'lowpass', 0.22, 0.006, 0.09, 1, 0, brownBuf);
      noiseHit(1800 * r, 1.5, 'bandpass', 0.03, 0.003, 0.05, r);
    }

    // ---------- 描画の準備 ----------
    const stage = document.getElementById('stage');
    const coarse = matchMedia('(pointer: coarse)').matches;
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    // 画面の細かさは上限を付ける（重い端末ではあとで自動的に下げる）
    const DPR_MAX = Math.min(devicePixelRatio || 1, coarse ? 1.5 : 1.75);
    renderer.setPixelRatio(DPR_MAX);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.92;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.shadowMap.autoUpdate = false; // 影は動きがあるときだけ描き直す
    renderer.shadowMap.needsUpdate = true;
    stage.appendChild(renderer.domElement);
    const canvas = renderer.domElement;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xe6d8c4);
    scene.fog = new THREE.Fog(0xe6d8c4, 8, 20);
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

    const camera = new THREE.PerspectiveCamera(50, 1, 0.05, 60);
    const CAM_BASE = new THREE.Vector3(0, 2.3, 1.75);
    const CAM_LOOK = new THREE.Vector3(0, 0.15, -0.2);

    const hemi = new THREE.HemisphereLight(0xdcecff, 0x8a6648, 0.3);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xffe0b8, 2.5);
    sun.position.set(-4.6, 4.6, -1.8);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    Object.assign(sun.shadow.camera, { left: -2.2, right: 2.2, top: 2.2, bottom: -2.2, near: 1, far: 16 });
    sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
    sun.shadow.radius = 4;
    scene.add(sun, sun.target);

    const mkCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
    const rnd = (a, b) => a + Math.random() * (b - a);
    const texOf = (c, srgb = true) => { const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; };

    // ---------- 作業台（木） ----------
    function woodCanvas() {
      // 継ぎ目のない1枚板。うっすら木目だけ
      const c = mkCanvas(1024, 1024), g = c.getContext('2d');
      g.fillStyle = 'rgb(176,128,86)'; g.fillRect(0, 0, 1024, 1024);
      for (let k = 0; k < 260; k++) {
        const x = Math.random() * 1024, amp = rnd(3, 12), ph = rnd(0, 6), fr = rnd(0.003, 0.008);
        g.strokeStyle = `rgba(${rnd(95, 120)},${rnd(60, 78)},${rnd(35, 48)},${rnd(0.04, 0.11)})`;
        g.lineWidth = rnd(0.8, 2.6);
        g.beginPath();
        for (let y = -16; y <= 1040; y += 16) { const xx = x + Math.sin(y * fr + ph) * amp; y > -16 ? g.lineTo(xx, y) : g.moveTo(xx, y); }
        g.stroke();
      }
      return c;
    }
    const woodC = woodCanvas();
    const woodTex = texOf(woodC); woodTex.wrapS = woodTex.wrapT = THREE.RepeatWrapping; woodTex.repeat.set(1.6, 1.6);
    const woodBump = texOf(woodC, false); woodBump.wrapS = woodBump.wrapT = THREE.RepeatWrapping; woodBump.repeat.set(1.6, 1.6);
    const counter = new THREE.Mesh(new THREE.PlaneGeometry(16, 12), new THREE.MeshStandardMaterial({ map: woodTex, bumpMap: woodBump, bumpScale: 0.6, roughness: 0.66, envMapIntensity: 0.5 }));
    counter.rotation.x = -Math.PI / 2; counter.position.z = -1.5; counter.receiveShadow = true;
    scene.add(counter);

    // 台にこぼれた打ち粉
    function flourSpillCanvas() {
      const c = mkCanvas(1024, 1024), g = c.getContext('2d');
      for (let k = 0; k < 900; k++) {
        const a = Math.random() * Math.PI * 2, r = Math.pow(Math.random(), 0.7) * 470;
        const x = 512 + Math.cos(a) * r, y = 512 + Math.sin(a) * r * 0.9;
        const rad = rnd(6, 40) * (1 - r / 600);
        const gr = g.createRadialGradient(x, y, 0, x, y, rad);
        const al = rnd(0.05, 0.22) * (1 - r / 520);
        gr.addColorStop(0, `rgba(255,253,248,${al})`); gr.addColorStop(1, 'rgba(255,253,248,0)');
        g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
      }
      for (let k = 0; k < 9000; k++) {
        const a = Math.random() * Math.PI * 2, r = Math.pow(Math.random(), 0.6) * 500;
        g.fillStyle = `rgba(255,252,246,${rnd(0.15, 0.6) * (1 - r / 520)})`;
        g.fillRect(512 + Math.cos(a) * r, 512 + Math.sin(a) * r * 0.9, rnd(0.8, 2.2), rnd(0.8, 2.2));
      }
      // 猫の手で払ったような筋
      for (let k = 0; k < 16; k++) {
        g.strokeStyle = `rgba(255,252,246,${rnd(0.04, 0.1)})`; g.lineWidth = rnd(10, 30); g.lineCap = 'round';
        const a = rnd(0, Math.PI * 2), r = rnd(220, 380);
        g.beginPath(); g.arc(512, 512, r, a, a + rnd(0.2, 0.6)); g.stroke();
      }
      return c;
    }
    const spill = new THREE.Mesh(new THREE.PlaneGeometry(4.6, 4.6), new THREE.MeshStandardMaterial({ map: texOf(flourSpillCanvas()), transparent: true, depthWrite: false, roughness: 1, envMapIntensity: 0.3 }));
    spill.rotation.x = -Math.PI / 2; spill.position.set(0.05, 0.004, 0.05); spill.receiveShadow = true;
    scene.add(spill);
    // 生地の下の接地影
    {
      const c = mkCanvas(256, 256), g = c.getContext('2d');
      const gr = g.createRadialGradient(128, 128, 60, 128, 128, 128);
      gr.addColorStop(0, 'rgba(40,24,10,0.55)'); gr.addColorStop(0.55, 'rgba(40,24,10,0.25)'); gr.addColorStop(1, 'rgba(40,24,10,0)');
      g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
      const ao = new THREE.Mesh(new THREE.PlaneGeometry(2.3, 2.3), new THREE.MeshBasicMaterial({ map: texOf(c), transparent: true, depthWrite: false }));
      ao.rotation.x = -Math.PI / 2; ao.position.y = 0.006; scene.add(ao);
    }

    // ---------- 壁 ----------
    // 奥の壁（無地）
    const wall = new THREE.Mesh(new THREE.PlaneGeometry(16, 6), new THREE.MeshStandardMaterial({ color: 0xece3d6, roughness: 0.9 }));
    wall.position.set(0, 3, -4.6); wall.receiveShadow = true;
    scene.add(wall);
    // ---------- パン生地 ----------
    const DR = 0.82, DH = 0.5, GN = coarse ? 120 : 150;
    const prof = (() => {
      // 断面の形（上は丸い山、下は少し巻き込む）を弧長で引けるようにする
      const M = 800, pts = [];
      const P = 2.15, tuck = 0.2;
      for (let i = 0; i <= M; i++) {
        const t = Math.PI / 2 - (Math.PI / 2 + 0.45) * i / M;
        const c = Math.pow(Math.max(Math.cos(t), 0), 2 / P);

    // 投稿用の画像：焼き上がった瞬間のパンを正方形に切り抜き、タイトルを小さく入れる
    let snap = null, shareCache = null, wantSnap = false;
    function takeSnap() {
      const cv = renderer.domElement, sx0 = cv.width / innerWidth;
      let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
      const v = new THREE.Vector3();
      for (let k = 0; k < 24; k++) {
        const a = k / 24 * Math.PI * 2;
        for (const y of [0, breadTop]) {
          v.set(Math.cos(a) * 0.95, y, Math.sin(a) * 0.95).project(camera);
          const X = (v.x + 1) / 2 * cv.width, Y = (1 - v.y) / 2 * cv.height;
          minX = Math.min(minX, X); maxX = Math.max(maxX, X); minY = Math.min(minY, Y); maxY = Math.max(maxY, Y);
        }
      }
      let side = Math.max(maxX - minX, maxY - minY) * 1.12;
      side = Math.min(side, cv.width, cv.height);
      const sx = Math.min(cv.width - side, Math.max(0, (minX + maxX) / 2 - side / 2));
      const sy = Math.min(cv.height - side, Math.max(0, (minY + maxY) / 2 - side / 2 + side * 0.03));
      snap = document.createElement('canvas'); snap.width = snap.height = 1080;
      snap.getContext('2d').drawImage(cv, sx, sy, side, side, 0, 0, 1080, 1080);
      shareCache = null;
    }
    function resultImage() {
      if (!snap) return null;
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const g = c.getContext('2d');
      g.drawImage(snap, 0, 0);
      const t = DICT[lang].title;
      g.font = '700 56px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans Thai", sans-serif';
      g.textAlign = 'center'; g.lineJoin = 'round';
      g.lineWidth = 12; g.strokeStyle = 'rgba(60,35,15,.85)'; g.strokeText(t, 540, 1040);
      g.fillStyle = '#fffaf0'; g.fillText(t, 540, 1040);
      return c;
    }
    function prepareShare() {
      if (!snap) return;
      const key = lang;
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'koneko-ne-pan.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;
    postBtn.addEventListener('click', e => {
      const text = `${DICT[lang].post} #こネコねパンゲーム\n${GAME_URL}`;
      if (coarse && navigator.share) {
        e.preventDefault();
        const file = shareFile();
        navigator.share(file && navigator.canShare?.({ files: [file] }) ? { files: [file], text } : { text }).catch(() => {});
        return;
      }
      const img = resultImage();
      if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'koneko-ne-pan.png'; d.click(); }
    });
    function drawBake() {
      const again = state === 'baked';
      bakeBtn.setAttribute('aria-label', DICT[lang][again ? 'again' : 'bake']);
      bakeBtn.innerHTML = again
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><rect x="6" y="9" width="12" height="8" rx="1.2"/><path d="M8 7h8" stroke-linecap="round"/><circle cx="6" cy="6.5" r=".6" fill="currentColor"/><circle cx="18" cy="6.5" r=".6" fill="currentColor"/><path d="M9 13.5c1-1 2-1 3 0s2 1 3 0" stroke-linecap="round" stroke-width="1.4"/></svg>';
      bakeBtn.classList.toggle('off', state === 'baking' || state === 'swap');
      postBtn.classList.toggle('off', !again);
      resultEl.hidden = !again;
      if (again) {
        postBtn.href = `https://x.com/intent/post?text=${encodeURIComponent(DICT[lang].post + ' #こネコねパンゲーム')}&url=${encodeURIComponent(GAME_URL)}`;
        if (coarse) { postBtn.removeAttribute('target'); postBtn.removeAttribute('rel'); }
        else { postBtn.target = '_blank'; postBtn.rel = 'noopener'; }
        prepareShare();
      }
    }
    window.__drawBake = drawBake;
    drawBake();
    bakeBtn.addEventListener('click', () => { initAudio(); lastUser = now; if (state === 'dough') startBake(); else if (state === 'baked') newDough(); });
    function setBakedShape(r) {
      const sx = 1 + 0.07 * r, sy = 1 + 0.28 * r;
      for (let i = 0; i < NV * 3; i += 3) { posArr[i] = BAKE0[i] * sx; posArr[i + 1] = BAKE0[i + 1] * sy; posArr[i + 2] = BAKE0[i + 2] * sx; }
      doughGeo.attributes.position.needsUpdate = true;
      gridNormals();
    }
    function startBake() {
      if (demoHeld) { release(demoHeld); demoHeld = null; }
      for (const p of paws) { p.held = false; p.released = true; if (p.phase === 'hold' || p.phase === 'down') commit(p); }
      for (let i = 0; i < NV * 3; i++) BAKE0[i] = REST[i] + D[i];
      D.fill(0); AL.fill(0); AR.fill(0); lastCommit = -100;
      for (const p of paws) { p.touching = false; p.lastBox = null; p.pen = 0; }
      mat0 = { r: doughMat.roughness, c: doughMat.clearcoat, s: doughMat.sheen, b: doughMat.bumpScale };
      state = 'baking'; bakeT = 0; drawBake();
      goTo(paws[0], -0.5, 1.08, 0); goTo(paws[1], 0.5, 1.08, 0);
      sOven(BAKE_DUR);
    }
    function newDough() {
      state = 'swap'; swapT = 0; swapped = false; steamLeft = 0; drawBake();
      goTo(paws[0], -0.5, 1.08, 0); goTo(paws[1], 0.5, 1.08, 0);
    }
    function bakeUpdate(dt) {
      if (state === 'baking') {
        bakeT += dt;
        const u = Math.min(1, bakeT / BAKE_DUR);
        const rise = smooth(0.08, 0.7, u), col = smooth(0.25, 0.95, u);
        setBakedShape(rise);
        bakeU.value = col;
        doughMat.roughness = mat0.r + (0.6 - mat0.r) * col;
        doughMat.clearcoat = mat0.c + (0.12 - mat0.c) * col;
        doughMat.sheen = mat0.s * (1 - col);
        doughMat.bumpScale = mat0.b + (0.5 - mat0.b) * col;
        // オーブンの光はゆっくり明るくなって、ゆっくり消える（点滅させない）
        ovenLight.intensity = 16 * smooth(0, 0.15, u) * (1 - smooth(0.8, 1, u));
        needRender = 2; renderer.shadowMap.needsUpdate = true;
        if (u >= 1) {
          breadTop = 0; for (let i = 1; i < NV * 3; i += 3) breadTop = Math.max(breadTop, posArr[i]);
          state = 'baked'; wantSnap = true; sDing();
          steamLeft = 9; steamT = 0;
        }
      } else if (state === 'swap') {
        swapT += dt;
        if (swapT < 0.3) dough.scale.setScalar(Math.max(0.001, 1 - ease(swapT / 0.3)));
        else {
          if (!swapped) {
            swapped = true;
            D.fill(0); AL.fill(0); AR.fill(0);
            presses = 0; setKnead(); bakeU.value = 0;
            paintDough(); composeDough();
            dirty = true;
          }
          const u = Math.min(1, (swapT - 0.3) / 0.45);
          const b = 1 + 2.2 * Math.pow(u - 1, 3) + 1.2 * Math.pow(u - 1, 2); // 少し弾んで出てくる
          dough.scale.setScalar(Math.max(0.001, b));
          if (u >= 1) {
            dough.scale.setScalar(1); state = 'dough'; drawBake();
            for (const p of paws) { const x = p.side ? 0.34 : -0.34; goTo(p, x, 0.2, surfaceAt(x, 0.2)); }
          }
        }
        needRender = 2; renderer.shadowMap.needsUpdate = true;
      }
      // 焼きたての湯気
      if (steamLeft > 0) {
        steamLeft -= dt; steamT -= dt;
        if (steamT <= 0) { steamT = 0.12; steam(Math.min(1, steamLeft / 4)); }
      }
    }
    function steam(k) {
      const s = parts[partI++ % parts.length], u = s.userData;
      const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * 0.5;
      s.position.set(Math.cos(a) * r, breadTop * 0.9, Math.sin(a) * r);
      u.v.set(rnd(-0.04, 0.04), rnd(0.18, 0.3), rnd(-0.04, 0.04));
      u.life = 0; u.max = rnd(2.4, 3.6); u.size = rnd(0.22, 0.36); u.op = rnd(0.12, 0.22) * k; u.damp = 0.25;
      s.material.rotation = rnd(0, 6.28); u.rot = rnd(-0.3, 0.3);
      s.visible = true;
    }

    // ---------- ループ ----------
    const DECAY_TICK = Math.exp(-0.05 / 120);
    let needRender = 3;
    let lastT = performance.now(), smoothAcc = 0, camBob = new THREE.Vector3(), camRoll = 0;
    const nrmArr = doughGeo.attributes.normal.array;
    // 法線は格子のとなり同士から直接求める（三角形ごとに計算するより速い）
    function gridNormals() {
      const S = GN + 1, P = posArr, N = nrmArr;
      for (let i = 0; i <= GN; i++) {
        const i0 = i > 0 ? i - 1 : i, i1 = i < GN ? i + 1 : i;
        for (let j = 0; j <= GN; j++) {
          const j0 = j > 0 ? j - 1 : j, j1 = j < GN ? j + 1 : j;
          const a = (i1 * S + j) * 3, b = (i0 * S + j) * 3, c = (i * S + j1) * 3, d = (i * S + j0) * 3;
          const ux = P[a] - P[b], uy = P[a + 1] - P[b + 1], uz = P[a + 2] - P[b + 2];
          const vx = P[c] - P[d], vy = P[c + 1] - P[d + 1], vz = P[c + 2] - P[d + 2];
          let nx = vy * uz - vz * uy, ny = vz * ux - vx * uz, nz = vx * uy - vy * ux;
          const l = Math.hypot(nx, ny, nz) || 1, o = (i * S + j) * 3;
          N[o] = nx / l; N[o + 1] = ny / l; N[o + 2] = nz / l;
        }
      }
      doughGeo.attributes.normal.needsUpdate = true;
    }
    let dActive = false;
    function smoothD() {
      // 跡のふちを少しずつなだらかにし、ゆっくり元に戻す（生地がなじむ）
      // しばらく触らなければ、跡はそのまま残す（計算を止める）
      if (now - lastCommit > 45) return false;
      dActive = true; dirty = true;
      DT.set(D);
      for (let i = 0; i < NV * 3; i++) DT[i] *= DECAY_TICK;
      D.set(DT);
      const S = GN + 1, k = 0.025;
      for (let i = 1; i < GN; i++) for (let j = 1; j < GN; j++) {
        const v = i * S + j;
        for (let c = 0; c < 3; c++) {
          const a = DT[(v - 1) * 3 + c] + DT[(v + 1) * 3 + c] + DT[(v - S) * 3 + c] + DT[(v + S) * 3 + c];
          D[v * 3 + c] = DT[v * 3 + c] + k * (a * 0.25 - DT[v * 3 + c]);
        }
      }
      return true;
    }
    function frame(t) {
      const dt = Math.min(0.05, (t - lastT) / 1000); lastT = t;
      if (!window.__hold) update(dt); else needRender = 1;
      // 何も動いていないときは描かない
      if (needRender > 0) { needRender--; renderer.render(scene, camera); adapt(dt); }
      if (wantSnap) { wantSnap = false; takeSnap(); drawBake(); }
      requestAnimationFrame(frame);
    }
    // 重い端末では、画面の細かさ → 毛の層の数 の順に自動で下げる
    let qLevel = 0, qT = 0, qN = 0, qWarm = 2;
    function adapt(dt) {
      if (qWarm > 0) { qWarm -= dt; return; }
      qT += dt; qN++;
      if (qT < 2) return;
      const avg = qT / qN; qT = 0; qN = 0;
      if (avg < 0.024 || qLevel >= 3) return;
      qLevel++;
      if (qLevel === 1) renderer.setPixelRatio(Math.max(1, DPR_MAX * 0.8));
      else if (qLevel === 2) shellMeshes.forEach(m => { if (Math.round(m.material.userData.layer * SHELLS) % 2) m.visible = false; });
      else renderer.setPixelRatio(1);
      renderer.shadowMap.needsUpdate = true;
      qWarm = 1;
    }
    function update(dt) {
      now += dt;
      demo(dt);
      for (const p of paws) updatePaw(p, dt);
      // 生地（動きがないときは計算しない）
      smoothAcc += dt;
      let tick = false;
      while (smoothAcc > 0.05) { smoothAcc -= 0.05; if (smoothD()) tick = true; }
      for (const p of paws) {
        const moving = p.phase !== 'rest' || Math.abs(p.y - (p.lastY ?? -9)) > 1e-5;
        if (state === 'dough') { if (moving || tick || !p.touching) collide(p); } else p.pen = 0;
        p.lastY = p.y;
      }
      bakeUpdate(dt);
      // 焼き上がったら、広告の枠のぶん上を空けて、パンを少し下に写す
      const adT = state === 'baked' && innerHeight >= 600 ? (innerHeight >= 800 ? 170 : 112) : 0;
      if (Math.abs(adT - adRes) > 0.5) { adRes += (adT - adRes) * (1 - Math.exp(-dt * 6)); if (Math.abs(adT - adRes) <= 0.5) adRes = adT; fitCamera(); needRender = 2; }
      if (dirty && state === 'dough') {
        dirty = false; needRender = 2;
        for (let i = 0; i < NV * 3; i++) posArr[i] = REST[i] + D[i] + AL[i] + AR[i];
        doughGeo.attributes.position.needsUpdate = true;
        gridNormals();
        renderer.shadowMap.needsUpdate = true;
      }
      if (paws[0].phase !== 'rest' || paws[1].phase !== 'rest') { renderer.shadowMap.needsUpdate = true; needRender = 2; }
      // 体重をかける方へ少し体が沈む
      const pl = paws[0].pen / DMAX, pr = paws[1].pen / DMAX;
      const tx = (pr - pl) * 0.035, ty = -(pl + pr) * 0.03, tz = -(pl + pr) * 0.03;
      const kk = 1 - Math.exp(-dt * 7);
      if (Math.abs(tx - camBob.x) + Math.abs(ty - camBob.y) + Math.abs(tz - camBob.z) > 2e-5) needRender = 2;
      camBob.x += (tx - camBob.x) * kk; camBob.y += (ty - camBob.y) * kk; camBob.z += (tz - camBob.z) * kk;
      body.set(camBob.x * 0.8, camBob.y, camBob.z);
      body.chest.position.set(body.x, 0.95 + body.y, 2.05 + body.z);
      camRoll += ((pl - pr) * 0.018 - camRoll) * kk;
      camera.position.copy(CAM_BASE).add(camBob);
      camera.lookAt(CAM_LOOK.x + camBob.x * 0.5, CAM_LOOK.y, CAM_LOOK.z);
      camera.rotateZ(camRoll);
      for (const p of paws) placePaw(p);
      updateParts(dt);
    }
    renderer.compile(scene, camera);
    renderer.render(scene, camera);
    requestAnimationFrame(t => { lastT = t; frame(t); });
    window.__knead = { poke: () => userInput(), paws, press, release, scene, camera, renderer, update, nr: () => needRender, shareImg: () => resultImage()?.toDataURL('image/jpeg', 0.8), step(sec) { for (let s = 0; s < sec; s += 1 / 60) { needRender = 0; update(1 / 60); } } };
  </script>
  <script src="../../ad.js" data-result="#result" data-inline="#adSlot"></script>
</body>
