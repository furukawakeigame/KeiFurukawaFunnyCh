    let ac = null, master = null, noiseBuf = null;

    }
    function initAudio() {
      if (ac) return;

    const live = () => soundOn && ac;
    function burst(dur, vol, type, freq, q = 1, delay = 0) {
      if (!live()) return;

    }
    const F0 = 118; // 会社員の声の高さ

    let shareCache = null, snapImg = null;
    const fmt = x => (Math.floor(x * 10) / 10).toFixed(1);
    const stationSvg = '<svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="15" rx="4" fill="#fff"/><rect x="5" y="6" width="6" height="5" fill="#2f6fb0"/><rect x="13" y="6" width="6" height="5" fill="#2f6fb0"/><circle cx="7" cy="21" r="2" fill="#fff"/><circle cx="17" cy="21" r="2" fill="#fff"/></svg>';
    const bigText = () => t('sec')(fmt(result.time));
    const bestText = () => `${t('best')} ${t('sec')(fmt(store.get('bestTime', 0)))}`;
    function showResult() {
      document.getElementById('resBig').innerHTML = stationSvg + `<span>${bigText()}</span>`;
      const be = document.getElementById('resBest'); be.textContent = bestText(); be.classList.toggle('new', !!result.isNew);
      resultEl.style.display = 'block';
    }
    function finish() {
      state = 'result';
      const b = store.get('bestTime', 0); result.isNew = !b || result.time < b;
      if (result.isNew) store.set('bestTime', result.time);
      showResult(); renderControls(); resize();
      for (const s of ['L', 'R']) footEls[s].classList.add('hide');
      needSnap = true;
    }
    let needSnap = false;
    // 結果が出た瞬間の画面を、倒れた会社員が真ん中に入るよう正方形に切り抜く
    function takeSnap() {
      const W = renderer.domElement.width, H = renderer.domElement.height, dpr = W / stage.clientWidth;
      const p = man.bodies.pelvis.position, q = V3(p.x, Math.max(0.5, p.y), p.z).project(camera);
      const cx = (q.x + 1) / 2 * W, cy = (1 - q.y) / 2 * H;
      const S = Math.min(W, H - (viewTop * 0.5) * dpr, Math.max(H * 0.75, (freeH - viewTop) * dpr * 1.4));
      const sx = THREE.MathUtils.clamp(cx - S / 2, 0, W - S), sy = THREE.MathUtils.clamp(cy - S * 0.6, 0, H - S);
      snapImg = document.createElement('canvas'); snapImg.width = snapImg.height = 1080;
      snapImg.getContext('2d').drawImage(renderer.domElement, sx, sy, S, S, 0, 0, 1080, 1080);
      shareCache = null; prepareShare();
    }
    function resultImage() {
      if (!snapImg) return null;
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const g = c.getContext('2d');
      g.drawImage(snapImg, 0, 0);
      const sh = g.createLinearGradient(0, 0, 0, 380); sh.addColorStop(0, 'rgba(20,40,70,.45)'); sh.addColorStop(1, 'rgba(20,40,70,0)'); g.fillStyle = sh; g.fillRect(0, 0, 1080, 380);
      g.textAlign = 'center'; g.fillStyle = '#fff'; g.shadowColor = 'rgba(20,40,70,.4)'; g.shadowBlur = 16; g.shadowOffsetY = 5;
      const ff = s => `900 ${s}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans KR", "Noto Sans Thai", sans-serif`;
      g.font = ff(190); g.fillText(bigText(), 540, 230);
      g.font = ff(52); g.globalAlpha = 0.95; g.fillText(t('title'), 540, 320);
      return c;
    }
    const shareText = () => t('shareClear')(fmt(result.time));
    function renderControls() {
      controls.innerHTML = '';
      controls.classList.toggle('hide', state !== 'result');
      if (state !== 'result') return;
      const b = document.createElement('button');
      b.className = 'go'; b.textContent = t('again');
      b.addEventListener('click', restart);
      controls.append(b);
      const a = document.createElement('a');
      a.className = 'post'; a.textContent = t('post');
      a.href = `https://x.com/intent/post?text=${encodeURIComponent(shareText())}&url=${encodeURIComponent(SHARE_URL)}`;
      const coarse = matchMedia('(pointer: coarse)').matches;
      if (!coarse) { a.target = '_blank'; a.rel = 'noopener'; }
      // スマホは画像ごと共有シートへ。PCは画像を保存してから投稿画面を開く
      a.addEventListener('click', e => {
        const text = shareText();
        if (coarse && navigator.share) {
          e.preventDefault();
          const file = shareFile();
          const data = file && navigator.canShare?.({ files: [file] }) ? { files: [file], text: `${text}\n${SHARE_URL}` } : { text: `${text}\n${SHARE_URL}` };
          navigator.share(data).catch(() => {});
          return;
        }
        const img = resultImage();
        if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'yochiyochi.png'; d.click(); }
      });
      controls.append(a);
    }
    function prepareShare() {
      if (!snapImg || !result) return;
      const key = lang;
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'yochiyochi.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;

    function restart() {
      unragdoll(man);
      const h = man.h;
      h.root.position.set(0, 0, START_Z); h.root.rotation.set(0, 0, 0);
      h.j.pelvis.position.copy(man.rig.P.pelvis);
      for (const b of BONES) h.j[b].quaternion.identity();
      h.root.updateMatrixWorld(true);
      ragdoll(man);
      h.face.smile = 0; h.face.open = 0; h.face.brow = 0;
      ctl.L = { down: false, t: 0, hold: 0 }; ctl.R = { down: false, t: 0, hold: 0 };
      for (const s of ['L', 'R']) { legT[s].hip = 0; legT[s].knee = 0.1; }
      fallen = false; limp = 0; riseK = 0; playT = 0; result = null; state = 'ready'; snapImg = null; shareCache = null;
      resultEl.style.display = 'none';
      for (const s of ['L', 'R']) { footEls[s].classList.remove('hide', 'on'); }
      renderControls(); resetProps();
      if (renderer.domElement.width) resize(); else placeCamera(1, true);
    }

    // ---------- 操作: 左半分・右半分のタッチ、← → / A D キー、マウスの左右クリック ----------
    const ptrs = new Map();
    const blocked = e => e.target.closest?.('header, #controls, a, button, select');
    function sideOf(e) { if (e.pointerType === 'mouse' && e.button === 2) return 'R'; return e.clientX < innerWidth / 2 ? 'L' : 'R'; }
    function refreshPtrs() { const on = { L: false, R: false }; for (const s of ptrs.values()) on[s] = true; for (const s of ['L', 'R']) if (!keys[s]) press(s, on[s]); }
    addEventListener('pointerdown', e => {
      if (blocked(e)) return;
      if (state === 'result') return;
      ptrs.set(e.pointerId, e.pointerType === 'mouse' ? (e.button === 2 ? 'R' : e.button === 0 && e.clientX >= innerWidth / 2 ? 'R' : 'L') : sideOf(e));
      refreshPtrs();
    });
    const up = e => { if (ptrs.delete(e.pointerId)) refreshPtrs(); };
    addEventListener('pointerup', up); addEventListener('pointercancel', up);
    addEventListener('blur', () => { ptrs.clear(); keys.L = keys.R = false; refreshPtrs(); });
    const keys = { L: false, R: false };
    const KEYS = { ArrowLeft: 'L', KeyA: 'L', ArrowRight: 'R', KeyD: 'R' };
    addEventListener('keydown', e => {
      if (e.target.closest?.('select')) return;
      const s = KEYS[e.code];
      if (s) { e.preventDefault(); if (e.repeat) return; keys[s] = true; press(s, true); return; }
      if ((e.code === 'Enter' || e.code === 'Space') && state === 'result') { e.preventDefault(); restart(); }
    });
    addEventListener('keyup', e => { const s = KEYS[e.code]; if (s) { keys[s] = false; refreshPtrs(); if (![...ptrs.values()].includes(s)) press(s, false); } });

    // ---------- ループ ----------
    let last = performance.now(), acc = 0;
    function loop(now) {
      window.resultAd?.(state === 'result'); // 結果画面の広告（../../ad.js）
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      acc += dt;
      while (acc >= STEP) { step(STEP); acc -= STEP; }
      placeCamera(dt);
      renderer.render(scene, camera);
      if (needSnap) { needSnap = false; takeSnap(); }
      requestAnimationFrame(loop);
    }

    addEventListener('resize', resize);
    restart();
    resize();
    applyLang();
    for (let i = 0; i < 30; i++) step(STEP); // 立ち姿を落ち着かせる
    renderer.compile(scene, camera);
    renderer.render(scene, camera);
    window.__game = { get riseK() { return riseK; }, groundY, renderer, scene, camera, catG, ctl, press, get state() { return state; }, dist, man, get fallen() { return fallen; }, step, restart, tilt };
    requestAnimationFrame(t0 => { last = t0; loop(t0); });
  </script>
  <!-- 結果画面の広告（../../ad.js の説明を参照） -->
  <script src="../../ad.js" data-result="#result"></script>
</body>
</html>
