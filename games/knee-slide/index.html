      ledMat.emissive.lerp(ledGlow, 1 - Math.exp(-dt * 8));
      ledTex.offset.x = (ledTex.offset.x + dt * 0.12) % 1;
      boardShake *= Math.exp(-dt * 5);
      board.position.z = BOARD.z0 / 2 - Math.sin(time * 40) * boardShake * 0.02;
      window.__flag.rotation.y = 0.6 + Math.sin(time * 2.3) * 0.25;
      if (crowd && state === 'run') ramp(crowd, 0.05 + v * 0.008, 0.3);

      updateCrowd(time); updateBanner(dt); updateParts(dt); updateCam(dt);
      renderer.render(scene, camera);
      if (wantSnap) { wantSnap = false; takeSnap(); }
      requestAnimationFrame(frame);
    }
    reset(); resize(); applyLang();
    player.update(0.1); updateCam(0);
    renderer.compile(scene, camera); renderer.render(scene, camera);
    requestAnimationFrame(t0 => { last = t0; frame(t0); });
    // テスト用
    window.__g = { get state() { return state; }, get gap() { return gap; }, get v() { return v; }, press, release, player, supporters };
  </script>

  <script src="../../ad.js" data-result="#result"></script>
