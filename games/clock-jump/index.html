    function initAudio() {

        ac = new (window.AudioContext || window.webkitAudioContext)();

    addEventListener('pointerdown', initAudio, { capture: true });
    addEventListener('keydown', initAudio, { capture: true });
    const on = () => soundOn && ac;
    function tone(type, f0, f1, dur, vol, delay = 0) {
      if (!on()) return;

      for (const [f, q, g0] of bands) {

      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const s = ac.createBufferSource(); s.buffer = buf;
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 2.5;
      bp.frequency.setValueAtTime(f0, now); bp.frequency.exponentialRampToValueAtTime(f1, now + dur);

    const VOWEL = { a: [800, 1200, 2600], i: [300, 2300, 3000], u: [350, 1250, 2500], e: [500, 1900, 2600], o: [500, 850, 2500] };
    function voice(f0, seq, dur, vol = 0.5, shake = 0.04, breath = 0.15) {

      const ns = ac.createBufferSource(); ns.buffer = nb;

        seq.forEach((v, si) => { const tt = now + dur * si / Math.max(1, seq.length - 1) * 0.7; bp.frequency[si ? 'linearRampToValueAtTime' : 'setValueAtTime'](VOWEL[v][fi] * 1.2, tt); });

    }
    const pick = a => a[Math.floor(Math.random() * a.length)];
    // 時計の「チッ」: 小さな金属の当たる音
    const sTick = (vol = 1) => hitNoise(0.03, 0.003, [[3200, 12, 0.5], [5400, 10, 0.25], [1800, 8, 0.2]], vol);
    const sJump = () => { if (!on()) return; swish(0.16, 0.12, 900, 2400); tone('sine', 260, 520, 0.09, 0.06); };
    const sLand = (k = 1) => { hitNoise(0.08, 0.02, [[180, 2, 1.0], [420, 3, 0.4]], 0.6 * k); };
    const sStep = () => hitNoise(0.06, 0.012, [[900, 6, 0.6], [2200, 8, 0.3]], 0.5); // 針の上に乗った時

    // 柱時計の「ボーン」: 1時間たつごとに小さく鳴らす

      const now = ac.currentTime;
      for (const [r, v, d] of [[1, 0.09, 1.6], [2.0, 0.05, 1.1], [2.76, 0.035, 0.8], [5.4, 0.015, 0.5]]) {

        const g = ac.createGain(); g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(v, now + 0.01); g.gain.exponentialRampToValueAtTime(0.0005, now + d);

    }
    // 歯車がきしむ「ギギッ」: 針が逆回りする前
    function sGear() {
      if (!on()) return;
      for (let k = 0; k < 5; k++) hitNoise(0.04, 0.006, [[700, 5, 0.5], [1500, 6, 0.3]], 0.5 + k * 0.1);
      const now = ac.currentTime;
      const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(70, now); o.frequency.linearRampToValueAtTime(110, now + 0.4);

    function sHit() {

    scene.add(new THREE.HemisphereLight('#e8f4ff', '#5a7a3a', 1.1));
    const sun = new THREE.DirectionalLight('#fff4e0', 2.4); sun.position.set(-4, 11, 5);
    sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); sun.shadow.radius = 4; sun.shadow.bias = -0.0006;
    Object.assign(sun.shadow.camera, { left: -7.5, right: 7.5, top: 7.5, bottom: -7.5, near: 1, far: 30 });

    const mat = (c, rough = 0.75, metal = 0) => new THREE.MeshStandardMaterial({ color: c, roughness: rough, metalness: metal });

    const R = 4, CASE_H = 0.6, GROUND = -CASE_H, RIM = R + 0.3;
    const POS_R = 2; // キャラの立つ位置（6時の方向）

    {

      if (Math.floor(clockMin / 60) > Math.floor(before / 60)) sBell();
      tickAcc += Math.abs(secH.w) * dt;
      if (tickAcc > Math.PI / 6) { tickAcc %= Math.PI / 6; sTick(0.7); }
    }
    function stepCat(dt) {
      me.prevFeet = me.feet;
      if (!me.grounded) {
        const g = held && me.holdT < HOLD_MAX ? G_HOLD : G; // 押している間はふわっと
        me.holdT += dt;
        me.vy -= g * dt; me.feet += me.vy * dt;
      }
      let support = 0, hit = null;
      for (const h of hands) {
        if (!overlaps(h)) continue;
        if (me.prevFeet >= h.top - 0.05) support = Math.max(support, h.top); // 針の上に乗る
        else if (me.feet < h.top) hit = h;
      }
      if (hit) return hit;
      if (me.feet <= support) {
        if (!me.grounded) land(support);
        me.feet = support; me.vy = 0; me.grounded = true; me.onHand = support > 0;
      } else if (me.grounded) { me.grounded = false; me.vy = 0; me.holdT = 9; me.coyote = 0.12; } // 針が抜けて落ちる（落ち始めの少しの間は跳べる）
      if (me.coyote > 0) me.coyote -= dt;
      if (buffer > 0) { buffer -= dt; if (me.grounded || me.coyote > 0) { me.coyote = 0; jump(); } }
      me.squash *= Math.exp(-dt * 12);
      return null;
    }
    function knockOut(h) {
      state = 'hit'; hitT = 0;
      // 針が動く向きへ吹っ飛ぶ
      const tang = new THREE.Vector3(Math.cos(h.th), 0, Math.sin(h.th)).multiplyScalar(Math.sign(h.w) || 1);
      flySide = tang.x < 0 ? -1 : 1;
      resultEl.dataset.side = flySide < 0 ? 'r' : 'l';
      me.pos.set(CHAR.x, me.feet, CHAR.z); me.prevPos.copy(me.pos);
      me.vel.copy(tang).multiplyScalar(3.4 + Math.min(1, Math.abs(h.w) * 0.1)).add(new THREE.Vector3(0, 7.5, -0.6)); // 文字盤の上に落ちる
      me.spin = -flySide * 14;
      burst(new THREE.Vector3(CHAR.x, h.top, CHAR.z), 18, '#ffd23a', 4, 0.06, 0.45, 3);
      burst(new THREE.Vector3(CHAR.x, h.top, CHAR.z), 8, '#ffffff', 3, 0.05, 0.3, 2);
      sHit();
    }
    function stepFly(dt) {
      me.prevPos.copy(me.pos);
      if (!me.rest) {
        me.vel.y -= 22 * dt;
        me.pos.addScaledVector(me.vel, dt);
        const gy = Math.hypot(me.pos.x, me.pos.z) < RIM ? 0 : GROUND;
        cat.rotateZ(me.spin * dt);
        if (me.pos.y <= gy && me.vel.y < 0) {
          me.pos.y = gy;
          sLand(Math.min(1, -me.vel.y / 8));
          burst(me.pos.clone().setY(gy + 0.05), 8, '#cfe0a8', 1.8, 0.08, 0.5, 0.8);
          me.vel.y *= -0.35; me.vel.x *= 0.55; me.vel.z *= 0.55; me.spin *= 0.4;
          if (Math.abs(me.vel.y) < 1.5) { me.rest = true; me.restT = 0; hitQ.copy(cat.quaternion); }
        }
      } else {
        me.restT += dt;
        // 仰向けに倒れて目を回す
        const gy = Math.hypot(me.pos.x, me.pos.z) < RIM ? 0 : GROUND;
        me.pos.y = gy + 0.22 * CAT_S * Math.min(1, me.restT * 4);
        cat.quaternion.slerpQuaternions(hitQ, lieQ, Math.min(1, me.restT * 6));
        faceMesh.rotation.x = FACE_TILT + 1.3 * Math.min(1, me.restT * 6); // 寝ていても顔がカメラに見えるように
        stars.visible = true;
      }
      // 時計は止まっていく
      for (const h of hands) { h.w *= Math.exp(-dt * 2.5); h.prevTh = h.th; h.th += h.w * dt; h.trail.material.opacity *= 0.9; }
    }

    const STEP = 1 / 60;
    function step(dt) {
      stepFx(dt);
      if (state === 'idle') {
        // 普通の時計: 秒針が1秒ごとにカチッと進む。来たら猫が自分で跳ぶ（遊び方の見本）
        idleTick += dt;
        if (idleTick >= 1) { idleTick -= 1; secH.target += Math.PI * 2 / 60; sTick(0.5); }
        for (const h of hands) { h.prevTh = h.th; h.w = 0; }
        secH.th += (secH.target - secH.th) * Math.min(1, dt * 25);
        if (me.grounded && me.feet < secH.top) { const th = secH.th; secH.th = secH.target; if (overlaps(secH)) jump(); secH.th = th; }
        held = false;
        stepCat(dt);
        me.squash *= Math.exp(-dt * 12);
      } else if (state === 'play') {
        elapsed += dt;
        handSpeeds(dt);
        stepHands(dt);
        const h = stepCat(dt);
        if (h) knockOut(h);
      } else if (state === 'hit') {
        hitT += dt;
        stepFly(dt);
        if ((me.rest && me.restT > 0.7) || hitT > 3) finish();
      } else if (state === 'result') {
        stepFly(dt);
      }
    }

    // ---------- 画面 ----------
    function renderControls() {
      controls.innerHTML = '';
      controls.classList.toggle('hide', state !== 'result');
      if (state !== 'result') return;
      const b = document.createElement('button');
      b.className = 'go'; b.textContent = t('again');
      b.addEventListener('click', start);
      controls.append(b);
      const a = document.createElement('a');
      a.className = 'post'; a.textContent = t('post');
      a.href = `https://x.com/intent/post?text=${encodeURIComponent(t('share')(timeText()))}&url=${encodeURIComponent(SHARE_URL)}`;
      const coarse = matchMedia('(pointer: coarse)').matches;
      if (!coarse) { a.target = '_blank'; a.rel = 'noopener'; }
      // スマホは画像ごと共有シートへ。PCは画像を保存してから投稿画面を開く
      a.addEventListener('click', e => {
        const text = t('share')(timeText());
        if (coarse && navigator.share) {
          e.preventDefault();
          const file = shareFile();
          const data = file && navigator.canShare?.({ files: [file] }) ? { files: [file], text: `${text}\n${SHARE_URL}` } : { text: `${text}\n${SHARE_URL}` };
          navigator.share(data).catch(() => {});
          return;
        }
        const img = resultImage();
        if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'clock-jump.png'; d.click(); }
      });
      controls.append(a);
    }
    const timeText = () => { const m = Math.floor(clockMin); return t('time')(Math.floor(m / 60), m % 60); };
    // 結果画像: 倒れた猫と時計が入るように切り抜き、時間を重ねる
    let snap = null, shareCache = null;
    function takeSnap() {
      const src = renderer.domElement;
      const focus = me.pos.clone().multiplyScalar(0.5).project(camera);
      const fx = (focus.x + 1) / 2 * src.width, fy = (1 - focus.y) / 2 * src.height;
      const side = Math.min(src.width, src.height);
      const sx = THREE.MathUtils.clamp(fx - side / 2, 0, src.width - side), sy = THREE.MathUtils.clamp(fy - side / 2, 0, src.height - side);
      snap = document.createElement('canvas'); snap.width = snap.height = 1080;
      snap.getContext('2d').drawImage(src, sx, sy, side, side, 0, 0, 1080, 1080);
      shareCache = null;
    }
    function resultImage() {
      if (!snap) return null;
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const g = c.getContext('2d');
      g.drawImage(snap, 0, 0);
      g.textAlign = 'center'; g.fillStyle = '#fff'; g.lineJoin = 'round';
      const font = px => `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans Thai", sans-serif`;
      const text = (str, y, px, max) => {
        g.font = font(px);
        const w = g.measureText(str).width; if (w > max) { px *= max / w; g.font = font(px); }
        g.lineWidth = px * .16; g.strokeStyle = '#6b3d1c'; g.strokeText(str, 540, y); g.fillText(str, 540, y);
      };
      text(timeText(), 940, 160, 980);
      text(t('title'), 90, 56, 900);
      return c;
    }
    function prepareShare() {
      if (!snap) return;
      const key = lang;
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'clock-jump.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;
    function start() {
      reset();
      state = 'idle';
      resultEl.style.display = 'none';
      renderControls(); resize();
    }
    function showResult() { resultEl.children[0].textContent = timeText(); }
    function finish() {
      state = 'result';
      showResult();
      resultEl.style.display = 'flex';
      renderControls(); resize();
      snap = null; needSnap = true;
    }

    // ---------- ループ ----------
    let last = performance.now(), acc = 0, clock = 0;
    function render(alpha, dt) {
      clock += dt;
      for (const h of hands) h.pivot.rotation.y = -(h.prevTh + (h.th - h.prevTh) * alpha);
      if (state === 'idle' || state === 'play') {
        const f = me.prevFeet + (me.feet - me.prevFeet) * alpha;
        cat.position.set(CHAR.x, f, CHAR.z);
        // 伸び縮み・息づかい・手足
        const air = !me.grounded, breathe = air ? 0 : Math.sin(clock * 3) * 0.02;
        body.scale.set(1 + me.squash * 0.5, 1 - me.squash + breathe, 1 + me.squash * 0.5);
        const up = air ? Math.min(1, (me.vy + 4) / 8) : 0;
        arms.forEach((a, i) => { const s = i ? 1 : -1; a.rotation.z = s * (0.35 + (air ? 1.9 * (0.5 + up * 0.5) : 0)); });
        legs.forEach(l => { l.rotation.x = air ? -0.5 : 0; });
        cat.rotation.y = Math.sin(clock * 1.3) * 0.08;
      } else {
        cat.position.lerpVectors(me.prevPos, me.pos, alpha);
        arms.forEach((a, i) => { a.rotation.z = (i ? 1 : -1) * 2.2; });
        if (stars.visible) { stars.position.copy(cat.position).add(new THREE.Vector3(0, 0.35, -1.0)); stars.rotation.y += dt * 5; }
      }
      renderer.render(scene, camera);
      if (needSnap) { needSnap = false; takeSnap(); prepareShare(); }
    }
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      acc += dt;
      while (acc >= STEP) { step(STEP); acc -= STEP; }
      render(acc / STEP, dt);
      requestAnimationFrame(loop);
    }

    start();
    applyLang();
    // 最初の1回が重くならないように、一度描いておく
    stars.visible = true; renderer.compile(scene, camera); renderer.render(scene, camera); stars.visible = false;
    burst(new THREE.Vector3(0, -5, 0), 1, '#ffffff', 0, 0.01, 0.05, 0);
    requestAnimationFrame(t0 => { last = t0; loop(t0); });
  </script>
</body>
</html>
