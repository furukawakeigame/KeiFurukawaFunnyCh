      if (state !== 'play') return;
      power += 3; sPat();
      burst(new THREE.Vector3(pHandPos.x, HAND_Y + 0.05, rnd(-0.1, 0.1)), 2, '#f6ecd6', 0.5, 0.012, 0.35, 0.6, 1);
    }
    stage.addEventListener('pointerdown', e => { e.preventDefault(); tap(); }, { passive: false });
    stage.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
    addEventListener('keydown', e => { if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat && state !== 'result') { e.preventDefault(); tap(); } });

    const T_CRUSH = 12;           // これ以上の力で両側から押すと箱がつぶれていく
    const REACH = TR - BX - HX + 0.12; // 手が届く一番遠い所
    const onTable = () => boxBody.position.y > TOP + BY * 0.6;
    const STEP = 1 / 60;
    function step(dt) {
      for (const tr of tracks) { tr.pp.copy(tr.b.position); tr.pq.copy(tr.b.quaternion); }
      if (state === 'intro') {
        const t0 = introT; introT += dt;
        if (t0 < 0.4 && introT >= 0.4) { b1.style.display = 'block'; speak(P_F0, t('v1'), 0.12, 0.45); }
        if (t0 < 2.3 && introT >= 2.3) { b1.style.display = 'none'; b2.style.display = 'block'; speak(C_F0, t('v2'), 0.12, 0.4, -0.1); }
        if (introT >= 4.0) toReady();
      } else if (state === 'ready' || state === 'play') {
        introT += dt;
        if (introT > 5.2) fightEl.style.display = 'none';
      }
      const fighting = state === 'play' && armed;
      if (fighting) {
        elapsed += dt;
        // 猫の力: だんだん強くなり、ときどき溜めてから一気に押し返す
        nextSurge -= dt;
        if (nextSurge <= 0 && windT <= 0 && surgeT <= 0) { windT = 0.55; }
        if (windT > 0) { windT -= dt; if (windT <= 0) { surgeT = 0.9; nextSurge = rnd(2.2, 4.2); speak(C_F0 * 1.1, pick(['ua', 'oa', 'ia']), 0.12, 0.35); } }
        if (surgeT > 0) surgeT -= dt;
        const base = 5 + elapsed * 0.35;
        catF = base + (surgeT > 0 ? 6 : 0) - (windT > 0 ? 2.5 : 0);
      } else if (state !== 'over') catF = 0;
      power *= Math.exp(-2.2 * dt);
      const pF = state === 'play' ? power : 0;
      const cF = state === 'play' ? catF : 0;
      // 手が箱に届いている間だけ押せる。押し合いの差の分だけ箱が動く
      const bx = boxBody.position.x;
      const pOn = onTable() && bx - BX - HX < REACH, cOn = onTable() && bx + BX + HX > -REACH;
      const net = ((pOn ? pF : 0) - (cOn ? cF : 0)) * 0.4;
      if (onTable()) {
        // 天板との摩擦: 差が小さいうちは動かない。動き出しても手で押さえている分だけ重い
        const FR = 1.5;
        if (Math.abs(net) < FR) boxBody.velocity.x *= Math.exp(-20 * dt);
        else boxBody.applyForce(new CANNON.Vec3(net - Math.sign(net) * FR, 0, 0));
        boxBody.velocity.x *= Math.exp(-11 * dt);
      }
      world.step(STEP);
      // 手は箱に添えて動く。箱が落ちたら、その場で止まる
      if (onTable() && Math.abs(boxBody.position.x) < TR) { pHandPos.x = Math.min(boxBody.position.x - BX - HX, REACH); cHandPos.x = Math.max(boxBody.position.x + BX + HX, -REACH); }
      if (state === 'play' && pOn && cOn) {
        // 両側から強く押すと箱がつぶれていく
        const comp = (pF + cF) / 2; // 両側から押す力の合計で締め付けられる
        if (comp > T_CRUSH) {
          damage += dt * (comp - T_CRUSH) / 2;
          creakT -= dt;
          if (creakT <= 0) { sCreak(Math.min(1, 0.4 + damage)); creakT = 0.16 - damage * 0.08; burst(new THREE.Vector3(boxBody.position.x, TOP + BY * 2, rnd(-.1, .1)), 2, '#fff2c0', 0.8, 0.01, 0.3, 1.5); }
          if (damage >= 1) crush();
        }
      }
      if (state === 'play' && boxBody.position.y < TOP - 0.06) {
        outcome = boxBody.position.x > 0 ? 'win' : 'lose';
        state = 'over'; overT = 0;
      }
      if (state === 'over') {
        const t0 = overT; overT += dt;
        if (outcome !== 'crush' && t0 < 0.3 && overT >= 0.3) { sThud(); burst(new THREE.Vector3().copy(boxBody.position).setY(0.05), 12, '#d8c8a0', 1.2, 0.03, 0.6, 0.8); }
        if (t0 < 0.7 && overT >= 0.7) {
          if (outcome === 'win') speak(C_F0 * 0.85, 'uuu', 0.22, 0.4, -0.15);
          else if (outcome === 'lose') { speak(C_F0 * 1.15, 'eea', 0.13, 0.4, 0.2); speak(P_F0, 'ee', 0.2, 0.35, -0.1, 0.5); }
          else { speak(P_F0 * 1.2, 'e', 0.35, 0.4, 0.6); speak(C_F0, 'e', 0.35, 0.35, 0.6, 0.08); }
        }
        if (overT > 2.0) finish();
      }
      // 見た目: 体の傾き・震え
      const shakeP = Math.min(1, pF / 14), shakeC = Math.min(1, cF / 14);
      pBody.rotation.z = -0.25 * shakeP + Math.sin(performance.now() / 25) * 0.015 * shakeP;
      cBody.rotation.z = windT > 0 ? -0.18 : 0.25 * shakeC + Math.sin(performance.now() / 23) * 0.02 * shakeC;
      catFace.position.x = windT > 0 ? Math.sin(performance.now() / 15) * 0.008 : 0;
      for (const e of pEyes) e.scale.y = state === 'play' && pF > 9 ? 0.006 : 0.024; // 力むと目をつぶる
      if (state === 'over' && outcome === 'crush') for (const e of pEyes) e.scale.y = 0.03;
      // 箱のへこみ
      const dmg = Math.min(1, damage);
      boxInner.scale.set(1 - 0.45 * dmg + Math.sin(performance.now() / 20) * 0.01 * dmg, 1 + 0.12 * dmg, 1 + 0.25 * dmg);
      stepFx(dt);
    }
    function crush() {
      outcome = 'crush'; state = 'over'; overT = 0;
      const p = new THREE.Vector3().copy(boxBody.position);
      boxG.visible = false;
      flatG.visible = true; flatG.position.set(p.x, TOP, p.z);
      boxBody.collisionResponse = false; boxBody.position.y = -1; boxBody.type = CANNON.Body.STATIC; boxBody.updateMassProperties();
      sCrush();
      burst(p, 18, '#f6ecd6', 2, 0.02, 0.6, 2);
      spawnManju(p);
      setTimeout(sPlop, 450); setTimeout(sPlop, 600); setTimeout(sPlop, 820);
    }

    // ---------- 画面 ----------
    const resultEl = document.getElementById('result');
    function renderControls() {
      controls.innerHTML = '';
      controls.classList.toggle('hide', state !== 'result');
      if (state !== 'result') return;
      const b = document.createElement('button');
      b.className = 'go'; b.textContent = t('again');
      b.addEventListener('click', start);
      controls.append(b);
      const a = document.createElement('a');
      a.className = 'post'; a.textContent = t('post');
      a.href = `https://x.com/intent/post?text=${encodeURIComponent(t('share')(outcome, elapsed))}&url=${encodeURIComponent(SHARE_URL)}`;
      const coarse = matchMedia('(pointer: coarse)').matches;
      if (!coarse) { a.target = '_blank'; a.rel = 'noopener'; }
      // スマホは画像ごと共有シートへ。PCは画像を保存してから投稿画面を開く
      a.addEventListener('click', e => {
        const text = t('share')(outcome, elapsed);
        if (coarse && navigator.share) {
          e.preventDefault();
          const file = shareFile();
          const data = file && navigator.canShare?.({ files: [file] }) ? { files: [file], text: `${text}\n${SHARE_URL}` } : { text: `${text}\n${SHARE_URL}` };
          navigator.share(data).catch(() => {});
          return;
        }
        const img = resultImage();
        if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'oshitsuke.png'; d.click(); }
      });
      controls.append(a);
    }
    // 結果画像: 決着した画面に結果を重ねる
    let snap = null, shareCache = null;
    function takeSnap() {
      const src = renderer.domElement;
      const f = CENTER.clone().project(camera);
      const fx2 = (f.x + 1) / 2 * src.width, fy2 = (1 - f.y) / 2 * src.height;
      const side = Math.min(src.width, src.height);
      const sx = THREE.MathUtils.clamp(fx2 - side / 2, 0, src.width - side), sy = THREE.MathUtils.clamp(fy2 - side * 0.55, 0, src.height - side);
      snap = document.createElement('canvas'); snap.width = snap.height = 1080;
      snap.getContext('2d').drawImage(src, sx, sy, side, side, 0, 0, 1080, 1080);
      shareCache = null;
    }
    function resultImage() {
      if (!snap) return null;
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const g = c.getContext('2d');
      g.drawImage(snap, 0, 0);
      g.textAlign = 'center'; g.fillStyle = '#fff'; g.lineJoin = 'round';
      const font = px => `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans Thai", sans-serif`;
      const text = (str, y, px, max) => {
        g.font = font(px);
        const w = g.measureText(str).width; if (w > max) { px *= max / w; g.font = font(px); }
        g.lineWidth = px * .16; g.strokeStyle = '#5a3410'; g.strokeText(str, 540, y); g.fillText(str, 540, y);
      };
      text(t('title'), 80, 52, 900);
      text(t(outcome), 860, 80, 960);
      text(t('time')(elapsed), 1010, 150, 960);
      return c;
    }
    function prepareShare() {
      if (!snap) return;
      const key = lang;
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'oshitsuke.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;
    function showResult() { resultEl.children[0].textContent = t(outcome); resultEl.children[1].textContent = t('time')(elapsed); }
    function finish() {
      state = 'result';
      showResult();
      resultEl.style.display = 'flex';
      snap = null; needSnap = true;
      renderControls();
    }

    // ---------- ループ ----------
    const tmpV = new THREE.Vector3(), tmpQ = new THREE.Quaternion();
    const pShoulder = [new THREE.Vector3(), new THREE.Vector3()], cShoulder = [new THREE.Vector3(), new THREE.Vector3()];
    function placeBubble(el, obj, dy) {
      if (el.style.display !== 'block') return;
      obj.getWorldPosition(tmpV); tmpV.y += dy; tmpV.project(camera);
      const r = stage.clientWidth, H = stage.clientHeight;
      let x = (tmpV.x + 1) / 2 * r, y = (1 - tmpV.y) / 2 * H;
      const bw = el.offsetWidth;
      x = THREE.MathUtils.clamp(x, bw / 2 + 8, r - bw / 2 - 8);
      y = Math.max(el.offsetHeight + 8, y);
      el.style.transform = `translate(${x - bw / 2}px, ${y - el.offsetHeight}px)`;
    }
    function render(alpha) {
      for (const tr of tracks) {
        tr.m.position.lerpVectors(tr.pp, tmpV.copy(tr.b.position), alpha);
        tr.m.quaternion.slerpQuaternions(tr.pq, tmpQ.copy(tr.b.quaternion), alpha);
      }
      // 腕: 肩から手まで
      player.updateMatrixWorld(true); catG.updateMatrixWorld(true);
      [-1, 1].forEach((s, i) => {
        pBody.localToWorld(pShoulder[i].set(0.04, 0.5, s * 0.15));
        cBody.localToWorld(cShoulder[i].set(-0.04, 0.5, s * 0.15));
        const ph = pHandPos, chp = cHandPos;
        const pTo = new THREE.Vector3(ph.x - HX - 0.02, ph.y, s * 0.09), cTo = new THREE.Vector3(chp.x + HX + 0.02, chp.y, s * 0.09);
        setArm(pArms[i], pShoulder[i], pTo, 0.045); pHands[i].position.copy(pTo).x += 0.02;
        setArm(cArms[i], cShoulder[i], cTo, 0.045); cPaws[i].position.copy(cTo).x -= 0.02;
      });
      renderer.render(scene, camera);
      placeBubble(b1, pHead, 0.22); placeBubble(b2, cHead, 0.28);
      if (needSnap) { needSnap = false; takeSnap(); prepareShare(); }
    }
    let last = performance.now(), acc = 0;
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      acc += dt;
      while (acc >= STEP) { step(STEP); acc -= STEP; }
      render(acc / STEP);
      requestAnimationFrame(loop);
    }

    window.__step = step; window.__tap = tap;
    window.__dbg = () => ({ state, outcome, x: boxBody.position.x, vx: boxBody.velocity.x, y: boxBody.position.y, damage, catF, power, elapsed });
    resize();
    applyLang();
    start();
    // 最初の1回が重くならないように、全部の形を一度描いておく
    { world.step(STEP); flatG.visible = true; renderer.compile(scene, camera); renderer.render(scene, camera); flatG.visible = false; reset(); }
    requestAnimationFrame(t0 => { last = t0; loop(t0); });
  </script>
</body>
</html>
