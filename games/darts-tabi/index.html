      if (!hit?.info) return null;
      // 日本語のときは、表示している細かい地名の記事があればそれを開く
      if (lang === 'ja' && hit.detail?.link) return `https://ja.wikipedia.org/wiki/${encodeURIComponent(hit.detail.link.replace(/ /g, '_'))}`;
      const e = hit.info.muni && Object.keys(hit.info.muni.links).length ? hit.info.muni : hit.info.pref;
      for (const l of [lang, 'en', 'ja']) if (e.links[l]) return `https://${l}.wikipedia.org/wiki/${encodeURIComponent(e.links[l].replace(/ /g, '_'))}`;
      return null;
    }

    // ---------- 結果の表示 ----------
    function showCard() {
      if (state !== 'result' || !hit) { card.style.display = 'none'; return; }
      card.style.display = 'flex';
      const [sm, bg, sub] = [card.children[0], card.children[1], card.children[2]];
      const n = names();
      if (!n) { sm.textContent = ''; bg.textContent = ''; sub.textContent = ''; bg.className = 'wait'; return; }
      bg.className = '';
      sm.textContent = n[0]; bg.textContent = n[1]; sub.textContent = n[2] || '';
    }
    function renderControls() {
      controls.innerHTML = '';
      controls.classList.toggle('hide', state !== 'result');
      telop.classList.toggle('up', state === 'result');
      if (state !== 'result') return;
      const coarse = matchMedia('(pointer: coarse)').matches;
      const w = document.createElement('a');
      w.className = 'wiki'; w.textContent = t('wiki');
      const url = wikiURL();
      if (url) { w.href = url; w.target = '_blank'; w.rel = 'noopener'; } else w.classList.add('off');
      const b = document.createElement('button');
      b.className = 'go'; b.textContent = t('again'); b.addEventListener('click', again);
      controls.append(w, b);
      if (hit?.info) {
        const text = () => t('share')(fullName());
        const a = document.createElement('a');
        a.className = 'post'; a.textContent = t('post');
        a.href = `https://x.com/intent/post?text=${encodeURIComponent(text())}&url=${encodeURIComponent(SHARE_URL)}`;
        if (!coarse) { a.target = '_blank'; a.rel = 'noopener'; }
        // スマホは画像ごと共有シートへ。PCは画像を保存してから投稿画面を開く
        a.addEventListener('click', e => {
          if (coarse && navigator.share) {
            e.preventDefault();
            const file = shareFile();
            const data = file && navigator.canShare?.({ files: [file] }) ? { files: [file], text: `${text()}\n${SHARE_URL}` } : { text: `${text()}\n${SHARE_URL}` };
            navigator.share(data).catch(() => {});
            return;
          }
          const img = resultImage();
          if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'darts-tabi.png'; d.click(); }
        });
        controls.append(a);
      }
    }
    function again() {
      for (const d of stuck) d.removeFromParent();
      stuck.length = 0;
      hit = null; snap = null; shareCache = null; needSnap = false;
      state = 'ready';
      showCard(); renderControls(); updateGoal(false);
      newHeld();
    }

    // 結果画像: 刺さった所を中心にした画面に、地名を重ねる
    let snap = null, shareCache = null, needSnap = false;
    function takeSnap() {
      const src = renderer.domElement;
      const v = hitWorld().project(camera);
      const sx = (v.x + 1) / 2 * src.width, sy = (1 - v.y) / 2 * src.height;
      const side = Math.min(src.width, src.height);
      const x0 = THREE.MathUtils.clamp(sx - side / 2, 0, src.width - side), y0 = THREE.MathUtils.clamp(sy - side * 0.58, 0, src.height - side);
      snap = document.createElement('canvas'); snap.width = snap.height = 1080;
      snap.getContext('2d').drawImage(src, x0, y0, side, side, 0, 0, 1080, 1080);
      shareCache = null;
    }
    function resultImage() {
      if (!snap) return null;
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const g = c.getContext('2d');
      g.drawImage(snap, 0, 0);
      const sh = g.createLinearGradient(0, 0, 0, 380); sh.addColorStop(0, 'rgba(40,25,10,.55)'); sh.addColorStop(1, 'rgba(40,25,10,0)');
      g.fillStyle = sh; g.fillRect(0, 0, 1080, 380);
      g.textAlign = 'center'; g.fillStyle = '#fff'; g.lineJoin = 'round';
      const font = px => `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans Thai", sans-serif`;
      const text = (str, y, px, max) => {
        if (!str) return;
        g.font = font(px);
        const w = g.measureText(str).width; if (w > max) { px *= max / w; g.font = font(px); }
        g.lineWidth = px * .16; g.strokeStyle = '#5a3a1a'; g.strokeText(str, 540, y); g.fillText(str, 540, y);
      };
      const n = names() || ['', ''];
      text(n[0], 120, 64, 960);
      text(n[1], 270, 150, 980);
      if (n[2]) text(n[2], 340, 52, 960);
      text(t('title'), 1035, 48, 900);
      return c;
    }
    // 共有用ファイルは言語ごとに作っておく（クリック時に待つと Safari で共有が止まるため）
    function prepareShare() {
      if (!snap) return;
      const key = lang;
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'darts-tabi.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;

    // ---------- ループ ----------
    let last = 0, acc = 0, lastRumble = -1;
    const tmpQ = new THREE.Quaternion(), wobQ = new THREE.Quaternion(), XAX = new THREE.Vector3(1, 0, 0);
    function frame(dt) {
      acc += dt;
      while (acc >= STEP) { step(); acc -= STEP; }
      const k = acc / STEP;
      boardSpin.rotation.z = prevAngle + (angle - prevAngle) * k;
      // カメラを目標へなめらかに
      if (camGoal) {
        if (hit && state === 'result') camGoal.target = hitWorld();
        const s = camState, e = 1 - Math.exp(-dt * (state === 'result' ? 3.2 : 4));
        s.band += (camGoal.band - s.band) * e; s.side += (camGoal.side - s.side) * e; s.fit += (camGoal.fit - s.fit) * e;
        s.hold = (s.hold || 0) + ((camGoal.hold || 0) - (s.hold || 0)) * e;
        s.h += (camGoal.h - s.h) * e;
        s.tilt = (s.tilt || 0) + ((camGoal.tilt || 0) - (s.tilt || 0)) * e;
        s.target.lerp(camGoal.target, e);
      }
      applyCamera();
      placeHeld(dt);
      placeCat(dt);
      if (fly) { fly.d.position.lerpVectors(fly.prev, fly.p, k); fly.d.quaternion.copy(dartQuat(fly)); }
      // 刺さった直後のぷるぷる
      for (const d of stuck) {
        if (!d.userData.baseQ) continue;
        d.userData.wob += dt;
        const w = d.userData.wob; if (w > 1) continue;
        wobQ.setFromAxisAngle(XAX, Math.sin(w * 55) * 0.09 * Math.exp(-w * 6));
        d.quaternion.copy(d.userData.baseQ).multiply(wobQ);
      }
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        p.life -= dt; p.v.y -= G * dt * 0.6; p.o.position.addScaledVector(p.v, dt);
        p.o.scale.setScalar(p.s * Math.max(0, p.life / p.max));
        if (p.life <= 0) { scene.remove(p.o); parts.splice(i, 1); }
      }
      if (state === 'miss') { missT -= dt; if (missT <= 0) { state = 'ready'; if (stuck.length > 6) stuck.shift().removeFromParent(); newHeld(); } }
      if (hit) hit.t += dt;
      // ゴロゴロ音は値が変わった時だけ書き換える
      if (rumble) { const r = soundOn ? Math.round(omega / (OMEGA0 || 1) * 20) / 20 * 0.05 : 0; if (r !== lastRumble) { lastRumble = r; rumble.g.gain.setTargetAtTime(r, ac.currentTime, 0.08); } }
      renderer.render(scene, camera);
      // 結果画像: 名前が出てカメラが寄りきったら撮る
      if (needSnap && hit && hit.t > 1.8 && omega === 0) { needSnap = false; takeSnap(); prepareShare(); }
    }
    function loop(t) {
      const dt = Math.min(0.05, (t - last) / 1000); last = t;
      frame(dt);
      requestAnimationFrame(loop);
    }

    layout();
    newHeld();
    applyLang();
    // 最初のフレームで固まらないよう、先に1回描いておく
    frame(0);
    renderer.compileAsync?.(scene, camera).catch(() => {});
    // 粒の質感も先に用意
    { const p = new THREE.Mesh(partGeo, dropMat); p.position.set(0, -5, 0); scene.add(p); const q = new THREE.Mesh(partGeo, chipMat); q.position.set(0, -5, 0); scene.add(q); renderer.render(scene, camera); scene.remove(p, q); }
    requestAnimationFrame(t0 => { last = t0; requestAnimationFrame(loop); });
    window.__dbg = { get state() { return state; }, throwAt(x, y, s) { const v = new THREE.Vector3(x, y, 0).project(camera); throwDart(screenRay((v.x + 1) / 2 * W, (1 - v.y) / 2 * H), s || S0); }, get hit() { return hit; }, again, setAngle(a) { angle = prevAngle = a; }, setOmega(o) { omega = o; OMEGA0 = o; }, img: () => resultImage()?.toDataURL(), get file() { return !!shareFile(); }, get dbg() { return { needSnap, t: hit?.t, omega, snap: !!snap }; } };
  </script>
</body>
</html>
