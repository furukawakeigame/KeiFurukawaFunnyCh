  let THREE;

  // ---------- sound ----------
  let soundOn = store.get('sound', true), actx = null, noiseBuf = null, lastSnip = 0;
  const SPK = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>';
  function drawSnd() {

  }
  function snip() {

    if (!soundOn || now - lastSnip < 90) return;
    lastSnip = now;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (!noiseBuf) {
        noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.06, actx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);

  }

  // ---------- three.js scene ----------
  const glc = $('gl'), ov = $('ov'), octx = ov.getContext('2d');
  const renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: true, preserveDrawingBuffer: true });
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.setClearColor(0xeef1f3);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 50);
  scene.add(new THREE.HemisphereLight(0xffffff, 0xb8a898, 1.6));
  const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(1.5, 3, 4); scene.add(sun);

  const RAD = new THREE.Vector3(1, 1.15, 1.05);   // 頭の楕円体の半径
  const SKIN = 0xf2c9a8;
  const head = new THREE.Group(); scene.add(head);
  const skinMat = new THREE.MeshLambertMaterial({ color: SKIN });
  const skull = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 48), skinMat);
  skull.scale.copy(RAD); head.add(skull);

    ear.scale.set(0.6, 1, 0.8); ear.position.set(s * 0.98, -0.15, -0.05); head.add(ear);
  }
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.45, 1, 24), skinMat);
  neck.position.y = -1.35; scene.add(neck);
  const cape = new THREE.Mesh(new THREE.ConeGeometry(2.2, 1.8, 40, 1, true), new THREE.MeshLambertMaterial({ color: 0x9fc3d6, side: THREE.DoubleSide }));
  cape.position.y = -2.55; scene.add(cape);

  // 頭皮の髪（上と後ろ）
  const capMat = new THREE.MeshLambertMaterial({ color: 0x2a1d17 });
  const capTop = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 24, 0, Math.PI * 2, 0, 0.97), capMat);
  capTop.scale.copy(RAD).multiplyScalar(1.04); head.add(capTop);
  const capBack = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 32, Math.PI, Math.PI, 0, 2.35), capMat);
  capBack.scale.copy(RAD).multiplyScalar(1.04); head.add(capBack);

  // 顔: 頭の前半分に、切り抜いた画像を正面から投影して貼る
  const faceGeo = new THREE.SphereGeometry(1, 64, 48, 0, Math.PI);
  const faceMat = new THREE.MeshLambertMaterial({ transparent: true, depthWrite: false });
  const face = new THREE.Mesh(faceGeo, faceMat);
  face.scale.copy(RAD).multiplyScalar(1.006); head.add(face);
  function setFace(sprite) {
    // 端を透明にして、はみ出た部分は肌の色が見えるようにする
    const pad = 4, c = document.createElement('canvas');
    c.width = sprite.width + pad * 2; c.height = sprite.height + pad * 2;
    c.getContext('2d').drawImage(sprite, pad, pad);
    if (faceMat.map) faceMat.map.dispose();
    const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
    faceMat.map = tex; faceMat.needsUpdate = true;
    const asp = c.width / c.height;
    let fh = 1.6, fw = fh * asp;
    if (fw > 1.9) { fw = 1.9; fh = fw / asp; }
    const fy = -0.28, p = faceGeo.attributes.position, uv = faceGeo.attributes.uv;
    for (let i = 0; i < p.count; i++) uv.setXY(i, p.getX(i) * RAD.x / fw + 0.5, (p.getY(i) * RAD.y - fy) / fh + 0.5);
    uv.needsUpdate = true;
  }
  function defaultFace() {
    const c = document.createElement('canvas'); c.width = 300; c.height = 380;
    const g = c.getContext('2d');
    g.fillStyle = 'rgba(240,140,140,.35)';
    for (const x of [70, 230]) { g.beginPath(); g.ellipse(x, 250, 32, 18, 0, 0, Math.PI * 2); g.fill(); }
    g.fillStyle = '#2a2220';
    for (const x of [95, 205]) { g.beginPath(); g.ellipse(x, 185, 16, 22, 0, 0, Math.PI * 2); g.fill(); }
    g.fillStyle = '#fff';
    for (const x of [100, 210]) { g.beginPath(); g.arc(x, 178, 5, 0, Math.PI * 2); g.fill(); }
    g.strokeStyle = '#c98f70'; g.lineWidth = 6; g.lineCap = 'round';
    g.beginPath(); g.moveTo(150, 215); g.lineTo(142, 250); g.lineTo(154, 252); g.stroke();
    g.strokeStyle = '#a04a3a'; g.lineWidth = 8;
    g.beginPath(); g.arc(150, 280, 34, 0.2 * Math.PI, 0.8 * Math.PI); g.stroke();
    return c;
  }

  // ---------- 前髪（ひも状の毛をベルレ積分で動かす） ----------
  const P = 16;                    // 1本あたりの点の数
  const roots = [];                // { pos, dir, seg, tint }
  for (const [el, n] of [[0.6, 120], [0.69, 105], [0.78, 90]]) {
    for (let k = 0; k < n; k++) {
      const az = -1.25 + 2.5 * (k + Math.random() * 0.6) / n;
      const d = new THREE.Vector3(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el));
      const pos = d.clone().multiply(RAD).multiplyScalar(1.03);
      const nrm = new THREE.Vector3(d.x / RAD.x, d.y / RAD.y, d.z / RAD.z).normalize();
      const dir = nrm.multiplyScalar(0.6).add(new THREE.Vector3(0, 0.15, 0.3)).normalize();
      const L = 1.45 + 0.4 * Math.pow(Math.abs(az) / 1.25, 2) + Math.random() * 0.1;
      roots.push({ pos, dir, seg: L / (P - 1), tint: 0.82 + Math.random() * 0.3 });
    }
  }
  const N = roots.length;
  const pos = new Float32Array(N * P * 3), prev = new Float32Array(N * P * 3), lens = new Int16Array(N).fill(P);
  const rw = new Float32Array(N * 6);   // 根元2点のワールド座標
  let pieces = [];                      // 切れて落ちる毛
  const MAXPIECE = 500;

  const R = new THREE.Matrix3(), tmpV = new THREE.Vector3();
  function updateRoots() {
    head.updateMatrixWorld(true);
    R.setFromMatrix4(head.matrixWorld);
    for (let s = 0; s < N; s++) {
      const r = roots[s];
      tmpV.copy(r.pos).applyMatrix3(R); rw[s * 6] = tmpV.x; rw[s * 6 + 1] = tmpV.y; rw[s * 6 + 2] = tmpV.z;
      tmpV.copy(r.dir).multiplyScalar(r.seg * 0.8).add(r.pos).applyMatrix3(R);
      rw[s * 6 + 3] = tmpV.x; rw[s * 6 + 4] = tmpV.y; rw[s * 6 + 5] = tmpV.z;
    }
  }
  // 頭（楕円体）から外へ押し出す
  const COL = 1.06;
  function collide(a, i) {
    const e = R.elements;
    const x = a[i], y = a[i + 1], z = a[i + 2];
    // ワールド → 頭のローカル（回転の転置）
    let lx = (e[0] * x + e[1] * y + e[2] * z) / RAD.x, ly = (e[3] * x + e[4] * y + e[5] * z) / RAD.y, lz = (e[6] * x + e[7] * y + e[8] * z) / RAD.z;
    const m = Math.hypot(lx, ly, lz);
    if (m >= COL || m === 0) return;
    const k = COL / m; lx *= k * RAD.x; ly *= k * RAD.y; lz *= k * RAD.z;
    a[i] = e[0] * lx + e[3] * ly + e[6] * lz; a[i + 1] = e[1] * lx + e[4] * ly + e[7] * lz; a[i + 2] = e[2] * lx + e[5] * ly + e[8] * lz;
  }
  function constrain(a, b, i, j, rest, wi, wj, stiff) {
    const dx = a[j] - a[i], dy = a[j + 1] - a[i + 1], dz = a[j + 2] - a[i + 2];
    const d = Math.hypot(dx, dy, dz) || 1e-6, w = wi + wj;
    if (!w) return;
    const f = (d - rest) / d / w * stiff;
    a[i] += dx * f * wi; a[i + 1] += dy * f * wi; a[i + 2] += dz * f * wi;
    a[j] -= dx * f * wj; a[j + 1] -= dy * f * wj; a[j + 2] -= dz * f * wj;
  }
  const G = -5.5, DAMP = 0.975;
  function verlet(a, b, i0, i1, dt) {
    const g = G * dt * dt;
    for (let i = i0; i < i1; i += 3) {
      const vx = (a[i] - b[i]) * DAMP, vy = (a[i + 1] - b[i + 1]) * DAMP, vz = (a[i + 2] - b[i + 2]) * DAMP;
      b[i] = a[i]; b[i + 1] = a[i + 1]; b[i + 2] = a[i + 2];
      a[i] += vx; a[i + 1] += vy + g; a[i + 2] += vz;
    }
  }
  function step(dt) {
    updateRoots();
    for (let s = 0; s < N; s++) {
      const o = s * P * 3, n = lens[s], seg = roots[s].seg;
      verlet(pos, prev, o + 6, o + n * 3, dt);
      for (let k = 0; k < 6; k++) { pos[o + k] = rw[s * 6 + k]; prev[o + k] = rw[s * 6 + k]; }
      for (let it = 0; it < 4; it++) {
        for (let i = 1; i < n - 1; i++) constrain(pos, prev, o + i * 3, o + i * 3 + 3, seg, i < 2 ? 0 : 1, 1, 1);
        // 曲げにくさ（1つとばしの点どうし）
        for (let i = 0; i < n - 2; i++) constrain(pos, prev, o + i * 3, o + i * 3 + 6, seg * 1.94, i < 2 ? 0 : 1, 1, 0.12);
        for (let i = 2; i < n; i++) collide(pos, o + i * 3);
      }
    }
    for (const pc of pieces) {
      pc.age += dt;
      verlet(pc.pos, pc.prev, 0, pc.n * 3, dt);
      for (let it = 0; it < 2; it++) {
        for (let i = 0; i < pc.n - 1; i++) constrain(pc.pos, pc.prev, i * 3, i * 3 + 3, pc.seg, 1, 1, 1);
        for (let i = 0; i < pc.n; i++) collide(pc.pos, i * 3);
      }
    }
    pieces = pieces.filter(pc => pc.age < 5 && pc.pos[1] > -4);
  }
  // 根元から下へまっすぐ垂らした形に並べる（くし・やり直し用）
  function hangStrand(s, from) {
    const o = s * P * 3, seg = roots[s].seg;
    for (let i = Math.max(2, from); i < P; i++) {
      const j = o + i * 3, q = j - 3;
      pos[j] = pos[q] * 1.0; pos[j + 1] = pos[q + 1] - seg; pos[j + 2] = pos[q + 2] + seg * 0.15;

  }
  function resetHair(full) {
    if (full) lens.fill(P);
    updateRoots();

  // 毛を、カメラに向いた細い帯として描く
  function makeRibbonMesh(slots) {

    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(slots * P * 2 * 3), 3).setUsage(THREE.DynamicDrawUsage));
    geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(slots * P * 2 * 3), 3).setUsage(THREE.DynamicDrawUsage));

  let colorIdx = store.get('color', 0);
  // src の off から n 点を、帯の slot 番目に書き込む。i0 は元の毛での何番目の点か（太さ用）
  function writeRibbon(mesh, slot, src, off, n, i0, tint) {
    const pa = mesh.geometry.attributes.position.array, ca = mesh.geometry.attributes.color.array;
    const cp = camera.position, hc = HAIR[colorIdx];

      const a = off + Math.max(0, ii - 1) * 3, b = off + Math.min(n - 1, ii + 1) * 3;

  const ZERO = new Float32Array([0, -50, 0]);

  // ---------- 切る ----------
  const scr = new Float32Array(N * P * 2);

  function hit(ax, ay, bx, by, cx, cy, dx, dy) {
    const r = (bx - ax) * (dy - cy) - (by - ay) * (dx - cx);

    }
  }
  let pendingUndo = null;

  // ---------- 頭の向き ----------
  let yaw = 0, yawV = 0, yawT = 0, pitch = 0, pitchV = 0, pitchT = 0;
  function moveHead(dt) {
    yawV += (-(yaw - yawT) * 60 - yawV * 5) * dt; yaw += yawV * dt;
    pitchV += (-(pitch - pitchT) * 60 - pitchV * 6) * dt; pitch += pitchV * dt;
    head.rotation.set(pitch, yaw, 0, 'YXZ');
  }

  // ---------- layout ----------
  let W = 1, H = 1, DPR = 1;
  function resize() {
    const r = $('stage').getBoundingClientRect();
    W = Math.max(1, r.width); H = Math.max(1, r.height); DPR = Math.min(devicePixelRatio || 1, 2);
    renderer.setPixelRatio(DPR); renderer.setSize(W, H, false);
    ov.width = Math.round(W * DPR); ov.height = Math.round(H * DPR);
    camera.aspect = W / H;
    const tf = Math.tan(camera.fov * Math.PI / 360);
    const dist = Math.max(1.9 / tf, 1.55 / (tf * camera.aspect)) + 1.1;
    camera.position.set(0, -0.05, dist); camera.lookAt(0, -0.35, 0);
    camera.updateProjectionMatrix(); camera.updateMatrixWorld();
    if (img) placeImage();
    drawOverlay();
  }

  // ---------- 画像の切り抜き（タピオカメーカーと同じ塗り方式） ----------
  let mode = 'cut', img = null, mask = null, mctx = null, view = null, brushIdx = 1, erasing = false, paintUndo = [];
  function loadFile(f) {
    if (!f || !f.type.startsWith('image/')) return;
    const url = URL.createObjectURL(f), im = new Image();
    im.onload = () => {
      URL.revokeObjectURL(url);
      const k = Math.min(1, 1600 / Math.max(im.width, im.height));
      img = document.createElement('canvas');
      img.width = Math.max(1, Math.round(im.width * k)); img.height = Math.max(1, Math.round(im.height * k));
      img.getContext('2d').drawImage(im, 0, 0, img.width, img.height);
      mask = document.createElement('canvas'); mask.width = img.width; mask.height = img.height;
      mctx = mask.getContext('2d');

  }
  function snapFit() { if (view.k <= view.fit * 1.001) { view.x = (W - img.width * view.k) / 2; view.y = (H - img.height * view.k) / 2; } }
  function placeImage() {
    const pad = 12, k = Math.min((W - pad * 2) / img.width, (H - pad * 2) / img.height);
    view = { k, fit: k, x: (W - img.width * k) / 2, y: (H - img.height * k) / 2 };
  }
  const BRUSH = [8, 22, 50];
  const brushPx = () => BRUSH[brushIdx] / view.k;
  function toImg(e) {
    const r = ov.getBoundingClientRect();

  }

  const midOf = (a, b) => { const r = ov.getBoundingClientRect(); return { x: (a.x + b.x) / 2 - r.left, y: (a.y + b.y) / 2 - r.top }; };

  // ---------- buttons ----------
  $('photo').onclick = () => $('file').click();
  $('file').onchange = e => { loadFile(e.target.files[0]); e.target.value = ''; };
  $('shake').onclick = () => { yawV += yawV >= 0 ? 9 : -9; };

  $('undo').onclick = () => { const d = paintUndo.pop(); if (d) { mctx.putImageData(d, 0, 0); drawOverlay(); updateDone(); } };
  $('cancel').onclick = () => setMode('cut');
  $('done').onclick = () => {

    setFace(sp); undoStack = []; pieces = []; yaw = yawT = yawV = pitch = pitchT = pitchV = 0; moveHead(0);
    resetHair(true); setMode('cut');

  function exportCanvas() {

    // 3D 画面を枠いっぱいに（はみ出す分は切る）
    const sw = glc.width, sh = glc.height, k = Math.max(c.width / sw, (c.height - 90) / sh);
    g.drawImage(glc, (c.width - sw * k) / 2, (c.height - 90 - sh * k) / 2, sw * k, sh * k);
    g.fillStyle = '#eef1f3'; g.fillRect(0, c.height - 90, c.width, 90);
    g.fillStyle = '#3a6e8f'; g.font = 'bold 34px sans-serif'; g.textAlign = 'right';

  $('save').onclick = () => {

      if (matchMedia('(pointer: coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })) {

      }

  // ---------- modes / text ----------
  function updatePost() {
    const a = $('post');

    if (!matchMedia('(pointer: coarse)').matches) { a.target = '_blank'; a.rel = 'noopener'; }
  }

  // ---------- loop ----------
