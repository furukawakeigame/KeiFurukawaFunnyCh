        const d = noiseBuf.getChannelData(0);

  // ---------- three.js scene ----------

  const RAD = new THREE.Vector3(1, 1.15, 1.05);   // 頭の楕円体の半径

  // 頭皮の髪（上と後ろ）
  const capMat = new THREE.MeshLambertMaterial({ color: 0x2a1d17 });
  // 生え際の高さ（仰角）: 前はおでこの上、横は耳の上、後ろはうなじまで
  const smooth = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  const hairline = az => 0.6 - 1.1 * smooth(0.9, 2.7, Math.abs(az));
  // 頭皮: 球の生え際より下の頂点を頭の中へ沈めて、髪の生えている所だけ見せる
  const capGeo = new THREE.SphereGeometry(1, 64, 48), cp = capGeo.attributes.position;
  for (let i = 0; i < cp.count; i++) {
    const x = cp.getX(i), y = cp.getY(i), z = cp.getZ(i);
    if (Math.asin(Math.max(-1, Math.min(1, y))) < hairline(Math.atan2(x, z)) - 0.03) cp.setXYZ(i, x * 0.9, y * 0.9, z * 0.9);
  }
  capGeo.computeVertexNormals();
  const cap = new THREE.Mesh(capGeo, capMat);
  cap.scale.copy(RAD).multiplyScalar(1.02); head.add(cap);

  // 顔: 頭の前半分に、切り抜いた画像を正面から投影して貼る
  const faceGeo = new THREE.SphereGeometry(1, 64, 48, 0, Math.PI);
  const faceMat = new THREE.MeshLambertMaterial({ transparent: true, depthWrite: false });
  const face = new THREE.Mesh(faceGeo, faceMat);
  face.scale.copy(RAD).multiplyScalar(1.006); head.add(face);
  function setFace(sprite) {
    // 端を透明にして、はみ出た部分は肌の色が見えるようにする
    const pad = 4, c = document.createElement('canvas');
    c.width = sprite.width + pad * 2; c.height = sprite.height + pad * 2;
    c.getContext('2d').drawImage(sprite, pad, pad);
    if (faceMat.map) faceMat.map.dispose();
    const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
    faceMat.map = tex; faceMat.needsUpdate = true;
    const asp = c.width / c.height;
    let fh = 1.6, fw = fh * asp;
    if (fw > 1.9) { fw = 1.9; fh = fw / asp; }
    const fy = -0.28, p = faceGeo.attributes.position, uv = faceGeo.attributes.uv;
    for (let i = 0; i < p.count; i++) uv.setXY(i, p.getX(i) * RAD.x / fw + 0.5, (p.getY(i) * RAD.y - fy) / fh + 0.5);
    uv.needsUpdate = true;
  }
  function defaultFace() {
    const c = document.createElement('canvas'); c.width = 300; c.height = 380;
    const g = c.getContext('2d');
    g.fillStyle = 'rgba(240,140,140,.35)';
    for (const x of [70, 230]) { g.beginPath(); g.ellipse(x, 250, 32, 18, 0, 0, Math.PI * 2); g.fill(); }
    g.fillStyle = '#2a2220';
    for (const x of [95, 205]) { g.beginPath(); g.ellipse(x, 185, 16, 22, 0, 0, Math.PI * 2); g.fill(); }
    g.fillStyle = '#fff';
    for (const x of [100, 210]) { g.beginPath(); g.arc(x, 178, 5, 0, Math.PI * 2); g.fill(); }
    g.strokeStyle = '#c98f70'; g.lineWidth = 6; g.lineCap = 'round';
    g.beginPath(); g.moveTo(150, 215); g.lineTo(142, 250); g.lineTo(154, 252); g.stroke();
    g.strokeStyle = '#a04a3a'; g.lineWidth = 8;
    g.beginPath(); g.arc(150, 280, 34, 0.2 * Math.PI, 0.8 * Math.PI); g.stroke();

  }

  // ---------- 髪（ひも状の毛をベルレ積分で動かす） ----------
  const P = 16;                    // 1本あたりの点の数
  const roots = [];                // { pos, dir, seg, tint }
  // 頭全体に均等に散らした点（フィボナッチ球）のうち、生え際より上のものを根元にする

    // 根元はななめ下へ（頭頂部の毛が逆立たないように）
    const dir = nrm.multiplyScalar(0.6).add(new THREE.Vector3(0, 0.15 - 0.45 * smooth(0.5, 1.3, el), 0.3 * front)).normalize();

    for (let s = 0; s < N; s++) {
      const r = roots[s];
      tmpV.copy(r.pos).applyMatrix3(R); rw[s * 6] = tmpV.x; rw[s * 6 + 1] = tmpV.y; rw[s * 6 + 2] = tmpV.z;
      tmpV.copy(r.dir).multiplyScalar(r.seg * 0.8).add(r.pos).applyMatrix3(R);
      rw[s * 6 + 3] = tmpV.x; rw[s * 6 + 4] = tmpV.y; rw[s * 6 + 5] = tmpV.z;

  // 頭（楕円体）から外へ押し出す

  function collide(a, i) {

    const x = a[i], y = a[i + 1], z = a[i + 2];

    let lx = (e[0] * x + e[1] * y + e[2] * z) / RAD.x, ly = (e[3] * x + e[4] * y + e[5] * z) / RAD.y, lz = (e[6] * x + e[7] * y + e[8] * z) / RAD.z;

  function collideBody(a, i) {
    const y = a[i + 1];
    if (y > -0.85) return;
    const r = Math.hypot(a[i], a[i + 2]) || 1e-6;
    const need = y > -1.65 ? 0.5 : Math.max(0.5, (-1.65 - y) * 1.22 + 0.08);

    const d = Math.hypot(dx, dy, dz) || 1e-6, w = wi + wj;

  const G = -5.5, DAMP = 0.975;
  function verlet(a, b, i0, i1, dt) {

    if (mode !== 'cut') return;
    if (rot) {
      const vals = [...touches.values()], m = vals.length >= 2 ? midOf(vals[0], vals[1]) : local(e);
      yawT = rot.y0 + (m.x - rot.m.x) * 0.01;
      pitchT = Math.max(-0.5, Math.min(0.6, rot.p0 + (m.y - rot.m.y) * 0.008));
      return;
    }
    if (cutPt) {
      const p = local(e);
      cutQueue.push([cutPt.x, cutPt.y, p.x, p.y]);
      cutPt = p; trail.push({ ...p, t: performance.now(), id: strokeId });
    }
  });
  const up = e => {
    touches.delete(e.pointerId);
    if (mode === 'paint') {
      if (touches.size === 0) pinch = null;
      if (lastPt) { lastPt = null; updateDone(); }
    }
    if (touches.size === 0) { rot = null; cutPt = null; }
  };
  ov.addEventListener('pointerup', up);
  ov.addEventListener('pointercancel', up);
  ov.addEventListener('wheel', e => {
    if (mode !== 'paint') return;
    e.preventDefault();
    const r = ov.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
    const k = Math.max(view.fit, Math.min(view.fit * 12, view.k * Math.exp(-e.deltaY * 0.0015)));
    view.x = mx - (mx - view.x) / view.k * k; view.y = my - (my - view.y) / view.k * k; view.k = k; snapFit();
    drawOverlay();
  }, { passive: false });

  // ---------- buttons ----------
  $('photo').onclick = () => $('file').click();
  $('file').onchange = e => { loadFile(e.target.files[0]); e.target.value = ''; };
  $('turn').onclick = () => { yawT += Math.PI / 2; };
  $('undoCut').onclick = () => {
    const u = undoStack.pop(); if (!u) return;
    for (let s = 0; s < N; s++) if (u.lens[s] > lens[s]) { const from = lens[s]; lens[s] = u.lens[s]; hangStrand(s, from); }
    strandCol.set(u.col); capMat.color.copy(u.cap);
  };
  $('brush').onclick = () => {
    brushIdx = (brushIdx + 1) % BRUSH.length;
    const d = $('brush').firstChild; d.style.width = d.style.height = [5, 11, 20][brushIdx] + 'px';
  };
  $('erase').onclick = () => { erasing = !erasing; $('erase').classList.toggle('on', erasing); };
  $('undo').onclick = () => { const d = paintUndo.pop(); if (d) { mctx.putImageData(d, 0, 0); drawOverlay(); updateDone(); } };
  $('cancel').onclick = () => setMode('cut');
  $('done').onclick = () => {
    const sp = makeSprite(); if (!sp) return;
    setFace(sp); undoStack = []; pieces = []; yaw = yawT = yawV = pitch = pitchT = pitchV = 0; moveHead(0);
    resetHair(true); setMode('cut');
  };
  // ---------- X投稿用の動画（頭のまわりをカメラが1周する。最初と最後がつながるループ） ----------
  // 画面と同じ renderer で、表示の合間に1コマずつ描いて MP4 にする
  const VFPS = 30, VFRAMES = 120, VW = 720, VH = 900;  // 4秒で1周
  let shareFile = null, videoJob = null, videoKey = 0;
  const vidCam = new THREE.PerspectiveCamera(35, VW / VH, 0.1, 50);
  // a 周目の角度にカメラを置く（cam の縦横比に合わせて距離を決める）
  function orbit(cam, a) {
    const tf = Math.tan(cam.fov * Math.PI / 360);
    const d = Math.max(1.9 / tf, 1.55 / (tf * cam.aspect)) + 1.1;
    cam.position.set(Math.sin(a) * d, -0.05, Math.cos(a) * d); cam.lookAt(0, -0.35, 0);
    cam.updateProjectionMatrix(); cam.updateMatrixWorld();
  }
  async function makeVideo(key) {
    shareFile = null; updatePost();
    if (!('VideoEncoder' in window) || !window.Mp4Muxer) return;
    let cfg = null;
    for (const codec of ['avc1.640028', 'avc1.4d0028', 'avc1.42001f']) {
      const c = { codec, width: VW, height: VH, bitrate: 6e6, framerate: VFPS };
      try { if ((await VideoEncoder.isConfigSupported(c)).supported) { cfg = c; break; } } catch {}
    }
    if (!cfg || key !== videoKey) return;
    const out = document.createElement('canvas'); out.width = VW; out.height = VH;
    const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec: 'avc', width: VW, height: VH, frameRate: VFPS }, fastStart: 'in-memory' });
    const job = { key, out, ctx: out.getContext('2d'), muxer, i: 0, failed: false };
    job.enc = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: () => { job.failed = true; } });
    job.enc.configure(cfg);
    videoJob = job;
  }
  // ループの中から呼ぶ。1回で1コマ。画面の左下に描いて 2D キャンバスへ写す（このあと画面は描き直す）
  function videoFrame() {
    const job = videoJob;
    if (job.key !== videoKey || job.failed) { try { job.enc.close(); } catch {} videoJob = null; return; }
    const cw = glc.width, ch = glc.height, pr = renderer.getPixelRatio();
    const sw = Math.floor(Math.min(cw, ch * VW / VH) / 2) * 2, sh = Math.floor(sw * VH / VW / 2) * 2;
    orbit(vidCam, job.i / VFRAMES * Math.PI * 2);
    viewCam = vidCam; writeHair(); viewCam = camera;
    renderer.setScissorTest(true);
    renderer.setViewport(0, 0, sw / pr, sh / pr); renderer.setScissor(0, 0, sw / pr, sh / pr);
    renderer.render(scene, vidCam);
    renderer.setScissorTest(false); renderer.setViewport(0, 0, W, H);
    const g = job.ctx;
    g.drawImage(glc, 0, ch - sh, sw, sh, 0, 0, VW, VH);
    g.fillStyle = 'rgba(58,110,143,.8)'; g.font = 'bold 26px sans-serif'; g.textAlign = 'right';
    g.fillText('keifurukawafunnych.com', VW - 24, VH - 24);
    const frame = new VideoFrame(job.out, { timestamp: Math.round(job.i * 1e6 / VFPS), duration: Math.round(1e6 / VFPS) });
    job.enc.encode(frame, { keyFrame: job.i % 60 === 0 }); frame.close();
    job.i++;
    if (job.i < VFRAMES) return;
    videoJob = null;
    (async () => {
      await job.enc.flush(); job.enc.close(); job.muxer.finalize();
      if (job.key !== videoKey || job.failed) return;
      shareFile = new File([job.muxer.target.buffer], 'maegami-cut.mp4', { type: 'video/mp4' });
      updatePost();
    })().catch(() => {});
  }
  let resultT0 = 0;
  $('finish').onclick = () => {
    trail = []; pieces = [];
    resultT0 = performance.now();
    setMode('result');
    makeVideo(++videoKey);
  };
  $('again').onclick = () => { videoKey++; shareFile = null; resize(); setMode('cut'); };
  const canVideo = 'VideoEncoder' in window;
  $('post').addEventListener('click', e => {
    const coarse = matchMedia('(pointer: coarse)').matches;
    // 動画ができるまでは押せない（動画なしで投稿されないように）
    if (!shareFile && canVideo) { e.preventDefault(); return; }
    // スマホは動画ごと共有メニューへ
    if (coarse && navigator.share) {
      e.preventDefault();
      const text = `${shareText()}\n${SHARE_URL}`;
      const data = shareFile && navigator.canShare?.({ files: [shareFile] }) ? { files: [shareFile], text } : { text };
      navigator.share(data).catch(() => {});
      return;
    }
    // PCは動画を保存してから投稿画面を開く
    if (shareFile) {
      const d = document.createElement('a');
      d.href = URL.createObjectURL(shareFile); d.download = shareFile.name; document.body.appendChild(d); d.click(); d.remove();
      setTimeout(() => URL.revokeObjectURL(d.href), 10000);
    }
  });

  // ---------- modes / text ----------
  function updatePost() {
    const a = $('post');
    a.href = `https://x.com/intent/post?text=${encodeURIComponent(shareText())}&url=${encodeURIComponent(SHARE_URL)}`;
    if (!matchMedia('(pointer: coarse)').matches) { a.target = '_blank'; a.rel = 'noopener'; }
    a.classList.toggle('wait', !shareFile && canVideo);
  }
  function setMode(m) {
    mode = m;
    if (m !== 'cut' && dyeMode) closePalette(); else $('palette').classList.add('hide');
    $('barCut').classList.toggle('hide', m !== 'cut');
    $('barPaint').classList.toggle('hide', m !== 'paint');
    $('result').classList.toggle('hide', m !== 'result');
    glc.style.visibility = m === 'paint' ? 'hidden' : 'visible';
    if (m === 'paint') { $('erase').classList.remove('on'); updateDone(); }
    touches.clear(); rot = null; cutPt = null;
    drawOverlay();
  }
  function applyLang() {
    document.documentElement.lang = lang;
    document.title = t('title');
    $('back').textContent = t('back');
    $('lang').value = lang;
    for (const k of ['erase', 'undo', 'cancel', 'done', 'post', 'again']) $(k).textContent = t(k);
    updatePost();
  }
  $('lang').onchange = () => { lang = $('lang').value; store.set('lang', lang); applyLang(); };
  $('snd').onclick = () => { soundOn = !soundOn; store.set('sound', soundOn); drawSnd(); };

  // ---------- loop ----------
  let lastT = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
    if (mode === 'cut') {
      acc += dt;
      while (acc >= 1 / 60) { moveHead(1 / 60); step(1 / 60); acc -= 1 / 60; }
      doCuts();
      writeHair();
      renderer.render(scene, camera);
      drawOverlay();
    } else if (mode === 'result') {
      // 動画と同じ速さでカメラが頭のまわりを回る
      if (videoJob) videoFrame();
      orbit(camera, (now - resultT0) / (VFRAMES / VFPS * 1000) * Math.PI * 2);
      writeHair();
      renderer.render(scene, camera);
    }
    requestAnimationFrame(loop);
  }

  drawSnd(); applyLang(); dyeAll(); drawPalette();
  setFace(defaultFace());
  new ResizeObserver(resize).observe($('stage'));
  resize();
  resetHair(true);
  setMode('cut');
  requestAnimationFrame(loop);
</script>
</body>
</html>
