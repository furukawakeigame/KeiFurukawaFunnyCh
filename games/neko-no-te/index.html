      const vp = new THREE.Vector3(((w / 2) / w) * 2 - 1 + 0, 1 - 2 * cy / H, 0.5).unproject(camera);
      // setViewOffset のため x はそのまま中央で良い
      catBase.pos.copy(camera.position).addScaledVector(vp.sub(camera.position).normalize(), L);
      catBase.scale = S * perPx;
      catBase.up.set(0, 1, 0).applyQuaternion(camera.quaternion);
      cat.quaternion.copy(camera.quaternion);
      catBase.S = S; catBase.perPx = perPx;
      // 胴体: 顔の下、仕切りの向こうの面に置き、顔の幅に合わせる
      const toPlane = (sx, sy, z) => { const v = new THREE.Vector3(sx / w * 2 - 1, 1 - 2 * sy / H, 0.5).unproject(camera).sub(camera.position).normalize(); return camera.position.clone().addScaledVector(v, (z - camera.position.z) / v.z); };
      const BZ = PART_Z - 1.7, neckY = cy + 0.3 * S;
      bodyBase.pos.copy(toPlane(w / 2, neckY, BZ));
      bodyBase.w = toPlane(w / 2 + 0.5 * S, neckY, BZ).distanceTo(bodyBase.pos) * 2;
      bodyBase.perPx = bodyBase.w / S;
      body.scale.setScalar(bodyBase.w);
    }
    addEventListener('resize', resize);

    // ---------- 入力 ----------
    // 山は横一列なので、押した所に一番近い山を選ぶ（多少ずれても拾う）
    function pileAt(e) {
      const r = renderer.domElement.getBoundingClientRect();
      const x = e.clientX - r.left;
      let best = 0, bd = Infinity;
      PILES.forEach((p, i) => { const v = new THREE.Vector3(p.x, topY(p) * 0.5 + 0.5, p.z).project(camera); const sx = (v.x + 1) / 2 * r.width, d = Math.abs(sx - x); if (d < bd) { bd = d; best = i; } });
      return best;
    }
    renderer.domElement.addEventListener('pointerdown', e => { e.preventDefault(); if (state === 'play') stamp(pileAt(e)); }, { passive: false });
    addEventListener('keydown', e => {
      if (e.repeat || state !== 'play' || e.target.closest?.('select')) return;
      const k = e.key.toLowerCase();
      const i = ['arrowleft', 'a', '1'].includes(k) ? 0 : ['arrowdown', 'arrowup', 's', 'w', '2'].includes(k) ? 1 : ['arrowright', 'd', '3'].includes(k) ? 2 : -1;
      if (i >= 0) { e.preventDefault(); stamp(i); }
    });
    stage.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

    // ---------- ゲーム ----------
    let state = 'play', armed = false, score = 0, elapsed = 0, nextSpawn = 0, overT = 0, needSnap = false, clock = 0, collapsed = -1, meowIn = 4;
    function stamp(pi) {
      if (!armed) { armed = true; elapsed = 0; nextSpawn = 0.5; }
      const p = PILES[pi];
      // 前足: 左の山は左手、右の山は右手、真ん中は交互
      const a = pi === 0 ? arms[0] : pi === 2 ? arms[1] : arms[nextArm = 1 - nextArm];
      const target = new THREE.Vector3(p.x, topY(p) + 0.02, p.z + 0.15);
      a.from.copy(a.cur); a.target.copy(target); a.t = 0;
      if (!p.sheets.length) { setTimeout(() => hiss(0.06, 0.4, [['lowpass', 600, 0.7, 1.2]]), 90); return; }
      const m = p.sheets.pop();
      const y = topY(p) + TH / 2;
      m.material = STAMP_MATS;
      const f = { m, t: -0.1, from: m.position.clone().setY(y), ry0: m.rotation.y, spin: rnd(-1, 1) };
      flying.push(f);
      p.swayV += (Math.random() - 0.5) * 0.25;
      score++;
      setTimeout(() => { sStamp(); if (--meowIn <= 0) { sMeow(); meowIn = 3 + Math.floor(Math.random() * 5); } }, 90);
    }
    function reset() {
      for (const p of PILES) { for (const m of p.sheets) scene.remove(m); p.sheets = []; p.sway = p.swayV = p.danger = 0; }
      for (const f of falling) scene.remove(f.g); falling.length = 0;
      for (const f of flying) scene.remove(f.m); flying.length = 0;
      for (const d of debris) scene.remove(d.m); debris.length = 0;
      for (const m of trayStack) tray.remove(m); trayStack.length = 0;
      [3, 5, 4].forEach((n, i) => { for (let k = 0; k < n; k++) addSheet(PILES[i]); });
      for (const a of arms) { a.t = 9; a.lift = 0; a.from.copy(a.rest); a.target.copy(a.rest); a.cur.copy(a.rest); }
      score = 0; armed = false; elapsed = 0; nextSpawn = 1; overT = 0; collapsed = -1;
    }
    function spawnTick() {
      const counts = PILES.map((p, i) => p.sheets.length + falling.filter(f => f.pi === i).reduce((s, f) => s + f.n, 0));
      if (!armed) {
        // 始まる前は崩れないよう、低い山にだけ降らせる
        const low = [0, 1, 2].filter(i => counts[i] < 7);
        if (low.length) spawnFall(pick(low), false);
        return;
      }
      const bundle = elapsed > 9 && Math.random() < Math.min(0.2, (elapsed - 9) / 100);
      spawnFall(Math.floor(Math.random() * 3), bundle);
    }
    // 崩れる: 紙が机いっぱいに散らばる
    function topple(pi, power = 1) {
      const p = PILES[pi];
      const dirx = Math.sign(p.x || (Math.random() - 0.5)) * 0.6 + rnd(-0.6, 0.6);
      p.sheets.forEach((m, i) => {
        const k = i / Math.max(1, p.sheets.length);
        const v = new THREE.Vector3(dirx * (1 + k * 4) + rnd(-1.5, 1.5), 1.5 + k * 4 + rnd(0, 2), 1.2 + k * 3 * Math.random() + rnd(-1, 1)).multiplyScalar(power);
        debris.push({ m, p: m.position.clone(), pp: m.position.clone(), v, w: new THREE.Vector3(rnd(-6, 6), rnd(-4, 4), rnd(-6, 6)), rest: false });
      });
      p.sheets = [];
    }
    function gameOver(pi) {
      state = 'over'; overT = 0; collapsed = pi;
      topple(pi, 1.1);
      sCollapse();
      burst(new THREE.Vector3(PILES[pi].x, MAX * TH, PILES[pi].z), 16, '#fff6e0', 3, 0.1, 0.6, 2);
      for (const a of arms) { a.t = 9; a.lift = 0; }
      renderControls();
    }
    const STEP = 1 / 60;
    function step(dt) {
      clock += dt;
      if (state === 'play') {
        if (armed) elapsed += dt;
        nextSpawn -= dt;
        if (nextSpawn <= 0) { spawnTick(); nextSpawn = armed ? Math.max(0.15, 0.95 * Math.exp(-elapsed / 26)) * rnd(0.7, 1.3) : 1.4; }
      }
      // 降ってくる紙: ひらひら揺れながら落ちる
      for (let k = falling.length - 1; k >= 0; k--) {
        const f = falling[k], p = PILES[f.pi];
        f.py = f.y; f.t += dt;
        f.vy = Math.max(f.vy - dt * (f.bundle ? 14 : 5), f.bundle ? -14 : -6.5);
        f.y += f.vy * dt;
        f.g.rotation.set(Math.sin(f.t * 5) * (f.bundle ? 0.05 : 0.22), f.ry, Math.cos(f.t * 4) * (f.bundle ? 0.05 : 0.25));
        f.g.userData.sx = Math.sin(f.t * 3.3) * (f.bundle ? 0.02 : 0.25);
        if (f.y <= topY(p) + 0.02 && state !== 'result') {
          scene.remove(f.g); falling.splice(k, 1);
          if (state !== 'play') continue;
          for (let n = 0; n < f.n; n++) addSheet(p);
          p.swayV += (f.bundle ? 0.5 : 0.12) * (Math.random() < 0.5 ? -1 : 1);
          sLand(f.bundle);
          if (f.bundle) { sSnap(); burst(new THREE.Vector3(p.x, topY(p), p.z), 8, '#d8402a', 2, 0.05, 0.4, 2); }
          else burst(new THREE.Vector3(p.x, topY(p), p.z), 4, '#fff6e0', 1.2, 0.06, 0.35, 0.6);
          if (p.sheets.length > MAX) { gameOver(f.pi); break; }
        }
      }
      // 山の揺れ: 高いほど揺れやすい（バネ）
      for (const p of PILES) {
        const fill = p.sheets.length / MAX;
        p.danger += ((fill > 0.6 ? (fill - 0.6) / 0.4 : 0) - p.danger) * Math.min(1, dt * 6);
        p.swayV += (-p.sway * 40 - p.swayV * 4) * dt + Math.sin(clock * 9 + p.x) * p.danger * dt * 1.2;
        p.sway += p.swayV * dt;
        p.sway = THREE.MathUtils.clamp(p.sway, -0.25, 0.25);
      }
      // ハンコを押された紙: 少しその場にとどまってから、弧を描いてトレイへ
      for (let k = flying.length - 1; k >= 0; k--) {
        const f = flying[k]; f.t += dt;
        if (f.t < 0) continue;
        if (!f.started) { f.started = true; f.to = trayTop(); sWhoosh(); printPop(f.from.clone().setY(f.from.y + 0.4)); }
        const q = Math.min(1, f.t / 0.42), e = 1 - (1 - q) ** 2;
        f.m.position.lerpVectors(f.from, f.to, e); f.m.position.y += Math.sin(q * Math.PI) * 1.6;
        f.m.rotation.set(Math.sin(q * Math.PI) * 0.5, f.ry0 + f.spin * q * Math.PI * 2 - 0.18 * q, 0);
        if (q >= 1) { scene.remove(f.m); flying.splice(k, 1); addToTray(); hiss(0.05, 0.12, [['bandpass', 2600, 1, 1]]); }
      }
      // 散らばる紙
      for (const d of debris) {
        if (d.rest) continue;
        d.pp.copy(d.p);
        d.v.y -= 14 * dt;
        d.v.multiplyScalar(1 - dt * 0.6);
        d.p.addScaledVector(d.v, dt);
        d.m.rotation.x += d.w.x * dt; d.m.rotation.y += d.w.y * dt; d.m.rotation.z += d.w.z * dt;
        const onDesk = d.p.x > DESK.x0 && d.p.x < DESK.x1 && d.p.z > DESK.z0 && d.p.z < DESK.z1;
        const ground = onDesk ? 0.05 + Math.random() * 0.02 : -3.35;
        if (d.p.y < ground && (onDesk ? d.pp.y >= ground - 0.3 : true)) {
          d.p.y = ground;
          if (Math.abs(d.v.y) > 2.5) { d.v.y *= -0.25; d.v.x *= 0.5; d.v.z *= 0.5; d.w.multiplyScalar(0.4); }
          else { d.rest = true; d.m.rotation.x = 0; d.m.rotation.z = 0; d.pp.copy(d.p); }
        }
      }
      for (const a of arms) a.t += dt;
      stepFx(dt);
      if (state === 'over') {
        overT += dt;
        // ほかの山もつられて崩れる
        for (let i = 0; i < 3; i++) if (i !== collapsed && PILES[i].sheets.length && overT > 0.25 + Math.abs(i - collapsed) * 0.18) topple(i, 0.8);
        for (const a of arms) a.lift = Math.min(1.4, overT * 6);
        if (overT > 1.7) finish();
      }
    }

    // ---------- 画面 ----------
    const resultEl = document.getElementById('result');
    function renderControls() {
      controls.innerHTML = '';
      controls.classList.toggle('hide', state !== 'result');
      if (state !== 'result') return;
      const b = document.createElement('button');
      b.className = 'go'; b.textContent = t('again');
      b.addEventListener('click', start);
      controls.append(b);
      const a = document.createElement('a');
      a.className = 'post'; a.textContent = t('post');
      a.href = `https://x.com/intent/post?text=${encodeURIComponent(t('share')(score))}&url=${encodeURIComponent(SHARE_URL)}`;
      const coarse = matchMedia('(pointer: coarse)').matches;
      if (!coarse) { a.target = '_blank'; a.rel = 'noopener'; }
      // スマホは画像ごと共有シートへ。PCは画像を保存してから投稿画面を開く
      a.addEventListener('click', e => {
        const text = t('share')(score);
        if (coarse && navigator.share) {
          e.preventDefault();
          const file = shareFile();
          const data = file && navigator.canShare?.({ files: [file] }) ? { files: [file], text: `${text}\n${SHARE_URL}` } : { text: `${text}\n${SHARE_URL}` };
          navigator.share(data).catch(() => {});
          return;
        }
        const img = resultImage();
        if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'neko-no-te.png'; d.click(); }
      });
      controls.append(a);
    }
    // 結果画像: 散らばった机とびっくりした猫に枚数を重ねる
    let snap = null, shareCache = null;
    function takeSnap() {
      const src = renderer.domElement;
      const focus = new THREE.Vector3(PILES[Math.max(0, collapsed)].x * 0.4, 1.6, -0.6).project(camera);
      const fx = (focus.x + 1) / 2 * src.width, fy = (1 - focus.y) / 2 * src.height;
      const side = Math.min(src.width, src.height);
      const sx = THREE.MathUtils.clamp(fx - side / 2, 0, src.width - side), sy = THREE.MathUtils.clamp(fy - side / 2, 0, src.height - side);
      snap = document.createElement('canvas'); snap.width = snap.height = 1080;
      snap.getContext('2d').drawImage(src, sx, sy, side, side, 0, 0, 1080, 1080);
      shareCache = null;
    }
    function resultImage() {
      if (!snap) return null;
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const g = c.getContext('2d');
      g.drawImage(snap, 0, 0);
      g.textAlign = 'center'; g.fillStyle = '#fff'; g.lineJoin = 'round';
      const font = px => `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans Thai", sans-serif`;
      const text = (str, y, px, max) => {
        g.font = font(px);
        const w = g.measureText(str).width; if (w > max) { px *= max / w; g.font = font(px); }
        g.lineWidth = px * .16; g.strokeStyle = '#7a3a1a'; g.strokeText(str, 540, y); g.fillText(str, 540, y);
      };
      text(t('count')(score), 960, 170, 960);
      text(t('title'), 90, 56, 900);
      return c;
    }
    function prepareShare() {
      if (!snap) return;
      const key = lang;
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'neko-no-te.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;
    function start() {
      reset();
      state = 'play';
      resultEl.style.display = 'none';
      renderControls(); resize();
    }
    function showResult() { resultEl.children[0].textContent = t('count')(score); }
    function finish() {
      state = 'result';
      showResult();
      resultEl.style.display = 'flex';
      snap = null; needSnap = true;
      renderControls(); resize();
    }

    // ---------- ループ ----------
    let last = performance.now(), acc = 0, shownSpeed = 0;
    function render(alpha) {
      const time = clock + alpha * STEP;
      for (const p of PILES) {
        placePile(p, time);
        // 危ない山は紙が赤く、上限の輪が点滅する
        const d = p.danger;
        p.edge.color.setRGB(0.93, 0.9 - d * 0.35, 0.84 - d * 0.4);
        p.top.color.setRGB(1, 1 - d * 0.3, 1 - d * 0.35);
        p.ring.material.opacity = d * (0.55 + 0.45 * Math.sin(time * 14));
        p.ring.visible = d > 0.01 && state === 'play';
      }
      for (const f of falling) { const p = PILES[f.pi]; f.g.position.set(p.x + (f.g.userData.sx || 0), f.py + (f.y - f.py) * alpha, p.z); }
      for (const d of debris) d.m.position.lerpVectors(d.pp, d.p, d.rest ? 1 : alpha);
      // 猫: 崩れると飛び上がって震える
      const jump = state === 'over' || state === 'result' ? Math.min(1, overT * 5) : 0;
      const shake = state === 'over' ? Math.sin(time * 60) * 0.015 * Math.max(0, 1 - overT) : 0;
      const liftPx = catBase.S * (0.16 * jump + 0.012 * Math.sin(time * 1.6));
      cat.position.copy(catBase.pos).addScaledVector(catBase.up, liftPx * catBase.perPx);
      body.position.copy(bodyBase.pos).addScaledVector(catBase.up, liftPx * bodyBase.perPx);
      // しっぽ: 胴の横から立ち上がり、先が内側に丸まって揺れる
      const wag = state === 'over' ? 9 : 2.2, puff = state === 'over' || state === 'result' ? 1.35 : 1;
      tail.forEach((m, i) => { const u = i / (tail.length - 1); m.position.set(0.5 + 0.12 * u + Math.sin(time * wag - u * 2.5) * 0.09 * u - Math.max(0, u - 0.7) * 0.5, -0.85 + 1.1 * u, -0.2); const r = (0.048 - u * 0.016) * puff; m.scale.set(r, r, r * 0.8); });
      body.updateMatrixWorld(true);
      arms.forEach((a, i) => a.shoulder.copy(SHOULDER[i]).applyMatrix4(body.matrixWorld));
      for (const a of arms) placeArm(a, time);
      cat.scale.setScalar(catBase.scale * (1 + 0.12 * jump));
      cat.rotation.z = shake;
      // 置き時計: 忙しくなるほど針が速く回る
      const speed = state === 'play' && armed ? 1 + elapsed * 0.25 : 0.3;
      shownSpeed += (speed - shownSpeed) * 0.05;
      clockMin.rotation.z -= shownSpeed * 0.05; clockHand.rotation.z -= shownSpeed * 0.05 / 12;
      renderer.render(scene, camera);
      if (needSnap) { needSnap = false; takeSnap(); prepareShare(); }
    }
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      acc += dt;
      while (acc >= STEP) { step(STEP); acc -= STEP; }
      render(acc / STEP);
      requestAnimationFrame(loop);
    }

    resize();
    start();
    applyLang();
    // 最初の1回が重くならないように、使う形と質感を一度描いておく
    {
      spawnFall(1, true); const tmp = falling.pop(); tmp.g.position.set(0, 1, 0);
      const fm = new THREE.Mesh(PAPER_G, STAMP_MATS); fm.position.set(1, 1, 1); scene.add(fm);
      printPop(new THREE.Vector3(0, 1, 0)); burst(new THREE.Vector3(0, 1, 0), 1, '#fff', 0, 0.1, 0.1, 0);
      renderer.compile(scene, camera); render(0);
      scene.remove(tmp.g); scene.remove(fm);
      for (const f of fx) scene.remove(f.m); fx.length = 0;
    }
    requestAnimationFrame(t0 => { last = t0; loop(t0); });
  </script>
</body>
</html>
