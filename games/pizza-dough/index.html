  const tex = canvasTex(spr), baked = canvasTex(makeBaked(spr)), under = canvasTex(makeUnder(spr));

  patchBake(topM, baked);

  const bot = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: under, alphaTest: 0.5, side: THREE.DoubleSide, roughness: 0.9 }));
  bot.scale.y = -0.35;
  group.add(top, bot);
  D = { geo, top, bot, bx, bz, puff, rim, op, cw, ch, cellA, w, h, texs: [tex, baked, under], area0: 0, dirty: true };

function area() {

    s += cellA[k + 1] * 0.5 * Math.abs((bx[d] - bx[a]) * (bz[c] - bz[b]) - (bz[d] - bz[a]) * (bx[c] - bx[b]));

let thin = 1;

  const { bx, bz, puff, rim, geo } = D, pos = geo.attributes.position.array;
  thin = Math.max(0.1, Math.min(1, D.area0 / area()));
  const T = 0.2 * thin, R = 0.16 * bakeU.value * Math.max(0.5, Math.sqrt(1 / thin));
  for (let v = 0; v < bx.length; v++) {

}
function doughExtent() {
  // center and radius of the opaque part (local)
  const { bx, bz, op } = D; let cx = 0, cz = 0, n = 0;
  for (let v = 0; v < bx.length; v++) if (op[v]) { cx += bx[v]; cz += bz[v]; n++; }
  if (!n) return { cx: 0, cz: 0, r: 1 };

// ---------- camera fit ----------
let W = 1, H = 1, camDist = 7, camDistT = 7, ext = { cx: 0, cz: 0, r: 1.3 };
function fitTarget() {
  const r = Math.max(1.6, ext.r + Math.hypot(ext.cx, ext.cz));
  const tanH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  camDistT = r * 1.05 / (tanH * Math.min(1, camera.aspect)) + 0.3;
}
function resize() {
  const r = $('stage').getBoundingClientRect();
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  renderer.setSize(W, H, false);
  camera.aspect = W / H; camera.updateProjectionMatrix();
  fitTarget(); if (mode !== 'paint') camDist = camDistT;
  resizePaint();
}

// ---------- play: stretch ----------
let land = 0, drag = null;
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit = new THREE.Vector3();
function boardPoint(e) {
  const r = gl.getBoundingClientRect();
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  if (!ray.ray.intersectPlane(plane, hit)) return null;
  return group.worldToLocal(hit.clone());
}
function smudge(p, q, gain) {
  const { bx, bz } = D, dx = q.x - p.x, dz = q.z - p.z;
  const R = 0.3 * Math.sqrt(1 / thin), R2 = R * R;
  for (let v = 0; v < bx.length; v++) {
    const d2 = (bx[v] - p.x) ** 2 + (bz[v] - p.z) ** 2;
    if (d2 > R2 * 9) continue;
    const k = Math.exp(-d2 / R2) * gain;
    bx[v] += dx * k; bz[v] += dz * k;
  }
  D.dirty = true;
}
gl.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (mode === 'start') { $('file').click(); return; }
  if (mode !== 'play' || drag) return;
  ac();
  gl.setPointerCapture(e.pointerId);
  const p = boardPoint(e);
  drag = { id: e.pointerId, p, moved: 0 };
  if (p) sndPeta(0.5);
});
gl.addEventListener('pointermove', e => {
  if (!drag || drag.id !== e.pointerId) return;
  const q = boardPoint(e);
  if (q && drag.p) { smudge(drag.p, q, 0.35 / (1 + drag.moved * 1.2)); drag.moved += Math.hypot(q.x - drag.p.x, q.z - drag.p.z); }
  drag.p = q;
});
const pUp = e => {
  if (!drag || drag.id !== e.pointerId) return;
  drag = null;
};
gl.addEventListener('pointerup', pUp);
gl.addEventListener('pointercancel', pUp);

// ---------- loop ----------
let mode = 'start', last = performance.now(), bakeT = -1;
const camTarget = new THREE.Vector3();
function frame(now) {
  const dt = Math.min(0.04, (now - last) / 1000); last = now;
  if (D) {
    if (mode === 'result') group.rotation.y += 0.25 * dt;
    if (land > 0) { land = Math.max(0, land - dt * 3); group.scale.y = 1 - 0.5 * Math.sin(land * Math.PI) * land; }
    if (bakeT >= 0) {
      bakeT += dt;
      const u = Math.min(1, bakeT / 2.6);
      bakeU.value = u * u * (3 - 2 * u); D.dirty = true;
      const glow = Math.sin(Math.min(1, bakeT / 3.2) * Math.PI);
      ovenLight.intensity = glow * 22; scene.background.copy(BG).lerp(BG_HOT, glow * 0.5);
      if (bakeT >= 3.2) { bakeT = -1; ovenLight.intensity = 0; scene.background.copy(BG); setMode('result'); }
    }
    if (D.dirty) { updateGeom(); if (!drag) { ext = doughExtent(); fitTarget(); } }
    const sc = (ext.r + 0.3) * 2.3 * (1 - Math.min(0.6, group.position.y / 5));
    const cs = Math.cos(group.rotation.y), sn = Math.sin(group.rotation.y);
    shadow.position.x = group.position.x + ext.cx * cs + ext.cz * sn; shadow.position.z = group.position.z - ext.cx * sn + ext.cz * cs;
    shadow.scale.set(sc, sc, 1); shadow.material.opacity = 0.7 - Math.min(0.5, group.position.y / 4);
  }
  if (!drag) camDist += (camDistT - camDist) * Math.min(1, dt * 2.5);
  camera.position.copy(CAM_DIR).multiplyScalar(camDist).add(camTarget);
  camera.lookAt(camTarget);
  if (mode !== 'paint') renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// ---------- cut-out: a wobbly circle over the picture ----------
const cv = $('cv'), ctx = cv.getContext('2d');
let DPR = 1, img = null, view = null, wob = null;
const DOUGH = '#ecd2a8';
function resizePaint() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  if (img) placeImage();
  renderPaint();
}
function newWobble() {
  const r = () => Math.random() * Math.PI * 2;
  wob = [[3, 0.05 + Math.random() * 0.03, r()], [5, 0.03 + Math.random() * 0.02, r()], [8, 0.015 + Math.random() * 0.012, r()], [2, 0.03, r()]];
}
const circR = () => Math.min(W, H) * 0.38;
function wobblePath(g, cx, cy, R, keep) {
  if (!keep) g.beginPath();
  for (let i = 0; i <= 120; i++) {
    const a = i / 120 * Math.PI * 2;
    let k = 1; for (const [n, amp, ph] of wob) k += amp * Math.sin(n * a + ph);
    const x = cx + Math.cos(a) * R * k, y = cy + Math.sin(a) * R * k;
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.closePath();
}
function loadFile(f) {
  if (!f || !f.type.startsWith('image/')) return;
  const url = URL.createObjectURL(f), im = new Image();
  im.onload = () => {
    URL.revokeObjectURL(url);
    const k = Math.min(1, 1600 / Math.max(im.width, im.height));
    img = mkCanvas(Math.max(1, Math.round(im.width * k)), Math.max(1, Math.round(im.height * k)));
    img.getContext('2d').drawImage(im, 0, 0, img.width, img.height);
    touches.clear(); pinch = null; newWobble();
    placeImage(); setMode('paint');
  };
  im.onerror = () => { URL.revokeObjectURL(url); flashErr(); };
  im.src = url;
}
function flashErr() {
  const d = document.createElement('div'); d.id = 'err'; d.textContent = t('err');
  $('stage').appendChild(d); setTimeout(() => d.remove(), 2000);
}
function placeImage() {
  // fill the circle with the picture
  const k = circR() * 2.3 / Math.min(img.width, img.height);
  view = { k, min: k * 0.3, x: (W - img.width * k) / 2, y: (H - img.height * k) / 2 };
}
let pinch = null, panPt = null;
const touches = new Map();
const mid = (a, b) => { const r = cv.getBoundingClientRect(); return { x: (a.x + b.x) / 2 - r.left, y: (a.y + b.y) / 2 - r.top }; };
function zoomAt(mx, my, k) {
  k = Math.max(view.min, Math.min(view.min * 40, k));
  view.x = mx - (mx - view.x) / view.k * k; view.y = my - (my - view.y) / view.k * k; view.k = k;
}
function makeSprite() {
  const R = circR(), S = 512, f = (S / 2) / (R * 1.3);
  const c = mkCanvas(S, S), g = c.getContext('2d');
  g.translate(S / 2, S / 2); g.scale(f, f); g.translate(-W / 2, -H / 2);
  wobblePath(g, W / 2, H / 2, R); g.clip();

}
function renderPaint() {

  if (mode !== 'paint' || !img) return;
  const R = circR();
  ctx.fillStyle = DOUGH; wobblePath(ctx, W / 2, H / 2, R); ctx.fill();

cv.addEventListener('pointerdown', e => {
  e.preventDefault(); cv.setPointerCapture(e.pointerId);
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (touches.size === 1) panPt = { x: e.clientX, y: e.clientY };
  else if (touches.size === 2) {
    const [a, b] = [...touches.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, m: mid(a, b) }; panPt = null;
  }
});
cv.addEventListener('pointermove', e => {
  if (!touches.has(e.pointerId)) return;
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && touches.size >= 2) {
    const [a, b] = [...touches.values()], m = mid(a, b), d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    view.x += m.x - pinch.m.x; view.y += m.y - pinch.m.y;
    zoomAt(m.x, m.y, view.k * d / pinch.d);
    pinch = { d, m }; renderPaint();
  } else if (panPt) {
    view.x += e.clientX - panPt.x; view.y += e.clientY - panPt.y;
    panPt = { x: e.clientX, y: e.clientY }; renderPaint();
  }
});
const cUp = e => {
  touches.delete(e.pointerId);
  if (touches.size < 2) pinch = null;
  if (touches.size === 1) { const p = [...touches.values()][0]; panPt = { x: p.x, y: p.y }; } else panPt = null;
};
cv.addEventListener('pointerup', cUp);
cv.addEventListener('pointercancel', cUp);
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, view.k * Math.exp(-e.deltaY * 0.0015));
  renderPaint();
}, { passive: false });
$('shape').onclick = () => { newWobble(); renderPaint(); };

// ---------- buttons ----------
$('pick').onclick = () => $('file').click();
$('again').onclick = () => $('file').click();
$('file').onchange = e => { loadFile(e.target.files[0]); e.target.value = ''; };
$('done').onclick = () => {
  const s = makeSprite(); if (!s) return;
  buildDough(s); ext = doughExtent(); fitTarget(); camDist = camDistT;
  setMode('play'); sndPeta(1); land = 1;
};
$('bake').onclick = () => {
  setMode('baking'); bakeT = 0; sndJuu(3.2);
};
['dragenter', 'dragover'].forEach(ev => window.addEventListener(ev, e => { e.preventDefault(); $('drop').classList.remove('hide'); }));
['dragleave', 'drop'].forEach(ev => window.addEventListener(ev, e => { e.preventDefault(); $('drop').classList.add('hide'); }));

// ---------- export / share ----------
function exportBlob() {
  return new Promise(res => {
    renderer.render(scene, camera);
    const S = 1080, c = mkCanvas(S, S), g = c.getContext('2d');
    g.fillStyle = '#f4e6d4'; g.fillRect(0, 0, S, S);
    const s = Math.min(gl.width, gl.height);
    g.drawImage(gl, (gl.width - s) / 2, (gl.height - s) / 2, s, s, 0, 0, S, S);
    g.fillStyle = 'rgba(255,255,255,.75)'; g.fillRect(S - 470, S - 74, 470, 74);
    g.fillStyle = '#a0522d'; g.font = 'bold 34px sans-serif'; g.textAlign = 'right';
    g.fillText('keifurukawafunnych.com', S - 30, S - 26);
    c.toBlob(res, 'image/png');
  });
}
function download(blob) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'pizza-dough.png';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
let resultBlob = null;
const shareText = () => `${t('share')}\n${TAG}`;
$('save').onclick = async () => {
  const blob = resultBlob || await exportBlob();
  const file = new File([blob], 'pizza-dough.png', { type: 'image/png' });
  if (coarse && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; } catch (err) { if (err.name === 'AbortError') return; }
  }
  download(blob);
};
$('post').onclick = e => {
  if (coarse && navigator.share) {
    e.preventDefault();
    const data = { text: `${shareText()}\n${SHARE_URL}` };
    if (resultBlob) {
      const file = new File([resultBlob], 'pizza-dough.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) data.files = [file];
    }
    navigator.share(data).catch(() => {});
    return;
  }
  if (resultBlob) download(resultBlob);
};
function updatePost() {
  const a = $('post');
  a.href = `https://x.com/intent/post?text=${encodeURIComponent(shareText())}&url=${encodeURIComponent(SHARE_URL)}`;
  if (!coarse) { a.target = '_blank'; a.rel = 'noopener'; }
}

// ---------- modes / text ----------
function setMode(m) {
  mode = m;
  $('barStart').classList.toggle('hide', m !== 'start');
  $('barPaint').classList.toggle('hide', m !== 'paint');
  $('barPlay').classList.toggle('hide', m !== 'play');
  $('barResult').classList.toggle('hide', m !== 'result');
  gl.classList.toggle('hide', m === 'paint');
  cv.classList.toggle('hide', m !== 'paint');
    if (m === 'result') { resultBlob = null; setTimeout(() => exportBlob().then(b => { if (mode === 'result') resultBlob = b; }), 50); }
  renderPaint();
}
function applyLang() {
  document.documentElement.lang = lang;
  document.title = t('title');
  $('back').textContent = t('back');
  $('lang').value = lang;
  for (const k of ['pick', 'done', 'bake', 'save', 'post', 'again']) $(k).textContent = t(k);
  updatePost();
}
$('lang').onchange = () => { lang = $('lang').value; store.set('lang', lang); applyLang(); };
$('snd').onclick = () => { soundOn = !soundOn; store.set('sound', soundOn); drawSnd(); };

// start screen: a plain round dough on the board
{
  const c = mkCanvas(256, 256), g = c.getContext('2d');
  g.fillStyle = '#f1dcb6'; g.beginPath(); g.arc(128, 128, 104, 0, Math.PI * 2); g.fill();
  g.globalCompositeOperation = 'source-atop';
  for (let i = 0; i < 300; i++) { g.fillStyle = `rgba(255,255,250,${Math.random() * 0.4})`; g.fillRect(Math.random() * 256, Math.random() * 256, 2, 2); }
  buildDough(c); ext = doughExtent();
}
drawSnd(); applyLang(); setMode('start');
new ResizeObserver(resize).observe($('stage'));
