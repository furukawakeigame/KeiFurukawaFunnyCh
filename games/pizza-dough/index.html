let W = 1, H = 1, camDist = 7, camDistT = 7, ext = { cx: 0, cz: 0, r: 1.3 };
function fitTarget() {
  const r = Math.max(1.6, ext.r + Math.hypot(ext.cx, ext.cz));
  const tanH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  camDistT = r * 1.05 / (tanH * Math.min(1, camera.aspect)) + 0.3;
}
function resize() {
  const r = $('stage').getBoundingClientRect();
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  renderer.setSize(W, H, false);
  camera.aspect = W / H; camera.updateProjectionMatrix();
  fitTarget(); if (mode !== 'paint') camDist = camDistT;
  resizePaint();
}

// ---------- play: stretch & toss ----------
let toss = null, spinV = 0, land = 0, drag = null;
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit = new THREE.Vector3();
function boardPoint(e) {
  const r = gl.getBoundingClientRect();
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  if (!ray.ray.intersectPlane(plane, hit)) return null;
  return group.worldToLocal(hit.clone());
}
function smudge(p, q) {
  const { bx, bz } = D, dx = q.x - p.x, dz = q.z - p.z;
  const R = 0.3 * Math.sqrt(1 / thin), R2 = R * R;
  for (let v = 0; v < bx.length; v++) {
    const d2 = (bx[v] - p.x) ** 2 + (bz[v] - p.z) ** 2;
    if (d2 > R2 * 9) continue;
    const k = Math.exp(-d2 / R2);
    bx[v] += dx * k; bz[v] += dz * k;
  }
  D.dirty = true;
}
function startToss(vx) {
  const e = doughExtent();
  toss = { t: 0, T: 1.05, cx: e.cx, cz: e.cz };
  spinV = (vx > 0 ? -1 : 1) * (7 + Math.min(8, Math.abs(vx) / 250));
  sndHyun();
}
gl.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (mode === 'start') { $('file').click(); return; }
  if (mode !== 'play' || toss || drag) return;
  ac();
  gl.setPointerCapture(e.pointerId);
  const p = boardPoint(e);
  drag = { id: e.pointerId, p, hist: [{ x: e.clientX, y: e.clientY, t: performance.now() }], moved: 0 };
  if (p) sndPeta(0.5);
});
gl.addEventListener('pointermove', e => {
  if (!drag || drag.id !== e.pointerId || toss) return;
  const now = performance.now();
  drag.hist.push({ x: e.clientX, y: e.clientY, t: now });
  while (drag.hist.length > 2 && now - drag.hist[0].t > 90) drag.hist.shift();
  const q = boardPoint(e);
  if (q && drag.p) { smudge(drag.p, q); drag.moved += Math.hypot(q.x - drag.p.x, q.z - drag.p.z); }
  drag.p = q;
});
const pUp = e => {
  if (!drag || drag.id !== e.pointerId) return;
  const h = drag.hist, a = h[0], b = h[h.length - 1], dt = Math.max(16, b.t - a.t) / 1000;
  const vx = (b.x - a.x) / dt, vy = (b.y - a.y) / dt;
  drag = null;
  if (mode === 'play' && !toss && vy < -700 && -vy > Math.abs(vx) * 0.6 && performance.now() - b.t < 120) startToss(vx);
};
gl.addEventListener('pointerup', pUp);
gl.addEventListener('pointercancel', pUp);

// ---------- loop ----------
let mode = 'start', last = performance.now(), bakeT = -1;
const camTarget = new THREE.Vector3();
function frame(now) {
  const dt = Math.min(0.04, (now - last) / 1000); last = now;
  if (D) {
    if (toss) {
      toss.t += dt;
      const u = Math.min(1, toss.t / toss.T), k = Math.exp(Math.log(1.32) / toss.T * dt);
      const { bx, bz } = D;
      for (let v = 0; v < bx.length; v++) { bx[v] = toss.cx + (bx[v] - toss.cx) * k; bz[v] = toss.cz + (bz[v] - toss.cz) * k; }
      D.dirty = true;
      group.position.y = 1.7 * 4 * u * (1 - u) * Math.max(1, Math.sqrt(1 / thin) * 0.8);
      group.rotation.x = 0.12 * Math.sin(Math.PI * u * 2);
      if (u >= 1) { toss = null; group.position.y = 0; group.rotation.x = 0; land = 1; sndPeta(1); }
    }
    group.rotation.y += spinV * dt;
    spinV *= toss ? 1 : Math.pow(0.12, dt);
    if (mode === 'result') group.rotation.y += 0.25 * dt;
    if (land > 0) { land = Math.max(0, land - dt * 3); group.scale.y = 1 - 0.5 * Math.sin(land * Math.PI) * land; }
    if (bakeT >= 0) {
      bakeT += dt;
      const u = Math.min(1, bakeT / 2.6);
      bakeU.value = u * u * (3 - 2 * u); D.dirty = true;
      const glow = Math.sin(Math.min(1, bakeT / 3.2) * Math.PI);
      ovenLight.intensity = glow * 22; scene.background.copy(BG).lerp(BG_HOT, glow * 0.5);
      if (bakeT >= 3.2) { bakeT = -1; ovenLight.intensity = 0; scene.background.copy(BG); setMode('result'); }
    }
    if (D.dirty) { updateGeom(); if (!drag) { ext = doughExtent(); fitTarget(); } }
    const sc = (ext.r + 0.3) * 2.3 * (1 - Math.min(0.6, group.position.y / 5));
    const cs = Math.cos(group.rotation.y), sn = Math.sin(group.rotation.y);
    shadow.position.x = group.position.x + ext.cx * cs + ext.cz * sn; shadow.position.z = group.position.z - ext.cx * sn + ext.cz * cs;
    shadow.scale.set(sc, sc, 1); shadow.material.opacity = 0.7 - Math.min(0.5, group.position.y / 4);
  }
  if (!drag) camDist += (camDistT - camDist) * Math.min(1, dt * 2.5);
  camera.position.copy(CAM_DIR).multiplyScalar(camDist).add(camTarget);
  camera.lookAt(camTarget);
  if (mode !== 'paint') renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// ---------- cut-out (same as Tapioca Maker) ----------
const cv = $('cv'), ctx = cv.getContext('2d');
let DPR = 1, img = null, mask = null, mctx = null, view = null, brushIdx = 1, erasing = false, undoStack = [];
function resizePaint() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  if (img) placeImage();
  renderPaint();
}
function loadFile(f) {
  if (!f || !f.type.startsWith('image/')) return;
  const url = URL.createObjectURL(f), im = new Image();
  im.onload = () => {
    URL.revokeObjectURL(url);
    const k = Math.min(1, 1600 / Math.max(im.width, im.height));
    img = mkCanvas(Math.max(1, Math.round(im.width * k)), Math.max(1, Math.round(im.height * k)));
    img.getContext('2d').drawImage(im, 0, 0, img.width, img.height);
    mask = mkCanvas(img.width, img.height); mctx = mask.getContext('2d');
    undoStack = []; erasing = false; touches.clear(); pinch = null;
    placeImage(); setMode('paint');
  };
  im.onerror = () => { URL.revokeObjectURL(url); flashErr(); };
  im.src = url;
}
function flashErr() {
  const d = document.createElement('div'); d.id = 'err'; d.textContent = t('err');
  $('stage').appendChild(d); setTimeout(() => d.remove(), 2000);
}
function snapFit() { if (view.k <= view.fit * 1.001) { view.x = (W - img.width * view.k) / 2; view.y = (H - img.height * view.k) / 2; } }
function placeImage() {
  const pad = 12, k = Math.min((W - pad * 2) / img.width, (H - pad * 2) / img.height);
  view = { k, fit: k, x: (W - img.width * k) / 2, y: (H - img.height * k) / 2 };
}
let lastPt = null, pinch = null;
const touches = new Map();
const mid = (a, b) => { const r = cv.getBoundingClientRect(); return { x: (a.x + b.x) / 2 - r.left, y: (a.y + b.y) / 2 - r.top }; };
function toImg(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left - view.x) / view.k, y: (e.clientY - r.top - view.y) / view.k }; }
const BRUSH = [8, 22, 50];
const brushPx = () => BRUSH[brushIdx] / view.k;
function stroke(a, b) {
  mctx.save();
  mctx.globalCompositeOperation = erasing ? 'destination-out' : 'source-over';
  mctx.strokeStyle = '#000'; mctx.fillStyle = '#000';
  mctx.lineCap = 'round'; mctx.lineJoin = 'round'; mctx.lineWidth = brushPx();
  mctx.beginPath(); mctx.moveTo(a.x, a.y); mctx.lineTo(b.x, b.y); mctx.stroke();
  mctx.beginPath(); mctx.arc(b.x, b.y, brushPx() / 2, 0, Math.PI * 2); mctx.fill();
  mctx.restore();
}
function maskBox() {
  const d = mctx.getImageData(0, 0, mask.width, mask.height).data;
  let x0 = mask.width, y0 = mask.height, x1 = -1, y1 = -1;
  for (let y = 0; y < mask.height; y++) for (let x = 0; x < mask.width; x++) {
    if (d[(y * mask.width + x) * 4 + 3] > 20) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  return x1 < 0 ? null : { x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1 };
}
const updateDone = () => { $('done').disabled = !maskBox(); };
function makeSprite() {
  const b = maskBox(); if (!b) return null;
  const m = Math.round(Math.max(b.w, b.h) * 0.06);   // margin so the soft edge is not clipped
  const bw = b.w + m * 2, bh = b.h + m * 2, k = Math.min(1, 512 / Math.max(bw, bh));
  const c = mkCanvas(Math.max(2, Math.round(bw * k)), Math.max(2, Math.round(bh * k))), g = c.getContext('2d');
  g.drawImage(img, b.x - m, b.y - m, bw, bh, 0, 0, c.width, c.height);
  g.globalCompositeOperation = 'destination-in';
  g.drawImage(mask, b.x - m, b.y - m, bw, bh, 0, 0, c.width, c.height);
  return c;
}
let tmpC = null;
function renderPaint() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H);
  if (mode !== 'paint' || !img) return;
  const { k, x, y } = view;
  ctx.fillStyle = '#3b2a20'; ctx.fillRect(x, y, img.width * k, img.height * k);
  ctx.globalAlpha = 0.35; ctx.drawImage(img, x, y, img.width * k, img.height * k); ctx.globalAlpha = 1;
  if (!tmpC || tmpC.width !== img.width || tmpC.height !== img.height) tmpC = mkCanvas(img.width, img.height);
  const g = tmpC.getContext('2d');
  g.globalCompositeOperation = 'source-over'; g.clearRect(0, 0, tmpC.width, tmpC.height); g.drawImage(mask, 0, 0);
  g.globalCompositeOperation = 'source-in'; g.drawImage(img, 0, 0);
  g.globalCompositeOperation = 'source-atop'; g.fillStyle = 'rgba(60, 220, 110, 0.45)'; g.fillRect(0, 0, tmpC.width, tmpC.height);
  ctx.drawImage(tmpC, x, y, img.width * k, img.height * k);
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); cv.setPointerCapture(e.pointerId);
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (touches.size === 1 && !pinch) {
    undoStack.push(mctx.getImageData(0, 0, mask.width, mask.height));
    if (undoStack.length > 20) undoStack.shift();
    lastPt = toImg(e); stroke(lastPt, lastPt); renderPaint();
  } else if (touches.size === 2) {
    if (lastPt) { const d = undoStack.pop(); if (d) mctx.putImageData(d, 0, 0); lastPt = null; }
    const [a, b] = [...touches.values()];
    pinch = { d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, m0: mid(a, b), k0: view.k, x0: view.x, y0: view.y };
    renderPaint();
  }
});
cv.addEventListener('pointermove', e => {
  if (!touches.has(e.pointerId)) return;
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && touches.size >= 2) {
    const [a, b] = [...touches.values()], m = mid(a, b);
    const k = Math.max(view.fit, Math.min(view.fit * 12, pinch.k0 * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d0));
    view.x = m.x - (pinch.m0.x - pinch.x0) / pinch.k0 * k;
    view.y = m.y - (pinch.m0.y - pinch.y0) / pinch.k0 * k;
    view.k = k; snapFit(); renderPaint();
  } else if (lastPt) { const p = toImg(e); stroke(lastPt, p); lastPt = p; renderPaint(); }
});
const cUp = e => {
  touches.delete(e.pointerId);
  if (touches.size === 0) pinch = null;
  if (lastPt) { lastPt = null; updateDone(); }
};
cv.addEventListener('pointerup', cUp);
cv.addEventListener('pointercancel', cUp);
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const k = Math.max(view.fit, Math.min(view.fit * 12, view.k * Math.exp(-e.deltaY * 0.0015)));
  view.x = mx - (mx - view.x) / view.k * k; view.y = my - (my - view.y) / view.k * k; view.k = k; snapFit();
  renderPaint();
}, { passive: false });
$('brush').onclick = () => {
  brushIdx = (brushIdx + 1) % BRUSH.length;
  const d = $('brush').firstChild; d.style.width = d.style.height = [5, 11, 20][brushIdx] + 'px';
};
$('erase').onclick = () => { erasing = !erasing; $('erase').classList.toggle('on', erasing); };
$('undo').onclick = () => { const d = undoStack.pop(); if (d) { mctx.putImageData(d, 0, 0); renderPaint(); updateDone(); } };

// ---------- buttons ----------
$('pick').onclick = () => $('file').click();
$('again').onclick = () => $('file').click();
$('file').onchange = e => { loadFile(e.target.files[0]); e.target.value = ''; };
$('done').onclick = () => {
  const s = makeSprite(); if (!s) return;
  buildDough(s); ext = doughExtent(); fitTarget(); camDist = camDistT;
  setMode('play'); sndPeta(1); land = 1;
};
$('bake').onclick = () => {
  if (toss) return;
  setMode('baking'); bakeT = 0; sndJuu(3.2);
};
['dragenter', 'dragover'].forEach(ev => window.addEventListener(ev, e => { e.preventDefault(); $('drop').classList.remove('hide'); }));
['dragleave', 'drop'].forEach(ev => window.addEventListener(ev, e => { e.preventDefault(); $('drop').classList.add('hide'); }));
window.addEventListener('drop', e => { const f = e.dataTransfer && e.dataTransfer.files[0]; if (f) loadFile(f); });

// ---------- export / share ----------
function exportBlob() {
  return new Promise(res => {
    renderer.render(scene, camera);
    const S = 1080, c = mkCanvas(S, S), g = c.getContext('2d');
    g.fillStyle = '#f4e6d4'; g.fillRect(0, 0, S, S);
    const s = Math.min(gl.width, gl.height);
    g.drawImage(gl, (gl.width - s) / 2, (gl.height - s) / 2, s, s, 0, 0, S, S);
    g.fillStyle = 'rgba(255,255,255,.75)'; g.fillRect(S - 470, S - 74, 470, 74);
    g.fillStyle = '#a0522d'; g.font = 'bold 34px sans-serif'; g.textAlign = 'right';
    g.fillText('keifurukawafunnych.com', S - 30, S - 26);
    c.toBlob(res, 'image/png');
  });
}
function download(blob) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'pizza-dough.png';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
let resultBlob = null;
const shareText = () => `${t('share')}\n${TAG}`;
$('save').onclick = async () => {
  const blob = resultBlob || await exportBlob();
  const file = new File([blob], 'pizza-dough.png', { type: 'image/png' });
  if (coarse && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; } catch (err) { if (err.name === 'AbortError') return; }
  }
  download(blob);
};
$('post').onclick = e => {
  if (coarse && navigator.share) {
    e.preventDefault();
    const data = { text: `${shareText()}\n${SHARE_URL}` };
    if (resultBlob) {
      const file = new File([resultBlob], 'pizza-dough.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) data.files = [file];
    }
    navigator.share(data).catch(() => {});
    return;
  }
  if (resultBlob) download(resultBlob);
};
function updatePost() {
  const a = $('post');
  a.href = `https://x.com/intent/post?text=${encodeURIComponent(shareText())}&url=${encodeURIComponent(SHARE_URL)}`;
  if (!coarse) { a.target = '_blank'; a.rel = 'noopener'; }
}

// ---------- modes / text ----------
function setMode(m) {
  mode = m;
  $('barStart').classList.toggle('hide', m !== 'start');
  $('barPaint').classList.toggle('hide', m !== 'paint');
  $('barPlay').classList.toggle('hide', m !== 'play');
  $('barResult').classList.toggle('hide', m !== 'result');
  gl.classList.toggle('hide', m === 'paint');
  cv.classList.toggle('hide', m !== 'paint');
  if (m === 'paint') { $('erase').classList.remove('on'); updateDone(); }
  if (m === 'result') { resultBlob = null; setTimeout(() => exportBlob().then(b => { if (mode === 'result') resultBlob = b; }), 50); }
  renderPaint();
}
function applyLang() {
  document.documentElement.lang = lang;
  document.title = t('title');
  $('back').textContent = t('back');
  $('lang').value = lang;
  for (const k of ['pick', 'erase', 'undo', 'done', 'bake', 'save', 'post', 'again']) $(k).textContent = t(k);
  updatePost();
}
$('lang').onchange = () => { lang = $('lang').value; store.set('lang', lang); applyLang(); };
$('snd').onclick = () => { soundOn = !soundOn; store.set('sound', soundOn); drawSnd(); };

// start screen: a plain round dough on the board
{
  const c = mkCanvas(256, 256), g = c.getContext('2d');
  g.fillStyle = '#f1dcb6'; g.beginPath(); g.arc(128, 128, 104, 0, Math.PI * 2); g.fill();
  g.globalCompositeOperation = 'source-atop';
  for (let i = 0; i < 300; i++) { g.fillStyle = `rgba(255,255,250,${Math.random() * 0.4})`; g.fillRect(Math.random() * 256, Math.random() * 256, 2, 2); }
  buildDough(c); ext = doughExtent();
}
drawSnd(); applyLang(); setMode('start');
new ResizeObserver(resize).observe($('stage'));
resize();
requestAnimationFrame(frame);
</script>
