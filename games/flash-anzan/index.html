  <script>

  <script type="module">
    import * as THREE from 'three';
    window.GAME_READY = true;

      ko: { title: '플래시 순산', back: '← 처음으로', again: '다시 하기', post: 'X에 게시', count: n => `${n}회`, share: n => `플래시 속 아기 수를 ${n}회 연속으로 맞혔다 #フラッシュ安産ゲーム` },
      en: { title: 'Flash Delivery', back: '← Back to top', again: 'Play again', post: 'Post on X', count: n => `${n} in a row`, share: n => `I counted the babies in the flash ${n} ${n === 1 ? 'time' : 'times'} in a row #フラッシュ安産ゲーム` },
      th: { title: 'แฟลชคลอดง่าย', back: '← กลับหน้าแรก', again: 'เล่นอีกครั้ง', post: 'โพสต์ลง X', count: n => `${n} ครั้ง`, share: n => `นับจำนวนทารกในแสงแฟลชถูกติดกัน ${n} ครั้ง #フラッシュ安産ゲーム` },

    let lang = store.get('lang', null) || autoLang();
    const t = k => DICT[lang][k];
    const langSel = document.getElementById('lang');

    langSel.addEventListener('change', () => { lang = langSel.value; store.set('lang', lang); applyLang(); langSel.blur(); });
    function applyLang() {
      document.documentElement.lang = lang;
      document.title = t('title');
      document.getElementById('back').textContent = t('back');
      renderControls();
      if (state === 'result') { showResult(); prepareShare(); }
    }

    // ---------- 音 ----------
    let soundOn = store.get('sound', true);
    const soundBtn = document.getElementById('sound');
    const drawSoundBtn = () => {
      soundBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>${soundOn ? '<path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>' : '<path d="M17 9l5 6M22 9l-5 6"/>'}</svg>`;
    };
    drawSoundBtn();
    soundBtn.addEventListener('click', () => { soundOn = !soundOn; store.set('sound', soundOn); drawSoundBtn(); soundBtn.blur(); });
    let ac = null;
    // iPhone の消音モードでも鳴らす
    function unmuteIOS() {
      try { if (navigator.audioSession) { navigator.audioSession.type = 'playback'; return; } } catch {}

        w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
        v.setUint32(24, 44100, true); v.setUint32(28, 88200, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
        const a = document.createElement('audio');
        a.src = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' })); a.loop = true; a.setAttribute('playsinline', '');

      } catch {}
    }
    function initAudio() {
      if (ac) return;
      unmuteIOS();
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        const o = ac.createOscillator(), g = ac.createGain(); g.gain.value = 0;
        o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.05);
      } catch { ac = null; }
    }
    addEventListener('pointerdown', initAudio, { capture: true });
    addEventListener('keydown', initAudio, { capture: true });
    const on = () => soundOn && ac;
    function tone(type, f0, f1, dur, vol, delay = 0) {
      if (!on()) return;
      const now = ac.currentTime + delay;
      const o = ac.createOscillator(); o.type = type;
      o.frequency.setValueAtTime(f0, now); o.frequency.exponentialRampToValueAtTime(f1, now + dur);
      const g = ac.createGain(); g.gain.setValueAtTime(0.0001, now); g.gain.linearRampToValueAtTime(vol, now + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      o.connect(g).connect(ac.destination); o.start(now); o.stop(now + dur + 0.02);
    }
    // 短いノイズを共鳴に通す（カチッ・カシャ）
    function click(dur, vol, bands, delay = 0, decay = 0.006) {
      if (!on()) return;
      const now = ac.currentTime + delay;
      const buf = ac.createBuffer(1, Math.floor(ac.sampleRate * dur), ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ac.sampleRate * decay));
      const s = ac.createBufferSource(); s.buffer = buf;
      for (const [f, q, g0] of bands) {
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f * rnd(0.95, 1.05); bp.Q.value = q;
        const g = ac.createGain(); g.gain.value = g0 * vol; s.connect(bp).connect(g).connect(ac.destination);
      }
      s.start(now);
    }
    // 声: 声帯の振動（のこぎり波＋息）を、母音ごとの共鳴（フォルマント）に通す
    const VOWEL = { a: [800, 1200, 2600], i: [300, 2300, 3000], u: [350, 1250, 2500], e: [500, 1900, 2600], o: [500, 850, 2500] };
    function voice(f0, seq, dur, vol, opt = {}) {
      if (!on()) return;
      const { contour = [[0, 1.25], [0.15, 1.4], [1, 0.7]], vib = 0.04, vibRate = rnd(5.5, 8.5), breath = 0.15, form = 1, cut = false, delay = 0 } = opt;

      const o = ac.createOscillator(); o.type = 'sawtooth';
      contour.forEach(([p, m], i) => i ? o.frequency.linearRampToValueAtTime(f0 * m, now + dur * p) : o.frequency.setValueAtTime(f0 * m, now));
      const v = ac.createOscillator(); v.frequency.value = vibRate;
      const vg = ac.createGain(); vg.gain.value = f0 * vib; v.connect(vg).connect(o.frequency);
      const nb = ac.createBuffer(1, Math.floor(ac.sampleRate * dur), ac.sampleRate), nd = nb.getChannelData(0);

      const ns = ac.createBufferSource(); ns.buffer = nb;

      const src = ac.createGain();
      o.connect(src); ns.connect(ng).connect(src);

      out.gain.setValueAtTime(0, now);

      if (cut) { out.gain.setValueAtTime(vol, now + dur - 0.025); out.gain.linearRampToValueAtTime(0, now + dur); }
      else { out.gain.setValueAtTime(vol, now + dur * 0.55); out.gain.exponentialRampToValueAtTime(0.001, now + dur); }
      [1, 0.6, 0.25].forEach((amp, fi) => {
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = fi === 0 ? 6 : 9;
        seq.forEach((s, si) => { const tt = now + dur * si / Math.max(1, seq.length - 1) * 0.7; bp.frequency[si ? 'linearRampToValueAtTime' : 'setValueAtTime'](VOWEL[s][fi] * form, tt); });
        const g = ac.createGain(); g.gain.value = amp * 3;

      o.stop(now + dur); v.stop(now + dur); ns.stop(now + dur);

    // フラッシュの充電音: 高く上がっていくキーン
    function sCharge() {
      if (!on()) return;
      const now = ac.currentTime, dur = 0.6;
      for (const [k, vol] of [[1, 0.035], [2.01, 0.012]]) {
        const o = ac.createOscillator(); o.type = 'sine';
        o.frequency.setValueAtTime(1500 * k, now); o.frequency.exponentialRampToValueAtTime(5600 * k, now + dur);
        const g = ac.createGain(); g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(vol, now + 0.15); g.gain.setValueAtTime(vol, now + dur - 0.05); g.gain.linearRampToValueAtTime(0, now + dur);
        o.connect(g).connect(ac.destination); o.start(now); o.stop(now + dur + 0.02);
      }
    }
    // シャッター: 幕が走る「カ」と戻る「シャ」＋小さな胴鳴り
    function sShutter() {
      click(0.03, 0.9, [[3200, 2, 1], [6500, 3, 0.5]], 0, 0.004);
      click(0.09, 0.6, [[2400, 1.5, 0.8], [5200, 2, 0.6]], 0.055, 0.018);
      tone('sine', 220, 90, 0.07, 0.12);
      click(0.02, 0.35, [[9000, 1, 1]], 0, 0.002); // ストロボの「パッ」
    }
    const sLight = () => { click(0.02, 0.6, [[1600, 4, 1], [3800, 5, 0.4]], 0, 0.003); tone('sine', 120, 118, 0.6, 0.015, 0.05); };
    const sTap = () => click(0.02, 0.35, [[1200, 5, 1], [2600, 6, 0.4]], 0, 0.004);
    // 赤ちゃんの「オギャー」: 高い声、強いビブラート、小さい声道（共鳴が高め）
    const CRY = [['o', 'i', 'a', 'a'], ['u', 'a', 'a', 'e'], ['a', 'a', 'e'], ['o', 'a', 'a'], ['e', 'a', 'a', 'u']];
    function cries(n) {
      for (let i = 0; i < Math.min(n, 5); i++) {
        const f0 = rnd(420, 560), d0 = i * 0.2 + rnd(0, 0.15);
        let at = d0;

          voice(f0 * rnd(0.95, 1.05), pick(CRY), dur, 0.22, { contour: [[0, 0.85], [0.2, 1.12], [0.75, 1.04], [1, 0.72]], vib: 0.06, vibRate: rnd(8, 11), breath: 0.28, form: 1.35, delay: at });
          at += dur + rnd(0.15, 0.3);
        }
      }
    }
    // お母さん: 安心の「わぁ」、外れた時の「えっ」
    const sRelief = () => voice(255, ['u', 'a', 'a'], 0.7, 0.4, { contour: [[0, 1], [0.25, 1.35], [1, 0.85]], vib: 0.03, form: 1.1 });
    const sEh = () => voice(235, ['e', 'e'], 0.27, 0.55, { contour: [[0, 0.9], [1, 1.5]], vib: 0.01, form: 1.1, cut: true, breath: 0.1 });

    // ---------- 3D ----------
    const stage = document.getElementById('stage');
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    scene.background = new THREE.Color('#0c0f18');

    const lamp = new THREE.DirectionalLight('#ffe6c4', 0);
    lamp.position.set(1.2, 7, 2.5); lamp.target.position.set(0, 0.6, -0.2);
    lamp.castShadow = true; lamp.shadow.mapSize.set(1024, 1024); lamp.shadow.radius = 5; lamp.shadow.bias = -0.0006;
    Object.assign(lamp.shadow.camera, { left: -3.2, right: 3.2, top: 3.2, bottom: -3.2, near: 1, far: 16 });
    scene.add(lamp, lamp.target);
    const strobe = new THREE.DirectionalLight('#ffffff', 0);
    strobe.castShadow = true; strobe.shadow.mapSize.set(1024, 1024); strobe.shadow.radius = 1.5; strobe.shadow.bias = -0.0006;
    Object.assign(strobe.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: 1, far: 18 });

    // 床: クリーム色のタイル
    const floorTex = canvasTex(256, 256, (c, w, h) => {
      const n = 4, s = w / n;
      for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { const l = 82 + Math.random() * 5; c.fillStyle = `hsl(42,18%,${l}%)`; c.fillRect(i * s, j * s, s, s); }

        f.m.rotation.x += f.spin.x * dt; f.m.rotation.y += f.spin.y * dt;
        const q = f.t / f.life; f.m.material.opacity = Math.min(1, (1 - q) * 3);
        if (q >= 1) { scene.remove(f.m); f.m.material.dispose(); fx.splice(k, 1); }
      }
    }

    // ---------- 画面サイズ ----------
    const CENTER = new THREE.Vector3(0, 0.75, -0.05);
    const fitCam = new THREE.PerspectiveCamera(38, 1, 0.1, 200);
    const FIT = []; for (const x of [-1.4, 1.4]) for (const y of [0.25, 1.5]) for (const z of [-1.75, 1.95]) FIT.push(new THREE.Vector3(x, y, z));
    const DIR = new THREE.Vector3(0, 1.15, 1).normalize();
    strobe.position.copy(CENTER).addScaledVector(DIR, 9).add(new THREE.Vector3(0.6, 0.8, 0)); strobe.target.position.copy(CENTER);
    const controls = document.getElementById('controls'), resultEl = document.getElementById('result'), gaugeEl = document.getElementById('gauge'), flashEl = document.getElementById('flash');
    const sideMQ = matchMedia('(max-height: 520px) and (min-aspect-ratio: 4/3)');
    function resize() {
      const W = stage.clientWidth, H = stage.clientHeight;
      renderer.setSize(W, H, false);
      const vmin = Math.min(innerWidth, innerHeight);
      const bh = Math.round(Math.min(64, Math.max(48, 0.075 * vmin)));
      const side = sideMQ.matches;
      const cols = side ? 3 : innerWidth >= 560 ? 9 : 5, rows = cols === 9 ? 1 : 2;
      const sw = 3 * bh + 12;
      controls.style.setProperty('--bh', bh + 'px'); controls.style.setProperty('--cols', cols); controls.style.setProperty('--sw', sw + 'px');
      // 下の空白と答えボタンの所には大事な物を置かない（描画は下まで）
      const gridH = side ? 0 : 8 + rows * bh + (rows - 1) * 6 + 4;
      const reserve = Math.max(0, stage.getBoundingClientRect().bottom - controls.getBoundingClientRect().bottom) + gridH + 6;
      const top = Math.min(48, Math.max(30, gaugeEl.offsetHeight + 10));
      let rx = 0, ry = top, rw = side ? W - sw - 24 : W, rh = Math.max(110, H - reserve - top);
      if (state === 'result') {
        if (side) { const tw = Math.round(rw * 0.4); Object.assign(resultEl.style, { left: '0px', top: '0px', width: tw + 'px', height: (H - reserve) + 'px' }); rx = tw; rw -= tw; }
        else { const band = Math.max(70, Math.round(rh * 0.26)); Object.assign(resultEl.style, { left: '0px', top: ry + 'px', width: W + 'px', height: band + 'px' }); ry += band; rh -= band; }
      }
      // 縦長では、余った高さを主に上（壁と窓）に回す
      if (rw / rh < 0.85) { const nh = rw / 0.85; ry += (rh - nh) * 0.65; rh = nh; }
      camera.aspect = rw / rh;
      camera.setViewOffset(rw, rh, -rx, -ry, W, H);
      // 分娩台と猫が枠いっぱいに入る距離を探す
      fitCam.aspect = camera.aspect; fitCam.updateProjectionMatrix();
      let lo = 2, hi = 40;
      for (let k = 0; k < 22; k++) {
        const d = (lo + hi) / 2;
        fitCam.position.copy(CENTER).addScaledVector(DIR, d); fitCam.lookAt(CENTER); fitCam.updateMatrixWorld();
        let m = 0;
        for (const c of FIT) { const v = c.clone().project(fitCam); m = Math.max(m, Math.abs(v.x), Math.abs(v.y)); }
        if (m > 0.94) lo = d; else hi = d;
      }
      const d = hi;
      camera.position.copy(CENTER).addScaledVector(DIR, d);
      camera.lookAt(CENTER);
      camera.updateProjectionMatrix();
      camera.updateMatrixWorld();
    }
    addEventListener('resize', resize);

    // ---------- ゲーム ----------
    // ready: 暗い部屋で待つ / charge: 充電音 / flash: 一瞬見える / answer: 人数を選ぶ / reveal: 明かりがつく / dim: 次へ / result
    let regen = false, state = 'ready', timer = 0, count = 0, flashD = 0.6, streak = 0, lit = 0, litTarget = 0, strobeV = 0, correct = false, catKick = 0, catJoy = 0, needSnap = false, shownFlash = -1;
    const difficulty = () => {
      const maxN = Math.min(9, 2 + streak), minN = Math.max(1, maxN - 3);
      return { n: Math.floor(rnd(minN, maxN + 1)), d: Math.max(0.15, 0.6 - streak * 0.045) };
    };
    function newRound() { const { n, d } = difficulty(); placeBabies(n); flashD = d; }
    function shoot() { if (state !== 'ready') return; state = 'charge'; timer = 0; sCharge(); renderControls(); }
    function answer(n) {
      if (state !== 'answer') return;
      sTap();
      correct = n === count;
      state = 'reveal'; timer = 0; litTarget = 1; sLight();
      if (correct) {
        streak++; addGauge(); confetti(); catJoy = 0.0001;
        setTimeout(sRelief, 150); cries(count);
      } else {
        catKick = 0.0001; sweat(); setTimeout(sEh, 120); setTimeout(() => cries(count), 700);
      }
      renderControls();
    }
    const STEP = 1 / 60;
    function step(dt) {
      timer += dt;
      lit += (litTarget - lit) * Math.min(1, dt * 9);
      if (state === 'charge' && timer >= 0.62) { state = 'flash'; timer = 0; strobeV = 1; sShutter(); }
      else if (state === 'flash') {
        if (timer >= flashD) { state = 'answer'; timer = 0; strobeV = 0.35; renderControls(); }
      } else if (state === 'reveal') {
        if (timer >= (correct ? 1.9 : 2.2)) { if (correct) { state = 'dim'; timer = 0; litTarget = 0; regen = false; } else finish(); }
      } else if (state === 'dim') {
        if (timer >= 0.45 && !regen) { newRound(); regen = true; }
        if (timer >= 0.85) { state = 'charge'; timer = 0; sCharge(); }
      }
      if (state !== 'flash') strobeV = Math.max(0, strobeV - dt * 6);
      if (catKick) catKick += dt; if (catKick > 0.8) catKick = 0;
      if (catJoy) catJoy += dt; if (catJoy > 1.2) catJoy = 0;
      stepFx(dt);
    }

    // ---------- 画面 ----------
    const BABY_SVG = '<svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="10" fill="#ffd9c4" stroke="#8a3a52" stroke-width="1.5"/><path d="M12 3c2 0 3 1.5 1.5 2.5" fill="none" stroke="#5a3a1e" stroke-width="1.6" stroke-linecap="round"/><circle cx="8.5" cy="12.5" r="1.3" fill="#2a1c12"/><circle cx="15.5" cy="12.5" r="1.3" fill="#2a1c12"/><ellipse cx="6.5" cy="15.5" rx="1.8" ry="1.1" fill="#f29aa8"/><ellipse cx="17.5" cy="15.5" rx="1.8" ry="1.1" fill="#f29aa8"/><path d="M10 17q2 1.6 4 0" fill="none" stroke="#9a2a3a" stroke-width="1.4" stroke-linecap="round"/></svg>';
    function addGauge() { gaugeEl.insertAdjacentHTML('beforeend', BABY_SVG); resize(); }
    const CAM_SVG = '<svg viewBox="0 0 32 24"><rect x="1.5" y="5" width="29" height="17.5" rx="3.5" fill="#3a2a1a"/><path d="M10 5l2.5-3.5h7L22 5z" fill="#3a2a1a"/><circle cx="16" cy="13.5" r="6" fill="#f6c94a" stroke="#fff3e2" stroke-width="1.6"/><circle cx="16" cy="13.5" r="3" fill="#3a2a1a"/><rect x="23.5" y="7.5" width="4.5" height="2.6" rx="1" fill="#fff3e2"/></svg>';
    function renderControls() {
      controls.innerHTML = '';
      controls.className = '';
      if (state === 'ready') {
        const b = document.createElement('button'); b.className = 'cam'; b.setAttribute('aria-label', 'flash'); b.innerHTML = CAM_SVG;
        b.addEventListener('click', shoot); controls.append(b);
      } else if (state === 'answer') {
        controls.className = 'answer';
        for (let i = 1; i <= 9; i++) { const b = document.createElement('button'); b.className = 'num'; b.textContent = i; b.addEventListener('click', () => answer(i)); controls.append(b); }
      } else if (state === 'result') {
        const b = document.createElement('button');
        b.className = 'go'; b.textContent = t('again');
        b.addEventListener('click', start);
        controls.append(b);
        const a = document.createElement('a');
        a.className = 'post'; a.textContent = t('post');
        a.href = `https://x.com/intent/post?text=${encodeURIComponent(t('share')(streak))}&url=${encodeURIComponent(SHARE_URL)}`;
        const coarse = matchMedia('(pointer: coarse)').matches;
        if (!coarse) { a.target = '_blank'; a.rel = 'noopener'; }
        // スマホは画像ごと共有シートへ。PCは画像を保存してから投稿画面を開く
        a.addEventListener('click', e => {
          const text = t('share')(streak);
          if (coarse && navigator.share) {
            e.preventDefault();
            const file = shareFile();
            const data = file && navigator.canShare?.({ files: [file] }) ? { files: [file], text: `${text}\n${SHARE_URL}` } : { text: `${text}\n${SHARE_URL}` };
            navigator.share(data).catch(() => {});
            return;
          }
          const img = resultImage();
          if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'flash-anzan.png'; d.click(); }
        });
        controls.append(a);
      }
    }
    // 画面のどこをタップしてもフラッシュ
    renderer.domElement.addEventListener('pointerdown', e => { e.preventDefault(); shoot(); }, { passive: false });
    stage.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
    addEventListener('keydown', e => {
      if (e.target instanceof HTMLSelectElement) return;
      if (/^[1-9]$/.test(e.key)) answer(+e.key);
      else if ((e.key === ' ' || e.key === 'Enter') && state === 'ready') { e.preventDefault(); shoot(); }
    });

    // 結果画像: 明かりのついた分娩台に回数を重ねる
    let snap = null, shareCache = null;
    function takeSnap() {
      const src = renderer.domElement;
      const f = new THREE.Vector3(0, 0.75, -0.25).project(camera);
      const fx2 = (f.x + 1) / 2 * src.width, fy = (1 - f.y) / 2 * src.height;
      const side = Math.min(src.width, src.height);
      const sx = THREE.MathUtils.clamp(fx2 - side / 2, 0, src.width - side), sy = THREE.MathUtils.clamp(fy - side / 2, 0, src.height - side);
      snap = document.createElement('canvas'); snap.width = snap.height = 1080;
      snap.getContext('2d').drawImage(src, sx, sy, side, side, 0, 0, 1080, 1080);
      shareCache = null;
    }
    function resultImage() {
      if (!snap) return null;
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const g = c.getContext('2d');
      g.drawImage(snap, 0, 0);
      g.textAlign = 'center'; g.fillStyle = '#fff'; g.lineJoin = 'round';
      const font = px => `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans Thai", sans-serif`;
      const text = (str, y, px, max) => {
        g.font = font(px);
        const w = g.measureText(str).width; if (w > max) { px *= max / w; g.font = font(px); }
        g.lineWidth = px * .16; g.strokeStyle = '#8a3a52'; g.strokeText(str, 540, y); g.fillText(str, 540, y);
      };
      text(t('count')(streak), 960, 170, 960);
      text(t('title'), 100, 60, 900);
      return c;
    }
    function prepareShare() {
      if (!snap) return;
      const key = lang;
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'flash-anzan.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;
    function showResult() { resultEl.children[0].textContent = t('count')(streak); }
    function start() {
      state = 'ready'; timer = 0; streak = 0; litTarget = 0; lit = 0; strobeV = 0;
      gaugeEl.innerHTML = '';
      resultEl.style.display = 'none'; gaugeEl.style.display = 'flex';
      newRound();
      renderControls(); resize();
    }
    function finish() {
      state = 'result';
      showResult();
      resultEl.style.display = 'flex'; gaugeEl.style.display = 'none';
      snap = null; needSnap = true;
      renderControls(); resize();
    }

    // ---------- ループ ----------
    let last = performance.now(), acc = 0, clock = 0, ecgAcc = 0;
    function render() {
      // 光の強さ
      const L = lit, S = strobeV;
      lamp.intensity = 2.4 * L;
      hemi.intensity = 0.06 + 0.85 * L + 0.7 * S;
      strobe.intensity = 5.5 * S;
      moon.intensity = 0.45 * (1 - L * 0.6);
      catMat.color.setScalar(0.22 + 0.78 * Math.min(1, Math.max(L, S)));
      // 赤ちゃんはフラッシュの間と明かりがついた時だけ見える
      nursery.visible = state === 'flash' || ((state === 'reveal' || state === 'dim' || state === 'result') && L > 0.12);
      if (state === 'dim' && L <= 0.12) nursery.visible = false;
      // 白い閃光（最初の一瞬だけ）
      const fo = state === 'flash' ? Math.max(0, 0.75 - timer * 14) : 0;
      const fr = Math.round(fo * 50) / 50;
      if (fr !== shownFlash) { shownFlash = fr; flashEl.style.opacity = fr; }
      // 泣いている赤ちゃん（写真の瞬間は止まっている）
      const cry = state === 'reveal' || state === 'result' || state === 'dim';
      for (const b of babies) {
        const w = cry ? Math.sin(clock * b.sp + b.ph) : 0;
        b.mouth.scale.set(cry ? 0.026 : 0.02, cry ? 0.016 + 0.012 * Math.abs(w) : 0.008, 0.012);
        b.head.rotation.x = b.headRx + (cry ? 0.08 * w : 0);
        for (const [i, a] of b.arms.entries()) { a.userData.y ??= a.position.y; a.position.y = a.userData.y + (cry ? Math.sin(clock * 14 + b.ph + i * 2) * 0.012 : 0); }
      }
      // お母さん: 喜ぶと弾み、外れると震える
      cat.position.copy(CAT_POS);
      let cs = 0.95;
      if (catJoy) { cat.position.y += Math.abs(Math.sin(catJoy * 10)) * 0.06 * (1 - catJoy / 1.2); }
      if (catKick) { cs *= 1 + 0.18 * Math.exp(-catKick * 6); cat.position.x += Math.sin(catKick * 70) * 0.03 * (1 - catKick / 0.8); }
      if (state === 'result' && !correct) cs *= 1.06;
      cat.scale.set(cs, cs, 1);
      renderer.render(scene, camera);
      if (needSnap && lit > 0.97) { needSnap = false; takeSnap(); prepareShare(); }
    }
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      acc += dt; clock += dt; ecgAcc += dt;
      while (acc >= STEP) { step(STEP); acc -= STEP; }
      if (ecgAcc > 0.05) { drawEcg(ecgAcc); ecgAcc = 0; }
      render();
      requestAnimationFrame(loop);
    }

    // 最初の1回が重くならないように、9人の赤ちゃんと全部の光で一度描いておく
    placeBabies(9);
    drawEcg(0);
    resize();
    lamp.intensity = 1; strobe.intensity = 1; nursery.visible = true;
    renderer.compile(scene, camera); renderer.render(scene, camera);
    start();
    applyLang();
    requestAnimationFrame(t0 => { last = t0; loop(t0); });
  </script>
</body>
</html>
