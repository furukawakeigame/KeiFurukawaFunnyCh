// ・顔: カメラから顔の5か所へ光線を飛ばし、他の人に隠れていない割合
function faceSeen(p, hc) {
  const s = p.h.height / 1.7, right = new THREE.Vector3(1, 0, 0), up = new THREE.Vector3(0, 1, 0);
  const others = people.filter(o => o !== p).flatMap(o => o.meshes);
  let seen = 0;
  for (const [a, b] of [[0, 0], [-0.07, 0], [0.07, 0], [0, 0.075], [0, -0.07]]) {
    const q = hc.clone().addScaledVector(right, a * s).addScaledVector(up, b * s);
    const n = q.clone().project(photoCam);
    if (Math.abs(n.x) > 1 || Math.abs(n.y) > 1) continue;
    const dir = q.clone().sub(photoCam.position), dist = dir.length(); dir.normalize();
    ray.set(photoCam.position, dir); ray.far = dist - 0.06;
    if (!ray.intersectObjects(others, false).length) seen++;

}
function judge() {
  scene.updateMatrixWorld(true);
  const all = people.map(p => { const hc = headCenter(p), n = hc.clone().project(photoCam); return { p, hc, x: n.x, y: n.y, z: p.z }; });
  const gc = (Math.min(...all.map(a => a.x)) + Math.max(...all.map(a => a.x))) / 2; // 並びの真ん中
  const spread = Math.max(0.05, ...all.map(a => Math.abs(a.x - gc)));
  const zMin = Math.min(...all.map(a => a.z)), zMax = Math.max(...all.map(a => a.z));
  for (const a of all) {
    a.c = Math.pow(clamp(1 - Math.abs(a.x - gc) / spread), 1.2);
    a.f = zMax - zMin > 0.05 ? (a.z - zMin) / (zMax - zMin) : 1;
    a.v = faceSeen(a.p, a.hc);
    a.raw = 40 * a.c + 30 * a.f + 30 * a.v - (a.p.fall > 0 ? 15 : 0);
  }
  const mine = all.find(a => a.p === me);
  const rank = 1 + all.filter(a => a !== mine && a.raw > mine.raw).length;
  const kind = me.fall > 0 ? 'fall' : mine.v < 0.4 ? 'hidden' : rank === 1 ? 'top' : rank <= 3 ? 'center' : rank <= 5 ? 'front' : rank <= 7 ? 'edge' : 'invisible';
  return { rank, n: people.length, kind, when: new Date(), hx: (mine.x + 1) / 2, hy: (1 - mine.y) / 2, hr: 0.11 * me.h.height / 1.7 };
}
function drawPhoto() {

}

let shareCache = null;

  g.fillStyle = gr; g.beginPath(); g.roundRect ? g.roundRect(60, by - 30, sw, 60, 8) : g.rect(60, by - 30, sw, 60); g.fill();

}
function prepareShare() {

const shareFile = () => shareCache?.key === lang + scoreData.rank + scoreData.kind ? shareCache.file : null;

// ===== 画面サイズ =====
const CENTER = new THREE.Vector3(0, 0.8, 0.05);
const PLAY_POS = new THREE.Vector3(), PLAY_Q = new THREE.Quaternion();
// カットシーン: カメラマンを正面から写し、回り込みながらプレイ中の位置へ
const INTRO_POS = new THREE.Vector3(0.35, 1.45, 5.0), INTRO_LOOK = new THREE.Vector3(0, 1.25, PH_POS.z);
const INTRO_HOLD = 2.3, INTRO_ORBIT = 1.7, INTRO_DOLLY = 1.3, INTRO_MOVE = INTRO_ORBIT + INTRO_DOLLY;
const ease = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const PLAY_LOOK = new THREE.Vector3(), camPos = new THREE.Vector3(), camLookAt = new THREE.Vector3(), STAGE_LOOK = new THREE.Vector3(0, 1.0, 0);
function applyCam() {
  if (state !== 'intro') { camera.position.copy(PLAY_POS); camera.quaternion.copy(PLAY_Q); return; }
  const t = introT - INTRO_HOLD;
  if (t <= 0) { camera.position.copy(INTRO_POS); camera.lookAt(INTRO_LOOK); return; }
  if (t < INTRO_ORBIT) {
    // カメラマンのまわりを回って背中側へ（見る先は顔から舞台へ）
    const k = ease(t / INTRO_ORBIT), th = Math.PI * k, R = lerp(PH_POS.z - INTRO_POS.z, 2.2, k);
    camPos.set(PH_POS.x + Math.sin(th) * R + INTRO_POS.x * (1 - k), lerp(INTRO_POS.y, 2.3, k), PH_POS.z - Math.cos(th) * R);
    camLookAt.lerpVectors(INTRO_LOOK, STAGE_LOOK, smooth(0.15, 0.85, k));
  } else {
    // 後ろへ引いて、プレイ中の位置へ
    const k = ease((t - INTRO_ORBIT) / INTRO_DOLLY);
    camPos.set(PH_POS.x, 2.3, PH_POS.z + 2.2).lerp(PLAY_POS, k);
    camLookAt.lerpVectors(STAGE_LOOK, PLAY_LOOK, k);

}
function resize() {

  const bottom = 92; // 下の 80px（X のアプリ内ブラウザの投稿文が重なる所）には大事な物を置かない
  const h = Math.max(160, H - top - bottom);

  camera.setViewOffset(w, h, 0, -top, w, H);

}
addEventListener('resize', resize);

const FAST = location.hash === '#test' ? 6 : 1; // 確認用（遅い環境で早回し）

function updLeft() {

  if (n === lastLeft) return; lastLeft = n;

  $('left').classList.toggle('hurry', n <= 3 && state === 'play');
}
