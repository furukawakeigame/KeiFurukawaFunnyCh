<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>クリックゲーム</title>
  <style>
    body { font-family: system-ui, sans-serif; text-align: center; padding: 24px; }
    button { font-size: 2em; padding: 24px 48px; margin: 24px; }
  </style>
</head>
<body>
  <p><a href="../../">← トップへ戻る</a></p>
  <h1>クリックゲーム</h1>
  <p>残り <span id="time">10</span> 秒 / スコア <span id="score">0</span></p>
  <button id="btn">スタート</button>
  <script>
    const btn = document.getElementById('btn');
    const timeEl = document.getElementById('time');
    const scoreEl = document.getElementById('score');
    let score = 0, time = 10, playing = false, timer;

    btn.addEventListener('click', () => {
      if (!playing) {
        playing = true; score = 0; time = 10;
        scoreEl.textContent = score; timeEl.textContent = time;
        btn.textContent = 'クリック！';
        timer = setInterval(() => {
          time--; timeEl.textContent = time;
          if (time <= 0) {
            clearInterval(timer); playing = false;
            btn.textContent = 'もう一度';
            alert('スコア: ' + score);
          }
        }, 1000);
        return;
      }
      score++; scoreEl.textContent = score;
    });
  </script>
</body>
</html>
