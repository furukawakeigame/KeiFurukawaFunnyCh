  <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
  <script type="module">
    let THREE;
    try { THREE = await import('three'); }
    catch (e) { const el = document.getElementById('err'); el.textContent = t('err'); el.style.display = 'grid'; throw e; }

    const $ = id => document.getElementById(id);
    const SHARE_URL = 'https://keifurukawafunnych.com/games/ketchup-rocket/';
    const coarse = matchMedia('(pointer: coarse)').matches;

    // ---------- 3D ----------
    const stage = $('stage');
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    stage.appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9fd4f2);
    scene.fog = new THREE.Fog(0x9fd4f2, 40, 140);
    const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 400);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x6fbf4f, 1.6));
    const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(5, 10, 8); scene.add(sun);

    const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 200), new THREE.MeshLambertMaterial({ color: 0x6fbf4f }));
    ground.rotation.x = -Math.PI / 2; scene.add(ground);

    // distance markers every 10m
    const markerMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
    const markerMat2 = new THREE.MeshLambertMaterial({ color: 0xffd23a });
    const markers = [];
    for (let i = 0; i < 16; i++) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.06, 3), markerMat);
      m.position.y = 0.03; scene.add(m); markers.push(m);
    }
    // clouds
    const clouds = [];
    const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
    for (let i = 0; i < 10; i++) {
      const g = new THREE.Group();
      for (let j = 0; j < 3; j++) { const s = new THREE.Mesh(new THREE.SphereGeometry(1.5 + Math.random(), 12, 8), cloudMat); s.position.set(j * 1.8 - 1.8, Math.random() * .6, 0); g.add(s); }
      g.position.set(i * 25, 12 + Math.random() * 25, -30 - Math.random() * 20);
      scene.add(g); clouds.push(g);
    }
    // launch pad
    const padMesh = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.3, 1.6), new THREE.MeshLambertMaterial({ color: 0x888888 }));
    padMesh.position.set(0, 0.15, 0); scene.add(padMesh);
    // best flag
    const flag = new THREE.Group();
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 2.4), new THREE.MeshLambertMaterial({ color: 0x555555 })); pole.position.y = 1.2; flag.add(pole);
    const cloth = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.55), new THREE.MeshLambertMaterial({ color: 0xffd23a, side: THREE.DoubleSide })); cloth.position.set(0.45, 2.1, 0); flag.add(cloth);
    scene.add(flag);

    // bottle: upside down, cap (nozzle) at the bottom. Local +y = thrust direction.
    const RED = 0xd4231a;
    const bottle = new THREE.Group();
    const redMat = new THREE.MeshStandardMaterial({ color: RED, roughness: 0.35 });
    const whiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.38, 1.1, 24), redMat); body.position.y = 0.2; bottle.add(body);
    const top = new THREE.Mesh(new THREE.SphereGeometry(0.38, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), redMat); top.position.y = 0.75; bottle.add(top);
    const shoulder = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.22, 0.3, 24), redMat); shoulder.position.y = -0.5; bottle.add(shoulder);
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.26, 0.25, 24), whiteMat); cap.position.y = -0.76; bottle.add(cap);
    const nozzle = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.1, 0.15, 12), whiteMat); nozzle.position.y = -0.95; bottle.add(nozzle);
    const label = new THREE.Mesh(new THREE.CylinderGeometry(0.385, 0.385, 0.45, 24, 1, true), whiteMat); label.position.y = 0.25; bottle.add(label);
    scene.add(bottle);
    const NOZ = 1.0; // nozzle distance from center

    // ketchup drops
    const MAXP = 500;
    const dropGeo = new THREE.SphereGeometry(0.12, 8, 6);
    const dropMat = new THREE.MeshStandardMaterial({ color: 0xc8160f, roughness: 0.2 });
    const drops = new THREE.InstancedMesh(dropGeo, dropMat, MAXP); drops.frustumCulled = false; scene.add(drops);
    const P = Array.from({ length: MAXP }, () => ({ on: false, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, s: 1 }));
    let pHead = 0;
    const MAXS = 700;
    const splats = new THREE.InstancedMesh(new THREE.CircleGeometry(0.25, 12), new THREE.MeshLambertMaterial({ color: 0xb3140d }), MAXS);
    splats.frustumCulled = false; scene.add(splats);
    let sHead = 0;
    const tmpM = new THREE.Matrix4(), tmpQ = new THREE.Quaternion(), tmpV = new THREE.Vector3(), tmpS = new THREE.Vector3();
    const flatQ = new THREE.Quaternion().setFromEuler(new THREE.Euler(-Math.PI / 2, 0, 0));
    const hide = new THREE.Matrix4().makeScale(0, 0, 0);
    function clearFx() {
      for (let i = 0; i < MAXP; i++) { P[i].on = false; drops.setMatrixAt(i, hide); }
      for (let i = 0; i < MAXS; i++) splats.setMatrixAt(i, hide);
      drops.instanceMatrix.needsUpdate = splats.instanceMatrix.needsUpdate = true;
    }
    function addSplat(x, z, s) {
      tmpS.set(s, s, s); tmpV.set(x, 0.02 + (sHead % 7) * 0.002, z);
      splats.setMatrixAt(sHead, tmpM.compose(tmpV, flatQ, tmpS)); sHead = (sHead + 1) % MAXS;
      splats.instanceMatrix.needsUpdate = true;
    }

    // ---------- physics (2D in x-y, angle a = tilt from vertical, + = forward) ----------
    const DT = 1 / 120, G = 9.8, THRUST = 16, BURN = 0.24, R = 0.45;
    let S, prev, state = 'title', holding = false, restT = 0, idleT = 0, best = store.get('best', 0);
    function reset() {
      S = { x: 0, y: 0.3 + NOZ, vx: 0, vy: 0, a: 0.55, w: 0, fuel: 1, flying: false, maxY: 0 };
      prev = { ...S }; restT = idleT = 0;
    }
    reset();
    function emit(n) {
      const sx = Math.sin(S.a), cy = Math.cos(S.a);
      const nx = S.x - sx * NOZ, ny = S.y - cy * NOZ;
      for (let i = 0; i < n; i++) {
        const p = P[pHead]; pHead = (pHead + 1) % MAXP;
        const sp = 10 + Math.random() * 5, j = (Math.random() - .5) * .5;
        p.on = true; p.x = nx; p.y = ny; p.z = (Math.random() - .5) * .2;
        p.vx = S.vx * .5 - (sx + j * cy) * sp; p.vy = S.vy * .5 - (cy - j * sx) * sp; p.vz = (Math.random() - .5) * 2;
        p.s = 0.6 + Math.random() * 0.8;
      }
    }
    let emitAcc = 0;
    function step() {
      prev = { x: S.x, y: S.y, a: S.a };
      const thr = state === 'play' && holding && S.fuel > 0;
      if (!thr && !S.flying) { stepDrops(); return; }
      const m = 0.35 + 0.65 * S.fuel;
      let ax = 0, ay = -G;
      if (thr) {
        S.fuel = Math.max(0, S.fuel - BURN * DT);
        ax += Math.sin(S.a) * THRUST / m; ay += Math.cos(S.a) * THRUST / m;
        S.w += 1.1 * DT;               // off-center thrust slowly tips the bottle forward
        S.flying = true;
        emitAcc += DT * 90; const n = emitAcc | 0; emitAcc -= n; if (n) emit(n);
      }
      const sp = Math.hypot(S.vx, S.vy);
      const k = 0.0025 / m;
      ax -= k * sp * S.vx; ay -= k * sp * S.vy;
      // weathervane: nose (cap end up) turns into the airflow
      if (sp > 1) { const tgt = Math.atan2(S.vx, S.vy); let d = tgt - S.a; d = Math.atan2(Math.sin(d), Math.cos(d)); S.w += d * Math.min(sp, 40) * 0.08 * DT; }
      S.w *= Math.exp(-1.2 * DT);
      S.vx += ax * DT; S.vy += ay * DT;
      S.x += S.vx * DT; S.y += S.vy * DT; S.a += S.w * DT;
      if (S.y > S.maxY) S.maxY = S.y;
      // ground: bottle treated as a capsule touching the ground at its lowest end
      const half = Math.abs(Math.cos(S.a)) * NOZ + Math.abs(Math.sin(S.a)) * R;
      const floor = S.x > -0.8 && S.x < 0.8 && !S.flying ? 0.3 : 0;
      if (S.y - half < floor) {
        S.y = floor + half;
        if (S.vy < 0) {
          if (S.vy < -4) { sfx.thud(Math.min(1, -S.vy / 20)); for (let i = 0; i < 6; i++) addSplat(S.x + (Math.random() - .5), (Math.random() - .5), 0.5 + Math.random()); }
          S.vy = -S.vy * 0.3;
        }
        S.vx *= Math.exp(-2.5 * DT);
        // topple toward lying flat
        const lie = Math.round(S.a / Math.PI) * Math.PI + (Math.sin(S.a) * Math.cos(S.a) >= 0 ? 1 : -1) * Math.PI / 2;

        if (S.flying && Math.hypot(S.vx, S.vy) < 0.4 && Math.abs(S.w) < 0.5) restT += DT; else restT = 0;
      } else restT = 0;
      if (S.flying && !thr) idleT += DT; else idleT = 0;
      if (state === 'play' && restT > 0.6 && (S.fuel <= 0 || idleT > 1.2)) finish();
      stepDrops();
    }
    function stepDrops() {
      for (let i = 0; i < MAXP; i++) {
        const p = P[i]; if (!p.on) continue;
        p.vy -= G * DT; p.vx *= 1 - 0.6 * DT;
        p.x += p.vx * DT; p.y += p.vy * DT; p.z += p.vz * DT;
        if (p.y < 0.05) { p.on = false; drops.setMatrixAt(i, hide); if (Math.random() < 0.5) addSplat(p.x, p.z, p.s * (0.6 + Math.random() * 0.6)); }
      }
    }

    // ---------- audio ----------
    let snd = store.get('snd', true);
    const sfx = { ctx: null, gain: null,
      init() {
        if (this.ctx) return;
        const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
        const ctx = this.ctx = new C();
        const buf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

        const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 700; f.Q.value = 0.8; this.f = f;
        this.gain = ctx.createGain(); this.gain.gain.value = 0;
        src.connect(f).connect(this.gain).connect(ctx.destination); src.start();
      },
      jet(on, fuel) {

        this.gain.gain.setTargetAtTime(on && snd ? 0.35 : 0, now, 0.03);
        this.f.frequency.setTargetAtTime(500 + (1 - fuel) * 900, now, 0.05);
      },
      thud(v) {

    function drawSnd() { $('wave').style.display = snd ? '' : 'none'; $('mute').style.display = snd ? 'none' : ''; }
    drawSnd();
    $('snd').addEventListener('click', () => { snd = !snd; store.set('snd', snd); drawSnd(); });

    // ---------- UI / language ----------
    let lastDist = 0, wasBest = false;
    function applyLang() {
      document.documentElement.lang = lang; document.title = t('title');
      $('back').textContent = t('back'); $('retry').textContent = t('retry'); $('post').textContent = t('post');
      $('lang').value = lang;
      if (state === 'result') showResult();
    }
    $('lang').addEventListener('change', e => { lang = e.target.value; store.set('lang', lang); applyLang(); });
    function showResult() {
      $('rDist').textContent = lastDist + 'm';
      $('rBest').innerHTML = wasBest ? `<span class="new">${t('newBest')}</span>` : `${t('best')} ${best}m`;
      const a = $('post');
      a.href = `https://x.com/intent/post?text=${encodeURIComponent(t('share')(lastDist) + '\n#ケチャップロケットゲーム')}&url=${encodeURIComponent(SHARE_URL)}`;
      if (coarse) { a.removeAttribute('target'); a.removeAttribute('rel'); } else { a.target = '_blank'; a.rel = 'noopener'; }
      $('result').classList.add('on');
    }
    function finish() {
      state = 'result'; holding = false; sfx.jet(false, 0);
      lastDist = Math.max(0, Math.round(S.x));
      wasBest = lastDist > best;
      if (wasBest) { best = lastDist; store.set('best', best); }
      flag.position.x = best; flag.visible = best > 0;
      setTimeout(showResult, 500);
    }
    function start() { reset(); clearFx(); state = 'play'; $('hint').style.display = 'none'; $('result').classList.remove('on'); }
    $('retry').addEventListener('click', e => { e.stopPropagation(); reset(); clearFx(); state = 'title'; $('hint').style.display = ''; $('result').classList.remove('on'); });
    flag.position.x = best; flag.visible = best > 0;
    applyLang();

    // ---------- input ----------
    const isUI = e => e.target.closest && e.target.closest('header, .card');
    function down() { sfx.init(); if (state === 'title') start(); if (state === 'play') holding = true; }
    function up() { holding = false; }
    addEventListener('pointerdown', e => { if (isUI(e)) return; e.preventDefault(); down(); }, { passive: false });
    addEventListener('pointerup', up); addEventListener('pointercancel', up); addEventListener('blur', up);
    addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) down(); } });
    addEventListener('keyup', e => { if (e.code === 'Space') up(); });
    addEventListener('touchmove', e => e.preventDefault(), { passive: false });
    addEventListener('contextmenu', e => e.preventDefault());

    // ---------- render loop ----------
    function resize() {
      const w = stage.clientWidth, h = stage.clientHeight;
      renderer.setSize(w, h, false); camera.aspect = w / h;

    let camX = 0, camY = 3, camZ = 12, lastFuel = -1, lastD = -1, lastJet = null;
    function render(alpha) {
      const x = prev.x + (S.x - prev.x) * alpha, y = prev.y + (S.y - prev.y) * alpha, a = prev.a + (S.a - prev.a) * alpha;
      bottle.position.set(x, y, 0); bottle.rotation.z = -a;
      const portrait = camera.aspect < 1;
      const tz = (portrait ? 16 : 11) + Math.min(y, 40) * 0.5;
      const tx = x + (portrait ? 1.5 : 4);
      camX += (tx - camX) * 0.12; camZ += (tz - camZ) * 0.05; camY += (Math.max(1.2, y * 0.85) - camY) * 0.1;
      camera.position.set(camX, camY, camZ); camera.lookAt(camX, camY + 2, 0);
      ground.position.x = camX;
      const base = Math.floor((camX - 60) / 10) * 10;
      markers.forEach((m, i) => { const mx = base + i * 10; m.position.x = mx; m.material = mx % 50 === 0 ? markerMat2 : markerMat; m.scale.z = mx % 50 === 0 ? 2 : 1; });
      clouds.forEach(c => { if (c.position.x < camX - 120) c.position.x += 250; if (c.position.x > camX + 130) c.position.x -= 250; });
      for (let i = 0; i < MAXP; i++) { const p = P[i]; if (!p.on) continue; tmpS.setScalar(p.s); tmpV.set(p.x, p.y, p.z); drops.setMatrixAt(i, tmpM.compose(tmpV, tmpQ.identity(), tmpS)); }
      drops.instanceMatrix.needsUpdate = true;
      renderer.render(scene, camera);
      // HUD (only touch DOM when values change)
      const f = Math.round(S.fuel * 200);
      if (f !== lastFuel) { lastFuel = f; $('fuel').firstChild.style.transform = `scaleX(${S.fuel})`; }
      const d = Math.max(0, Math.round(S.x));
      if (d !== lastD) { lastD = d; $('dist').textContent = d + 'm'; }
      const jet = state === 'play' && holding && S.fuel > 0;
      if (jet !== lastJet || jet) { lastJet = jet; sfx.jet(jet, S.fuel); }
    }
    let acc = 0, last = performance.now();
    step(); render(1); reset();
    function loop(now) {
      acc += Math.min(0.05, (now - last) / 1000); last = now;
      while (acc >= DT) { step(); acc -= DT; }
      render(acc / DT);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
