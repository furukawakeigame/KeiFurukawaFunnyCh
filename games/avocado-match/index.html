    // 結果カード用の質感も含めて先に準備しておく
    drawResultCard(); resultReady = false;
    renderer.compile(scene, camera);
    update(0);
    renderer.render(scene, camera);
    requestAnimationFrame(t0 => { last = t0; requestAnimationFrame(loop); });
  </script>
</body>
</html>
