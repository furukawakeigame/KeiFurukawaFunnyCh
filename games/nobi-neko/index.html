    // ---- コース ----
    const GOAL = 30;

    // ---- 猫の体 ----

    // ---- 3D ----
    const stage = document.getElementById('stage');
    const renderer = new THREE.WebGLRenderer({ antialias: true });

    renderer.shadowMap.enabled = true;

    stage.prepend(renderer.domElement);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xcfe6f2);
    scene.fog = new THREE.Fog(0xcfe6f2, 14, 34);
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
    scene.add(new THREE.HemisphereLight(0xffffff, 0xb59a7a, 1.4));
    const sun = new THREE.DirectionalLight(0xffffff, 1.6);
    sun.position.set(-3, 8, 5);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 20 });
    scene.add(sun, sun.target);

    const mat = c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.8 });
    // 床（穴の部分は抜く）
    const floorMat = mat(0xd9b98c), sideMat = mat(0xa9845a);
    let from = -12;
    for (const [g0, g1] of [...GAPS, [GOAL + 20, GOAL + 20]]) {
      const w = g0 - from;
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, 3, 2.4), [sideMat, sideMat, floorMat, sideMat, sideMat, sideMat]);
      m.position.set(from + w / 2, -1.5, 0);
      m.receiveShadow = true;
      scene.add(m);
      from = g1;
    }
    // 棚
    const wood = mat(0x8a5a34);
    for (const [s0, s1] of SHELVES) {
      const top = new THREE.Mesh(new THREE.BoxGeometry(s1 - s0, 0.14, 1.3), wood);
      top.position.set((s0 + s1) / 2, CEIL + 0.07, 0);
      top.castShadow = true;
      scene.add(top);
      for (const x of [s0 + 0.06, s1 - 0.06]) for (const z of [-0.6, 0.6]) {
        const p = new THREE.Mesh(new THREE.BoxGeometry(0.1, CEIL, 0.1), wood);
        p.position.set(x, CEIL / 2, z);
        p.castShadow = true;
        scene.add(p);
      }
    }
    // ゴールの旗
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 2.2), mat(0x555555));
    pole.position.set(GOAL, 1.1, -0.9);
    const flagShape = new THREE.Shape([new THREE.Vector2(0, 0), new THREE.Vector2(0.9, -0.3), new THREE.Vector2(0, -0.6)]);
    const flag = new THREE.Mesh(new THREE.ShapeGeometry(flagShape), new THREE.MeshStandardMaterial({ color: 0xd9472b, side: THREE.DoubleSide }));
    flag.position.set(GOAL, 2.15, -0.9);
    const line = new THREE.Mesh(new THREE.PlaneGeometry(0.25, 2.4), mat(0xffffff));
    line.rotation.x = -Math.PI / 2; line.position.set(GOAL, 0.005, 0);
    scene.add(pole, flag, line);

    const v = (x, y, z = 0) => new THREE.Vector3(x, y, z);
    // 猫（ラグドール: クリーム色の長毛、顔・耳・しっぽが濃い茶色、青い目、白い足先）
    // 毛はシェル法: 同じ形を少しずつ膨らませた層を重ね、穴の空いた模様で毛先を表す
    function canvasTex(w, h, paint) {
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      paint(cv.getContext('2d'), w, h);
      const tx = new THREE.CanvasTexture(cv);
      tx.colorSpace = THREE.SRGBColorSpace; tx.wrapS = tx.wrapT = THREE.RepeatWrapping;
      return tx;
    }
    const noiseBase = (() => {
      const cv = document.createElement('canvas'); cv.width = cv.height = 128;
      const g = cv.getContext('2d'), d = g.createImageData(128, 128);
      for (let i = 0; i < d.data.length; i += 4) { const n = Math.random() ** 1.6 * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = n; d.data[i + 3] = 255; }
      g.putImageData(d, 0, 0);
      return cv;
    })();
    function noiseTex(ru, rv) {
      const tx = new THREE.CanvasTexture(noiseBase);
      tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.repeat.set(ru, rv);
      return tx;
    }
    // 毛の流れ（細い筋）を足した色の模様
    function streaks(g, w, h, n = 500) {

        g.strokeStyle = Math.random() < 0.5 ? 'rgba(255,255,255,.18)' : 'rgba(90,60,40,.10)';

        g.moveTo(x, y); g.lineTo(x + (Math.random() - 0.5) * 3, y + 6 + Math.random() * 8); g.stroke();
      }
    }
    const SHELLS = 10;
    function addFur(mesh, len, noise) {
      mesh.userData.shells = [];
      for (let k = 1; k <= SHELLS; k++) {
        const f = k / SHELLS;
        const m = new THREE.MeshStandardMaterial({ map: mesh.material.map, color: mesh.material.color.clone().multiplyScalar(0.8 + 0.2 * f), roughness: 1, alphaMap: noise, alphaTest: 0.08 + f * 0.85 });

          sh.uniforms.uOff = off;
          sh.vertexShader = 'uniform float uOff;\n' + sh.vertexShader.replace('#include <begin_vertex>', 'vec3 transformed = position + normal * uOff; transformed.y -= uOff * uOff * 2.0;');
        };

        const s = new THREE.Mesh(mesh.geometry, m);
        mesh.add(s); mesh.userData.shells.push(s);

      mesh.castShadow = true;
      mesh.material.color.multiplyScalar(0.75);
      return mesh;
    }
    function setGeo(mesh, geo) {
      mesh.geometry.dispose();
      mesh.geometry = geo;
      for (const s of mesh.userData.shells) s.geometry = geo;
    }
    const furMat = (tex, c = 0xffffff) => new THREE.MeshStandardMaterial({ map: tex, color: c, roughness: 1 });
    const bodyTex = canvasTex(256, 128, (g, w, h) => {
      const gr = g.createLinearGradient(0, 0, w, 0);
      gr.addColorStop(0, '#d9c3a3'); gr.addColorStop(0.5, '#ece0cc'); gr.addColorStop(1, '#f7f0e4');
      g.fillStyle = gr; g.fillRect(0, 0, w, h); streaks(g, w, h, 900);
    });
    const tailTex = canvasTex(128, 64, (g, w, h) => {
      const gr = g.createLinearGradient(0, 0, w, 0);
      gr.addColorStop(0, '#9a7a5c'); gr.addColorStop(0.35, '#5e4331'); gr.addColorStop(1, '#3f2b1f');
      g.fillStyle = gr; g.fillRect(0, 0, w, h); streaks(g, w, h, 300);
    });
    // 顔: 球の u=0.5 が正面（+x）。目と鼻のまわりが濃い「マスク」
    const headTex = canvasTex(256, 128, (g, w, h) => {
      g.fillStyle = '#f2e8d8'; g.fillRect(0, 0, w, h);
      const m = g.createRadialGradient(w * 0.5, h * 0.52, 2, w * 0.5, h * 0.52, w * 0.17);
      m.addColorStop(0, '#4a3324'); m.addColorStop(0.55, '#6b4c37'); m.addColorStop(1, 'rgba(160,125,95,0)');
      g.fillStyle = m; g.fillRect(0, 0, w, h);
      // 額の白い V（ラグドールのミテッド柄）
      g.fillStyle = 'rgba(245,238,226,.9)';
      g.beginPath(); g.moveTo(w * 0.5, h * 0.52); g.lineTo(w * 0.46, h * 0.82); g.lineTo(w * 0.54, h * 0.82); g.fill();
      streaks(g, w, h, 400);
    });
    const seal = 0x4a3426;
    const solid = c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.9 });
    const catG = new THREE.Group();
    scene.add(catG);
    const bodyMesh = addFur(new THREE.Mesh(new THREE.BufferGeometry(), furMat(bodyTex)), 0.07, noiseTex(10, 4));
    const tailMesh = addFur(new THREE.Mesh(new THREE.BufferGeometry(), furMat(tailTex)), 0.11, noiseTex(8, 2));
    const capB = addFur(new THREE.Mesh(new THREE.SphereGeometry(R, 20, 14), furMat(bodyTex, 0xe2d0b4)), 0.07, noiseTex(6, 3));
    const capF = addFur(new THREE.Mesh(new THREE.SphereGeometry(R, 20, 14), furMat(bodyTex, 0xfaf4ea)), 0.07, noiseTex(6, 3));
    const tailTip = addFur(new THREE.Mesh(new THREE.SphereGeometry(0.085, 14, 10), furMat(tailTex, 0x6a5040)), 0.11, noiseTex(4, 2));
    catG.add(bodyMesh, tailMesh, capB, capF, tailTip);
    const head = new THREE.Group();
    const skull = addFur(new THREE.Mesh(new THREE.SphereGeometry(0.24, 28, 20), furMat(headTex)), 0.05, noiseTex(8, 4));
    skull.scale.set(1, 0.92, 1.05);
    // 胸のふさふさした白い毛
    const ruff = addFur(new THREE.Mesh(new THREE.SphereGeometry(0.2, 20, 14), furMat(bodyTex, 0xffffff)), 0.1, noiseTex(5, 3));
    ruff.position.set(-0.05, -0.2, 0);
    head.add(skull, ruff);
    const earGeo = new THREE.ConeGeometry(0.1, 0.19, 16);
    earGeo.scale(1, 1, 0.45);
    const innerGeo = new THREE.ConeGeometry(0.055, 0.12, 12);
    innerGeo.scale(1, 1, 0.3);
    for (const z of [-0.12, 0.12]) {
      const ear = new THREE.Mesh(earGeo, solid(seal));
      ear.position.set(-0.01, 0.24, z * 1.1); ear.rotation.set(z * 2.2, 0, -0.15);
      const inner = new THREE.Mesh(innerGeo, solid(0xd9a090));
      inner.position.set(0.02, -0.015, 0);
      ear.add(inner);
      head.add(ear);
      // 青い目と黒い瞳
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.042, 16, 12), new THREE.MeshStandardMaterial({ color: 0x3f8ae0, roughness: 0.15, emissive: 0x0a2a55 }));
      eye.position.copy(v(0.86, 0.2, z * 3.4).normalize().multiplyScalar(0.252));
      eye.scale.set(0.8, 0.85, 1);
      const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.02, 10, 8), solid(0x050505));
      pupil.position.set(0.03, 0, 0); pupil.scale.set(0.6, 1.2, 0.7);
      eye.add(pupil);
      head.add(eye);
    }
    const muzzle = new THREE.Mesh(new THREE.SphereGeometry(0.075, 14, 10), solid(0xd8c8b4));
    muzzle.position.set(0.26, -0.075, 0); muzzle.scale.set(0.6, 0.6, 1.2);
    const nose = new THREE.Mesh(new THREE.SphereGeometry(0.025, 10, 8), solid(0x8a5a55));
    nose.position.set(0.305, -0.035, 0); nose.scale.set(0.7, 0.7, 1.2);
    const wPts = [];
    for (const s of [-1, 1]) for (let i = 0; i < 3; i++) wPts.push(0.28, -0.08, s * 0.05, 0.31, -0.06 + i * 0.03 - 0.02, s * (0.3 + i * 0.02));
    const wGeo = new THREE.BufferGeometry();
    wGeo.setAttribute('position', new THREE.Float32BufferAttribute(wPts, 3));
    const whiskers = new THREE.LineSegments(wGeo, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 }));
    head.add(muzzle, nose, whiskers);
    catG.add(head);
    const legGeo = new THREE.CylinderGeometry(0.075, 0.06, 1, 12);
    legGeo.translate(0, -0.5, 0);
    const legs = [];
    for (let i = 0; i < 4; i++) {
      const l = new THREE.Mesh(legGeo, furMat(bodyTex, i < 2 ? 0xe8dccb : 0xcdb69a)); l.castShadow = true;
      const paw = addFur(new THREE.Mesh(new THREE.SphereGeometry(0.075, 14, 10), solid(0xfffaf2)), 0.03, noiseTex(4, 2));
      paw.scale.set(1.3, 0.8, 1);
      catG.add(l, paw);
      legs.push({ l, paw, front: i < 2, z: i % 2 ? 0.12 : -0.12 });
    }
    // 背骨の曲線（腰→肩）
    function spineCurve() {
      const phi = phiOf(cat.b), r = SPINE / (2 * phi), mid = (cat.bx + cat.fx) / 2;
      const pts = [];
      for (let i = 0; i <= 12; i++) { const a = -phi + 2 * phi * i / 12; pts.push(v(mid + r * Math.sin(a), LEG + r * (Math.cos(a) - Math.cos(phi)))); }
      return new THREE.CatmullRomCurve3(pts);
    }
    let time = 0;
    function updateCatMesh() {
      const c = spineCurve();
      setGeo(bodyMesh, new THREE.TubeGeometry(c, 32, R, 16, false));
      capB.position.copy(c.getPoint(0));
      capF.position.copy(c.getPoint(1));
      const hip = c.getPoint(0), sh = c.getPoint(1);
      const tng = c.getTangent(1);
      head.position.set(sh.x + 0.2 + tng.x * 0.05, sh.y + 0.24, 0);
      head.rotation.z = -0.15 + cat.b * 0.3;
      const w = Math.sin(time * 3) * 0.15;
      const tail = new THREE.CatmullRomCurve3([v(hip.x - 0.05, hip.y + 0.05), v(hip.x - 0.4, hip.y + 0.12, w * 0.4), v(hip.x - 0.75, hip.y + 0.3, w), v(hip.x - 0.95, hip.y + 0.55, w * 1.5)]);
      tailTip.position.copy(tail.getPoint(1));
      setGeo(tailMesh, new THREE.TubeGeometry(tail, 20, 0.085, 10, false));
      for (const g of legs) {
        const top = g.front ? sh : hip;
        const fx = g.front ? cat.fx : cat.bx;
        const lift = g.front ? cat.liftF : cat.liftB;
        const foot = v(fx + (g.front ? 0.02 : 0), 0.06 + lift, g.z);
        const from = v(top.x, top.y, g.z);
        const d = from.clone().sub(foot);
        g.l.position.copy(from);
        g.l.scale.set(1, d.length(), 1);
        g.l.quaternion.setFromUnitVectors(v(0, -1, 0), d.clone().negate().normalize());
        g.paw.position.copy(foot);
      }
      catG.position.y = -cat.drop;
    }

    // ---- 音 ----
    let actx = null;
    function beep(freq, dur, type = 'sine', vol = 0.15, slide = 0) {
      if (muted) return;
      actx ??= new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain(), now = actx.currentTime;
      o.type = type; o.frequency.setValueAtTime(freq, now);
      if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, now + dur);
      g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      o.connect(g).connect(actx.destination); o.start(now); o.stop(now + dur);
    }

    // ---- ゲーム進行 ----
    let state = 'title'; // title | play | result
    let pressed = false, running = false, startAt = 0, elapsed = 0, stun = 0, falling = null, lastTime = 0, newBest = false;
    const gauge = document.getElementById('gauge'), fill = gauge.querySelector('.fill'), dot = gauge.querySelector('.dot');
    const panel = document.getElementById('panel'), controls = document.getElementById('controls');

    function resetCat(x) {
      Object.assign(cat, { bx: x, fx: x + LMAX, b: 0, dir: 0, anchor: 'back', liftF: 0, liftB: 0, drop: 0, vy: 0 });
    }
    function start() {
      if (actx) actx.resume();
      resetCat(0);
      state = 'play'; running = false; elapsed = 0; stun = 0; falling = null; pressed = false;
      render();
    }
    const inGap = x => GAPS.some(([g0, g1]) => x > g0 + 0.04 && x < g1 - 0.04);
    function fall() {
      const gap = GAPS.find(([g0, g1]) => (cat.bx > g0 - 0.2 && cat.bx < g1 + 0.2) || (cat.fx > g0 - 0.2 && cat.fx < g1 + 0.2));
      falling = { t: 0, back: (gap ? gap[0] : cat.bx) - 2 };
      cat.vy = 0;
      beep(700, 0.7, 'triangle', 0.15, 0.25);
    }
    function bonk() {
      stun = 0.6;
      cat.bx -= 0.7; cat.fx = cat.bx + LMAX; cat.b = 0; cat.dir = 0; cat.anchor = 'back';
      beep(140, 0.25, 'square', 0.12, 0.6);
      if (inGap(cat.bx)) fall();
    }
    function finish() {
      state = 'result'; pressed = false;
      newBest = best === null || elapsed < best;
      if (newBest) { best = elapsed; store.set('best', best); }
      [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.25, 'triangle', 0.14), i * 110));
      render();
    }

    function step(dt) {
      time += dt;
      if (state === 'title') {
        // デモ: その場で丸まったり伸びたり
        cat.b = (1 - Math.cos(time * 2.4)) / 2;
        const L = spanOf(cat.b);
        cat.bx = -L / 2 + 0.3; cat.fx = cat.bx + L;
        return;
      }
      if (state !== 'play') return;
      if (running) elapsed = (performance.now() - startAt) / 1000;
      if (falling) {
        falling.t += dt; cat.vy += 14 * dt; cat.drop += cat.vy * dt;
        if (falling.t > 0.9) { resetCat(falling.back); falling = null; }
        return;
      }
      if (stun > 0) { stun -= dt; return; }
      const target = pressed ? 1 : 0;
      const prev = cat.b;
      cat.b += Math.sign(target - cat.b) * Math.min(Math.abs(target - cat.b), BEND_SPEED * dt);
      const dir = Math.sign(cat.b - prev);
      if (dir !== 0 && dir !== cat.dir) {
        cat.dir = dir;
        cat.anchor = dir > 0 ? 'front' : 'back';
        beep(dir > 0 ? 330 : 440, 0.06, 'sine', 0.08);
        if (inGap(dir > 0 ? cat.fx : cat.bx)) { fall(); return; }
      }
      const L = spanOf(cat.b);
      if (cat.anchor === 'front') cat.bx = cat.fx - L; else cat.fx = cat.bx + L;
      const moving = dir !== 0;
      cat.liftB += ((moving && cat.anchor === 'front' ? 0.12 : 0) - cat.liftB) * Math.min(1, dt * 20);
      cat.liftF += ((moving && cat.anchor === 'back' ? 0.12 : 0) - cat.liftF) * Math.min(1, dt * 20);
      // 棚に背中が当たったら押し戻される
      const c = spineCurve();
      for (let i = 0; i <= 16; i++) {
        const p = c.getPoint(i / 16);
        if (p.y + R > CEIL && SHELVES.some(([s0, s1]) => p.x > s0 - R && p.x < s1 + R)) { bonk(); return; }
      }
      if (cat.fx >= GOAL) finish();
    }

    let camX = 0;
    function draw() {
      updateCatMesh();
      const cx = (cat.bx + cat.fx) / 2;
      camX += (cx - camX) * 0.1;
      const narrow = camera.aspect < 0.8;
      camera.position.set(camX - (narrow ? 5.2 : 3.8), narrow ? 3.4 : 2.4, narrow ? 6.2 : 3.6);
      camera.lookAt(camX + (narrow ? 1.4 : 2.4), 0.4, 0);
      window.__iconCam?.(camera, camX);
      sun.position.set(camX - 3, 8, 5); sun.target.position.set(camX, 0, 0);
      flag.rotation.y = Math.sin(time * 4) * 0.2;
      const p = Math.max(0, Math.min(1, cat.fx / GOAL));
      fill.style.width = `${p * 100}%`;
      dot.style.left = `calc((100% - 22px) * ${p})`;
      renderer.render(scene, camera);
    }

    function resize() {
      const w = stage.clientWidth, h = stage.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / Math.max(1, h); camera.updateProjectionMatrix();
    }
    addEventListener('resize', resize);
    resize();

    function loop(now) {
      const dt = Math.min(0.05, (now - (lastTime || now)) / 1000);
      lastTime = now;
      step(dt); draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // ---- 入力 ----
    function press() {
      if (state !== 'play') return;
      if (actx) actx.resume();
      if (!running) { running = true; startAt = performance.now(); }
      pressed = true;
    }
    const release = () => { pressed = false; };
    stage.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
    addEventListener('pointerup', release);
    addEventListener('pointercancel', release);
    addEventListener('blur', release);
    stage.addEventListener('contextmenu', e => e.preventDefault());
    addEventListener('keydown', e => {
      if (e.code !== 'Space' && e.code !== 'Enter') return;
      e.preventDefault();
      if (e.repeat) return;
      if (state === 'play') press(); else if (e.code === 'Space' || e.code === 'Enter') start();
    });
    addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'Enter') release(); });

    // ---- 画面 ----
    const fmt = s => s.toFixed(2);
    function render() {
      document.documentElement.lang = lang;
      document.title = t('title');
      document.getElementById('back').textContent = t('back');
      document.getElementById('lang').value = lang;
      document.getElementById('sound').innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>${muted ? '<path d="M17 9l5 6M22 9l-5 6"/>' : '<path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>'}</svg>`;
      gauge.style.display = state === 'play' ? 'block' : 'none';
      panel.style.display = state === 'result' ? 'block' : 'none';
      if (state === 'result') {
        panel.querySelector('.time').textContent = t('sec')(fmt(elapsed));
        const b = panel.querySelector('.best');
        b.className = 'best' + (newBest ? ' new' : '');
        b.textContent = newBest ? t('newBest') : `${t('best')} ${t('sec')(fmt(best))}`;
      }
      controls.innerHTML = '';
      if (state === 'play') return;
      const b = document.createElement('button');
      b.className = 'go'; b.textContent = state === 'result' ? t('again') : t('start');
      b.addEventListener('click', start);
      controls.append(b);
      if (state === 'result') {
        const a = document.createElement('a');
        a.className = 'post'; a.textContent = t('post');
        a.href = `https://x.com/intent/post?text=${encodeURIComponent(t('share')(fmt(elapsed)))}&url=${encodeURIComponent(SHARE_URL)}`;
        if (!matchMedia('(pointer: coarse)').matches) { a.target = '_blank'; a.rel = 'noopener'; }
        controls.append(a);
      }
    }
    document.getElementById('lang').addEventListener('change', e => { lang = e.target.value; store.set('lang', lang); render(); });
    document.getElementById('sound').addEventListener('click', () => { muted = !muted; store.set('muted', muted); render(); });
    render();

    // アイコン作成・確認用
    window.__nobi = { cat, scene, camera, renderer, setState: s => { state = s; render(); }, draw };
  </script>
</body>
</html>
