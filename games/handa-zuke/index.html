  <script type="module">
    import * as THREE from 'three';

    const DICT = {
      ja: { title: 'はんだ付け', back: '← トップへ戻る', again: 'もう一度', post: 'Xに投稿', pts: n => `${n}点`, sec: s => `${s}秒`, share: (n, s) => `はんだ付けで${n}点（${s}秒） #はんだ付けゲーム` },

      en: { title: 'Soldering', back: '← Back to top', again: 'Play again', post: 'Post on X', pts: n => `${n} pts`, sec: s => `${s} s`, share: (n, s) => `I scored ${n} pts at soldering (${s} s) #はんだ付けゲーム` },
      th: { title: 'บัดกรี', back: '← กลับหน้าแรก', again: 'เล่นอีกครั้ง', post: 'โพสต์ลง X', pts: n => `${n} คะแนน`, sec: s => `${s} วินาที`, share: (n, s) => `บัดกรีได้ ${n} คะแนน (${s} วินาที) #はんだ付けゲーム` },
    };
    let lang = store.get('lang', null) || autoLang();
    const t = k => DICT[lang][k];
    const langSel = document.getElementById('lang');
    langSel.value = lang;
    langSel.addEventListener('change', () => { lang = langSel.value; store.set('lang', lang); applyLang(); langSel.blur(); });
    function applyLang() {
      document.documentElement.lang = lang;
      document.title = t('title');
      document.getElementById('back').textContent = t('back');
      renderControls();
      if (state === 'result') { showResult(); prepareShare(); }
    }

    // ---------- 音 ----------
    let soundOn = store.get('sound', true);
    const soundBtn = document.getElementById('sound');
    const drawSoundBtn = () => {
      soundBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>${soundOn ? '<path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>' : '<path d="M17 9l5 6M22 9l-5 6"/>'}</svg>`;
    };
    drawSoundBtn();
    soundBtn.addEventListener('click', () => { soundOn = !soundOn; store.set('sound', soundOn); drawSoundBtn(); if (master) master.gain.value = soundOn ? 1 : 0; soundBtn.blur(); });
    let ac = null, master = null, noiseBuf = null, sizzle = null;
    // iPhone の消音モードでも鳴らす
    function unmuteIOS() {
      try { if (navigator.audioSession) { navigator.audioSession.type = 'playback'; return; } } catch {}
      try {
        const n = 4410, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
        const w = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
        w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
        v.setUint32(24, 44100, true); v.setUint32(28, 88200, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
        const a = document.createElement('audio');
        a.src = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' })); a.loop = true; a.setAttribute('playsinline', '');
        a.play().catch(() => {});
      } catch {}
    }
    function initAudio() {
      if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
      unmuteIOS();
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        master = ac.createGain(); master.gain.value = soundOn ? 1 : 0; master.connect(ac.destination);
        noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
        const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        const o = ac.createOscillator(), g = ac.createGain(); g.gain.value = 0;
        o.connect(g).connect(master); o.start(); o.stop(ac.currentTime + 0.05);
        // はんだが溶ける「ジー」という音（ずっと鳴らして、音量だけ変える）
        const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
        const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2200;
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 5200; bp.Q.value = 0.7;
        const g2 = ac.createGain(); g2.gain.value = 0;

        sizzle = g2;
      } catch { ac = null; }
    }
    addEventListener('pointerdown', initAudio, { capture: true });
    addEventListener('keydown', initAudio, { capture: true });
    const live = () => ac && soundOn;
    function tone(type, f0, f1, dur, vol, delay = 0) {
      if (!live()) return;
      const now = ac.currentTime + delay;
      const o = ac.createOscillator(); o.type = type;
      o.frequency.setValueAtTime(f0, now); o.frequency.exponentialRampToValueAtTime(f1, now + dur);
      const g = ac.createGain(); g.gain.setValueAtTime(0.0001, now); g.gain.linearRampToValueAtTime(vol, now + 0.01); g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      o.connect(g).connect(master); o.start(now); o.stop(now + dur + 0.02);
    }
    // ノイズを共鳴に通す（[周波数, Q, 音量] の組）
    function burst(dur, bands, vol = 1, delay = 0) {
      if (!live()) return;
      const now = ac.currentTime + delay;
      const s = ac.createBufferSource(); s.buffer = noiseBuf; s.playbackRate.value = rnd(0.9, 1.1);
      const g = ac.createGain(); g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      for (const [f, q, a] of bands) {
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f * rnd(0.93, 1.07); bp.Q.value = q;
        const bg = ac.createGain(); bg.gain.value = a; s.connect(bp).connect(bg).connect(g);
      }
      g.connect(master); s.start(now, Math.random()); s.stop(now + dur + 0.02);
    }
    const sTouch = () => burst(0.035, [[3200, 5, 1], [7000, 3, 0.5]], 0.12);          // こて先が当たる「チッ」
    const sTap = () => burst(0.03, [[1800, 4, 1]], 0.08);                               // 冷たいランドにはんだが当たる
    const sJu = () => { burst(0.18, [[4500, 1.2, 1], [8000, 2, 0.6]], 0.35); };         // 溶け始めの「ジュッ」
    const sBridge = () => { burst(0.07, [[2600, 3, 1], [6200, 2, 0.7]], 0.55); tone('square', 220, 70, 0.07, 0.06); }; // パチッ
    const sLed = i => { tone('sine', 660 * Math.pow(1.19, i), 660 * Math.pow(1.19, i) * 1.01, 0.35, 0.09); tone('sine', 1320 * Math.pow(1.19, i), 1320 * Math.pow(1.19, i), 0.2, 0.03); };
    const sPuff = () => { burst(0.45, [[420, 1, 1], [900, 2, 0.4]], 0.35); burst(0.05, [[3000, 3, 1]], 0.2); };
    let sizzleK = 0;

    // ---------- three.js ----------
    const stage = document.getElementById('stage');
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(2, devicePixelRatio));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    stage.prepend(renderer.domElement);
    const scene = new THREE.Scene();
    // 金属（はんだ・ランド・こて）が映り込むよう、部屋の景色を環境マップにする
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    const canvasTex = (w, h, draw, rep) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; if (rep) { tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.repeat.set(rep[0], rep[1]); } tx.anisotropy = 8; return tx; };
    // 背景: 上ほど暗い作業場のグラデーション（遠くはかすませる）
    scene.background = canvasTex(4, 256, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#2a2420'); gr.addColorStop(1, '#5a4430'); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
    scene.fog = new THREE.Fog('#4a3828', 40, 90);
    const camera = new THREE.PerspectiveCamera(34, 1, 0.5, 200);
    const hemi = new THREE.HemisphereLight('#d4e8ff', '#6a4c32', 0.75);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight('#ffe4bc', 2.3); sun.position.set(6, 16, 9);
    sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
    Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 2, far: 50 });
    sun.shadow.normalBias = 0.02; sun.shadow.bias = -0.0004; sun.shadow.radius = 4;
    scene.add(sun);
    const mat = (color, roughness = 0.6, metalness = 0, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness, metalness, ...extra });

    // 机（木目）
    const woodTex = canvasTex(512, 512, (g, w, h) => {
      g.fillStyle = '#9a6c42'; g.fillRect(0, 0, w, h);
      for (let i = 0; i < 160; i++) {
        const y = Math.random() * h, a = rnd(0.03, 0.12), c = Math.random() < 0.5 ? `rgba(70,40,18,${a})` : `rgba(200,150,100,${a})`;
        g.strokeStyle = c; g.lineWidth = rnd(1, 4); g.beginPath();
        for (let x = 0; x <= w; x += 16) g.lineTo(x, y + Math.sin(x * 0.012 + i) * 6 + Math.sin(x * 0.05 + i * 3) * 1.5);
        g.stroke();
      }
      for (let k = 0; k < 3; k++) { const x = rnd(60, w - 60), y = rnd(60, h - 60); for (let r = 4; r < 30; r += 3) { g.strokeStyle = `rgba(60,32,14,${0.25 - r / 160})`; g.lineWidth = 1.5; g.beginPath(); g.ellipse(x, y, r * 2.4, r, 0, 0, 6.3); g.stroke(); } }
    }, [3, 3]);
    const desk = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), mat('#ffffff', 0.7, 0, { map: woodTex }));
    woodTex.repeat.set(5, 5);
    desk.rotation.x = -Math.PI / 2; desk.position.y = -0.17; desk.receiveShadow = true; scene.add(desk);
    // 作業マット（緑のゴム）
    const matTex = canvasTex(256, 256, (g, w, h) => {
      g.fillStyle = '#2f6b5a'; g.fillRect(0, 0, w, h);
      for (let i = 0; i < 1800; i++) { g.fillStyle = `rgba(${Math.random() < 0.5 ? '0,0,0' : '255,255,255'},${rnd(0.02, 0.06)})`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
      g.strokeStyle = 'rgba(220,240,230,.25)'; g.lineWidth = 1; for (let x = 0; x <= w; x += 32) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); g.beginPath(); g.moveTo(0, x); g.lineTo(w, x); g.stroke(); }
    }, [6, 4]);
    const workMat = new THREE.Mesh(new THREE.BoxGeometry(30, 0.12, 20), [mat('#2a5a4c', 0.9), mat('#2a5a4c', 0.9), mat('#ffffff', 0.85, 0, { map: matTex }), mat('#2a5a4c'), mat('#2a5a4c', 0.9), mat('#2a5a4c', 0.9)]);
    workMat.position.set(0, -0.11, 0.5); workMat.receiveShadow = true; scene.add(workMat);

    // ---------- 基板 ----------

    const BW = BX1 - BX0, BD = BZ1 - BZ0;
    const LED_COLORS = ['#ff3b30', '#ffb020', '#3ad65a', '#3a8cff', '#f4f4ff'];
    // LED（足を前に出して寝かせたもの）: [x, 足の z]
    const LED_POS = [[-2.6, 1.3], [0, 1.3], [2.6, 1.3], [-1.3, -1.5], [1.3, -1.5]];

    const joints = [];
    LED_POS.forEach(([x, z], i) => { for (const s of [-1, 1]) joints.push({ x: x + s * PITCH / 2, z, led: i, side: s }); });
    const BAT = { x: 2.95, z: -2.55 }, CATP = { x: -3.0, z: -2.5 };

    const boardCanvas = document.createElement('canvas'); boardCanvas.width = 1024; boardCanvas.height = Math.round(1024 * BD / BW);
    const boardTex = new THREE.CanvasTexture(boardCanvas); boardTex.colorSpace = THREE.SRGBColorSpace; boardTex.anisotropy = 8;
    const catImg = new Image(); catImg.src = 'cat.png'; catImg.onload = () => drawBoard();
    function drawBoard() {
      const g = boardCanvas.getContext('2d'), W = boardCanvas.width, H = boardCanvas.height, S = W / BW;
      const P = (x, z) => [(x - BX0) * S, (z - BZ0) * S];
      // ソルダーレジスト（緑）
      const gr = g.createLinearGradient(0, 0, W, H); gr.addColorStop(0, '#13612f'); gr.addColorStop(1, '#0f5229');
      g.fillStyle = gr; g.fillRect(0, 0, W, H);
