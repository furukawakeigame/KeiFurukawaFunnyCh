    // 施術ベッド

    // ---------- 患者（うつ伏せ） ----------

    let patMeshes = [], patient = null, headG = null;
    function makePatient() {
      while (breathe.children.length) breathe.remove(breathe.children[0]);
      const skin = mat(pick(SKIN), 0.55);
      const hairM = mat(pick(HAIR), 0.8);
      const towelTex = canvasTex(128, 128, (c, w, h) => { c.fillStyle = pick(TOWEL); c.fillRect(0, 0, w, h); c.fillStyle = 'rgba(0,0,0,.08)'; for (let y = 0; y < h; y += 16) c.fillRect(0, y, w, 6); for (let i = 0; i < 1500; i++) { c.fillStyle = `rgba(255,255,255,${Math.random() * 0.25})`; c.fillRect(Math.random() * w, Math.random() * h, 1, 2); } });
      towelTex.wrapS = towelTex.wrapT = THREE.RepeatWrapping; towelTex.repeat.set(2, 3);

      const Y = BED_Y + 0.01;
      const back = []; // 背中として扱う部分

      // 肩甲骨と背骨のくぼみ

      const hem = part(new THREE.CylinderGeometry(1, 1, 1, 28, 1, true), towel, 0, Y + 0.1, -0.03, 0.275, 0.05, 0.12, breathe); hem.rotation.x = Math.PI / 2;
      // 足の裏

      shade(breathe);

    }

    // ---------- ツボ ----------
    const TUBO_R = 0.075; // この中に刺されば点数
    const tubo = new THREE.Group();
    {
      const glowTex = canvasTex(128, 128, (c, w, h) => { const g = c.createRadialGradient(64, 64, 0, 64, 64, 64); g.addColorStop(0, 'rgba(255,230,140,1)'); g.addColorStop(0.5, 'rgba(255,170,60,.55)'); g.addColorStop(1, 'rgba(255,140,40,0)'); c.fillStyle = g; c.fillRect(0, 0, w, h); });
      const glow = new THREE.Mesh(new THREE.PlaneGeometry(TUBO_R * 3.2, TUBO_R * 3.2), new THREE.MeshBasicMaterial({ map: glowTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));

      const ringM = new THREE.MeshBasicMaterial({ color: '#ff8a3a', transparent: true, opacity: 0.85, depthWrite: false });
      for (const [r0, r1] of [[TUBO_R * 0.93, TUBO_R], [TUBO_R * 0.6, TUBO_R * 0.66], [0, TUBO_R * 0.2]]) { const m = new THREE.Mesh(new THREE.RingGeometry(r0, r1, 40), ringM); m.position.z = 0.0005; tubo.add(m); }
      tubo.renderOrder = 2;
    }
    const tuboLocal = new THREE.Vector3(), tuboWorld = new THREE.Vector3();
    function placeTubo() {
      // 背中のどこかを上から探る
      const rc = new THREE.Raycaster();
      breathe.updateMatrixWorld(true);
      for (let k = 0; k < 20; k++) {
        const x = rnd(-0.13, 0.13), z = rnd(-0.72, -0.15);
        rc.set(new THREE.Vector3(x, 2, z), new THREE.Vector3(0, -1, 0));
        const h = rc.intersectObject(patient.torso, false)[0];
        if (!h) continue;

        tuboLocal.copy(breathe.worldToLocal(h.point.clone().addScaledVector(n, 0.003)));

      }
    }

    // ---------- 鍼 ----------
    // 先端が原点、+z が進む向き（lookAt で向ける）
    const needle = new THREE.Group();
    {
      const steel = mat('#f4f7fa', 0.25, { metalness: 0.35 });
      const shaft = part(new THREE.CylinderGeometry(0.0035, 0.0012, 0.16, 8), steel, 0, 0, -0.08, 1, 1, 1, needle); shaft.rotation.x = Math.PI / 2;
      const copper = mat('#d9965a', 0.35, { metalness: 0.4 });
      const grip = part(new THREE.CylinderGeometry(0.009, 0.009, 0.07, 12), copper, 0, 0, -0.195, 1, 1, 1, needle); grip.rotation.x = Math.PI / 2;
      // 巻き線の模様
      for (let i = 0; i < 6; i++) { const r = part(new THREE.TorusGeometry(0.0095, 0.0018, 6, 14), copper, 0, 0, -0.165 - i * 0.011, 1, 1, 1, needle); }
      const cap = part(new THREE.SphereGeometry(0.01, 12, 8), copper, 0, 0, -0.232, 1, 1, 1, needle);
      shade(needle);
    }
    needle.scale.setScalar(2.2); // 見やすいように少し大きく
    scene.add(needle);
    const START = new THREE.Vector3(0, 1.32, 1.75);
    const pos = new THREE.Vector3(), prev = new THREE.Vector3(), vel = new THREE.Vector3(), aimOff = new THREE.Vector3();
    const GRAV = 9.8;

    // ---------- 粒（時間で消える） ----------
    const fx = [], dotG = new THREE.SphereGeometry(1, 8, 6);
    function burst(p, n, color, speed, size, life, up) {
      for (let k = 0; k < n; k++) {
        const m = new THREE.Mesh(dotG, new THREE.MeshBasicMaterial({ color, transparent: true, depthWrite: false }));
        const a = Math.random() * Math.PI * 2, sp = speed * (0.4 + Math.random() * 0.8);
        m.position.copy(p); m.scale.setScalar(size * (0.6 + Math.random() * 0.6));
        scene.add(m);
        fx.push({ m, v: new THREE.Vector3(Math.cos(a) * sp, up * (0.5 + Math.random()), Math.sin(a) * sp), t: 0, life, s0: m.scale.x, g: up > 0 ? 3 : 0 });
      }
    }
    function stepFx(dt) {
      for (let k = fx.length - 1; k >= 0; k--) {
        const f = fx[k]; f.t += dt;
        f.v.y -= dt * f.g; f.m.position.addScaledVector(f.v, dt);
        const q = f.t / f.life;

      }
    }

    // ---------- 画面サイズ ----------
    const CENTER = new THREE.Vector3(0, 0.75, 0.05);
    const controls = document.getElementById('controls');
    const KEY = [[-0.45, 0.62, -1.3], [0.45, 0.62, -1.3], [-0.45, 0.62, 1.1], [0.45, 0.62, 1.1], [0, 1.5, -1.8], [0, 1.25, 1.75]].map(a => new THREE.Vector3(...a));
    function resize() {
      const w = stage.clientWidth, H = stage.clientHeight;
      renderer.setSize(w, H, false);
      // 下の空白とボタンの所には大事な物を置かないので、その上の範囲にベッドを収める（描画は下まで）
      const btnH = Math.min(72, Math.max(56, 0.08 * Math.min(innerWidth, innerHeight))) + 12;
      const reserve = Math.max(0, stage.getBoundingClientRect().bottom - controls.getBoundingClientRect().bottom) + btnH;
      stage.style.setProperty('--reserve', reserve + 'px');
      const top = 50; // ヘッダー
      const h = Math.max(120, H - reserve - top);
      camera.aspect = w / h;
      camera.setViewOffset(w, h, 0, -top, w, H);
      // ベッド・鍼・ポスターの猫が全部入る一番近い距離を探す

      const dir = new THREE.Vector3(0, wide ? 0.62 : 1.05, 1).normalize(); // 横長では低めから見て、ベッドを大きく
      // 背の低い横長では結果を左に出すので、ベッドを少し右へ

      const place = d => {
        camera.position.copy(CENTER).addScaledVector(dir, d).add(new THREE.Vector3(side, 0, 0));
        camera.lookAt(CENTER.x + side, CENTER.y, CENTER.z);
        camera.updateProjectionMatrix(); camera.updateMatrixWorld();
      };

      let lo = 1, hi = 12;
      for (let k = 0; k < 24; k++) {
        const d = (lo + hi) / 2; place(d);

           const q = tmpV.copy(p).project(camera); return Math.abs(q.x) < 0.94 && q.y < yTop && q.y > yBot; });
        if (fits) hi = d; else lo = d;

      camera.updateProjectionMatrix();
      camera.updateMatrixWorld();

    // ---------- 入力: スワイプで投げる ----------
    const hint = document.getElementById('hint');
    let thrownOnce = store.get('thrown', false);
    let drag = null;
    const cv = renderer.domElement;
    cv.addEventListener('pointerdown', e => {
      e.preventDefault();
      if (state !== 'ready') return;
      cv.setPointerCapture?.(e.pointerId);
      drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, s: [{ x: e.clientX, y: e.clientY, t: performance.now() }] };
    }, { passive: false });
    cv.addEventListener('pointermove', e => {
      if (!drag || e.pointerId !== drag.id) return;
      drag.s.push({ x: e.clientX, y: e.clientY, t: performance.now() });
      if (drag.s.length > 40) drag.s.shift();
      const H = stage.clientHeight;
      aimOff.set((e.clientX - drag.x0) / H * 0.5, -(e.clientY - drag.y0) / H * 0.15, 0);
      aimOff.x = THREE.MathUtils.clamp(aimOff.x, -0.25, 0.25); aimOff.y = THREE.MathUtils.clamp(aimOff.y, -0.1, 0.1);
    });

      if (!drag || e.pointerId !== drag.id) return;
      const now = performance.now(), H = stage.clientHeight;
      drag.s.push({ x: e.clientX, y: e.clientY, t: now });
      // 離す直前 0.1 秒の動きで投げる
      const s = drag.s; let i = s.length - 1;

      const a = s[Math.max(0, i - 1)], b = s[s.length - 1], dtm = Math.max(16, b.t - a.t);

    stage.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

    function throwNeedle(vx, vy) {
      const vz = THREE.MathUtils.clamp(2.6 + vy * 0.6, 2, 8);
      vel.set(THREE.MathUtils.clamp(vx * 0.5, -3, 3), 0.35 * vz, -vz);

    const dirV = new THREE.Vector3();

      pos.copy(hit.point).addScaledVector(dirV, onBody ? 0.035 : 0.02);

        if (score > 0) {
          outcome = 'bliss';
          setTimeout(() => sBliss(patient.f0, score / 100), 120);
          burst(hit.point, 14 + Math.round(score / 6), '#ffd36a', 0.35, 0.012, 1.2, 0.25);
          squash = 0.001;
        } else {
          outcome = 'ouch';
          setTimeout(() => sOuch(patient.f0), 40);

          jumpV = 1.0; shake = 1;
        }
      } else {

        burst(hit.point, 6, '#c8b090', 0.4, 0.01, 0.5, 0.3);
      }
    }
    const tmpV = new THREE.Vector3();
    const STEP = 1 / 120;
    function step(dt) {
      clock += dt;
      stepFx(dt);
      // 呼吸: ゆっくり上下（ツボも一緒に動く）
      const br = Math.sin(clock * 1.7);
      breathe.position.y = br * 0.008 + jump;
      breathe.scale.y = 1 - squash * 0.12;
      breathe.position.x = Math.sin(clock * 50) * 0.01 * shake;
      if (squash > 0) squash = Math.min(1, squash + dt * 1.5);
      if (jumpV || jump) { jumpV -= dt * 9; jump = Math.max(0, jump + jumpV * dt); if (jump === 0 && jumpV < 0) jumpV = 0; }
      shake = Math.max(0, shake - dt * 2.5);

      tubo.userData.glow.scale.setScalar(pulse);
      if (headG) headG.rotation.z = outcome === 'bliss' ? Math.min(0.35, endT * 0.5) : 0;

      if (state === 'fly') {
        flyT += dt;
        prev.copy(pos);
        vel.y -= GRAV * dt;
        pos.addScaledVector(vel, dt);
        dirV.subVectors(pos, prev); const len = dirV.length();
        if (len > 0) {
          rc.set(prev, dirV.normalize()); rc.far = len + 0.001;
          breathe.updateMatrixWorld(true);
          const hit = rc.intersectObjects(patMeshes.concat(colliders), false)[0];
          if (hit) { stick(hit); return; }
        }
        if (pos.y < -0.5 || flyT > 4 || Math.abs(pos.x) > 6 || pos.z < -6) { state = 'stuck'; outcome = 'miss'; score = 0; endT = 0; }
      } else if (state === 'stuck') {
        endT += dt;
        if (endT > (outcome === 'bliss' ? 1.6 : 1.1)) finish();
      }
    }

    // ---------- 画面 ----------
    const resultEl = document.getElementById('result');
    function renderControls() {
      controls.innerHTML = '';
      controls.classList.toggle('hide', state !== 'result');
      if (state !== 'result') return;
      const b = document.createElement('button');
      b.className = 'go'; b.textContent = t('again');
      b.addEventListener('click', start);
      controls.append(b);
      const a = document.createElement('a');
      a.className = 'post'; a.textContent = t('post');
      a.href = `https://x.com/intent/post?text=${encodeURIComponent(t('share')(score))}&url=${encodeURIComponent(SHARE_URL)}`;
      const coarse = matchMedia('(pointer: coarse)').matches;
      if (!coarse) { a.target = '_blank'; a.rel = 'noopener'; }
      // スマホは画像ごと共有シートへ。PCは画像を保存してから投稿画面を開く
      a.addEventListener('click', e => {
        const text = t('share')(score);
        if (coarse && navigator.share) {
          e.preventDefault();
          const file = shareFile();
          const data = file && navigator.canShare?.({ files: [file] }) ? { files: [file], text: `${text}\n${SHARE_URL}` } : { text: `${text}\n${SHARE_URL}` };
          navigator.share(data).catch(() => {});
          return;
        }
        const img = resultImage();
        if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'acupuncture-darts.png'; d.click(); }
      });
      controls.append(a);
    }
    // 結果画像: 刺さった所を真ん中に切り抜き、点数を重ねる
    let snap = null, shareCache = null, needSnap = false;
    function takeSnap() {
      const src = renderer.domElement;
      const f = (outcome === 'miss' ? tuboWorld.copy(tubo.getWorldPosition(new THREE.Vector3())) : hitPoint).clone().project(camera);
      const fx2 = (f.x + 1) / 2 * src.width, fy = (1 - f.y) / 2 * src.height;
      const side = Math.min(src.width, src.height) * 0.8;
      const sx = THREE.MathUtils.clamp(fx2 - side / 2, 0, src.width - side), sy = THREE.MathUtils.clamp(fy - side * 0.6, 0, src.height - side);
      snap = document.createElement('canvas'); snap.width = snap.height = 1080;
      snap.getContext('2d').drawImage(src, sx, sy, side, side, 0, 0, 1080, 1080);
      shareCache = null;
    }
    function resultImage() {
      if (!snap) return null;
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const g = c.getContext('2d');
      g.drawImage(snap, 0, 0);
      g.textAlign = 'center'; g.fillStyle = '#fff'; g.lineJoin = 'round';
      const font = px => `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans Thai", sans-serif`;
      const text = (str, y, px, max) => {
        g.font = font(px);
        const w = g.measureText(str).width; if (w > max) { px *= max / w; g.font = font(px); }
        g.lineWidth = px * .16; g.strokeStyle = '#6b3d1c'; g.strokeText(str, 540, y); g.fillText(str, 540, y);
      };
      text(t('pts')(score), 960, 170, 960);
      text(t('title'), 90, 56, 900);
      return c;
    }
    function prepareShare() {
      if (!snap) return;
      const key = lang;
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'acupuncture-darts.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;
    function showResult() {
      resultEl.querySelector('b').textContent = t('pts')(score);
      resultEl.querySelector('i').style.transform = `scaleX(${score / 100})`;
    }
    function start() {
      if (needle.parent !== scene) scene.attach(needle);
      patient = makePatient();
      squash = 0; jump = 0; jumpV = 0; shake = 0; outcome = null; score = 0;
      breathe.position.set(0, 0, 0); breathe.scale.set(1, 1, 1);
      breathe.updateMatrixWorld(true);
      placeTubo();
      aimOff.set(0, 0, 0);
      state = 'ready';
      resultEl.style.display = 'none';
      hint.style.display = thrownOnce ? 'none' : 'block';
      renderControls(); resize();
    }
    function finish() {
      state = 'result';
      showResult();
      resultEl.style.display = 'flex';
      snap = null; needSnap = true;
      renderControls(); resize();
    }

    // ---------- ループ ----------
    let last = performance.now(), acc = 0;
    function render(alpha) {
      if (state === 'ready') {
        // 手前で浮いている鍼（指に少しついてくる）
        needle.position.copy(START).add(aimOff); needle.position.y += Math.sin(clock * 2.2) * 0.012;
        needle.lookAt(tmpV.copy(needle.position).add(new THREE.Vector3(aimOff.x * 0.6, -0.32, -1)));
      } else if (state === 'fly') {
        needle.position.lerpVectors(prev, pos, alpha);
        needle.lookAt(tmpV.copy(needle.position).add(vel));
      }
      renderer.render(scene, camera);
      if (needSnap) { needSnap = false; takeSnap(); prepareShare(); }
    }
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      acc += dt;
      while (acc >= STEP) { step(STEP); acc -= STEP; if (state !== 'fly' && state !== 'stuck' && acc > STEP * 8) acc = 0; }
      render(acc / STEP);
      requestAnimationFrame(loop);
    }

    // テスト用（自動確認から呼べるように）
    window.__hari = { throwNeedle, THREE, camera, renderer, scene, needle, tubo, get state() { return state; }, get score() { return score; }, get outcome() { return outcome; } };
    resize();
    start();
    applyLang();
    // 最初の1回が重くならないように、一度描いておく
    renderer.compile(scene, camera); renderer.render(scene, camera);
    requestAnimationFrame(t0 => { last = t0; loop(t0); });
  </script>
</body>
</html>
