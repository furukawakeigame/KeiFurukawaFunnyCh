  <script>
    const SHARE_URL = 'https://keifurukawafunnych.com/games/yama-ryukku/';
    const TAG = '#登山リュックゲーム';
    const I18N = {
      ja: { back: '← トップへ戻る', title: '登山リュック', start: 'スタート', go: '出発', retry: 'もう一回', post: 'Xに投稿',
        stage: n => n >= 10 ? '山頂' : `${n}合目`,
        share: n => n >= 10 ? '登山リュックで山頂まで登った！' : `登山リュックで${n}合目まで登った！` },
      ko: { back: '← 톱으로 돌아가기', title: '등산 배낭', start: '시작', go: '출발', retry: '다시 하기', post: 'X에 게시',
        stage: n => n >= 10 ? '정상' : `${n}합목`,
        share: n => n >= 10 ? '등산 배낭으로 정상까지 올랐다!' : `등산 배낭으로 ${n}합목까지 올랐다!` },
      en: { back: '← Back to top', title: 'Mountain Pack', start: 'Start', go: 'Go', retry: 'Retry', post: 'Post on X',
        stage: n => n >= 10 ? 'Summit' : `Stage ${n}/10`,
        share: n => n >= 10 ? 'I reached the summit in Mountain Pack!' : `I reached stage ${n}/10 in Mountain Pack!` },
      th: { back: '← กลับหน้าแรก', title: 'เป้ปีนเขา', start: 'เริ่ม', go: 'ออกเดินทาง', retry: 'เล่นอีกครั้ง', post: 'โพสต์ลง X',
        stage: n => n >= 10 ? 'ยอดเขา' : `ขั้นที่ ${n}/10`,
        share: n => n >= 10 ? 'ปีนถึงยอดเขาในเกมเป้ปีนเขา!' : `ปีนได้ถึงขั้นที่ ${n}/10 ในเกมเป้ปีนเขา!` },
    };
    const store = {
      get(k, d) { try { const v = localStorage.getItem('yama-ryukku:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
      set(k, v) { try { localStorage.setItem('yama-ryukku:' + k, JSON.stringify(v)); } catch {} },
    };
    const autoLang = () => { for (const l of navigator.languages?.length ? navigator.languages : [navigator.language || '']) { const c = l.toLowerCase().slice(0, 2); if (I18N[c]) return c; } return 'en'; };
    let lang = store.get('lang', null) || autoLang();
    const t = k => I18N[lang][k];

    // ---- 道具とトラブル ----
    const ITEMS = {
      umbrella: { cells: [[0,0],[0,1],[0,2]], color: '#4d8fd6' },
      helmet:   { cells: [[0,0],[1,0],[0,1],[1,1]], color: '#f0b429' },
      bell:     { cells: [[0,0]], color: '#c9a227' },
      rope:     { cells: [[0,0],[0,1],[0,2],[1,2]], color: '#b5793d' },
      light:    { cells: [[0,0],[1,0]], color: '#5b6573' },
      bottle:   { cells: [[0,0],[0,1]], color: '#3fa7a0' },
      jacket:   { cells: [[0,0],[1,0],[0,1],[1,1],[0,2],[1,2]], color: '#d64d4d' },
      onigiri:  { cells: [[0,0]], color: '#8a9a8f' },
    };
    const HAZ = { rain: 'umbrella', rock: 'helmet', bear: 'bell', cliff: 'rope', night: 'light', thirst: 'bottle', blizzard: 'jacket', hunger: 'onigiri' };
    const LOW = ['rain', 'bear', 'thirst', 'hunger', 'rock', 'rain', 'bear'];
    const HIGH = ['cliff', 'night', 'blizzard', 'rock', 'cliff', 'blizzard', 'thirst', 'hunger'];
    const GW = 6, GH = 5;
    const pick = a => a[Math.floor(Math.random() * a.length)];
    const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

    function shapeOf(type, rot) {
      let c = ITEMS[type].cells.map(p => p.slice());
      for (let r = 0; r < rot; r++) {
        const h = Math.max(...c.map(p => p[1])) + 1;
        c = c.map(([x, y]) => [h - 1 - y, x]);
      }
      return c;
    }
    const dims = cells => [Math.max(...cells.map(p => p[0])) + 1, Math.max(...cells.map(p => p[1])) + 1];

    // ---- 状態 ----
    let phase = 'title', hazards = [], hidden = new Set(), items = [];
    let climb = null, drag = null, flash = null, trayScale = 20, parts = [], shakeT = 0;

    function newGame() {
      hazards = [];
      for (let i = 0; i < 10; i++) hazards.push(pick(i < 4 ? LOW : i < 7 ? LOW.concat(HIGH) : HIGH));
      hidden = new Set(shuffle([...Array(10).keys()]).slice(0, 3));
      const types = hazards.map(h => HAZ[h]);
      const all = Object.keys(ITEMS);
      for (let i = 0; i < 4; i++) types.push(pick(all));
      items = shuffle(types).map(type => ({ type, rot: 0, gx: null, gy: null, tx: 0, ty: 0 }));
      climb = null; flash = null;
    }

    // ---- 描画準備 ----
    const cv = document.getElementById('cv'), stage = document.getElementById('stage');
    let ctx = cv.getContext('2d');
    let W = 0, H = 0, DPR = 1, L = {};
    function resize() {
      const r = stage.getBoundingClientRect();
      W = r.width; H = r.height; DPR = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
      layout();
    }
    function layout() {
      const portrait = H > W * 0.9, pad = 10, btnH = 64;
      if (climb) { // 登山中：上に場面、下にリュック
        if (portrait) {
          L.m = { x: 0, y: 0, w: W, h: H * 0.62 };
          const cs = Math.min((W - pad * 2) / GW, (H - L.m.h - 24) / (GH + 0.9), 48);
          L.cs = cs;
          L.g = { x: (W - cs * GW) / 2, y: L.m.h + Math.max(8, cs * 0.3) + 12, w: cs * GW, h: cs * GH };
        } else {
          L.m = { x: 0, y: 0, w: W * 0.62, h: H };
          const rw = W - L.m.w - pad * 2, cs = Math.min(rw / GW, (H - 40) / (GH + 0.9), 56);
          L.cs = cs;
          L.g = { x: L.m.w + pad + (rw - cs * GW) / 2, y: (H - cs * GH) / 2, w: cs * GW, h: cs * GH };
        }
        L.u = L.m.h / 10;
        L.tray = { x: 0, y: H, w: W, h: 0 };
        return;
      }
      if (portrait) {
        const mh = Math.min(H * 0.4, W * 0.95);
        L.m = { x: 0, y: 0, w: W, h: mh };
        const rest = H - mh - btnH;
        const cs = Math.min((W - pad * 2) / GW, rest * 0.55 / GH, 64);
        L.cs = cs;
        L.g = { x: (W - cs * GW) / 2, y: mh + Math.max(8, cs * 0.3) + 10, w: cs * GW, h: cs * GH };
        L.tray = { x: pad, y: L.g.y + L.g.h + cs * 0.3 + 18, w: W - pad * 2, h: H - btnH - (L.g.y + L.g.h + cs * 0.3 + 18) };
      } else {
        const mw = Math.min(W * 0.42, H * 1.1);
        L.m = { x: 0, y: 0, w: mw, h: H };
        const rw = W - mw - pad * 2, rest = H - btnH;
        const cs = Math.min(rw / GW, rest * 0.55 / GH, 64);
        L.cs = cs;
        L.g = { x: mw + pad + (rw - cs * GW) / 2, y: Math.max(8, cs * 0.3) + 16, w: cs * GW, h: cs * GH };
        L.tray = { x: mw + pad, y: L.g.y + L.g.h + cs * 0.3 + 18, w: rw, h: H - btnH - (L.g.y + L.g.h + cs * 0.3 + 18) };
      }
      packTray();
    }
    function packTray() {
      const a = L.tray, list = items.filter(it => it.gx === null && it !== drag?.it);
      let s = L.cs * 0.8;
      for (let k = 0; k < 40; k++) {
        const gap = s * 0.35;
        let x = a.x, y = a.y, rowH = 0;
        for (const it of list) {
          const [w, h] = dims(shapeOf(it.type, it.rot));
          if (x + w * s > a.x + a.w && x > a.x) { x = a.x; y += rowH + gap; rowH = 0; }
          it.tx = x; it.ty = y; x += w * s + gap; rowH = Math.max(rowH, h * s);
        }
        if (y + rowH <= a.y + a.h || s < 8) break;
        s *= 0.92;
      }
      // 行ごとに中央寄せはせず、左詰めのまま
      trayScale = s;
    }

    // ---- 山 ----
    const hash = (i, k) => { const v = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453; return v - Math.floor(v); };
    const TREES = Array.from({ length: 44 }, (_, i) => [hash(i, 1), hash(i, 2)]).sort((a, b) => b[1] - a[1]);
    function shade(hex, k) {
      const n = parseInt(hex.slice(1), 16), f = v => Math.round(k > 0 ? v + (255 - v) * k : v * (1 + k));
      return `rgb(${f(n >> 16)},${f(n >> 8 & 255)},${f(n & 255)})`;
    }
    function pathPt(p) {
      const m = L.m, base = m.y + m.h * 0.94, top = m.y + m.h * 0.16;
      const cx = m.x + m.w / 2, half = Math.min(m.w * 0.46, m.h * 0.75);
      const y = base - (p / 10) * (base - top);
      const hw = half * (1 - p / 10.3);
      return [cx + Math.sin(p * 1.35) * hw * 0.5 * (1 - p / 10), y];
    }
    // いま画面にかかっている天気（トラブル）と、その濃さ
    function weather() {
      const c = climb;
      if (!c || c.idx >= 10) return null;
      if (c.mode === 'hazard' || c.mode === 'fail') return { k: hazards[c.idx], a: Math.min(1, c.t / 0.4) };
      if (c.mode === 'walk2') return { k: hazards[c.idx], a: Math.max(0, 1 - c.t / 0.5) };
      return null;
    }
    function cloud(x, y, s) {
      ctx.beginPath();
      ctx.arc(x, y, s * 0.42, 0, 7); ctx.arc(x + s * 0.45, y - s * 0.22, s * 0.5, 0, 7); ctx.arc(x + s * 0.95, y, s * 0.38, 0, 7);
      ctx.rect(x, y - s * 0.05, s * 0.95, s * 0.43); ctx.fill();
    }
    function drawMountain(now) {
      const m = L.m, base = m.y + m.h * 0.98, peakY = m.y + m.h * 0.1;
      const cx = m.x + m.w / 2, half = Math.min(m.w * 0.48, m.h * 0.8), mh = base - peakY;
      const wx = weather(), T = now / 1000;
      ctx.save();
      ctx.beginPath(); ctx.rect(m.x, m.y, m.w, m.h); ctx.clip();
      // 空
      const sky = ctx.createLinearGradient(0, m.y, 0, m.y + m.h);
      sky.addColorStop(0, '#6fb0e3'); sky.addColorStop(0.55, '#bfe2f3'); sky.addColorStop(1, '#f6efdf');
      ctx.fillStyle = sky; ctx.fillRect(m.x, m.y, m.w, m.h);
      // 太陽
      const sx = m.x + m.w * 0.82, sy = m.y + m.h * 0.17, sr = m.h * 0.06;
      const glow = ctx.createRadialGradient(sx, sy, sr * 0.5, sx, sy, sr * 4);
      glow.addColorStop(0, 'rgba(255,240,190,.9)'); glow.addColorStop(1, 'rgba(255,240,190,0)');
      ctx.fillStyle = glow; ctx.fillRect(sx - sr * 4, sy - sr * 4, sr * 8, sr * 8);
      ctx.fillStyle = '#fff6d8'; ctx.beginPath(); ctx.arc(sx, sy, sr, 0, 7); ctx.fill();
      // 雲（ゆっくり流れる）
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      for (let i = 0; i < 4; i++) {
        const s = m.h * (0.12 + hash(i, 5) * 0.08), span = m.w + s * 2;
        const x = m.x - s * 1.5 + ((hash(i, 6) * span + T * (6 + i * 3)) % span), y = m.y + m.h * (0.08 + hash(i, 7) * 0.3);
        cloud(x, y, s);
      }
      // 奥の山なみ
      const range = (col, y0, amp, seed) => {
        ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(m.x, base);
        for (let i = 0; i <= 12; i++) { const x = m.x + m.w * i / 12; ctx.lineTo(x, y0 - amp * (0.4 + hash(i, seed) * 0.6) * (i % 2 ? 1 : 0.55)); }
        ctx.lineTo(m.x + m.w, base); ctx.fill();
      };
      range('#b4cfdc', m.y + m.h * 0.62, m.h * 0.22, 8);
      range('#94b8a8', m.y + m.h * 0.8, m.h * 0.2, 9);
      // 本体（左は日なた、右は日かげ）
      const ridgeX = cx + half * 0.08, at = k => peakY + mh * k, wAt = k => half * k;
      ctx.fillStyle = '#74a276';
      ctx.beginPath(); ctx.moveTo(cx - half, base); ctx.lineTo(cx, peakY); ctx.lineTo(ridgeX, base); ctx.fill();
      ctx.fillStyle = '#5a875f';
      ctx.beginPath(); ctx.moveTo(cx, peakY); ctx.lineTo(cx + half, base); ctx.lineTo(ridgeX, base); ctx.fill();
      // 岩の帯
      const rock = [[-0.56, 0.56], [-0.3, 0.5], [-0.12, 0.6], [0.08, 0.52], [0.3, 0.5], [0.56, 0.56]];
      ctx.fillStyle = '#a08d77';
      ctx.beginPath(); ctx.moveTo(cx, peakY); for (const [x, k] of rock) ctx.lineTo(cx + wAt(1) * x, at(k)); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#7f6d5b';
      ctx.beginPath(); ctx.moveTo(cx, peakY); ctx.lineTo(cx + wAt(0.56), at(0.56)); ctx.lineTo(cx + wAt(0.3), at(0.5)); ctx.lineTo(cx + wAt(0.08), at(0.52)); ctx.lineTo(cx + wAt(0.03), at(0.3)); ctx.fill();
      // 雪
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.moveTo(cx, peakY); ctx.lineTo(cx + wAt(0.2), at(0.2)); ctx.lineTo(cx + wAt(0.1), at(0.16)); ctx.lineTo(cx + wAt(0.02), at(0.24)); ctx.lineTo(cx - wAt(0.08), at(0.17)); ctx.lineTo(cx - wAt(0.21), at(0.21)); ctx.fill();
      ctx.fillStyle = '#d6e3ef';
      ctx.beginPath(); ctx.moveTo(cx, peakY); ctx.lineTo(cx + wAt(0.2), at(0.2)); ctx.lineTo(cx + wAt(0.1), at(0.16)); ctx.lineTo(cx + wAt(0.03), at(0.2)); ctx.fill();
      // 木
      for (const [a, b] of TREES) {
        const k = 0.62 + b * 0.36, hw = half * k * 0.92, x = cx + (a * 2 - 1) * hw, y = at(k);
        const ts = m.h * 0.035 * (0.7 + b * 0.6);
        ctx.fillStyle = x > ridgeX + (y - base) * 0.08 ? '#2f5a3b' : '#3e7049';
        ctx.beginPath(); ctx.moveTo(x, y - ts * 1.6); ctx.lineTo(x + ts * 0.55, y); ctx.lineTo(x - ts * 0.55, y); ctx.fill();
      }
      // 道
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.strokeStyle = 'rgba(150,118,84,.6)'; ctx.lineWidth = Math.max(3, m.h * 0.014);
      ctx.beginPath();
      for (let p = 0; p <= 10.001; p += 0.1) { const [x, y] = pathPt(p); p === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1.5; ctx.setLineDash([3, 5]); ctx.stroke(); ctx.setLineDash([]);
      if (climb) { // 歩いたところを色づける
        ctx.strokeStyle = '#e0743c'; ctx.lineWidth = Math.max(2.5, m.h * 0.01);
        ctx.beginPath();
        for (let p = 0; p <= climb.p + 0.001; p += 0.05) { const [x, y] = pathPt(Math.min(p, climb.p)); p === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
        ctx.stroke();
      }
      // 合目の印
      for (let i = 1; i <= 10; i++) {
        const [x, y] = pathPt(i);
        const reached = climb && climb.p >= i - 0.001;
        ctx.fillStyle = reached ? '#e0743c' : '#fff';
        ctx.strokeStyle = 'rgba(60,45,30,.35)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(x, y, Math.max(2.5, m.h * 0.012), 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      }
      // 山頂の旗（はためく）
      const [fx, fy] = pathPt(10), fs = m.h * 0.08, wave = Math.sin(T * 5) * fs * 0.06;
      ctx.strokeStyle = '#3b3b3b'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx, fy - fs); ctx.stroke();
      ctx.fillStyle = '#e0743c';
      ctx.beginPath(); ctx.moveTo(fx, fy - fs); ctx.quadraticCurveTo(fx + fs * 0.35, fy - fs - wave, fx + fs * 0.7, fy - fs * 0.78 + wave); ctx.quadraticCurveTo(fx + fs * 0.35, fy - fs * 0.62 - wave, fx, fy - fs * 0.56); ctx.fill();
      // 天気
      if (wx) drawWeather(wx.k, wx.a, T, m);
      // 予告
      const r = Math.max(10, Math.min(m.h * 0.042, m.w * 0.05));
      for (let i = 0; i < hazards.length; i++) {
        const [x0, y0] = pathPt(i + 0.5);
        const side = i % 2 ? 1 : -1;
        const x = x0 + side * r * 1.9, y = y0;
        const done = climb && (climb.idx > i || (climb.idx === i && climb.mode === 'walk2'));
        const active = climb && climb.idx === i && (climb.mode === 'hazard' || climb.mode === 'fail');

        const hk = drawHikerSide(hx, gy, s, o);
        if (growl > 0.05) {
          ctx.strokeStyle = `rgba(214,77,77,${growl})`; ctx.lineWidth = 2.5;
          for (let i = 0; i < 3; i++) { ctx.beginPath(); const y0 = gy - s * (0.45 + i * 0.08); for (let x = 0; x < s * 0.35; x += 3) ctx.lineTo(hx + s * 0.25 + x, y0 + Math.sin(x * 0.5 + T * 20) * 3); ctx.stroke(); }
        }
        if (has && F > 0.5 && U < 0.85) {
          const bites = Math.min(3, Math.floor(clamp((U - 0.25) / 0.6) * 4)), sc = 1 - bites / 3;
          if (sc > 0) {
            const [ox, oy] = hk.hand, r = s * 0.15 * (0.5 + 0.5 * sc);
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(ox, oy - r); ctx.lineTo(ox + r, oy + r * 0.8); ctx.lineTo(ox - r, oy + r * 0.8); ctx.fill();
            ctx.fillStyle = '#1f2a24'; ctx.fillRect(ox - r * 0.4, oy + r * 0.2, r * 0.8, r * 0.6);
          }
          if (U > 0.25) for (let i = 0; i < 3; i++) { const ph = (T * 2.5 + i / 3) % 1; ctx.fillStyle = `rgba(255,255,255,${1 - ph})`; ctx.fillRect(hk.head[0] + s * 0.15 + i * 3, hk.head[1] + s * 0.12 + ph * s * 0.6, 3, 3); }
        }
        if (has && U > 0.85) { ctx.globalAlpha = 1 - (U - 0.85) / 0.15; star(hk.head[0], hk.head[1] - s * 0.35, u * 0.4, '#fff6c0'); ctx.globalAlpha = 1; }
      }
      // 道具がリュックから手元へ飛ぶ
      if (has && c.from && F > 0 && F < 1) {
        const [fx, fy] = c.from, [tx, ty] = hiker.hand, e = ease(F);
        const x = mix(fx, tx, e), y = mix(fy, ty, e) - Math.sin(F * Math.PI) * u * 2.5;
        ctx.save(); ctx.fillStyle = '#fff'; ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = 8;
        ctx.beginPath(); ctx.arc(x, y, u * 0.55, 0, 7); ctx.fill(); ctx.restore();
        ctx.save(); ctx.beginPath(); ctx.arc(x, y, u * 0.48, 0, 7); ctx.fillStyle = ITEMS[c.item.type].color; ctx.fill(); ctx.restore();
        drawGlyph(c.item.type, x, y, u * 0.8);
      }
      // 道具がないときは赤い点滅
      if (!has && X > 0.25 && X < 0.6) { ctx.fillStyle = `rgba(214,77,77,${0.3 * (1 - (X - 0.25) / 0.35)})`; ctx.fillRect(m.x, m.y, m.w, m.h); }
    }

    // ---- ループ ----
    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      update(dt);
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      const bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, '#eef4f1'); bg.addColorStop(1, '#dbe8df');
      ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
      if (shakeT > 0) ctx.translate((Math.random() - 0.5) * shakeT * 24, (Math.random() - 0.5) * shakeT * 24);
      if (climb) {
        drawScene(now);
        drawGrid();
        drawParts();
      } else if (phase !== 'title') {
        drawBoard();
        drawGrid();
        if (phase === 'pack') { ctx.fillStyle = 'rgba(255,255,255,.5)'; rr(L.tray.x - 6, L.tray.y - 6, L.tray.w + 12, L.tray.h + 6, 16); ctx.fill(); }
        if (phase === 'pack') for (const it of items) if (it.gx === null && it !== drag?.it) drawItem(it, it.tx, it.ty, trayScale);
        if (drag) {
          const s = L.cs, g = L.g, ox = drag.px - drag.fx * s, oy = drag.py - drag.fy * s;
          const gx = Math.round((ox - g.x) / s), gy = Math.round((oy - g.y) / s);
          if (drag.moved && fits(drag.it, gx, gy, drag.it.rot)) {
            ctx.globalAlpha = 0.25;
            for (const [x, y] of shapeOf(drag.it.type, drag.it.rot)) { ctx.fillStyle = ITEMS[drag.it.type].color; ctx.fillRect(g.x + (gx + x) * s, g.y + (gy + y) * s, s, s); }
            ctx.globalAlpha = 1;
          }
          if (drag.moved) drawItem(drag.it, ox, oy, s, 0.92);
          else if (drag.wasGrid) drawItem(drag.it, g.x + drag.it.gx * s, g.y + drag.it.gy * s, s);
          else drawItem(drag.it, drag.it.tx, drag.it.ty, trayScale);
        }
      } else {
        L.m = { x: 0, y: 0, w: W, h: H }; drawMountain(now); layout();
      }
      requestAnimationFrame(frame);
    }

    // ---- 音 ----
    let actx = null, muted = store.get('muted', false);
    function ensureAudio() {
      if (actx) return;
      try {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        const g = actx.createGain(); g.gain.value = 0; g.connect(actx.destination);
        const o = actx.createOscillator(); o.connect(g); o.start(); o.stop(actx.currentTime + 0.02);
      } catch {}
    }
    function tone(f, d, type = 'sine', v = 0.15, at = 0, f2) {
      if (!actx || muted) return;
      const t0 = actx.currentTime + at, o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + d);
      g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + d);
      o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + d);
    }
    function sfx(k) {
      if (k === 'put') tone(520, 0.08, 'triangle');
      else if (k === 'rot') tone(700, 0.05, 'triangle', 0.08);
      else if (k === 'alert') { tone(880, 0.1, 'square', 0.06); tone(880, 0.1, 'square', 0.06, 0.15); }
      else if (k === 'ok') { tone(660, 0.1, 'triangle'); tone(990, 0.15, 'triangle', 0.15, 0.08); }
      else if (k === 'ng') tone(300, 0.6, 'sawtooth', 0.12, 0, 80);
      else if (k === 'win') [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.25, 'triangle', 0.15, i * 0.12));
    }
    const soundBtn = document.getElementById('sound');
    function drawSound() {
      soundBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>${muted ? '<path d="M17 9l5 6M22 9l-5 6"/>' : '<path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>'}</svg>`;
    }
    soundBtn.onclick = () => { muted = !muted; store.set('muted', muted); drawSound(); };

    // ---- 画面・文言 ----
    let resultN = 0;
    const $ = id => document.getElementById(id);
    function ui() {
      document.documentElement.lang = lang;
      document.title = t('title');
      $('back').textContent = t('back');
      $('titleText').textContent = t('title');
      $('start').textContent = t('start');
      $('go').textContent = t('go');
      $('retry').textContent = t('retry');
      $('post').textContent = t('post');
      $('resNum').textContent = t('stage')(resultN);
      $('title').style.display = phase === 'title' ? 'flex' : 'none';
      $('go').style.display = phase === 'pack' ? 'block' : 'none';
      $('result').style.display = phase === 'result' ? 'flex' : 'none';
      const a = $('post');
      a.href = `https://x.com/intent/post?text=${encodeURIComponent(t('share')(resultN) + ' ' + TAG)}&url=${encodeURIComponent(SHARE_URL)}`;
      if (matchMedia('(pointer: coarse)').matches) { a.removeAttribute('target'); a.removeAttribute('rel'); }
      else { a.target = '_blank'; a.rel = 'noopener'; }
    }
    function showResult(n) { resultN = n; phase = 'result'; ui(); }
    $('lang').value = lang;
    $('lang').onchange = e => { lang = e.target.value; store.set('lang', lang); ui(); };
    $('start').onclick = () => { ensureAudio(); newGame(); phase = 'pack'; layout(); ui(); };
    $('retry').onclick = () => { newGame(); phase = 'pack'; layout(); ui(); };
    $('go').onclick = () => { ensureAudio(); startClimb(); };

    addEventListener('resize', resize);
    newGame(); hazards = []; resize(); drawSound(); ui();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
