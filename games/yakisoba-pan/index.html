  <script type="module">
    import * as THREE from 'three';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    window.__ok = true;

    // ---------- 言葉 ----------
    const REELS = [
      { ja: ['焼き', '揚げ', '蒸し', '煮', '炒め', '生', '燻製', '冷やし'],
        en: ['Grilled', 'Fried', 'Steamed', 'Boiled', 'Stir-fried', 'Raw', 'Smoked', 'Chilled'],
        ko: ['구운', '튀긴', '찐', '조린', '볶은', '생', '훈제', '차가운'],
        th: ['ย่าง', 'ทอด', 'นึ่ง', 'ต้ม', 'ผัด', 'ดิบ', 'รมควัน', 'เย็น'] },
      { ja: ['そば', 'うどん', 'ラーメン', 'カレー', 'プリン', '納豆', '餃子', 'たこ'],
        en: ['Noodle', 'Udon', 'Ramen', 'Curry', 'Pudding', 'Natto', 'Gyoza', 'Octopus'],
        ko: ['소바', '우동', '라멘', '카레', '푸딩', '낫토', '교자', '문어'],
        th: ['โซบะ', 'อุด้ง', 'ราเมง', 'แกงกะหรี่', 'พุดดิ้ง', 'นัตโตะ', 'เกี๊ยวซ่า', 'ปลาหมึก'] },
      { ja: ['パン', 'ご飯', 'せんべい', 'まん', 'ピザ', 'もなか', 'クレープ', 'ちくわ'],
        en: ['Bread', 'Rice', 'Cracker', 'Bun', 'Pizza', 'Monaka', 'Crepe', 'Chikuwa'],
        ko: ['빵', '밥', '센베이', '만두', '피자', '모나카', '크레이프', '치쿠와'],
        th: ['ขนมปัง', 'ข้าว', 'เซมเบ้', 'ซาลาเปา', 'พิซซ่า', 'โมนากะ', 'เครป', 'ชิคุวะ'] },
    ];
    const N = 8;
    const DICT = {
      ja: { title: '焼きそばパン', back: '← トップへ戻る', start: 'スタート', again: 'もう一回', stop: 'ストップ',
            post: 'Xに投稿', count: n => `${n}回目`, name: w => w.join(''),
            share: w => `「${w.join('')}」ができた #焼きそばパンゲーム` },
      en: { title: 'Yakisoba Bread', back: '← Back to top', start: 'START', again: 'AGAIN', stop: 'STOP',
            post: 'Post', count: n => `Spin #${n}`, name: w => w.join(' '),
            share: w => `I made "${w.join(' ')}" #焼きそばパンゲーム` },
      ko: { title: '야키소바빵', back: '← 처음으로', start: '시작', again: '한 번 더', stop: '정지',
            post: 'X에 게시', count: n => `${n}번째`, name: w => w.join(' '),
            share: w => `「${w.join(' ')}」 완성 #焼きそばパンゲーム` },
      // タイ語は「パン・そば・焼き」の順に並べる
      th: { title: 'ขนมปังยากิโซบะ', back: '← กลับหน้าแรก', start: 'เริ่ม', again: 'อีกครั้ง', stop: 'หยุด',
            post: 'โพสต์ลง X', count: n => `ครั้งที่ ${n}`, name: w => [...w].reverse().join(''),
            share: w => `ได้ "${[...w].reverse().join('')}" แล้ว #焼きそばパンゲーム` },
    };
    const SHARE_URL = 'https://keifurukawafunnych.com/games/yakisoba-pan/';
    const store = {
      get(k, d) { try { const v = localStorage.getItem('yakisoba-pan:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
      set(k, v) { try { localStorage.setItem('yakisoba-pan:' + k, JSON.stringify(v)); } catch {} },
    };
    let lang = store.get('lang', ['ja', 'ko', 'th'].find(l => navigator.language.startsWith(l)) || 'en');
    if (!DICT[lang]) lang = 'en';
    let muted = store.get('muted', false);
    const t = k => DICT[lang][k];

    // ---------- three.js ----------
    const stage = document.getElementById('stage');
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.9;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    stage.prepend(renderer.domElement);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xfbf3e4);
    const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 100);
    scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environmentIntensity = 0.45;
    scene.add(new THREE.HemisphereLight(0xffffff, 0xb59a74, 0.6));
    const sun = new THREE.DirectionalLight(0xfff4e0, 2.0);
    sun.position.set(2, 5, 6);
    scene.add(sun);

    // ---------- リール（横向きの円筒） ----------
    const R = 0.9, LEN = 2, GAP = 2.15, DRUM_Y = -1.55;
    const STEP = Math.PI * 2 / N;
    const SPEED = [17, 18.5, 20]; // rad/s ≒ 1秒に 20 コマ以上
    function drumTexture(words) {
      const W = 1440, H = 512, col = W / N;
      const c = document.createElement('canvas');
      c.width = W; c.height = H;
      const g = c.getContext('2d');
      g.fillStyle = '#fffaf0'; g.fillRect(0, 0, W, H);
      for (let i = 0; i < N; i++) {
        g.fillStyle = i % 2 ? '#fff3dc' : '#fffaf0';
        g.fillRect(i * col, 0, col, H);
        g.save();
        g.translate((i + 0.5) * col, H / 2);
        g.rotate(-Math.PI / 2);
        const w = words[i];
        let size = 120;
        g.font = `900 ${size}px system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif`;
        const mw = g.measureText(w).width;
        if (mw > H * 0.86) size *= H * 0.86 / mw;
        g.font = `900 ${size}px system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif`;
        g.fillStyle = '#3a2a1a'; g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText(w, 0, size * 0.04);
        g.restore();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      return tex;
    }
    const drums = [0, 1, 2].map(i => {
      const pivot = new THREE.Group();
      pivot.position.set((i - 1) * GAP, DRUM_Y, 0);
      const mat = new THREE.MeshStandardMaterial({ roughness: 0.6 });
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(R, R, LEN, 64, 1, true), mat);
      mesh.rotation.z = -Math.PI / 2;
      pivot.add(mesh);
      const capMat = new THREE.MeshStandardMaterial({ color: 0xc23a22, roughness: 0.5 });
      for (const s of [-1, 1]) {
        const cap = new THREE.Mesh(new THREE.CylinderGeometry(R + 0.06, R + 0.06, 0.08, 48), capMat);
        cap.rotation.z = Math.PI / 2;
        cap.position.x = s * (LEN / 2 + 0.04);
        pivot.add(cap);
      }
      scene.add(pivot);
      // 当たり窓の上下の線
      for (const s of [-1, 1]) {
        const bar = new THREE.Mesh(new THREE.BoxGeometry(LEN + 0.1, 0.05, 0.05), new THREE.MeshBasicMaterial({ color: 0xc23a22 }));
        const a = STEP / 2 * s;
        bar.position.set((i - 1) * GAP, DRUM_Y + Math.sin(a) * (R + 0.05), Math.cos(a) * (R + 0.05));
        scene.add(bar);
      }
      return { pivot, mat, theta: 0.5 * STEP, spinning: false, target: null, index: 0, bounce: 0 };
    });
    // θ = (n + 0.5) * STEP で、正面の言葉は (-n - 1) mod N
    const thetaFor = idx => ((-idx - 1) + 0.5) * STEP;
    const indexFor = theta => { const n = Math.round(theta / STEP - 0.5); return ((-n - 1) % N + N) % N; };
    function setDrumTextures() {
      drums.forEach((d, i) => { if (d.mat.map) d.mat.map.dispose(); d.mat.map = drumTexture(REELS[i][lang]); d.mat.needsUpdate = true; });
    }
    drums.forEach(d => { d.theta = thetaFor(0) + STEP * N * 10; d.index = 0; });

    // ---------- 食べ物 ----------
    // 料理は別のシーンに置き、テーブルの高さから見上げるカメラで写す
    const foodScene = new THREE.Scene();
    const foodCam = new THREE.PerspectiveCamera(24, 1, 0.1, 100);
    foodScene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
    foodScene.environmentIntensity = 0.55;
    foodScene.background = (() => {
      const c = document.createElement('canvas'); c.width = 64; c.height = 256;
      const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
      gr.addColorStop(0, '#fbf3e4'); gr.addColorStop(1, '#ecd4ad');
      g.fillStyle = gr; g.fillRect(0, 0, 64, 256);
      const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
    })();
    {
      const key = new THREE.DirectionalLight(0xfff0d8, 2.6);
      key.position.set(-3, 6, 2);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      key.shadow.camera.left = key.shadow.camera.bottom = -3;
      key.shadow.camera.right = key.shadow.camera.top = 3;
      key.shadow.radius = 4; key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02;
      const rim = new THREE.DirectionalLight(0xffe2b0, 2.2);
      rim.position.set(3, 3, -5);
      foodScene.add(key, rim, new THREE.HemisphereLight(0xfff6e8, 0x8a6a48, 0.5));
    }
    // 木のテーブル
    const table = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ roughness: 0.55, map: (() => {
      const c = document.createElement('canvas'); c.width = c.height = 512;
      const g = c.getContext('2d');
      g.fillStyle = '#9a6a3e'; g.fillRect(0, 0, 512, 512);
      for (let k = 0; k < 220; k++) {
        const y = Math.random() * 512, v = Math.random();
        g.strokeStyle = `rgba(${v < 0.5 ? '70,40,18' : '190,140,90'},${0.05 + Math.random() * 0.15})`;
        g.lineWidth = 1 + Math.random() * 4;
        g.beginPath(); g.moveTo(0, y);
        for (let x = 0; x <= 512; x += 32) g.lineTo(x, y + Math.sin(x * 0.01 + k) * 6);
        g.stroke();
      }
      const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
      t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(25, 25); return t;
    })() }));
    table.rotation.x = -Math.PI / 2; table.position.y = -0.1; table.receiveShadow = true;
    foodScene.add(table);
    const plate = new THREE.Mesh(new THREE.LatheGeometry([[0, 0], [1.3, 0], [1.45, 0.05], [1.62, 0.12], [1.6, 0.13], [1.4, 0.07], [0, 0.07]].map(([x, y]) => new THREE.Vector2(x, y - 0.1)), 96),
      new THREE.MeshPhysicalMaterial({ color: 0xfbfbf8, roughness: 0.12, clearcoat: 1 }));
    plate.receiveShadow = true; plate.castShadow = true;
    const foodRoot = new THREE.Group();
    foodScene.add(foodRoot);
    let food = null, foodSpin = 0, foodPop = 1;
    const foodBox = new THREE.Box3();
    const fx = []; // 湯気・氷

    const M = (color, o = {}) => new THREE.MeshPhysicalMaterial({ color, roughness: 0.65, ...o });
    const mesh = (geo, mat, x = 0, y = 0, z = 0) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); return m; };
    const rnd = (a, b) => a + Math.random() * (b - a);

    // 焼き色などのムラ（白〜灰色の斑点。色に掛け合わせる）
    const speckle = (() => {
      const c = document.createElement('canvas'); c.width = c.height = 512;
      const g = c.getContext('2d');
      g.fillStyle = '#fff'; g.fillRect(0, 0, 512, 512);
      for (let k = 0; k < 2500; k++) {
        const v = 200 + Math.random() * 55 | 0;
        g.fillStyle = `rgba(${v},${v * 0.97 | 0},${v * 0.92 | 0},0.5)`;
        g.beginPath(); g.arc(Math.random() * 512, Math.random() * 512, 1 + Math.random() * 6, 0, 7); g.fill();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    })();
    // 3D のなめらかなノイズ（形のゆがみ・焼きムラ用）
    const PERM = new Uint8Array(512);
    { const q = [...Array(256).keys()]; for (let i = 255; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [q[i], q[j]] = [q[j], q[i]]; } for (let i = 0; i < 512; i++) PERM[i] = q[i & 255]; }
    function vnoise(x, y, z) {
      const X = Math.floor(x), Y = Math.floor(y), Z = Math.floor(z);
      const fx = x - X, fy = y - Y, fz = z - Z;
      const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy), w = fz * fz * (3 - 2 * fz);
      const h = (i, j, k) => PERM[(PERM[(PERM[(X + i) & 255] + Y + j) & 255] + Z + k) & 255] / 255;
      const l = (a, b, t) => a + (b - a) * t;
      return l(l(l(h(0, 0, 0), h(1, 0, 0), u), l(h(0, 1, 0), h(1, 1, 0), u), v),
               l(l(h(0, 0, 1), h(1, 0, 1), u), l(h(0, 1, 1), h(1, 1, 1), u), v), w) * 2 - 1;
    }
    const fbm = (x, y, z) => vnoise(x, y, z) * 0.6 + vnoise(x * 2.1, y * 2.1, z * 2.1) * 0.28 + vnoise(x * 4.3, y * 4.3, z * 4.3) * 0.12;
    // 法線方向にでこぼこさせて、手作りっぽい形にする
    function organic(geo, amp, f = 2.5) {
      geo.computeVertexNormals();
      const p = geo.attributes.position, n = geo.attributes.normal;
      for (let i = 0; i < p.count; i++) {
        const x = p.getX(i), y = p.getY(i), z = p.getZ(i), d = fbm(x * f, y * f, z * f) * amp;
        p.setXYZ(i, x + n.getX(i) * d, y + n.getY(i) * d, z + n.getZ(i) * d);
      }
      geo.computeVertexNormals();
      return geo;
    }
    // 高さで色を変える（上が焼き色、下が淡い色）。ノイズでムラを付ける
    function shade(geo, top, bot, y0, y1, pow = 1, mottle = 0.25) {
      const pos = geo.attributes.position, col = [], a = new THREE.Color(bot), b = new THREE.Color(top), c = new THREE.Color();
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
        const t = THREE.MathUtils.clamp(Math.pow(THREE.MathUtils.clamp((y - y0) / (y1 - y0), 0, 1), pow) + fbm(x * 4, y * 4, z * 4) * mottle, 0, 1);
        c.copy(a).lerp(b, t); col.push(c.r, c.g, c.b);
      }
      geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
      return geo;
    }
    const baked = (geo, top, bot, y0, y1, { pow, mottle, ...o } = {}) => new THREE.Mesh(shade(geo, top, bot, y0, y1, pow, mottle), M(0xffffff, { vertexColors: true, map: speckle, bumpMap: speckle, bumpScale: 1.5, roughness: 0.75, ...o }));

    function noodles(g, { color, r, count, w, d, h, curl = 0.7, rough = 0.32 }) {
      const base = new THREE.Color(color);
      const mats = [-1, 0, 1].map(k => M(base.clone().offsetHSL(0, 0, k * 0.035), { roughness: rough, clearcoat: 0.4, clearcoatRoughness: 0.35 }));
      for (let k = 0; k < count; k++) {
        const p = new THREE.Vector3(rnd(-w, w) * 0.9, rnd(0, h * 0.6), rnd(-d, d) * 0.9);
        const dir = new THREE.Vector3(rnd(-1, 1), rnd(-0.2, 0.3), rnd(-0.6, 0.6)).normalize();
        const pts = [];
        for (let s = 0; s < 16; s++) {
          pts.push(p.clone());
          dir.add(new THREE.Vector3(rnd(-curl, curl), rnd(-curl, curl) * 0.5, rnd(-curl, curl))).normalize();
          if (Math.abs(p.x + dir.x * 0.15) > w) dir.x *= -1;
          if (Math.abs(p.z + dir.z * 0.15) > d) dir.z *= -1;
          if (p.y + dir.y * 0.15 < 0 || p.y + dir.y * 0.15 > h) dir.y *= -1;
          p.addScaledVector(dir, 0.15);
        }
        g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 60, r * rnd(0.85, 1.15), 6), mats[k % 3]));
      }
    }
    // 小さなかけら（青のり・ごまなど）をまとめて置く
    function flakes(g, { color, n, size, w, d, y0, y1, flat = true }) {
      const im = new THREE.InstancedMesh(new THREE.BoxGeometry(size, flat ? size * 0.15 : size, size), M(color, { roughness: 0.8 }), n);
      const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
      for (let k = 0; k < n; k++) {
        q.setFromEuler(e.set(rnd(-0.6, 0.6), rnd(0, 3), rnd(-0.6, 0.6)));
        const sc = rnd(0.5, 1.3);
        im.setMatrixAt(k, m4.compose(new THREE.Vector3(rnd(-w, w), rnd(y0, y1), rnd(-d, d)), q, new THREE.Vector3(sc, 1, sc)));
      }
      g.add(im);
    }

    const BASES = [
      () => { // パン
        const g = new THREE.Group();
        // コッペパンに切れ目。左右の山の間に具が入る

        for (let k = 0; k < 8; k++) {
          const a = k / 8 * Math.PI * 2 + 0.2;
          const pts = [new THREE.Vector3(Math.cos(a) * 0.12, 0.35, Math.sin(a) * 0.12), new THREE.Vector3(Math.cos(a) * 0.35, 0.1, Math.sin(a) * 0.35),
            new THREE.Vector3(Math.cos(a) * 0.6, 0.05, Math.sin(a) * 0.6), new THREE.Vector3(Math.cos(a + 0.5) * 0.75, rnd(0.08, 0.25), Math.sin(a + 0.5) * 0.75),
            new THREE.Vector3(Math.cos(a + 0.9) * 0.7, rnd(0.15, 0.35), Math.sin(a + 0.9) * 0.7)];
          const curve = new THREE.CatmullRomCurve3(pts), SEG = 48, RAD = 10;
          const geo = new THREE.TubeGeometry(curve, SEG, 0.07, RAD);
          // 先に向かって細くする
          const p = geo.attributes.position, v = new THREE.Vector3();
          for (let j = 0; j <= SEG; j++) {
            const t = j / SEG, c = curve.getPointAt(t), k2 = 1 - t * 0.88;
            for (let r = 0; r <= RAD; r++) { const i = j * (RAD + 1) + r; v.fromBufferAttribute(p, i).sub(c).multiplyScalar(k2).add(c); p.setXYZ(i, v.x, v.y, v.z); }
          }
          g.add(new THREE.Mesh(tint(geo), skin));
        }
        return g;
      },
    ];

    // ---------- 調理法 ----------
    // 器: 焼き=鉄板 / 揚げ=敷き紙の皿 / 蒸し=せいろ / 煮=煮汁の鉢 / 炒め=フライパン / 生=皿 / 燻製=まな板 / 冷やし=氷のガラス鉢
    let vessel = null;
    const vesselRoot = new THREE.Group();
    foodScene.add(vesselRoot);
    function makePlate() {
      return new THREE.Mesh(new THREE.LatheGeometry([[0, 0], [1.3, 0], [1.45, 0.05], [1.62, 0.12], [1.6, 0.13], [1.4, 0.07], [0, 0.07]].map(([x, y]) => new THREE.Vector2(x, y - 0.1)), 96),
        new THREE.MeshPhysicalMaterial({ color: 0xfbfbf8, roughness: 0.12, clearcoat: 1 }));
    }
    const woodTex = (base, line) => {
      const c = document.createElement('canvas'); c.width = c.height = 256;
      const g = c.getContext('2d'); g.fillStyle = base; g.fillRect(0, 0, 256, 256);
      for (let k = 0; k < 90; k++) { g.strokeStyle = line; g.globalAlpha = rnd(0.05, 0.25); g.lineWidth = rnd(1, 3); const y = rnd(0, 256); g.beginPath(); g.moveTo(0, y); for (let x = 0; x <= 256; x += 16) g.lineTo(x, y + Math.sin(x * 0.02 + k) * 4); g.stroke(); }
      const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
    };
    function makeVessel(cook) {
      const g = new THREE.Group();
      let floor = -0.03;
      if (cook === 0) { // 鉄板と木の台
        g.add(mesh(new THREE.BoxGeometry(3.4, 0.14, 2.4), M(0xffffff, { map: woodTex('#7a4a22', '#2a1408'), roughness: 0.6 }), 0, -0.03));
        const iron = M(0x1c1c1e, { roughness: 0.35, metalness: 0.8 });
        g.add(mesh(new THREE.BoxGeometry(3.0, 0.06, 2.0), iron, 0, 0.07));
        for (let k = -6; k <= 6; k++) g.add(mesh(new THREE.BoxGeometry(2.9, 0.04, 0.05), iron, 0, 0.11, k * 0.15));
        floor = 0.12;
      } else if (cook === 1) { // 敷き紙
        g.add(makePlate());
        const paper = mesh(organic(new THREE.BoxGeometry(2.0, 0.005, 2.0, 20, 1, 20), 0.03, 2), M(0xf4ecd8, { roughness: 0.95, bumpMap: speckle, bumpScale: 1 }), 0, 0.0);
        paper.rotation.y = 0.6; g.add(paper);
        floor = 0.01;
      } else if (cook === 2) { // せいろ
        const bamboo = M(0xffffff, { map: woodTex('#d8b070', '#8a6030'), roughness: 0.7 });
        g.add(mesh(new THREE.CylinderGeometry(1.65, 1.65, 0.5, 64, 1, true), Object.assign(bamboo.clone(), { side: THREE.DoubleSide }), 0, 0.15));
        g.add(mesh(new THREE.TorusGeometry(1.65, 0.05, 8, 64).rotateX(Math.PI / 2), bamboo, 0, 0.4));
        g.add(mesh(new THREE.CylinderGeometry(1.6, 1.6, 0.03, 64), M(0xc8a060, { roughness: 0.8 }), 0, -0.08));
        // 敷き布
        g.add(mesh(organic(new THREE.CylinderGeometry(1.3, 1.3, 0.01, 48, 1), 0.04, 3), M(0xf2efe6, { roughness: 1, bumpMap: speckle, bumpScale: 2 }), 0, -0.05));
        floor = -0.04;
      } else if (cook === 3) { // 煮汁の鉢
        const bowl = new THREE.LatheGeometry([[0, -0.1], [1.2, -0.1], [1.6, 0.15], [1.75, 0.45], [1.7, 0.47], [1.55, 0.2], [1.1, -0.03], [0, -0.03]].map(([x, y]) => new THREE.Vector2(x, y)), 96);
        g.add(mesh(bowl, M(0x3a1a12, { roughness: 0.2, clearcoat: 1, side: THREE.DoubleSide })));
        const broth = mesh(new THREE.CircleGeometry(1.62, 96).rotateX(-Math.PI / 2), new THREE.MeshPhysicalMaterial({ color: 0x8a5a20, roughness: 0.05, clearcoat: 1, transparent: true, opacity: 0.82 }), 0, 0.3);
        broth.castShadow = false; broth.userData.noShadow = true;
        g.add(broth);
        floor = -0.03;
      } else if (cook === 4) { // フライパン
        const iron = M(0x26262a, { roughness: 0.4, metalness: 0.7 });
        const pan = new THREE.LatheGeometry([[0, -0.1], [1.45, -0.1], [1.75, 0.25], [1.8, 0.27], [1.5, -0.05], [0, -0.05]].map(([x, y]) => new THREE.Vector2(x, y)), 96);
        g.add(mesh(pan, Object.assign(iron.clone(), { side: THREE.DoubleSide })));
        const handle = mesh(new THREE.CylinderGeometry(0.09, 0.11, 1.6, 24).rotateZ(Math.PI / 2), M(0x3a2414, { roughness: 0.5 }), 2.55, 0.25);
        handle.rotation.z = 0.12; g.add(handle);
        g.add(mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.4, 16).rotateZ(Math.PI / 2), iron, 1.85, 0.2));
        floor = -0.05;
      } else if (cook === 6) { // まな板
        g.add(mesh(organic(new THREE.BoxGeometry(3.3, 0.16, 2.3, 16, 2, 12), 0.01, 2), M(0xffffff, { map: woodTex('#c08a50', '#5a3010'), roughness: 0.75, bumpMap: speckle, bumpScale: 1 }), 0, -0.02));
        // 燻製用のチップ
        for (let k = 0; k < 18; k++) { const c = mesh(new THREE.BoxGeometry(0.12, 0.03, 0.06), M(rnd(0, 1) < 0.5 ? 0x5a3418 : 0x2a1a10, { roughness: 0.9 }), rnd(-1.5, 1.5), 0.075, (rnd(0, 1) < 0.5 ? -1 : 1) * rnd(0.85, 1.05)); c.rotation.y = rnd(0, 3); g.add(c); }
        floor = 0.06;
      } else if (cook === 7) { // 氷のガラス鉢
        const glass = new THREE.MeshPhysicalMaterial({ color: 0xe8f4ff, roughness: 0.02, transparent: true, opacity: 0.35, clearcoat: 1, side: THREE.DoubleSide });
        g.add(mesh(new THREE.LatheGeometry([[0, -0.1], [1.3, -0.1], [1.75, 0.3], [1.72, 0.32], [1.27, -0.06], [0, -0.06]].map(([x, y]) => new THREE.Vector2(x, y)), 96), glass));
        const ice = new THREE.MeshPhysicalMaterial({ color: 0xf2f8ff, roughness: 0.08, transparent: true, opacity: 0.7, clearcoat: 1 });
        for (let k = 0; k < 70; k++) {
          const a = rnd(0, 6.28), r = rnd(0.2, 1.55);
          const c = mesh(organic(new THREE.IcosahedronGeometry(rnd(0.09, 0.16), 1), 0.03, 8), ice, Math.cos(a) * r, -0.03 + r * 0.12 + rnd(0, 0.06), Math.sin(a) * r);
          c.rotation.set(rnd(0, 3), rnd(0, 3), rnd(0, 3)); c.userData.noShadow = true; g.add(c);
        }
        floor = 0.06;
      } else { // 生
        g.add(makePlate());
        floor = -0.03;
      }
      g.traverse(o => { if (o.isMesh) { o.receiveShadow = true; o.castShadow = !o.userData.noShadow; } });
      return { g, floor };
    }

    // 料理そのものの見た目を調理法ごとに変える（頂点の色・形・質感）
    function cookPass(food, cook) {
      food.updateMatrixWorld(true);
      const inv = new THREE.Matrix4().copy(food.matrixWorld).invert();
      const rel = new THREE.Matrix4(), nm = new THREE.Matrix3(), v = new THREE.Vector3(), n = new THREE.Vector3(), c = new THREE.Color();
      const drops = [];
      food.traverse(o => {
        if (!o.isMesh || o.isInstancedMesh || o.userData.fx) return;
        o.geometry = o.geometry.clone();
        const geo = o.geometry;
        if (cook === 1) organic(geo, 0.022, 16); // 衣のざらざら
        if (!geo.attributes.normal) geo.computeVertexNormals();
        rel.multiplyMatrices(inv, o.matrixWorld); nm.getNormalMatrix(rel);
        const pos = geo.attributes.position, nor = geo.attributes.normal, old = geo.attributes.color;
        const col = new Float32Array(pos.count * 3);
        for (let i = 0; i < pos.count; i++) {
          v.fromBufferAttribute(pos, i).applyMatrix4(rel); n.fromBufferAttribute(nor, i).applyMatrix3(nm).normalize();
          if (old) c.fromBufferAttribute(old, i); else c.setRGB(1, 1, 1);
          const nz = fbm(v.x * 5, v.y * 5, v.z * 5);
          if (cook === 0) { // 焼き: 全体に焼き色、上面に網目の焼き跡
            c.multiply(new THREE.Color().setRGB(0.78 + nz * 0.15, 0.6 + nz * 0.12, 0.42));
            const stripe = Math.abs(Math.sin((v.x * 0.8 + v.z) * 9));
            if (n.y > 0.2 && stripe > 0.82) c.multiplyScalar(0.18);
          } else if (cook === 1) { // 揚げ: きつね色の衣
            const k = 0.5 + nz * 0.25;
            c.lerp(new THREE.Color().setRGB(0.85 * k + 0.2, 0.52 * k + 0.1, 0.12), 0.85);
          } else if (cook === 2) { // 蒸し: ふっくら白っぽく
            c.lerp(new THREE.Color(1, 1, 1), 0.25);
          } else if (cook === 3) { // 煮: 煮汁がしみて茶色
            c.multiply(new THREE.Color().setRGB(0.72, 0.48, 0.26)).multiplyScalar(1 + nz * 0.15);
          } else if (cook === 4) { // 炒め: ところどころ焦げ目
            if (nz > 0.25) c.multiply(new THREE.Color().setRGB(0.45, 0.28, 0.14)); else c.multiplyScalar(0.92);
          } else if (cook === 6) { // 燻製: 上ほど濃い飴色
            const k = THREE.MathUtils.clamp(0.5 + v.y * 0.5 + nz * 0.2, 0, 1);
            c.multiply(new THREE.Color().setRGB(0.75, 0.45, 0.2).lerp(new THREE.Color(0.35, 0.16, 0.06), k));
          } else if (cook === 7) { // 冷やし: 霜がつく
            c.lerp(new THREE.Color(0.85, 0.93, 1), 0.25);
            if (n.y > 0.3 && nz > 0.3) c.lerp(new THREE.Color(1, 1, 1), 0.8);
            if (n.y > 0.5 && Math.random() < 0.004 && drops.length < 60) drops.push(v.clone().addScaledVector(n, 0.02));
          }
          col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
        }
        geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        o.material = mats.map(m0 => {
          const m = m0.clone(); m.vertexColors = true;
          if (cook === 1) { m.roughness = 0.55; m.clearcoat = 0.5; m.bumpMap = speckle; m.bumpScale = 3; }
          if (cook === 2) { m.roughness = 0.35; m.clearcoat = 0.8; m.clearcoatRoughness = 0.3; }
          if (cook === 3 || cook === 4) { m.roughness = 0.15; m.clearcoat = 1; m.clearcoatRoughness = 0.1; }
          if (cook === 6) { m.roughness = 0.3; m.clearcoat = 0.8; }
          if (cook === 7) { m.roughness = 0.2; m.clearcoat = 1; }
          return m;
        });
        if (o.material.length === 1) o.material = o.material[0];
      });
      // インスタンス（青のり・米粒）は色だけ寄せる
      food.traverse(o => {
        if (!o.isInstancedMesh) return;
        o.material = o.material.clone();
        const t = [0x8a5a2a, 0xd89a3a, 0xffffff, 0x8a5a2a, 0x6a4a2a, null, 0x5a2a10, 0xe0f0ff][cook];
        if (t !== null) o.material.color.lerp(new THREE.Color(t), cook === 0 || cook === 6 ? 0.35 : 0.2);
      });
      if (cook === 7) {
        const dm = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0, transparent: true, opacity: 0.5, clearcoat: 1 });
        for (const d of drops) food.add(mesh(new THREE.SphereGeometry(rnd(0.015, 0.03), 10, 8).scale(1, 0.7, 1), dm, d.x, d.y, d.z));
      }
    }

    function addWisps(food, top, color, opacity) {
      for (let k = 0; k < 8; k++) {
        const s = mesh(new THREE.SphereGeometry(0.22, 16, 12), new THREE.MeshBasicMaterial({ color, transparent: true, opacity, depthWrite: false }), rnd(-0.5, 0.5), 0, rnd(-0.3, 0.3));
        s.userData = { t: k / 8, y0: top + 0.2, op: opacity, fx: true };
        food.add(s); fx.push(s);
      }
    }

    function setWisp(s, t) {
      s.userData.t = t;
      s.position.y = s.userData.y0 + t;
      s.material.opacity = s.userData.op * Math.sin(t * Math.PI); s.scale.setScalar(0.6 + t);
    }

    // ---------- X投稿用の動画（料理が1周する。最初と最後がつながるループ） ----------
    const VSIZE = 720, VFPS = 30, VFRAMES = 120; // 4秒で1周。湯気も4秒で2周するので切れ目がない
    let vr = null, shareFile = null, shareKey = '';
    async function makeVideo(key) {
      if (!('VideoEncoder' in window) || !window.Mp4Muxer) return;
      let cfg = null;
      for (const codec of ['avc1.640028', 'avc1.4d0028', 'avc1.42001f']) {
        const c = { codec, width: VSIZE, height: VSIZE, bitrate: 6e6, framerate: VFPS };
        try { if ((await VideoEncoder.isConfigSupported(c)).supported) { cfg = c; break; } } catch {}
      }
      if (!cfg || shareKey !== key) return;
      if (!vr) {
        vr = new THREE.WebGLRenderer({ antialias: true });
        vr.setPixelRatio(1); vr.setSize(VSIZE, VSIZE, false);
        vr.outputColorSpace = renderer.outputColorSpace; vr.toneMapping = renderer.toneMapping; vr.toneMappingExposure = renderer.toneMappingExposure;
        vr.shadowMap.enabled = true; vr.shadowMap.type = renderer.shadowMap.type;
      }
      const cam = new THREE.PerspectiveCamera(foodCam.fov, 1, 0.1, 100);
      const keep = [foodDist, foodCy];
      fitCam(cam, 1);
      const el = THREE.MathUtils.degToRad(20);
      cam.position.set(0, foodCy + Math.sin(el) * foodDist, Math.cos(el) * foodDist); cam.lookAt(0, foodCy, 0);
      [foodDist, foodCy] = keep;
      const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec: 'avc', width: VSIZE, height: VSIZE, frameRate: VFPS }, fastStart: 'in-memory' });
      let failed = false;
      const enc = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: () => { failed = true; } });
      enc.configure(cfg);
      const t0 = fx.map(f => f.userData.t);
      for (let i = 0; i < VFRAMES; i++) {
        if (shareKey !== key || failed) { try { enc.close(); } catch {} return; }
        const a = i / VFRAMES * Math.PI * 2;
        foodRoot.rotation.y = vesselRoot.rotation.y = a;
        foodRoot.scale.setScalar(1);
        fx.forEach((f, k) => setWisp(f, (t0[k] + i / VFRAMES * 2) % 1));
        vr.render(foodScene, cam);
        const frame = new VideoFrame(vr.domElement, { timestamp: Math.round(i * 1e6 / VFPS), duration: Math.round(1e6 / VFPS) });
        enc.encode(frame, { keyFrame: i % 60 === 0 }); frame.close();
        if (i % 3 === 2) await new Promise(r => requestAnimationFrame(r));
      }
      fx.forEach((f, k) => setWisp(f, t0[k]));
      await enc.flush(); enc.close(); muxer.finalize();
      if (shareKey !== key || failed) return;
      shareFile = new File([muxer.target.buffer], 'yakisoba-pan.mp4', { type: 'video/mp4' });
      render();
    }

    function buildFood(idx) {
      if (food) { foodRoot.remove(food); food.traverse(o => { o.geometry?.dispose(); }); }
      if (vessel) vesselRoot.remove(vessel.g);
      fx.length = 0;
      food = new THREE.Group();
      const base = BASES[idx[2]]();
      const fill = FILLS[idx[1]](base.w);
      fill.position.y = base.top;
      food.add(base.g, fill);
      // 大きすぎるものは縮める
      const box = new THREE.Box3().setFromObject(food);
      const size = box.getSize(new THREE.Vector3());
      const s = Math.min(1, 2.9 / size.x, 2.6 / size.z, 1.9 / size.y);
      food.scale.setScalar(s);
      cookPass(food, idx[0]);
      const top = new THREE.Box3().setFromObject(food).max.y / s;
      if (idx[0] === 2) addWisps(food, top, 0xffffff, 0.28);
      if (idx[0] === 6) addWisps(food, top, 0x8a8a8a, 0.22);
      food.traverse(o => { if (o.isMesh) { o.castShadow = !o.userData.fx; o.receiveShadow = true; } });
      vessel = makeVessel(idx[0]);
      vesselRoot.add(vessel.g);
      food.position.y = vessel.floor;
      foodRoot.add(food);
      foodBox.setFromObject(food);
      fitFoodCam();
      foodPop = 0;
    }

    // ---------- 音 ----------
    let ac = null;
    function beep(freq, dur, type = 'square', vol = 0.08) {
      if (muted) return;
      try {
        ac ??= new (window.AudioContext || window.webkitAudioContext)();
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = type; o.frequency.value = freq;
        g.gain.setValueAtTime(vol, ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
        o.connect(g).connect(ac.destination);
        o.start(); o.stop(ac.currentTime + dur);
      } catch {}
    }

    // ---------- 進行 ----------
    let state = 'idle'; // idle | spin | result
    let spins = store.get('spins', 0);
    let result = [0, 0, 0];
    const controls = document.getElementById('controls');

    function start() {
      if (state === 'spin') return;
      shareKey = ''; shareFile = null;
      state = 'spin';
      beep(440, 0.08);
      drums.forEach(d => { d.spinning = true; d.target = null; });
      render();
    }
    function stop(i) {
      const d = drums[i];
      if (state !== 'spin' || !d.spinning || d.target !== null) return;
      // 次に正面へ来るコマで止まる（目押し）
      d.target = (Math.ceil(d.theta / STEP - 0.5) + 0.5) * STEP;
      render();
    }
    function landed(i) {
      const d = drums[i];
      d.spinning = false;
      d.index = indexFor(d.theta);
      d.bounce = 1;
      beep(660 + i * 110, 0.1, 'triangle', 0.12);
      if (drums.every(x => !x.spinning)) {
        result = drums.map(x => x.index);
        spins++; store.set('spins', spins);
        state = 'result';
        shareFile = null; shareKey = result.join(',') + ':' + spins;
        const key = shareKey;
        setTimeout(() => makeVideo(key).catch(() => {}), 700);
        buildFood(result);
        render();
      }
    }
    function nextStop() { const i = drums.findIndex(d => d.spinning && d.target === null); if (i >= 0) stop(i); }

    const words = () => result.map((k, i) => REELS[i][lang][k]);
    function render() {
      document.documentElement.lang = lang;
      document.title = t('title');
      document.getElementById('back').textContent = t('back');
      document.getElementById('lang').value = lang;
      document.getElementById('sound').innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>${muted ? '<path d="M17 9l5 6M22 9l-5 6"/>' : '<path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>'}</svg>`;
      controls.innerHTML = '';
      if (state === 'spin') {
        drums.forEach((d, i) => {
          const b = document.createElement('button');
          b.className = 'stop'; b.setAttribute('aria-label', t('stop'));
          b.disabled = !d.spinning || d.target !== null;
          b.addEventListener('pointerdown', e => { e.preventDefault(); stop(i); });
          const cell = document.createElement('div'); cell.className = 'cell';
          cell.append(b); controls.append(cell);
        });
      } else {
        const b = document.createElement('button');
        b.className = 'go'; b.textContent = state === 'result' ? t('again') : t('start');
        b.addEventListener('click', start);
        controls.append(b);
        if (state === 'result') {
          const a = document.createElement('a');
          a.className = 'post'; a.textContent = t('post');
          a.href = `https://x.com/intent/post?text=${encodeURIComponent(t('share')(words()))}&url=${encodeURIComponent(SHARE_URL)}`;
          const coarse = matchMedia('(pointer: coarse)').matches;
          if (!coarse) { a.target = '_blank'; a.rel = 'noopener'; }
          if (!shareFile && 'VideoEncoder' in window) a.classList.add('wait');
          // スマホは動画ごと共有シートへ。PCは動画を保存してから投稿画面を開く
          a.addEventListener('click', e => {
            if (!shareFile) return;
            if (coarse && navigator.canShare?.({ files: [shareFile] })) {
              e.preventDefault();
              navigator.share({ files: [shareFile], text: `${t('share')(words())}\n${SHARE_URL}` }).catch(err => { if (err.name !== 'AbortError') location.href = a.href; });
              return;
            }
            if (!coarse) {
              const d = document.createElement('a');
              d.href = URL.createObjectURL(shareFile); d.download = shareFile.name; d.click();
              setTimeout(() => URL.revokeObjectURL(d.href), 10000);
            }
          });
          controls.append(a);
        }
      }
    }

    document.getElementById('lang').addEventListener('change', e => {
      lang = e.target.value; store.set('lang', lang);
      setDrumTextures(); render();
    });
    document.getElementById('sound').addEventListener('click', () => { muted = !muted; store.set('muted', muted); render(); });
    addEventListener('keydown', e => {
      if (e.code !== 'Space' && e.code !== 'Enter') return;
      e.preventDefault();
      if (e.repeat) return;
      if (state === 'spin') nextStop(); else start();
    });

    // 食べ物はドラッグで回せる
    let drag = null;
    renderer.domElement.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; });
    addEventListener('pointermove', e => {
      if (!drag) return;
      foodSpin += (e.clientX - drag.x) * 0.012;
      foodElev = THREE.MathUtils.clamp(foodElev + (e.clientY - drag.y) * 0.008, 0.02, 1.45);
      drag.x = e.clientX; drag.y = e.clientY;
      placeFoodCam();
    });
    addEventListener('pointerup', () => { drag = null; });

    // ---------- 画面サイズ ----------
    let W = 1, H = 1, drumH = 1, foodH = 1;
    // テーブルの高さから少し見上げる。料理全体が収まる距離まで下がる
    let foodElev = THREE.MathUtils.degToRad(17), foodDist = 10, foodCy = 0.5;
    function placeFoodCam() {
      foodCam.position.set(0, foodCy + Math.sin(foodElev) * foodDist, Math.cos(foodElev) * foodDist);
      foodCam.lookAt(0, foodCy, 0);
    }
    function fitFoodCam() { fitCam(foodCam, W / Math.max(1, foodH)); placeFoodCam(); }
    function fitCam(cam, aspect) {
      cam.aspect = aspect;
      const half = Math.tan(THREE.MathUtils.degToRad(cam.fov / 2));
      const size = foodBox.getSize(new THREE.Vector3());
      const top = Math.max(1.0, foodBox.max.y) + 0.1, hw = Math.max(1.85, size.x / 2, size.z / 2);
      const dist = Math.max(hw / (half * aspect), top / half * 0.9) + hw * 0.2;
      foodDist = dist; foodCy = top * 0.38;
      cam.updateProjectionMatrix();
    }
    function resize() {
      W = stage.clientWidth; H = stage.clientHeight;
      renderer.setSize(W, H, false);
      // 下はリール、上は料理
      drumH = Math.round(Math.min(H * 0.42, W * 0.42));
      foodH = H - drumH;
      camera.aspect = W / drumH;
      const half = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
      const dist = Math.max(1.25 / half, 3.6 / (half * camera.aspect)) + R;
      camera.position.set(0, DRUM_Y + 0.5, dist);
      camera.lookAt(0, DRUM_Y, 0);
      camera.updateProjectionMatrix();
      fitFoodCam();
    }
    addEventListener('resize', resize);

    // ---------- ループ ----------
    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      drums.forEach((d, i) => {
        if (d.spinning) {
          d.theta += SPEED[i] * dt;
          if (d.target !== null && d.theta >= d.target) { d.theta = d.target; landed(i); }
        }
        let wob = 0;
        if (d.bounce > 0) { d.bounce = Math.max(0, d.bounce - dt * 5); wob = Math.sin(d.bounce * Math.PI * 2) * 0.06 * d.bounce; }
        d.pivot.rotation.x = d.theta + wob;
      });
      if (!drag) foodSpin += dt * 0.5;
      foodRoot.rotation.y = foodSpin;
      vesselRoot.rotation.y = foodSpin;
      if (foodPop < 1) { foodPop = Math.min(1, foodPop + dt * 4); }
      const p = foodPop, sc = 1 + Math.sin(p * Math.PI) * 0.08;
      foodRoot.scale.set(sc * p, sc * p, sc * p);
      for (const s of fx) setWisp(s, (s.userData.t + dt * 0.5) % 1);
      renderer.setScissorTest(true);
      renderer.setViewport(0, 0, W, drumH); renderer.setScissor(0, 0, W, drumH);
      renderer.render(scene, camera);
      const fy = drumH + Math.round((H - drumH - foodH) * 0.35);
      renderer.setViewport(0, fy, W, foodH); renderer.setScissor(0, fy, W, foodH);
      renderer.render(foodScene, foodCam);
      requestAnimationFrame(loop);
    }

    setDrumTextures();
    buildFood(result);
    foodPop = 1;
    resize();
    render();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
