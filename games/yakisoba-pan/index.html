<body>
  <header>
    <a id="back" href="../../">← トップへ戻る</a>

  <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
  <script>
    // CDN が読めないときの一言
    setTimeout(() => {
      if (!window.__ok) {
        const m = document.getElementById('msg');
        m.style.display = 'flex';
        m.textContent = /^ja/.test(navigator.language) ? '読み込めませんでした。通信を確認して再読み込みしてください' : 'Could not load. Please check your connection and reload.';
      }
    }, 8000);
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    window.__ok = true;

    // ---------- 言葉 ----------
    const REELS = [
      { ja: ['焼き', '揚げ', '蒸し', '煮', '炒め', '生', '燻製', '冷やし'],
        en: ['Grilled', 'Fried', 'Steamed', 'Boiled', 'Stir-fried', 'Raw', 'Smoked', 'Chilled'] },
      { ja: ['そば', 'うどん', 'ラーメン', 'カレー', 'プリン', '納豆', '餃子', 'たこ'],
        en: ['Noodle', 'Udon', 'Ramen', 'Curry', 'Pudding', 'Natto', 'Gyoza', 'Octopus'] },
      { ja: ['パン', 'ご飯', 'せんべい', 'まん', 'ピザ', 'もなか', 'クレープ', 'ちくわ'],
        en: ['Bread', 'Rice', 'Cracker', 'Bun', 'Pizza', 'Monaka', 'Crepe', 'Chikuwa'] },
    ];
    const N = 8;
    const DICT = {
      ja: { title: '焼きそばパン', back: '← トップへ戻る', lang: 'EN', start: 'スタート', again: 'もう一回', stop: 'ストップ',
            post: 'Xに投稿', count: n => `${n}回目`, name: w => w.join(''),
            share: w => `「${w.join('')}」ができた #焼きそばパン` },
      en: { title: 'Yakisoba Bread', back: '← Back to top', lang: '日本語', start: 'START', again: 'AGAIN', stop: 'STOP',
            post: 'Post', count: n => `Spin #${n}`, name: w => w.join(' '),
            share: w => `I made "${w.join(' ')}" #YakisobaBread` },
    };
    const SHARE_URL = 'https://keifurukawafunnych.com/games/yakisoba-pan/';
    const store = {
      get(k, d) { try { const v = localStorage.getItem('yakisoba-pan:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
      set(k, v) { try { localStorage.setItem('yakisoba-pan:' + k, JSON.stringify(v)); } catch {} },
    };
    let lang = store.get('lang', navigator.language.startsWith('ja') ? 'ja' : 'en');
    let muted = store.get('muted', false);
    const t = k => DICT[lang][k];

    // ---------- three.js ----------
    const stage = document.getElementById('stage');
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.9;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    stage.prepend(renderer.domElement);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xfbf3e4);
    const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 100);
    scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environmentIntensity = 0.45;
    scene.add(new THREE.HemisphereLight(0xffffff, 0xb59a74, 0.6));
    const sun = new THREE.DirectionalLight(0xfff4e0, 2.0);
    sun.position.set(2, 5, 6);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    sun.shadow.camera.left = sun.shadow.camera.bottom = -3;
    sun.shadow.camera.right = sun.shadow.camera.top = 3;
    sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.02;
    scene.add(sun);

    // ---------- リール（横向きの円筒） ----------
    const R = 0.9, LEN = 2, GAP = 2.15, DRUM_Y = -1.55;
    const STEP = Math.PI * 2 / N;
    const SPEED = [17, 18.5, 20]; // rad/s ≒ 1秒に 20 コマ以上
    function drumTexture(words) {
      const W = 1440, H = 512, col = W / N;
      const c = document.createElement('canvas');
      c.width = W; c.height = H;
      const g = c.getContext('2d');
      g.fillStyle = '#fffaf0'; g.fillRect(0, 0, W, H);
      for (let i = 0; i < N; i++) {
        g.fillStyle = i % 2 ? '#fff3dc' : '#fffaf0';
        g.fillRect(i * col, 0, col, H);
        g.save();
        g.translate((i + 0.5) * col, H / 2);
        g.rotate(-Math.PI / 2);
        const w = words[i];
        let size = 120;
        g.font = `900 ${size}px system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif`;
        const mw = g.measureText(w).width;
        if (mw > H * 0.86) size *= H * 0.86 / mw;
        g.font = `900 ${size}px system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif`;
        g.fillStyle = '#3a2a1a'; g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText(w, 0, size * 0.04);
        g.restore();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      return tex;
    }
    const drums = [0, 1, 2].map(i => {
      const pivot = new THREE.Group();
      pivot.position.set((i - 1) * GAP, DRUM_Y, 0);
      const mat = new THREE.MeshStandardMaterial({ roughness: 0.6 });
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(R, R, LEN, 64, 1, true), mat);
      mesh.rotation.z = -Math.PI / 2;
      pivot.add(mesh);
      const capMat = new THREE.MeshStandardMaterial({ color: 0xc23a22, roughness: 0.5 });
      for (const s of [-1, 1]) {
        const cap = new THREE.Mesh(new THREE.CylinderGeometry(R + 0.06, R + 0.06, 0.08, 48), capMat);
        cap.rotation.z = Math.PI / 2;
        cap.position.x = s * (LEN / 2 + 0.04);
        pivot.add(cap);
      }
      scene.add(pivot);
      // 当たり窓の上下の線
      for (const s of [-1, 1]) {
        const bar = new THREE.Mesh(new THREE.BoxGeometry(LEN + 0.1, 0.05, 0.05), new THREE.MeshBasicMaterial({ color: 0xc23a22 }));
        const a = STEP / 2 * s;
        bar.position.set((i - 1) * GAP, DRUM_Y + Math.sin(a) * (R + 0.05), Math.cos(a) * (R + 0.05));
        scene.add(bar);
      }
      return { pivot, mat, theta: 0.5 * STEP, spinning: false, target: null, index: 0, bounce: 0 };
    });
    // θ = (n + 0.5) * STEP で、正面の言葉は (-n - 1) mod N
    const thetaFor = idx => ((-idx - 1) + 0.5) * STEP;
    const indexFor = theta => { const n = Math.round(theta / STEP - 0.5); return ((-n - 1) % N + N) % N; };
    function setDrumTextures() {
      drums.forEach((d, i) => { if (d.mat.map) d.mat.map.dispose(); d.mat.map = drumTexture(REELS[i][lang]); d.mat.needsUpdate = true; });
    }
    drums.forEach(d => { d.theta = thetaFor(0) + STEP * N * 10; d.index = 0; });

    // ---------- 食べ物 ----------
    const FOOD_Y = 0.75;
    const foodRoot = new THREE.Group();
    foodRoot.position.y = FOOD_Y;
    scene.add(foodRoot);
    const plate = new THREE.Mesh(new THREE.CylinderGeometry(1.55, 1.35, 0.1, 64), new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.15, clearcoat: 1 }));
    plate.position.y = -0.05;
    plate.receiveShadow = true;
    foodRoot.add(plate);
    let food = null, foodSpin = 0, foodPop = 1, foodScale = 1;
    const fx = []; // 湯気・氷

    const M = (color, o = {}) => new THREE.MeshPhysicalMaterial({ color, roughness: 0.65, ...o });
    const mesh = (geo, mat, x = 0, y = 0, z = 0) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); return m; };
    const rnd = (a, b) => a + Math.random() * (b - a);

    // 焼き色などのムラ（白〜灰色の斑点。色に掛け合わせる）
    const speckle = (() => {
      const c = document.createElement('canvas'); c.width = c.height = 512;
      const g = c.getContext('2d');
      g.fillStyle = '#fff'; g.fillRect(0, 0, 512, 512);
      for (let k = 0; k < 2500; k++) {
        const v = 200 + Math.random() * 55 | 0;
        g.fillStyle = `rgba(${v},${v * 0.97 | 0},${v * 0.92 | 0},0.5)`;
        g.beginPath(); g.arc(Math.random() * 512, Math.random() * 512, 1 + Math.random() * 6, 0, 7); g.fill();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    })();
    // 高さで色を変える（上が焼き色、下が淡い色）
    function shade(geo, top, bot, y0, y1, pow = 1) {
      const pos = geo.attributes.position, col = [], a = new THREE.Color(bot), b = new THREE.Color(top), c = new THREE.Color();
      for (let i = 0; i < pos.count; i++) {
        const t = Math.pow(THREE.MathUtils.clamp((pos.getY(i) - y0) / (y1 - y0), 0, 1), pow);
        c.copy(a).lerp(b, t); col.push(c.r, c.g, c.b);
      }
      geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
      return geo;
    }
    const baked = (geo, top, bot, y0, y1, { pow, ...o } = {}) => new THREE.Mesh(shade(geo, top, bot, y0, y1, pow), M(0xffffff, { vertexColors: true, map: speckle, bumpMap: speckle, bumpScale: 1.5, roughness: 0.75, ...o }));

    function noodles(g, { color, r, count, w, d, h, wave }) {
      const base = new THREE.Color(color);
      for (let k = 0; k < count; k++) {
        const mat = M(base.clone().offsetHSL(0, 0, rnd(-0.06, 0.04)), { roughness: 0.35 });
        const pts = [];
        const z0 = rnd(-d, d), y0 = rnd(0, h), ph = rnd(0, 6);
        for (let s = 0; s <= 10; s++) {
          const x = -w + 2 * w * s / 10;
          pts.push(new THREE.Vector3(x, y0 + Math.sin(s * 1.3 + ph) * h * 0.4 + h * 0.3, z0 + Math.sin(s * wave + ph) * 0.18));
        }
        g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 48, r * rnd(0.85, 1.15), 7), mat));
      }
    }

    const BASES = [
      () => { // パン
        const g = new THREE.Group();
        // コッペパンに切れ目。左右の山の間に具が入る
        for (const s of [-1, 1]) {
          const geo = new THREE.CapsuleGeometry(0.34, 1.55, 10, 32).rotateZ(Math.PI / 2);
          geo.scale(1, 1.1, 1);
          const half = baked(geo, 0x8a3e0c, 0xe8c48a, -0.3, 0.2, { map: null, bumpMap: null, roughness: 0.55 });
          half.position.set(0, 0.36, s * 0.24); half.rotation.x = -s * 0.32;
          g.add(half);
        }
        return { g, top: 0.45, w: 0.95 };
      },
      () => { // ご飯
        const g = new THREE.Group();
        const bowl = mesh(new THREE.SphereGeometry(0.95, 40, 20, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), M(0x2a2a3a, { side: THREE.DoubleSide, roughness: 0.3 }), 0, 0.85);
        const rice = mesh(new THREE.SphereGeometry(0.9, 40, 16, 0, Math.PI * 2, 0, Math.PI / 2), M(0xfbfaf4, { roughness: 0.9 }), 0, 0.8);
        rice.scale.y = 0.3;
        g.add(bowl, rice);
        const grains = new THREE.InstancedMesh(new THREE.CapsuleGeometry(0.03, 0.06, 2, 6), M(0xfdfcf6, { roughness: 0.5 }), 500);
        const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
        for (let k = 0; k < 500; k++) {
          const a = rnd(0, 6.28), r = Math.sqrt(Math.random()) * 0.86;
          const y = 0.8 + Math.sqrt(Math.max(0, 0.81 - r * r)) * 0.3;
          q.setFromEuler(e.set(rnd(0, 3), rnd(0, 3), rnd(0, 3)));
          grains.setMatrixAt(k, m4.compose(new THREE.Vector3(Math.cos(a) * r, y, Math.sin(a) * r), q, new THREE.Vector3(1, 1, 1)));
        }
        g.add(grains);
        return { g, top: 0.95, w: 0.75 };
      },
      () => { // せんべい
        const g = new THREE.Group();
        g.add(mesh(new THREE.CylinderGeometry(1.1, 1.1, 0.14, 64, 2), M(0xb87436, { map: speckle, bumpMap: speckle, bumpScale: 4, roughness: 0.55 }), 0, 0.07));
        const nori = mesh(new THREE.BoxGeometry(0.9, 0.02, 0.5), M(0x1d2a1a), 0, 0.15, 0.55);
        g.add(nori);
        return { g, top: 0.15, w: 0.9 };
      },
      () => { // まん
        const g = new THREE.Group();
        const m = mesh(new THREE.SphereGeometry(0.85, 48, 32), M(0xf7f1e4, { roughness: 0.6, sheen: 1, map: speckle }), 0, 0.6);
        m.scale.y = 0.72;
        g.add(m);
        return { g, top: 1.15, w: 0.55 };
      },
      () => { // ピザ
        const g = new THREE.Group();
        g.add(mesh(new THREE.CylinderGeometry(1.3, 1.3, 0.1, 48), M(0xe0a85a), 0, 0.05));
        g.add(mesh(new THREE.CylinderGeometry(1.15, 1.15, 0.04, 48), M(0xd23b22, { roughness: 0.4 }), 0, 0.11));
        for (let k = 0; k < 5; k++) { const a = k * 1.256; g.add(mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.03, 20), M(0xf6edd6), Math.cos(a) * 0.8, 0.14, Math.sin(a) * 0.8)); }
        return { g, top: 0.14, w: 0.85 };
      },
      () => { // もなか
        const g = new THREE.Group();
        const mat = M(0xe6c07c, { roughness: 0.8, map: speckle, bumpMap: speckle, bumpScale: 3 });
        g.add(mesh(new THREE.BoxGeometry(1.5, 0.18, 1.0), mat, 0, 0.09));
        g.add(mesh(new THREE.BoxGeometry(1.4, 0.1, 0.9), M(0x4a1c1c), 0, 0.22));
        return { g, top: 0.27, w: 0.85 };
      },
      () => { // クレープ
        const g = new THREE.Group();
        const c = mesh(new THREE.ConeGeometry(0.6, 1.5, 48, 4, true), M(0xeec27a, { side: THREE.DoubleSide, map: speckle, bumpMap: speckle, bumpScale: 2 }), 0, 0.75);
        c.rotation.x = Math.PI;
        g.add(c);
        const cream = mesh(new THREE.SphereGeometry(0.55, 24, 12), M(0xffffff, { roughness: 0.9 }), 0, 1.45);
        cream.scale.y = 0.4;
        g.add(cream);
        return { g, top: 1.55, w: 0.55 };
      },
      () => { // ちくわ
        const g = new THREE.Group();
        const body = mesh(new THREE.CylinderGeometry(0.42, 0.42, 2.0, 32, 1, true), M(0xf1e6cc, { side: THREE.DoubleSide }), 0, 0.42);
        body.rotation.z = Math.PI / 2;
        const burn = mesh(new THREE.CylinderGeometry(0.44, 0.44, 1.7, 32, 1, true, -Math.PI / 2 - 1.1, 2.2), M(0xb67236), 0, 0.42);
        burn.rotation.z = Math.PI / 2;
        g.add(body, burn);
        return { g, top: 0.8, w: 0.9 };
      },
    ];

    const FILLS = [
      (w) => { // そば
        const g = new THREE.Group();
        noodles(g, { color: 0x7a4a22, r: 0.04, count: 16, w, d: 0.3, h: 0.3, wave: 1.7 });
        for (let k = 0; k < 6; k++) g.add(mesh(new THREE.BoxGeometry(0.12, 0.03, 0.03), M(0xe0304a), rnd(-w * 0.7, w * 0.7), 0.4, rnd(-0.2, 0.2)));
        for (let k = 0; k < 12; k++) g.add(mesh(new THREE.BoxGeometry(0.05, 0.01, 0.05), M(0x2b4a1a), rnd(-w * 0.7, w * 0.7), 0.42, rnd(-0.25, 0.25)));
        return g;
      },
      (w) => { // うどん
        const g = new THREE.Group();
        noodles(g, { color: 0xf5f0de, r: 0.085, count: 9, w, d: 0.28, h: 0.3, wave: 0.8 });
        return g;
      },
      (w) => { // ラーメン
        const g = new THREE.Group();
        noodles(g, { color: 0xf0cf5c, r: 0.04, count: 16, w, d: 0.3, h: 0.25, wave: 3 });
        const naruto = mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.05, 24), M(0xffffff), -w * 0.4, 0.42, 0);
        naruto.rotation.x = 0.5;
        const swirl = mesh(new THREE.TorusGeometry(0.1, 0.025, 8, 24), M(0xe05080), 0, 0.03, 0);
        swirl.rotation.x = Math.PI / 2;
        naruto.add(swirl);
        const chashu = mesh(new THREE.CylinderGeometry(0.26, 0.26, 0.06, 24), M(0xa3683a), w * 0.4, 0.4, 0);
        chashu.rotation.x = -0.4;
        g.add(naruto, chashu);
        return g;
      },
      (w) => { // カレー
        const g = new THREE.Group();
        const roux = mesh(new THREE.SphereGeometry(1, 32, 16), M(0x9b5a1a, { roughness: 0.35 }), 0, 0.05);
        roux.scale.set(w, 0.16, 0.42);
        g.add(roux);
        const cols = [0xf08a24, 0xf4e2a0, 0x7a3a1a];
        for (let k = 0; k < 8; k++) g.add(mesh(new THREE.BoxGeometry(0.16, 0.16, 0.16), M(cols[k % 3]), rnd(-w * 0.7, w * 0.7), 0.17, rnd(-0.22, 0.22)));
        return g;
      },
      () => { // プリン
        const g = new THREE.Group();
        g.add(mesh(new THREE.CylinderGeometry(0.33, 0.45, 0.55, 32), M(0xf6d474, { roughness: 0.3 }), 0, 0.27));
        g.add(mesh(new THREE.CylinderGeometry(0.33, 0.33, 0.06, 32), M(0x6b3510, { roughness: 0.2 }), 0, 0.57));
        g.add(mesh(new THREE.SphereGeometry(0.08, 16, 12), M(0xd2142a, { roughness: 0.2 }), 0, 0.66));
        return g;
      },
      (w) => { // 納豆
        const g = new THREE.Group();
        const mat = M(0x9a6526, { roughness: 0.25 });
        for (let k = 0; k < 40; k++) {
          const a = rnd(0, 6.28), r = Math.sqrt(Math.random());
          g.add(mesh(new THREE.SphereGeometry(0.075, 10, 8), mat, Math.cos(a) * r * w * 0.6, 0.07 + (1 - r) * 0.2 + rnd(0, 0.05), Math.sin(a) * r * 0.3));
        }
        for (let k = 0; k < 8; k++) { const ring = mesh(new THREE.TorusGeometry(0.05, 0.02, 6, 12), M(0x4a9a2a), rnd(-0.4, 0.4), 0.32, rnd(-0.15, 0.15)); ring.rotation.x = 1.4; g.add(ring); }
        return g;
      },
      (w) => { // 餃子
        const g = new THREE.Group();
        const mat = M(0xf1e2bd, { roughness: 0.6 });
        for (let k = 0; k < 3; k++) {
          const d = mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.6, 24, 1, false, 0, Math.PI), mat, (k - 1) * Math.min(0.45, w * 0.55), 0.02, 0);
          d.rotation.z = Math.PI / 2; d.rotation.y = 0.3;
          g.add(d);
        }
        return g;
      },
      () => { // たこ
        const g = new THREE.Group();
        const red = M(0xd84a3a, { roughness: 0.4 });
        const head = mesh(new THREE.SphereGeometry(0.32, 24, 16), red, 0, 0.55, 0);
        head.scale.y = 1.25;
        g.add(head);
        for (const s of [-1, 1]) g.add(mesh(new THREE.SphereGeometry(0.06, 12, 8), M(0x111111), s * 0.12, 0.42, 0.28));
        for (let k = 0; k < 8; k++) {
          const a = k / 8 * Math.PI * 2;
          const pts = [new THREE.Vector3(0, 0.3, 0), new THREE.Vector3(Math.cos(a) * 0.3, 0.1, Math.sin(a) * 0.3),
            new THREE.Vector3(Math.cos(a) * 0.55, 0.05, Math.sin(a) * 0.55), new THREE.Vector3(Math.cos(a + 0.4) * 0.65, 0.15, Math.sin(a + 0.4) * 0.65)];
          g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 16, 0.055, 8), red));
        }
        return g;
      },
    ];

    // 調理法: 色をどれだけ寄せるか・つや
    const COOK = [
      { c: 0x5a2d0c, a: 0.32 },                 // 焼き
      { c: 0xd8901c, a: 0.45, rough: 0.9 },     // 揚げ
      { c: 0xffffff, a: 0.2, steam: true },     // 蒸し
      { c: 0x7a4a1a, a: 0.28, rough: 0.12 },    // 煮
      { c: 0x3a2008, a: 0.22, rough: 0.25 },    // 炒め
      null,                                     // 生
      { c: 0x3a1e0a, a: 0.55 },                 // 燻製
      { c: 0xbfe0ff, a: 0.4, rough: 0.15, ice: true }, // 冷やし
    ];

    function buildFood(idx) {
      if (food) { foodRoot.remove(food); food.traverse(o => { o.geometry?.dispose(); o.material?.dispose?.(); }); }
      fx.length = 0;
      food = new THREE.Group();
      const base = BASES[idx[2]]();
      const fill = FILLS[idx[1]](base.w);
      fill.position.y = base.top;
      food.add(base.g, fill);
      const ck = COOK[idx[0]];
      if (ck) {
        const tint = new THREE.Color(ck.c);
        food.traverse(o => {
          if (!o.material) return;
          o.material = o.material.clone();
          o.material.color.lerp(tint, ck.a);
          if (ck.rough !== undefined) o.material.roughness = ck.rough;
        });
        if (idx[0] === 0) { // 焼き目
          for (let k = 0; k < 7; k++) food.add(mesh(new THREE.SphereGeometry(0.09, 10, 6), M(0x1e0e04, { roughness: 1 }), rnd(-0.7, 0.7), base.top + rnd(0.05, 0.3), rnd(-0.3, 0.3)));
        }
        if (ck.steam) {
          for (let k = 0; k < 6; k++) {
            const s = mesh(new THREE.SphereGeometry(0.22, 16, 12), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.25, depthWrite: false }), rnd(-0.5, 0.5), 0, rnd(-0.2, 0.2));
            s.userData = { t: k / 6, y0: base.top + 0.3 };
            food.add(s); fx.push(s);
          }
        }
        if (ck.ice) {
          for (let k = 0; k < 6; k++) {
            const a = k / 6 * Math.PI * 2 + 0.3;
            const c = mesh(new THREE.BoxGeometry(0.28, 0.28, 0.28), new THREE.MeshStandardMaterial({ color: 0xdff2ff, transparent: true, opacity: 0.55, roughness: 0.05 }), Math.cos(a) * 1.3, 0.14, Math.sin(a) * 1.0);
            c.rotation.set(rnd(0, 1), rnd(0, 1), rnd(0, 1));
            food.add(c);
          }
        }
      }
      // 大きすぎるものは縮める
      const box = new THREE.Box3().setFromObject(food);
      const size = box.getSize(new THREE.Vector3());
      const s = Math.min(1, 2.9 / size.x, 2.9 / size.z, 1.9 / size.y);
      food.scale.setScalar(s);
      food.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
      fx.forEach(f => { f.castShadow = false; });
      foodRoot.add(food);
      foodPop = 0;
    }

    // ---------- 音 ----------
    let ac = null;
    function beep(freq, dur, type = 'square', vol = 0.08) {
      if (muted) return;
      try {
        ac ??= new (window.AudioContext || window.webkitAudioContext)();
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = type; o.frequency.value = freq;
        g.gain.setValueAtTime(vol, ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
        o.connect(g).connect(ac.destination);
        o.start(); o.stop(ac.currentTime + dur);
      } catch {}
    }

    // ---------- 進行 ----------
    let state = 'idle'; // idle | spin | result
    let spins = store.get('spins', 0);
    let result = [0, 0, 0];
    const controls = document.getElementById('controls');

    function start() {
      if (state === 'spin') return;
      state = 'spin';
      beep(440, 0.08);
      drums.forEach(d => { d.spinning = true; d.target = null; });
      document.getElementById('label').classList.add('hide');
      render();
    }
    function stop(i) {
      const d = drums[i];
      if (state !== 'spin' || !d.spinning || d.target !== null) return;
      // 次に正面へ来るコマで止まる（目押し）
      d.target = (Math.ceil(d.theta / STEP - 0.5) + 0.5) * STEP;
      render();
    }
    function landed(i) {
      const d = drums[i];
      d.spinning = false;
      d.index = indexFor(d.theta);
      d.bounce = 1;
      beep(660 + i * 110, 0.1, 'triangle', 0.12);
      if (drums.every(x => !x.spinning)) {
        result = drums.map(x => x.index);
        spins++; store.set('spins', spins);
        state = 'result';
        buildFood(result);
        render();
      }
    }
    function nextStop() { const i = drums.findIndex(d => d.spinning && d.target === null); if (i >= 0) stop(i); }

    const words = () => result.map((k, i) => REELS[i][lang][k]);
    function render() {
      document.getElementById('label').classList.toggle('hide', state === 'spin');
      document.documentElement.lang = lang;
      document.title = t('title');
      document.getElementById('back').textContent = t('back');
      document.getElementById('lang').textContent = t('lang');
      document.getElementById('sound').innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>${muted ? '<path d="M17 9l5 6M22 9l-5 6"/>' : '<path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>'}</svg>`;
      if (state !== 'spin') {
        document.getElementById('name').textContent = t('name')(words());
        document.getElementById('count').textContent = state === 'result' ? t('count')(spins) : '';
      }
      controls.innerHTML = '';
      if (state === 'spin') {
        drums.forEach((d, i) => {
          const b = document.createElement('button');
          b.className = 'stop'; b.textContent = t('stop');
          b.disabled = !d.spinning || d.target !== null;
          b.addEventListener('pointerdown', e => { e.preventDefault(); stop(i); });
          controls.append(b);
        });
      } else {
        const b = document.createElement('button');
        b.className = 'go'; b.textContent = state === 'result' ? t('again') : t('start');
        b.addEventListener('click', start);
        controls.append(b);
        if (state === 'result') {
          const a = document.createElement('a');
          a.className = 'post'; a.textContent = t('post');
          a.href = `https://x.com/intent/post?text=${encodeURIComponent(t('share')(words()))}&url=${encodeURIComponent(SHARE_URL)}`;
          if (!matchMedia('(pointer: coarse)').matches) { a.target = '_blank'; a.rel = 'noopener'; }
          controls.append(a);
        }
      }
    }

    document.getElementById('lang').addEventListener('click', () => {
      lang = lang === 'ja' ? 'en' : 'ja'; store.set('lang', lang);
      setDrumTextures(); render();
    });
    document.getElementById('sound').addEventListener('click', () => { muted = !muted; store.set('muted', muted); render(); });
    addEventListener('keydown', e => {
      if (e.code !== 'Space' && e.code !== 'Enter') return;
      e.preventDefault();
      if (e.repeat) return;
      if (state === 'spin') nextStop(); else start();
    });

    // 食べ物はドラッグで回せる
    let drag = null;
    renderer.domElement.addEventListener('pointerdown', e => { drag = { x: e.clientX }; });
    addEventListener('pointermove', e => { if (drag) { foodSpin += (e.clientX - drag.x) * 0.012; drag.x = e.clientX; } });
    addEventListener('pointerup', () => { drag = null; });

    // ---------- 画面サイズ ----------
    const camFar = { pos: new THREE.Vector3(), look: new THREE.Vector3() };
    const camClose = { pos: new THREE.Vector3(), look: new THREE.Vector3() };
    let view = 0, viewWait = 0;
    const _p = new THREE.Vector3(), _l = new THREE.Vector3();
    function applyCam() {
      const k = view * view * (3 - 2 * view);
      camera.position.copy(_p.copy(camFar.pos).lerp(camClose.pos, k));
      camera.lookAt(_l.copy(camFar.look).lerp(camClose.look, k));
    }
    function resize() {
      const w = stage.clientWidth, h = stage.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      const half = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
      const needW = 3.45, needH = 3.3; // 中心からの半幅・半高さ
      const dist = Math.max(needH / half, needW / (half * camera.aspect));
      // 縦長で余った高さは、リールを下へ寄せて食べ物を大きくするのに使う
      const extra = Math.max(0, dist * half - needH);
      const lift = extra * 0.75;
      camFar.pos.set(0, 0.9 + lift, dist);
      camFar.look.set(0, -0.05 + lift, 0);
      foodScale = Math.min(1.8, 1 + extra * 0.45);
      foodRoot.position.y = FOOD_Y + lift * 1.3;
      // 結果: 食べ物に寄った斜め上からの眺め。上に料理名ぶんの余白を空ける
      const fr = 1.75 * foodScale, cy = foodRoot.position.y + 0.55 * foodScale;
      const cd = Math.max(fr / (half * camera.aspect), fr * 1.25 / half);
      camClose.pos.set(0, cy + cd * 0.42, cd);
      camClose.look.set(0, cy - fr * 0.12, 0);
      applyCam();
      camera.updateProjectionMatrix();
    }
    addEventListener('resize', resize);

    // ---------- ループ ----------
    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      drums.forEach((d, i) => {
        if (d.spinning) {
          d.theta += SPEED[i] * dt;
          if (d.target !== null && d.theta >= d.target) { d.theta = d.target; landed(i); }
        }
        let wob = 0;
        if (d.bounce > 0) { d.bounce = Math.max(0, d.bounce - dt * 5); wob = Math.sin(d.bounce * Math.PI * 2) * 0.06 * d.bounce; }
        d.pivot.rotation.x = d.theta + wob;
      });
      if (state === 'result') viewWait += dt; else viewWait = 0;
      const goal = state === 'result' && viewWait > 0.35 ? 1 : 0;
      view += Math.sign(goal - view) * Math.min(Math.abs(goal - view), dt * (goal ? 1.6 : 4));
      applyCam();
      if (!drag) foodSpin += dt * 0.5;
      foodRoot.rotation.y = foodSpin;
      if (foodPop < 1) { foodPop = Math.min(1, foodPop + dt * 4); }
      const p = foodPop, sc = (1 + Math.sin(p * Math.PI) * 0.12) * foodScale;
      foodRoot.scale.set(sc * p, sc * p, sc * p);
      for (const s of fx) {
        s.userData.t = (s.userData.t + dt * 0.5) % 1;
        s.position.y = s.userData.y0 + s.userData.t * 1.0;
        s.material.opacity = 0.28 * Math.sin(s.userData.t * Math.PI); s.scale.setScalar(0.6 + s.userData.t);
      }
      renderer.render(scene, camera);
      requestAnimationFrame(loop);
    }

    setDrumTextures();
    buildFood(result);
    foodPop = 1;
    resize();
    render();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
