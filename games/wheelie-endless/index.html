const MAXQ = 1400;

// ---------- props behind the track (recycled by index) ----------
const props = [];
function recycler(count, spacing, back, make, place) {
  const slots = Array.from({ length: count }, () => { const o = make(); o.userData.idx = null; o.userData.dy = 0; scene.add(o); props.push(o); return o; });
  return x => {
    const i0 = Math.floor((x - back) / spacing);
    for (let i = i0; i < i0 + count; i++) {
      const o = slots[((i % count) + count) % count];
      if (o.userData.idx !== i) { o.userData.idx = i; place(o, i, i * spacing); }
    }

// ---------- bike physics (cannon-es): chassis + two wheels on hinges + the rider locked on the seat ----------
// While riding everything moves in the vertical plane (x forward, y up); after a crash that lock comes off.
// Throttle drives the rear hinge motor, the brake holds both wheels, and leaning puts a torque on the bike
// (like shifting the rider's weight; it also turns the bike in the air).
function createBikeSim(CANNON, P) {
  const { R, WB, COM, RIDER } = P;
  const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -P.gravity, 0) });
  world.broadphase = new CANNON.SAPBroadphase(world);
  world.solver.iterations = 25;
  world.allowSleep = false;
  const GROUND = 1, BIKE = 2, RIDERG = 4;
  const mGround = new CANNON.Material('ground'), mTire = new CANNON.Material('tire'), mBody = new CANNON.Material('body');
  world.addContactMaterial(new CANNON.ContactMaterial(mTire, mGround, { friction: 1.4, restitution: P.tyreBounce, contactEquationStiffness: P.tyreK, contactEquationRelaxation: 3 }));
  world.addContactMaterial(new CANNON.ContactMaterial(mBody, mGround, { friction: 0.55, restitution: 0.15 }));
  const V3 = (x, y, z = 0) => new CANNON.Vec3(x, y, z);
  const planar = (b, on) => { b.linearFactor.set(1, 1, on ? 0 : 1); b.angularFactor.set(on ? 0 : 1, on ? 0 : 1, 1); };

  const chassis = new CANNON.Body({ mass: P.mChassis, material: mBody, collisionFilterGroup: BIKE, collisionFilterMask: GROUND });
  chassis.addShape(new CANNON.Box(V3(0.5, 0.12, 0.16)), V3(0.7 - COM.x, 0.5 - COM.y));
  chassis.addShape(new CANNON.Box(V3(0.24, 0.07, 0.12)), V3(0.02 - COM.x, 0.6 - COM.y));
  const setI = I => { chassis.inertia.set(I, I, I); chassis.invInertia.set(1 / I, 1 / I, 1 / I); chassis.updateInertiaWorld(true); };
  setI(P.iChassis);
  const wheel = () => { const b = new CANNON.Body({ mass: P.mWheel, material: mTire, collisionFilterGroup: BIKE, collisionFilterMask: GROUND }); b.addShape(new CANNON.Sphere(R)); return b; };
  const rear = wheel(), front = wheel();
  const rider = new CANNON.Body({ mass: P.mRider, material: mBody, collisionFilterGroup: RIDERG, collisionFilterMask: GROUND });
  rider.addShape(new CANNON.Box(V3(0.15, 0.32, 0.17)));
  const bodies = [chassis, rear, front, rider];
  bodies.forEach(b => { world.addBody(b); planar(b, true); });
  const damp = crashed => { chassis.angularDamping = crashed ? 0.3 : 0.2; chassis.linearDamping = 0.02; rider.angularDamping = crashed ? 0.3 : 0.1; for (const w of [rear, front]) { w.angularDamping = 0.03; w.linearDamping = 0.02; } };
  damp(false);

  function place(x, y, ph, v) {
    const c = Math.cos(ph), s = Math.sin(ph), at = (bx, by) => V3(x + bx * c - by * s, y + bx * s + by * c);
    const q = new CANNON.Quaternion(); q.setFromAxisAngle(V3(0, 0, 1), ph);
    chassis.position.copy(at(COM.x, COM.y)); chassis.quaternion.copy(q);
    rear.position.copy(at(0, 0)); front.position.copy(at(WB, 0));
    rider.position.copy(at(RIDER.x, RIDER.y)); rider.quaternion.copy(q);
    rear.quaternion.set(0, 0, 0, 1); front.quaternion.set(0, 0, 0, 1);
    for (const b of bodies) { b.velocity.set(v, 0, 0); b.angularVelocity.set(0, 0, 0); b.force.set(0, 0, 0); b.torque.set(0, 0, 0); planar(b, true); }

  }
  place(0, R, 0, 0);
  // the wheels are held firmly on axles (they can't move into the frame); the bounce comes from soft, springy tyres
  const axle = (w, ax) => new CANNON.HingeConstraint(chassis, w, { pivotA: V3(ax - COM.x, -COM.y), axisA: V3(0, 0, 1), pivotB: V3(0, 0, 0), axisB: V3(0, 0, 1), collideConnected: false, maxForce: 1e7 });
  world.addConstraint(axle(rear, 0)); world.addConstraint(axle(front, WB));
  const lock = new CANNON.LockConstraint(chassis, rider, { maxForce: 1e7 });
  world.addConstraint(lock);
  // the engine turns the rear wheel; the frame gets the opposite push (that's what lifts the front)
  const drive = torque => { rear.torque.z -= torque; chassis.torque.z += torque; };

  // the ground: one static box per polyline segment near the bike (wide: the grass beside is at the same height)
  const segBodies = new Map();
  function segBody(a, b) {
    const body = new CANNON.Body({ mass: 0, material: mGround, collisionFilterGroup: GROUND, collisionFilterMask: BIKE | RIDERG });
    const len = Math.hypot(b.x - a.x, b.y - a.y), ang = Math.atan2(b.y - a.y, b.x - a.x);
    body.addShape(new CANNON.Box(V3(len / 2 + 0.02, 0.5, 20)));
    body.quaternion.setFromAxisAngle(V3(0, 0, 1), ang);
    body.position.set((a.x + b.x) / 2 + Math.sin(ang) * 0.5, (a.y + b.y) / 2 - Math.cos(ang) * 0.5, 0);
    body.userData = { ground: true };
    world.addBody(body); return body;
  }
  function syncGround(x) {
    const i0 = segIndex(x - 20), i1 = Math.min(pts.length - 2, segIndex(x + 40));
    const want = new Set();
    for (let i = i0; i <= i1; i++) {
      const key = ptBase + i; want.add(key);
      if (!segBodies.has(key)) segBodies.set(key, segBody(pts[i], pts[i + 1]));
    }
    for (const [k, b] of segBodies) if (!want.has(k)) { world.removeBody(b); segBodies.delete(k); }
  }
  function clearGround() { for (const b of segBodies.values()) world.removeBody(b); segBodies.clear(); }

  const hit = { front: false, rear: false, chassis: false, rider: false };
  const listen = (b, k) => b.addEventListener('collide', e => { if (e.body.userData?.ground) hit[k] = true; });
  listen(front, 'front'); listen(rear, 'rear'); listen(chassis, 'chassis'); listen(rider, 'rider');

  const pitchOf = b => 2 * Math.atan2(b.quaternion.z, b.quaternion.w);
  const sim = {
    world, chassis, rear, front, rider, hit, bodies, riding: true,
    reset(x, y) {
      if (!sim.riding) { world.addConstraint(lock); sim.riding = true; }
      world.gravity.set(0, -P.gravity, 0); damp(false);
      clearGround(); syncGround(x);

    },
    pitch: () => pitchOf(chassis),
    // ctl: { gas: 0..1, brake: 0..1, lean: -1..1 }
    step(dt, ctl) {
      if (sim.riding) {
        if (ctl.hold) { rear.angularVelocity.scale(0.8, rear.angularVelocity); front.angularVelocity.scale(0.8, front.angularVelocity); }
        else if (ctl.gas > 0) { const wv = -rear.angularVelocity.z * R; // gentler pull from a standstill, and an anti-wheelie: the engine eases off as the front climbs past ~12°
          const aw = THREE.MathUtils.clamp(1 - ((ctl.rel || 0) - 0.2) / 0.45, 0.1, 1);
          drive(P.gasTorque * ctl.gas * aw * THREE.MathUtils.clamp((P.vMax - wv) / 2, 0, 1) * (0.6 + 0.4 * Math.min(1, Math.max(0, wv) / 6))); }
        // leaning turns the bike toward a spin rate set by how far the finger moved (strong, but it can't run away)
        if (ctl.lean) { const w = chassis.angularVelocity.z, wt = -ctl.lean * P.leanRate; chassis.torque.z += THREE.MathUtils.clamp(P.leanGain * (wt - w), -P.leanTorque, P.leanTorque); }
      } else { rear.angularVelocity.scale(0.985, rear.angularVelocity); front.angularVelocity.scale(0.985, front.angularVelocity); }
      hit.front = hit.rear = hit.chassis = hit.rider = false;
      world.step(dt);
      syncGround(rear.position.x);
    },
    // crash: let the rider go, hold the wheels, and free everything to tumble in 3D
    release() {
      if (!sim.riding) return;
      sim.riding = false;
      world.removeConstraint(lock);
      for (const b of bodies) planar(b, false);
      chassis.angularVelocity.x += (Math.random() < 0.5 ? -1 : 1) * 0.7;
      rider.angularVelocity.x += (Math.random() - 0.5) * 1.5;
      rider.velocity.z += (Math.random() - 0.5) * 0.8;
      damp(true);
      world.gravity.set(0, -9.8, 0);
    },
  };
  return sim;
}

// ---------- game state ----------
const DT = 1 / 120, COM = { x: 0.62, y: 0.42 }, RIDER_C = { x: 0.42, y: 1.02 };
const sim = createBikeSim(CANNON, { R, WB, COM, RIDER: RIDER_C, gravity: 8.5, mChassis: 48, mWheel: 5, mRider: 42, iChassis: 14, gasTorque: 115, vMax: 16, leanTorque: 700, leanRate: 1.6, leanGain: 320, tyreK: 1.5e5, tyreBounce: 0.4, dt: DT });

function reset() {
  runSeed = Math.random() * 100;
  clearDecos(); resetCourse();
  scrapeStop();
  sim.reset(0, 0);
  S.b = S.bt = S.gas = 0; S.far = 0; syncS();
  state = 'ready'; playT = 0; crash = null; finalD = 0; stuckT = 0;
  seatRider();
  for (const m of sparks) { m.userData.life = 0; m.position.y = -50; }
  for (const m of dusts) { m.userData.life = 0; m.position.y = -50; }
  for (const o of props) o.userData.idx = null;
}
function begin() { if (state === 'ready') { state = 'play'; playT = 0; } }
function step(dt) {
  if (state === 'ready' || state === 'play') {

    // the body follows the finger (drag) or the arrow keys, and comes back to the middle when let go
    const kb = keyLean, tgt = dragLean !== null ? dragLean : kb;
    S.bt = tgt;
    S.b += (S.bt - S.b) * (1 - Math.exp(-dt / 0.05));
    const gas = state === 'play' ? Math.max(S.gas, keyGas) : 0;
    extendCourse(S.x + 220);
    sim.step(dt, { gas, brake: 0, hold: state === 'ready', lean: state === 'play' ? S.b : 0, rel: S.ph - Math.atan(slopeAt(S.x)) });
    syncS();
    if (state !== 'play') return;
    if (sim.hit.rear && Math.abs(sim.rear.angularVelocity.z * R) > 3 && zoneAt(S.x) === 1 && Math.random() < dt * 20) emitDust(V(S.x - 0.3, H(S.x) + 0.05, (Math.random() - 0.5) * 0.3), 1, 0.22, 0.2, '#c8ab82');

const riderOff = new THREE.Vector3();

  riderOff.set(riderG.position.x - RIDER_C.x, riderG.position.y - RIDER_C.y, 0); // pelvis, seen from the rider body's centre

// ---------- input ----------
// one finger does it all: hold = throttle, slide left/right while holding = shift the body (right = forward),
// let go = the engine lets off and the bike rolls on by itself
const pointers = new Map();

});

addEventListener('pointerup', up); addEventListener('pointercancel', up);

addEventListener('blur', () => { pointers.clear(); dragLean = null; keysHeld.clear(); updKeys(); S.gas = 0; });

// result image: the crash scene squared, with the distance and the title on top

  const mid = camLook.clone().project(camera); // the crash is framed around the camera's look point
  const side = Math.min(W, Hc, Math.max(Hc - (view.top + 20) * dpr, W * 0.5));
  const cx = (mid.x * 0.5 + 0.5) * W, cy = (-mid.y * 0.5 + 0.5) * Hc;
