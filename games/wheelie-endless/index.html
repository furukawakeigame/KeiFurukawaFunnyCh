  if (type === 'nose') { S.ph = Math.atan(slopeAt(S.x)); S.w = 0; crash.rolling = true; crash.rollW = 0.8; }
  human.root.updateMatrixWorld(true);
  scene.attach(riderG);
  crash.rv.set(S.v * (type === 'nose' ? 0.78 : 0.8), type === 'nose' ? 3.2 : 2.6, type === 'nose' ? -0.3 : -0.5);
  crash.rw = type === 'nose' ? -7.5 : 5.5;

  const gx = S.x + (type === 'nose' ? WB : -0.2);
  emitDust(V(gx, H(gx) + 0.1, 0), 8, 0.4);
  for (let i = 0; i < 14; i++) emitSpark(V(gx, H(gx) + 0.05, 0), S.v * 0.6);

}
function stepCrash(dt) {

  }

    if (c.roll >= Math.PI / 2) { c.roll = Math.PI / 2; c.rollW = 0; sndCrash(); scrapeStart(); emitDust(V(S.x + 0.6, H(S.x) + 0.1, 0.3), 8, 0.45, 1.4); }
  }

}

// ---------- input: drag up = lean forward, drag down = lean back ----------
const pointers = new Map();
let keyDir = 0;
const dragScale = () => Math.min(stage.clientHeight, 760) * 0.26; // px for the lean to go from neutral to full
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (state === 'result' || state === 'crash') return;

});

  const p = pointers.get(e.pointerId);

  // keep the anchor under the finger when it goes past the end, so coming back responds at once

addEventListener('pointerup', up); addEventListener('pointercancel', up);
const keysHeld = new Set();
const KEYS = { ArrowUp: 1, w: 1, W: 1, ArrowDown: -1, s: -1, S: -1 };

addEventListener('keydown', e => {
  if (e.target.closest?.('button, a, select')) return;

  if (!(e.key in KEYS)) return;

});
addEventListener('keyup', e => { keysHeld.delete(e.key); updKeys(); });
addEventListener('blur', () => { pointers.clear(); keysHeld.clear(); keyDir = 0; });

// ---------- result ----------
const coarse = matchMedia('(pointer: coarse)').matches;

}
function showResult() {

  const a = $('share');
  a.href = `https://x.com/intent/post?text=${encodeURIComponent(L[lang].post(finalD))}&url=${encodeURIComponent(URL_)}`;

function again() {

$('again').onclick = () => { again(); $('again').blur(); };
$('share').addEventListener('click', e => {
  const text = `${L[lang].post(finalD)}\n${URL_}`;
  if (coarse && navigator.share) {
    e.preventDefault();
    const file = shareFile();
    navigator.share(file && navigator.canShare?.({ files: [file] }) ? { files: [file], text } : { text }).catch(() => {});
    return;
  }
  const img = resultImage();
  if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'wheelie-endless.png'; d.click(); }
});
// result image: the crash scene squared, with the distance and the title on top
let snap = null, shareCache = null;
function takeSnap() {
  render(1);
  const W = cv.width, Hc = cv.height, dpr = W / cv.clientWidth;
  const mx = (S.x + riderG.position.x) / 2 + 0.3, mid = V(mx, H(mx) + 0.6, 0).project(camera);
  const side = Math.min(W, Hc, Math.max(Hc - (view.top + 20) * dpr, W * 0.5));
  const cx = (mid.x * 0.5 + 0.5) * W, cy = (-mid.y * 0.5 + 0.5) * Hc;
  const sx = THREE.MathUtils.clamp(cx - side / 2, 0, W - side), sy = THREE.MathUtils.clamp(cy - side * 0.62, 0, Hc - side);
  snap = document.createElement('canvas'); snap.width = snap.height = 1080;
  snap.getContext('2d').drawImage(cv, sx, sy, side, side, 0, 0, 1080, 1080);
  shareCache = null;
}
function resultImage() {
  if (!snap) return null;
  const c = document.createElement('canvas'); c.width = c.height = 1080;
  const g = c.getContext('2d');
  g.drawImage(snap, 0, 0);
  g.textAlign = 'center'; g.lineJoin = 'round';
  const font = px => `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans KR", "Noto Sans Thai", sans-serif`;
  const text = (str, y, px, max, fill, line) => {
    g.font = font(px);
    const w = g.measureText(str).width; if (w > max) { px *= max / w; g.font = font(px); }
    g.lineWidth = px * .16; g.strokeStyle = line; g.strokeText(str, 540, y); g.fillStyle = fill; g.fillText(str, 540, y);
  };
  text(`${finalD}m`, 250, 220, 960, '#fff', '#b8502e');
  text(t('title'), 1030, 60, 900, '#fff', '#3a2a40');
  return c;
}
function prepareShare() {
  if (!snap) return;
  const key = lang;
  if (shareCache?.key === key) return;
  shareCache = { key, file: null };
  resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'wheelie-endless.png', { type: 'image/png' }); }, 'image/png');

const shareFile = () => shareCache?.key === lang ? shareCache.file : null;

// ---------- gauge: the front's angle above the ground ----------
const GC = [34, 90], GR = 62, GMAX = 95;
const arcPt = d => { const a = d * Math.PI / 180; return [GC[0] + GR * Math.cos(a), GC[1] - GR * Math.sin(a)]; };
const arc = (d0, d1) => { const [x0_, y0] = arcPt(d0), [x1, y1] = arcPt(d1); return `M${x0_.toFixed(1)} ${y0.toFixed(1)}A${GR} ${GR} 0 0 0 ${x1.toFixed(1)} ${y1.toFixed(1)}`; };
$('gTrack').setAttribute('d', arc(-3, GMAX + 3));
[['gR1', 0, 6], ['gY1', 6, 18], ['gG', 18, 66], ['gY2', 66, 82], ['gR2', 82, GMAX]].forEach(([id, a, b]) => $(id).setAttribute('d', arc(a, b)));
let gaugeDeg = -1, gaugeOn = null;
function updGauge(th) {
  const on = state === 'ready' || state === 'play';
  if (on !== gaugeOn) { $('gauge').classList.toggle('off', !on); gaugeOn = on; }
  const d = Math.round(THREE.MathUtils.clamp(th * 180 / Math.PI, 0, GMAX));
  if (d === gaugeDeg) return; gaugeDeg = d;
  const x = GC[0] + (GR + 8) * Math.cos(d * Math.PI / 180), y = GC[1] - (GR + 8) * Math.sin(d * Math.PI / 180);
  $('gNeedle').setAttribute('x2', x.toFixed(1)); $('gNeedle').setAttribute('y2', y.toFixed(1));
}

// ---------- layout / camera: a little behind and to the side ----------
const view = { top: 120, bottom: 90, w: 1, h: 1 };
const camDir = V(-0.74, 0.36, 0.57).normalize();
const camLook = V(0, 0, 0), camOff = V(0, 0, 0);
let camD = 6, camY = 0, camInit = false;
function resize() {
  const w = stage.clientWidth, Hs = stage.clientHeight;
  renderer.setSize(w, Hs, false);
  let top = $('gauge').getBoundingClientRect().bottom + 6;
  if (state === 'result') top = Array.from($('result').querySelectorAll('.big, .sub, .btn')).reduce((m, el) => Math.max(m, el.getBoundingClientRect().bottom), top) + 10;
  const bottom = 90;
  top = Math.min(top, Hs * 0.55);
  // tall screens: the spare height goes to the sky
  const need = w * 1.25;
  if (Hs - top - bottom > need) top += (Hs - top - bottom - need) * 0.6;
  const fh = Math.max(100, Hs - top - bottom);
  Object.assign(view, { top, bottom, w, h: fh });
  camera.aspect = w / fh;
  camera.setViewOffset(w, fh, 0, -top, w, Hs);
  camera.updateProjectionMatrix();
}
addEventListener('resize', () => { resize(); camInit = false; });
// rides along with the bike exactly (no lag at speed); the framing and the height ease
function frameCamera(anchor, cx, cy, hx, hy, dt, snapNow) {
  const vf = THREE.MathUtils.degToRad(camera.fov), hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);
  const d = Math.min(Math.max(hy / Math.tan(vf / 2), hx / Math.tan(hf / 2)) + 1.0, 40);
  const k = snapNow ? 1 : 1 - Math.exp(-dt * 3);
  camOff.x += (cx - anchor - camOff.x) * k; camD += (d - camD) * k;
  camY += (cy - camY) * (snapNow ? 1 : 1 - Math.exp(-dt * 5));
  camLook.set(anchor + camOff.x, camY, 0);

// ---------- render ----------
let lastT = performance.now(), simT = lastT, hintT = 0;
function render(alpha, fdt = 0) {
  const x = P.x + (S.x - P.x) * alpha, ph = P.ph + (S.ph - P.ph) * alpha, b = P.b + (S.b - P.b) * alpha;
  const gy = H(x), s = Math.atan(slopeAt(x));
  // bike
  const rk = crash ? crash.roll / (Math.PI / 2) : 0;
  bikeBase.position.set(x, gy + R + Math.max(-0.03, bounce * 0.04) * (1 - rk) - (R - 0.24) * rk, 0);
  bikeBase.rotation.x = crash ? crash.roll : 0;
  bike.rotation.z = ph;
  rearW.rotation.z = -x / R;
  frontW.rotation.z = -x / R * 0.97;
  if (state === 'ready' || state === 'play') poseRiding(ph - s, b);
  human.update(fdt);
  // world
  layRibbons(x);
  far.position.set(x, 0, 0);
  floor.position.x = x;
  const ready = state === 'ready';
  updateProps(x, ready);
  if (!ready) updateHazards(x - x0);
  bestMark.visible = !ready && best > 0;
  if (bestMark.visible) { const bx = x0 + best; bestMark.position.set(bx, H(bx), 0); bestMark.rotation.z = Math.atan(slopeAt(bx)); bestMark.userData.flag.rotation.x = Math.sin(performance.now() / 300) * 0.25; }
  // camera
  let cx, cy, hx, hy;
  if (crash) { const rx = riderG.position.x, lo = Math.min(x, rx) - 0.6, hi = Math.max(x + WB, rx + 1) + 0.6; cx = (lo + hi) / 2 + 0.8; cy = H(cx) + 0.5; hx = Math.max(1.8, (hi - lo) / 2 * 0.75 + 0.6); hy = 1.1; }
  else { cx = x + 1.3; cy = Math.max(gy, H(x + 2)) + 0.95; hx = camera.aspect > 1.1 ? 2.4 : 1.9; hy = 1.55; }
  frameCamera(x, cx, cy, hx, hy, fdt, !camInit); camInit = true;
  sun.position.set(camLook.x + 5, camLook.y + 12, -7); sun.target.position.copy(camLook);
  renderer.render(scene, camera);
  updGauge(ph - s);
}
// before the start: a finger sliding up and down beside the bike
function updHint(dt) {

  $('hint').classList.toggle('on', on);
  if (!on) return;
  hintT += dt;
  const p = V(S.x + 0.9, H(S.x) + 1.0, 1.5).project(camera);
  const hint = $('hint');
  hint.style.left = ((p.x * 0.5 + 0.5) * stage.clientWidth).toFixed(0) + 'px';
  hint.style.top = ((-p.y * 0.5 + 0.5) * stage.clientHeight).toFixed(0) + 'px';

}
function loop(now) {
  const fdt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (now - simT > 250) simT = now - 250;
  while (simT + DT * 1000 <= now) { step(DT); simT += DT * 1000; }
  updateParticles(fdt);
  render((now - simT) / (DT * 1000), fdt);
  updHint(fdt);
  if (ac) {
    const run = state === 'ready' || state === 'play';
    const rpm = run ? 0.32 + (S.v / 26) * 0.5 + Math.max(0, accel) * 0.04 : crash && crash.t < 1.2 ? 0.08 : 0.05;
    engineTick(rpm, run ? 0.2 : crash && crash.t < 1.5 ? 0.08 : 0.04);

reset(); resize(); applyLang();
render(1);
renderer.compileAsync?.(scene, camera).catch(() => {});
window.GAME_READY = true;
requestAnimationFrame(loop);
// for automated checks
window.__game = { bikeBase, camera, riderG, get state() { return state; }, get S() { return S; }, get x0() { return x0; }, crashNow: t => startCrash(t || 'flip'), set best(v) { best = v; } };
