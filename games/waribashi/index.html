<!DOCTYPE html>
<html lang="ja">
<head>

  <meta charset="UTF-8">

  <title>割り箸割り</title>
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ふるかわけい面白チャンネル">
  <meta property="og:title" content="割り箸割り">
  <meta property="og:url" content="https://keifurukawafunnych.com/games/waribashi/">
  <meta property="og:image" content="https://keifurukawafunnych.com/games/waribashi/icon.png">
  <meta name="twitter:card" content="summary">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: #f4efe6; color: #3a2e22;
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans Thai", sans-serif;
      display: flex; flex-direction: column; overflow: hidden;
      padding-bottom: calc(80px + env(safe-area-inset-bottom));
      user-select: none; -webkit-user-select: none;
    }
    header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
    header a { color: #3a2e22; text-decoration: none; font-size: 14px; margin-right: auto; }
    header button, header select {
      height: 34px; border: 1px solid #c9b89d; background: #fff; border-radius: 8px; color: #3a2e22; font-size: 14px;
    }
    header button { width: 40px; display: grid; place-items: center; padding: 0; }
    #stage { flex: 1; position: relative; min-height: 0; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
    #result {
      position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
      width: min(340px, calc(100% - 32px)); background: #fff; border-radius: 16px;
      box-shadow: 0 6px 24px rgba(60,40,20,.18); padding: 16px; text-align: center; display: none;
    }
    #result.show { display: block; }
    #score { font-size: 40px; font-weight: 800; line-height: 1.1; }
    #gauge { height: 12px; background: #eee3d2; border-radius: 6px; overflow: hidden; margin: 10px 0 14px; }
    #gauge div { height: 100%; width: 0; background: #d98b3a; border-radius: 6px; transition: width .8s ease-out; }
    .btns { display: flex; gap: 8px; }
    .btns > * {
      flex: 1; height: 44px; border-radius: 10px; font-size: 15px; font-weight: 700;
      display: grid; place-items: center; text-decoration: none; border: 0; cursor: pointer;
    }
    #again { background: #d98b3a; color: #fff; }
    #post { background: #111; color: #fff; }
  </style>
</head>
<body>
  <header>
    <a href="../../" id="back"></a>
    <button id="sound" aria-label="sound"></button>
    <select id="lang" aria-label="language">
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>
      <option value="en">English</option>
      <option value="th">ไทย</option>
    </select>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="result">
      <div id="score"></div>
      <div id="gauge"><div></div></div>
      <div class="btns">
        <button id="again"></button>
        <a id="post" target="_blank" rel="noopener"></a>
      </div>
    </div>
  </div>
<script>
const GAME_URL = 'https://keifurukawafunnych.com/games/waribashi/';
const TAG = '#割り箸割りゲーム';
const L = {
  ja: { back: '← トップへ戻る', title: '割り箸割り', again: 'もう一度', post: 'Xに投稿', broke: '折れた',
        text: r => r.broken ? '割り箸が折れた…' : `割り箸を均等度${r.p}%で割った！` },
  ko: { back: '← 톱으로 돌아가기', title: '나무젓가락 쪼개기', again: '다시 하기', post: 'X에 게시', broke: '부러졌다',
        text: r => r.broken ? '나무젓가락이 부러졌다…' : `나무젓가락을 균등도 ${r.p}%로 쪼갰다!` },
  en: { back: '← Back to top', title: 'Chopstick Split', again: 'Play again', post: 'Post on X', broke: 'Snapped',
        text: r => r.broken ? 'My chopsticks snapped...' : `I split my chopsticks with ${r.p}% evenness!` },
  th: { back: '← กลับหน้าแรก', title: 'แยกตะเกียบ', again: 'เล่นอีกครั้ง', post: 'โพสต์ลง X', broke: 'หักแล้ว',
        text: r => r.broken ? 'ตะเกียบหักซะแล้ว…' : `แยกตะเกียบได้เท่ากัน ${r.p}%!` },
};
const store = {
  get(k) { try { return localStorage.getItem('waribashi:' + k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem('waribashi:' + k, v); } catch {} },
};
function pickLang() {
  const saved = store.get('lang');
  if (saved && L[saved]) return saved;
  for (const l of navigator.languages || [navigator.language || '']) {
    const c = (l || '').slice(0, 2).toLowerCase();
    if (L[c]) return c;
  }
  return 'en';
}
let lang = pickLang();
const $ = id => document.getElementById(id);
$('lang').value = lang;
$('lang').onchange = e => { lang = e.target.value; store.set('lang', lang); applyLang(); };

// ---- sound ----
let soundOn = store.get('sound') !== '0';
let ac = null;
function drawSoundBtn() {
  $('sound').innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3a2e22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#3a2e22"/>${soundOn ? '<path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/>' : '<path d="M16 9l6 6M22 9l-6 6"/>'}</svg>`;
}
$('sound').onclick = () => { soundOn = !soundOn; store.set('sound', soundOn ? '1' : '0'); drawSoundBtn(); };
drawSoundBtn();
function audio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { ac = null; } }
  if (ac && ac.state === 'suspended') ac.resume();
}
function crack(vol, freq, len) {
  if (!soundOn || !ac) return;
  const n = Math.floor(ac.sampleRate * len);
  const buf = ac.createBuffer(1, n, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
  const src = ac.createBufferSource(); src.buffer = buf;
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = 1.5;
  const g = ac.createGain(); g.gain.value = vol;
  src.connect(bp).connect(g).connect(ac.destination); src.start();
}

// ---- canvas ----
const cv = $('cv'), ctx = cv.getContext('2d');
let VW = 0, VH = 0, DPR = 1;
let LEN, W, OX, OY; // stick length, width, top-center position
function resize() {
  const r = cv.getBoundingClientRect();
  DPR = Math.min(2, window.devicePixelRatio || 1);
  VW = r.width; VH = r.height;
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
  LEN = Math.min(VH * 0.78, 560);
  W = Math.max(30, Math.min(LEN * 0.12, VW * 0.14));
  OX = VW / 2; OY = (VH - LEN) / 2;
}
window.addEventListener('resize', resize);

// ---- game state ----
const STEPS = 240;
let S;
function reset() {
  S = {
    phase: 'play',          // play | done | broken
    depth: 0.05,            // crack depth (0..1 of LEN)
    off: new Float32Array(STEPS + 1), // crack offset (fraction of W) per step
    bias: (Math.random() < 0.5 ? -1 : 1) * (0.25 + Math.random() * 0.25),
    phaseSeed: Math.random() * 10,
    tips: [mkTip(-1), mkTip(1)],
    sep: 0, t: 0, fall: { x: 0, y: 0, a: 0, vx: 0, vy: 0, va: 0 },
    started: false, crackAcc: 0, result: null,
  };
  $('result').classList.remove('show');
}
function mkTip(side) { return { side, x: 0, y: 0, vx: 0, vy: 0, grab: null, tx: 0, ty: 0, gx: 0, gy: 0 }; }
function stepIndex(d) { return Math.min(STEPS, Math.max(0, Math.round(d * STEPS))); }
function offAt(d) { return S.off[stepIndex(d)]; }

// ---- input ----
const pointers = new Map();
function local(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left - OX, y: e.clientY - r.top - OY }; }
cv.addEventListener('pointerdown', e => {
  audio();
  if (S.phase !== 'play') return;
  e.preventDefault();
  cv.setPointerCapture(e.pointerId);
  const p = local(e);
  let side = p.x < 0 ? -1 : 1;
  let tip = S.tips[side < 0 ? 0 : 1];
  if (tip.grab !== null) { tip = S.tips[side < 0 ? 1 : 0]; if (tip.grab !== null) return; }
  tip.grab = e.pointerId;
  tip.gx = tip.x - p.x; tip.gy = tip.y - p.y;
  tip.tx = p.x + tip.gx; tip.ty = p.y + tip.gy;
  pointers.set(e.pointerId, tip);
  S.started = true;
});
cv.addEventListener('pointermove', e => {
  const tip = pointers.get(e.pointerId); if (!tip) return;
  e.preventDefault();
  const p = local(e);
  tip.tx = p.x + tip.gx; tip.ty = p.y + tip.gy;
});
function release(e) {
  const tip = pointers.get(e.pointerId); if (!tip) return;
  tip.grab = null; pointers.delete(e.pointerId);
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

// ---- physics ----
const KF = 70, KW = 30, C = 3.2;   // finger spring, wood spring, damping
function physics(dt) {
  S.t += dt;
  if (S.phase === 'play') {
    for (const tp of S.tips) {
      let ax = -KW * tp.x - C * tp.vx, ay = -KW * tp.y - C * tp.vy;
      if (tp.grab !== null) { ax += KF * (tp.tx - tp.x); ay += KF * (tp.ty - tp.y); }
      ax -= KW * 0.6 * S.depth * tp.x; // deeper crack: stiffer
      tp.vx += ax * dt; tp.vy += ay * dt;
      tp.x += tp.vx * dt; tp.y += tp.vy * dt;
      // halves can't pass through each other
      if (tp.side * tp.x < 0) { tp.x = 0; tp.vx = 0; }
      tp.y = Math.max(-LEN * 0.3, Math.min(LEN * 0.3, tp.y));
    }
    const [l, r] = S.tips;
    const open = r.x - l.x;
    const target = 0.05 + Math.max(0, open - W * 0.15) / (W * 1.6);
    const gap = target - S.depth;
    if (gap > 0) {
      const adv = Math.min(gap, dt * 0.9);
      const shake = Math.max(0, gap - 0.12) * 6 + (Math.hypot(l.vx, l.vy) + Math.hypot(r.vx, r.vy)) / (W * 40);
      const steer = (l.y - r.y) / (open + W);
      let i = stepIndex(S.depth);
      const end = stepIndex(S.depth + adv);
      for (; i < end; i++) {
        const d = i / STEPS;
        const grain = S.bias + 0.35 * Math.sin(d * 9 + S.phaseSeed);
        const ds = 1 / STEPS;
        S.off[i + 1] = S.off[i] + ds * (LEN / W) * (steer * 1.6 + grain * 0.12 + (Math.random() - 0.5) * shake);
        if (Math.abs(S.off[i + 1]) >= 0.5) { breakOff(i + 1); return; }
      }
      S.depth += adv;
      S.crackAcc += adv;
      if (S.crackAcc > 0.02) { S.crackAcc = 0; crack(0.15 + Math.random() * 0.2, 1500 + Math.random() * 2500, 0.03); }
      if (S.depth >= 1) finish();
    }
  } else if (S.phase === 'done') {
    S.sep += (W * 0.9 - S.sep) * Math.min(1, dt * 6);
  } else if (S.phase === 'broken') {
    const f = S.fall;
    f.vy += LEN * 2.5 * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.a += f.va * dt;
    for (const tp of S.tips) { tp.vx += (-KW * tp.x - C * tp.vx) * dt; tp.x += tp.vx * dt; tp.vy += (-KW * tp.y - C * tp.vy) * dt; tp.y += tp.vy * dt; }
  }
}
function finish() {
  S.depth = 1;
  for (let i = 0; i <= STEPS; i++) if (!isFinite(S.off[i])) S.off[i] = 0;
  let sum = 0;
  for (let i = 0; i <= STEPS; i++) sum += Math.abs(S.off[i]);
  const mean = sum / (STEPS + 1);
  const p = Math.max(0, Math.min(100, Math.round(100 - mean * 2 * 100)));
  S.phase = 'done';
  S.result = { broken: false, p };
  pointers.clear(); S.tips.forEach(t => t.grab = null);
  crack(0.9, 900, 0.12); crack(0.6, 2500, 0.08);
  setTimeout(showResult, 700);
}
function breakOff(i) {
  S.off[i] = Math.sign(S.off[i]) * 0.5;
  S.breakIdx = i;
  S.depth = i / STEPS;
  S.breakSide = S.off[i] < 0 ? -1 : 1;
  const tp = S.tips[S.breakSide < 0 ? 0 : 1];
  S.fall = { x: tp.x, y: tp.y, a: 0, vx: tp.vx * 0.5 + S.breakSide * W * 2, vy: -LEN * 0.6, va: S.breakSide * 6 };
  S.phase = 'broken';
  S.result = { broken: true, p: 0 };
  pointers.clear(); S.tips.forEach(t => t.grab = null);
  crack(1, 700, 0.15); crack(0.7, 2000, 0.1);
  setTimeout(showResult, 900);
}

// ---- result ----
function showResult() {
  const r = S.result;
  $('result').classList.add('show');
  $('gauge').firstElementChild.style.width = '0';
  requestAnimationFrame(() => requestAnimationFrame(() => { $('gauge').firstElementChild.style.width = r.p + '%'; }));
  applyLang();
}
$('again').onclick = () => reset();
function applyLang() {
  const t = L[lang];
  document.documentElement.lang = lang;
  document.title = t.title;
  $('back').textContent = t.back;
  $('again').textContent = t.again;
  $('post').textContent = t.post;
  const r = S && S.result;
  if (r) {
    $('score').textContent = r.broken ? t.broke : r.p + '%';
    $('post').href = `https://x.com/intent/post?text=${encodeURIComponent(t.text(r) + '\n' + TAG)}&url=${encodeURIComponent(GAME_URL)}`;
  }
}
if (matchMedia('(pointer: coarse)').matches) { $('post').removeAttribute('target'); $('post').removeAttribute('rel'); }

// ---- drawing ----
// u: across (-0.5..0.5 of W), d: along (0..1 of LEN). side: -1 left half, 1 right half, 0 solid
function mp(u, d, side) {
  let x = u * W, y = d * LEN;
  if (S.phase === 'done') { x += side * S.sep; return [x, y]; }
  if (side !== 0 && d < S.depth) {
    const f = 1 - d / S.depth;
    const tp = S.tips[side < 0 ? 0 : 1];
    x += tp.x * f; y += tp.y * f;
    // slight rotation feel
    x += tp.y * f * 0.0;
  }
  return [x, y];
}
function halfPoly(side, d0, d1) {
  const pts = [];
  const N = 40;
  for (let k = 0; k <= N; k++) { const d = d0 + (d1 - d0) * k / N; pts.push(mp(side * 0.5, d, side)); }
  for (let k = N; k >= 0; k--) { const d = d0 + (d1 - d0) * k / N; pts.push(mp(offAt(d), d, side)); }
  return pts;
}
function fillWood(pts, shade) {
  ctx.beginPath();
  pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
  ctx.closePath();
  ctx.fillStyle = shade ? '#e2bf86' : '#ecd09d';
  ctx.fill();
  ctx.strokeStyle = '#b58c55'; ctx.lineWidth = 1.2; ctx.lineJoin = 'round';
  ctx.stroke();
}
function grain(side, d0, d1) {
  ctx.strokeStyle = 'rgba(160,115,60,.35)'; ctx.lineWidth = 1;
  for (let g = 0; g < 7; g++) {
    const u0 = -0.42 + g * 0.14;
    ctx.beginPath();
    let first = true;
    for (let k = 0; k <= 30; k++) {
      const d = d0 + (d1 - d0) * k / 30;
      const u = u0 + 0.02 * Math.sin(d * 23 + g * 2);
      if (side !== 0) { const o = offAt(d); if ((side < 0 && u > o - 0.02) || (side > 0 && u < o + 0.02)) { first = true; continue; } }
      const [x, y] = mp(u, d, side);
      first ? ctx.moveTo(x, y) : ctx.lineTo(x, y); first = false;
    }
    ctx.stroke();
  }
}
function drawStick() {
  const D = S.depth;
  if (S.phase === 'broken') {
    const bs = S.breakSide;
    // remaining half (the side not broken) still attached
    const keep = -bs;
    if (D < 1) { fillWood(solidPoly(D), false); grain(0, D, 1); }
    fillWood(halfPoly(keep, 0, D), keep > 0); grain(keep, 0, D);
    // falling sliver
    ctx.save();
    ctx.translate(S.fall.x, S.fall.y + S.fall.y * 0);
    ctx.translate(bs * 0.25 * W, D * LEN * 0.5);
    ctx.rotate(S.fall.a);
    ctx.translate(-bs * 0.25 * W, -D * LEN * 0.5);
    const pts = [];
    const N = 40;
    for (let k = 0; k <= N; k++) { const d = D * k / N; pts.push([bs * 0.5 * W, d * LEN]); }
    for (let k = N; k >= 0; k--) { const d = D * k / N; pts.push([offAt(d) * W, d * LEN]); }
    fillWood(pts, bs > 0);
    ctx.restore();
    return;
  }
  if (S.phase === 'play' && D < 1) { fillWood(solidPoly(D), false); grain(0, D, 1); }
  const end = S.phase === 'done' ? 1 : D;
  fillWood(halfPoly(-1, 0, end), false); grain(-1, 0, end);
  fillWood(halfPoly(1, 0, end), true); grain(1, 0, end);
  if (S.phase === 'play') {
    // crack tip line
    const [x, y] = mp(offAt(D), D, 0);
    ctx.fillStyle = '#7a5a33'; ctx.beginPath(); ctx.arc(x, y, 1.6, 0, 7); ctx.fill();
  }
}
function solidPoly(D) {
  return [mp(-0.5, D, 0), mp(0.5, D, 0), mp(0.5, 1, 0), mp(-0.5, 1, 0)];
}
function drawSpring(x0, y0, x1, y1) {
  const dx = x1 - x0, dy = y1 - y0, len = Math.hypot(dx, dy);
  if (len < 4) return;
  const nx = -dy / len, ny = dx / len, n = 10, amp = Math.max(3, 9 - len / 30);
  ctx.beginPath(); ctx.moveTo(x0, y0);
  for (let i = 1; i < n; i++) {
    const t = i / n, s = (i % 2 ? 1 : -1) * amp;
    ctx.lineTo(x0 + dx * t + nx * s, y0 + dy * t + ny * s);
  }
  ctx.lineTo(x1, y1);
  ctx.strokeStyle = '#8a8a8a'; ctx.lineWidth = 2; ctx.stroke();
}
function drawHands() {
  for (const tp of S.tips) {
    const [hx, hy] = mp(tp.side * 0.25, 0.015, tp.side);
    if (tp.grab !== null) {
      const fx = tp.tx - tp.gx + (hx - tp.x) * 0, fy = tp.ty - tp.gy;
      drawSpring(hx, hy, fx + (hx - tp.x), fy + (hy - tp.y));
      ctx.fillStyle = 'rgba(217,139,58,.85)';
      ctx.beginPath(); ctx.arc(fx + (hx - tp.x), fy + (hy - tp.y), 14, 0, 7); ctx.fill();
    }
  }
  if (!S.started) {
    // hint: pulsing dots and outward arrows
    const k = (Math.sin(S.t * 4) + 1) / 2;
    for (const side of [-1, 1]) {
      const [hx, hy] = mp(side * 0.25, 0.015, side);
      ctx.fillStyle = `rgba(217,139,58,${0.35 + 0.4 * k})`;
      ctx.beginPath(); ctx.arc(hx, hy, 12 + 4 * k, 0, 7); ctx.fill();
      const ax = hx + side * (W * 0.9 + 10 * k);
      ctx.strokeStyle = '#d98b3a'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(hx + side * W * 0.5, hy); ctx.lineTo(ax, hy);
      ctx.moveTo(ax - side * 9, hy - 9); ctx.lineTo(ax, hy); ctx.lineTo(ax - side * 9, hy + 9); ctx.stroke();
    }
  }
}
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, VW, VH);
  let oy = OY;
  if (S.result && $('result').classList.contains('show')) {
    const panel = $('result').offsetHeight + 24;
    const room = VH - panel;
    if (LEN > room - 20) oy = Math.min(OY, (room - LEN) / 2);
    const sc = Math.min(1, (room - 20) / LEN);
    ctx.translate(OX, Math.max(10, (room - LEN * sc) / 2));
    ctx.scale(sc, sc);
  } else ctx.translate(OX, oy);
  drawStick();
  if (S.phase === 'play') drawHands();
}

let last = performance.now();
function loop(now) {
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  const sub = 4;
  for (let i = 0; i < sub; i++) physics(dt / sub);
  draw();
  requestAnimationFrame(loop);
}
resize(); reset(); applyLang();
requestAnimationFrame(loop);
</script>
</body>
</html>
