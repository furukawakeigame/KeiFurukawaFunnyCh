<script type="module">
import * as THREE from "three";

const TAG = '#割り箸割りゲーム';
const L = {
  ja: { back: '← トップへ戻る', title: '割り箸割り', again: 'もう一度', post: 'Xに投稿', broke: '折れた',
        text: r => r.broken ? '割り箸が折れた…' : `割り箸を均等度${r.p}%で割った！` },
  ko: { back: '← 톱으로 돌아가기', title: '나무젓가락 쪼개기', again: '다시 하기', post: 'X에 게시', broke: '부러졌다',

// ---- 3D ----
const cv = $('cv');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#f4efe6');
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 300);
scene.add(new THREE.HemisphereLight(0xffffff, 0xcbb89a, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(4, 10, 9); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 14, bottom: -4, near: 1, far: 40 });
scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.ShadowMaterial({ opacity: 0.12 }));
floor.position.z = -1.2; floor.receiveShadow = true;
scene.add(floor);

const LEN = 10, W = 1.1, T = 0.7;  // stick length, width, thickness

// wood texture drawn on canvas
function woodTex() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 1024;
  const x = c.getContext('2d');
  x.fillStyle = '#ecd09d'; x.fillRect(0, 0, 256, 1024);
  for (let i = 0; i < 40; i++) {
    const u = Math.random() * 256;
    x.strokeStyle = `rgba(165,118,62,${0.12 + Math.random() * 0.25})`;
    x.lineWidth = 1 + Math.random() * 2.5;
    x.beginPath();
    for (let v = 0; v <= 1024; v += 16) x.lineTo(u + Math.sin(v * 0.01 + i) * 4, v);
    x.stroke();

  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(1 / W, 1 / LEN);

}
const tex = woodTex();
const matA = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85 });
const matB = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85, color: 0xf2e2c8 });

// ---- game state ----
const STEPS = 240;
let S;
const halves = [-1, 1].map(side => {
  const pivot = new THREE.Group();
  const mesh = new THREE.Mesh(new THREE.BufferGeometry(), side < 0 ? matA : matB);
  mesh.castShadow = true;
  pivot.add(mesh); scene.add(pivot);
  return { side, pivot, mesh };
});
const solid = new THREE.Mesh(new THREE.BufferGeometry(), matA);
solid.castShadow = true; scene.add(solid);

// spring + finger markers
const springMat = new THREE.LineBasicMaterial({ color: 0x777777 });
const fingerMat = new THREE.MeshBasicMaterial({ color: 0xd98b3a, transparent: true, opacity: 0.85 });
const hands = [0, 1].map(() => {
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(Array.from({ length: 12 }, () => new THREE.Vector3())), springMat);
  const ball = new THREE.Mesh(new THREE.SphereGeometry(0.28, 20, 14), fingerMat);
  scene.add(line, ball);
  return { line, ball };
});
// hint arrows
const hintMat = new THREE.MeshBasicMaterial({ color: 0xd98b3a, transparent: true });
const hints = [-1, 1].map(side => {
  const g = new THREE.Group();
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 1.2, 12), hintMat);
  shaft.rotation.z = Math.PI / 2; shaft.position.x = side * 0.6;
  const head = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.5, 16), hintMat);
  head.rotation.z = -side * Math.PI / 2; head.position.x = side * 1.4;
  g.add(shaft, head); scene.add(g);
  return g;
});

function reset() {
  S = {
    phase: 'play', depth: 0.05,
    off: new Float32Array(STEPS + 1),
    bias: (Math.random() < 0.5 ? -1 : 1) * (0.25 + Math.random() * 0.25),
    seed: Math.random() * 10,
    tips: [-1, 1].map(side => ({ side, a: 0, w: 0, grab: null, tx: 0, ty: 0, gx: 0, gy: 0 })),
    builtIdx: -1, sep: 0, t: 0, started: false, crackAcc: 0, result: null,
    fall: null,
  };
  rebuild(true);
  $('result').classList.remove('show');
}
const idx = d => Math.min(STEPS, Math.max(0, Math.round(d * STEPS)));
const offAt = d => S.off[idx(d)];
const yAt = d => LEN * (1 - d);

function extrude(pts) {
  const shape = new THREE.Shape(pts.map(([x, y]) => new THREE.Vector2(x, y)));
  const g = new THREE.ExtrudeGeometry(shape, { depth: T, bevelEnabled: false, curveSegments: 1 });
  g.translate(0, 0, -T / 2);
  return g;
}
// outline of one half above the crack tip, in world coords
function halfPts(side, D) {
  const pts = [], N = Math.max(2, Math.round(D * 60));
  for (let k = 0; k <= N; k++) { const d = D * k / N; pts.push([side * W / 2, yAt(d)]); }
  for (let k = N; k >= 0; k--) { const d = D * k / N; pts.push([offAt(d) * W, yAt(d)]); }
  return pts;
}
function rebuild(force) {
  const i = idx(S.depth);
  if (!force && i === S.builtIdx) return;
  S.builtIdx = i;
  const D = S.depth;
  for (const h of halves) { h.mesh.geometry.dispose(); h.mesh.geometry = extrude(halfPts(h.side, D)); }
  solid.geometry.dispose();
  if (D < 1) { solid.geometry = extrude([[-W / 2, yAt(1)], [W / 2, yAt(1)], [W / 2, yAt(D)], [-W / 2, yAt(D)]]); solid.visible = true; }

}
// pivot = crack tip
function pivotPt() { return new THREE.Vector2(offAt(S.depth) * W, yAt(S.depth)); }
// grab point at the top of a half, rotated by its outward angle
function tipPos(tp) {
  const p = pivotPt();
  const rx = tp.side * W * 0.25 - p.x, ry = LEN - p.y;
  const ang = -tp.side * tp.a, c = Math.cos(ang), s = Math.sin(ang);
  return new THREE.Vector2(p.x + rx * c - ry * s, p.y + rx * s + ry * c);
}

// ---- view ----
let VW = 1, VH = 1, camY = LEN / 2, camDist = 0;
function resize() {
  const r = cv.parentElement.getBoundingClientRect();
  VW = r.width; VH = r.height;
  renderer.setSize(VW, VH, false);
  camera.aspect = VW / VH;
  camera.updateProjectionMatrix();
}
function frame(snap) {
  const tanH = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2);
  const showing = $('result').classList.contains('show');
  const free = showing ? Math.max(0.3, 1 - ($('result').offsetHeight + 24) / VH) : 1;
  const h = Math.max(LEN * (showing ? 1.12 : 1.25) / free, W * 9 / camera.aspect);
  const dist = h / 2 / tanH;
  const k = snap ? 1 : 0.12;
  camDist += (dist - camDist) * k;
  const visH = 2 * camDist * tanH;
  const ty = showing ? LEN / 2 - (visH * (1 - free)) / 2 : LEN / 2;

  camera.position.set(camDist * 0.18, camY + camDist * 0.1, camDist);
  camera.lookAt(0, camY, 0);

window.addEventListener('resize', resize);

// ---- input ----
const ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0), hit = new THREE.Vector3();
function worldAt(e) {
  const r = cv.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), camera);

}
const pointers = new Map();
cv.addEventListener('pointerdown', e => {

  cv.setPointerCapture(e.pointerId);

  tp.grab = e.pointerId; tp.gx = q.x - p.x; tp.gy = q.y - p.y; tp.tx = q.x; tp.ty = q.y;

cv.addEventListener('pointermove', e => {
  const tp = pointers.get(e.pointerId); if (!tp) return;
  e.preventDefault();

function release(e) { const tp = pointers.get(e.pointerId); if (!tp) return; tp.grab = null; pointers.delete(e.pointerId); }
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

// ---- physics (each half is a rigid body hinged at the crack tip) ----
const KF = 3.0, KW = 3.0, C = 1.6;   // finger spring, wood spring, damping
function physics(dt) {

    const ax = [0, 0];
    for (const tp of S.tips) {
      let alpha = -KW * tp.a - C * tp.w;
      if (tp.grab !== null) {
        const q = tipPos(tp);
        const rx = q.x - p.x, ry = q.y - p.y, rl = Math.hypot(rx, ry);
        const fx = (tp.tx - q.x) * KF, fy = (tp.ty - q.y) * KF;
        alpha += -tp.side * (rx * fy - ry * fx) / (rl * rl); // outward torque, in angle units

      if (tp.a > 1.2) { tp.a = 1.2; tp.w = 0; }
    }
    const [l, r] = S.tips;
    const span = LEN * S.depth;
    const open = (Math.sin(l.a) + Math.sin(r.a)) * span;
    const target = 0.05 + Math.max(0, open - W * 0.15) / (W * 1.6);
    const gap = target - S.depth;
    if (gap > 0) {
      const adv = Math.min(gap, dt * 0.9);
      const shake = Math.max(0, gap - 0.12) * 6 + (Math.abs(l.w) + Math.abs(r.w)) * 0.3;
      const steer = (ax[1] - ax[0]) / (KF * W * 2);
      const end = idx(S.depth + adv);
      for (let i = idx(S.depth); i < end; i++) {
        const d = i / STEPS;
        const grain = S.bias + 0.35 * Math.sin(d * 9 + S.seed);
        S.off[i + 1] = S.off[i] + (LEN / W / STEPS) * (steer * 0.4 + grain * 0.08 + (Math.random() - 0.5) * shake);
        if (Math.abs(S.off[i + 1]) >= 0.5) { breakOff(i + 1); return; }
      }
      // the hinge moves down: shrink the angle so the tips stay put
      S.depth = Math.min(1, S.depth + adv);

function endPlay() { pointers.clear(); S.tips.forEach(t => t.grab = null); }
function finish() {

  let sum = 0;
  for (let i = 0; i <= STEPS; i++) sum += Math.abs(S.off[i]);
  const p = Math.max(0, Math.min(100, Math.round(100 - sum / (STEPS + 1) * 200)));

function breakOff(i) {

  const tp = S.tips[S.breakSide < 0 ? 0 : 1];

  S.phase = 'broken'; S.result = { broken: true, p: 0 };

  setTimeout(showResult, 1100);

// ---- result ----
function showResult() {

    $('score').textContent = r.broken ? t.broke : r.p + '%';

}

// ---- render ----
const tmp = new THREE.Vector3();
function place() {
  rebuild(false);
  const p = pivotPt();
  for (const h of halves) {
    const tp = S.tips[h.side < 0 ? 0 : 1];
    if (S.phase === 'done') {
      h.pivot.position.set(h.side * S.sep, 0, 0); h.mesh.position.set(0, 0, 0);
      h.pivot.rotation.set(0, 0, 0);

    h.mesh.position.set(-p.x, -p.y, 0);
    h.pivot.rotation.set(0, 0, -h.side * tp.a);
    if (S.phase === 'broken' && h.side === S.breakSide) {
      h.pivot.position.add(S.fall.p);
      h.pivot.rotation.copy(S.fall.rot);
    }
  }
  S.tips.forEach((tp, i) => {
    const hd = hands[i];
    const on = S.phase === 'play' && tp.grab !== null;
    hd.line.visible = hd.ball.visible = on;
    if (!on) return;
    const q = tipPos(tp);
    const a = new THREE.Vector3(q.x, q.y, T / 2), b = new THREE.Vector3(tp.tx, tp.ty, T / 2);
    const d = b.clone().sub(a), len = d.length();
    const n = new THREE.Vector3(-d.y, d.x, 0).normalize().multiplyScalar(Math.max(0.06, 0.3 - len * 0.05));
    const pos = hd.line.geometry.attributes.position;
    for (let k = 0; k < 12; k++) {
      tmp.copy(a).addScaledVector(d, k / 11);
      if (k > 0 && k < 11 && len > 0.01) tmp.addScaledVector(n, k % 2 ? 1 : -1);
      pos.setXYZ(k, tmp.x, tmp.y, tmp.z);
    }
    pos.needsUpdate = true;
    hd.ball.position.copy(b);
  });
  const k = (Math.sin(S.t * 4) + 1) / 2;
  hints.forEach((g, i) => {
    g.visible = S.phase === 'play' && !S.started;
    g.position.set((i ? 1 : -1) * (W * 0.75 + k * 0.3), LEN - 0.3, T / 2);
  });
  hintMat.opacity = 0.5 + 0.5 * k;
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  for (let i = 0; i < 4; i++) physics(dt / 4);
  place(); frame(false);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
resize(); reset(); applyLang(); frame(true);
window.__game = { get S() { return S; }, camera, LEN, W };
requestAnimationFrame(loop);
</script>
<script>
setTimeout(() => { if (!window.__game) document.getElementById('err').style.display = 'block'; }, 6000);
</script>
