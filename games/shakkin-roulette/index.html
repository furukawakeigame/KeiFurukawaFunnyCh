      const h = Math.max(60, H - rsv);
      camera.setViewOffset(w, h, 0, 0, w, H);
      camera.aspect = w / h;
      const tn = Math.tan(camera.fov * Math.PI / 360);
      const d = Math.max(1.38 / (tn * camera.aspect), (1.42 * Math.sin(TILT) + 0.25) / tn);
      camera.position.set(0, d * Math.sin(TILT), d * Math.cos(TILT));
      camera.lookAt(0, -0.05, 0.02);
      camera.updateProjectionMatrix();
    }
    new ResizeObserver(resize).observe(stage);
    addEventListener('resize', resize);

    // 玉の動き：物理演算した軌跡（毎秒 SIM_FPS コマ）をなめらかにつないで再生する
    let wheelAngle = 0, lastShown = '';
    const qa = new THREE.Quaternion(), qb = new THREE.Quaternion();
    function spinPose(now) {
      const fr = anim.frames, f = Math.max(0, (now - anim.start) / 1000 * anim.fps);
      const i = Math.min(fr.length - 1, Math.floor(f)), j = Math.min(fr.length - 1, i + 1), k = Math.min(1, f - i);
      const L2 = n => fr[i][n] + (fr[j][n] - fr[i][n]) * k;
      // このコマまでに起きた衝突の音を鳴らす（種類と強さつき）
      for (let q = (anim.played ?? -1) + 1; q <= i; q++) if (fr[q][1]) sndImpact(fr[q][1], fr[q][2]);
      anim.played = i;
      const bs = [];
      for (let b = 0; b < anim.nb; b++) {
        const o = 3 + b * 7;
        qa.set(fr[i][o + 3], fr[i][o + 4], fr[i][o + 5], fr[i][o + 6]); qb.set(fr[j][o + 3], fr[j][o + 4], fr[j][o + 5], fr[j][o + 6]);
        bs.push({ x: L2(o), y: L2(o + 1), z: L2(o + 2), q: qa.clone().slerp(qb, k) });
      }
      return { wa: L2(0), balls: bs, done: i >= fr.length - 1, wheelSpd: Math.abs((fr[j][0] - fr[i][0]) * anim.fps) };
    }

    function frame(now) {
      requestAnimationFrame(frame);
      const key = [G && G.phase, sel.join()].join('|');
      if (key !== lastShown) { lastShown = key; faceDirty = true; buildPins(); }
      if (faceDirty) { faceDirty = false; drawFace(); }
      if (anim && G && G.phase !== 'bet') {
        const s = spinPose(now);
        wheelAngle = s.wa;
        let spd = 0, grounded = false, onTrack = false;
        s.balls.forEach((p, b) => {
          const m = balls[b];
          if (b === 0) {
            if (m.userData.px !== undefined) {
              const d = Math.hypot(p.x - m.userData.px, p.z - m.userData.pz, p.y - m.userData.py);
              spd = d < 0.5 ? d / Math.max(0.001, (now - m.userData.t) / 1000) : 0;
            }
            m.userData.px = p.x; m.userData.py = p.y; m.userData.pz = p.z; m.userData.t = now;
            const r = Math.hypot(p.x, p.z); onTrack = r > 1.02;
            grounded = p.y < (r > 1.02 ? surfaceY(r) : 0.035) + BALL_R + 0.012;
          }
          m.visible = true; m.position.set(p.x, p.y, p.z); m.quaternion.copy(p.q);
        });
        for (let b = s.balls.length; b < balls.length; b++) balls[b].visible = false;
        rollSound(s.done ? 0 : Math.min(1, spd / 14) * (grounded ? 1 : 0), onTrack);
        wheelSound(s.done ? 0 : Math.min(1, s.wheelSpd / 2.2));
      } else {
        // 賭けを選んでいる間は、止まった所に玉を置いたまま（次に回すまで）
        if (!anim) balls.forEach(b => { b.visible = false; });
        balls[0].userData.px = undefined; rollSound(0); wheelSound(0);
        wheelAngle = G ? G.wheelAngle : 0;
        if (anim) { const s = spinPose(anim.start + anim.frames.length / anim.fps * 1000 + 1000); s.balls.forEach((p, b) => { balls[b].position.set(p.x, p.y, p.z); }); }
      }
      wheel.rotation.y = -wheelAngle;
      animateCat(now);
      selHeads.forEach(h => { h.position.y = h.userData.y + 0.015 + 0.015 * Math.sin(now / 130); });
      markGroup.children.forEach(m => { const s = 1 + 0.25 * Math.sin(now / 200); m.scale.set(s, s, s); });
      renderer.render(scene, camera);
      if (wantSnap) { wantSnap = false; takeSnap(); }   // 描いた直後なら preserveDrawingBuffer なしで読める
    }

    // ---- 操作：盤の縁（マスの境目）をタップしてピンを立てる ----
    const ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit = new THREE.Vector3();
    cv.addEventListener('pointerdown', e => {
      e.preventDefault();
      if (!canPick()) return;
      const rect = cv.getBoundingClientRect();
      ray.setFromCamera({ x: (e.clientX - rect.left) / rect.width * 2 - 1, y: -(e.clientY - rect.top) / rect.height * 2 + 1 }, camera);
      // ピンの頭の高さあたりも押しやすいよう、少し上の面でも当たりを取る
      let best = null;
      for (const hgt of [0, PIN_H]) {
        plane.constant = -hgt;
        if (!ray.ray.intersectPlane(plane, hit)) continue;
        const r = Math.hypot(hit.x, hit.z);
        if (r < 0.4 || r > 1.3) continue;
        let th = Math.atan2(hit.x, -hit.z) - wheelAngle; th = ((th % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
        const i = Math.round(th / STEP) % N, err = Math.abs(th - Math.round(th / STEP) * STEP) * r + Math.abs(r - PIN_R) * 0.3;
        if (!best || err < best.err) best = { i, err };
      }
      if (!best) return;
      const i = best.i, before = sel.join();
      if (sel.includes(i)) sel = sel.filter(x => x !== i);
      else if (sel.length === 2) sel = [i];   // 2本立っている所で別の所を押したら、そこから選び直し
      else if (sel.length === 0 || !arcSquares(sel[0], i)) sel = [i];
      else sel = [sel[0], i];
      if (sel.join() !== before) sndTap(sel.includes(i));
      renderCtrl();
    });

    newRun();
    applyLang();
    requestAnimationFrame(frame);
  </script>
  <!-- 結果画面の広告（../../ad.js の説明を参照） -->
  <script src="../../ad.js" data-result="#adSlot" data-inline="#adSlot"></script>
</body>
