  <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
  <script>
    // CDN が読めないときの一言
    setTimeout(() => { if (!window.GAME_READY) { const m = document.getElementById('msg'); m.style.display = 'flex'; m.textContent = 'Failed to load. Please reload. / 読み込めませんでした。再読み込みしてください。'; } }, 8000);
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    window.GAME_READY = true;

    const SHARE_URL = 'https://keifurukawafunnych.com/games/sort-2048/';
    const NT = 16, CAP = 4, GOAL = 11; // 試験管16本・1本に4個・2^11 = 2048

    // ---------- 問題集 ----------
    // 玉 28〜36 個（合計 2048）を試験管に詰めた問題と、その最短手数。
    // 最短手数は重いので事前に A* 探索で計算しておき（試験管の並びを入れ替えても同じ盤面として数える）、
    // ここから毎回ランダムに選んで、試験管の並びもシャッフルする。
    // 1問 = "最短手数:試験管1,試験管2,..."（下から上へ、1文字 = 2^n の n。a=2, b=4, … j=1024。空の試験管は空文字）
    const PUZZLES = `/*PUZZLES*/`.trim().split(/\s+/);
    function requestPuzzle() {
      // 最近出た問題は避ける
      const recent = store.get('recent', []);
      let idx;
      for (let k = 0; k < 20; k++) { idx = Math.floor(Math.random() * PUZZLES.length); if (!recent.includes(idx)) break; }
      store.set('recent', [idx, ...recent].slice(0, Math.min(50, PUZZLES.length >> 1)));
      const [opt, body] = PUZZLES[idx].split(':');
      const tubes = body.split(',').map(t => [...t].map(c => c.charCodeAt(0) - 96));
      while (tubes.length < NT) tubes.push([]);
      for (let i = tubes.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [tubes[i], tubes[j]] = [tubes[j], tubes[i]]; }
      return Promise.resolve({ tubes, opt: +opt });
    }

    // ---------- 言語 ----------
    const store = {
      get(k, d) { try { const v = localStorage.getItem('sort-2048:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
      set(k, v) { try { localStorage.setItem('sort-2048:' + k, JSON.stringify(v)); } catch {} },
    };
    const autoLang = () => { for (const l of navigator.languages?.length ? navigator.languages : [navigator.language || '']) { const c = l.toLowerCase().slice(0, 2); if (['ja', 'ko', 'en', 'th'].includes(c)) return c; } return 'en'; };
    const DICT = {
      ja: { title: '2048ソート', back: '← トップへ戻る', again: 'もう一度', post: 'Xに投稿', undo: '1手戻す', restart: '最初から',
        score: s => `${s}点`, moves: (m, o) => `${m}手 ／ 最短${o}手`,
        share: (s, m, o) => `2048ソートで${s}点（${m}手／最短${o}手） #2048ソートゲーム` },
      ko: { title: '2048 소트', back: '← 처음으로', again: '다시 하기', post: 'X에 게시', undo: '한 수 되돌리기', restart: '처음부터',
        score: s => `${s}점`, moves: (m, o) => `${m}수 ／ 최단 ${o}수`,
        share: (s, m, o) => `2048 소트 ${s}점 (${m}수 / 최단 ${o}수) #2048ソートゲーム` },
      en: { title: '2048 Sort', back: '← Back to top', again: 'Play again', post: 'Post on X', undo: 'Undo', restart: 'Restart',
        score: s => `${s} pts`, moves: (m, o) => `${m} moves / best ${o}`,
        share: (s, m, o) => `I scored ${s} pts in 2048 Sort (${m} moves / best ${o}) #2048ソートゲーム` },
      th: { title: '2048 ซอร์ต', back: '← กลับหน้าแรก', again: 'เล่นอีกครั้ง', post: 'โพสต์ลง X', undo: 'ย้อนกลับ', restart: 'เริ่มใหม่',
        score: s => `${s} คะแนน`, moves: (m, o) => `${m} ตา / สั้นสุด ${o} ตา`,
        share: (s, m, o) => `ได้ ${s} คะแนนใน 2048 ซอร์ต (${m} ตา / สั้นสุด ${o} ตา) #2048ソートゲーム` },
    };
    let lang = store.get('lang', null) || autoLang();
    const t = k => DICT[lang][k];
    const langSel = document.getElementById('lang');
    langSel.value = lang;
    langSel.addEventListener('change', () => { lang = langSel.value; store.set('lang', lang); applyLang(); });
    function applyLang() {
      document.documentElement.lang = lang;
      document.title = t('title');
      document.getElementById('back').textContent = t('back');
      document.getElementById('undo').setAttribute('aria-label', t('undo'));
      document.getElementById('restart').setAttribute('aria-label', t('restart'));
      renderControls();
      if (state === 'result') { fillResult(); shareCache = null; prepareShare(); }
    }

    // ---------- 音 ----------
    let soundOn = store.get('sound', true);
    const soundBtn = document.getElementById('sound');
    const drawSoundBtn = () => {
      soundBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>${soundOn ? '<path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>' : '<path d="M17 9l5 6M22 9l-5 6"/>'}</svg>`;
    };
    drawSoundBtn();
    soundBtn.addEventListener('click', () => { soundOn = !soundOn; store.set('sound', soundOn); drawSoundBtn(); });
    let ac = null, master = null;
    // iPhone の消音モードでも鳴らす: 音の種類を「再生」にし、対応していない端末では無音の <audio> をループ再生する
    function unmuteIOS() {
      try { if (navigator.audioSession) { navigator.audioSession.type = 'playback'; return; } } catch {}
      try {
        const n = 4410, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
        const w = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
        w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
        v.setUint32(24, 44100, true); v.setUint32(28, 88200, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
        const a = document.createElement('audio');
        a.src = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' })); a.loop = true; a.setAttribute('playsinline', '');
        a.play().catch(() => {});
      } catch {}
    }
    function initAudio() {
      if (ac) return;
      unmuteIOS();
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);
        const o = ac.createOscillator(), g = ac.createGain(); g.gain.value = 0;
        o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.05);
      } catch { ac = null; }
    }
    addEventListener('pointerdown', initAudio, { capture: true });
    addEventListener('keydown', initAudio, { capture: true });
    const on = () => soundOn && ac && !silent;
    let silent = false; // 早送り中は鳴らさない
    function tone(type, f0, f1, dur, vol, delay = 0, attack = 0.004) {
      if (!on()) return;
      const now = ac.currentTime + delay;
      const o = ac.createOscillator(); o.type = type;
      o.frequency.setValueAtTime(f0, now); o.frequency.exponentialRampToValueAtTime(f1, now + dur);
      const g = ac.createGain(); g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(vol, now + attack); g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      o.connect(g).connect(master); o.start(now); o.stop(now + dur + 0.02);
    }
    // 短いノイズを複数の共鳴に通す（ガラスのカチン・コトン など）
    function hit(delay, len, decay, bands, vol) {
      if (!on()) return;
      const now = ac.currentTime + delay;
      const buf = ac.createBuffer(1, Math.floor(ac.sampleRate * len), ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ac.sampleRate * decay));
      const s = ac.createBufferSource(); s.buffer = buf;
      for (const [f, q, g0] of bands) {
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f * (0.95 + Math.random() * 0.1); bp.Q.value = q;
        const g = ac.createGain(); g.gain.value = g0 * vol; s.connect(bp).connect(g).connect(master);
      }
      s.start(now);
    }
    // ガラス: 細い共鳴がいくつも長く残る「チン」
    function sGlass(vol = 1, delay = 0) {
      const k = 0.92 + Math.random() * 0.16;
      hit(delay, 0.5, 0.09, [[2650 * k, 60, 2.2], [4300 * k, 70, 1.4], [6900 * k, 80, 0.8], [1400 * k, 30, 0.5]], 0.5 * vol);
    }
    // 玉が試験管の底に当たる「コトン」: ガラスの響き＋玉の胴鳴り
    function sLand(vol = 1, delay = 0) {
      hit(delay, 0.06, 0.006, [[1800, 4, 1], [3600, 6, 0.5], [700, 3, 0.7]], 0.9 * vol);
      tone('sine', 330, 180, 0.09, 0.22 * vol, delay);
      sGlass(0.35 * vol, delay + 0.005);
    }
    // 合体の「ポン」: 連鎖するほど高くなる
    function sMerge(level, delay = 0) {
      const f = 330 * Math.pow(1.19, level);
      tone('sine', f * 0.7, f * 1.5, 0.12, 0.35, delay);
      tone('triangle', f * 2, f * 2.4, 0.18, 0.12, delay + 0.03);
      hit(delay, 0.05, 0.008, [[f * 4, 8, 0.8]], 0.6);
    }
    // 注げない: 鈍い「ゴツ」
    function sBonk() { hit(0, 0.07, 0.01, [[420, 4, 1.2], [900, 5, 0.5]], 0.9); tone('sine', 160, 110, 0.12, 0.25); }
    // 声: 声帯の振動（のこぎり波＋息のノイズ）を、母音ごとの共鳴（フォルマント）に通す
    const VOWEL = { a: [800, 1200, 2600], i: [300, 2300, 3000], u: [350, 1250, 2500], e: [500, 1900, 2600], o: [500, 850, 2500] };
    function voice(f0, seq, dur, vol = 0.5, delay = 0) {
      if (!on()) return;
      const now = ac.currentTime + delay;
      const o = ac.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(f0 * 0.9, now);
      o.frequency.linearRampToValueAtTime(f0 * 1.35, now + dur * 0.3);
      o.frequency.exponentialRampToValueAtTime(f0 * 0.75, now + dur);
      const vib = ac.createOscillator(), vg = ac.createGain(); vib.frequency.value = 6.5; vg.gain.value = f0 * 0.03; vib.connect(vg).connect(o.frequency);
      const nb = ac.createBuffer(1, Math.floor(ac.sampleRate * dur), ac.sampleRate), nd = nb.getChannelData(0);
      for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
      const ns = ac.createBufferSource(); ns.buffer = nb;
      const src = ac.createGain(); o.connect(src);
      const ng = ac.createGain(); ng.gain.value = 0.15; ns.connect(ng).connect(src);
      const env = ac.createGain();
      env.gain.setValueAtTime(0.0001, now); env.gain.exponentialRampToValueAtTime(vol, now + 0.04);
      env.gain.setValueAtTime(vol, now + dur * 0.7); env.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      VOWEL[seq[0]].forEach((f, k) => {
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 9; bp.frequency.setValueAtTime(f, now);
        seq.forEach((v, j) => { if (j) bp.frequency.linearRampToValueAtTime(VOWEL[v][k], now + dur * j / (seq.length - 1)); });
        const g = ac.createGain(); g.gain.value = [1, 0.6, 0.3][k]; src.connect(bp).connect(g).connect(env);
      });
      env.connect(master);
      o.start(now); o.stop(now + dur + 0.05); vib.start(now); vib.stop(now + dur + 0.05); ns.start(now);
    }
    // 猫の「ニャーオ」: 毎回すこし違う
    function sMeow(delay = 0) {
      const seqs = [['i', 'a', 'o'], ['i', 'a', 'u'], ['e', 'a', 'o', 'u']];
      voice(560 + Math.random() * 120, seqs[Math.floor(Math.random() * seqs.length)], 0.55 + Math.random() * 0.2, 0.45, delay);
    }
    function sClear() {
      [0, 4, 7, 12, 16].forEach((n, i) => { const f = 523 * Math.pow(2, n / 12); tone('triangle', f, f, 0.5, 0.16, i * 0.07); sGlass(0.4, i * 0.07); });
      sMeow(0.5);
    }

    // ---------- 3D ----------
    const stage = document.getElementById('stage');
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    stage.prepend(renderer.domElement);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#cfdcd9');
    scene.fog = new THREE.Fog('#cfdcd9', 28, 60);
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    const camera = new THREE.PerspectiveCamera(30, 1, 0.5, 120);

    scene.add(new THREE.HemisphereLight('#cfe8ff', '#8a6a4a', 0.9));
    const sun = new THREE.DirectionalLight('#ffe2b8', 2.0);
    sun.position.set(6, 16, 10);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 14, bottom: -6, near: 1, far: 50 });
    sun.shadow.bias = -0.0005;
    sun.shadow.radius = 4;
    scene.add(sun, sun.target);
    sun.target.position.set(0, 4, -3);

    const rnd = (a, b) => a + Math.random() * (b - a);
    function canvasTex(w, h, draw, repeat) {
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      draw(c.getContext('2d'), w, h);
      const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; tx.anisotropy = 4;
      if (repeat) { tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.repeat.set(...repeat); }
      return tx;
    }
    // 木目
    function woodTex(base, dark, repeat) {
      return canvasTex(512, 512, (g, w, h) => {
        g.fillStyle = base; g.fillRect(0, 0, w, h);
        for (let i = 0; i < 90; i++) {
          const y = Math.random() * h, a = rnd(0.04, 0.16);
          g.strokeStyle = `rgba(${dark},${a})`; g.lineWidth = rnd(1, 5);
          g.beginPath(); g.moveTo(0, y);
          for (let x = 0; x <= w; x += 32) g.lineTo(x, y + Math.sin(x * 0.01 + i) * 6 + rnd(-2, 2));
          g.stroke();
        }
        for (let i = 0; i < 6; i++) { // 節
          const x = Math.random() * w, y = Math.random() * h;
          for (let r = 18; r > 2; r -= 4) { g.strokeStyle = `rgba(${dark},0.18)`; g.lineWidth = 2; g.beginPath(); g.ellipse(x, y, r * 1.8, r * 0.6, 0, 0, Math.PI * 2); g.stroke(); }
        }
      }, repeat);
    }
    const deskTex = woodTex('#b98a5a', '70,40,15', [3, 2]);
    const rackTex = woodTex('#d9b07a', '110,70,30', [1, 1]);
    // 壁のタイル
    const wallTex = canvasTex(512, 512, (g, w, h) => {

        const p = makePuck(e); const to = slotPos(i, k); const from = to.clone(); from.y = RACK_TOP + 2 + k * 0.6;
        p.position.copy(from); p.visible = false;
        return { p, i, k, from, to, delay: n * 0.035, landed: false };
      });
      const total = items.length ? items[items.length - 1].delay + 0.45 : 0;
      let landedSounds = 0;
      queue(total, k => {
        const tt = k * total;
        for (const it of items) {
          const u = Math.max(0, Math.min(1, (tt - it.delay) / 0.4));
          it.p.visible = tt >= it.delay;
          it.p.position.lerpVectors(it.from, it.to, u * u);
          if (u >= 1 && !it.landed) { it.landed = true; vis[it.i][it.k] = it.p; if (landedSounds++ < 14) sLand(0.35); }
        }
      }, () => { for (const it of items) { it.p.visible = true; it.p.position.copy(it.to); vis[it.i][it.k] = it.p; } });
    }

    // ---------- 手数の目盛り ----------
    const pipsEl = document.getElementById('pips');
    function updatePips(pop) {
      if (!puzzle) { pipsEl.innerHTML = ''; return; }
      const opt = puzzle.opt, m = moves(), n = Math.max(opt, m);
      const w = pipsEl.clientWidth || 200;
      const size = Math.max(7, Math.min(18, Math.floor(w / n) - 4));
      let html = '';
      for (let k = 0; k < n; k++) {
        const cls = k < m ? (k < opt ? 'on' : 'over') : '';
        html += `<i class="${cls}${pop && k === m - 1 ? ' pop' : ''}" style="width:${size}px;height:${size}px"></i>`;
      }
      pipsEl.innerHTML = html;
    }

    // ---------- 開始・クリア ----------
    async function start() {
      state = 'wait';
      document.getElementById('result').className = '';
      renderControls();
      setSelected(-1); setStuck(false);
      if (catPuck) { scene.remove(catPuck); catPuck = null; }
      snapshot = null; shareCache = null;
      for (const col of vis) for (const p of col) scene.remove(p);
      vis = board.map(() => []);
      pipsEl.innerHTML = '';
      const p = await requestPuzzle();
      puzzle = p; board = clone(p.tubes); history = [];
      state = 'play';
      updatePips(false);
      dropIn();
    }
    function startClear() {
      // 2048 の玉（猫の顔）が手前に飛び出してくる
      const b = board.findIndex(c => c.length);
      catPuck = vis[b][0];
      vis[b] = [];
      catPuck.userData.from = catPuck.position.clone();
      clearT = 0; captured = false;
      sClear();
      burst(catPuck.position.clone().add(new THREE.Vector3(0, 0.3, 0.3)), GOAL, 40, 1.6);
      for (let k = 1; k <= 9; k++) burst(catPuck.position.clone(), k, 4, 1.2);
      setTimeout(() => { if (state === 'clear') finish(); }, 1100);
    }
    // 結果の時に猫の玉を置く画面上の位置（全体のキャンバスに対する 0〜1）
    let catScreen = { x: 0.5, y: 0.55, size: 0.3 };
    function catTarget() {
      const v = new THREE.Vector3((catScreen.x) * 2 - 1, -(catScreen.y) * 2 + 1, 0.5).unproject(camera);
      const dir = v.sub(camera.position).normalize();
      return camera.position.clone().addScaledVector(dir, 9);
    }
    function stepCat(dt) {
      if (!catPuck) return;
      clearT += dt;
      const k = ease(Math.min(1, clearT / 0.9));
      const to = catTarget();
      // 猫の玉の見かけの大きさ: 距離 9 で画面の catScreen.size の高さ
      const vf = THREE.MathUtils.degToRad(camera.fov);
      const fullH = 2 * Math.tan(vf / 2) * 9 * (camera.view ? camera.view.height / camera.view.fullHeight : 1);
      const s = Math.max(1, (catScreen.size * fullH) / (PR * 2));
      // 上の面（猫の顔）をこちらに向けて起こす
      const sc = 1 + (s - 1) * k;
      catPuck.rotation.set((1.2 + Math.sin(clearT * 2.1) * 0.08) * k, 0, Math.sin(clearT * 1.6) * 0.12 * k);
      const half = new THREE.Vector3(0, PH * sc / 2, 0).applyEuler(catPuck.rotation);
      catPuck.position.lerpVectors(catPuck.userData.from, to.clone().sub(half), k);
      catPuck.position.y += Math.sin(Math.PI * k) * 1.5;
      catPuck.scale.setScalar(sc);
      // 飛び終わって少ししたら、Xに付ける画像用に画面を写す
      if (state === 'result' && !captured && clearT > 1.3) { captured = true; captureNext = true; }
    }
    function finish() {
      state = 'result';
      fillResult();
      layoutResult();
      document.getElementById('result').className = 'show';
      renderControls();
    }
    const score = () => puzzle ? Math.round((puzzle.opt / Math.max(1, moves())) * 100) : 0;
    function fillResult() {
      const r = document.getElementById('result');
      r.querySelector('.score').textContent = t('score')(score());
      r.querySelector('.moves').textContent = t('moves')(moves(), puzzle.opt);
    }

    // ---------- 画面 ----------
    const controls = document.getElementById('controls');
    const bar = document.getElementById('bar');
    function renderControls() {
      controls.innerHTML = '';
      const res = state === 'result';
      controls.classList.toggle('hide', !res);
      bar.classList.toggle('hide', res);
      if (!res) return;
      const b = document.createElement('button');
      b.className = 'go'; b.textContent = t('again');
      b.addEventListener('click', start);
      controls.append(b);
      const a = document.createElement('a');
      a.className = 'post'; a.textContent = t('post');
      const text = t('share')(score(), moves(), puzzle.opt);
      a.href = `https://x.com/intent/post?text=${encodeURIComponent(text)}&url=${encodeURIComponent(SHARE_URL)}`;
      const coarse = matchMedia('(pointer: coarse)').matches;
      if (!coarse) { a.target = '_blank'; a.rel = 'noopener'; }
      // スマホは画像ごと共有シートへ。PCは画像を保存してから投稿画面を開く
      a.addEventListener('click', e => {
        if (coarse && navigator.share) {
          e.preventDefault();
          const file = shareFile();
          const data = file && navigator.canShare?.({ files: [file] }) ? { files: [file], text: `${text}\n${SHARE_URL}` } : { text: `${text}\n${SHARE_URL}` };
          navigator.share(data).catch(() => {});
          return;
        }
        const img = resultImage();
        if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'sort-2048.png'; d.click(); }
      });
      controls.append(a);
    }

    // ---------- 画面サイズ ----------
    let frame = { x: 0, y: 0, w: 1, h: 1 }, W = 1, H = 1;
    const resultEl = document.getElementById('result');
    function bottomReserve() {
      const el = state === 'result' ? controls : bar;
      return Math.max(0, stage.getBoundingClientRect().bottom - el.getBoundingClientRect().top) + 8;
    }
    function resize() {
      W = stage.clientWidth; H = stage.clientHeight;
      renderer.setSize(W, H, false);
      // 下の80px（Xの投稿文が重なる所）と操作バーを除いた範囲に試験管立てを収める
      const bottom = Math.max(0, stage.getBoundingClientRect().bottom - bar.getBoundingClientRect().top) + 6;
      const aw = W - 16, ah = Math.max(120, H - bottom - 6);
      frame = { x: 8, y: 4, w: aw, h: ah };
      updateCamera();
      updatePips(false);
      if (state === 'result') layoutResult();
    }
    // 試験管立ての箱が frame の中にちょうど入る距離を探す
    const VIEW_DIR = new THREE.Vector3(), camCenter = new THREE.Vector3();
    function placeCamera(d) { camera.position.copy(camCenter).addScaledVector(VIEW_DIR, d); camera.lookAt(camCenter); camera.updateMatrixWorld(); camera.updateProjectionMatrix(); }
    function fitDistance(cols, rows) {
      const sz = rackSize(cols, rows);
      const corners = [];
      for (let k = 0; k < 8; k++) corners.push(new THREE.Vector3((k & 1 ? 1 : -1) * (sz.w / 2 + 0.1), k & 2 ? sz.top : -0.1, k & 4 ? 0.9 : -sz.back - 0.8));
      camCenter.set(0, sz.top * 0.47, -sz.back / 2 - 0.05);
      const fits = d => {
        placeCamera(d);
        // setViewOffset 中は投影が全体のキャンバス基準になるので、frame の範囲に直して判定する
        for (const c of corners) {
          const p = c.clone().project(camera);
          const sx = (p.x + 1) / 2 * W, sy = (1 - p.y) / 2 * H;
          if (sx < frame.x || sx > frame.x + frame.w || sy < frame.y || sy > frame.y + frame.h) return false;
        }
        return true;
      };
      let lo = 3, hi = 300;
      for (let k = 0; k < 24; k++) { const mid = (lo + hi) / 2; if (fits(mid)) hi = mid; else lo = mid; }
      return hi;
    }
    function updateCamera() {
      // 横長の画面では上から見下ろして段を詰め、試験管立てを大きく見せる
      camera.aspect = frame.w / frame.h;
      const tilt = THREE.MathUtils.lerp(0.3, 0.62, THREE.MathUtils.clamp((camera.aspect - 0.6) / 0.9, 0, 1));
      VIEW_DIR.set(0, Math.sin(tilt), Math.cos(tilt));
      camera.setViewOffset(frame.w, frame.h, -frame.x, -frame.y, W, H);
      // 4×4 より 8×2 の方がずっと大きく見える画面だけ並べ替える
      const wide = fitDistance(8, 2) * 1.3 < fitDistance(4, 4);
      const [cols, rows] = wide ? [8, 2] : [4, 4];
      if (layout !== cols + 'x' + rows) {
        flush();
        buildRack(cols, rows);
        if (state === 'play') rebuild();
      }
      placeCamera(fitDistance(cols, rows));
    }
    function layoutResult() {
      // 点数は上、猫の玉はその下。背の低い横長画面では横に並べる
      const top = frame.y, ah = H - bottomReserve() - top;
      const wide = W / Math.max(1, ah) > 1.5 && ah < 520;
      if (wide) {
        Object.assign(resultEl.style, { left: '4%', top: top + 'px', width: '46%', height: ah + 'px' });
        catScreen = { x: 0.72, y: (top + ah * 0.5) / H, size: Math.min(ah * 0.55, W * 0.3) / H };
      } else {
        const rh = Math.min(ah * 0.36, 260);
        Object.assign(resultEl.style, { left: '0', top: top + 'px', width: '100%', height: rh + 'px' });
        catScreen = { x: 0.5, y: (top + rh + (ah - rh) * 0.48) / H, size: Math.min((ah - rh) * 0.62, W * 0.55) / H };
      }
    }
    addEventListener('resize', resize);

    // ---------- 入力 ----------
    const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
    const hitBoxes = tubes.map(tb => tb.hitBox);
    stage.addEventListener('pointerdown', e => {
      if (e.button > 0) return;
      const r = renderer.domElement.getBoundingClientRect();
      ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      ray.setFromCamera(ndc, camera);
      const h = ray.intersectObjects(hitBoxes, false)[0];
      if (h) tapTube(h.object.userData.tube);
      else if (state === 'play' && selected >= 0) { flush(); const a = selected; setSelected(-1); dropTop(a); }
    });
    document.getElementById('undo').addEventListener('click', undo);
    document.getElementById('restart').addEventListener('click', restart);
    addEventListener('keydown', e => {
      if (e.key === 'z' || e.key === 'Z' || e.key === 'Backspace') undo();
      else if (e.key === 'r' || e.key === 'R') restart();
    });

    // ---------- 結果画像（Xに付ける） ----------
    let captureNext = false, captured = false, snapshot = null, shareCache = null;
    function capture() {
      // 画面に描いたばかりのキャンバスから、試験管立てと猫が入る正方形を切り抜く
      const c = renderer.domElement, sx = c.width / W, sy = c.height / H;
      // 猫の玉を真ん中にする
      const side = Math.min(W, H, Math.max(catScreen.size * H * 2.2, Math.min(W, H) * 0.6));
      const cx = catScreen.x * W, cy = catScreen.y * H + side * 0.1; // 猫は少し上、下に点数
      const x = Math.max(0, Math.min(W - side, cx - side / 2)), y = Math.max(0, Math.min(H - side, cy - side / 2));
      snapshot = document.createElement('canvas'); snapshot.width = snapshot.height = 1080;
      snapshot.getContext('2d').drawImage(c, x * sx, y * sy, side * sx, side * sy, 0, 0, 1080, 1080);
      shareCache = null; prepareShare();
    }
    function resultImage() {
      if (!snapshot || !puzzle) return null;
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const g = c.getContext('2d');
      g.drawImage(snapshot, 0, 0);
      const gr = g.createLinearGradient(0, 0, 0, 1080);
      gr.addColorStop(0, 'rgba(20,40,38,.55)'); gr.addColorStop(0.3, 'rgba(20,40,38,0)'); gr.addColorStop(0.62, 'rgba(20,40,38,0)'); gr.addColorStop(1, 'rgba(20,40,38,.7)');
      g.fillStyle = gr; g.fillRect(0, 0, 1080, 1080);
      g.textAlign = 'center'; g.fillStyle = '#fff'; g.lineJoin = 'round';
      const font = px => `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans Thai", sans-serif`;
      const text = (str, y, px, max) => {
        g.font = font(px);
        const w = g.measureText(str).width; if (w > max) { px *= max / w; g.font = font(px); }
        g.lineWidth = px * .16; g.strokeStyle = '#1d3a36'; g.strokeText(str, 540, y); g.fillText(str, 540, y);
      };
      text(t('title'), 86, 56, 900);
      text(t('score')(score()), 930, 170, 960);
      text(t('moves')(moves(), puzzle.opt), 1030, 60, 960);
      return c;
    }
    function prepareShare() {
      if (!snapshot) return;
      const key = lang;
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'sort-2048.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;

    // ---------- ループ ----------
    let last = performance.now();
    function frameLoop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      stepAnims(dt);
      stepSparks(dt);
      stepCat(dt);
      for (const tb of tubes) {
        if (tb.wob > 0) { tb.wob = Math.max(0, tb.wob - dt * 2.2); tb.inner.rotation.z = Math.sin(tb.wob * 40) * 0.07 * tb.wob; }
        else tb.inner.rotation.z = 0;
      }
      if (selected >= 0) tubes[selected].ring.material.opacity = 0.65 + Math.sin(now * 0.008) * 0.3;
      renderer.render(scene, camera);
      if (captureNext) { captureNext = false; capture(); }
      requestAnimationFrame(frameLoop);
    }
    applyLang();
    resize();
    renderer.compile(scene, camera);
    renderer.render(scene, camera);
    requestAnimationFrame(frameLoop);
    start();
  </script>
</body>
</html>
