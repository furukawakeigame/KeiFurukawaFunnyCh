    g.lineWidth = px * .16; g.strokeStyle = line; g.strokeText(str, 540, y); g.fillStyle = fill; g.fillText(str, 540, y);
  };
  text(L[lang].moves(lastMoves), 160, 140, 960, '#3d2c1e', '#fff');
  // stars
  const star = new Path2D('M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z');
  for (let i = 0; i < 3; i++) {
    g.save(); g.translate(540 + (i - 1) * 96 - 42, 200); g.scale(3.5, 3.5);
    g.fillStyle = i < lastStars ? '#e8a33a' : 'rgba(255,255,255,.7)'; g.strokeStyle = i < lastStars ? '#9a6416' : 'rgba(61,44,30,.3)'; g.lineWidth = 1.4; g.lineJoin = 'round';
    g.fill(star); g.stroke(star); g.restore();
  }
  text(`${t('title')}  ${L[lang].stage(stage + 1)}`, 1040, 46, 900, '#fff', '#3d2c1e');
  return c;
}
// made ahead per language (waiting on click stops the share in Safari)
let shareCache = null;
function prepareShare() {
  if (!resultOn) return;
  const key = lang;
  if (shareCache?.key === key) return;
  const img = resultImage(); if (!img) return;
  shareCache = { key, file: null };
  img.toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'sort-2048.png', { type: 'image/png' }); }, 'image/png');
}

// ---------- layout ----------
// the rack (and the goal over it) fits between the header row and the bottom 80px + the buttons;
// spare height goes above and below evenly. Drawing still goes all the way down.
const VIEW_DIR = new THREE.Vector3(0, 0.32, 1).normalize();
let W = 0, H = 0, resK = 0;
function resize() {
  W = innerWidth; H = innerHeight;
  renderer.setSize(W, H, false);
}
addEventListener('resize', resize);
function area(result) {
  const wide = W / H >= 1;
  let top = wide ? 50 : 88, bot = H - 80 - (wide ? 10 : Math.min(68, Math.max(54, 0.08 * Math.min(W, H))) + 14), left = 0, right = W;
  if (result) {
    if (W / H >= 1.1) { right = W * 0.5; top = 50; bot = H - 80; }
    else { top = $('ptop').getBoundingClientRect().bottom + 4; bot = $('pbtns').getBoundingClientRect().top - 4; }
  }
  if (bot - top < 100) bot = top + 100;
  return { left, top, w: right - left, h: bot - top };
}
// fits a box (half sizes hx, hy around c) into a screen rectangle; capped so it doesn't get huge on big screens
function frame(ar, c, hx, hy) {
  camera.aspect = ar.w / ar.h;
  camera.setViewOffset(ar.w, ar.h, -ar.left, -ar.top, W, H);
  const tv = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2), th = tv * camera.aspect;
  const d = Math.max(hx / th, hy / tv, hy / tv * ar.h / 820, hx / th * ar.w / 1200) + 0.7;
  return { c, d };
}
const playC = new THREE.Vector3(), resC = new THREE.Vector3(0, GOAL_Y, 0);
function placeCamera(dt) {
  resK = Math.max(0, Math.min(1, resK + (resultOn ? 1 : -1) * dt * 2.5));
  const e = smooth(resK);
  const yLo = 0, yHi = GOAL_Y + 0.75;
  playC.set(0, (yLo + yHi) / 2, 0);
  const a = frame(area(false), playC, K * PITCH / 2 + 0.35, (yHi - yLo) / 2);
  let c = a.c, d = a.d;
  if (e > 0) {
    const b = frame(area(true), resC, 1.1, 1.0);
    // the screen rectangle for the result is used in full once the move is mostly done
    c = a.c.clone().lerp(b.c, e); d = a.d + (b.d - a.d) * e;
    if (e < 0.5) frame(area(false), playC, K * PITCH / 2 + 0.35, (yHi - yLo) / 2);
  }
  camera.position.copy(c).addScaledVector(VIEW_DIR, d);
  camera.lookAt(c);
  camera.updateProjectionMatrix();
}

// ---------- loop ----------
let last = performance.now(), tm = 0;
function update(dt) {
  tm += dt;
  if (anim && anim.next(dt).done) anim = null;
  updParts(dt);
  const all = tubes.flat(); if (finalBall) all.push(finalBall);
  for (const b of all) {
    b.pop = Math.max(0, b.pop - dt * 4); b.sq = Math.max(0, b.sq - dt * 6);
    const big = finalBall === b && !anim ? 1.35 : null;
    const s = (big || (finalBall === b ? b.mesh.scale.x : 1)) * (1 + Math.sin(b.pop * Math.PI) * 0.22);
    if (!(finalBall === b && anim)) b.mesh.scale.set(s * (1 + b.sq * 0.1), s * (1 - b.sq * 0.12), s * (1 + b.sq * 0.1));
  }
  // the lifted ball bobs a little
  if (sel >= 0 && !anim && tubes[sel].length) tubes[sel].at(-1).mesh.position.y = LIFT + Math.sin(tm * 5) * 0.05;
  if (finalBall && !anim) { finalBall.mesh.rotation.y = Math.sin(tm * 1.2) * 0.35; finalBall.mesh.position.y = GOAL_Y + Math.sin(tm * 2) * 0.06; }
  if (goal.visible) { goal.position.y = GOAL_Y + Math.sin(tm * 1.6) * 0.05; goal.rotation.y = Math.sin(tm * 0.9) * 0.3; }
  if (wobble) {
    wobble.t += dt;
    const k = wobble.t / 0.3, tmsh = tubeMeshes[wobble.i];
    tmsh.rotation.z = k < 1 ? Math.sin(k * Math.PI * 4) * 0.05 * (1 - k) : 0;
    for (const b of tubes[wobble.i]) b.mesh.position.x = tubeX(wobble.i) + Math.sin(k * Math.PI * 4) * 0.05 * (1 - Math.min(1, k)) * (b.mesh.position.y / TOP);
    if (k >= 1) { for (const b of tubes[wobble.i]) b.mesh.position.x = tubeX(wobble.i); wobble = null; }
  }
}
function render() { renderer.render(scene, camera); }
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt);
  placeCamera(dt);
  render();
  requestAnimationFrame(loop);
}
resize(); applyLang();
startStage(stage, false);
placeCamera(0);
render(); // one warm-up frame so the first move doesn't hitch
renderer.compileAsync?.(scene, camera).catch(() => {});
// make the textures of every number now, not in the middle of a merge
for (let v = 1; v <= 11; v++) ballMat(v);
play(introAnim());
requestAnimationFrame(loop);
  </script>
