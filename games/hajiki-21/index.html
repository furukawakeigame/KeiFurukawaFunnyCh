    // じゅうたん

    // ---------- コップ ----------

      for (let i = 1; i < 4; i++) {
        const p = players[i];
        if (sc[i].win) { p.h.pose = 'cheer'; p.mood = 1; p.react = 99; setTimeout(() => sCheer(p.voice), 300 + i * 150); }
        else { p.mood = -0.7; p.react = 99; }
      }
      setTimeout(() => {
        if (sc[0].win) sWin(); else sLose();
        takeSnap();
        $('result').hidden = false;
        showResult();
        resize();
        prepareShare();
      }, 700);
    }

    // ---------- 毎フレーム ----------
    const TEST = location.search.includes('test');
    const SPEED = TEST ? +(new URLSearchParams(location.search).get('speed') || 1) : 1;
    if (TEST) window.__t = { shoot: (vx, vz) => { if (state === 'aim') shoot(current, vx, vz); }, aimAt: k => { if (state !== 'aim') return; const c = cups[k], s = shotTo(current.x, current.z, c.x, c.z, 0.4); shoot(current, Math.cos(s.ang) * s.v, Math.sin(s.ang) * s.v); }, stand: () => closeLid(0), get state() { return state; }, cups, get spawned() { return spawned; }, cam: (p, l) => { camOver = [new THREE.Vector3(...p), new THREE.Vector3(...l)]; } };
    let camOver = null;
    let last = performance.now(), acc = 0, time = 0;
    const qd = new THREE.Quaternion(), axis = new THREE.Vector3();
    function frame(now) {
      requestAnimationFrame(frame);
      const dt = Math.min(0.05, (now - last) / 1000) * SPEED; last = now; time += dt;
      acc += dt;
      let n = 0;
      while (acc >= H && n < 60 * SPEED) { step(); acc -= H; n++; }
      const alpha = acc / H;
      // ボールの見た目
      for (const b of balls) {
        if (b.st === 'table') {
          const x = b.px + (b.x - b.px) * alpha, z = b.pz + (b.z - b.pz) * alpha;
          const dx = b.x - b.px, dz = b.z - b.pz, dist = Math.hypot(dx, dz) * n;
          if (dist > 0) { axis.set(dz, 0, -dx).normalize(); qd.setFromAxisAngle(axis, dist / BR); b.m.quaternion.premultiply(qd); }
          // 出てきた時は少し上から落ちる
          b.drop = Math.min(1, b.drop + dt * 5);
          const yy = TOP + BR + (1 - b.drop) * (1 - b.drop) * 0.12;
          b.m.position.set(x, yy, z);
        } else if (b.st === 'fall') {
          b.m.position.set(b.x, b.y, b.z);
        } else if (b.st === 'cup') {
          b.anim = Math.min(1, b.anim + dt * 4);
          const e = b.anim * b.anim;
          b.m.position.set(b.sx + (b.tx - b.sx) * b.anim, TOP + BR + (b.ty - TOP - BR) * e, b.sz + (b.tz - b.sz) * b.anim);
        } else if (b.st === 'gone') {
          b.anim += dt;
          if (b.anim > 1.2) { b.m.visible = false; }
        }
      }
      // フタの動き
      for (const c of cups) {
        if (c.lidMode === 'drop') {
          c.lidT = Math.min(1, c.lidT + dt * 3.2);
          const k = c.lidT, y = k < 0.7 ? 0.25 * (1 - k / 0.7) ** 2 : 0.012 * Math.sin((k - 0.7) / 0.3 * Math.PI);
          c.lid.position.y = y; c.lid.scale.setScalar(1);
          if (k >= 1) c.lidMode = 'on';
        } else if (c.i === 0 && state === 'aim' && active(0) && c.total > 0) {
          // あなたの番: 押せるフタが上でふわふわ
          c.lid.visible = true; c.lidMode = 'hover';
          c.lid.position.y = 0.1 + Math.sin(time * 3) * 0.012; c.lidMat.opacity = 0.55;
        } else if (c.lidMode === 'hover') {
          c.lid.visible = false; c.lidMode = 'off';
        }
        // 今の番の輪
        const want = (state === 'aim' || state === 'cpu') && turn === c.i ? 0.55 + 0.25 * Math.sin(time * 4) : 0;
        c.glow.material.opacity += (want - c.glow.material.opacity) * Math.min(1, dt * 6);
      }
      // 状態
      if (state === 'cpu') {
        cpuT += dt;
        const p = players[turn];
        p.lean = Math.min(1, p.lean + dt * 2);
        if (cpuPlan.stand && cpuT > 0.5) { closeLid(turn); cpuPlan.stand = false; }
        if (cpuT > (cpuPlan.target >= 0 ? 1.3 : 1.0)) {
          shoot(current, Math.cos(cpuPlan.ang) * cpuPlan.v, Math.sin(cpuPlan.ang) * cpuPlan.v);
        }
      } else if (state === 'roll') {
        const moving = balls.some(b => (b.st === 'table' && (b.vx || b.vz)) || b.st === 'fall' || (b.st === 'cup' && b.anim < 1));
        settleT = moving ? 0 : settleT + dt;
        if (settleT > 0.45) nextTurn();
      }
      // 人
      for (let i = 1; i < 4; i++) {
        const p = players[i], h = p.h;
        const aiming = state === 'cpu' && turn === i;
        if (!aiming) p.lean = Math.max(0, p.lean - dt * 1.5);
        if (h.pose !== 'cheer') h.pose = aiming && cpuT > 0.35 ? 'point' : 'sit';
        h.lookAt(aiming && p.aimAt ? p.aimAt : current && state !== 'end' ? tmpV.set(current.x, TOP, current.z) : camera.position);
        p.react = Math.max(0, p.react - dt);
        const m = p.react > 0 ? p.mood : 0;
        h.face.smile += ((m > 0 ? m : m * 0.6) - h.face.smile) * Math.min(1, dt * 5);
        h.face.brow += ((m < 0 ? -1 : m > 0.8 ? 0.4 : 0) - h.face.brow) * Math.min(1, dt * 5);
        h.face.open += ((h.pose === 'cheer' ? 0.6 + 0.2 * Math.sin(time * 9) : m > 0.8 ? 0.4 : 0) - h.face.open) * Math.min(1, dt * 6);
        h.j.spine.rotation.x -= p.leanOn || 0;
        h.update(dt);
        sitLegs(h);
        p.leanOn = p.lean * 0.35;
        h.j.spine.rotation.x += p.leanOn;
      }
      // 引いている矢印
      if (drag && state === 'aim' && current) {
        const [vx, vz] = pullVec(), s = Math.hypot(vx, vz);
        arrow.visible = s > 0.15;
        if (arrow.visible) {
          arrow.position.set(current.x, TOP + 0.003, current.z);
          arrow.rotation.y = Math.atan2(vx, vz);
          arrow.scale.setScalar(0.08 + 0.22 * s / MAX_V);
          // 止まる所までの点線（他の物は考えない）
          const L = s * s / (2 * FRICTION);
          dots.forEach((d, k) => { const u = (k + 1) / dots.length * Math.min(L, 1.4); d.visible = true; d.position.set(current.x + vx / s * u, TOP + 0.002, current.z + vz / s * u); });
        }
      } else { arrow.visible = false; dots.forEach(d => d.visible = false); }
      updateParts(dt);
      if (camOver) { camera.position.copy(camOver[0]); camera.lookAt(camOver[1]); camera.updateMatrixWorld(); } else updateCamera(dt);
      placeHint();
      renderer.render(scene, camera);
    }

    resize();
    startTurn(0);
    renderer.compile(scene, camera);
    renderer.render(scene, camera);
    requestAnimationFrame(t0 => { last = t0; frame(t0); });
    applyLang();
    updateHint();
  </script>
  <!-- 結果画面の広告（../../ad.js の説明を参照） -->
  <script src="../../ad.js" data-result="#result" data-inline="#adSlot"></script>
</body>
</html>
