    }

    // ---------- 3D ----------
    const stage = document.getElementById('stage');
    const renderer = new THREE.WebGLRenderer({ antialias: true });

    const sun = new THREE.DirectionalLight('#fff0dc', 2.4); sun.position.set(-2.2, 5, 3.2);

    {

      const text = (str, y, px, max) => {
        g.font = font(px);
        const w = g.measureText(str).width; if (w > max) { px *= max / w; g.font = font(px); }
        g.lineWidth = px * .16; g.strokeStyle = '#2a2018'; g.strokeText(str, 540, y); g.fillText(str, 540, y);
      };
      text(t('n')(score), 990, 170, 960);
      text(t('title'), 90, 56, 900);
      return c;
    }
    function prepareShare() {
      if (!snap) return;
      const key = lang;
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'shokumou.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;
    function showResult() {
      resultEl.querySelector('b').textContent = t('n')(score);
      resultEl.querySelector('span').textContent = t('best')(best);
    }
    function start() {
      // 植えた毛を消して、ツルツルの頭に戻す
      strands.length = baseCount; hair.count = baseCount; growing.length = 0; plants.length = 0;
      score = 0; speed = BASE_SPEED; th = rnd(-0.6, 0.6); thPrev = th; dir = Math.random() < 0.5 ? -1 : 1;
      stab = 0; pendingPlant = null; flush = 0; wince = 0;
      state = 'play';
      resultEl.style.display = 'none';
      renderControls(); resize();
    }
    function finish() {
      state = 'result';
      if (score > best) { best = score; store.set('best', best); }
      showResult();
      resultEl.style.display = 'flex';
      snap = null; needSnap = true;
      renderControls(); resize();
    }

    // 入力: 画面のどこをタップしても植える。スペース／Enter でも
    renderer.domElement.addEventListener('pointerdown', e => { if (e.button === 0 || e.pointerType !== 'mouse') plant(); });
    addEventListener('keydown', e => {
      if (e.repeat || (e.code !== 'Space' && e.code !== 'Enter')) return;
      if (e.target.closest?.('select, a, button')) return;
      e.preventDefault();
      if (state === 'play') plant(); else if (state === 'result') start();
    });
    stage.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

    // ---------- 画面サイズ ----------
    const tmpV = new THREE.Vector3();
    // 収めたい所（ペンが一番端に行った時・頭のてっぺんの上・あご・耳）
    const KEY = [[-1.62, 0.78, 0.2], [1.62, 0.78, 0.2], [0, 1.95, 0.25], [0, -0.95, 0.75], [-1.1, -0.2, 0], [1.1, -0.2, 0], [0, -1.45, 0.6]].map(a => new THREE.Vector3(...a));
    const SNAP_KEY = [[-1.2, 0.9, 0], [1.2, 0.9, 0], [0, 1.25, 0.2], [0, -1.0, 0.7], [-1.1, -0.2, 0], [1.1, -0.2, 0]].map(a => new THREE.Vector3(...a));
    const CENTER = new THREE.Vector3(0, 0.3, 0);
    function resize() {
      const W = stage.clientWidth, H = stage.clientHeight;
      renderer.setSize(W, H, false);
      // 下の空白とボタンの所には大事な物を置かないので、その上の範囲に頭を収める（描画は下まで）
      // 背の低い横長では、遊んでいる間はボタンの分を空けず、上もヘッダーの間に頭を入れる
      const shortWide = H <= 520 && W / H >= 4 / 3;
      const btnH = Math.min(72, Math.max(56, 0.08 * Math.min(innerWidth, innerHeight))) + 12;
      const gap = Math.max(0, stage.getBoundingClientRect().bottom - controls.getBoundingClientRect().bottom);
      const reserve = gap + (shortWide ? 0 : btnH);
      stage.style.setProperty('--reserve', (shortWide ? gap + 2 * 52 + 24 : reserve) + 'px');
      let top = shortWide ? 8 : 50, left = 0;
      if (state === 'result') { if (shortWide) left = W * 0.3; else top = 56 + resultEl.offsetHeight + 4; }
      const w = W - left, h = Math.max(120, H - reserve - top);
      camera.aspect = w / h;
      camera.setViewOffset(w, h, -left, -top, W, H);
      const dir3 = new THREE.Vector3(0, 0.5, 1).normalize();
      const place = d => {
        camera.position.copy(CENTER).addScaledVector(dir3, d);
        camera.lookAt(CENTER);
        camera.updateProjectionMatrix(); camera.updateMatrixWorld();
      };
      // 全部入る一番近い距離を探す
      let lo = 2, hi = 30;
      for (let k = 0; k < 26; k++) {
        const d = (lo + hi) / 2; place(d);
        const fits = KEY.every((p, i) => {
          if (shortWide && i === 6) return true; // 背の低い画面ではケープは見切れてよい
          const q = tmpV.copy(p).project(camera);
          const x = (q.x + 1) / 2 * W, y = (1 - q.y) / 2 * H;
          return x > left + w * 0.03 && x < left + w * 0.97 && y > top + h * 0.02 && y < top + h * 0.98;
        });
        if (fits) hi = d; else lo = d;
      }
      place(hi);
    }
    addEventListener('resize', resize);

    // ---------- ループ ----------
    let last = performance.now(), acc = 0;
    function render(alpha) {
      placePen(state === 'play' ? thPrev + (th - thPrev) * alpha : (state === 'fail' || state === 'result') ? thFail : th);
      faceAnim();
      renderer.render(scene, camera);
      if (needSnap) { needSnap = false; takeSnap(); prepareShare(); }
    }
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      acc += dt;
      while (acc >= STEP) { step(STEP); acc -= STEP; }
      render(acc / STEP);
      requestAnimationFrame(loop);
    }

    // テスト用（自動確認から呼べるように）
    window.__shokumou = { plant, start, get th() { return th; }, set th(v) { th = thPrev = v; }, get state() { return state; }, get score() { return score; }, plants };
    resize();
    start();
    applyLang();
    // 最初の1回が重くならないように、一度描いておく
    renderer.compile(scene, camera); renderer.render(scene, camera);
    requestAnimationFrame(t0 => { last = t0; loop(t0); });
  </script>
</body>
</html>
