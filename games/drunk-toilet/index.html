    // ---------- 音 ----------
    let ac = null;

    function thud(v = 1) {
      const a = audio(); if (!a || muted) return;

      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);

      g.gain.setValueAtTime(.12, n); g.gain.exponentialRampToValueAtTime(.0001, n + .25);

    }
    function flush() {

    // ---------- 3D ----------
    const stage = document.getElementById('stage');
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x2a1a12);
    scene.fog = new THREE.Fog(0x2a1a12, 14, 34);
    const camera = new THREE.PerspectiveCamera(55, 1, .1, 100);
    scene.add(new THREE.HemisphereLight(0xffe2b8, 0x3a2414, 1.1));
    const sun = new THREE.DirectionalLight(0xffd9a0, 1.4);
    sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
    Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 30 });
    scene.add(sun, sun.target);

    const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0) });
    world.allowSleep = true;
    const mFloor = new CANNON.Material(), mBody = new CANNON.Material(), mProp = new CANNON.Material();

    world.addContactMaterial(new CANNON.ContactMaterial(mBody, mProp, { friction: .2, restitution: .2 }));

    const W = 5, L = 34, GOAL_Z = -L + 2;
    const mat = c => new THREE.MeshStandardMaterial({ color: c, roughness: .8 });
    const box = (w, h, d, c) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c)); m.castShadow = m.receiveShadow = true; return m; };

    // 床・壁
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, L + 6), mat(0x8a5a36));
    floor.rotation.x = -Math.PI / 2; floor.position.z = -L / 2 + 2; floor.receiveShadow = true; scene.add(floor);
    for (let z = 3; z > -L; z -= 2) { const s = box(W, .01, .05, 0x6b4428); s.position.set(0, .005, z); scene.add(s); }
    const fb = new CANNON.Body({ mass: 0, material: mFloor, shape: new CANNON.Plane() });
    fb.quaternion.setFromEuler(-Math.PI / 2, 0, 0); world.addBody(fb);
    function wall(x, z, w, d, h = 3, c = 0xc98f5a, show = true) {
      if (show) { const m = box(w, h, d, c); m.position.set(x, h / 2, z); scene.add(m); }
      const b = new CANNON.Body({ mass: 0, material: mProp, shape: new CANNON.Box(new CANNON.Vec3(w / 2, h / 2, d / 2)) });
      b.position.set(x, h / 2, z); world.addBody(b);

    wall(-W / 2 - .1, -L / 2 + 2, .2, L + 6); wall(W / 2 + .1, -L / 2 + 2, .2, L + 6);
    wall(0, 4.5, W, .2, 3, 0, false); wall(-1.6, -L, 1.8, .2); wall(1.6, -L, 1.8, .2);
    // 提灯
    for (let z = -2; z > -L; z -= 6) for (const x of [-2.2, 2.2]) {

    const hd = new THREE.Mesh(new THREE.CircleGeometry(.09, 20), ms); hd.position.y = .22;

    sign.add(hd, bd); sign.position.set(0, 1.75, -L + .01); scene.add(sign);
    const lamp = new THREE.PointLight(0x9fd0ff, 4, 6); lamp.position.set(0, 2.2, -L + 1); scene.add(lamp);

    // ---------- 障害物 ----------
    const props = [];
    function addProp(mesh, shape, mass, x, y, z, ry = 0, kind = 'thing') {
      const b = new CANNON.Body({ mass, material: mProp, shape, angularDamping: .2, linearDamping: .1 });
      b.position.set(x, y, z); b.quaternion.setFromEuler(0, ry, 0);

      return p;
    }
    function table(x, z) {
      const g = new THREE.Group();
      const top = box(1.2, .08, .8, 0x5a3820); top.position.y = .36; g.add(top);
      for (const [a, c] of [[-.5, -.3], [.5, -.3], [-.5, .3], [.5, .3]]) { const l = box(.08, .72, .08, 0x3d2614); l.position.set(a, 0, c); g.add(l); }
      addProp(g, new CANNON.Box(new CANNON.Vec3(.6, .39, .4)), 12, x, .39, z, 0, 'table');
      for (let i = 0; i < 2; i++) bottle(x - .3 + i * .5, .8 + .3, z + (i ? .1 : -.1));

    function chair(x, z, ry) {

    const legL = limb(.18, .65, pants, -.13, .65), legR = limb(.18, .65, pants, .13, .65);
    const armL = limb(.13, .55, shirt, -.36, 1.22), armR = limb(.13, .55, shirt, .36, 1.22);

      if (v > 1) { thud(Math.min(1, v / 4) * .6); hic(); }

    const stick = document.getElementById('stick'), knob = stick.firstElementChild;
    let touch = null; // {id, x0, y0, dx, dy}
    stage.addEventListener('pointerdown', e => {

      const r = stage.getBoundingClientRect();
      touch = { id: e.pointerId, x0: e.clientX, y0: e.clientY, dx: 0, dy: 0 };

    stage.addEventListener('pointermove', e => {
      if (!touch || e.pointerId !== touch.id) return;
      let dx = e.clientX - touch.x0, dy = e.clientY - touch.y0; const d = Math.hypot(dx, dy), m = 50;
      if (d > m) { dx *= m / d; dy *= m / d; }
      touch.dx = dx / m; touch.dy = dy / m; knob.style.transform = `translate(${dx}px,${dy}px)`;
    });
    const endTouch = e => { if (touch && e.pointerId === touch.id) { touch = null; stick.style.display = 'none'; } };
    stage.addEventListener('pointerup', endTouch); stage.addEventListener('pointercancel', endTouch);
    function inputDir() {
      let x = 0, z = 0;
      if (keys['arrowleft'] || keys['a']) x -= 1; if (keys['arrowright'] || keys['d']) x += 1;
      if (keys['arrowup'] || keys['w']) z -= 1; if (keys['arrowdown'] || keys['s']) z += 1;
      if (touch) { x += touch.dx; z += touch.dy; }
      const l = Math.hypot(x, z); if (l > 1) { x /= l; z /= l; }
      return { x, z, l: Math.min(1, l) };
    }

    // ---------- 状態 ----------
    let riseT = 0, state = "title", time = 0, bladder = 0, fallenT = 0, walkPhase = 0, yaw = Math.PI, result = null;
    let seed = Math.random() * 100;
    const gauge = document.getElementById('gauge'), gfill = gauge.firstElementChild, pee = document.getElementById('pee');
    const UP = new CANNON.Vec3(0, 1, 0);

    function reset() {
      player.position.set(0, H + .02, 2.5); player.velocity.setZero(); player.angularVelocity.setZero();
      player.quaternion.setFromEuler(0, 0, 0); yaw = Math.PI;
      for (const p of props) { const [x, y, z, ry] = p.init; p.body.position.set(x, y, z); p.body.quaternion.setFromEuler(0, ry, 0); p.body.velocity.setZero(); p.body.angularVelocity.setZero(); p.body.wakeUp(); }
      time = 0; bladder = .15; fallenT = 0; riseT = 0; seed = Math.random() * 100; result = null;
      pee.style.opacity = 0;
    }
    function start() {
      audio(); reset(); state = 'play'; hic(); render();
    }
    function finish(win) {
      state = 'result'; result = win ? { win: true, s: time.toFixed(1) } : { win: false };
      touch = null; stick.style.display = 'none';
      if (win) flush(); else { pee.style.opacity = 1; thud(); }
      render();
    }

    // 1ステップごとの体の制御
    const tmpV = new CANNON.Vec3();
    function control(dt) {
      const up = player.quaternion.vmult(UP);
      const tilt = up.y;
      const tt = performance.now() / 1000 + seed;
      const drunk = state === "play" ? 1 : .4;
      // 床との摩擦は0にして、ここで横の動きを弱める（cannon の摩擦だと足が床に貼りつくため）
      const damp = Math.exp(-(fallenT > 0 ? 4 : 3) * dt);
      player.velocity.x *= damp; player.velocity.z *= damp;
      if (fallenT > 0) {
        fallenT -= dt;
        if (fallenT <= 0) { riseT = .9; hic(); } // 起き上がる
        return;
      }
      if (riseT > 0) {
        // 起き上がり中は少しずつまっすぐに戻す
        riseT -= dt;
        const q = new CANNON.Quaternion(); q.setFromEuler(0, yaw, 0);
        player.quaternion.slerp(q, Math.min(1, dt * 6), player.quaternion);
        player.angularVelocity.scale(.5, player.angularVelocity);
        if (player.position.y < H) player.velocity.y = Math.max(player.velocity.y, (H - player.position.y) * 4);
        return;
      }
      if (tilt < .45) { fallenT = 1.4; thud(); if (state === 'play') bladder += .1; return; }
      // まっすぐに戻す力（ちょっと弱め）
      const k = 2600, d = 320;
      const corr = up.cross(UP);
      // ふらつき（ゆっくり変わる揺れ）
      const wx = (Math.sin(tt * 1.3) + Math.sin(tt * 2.9 + 1) * .6) * 450 * drunk;
      const wz = (Math.sin(tt * 1.7 + 2) + Math.sin(tt * 3.7) * .5) * 450 * drunk;
      player.torque.x += corr.x * k - player.angularVelocity.x * d + wx;
      player.torque.z += corr.z * k - player.angularVelocity.z * d + wz;
      // 向き：進みたい方向へゆっくり回る
      const inp = state === 'play' ? inputDir() : { x: 0, z: 0, l: 0 };
      // 千鳥足：進む方向が勝手に左右へぶれる
      const sway = Math.sin(tt * 2.2) * .7 + Math.sin(tt * 5.1) * .3;
      let mx = inp.x, mz = inp.z;
      if (inp.l > .1) {
        const c = Math.cos(sway * 1.1), s = Math.sin(sway * 1.1);
        [mx, mz] = [mx * c - mz * s, mx * s + mz * c];
        yaw = Math.atan2(mx, mz);
      }
      // 体の傾きがある方向へ足を取られる
      const lean = 220;
      player.force.x += mx * 520 + up.x * lean * 3 + Math.sin(tt * 1.1) * 60;
      player.force.z += mz * 520 + up.z * lean * 3;
      // y軸回りの向きをそろえる
      const e = new CANNON.Vec3(); player.quaternion.toEuler(e, 'YZX');
      let dy = yaw - e.y; while (dy > Math.PI) dy -= Math.PI * 2; while (dy < -Math.PI) dy += Math.PI * 2;
      player.torque.y += dy * 300 - player.angularVelocity.y * 60;
      // 速さの上限
      const hv = Math.hypot(player.velocity.x, player.velocity.z), max = 2.1;
      if (hv > max) { player.velocity.x *= max / hv; player.velocity.z *= max / hv; }
      walkPhase += hv * dt * 5;
      // ランダムなしゃっくり
      if (Math.random() < dt * .25) { hic(); player.applyImpulse(new CANNON.Vec3((Math.random() - .5) * 60, 30, (Math.random() - .5) * 40), player.position.vadd(new CANNON.Vec3(0, .5, 0))); }
    }

    function safety() {
      const p = player.position, v = player.velocity;
      if (v.length() > 8) v.scale(8 / v.length(), v);
      if (player.angularVelocity.length() > 15) player.angularVelocity.scale(15 / player.angularVelocity.length(), player.angularVelocity);
      if (p.y > 3 || Math.abs(p.x) > W / 2 || p.y < -1) { p.set(0, H + .02, Math.min(2.5, p.z + 1)); v.setZero(); player.angularVelocity.setZero(); player.quaternion.setFromEuler(0, yaw, 0); fallenT = 0; riseT = 0; }
    }
    function syncMan() {
      rig.position.copy(player.position); rig.quaternion.copy(player.quaternion);
      const s = Math.sin(walkPhase);
      if (fallenT > 0) { legL.rotation.x = .6; legR.rotation.x = -.3; armL.rotation.z = -1.2; armR.rotation.z = 1.2; }
      else {
        legL.rotation.x = s * .6; legR.rotation.x = -s * .6;
        armL.rotation.x = -s * .5; armR.rotation.x = -.9 + s * .2;
        armL.rotation.z = -.25 + Math.sin(performance.now() / 300) * .15; armR.rotation.z = .1;
      }
      head.rotation.z = Math.sin(performance.now() / 400) * .3;
    }

    // ---------- 画面 ----------
    function resize() {
      const w = stage.clientWidth, h = stage.clientHeight;
      renderer.setSize(w, h, false); camera.aspect = w / h;
      camera.fov = w / h < .8 ? 70 : 55; camera.updateProjectionMatrix();
    }
    new ResizeObserver(resize).observe(stage); resize();

    const camPos = new THREE.Vector3(0, 4, 8), camLook = new THREE.Vector3();
    let last = performance.now();
    function loop(now) {
      const dt = Math.min(.05, (now - last) / 1000); last = now;
      if (state === 'play') {
        time += dt;
        bladder += dt / 42;
        if (player.position.z < GOAL_Z && Math.abs(player.position.x) < 1.4) finish(true);
        else if (bladder >= 1) { bladder = 1; finish(false); }
      }
      const steps = 3;
      for (let i = 0; i < steps; i++) { control(dt / steps); world.step(dt / steps); safety(); }
      syncMan();
      for (const p of props) { p.mesh.position.copy(p.body.position); p.mesh.quaternion.copy(p.body.quaternion); }
      gfill.style.width = (bladder * 100) + '%';
      gauge.classList.toggle('danger', bladder > .75);
      gauge.style.display = state === 'title' ? 'none' : 'block';
      // カメラ：後ろ上から追いかけ、少し揺れる
      const p = player.position, tt = now / 1000;
      const target = state === 'title' ? new THREE.Vector3(p.x + Math.sin(tt * .3) * 2, 2.2, p.z - 4) : new THREE.Vector3(p.x * .6, 4.2, p.z + 5.5);
      camPos.lerp(target, 1 - Math.pow(.02, dt));
      camLook.lerp(new THREE.Vector3(p.x * .8, state === "title" ? 1.2 : .9, state === "title" ? p.z : p.z - 2.5), 1 - Math.pow(.01, dt));
      camera.position.copy(camPos);
      camera.lookAt(camLook);
      camera.rotation.z += Math.sin(tt * 1.1) * .04;
      sun.position.set(p.x + 3, 8, p.z + 3); sun.target.position.set(p.x, 0, p.z - 2);
      renderer.render(scene, camera);
      requestAnimationFrame(loop);
    }

    const overlay = document.getElementById('overlay'), big = document.getElementById('big'), btns = document.getElementById('btns');
    const CROSS = '<svg viewBox="0 0 100 100"><path d="M20 20L80 80M80 20L20 80" stroke="#ff5a3a" stroke-width="16" stroke-linecap="round"/></svg>';
    function render() {
      document.documentElement.lang = lang;
      document.title = t('title');
      document.getElementById('back').textContent = t('back');
      document.getElementById('lang').value = lang;
      document.getElementById('sound').innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>${muted ? '<path d="M17 9l5 6M22 9l-5 6"/>' : '<path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>'}</svg>`;
      overlay.style.display = state === 'play' ? 'none' : 'flex';
      big.innerHTML = '';
      btns.innerHTML = '';
      if (state === 'play') return;
      if (state === 'result') { if (result.win) big.textContent = t('time')(result.s); else big.innerHTML = CROSS; }
      const b = document.createElement('button');
      b.className = 'go'; b.textContent = state === 'result' ? t('again') : t('start');
      b.addEventListener('click', start);
      btns.append(b);
      if (state === 'result') {
        const text = result.win ? t('win')(result.s) : t('lose');
        const a = document.createElement('a');
        a.className = 'post'; a.textContent = t('post');
        a.href = `https://x.com/intent/post?text=${encodeURIComponent(text)}&url=${encodeURIComponent(SHARE_URL)}`;
        if (!matchMedia('(pointer: coarse)').matches) { a.target = '_blank'; a.rel = 'noopener'; }
        btns.append(a);
      }
    }
    document.getElementById('lang').addEventListener('change', e => { lang = e.target.value; store.set('lang', lang); render(); });
    document.getElementById('sound').addEventListener('click', () => { muted = !muted; store.set('muted', muted); render(); });
    addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && state !== 'play' && document.activeElement?.tagName !== 'BUTTON' && document.activeElement?.tagName !== 'A') start(); });

    reset(); render(); requestAnimationFrame(loop);
  </script>
</body>
</html>
