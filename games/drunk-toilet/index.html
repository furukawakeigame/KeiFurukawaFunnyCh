      }
      // 進む向き：入力に傾きの分だけ足を取られる
      let mx = inp.x + lean.x * 1.2, mz = inp.z + lean.z * 1.2;
      const ml = Math.hypot(mx, mz);
      if (inp.l > .1) yaw = Math.atan2(mx, mz);
      const target = V(lean.x, 1, lean.z); target.normalize();
      uprightTorque(T, 900, 90, target, yaw, 160);
      uprightTorque(P, 500, 50, target, yaw, 120);
      uprightTorque(head.body, 30, 3, UP);
      // 足が地面に近いときだけ腰を支える（転んだらこの支えが消える）
      const footY = Math.min(...legs.map(l => l.shin.body.position.y));
      const h = P.position.y, targetH = .98;
      if (footY < .45) P.force.y += (TOTAL * 9.82 * .9 + (targetH - h) * 2500 - P.velocity.y * 300) * power;
      // 歩く：腰を進みたい方向へ
      const vx = mx * 1.9, vz = mz * 1.9;
      P.force.x += (vx - P.velocity.x) * 300 * power;
      P.force.z += (vz - P.velocity.z) * 300 * power;
      // 足を交互に前へ出す
      const hv = Math.hypot(P.velocity.x, P.velocity.z);
      gait += dt * (ml > .15 ? 8 : 0);
      const fx = Math.sin(yaw), fz = Math.cos(yaw);
      legs.forEach((l, i) => {
        const ph = gait + i * Math.PI, sw = Math.sin(ph), lift = Math.max(0, Math.cos(ph));
        const walking = ml > .15, stride = walking ? .3 : 0;
        const tx = P.position.x + fx * sw * stride + fz * l.s * .12, tz = P.position.z + fz * sw * stride - fx * l.s * .12;
        const ty = .23 + lift * (walking ? .18 : 0);
        const S = l.shin.body;
        S.force.x += ((tx - S.position.x) * 400 - S.velocity.x * 20) * power;
        S.force.z += ((tz - S.position.z) * 400 - S.velocity.z * 20) * power;
        S.force.y += ((ty - S.position.y) * 300 - S.velocity.y * 10) * power;
      });
      // 腕をぶらぶら（瓶を持つ手は少し上げる）
      arms.forEach((a, i) => { a.upper.body.torque.x += Math.sin(gait + i * Math.PI) * 4 * power; });
      // ランダムなしゃっくり
      if (state === 'play' && Math.random() < dt * .3) {
        hic();
        lean.x += (Math.random() - .5) * .4;
      }
    }
    function safety() {
      for (const p of parts) {
        const b = p.body;
        if (b.velocity.length() > 12) b.velocity.scale(12 / b.velocity.length(), b.velocity);
      }
      const P = pelvis.body.position;
      if (P.y > 4 || P.y < -1 || Math.abs(P.x) > W) { const z = P.z; reset(); for (const p of parts) p.body.position.z += z - 3; }
    }
    for (const p of [torso, head]) p.body.addEventListener("collide", e => { if (Math.abs(e.contact.getImpactVelocityAlongNormal()) > 2) thud(.7); });

    // ---------- 画面 ----------
    function resize() {
      const w = stage.clientWidth, h = stage.clientHeight;
      renderer.setSize(w, h, false); camera.aspect = w / h;
      camera.fov = w / h < .8 ? 62 : 48; camera.updateProjectionMatrix();
    }
    new ResizeObserver(resize).observe(stage); resize();

    const camPos = new THREE.Vector3(0, 2, 6), camLook = new THREE.Vector3();
    let last = performance.now(), acc = 0;
    const STEP = 1 / 240;
    function loop(now) {
      const dt = Math.min(.05, (now - last) / 1000); last = now;
      if (state === 'play') {
        time += dt;
        bladder += dt / 32;
        if (pelvis.body.position.z < GOAL_Z) finish(true);
        else if (bladder >= 1) { bladder = 1; finish(false); }
      }
      // 物理は 1/240 秒の固定刻みで進める（刻みが大きいと人形が暴れるため）
      acc += dt;
      while (acc >= STEP) { control(STEP); world.step(STEP); safety(); acc -= STEP; }
      for (const p of parts) { p.mesh.position.copy(p.body.position); p.mesh.quaternion.copy(p.body.quaternion); }
      gfill.style.width = (bladder * 100) + '%';
      gauge.classList.toggle('danger', bladder > .75);
      gauge.style.display = state === 'title' ? 'none' : 'block';
      // カメラ：人のすぐ後ろから追いかける（タイトルでは正面から）
      const p = torso.body.position, tt = now / 1000;
      const target = state === 'title' ? new THREE.Vector3(p.x + Math.sin(tt * .4) * .8, 1.5, p.z - 2.6) : new THREE.Vector3(p.x * .7, 2.1, p.z + 3.2);
      camPos.lerp(target, 1 - Math.pow(.03, dt));
      camLook.lerp(new THREE.Vector3(p.x, state === 'title' ? 1.2 : 1, state === 'title' ? p.z : p.z - 1), 1 - Math.pow(.01, dt));
      camera.position.copy(camPos);
      camera.lookAt(camLook);
      camera.rotation.z += Math.sin(tt * 1.1) * .03;
      sun.position.set(p.x + 2, 6, p.z + 2); sun.target.position.set(p.x, 0, p.z - 1);
      renderer.render(scene, camera);
      requestAnimationFrame(loop);
    }

    const overlay = document.getElementById('overlay'), big = document.getElementById('big'), btns = document.getElementById('btns');
    const CROSS = '<svg viewBox="0 0 100 100"><path d="M20 20L80 80M80 20L20 80" stroke="#ff5a3a" stroke-width="16" stroke-linecap="round"/></svg>';
    function render() {
      document.documentElement.lang = lang;
      document.title = t('title');
      document.getElementById('back').textContent = t('back');
      document.getElementById('lang').value = lang;
      document.getElementById('sound').innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>${muted ? '<path d="M17 9l5 6M22 9l-5 6"/>' : '<path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>'}</svg>`;
      overlay.style.display = state === 'play' ? 'none' : 'flex';
      big.innerHTML = '';
      btns.innerHTML = '';
      if (state === 'play') return;
      if (state === 'result') { if (result.win) big.textContent = t('time')(result.s); else big.innerHTML = CROSS; }
      const b = document.createElement('button');
      b.className = 'go'; b.textContent = state === 'result' ? t('again') : t('start');
      b.addEventListener('click', start);
      btns.append(b);
      if (state === 'result') {
        const text = result.win ? t('win')(result.s) : t('lose');
        const a = document.createElement('a');
        a.className = 'post'; a.textContent = t('post');
        a.href = `https://x.com/intent/post?text=${encodeURIComponent(text)}&url=${encodeURIComponent(SHARE_URL)}`;
        if (!matchMedia('(pointer: coarse)').matches) { a.target = '_blank'; a.rel = 'noopener'; }
        btns.append(a);
      }
    }
    document.getElementById('lang').addEventListener('change', e => { lang = e.target.value; store.set('lang', lang); render(); });
    document.getElementById('sound').addEventListener('click', () => { muted = !muted; store.set('muted', muted); render(); });
    addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && state !== 'play' && document.activeElement?.tagName !== 'BUTTON' && document.activeElement?.tagName !== 'A') start(); });

    reset(); render(); requestAnimationFrame(loop);
  </script>
</body>
</html>
