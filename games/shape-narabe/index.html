      // スマホは画像ごと共有シートへ。PCは画像を保存してから投稿画面を開く
      a.addEventListener('click', e => {
        const text = t('share')(won);
        if (coarse && navigator.share) {
          e.preventDefault();
          const file = shareFile();
          const data = file && navigator.canShare?.({ files: [file] }) ? { files: [file], text: `${text}\n${SHARE_URL}` } : { text: `${text}\n${SHARE_URL}` };
          navigator.share(data).catch(() => {});
          return;
        }
        const img = resultImage();
        if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'shape-narabe.png'; d.click(); }
      });
      controls.append(a);
    }
    function showResult() {
      const won = winner === 'you';
      resultEl.children[0].textContent = won ? t('win') : t('lose');
      resultEl.style.setProperty('--edge', won ? '#b4371c' : '#2c3f7a');
    }
    // 結果画像: 猫と盤のまわりを切り抜いて、勝ち負けを重ねる
    let snap = null, shareCache = null;
    function takeSnap() {
      const src = renderer.domElement;
      const a = new THREE.Vector3(0, 3.4, -4.3).project(camera), b = new THREE.Vector3(0, TOP, 2.6).project(camera);
      const fy = (1 - (a.y + b.y) / 2) / 2 * src.height, fx = (a.x + 1) / 2 * src.width;
      const side = Math.min(src.width, src.height, Math.max(1, (a.y - b.y) / 2 * src.height * 1.25));
      const sx = THREE.MathUtils.clamp(fx - side / 2, 0, src.width - side), sy = THREE.MathUtils.clamp(fy - side / 2, 0, src.height - side);
      snap = document.createElement('canvas'); snap.width = snap.height = 1080;
      snap.getContext('2d').drawImage(src, sx, sy, side, side, 0, 0, 1080, 1080);
      shareCache = null;
    }
    function resultImage() {
      if (!snap) return null;
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const g = c.getContext('2d');
      g.drawImage(snap, 0, 0);
      const won = winner === 'you';
      g.textAlign = 'center'; g.fillStyle = '#fff'; g.lineJoin = 'round';
      const font = px => `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans Thai", sans-serif`;
      const text = (str, y, px, max, edge) => {
        g.font = font(px);
        const w = g.measureText(str).width; if (w > max) { px *= max / w; g.font = font(px); }
        g.lineWidth = px * .16; g.strokeStyle = edge; g.strokeText(str, 540, y); g.fillText(str, 540, y);
      };
      text(won ? t('win') : t('lose'), 1000, 200, 960, won ? '#b4371c' : '#2c3f7a');
      text(t('title'), 92, 58, 900, '#6b3d1c');
      return c;
    }
    function prepareShare() {
      if (!snap) return;
      const key = lang;
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'shape-narabe.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;

    function finish(who) {
      state = 'result'; winner = who; turn = 'busy';
      hoverTile.visible = false; ghost.visible = false;
      if (who === 'you') { mood = { type: 'lose', t0: clock }; meowCry(); }
      else { mood = { type: 'win', t0: clock }; meowBig(); }
      showResult();
      resultEl.style.display = 'flex';
      snap = null; later(0.9, () => { needSnap = true; });
      renderControls();
      regionGoal = layout();
    }
    function start() {
      for (const c of board) if (c) disposePiece(c.m);
      for (const f of flying) scene.remove(f.m);
      for (const m of balls) scene.remove(m);
      for (const f of fx) scene.remove(f.m);
      fx.length = 0;
      if (youHand) scene.remove(youHand.m); if (catHand) scene.remove(catHand.m);
      timers.length = 0; flying = []; balls = []; paw = null;
      board = Array(16).fill(null); score = { you: 0, cat: 0 }; winner = null;
      state = 'play'; turn = 'you'; mood = { type: 'idle', t0: clock };
      dealHand('you'); dealHand('cat');
      resultEl.style.display = 'none';
      renderControls();
      regionGoal = layout();
    }

    // ---------- ループ ----------
    function step() {
      clock += STEP;
      for (let i = 0; i < timers.length; i++) { const tm = timers[i]; if (tm.at <= clock) { timers.splice(i--, 1); tm.fn(); } }
    }
    const arc = (f, k) => { const e = ease(k); const p = f.from.clone().lerp(f.to, e); p.y += Math.sin(Math.PI * Math.min(1, Math.max(0, k))) * f.h; return p; };
    let lastHover = -2;
    function render(rc, dtReal) {
      // 手番の光と手元の記号
      const yourTurn = state === 'play' && turn === 'you';
      youRing.material.opacity += ((yourTurn ? 0.5 + 0.25 * Math.sin(rc * 5) : 0) - youRing.material.opacity) * 0.2;
      const catActive = state === 'play' && mood.type === 'think';
      catRing.material.opacity += ((catActive ? 0.5 + 0.25 * Math.sin(rc * 5) : 0) - catRing.material.opacity) * 0.2;
      for (const [h, base, act] of [[youHand, YOU_HAND, yourTurn], [catHand, CAT_HAND, catActive]]) {
        if (!h) continue;
        const k = ease((rc - h.t0) / 0.25);
        h.m.position.set(base.x, base.y + Math.sin(rc * 2.4 + base.x) * 0.08 + (act ? 0.12 : 0), base.z);
        h.m.scale.setScalar(0.01 + k * (act ? 1.15 : 1));
        h.m.rotation.set(0.75, Math.sin(rc * 1.3 + base.z) * 0.25, 0);
      }
      // ホバー
      const hov = yourTurn && hoverIdx >= 0 && !board[hoverIdx] ? hoverIdx : -1;
      if (hov !== lastHover) { lastHover = hov; if (hov >= 0 && armed) tone('sine', 1400, 1500, 0.03, 0.03); }
      hoverTile.visible = hov >= 0; ghost.visible = hov >= 0 && !!youHand;
      if (hov >= 0) {
        const p = cellPos(hov); hoverTile.position.set(p.x, TOP + BH + 0.025, p.z);
        if (youHand) { ghost.geometry = GEO[youSym]; ghost.material = GHOST[youSym]; ghost.position.set(p.x, TOP + BH, p.z); }
      }
      // 置いた駒の着地のはずみ
      for (const c of board) if (c && !c.pending && c.land !== undefined) { const k = (rc - c.land) / 0.25; c.m.scale.set(1 + 0.15 * Math.max(0, 1 - k) * Math.sin(k * 9), 1 - 0.2 * Math.max(0, 1 - k) * Math.sin(k * 9), 1 + 0.15 * Math.max(0, 1 - k) * Math.sin(k * 9)); }
      // 飛んでいる駒・玉
      for (let i = flying.length - 1; i >= 0; i--) {
        const f = flying[i], k = (rc - f.t0) / f.dur;
        if (k < 0) { f.m.position.copy(f.from); continue; }
        f.m.position.copy(arc(f, k));
        if (!f.ball) { f.m.rotation.set(f.rot * (1 - ease(k)), ease(k) * Math.PI * 2, 0); f.m.scale.setScalar(1.15 - 0.15 * ease(k)); }
        if (k >= 1) { f.m.position.copy(f.to); flying.splice(i, 1); }
      }
      // 猫
      let by = 0, bx = 0, bz = 0, hx = 0, hz = 0, hy = 0, sq = 1;
      const mt = rc - mood.t0;
      const breath = Math.sin(rc * 2.2);
      if (mood.type === 'idle') { hz = Math.sin(rc * 0.9) * 0.05; sq = 1 + breath * 0.015; }
      else if (mood.type === 'think') { hz = Math.sin(mt * 3) * 0.18; hx = 0.08; sq = 1 + breath * 0.015; }
      else if (mood.type === 'happy') { by = Math.abs(Math.sin(mt * 11)) * 0.35 * Math.max(0, 1 - mt / 0.9); hz = Math.sin(mt * 16) * 0.12 * Math.max(0, 1 - mt); }
      else if (mood.type === 'flinch') { const k = Math.max(0, 1 - mt / 1.0); bz = -0.4 * Math.sin(Math.min(1, mt * 6) * Math.PI / 2) * k; hx = 0.35 * k; bx = Math.sin(mt * 40) * 0.04 * k; }
      else if (mood.type === 'win') { by = Math.abs(Math.sin(mt * 7)) * 0.4; hz = Math.sin(mt * 7) * 0.18; }
      else if (mood.type === 'lose') { const k = ease(mt / 0.8); by = -0.35 * k; hx = 0.55 * k; hz = 0.25 * k + Math.sin(mt * 1.5) * 0.03 * k; sq = 1 - 0.08 * k; }
      cat.position.set(CAT_BASE.x + bx, CAT_BASE.y + by, CAT_BASE.z + bz);
      body.scale.set(1 / Math.sqrt(sq), sq, 1 / Math.sqrt(sq));
      head.rotation.set(hx, hy, hz);
      cat.updateMatrixWorld();
      // 前足: 右の前足で駒をつかんでマスへ運ぶ
      for (const a of arms) {
        const pp = a.rest.clone(); pp.y += by; pp.z += bz * 0.5;
        if (a.s === 1 && paw) {
          const k = rc - paw.t0, top = paw.to.clone().setY(TOP + BH + 0.55);
          if (k < 0.3) { pp.lerp(paw.grab.clone().add(new THREE.Vector3(0, 0.12, 0)), ease(k / 0.3)); }
          else if (k < 0.75) { const f = { from: paw.grab.clone().add(new THREE.Vector3(0, 0.12, 0)), to: top, h: 0.6 }; pp.copy(arc(f, (k - 0.3) / 0.45)); }
          else if (k < 0.85) { pp.copy(top).y -= 0.25 * ease((k - 0.75) / 0.1); }
          else if (k < 1.25) { pp.copy(top).lerp(pp.clone().set(a.rest.x, a.rest.y + by, a.rest.z), ease((k - 0.85) / 0.4)); pp.y += Math.sin(Math.PI * Math.min(1, (k - 0.85) / 0.4)) * 0.4; }
          else paw = null;
          if (paw && k >= 0.3 && k < 0.85) { paw.m.position.copy(pp).y -= 0.22; paw.m.rotation.set(0.75 * Math.max(0, 1 - (k - 0.3) / 0.45), 0, 0); paw.m.scale.setScalar(1.1); }
        }
        a.paw.position.copy(pp);
        a.paw.rotation.set(0, 0, 0);
        const sh = a.shoulder.clone().applyMatrix4(body.matrixWorld);
        const mid = sh.clone().add(pp).multiplyScalar(0.5), len = sh.distanceTo(pp);
        a.arm.position.copy(mid);
        a.arm.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), pp.clone().sub(sh).normalize());
        a.arm.scale.set(1, Math.max(0.1, (len - 0.2) / 1.4), 1);
      }
      // 受け皿の玉はきらっと
      for (const m of balls) m.rotation.y = rc;
      // 粒
      for (let i = fx.length - 1; i >= 0; i--) {
        const f = fx[i], tt = rc - f.t0, q = tt / f.life;
        if (q >= 1) { scene.remove(f.m); f.m.material.dispose(); fx.splice(i, 1); continue; }
        f.m.position.set(f.p0.x + f.v.x * tt, f.p0.y + f.v.y * tt - 3 * tt * tt, f.p0.z + f.v.z * tt);
        f.m.material.opacity = 1 - q; f.m.scale.setScalar(f.s0 * (1 + q * 0.6));
      }
      // 結果の時はカメラの範囲をなめらかに移す
      if (region && regionGoal && region.some((v, i) => Math.abs(v - regionGoal[i]) > 0.5)) {
        const k = 1 - Math.exp(-dtReal * 8);
        region = region.map((v, i) => v + (regionGoal[i] - v) * k);
        applyRegion(region);
      }
      renderer.render(scene, camera);
      if (needSnap) { needSnap = false; takeSnap(); prepareShare(); }
    }
    let last = performance.now(), acc = 0;
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      acc += dt;
      while (acc >= STEP) { step(); acc -= STEP; }
      render(clock + acc, dt);
      requestAnimationFrame(loop);
    }

    board = Array(16).fill(null);
    resize();
    start();
    applyLang();
    resize();
    // 最初の1回が重くならないように、全部の形を一度描いておく
    {
      const tmp = SYMS.map((s, i) => { const m = makePiece(s); m.position.copy(cellPos(i)); return m; });
      ghost.visible = true; const b = new THREE.Mesh(ballG, ballM); scene.add(b); burst(new THREE.Vector3(0, 1, 0), 1, '#fff', 0, 0.01, 0.01, 0);
      renderer.compile(scene, camera); renderer.render(scene, camera);
      tmp.forEach(m => scene.remove(m)); scene.remove(b); ghost.visible = false;
    }
    requestAnimationFrame(t0 => { last = t0; loop(t0); });
  </script>
</body>
</html>
