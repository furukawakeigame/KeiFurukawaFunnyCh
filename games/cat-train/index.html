      a.className = 'post'; a.textContent = t('post');
      a.href = `https://x.com/intent/post?text=${encodeURIComponent(shareText())}&url=${encodeURIComponent(SHARE_URL)}`;
      const coarse = matchMedia('(pointer: coarse)').matches;
      if (!coarse) { a.target = '_blank'; a.rel = 'noopener'; }
      // スマホは画像ごと共有シートへ。PCは画像を保存してから投稿画面を開く
      a.addEventListener('click', e => {
        const text = shareText();
        if (coarse && navigator.share) {
          e.preventDefault();
          const file = shareFile();
          const data = file && navigator.canShare?.({ files: [file] }) ? { files: [file], text: `${text}\n${SHARE_URL}` } : { text: `${text}\n${SHARE_URL}` };
          navigator.share(data).catch(() => {});
          return;
        }
        const img = resultImage();
        if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'cat-train.png'; d.click(); }
      });
      controls.append(a);
    }
    let snap = null, shareCache = null;
    function takeSnap() {
      const src = renderer.domElement;
      // 視線の中心（ヘッダーの下〜ボタンの上の真ん中）を正方形に切り抜く
      const side = Math.min(src.width, src.height);
      const r = src.height / stage.clientHeight;
      const cy = (56 + (stage.clientHeight - 56 - 160) / 2) * r;
      const sx = (src.width - side) / 2, sy = THREE.MathUtils.clamp(cy - side / 2, 0, src.height - side);
      snap = document.createElement('canvas'); snap.width = snap.height = 1080;
      snap.getContext('2d').drawImage(src, sx, sy, side, side, 0, 0, 1080, 1080);
      shareCache = null;
    }
    function resultImage() {
      if (!snap) return null;
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const g = c.getContext('2d');
      g.drawImage(snap, 0, 0);
      g.textAlign = 'center'; g.fillStyle = '#fff'; g.lineJoin = 'round';
      const font = px => `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans Thai", sans-serif`;
      const text = (str, y, px, max) => {
        g.font = font(px);
        const w = g.measureText(str).width; if (w > max) { px *= max / w; g.font = font(px); }
        g.lineWidth = px * .16; g.strokeStyle = '#6b3d1c'; g.strokeText(str, 540, y); g.fillText(str, 540, y);
      };
      text(ok() ? t('time')(fmt()) : t('fail'), 960, 170, 960);
      text(t('title'), 90, 56, 900);
      return c;
    }
    function prepareShare() {
      if (!snap) return;
      const key = lang;
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'cat-train.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;
    function showResult() { resultEl.children[0].textContent = ok() ? t('time')(fmt()) : t('fail'); }
    function finish() {
      state = 'result';
      showResult(); resultEl.style.display = 'flex';
      snap = null; needSnap = true;
      renderControls();
    }
    function start() {
      reset();
      state = 'ready'; hold = false;
      resultEl.style.display = 'none';
      renderControls();
    }

    // ---------- ループ ----------
    let last = performance.now(), acc = 0;
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      acc += dt;
      while (acc >= STEP) { step(STEP); acc -= STEP; }
      render(acc / STEP);
      // モーター音
      if (motor) {
        const vol = soundOn && (state === 'ready' || state === 'play' || state === 'goal') ? Math.min(0.06, v * 0.0006 + (hold ? 0.012 : 0)) : 0;
        if (Math.abs(vol - (motor.vol ?? -1)) > 0.002) { motor.vol = vol; motor.mg.gain.setTargetAtTime(vol, ac.currentTime, 0.05); }
        const f = 70 + v * 3.2;
        if (Math.abs(f - (motor.f ?? 0)) > 2) { motor.f = f; motor.m.frequency.setTargetAtTime(f, ac.currentTime, 0.05); motor.m2.frequency.setTargetAtTime(f * 2.01, ac.currentTime, 0.05); }
      }
      requestAnimationFrame(loop);
    }

    resize();
    start();
    applyLang();
    renderer.compile(scene, camera);
    render(1);
    requestAnimationFrame(t0 => { last = t0; loop(t0); });
  </script>
</body>
</html>
