<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">

  <meta name="twitter:card" content="summary">
  <script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  } }
  </script>
  <style>
    html, body { margin: 0; height: 100%; background: #f3eef7; color: #4a3d5c; }
    body {
      display: flex; flex-direction: column; height: 100dvh;
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic UI", system-ui, sans-serif;
      overflow: hidden; touch-action: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; width: 100%; max-width: 560px; margin: 0 auto; box-sizing: border-box;
    }
    header a { color: #7b5aa6; text-decoration: none; font-weight: bold; }
    .hbtns { display: flex; gap: 6px; }
    .pill {
      font-size: 15px; background: #fff; border: 2px solid #ddd0ea; border-radius: 999px;
      min-width: 44px; height: 36px; cursor: pointer; font-weight: bold; color: #6a4c92; padding: 0 10px;
      display: flex; align-items: center; justify-content: center;
    }
    main {
      flex: 1; min-height: 0; display: flex; flex-direction: column;
      padding-bottom: calc(80px + env(safe-area-inset-bottom));
    }
    #stage { flex: 1; min-height: 0; position: relative; touch-action: none; cursor: grab; }
    #stage:active { cursor: grabbing; }
    #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #cv2 { background: #f3eef7; }
    .bar {
      display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap;
      padding: 6px 12px; min-height: 48px;
    }

      font: inherit; font-weight: bold; font-size: 16px; border: none; border-radius: 999px;
      background: #6a4c92; color: #fff; height: 42px; padding: 0 16px; cursor: pointer;
      box-shadow: 0 4px 0 #43305e; display: inline-flex; align-items: center; justify-content: center;
    }
    .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #43305e; }
    .btn.sub { background: #fff; color: #6a4c92; box-shadow: 0 4px 0 #ddd0ea; }
    .btn.on { background: #e0609a; color: #fff; box-shadow: 0 4px 0 #a83a6c; }
    .btn:disabled { opacity: .4; cursor: default; }
    #tray {
      display: flex; gap: 8px; overflow-x: auto; padding: 8px 12px 6px; justify-content: safe center;
      touch-action: pan-x; scrollbar-width: none;

    .tile {
      flex: none; width: 56px; height: 56px; border-radius: 14px; border: 2px solid #ddd0ea; background: #fff;
      padding: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-sizing: border-box;

      pointer-events: none; padding: 0 16px;

    #toast {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(74, 61, 92, .9);
      color: #fff; font-weight: bold; padding: 8px 16px; border-radius: 999px; pointer-events: none; white-space: nowrap;
    }
    #drop {
      position: absolute; inset: 10px; border: 4px dashed #e0609a; border-radius: 20px;
      background: rgba(255, 255, 255, .5); pointer-events: none;

</head>
<body>
  <header>
    <a id="back" href="../../">← トップへ戻る</a>
    <div class="hbtns">
      <button id="lang" class="pill">EN</button>
      <button id="snd" class="pill" aria-label="sound"></button>
    </div>
  </header>
  <main>
    <div id="stage">
      <canvas id="cv2" class="hide"></canvas>
      <div id="msg"></div>
      <div id="toast" class="hide"></div>
      <div id="drop" class="hide"></div>
    </div>
    <div id="caseUI">
      <div id="tray">
        <button id="addSticker" class="tile" aria-label="add sticker">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg>
        </button>
      </div>
      <div class="bar">
        <button id="wall" class="btn sub"></button>
        <button class="sw" data-c="0" style="background:#ece7df"></button>
        <button class="sw" data-c="1" style="background:#2c2c33"></button>
        <button class="sw" data-c="2" style="background:#f2b8c9"></button>
        <button class="sw" data-c="3" style="background:#a9c9ec"></button>
        <button id="clear" class="btn sub"></button>
      </div>
    </div>
    <div id="barPaint" class="bar hide">
      <button id="brush" class="btn sub" aria-label="brush"><span class="dot" style="width:11px;height:11px"></span></button>
      <button id="erase" class="btn sub"></button>
      <button id="undo" class="btn sub"></button>
      <button id="cancel" class="btn sub"></button>
      <button id="done" class="btn" disabled></button>
    </div>
    <input id="file" type="file" accept="image/*" class="hide">
  </main>
<script type="module">
const store = {
  get(k, d) { try { const v = localStorage.getItem('shakacase:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('shakacase:' + k, JSON.stringify(v)); return true; } catch { return false; } },
};
const DICT = {
  ja: {
    title: 'シャカケース', back: '← トップへ戻る', wall: '壁紙', clear: '空にする', erase: '消す', undo: '戻す',
    cancel: 'やめる', done: 'できた', err: '画像を読み込めませんでした', loadErr: '読み込みに失敗しました。通信状況を確認して再読み込みしてください',
    delAsk: 'このシールを一覧から消しますか？', full: 'これ以上入りません', saveErr: '端末に保存できませんでした',
  },
  en: {
    title: 'Shaka Case', back: '← Back to top', wall: 'Wallpaper', clear: 'Empty', erase: 'Erase', undo: 'Undo',
    cancel: 'Cancel', done: 'Done', err: 'Could not load the image', loadErr: 'Failed to load. Check your connection and reload.',
    delAsk: 'Remove this sticker from the list?', full: 'The case is full', saveErr: 'Could not save on this device',
  },
};
let lang = store.get('lang', (navigator.language || '').startsWith('ja') ? 'ja' : 'en');
const t = k => DICT[lang][k];
const $ = id => document.getElementById(id);

// ---------- sound ----------
let soundOn = store.get('sound', true), actx = null;
const SPK = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>';
function drawSnd() {
  $('snd').innerHTML = SPK + (soundOn ? '<path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>' : '<path d="M17 9l5 6M22 9l-5 6"/>') + '</svg>';
}
let lastClick = 0;
function click(vol) {
  if (!soundOn) return;
  const now = performance.now();
  if (now - lastClick < 35) return;
  lastClick = now;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const n = actx.currentTime, len = 0.05;
    const buf = actx.createBuffer(1, Math.round(actx.sampleRate * len), actx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 6);
    const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    s.buffer = buf; f.type = 'bandpass'; f.frequency.value = 2500 + Math.random() * 2500; f.Q.value = 1.5;
    g.gain.value = 0.5 * vol;
    s.connect(f).connect(g).connect(actx.destination); s.start(n);
  } catch {}
}

function toast(s) {
  const d = $('toast'); d.textContent = s; d.classList.remove('hide');
  clearTimeout(toast.tm); toast.tm = setTimeout(() => d.classList.add('hide'), 1800);
}

function applyLang() {
  document.documentElement.lang = lang;
  document.title = t('title');
  $('back').textContent = t('back');
  $('lang').textContent = lang === 'ja' ? 'EN' : '日本語';
  for (const k of ['wall', 'clear', 'erase', 'undo', 'cancel', 'done']) $(k).textContent = t(k);
  if ($('msg').dataset.err) $('msg').textContent = t('loadErr');
}
$('lang').onclick = () => { lang = lang === 'ja' ? 'en' : 'ja'; store.set('lang', lang); applyLang(); };
$('snd').onclick = () => { soundOn = !soundOn; store.set('sound', soundOn); drawSnd(); };
drawSnd(); applyLang();

let THREE, RAPIER, RoomEnvironment;
try {
  [THREE, RAPIER, RoomEnvironment] = await Promise.all([
    import('three'),
    import('https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.14.0/rapier.es.js').then(async m => { await m.default.init(); return m.default; }),
    import('three/addons/environments/RoomEnvironment.js').then(m => m.RoomEnvironment),
  ]);
} catch (e) {
  console.error(e);
  $('msg').dataset.err = '1'; $('msg').textContent = t('loadErr');
  throw e;
}

// ---------- sizes (cm) ----------
const PW = 7.2, PH = 15, PD = 0.8, PR = 1.0;       // phone
const GAP = 0.75;                                   // sticker compartment depth (behind the phone)
const Z0 = PD / 2, Z1 = Z0 + GAP;                   // compartment z range (phone local)
const PLATE = 0.14;                                 // clear back plate thickness
const RIM = 0.25;                                   // case rim width
const CAM = { x: -1.95, y: 5.2, s: 2.6, r: 0.65 };  // camera module
const SZ = 2.5;                                     // sticker size (longest side)
const ST = 0.14;                                    // sticker thickness
const MAX = 80;
const G = 981;                                      // gravity (cm/s^2)

// rounded rectangle outline, counter-clockwise
function rrect(cx, cy, w, h, r, seg = 6) {
  const pts = [];
  const cs = [[w / 2 - r, h / 2 - r, 0], [-w / 2 + r, h / 2 - r, 1], [-w / 2 + r, -h / 2 + r, 2], [w / 2 - r, -h / 2 + r, 3]];
  for (const [x, y, q] of cs) for (let i = 0; i <= seg; i++) {
    const a = (q + i / seg) * Math.PI / 2;
    pts.push([cx + x + Math.cos(a) * r, cy + y + Math.sin(a) * r]);
  }
  return pts;
}
const toShape = (pts, S = THREE.Shape) => { const s = new S(); s.moveTo(pts[0][0], pts[0][1]); for (const p of pts.slice(1)) s.lineTo(p[0], p[1]); s.closePath(); return s; };

// ---------- three.js ----------
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const sun = new THREE.DirectionalLight(0xffffff, 1.2); sun.position.set(4, 10, 12); scene.add(sun);
const camera = new THREE.PerspectiveCamera(32, 1, 1, 200);

const phone = new THREE.Group(); scene.add(phone);
const BODY_COLORS = ['#ece7df', '#2c2c33', '#f2b8c9', '#a9c9ec'];
let colorIdx = store.get('color', 0);
const bodyMat = new THREE.MeshStandardMaterial({ color: BODY_COLORS[colorIdx], roughness: 0.35, metalness: 0.15 });
{
  const geo = new THREE.ExtrudeGeometry(toShape(rrect(0, 0, PW - 0.1, PH - 0.1, PR - 0.05)), { depth: PD - 0.1, bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.05, bevelSegments: 3, curveSegments: 8 });
  geo.translate(0, 0, -(PD - 0.1) / 2);
  phone.add(new THREE.Mesh(geo, bodyMat));
}
// screen (front, -z side)
const SW_ = PW - 0.35, SH_ = PH - 0.35;
const screenMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
{
  const geo = new THREE.ShapeGeometry(toShape(rrect(0, 0, SW_, SH_, PR - 0.17)), 8);
  const m = new THREE.Mesh(geo, screenMat); m.rotation.y = Math.PI; m.position.z = -PD / 2 - 0.06;
  phone.add(m);
}
function setWallpaper(img) {
  const tex = img ? new THREE.Texture(img) : (() => {
    const c = document.createElement('canvas'); c.width = 64; c.height = 128;
    const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 64, 128);
    gr.addColorStop(0, '#1d1b2e'); gr.addColorStop(1, '#3a3157');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 128); return new THREE.CanvasTexture(c);
  })();
  tex.colorSpace = THREE.SRGBColorSpace; tex.needsUpdate = true;
  tex.repeat.set(1 / SW_, 1 / SH_); tex.offset.set(0.5, 0.5);
  if (screenMat.map) screenMat.map.dispose();
  screenMat.map = tex; screenMat.needsUpdate = true;
}
setWallpaper(null);
// camera module (sticks out through a hole in the case)
{
  const pts = rrect(CAM.x, CAM.y, CAM.s, CAM.s, CAM.r);
  const geo = new THREE.ExtrudeGeometry(toShape(pts), { depth: Z1 + PLATE + 0.08 - Z0, bevelEnabled: false, curveSegments: 8 });
  geo.translate(0, 0, Z0);
  phone.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0x1b1b20, roughness: 0.25, metalness: 0.4 })));
  const lensMat = new THREE.MeshStandardMaterial({ color: 0x050508, roughness: 0.05, metalness: 0.9 });
  const ringMat = new THREE.MeshStandardMaterial({ color: 0x9a9aa6, roughness: 0.2, metalness: 0.9 });
  for (const [dx, dy] of [[-0.6, 0.6], [-0.6, -0.6], [0.65, 0]]) {
    const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.12, 24), ringMat);
    ring.rotation.x = Math.PI / 2; ring.position.set(CAM.x + dx, CAM.y + dy, Z1 + PLATE + 0.13); phone.add(ring);
    const lens = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.36, 0.13, 24), lensMat);
    lens.rotation.x = Math.PI / 2; lens.position.copy(ring.position); lens.position.z += 0.01; phone.add(lens);
  }
}
// clear case: rim around the phone + back plate
const caseMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.05, metalness: 0, transparent: true, opacity: 0.22, clearcoat: 1, depthWrite: false, side: THREE.DoubleSide });
{
  const outer = rrect(0, 0, PW + RIM * 2, PH + RIM * 2, PR + RIM);
  const rim = toShape(outer); rim.holes.push(toShape(rrect(0, 0, PW, PH, PR), THREE.Path));
  const rimGeo = new THREE.ExtrudeGeometry(rim, { depth: Z1 + PD / 2 + 0.15, bevelEnabled: false, curveSegments: 8 });
  rimGeo.translate(0, 0, -PD / 2 - 0.15);
  const rimMesh = new THREE.Mesh(rimGeo, caseMat); rimMesh.renderOrder = 2; phone.add(rimMesh);
  const plate = toShape(outer); plate.holes.push(toShape(rrect(CAM.x, CAM.y, CAM.s + 0.1, CAM.s + 0.1, CAM.r + 0.05), THREE.Path));
  const plateGeo = new THREE.ExtrudeGeometry(plate, { depth: PLATE, bevelEnabled: false, curveSegments: 8 });
  plateGeo.translate(0, 0, Z1);
  const plateMat = caseMat.clone(); plateMat.opacity = 0.12;
  const plateMesh = new THREE.Mesh(plateGeo, plateMat); plateMesh.renderOrder = 3; phone.add(plateMesh);
}

// ---------- physics ----------
const world = new RAPIER.World({ x: 0, y: -G, z: 0 });
// fine steps while the phone turns (so the walls cannot jump over a sticker), coarse ones when it is still
const STEP_FAST = 1 / 240, STEP_SLOW = 1 / 120;
let STEP = STEP_SLOW;
world.timestep = STEP;
const caseBody = world.createRigidBody(RAPIER.RigidBodyDesc.kinematicPositionBased());
{
  const add = d => world.createCollider(d.setFriction(0.3).setRestitution(0.2), caseBody);
  add(RAPIER.ColliderDesc.cuboid(PW / 2 + 3, PH / 2 + 3, 3).setTranslation(0, 0, Z0 - 3));          // phone back
  add(RAPIER.ColliderDesc.cuboid(PW / 2 + 3, PH / 2 + 3, 3).setTranslation(0, 0, Z1 + 3));          // clear plate
  // side walls along the rounded outline
  const pts = rrect(0, 0, PW, PH, PR, 6), hz = GAP / 2 + 3, TH = 3;   // thick walls so fast spins cannot tunnel
  for (let i = 0; i < pts.length; i++) {
    const [x1, y1] = pts[i], [x2, y2] = pts[(i + 1) % pts.length];
    const ex = x2 - x1, ey = y2 - y1, len = Math.hypot(ex, ey); if (len < 1e-6) continue;
    const nx = ey / len, ny = -ex / len, a = Math.atan2(ey, ex);
    add(RAPIER.ColliderDesc.cuboid(len / 2 + 0.06, TH, hz)
      .setTranslation((x1 + x2) / 2 + nx * TH, (y1 + y2) / 2 + ny * TH, (Z0 + Z1) / 2)
      .setRotation({ x: 0, y: 0, z: Math.sin(a / 2), w: Math.cos(a / 2) }));
  }
  // camera module
  const cam = [];
  for (const [x, y] of rrect(CAM.x, CAM.y, CAM.s, CAM.s, CAM.r)) cam.push(x, y, Z0 - 0.3, x, y, Z1 + 0.3);
  const cd = RAPIER.ColliderDesc.convexHull(new Float32Array(cam)); if (cd) add(cd);
}

// ---------- cut-out outline -> polygons ----------
// binary grid -> outer boundary of every 4-connected blob, traced along pixel edges
function blobs(grid, gw, gh) {
  const lab = new Int32Array(gw * gh), out = [];
  let n = 0;
  for (let j = 0; j < gh; j++) for (let i = 0; i < gw; i++) {
    const k = j * gw + i; if (!grid[k] || lab[k]) continue;
    n++; let area = 0; const st = [k]; lab[k] = n;
    while (st.length) {
      const c = st.pop(), ci = c % gw, cj = (c - ci) / gw; area++;
      for (const [di, dj] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const a = ci + di, b = cj + dj; if (a < 0 || b < 0 || a >= gw || b >= gh) continue;
        const q = b * gw + a; if (grid[q] && !lab[q]) { lab[q] = n; st.push(q); }
      }
    }
    out.push({ id: n, area, i0: i, j0: j });
  }
  const inside = (i, j, L) => i >= 0 && j >= 0 && i < gw && j < gh && lab[j * gw + i] === L;
  for (const b of out) {
    // walk with the blob on the right-hand side (y points down)
    let x = b.i0, y = b.j0, dx = 1, dy = 0;
    const pts = [[x, y]];
    for (let guard = 0; guard < 4 * gw * gh; guard++) {
      x += dx; y += dy;
      if (x === b.i0 && y === b.j0) break;
      const rx = -dy, ry = dx, lx = dy, ly = -dx;
      const fr = inside(Math.floor(x + 0.5 * dx + 0.5 * rx), Math.floor(y + 0.5 * dy + 0.5 * ry), b.id);
      const fl = inside(Math.floor(x + 0.5 * dx + 0.5 * lx), Math.floor(y + 0.5 * dy + 0.5 * ly), b.id);
      let ndx = dx, ndy = dy;
      if (!fr) { ndx = rx; ndy = ry; } else if (fl) { ndx = lx; ndy = ly; }
      if (ndx !== dx || ndy !== dy) { pts.push([x, y]); dx = ndx; dy = ndy; }
    }
    b.pts = pts;
  }
  return out;
}
function rdp(pts, eps) {
  if (pts.length < 3) return pts;
  const [a, b] = [pts[0], pts[pts.length - 1]];
  let md = -1, mi = 0;
  const ex = b[0] - a[0], ey = b[1] - a[1], L = Math.hypot(ex, ey);
  for (let i = 1; i < pts.length - 1; i++) {
    const p = pts[i];
    const d = L < 1e-9 ? Math.hypot(p[0] - a[0], p[1] - a[1]) : Math.abs(ex * (p[1] - a[1]) - ey * (p[0] - a[0])) / L;
    if (d > md) { md = d; mi = i; }
  }
  if (md <= eps) return [a, b];
  const l = rdp(pts.slice(0, mi + 1), eps), r = rdp(pts.slice(mi), eps);
  return l.slice(0, -1).concat(r);
}
function simplifyLoop(pts, eps) {
  let far = 0, fd = -1;
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[0][0], pts[i][1] - pts[0][1]); if (d > fd) { fd = d; far = i; } }
  const a = rdp(pts.slice(0, far + 1), eps), b = rdp(pts.slice(far).concat([pts[0]]), eps);
  return a.slice(0, -1).concat(b.slice(0, -1));
}
const area2 = p => { let s = 0; for (let i = 0; i < p.length; i++) { const a = p[i], b = p[(i + 1) % p.length]; s += a[0] * b[1] - b[0] * a[1]; } return s; };
// split a simple polygon into convex pieces: triangulate, then merge neighbours while the result stays convex
function convexParts(poly) {
  const tris = THREE.ShapeUtils.triangulateShape(poly.map(p => new THREE.Vector2(p[0], p[1])), []);
  let parts = tris.map(t => (area2(t.map(i => poly[i])) < 0 ? [t[0], t[2], t[1]] : t.slice()));
  const convex = q => {
    for (let i = 0; i < q.length; i++) {

  camera.aspect = W / H;
  // keep the whole phone in view whichever way it is turned
  const R = PH / 2 + 1.2, fov = camera.fov * Math.PI / 180;
  const half = Math.min(fov / 2, Math.atan(Math.tan(fov / 2) * camera.aspect));
  camera.position.set(0, 0, R / Math.sin(half));
  camera.lookAt(0, 0, 0); camera.updateProjectionMatrix();
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  if (mode === 'paint' && img) { placeImage(); render2d(); }
}
new ResizeObserver(resize).observe(stage);
resize();

// ---------- loop ----------
let last = performance.now(), acc = 0;
const qa = new THREE.Quaternion();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (mode === 'case') {
    if (flip) {
      flip.t = Math.min(1, flip.t + dt * 2.2);
      const e = flip.t < 0.5 ? 2 * flip.t * flip.t : 1 - Math.pow(-2 * flip.t + 2, 2) / 2;
      phoneQ.slerpQuaternions(flip.from, flip.to, e);
      if (flip.t >= 1) flip = null;
      targetQ.copy(phoneQ);
    } else if (drag) {
      phoneQ.rotateTowards(targetQ, MAX_W * dt);
    } else if (omega.lengthSq() > 1e-6) {
      const w = omega.length();
      phoneQ.premultiply(qa.setFromAxisAngle(tmpV.copy(omega).divideScalar(w), w * dt)).normalize();
      omega.multiplyScalar(Math.exp(-2.5 * dt));
      if (w < 0.05) omega.set(0, 0, 0);
      targetQ.copy(phoneQ);
    }
    if (!motionOn) grav.set(0, -G, 0);
    world.gravity = { x: grav.x, y: grav.y, z: grav.z };
    const moving = drag || flip || omega.lengthSq() > 0.01 || phoneQ.angleTo(physQ) > 1e-4;
    if ((moving ? STEP_FAST : STEP_SLOW) !== STEP) { STEP = moving ? STEP_FAST : STEP_SLOW; world.timestep = STEP; }
    acc += dt;
    const n = Math.min(10, Math.floor(acc / STEP));
    acc -= n * STEP; if (n === 10) acc = 0;
    const from = physQ.clone();
    for (let i = 0; i < n; i++) {
      qa.slerpQuaternions(from, phoneQ, (i + 1) / n);
      caseBody.setNextKinematicRotation({ x: qa.x, y: qa.y, z: qa.z, w: qa.w });
      world.step();
    }
    if (n) physQ.copy(phoneQ);
    phone.quaternion.copy(physQ);
    const inv = physQ.clone().invert();
    for (const s of stickers) {
      const p = s.body.translation();
      // safety: anything that slipped out of the compartment goes back in
      const l = tmpV.set(p.x, p.y, p.z).applyQuaternion(inv);
      if (Math.abs(l.x) > PW / 2 + 0.3 || Math.abs(l.y) > PH / 2 + 0.3 || l.z < Z0 - 0.3 || l.z > Z1 + 0.3) {
        // put it back at the nearest spot inside, lying flat
        l.x = Math.max(-PW / 2 + 1, Math.min(PW / 2 - 1, l.x));
        l.y = Math.max(-PH / 2 + 1, Math.min(PH / 2 - 1, l.y));
        l.z = (Z0 + Z1) / 2;
        const np = l.applyQuaternion(physQ);
        s.body.setTranslation({ x: np.x, y: np.y, z: np.z }, true);
        s.body.setRotation({ x: physQ.x, y: physQ.y, z: physQ.z, w: physQ.w }, true);
        s.body.setLinvel({ x: 0, y: 0, z: 0 }, true); s.body.setAngvel({ x: 0, y: 0, z: 0 }, true);
      }
      // click when a sticker's velocity changes sharply (it hit something)
      const v = s.body.linvel();
      const dv = Math.hypot(v.x - s.v.x, v.y - s.v.y, v.z - s.v.z);
      if (dv > 90 && n) click(Math.min(1, dv / 600));
      s.v = { x: v.x, y: v.y, z: v.z };
      syncMesh(s);
    }
    renderer.render(scene, camera);
  }
  requestAnimationFrame(loop);
}

// ---------- restore ----------
{
  const w = store.get('wall', null);
  if (w) { const im = new Image(); im.onload = () => setWallpaper(im); im.src = w; }
}
renderTray();
(async () => {
  const queue = [];
  for (const tp of types) { if (await buildRuntime(tp)) for (let i = 0; i < (tp.n || 0); i++) queue.push(tp.id); }
  for (const id of queue) { spawn(id); await new Promise(r => setTimeout(r, 40)); }
})();
requestAnimationFrame(loop);
</script>
</body>
