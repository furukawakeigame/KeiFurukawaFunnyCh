    // ---------- 見た目の状態（全員の端末で同じ） ----------

    function apply(m) {

    // ---------- 物理（ホストだけ） ----------
    let world = null, bodies = new Map(), nextId = 1;

    function newWorld() {

    let isHost = true;   // 1人で遊ぶときもホスト
    function emit(m) { apply(m); if (isHost && conns.size) for (const c of conns.values()) send(c, m); }
    const WEIGHT = { bread: 3, book: 3, dice: 2, cat: 3, pot: 2, mug: 2, donut: 2, boot: 1, banana: 1, daikon: 1, dumbbell: 1, duck: 1 };
    const BAG = KIND_LIST.flatMap(k => Array(WEIGHT[k] || 1).fill(k));

    }
    function coreDrop(a) {
      if (core.phase !== 'aim') return;

    function measure() {

    function coreStep(h) {

      for (const { b } of bodies.values()) {

    function coreFrame(dt) {

    // ---------- CPU（置く前に候補を裏で試して、一番崩れにくい所を選ぶ） ----------
    function planCpu(kind) {
      // 一番上の物の真上（台だけなら真ん中）
      let cx = 0, cz = 0, topY = -1;
      for (const p of view.pieces.values()) { const y = topOf(p.kind, p.g.position, p.g.quaternion); if (y > topY) { topY = y; cx = p.g.position.x; cz = p.g.position.z; } }
      // 塔の重心の方へ少し寄せる

      if (n) { gx /= n; gz /= n; cx = cx * 0.8 + gx * 0.2; cz = cz * 0.8 + gz * 0.2; }

      const tilts = [0, 1].sort((a, b) => { const ea = extent(kind, orient(0, a)), eb = extent(kind, orient(0, b)); return (ea[1] - ea[0]) - (eb[1] - eb[0]); });
      for (const tl of tilts) for (const yw of [0, 2, 1, 3]) for (const [ox, oz] of [[0, 0], [0.02, 0], [-0.02, 0], [0, 0.02], [0, -0.02]]) cands.push({ x: cx + ox, z: cz + oz, yaw: yw, tilt: tl });
      // 試す数は14個まで（近い所・低く寝かせる向きを優先）
      const pick = cands.slice(0, 4).concat(cands.slice(4).sort(() => Math.random() - 0.5).slice(0, 8));
      const snap = world.takeSnapshot();
      return { kind, cands: pick, i: 0, best: null, bestS: Infinity, snap, think: 1.0 + Math.random() * 0.6, t: 0, sent: 0, tx: cx, tz: cz, yaw: pick[0].yaw, tilt: pick[0].tilt };
    }
    function simScore(c, kind, snap) {
      const w = RAPIER.World.restoreSnapshot(snap);
      w.timestep = 1 / 120;
      try { w.integrationParameters.numSolverIterations = 8; } catch {}
      const before = [];
      w.forEachRigidBody(b => { if (b.isDynamic()) { const t = b.translation(); before.push([b, t.x, t.y, t.z]); } });
      const q = orient(c.yaw, c.tilt);

      const nb = addBody(-1, kind, p, q, w);

        if (k % 2 === 0) w.forEachRigidBody(b => { if (!b.isDynamic() || b.isSleeping()) return; const v = b.linvel(), a = b.angvel(); if (Math.hypot(v.x, v.y, v.z) < 0.25 && Math.hypot(a.x, a.y, a.z) < 4) { b.setAngvel({ x: a.x * 0.93, y: a.y * 0.93, z: a.z * 0.93 }, false); b.setLinvel({ x: v.x * 0.97, y: v.y, z: v.z * 0.97 }, false); } });

    function topNow() { let hi = BASE_TOP; const pp = new THREE.Vector3(), qq = new THREE.Quaternion(); for (const { b, kind } of bodies.values()) { const tr = b.translation(), rt = b.rotation(); pp.set(tr.x, tr.y, tr.z); qq.set(rt.x, rt.y, rt.z, rt.w); hi = Math.max(hi, topOf(kind, pp, qq)); } return hi; }
    function cpuFrame(dt) {

    // ドラッグ: 物の近くなら物を動かす、それ以外は見る向きを回す

    function showResult() {

      $('rH').textContent = t('cm')(o.h);
      $('rN').textContent = t('pcs')(o.n);
      const b = $('rBest'); b.textContent = o.newBest && o.h > 0 ? t('newBest') : t('best')(best); b.classList.toggle('new', !!o.newBest && o.h > 0);
      $('again').disabled = online && !isHost;
      $('again').textContent = online && !isHost ? t('waitHost') : t('again');
      const post = $('post');
      post.href = `https://x.com/intent/post?text=${encodeURIComponent(t('share')(o.h, o.n))}&url=${encodeURIComponent(SHARE_URL)}`;
      if (!matchMedia('(pointer: coarse)').matches) { post.target = '_blank'; post.rel = 'noopener'; } else post.removeAttribute('target');
    }
    $('post').addEventListener('click', e => {
      const o = view.over; if (!o) return;
      const text = t('share')(o.h, o.n);
      if (matchMedia('(pointer: coarse)').matches && navigator.share) {
        e.preventDefault();
        const file = shareFile();
        const data = file && navigator.canShare?.({ files: [file] }) ? { files: [file], text: `${text}\n${SHARE_URL}` } : { text: `${text}\n${SHARE_URL}` };
        navigator.share(data).catch(() => {});
        return;
      }
      const img = resultImage();
      if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = NAME + '.png'; d.click(); }
    });
    $('again').onclick = () => { if (online && !isHost) return; coreStart(); };
    function takeSnap() {
      renderer.render(scene, camera);
      const src = canvas;
      const top = Math.max(BASE_TOP + 0.3, viewTop());
      const pts = [new THREE.Vector3(-0.45, TOP, 0), new THREE.Vector3(0.45, TOP, 0), new THREE.Vector3(0, top + 0.06, 0), new THREE.Vector3(0, TOP - 0.05, 0.45)];
      let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
      for (const p of pts) { const q = _v.copy(p).project(camera), px = (q.x + 1) / 2 * src.width, py = (1 - q.y) / 2 * src.height; x0 = Math.min(x0, px); x1 = Math.max(x1, px); y0 = Math.min(y0, py); y1 = Math.max(y1, py); }
      const side = Math.max(x1 - x0, y1 - y0) * 1.15;
      const sx = (x0 + x1) / 2 - side / 2, sy = (y0 + y1) / 2 - side * 0.5;
      snap = document.createElement('canvas'); snap.width = snap.height = 1080;
      const g = snap.getContext('2d'), k = 1080 / side;
      g.fillStyle = '#3a2418'; g.fillRect(0, 0, 1080, 1080);
      const ax = Math.max(0, sx), ay = Math.max(0, sy), bx = Math.min(src.width, sx + side), by = Math.min(src.height, sy + side);
      if (bx > ax && by > ay) g.drawImage(src, ax, ay, bx - ax, by - ay, (ax - sx) * k, (ay - sy) * k, (bx - ax) * k, (by - ay) * k);
      shareCache = null;
    }
    function resultImage() {
      if (!snap || !view.over) return null;
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const g = c.getContext('2d');
      g.drawImage(snap, 0, 0);
      const sh = g.createLinearGradient(0, 780, 0, 1080); sh.addColorStop(0, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(0,0,0,.7)');
      g.fillStyle = sh; g.fillRect(0, 780, 1080, 300);
      const sh2 = g.createLinearGradient(0, 0, 0, 170); sh2.addColorStop(0, 'rgba(0,0,0,.55)'); sh2.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = sh2; g.fillRect(0, 0, 1080, 170);
      const font = px => `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans Thai", sans-serif`;
      g.lineJoin = 'round'; g.textBaseline = 'middle';
      const text = (str, x, y, px, max, col = '#fff') => { g.font = font(px); g.textAlign = 'center'; const w = g.measureText(str).width; if (w > max) { px *= max / w; g.font = font(px); } g.lineWidth = px * 0.16; g.strokeStyle = '#3a2208'; g.strokeText(str, x, y); g.fillStyle = col; g.fillText(str, x, y); };
      text(t('cm')(view.over.h), 540, 930, 200, 760, '#ffe39a');
      text(t('pcs')(view.over.n), 540, 800, 76, 600);
      text(t('title'), 540, 74, 60, 900);
      return c;
    }
    function prepareShare() {
      if (!snap) return;
      const key = lang; if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], NAME + '.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;

    // ---------- 毎フレーム ----------
    const TEST = location.search.includes('test');
    const SPEED = TEST ? +(new URLSearchParams(location.search).get('speed') || 1) : 1;
    let last = performance.now(), acc = 0, time = 0, tfT = 0, slow = 1;
    const H = 1 / 120;
    function frame(now) {
      requestAnimationFrame(frame);
      const rdt = Math.min(0.05, (now - last) / 1000) * SPEED; last = now; time += rdt;
      // 崩れ始めたら少しスローモーション
      const wantSlow = view.phase === 'fall' ? 0.4 : 1;
      slow += (wantSlow - slow) * Math.min(1, rdt * 4);
      const dt = rdt * slow;
      if (isHost && world) {
        acc += dt;
        let n = 0;
        while (acc >= H && n < 12 * SPEED) { coreStep(H); acc -= H; n++; }
        coreFrame(rdt);
        // 物の位置（ホストは物理から直接）
        for (const [id, { b }] of bodies) { const p = view.pieces.get(id); if (!p) continue; const tr = b.translation(), rt = b.rotation(); p.tp.set(tr.x, tr.y, tr.z); p.tq.set(rt.x, rt.y, rt.z, rt.w); }
        tfT += rdt;
        if (conns.size && tfT > 0.05 && core.phase !== 'over') {
          tfT = 0;
          const arr = []; for (const [id, { b }] of bodies) { if (b.isSleeping()) continue; const tr = b.translation(), rt = b.rotation(); arr.push([id, +tr.x.toFixed(4), +tr.y.toFixed(4), +tr.z.toFixed(4), +rt.x.toFixed(4), +rt.y.toFixed(4), +rt.z.toFixed(4), +rt.w.toFixed(4)]); }
          if (arr.length) for (const c of conns.values()) send(c, { t: 'tf', b: arr });
        }
      }
      // 物の見た目と音
      let maxV = 0;
      for (const p of view.pieces.values()) {
        if (isHost) { p.g.position.copy(p.tp); p.g.quaternion.copy(p.tq); }
        else { const k = 1 - Math.exp(-rdt * 18); p.g.position.lerp(p.tp, k); p.g.quaternion.slerp(p.tq, k); }
        const v = p.g.position.distanceTo(p.lastP) / Math.max(1e-3, rdt);
        if (p.lastV - v > 0.35 && p.lastV > 0.25) sKnock(p.lastV, KINDS[p.kind].hard);
        if (view.phase === 'fall' && v > 0.6 && Math.random() < 0.02) sCrash();
        p.lastV = v; p.lastP.copy(p.g.position); maxV = Math.max(maxV, v);
      }
      if (view.phase === 'drop' && maxV > 0.01 && maxV < 0.12 && Math.random() < 0.03) sCreak();
      // 浮かんでいる物
      const hv = view.hover;
      if (hv) {
        const k = 1 - Math.exp(-rdt * 12);
        hv.x += (hv.tx - hv.x) * k; hv.z += (hv.tz - hv.z) * k;
        const tq = orient(hv.yaw, hv.tilt, _q2.clone());
        hv.g.quaternion.slerp(tq, 1 - Math.exp(-rdt * 14));
        const y = hoverY(hv.kind, tq) + Math.sin(time * 2.4) * 0.006;
        hv.g.position.set(hv.x, hv.g.position.y + (y - hv.g.position.y) * (1 - Math.exp(-rdt * 8)), hv.z);
        view.turnT += rdt;
        // 真下の目印
        ray.set(new THREE.Vector3(hv.x, hv.g.position.y, hv.z), new THREE.Vector3(0, -1, 0));
        const targets = [window.__board]; for (const p of view.pieces.values()) targets.push(p.g);
        const hit = ray.intersectObjects(targets, true)[0];
        const gy = hit ? hit.point.y : TOP;
        const [lo] = extent(hv.kind, hv.g.quaternion);
        mark.visible = guide.visible = true;
        mark.position.set(hv.x, gy + 0.002, hv.z);
        guide.position.set(hv.x, gy, hv.z); guide.scale.set(1, Math.max(0.001, hv.g.position.y + lo - gy), 1); guide.computeLineDistances();
        markMat.color.setHex(COLORS[hv.seat]);
        // 自分の番の残り時間
        if (hv.seat === mySeat && view.phase === 'aim') {
          const rest = clamp(1 - view.turnT / TURN_SEC, 0, 1);
          $('timer').setAttribute('stroke-dashoffset', String(289 * (1 - rest)));
          if (view.turnT > TURN_SEC) doDrop();
        }
      } else { mark.visible = guide.visible = false; }
      // 番の人の前の輪
      const [tdx, tdz] = DIRS[view.turn];
      turnRing.position.set(tdx * 0.48, TOP + 0.002, tdz * 0.48);
      turnRing.material.color.setHex(COLORS[view.turn]);
      const ringO = view.phase === 'aim' && view.turn !== mySeat ? 0.55 + 0.2 * Math.sin(time * 4) : 0;
      turnRing.material.opacity += (ringO - turnRing.material.opacity) * Math.min(1, rdt * 6);
      // 旗
      for (const f of flags) {
        f.lit = Math.max(0, f.lit - rdt * 0.4);
        f.ringMat.opacity = f.passed ? 0.5 + 0.4 * f.lit : 0.28;
        f.ringMat.color.setHex(f.passed ? 0xffe08a : 0xd8c8a0);
        f.g.visible = f.cm <= Math.max(view.h, best) + FLAG_STEP * 1.2;
      }
      // 人
      people.forEach((p, i) => {
        if (!p.h.root.visible) return;
        const h = p.h, mine = view.phase === 'aim' && view.turn === i;
        p.lean += ((mine ? 1 : 0) - p.lean) * Math.min(1, rdt * 3);
        p.cheer = Math.max(0, p.cheer - rdt);
        h.pose = p.cheer > 0 ? 'cheer' : mine ? 'point' : 'sit';
        h.lookAt(view.hover ? view.hover.g.position : _v.set(0, viewTop(), 0).clone());
        p.react = Math.max(0, p.react - rdt);
        const m = p.react > 0 ? p.mood : 0;
        h.face.smile += ((m > 0 ? m : m * 0.6) - h.face.smile) * Math.min(1, rdt * 5);
        h.face.brow += ((m < 0 ? -1 : m > 0.8 ? 0.4 : 0) - h.face.brow) * Math.min(1, rdt * 5);
        h.face.open += ((p.cheer > 0 ? 0.6 : m < -0.5 ? 0.55 : 0) - h.face.open) * Math.min(1, rdt * 6);
        h.j.spine.rotation.x -= p.leanOn;
        h.update(rdt);
        sitLegs(h);
        p.leanOn = p.lean * 0.3 + (m < -0.5 ? -0.15 : 0);
        h.j.spine.rotation.x += p.leanOn;
      });
      if (camOver) { camera.position.copy(camOver[0]); camera.lookAt(camOver[1]); camera.updateMatrixWorld(); } else updateCamera(rdt);
      placeHint();
      renderer.render(scene, camera);
    }
    let camOver = null;
    if (TEST) window.__t = {
      get phase() { return view.phase; }, get turn() { return view.turn; }, get mySeat() { return mySeat; }, get h() { return view.h; }, get n() { return view.n; },
      aim: (x, z, yaw = 0, tilt = 0) => { if (myTurn()) setAim(x, z, yaw, tilt); }, drop: () => doDrop(),
      cpuAim: () => { if (!myTurn()) return; const c = planCpu(view.hover.kind); for (const cd of c.cands) { const sc = Math.max(simScore({ ...cd, x: cd.x + 0.006 }, c.kind, c.snap), simScore({ ...cd, x: cd.x - 0.006 }, c.kind, c.snap)); if (sc < c.bestS) { c.bestS = sc; c.best = cd; } } console.log('LOG best ' + c.kind + ' ' + c.bestS.toFixed(2)); setAim(c.best.x, c.best.z, c.best.yaw, c.best.tilt); },
      cam: (p, l) => { camOver = [new THREE.Vector3(...p), new THREE.Vector3(...l)]; },
      stack: arr => { for (const [kind, yaw, tilt, ox = 0, oz = 0] of arr) { const q = orient(yaw, tilt), [lo] = extent(kind, q), p = new THREE.Vector3(ox, topNow() - lo + 0.004, oz), id = nextId++; addBody(id, kind, p, q); apply({ t: 'drop', id, kind, p: [p.x, p.y, p.z], q: [q.x, q.y, q.z, q.w] }); for (let k = 0; k < 360; k++) world.step(); } core.phase = 'idle'; },
      dump: () => [...bodies].map(([id, { b, kind }]) => { const t = b.translation(); return [kind, +t.x.toFixed(3), +t.y.toFixed(3), +t.z.toFixed(3)]; }),
      host: () => { createRoom(); }, join: c => joinRoom(c), go: () => $('go').onclick(), get code() { return roomCode; },
    };

    resize();
    applyLang();
    coreStart();
    renderer.compile(scene, camera);
    renderer.render(scene, camera);
    requestAnimationFrame(t0 => { last = t0; frame(t0); });
  </script>
