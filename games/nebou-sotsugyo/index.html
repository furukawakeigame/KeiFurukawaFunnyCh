        const vel = e.target.velocity;
        toppleQ.push({ p: other.standing, vel: new THREE.Vector3(vel.x * 0.55, Math.max(0.5, vel.y * 0.3 + 0.8), vel.z * 0.55) });
      }
      if (v > 2.2 && thudCD <= 0 && state !== 'result') {
        sThud(v); thudCD = 0.06;
        if (v > 4 && (p.oofCD || 0) <= 0 && (e.target.part === 'pelvis' || e.target.part === 'chest' || e.target.part === 'head')) { sOof(p); p.oofCD = 1.2; p.h.face.open = 0.3; p.h.face.brow = -0.6; p.h.face.smile = -0.5; }
      }
    }
    let knocked = 0;
    function topple(p, vel) {
      if (p.rag) return;
      ragdoll(p, vel);
      knocked++;
      p.h.face.open = 0.7; p.h.face.brow = 1; p.h.face.smile = -0.3;
      if (p.teacher) sKora(p); else sWa(p);
      // まわりの人はびっくり
      for (const q of people) if (!q.rag && q.home.distanceTo(p.home) < 1.3) { q.h.face.brow = 1; q.h.face.open = 0.45; q.h.face.smile = -0.1; q.shockT = 1.2; }
    }

    // ---------- 写真の枠 ----------
    const FW = 5.3, FH = 3.05;
    const frameEl = document.getElementById('frame'), ledEl = document.getElementById('led'), leds = [...ledEl.querySelectorAll('b')];
    let frameRect = { x: 0, y: 0, w: 1, h: 1 };

    // ---------- 画面サイズ ----------
    const controls = document.getElementById('controls');
    function resize() {
      const w = stage.clientWidth, H = stage.clientHeight;
      renderer.setSize(w, H, false);
      const btnH = Math.min(72, Math.max(56, 0.08 * Math.min(innerWidth, innerHeight))) + 12;
      const reserve = Math.max(0, stage.getBoundingClientRect().bottom - controls.getBoundingClientRect().bottom) + btnH;
      const top = 58, h = Math.max(140, H - reserve - top);
      camera.aspect = w / h;
      camera.setViewOffset(w, h, 0, -top, w, H);
      // 写真の枠と、手前の自分が入るまでカメラを引く
      const cy = FH / 2;
      const inside = () => {
        camera.updateProjectionMatrix(); camera.updateMatrixWorld();
        const pts = [V3(-FW / 2 - 0.15, FH + 0.25, FZ), V3(FW / 2 + 0.15, -0.05, FZ), V3(-FW / 2 - 0.15, -0.05, FZ), V3(START.x + 0.4, 0, START.z + 0.2), V3(START.x - 0.4, 1.9, START.z)];
        return pts.every(p => { const q = p.clone().project(camera); const sy = (1 - q.y) / 2 * H; return Math.abs(q.x) < 1 && sy > top && sy < H - reserve && q.z < 1; });
      };
      let d = 6;
      for (let i = 0; i < 60; i++) {
        camera.position.set(0, 1.9 + d * 0.06, FZ + d);
        camera.lookAt(0, cy - 0.35, FZ);
        if (inside()) break;
        d += 0.35;
      }
      const pr = v => { const q = v.clone().project(camera); return { x: (q.x + 1) / 2 * w, y: (1 - q.y) / 2 * H }; };
      const a = pr(V3(-FW / 2, FH, FZ)), b = pr(V3(FW / 2, 0, FZ));
      frameRect = { x: a.x, y: a.y, w: b.x - a.x, h: b.y - a.y };
      Object.assign(frameEl.style, { left: a.x + 'px', top: a.y + 'px', width: frameRect.w + 'px', height: frameRect.h + 'px' });
      Object.assign(document.getElementById('result').style, { left: a.x + 'px', top: a.y + 'px', width: frameRect.w + 'px', height: frameRect.h + 'px' });
      Object.assign(ledEl.style, { left: (a.x + b.x) / 2 + 'px', top: a.y - 8 + 'px' });
    }
    addEventListener('resize', resize);

    // ---------- 入力: 自分を引っぱって飛ばす ----------
    const dotTex = canvasTex(32, 32, g => { g.fillStyle = '#fff'; g.beginPath(); g.arc(16, 16, 12, 0, 7); g.fill(); g.strokeStyle = 'rgba(40,50,70,.6)'; g.lineWidth = 3; g.stroke(); });
    const dots = [];
    for (let i = 0; i < 18; i++) { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: dotTex, transparent: true, depthTest: false, opacity: 0.9 })); s.scale.setScalar(0.09); s.visible = false; s.renderOrder = 10; scene.add(s); dots.push(s); }
    let aim = null; // { sx, sy, from }
    const launchVel = new THREE.Vector3();
    function mePos() {
      if (me.rag) { const b = me.bodies.pelvis.position; return V3(b.x, b.y, b.z); }
      me.h.j.pelvis.getWorldPosition(TV); return TV.clone();
    }
    function computeLaunch(px, py) {
      const dx = aim.sx - px, dy = aim.sy - py, len = Math.hypot(dx, dy);
      const full = Math.min(stage.clientWidth, stage.clientHeight) * 0.38;
      const s = Math.min(1, len / full);
      if (len < 8) { launchVel.set(0, 0, 0); return 0; }
      const ux = dx / len, uy = -dy / len; // 画面の上向きが「奥＋上」
      launchVel.set(ux * 5.5 * s, 2.5 + 5.2 * s * Math.max(0.2, uy), -Math.max(-0.3, uy) * 6.5 * s);
      return s;
    }
    function drawDots(show) {
      const p0 = aim ? aim.from : mePos();
      dots.forEach((d, i) => {
        d.visible = show;
        if (!show) return;
        const tt = (i + 1) * 0.07;
        d.position.set(p0.x + launchVel.x * tt, p0.y + launchVel.y * tt - 4.91 * tt * tt, p0.z + launchVel.z * tt);
        d.material.opacity = 0.9 * (1 - i / dots.length);
        if (d.position.y < 0) d.visible = false;
      });
    }
    function canGrab() {
      if (!me.rag) return true;
      const v = me.bodies.pelvis.velocity; return v.length() < 3.2;
    }
    renderer.domElement.addEventListener('pointerdown', e => {
      e.preventDefault();
      if (!(state === 'ready' || state === 'play') || aim || !canGrab()) return;
      const r = renderer.domElement.getBoundingClientRect();
      const px = e.clientX - r.left, py = e.clientY - r.top;
      // 自分の体の近くを押したらつかむ
      let near = false;
      const check = wp => { const q = wp.clone().project(camera); const sx = (q.x + 1) / 2 * r.width, sy = (1 - q.y) / 2 * r.height; if (Math.hypot(sx - px, sy - py) < Math.max(56, r.height * 0.07)) near = true; };
      if (me.rag) for (const n in me.bodies) { const b = me.bodies[n].position; check(V3(b.x, b.y, b.z)); }
      else for (const n of ['pelvis', 'spine', 'head', 'kneeL', 'kneeR', 'elbowL', 'elbowR']) { me.h.j[n].getWorldPosition(TV); check(TV.clone()); }
      if (!near) return;
      if (state === 'ready') { state = 'play'; timer = TIMER; beepT = 0; }
      aim = { sx: px, sy: py, from: mePos() };
      launchVel.set(0, 0, 0);
      sPull(me);
      me.h.face.open = 0.2; me.h.face.brow = 0.8; me.h.face.smile = -0.2;
      renderer.domElement.setPointerCapture?.(e.pointerId);
    }, { passive: false });
    renderer.domElement.addEventListener('pointermove', e => {
      if (!aim) return;
      const r = renderer.domElement.getBoundingClientRect();
      const s = computeLaunch(e.clientX - r.left, e.clientY - r.top);
      drawDots(s > 0);
    });
    function launch() {
      if (!aim) return;
      const v = launchVel.clone();
      aim = null; drawDots(false);
      if (v.lengthSq() < 0.5) return;
      if (!me.rag) ragdoll(me);
      for (const n in me.bodies) { const b = me.bodies[n]; b.wakeUp(); b.velocity.set(v.x, v.y, v.z); }
      // 少し回転させる
      me.bodies.pelvis.angularVelocity.set(rnd(-3, 3), rnd(-2, 2), rnd(-3, 3));
      me.bodies.chest.angularVelocity.set(rnd(-4, 4), rnd(-2, 2), rnd(-4, 4));
      me.h.face.open = 0.9; me.h.face.brow = 1; me.h.face.smile = -0.2; me.ragT = 0; me.oofCD = 0.5;
      sLaunch(me);
    }
    for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) renderer.domElement.addEventListener(ev, launch);
    stage.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

    // ---------- ゲーム ----------
    let state = 'ready', timer = TIMER, beepT = 0, endT = 0, inPhoto = false, needSnap = false, ledOn = false, pantT = 0;
    const flashEl = document.getElementById('flash'), resultEl = document.getElementById('result');
    function headScreen(p) {
      let hp;
      if (p.rag) { const b = p.bodies.head.position; hp = V3(b.x, b.y, b.z); }
      else { p.h.j.head.getWorldPosition(TV); hp = TV.clone().add(V3(0, 0.1, 0)); }
      const r = renderer.domElement.getBoundingClientRect(), q = hp.project(camera);
      return { x: (q.x + 1) / 2 * r.width, y: (1 - q.y) / 2 * r.height, ok: q.z < 1 };
    }
    function shutter() {
      state = 'shot'; endT = 0;
      aim = null; drawDots(false);
      sShutter();
      flashEl.style.transition = 'none'; flashEl.style.opacity = '1';
      requestAnimationFrame(() => { flashEl.style.transition = 'opacity .6s'; flashEl.style.opacity = '0'; });
      // シャッターの瞬間だけ、みんな（倒れた人も自分も）カメラを見てにっこり
      for (const p of [...people, me]) { p.h.face.smile = 1; p.h.face.open = 0.25; p.h.face.brow = 0.3; p.h.lookAt(camera.position); }
      const s = headScreen(me);
      inPhoto = s.ok && s.x > frameRect.x && s.x < frameRect.x + frameRect.w && s.y > frameRect.y && s.y < frameRect.y + frameRect.h;
      setLeds(false);
    }
    function setLeds(on, k = 0) { leds.forEach((l, i) => l.classList.toggle('on', on && i <= k)); }
    const STEP = 1 / 60;
    let clock = 0;
    function step(dt) {
      clock += dt; thudCD -= dt;
      if (state === 'play') {
        timer -= dt;
        // セルフタイマー: ランプの点滅とピッがだんだん速くなる
        const period = Math.max(0.12, 0.9 * (timer / TIMER) + 0.1);
        beepT -= dt;
        if (beepT <= 0) { beepT = period; ledOn = true; setLeds(true, timer < 3 ? 2 : timer < 6 ? 1 : 0); sBeep(timer < 3); }
        else if (ledOn && beepT < period * 0.5) { ledOn = false; setLeds(false); }
        if (timer <= 0) shutter();
      }
      if (state !== 'shot' && state !== 'result') world.step(STEP);
      while (toppleQ.length) { const { p, vel } = toppleQ.shift(); topple(p, vel); }
      clockSec.rotation.z = -Math.floor(clock) / 60 * Math.PI * 2;
      for (const p of [...people, me]) {
        p.oofCD = (p.oofCD || 0) - dt;
        if (p.rag) {
          syncRagdoll(p); p.ragT += dt;
          if (state === 'play' && p.ragT > 1.6 && p.oofCD < 0 && !(p.me && aim)) { p.h.face.open = 0.12; p.h.face.brow = -0.3; p.h.face.smile = -0.15; }
        } else if (!p.me) {
          if (p.shockT > 0) { p.shockT -= dt; if (p.shockT <= 0) { p.h.face.brow = 0.2; p.h.face.open = 0; p.h.face.smile = 0.45; } }
          if (state !== 'shot') p.h.lookAt(camera.position);
        }
        p.h.update(dt);
      }
      // 寝坊した自分は、最初は息を切らして足踏み
      if (!me.rag) {
        me.h.root.position.copy(START); me.h.root.rotation.y = Math.PI * 0.92;
        me.h.walkSpeed = state === 'ready' || state === 'play' ? 1.6 : 0;
        if (!aim) { me.h.face.open = 0.35 + 0.15 * Math.sin(clock * 9); me.h.face.brow = 0.9; me.h.face.smile = -0.3; }
        me.h.lookAt(camera.position);
        pantT -= dt; if (pantT < 0 && state === 'play') { pantT = 0.75; sPant(); }
      }
      for (const pt of petals) {
        pt.ph += dt; const s = pt.s.position;
        s.y -= pt.v * dt; s.x += Math.sin(pt.ph * 1.3) * 0.4 * dt + 0.15 * dt; s.z += Math.cos(pt.ph) * 0.2 * dt;
        pt.s.material.rotation = pt.ph * 2;
        if (s.y < 0) { s.y = rnd(4, 6); s.x = rnd(-7, 7); s.z = rnd(-6, 4); }
      }
      if (state === 'shot') { endT += dt; if (endT > 0.9) finish(); }
    }

    // ---------- 表示 ----------
    const resultStr = () => inPhoto ? t('hit')(knocked) : t('miss');
    const shareText = () => inPhoto ? t('shareHit')(knocked) : t('shareMiss');
    function renderControls() {
      controls.innerHTML = '';
      controls.classList.toggle('hide', state !== 'result');
      if (state !== 'result') return;
      const b = document.createElement('button');
      b.className = 'go'; b.textContent = t('again');
      b.addEventListener('click', start);
      controls.append(b);
      const a = document.createElement('a');
      a.className = 'post'; a.textContent = t('post');
      a.href = `https://x.com/intent/post?text=${encodeURIComponent(shareText())}&url=${encodeURIComponent(SHARE_URL)}`;
      const coarse = matchMedia('(pointer: coarse)').matches;
      if (!coarse) { a.target = '_blank'; a.rel = 'noopener'; }
      // スマホは画像ごと共有シートへ。PCは画像を保存してから投稿画面を開く
      a.addEventListener('click', e => {
        const text = shareText();
        if (coarse && navigator.share) {
          e.preventDefault();
          const file = shareFile();
          const data = file && navigator.canShare?.({ files: [file] }) ? { files: [file], text: `${text}\n${SHARE_URL}` } : { text: `${text}\n${SHARE_URL}` };
          navigator.share(data).catch(() => {});
          return;
        }
        const img = resultImage();
        if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'nebou-sotsugyo.png'; d.click(); }
      });
      controls.append(a);
    }
    function showResult() { resultEl.children[0].textContent = resultStr(); }

    // 結果画像: 撮れた卒業写真をプリント風にする
    let snap = null, shareCache = null;
    function takeSnap() {
      const src = renderer.domElement, sc = src.width / stage.clientWidth, fr = frameRect;
      snap = document.createElement('canvas');
      snap.width = 1000; snap.height = Math.round(1000 * fr.h / fr.w);
      snap.getContext('2d').drawImage(src, fr.x * sc, fr.y * sc, fr.w * sc, fr.h * sc, 0, 0, snap.width, snap.height);
      shareCache = null;
    }
    function resultImage() {
      if (!snap) return null;
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const g = c.getContext('2d');
      const bg = g.createLinearGradient(0, 0, 0, 1080); bg.addColorStop(0, '#f6c9d6'); bg.addColorStop(1, '#e898b0'); g.fillStyle = bg; g.fillRect(0, 0, 1080, 1080);
      g.fillStyle = 'rgba(255,255,255,.55)'; for (let i = 0; i < 40; i++) { g.save(); g.translate(Math.random() * 1080, Math.random() * 1080); g.rotate(Math.random() * 6); g.beginPath(); g.ellipse(0, 0, 9, 15, 0, 0, 7); g.fill(); g.restore(); }
      const pw = snap.width + 40, ph = snap.height + 170, px = (1080 - pw) / 2, py = (1080 - ph) / 2;
      g.save(); g.translate(540, 540); g.rotate(-0.02); g.translate(-540, -540);
      g.shadowColor = 'rgba(80,20,40,.35)'; g.shadowBlur = 30; g.shadowOffsetY = 10;
      g.fillStyle = '#fbfaf6'; g.fillRect(px, py, pw, ph);
      g.shadowColor = 'transparent';
      g.drawImage(snap, px + 20, py + 20);
      const font = s => `900 ${s}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans KR", "Noto Sans Thai", sans-serif`;
      const fit = (str, x, y, size, max, color, align) => { g.font = font(size); const w = g.measureText(str).width; if (w > max) g.font = font(size * max / w); g.fillStyle = color; g.textAlign = align; g.fillText(str, x, y); };
      fit(resultStr(), px + pw - 30, py + ph - 45, 84, pw * 0.55, inPhoto ? '#1f3550' : '#9a3040', 'right');
      fit(t('title'), px + 30, py + ph - 52, 40, pw * 0.38, '#6a7a8a', 'left');
      g.restore();
      return c;
    }
    function prepareShare() {
      if (!snap) return;
      const key = lang;
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'nebou-sotsugyo.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;

    function resetPerson(p) {
      unragdoll(p);
      const h = p.h;
      h.root.position.set(0, 0, 0); h.root.rotation.set(0, 0, 0);
      h.j.pelvis.position.copy(p.rig.P.pelvis);
      for (const b of BONES) h.j[b].quaternion.identity();
      h.auto = true; h.pose = 'stand'; h.walkSpeed = 0;
    }
    function start() {
      aim = null; drawDots(false);
      for (const p of people) {
        resetPerson(p);
        p.h.root.position.copy(p.home);
        p.h.face.smile = p.teacher ? 0.25 : 0.45; p.h.face.open = 0; p.h.face.brow = 0.2; p.shockT = 0;
        standBox(p);
        for (let i = 0; i < 6; i++) p.h.update(0.1);
      }
      resetPerson(me); me.h.root.position.copy(START);
      state = 'ready'; timer = TIMER; knocked = 0; inPhoto = false; setLeds(false);
      resultEl.style.display = 'none';
      renderControls(); resize();
    }
    function finish() {
      state = 'result';
      showResult();
      resultEl.style.display = 'flex';
      snap = null; needSnap = true;
      renderControls();
    }

    // ---------- ループ ----------
    let last = performance.now(), acc = 0;
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      acc += dt;
      while (acc >= STEP) { step(STEP); acc -= STEP; }
      if (needSnap) { renderer.render(scene, camera); needSnap = false; takeSnap(); prepareShare(); }
      renderer.render(scene, camera);
      requestAnimationFrame(loop);
    }

    resize();
    start();
    applyLang();
    renderer.compile(scene, camera);
    renderer.render(scene, camera);
    world.step(STEP);
    requestAnimationFrame(t0 => { last = t0; loop(t0); });
    /*TEST*/if (location.search.includes('test')) window.__t = { people, me, world, get state() { return state; }, set timer(v) { timer = v; }, camera, mePos, fling(v) { aim = { sx: 0, sy: 0, from: mePos() }; launchVel.set(v[0], v[1], v[2]); launch(); }, img: () => resultImage()?.toDataURL('image/png') };
  </script>
</body>
