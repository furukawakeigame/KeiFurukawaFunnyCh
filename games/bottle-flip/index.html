    const autoLang = () => { for (const l of navigator.languages?.length ? navigator.languages : [navigator.language || '']) { const c = l.toLowerCase().slice(0, 2); if (DICT[c]) return c; } return 'en'; };
    let lang = store.get('lang', null) || autoLang();
    const t = k => DICT[lang][k];
    const $ = id => document.getElementById(id);
    $('lang').value = lang;
    $('lang').addEventListener('change', e => { lang = e.target.value; store.set('lang', lang); applyLang(); });
    function applyLang() {

      document.title = t('title');

      $('retry').textContent = t('retry');
      if (resultShown) fillResult();

    let soundOn = store.get('sound', true), ac = null;
    const SPK = on => `<svg viewBox="0 0 24 24" fill="none" stroke="#3b2a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#3b2a1a"/>${on ? '<path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>' : '<path d="M17 9l5 6M22 9l-5 6"/>'}</svg>`;
    const drawSound = () => $('sound').innerHTML = SPK(soundOn);
    drawSound();
    $('sound').addEventListener('click', () => { soundOn = !soundOn; store.set('sound', soundOn); drawSound(); });
    function tone(freq, dur, type = 'sine', vol = 0.25, slide = 0) {
      if (!soundOn) return;

        ac = ac || new (window.AudioContext || window.webkitAudioContext)();
        const o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime;

      } catch {}
    }
    const sfx = {
      whoosh: () => tone(300, 0.18, 'triangle', 0.08, 2.5),
      tok: v => tone(180 + Math.random() * 40, 0.08, 'square', Math.min(0.18, 0.04 + v * 0.06), 0.5),

      lose: () => tone(300, 0.4, 'sawtooth', 0.08, 0.4),
    };

    // ---------- 3D ----------
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#f6ead8');
    scene.fog = new THREE.Fog('#f6ead8', 6, 14);
    const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 20);
    scene.add(new THREE.HemisphereLight('#fff8ee', '#b08860', 1.4));
    const sun = new THREE.DirectionalLight('#ffffff', 1.6);
    sun.position.set(0.8, 3, 2); sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    Object.assign(sun.shadow.camera, { left: -1.5, right: 1.5, top: 1.5, bottom: -1.5, near: 0.1, far: 8 });
    scene.add(sun, sun.target);

    // 机（木目は Canvas で描く）
    const woodTex = (() => {
      const c = document.createElement('canvas'); c.width = 512; c.height = 128;
      const g = c.getContext('2d');
      g.fillStyle = '#c8935a'; g.fillRect(0, 0, 512, 128);
      for (let i = 0; i < 40; i++) {
        g.strokeStyle = `rgba(${120 + Math.random() * 40},${70 + Math.random() * 20},30,${0.15 + Math.random() * 0.2})`;
        g.lineWidth = 1 + Math.random() * 3; g.beginPath();
        const y = Math.random() * 128; g.moveTo(0, y);
        for (let x = 0; x <= 512; x += 32) g.lineTo(x, y + Math.sin(x / 60 + i) * 4);

      }
      const tx = new THREE.CanvasTexture(c); tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.repeat.set(6, 3); tx.colorSpace = THREE.SRGBColorSpace;

    })();
    const table = new THREE.Mesh(new THREE.BoxGeometry(40, 0.1, 8), new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.7 }));
    table.position.set(10, -0.05, 2.5); table.receiveShadow = true; scene.add(table);
    const wall = new THREE.Mesh(new THREE.PlaneGeometry(60, 10), new THREE.MeshStandardMaterial({ color: '#efe0c8' }));
    wall.position.set(10, 2, -1.5); scene.add(wall);

    // 人形（棒の先を両手でつかんでぶら下がる）
    const H = 0.24, HC = 0.08; // 足の裏から手の先までの高さ・重心の高さ（足の裏から）
    // 関節の位置（足の裏の真ん中が原点、y が上）。L/R は奥行きで少しずらして描く
    const JOINTS = {
      head: [0, 0.158], neck: [0, 0.122], pelvis: [0, 0.07],
      kneeL: [-0.013, 0.036], footL: [-0.013, 0.006], kneeR: [0.013, 0.036], footR: [0.013, 0.006],
      elbowL: [-0.036, 0.19], handL: [-0.012, 0.234], elbowR: [0.036, 0.19], handR: [0.012, 0.234],
    };
    const JN = Object.keys(JOINTS);
    const BONES = [ // [から, まで, 太さ, 部位]
      ['neck', 'pelvis', 0.026, 'shirt'], ['pelvis', 'kneeL', 0.011, 'pants'], ['kneeL', 'footL', 0.01, 'pants'], ['pelvis', 'kneeR', 0.011, 'pants'], ['kneeR', 'footR', 0.01, 'pants'],
      ['neck', 'elbowL', 0.007, 'skin'], ['elbowL', 'handL', 0.007, 'skin'], ['neck', 'elbowR', 0.007, 'skin'], ['elbowR', 'handR', 0.007, 'skin'],
    ];
    const SIDE = n => n.endsWith('L') ? 0.014 : n.endsWith('R') ? -0.014 : 0;
    const MATS = {
      skin: new THREE.MeshStandardMaterial({ color: '#ffe2cc', roughness: 0.55 }), shirt: new THREE.MeshStandardMaterial({ color: '#7cc7ff', roughness: 0.6 }),
      pants: new THREE.MeshStandardMaterial({ color: '#ffd36e', roughness: 0.6 }), hair: new THREE.MeshStandardMaterial({ color: '#7a4a2a', roughness: 0.7 }),
      eye: new THREE.MeshStandardMaterial({ color: '#2b1d14', roughness: 0.3 }), cheek: new THREE.MeshStandardMaterial({ color: '#ff9aa8', roughness: 0.8 }), shoe: new THREE.MeshStandardMaterial({ color: '#ff8a7a', roughness: 0.6 }),
    };
    const capsule = new THREE.CapsuleGeometry(1, 1, 4, 10); // 太さと長さはスケールで変える
    const boneMeshes = BONES.map(([, , r, m]) => { const o = new THREE.Mesh(capsule, MATS[m]); o.castShadow = true; scene.add(o); o.userData.r = r; return o; });
    // 大きな頭に、丸い目とほっぺ
    const HEAD_R = 0.036;
    const headMesh = new THREE.Mesh(new THREE.SphereGeometry(HEAD_R, 28, 20), MATS.skin); headMesh.castShadow = true;
    const hairMesh = new THREE.Mesh(new THREE.SphereGeometry(HEAD_R * 1.06, 28, 12, 0, Math.PI * 2, 0, Math.PI * 0.45), MATS.hair); headMesh.add(hairMesh); hairMesh.rotation.x = -0.35;
    const tuft = new THREE.Mesh(new THREE.SphereGeometry(0.009, 12, 8), MATS.hair); tuft.position.set(0.004, HEAD_R * 1.05, 0); tuft.scale.set(1, 1.6, 1); headMesh.add(tuft);
    for (const sx of [-1, 1]) {
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.0055, 12, 10), MATS.eye); eye.position.set(sx * 0.012, -0.002, HEAD_R * 0.94); eye.scale.set(1, 1.3, 0.6); headMesh.add(eye);
      const shine = new THREE.Mesh(new THREE.SphereGeometry(0.0018, 8, 6), new THREE.MeshBasicMaterial({ color: '#ffffff' })); shine.position.set(0.0015, 0.002, 0.003); eye.add(shine);
      const cheek = new THREE.Mesh(new THREE.SphereGeometry(0.0065, 12, 8), MATS.cheek); cheek.position.set(sx * 0.021, -0.012, HEAD_R * 0.84); cheek.scale.set(1.2, 0.7, 0.4); headMesh.add(cheek);
    }
    scene.add(headMesh);
    const shoes = ['footL', 'footR'].map(() => { const o = new THREE.Mesh(new THREE.SphereGeometry(0.012, 14, 10), MATS.shoe); o.scale.set(1.3, 0.75, 1); o.castShadow = true; scene.add(o); return o; });
    const jointPos = {}; // いま描く関節の位置（世界座標、平面上）
    const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3();
    function drawPerson() {
      BONES.forEach(([a, b], i) => {
        const o = boneMeshes[i], r = o.userData.r, za = SIDE(a) || SIDE(b), zb = SIDE(b) || SIDE(a);
        tmpA.set(jointPos[a][0], jointPos[a][1], za); tmpB.set(jointPos[b][0], jointPos[b][1], zb);
        const len = tmpA.distanceTo(tmpB);
        o.position.copy(tmpA).add(tmpB).multiplyScalar(0.5);
        o.scale.set(r, Math.max(0.0001, len / 2), r);
        o.quaternion.setFromUnitVectors(UP, tmpB.sub(tmpA).normalize());
      });
      const [hx, hy] = jointPos.head, [nx, ny] = jointPos.neck;
      headMesh.position.set(hx, hy, 0); headMesh.rotation.z = Math.atan2(-(hx - nx), hy - ny);
      ['footL', 'footR'].forEach((n, i) => { const [kx, ky] = jointPos[n === 'footL' ? 'kneeL' : 'kneeR'], [fx, fy] = jointPos[n]; shoes[i].position.set(fx + 0.006 * Math.cos(body.a), fy, SIDE(n)); shoes[i].rotation.z = Math.atan2(-(fx - kx), fy - ky); });
    }
    // かたい人形のときの関節位置
    function rigidJoints() {
      const c = Math.cos(body.a), s = Math.sin(body.a);
      for (const n of JN) { const [x, y0] = JOINTS[n], y = y0 - HC; jointPos[n] = [body.x + x * c - y * s, body.y + x * s + y * c]; }
    }

    const UP = new THREE.Vector3(0, 1, 0);
    const rodMat = new THREE.MeshStandardMaterial({ color: '#555b66', metalness: 0.6, roughness: 0.35 });
    const rods = [0, 1, 2].map(() => { const m = new THREE.Mesh(new THREE.CylinderGeometry(0.004, 0.004, 1, 8), rodMat); m.castShadow = true; scene.add(m); return m; });
    const joints = [0.02, 0.014, 0.014, 0.014].map(r => { const m = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), new THREE.MeshStandardMaterial({ color: r > 0.016 ? '#e0602a' : '#555b66', roughness: 0.4 })); m.castShadow = true; scene.add(m); return m; });
    const tmpV = new THREE.Vector3();
    function drawChain() {
      for (let k = 0; k < 4; k++) joints[k].position.set(P[k][0], P[k][1], 0);
      for (let k = 0; k < 3; k++) {
        const [ax, ay] = P[k], [bx, by] = P[k + 1];
        rods[k].position.set((ax + bx) / 2, (ay + by) / 2, 0);
        rods[k].scale.y = Math.hypot(bx - ax, by - ay);
        rods[k].quaternion.setFromUnitVectors(UP, tmpV.set(bx - ax, by - ay, 0).normalize());
      }
    }

    // ---------- 物理（縦の平面で回る剛体） ----------
    const G = 9.8, M = 1, I = 0.0045;
    const PTS = [[-0.026, 0], [0.026, 0], [-0.026, 0.006], [0.026, 0.006], [-0.022, 0.036], [0.022, 0.036], [-0.028, 0.07], [0.028, 0.07], [-0.03, 0.12], [0.03, 0.12], [-0.036, 0.158], [0.036, 0.158], [0, 0.194], [-0.04, 0.19], [0.04, 0.19], [-0.012, 0.24], [0.012, 0.24]].map(([x, y]) => [x, y - HC]);
    const body = { x: 0, y: HC, a: 0, vx: 0, vy: 0, w: 0 };
    let gen = 0, a0 = 0, touching = false, phase = 'swing', streak = 0, best = store.get('best', 0), tFly = 0, still = 0, lastTok = 0, resultShown = false;

    function contacts() {
      const c = Math.cos(body.a), s = Math.sin(body.a), list = [];
      for (let pi = 0; pi < PTS.length; pi++) {
        const [lx, ly] = PTS[pi], base = pi < 4;
        const rx = lx * c - ly * s, ry = lx * s + ly * c, py = body.y + ry;
        if (py < 0) list.push({ rx, ry, nx: 0, ny: 1, d: -py, base });
      }
      return list;
    }
    function step(dt) {
      body.vy -= G * dt;
      body.w *= Math.exp(-0.3 * dt); // 中の水が揺れて回転がゆるむ
      body.x += body.vx * dt; body.y += body.vy * dt; body.a += body.w * dt;
      const cs = contacts();
      touching = cs.length > 0;
      if (!cs.length) return 0;
      let hit = 0;
      for (let it = 0; it < 6; it++) {
        for (const k of cs) {
          const vx = body.vx - body.w * k.ry, vy = body.vy + body.w * k.rx;
          const vn = vx * k.nx + vy * k.ny;
          if (it === 0) hit = Math.max(hit, -vn);
          const rn = k.rx * k.ny - k.ry * k.nx;
          let jn = 0;
          // 底から着いたときは水がクッションになり、あまり跳ねず回転も生みにくい
          const soft = k.base ? 0.15 : 1;
          if (vn < 0) {
            const e = vn > -0.3 || k.base ? 0 : 0.25; // 反発係数（ゆっくり触れたときは跳ねない）
            jn = -(1 + e) * vn / (1 / M + soft * rn * rn / I);
            body.vx += jn * k.nx / M; body.vy += jn * k.ny / M; body.w += soft * rn * jn / I;
          }
          const tx = -k.ny, ty = k.nx;
          const vx2 = body.vx - body.w * k.ry, vy2 = body.vy + body.w * k.rx;
          const vt = vx2 * tx + vy2 * ty, rt = k.rx * ty - k.ry * tx;
          let jt = -vt / (1 / M + soft * rt * rt / I);
          const lim = 0.6 * Math.max(jn, G * M * dt / cs.length);
          jt = Math.max(-lim, Math.min(lim, jt));
          body.vx += jt * tx / M; body.vy += jt * ty / M; body.w += soft * rt * jt / I;
        }
      }
      let dx = 0, dy = 0, dmax = 0;
      for (const k of cs) if (k.d > dmax) { dmax = k.d; dx = k.nx; dy = k.ny; }

      body.vx *= Math.exp(-(cs.some(c => c.base) ? 8 : 1.6) * dt);
      return hit;
    }
    const upright = () => Math.atan2(Math.sin(body.a), Math.cos(body.a));

    // ---------- 三重振り子（棒・棒・棒、その先にボトル） ----------
    const PIV = [0, 1.4], LEN = [0.13, 0.13, 0.13, H], INV = [0, 2, 2, 1.5, 1]; // 支点はドラッグで動かす点（物理では動かない）。ボトルの底がいちばん重い
    const P = Array.from({ length: 5 }, () => [0, 0]), Q = P.map(v => v.slice());
    let holding = false, grab = null, aim = null, lastSub = 1 / 960;
    const comOf = () => { const t = HC / H; return [P[4][0] + (P[3][0] - P[4][0]) * t, P[4][1] + (P[3][1] - P[4][1]) * t]; };
    function hang() {
      let y = PIV[1];
      for (let k = 0; k < 5; k++) { if (k) y -= LEN[k - 1]; P[k] = [PIV[0], y]; Q[k] = [PIV[0], y]; }
      bodyFromChain(); dressBottle();
    }
    // 10回に1回はピンクの服になる
    function dressBottle() { MATS.shirt.color.set(Math.random() < 0.1 ? '#ff7aa8' : '#7cc7ff'); }
    function chainStep(dt) {
      const n = phase === 'swing' ? 5 : 4; // 落としたあとはボトルを外した振り子
      if (holding && aim) {
        // 支点は指をなめらかに追う。速さに上限をつけて、振り子が暴れすぎないようにする
        const k = 1 - Math.exp(-15 * dt);
        let dx = (aim[0] - P[0][0]) * k, dy = (aim[1] - P[0][1]) * k;
        const d = Math.hypot(dx, dy), max = 4 * dt;
        if (d > max) { dx *= max / d; dy *= max / d; }
        P[0] = [P[0][0] + dx, P[0][1] + dy];
      }
      for (let k = 1; k < n; k++) {
        const vx = (P[k][0] - Q[k][0]) * 0.9997, vy = (P[k][1] - Q[k][1]) * 0.9997;
        Q[k] = P[k]; P[k] = [P[k][0] + vx, P[k][1] + vy - G * dt * dt];
      }
      for (let it = 0; it < 8; it++) {
        for (let j = 0; j < n - 1; j++) {
          const a = P[j], b = P[j + 1], dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy) || 1e-6;
          const wa = INV[j], wb = INV[j + 1], c = (d - LEN[j]) / d / (wa + wb);
          a[0] += dx * c * wa; a[1] += dy * c * wa; b[0] -= dx * c * wb; b[1] -= dy * c * wb;
        }
        for (let k = 1; k < n; k++) if (P[k][1] < 0) { P[k][1] = 0; Q[k][0] = P[k][0] * 0.5 + Q[k][0] * 0.5; }
      }
      if (dt > 0) lastSub = dt;
    }
    function bodyFromChain() {
      const [cx, cy] = P[3], [bx, by] = P[4], ux = (cx - bx) / H, uy = (cy - by) / H;
      const v2x = (P[3][0] - Q[3][0]) / lastSub, v2y = (P[3][1] - Q[3][1]) / lastSub;
      const v3x = (P[4][0] - Q[4][0]) / lastSub, v3y = (P[4][1] - Q[4][1]) / lastSub;
      const t = HC / H;
      body.x = bx + (cx - bx) * t; body.y = by + (cy - by) * t; body.a = Math.atan2(-ux, uy);
      body.vx = v3x + (v2x - v3x) * t; body.vy = v3y + (v2y - v3y) * t;
      body.w = ((cx - bx) * (v2y - v3y) - (cy - by) * (v2x - v3x)) / (H * H);
    }
    function reset() {
      gen++; streak = 0; phase = 'swing'; holding = false; rag = null; hang();
      $('streak').innerHTML = ''; resultShown = false; $('result').style.display = 'none';
      showHint('drag');
    }
    function release() {
      bodyFromChain();
      phase = 'fly'; tFly = 0; still = 0; touching = false; a0 = body.a; sfx.whoosh(); hideHint();
    }
    // ---------- ラグドール：倒れたら関節ごとにぐにゃっとなる ----------
    let rag = null;
    const RAG_STICKS = [['head', 'neck'], ['neck', 'pelvis'], ['head', 'pelvis'], ['pelvis', 'kneeL'], ['kneeL', 'footL'], ['pelvis', 'kneeR'], ['kneeR', 'footR'], ['neck', 'elbowL'], ['elbowL', 'handL'], ['neck', 'elbowR'], ['elbowR', 'handR']];
    const RAG_R = { head: HEAD_R };
    function startRagdoll() {
      rigidJoints();
      const p = {}, q = {}, h = 1 / 960;
      for (const n of JN) {
        const [x, y] = jointPos[n], rx = x - body.x, ry = y - body.y;
        p[n] = [x, y]; q[n] = [x - (body.vx - body.w * ry) * h, y - (body.vy + body.w * rx) * h]; // いまの動きをそのまま引き継ぐ
      }
      const len = RAG_STICKS.map(([a, b]) => Math.hypot(p[a][0] - p[b][0], p[a][1] - p[b][1]));
      rag = { p, q, len };
    }
    function ragStep(dt) {
      const { p, q, len } = rag;
      for (const n of JN) {
        const vx = (p[n][0] - q[n][0]) * 0.999, vy = (p[n][1] - q[n][1]) * 0.999;
        q[n] = p[n]; p[n] = [p[n][0] + vx, p[n][1] + vy - G * dt * dt];
      }
      for (let it = 0; it < 6; it++) {
        RAG_STICKS.forEach(([a, b], i) => {
          const A = p[a], B = p[b], dx = B[0] - A[0], dy = B[1] - A[1], d = Math.hypot(dx, dy) || 1e-6, c = (d - len[i]) / d / 2;
          A[0] += dx * c; A[1] += dy * c; B[0] -= dx * c; B[1] -= dy * c;
        });
        for (const n of JN) {
          const r = RAG_R[n] || 0.006;
          if (p[n][1] < r) { p[n][1] = r; q[n][0] = p[n][0] * 0.3 + q[n][0] * 0.7; } // 床では摩擦で止まる
        }
      }
      for (const n of JN) jointPos[n] = p[n].slice();
      body.x = p.pelvis[0]; body.y = p.pelvis[1];
    }
    function judge(dt) {
      tFly += dt;
      const slow = Math.abs(body.vx) + Math.abs(body.vy) < 0.02 && Math.abs(body.w) < 0.1;
      still = slow ? still + dt : 0;
      if (body.y < -0.5) return fail();
      // 机に触れたまま大きく傾いたら、倒れたとみなしてラグドールにする
      if (touching && Math.abs(upright()) > 0.9) { startRagdoll(); return fail(); }
      // 止まってから判定する（止まりきらなくても6秒で判定）
      // だいたい1回転（250度くらい）以上してから立たないと成功にしない
      if ((tFly > 0.5 && still > 0.5) || tFly > 6) return Math.abs(upright()) < 0.1 && Math.abs(body.a - a0) > Math.PI * 1.4 ? succeed() : fail();
    }
    const BOTTLE_SVG = '<path d="M4.5 11.5L1.8 2.5M9.5 11.5l2.7-9" stroke="#7cc7ff" stroke-width="2.2" stroke-linecap="round"/><path d="M5.4 21v6M8.6 21v6" stroke="#ffd36e" stroke-width="2.6" stroke-linecap="round"/><ellipse cx="5.2" cy="28.2" rx="1.9" ry="1.2" fill="#ff8a7a"/><ellipse cx="8.8" cy="28.2" rx="1.9" ry="1.2" fill="#ff8a7a"/><rect x="3.4" y="13" width="7.2" height="9" rx="3.4" fill="#7cc7ff"/><circle cx="7" cy="8.6" r="5.2" fill="#ffe2cc"/><path d="M1.9 8a5.2 5.2 0 0 1 10.2 0q-5-2.6-10.2 0z" fill="#7a4a2a"/><circle cx="5.2" cy="9.3" r=".9" fill="#2b1d14"/><circle cx="8.8" cy="9.3" r=".9" fill="#2b1d14"/><ellipse cx="3.9" cy="11" rx="1" ry=".6" fill="#ff9aa8"/><ellipse cx="10.1" cy="11" rx="1" ry=".6" fill="#ff9aa8"/>';
    function succeed() {
      phase = 'won'; streak++; sfx.win();
      const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', '0 0 14 30'); s.innerHTML = BOTTLE_SVG; $('streak').appendChild(s);
      body.vy = 0.8; // 小さく跳ねて喜ぶ
      const g = gen; setTimeout(() => { if (g !== gen) return; phase = 'swing'; rag = null; hang(); }, 650);
    }
    function fail() {
      phase = 'lost'; sfx.lose();
      const isNew = streak > best; if (isNew) { best = streak; store.set('best', best); }
      lastNew = isNew;
      const g = gen; setTimeout(() => { if (g !== gen) return; resultShown = true; fillResult(); $('result').style.display = 'flex'; }, 1500);
    }
    let lastNew = false;
    function fillResult() {
      $('result').querySelector('.big svg').innerHTML = BOTTLE_SVG;
      $('rCount').textContent = t('unit')(streak);
      $('rBest').textContent = lastNew && streak > 0 ? t('newBest') : t('best')(best);
      $('rBest').classList.toggle('new', lastNew && streak > 0);
      const a = $('post');
      a.textContent = t('post');
      a.href = `https://x.com/intent/post?text=${encodeURIComponent(t('share')(streak))}&url=${encodeURIComponent(SHARE_URL)}`;
      if (matchMedia('(pointer: coarse)').matches) { a.removeAttribute('target'); a.removeAttribute('rel'); }
      else { a.target = '_blank'; a.rel = 'noopener'; }
    }
    $('retry').addEventListener('click', reset);

    // ---------- 操作：ボトルをつまんで振り、もう一度タップで落とす ----------
    const ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0), hit3 = new THREE.Vector3();
    function toWorld(e) {
      ray.setFromCamera(new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1), camera);
      return ray.ray.intersectPlane(plane, hit3) ? [hit3.x, hit3.y] : null;
    }
    // 押さえている間は支点が指を追い、離すとボトルが外れる
    addEventListener('pointerdown', e => {
      if (e.target.closest('header, #result') || phase !== 'swing') return;
      const w = toWorld(e); if (!w) return;
      holding = true; grab = [P[0][0] - w[0], P[0][1] - w[1]]; aim = P[0].slice(); hideHint();
    });
    addEventListener('pointermove', e => { if (!holding) return; const w = toWorld(e); if (w) aim = [w[0] + grab[0], Math.max(0.7, w[1] + grab[1])]; });
    const letGo = () => { if (!holding) return; holding = false; if (phase === 'swing') release(); };
    addEventListener('pointerup', letGo);
    addEventListener('pointercancel', letGo);

    // ---------- ヒント ----------
    const hintDone = store.get('hint', {});
    let hintKind = null;
    function showHint(kind) { if (hintDone[kind]) return; hintKind = kind; $('hint').setAttribute('class', kind); $('hint').style.display = 'block'; }
    function hideHint() { if (hintKind) { hintDone[hintKind] = true; store.set('hint', hintDone); } hintKind = null; $('hint').style.display = 'none'; }
    function placeHint() {
      if (!hintKind) return;
      const v = new THREE.Vector3(...(P[0]), 0).project(camera);
      $('hint').style.left = ((v.x + 1) / 2 * innerWidth - 27) + 'px';
      $('hint').style.top = ((1 - v.y) / 2 * innerHeight - 27) + 'px';
    }

    // ---------- カメラと描画 ----------
    function resize() {
      const w = innerWidth, h = innerHeight;
      renderer.setSize(w, h, false); camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    addEventListener('resize', resize); resize();

    const cam = { x: 0, y: 1.25 };
    let prev = performance.now();
    function frame(now) {
      const dt = Math.max(0, Math.min(0.05, (now - prev) / 1000)); prev = now;
      { const n = 16, h = dt / n; for (let i = 0; i < n; i++) chainStep(h); }
      if (phase === 'swing') bodyFromChain();
      if (phase === 'fly' || phase === 'lost' || phase === 'won') {
        const n = 16, h = dt / n;
        for (let i = 0; i < n; i++) {
          if (rag) { ragStep(h); continue; }
          const hit = step(h); if (hit > 0.3 && now - lastTok > 70) { sfx.tok(hit); lastTok = now; }
        }
        if (phase === 'fly') judge(dt);
      }
      // カメラは人形についていく（机が見えるよう、低くなりすぎない）
      const tv = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
      const dist = Math.max(1.1 / 2 / tv / camera.aspect, 1.5 / 2 / tv);
      // 落としたら、指数補間でなめらかに遅れてついていく
      // 落とすまでは支点のあたりに戻ってとどまり、人形は追わない
      {
        const fixed = phase === 'swing', k = 1 - Math.exp(-3 * dt), tx = fixed ? PIV[0] : body.x, ty = fixed ? 1.25 : body.y;
        cam.x += (tx - cam.x) * k; cam.y += (Math.max(0.42, ty) - cam.y) * k;
        if (!fixed) {
          // 人形が画面の外に出ないよう、端に近づいたらカメラを押し出す
          const hh = dist * tv - 0.18, hw = dist * tv * camera.aspect - 0.15;
          cam.x = Math.min(body.x + hw, Math.max(body.x - hw, cam.x));
          cam.y = Math.min(body.y + hh, Math.max(body.y - hh, cam.y));
        }
      }
      camera.position.set(cam.x, cam.y + 0.15, dist);
      camera.lookAt(cam.x, cam.y, 0);
      if (!rag) rigidJoints();
      drawPerson();
      drawChain();
      placeHint();
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    applyLang(); reset();
    requestAnimationFrame(frame);
  </script>
</body>
