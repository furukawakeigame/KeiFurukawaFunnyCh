    const $ = id => document.getElementById(id);

    $('lang').addEventListener('change', e => { lang = e.target.value; store.set('lang', lang); applyLang(); });
    function applyLang() {

      document.title = t('title');
      $('back').textContent = t('back');
      $('retry').textContent = t('retry');
      if (resultShown) fillResult();

    // ---------- 音 ----------
    let soundOn = store.get('sound', true), ac = null;
    const SPK = on => `<svg viewBox="0 0 24 24" fill="none" stroke="#3b2a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#3b2a1a"/>${on ? '<path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>' : '<path d="M17 9l5 6M22 9l-5 6"/>'}</svg>`;
    const drawSound = () => $('sound').innerHTML = SPK(soundOn);
    drawSound();
    $('sound').addEventListener('click', () => { soundOn = !soundOn; store.set('sound', soundOn); drawSound(); });
    function tone(freq, dur, type = 'sine', vol = 0.25, slide = 0) {
      if (!soundOn) return;

        ac = ac || new (window.AudioContext || window.webkitAudioContext)();
        const o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime;
        o.type = type; o.frequency.setValueAtTime(freq, n);
        if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, n + dur);
        g.gain.setValueAtTime(vol, n); g.gain.exponentialRampToValueAtTime(0.001, n + dur);
        o.connect(g).connect(ac.destination); o.start(n); o.stop(n + dur);
      } catch {}
    }
    const sfx = {
      whoosh: () => tone(300, 0.18, 'triangle', 0.08, 2.5),
      tok: v => tone(180 + Math.random() * 40, 0.08, 'square', Math.min(0.18, 0.04 + v * 0.06), 0.5),
      pop: () => tone(900, 0.07, 'square', 0.15, 0.4),
      // シュワーッという音：ノイズを高い音域だけ通して、量に合わせた長さで鳴らす
      fizz: (dur, vol) => {
        if (!soundOn) return;
        try {
          ac = ac || new (window.AudioContext || window.webkitAudioContext)();
          const n = ac.currentTime, buf = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate), d = buf.getChannelData(0);
          for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
          const src = ac.createBufferSource(), bp = ac.createBiquadFilter(), g = ac.createGain();
          src.buffer = buf; bp.type = 'highpass'; bp.frequency.value = 2500;
          g.gain.setValueAtTime(vol, n); g.gain.exponentialRampToValueAtTime(0.001, n + dur);

      },
    };

    // ---------- 3D ----------
    const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true }); // 近くのボトルと遠くの地平線を両方きれいに描く
    renderer.localClippingEnabled = true; // コーラの液面を切り口で作る
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    $('stage').appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#8fd3ff');
    const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 1e10);
    scene.add(new THREE.HemisphereLight('#e6f4ff', '#5a7a3a', 1.2));
    const sun = new THREE.DirectionalLight('#ffffff', 1.6);
    sun.position.set(0.8, 3, 2); sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    Object.assign(sun.shadow.camera, { left: -1.5, right: 1.5, top: 1.5, bottom: -1.5, near: 0.1, far: 8 });
    scene.add(sun, sun.target);

    // ---------- 景色：草原と空。上に行くほど空が暗くなり、雲を抜けて宇宙へ ----------
    const rnd = (a, b) => a + Math.random() * (b - a);
    const mat = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.9, ...o });
    const grassTex = (() => {
      const c = document.createElement('canvas'); c.width = c.height = 256;
      const g = c.getContext('2d'); g.fillStyle = '#6dbb4f'; g.fillRect(0, 0, 256, 256);
      for (let i = 0; i < 1800; i++) { g.fillStyle = `rgba(${70 + Math.random() * 40},${150 + Math.random() * 40},${50 + Math.random() * 20},.35)`; g.fillRect(Math.random() * 256, Math.random() * 256, 2, 4); }
      const tx = new THREE.CanvasTexture(c); tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.repeat.set(3000, 3000); tx.colorSpace = THREE.SRGBColorSpace; tx.anisotropy = renderer.capabilities.getMaxAnisotropy(); // 斜めから見ても模様がちらつかない
      return tx;
    })();
    // 地面：近くは草の円盤、その外は丸い地球（高く上がると地平線が丸く見える）
    const EARTH_R = 6371000;
    const earth = new THREE.Mesh(new THREE.SphereGeometry(EARTH_R, 160, 320, 0, Math.PI * 2, 0, Math.PI / 8), mat('#4f9a46', { roughness: 1 }));
    earth.position.y = -EARTH_R - 8; scene.add(earth); // 草の円盤と重ならないよう少し下げる（重なると遠くでチラつく）
    // とても高く上がったときに見える、地球ぜんたい（近くは上のくわしい方が見える）
    const globe = new THREE.Mesh(new THREE.SphereGeometry(EARTH_R - 3000, 96, 64), mat('#3f7fc0', { roughness: 1 })); globe.position.y = -EARTH_R - 8; scene.add(globe);
    const ground = new THREE.Mesh(new THREE.CircleGeometry(15000, 96), new THREE.MeshStandardMaterial({ map: grassTex, roughness: 0.95 }));
    ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
    // 空の色：上に行くほど濃い青から宇宙の黒へ
    const SKY = [[0, '#8fd3ff'], [2000, '#5fb0f0'], [10000, '#2c6cc4'], [30000, '#122a66'], [60000, '#050816'], [100000, '#000000']].map(([h, c]) => [h, new THREE.Color(c)]);
    function skyAt(alt) {
      for (let i = 1; i < SKY.length; i++) if (alt < SKY[i][0]) return SKY[i - 1][1].clone().lerp(SKY[i][1], (alt - SKY[i - 1][0]) / (SKY[i][0] - SKY[i - 1][0]));
      return SKY[SKY.length - 1][1].clone();
    }
    // 雲：白い球をいくつか重ねた、もくもくした立体の雲（あとでまとめて1つの描画にする）
    const puffs = [], thinPuffs = [];
    function cloud(x, y, z, w, flat = false) {
      const n = flat ? 4 : 5 + Math.floor(Math.random() * 4), list = flat ? thinPuffs : puffs;
      for (let i = 0; i < n; i++) {
        const t = n > 1 ? i / (n - 1) - 0.5 : 0, r = w * (flat ? rnd(0.18, 0.28) : rnd(0.16, 0.3)) * (1 - Math.abs(t) * 0.8);
        list.push([x + t * w * 0.9 + rnd(-0.05, 0.05) * w, y + (flat ? 0 : Math.max(0, r * 0.4 - Math.abs(t) * w * 0.1)) + rnd(0, 0.06) * w, z + rnd(-0.15, 0.15) * w, r, flat ? 0.12 : rnd(0.55, 0.75)]);
      }
    }
    function buildClouds() {
      const make = (list, m) => {
        const im = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 14, 10), m, list.length), mx = new THREE.Matrix4();
        list.forEach(([x, y, z, r, fy], i) => im.setMatrixAt(i, mx.compose(new THREE.Vector3(x, y, z), new THREE.Quaternion(), new THREE.Vector3(r, r * fy, r))));
        im.frustumCulled = false; scene.add(im);
      };
      make(puffs, new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 1, emissive: '#c8d8ea', emissiveIntensity: 0.35 }));
      make(thinPuffs, new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 1, emissive: '#dde8f5', emissiveIntensity: 0.5, transparent: true, opacity: 0.55, depthWrite: false }));
    }
    // 地上から見える遠くの雲
    for (let i = 0; i < 14; i++) { const w = rnd(40, 80); cloud(rnd(-400, 400), rnd(90, 160), rnd(-700, -400), w); }
    // 1000m〜10km：雲の層
    // 近くを通る雲は小さめにして、カメラが中に入らない距離に置く（入ると画面が一瞬まっ白になってチカチカする）
    for (let i = 0; i < 180; i++) { const near = i < 70, y = rnd(1200, 3000), w = near ? rnd(15, 40) : rnd(30, 160); cloud(near ? rnd(-40, 40) : rnd(-600, 600), y, near ? rnd(-45, -18) : rnd(-800, -60), w); }
    for (let i = 0; i < 70; i++) { const w = rnd(400, 1600); cloud(rnd(-3000, 3000), rnd(8000, 11000), rnd(-4000, -150), w, true); }
    buildClouds();
    // 星：宇宙に近づくと見えてくる（カメラについてくる）
    const starGeo = new THREE.BufferGeometry(), starPos = new Float32Array(900 * 3);
    for (let i = 0; i < 900; i++) { const a = Math.random() * 6.28, b = Math.acos(Math.random() * 2 - 1); starPos.set([Math.sin(b) * Math.cos(a) * 15, Math.cos(b) * 15, Math.sin(b) * Math.sin(a) * 15], i * 3); }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: '#ffffff', size: 0.06, transparent: true, opacity: 0, depthWrite: false }));
    stars.frustumCulled = false; scene.add(stars);
    // スピード線：速さに合わせて、ボトルのまわりを風の線が後ろへ流れる
    const LINE_N = 70, LINE_BOX = [5, 9, 3], lineSeed = Array.from({ length: LINE_N }, () => [Math.random(), Math.random(), Math.random()]);
    const lineGeo = new THREE.BufferGeometry(); lineGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(LINE_N * 6), 3));
    const speedLines = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0.55, depthWrite: false }));
    speedLines.frustumCulled = false; scene.add(speedLines);
    const wrapAt = (s, c, size) => c - size / 2 + ((s * size - c) % size + size) % size; // 世界に固定した並びを、まわりでくり返す
    let lineScroll = 0;
    function drawSpeedLines(cx, cy, speed, dt) {
      // 線の流れる速さには上限をつける（速すぎると1コマごとに飛び飛びになってチカチカする）
      lineScroll += Math.min(speed, 60) * dt;
      const a = lineGeo.attributes.position.array, len = Math.min(3, speed * 0.004);
      speedLines.visible = len > 0.05;
      lineSeed.forEach(([sx, sy, sz], i) => {
        const x = wrapAt(sx, cx, LINE_BOX[0]), y = cy - wrapAt(sy, lineScroll, LINE_BOX[1]) + lineScroll, z = (sz - 0.5) * LINE_BOX[2];
        a.set([x, y, z, x, y + len, z], i * 6);
      });
      lineGeo.attributes.position.needsUpdate = true;
    }

    // ボトル
    const H = 0.24, R = 0.035, HC = 0.08; // 高さ・半径・重心の高さ（真ん中より下）
    const bottle = new THREE.Group();
    const profile = [[0, 0], [R - 0.006, 0], [R, 0.006], [R, 0.15], [R * 0.95, 0.165], [0.02, 0.2], [0.014, 0.212], [0.014, 0.218]].map(([x, y]) => new THREE.Vector2(x, y));
    const shell = new THREE.Mesh(new THREE.LatheGeometry(profile, 32), new THREE.MeshPhysicalMaterial({ color: '#dff4ff', transparent: true, opacity: 0.35, roughness: 0.05, side: THREE.DoubleSide, depthWrite: false }));
    shell.castShadow = true;
    // コーラ：胴の中いっぱいの円柱を、「感じている重力」の向きに垂直な面で切って液面にする
    const LIQ_Y0 = 0.004, LIQ_Y1 = 0.17, liquidPlane = new THREE.Plane();
    const water = new THREE.Mesh(new THREE.CylinderGeometry(R - 0.003, R - 0.004, LIQ_Y1 - LIQ_Y0, 32), new THREE.MeshStandardMaterial({ color: '#2a1206', transparent: true, opacity: 0.95, roughness: 0.2, side: THREE.DoubleSide, clippingPlanes: [liquidPlane] }));
    water.position.y = (LIQ_Y0 + LIQ_Y1) / 2;
    let liquidFrac = 0.55; // 胴に対して入っている量
    const label = new THREE.Mesh(new THREE.CylinderGeometry(R + 0.001, R + 0.001, 0.05, 32, 1, true), new THREE.MeshStandardMaterial({ color: '#d9261c', side: THREE.DoubleSide }));
    label.position.y = 0.105;
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 0.022, 24), new THREE.MeshStandardMaterial({ color: '#d9261c', roughness: 0.4 }));
    cap.position.y = 0.229; cap.castShadow = true;

    });
    addEventListener('pointermove', e => { if (!holding) return; const w = toWorld(e); if (w) aim = [w[0] + grab[0], Math.max(0.1, w[1] + grab[1])]; });
    const letGo = () => { if (!holding) return; holding = false; startShake(); };
    addEventListener('pointerup', letGo);
    addEventListener('pointercancel', letGo);

    // ---------- ヒント ----------
    const hintDone = store.get('hint', {});
    let hintKind = null;
    function showHint(kind) { if (hintDone[kind]) return; hintKind = kind; $('hint').setAttribute('class', kind); $('hint').style.display = 'block'; }
    function hideHint() { if (hintKind) { hintDone[hintKind] = true; store.set('hint', hintDone); } hintKind = null; $('hint').style.display = 'none'; }
    function placeHint() {
      if (!hintKind) return;
      const v = new THREE.Vector3(...comOf(), 0).project(camera);
      $('hint').style.left = ((v.x + 1) / 2 * innerWidth - 27) + 'px';
      $('hint').style.top = ((1 - v.y) / 2 * innerHeight - 27) + 'px';
    }

    // ---------- カメラと描画 ----------
    function resize() {
      const w = innerWidth, h = innerHeight;
      renderer.setSize(w, h, false); camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    addEventListener('resize', resize); resize();

    const capMesh = cap.clone(); capMesh.position.set(0, 0, 0); scene.add(capMesh);
    const STEP = 1 / 960;
    let prev = performance.now(), simAcc = 0, jetTick = 0;
    function frame(now) {
      const dt = Math.max(0, Math.min(0.05, (now - prev) / 1000)); prev = now;
      // 物理は決まった刻み（1/960秒）で進める。画面の大きさやフレームレートで動きが変わらない
      simAcc += dt;
      while (simAcc >= STEP) {
        simAcc -= STEP;
        chainStep(STEP); keepEnergy(STEP);
        if (phase === 'shake') measure(STEP);
        if (phase === 'fly') flyStep(STEP);
        else if (phase === 'fall' || phase === 'done') { body.vy -= G * STEP; body.y = Math.max(0, body.y + body.vy * STEP); body.a += 0.8 * STEP; } // 噴射が止まったら落ちる
        if ((jetTick += STEP) >= 1 / 120) { // 噴射は 1/120 秒ごとに進める（フレームレートに関係なく同じ見た目）
          jetTick -= 1 / 120;
          const u = phase === 'fly' ? flyT / flyDur : 1;
          stepJet(1 / 120, phase === 'fly' ? Math.min(1, 0.4 + 0.6 * Math.min(1, fizz / FIZZ_FULL)) * (1 - 0.8 * u) : 0);
        }
        if (phase === 'fly' || phase === 'fall' || phase === 'done') stepFoam(STEP);
      }
      if (phase === 'ready' || phase === 'shake') bodyFromChain();
      drawTimer(); drawGauge(now);
      // 振っている間はカメラ固定。飛び立ったら、ボトルの斜め上から見下ろして追う（地面や景色が下へ遠ざかって見える）
      const tv = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
      const dist = Math.max(1.85 / 2 / tv / camera.aspect, 2.5 / 2 / tv);
      const fixedPos = new THREE.Vector3(0, 1.3, dist), fixedLook = new THREE.Vector3(0, 1.15, 0);
      if (phase === 'ready' || phase === 'shake') { camera.position.copy(fixedPos); camera.lookAt(fixedLook); }
      else {
        const k = THREE.MathUtils.smoothstep(launchT, 0, 0.9); // 発射からなめらかに切り替える
        // 低い所では見下ろして地面が遠ざかるのを見せ、高くなるほど水平に向けて地平線と宇宙を見せる
        const tilt = 1 - THREE.MathUtils.smoothstep(body.y, 3000, 40000);
        const chasePos = new THREE.Vector3(body.x + 0.6, body.y + 0.2 + 0.7 * tilt, 2.4), chaseLook = new THREE.Vector3(body.x, body.y - 0.5 * tilt + 0.3 * (1 - tilt), 0);
        camera.position.lerpVectors(fixedPos.setY(Math.max(1.3, body.y + 0.15)), chasePos, k);
        camera.lookAt(fixedLook.setY(Math.max(1.15, body.y)).lerp(chaseLook, k));
      }
      const alt = camera.position.y;
      scene.background.copy(skyAt(alt)); document.body.style.background = '#' + scene.background.getHexString();
      stars.material.opacity = THREE.MathUtils.smoothstep(alt, 15000, 60000); stars.position.copy(camera.position);
      drawSpeedLines(body.x, body.y, phase === 'fly' ? speed : 0, dt);
      bottle.position.set(body.x, body.y, 0); bottle.rotation.z = body.a;
      drawBubbles(phase === 'shake' || phase === 'ready' ? fizz / FIZZ_FULL * 1.6 : liquidFrac / 0.55, now);
      updateLiquid(dt);
      foamGeo.attributes.position.needsUpdate = true; foamGeo.setDrawRange(0, foamCount);
      jetGeo.attributes.position.needsUpdate = jetGeo.attributes.color.needsUpdate = true;
      if (capFly) { capMesh.visible = true; capMesh.position.set(capFly.p[0], capFly.p[1], 0); capMesh.rotation.z = capFly.r; } else capMesh.visible = false;
      drawChain();
      placeHint();
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    applyLang(); reset();
    // 最初の1回だけ重くならないよう、使う質感を先に準備し、音は最初に触れたときに用意しておく
    renderer.compile(scene, camera);
    addEventListener('pointerdown', () => { if (soundOn && !ac) try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }, { once: true, capture: true });
    requestAnimationFrame(frame);
  </script>
</body>
</html>
