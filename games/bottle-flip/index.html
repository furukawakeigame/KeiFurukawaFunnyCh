    const table = new THREE.Mesh(new THREE.BoxGeometry(40, 0.1, 8), new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.7 }));
    table.position.set(10, -0.05, 2.5); table.receiveShadow = true; scene.add(table);
    const wall = new THREE.Mesh(new THREE.PlaneGeometry(60, 10), new THREE.MeshStandardMaterial({ color: '#2a2833' }));
    wall.position.set(10, 2, -1.5); scene.add(wall);

    // ボトル
    const H = 0.24, R = 0.035, HC = 0.08; // 高さ・半径・重心の高さ（真ん中より下）
    const bottle = new THREE.Group();
    const profile = [[0, 0], [R - 0.006, 0], [R, 0.006], [R, 0.15], [R * 0.95, 0.165], [0.02, 0.2], [0.014, 0.212], [0.014, 0.218]].map(([x, y]) => new THREE.Vector2(x, y));
    const shell = new THREE.Mesh(new THREE.LatheGeometry(profile, 32), new THREE.MeshPhysicalMaterial({ color: '#dff4ff', transparent: true, opacity: 0.35, roughness: 0.05, side: THREE.DoubleSide, depthWrite: false }));
    shell.castShadow = true;
    const water = new THREE.Mesh(new THREE.CylinderGeometry(R - 0.003, R - 0.004, 0.095, 32), new THREE.MeshStandardMaterial({ color: '#2a1206', transparent: true, opacity: 0.95, roughness: 0.2 }));
    water.position.y = 0.051;
    const label = new THREE.Mesh(new THREE.CylinderGeometry(R + 0.001, R + 0.001, 0.05, 32, 1, true), new THREE.MeshStandardMaterial({ color: '#d9261c', side: THREE.DoubleSide }));
    label.position.y = 0.105;
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 0.022, 24), new THREE.MeshStandardMaterial({ color: '#d9261c', roughness: 0.4 }));
    cap.position.y = 0.229; cap.castShadow = true;
    const inner = new THREE.Group(); inner.add(water, label, cap, shell);
    inner.position.y = -HC; bottle.add(inner); scene.add(bottle);
    // 中の泡：振るほど増える（見た目だけ）
    const BUBBLES = 70, bubbleMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(0.0035, 6, 4), new THREE.MeshBasicMaterial({ color: '#e8d2b4' }), BUBBLES);
    const bubbleSeed = Array.from({ length: BUBBLES }, () => [Math.random() * 6.28, Math.random() * (R - 0.01), Math.random() * 0.09 + 0.005, 0.5 + Math.random()]);
    inner.add(bubbleMesh);
    const tmpM = new THREE.Matrix4();
    function drawBubbles(frac, now) {
      const n = Math.round(BUBBLES * Math.min(1, frac));
      bubbleMesh.count = n;
      for (let i = 0; i < n; i++) {
        const [a, r, y, sp] = bubbleSeed[i], yy = 0.004 + ((y + now * 0.00004 * sp) % 0.092);

      bubbleMesh.instanceMatrix.needsUpdate = true;
    }
    const rodMat = new THREE.MeshStandardMaterial({ color: '#b8bcc8', metalness: 0.6, roughness: 0.35 });

    const joints = [['#d8dbe4', 0.018], ['#e0602a', 0.016], ['#e9b13b', 0.016], ['#5bbf6a', 0.016]].map(([c, r]) => { const m = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), new THREE.MeshStandardMaterial({ color: c, roughness: 0.4 })); m.castShadow = true; scene.add(m); return m; }); // 関節は軌跡と同じ色
    const UP = new THREE.Vector3(0, 1, 0), tmpV = new THREE.Vector3();
    // 軌跡：関節とボトルの通った道を、色ちがいの線で残す（三重振り子のカオスが見える）
    const TRAIL_N = 60 * 120, TRAIL_W = 0.005, TRAIL_COLORS = ['#e0602a', '#e9b13b', '#5bbf6a', '#2a9be0'];
    // 線は WebGL では太くできないので、細い帯（2点ずつの三角形）で描く
    const trailIndex = (() => { const a = new Uint32Array((TRAIL_N - 1) * 6); for (let i = 0; i < TRAIL_N - 1; i++) { const v = i * 2; a.set([v, v + 1, v + 2, v + 1, v + 3, v + 2], i * 6); } return new THREE.BufferAttribute(a, 1); })();
    const trails = TRAIL_COLORS.map(c => {
      const geo = new THREE.BufferGeometry(), pos = new THREE.BufferAttribute(new Float32Array(TRAIL_N * 2 * 3), 3);
      pos.setUsage(THREE.DynamicDrawUsage); geo.setAttribute('position', pos); geo.setIndex(trailIndex); geo.setDrawRange(0, 0);
      const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: 0.2, side: THREE.DoubleSide, depthWrite: false }));

    });
    let recording = false; // 指を離して動き始めたときから記録する
    function clearTrails() { for (const t of trails) { t.pts.length = 0; t.mesh.geometry.setDrawRange(0, 0); t.mesh.material.opacity = 0.2; } }
    function writeVert(t, k) {
      const p = t.pts, a = p[Math.max(0, k - 1)], b = p[Math.min(p.length - 1, k + 1)];
      let dx = b[0] - a[0], dy = b[1] - a[1]; const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
      const nx = -dy * TRAIL_W / 2, ny = dx * TRAIL_W / 2, arr = t.pos.array, o = k * 6;
      arr[o] = p[k][0] + nx; arr[o + 1] = p[k][1] + ny; arr[o + 2] = 0.002;
      arr[o + 3] = p[k][0] - nx; arr[o + 4] = p[k][1] - ny; arr[o + 5] = 0.002;
    }
    function updateTrails() {
      const src = [P[1], P[2], P[3], comOf()];
      trails.forEach((t, i) => {
        if (phase === 'shake' && recording) {
          t.pts.push([src[i][0], src[i][1]]);

          for (let k = Math.max(0, from); k < t.pts.length; k++) writeVert(t, k);
          t.pos.addUpdateRange(Math.max(0, from) * 6, (t.pts.length - Math.max(0, from)) * 6); t.pos.needsUpdate = true;
          t.mesh.geometry.setDrawRange(0, Math.max(0, t.pts.length - 1) * 6);

          t.mesh.material.opacity = Math.max(0, t.mesh.material.opacity - 0.004);
          if (!t.mesh.material.opacity) clearTrails();
        }
      });
    }
    function drawChain() {
      for (let k = 0; k < 4; k++) joints[k].position.set(P[k][0], P[k][1], 0);
      for (let k = 0; k < 3; k++) {
        const [ax, ay] = P[k], [bx, by] = P[k + 1];
        rods[k].position.set((ax + bx) / 2, (ay + by) / 2, 0);
        rods[k].scale.y = Math.hypot(bx - ax, by - ay);

    const G = 9.8, body = { x: 0, y: 0, a: 0, vx: 0, vy: 0, w: 0 };
    const SHAKE_TIME = 5; // 振り回す時間（秒）
    let gen = 0, phase = 'ready', best = store.get('bestML', 0), tShake = 0, fizz = 0, score = 0, lastNew = false, resultShown = false, prevV = null;

    // ---------- 三重振り子（棒・棒・棒、その先にボトル） ----------
    const PIV = [0, 1.4], LEN = [0.2, 0.2, 0.2, H], INV = [0, 1, 1, 1, 1]; // 支点は動かない。重さはどの点も同じ
    const P = Array.from({ length: 5 }, () => [0, 0]), Q = P.map(v => v.slice());
    let holding = false, grab = null, aim = null, lastSub = 1 / 960;
    const comOf = () => { const t = HC / H; return [P[4][0] + (P[3][0] - P[4][0]) * t, P[4][1] + (P[3][1] - P[4][1]) * t]; };
    // 振り子のエネルギー（重さはどの点も1）。手を離した時点の値を保ち続ける
    let energy0 = null;
    function chainEnergy(h) {
      let e = 0;
      for (let k = 1; k < 5; k++) { const vx = (P[k][0] - Q[k][0]) / h, vy = (P[k][1] - Q[k][1]) / h; e += 0.5 * (vx * vx + vy * vy) + G * P[k][1]; }

    }
    function keepEnergy(h) {
      if (energy0 === null || holding || phase !== 'shake') return;
      let ke = 0, pe = 0;
      for (let k = 1; k < 5; k++) { const vx = (P[k][0] - Q[k][0]) / h, vy = (P[k][1] - Q[k][1]) / h; ke += 0.5 * (vx * vx + vy * vy); pe += G * P[k][1]; }
      const want = energy0 - pe;

      for (let k = 1; k < 5; k++) { Q[k][0] = P[k][0] - (P[k][0] - Q[k][0]) * sc; Q[k][1] = P[k][1] - (P[k][1] - Q[k][1]) * sc; }

    }
    function chainStep(dt) {
      const n = 5;
      const posing = holding && aim && n === 5; // つまんで形を決めている間は物理を止める（重力も勢いもなし）
      if (!posing) for (let k = 1; k < n; k++) {
        const vx = P[k][0] - Q[k][0], vy = P[k][1] - Q[k][1]; // 減衰なし
        Q[k] = P[k]; P[k] = [P[k][0] + vx, P[k][1] + vy - G * dt * dt];
      }
      for (let it = 0; it < 8; it++) {
        if (posing) {
          // ボトルの重心を指の位置へ持っていく
          const c = comOf(), dx = aim[0] - c[0], dy = aim[1] - c[1];
          for (const k of [3, 4]) { P[k][0] += dx; P[k][1] += dy; }
        }
        for (let j = 0; j < n - 1; j++) {
          const a = P[j], b = P[j + 1], dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy) || 1e-6;
          const wa = INV[j], wb = INV[j + 1], c = (d - LEN[j]) / d / (wa + wb);
          a[0] += dx * c * wa; a[1] += dy * c * wa; b[0] -= dx * c * wb; b[1] -= dy * c * wb;
        }
        for (let k = 1; k < n; k++) if (P[k][1] < 0) { P[k][1] = 0; Q[k][0] = P[k][0] * 0.5 + Q[k][0] * 0.5; }
      }
      // 節が伸び縮みしないよう、支点から順に長さをきっちり合わせ直す
      for (let j = 0; j < n - 1; j++) {
        const a = P[j], b = P[j + 1], dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy) || 1e-6;
        b[0] = a[0] + dx / d * LEN[j]; b[1] = a[1] + dy / d * LEN[j];
      }
      if (posing) for (let k = 1; k < n; k++) Q[k] = P[k].slice(); // 離した瞬間は止まった状態から動き出す
      if (dt > 0) lastSub = dt;
    }
    function bodyFromChain() {
      const [cx, cy] = P[3], [bx, by] = P[4], ux = (cx - bx) / H, uy = (cy - by) / H;
      const v2x = (P[3][0] - Q[3][0]) / lastSub, v2y = (P[3][1] - Q[3][1]) / lastSub;
      const v3x = (P[4][0] - Q[4][0]) / lastSub, v3y = (P[4][1] - Q[4][1]) / lastSub;
      const t = HC / H;
      body.x = bx + (cx - bx) * t; body.y = by + (cy - by) * t; body.a = Math.atan2(-ux, uy);
      body.vx = v3x + (v2x - v3x) * t; body.vy = v3y + (v2y - v3y) * t;
      body.w = ((cx - bx) * (v2y - v3y) - (cy - by) * (v2x - v3x)) / (H * H);
    }
    // ---------- 流れ：形を決める → 5秒振り回す → 栓が飛んで炭酸が吹き出す → 結果 ----------
    function reset() {
      gen++; phase = 'ready'; holding = false; tShake = 0; fizz = 0; score = 0; prevV = null; hang();
      cap.visible = true; capFly = null; water.scale.y = 1; water.position.y = 0.051; clearFoam();
      resultShown = false; $('result').style.display = 'none'; drawTimer();
      showHint('drag');
    }
    function startShake() {
      phase = 'shake'; tShake = 0; fizz = 0; prevV = null;
      // ほんの少しだけゆらしておく（真上で釣り合ったまま止まらないように）
      for (let k = 1; k < 5; k++) P[k][0] += (Math.random() - 0.5) * 1e-4;
      energy0 = chainEnergy(STEP); clearTrails(); recording = true; sfx.whoosh();
    }
    // 振られ具合：ボトルの速さの変わり方（ゆさぶられた量）を足していく
    const FIZZ_PER_ML = 0.4, MAX_ML = 500; // 500mL のボトル。全部出たら満点
    function measure(h) {
      bodyFromChain();
      const v = [body.vx, body.vy, body.w];
      if (prevV) fizz += Math.hypot(v[0] - prevV[0], v[1] - prevV[1]) + Math.abs(v[2] - prevV[2]) * 0.02;
      prevV = v;
      tShake += h;
      if (tShake >= SHAKE_TIME) spray();
    }
    const mlOf = f => Math.min(MAX_ML, Math.round(f / FIZZ_PER_ML));
    function spray() {
      phase = 'spray'; recording = false; score = mlOf(fizz);
      const frac = score / MAX_ML;
      // 栓が飛ぶ
      bodyFromChain();
      const ux = -Math.sin(body.a), uy = Math.cos(body.a), top = [body.x + ux * (H - HC), body.y + uy * (H - HC)];
      cap.visible = false; capFly = { p: top.slice(), v: [ux * (1 + 3 * frac), uy * (1 + 3 * frac)], r: 0 };
      sfx.pop(); sfx.fizz(0.6 + 2.2 * frac, 0.05 + 0.25 * frac);
      foamLeft = 0.4 + 2.4 * frac; foamRate = 80 + 900 * frac; foamSpeed = 0.6 + 2.6 * frac; foamFrom = top; foamDir = [ux, uy];
      const isNew = score > best; if (isNew) { best = score; store.set('bestML', best); }
      lastNew = isNew;
      const g = gen; setTimeout(() => { if (g !== gen) return; phase = 'done'; resultShown = true; fillResult(); $('result').style.display = 'flex'; }, (foamLeft + 1.2) * 1000);
    }
    function drawTimer() {
      const left = phase === 'ready' ? 1 : phase === 'shake' ? 1 - tShake / SHAKE_TIME : 0;
      $('timer').firstChild.style.transform = `scaleX(${Math.max(0, left)})`;
    }

    // ---------- 吹き出す泡 ----------
    const FOAM_N = 3000, foamPos = new Float32Array(FOAM_N * 3), foamVel = new Float32Array(FOAM_N * 2);
    const foamGeo = new THREE.BufferGeometry(); foamGeo.setAttribute('position', new THREE.BufferAttribute(foamPos, 3).setUsage(THREE.DynamicDrawUsage));
    const foam = new THREE.Points(foamGeo, new THREE.PointsMaterial({ color: '#d9b48a', size: 0.03, transparent: true, opacity: 0.9, depthWrite: false }));
    foam.frustumCulled = false; scene.add(foam);
    let foamCount = 0, foamLeft = 0, foamRate = 0, foamSpeed = 0, foamFrom = [0, 0], foamDir = [0, 1], foamAcc = 0, capFly = null;
    function clearFoam() { foamCount = 0; foamLeft = 0; foamGeo.setDrawRange(0, 0); }
    function stepFoam(h) {
      if (foamLeft > 0) {
        foamLeft -= h; foamAcc += foamRate * h;
        while (foamAcc >= 1 && foamCount < FOAM_N) {
          foamAcc -= 1;
          const k = foamCount++, sp = foamSpeed * (0.7 + Math.random() * 0.5), a = (Math.random() - 0.5) * 0.5;
          const dx = foamDir[0] * Math.cos(a) - foamDir[1] * Math.sin(a), dy = foamDir[0] * Math.sin(a) + foamDir[1] * Math.cos(a);
          foamPos.set([foamFrom[0], foamFrom[1], (Math.random() - 0.5) * 0.03], k * 3); foamVel.set([dx * sp, dy * sp], k * 2);
        }
        // 出た分だけ中身が減る
        const left = 1 - foamCount / FOAM_N * 0.9; water.scale.y = Math.max(0.1, left); water.position.y = 0.004 + 0.0475 * water.scale.y;
      }
      for (let k = 0; k < foamCount; k++) {
        if (foamPos[k * 3 + 1] <= 0.003) continue; // 机に落ちたら止まる
        foamVel[k * 2 + 1] -= G * h;
        foamPos[k * 3] += foamVel[k * 2] * h; foamPos[k * 3 + 1] = Math.max(0.003, foamPos[k * 3 + 1] + foamVel[k * 2 + 1] * h);
      }
      if (capFly) { capFly.v[1] -= G * h; capFly.p[0] += capFly.v[0] * h; capFly.p[1] = Math.max(0.011, capFly.p[1] + capFly.v[1] * h); capFly.r += 12 * h; }
    }

    const COLA_SVG = '<path d="M5 1h4v3l1 3h1.5q1.5 0 1.5 2v19q0 1-1 1H2q-1 0-1-1V9q0-2 1.5-2H4l1-3z" fill="#2a1206" stroke="#d9b48a" stroke-width="1.2"/><rect x="1.6" y="13" width="10.8" height="6" fill="#d9261c"/><circle cx="4" cy="2" r="1.6" fill="#d9b48a"/><circle cx="8.5" cy="1.2" r="1.3" fill="#d9b48a"/><circle cx="11" cy="3" r="1" fill="#d9b48a"/>';
    function fillResult() {
      $('result').querySelector('.big svg').innerHTML = COLA_SVG;
      $('rCount').textContent = t('unit')(score);
      $('rBest').textContent = lastNew && score > 0 ? t('newBest') : t('best')(best);
      $('rBest').classList.toggle('new', lastNew && score > 0);
      const a = $('post');
      a.textContent = t('post');
      a.href = `https://x.com/intent/post?text=${encodeURIComponent(t('share')(score))}&url=${encodeURIComponent(SHARE_URL)}`;
      if (matchMedia('(pointer: coarse)').matches) { a.removeAttribute('target'); a.removeAttribute('rel'); }
      else { a.target = '_blank'; a.rel = 'noopener'; }
    }
    $('retry').addEventListener('click', reset);

    // ---------- 操作：ボトルをつまんで持ち上げ、離すとスタート ----------
    const ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0), hit3 = new THREE.Vector3();
    function toWorld(e) {
      ray.setFromCamera(new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1), camera);
      return ray.ray.intersectPlane(plane, hit3) ? [hit3.x, hit3.y] : null;
    }
    addEventListener('pointerdown', e => {
      if (e.target.closest('header, #result') || phase !== 'ready') return;
      const w = toWorld(e); if (!w) return;
      const c = comOf();
      if (Math.hypot(w[0] - c[0], w[1] - c[1]) < 0.3) { holding = true; grab = [c[0] - w[0], c[1] - w[1]]; aim = c; hideHint(); }
    });
    addEventListener('pointermove', e => { if (!holding) return; const w = toWorld(e); if (w) aim = [w[0] + grab[0], Math.max(0.1, w[1] + grab[1])]; });
    const letGo = () => { if (!holding) return; holding = false; startShake(); };
    addEventListener('pointerup', letGo);
    addEventListener('pointercancel', letGo);

    // ---------- ヒント ----------
    const hintDone = store.get('hint', {});
    let hintKind = null;
    function showHint(kind) { if (hintDone[kind]) return; hintKind = kind; $('hint').setAttribute('class', kind); $('hint').style.display = 'block'; }
    function hideHint() { if (hintKind) { hintDone[hintKind] = true; store.set('hint', hintDone); } hintKind = null; $('hint').style.display = 'none'; }
    function placeHint() {
      if (!hintKind) return;
      const v = new THREE.Vector3(...comOf(), 0).project(camera);
      $('hint').style.left = ((v.x + 1) / 2 * innerWidth - 27) + 'px';
      $('hint').style.top = ((1 - v.y) / 2 * innerHeight - 27) + 'px';
    }

    // ---------- カメラと描画 ----------
    function resize() {
      const w = innerWidth, h = innerHeight;
      renderer.setSize(w, h, false); camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    addEventListener('resize', resize); resize();

    const cam = { x: 0, y: 1.15 };
    const capMesh = cap.clone(); capMesh.position.set(0, 0, 0); scene.add(capMesh);
    const STEP = 1 / 960;
    let prev = performance.now(), simAcc = 0, trailAcc = 0;
    function frame(now) {
      const dt = Math.max(0, Math.min(0.05, (now - prev) / 1000)); prev = now;
      // 物理は決まった刻み（1/960秒）で進める。画面の大きさやフレームレートで動きが変わらない
      simAcc += dt;
      while (simAcc >= STEP) {
        simAcc -= STEP;
        if (phase === 'ready' || phase === 'shake') { chainStep(STEP); keepEnergy(STEP); } // 吹き出したら振り子は止める
        if (phase === 'shake') measure(STEP);
        if (phase === 'spray' || phase === 'done') stepFoam(STEP);
        if ((trailAcc += STEP) >= 1 / 60) { trailAcc -= 1 / 60; updateTrails(); }
      }
      bodyFromChain();
      drawTimer();
      // カメラは固定。振り子が届く範囲と机がいつも入るように引く
      const tv = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
      const dist = Math.max(1.85 / 2 / tv / camera.aspect, 2.5 / 2 / tv);
      cam.x = 0; cam.y = 1.15;
      camera.position.set(cam.x, cam.y + 0.15, dist);
      camera.lookAt(cam.x, cam.y, 0);
      bottle.position.set(body.x, body.y, 0); bottle.rotation.z = body.a;
      drawBubbles(phase === 'shake' || phase === 'ready' ? fizz / FIZZ_PER_ML / MAX_ML * 1.6 : Math.max(0, 1 - foamCount / FOAM_N * 2), now);
      foamGeo.attributes.position.needsUpdate = true; foamGeo.setDrawRange(0, foamCount);
      if (capFly) { capMesh.visible = true; capMesh.position.set(capFly.p[0], capFly.p[1], 0); capMesh.rotation.z = capFly.r; } else capMesh.visible = false;
      drawChain();
      placeHint();
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    applyLang(); reset();
    // 最初の1回だけ重くならないよう、使う質感を先に準備し、音は最初に触れたときに用意しておく
    renderer.compile(scene, camera);
    addEventListener('pointerdown', () => { if (soundOn && !ac) try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }, { once: true, capture: true });
    requestAnimationFrame(frame);
  </script>
</body>
</html>
