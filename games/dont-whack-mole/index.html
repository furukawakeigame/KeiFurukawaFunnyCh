        }
        else if (c.phase === 'angry') {
          // ゆっくり少し大きくなって、うつむいて肩を震わせる
          const k = Math.min(1, c.t / 0.9), s = 1 + 0.9 * (1 - (1 - k) ** 2);
          c.g.scale.setScalar(s);
          c.y = UP + 0.1 * k;
          c.g.rotation.y = 0;
          c.head.rotation.x = 0.25 * k;
          c.head.position.y = 0.45 + Math.sin(c.t * 14) * 0.015 * k;
          for (const tr of c.tears) { tr.position.y = 0.1 - ((c.t * 0.5) % 0.35); tr.position.z = 0.48 + ((c.t * 0.5) % 0.35) * 0.3; }
        }
        if (c.phase === 'down') { c.y -= dt * 10; if (c.y <= DOWN) { remove(i); continue; } }
      }
      if (state === 'over') {
        angryT += dt;
        if (angryT > 1.1) finish();
      }
    }

    // ---------- 画面 ----------
    const controls = document.getElementById('controls');
    const resultEl = document.getElementById('result');
    function renderControls() {
      controls.innerHTML = '';
      controls.classList.toggle('hide', state !== 'result');
      loveEl.style.display = state === 'result' ? 'none' : 'flex';
      if (state !== 'result') return;
      const b = document.createElement('button');
      b.className = 'go'; b.textContent = t('again');
      b.addEventListener('click', start);
      controls.append(b);
      if (state === 'result') {
        const a = document.createElement('a');
        a.className = 'post'; a.textContent = t('post');
        a.href = `https://x.com/intent/post?text=${encodeURIComponent(t('share')(score))}&url=${encodeURIComponent(SHARE_URL)}`;
        const coarse = matchMedia('(pointer: coarse)').matches;
        if (!coarse) { a.target = '_blank'; a.rel = 'noopener'; }
        // スマホは画像ごと共有シートへ。PCは画像を保存してから投稿画面を開く
        a.addEventListener('click', e => {
          const text = t('share')(score);
          if (coarse && navigator.share) {
            e.preventDefault();
            const file = shareFile();
            const data = file && navigator.canShare?.({ files: [file] }) ? { files: [file], text: `${text}\n${SHARE_URL}` } : { text: `${text}\n${SHARE_URL}` };
            navigator.share(data).catch(() => {});
            return;
          }
          const img = resultImage();
          if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'dont-whack-mole.png'; d.click(); }
        });
        controls.append(a);
      }
    }
    // 結果画像: 怒ったモグラの画面に人数を重ねる
    let snap = null, shareCache = null;
    function takeSnap() {
      const src = renderer.domElement;
      // 怒ったモグラ（なければ台の中心）が入るように切り抜く
      const focus = (angry ? angry.g.position.clone().setY(1.5) : CENTER.clone()).project(camera);
      const fx = (focus.x + 1) / 2 * src.width, fy = (1 - focus.y) / 2 * src.height;
      const side = Math.min(src.width, src.height);
      const sx = THREE.MathUtils.clamp(fx - side / 2, 0, src.width - side), sy = THREE.MathUtils.clamp(fy - side / 2, 0, src.height - side);
      snap = document.createElement('canvas'); snap.width = snap.height = 1080;
      snap.getContext('2d').drawImage(src, sx, sy, side, side, 0, 0, 1080, 1080);
      shareCache = null;
    }
    function resultImage() {
      if (!snap) return null;
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const g = c.getContext('2d');
      g.drawImage(snap, 0, 0);
      g.textAlign = 'center'; g.fillStyle = '#fff'; g.lineJoin = 'round';
      const font = px => `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans Thai", sans-serif`;
      const text = (str, y, px, max) => {
        g.font = font(px);
        const w = g.measureText(str).width; if (w > max) { px *= max / w; g.font = font(px); }
        g.lineWidth = px * .16; g.strokeStyle = '#6b3d1c'; g.strokeText(str, 540, y); g.fillText(str, 540, y);
      };
      text(t('count')(score), 900, 170, 960);
      text(t('title'), 90, 56, 900);
      return c;
    }
    function prepareShare() {
      if (!snap) return;
      const key = lang;
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'dont-whack-mole.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;
    function start() {
      reset();
      state = 'play';
      resultEl.style.display = 'none';
      drawLove(); renderControls(); resize();
    }
    function showResult() { resultEl.children[0].textContent = t('count')(score); }
    function finish() {
      state = 'result'; hammer.visible = false;
      showResult();
      resultEl.style.display = 'flex';
      snap = null; needSnap = true;
      renderControls(); resize();
    }

    // ---------- ループ ----------
    let last = performance.now(), acc = 0;
    function render(alpha) {
      for (const c of chars) if (c) c.g.position.y = c.prevY + (c.y - c.prevY) * alpha;
      const k = swingT < 0.35 ? swingT / 0.35 : 1 - (swingT - 0.35) / 0.65;
      pivot.rotation.x = 0.9 * (1 - k) + (-0.05) * k;
      renderer.render(scene, camera);
      if (needSnap) { needSnap = false; takeSnap(); prepareShare(); }
    }
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      acc += dt;
      while (acc >= STEP) { step(STEP); acc -= STEP; }
      render(acc / STEP);
      requestAnimationFrame(loop);
    }

    resize();
    start();
    applyLang();
    // 最初の1回が重くならないように、全部の形を一度描いておく
    { const tmp = [spawn(1, true, true), spawn(3, false, true)]; tmp.forEach(c => c.g.position.y = 0); hammer.visible = true; renderer.compile(scene, camera); renderer.render(scene, camera); hammer.visible = false; remove(1); remove(3); }
    requestAnimationFrame(t0 => { last = t0; loop(t0); });
  </script>
</body>
</html>
