    {

    { const h = part(CYL, mat('#c89a5a'), 0, 0, -1.0, 0.07, 2.0, 0.07, pivot); h.rotation.x = Math.PI / 2;
      const hd = part(CYL, mat('#d8402a'), 0, 0, -2.0, 0.32, 0.9, 0.32, pivot); hd.rotation.z = Math.PI / 2;
      for (const s of [-1, 1]) { const e = part(CYL, mat('#f2c43a'), s * 0.47, 0, -2.0, 0.34, 0.06, 0.34, pivot); e.rotation.z = Math.PI / 2; } }
    hammer.visible = false;
    scene.add(hammer);
    let swingT = 1, hammerAt = new THREE.Vector3();
    const placeHammer = p => { hammerAt.copy(p); hammer.position.set(p.x, 1.55, p.z + 2.0); };

    // ---------- 画面サイズ ----------
    const CENTER = new THREE.Vector3(0, 0.4, 0.1);
    function resize() {
      const w = stage.clientWidth, h = stage.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      const vf = THREE.MathUtils.degToRad(camera.fov), hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);
      const R = 4.0; // 台が入る半径
      const d = Math.min(R / Math.sin(Math.min(vf, hf) / 2), 30);
      const dir = new THREE.Vector3(0, 1.05, 1).normalize();
      // 背の低い横長では結果の文字を左に出すので、台を少し右へ
      const side = (state === 'result' && h <= 520 && w / h >= 4 / 3) ? -2.2 : 0;
      camera.position.copy(CENTER).addScaledVector(dir, d).add(new THREE.Vector3(side, 0, 0));
      camera.lookAt(CENTER.x + side, CENTER.y, CENTER.z);
      camera.updateProjectionMatrix();
    }
    addEventListener('resize', resize);

    // ---------- 入力 ----------
    const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -0.9);
    function toBoard(e) {
      const r = renderer.domElement.getBoundingClientRect();
      ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      ray.setFromCamera(ndc, camera);
      const p = new THREE.Vector3();
      return ray.ray.intersectPlane(plane, p) ? p : null;
    }
    renderer.domElement.addEventListener('pointermove', e => {
      if (state !== 'play' || e.pointerType !== 'mouse') return;
      const p = toBoard(e); if (p) { placeHammer(p); hammer.visible = true; }
    });
    renderer.domElement.addEventListener('pointerdown', e => {
      e.preventDefault();
      if (state !== 'play') return;
      const p = toBoard(e); if (!p) return;
      // 当たり: キャラに当たればそれ、外れても近い穴のキャラを拾う
      let target = null;
      const meshes = [];
      for (const c of chars) if (c && !c.hit && c.y > -1.1) c.g.traverse(o => { if (o.isMesh) { o.userData.c = c; meshes.push(o); } });
      const hit = ray.intersectObjects(meshes, false)[0];
      if (hit) target = hit.object.userData.c;
      else {
        let best = 1.1;
        for (const c of chars) if (c && !c.hit && c.y > -1.1) { const d = Math.hypot(HOLES[c.hole].x - p.x, HOLES[c.hole].z - p.z); if (d < best) { best = d; target = c; } }
      }
      const at = target ? HOLES[target.hole] : p;
      placeHammer(at); hammer.visible = true; swingT = 0;
      if (!target) { sWhiff(); return; }
      if (target.mole) { moleHit(target); return; }
      target.hit = true; target.phase = 'stun'; target.t = 0;
      score++; love = Math.min(1, love + 0.14); drawLove();
      sBonk();
      for (const e2 of target.eyes) e2.scale.y *= 0.25;
      target.stars = new THREE.Group();
      for (let k = 0; k < 3; k++) part(starG, starM, Math.cos(k * 2.1) * 0.45, 0, Math.sin(k * 2.1) * 0.45, 1, 1, 1, target.stars);
      target.stars.position.y = 0.75; target.head.add(target.stars);
    }, { passive: false });
    stage.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

    // ---------- ゲーム ----------
    let state = 'title', score = 0, love = 1, shownLove = -1, elapsed = 0, nextSpawn = 0, angry = null, angryT = 0, needSnap = false;
    // モグラ愛ゲージ: 何もしないと減り、人間を叩くと増える
    const loveEl = document.getElementById('love'), loveBar = loveEl.querySelector('i');
    const drawLove = () => {
      const v = Math.round(love * 200) / 200;
      if (v !== shownLove) { shownLove = v; loveBar.style.transform = `scaleX(${v})`; }
    };
    function clearAll() { for (let i = 0; i < 9; i++) remove(i); if (angry) { angry = null; } }
    function reset() {
      clearAll();
      score = 0; love = 1; elapsed = 0; nextSpawn = 0.6; angryT = 0;
    }
    function titleScene() {
      clearAll();
      const c = spawn(4, true, false); c.phase = 'hold';
      const a = spawn(0, false, false); a.phase = 'hold';
      const b = spawn(8, false, false); b.phase = 'hold';
    }
    function moleHit(c) {
      state = 'over'; angry = c; angryT = 0; c.hit = true; c.phase = 'angry';
      sBonk(); sAngry();
      for (const e of c.eyes) { e.material = RED; e.scale.set(0.09, 0.05, 0.04); e.rotation.z = 0; }
      c.eyes[0].rotation.z = -0.5; c.eyes[1].rotation.z = 0.5;
      // 眉
      for (const s of [-1, 1]) { const b = part(BOX, BLACK, s * 0.2, 0.33, 0.47, 0.22, 0.05, 0.04, c.head); b.rotation.z = s * -0.5; }
      renderControls();
    }
    function spawnTick() {
      const free = []; for (let i = 0; i < 9; i++) if (!chars[i]) free.push(i);
      if (!free.length) return;
      const busy = 9 - free.length;
      const maxBusy = Math.min(5, 1 + Math.floor(elapsed / 9));
      if (busy >= maxBusy) return;
      const mole = Math.random() < 0.45;
      const decoy = elapsed > 18 && Math.random() < Math.min(0.4, (elapsed - 18) / 40);
      const c = spawn(pick(free), mole, decoy);
      c.stay = Math.max(0.5, 1.35 - elapsed * 0.018) * (0.8 + Math.random() * 0.4);
    }
    const STEP = 1 / 60;
    function step(dt) {
      if (state === 'play') {
        elapsed += dt;
        love -= dt * (0.07 + elapsed * 0.0015);
        if (love <= 0) { love = 0; state = 'over'; angryT = 0; renderControls(); }
        drawLove();
        nextSpawn -= dt;
        if (nextSpawn <= 0) { spawnTick(); nextSpawn = Math.max(0.28, 0.95 - elapsed * 0.015) * (0.6 + Math.random() * 0.8); }
      }
      swingT = Math.min(1, swingT + dt * 7);
      for (let i = 0; i < 9; i++) {
        const c = chars[i]; if (!c) continue;
        c.prevY = c.y; c.t += dt;
        if (c.phase === 'up') { c.y = Math.min(UP, c.y + dt * 14); if (c.y >= UP) { c.phase = 'stay'; c.t = 0; } }
        else if (c.phase === 'hold') { c.y = Math.min(UP, c.y + dt * 8); }
        else if (c.phase === 'stay') {
          if (c.t > c.stay && state === 'play') {
            if (!c.mole) { // 見逃し: あっかんべー
              c.phase = 'tease'; c.t = 0; c.tongue.visible = true; sTease();
            } else { c.phase = 'down'; }
          }
        }
        else if (c.phase === 'tease') { c.head.rotation.z = Math.sin(c.t * 30) * 0.15; if (c.t > 0.5) c.phase = 'down'; }
        else if (c.phase === 'stun') {
          c.y = UP - 0.5 * Math.min(1, c.t * 12);
          c.head.scale.y = 1 - 0.25 * Math.max(0, 1 - c.t * 4);
          if (c.stars) c.stars.rotation.y += dt * 8;
          if (c.t > 0.45) c.phase = 'down';
        }
        else if (c.phase === 'angry') {
          const k = Math.min(1, c.t / 0.6), s = 1 + 2.6 * (1 - (1 - k) ** 3);
          c.g.scale.setScalar(s);
          c.y = 0.15 * s;
          c.g.position.x = HOLES[i].x + Math.sin(c.t * 60) * 0.06 * (1 - k * 0.5);
          c.g.rotation.y = 0;
        }
        if (c.phase === 'down') { c.y -= dt * 10; if (c.y <= DOWN) { remove(i); continue; } }
      }
      if (state === 'over') {
        angryT += dt;
        if (angryT > 1.1) finish();
      }
    }

    // ---------- 画面 ----------
    const controls = document.getElementById('controls');
    const resultEl = document.getElementById('result');
    function renderControls() {
      controls.innerHTML = '';
      controls.classList.toggle('hide', state === 'play' || state === 'over');
      loveEl.style.display = state === 'play' || state === 'over' ? 'flex' : 'none';
      if (state === 'play' || state === 'over') return;
      const b = document.createElement('button');
      b.className = 'go'; b.textContent = state === 'result' ? t('again') : t('start');
      b.addEventListener('click', start);
      controls.append(b);
      if (state === 'result') {
        const a = document.createElement('a');
        a.className = 'post'; a.textContent = t('post');
        a.href = `https://x.com/intent/post?text=${encodeURIComponent(t('share')(score))}&url=${encodeURIComponent(SHARE_URL)}`;
        const coarse = matchMedia('(pointer: coarse)').matches;
        if (!coarse) { a.target = '_blank'; a.rel = 'noopener'; }
        // スマホは画像ごと共有シートへ。PCは画像を保存してから投稿画面を開く
        a.addEventListener('click', e => {
          const text = t('share')(score);
          if (coarse && navigator.share) {
            e.preventDefault();
            const file = shareFile();
            const data = file && navigator.canShare?.({ files: [file] }) ? { files: [file], text: `${text}\n${SHARE_URL}` } : { text: `${text}\n${SHARE_URL}` };
            navigator.share(data).catch(() => {});
            return;
          }
          const img = resultImage();
          if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'dont-whack-mole.png'; d.click(); }
        });
        controls.append(a);
      }
    }
    // 結果画像: 怒ったモグラの画面に人数を重ねる
    let snap = null, shareCache = null;
    function takeSnap() {
      const src = renderer.domElement;
      // 怒ったモグラ（なければ台の中心）が入るように切り抜く
      const focus = (angry ? angry.g.position.clone().setY(1.5) : CENTER.clone()).project(camera);
      const fx = (focus.x + 1) / 2 * src.width, fy = (1 - focus.y) / 2 * src.height;
      const side = Math.min(src.width, src.height);
      const sx = THREE.MathUtils.clamp(fx - side / 2, 0, src.width - side), sy = THREE.MathUtils.clamp(fy - side / 2, 0, src.height - side);
      snap = document.createElement('canvas'); snap.width = snap.height = 1080;
      snap.getContext('2d').drawImage(src, sx, sy, side, side, 0, 0, 1080, 1080);
      shareCache = null;
    }
    function resultImage() {
      if (!snap) return null;
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const g = c.getContext('2d');
      g.drawImage(snap, 0, 0);
      g.textAlign = 'center'; g.fillStyle = '#fff'; g.lineJoin = 'round';
      const font = px => `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans Thai", sans-serif`;
      const text = (str, y, px, max) => {
        g.font = font(px);
        const w = g.measureText(str).width; if (w > max) { px *= max / w; g.font = font(px); }
        g.lineWidth = px * .16; g.strokeStyle = '#6b3d1c'; g.strokeText(str, 540, y); g.fillText(str, 540, y);
      };
      text(t('count')(score), 900, 170, 960);
      text(t('title'), 90, 56, 900);
      return c;
    }
    function prepareShare() {
      if (!snap) return;
      const key = lang;
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'dont-whack-mole.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;
    function start() {
      reset();
      state = 'play';
      resultEl.style.display = 'none';
      drawLove(); renderControls(); resize();
    }
    function showResult() { resultEl.children[0].textContent = t('count')(score); }
    function finish() {
      state = 'result'; hammer.visible = false;
      showResult();
      resultEl.style.display = 'flex';
      snap = null; needSnap = true;
      renderControls(); resize();
    }

    // ---------- ループ ----------
    let last = performance.now(), acc = 0;
    function render(alpha) {
      for (const c of chars) if (c) c.g.position.y = c.prevY + (c.y - c.prevY) * alpha;
      const k = swingT < 0.35 ? swingT / 0.35 : 1 - (swingT - 0.35) / 0.65;
      pivot.rotation.x = 0.9 * (1 - k) + (-0.05) * k;
      renderer.render(scene, camera);
      if (needSnap) { needSnap = false; takeSnap(); prepareShare(); }
    }
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      acc += dt;
      while (acc >= STEP) { step(STEP); acc -= STEP; }
      render(acc / STEP);
      requestAnimationFrame(loop);
    }

    resize();
    titleScene();
    applyLang();
    // 最初の1回が重くならないように、全部の形を一度描いておく
    { const tmp = [spawn(1, true, true), spawn(3, false, true)]; tmp.forEach(c => c.g.position.y = 0); hammer.visible = true; renderer.compile(scene, camera); renderer.render(scene, camera); hammer.visible = false; remove(1); remove(3); }
    requestAnimationFrame(t0 => { last = t0; loop(t0); });
  </script>
</body>
</html>
