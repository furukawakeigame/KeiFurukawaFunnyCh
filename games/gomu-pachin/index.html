    html, body { margin: 0; height: 100%; background: #fdf1d8; color: #3b2a1e; }

  <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js" } }</script>
  <script type="module">
    const SHARE_URL = 'https://keifurukawafunnych.com/games/gomu-pachin/';
    const $ = id => document.getElementById(id);
    const store = {
      get(k, d) { try { const v = localStorage.getItem('gomu-pachin:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
      set(k, v) { try { localStorage.setItem('gomu-pachin:' + k, JSON.stringify(v)); } catch {} },
    };

    // ---------- 言語 ----------
    const DICT = {
      ja: {
        title: 'ゴムパッチン', back: '← トップへ戻る', start: 'スタート', retry: 'もう一度', share: 'Xに投稿',
        win: '勝ち', lose: '負け', max: n => `最大 ${n}cm`,
        shareText: (w, n) => `ゴムパッチンで${w ? '勝った' : '負けた'}！ 最大 ${n}cm #ゴムパッチンゲーム`,
        loadErr: '読み込みに失敗しました。通信状況を確かめて再読み込みしてください。',
      },
      ko: {
        title: '고무줄 팍', back: '← 처음으로', start: '시작', retry: '다시 하기', share: 'X에 올리기',
        win: '승리', lose: '패배', max: n => `최대 ${n}cm`,
        shareText: (w, n) => `고무줄 팍 대결에서 ${w ? '이겼다' : '졌다'}! 최대 ${n}cm #ゴムパッチンゲーム`,
        loadErr: '불러오지 못했습니다. 연결 상태를 확인하고 새로고침해 주세요.',
      },
      en: {
        title: 'Rubber Snap', back: '← Top', start: 'Start', retry: 'Play again', share: 'Post on X',
        win: 'You win', lose: 'You lose', max: n => `Max ${n}cm`,
        shareText: (w, n) => `I ${w ? 'won' : 'lost'} at Rubber Snap! Max ${n}cm #ゴムパッチンゲーム`,
        loadErr: 'Failed to load. Check your connection and reload.',
      },
      th: {
        title: 'ดีดหนังยาง', back: '← หน้าแรก', start: 'เริ่ม', retry: 'เล่นอีกครั้ง', share: 'โพสต์ลง X',
        win: 'ชนะ', lose: 'แพ้', max: n => `สูงสุด ${n}cm`,
        shareText: (w, n) => `${w ? 'ชนะ' : 'แพ้'}เกมดีดหนังยาง! สูงสุด ${n}cm #ゴムパッチンゲーム`,
        loadErr: 'โหลดไม่สำเร็จ โปรดตรวจสอบการเชื่อมต่อแล้วโหลดใหม่',
      },
    };
    const autoLang = () => { for (const l of navigator.languages?.length ? navigator.languages : [navigator.language || '']) { const c = l.toLowerCase().slice(0, 2); if (DICT[c]) return c; } return 'en'; };
    let lang = store.get('lang', autoLang());
    if (!DICT[lang]) lang = 'en';
    const t = k => DICT[lang][k];
    let muted = store.get('muted', false);
    let result = null;

    function applyLang() {
      document.documentElement.lang = lang;
      document.title = t('title');
      $('lang').value = lang;
      $('back').textContent = t('back');
      $('start').textContent = t('start');
      $('retry').textContent = t('retry');
      $('share').textContent = t('share');
      if ($('msg').dataset.err) $('msg').textContent = t('loadErr');
      if (result) showResult();
    }
    $('lang').onchange = () => { lang = $('lang').value; store.set('lang', lang); applyLang(); };
    function applyMute() { $('sOn').style.display = muted ? 'none' : ''; $('sOff').style.display = muted ? '' : 'none'; }
    $('sound').onclick = () => { muted = !muted; store.set('muted', muted); applyMute(); };
    applyLang(); applyMute();

    let THREE, CANNON;
    try {
      [THREE, CANNON] = await Promise.all([import('three'), import('cannon-es')]);
    } catch (e) {
      $('msg').dataset.err = '1'; $('msg').textContent = t('loadErr'); $('title').hidden = true;
      throw e;
    }

    // ---------- 音 ----------
    let ac = null, squeak = null, squeakGain = null;
    function initAudio() {
      if (ac) return;
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        const g = ac.createGain(); g.gain.value = 0; g.connect(ac.destination);
        const o = ac.createOscillator(); o.connect(g); o.start(); o.stop(ac.currentTime + 0.05);
        squeak = ac.createOscillator(); squeak.type = 'triangle';
        squeakGain = ac.createGain(); squeakGain.gain.value = 0;
        squeak.connect(squeakGain).connect(ac.destination); squeak.start();
      } catch { ac = null; }
    }
    function snapSound(power) {
      if (!ac || muted) return;
      const now = ac.currentTime;
      const len = Math.floor(ac.sampleRate * 0.12);
      const buf = ac.createBuffer(1, len, ac.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 4);
      const n = ac.createBufferSource(); n.buffer = buf;
      const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1500;
      const g = ac.createGain(); g.gain.value = 0.3 + power * 0.6;
      n.connect(hp).connect(g).connect(ac.destination); n.start(now);
      const o = ac.createOscillator(); o.frequency.setValueAtTime(180, now); o.frequency.exponentialRampToValueAtTime(60, now + 0.15);
      const og = ac.createGain(); og.gain.setValueAtTime(0.5 * power + 0.1, now); og.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
      o.connect(og).connect(ac.destination); o.start(now); o.stop(now + 0.22);
    }
    function blip(freqs) {
      if (!ac || muted) return;
      freqs.forEach((f, i) => {
        const now = ac.currentTime + i * 0.12;
        const o = ac.createOscillator(); o.type = 'square'; o.frequency.value = f;
        const g = ac.createGain(); g.gain.setValueAtTime(0.06, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        o.connect(g).connect(ac.destination); o.start(now); o.stop(now + 0.2);
      });
    }

    // ---------- three.js ----------
    const stage = $('stage');
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    stage.appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xfdf1d8);
    const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 50);
    scene.add(new THREE.HemisphereLight(0xffffff, 0xd9b48a, 1.6));
    const sun = new THREE.DirectionalLight(0xffffff, 1.6);
    sun.position.set(2, 5, 4); sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    Object.assign(sun.shadow.camera, { left: -3, right: 3, top: 3, bottom: -1 });
    scene.add(sun);
    const ground = new THREE.Mesh(new THREE.CircleGeometry(6, 48), new THREE.MeshLambertMaterial({ color: 0xf2d7ad }));
    ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

    function resize() {
      const w = stage.clientWidth, h = stage.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      // 2人とゴムが横いっぱいに収まる距離
      const halfW = 1.3, halfH = 1.15;
      const vf = THREE.MathUtils.degToRad(camera.fov / 2);
      const dist = Math.max(halfH / Math.tan(vf), halfW / (Math.tan(vf) * camera.aspect));
      // 縦長の画面では人を少し下寄りに置く
      const lookY = Math.max(1.05, dist * Math.tan(vf) * 0.72);
      camera.position.set(0, lookY + 0.15, dist);
      camera.lookAt(0, lookY, 0);
      camera.updateProjectionMatrix();
    }
    addEventListener('resize', resize);

    // ---------- 物理 ----------
    const H = 1 / 60;
    const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.8, 0) });
    const REST = 0.46, MAXLEN = 1.5; // ゴムの自然長と限界
    const allBodies = [];

    function addBody(shape, mass, pos, mesh) {
      const b = new CANNON.Body({ mass, shape, position: new CANNON.Vec3(...pos), linearDamping: 0.15, angularDamping: 0.5 });
      b.collisionFilterGroup = 0; b.collisionFilterMask = 0;
      // 横から見た面の中だけで動かす（ねじれて後ろを向かないように）
      b.angularFactor.set(0.15, 0.15, 1); b.linearFactor.set(1, 1, 0.2);
      world.addBody(b);
      const rec = { b, mesh, rest: new CANNON.Vec3(...pos), pp: new THREE.Vector3(...pos), pq: new THREE.Quaternion(), cp: new THREE.Vector3(...pos), cq: new THREE.Quaternion() };
      allBodies.push(rec);
      if (mesh) { mesh.castShadow = true; scene.add(mesh); }
      return rec;
    }
    const mat = c => new THREE.MeshLambertMaterial({ color: c });
    const SKIN = mat(0xf2c9a0), PANTS = mat(0x3b3550), DARK = mat(0x2a1e18), MOUTH = mat(0x8a2a2a);

    function makePerson(x0, dir, shirtColor) {
      const SHIRT = mat(shirtColor);
      const p = { dir, x0 };
      const box = (w, h, d, m) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
      p.pelvis = addBody(new CANNON.Box(new CANNON.Vec3(0.11, 0.08, 0.16)), 10, [x0, 0.95, 0], box(0.22, 0.16, 0.32, PANTS));
      p.chest = addBody(new CANNON.Box(new CANNON.Vec3(0.12, 0.23, 0.18)), 15, [x0, 1.26, 0], box(0.24, 0.46, 0.36, SHIRT));
      // 頭（目・口・髪つき）
      const head = new THREE.Group();
      const skull = new THREE.Mesh(new THREE.SphereGeometry(0.13, 24, 16), SKIN); skull.castShadow = true; head.add(skull);
      const hair = new THREE.Mesh(new THREE.SphereGeometry(0.135, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2.3), DARK);
      hair.rotation.z = dir * 0.35; head.add(hair);
      p.eyes = [];
      for (const z of [-0.05, 0.05]) {
        const e = new THREE.Mesh(new THREE.SphereGeometry(0.018, 10, 8), DARK);
        e.position.set(dir * 0.115, 0.025, z); head.add(e); p.eyes.push(e);
      }
      const mouth = new THREE.Mesh(new THREE.SphereGeometry(0.025, 10, 8), MOUTH);
      mouth.position.set(dir * 0.12, -0.05, 0); mouth.scale.set(0.6, 0.8, 1.2); head.add(mouth);
      const nose = new THREE.Mesh(new THREE.SphereGeometry(0.022, 10, 8), SKIN);
      nose.position.set(dir * 0.135, -0.005, 0); head.add(nose);
      p.head = addBody(new CANNON.Sphere(0.13), 4, [x0, 1.63, 0], head);
      p.mouthLocal = new CANNON.Vec3(dir * 0.13, -0.05, 0);
      world.addConstraint(new CANNON.PointToPointConstraint(p.pelvis.b, new CANNON.Vec3(0, 0.07, 0), p.chest.b, new CANNON.Vec3(0, -0.24, 0)));
      world.addConstraint(new CANNON.PointToPointConstraint(p.chest.b, new CANNON.Vec3(0, 0.25, 0), p.head.b, new CANNON.Vec3(0, -0.12, 0)));
      p.arms = [];
      for (const z of [-0.23, 0.23]) {
        const up = addBody(new CANNON.Box(new CANNON.Vec3(0.045, 0.15, 0.045)), 2, [x0, 1.32, z], box(0.09, 0.3, 0.09, SHIRT));
        const lo = addBody(new CANNON.Box(new CANNON.Vec3(0.04, 0.14, 0.04)), 1.5, [x0, 1.03, z], box(0.08, 0.28, 0.08, SKIN));
        world.addConstraint(new CANNON.PointToPointConstraint(p.chest.b, new CANNON.Vec3(0, 0.21, z), up.b, new CANNON.Vec3(0, 0.15, 0)));
        world.addConstraint(new CANNON.PointToPointConstraint(up.b, new CANNON.Vec3(0, -0.15, 0), lo.b, new CANNON.Vec3(0, 0.14, 0)));
        p.arms.push(up, lo);
      }
      // 脚は描くだけ（足は床に固定、腰とつなぐ）
      p.legs = [];
      for (const z of [-0.09, 0.09]) {
        const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.055, 1, 10), PANTS); leg.castShadow = true; scene.add(leg);
        const foot = box(0.22, 0.07, 0.11, DARK); foot.position.set(x0 + dir * 0.04, 0.035, z); foot.castShadow = true; scene.add(foot);
        p.legs.push({ leg, z, foot: new THREE.Vector3(x0, 0.06, z) });
      }
      p.mass = allBodies.slice(-7).reduce((m, r) => m + r.b.mass, 0) - p.head.b.mass;
      p.off = new THREE.Vector3();     // 頭を引っぱる目標（安静位置からのずれ）
      p.grip = true;                   // 頭を目標へ引く力が効いているか
      p.squint = 0;
      return p;
    }
    const me = makePerson(-0.36, 1, 0x2f6fd0);
    const cpu = makePerson(0.36, -1, 0xd94a3c);
    const people = [me, cpu];

    const tmpV = new CANNON.Vec3();
    function mouthPos(p, out = new CANNON.Vec3()) { return p.head.b.pointToWorldFrame(p.mouthLocal, out); }

    // 姿勢を保つ力（目標の向きへ回すトルク）
    // wn: 戻る速さ(rad/s), z: 減衰比。慣性で割ってから掛けるので重さによらず安定する
    function uprightTorque(rec, wn, z0) {
      const I = rec.b.inertia, Ia = (I.x + I.y + I.z) / 3;
      const k = Ia * wn * wn, c = Ia * 2 * z0 * wn;
      const q = rec.b.quaternion;
      // 誤差 = 目標(単位) * q^-1
      let x = -q.x, y = -q.y, z = -q.z, w = q.w;
      if (w < 0) { x = -x; y = -y; z = -z; w = -w; }
      const s = Math.sqrt(x * x + y * y + z * z);
      const ang = 2 * Math.atan2(s, w);
            if (s > 1e-6) { rec.b.torque.x += k * x / s * ang; rec.b.torque.y += k * y / s * ang; rec.b.torque.z += k * z / s * ang; }
      const av = rec.b.angularVelocity;
      rec.b.torque.x -= c * av.x; rec.b.torque.y -= c * av.y; rec.b.torque.z -= c * av.z;
    }
    function springTo(b, tx, ty, tz, k, c, maxF) {
      let fx = k * (tx - b.position.x) - c * b.velocity.x;
      let fy = k * (ty - b.position.y) - c * b.velocity.y;
      let fz = k * (tz - b.position.z) - c * b.velocity.z;
      const f = Math.hypot(fx, fy, fz);
      if (maxF && f > maxF) { fx *= maxF / f; fy *= maxF / f; fz *= maxF / f; }
      b.force.x += fx; b.force.y += fy; b.force.z += fz;
    }

    function resetPeople() {
      for (const r of allBodies) {
        r.b.position.copy(r.rest); r.b.velocity.setZero(); r.b.angularVelocity.setZero(); r.b.quaternion.set(0, 0, 0, 1);
        r.pp.set(r.rest.x, r.rest.y, r.rest.z); r.cp.copy(r.pp); r.pq.identity(); r.cq.identity();
      }
      for (const p of people) { p.off.set(0, 0, 0); p.grip = true; p.squint = 0; }
    }

    // ---------- ゴム ----------
    const rubberMat = new THREE.MeshLambertMaterial({ color: 0x3cc060 });
    const rubber = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 1, 10), rubberMat);
    rubber.castShadow = true; scene.add(rubber);
    const cG = new THREE.Color(0x3cc060), cY = new THREE.Color(0xf2c230), cR = new THREE.Color(0xe0302a);
    // free: 放したあとの飛んでいく端 { pos, vel, to:person, from, power, mode:'fly'|'drop'|'hang' }
    let free = null;

    function setBetween(mesh, a, b, r) {
      const d = new THREE.Vector3().subVectors(b, a);
      const len = Math.max(d.length(), 1e-4);
      mesh.position.copy(a).addScaledVector(d, 0.5);
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.divideScalar(len));
      mesh.scale.set(r, len, r);
    }

    // ---------- ゲーム進行 ----------
    // 流れ: janken（手を選ぶ）→ attack（勝った側が引いて放す／負けた側はガード）→ snap → after → 次の janken
    let state = 'title', stateT = 0, round = 0, score = [0, 0], maxCm = 0, firstGame = true;
    let attacker = null, cpuPlan = null, atkT = 0;
    let timeScale = 1, slowT = 0;

    // 0:グー 1:チョキ 2:パー
    function handSVG(k, c) {
      const f = `fill="${c}"`;
      const body = [
        `<rect x="13" y="20" width="34" height="28" rx="11" ${f}/><path d="M24 22v9M32 22v9M40 22v9" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>`,
        `<rect x="18" y="31" width="26" height="22" rx="9" ${f}/><rect x="17" y="5" width="9" height="32" rx="4.5" ${f} transform="rotate(-14 21 34)"/><rect x="34" y="5" width="9" height="32" rx="4.5" ${f} transform="rotate(14 38 34)"/>`,
        `<rect x="14" y="29" width="32" height="24" rx="10" ${f}/>` + [15, 23, 31, 39].map((x, i) => `<rect x="${x}" y="${i % 3 ? 5 : 9}" width="7" height="30" rx="3.5" ${f}/>`).join('') + `<rect x="2" y="30" width="7" height="22" rx="3.5" ${f} transform="rotate(-45 6 41)"/>`,
      ][k];
      return `<svg viewBox="0 0 60 60" width="100%" height="100%">${body}</svg>`;
    }
    document.querySelectorAll('.jk button').forEach(b => {
      b.innerHTML = handSVG(+b.dataset.k, '#e0603b');
      b.onclick = () => pickHand(+b.dataset.k);
    });
    function showHands(m, c, res) {
      $('hMe').innerHTML = m == null ? '' : handSVG(m, '#2f6fd0');
      $('hCpu').innerHTML = c == null ? '' : `<div style="transform:scaleX(-1);width:100%;height:100%">${handSVG(c, '#d94a3c')}</div>`;
      $('hMe').className = res === 1 ? 'win' : res === -1 ? 'lose' : '';
      $('hCpu').className = res === -1 ? 'win' : res === 1 ? 'lose' : '';
    }

    function setScore() {
      [...$('sMe').children].forEach((s, i) => s.classList.toggle('on', i < score[0]));
      [...$('sCpu').children].forEach((s, i) => s.classList.toggle('on', i < score[1]));
    }
    function startGame() {
      score = [0, 0]; round = 0; maxCm = 0; result = null; setScore();
      $('title').hidden = true; $('result').hidden = true;
      startRound();
    }
    function startRound() {
      resetPeople(); free = null; dragging = false; attacker = null;
      for (const p of people) p.guard = false;
      showHands(null, null, 0);
      state = 'janken'; stateT = 0;
      $('janken').hidden = false;
    }
    function pickHand(k) {
      if (state !== 'janken') return;
      initAudio();
      const c = Math.floor(Math.random() * 3);
      const res = k === c ? 0 : (k + 1) % 3 === c ? 1 : -1; // グーはチョキに勝つ
      $('janken').hidden = true;
      showHands(k, c, res);
      blip([res === 0 ? 520 : 700]);
      if (res === 0) { state = 'aiko'; stateT = 0; return; }
      attacker = res === 1 ? me : cpu;
      state = 'attack'; stateT = 0; atkT = 0;
      const lv = Math.min(round, 5);
      cpuPlan = res === 1
        ? { guardAt: Math.max(0.32, 0.75 - lv * 0.07 + Math.random() * 0.25) }            // CPU が守る
        : { pullFor: Math.max(0.25, 0.6 - lv * 0.05 + Math.random() * 0.4), speed: 1.1 };   // CPU が攻める
      if (firstGame) { if (attacker === me) $('hint').hidden = false; else $('guardHint').hidden = false; }
    }
    function stretch() {
      const a = mouthPos(me), b = mouthPos(cpu, tmpV);
      const d = a.distanceTo(b);
      return { d, s: (d - REST) / (MAXLEN - REST) };
    }
    // hit: 当たる人、startPos: 飛び始める位置
    function launch(hit, startPos, power, dropOnly, cm = 0) {
      const other = hit === me ? cpu : me;
      other.grip = true;
      free = { pos: new THREE.Vector3(startPos.x, startPos.y, startPos.z), vel: new THREE.Vector3(), to: hit, power, cm, mode: dropOnly ? 'drop' : 'fly' };
      state = 'snap'; stateT = 0;
      $('hint').hidden = true; $('guardHint').hidden = true;
    }
    function onHit() {
      const p = free.to, power = free.power;
      const dir = new THREE.Vector3(-p.dir, 0.25, 0).normalize();
      const im = 2 + power * 8;
      p.head.b.applyImpulse(new CANNON.Vec3(dir.x * im, dir.y * im, 0));
      p.chest.b.applyImpulse(new CANNON.Vec3(dir.x * power * 5, 0, 0));
      p.grip = false; p.squint = 1.2; p.guard = false;
      snapSound(power);
      timeScale = 0.3; slowT = 0.6;
      if (p === cpu) { score[0]++; maxCm = Math.max(maxCm, free.cm); } else score[1]++;
      setScore();
      free.mode = 'hang';
      state = 'after'; stateT = 0;
    }
    function onBlock() {
      const p = free.to;
      free.mode = 'hang';
      free.vel.set(-p.dir * 2.5, 2, 0);
      p.head.b.applyImpulse(new CANNON.Vec3(-p.dir * 1.2, 0, 0));
      blip([180, 140]);
      state = 'after'; stateT = 0.4;
    }
    function endRoundCheck() {
      if (score[0] >= 2 || score[1] >= 2) {
        state = 'result';
        firstGame = false;
        result = { win: score[0] >= 2, cm: maxCm };
        blip(result.win ? [660, 880, 1320] : [440, 330, 220]);
        showResult();
      } else { round++; startRound(); }
    }
    function showResult() {
      $('rWin').textContent = result.win ? t('win') : t('lose');
      $('rWin').style.color = result.win ? '#2f6fd0' : '#d94a3c';
      $('rMax').textContent = t('max')(result.cm);
      const a = $('share');
      a.href = `https://x.com/intent/post?text=${encodeURIComponent(t('shareText')(result.win, result.cm))}&url=${encodeURIComponent(SHARE_URL)}`;
      if (!matchMedia('(pointer: coarse)').matches) { a.target = '_blank'; a.rel = 'noopener'; } else { a.removeAttribute('target'); }
      $('result').hidden = false;
    }
    $('start').onclick = () => { initAudio(); startGame(); };
    $('retry').onclick = () => { initAudio(); startGame(); };

    // ---------- 入力 ----------
    let dragging = false, dragStart = null, offStart = new THREE.Vector3();
    const ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0), ndc = new THREE.Vector2();
    function worldAt(e) {
      const r = renderer.domElement.getBoundingClientRect();
      ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      ray.setFromCamera(ndc, camera);
      const v = new THREE.Vector3();
      return ray.ray.intersectPlane(plane, v) ? v : null;
    }
    function clampOff(o) {
      o.x = THREE.MathUtils.clamp(o.x, -0.55, 0.12);
      o.y = THREE.MathUtils.clamp(o.y, -0.25, 0.15);
      o.z = 0;
    }
    stage.addEventListener('pointerdown', e => {
      initAudio();
      if (state === 'snap' && free?.to === me && free.mode === 'fly') { me.guard = true; $('guardHint').hidden = true; return; }
      if (state !== 'attack') return;
      e.preventDefault();
      if (attacker !== me) { me.guard = true; $('guardHint').hidden = true; return; } // 負けたほうはタップでガード
      stage.setPointerCapture(e.pointerId);
      dragging = true; dragStart = worldAt(e); offStart.copy(me.off);
    });
    stage.addEventListener('pointermove', e => {
      if (!dragging || !dragStart) return;
      const w = worldAt(e); if (!w) return;
      me.off.copy(offStart).add(w.sub(dragStart)); clampOff(me.off);
      $('hint').hidden = true;
    });
    function release() {
      if (!dragging) return;
      dragging = false;
      if (state !== 'attack' || attacker !== me) return;
      const { d, s } = stretch();
      const start = mouthPos(me);
      if (s < 0.15) launch(cpu, start, 0, true);
      else launch(cpu, start, Math.min(s, 1), false, Math.round(d * 100));
    }
    stage.addEventListener('pointerup', release);
    stage.addEventListener('pointercancel', release);

    // ---------- 1刻み ----------
    const holding = () => state === 'title' || state === 'janken' || state === 'aiko' || state === 'attack';
    function tick() {
      stateT += H;
      for (const p of people) {
        const dir = p.dir;
        springTo(p.pelvis.b, p.pelvis.rest.x, p.pelvis.rest.y, 0, 3000, 120);
        p.pelvis.b.force.y += p.mass * 9.8; // 脚が体重を支える分
        uprightTorque(p.pelvis, 14, 0.8);
        uprightTorque(p.chest, 14, 0.7);
        uprightTorque(p.head, 9, 0.5);
        for (const a of p.arms) uprightTorque(a, p.guard ? 0.5 : 3, 0.3);
        if (p.guard) {
          // 両手を顔の前に出す
          const hp = p.head.b.position;
          for (const [i, z] of [[1, -0.07], [3, 0.07]]) {
            const lo = p.arms[i].b;
            springTo(lo, hp.x + dir * 0.24, hp.y - 0.02, z, 900, 40, 220);
            lo.force.y += (lo.mass + p.arms[i - 1].b.mass) * 9.8;
          }
        }
        if (p.grip) {
          const hr = p.head.rest;
          springTo(p.head.b, hr.x + p.off.x * dir, hr.y + p.off.y, 0, 500, 40, 260);
          p.head.b.force.y += p.head.b.mass * 9.8;
        }
        p.squint = Math.max(0, p.squint - H);
        if (!p.grip && p.squint < 0.5) { p.grip = true; p.off.set(-0.1, -0.1, 0); } // のけぞったあと立ち直る
      }
      // ゴムの張力
      if (holding()) {
        const a = mouthPos(me), b = mouthPos(cpu, tmpV.clone());
        const dv = b.vsub(a); const d = dv.length();
        if (d > REST) {
          const f = 140 * (d - REST) / d;
          me.head.b.applyForce(new CANNON.Vec3(dv.x * f, dv.y * f, dv.z * f));
          cpu.head.b.applyForce(new CANNON.Vec3(-dv.x * f, -dv.y * f, -dv.z * f));
        }
      }
      if (state === 'aiko' && stateT > 0.7) { showHands(null, null, 0); state = 'janken'; stateT = 0; $('janken').hidden = false; }
      if (state === 'attack') {
        const pl = cpuPlan;
        const { s } = stretch();
        if (attacker === cpu) {
          if (stateT < pl.pullFor) { cpu.off.x = Math.max(-0.55, cpu.off.x - pl.speed * H); cpu.off.y = Math.max(-0.15, cpu.off.y - 0.3 * H); }
          else launch(me, mouthPos(cpu), Math.max(0.3, Math.min(s, 1)));
        } else {
          if (s > 1) { dragging = false; launch(me, mouthPos(cpu), 1); } // 引きすぎて切れた：自分に返ってくる
          else if (stateT > 3) { dragging = false; launch(cpu, mouthPos(me), 0, true); } // 放さないまま時間切れ
        }
      }
      // ジャンケンの勝負がついてからの時間で CPU はガードする（ゴムが飛んでいる間も間に合うことがある）
      if (state === 'attack' || state === 'snap') atkT += H;
      if (attacker === me && cpuPlan?.guardAt != null && atkT > cpuPlan.guardAt && (state === 'attack' || (state === 'snap' && free?.mode === 'fly'))) cpu.guard = true;
      if (free) {
        const p = free.to;
        const m = mouthPos(p); const anchor = new THREE.Vector3(m.x, m.y, m.z);
        if (free.mode === 'fly') {
          const to = anchor.clone().sub(free.pos); const dist = to.length();
          const speed = 5 + free.power * 14;
          if (p.guard && dist < 0.3) onBlock();
          else if (dist < speed * H + 0.02) { free.pos.copy(anchor); onHit(); }
          else free.pos.addScaledVector(to, speed * H / dist);
        } else {
          // ぶら下がる
          free.vel.y -= 9.8 * H; free.vel.multiplyScalar(0.985);
          free.pos.addScaledVector(free.vel, H);
          const lim = 0.28, v = free.pos.clone().sub(anchor), l = v.length();
          if (l > lim) { free.pos.copy(anchor).addScaledVector(v, lim / l); free.vel.multiplyScalar(0.9); }
          if (free.mode === 'drop' && stateT > 1.1) { state = 'after'; stateT = 0.8; free.mode = 'hang'; }
        }
      }
      if (state === 'after' && stateT > 1.8) endRoundCheck();
      world.step(H);
    }

    // ---------- 描画 ----------
    const tA = new THREE.Vector3(), tB = new THREE.Vector3();
    function render(alpha) {
      for (const r of allBodies) {
        if (!r.mesh) continue;
        r.mesh.position.lerpVectors(r.pp, r.cp, alpha);
        r.mesh.quaternion.slerpQuaternions(r.pq, r.cq, alpha);
      }
      for (const p of people) {
        p.head.mesh.updateMatrixWorld();
        p.pelvis.mesh.updateMatrixWorld();
        for (const L of p.legs) {
          const hip = new THREE.Vector3(0, -0.04, L.z).applyMatrix4(p.pelvis.mesh.matrixWorld);
          setBetween(L.leg, L.foot, hip, 1);
          L.leg.scale.x = L.leg.scale.z = 1;
        }
        const sq = p.squint > 0 ? 0.15 : 1;
        for (const e of p.eyes) e.scale.y = sq;
      }
      const mouthW = (p, v) => v.set(p.mouthLocal.x, p.mouthLocal.y, p.mouthLocal.z).applyMatrix4(p.head.mesh.matrixWorld);
      let a, b;
      if (free) { a = mouthW(free.to, tA); b = tB.copy(free.pos); }
      else { a = mouthW(me, tA); b = mouthW(cpu, tB); }
      const len = a.distanceTo(b);
      const s = free ? 0 : THREE.MathUtils.clamp((len - REST) / (MAXLEN - REST), 0, 1);
      setBetween(rubber, a, b, Math.max(0.004, 0.012 / Math.sqrt(Math.max(1, len / REST))));
      if (s < 0.5) rubberMat.color.lerpColors(cG, cY, s * 2); else rubberMat.color.lerpColors(cY, cR, (s - 0.5) * 2);
      renderer.render(scene, camera);
      return s;
    }

    let acc = 0, last = performance.now(), prevS = 0;
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (slowT > 0) { slowT -= dt; if (slowT <= 0) timeScale = 1; }
      acc += dt * timeScale;
      while (acc >= H) {
        for (const r of allBodies) { r.pp.copy(r.cp); r.pq.copy(r.cq); }
        tick();
        for (const r of allBodies) { r.cp.set(r.b.position.x, r.b.position.y, r.b.position.z); r.cq.set(r.b.quaternion.x, r.b.quaternion.y, r.b.quaternion.z, r.b.quaternion.w); }
        acc -= H;
      }
      const s = render(acc / H);
      if (squeakGain) {
        const rate = Math.abs(s - prevS) / Math.max(dt, 1e-3);
        const g = muted || state !== 'attack' ? 0 : Math.min(0.06, rate * 0.05);
        squeakGain.gain.setTargetAtTime(g, ac.currentTime, 0.03);
        squeak.frequency.setTargetAtTime(250 + s * 700, ac.currentTime, 0.03);
      }
      prevS = s;
      requestAnimationFrame(frame);
    }
    resize();
    resetPeople();
    tick(); render(1); // 最初の1回を空回し
    requestAnimationFrame(t0 => { last = t0; frame(t0); });
    // 1ゲーム遊んだらヒントは出さない
  </script>
</body>
</html>
