        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#223" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#223"/><path id="wave" d="M16 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path id="mute" d="M16 9l6 6M22 9l-6 6" style="display:none"/></svg>
      </button>

  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
  <script>
const URL_ = 'https://keifurukawafunnych.com/games/line-trampoline/';
const TAG = '#線トランポリンゲーム';
const L = {
  ja: { saved: '結果画像を保存しました。投稿に添付してください', title: '線トランポリン', back: '← トップへ戻る', again: 'もう一度', post: 'Xに投稿', best: m => `最高 ${m}m`, nw: '新記録', err: '物理エンジンを読み込めませんでした。通信を確認して再読み込みしてください。', text: m => `線トランポリンで ${m}m まで上った ${TAG}` },
  ko: { saved: '결과 이미지를 저장했습니다. 게시물에 첨부하세요', title: '선 트램펄린', back: '← 처음으로', again: '다시 하기', post: 'X에 게시', best: m => `최고 ${m}m`, nw: '신기록', err: '물리 엔진을 불러오지 못했습니다. 연결을 확인하고 새로고침하세요.', text: m => `선 트램펄린으로 ${m}m까지 올라갔다 ${TAG}` },
  en: { saved: 'Result image saved. Attach it to your post', title: 'Line Trampoline', back: '← Back to top', again: 'Play again', post: 'Post on X', best: m => `Best ${m}m`, nw: 'New record', err: 'Could not load the physics engine. Check your connection and reload.', text: m => `I climbed ${m}m in Line Trampoline ${TAG}` },
  th: { saved: 'บันทึกรูปผลลัพธ์แล้ว แนบไปกับโพสต์ได้เลย', title: 'แทรมโพลีนเส้น', back: '← กลับหน้าแรก', again: 'เล่นอีกครั้ง', post: 'โพสต์ลง X', best: m => `สูงสุด ${m}m`, nw: 'สถิติใหม่', err: 'โหลดเอนจินฟิสิกส์ไม่ได้ กรุณาตรวจสอบการเชื่อมต่อแล้วโหลดใหม่', text: m => `ขึ้นไปได้ ${m}m ใน แทรมโพลีนเส้น ${TAG}` },
};
const store = {
  get(k, d) { try { const v = localStorage.getItem('line-trampoline:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('line-trampoline:' + k, JSON.stringify(v)); } catch {} },
};
function pickLang() {
  const s = store.get('lang', null); if (L[s]) return s;
  for (const l of (navigator.languages || [navigator.language || ''])) { const c = l.toLowerCase().slice(0, 2); if (L[c]) return c; }
  return 'en';
}
let lang = pickLang();
const $ = id => document.getElementById(id);
const langSel = $('lang'); langSel.value = lang;
langSel.onchange = () => { lang = langSel.value; store.set('lang', lang); applyLang(); };
function applyLang() {
  const t = L[lang]; document.title = t.title; document.documentElement.lang = lang;
  $('back').textContent = t.back; $('again').textContent = t.again; $('post').textContent = t.post;
  $('err').textContent = t.err;
  if (lastResult) showResult(lastResult);
}

// sound
let soundOn = store.get('sound', true), ac = null;
function updSnd() { $('wave').style.display = soundOn ? '' : 'none'; $('mute').style.display = soundOn ? 'none' : ''; }
$('snd').onclick = () => { soundOn = !soundOn; store.set('sound', soundOn); updSnd(); };
updSnd();
function unlockAudio() {
  if (ac) return;
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(); g.gain.value = 0; // silent warm-up
    o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.05);
  } catch {}
}
function beep(freq, dur = 0.18, type = 'sine', vol = 0.25) {
  if (!soundOn) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = type; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq * 1.6, t + dur * 0.6);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur);
  } catch {}
}

const cv = $('cv');
let ctx = cv.getContext('2d'); // swapped temporarily while drawing the share image
let W = 400, H = 700, S = 1, lastResult = null;
const VW = 400; // world width
function resize() {
  // keep a portrait play area: at most 0.65 wide per 1 tall, centred on wide screens
  const st = $('stage'), sw = st.clientWidth, sh = st.clientHeight;
  cv.style.width = Math.min(sw, sh * 0.65) + 'px';
  const r = cv.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  S = r.width / VW; W = VW; H = r.height / S;
  ctx.setTransform(dpr * S, 0, 0, dpr * S, 0, 0);
  try { if (engine) draw(); } catch {} // engine not created yet on first call
}
addEventListener('resize', resize);
applyLang();
if (!window.Matter) { $('err').style.display = 'flex'; throw new Error('matter'); }
resize();

const { Engine, Bodies, Body, Composite, Events } = Matter;
const BALL_R = 18, PX_PER_M = 40;
let engine, walls, ball, line, rocks, camY, startY, maxH, state, nextRockY, drag, trail, pops;
const best = () => store.get('best', 0);

function reset() {
  engine = Engine.create(); engine.gravity.y = 1;
  startY = 0; camY = -H * 0.45; maxH = 0; state = 'ready'; line = null; drag = null; trail = []; pops = [];
  ball = Bodies.circle(VW / 2, startY, BALL_R, { restitution: 0.5, friction: 0.02, frictionAir: 0.004, density: 0.002, label: 'ball' });
  Body.setStatic(ball, true);
  Composite.add(engine.world, ball);
  walls = [-14, VW + 14].map(x => Bodies.rectangle(x, 0, 40, 6000, { isStatic: true, restitution: 0.6, friction: 0, label: 'wall' }));
  Composite.add(engine.world, walls);
  rocks = []; nextRockY = startY - 260;
  Events.on(engine, 'collisionStart', onHit);
  lastResult = null; $('result').classList.remove('show');
}

function genRocks() {
  while (nextRockY > camY - H) {
    const h = (startY - nextRockY) / PX_PER_M;
    const r = 16 + Math.random() * (12 + Math.min(h / 8, 30));
    const x = r + 10 + Math.random() * (VW - 2 * r - 20);
    const kind = KINDS[Math.random() * KINDS.length | 0], opt = { isStatic: true, restitution: 0.6, angle: Math.random() * 6, label: 'rock' };
    const rock = kind === 'egg' ? Bodies.polygon(x, nextRockY, 5 + (Math.random() * 3 | 0), r, opt)
      : kind === 'donut' || kind === 'teeth' ? Bodies.circle(x, nextRockY, r * 0.9, opt)
      : kind === 'chikuwa' ? Bodies.rectangle(x, nextRockY, r * 3, r * 0.9, { ...opt, chamfer: { radius: r * 0.44 } })
      : kind === 'sushi' ? Bodies.rectangle(x, nextRockY, r * 2.2, r * 1.1, { ...opt, chamfer: { radius: r * 0.3 } })
      : Bodies.rectangle(x, nextRockY, r * 1.8, r * 1.8, { ...opt, chamfer: { radius: r * 0.25 } }); // toast
    rock.kind = kind; rock.r = r;
    // above 80m some rocks drift sideways, faster the higher you go
    if (h > 80 && Math.random() < Math.min(0.7, (h - 80) / 300)) rock.drift = { x0: x, amp: 40 + Math.random() * 80, sp: (0.6 + Math.random()) * (1 + h / 400), ph: Math.random() * 6 };
    rocks.push(rock); Composite.add(engine.world, rock);
    nextRockY -= Math.max(110, 320 - h * 0.9) + Math.random() * Math.max(60, 160 - h * 0.3);
  }
  for (let i = rocks.length - 1; i >= 0; i--) if (rocks[i].position.y > camY + H + 200) { Composite.remove(engine.world, rocks[i]); rocks.splice(i, 1); }
}

function onHit(e) {
  for (const p of e.pairs) {
    const other = p.bodyA === ball ? p.bodyB : p.bodyB === ball ? p.bodyA : null;
    if (!other) continue;
    if (other.label === 'line' && line && other === line.body && !line.used) {
      const a = line.body.angle;
      let nx = -Math.sin(a), ny = Math.cos(a);
      const dx = ball.position.x - line.body.position.x, dy = ball.position.y - line.body.position.y;
      if (nx * dx + ny * dy < 0) { nx = -nx; ny = -ny; }
      const power = Math.max(10, Math.min(19, 21 - line.len * 0.045));
      const v = ball.velocity, tv = (v.x * -ny + v.y * nx) * 0.5; // keep some tangential speed
      Body.setVelocity(ball, { x: nx * power + -ny * tv, y: ny * power + nx * tv });
      Body.setAngularVelocity(ball, ball.angularVelocity + tv * 0.02);
      line.used = true; line.t = 0; line.bend = 1;
      beep(220 + power * 30, 0.22, 'triangle');
      pops.push({ x: ball.position.x, y: ball.position.y, t: 0 });
    } else if (other.label === 'rock' || other.label === 'wall') beep(110, 0.08, 'square', 0.08);
  }
}

function toWorld(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / S, y: (e.clientY - r.top) / S + camY }; }
cv.addEventListener('pointerdown', e => { unlockAudio(); if (state === 'over') return; e.preventDefault(); cv.setPointerCapture(e.pointerId); const p = toWorld(e); drag = { a: p, b: p, id: e.pointerId }; });
cv.addEventListener('pointermove', e => { if (drag && drag.id === e.pointerId) drag.b = clampLen(drag.a, toWorld(e)); });
const maxLen = () => Math.max(90, 300 - maxH * 0.5);
function clampLen(a, b) { const l = Math.hypot(b.x - a.x, b.y - a.y), m = maxLen(); return l <= m ? b : { x: a.x + (b.x - a.x) * m / l, y: a.y + (b.y - a.y) * m / l }; }
const endDrag = e => {
  if (!drag || drag.id !== e.pointerId) return;
  drag.b = clampLen(drag.a, toWorld(e)); const { a, b } = drag; drag = null;
  const len = Math.hypot(b.x - a.x, b.y - a.y); if (len < 24) return;
  if (line) Composite.remove(engine.world, line.body);
  const body = Bodies.rectangle((a.x + b.x) / 2, (a.y + b.y) / 2, len, 8, { isStatic: true, angle: Math.atan2(b.y - a.y, b.x - a.x), label: 'line', restitution: 0.2 });
  line = { body, a, b, len, used: false, t: 0, bend: 0 };
  Composite.add(engine.world, body);
  beep(500, 0.06, 'sine', 0.1);
  if (state === 'ready') { state = 'play'; Body.setStatic(ball, false); prevPos = { x: ball.position.x, y: ball.position.y }; acc = 0; }
};
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', e => { if (drag && drag.id === e.pointerId) drag = null; });
document.addEventListener('touchmove', e => { if (e.target === cv) e.preventDefault(); }, { passive: false });

function gameOver() {
  state = 'over'; beep(300, 0.5, 'sawtooth', 0.12);
  const m = Math.floor(maxH), b = best(), nw = m > b;
  if (nw) store.set('best', m);
  setTimeout(() => showResult({ m, best: Math.max(m, b), nw }), 500);
}
function showResult(r) {
  lastResult = r; const t = L[lang];
  $('rH').textContent = r.m + 'm'; $('rNew').textContent = r.nw ? t.nw : ''; $('rBest').textContent = t.best(r.best); $('rSaved').textContent = '';
  const a = $('post');
  a.href = `https://x.com/intent/post?text=${encodeURIComponent(t.text(r.m))}&url=${encodeURIComponent(URL_)}`;
  if (matchMedia('(pointer: coarse)').matches) { a.removeAttribute('target'); a.removeAttribute('rel'); } else { a.target = '_blank'; a.rel = 'noopener'; }
  $('result').classList.add('show');
  prepareShare(r);
}

// share image (1080x1080): sky for the height reached, the cat on a green onion among the obstacles, and the height
const SHARE_NAME = 'line-trampoline.png';
let shareFile = null, shareKey = '';
function resultImage(m) {
  const c = document.createElement('canvas'); c.width = c.height = 1080;
  const keep = ctx; ctx = c.getContext('2d');
  try {
    const [top, bot] = sky(m), g = ctx.createLinearGradient(0, 0, 0, 1080);
    g.addColorStop(0, `rgb(${top})`); g.addColorStop(1, `rgb(${bot})`); ctx.fillStyle = g; ctx.fillRect(0, 0, 1080, 1080);
    const things = [['egg', 170, 230, 0.3], ['donut', 900, 200, 0], ['sushi', 880, 640, -0.4], ['teeth', 170, 700, 0.2], ['chikuwa', 560, 120, 0.15], ['toast', 920, 420, 0.5]];
    for (const [kind, x, y, ang] of things) {
      if (kind === 'egg') { ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.fillStyle = '#fffdf6'; ctx.beginPath(); ctx.ellipse(0, 0, 90, 75, 0, 0, 7); ctx.fill(); ctx.strokeStyle = '#e8c98a'; ctx.lineWidth = 6; ctx.stroke(); ctx.fillStyle = '#ffb21e'; ctx.beginPath(); ctx.arc(0, 0, 34, 0, 7); ctx.fill(); ctx.restore(); }
      else { ctx.save(); ctx.translate(x, y); ctx.scale(2.6, 2.6); drawThing({ kind, r: 30, angle: ang, position: { x: 0, y: 0 } }); ctx.restore(); }
    }
    ctx.save(); ctx.scale(3, 3); drawTramp({ x: 70, y: 315 }, { x: 290, y: 300 }, 14, 1, 220); ctx.restore();
    ctx.save(); ctx.translate(540, 560); ctx.rotate(-0.25); drawCat(150); ctx.restore();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    ctx.font = '900 190px system-ui, sans-serif'; ctx.lineWidth = 22; ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.strokeText(m + 'm', 540, 300); ctx.fillStyle = '#fff'; ctx.fillText(m + 'm', 540, 300);
    ctx.font = '700 40px system-ui, sans-serif'; ctx.lineWidth = 8; ctx.strokeText(L[lang].title, 540, 1020); ctx.fillText(L[lang].title, 540, 1020);
  } finally { ctx = keep; }
  return c;
}
// build the file as soon as the result is decided so the tap on mobile can share immediately
function prepareShare(r) {
  const key = lang + ':' + r.m; if (key === shareKey) return; shareKey = key; shareFile = null;
  resultImage(r.m).toBlob(b => { if (b && shareKey === key) shareFile = new File([b], SHARE_NAME, { type: 'image/png' }); }, 'image/png');
}
$('post').onclick = e => {
  if (!lastResult) return;
  const t = L[lang], coarse = matchMedia('(pointer: coarse)').matches;
  if (coarse && typeof navigator.share === 'function' && shareFile && navigator.canShare?.({ files: [shareFile] })) {
    e.preventDefault();
    navigator.share({ files: [shareFile], text: `${t.text(lastResult.m)}\n${URL_}` }).catch(() => {});
    return;
  }
  if (coarse) return; // follow the intent link in the same tab
  // PC: save the image, then the link opens the X post screen in a new tab
  const a = document.createElement('a'); a.href = resultImage(lastResult.m).toDataURL('image/png'); a.download = SHARE_NAME; a.click();
  $('rSaved').textContent = t.saved;
};
$('again').onclick = () => { Events.off(engine); reset(); };

// background colour by height
const SKY = [[0, [159, 216, 255], [225, 245, 255]], [150, [255, 170, 120], [255, 220, 170]], [300, [70, 40, 110], [200, 110, 140]], [500, [8, 10, 30], [30, 30, 70]]];
function sky(h) {
  let i = 0; while (i < SKY.length - 2 && h > SKY[i + 1][0]) i++;
  const [h0, a0, b0] = SKY[i], [h1, a1, b1] = SKY[i + 1], k = Math.max(0, Math.min(1, (h - h0) / (h1 - h0)));
  const m = (x, y) => x.map((v, j) => Math.round(v + (y[j] - v) * k));
  return [m(a0, a1), m(b0, b1), k + i];
}
const stars = Array.from({ length: 70 }, () => ({ x: Math.random() * VW, y: Math.random(), r: Math.random() * 1.5 + .4 }));

// physics runs at a fixed 60 steps/s whatever the display rate (30/60/120/144Hz);
// drawing interpolates the ball between the last two steps so high-Hz screens stay smooth
const STEP = 1000 / 60;
let lastBg = '', acc = 0, last = performance.now(), tAnim = 0, simT = 0, prevPos = { x: 0, y: 0 }, drawPos = { x: 0, y: 0 };
function step() {
  prevPos = { x: ball.position.x, y: ball.position.y };
  simT += STEP;
  for (const w of walls) Body.setPosition(w, { x: w.position.x, y: camY + H / 2 });
  engine.gravity.y = 1 + Math.min(maxH / 500, 0.7);
  for (const r of rocks) if (r.drift) { const d = r.drift; Body.setPosition(r, { x: Math.max(30, Math.min(VW - 30, d.x0 + Math.sin(simT / 1000 * d.sp + d.ph) * d.amp)), y: r.position.y }); }
  Engine.update(engine, STEP);
  if (line && line.used) { line.t += STEP; if (line.t > 350) { Composite.remove(engine.world, line.body); line = null; } }
  maxH = Math.max(maxH, (startY - ball.position.y) / PX_PER_M);
  trail.push({ x: ball.position.x, y: ball.position.y }); if (trail.length > 14) trail.shift();
}
function frame(now) {
  const dt = Math.min(50, now - last); last = now; tAnim += dt;
  if (state === 'play') {
    acc += dt;
    while (acc >= STEP && state === 'play') { step(); acc -= STEP; }
    const k = acc / STEP;
    drawPos = { x: prevPos.x + (ball.position.x - prevPos.x) * k, y: prevPos.y + (ball.position.y - prevPos.y) * k };
    camY = Math.min(camY, drawPos.y - H * 0.45);
    if (ball.position.y > camY + H + BALL_R * 2) gameOver();
  } else drawPos = { x: ball.position.x, y: ball.position.y };
  for (let i = pops.length - 1; i >= 0; i--) { pops[i].t += dt; if (pops[i].t > 300) pops.splice(i, 1); }
  genRocks(); draw(); requestAnimationFrame(frame);
}

function draw() {
  const hNow = (startY - (camY + H * 0.45)) / PX_PER_M;
  const [top, bot, phase] = sky(hNow);
  const g = ctx.createLinearGradient(0, 0, 0, H);

    ctx.strokeStyle = 'rgba(120,70,20,.5)'; for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(i * r * 0.45, -h / 2 + 2); ctx.lineTo(i * r * 0.45 + 4, h / 2 - 2); ctx.stroke(); }
    ctx.fillStyle = '#5a3a1a'; ctx.beginPath(); ctx.ellipse(w / 2 - h * 0.25, 0, h * 0.12, h * 0.25, 0, 0, 7); ctx.fill();
  } else if (b.kind === 'sushi') {
    const w = r * 2.2, h = r * 1.1; rr(-w / 2, -h / 2 + h * 0.2, w, h * 0.8, r * 0.3); ctx.fillStyle = '#fbfbf5'; ctx.fill(); ctx.strokeStyle = '#ddd'; ctx.stroke();
    rr(-w / 2 - 2, -h / 2, w + 4, h * 0.5, r * 0.25); ctx.fillStyle = '#e8394a'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2; for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(i * r * 0.6 - 5, -h / 2 + 2); ctx.lineTo(i * r * 0.6 + 5, -h / 2 + h * 0.45); ctx.stroke(); }
  } else if (b.kind === 'donut') {
    const R = r * 0.9, ring = (o, i) => { ctx.beginPath(); ctx.arc(0, 0, o, 0, 7); ctx.moveTo(i, 0); ctx.arc(0, 0, i, 0, 7, true); };
    ctx.fillStyle = '#d99a52'; ring(R, R * 0.32); ctx.fill('evenodd');
    ctx.fillStyle = '#ff8fc2'; ring(R * 0.85, R * 0.4); ctx.fill('evenodd');
    const cs = ['#fff', '#5ad', '#fd4', '#6c6']; for (let i = 0; i < 10; i++) { const a = i * 2.4, d = R * (0.5 + (i % 3) * 0.12); ctx.fillStyle = cs[i % 4]; ctx.save(); ctx.translate(Math.cos(a) * d, Math.sin(a) * d); ctx.rotate(a * 3); ctx.fillRect(-4, -1.5, 8, 3); ctx.restore(); }
  } else { // teeth (dentures)
    const R = r * 0.9; ctx.fillStyle = '#f08aa0'; ctx.beginPath(); ctx.ellipse(0, -R * 0.15, R, R * 0.75, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#c0405e'; ctx.beginPath(); ctx.ellipse(0, 0, R * 0.7, R * 0.12, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#fffef6'; ctx.strokeStyle = '#ccc'; ctx.lineWidth = 1.5;
    for (const sy of [-1, 1]) for (let i = -3; i <= 3; i++) { const tw = R * 0.22; rr(i * tw - tw / 2, sy < 0 ? -R * 0.1 - R * 0.32 : R * 0.1, tw - 1, R * 0.32, 3); ctx.fill(); ctx.stroke(); }
  }
  ctx.restore();
}
// green onion (the trampoline): roots at the start point, leaves at the end point
function drawTramp(a, b, sag, alpha, len) {
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, l = Math.hypot(b.x - a.x, b.y - a.y) || 1;
  const nx = -(b.y - a.y) / l, ny = (b.x - a.x) / l;
  const cx = mx + nx * sag, cy = my + ny * sag;
  const g = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
  g.addColorStop(0, '#f6f8ee'); g.addColorStop(0.55, '#eef5d8'); g.addColorStop(0.68, '#8fcf4a'); g.addColorStop(1, '#3f9a2c');
  ctx.save(); ctx.globalAlpha *= alpha; ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(60,80,40,.35)'; ctx.lineWidth = 12;
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.quadraticCurveTo(cx, cy, b.x, b.y); ctx.stroke();
  ctx.strokeStyle = g; ctx.lineWidth = 9;
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.quadraticCurveTo(cx, cy, b.x, b.y); ctx.stroke();
  // roots
  const ux = (a.x - b.x) / l, uy = (a.y - b.y) / l;
  ctx.strokeStyle = '#d9cfa8'; ctx.lineWidth = 1.5;
  for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(a.x + ux * 9 + nx * i * 3, a.y + uy * 9 + ny * i * 3); ctx.stroke(); }
  // split leaf tip
  ctx.strokeStyle = '#3f9a2c'; ctx.lineWidth = 4;
  for (const sd of [-1, 1]) { ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - ux * 12 + nx * sd * 6, b.y - uy * 12 + ny * sd * 6); ctx.stroke(); }
  ctx.restore();
}
