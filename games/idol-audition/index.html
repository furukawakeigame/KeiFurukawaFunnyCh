<body>
  <header>
    <a id="back" href="../../">← トップへ戻る</a>
    <button id="sound" aria-label="sound"></button>
    <select id="lang" aria-label="Language"><option value="ja">日本語</option><option value="ko">한국어</option><option value="en">English</option><option value="th">ไทย</option></select>

  <div id="stage"><canvas id="cv"></canvas><div id="result"><b></b></div><div id="msg"></div></div>

  <script>
    const SHARE_URL = 'https://keifurukawafunnych.com/games/idol-audition/';
    const cv = document.getElementById('cv'), g = cv.getContext('2d');
    const stageEl = document.getElementById('stage'), controls = document.getElementById('controls');
    const resultEl = document.getElementById('result');
    const catImg = new Image(); catImg.src = 'cat.png';

    // ---------- 言語 ----------
    const store = {
      get(k, d) { try { const v = localStorage.getItem('idol-audition:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
      set(k, v) { try { localStorage.setItem('idol-audition:' + k, JSON.stringify(v)); } catch {} },
    };
    const autoLang = () => { for (const l of navigator.languages?.length ? navigator.languages : [navigator.language || '']) { const c = l.toLowerCase().slice(0, 2); if (['ja', 'ko', 'en', 'th'].includes(c)) return c; } return 'en'; };
    const TAG = ' #アイドルオーディションゲーム';
    const enNum = n => n >= 100 ? `${(n / 100).toFixed(2)}M` : `${n * 10}K`;
    const DICT = {
      ja: {
        title: 'アイドルオーディション', back: '← トップへ戻る', pass: '合格', fail: '不合格', again: 'もう一度', post: 'Xに投稿',
        sales: n => `${n}万枚`,
        share: n => `4人組アイドルがデビューして${n}万枚売れた` + TAG,
      },
      ko: {
        title: '아이돌 오디션', back: '← 처음으로', pass: '합격', fail: '불합격', again: '다시 하기', post: 'X에 게시',
        sales: n => `${n}만 장`,
        share: n => `4인조 아이돌이 데뷔해서 ${n}만 장 팔렸다` + TAG,
      },
      en: {
        title: 'Idol Audition', back: '← Back to top', pass: 'Pass', fail: 'Fail', again: 'Play again', post: 'Post on X',
        sales: n => `${enNum(n)} copies`,
        share: n => `My 4-member idol group debuted and sold ${enNum(n)} copies` + TAG,
      },
      th: {
        title: 'ออดิชันไอดอล', back: '← กลับหน้าแรก', pass: 'ผ่าน', fail: 'ไม่ผ่าน', again: 'เล่นอีกครั้ง', post: 'โพสต์ลง X',
        sales: n => `${(n * 10000).toLocaleString('en-US')} แผ่น`,
        // ไทย: ประธาน → กริยา → จำนวน
        share: n => `ไอดอลวง 4 คนเดบิวต์แล้วขายได้ ${(n * 10000).toLocaleString('en-US')} แผ่น` + TAG,
      },
    };
    let lang = store.get('lang', null) || autoLang();
    const t = k => DICT[lang][k];
    const langSel = document.getElementById('lang');
    langSel.value = lang;
    langSel.addEventListener('change', () => { lang = langSel.value; store.set('lang', lang); applyLang(); });
    function applyLang() {
      document.documentElement.lang = lang;
      document.title = t('title');
      document.getElementById('back').textContent = t('back');
      renderControls();
      if (state === 'count' || state === 'result') showSales(state === 'result' ? sales : shownSales);
      if (state === 'result') prepareShare();
    }

    // ---------- 音 ----------
    let soundOn = store.get('sound', true);
    const soundBtn = document.getElementById('sound');
    const drawSoundBtn = () => {
      soundBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>${soundOn ? '<path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>' : '<path d="M17 9l5 6M22 9l-5 6"/>'}</svg>`;
    };
    drawSoundBtn();
    soundBtn.addEventListener('click', () => { soundOn = !soundOn; store.set('sound', soundOn); drawSoundBtn(); if (master) master.gain.value = soundOn ? 1 : 0; if (!soundOn && cand) stopSpeech(cand); });
    let ac = null, master = null, noiseBuf = null;
    // iPhone の消音モード（マナーモード）でも鳴らす
    function unmuteIOS() {
      try { if (navigator.audioSession) { navigator.audioSession.type = 'playback'; return; } } catch {}
      try {
        const n = 4410, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
        const w = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
        w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
        v.setUint32(24, 44100, true); v.setUint32(28, 88200, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
        const a = document.createElement('audio');
        a.src = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' })); a.loop = true; a.setAttribute('playsinline', '');
        a.play().catch(() => {});
      } catch {}
    }
    function initAudio() {
      if (ac) return false;
      unmuteIOS();
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        const comp = ac.createDynamicsCompressor(); comp.connect(ac.destination);
        master = ac.createGain(); master.gain.value = soundOn ? 1 : 0; master.connect(comp);
        noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
        const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        const o = ac.createOscillator(), z = ac.createGain(); z.gain.value = 0;
        o.connect(z).connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.05);

      } catch { ac = null; return false; }
      return true;
    }
    // 声: のこぎり波（声帯）＋息を、母音ごとの共鳴（フォルマント）に通す
    const VOWEL = { a: [800, 1200, 2700], i: [320, 2400, 3100], u: [360, 1300, 2600], e: [520, 1950, 2700], o: [520, 880, 2600] };
    function vnote(dest, at, dur, f, f2, v1, v2, vol, o = {}) {
      const k = o.k || 1.12, vib = o.vib ?? 0.015, breath = o.breath ?? 0.1;
      const osc = ac.createOscillator(); osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(f, at);
      if (f2 && f2 !== f) osc.frequency.exponentialRampToValueAtTime(f2, at + dur);
      const lfo = ac.createOscillator(); lfo.frequency.value = o.rate || 5.6;
      const lg = ac.createGain(); lg.gain.value = f * vib; lfo.connect(lg).connect(osc.frequency);
      const src = ac.createGain(); osc.connect(src);
      const ns = ac.createBufferSource(); ns.buffer = noiseBuf; ns.loop = true;
      const ng = ac.createGain(); ng.gain.value = breath; ns.connect(ng).connect(src);
      const out = ac.createGain();
      out.gain.setValueAtTime(0.0001, at);
      out.gain.linearRampToValueAtTime(vol, at + Math.min(0.03, dur * 0.3));
      out.gain.setValueAtTime(vol, at + dur * 0.72);
      out.gain.exponentialRampToValueAtTime(0.0008, at + dur);
      [[1, 6], [0.55, 9], [0.22, 9]].forEach(([amp, q], fi) => {
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = q;
        bp.frequency.setValueAtTime(VOWEL[v1][fi] * k, at);
        bp.frequency.linearRampToValueAtTime(VOWEL[v2][fi] * k, at + dur * 0.8);
        const gg = ac.createGain(); gg.gain.value = amp * 3;
        src.connect(bp).connect(gg).connect(out);
      });
      out.connect(dest);
      const end = at + dur + 0.03;
      osc.start(at); lfo.start(at); ns.start(at, Math.random()); osc.stop(end); lfo.stop(end); ns.stop(end);
    }
    function env(gn, at, vol, atk, dur) { gn.gain.setValueAtTime(0.0001, at); gn.gain.linearRampToValueAtTime(vol, at + atk); gn.gain.exponentialRampToValueAtTime(0.0008, at + dur); }
    function noiseHit(dest, at, dur, vol, type, freq, q = 1) {
      const s = ac.createBufferSource(); s.buffer = noiseBuf;
      const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.value = freq; fl.Q.value = q;
      const gn = ac.createGain(); env(gn, at, vol, 0.003, dur);
      s.connect(fl).connect(gn).connect(dest); s.start(at, Math.random()); s.stop(at + dur + 0.02);
    }
    function oscHit(dest, at, type, f0, f1, dur, vol, atk = 0.004) {
      const o = ac.createOscillator(); o.type = type;
      o.frequency.setValueAtTime(f0, at); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, at + dur);
      const gn = ac.createGain(); env(gn, at, vol, atk, dur);
      o.connect(gn).connect(dest); o.start(at); o.stop(at + dur + 0.02);
    }
    const kick = (d, at, v = 0.55) => oscHit(d, at, 'sine', 150, 42, 0.2, v);
    const hat = (d, at, v = 0.07) => noiseHit(d, at, 0.05, v, 'highpass', 7500);
    const snare = (d, at, v = 0.16) => { noiseHit(d, at, 0.15, v, 'bandpass', 1800, 0.7); oscHit(d, at, 'triangle', 200, 150, 0.08, v * 0.8); };
    function bass(d, at, dur, f, v = 0.2) {
      const o = ac.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700;
      const gn = ac.createGain(); env(gn, at, v, 0.01, dur);
      o.connect(lp).connect(gn).connect(d); o.start(at); o.stop(at + dur + 0.02);
    }
    function pad(d, at, dur, fs, v = 0.03) {
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1100;
      const gn = ac.createGain(); gn.gain.setValueAtTime(0.0001, at); gn.gain.linearRampToValueAtTime(v, at + 0.06); gn.gain.setValueAtTime(v, at + dur * 0.8); gn.gain.exponentialRampToValueAtTime(0.0008, at + dur);
      lp.connect(gn).connect(d);
      for (const f of fs) for (const det of [-6, 6]) { const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = det; o.connect(lp); o.start(at); o.stop(at + dur + 0.02); }
    }
    // 鈴の音（キラッ）
    const chime = (d, at, base = 1320, v = 0.12) => { [[1, 1], [2.76, 0.5], [5.4, 0.25]].forEach(([r, a]) => oscHit(d, at, 'sine', base * r, base * r, 0.9 / r ** 0.3, v * a, 0.002)); };
    // ハンコの「ドン」: 短いノイズを共鳴に通した打撃＋低い胴鳴り
    function stampSnd() {
      if (!ac) return;
      const at = ac.currentTime + 0.01;
      for (const [f, q, v] of [[420, 6, 0.5], [900, 8, 0.25], [2100, 5, 0.12]]) noiseHit(master, at, 0.08, v, 'bandpass', f, q);
      oscHit(master, at, 'sine', 110, 45, 0.25, 0.6);
    }
    function passSnd(f0) {
      if (!ac) return;
      const at = ac.currentTime + 0.02;
      [523, 659, 784, 1047].forEach((f, i) => { oscHit(master, at + i * 0.07, 'triangle', f, f, 0.35, 0.12); });
      chime(master, at + 0.3, 1568, 0.1);
      // やったー！
      vnote(master, at + 0.15, 0.13, f0 * 1.25, f0 * 1.3, 'a', 'a', 0.5, { vib: 0.01 });
      vnote(master, at + 0.32, 0.1, f0 * 1.35, f0 * 1.35, 'a', 'a', 0.5, { vib: 0.01 });
      vnote(master, at + 0.46, 0.5, f0 * 1.5, f0 * 1.75, 'a', 'a', 0.5, { vib: 0.03 });
    }
    function failSnd(f0) {
      if (!ac) return;
      const at = ac.currentTime + 0.02;
      oscHit(master, at, 'triangle', 392, 392, 0.3, 0.14); oscHit(master, at + 0.22, 'triangle', 311, 300, 0.5, 0.14);
      // しくしく
      vnote(master, at + 0.25, 0.45, f0 * 1.15, f0 * 0.82, 'u', 'e', 0.3, { vib: 0.06, rate: 7, breath: 0.25 });
      vnote(master, at + 0.78, 0.55, f0 * 1.05, f0 * 0.75, 'u', 'u', 0.25, { vib: 0.07, rate: 7, breath: 0.3 });
    }
    function cheerSnd(power) {
      if (!ac) return;
      const at = ac.currentTime + 0.02, dur = 2.6;
      const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 0.6;
      const gn = ac.createGain(); gn.gain.setValueAtTime(0.0001, at); gn.gain.linearRampToValueAtTime(0.05 + 0.3 * power, at + 0.25); gn.gain.exponentialRampToValueAtTime(0.0008, at + dur);
      s.connect(bp).connect(gn).connect(master); s.start(at); s.stop(at + dur);
      const n = 2 + Math.round(power * 12);
      for (let i = 0; i < n; i++) { const f = 480 + Math.random() * 260; vnote(master, at + Math.random() * 1.2, 0.3 + Math.random() * 0.3, f, f * (1.1 + Math.random() * 0.3), 'a', Math.random() < 0.5 ? 'a' : 'e', 0.06 + power * 0.06, { vib: 0.03, k: 1.2 }); }
    }
    let lastTick = 0;
    const tick = () => { if (!ac) return; const now = ac.currentTime; if (now - lastTick < 0.05) return; lastTick = now; oscHit(master, now + 0.005, 'square', 1900, 1900, 0.025, 0.035); };

    // ---------- 曲 ----------
    const BEAT = 60 / 128, SONG0 = 3.9, C4 = 261.63;
    const semi = s => C4 * 2 ** (s / 12);
    const CHORDS = [[0, 4, 7], [-3, 0, 4], [-7, -3, 0], [-5, -1, 2]]; // C Am F G
    const ROOTS = [0, -3, 5, 7];
    const PHRASES = [
      [[7, 0, 1], [9, 1, .5], [7, 1.5, .5], [4, 2, 1], [9, 3, 1], [5, 4, 1], [9, 5, 1], [7, 6, 1.5], [11, 7.5, .5]],
      [[0, 0, .5], [4, .5, .5], [7, 1, 1], [12, 2, 1], [9, 3, 1], [9, 4, .5], [7, 4.5, .5], [5, 5, 1], [2, 6, 1], [7, 7, 1]],
      [[12, 0, 1.5], [11, 1.5, .5], [9, 2, 1], [7, 3, 1], [5, 4, 1], [4, 5, 1], [2, 6, .5], [4, 6.5, .5], [7, 7, 1]],
      [[4, 0, .5], [7, .5, .5], [9, 1, 1], [7, 2, .5], [4, 2.5, .5], [0, 3, 1], [5, 4, .5], [9, 4.5, .5], [12, 5, 1], [11, 6, 1], [7, 7, 1]],
    ];
    const SCALE = [0, 2, 4, 5, 7, 9, 11];
    // 3度下のハモり
    const third = s => { const o = Math.floor(s / 12), r = ((s % 12) + 12) % 12; let i = SCALE.indexOf(r); if (i < 0) i = 0; i -= 2; let oo = o; if (i < 0) { i += 7; oo--; } return SCALE[i] + oo * 12; };
    function backing(ev, t0, beats, loud = 1) {
      for (let b = 0; b < beats; b++) {
        const tb = t0 + b * BEAT;
        ev.push({ k: 'kick', t: tb, v: 0.5 * loud });
        ev.push({ k: 'hat', t: tb + BEAT / 2, v: 0.06 * loud });
        if (b % 2) ev.push({ k: 'snare', t: tb, v: 0.15 * loud });
        if (b % 2 === 0) { const ci = (b / 2) % 4; ev.push({ k: 'pad', t: tb, d: BEAT * 2, fs: CHORDS[ci].map(s => semi(s - 12)), v: 0.022 * loud }); ev.push({ k: 'bass', t: tb, d: BEAT * 0.9, f: semi(ROOTS[ci] - 24), v: 0.2 * loud }); ev.push({ k: 'bass', t: tb + BEAT, d: BEAT * 0.9, f: semi(ROOTS[ci] - 24), v: 0.16 * loud }); }
      }
    }
    function playEvents(list, dest, fromT, voice, toT = Infinity) {
      if (!ac) return;
      const base = ac.currentTime + 0.04;
      for (const e of list) {
        if (e.t < fromT - 0.001 || e.t >= toT) continue;
        const at = base + e.t - fromT;
        switch (e.k) {
          case 'syl': vnote(dest, at, e.d, e.f, e.f2, e.v1, e.v2, e.vol, { k: voice.k, breath: voice.breath, vib: e.vib ?? 0.012 }); break;
          case 'note': vnote(dest, at, e.d, e.f, e.f * (e.bend || 1), e.v, e.v, e.vol, { k: voice.k, breath: voice.breath, vib: e.vib }); break;
          case 'kick': kick(dest, at, e.v); break;
          case 'hat': hat(dest, at, e.v); break;
          case 'snare': snare(dest, at, e.v); break;
          case 'bass': bass(dest, at, e.d, e.f, e.v); break;
          case 'pad': pad(dest, at, e.d, e.fs, e.v); break;
          case 'chime': chime(dest, at, 1568, 0.12); chime(dest, at + 0.12, 2093, 0.08); break;
          case 'fallsnd': noiseHit(dest, at, 0.12, 0.3, 'lowpass', 500); oscHit(dest, at, 'sine', 120, 50, 0.2, 0.4); break;
        }
      }
    }

    function drawStamp(st) {

    // ---------- デビューライブ ----------

    function drawDebut(dt) {

    // ---------- ゲーム進行 ----------
    const TOTAL = 12;

    // ---------- 操作 ----------
    const SVG_O = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4"><circle cx="12" cy="12" r="8.5"/></svg>';

      const f = document.createElement('button'); f.className = 'fail'; f.innerHTML = SVG_X + `<span>${t('fail')}</span>`;
      f.dataset.act = 'fail';
      const p = document.createElement('button'); p.className = 'pass'; p.innerHTML = SVG_O + `<span>${t('pass')}</span>`;
      p.dataset.act = 'pass';
      const busy = !(state === 'aud' && cand && cand.phase === 'perf');
      f.disabled = busy || !canFail(); p.disabled = busy;
      f.addEventListener('click', () => decide(false));
      p.addEventListener('click', () => decide(true));
      controls.append(f, p);
    }
    // 最初のタップ: 音を準備し、1人目の自己紹介を声つきで最初からやり直す
    addEventListener('pointerdown', e => {
      unlockSpeech();
      const fresh = initAudio();
      if (!fresh || state !== 'aud' || !cand || cand.audio) return;
      if (e.target.closest && e.target.closest('#controls button, header')) { cand.audio = true; return; }
      restartWithVoice();
    }, { capture: true });
    function restartWithVoice() {
      stopSpeech(cand); cand.sp = null; cand.rest = false; cand.talked = false;
      cand.t = 0; cand.lastDx = 0; parts.length = 0; cand.audio = true;
      cand.bus = newBus(); playEvents(cand.ev, cand.bus, 0, cand, TALK_END);
    }
    addEventListener('keydown', e => {
      if (e.target.tagName === 'SELECT') return;
      unlockSpeech();
      const fresh = initAudio();
      if (e.key === 'ArrowRight' || e.key === 'Enter') { if (state === 'aud') decide(true); }
      else if (e.key === 'ArrowLeft') { if (state === 'aud') decide(false); }
      else if (fresh && state === 'aud' && cand && !cand.audio) restartWithVoice();
    });

    // ---------- 結果画像 ----------
    let snap = null, shareCache = null, needSnap = false;
    function takeSnap() {
      const side = Math.min(cv.width, cv.height);
      const fx = (R.x + R.w / 2) * dpr, fy = (L.dFloor - L.ds * GIRL_H * 0.35) * dpr;
      const sx = clamp(fx - side / 2, 0, cv.width - side), sy = clamp(fy - side / 2, 0, cv.height - side);
      snap = document.createElement('canvas'); snap.width = snap.height = 1080;
      snap.getContext('2d').drawImage(cv, sx, sy, side, side, 0, 0, 1080, 1080);
      shareCache = null;
    }
    function resultImage() {
      if (!snap) return null;
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const x = c.getContext('2d');
      x.drawImage(snap, 0, 0);
      x.textAlign = 'center'; x.fillStyle = '#fff'; x.lineJoin = 'round';
      const font = px => `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans Thai", sans-serif`;
      const text = (str, y, px, max) => {
        x.font = font(px);
        const w = x.measureText(str).width; if (w > max) { px *= max / w; x.font = font(px); }
        x.lineWidth = px * .16; x.strokeStyle = '#a3285a'; x.strokeText(str, 540, y); x.fillText(str, 540, y);
      };
      text(t('title'), 92, 58, 900);
      text(t('sales')(sales), 980, 150, 980);
      return c;
    }
    function prepareShare() {
      if (!snap) return;
      const key = lang;
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'idol-audition.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;

    // アイコン作成用（ゲームの絵を使う）
    window.__icon = (size = 512) => {
      const c = document.createElement('canvas'); c.width = c.height = size;
      const x = c.getContext('2d');
      const gr = x.createLinearGradient(0, 0, 0, size); gr.addColorStop(0, '#24123e'); gr.addColorStop(1, '#6a2f8a');
      x.fillStyle = gr; x.fillRect(0, 0, size, size);
      const rg = x.createRadialGradient(size / 2, size * 0.3, 0, size / 2, size * 0.3, size * 0.6);
      rg.addColorStop(0, 'rgba(255,245,220,.55)'); rg.addColorStop(1, 'rgba(255,245,220,0)');
      x.fillStyle = rg; x.fillRect(0, 0, size, size);
      const m = { type: 0, st: { vis: 5, ind: 4, song: 5, dance: 5, talk: 5 }, hair: '#f4a3c4', skin: '#ffe3d2', acc: 'star' };
      const old = g; const sc = size / 165;
      drawGirl(x, m, { x: size * 0.46, y: size * 1.28, s: sc, eyes: 'open', mouth: 0.7, armL: 0.3, armR: 2.0, bendR: 1.6, peace: 1 });
      x.fillStyle = '#fff'; for (const [a, b, r] of [[0.15, 0.2, 0.05], [0.85, 0.18, 0.04], [0.12, 0.62, 0.03]]) star4(x, size * a, size * b, size * r);
      x.save(); x.translate(size * 0.76, size * 0.76); x.rotate(-0.15); x.strokeStyle = '#ff2f6b'; x.lineWidth = size * 0.045; x.beginPath(); x.arc(0, 0, size * 0.17, 0, 7); x.stroke(); x.restore();
      void old;
      return c.toDataURL('image/png');
    };

    // ---------- ループ ----------
    let last = performance.now();
    function loop(ts) {
      const dt = Math.min(0.05, (ts - last) / 1000); last = ts;
      now += dt;
      stepGame(dt);
      stepParts(dt);
      draw(dt);
      if (needSnap) { needSnap = false; takeSnap(); prepareShare(); }
      requestAnimationFrame(loop);
    }
    renderControls();
    resize();
    start();
    applyLang();
    draw(0);
    requestAnimationFrame(ts => { last = ts; loop(ts); });
  </script>
</body>
</html>
