  <style>
    html, body { margin: 0; height: 100%; background: #f3ebe0; color: #6b3d22; }

      padding-bottom: calc(80px + env(safe-area-inset-bottom));

    .pill {

      background: #fffaf3; color: #6b3d22; font: inherit; font-size: 15px; font-weight: bold;

<script type="module">

// ---- 音 ----
let soundOn = store.get('sound', true);
const SPK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>';
const updateSoundBtn = () => {

    ? '<path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg>'
    : '<path d="M16 9l5 6"/><path d="M21 9l-5 6"/></svg>');

$('sound').onclick = () => { soundOn = !soundOn; store.set('sound', soundOn); updateSoundBtn(); if (!soundOn) sizzle(0); };

let actx = null, sizG = null;

    if (!sizG) {

// ---- 画面モード ----
let mode = 'start'; // start | paint | burn | done
function setMode(m) {

  for (const [id, mm] of [['barStart', 'start'], ['barPaint', 'paint'], ['barBurn', 'burn'], ['barDone', 'done']]) $(id).classList.toggle('hide', m !== mm);
  $('cancel').classList.toggle('hide', true);
  if (m === 'paint') { erasing = false; $('erase').classList.remove('on'); updateDone(); }

  if (m !== 'burn') { pressing = false; sizzle(0); }
  if (m === 'done') { camAzT = 0; applyLang(); }
  if (m === 'burn') $('finish').disabled = burnT <= 0;
}

// ---- 画像選択 ----
let img = null, mask = null, mctx = null;
$('pick').onclick = () => $('file').click();
$('again').onclick = () => { resetManju(); setMode('start'); $('file').click(); };
$('file').onchange = e => { loadFile(e.target.files[0]); e.target.value = ''; };
function loadFile(f) {
  if (!f || !f.type.startsWith('image/')) return;
  const u = URL.createObjectURL(f), im = new Image();
  im.onload = () => {
    URL.revokeObjectURL(u);

    img.width = Math.max(1, Math.round(im.width * k)); img.height = Math.max(1, Math.round(im.height * k));

}

// ---- 切り抜き（塗った所だけ使う。タピオカメーカーと同じ） ----
const cut = $('cut'), cx = cut.getContext('2d');

$('brush').onclick = () => {

  const d = $('brush').firstChild; d.style.width = d.style.height = [5, 11, 20][brushIdx] + 'px';

$('erase').onclick = () => { erasing = !erasing; $('erase').classList.toggle('on', erasing); };

// ---- 3D ----
const gl = $('gl');
const renderer = new THREE.WebGLRenderer({ canvas: gl, antialias: true, preserveDrawingBuffer: true });

renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf3ebe0);

const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
const camTarget = new THREE.Vector3(0, 0.45, 0);
let camAz = 0, camAzT = 0, camEl = 0.8, camDist = 6.5;

  camera.position.set(camTarget.x + camDist * Math.sin(camAz) * Math.cos(camEl), camTarget.y + camDist * Math.sin(camEl), camTarget.z + camDist * Math.cos(camAz) * Math.cos(camEl));

scene.add(new THREE.HemisphereLight(0xffffff, 0xd8c8b0, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);

sun.shadow.mapSize.set(1024, 1024); sun.shadow.camera.left = sun.shadow.camera.bottom = -4; sun.shadow.camera.right = sun.shadow.camera.top = 4;

const PLATE_R = 2.4, TABLE_Y = -0.14;
const plate = new THREE.Mesh(new THREE.CylinderGeometry(PLATE_R, PLATE_R * 0.8, 0.14, 72),
  new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.25, clearcoat: 1, clearcoatRoughness: 0.1 }));
plate.position.y = -0.07; plate.receiveShadow = true; plate.castShadow = true; scene.add(plate);
const table = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: 0x8a5a3a, roughness: 0.8 }));
table.rotation.x = -Math.PI / 2; table.position.y = TABLE_Y; table.receiveShadow = true; scene.add(table);

function resize() {
  const r = $('stage').getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / Math.max(1, r.height);
  camera.fov = camera.aspect < 0.8 ? 44 : 36;
  camDist = Math.max(6.2, 2.7 / (Math.tan(camera.fov * Math.PI / 360) * camera.aspect));
  camera.updateProjectionMatrix();

// ---- まんじゅうの皮（上から見た平面に貼る絵） ----
const R = 1.5, TEX = 1024;
const base = document.createElement('canvas'); base.width = base.height = TEX;
{
  const g = base.getContext('2d');
