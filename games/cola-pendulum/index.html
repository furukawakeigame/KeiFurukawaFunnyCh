      $('rCount').textContent = t('unit')(score);
      $('rBest').textContent = lastNew && score > 0 ? t('newBest') : t('best')(best);
      $('rBest').classList.toggle('new', lastNew && score > 0);
      const a = $('post');
      a.textContent = t('post');
      a.href = shareIntent(); prepareShare();
      if (matchMedia('(pointer: coarse)').matches) { a.removeAttribute('target'); a.removeAttribute('rel'); }
      else { a.target = '_blank'; a.rel = 'noopener'; }
    }
    $('retry').addEventListener('click', reset);

    // ---------- 投稿用の結果画像：てっぺんの景色に高さを大きく重ねる ----------
    let snap = null, wantSnap = false, shareFile = null, shareKey = '';
    const SHARE_NAME = 'cola-pendulum.png';
    function resultImage() {
      const S = 1080, c = document.createElement('canvas'); c.width = c.height = S; const g = c.getContext('2d');
      g.fillStyle = '#' + skyAt(Math.max(0, apexAlt)).getHexString(); g.fillRect(0, 0, S, S);
      if (snap) { const k = Math.max(S / snap.width, S / snap.height); g.drawImage(snap, (S - snap.width * k) / 2, (S - snap.height * k) / 2, snap.width * k, snap.height * k); }
      const gr = g.createLinearGradient(0, S * 0.45, 0, S); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.6)'); g.fillStyle = gr; g.fillRect(0, 0, S, S);
      g.textAlign = 'center'; g.fillStyle = '#fff'; g.shadowColor = 'rgba(0,0,0,.45)'; g.shadowBlur = 18;
      const txt = t('unit')(score); let fs = 170; g.font = `900 ${fs}px system-ui, sans-serif`;
      while (g.measureText(txt).width > S * 0.9 && fs > 60) { fs -= 6; g.font = `900 ${fs}px system-ui, sans-serif`; }
      g.fillText(txt, S / 2, S * 0.84);
      g.font = '800 54px system-ui, sans-serif'; g.fillText(t('title'), S / 2, S * 0.93);
      g.font = '600 30px system-ui, sans-serif'; g.globalAlpha = 0.85; g.fillText('keifurukawafunnych.com', S / 2, S * 0.975);
      return c;
    }
    function prepareShare() {
      const key = lang + ':' + score; if (key === shareKey || !snap) return;
      shareKey = key; shareFile = null;
      resultImage().toBlob(b => { if (b && shareKey === key) shareFile = new File([b], SHARE_NAME, { type: 'image/png' }); }, 'image/png');
    }
    const shareIntent = () => `https://x.com/intent/post?text=${encodeURIComponent(t('share')(score))}&url=${encodeURIComponent(SHARE_URL)}`;
    // スマホは共有シートで画像ごと渡す。PCは画像を保存してから投稿画面を開く（Webの投稿画面には画像を添付できないため）
    $('post').addEventListener('click', e => {
      const coarse = matchMedia('(pointer: coarse)').matches;
      if (coarse && typeof navigator.share === 'function') {
        e.preventDefault();
        const data = shareFile && navigator.canShare?.({ files: [shareFile] }) ? { files: [shareFile], text: `${t('share')(score)}\n${SHARE_URL}` } : { text: t('share')(score), url: SHARE_URL };
        navigator.share(data).catch(() => {});
        return;
      }
      if (coarse) return;
      const a = document.createElement('a'); a.href = resultImage().toDataURL('image/png'); a.download = SHARE_NAME; a.click();
      $('rBest').textContent = t('saved'); $('rBest').classList.remove('new');
    });

    // ---------- 操作：ボトルをつまんで持ち上げ、離すとスタート ----------
    const ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0), hit3 = new THREE.Vector3();
    function toWorld(e) {
      ray.setFromCamera(new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1), camera);
      return ray.ray.intersectPlane(plane, hit3) ? [hit3.x, hit3.y] : null;
    }
    addEventListener('pointerdown', e => {
      if (e.target.closest('header, #result') || phase !== 'ready') return;
      const w = toWorld(e); if (!w) return;
      const c = comOf();
      if (Math.hypot(w[0] - c[0], w[1] - c[1]) < 0.3) { holding = true; grab = [c[0] - w[0], c[1] - w[1]]; aim = c; }
    });
    addEventListener('pointermove', e => { if (!holding) return; const w = toWorld(e); if (w) aim = [w[0] + grab[0], Math.max(0.1, w[1] + grab[1])]; });
    const letGo = () => { if (!holding) return; holding = false; startShake(); };
    addEventListener('pointerup', letGo);
    addEventListener('pointercancel', letGo);


    // ---------- カメラと描画 ----------
    function resize() {
      const w = innerWidth, h = innerHeight;
      renderer.setSize(w, h, false); camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    addEventListener('resize', resize); resize();

    const capMesh = cap.clone(); capMesh.position.set(0, 0, 0); capMesh.scale.setScalar(BS); scene.add(capMesh);
    let prev = performance.now(), simAcc = 0, jetTick = 0, shakeDist = 5;
    function frame(now) {
      const dt = Math.max(0, Math.min(0.05, (now - prev) / 1000)); prev = now;
      // 物理は決まった刻み（1/960秒）で進める。画面の大きさやフレームレートで動きが変わらない
      simAcc += dt;
      while (simAcc >= STEP) {
        simAcc -= STEP;
        chainStep(STEP); keepEnergy(STEP);
        if (phase === 'shake') measure(STEP);
        if (phase === 'fly') flyStep(STEP);
        else if (phase === 'fall' || phase === 'done') { body.vy -= G * STEP; body.y = Math.max(0, body.y + body.vy * STEP); body.a += 0.8 * STEP; } // 噴射が止まったら落ちる
        if ((jetTick += STEP) >= 1 / 120) { // 噴射は 1/120 秒ごとに進める（フレームレートに関係なく同じ見た目）
          jetTick -= 1 / 120;
          const u = phase === 'fly' ? flyT / flyDur : 1;
          stepJet(1 / 120, phase === 'fly' ? Math.min(1, 0.4 + 0.6 * Math.min(1, CORE.fizz / FIZZ_FULL)) * (1 - 0.8 * u) : 0);
        }
        if (phase === 'fly' || phase === 'fall' || phase === 'done') stepCap(STEP);
      }
      if (phase === 'ready' || phase === 'shake') bodyFromChain();
      drawTimer(); drawPressure();
      // 振っている間はカメラ固定。飛び立ったら、ボトルの斜め上から見下ろして追う（地面や景色が下へ遠ざかって見える）
      const tv = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
      // 振り子はなるべく大きく見せつつ、どの画面サイズでもはみ出さないよう、伸びたときだけ引く
      const CY = 1.4, topUI = 110 / innerHeight * 2; // 画面上の時間バーなどの分は使わない
      let ex = 0, eUp = 0, eDown = 0;
      for (const [x, y] of P) { ex = Math.max(ex, Math.abs(x) + 0.2); eUp = Math.max(eUp, y - CY + 0.2); eDown = Math.max(eDown, CY - y + 0.2); }
      const need = Math.max(1.25 / tv / camera.aspect, 1.5 / tv, ex / tv / camera.aspect, eDown / tv, eUp / tv / (1 - topUI));
      shakeDist += (need - shakeDist) * (need > shakeDist ? 1 - Math.exp(-12 * dt) : 1 - Math.exp(-1.5 * dt)); // 引くのは速く、寄るのはゆっくり
      const dist = shakeDist;
      const fixedPos = new THREE.Vector3(0, CY + 0.15, dist), fixedLook = new THREE.Vector3(0, CY, 0);
      if (phase === 'ready' || phase === 'shake') { camera.position.copy(fixedPos); camera.lookAt(fixedLook); }
      else {
        const k = THREE.MathUtils.smoothstep(launchT, 0, 0.9); // 発射からなめらかに切り替える
        // 低い所では見下ろして地面が遠ざかるのを見せ、高くなるほど水平に向けて地平線と宇宙を見せる
        const tilt = 1 - THREE.MathUtils.smoothstep(body.y, 3000, 40000);
        const chasePos = new THREE.Vector3(body.x + 0.6, body.y + 0.2 + 0.7 * tilt, 2.4), chaseLook = new THREE.Vector3(body.x, body.y - 0.5 * tilt + 0.3 * (1 - tilt), 0);
        camera.position.lerpVectors(fixedPos.setY(Math.max(CY + 0.15, body.y + 0.15)), chasePos, k);
        camera.lookAt(fixedLook.setY(Math.max(CY, body.y)).lerp(chaseLook, k));
      }
      const alt = camera.position.y;
      scene.background.copy(skyAt(alt)); document.body.style.background = '#' + scene.background.getHexString();
      stars.material.opacity = THREE.MathUtils.smoothstep(alt, 15000, 60000); stars.position.copy(camera.position);
      drawSpeedLines(body.x, body.y, phase === 'fly' ? speed : 0, dt);
      bottle.position.set(body.x, body.y, 0); bottle.rotation.z = body.a;
      drawBubbles(phase === 'shake' || phase === 'ready' ? CORE.fizz / FIZZ_FULL * 1.6 : liquidFrac / 0.55, now);
      updateLiquid(dt);
      jetGeo.attributes.position.needsUpdate = jetGeo.attributes.color.needsUpdate = true;
      if (capFly) { capMesh.visible = true; capMesh.position.set(capFly.p[0], capFly.p[1], 0); capMesh.rotation.z = capFly.r; } else capMesh.visible = false;
      drawChain();
      renderer.render(scene, camera);
      if (wantSnap) { // てっぺんに着いた瞬間の画面を、投稿画像用に写しておく
        wantSnap = false; snap = document.createElement('canvas'); snap.width = renderer.domElement.width; snap.height = renderer.domElement.height;
        snap.getContext('2d').drawImage(renderer.domElement, 0, 0);
      }
      requestAnimationFrame(frame);
    }

    // ---------- ランキング（今日・全期間。.claude/ranking.gs を Google Apps Script で公開した URL。空なら出さない） ----------
    // ズル対策: 遊ぶ前にサーバーから整理券をもらっておき、登録の時は操作の記録を送る。サーバーは core.js と同じ計算で再生して確かめる
    const RANK_URL = 'https://script.google.com/macros/s/AKfycbyAE0TZe6QHNZHmRVlMaf2yG6FnfKSyhSrBR57AyhpkJjVmhWfHSz9mL2Tar__EUihGwA/exec';
    const GAME_ID = 'cola-pendulum';
    let dev = store.get('dev', '');
    if (!dev) { dev = Math.random().toString(36).slice(2) + Date.now().toString(36); store.set('dev', dev); }
    $('rankBtn').hidden = !RANK_URL;
    const rank = { data: null, tab: 'today', err: '', msg: '', detail: '', sent: false, me: null, busy: false, body: null };
    let sess = null;
    async function rpost(body) { const r = await fetch(RANK_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }); return await r.json(); }
    // 次の回の整理券を先にもらっておく（サーバーが混んでいたら、間をあけて取り直す。登録までに届けばよい）
    function startSession() {
      if (!RANK_URL) return;
      const me = sess = { tok: null, chain: null };
      me.chain = (async () => {
        for (let i = 0; i < 7 && sess === me; i++) {
          try { const j = await rpost({ act: 'start', game: GAME_ID, dev }); if (j.ok && j.tok) { me.tok = j.tok; return; } } catch {}
          await new Promise(r => setTimeout(r, 1500 * 2 ** Math.min(i, 3)));
        }
      })();
    }
    // 結果が出たら呼ぶ: この回の登録内容（score と操作の記録）。null なら登録できない
    function resetRank(body) { rank.sent = false; rank.me = null; rank.msg = ''; rank.detail = ''; rank.busy = false; rank.body = body; }
    function renderRank() {
      const ol = $('rkList'); ol.innerHTML = '';
      $('tabToday').classList.toggle('on', rank.tab === 'today'); $('tabAll').classList.toggle('on', rank.tab === 'all');
      $('rkNote').textContent = rank.tab === 'today' ? t('rkNote') : ''; $('rkRule').textContent = t('rkRule');
      const list = rank.data && (rank.data[rank.tab] || []);
      const row = (cls, n, name, w) => { const li = document.createElement('li'); if (cls) li.className = cls; for (const [c, v] of [['n', n], ['nm', name], ['w', rankFmt(w)]]) { const sp = document.createElement('span'); sp.className = c; sp.textContent = v; li.append(sp); } ol.append(li); };
      const empty = txt => { const li = document.createElement('li'); li.className = 'empty'; li.textContent = txt; ol.append(li); };
      if (!list) empty(rank.err || t('rkLoad'));
      else if (!list.length) empty(t('rkEmpty'));
      else list.forEach((r, i) => row(rank.me && r.name === rank.me.name && r.wave === rank.me.score ? 'me' : '', i + 1, r.name, r.wave));
      // 自分が上位10人の外なら、一覧の下に自分の順位と記録を出す（登録できたことが分かるように）
      const mine = rank.me && typeof rank.msg === 'object' && rank.msg[rank.tab];
      if (list && mine > list.length) { const g = document.createElement('li'); g.className = 'gap'; g.textContent = '…'; ol.append(g); row('me', mine, rank.me.name, rank.me.score); }
      $('rkMsg').textContent = rank.msg ? (typeof rank.msg === 'object' ? t('rkYou')(rank.msg.today, rank.msg.all) : t(rank.msg)) : '';
      $('rkDetail').textContent = rank.msg && typeof rank.msg !== 'object' && rank.msg !== 'rkCheck' ? rank.detail || '' : '';
      $('rkForm').hidden = rank.sent || !rank.body || !(rank.body.score > 0);
      $('rkSend').disabled = rank.busy;
    }
    async function loadRank() {
      rank.data = null; rank.err = ''; renderRank();
      try { const r = await fetch(`${RANK_URL}?game=${GAME_ID}`); const j = await r.json(); rank.data = { today: j.today || [], all: j.all || [] }; }
      catch { rank.err = t('rkFail'); }
      renderRank();
    }
    // ランキングを開いている間は結果を隠す（広告もいったん消える）
    $('rankBtn').onclick = () => { showResultPanel(false); $('rank').hidden = false; $('rkName').value = store.get('name', ''); loadRank(); };
    $('tabToday').onclick = () => { rank.tab = 'today'; renderRank(); };
    $('tabAll').onclick = () => { rank.tab = 'all'; renderRank(); };
    $('rkClose').onclick = () => { $('rank').hidden = true; if (inResult()) showResultPanel(true); };
    $('rkForm').onsubmit = async e => {
      e.preventDefault();
      if (rank.busy || rank.sent || !rank.body) return;
      const name = $('rkName').value.replace(/\s+/g, ' ').trim().slice(0, 8);
      if (!name) { $('rkName').focus(); return; }
      store.set('name', name);
      rank.busy = true; rank.msg = 'rkCheck'; renderRank();
      const body = { act: 'submit', game: GAME_ID, tok: '', name, dev, ...rank.body };
      try {
        const me = sess; if (me) { await me.chain; body.tok = me.tok || ''; } // 整理券がなくても送る（サーバーは「未確認」として登録する）
        const tries = []; let j = null;
        for (let i = 0; i < 3 && !j; i++) {
          try { j = await rpost(body); }
          catch (err) { tries.push('x:' + String(err && (err.message || err.name) || err).slice(0, 24)); await new Promise(r => setTimeout(r, 1000 * (i + 1))); }
        }
        if (!j) { rank.msg = 'rkFail'; rank.detail = tries.join(' '); }
        else if (j.ok) { rank.sent = true; rank.me = { name, score: body.score }; rank.data = { today: j.today || [], all: j.all || [] }; rank.msg = j.rank; rank.detail = ''; }
        else { rank.msg = j.error === 'ng' ? 'rkNg' : j.error === 'wait' ? 'rkWait' : j.error === 'replay' ? 'rkReplay' : j.error === 'dup' ? 'rkDup' : 'rkBad'; rank.detail = [j.error, ...tries].join(' '); }
      } catch { rank.msg = 'rkFail'; }
      rank.busy = false; renderRank();
    };
    $('rkName').addEventListener('keydown', e => e.stopPropagation());
    function applyRankLang() {
      $('rankBtn').textContent = t('rank'); $('rkTitle').textContent = t('rank'); $('tabToday').textContent = t('tabToday'); $('tabAll').textContent = t('tabAll');
      $('rkName').placeholder = t('rkName'); $('rkSend').textContent = t('rkSend');
      if (!$('rank').hidden) renderRank();
    }
    const rankFmt = n => t('unit')(n);
    const inResult = () => phase === 'done';
    function showResultPanel(on) { $('result').style.display = on ? 'flex' : 'none'; }
    applyLang(); reset();
    // 最初の1回だけ重くならないよう、使う質感を先に準備し、音は最初に触れたときに用意しておく
    renderer.compile(scene, camera);
    addEventListener('pointerdown', () => { if (soundOn && !ac) try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }, { once: true, capture: true });
    requestAnimationFrame(frame);
  </script>
  <!-- 結果画面の広告（../../ad.js の説明を参照） -->
  <script src="../../ad.js" data-result="#result" data-inline="#adSlot"></script>
</body>
</html>
