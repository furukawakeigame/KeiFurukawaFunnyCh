    };

    const t = k => DICT[lang][k];
    const langSel = document.getElementById('lang');

      renderControls();

    }

    // ---------- 音 ----------
    let soundOn = store.get('sound', true);
    const soundBtn = document.getElementById('sound');
    const drawSoundBtn = () => {
      soundBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>${soundOn ? '<path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>' : '<path d="M17 9l5 6M22 9l-5 6"/>'}</svg>`;
    };
    drawSoundBtn();
    soundBtn.addEventListener('click', () => { soundOn = !soundOn; store.set('sound', soundOn); drawSoundBtn(); setWater(); });
    let ac = null, waterGain = null;
    // 消音モードでも鳴らす
    function unmuteIOS() {
      try { if (navigator.audioSession) { navigator.audioSession.type = 'playback'; return; } } catch {}

        const n = 4410, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
        const w = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
        w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
        v.setUint32(24, 44100, true); v.setUint32(28, 88200, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
        const a = document.createElement('audio');
        a.src = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' })); a.loop = true; a.setAttribute('playsinline', '');
        a.play().catch(() => {});
      } catch {}
    }
    function initAudio() {
      if (ac) return;
      unmuteIOS();
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        const o = ac.createOscillator(), g = ac.createGain(); g.gain.value = 0;
        o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.05);
        // 樋を流れる水の音（ずっと鳴らす）
        const len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
        let last = 0; for (let i = 0; i < len; i++) { last = (last + 0.04 * (Math.random() * 2 - 1)) / 1.04; d[i] = last * 3.5; }
        const s = ac.createBufferSource(); s.buffer = buf; s.loop = true;
        const lp = ac.createBiquadFilter(); lp.type = 'bandpass'; lp.frequency.value = 700; lp.Q.value = 0.6;
        const lfo = ac.createOscillator(); lfo.frequency.value = 0.7; const lg = ac.createGain(); lg.gain.value = 250; lfo.connect(lg).connect(lp.frequency); lfo.start();
        waterGain = ac.createGain();
        s.connect(lp).connect(waterGain).connect(ac.destination); s.start();
        setWater();
      } catch { ac = null; }
    }
    function setWater() { if (waterGain) waterGain.gain.setTargetAtTime(soundOn ? 0.12 : 0, ac.currentTime, 0.1); }
    addEventListener('pointerdown', initAudio, { capture: true });
    addEventListener('keydown', initAudio, { capture: true });
    function tone(type, f0, f1, dur, vol, delay = 0) {
      if (!soundOn || !ac) return;
      const now = ac.currentTime + delay;
      const o = ac.createOscillator(); o.type = type;
      o.frequency.setValueAtTime(f0, now); o.frequency.exponentialRampToValueAtTime(f1, now + dur);
      const g = ac.createGain(); g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      o.connect(g).connect(ac.destination); o.start(now); o.stop(now + dur + 0.02);
    }
    // ノイズを共鳴に通す（水・木の音の元）
    function burstNoise(dur, bands, vol, delay = 0, decay = 0.3) {
      if (!soundOn || !ac) return;
      const now = ac.currentTime + delay;
      const buf = ac.createBuffer(1, Math.max(1, Math.floor(ac.sampleRate * dur)), ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (d.length * decay));
      const s = ac.createBufferSource(); s.buffer = buf;
      for (const [f, q, g0] of bands) {
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f * (0.93 + Math.random() * 0.14); bp.Q.value = q;
        const g = ac.createGain(); g.gain.value = g0 * vol; s.connect(bp).connect(g).connect(ac.destination);
      }
      s.start(now);
    }
    // 箸の「カチッ」: 細い竹が当たる高い共鳴
    const sClack = (vol = 1, delay = 0) => burstNoise(0.05, [[2600, 14, 1.4], [4300, 16, 0.8], [6900, 10, 0.4]], vol, delay, 0.12);
    // 水からすくう「ちゃぷっ」
    function sSplash(vol = 1) {
      if (!soundOn || !ac) return;
      burstNoise(0.18, [[900, 2, 0.5], [2200, 3, 0.4]], vol * 0.8, 0, 0.35);
      tone('sine', 500 + Math.random() * 200, 1400, 0.06, 0.12 * vol, 0.02);
    }
    // 器に落ちる「ぽちゃ」
    const sPlop = () => { tone('sine', 320 + Math.random() * 80, 900, 0.08, 0.16); burstNoise(0.12, [[1200, 3, 0.35]], 1, 0.01); };
    // 箸どうしがぶつかる
    const sClash = () => { sClack(1.3); sClack(1, 0.05); burstNoise(0.08, [[700, 6, 0.6]], 1, 0, 0.2); };
    // すする音: 息のノイズを、高くなっていく共鳴に通してふるわせる
    function sSlurp(dur = 0.5, vol = 0.6) {
      if (!soundOn || !ac) return;
      const now = ac.currentTime;
      const buf = ac.createBuffer(1, Math.floor(ac.sampleRate * dur), ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const s = ac.createBufferSource(); s.buffer = buf;
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 4;
      bp.frequency.setValueAtTime(700, now); bp.frequency.exponentialRampToValueAtTime(2600, now + dur);
      const g = ac.createGain(); g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(vol, now + 0.04); g.gain.setValueAtTime(vol, now + dur * 0.7); g.gain.exponentialRampToValueAtTime(0.001, now + dur);

    }
    // 声: 声帯の振動（のこぎり波＋ゆらぎ）と息を、母音ごとの共鳴（フォルマント）に通す
    const VOWEL = { a: [800, 1200, 2600], i: [300, 2300, 3000], u: [350, 1250, 2500], e: [500, 1900, 2600], o: [500, 850, 2500], g: [450, 1100, 2400] };
    function voice(f0, seq, dur, vol = 0.5, shake = 0.04, breath = 0.15, delay = 0, rise = 1.4) {
      if (!soundOn || !ac) return;
      const now = ac.currentTime + delay;
      const o = ac.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(f0 * 1.2, now);
      o.frequency.linearRampToValueAtTime(f0 * rise, now + dur * 0.15);
      o.frequency.exponentialRampToValueAtTime(f0 * 0.75, now + dur);
      const vib = ac.createOscillator(); vib.frequency.value = 5.5 + Math.random() * 3;
      const vg = ac.createGain(); vg.gain.value = f0 * shake; vib.connect(vg).connect(o.frequency);
      const nb = ac.createBuffer(1, Math.floor(ac.sampleRate * dur), ac.sampleRate), nd = nb.getChannelData(0);
      for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
      const ns = ac.createBufferSource(); ns.buffer = nb;
      const ng = ac.createGain(); ng.gain.value = breath;
      const src = ac.createGain();
      o.connect(src); ns.connect(ng).connect(src);
      const out = ac.createGain();
      out.gain.setValueAtTime(0, now);
      out.gain.linearRampToValueAtTime(vol, now + 0.02);
      out.gain.setValueAtTime(vol, now + dur * 0.55);
      out.gain.exponentialRampToValueAtTime(0.001, now + dur);

      [1, 0.6, 0.25].forEach((amp, fi) => {
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = fi === 0 ? 6 : 9;
        seq.forEach((v, si) => { const tt = now + dur * si / Math.max(1, seq.length - 1) * 0.7; bp.frequency[si ? 'linearRampToValueAtTime' : 'setValueAtTime'](VOWEL[v][fi] * k, tt); });
        const g = ac.createGain(); g.gain.value = amp * 3;

      });
      out.connect(ac.destination);
      o.start(now); vib.start(now); ns.start(now);
      o.stop(now + dur); vib.stop(now + dur); ns.stop(now + dur);
    }
    const pick = a => a[Math.floor(Math.random() * a.length)];
    // 左右の人の声の高さ（毎回少し変える）
    const F0 = [150 + Math.random() * 60, 230 + Math.random() * 70];
    const CAT_F0 = 520;

    const sCatCough = () => { for (let k = 0; k < 2; k++) voice(CAT_F0 * 0.9, ['g', 'a'], 0.18, 0.35, 0.15, 0.7, k * 0.25); };
    const sCatHappy = () => { voice(CAT_F0, ['i', 'a', 'o'], 0.45, 0.45, 0.06, 0.2); voice(CAT_F0 * 1.15, ['i', 'a', 'u'], 0.5, 0.4, 0.06, 0.2, 0.5); };

    // 夕焼け空
    scene.background = canvasTex(4, 256, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#3d5f9e'); gr.addColorStop(0.35, '#8a86c0'); gr.addColorStop(0.62, '#f2a27a'); gr.addColorStop(0.85, '#ffd49a'); gr.addColorStop(1, '#ffe9c0'); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
    scene.fog = new THREE.Fog('#f4c9a0', 18, 52);
    const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
    scene.add(new THREE.HemisphereLight('#bcd4ff', '#6a5a2a', 1.0));
    const sun = new THREE.DirectionalLight('#ffd6a0', 2.6); sun.position.set(-6, 9, 5);
    sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); sun.shadow.radius = 4; sun.shadow.bias = -0.0008;
    Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 30 });

    const mat = (c, rough = 0.75) => new THREE.MeshStandardMaterial({ color: c, roughness: rough });
    const shade = o => { o.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); return o; };
    const SPH = new THREE.SphereGeometry(1, 24, 16), CYL = new THREE.CylinderGeometry(1, 1, 1, 16);

    const rnd = (a, b) => a + Math.random() * (b - a);

      h.pv.rotation.z = 0.06 + h.open * 0.22;
      const hand = h.root.position.clone().add(dir.clone().multiplyScalar(0.9));
      const sh = SHOULDER(s);
      h.arm.position.copy(hand).add(sh).multiplyScalar(0.5);
      h.arm.scale.set(0.15, hand.distanceTo(sh) + 0.1, 0.15);
      h.arm.quaternion.setFromUnitVectors(Y, sh.clone().sub(hand).normalize());
    }

    // ---------- ゲームの状態 ----------
    const STEP = 1 / 60, GAME_T = 60, WINDOW = 0.1;
    let state = 'idle', elapsed = 0, clock = 0, nextSpawn = 0.5, endT = 0, needSnap = false, winner = -1;
    const speed = () => state === 'play' || state === 'end' ? 4.6 + 6 * Math.min(1, elapsed / GAME_T) : 4.6;
    const timerEl = document.getElementById('timer'), timerBar = timerEl.querySelector('i');
    let shownTimer = -1;
    const drawTimer = () => { const v = Math.round((1 - Math.min(1, elapsed / GAME_T)) * 300) / 300; if (v !== shownTimer) { shownTimer = v; timerBar.style.transform = `scaleX(${v})`; } };

    function clearPiles() {
      for (const b of bowls) { for (const it of b.pile) disposeItem(it); b.pile.length = 0; b.g = 0; b.mat.emissiveIntensity = 0; }
    }
    function resetHands() {
      for (const h of hands) {
        if (h.item) { disposeItem(h.item); h.item = null; }
        h.mode = 'rest'; h.t = 0; h.cool = 0; h.stun = 0;
      }
      for (const it of items) if (it.state === 'flow') { it.owner = -1; it.cpu = [undefined, undefined]; }
    }

    // すくう: そのとき近い物を狙う。相手と同時なら、ぴったりだった方が取る
    function tap(i) {
      const h = hands[i];
      if (h.mode !== 'rest' || h.stun > 0 || h.cool > 0) return;
      let best = null, bestErr = ZW;
      for (const it of items) {
        if (it.state !== 'flow') continue;
        if (it.owner >= 0 && (it.owner === i || clock - it.ownT > WINDOW)) continue;
        const err = Math.abs(it.z - ZG);
        if (err < bestErr) { bestErr = err; best = it; }
      }
      if (!best) { // 空振り
        setMode(h, 'miss'); h.target = ZG; sClack(0.8, 0.07); burstNoise(0.1, [[1500, 1, 0.3]], 0.6); return;
      }
      if (best.owner >= 0) {
        const o = hands[best.owner];
        if (bestErr < best.ownErr) { // 横取り
          setMode(o, 'clash'); o.item = null;
          best.owner = i; best.ownErr = bestErr; best.ownT = clock;
          h.item = best; setMode(h, 'reach'); sClash();
        } else { setMode(h, 'clash'); sClash(); }
        return;
      }
      best.owner = i; best.ownErr = bestErr; best.ownT = clock;
      h.item = best; setMode(h, 'reach');
    }

    function deposit(h) {
      const it = h.item; h.item = null; if (!it) return;
      const b = bowls[h.i];
      it.state = 'pile'; dropItem(it);
      const top = pileTop(h.i);
      const r = Math.min(0.32, 0.12 + b.pile.length * 0.01) * Math.sqrt(Math.random()), a = Math.random() * 6.28;
      it.g.position.set(h.s * BX + Math.cos(a) * r, top - (it.type === 'noodle' ? 0.03 : 0), BZ + Math.sin(a) * r);
      it.g.rotation.set(rnd(-0.2, 0.2), Math.random() * 6.28, rnd(-0.2, 0.2));
      if (it.type === 'noodle') it.g.scale.multiplyScalar(0.62);
      b.pile.push(it);
      sPlop();
      burst(new THREE.Vector3(h.s * BX, top, BZ), 6, ['#c09060', '#e8d0a0'], 1.2, 0.03, 0.35, 1.5);
      if (state === 'play' || state === 'end' || state === 'idle') b.g += it.grams;
      if (it.type === 'wasabi') { // むせる
        h.stun = 1.4;
        if (human[h.i]) sCough(h.i); else sCatCough();
        burst(h.handG.getWorldPosition(new THREE.Vector3()), 12, ['#b8e070', '#e8ffd0'], 1.5, 0.06, 0.8, 1);
      } else if (it.type === 'cherry') {
        burst(new THREE.Vector3(h.s * BX, top + 0.2, BZ), 14, ['#ffd23a', '#ff6a8a', '#fff'], 2, 0.04, 0.6, 2.5);
        tone('sine', 1200, 2400, 0.12, 0.08); tone('sine', 1600, 3200, 0.12, 0.06, 0.08);
      }
    }

    function stepHand(h, dt) {
      h.prevTip.copy(h.tip);
      h.t += dt;
      if (h.stun > 0) h.stun = Math.max(0, h.stun - dt);
      if (h.cool > 0) h.cool = Math.max(0, h.cool - dt);
      const s = h.s;
      let target = REST(s), k = 1;
      switch (h.mode) {
        case 'rest': h.open = Math.max(0, h.open - dt * 6); break;
        case 'reach': {
          k = h.t / DUR.reach; h.open = 1;
          target = DIP(s, h.item ? h.item.z : ZG);
          if (k >= 1) {
            if (h.item && h.item.state === 'flow') { h.item.state = 'held'; sSplash(); sClack(0.6, 0.03); burst(DIP(s, h.item.z), 8, ['#ffffff', '#bfe6f8'], 1.4, 0.035, 0.4, 2); }
            setMode(h, 'lift');
          }
          break;
        }
        case 'lift': k = h.t / DUR.lift; h.open = 0; target = UP(s); if (k >= 1) setMode(h, 'carry'); break;
        case 'carry': k = h.t / DUR.carry; target = OVER(h.i); if (k >= 1) setMode(h, 'drop'); break;
        case 'drop': {
          k = h.t / DUR.drop; target = OVER(h.i).add(new THREE.Vector3(0, -0.25, 0)); h.open = k;
          if (k >= 1) { deposit(h); setMode(h, 'back'); }
          break;
        }
        case 'back': k = h.t / DUR.back; if (k >= 1) { h.mode = 'rest'; h.cool = 0.05; } break;
        case 'miss': {
          k = h.t / DUR.miss; h.open = 1 - k;
          const half = k < 0.45;
          target = half ? DIP(s, ZG) : REST(s);
          k = half ? k / 0.45 : (k - 0.45) / 0.55;
          if (h.t === dt) h.missFrom = h.from.clone();
          if (!half && !h.missBack) { h.missBack = true; h.from.copy(h.tip); }
          if (h.t >= DUR.miss) { h.mode = 'rest'; h.missBack = false; h.cool = 0.28; }
          break;
        }
        case 'clash': {

          k = Math.min(1, k * 3);

        }

      else h.tip.copy(h.from).lerp(target, ease(k));
      if (h.mode === 'lift' || h.mode === 'carry') h.tip.y += Math.sin(Math.min(1, k) * Math.PI) * (h.mode === 'carry' ? 0.35 : 0);
    }

    // ねこ（人がいない側）は勝手にすくう
    function stepCpu(i) {
      if (human[i]) return;
      const h = hands[i];
      const k = state === 'play' ? Math.min(1, elapsed / GAME_T) : 0.3;
      for (const it of items) {
        if (it.state !== 'flow' || it.owner >= 0) continue;
        if (it.cpu[i] === undefined && it.z > ZG - ZW - 1.2) {
          const want = it.type === 'wasabi' ? 0.1 : it.type === 'cherry' ? 0.75 : 0.42 + 0.3 * k;
          it.cpu[i] = Math.random() < want ? ZG + (Math.random() + Math.random() - 1) * (0.5 - 0.2 * k) : null;
        }
        if (it.cpu[i] != null && it.z >= it.cpu[i] && Math.abs(it.z - ZG) < ZW) { if (h.mode === 'rest' && h.cool <= 0 && h.stun <= 0) tap(i); it.cpu[i] = null; }
      }
    }

    function spawnTick() {
      const k = state === 'play' ? Math.min(1, elapsed / GAME_T) : 0;
      const r = Math.random();
      spawnItem(r < 0.08 + 0.07 * k ? 'wasabi' : r < 0.16 + 0.07 * k ? 'cherry' : 'noodle');
      nextSpawn = (1.0 - 0.45 * k) * rnd(0.6, 1.4);
      if (Math.random() < 0.15 + 0.2 * k) nextSpawn = rnd(0.18, 0.3); // たまに続けて流れてくる
    }

    let splashT = 0;
    function step(dt) {
      clock += dt;
      if (state === 'play') { elapsed += dt; drawTimer(); if (elapsed >= GAME_T) { state = 'end'; endT = 0; tone('sine', 880, 440, 0.5, 0.15); } }
      if (state === 'end') { endT += dt; if ((endT > 1.2 && hands.every(h => h.mode === 'rest')) || endT > 3) finish(); }
      if (state !== 'end' && state !== 'result') { nextSpawn -= dt; if (nextSpawn <= 0) spawnTick(); }
      if (state !== 'end' && state !== 'result') { stepCpu(0); stepCpu(1); }
      const v = speed();
      waterTex.offset.y += dt * v / 2.9;
      zoneMat.opacity = 0.35 + 0.25 * Math.sin(clock * 5) + (items.some(it => it.state === 'flow' && Math.abs(it.z - ZG) < ZW) ? 0.35 : 0);
      for (let k = items.length - 1; k >= 0; k--) {
        const it = items[k];
        it.prevZ = it.z;
        if (it.state === 'flow') {
          it.z += v * dt;
          if (it.z > ZEND) { it.state = 'fall'; it.vy = 0; it.fx = 0; it.fy = axisY(ZEND) - TR + 0.1; }
        } else if (it.state === 'fall') {
          it.vy -= 9 * dt; it.fy += it.vy * dt; it.z += v * 0.4 * dt;
          if (it.fy < GY + 0.7) { burst(new THREE.Vector3(0, GY + 0.72, it.z), 6, ['#ffffff', '#bfe6f8'], 1.2, 0.03, 0.4, 1.8); disposeItem(it); items.splice(k, 1); }
        }

      // 樋の先から桶に落ちる水しぶき
      splashT -= dt; if (splashT <= 0) { splashT = 0.07; burst(new THREE.Vector3(rnd(-0.15, 0.15), GY + 0.7, ZEND + 0.6), 1, ['#ffffff', '#cfeefc'], 0.6, 0.025, 0.4, 1.4); }
      catBob = Math.max(0, catBob - dt * 4);
      stepFx(dt);
    }

    // ---------- 入力 ----------
    function input(i) {
      if (state === 'result' || state === 'end') return;
      if (!human[i]) { human[i] = true; dressHand(hands[i]); }
      if (state === 'idle') start();
      tap(i);
    }
    renderer.domElement.addEventListener('pointerdown', e => {
      e.preventDefault();
      const r = renderer.domElement.getBoundingClientRect();
      input(e.clientX - r.left < r.width / 2 ? 0 : 1);
    }, { passive: false });
    addEventListener('keydown', e => {
      if (e.repeat || e.target.closest?.('select, input')) return;
      const k = e.key.toLowerCase();
      if (k === 'a' || k === 'arrowleft') input(0);
      else if (k === 'l' || k === 'arrowright') input(1);
    });
    stage.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

    // ---------- 画面サイズ ----------
    const controls = document.getElementById('controls');
    const resultEl = document.getElementById('result');
    const CENTER = new THREE.Vector3(0, 0.75, 0.15);
    let bandPx = 0;
    function resize() {
      const w = stage.clientWidth, H = stage.clientHeight;
      renderer.setSize(w, H, false);
      if (ICON) { camera.aspect = w / H; camera.clearViewOffset(); camera.position.set(0.5, 1.75, 2.9); camera.lookAt(-0.05, 1.45, -2); camera.fov = 45; camera.updateProjectionMatrix(); placeCat(H, H, 0, 30); SH[0].set(-2.2, 2.6, 1.6); return; }
      // 下の空白とボタンの所には大事な物を置かないので、その上の範囲に収める（描画は下まで）
      const btnH = Math.min(72, Math.max(56, 0.08 * Math.min(innerWidth, innerHeight))) + 12;
      const reserve = Math.max(0, stage.getBoundingClientRect().bottom - controls.getBoundingClientRect().bottom) + btnH;
      const h = Math.max(120, H - reserve);
      // 上の方は空と猫、流れてくる樋を見せる所にする
      const band = Math.round(h * (h < 320 ? 0.06 : 0.18)), fh = h - band; bandPx = band;
      camera.aspect = w / fh;
      camera.setViewOffset(w, fh, 0, -band, w, H);
      const vf = THREE.MathUtils.degToRad(camera.fov), hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);
      const RX = 3.1, RY = 1.7; // 横は器まで、縦は器から手まで
      const d = Math.min(Math.max(RX / Math.tan(hf / 2), RY / Math.tan(vf / 2)), 26);
      const dir = new THREE.Vector3(0, 0.42, 1).normalize();
      camera.position.copy(CENTER).addScaledVector(dir, d);
      camera.lookAt(CENTER);
      camera.updateProjectionMatrix();
      camera.updateMatrixWorld();
      placeCat(band, fh, H, d);
      placeShoulders();
    }
    function placeShoulders() {
      for (let i = 0; i < 2; i++) {
        // 手と同じ奥行きで、画面の横の端のすぐ外。少し手前に引く
        const sgn = i ? 1 : -1;
        const hand = new THREE.Vector3(sgn * 1.2, 1.55, 0.6).project(camera);
        const p = new THREE.Vector3(sgn * 1.15, Math.min(0.72, hand.y + 0.5), hand.z).unproject(camera);
        p.x = sgn * Math.max(Math.abs(p.x), 2.4);
        SH[i].copy(p).add(new THREE.Vector3(0, 0.1, 0.6));
      }
    }
    // 猫: 上の帯の真ん中あたりに、カメラに正対させて大きく置く
    function placeCat(band, fh, H, d) {
      camera.updateMatrixWorld();
      const vf = THREE.MathUtils.degToRad(camera.fov);
      const L = d + 40;
      const py = ICON ? fh * 0.2 : band * 0.9;
      const vp = new THREE.Vector3(0, 1 - 2 * py / (H || fh), 0.5).unproject(camera);
      cat.position.copy(camera.position).addScaledVector(vp.sub(camera.position).normalize(), L);
      cat.quaternion.copy(camera.quaternion);
      const perPx = 2 * L * Math.tan(vf / 2) / fh;
      const w = stage.clientWidth;
      catBase = Math.max(band * 2.6, Math.min(w, fh * 1.4) * 0.55) * perPx;
      cat.scale.setScalar(catBase);
    }
    addEventListener('resize', resize);

    // ---------- 画面 ----------
    const sideEls = [resultEl.querySelector('.L'), resultEl.querySelector('.R')];
    function renderControls() {
      controls.innerHTML = '';
      controls.classList.toggle('hide', state !== 'result');
      timerEl.style.display = state === 'result' || ICON ? 'none' : 'block';
      if (state !== 'result') return;
      const b = document.createElement('button');
      b.className = 'go'; b.textContent = t('again');
      b.addEventListener('click', again);
      controls.append(b);
      const a = document.createElement('a');
      a.className = 'post'; a.textContent = t('post');
      const text = () => t('share')(Math.round(bowls[0].g), Math.round(bowls[1].g));
      a.href = `https://x.com/intent/post?text=${encodeURIComponent(text())}&url=${encodeURIComponent(SHARE_URL)}`;
      const coarse = matchMedia('(pointer: coarse)').matches;
      if (!coarse) { a.target = '_blank'; a.rel = 'noopener'; }
      // スマホは画像ごと共有シートへ。PCは画像を保存してから投稿画面を開く
      a.addEventListener('click', e => {
        if (coarse && navigator.share) {
          e.preventDefault();
          const file = shareFile();
          const data = file && navigator.canShare?.({ files: [file] }) ? { files: [file], text: `${text()}\n${SHARE_URL}` } : { text: `${text()}\n${SHARE_URL}` };
          navigator.share(data).catch(() => {});
          return;
        }
        const img = resultImage();
        if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'somen-battle.png'; d.click(); }
      });
      controls.append(a);
    }
    function showResult() {
      for (let i = 0; i < 2; i++) {
        sideEls[i].querySelector('b').textContent = `${Math.round(bowls[i].g)}g`;
        sideEls[i].classList.toggle('win', winner === i);
        sideEls[i].classList.toggle('lose', winner === 1 - i);
      }
    }
    // 結果画像: 樋と器の画面に、左右の量を重ねる
    let snap = null, shareCache = null;
    function takeSnap() {
      const src = renderer.domElement;
      const focus = new THREE.Vector3(0, 0.9, 0.3).project(camera);
      const fx = (focus.x + 1) / 2 * src.width, fy = (1 - focus.y) / 2 * src.height;
      const side = Math.min(src.width, src.height);
      const sx = THREE.MathUtils.clamp(fx - side / 2, 0, src.width - side), sy = THREE.MathUtils.clamp(fy - side * 0.55, 0, src.height - side);
      snap = document.createElement('canvas'); snap.width = snap.height = 1080;
      snap.getContext('2d').drawImage(src, sx, sy, side, side, 0, 0, 1080, 1080);
      shareCache = null;
    }
    function crown(g, x, y, s) {
      g.save(); g.translate(x - 32 * s, y - 44 * s); g.scale(s, s);
      g.beginPath(); g.moveTo(4, 40); g.lineTo(8, 10); g.lineTo(22, 24); g.lineTo(32, 4); g.lineTo(42, 24); g.lineTo(56, 10); g.lineTo(60, 40); g.closePath();
      g.fillStyle = '#ffd23a'; g.strokeStyle = '#8a5a00'; g.lineWidth = 3; g.lineJoin = 'round'; g.fill(); g.stroke();
      g.beginPath(); g.arc(32, 30, 4, 0, 7); g.fillStyle = '#e8344a'; g.fill(); g.restore();
    }
    function resultImage() {
      if (!snap) return null;
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const g = c.getContext('2d');
      g.drawImage(snap, 0, 0);
      g.textAlign = 'center'; g.lineJoin = 'round';
      const font = px => `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans Thai", sans-serif`;
      const text = (str, x, y, px, max, stroke) => {
        g.font = font(px);
        const w = g.measureText(str).width; if (w > max) { px *= max / w; g.font = font(px); }
        g.fillStyle = '#fff'; g.lineWidth = px * .16; g.strokeStyle = stroke; g.strokeText(str, x, y); g.fillText(str, x, y);
      };
      text(t('title'), 540, 86, 54, 900, '#5a3214');
      for (let i = 0; i < 2; i++) {
        const x = i ? 800 : 280;
        if (winner === i) crown(g, x, 175, 1.6);
        text(`${Math.round(bowls[i].g)}g`, x, 300, winner === 1 - i ? 110 : 140, 460, i ? '#a32a20' : '#1f4a9a');
      }
      return c;
    }
    function prepareShare() {
      if (!snap) return;
      const key = lang;
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'somen-battle.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;

    function start() {
      state = 'play'; elapsed = 0; shownTimer = -1; drawTimer();
      resetHands(); clearPiles();
      nextSpawn = Math.min(nextSpawn, 0.4);
      renderControls();
    }
    function again() {
      state = 'idle'; elapsed = 0; drawTimer(); winner = -1;
      resetHands(); clearPiles();
      resultEl.style.display = 'none';
      renderControls(); resize();
    }
    function finish() {
      state = 'result';
      const [a, b] = [bowls[0].g, bowls[1].g];
      winner = a > b ? 0 : b > a ? 1 : -1;
      if (winner >= 0) {
        bowls[winner].mat.emissiveIntensity = 0.35;
        burst(new THREE.Vector3((winner ? 1 : -1) * BX, pileTop(winner) + 0.3, BZ), 40, ['#ffd23a', '#ff6a8a', '#6ad0ff', '#ffffff', '#8fe06a'], 2.2, 0.07, 1.8, 5, true);
        if (human[winner]) { sCheer(winner); setTimeout(() => sSlurp(0.6, 0.6), 900); } else sCatHappy();
        const l = 1 - winner; if (human[l]) setTimeout(() => sGroan(l), 300); else setTimeout(sCatSad, 300);
      }
      showResult();
      resultEl.style.display = 'flex';
      snap = null; needSnap = true;
      renderControls(); resize();
    }

    // ---------- ループ ----------
    const tmpV = new THREE.Vector3();
    let last = performance.now(), acc = 0;
    function render(alpha) {
      for (const h of hands) {
        h.root.position.copy(h.prevTip).lerp(h.tip, alpha);
        placeArm(h);
      }
      for (const it of items) {
        if (it.state === 'flow') {
          const z = it.prevZ + (it.z - it.prevZ) * alpha;
          it.g.position.set(Math.sin(clock * 2 + it.wob) * 0.04, bottomY(z) + 0.07, z);
          it.g.rotation.set(TILT, Math.sin(clock * 1.5 + it.wob) * 0.25, 0);
        } else if (it.state === 'held') {
          const h = hands[it.owner];
          tmpV.copy(h.root.position);
          if (it.type === 'noodle') { it.g.position.set(tmpV.x, tmpV.y - 0.36 * it.size, tmpV.z); it.g.rotation.set(Math.PI / 2, 0, Math.sin(clock * 9) * 0.08); }
          else { it.g.position.set(tmpV.x, tmpV.y - 0.08, tmpV.z); it.g.rotation.set(0, 0, 0); }
        } else if (it.state === 'fall') {
          it.g.position.set(0, it.fy, it.z);
        }
      }
      cat.scale.setScalar(catBase * (1 + catBob * 0.04));
      renderer.render(scene, camera);
      if (needSnap) { needSnap = false; takeSnap(); prepareShare(); }
    }
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      acc += dt;
      while (acc >= STEP) { step(STEP); acc -= STEP; }
      render(acc / STEP);
      requestAnimationFrame(loop);
    }

    for (const h of hands) { dressHand(h); h.tip.copy(REST(h.s)); h.prevTip.copy(h.tip); }
    resize();
    renderControls();
    applyLang();
    drawTimer();
    // 最初の1回が重くならないように、全部の形を一度描いておく
    {
      const tmp = ['noodle', 'cherry', 'wasabi'].map(spawnItem);
      tmp.forEach((it, k) => { it.z = it.prevZ = ZG - k; });
      for (const h of hands) { human[h.i] = true; dressHand(h); }
      renderer.compile(scene, camera); render(0);
      for (const h of hands) { human[h.i] = false; dressHand(h); }
      renderer.compile(scene, camera); render(0);
      tmp.forEach(it => { disposeItem(it); dropItem(it); });
      fx.forEach(f => scene.remove(f.m)); fx.length = 0;
    }
    if (ICON) {
      // アイコン用: 左の人がそうめんを持ち上げたところ
      human[0] = true; dressHand(hands[0]);
      const it = spawnItem('noodle'); it.size = 1.0; it.g.scale.set(1.2, 1.0, 1.1);
      it.state = 'held'; it.owner = 0; hands[0].item = it; hands[0].mode = 'hold';
      hands[0].tip.set(0.0, 1.62, 0.9); hands[1].root.visible = hands[1].arm.visible = false; hands[0].prevTip.copy(hands[0].tip);
      for (let k = 0; k < 4; k++) { const n = spawnItem(k === 1 ? 'cherry' : 'noodle'); n.z = n.prevZ = -1.5 - k * 2.2; }
      for (let k = 0; k < 8; k++) { const n = makeItem('noodle'); scene.add(n.g); n.g.scale.multiplyScalar(0.62); n.g.position.set(-BX + rnd(-0.2, 0.2), BY + 0.4 + k * 0.03, BZ + rnd(-0.2, 0.2)); n.g.rotation.y = rnd(0, 6); }
      document.querySelector('header').style.display = 'none';
      resize();
      cat.material.depthTest = true; cat.position.set(0, 5.2, -24); cat.lookAt(camera.position); cat.scale.setScalar(13); catBase = 13;
      render(1);
      setInterval(() => renderer.render(scene, camera), 200);
      window.ICON_READY = true;
    } else requestAnimationFrame(t0 => { last = t0; loop(t0); });
  </script>
</body>
</html>
