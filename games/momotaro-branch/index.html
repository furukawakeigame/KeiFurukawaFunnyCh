      if (R.s4 === 2) part(SPH, mat('#c8a060', 0.9), 0, 0.8, -0.35, 0.25, 0.3, 0.2, hero.g);
      if (R.s5 !== 0 && R.s5 !== 7 && R.s5 !== 8) { const it = makeItem(R.s5); it.position.set(0, 2.0, 0); it.scale.setScalar(1 / hero.g.scale.x); hero.g.add(it); hero.armPose = -2.8; }
      team.forEach((a, i) => add(a, V.g, 6.6 + (i % 3) * 0.8, TOP, -0.1 + Math.floor(i / 3) * 0.8 + (i % 3) * 0.25, -Math.PI / 2));
      const keepPose = hero.armPose;
      await Promise.all(team.map((a, i) => walkTo(a, 0.2 + (i % 3) * 0.85, -0.2 + Math.floor(i / 3) * 0.75 + (i % 3) * 0.2, 1.9).then(() => turn(a, -0.4))));
      hero.armPose = keepPose;
      home.forEach(a => jump(a, 0.4)); team.forEach(a => jump(a, 0.3)); sChime();
      burst(new THREE.Vector3(-1.5, 2.6, 0), 30, '#ffe680', 2.5, 0.06, 1.2, 1.5, 1.5);
      await say(() => T().end);
    }

    // ---------- 導入と結末（子ども部屋） ----------
    let voiced = false;
    async function intro() {
      mode = 'intro'; layout();
      setWorld(true); closeBook(1);
      look(0.0, 0.75, 0.0, 1.55, 0.3, 0.5, 1, true);
      sub.classList.remove('on'); curLine = null;
      for (;;) {
        await wait(0.6);
        bubble(0, () => T().kid, kid.heads[0]);
        speak(kid.f0, ['o', 'o', 'a', 'o', 'u', 'o', 'n', 'e', 'e'], [0.12, 0.12, 0.12, 0.12, 0.1, 0.13, 0.1, 0.16, 0.4], 0.4);
        jump(kid, 0.12, 0.3); wait(0.4).then(() => jump(kid, 0.12, 0.3));
        await wait(2.0); unbubble(0);
        await wait(0.3);
        bubble(1, () => T().mom, mom.heads[0]);
        speak(MOM_F0, ['a', 'i', 'a', 'i'], [0.12, 0.15, 0.12, 0.3], 0.4);
        await wait(1.5); unbubble(1);
        if (voiced) break;
        await wait(1.5);
      }
      await enterBook();
    }
    async function enterBook() {
      unbubble(0); unbubble(1);
      mode = 'intro';
      await tween(0.6, k => closeBook(1 - ease(k)));
      sSwish();
      camSpeed = 1.6;
      look(...wpos(book).toArray(), 0.35, 0.3, 0.9, 0.6);
      await wait(1.1);
      await fadeTo(1, 0.5);
      setWorld(false);
      mode = 'story'; layout();
      camSpeed = 1.6;
      look(0, 0, 0, 9, 0, 1, 0.15, true);
      fadeTo(0, 0.6);
      await story();
    }
    async function story() {
      for (const k of Object.keys(R)) R[k] = 0; R.hero = 'momo';
      camSpeed = 2.2;
      await page1(); await page2(); await page3(); await page4(); await page5(); await page6();
      // 結末の絵を共有画像にする
      needSnap = true; await wait(0.1);
      markFound();
      await wait(0.8);
      await fadeTo(1, 0.6);
      sub.classList.remove('on'); curLine = null;
      setWorld(true); closeBook(1);
      look(0.0, 0.75, 0.0, 1.55, 0.3, 0.5, 1, true);
      mode = 'result'; showPanel(); renderControls(); layout();
      fadeTo(0, 0.6);
      const ri = [7, 8, 5, 6].includes(R.s4) ? 0 : [0, 1].includes(R.s4) ? 2 : 1;
      await wait(0.5);
      bubble(0, () => T().react[ri], kid.heads[0]);
      if (ri === 0) speak(kid.f0, ['a', 'a', 'a'], [0.12, 0.14, 0.4], 0.45); else if (ri === 1) speak(kid.f0, ['a', 'i', 'o', 'e', 'e'], [0.1, 0.1, 0.1, 0.12, 0.35], 0.45); else speak(kid.f0, ['e', 'e'], [0.15, 0.5], 0.45);
      jump(kid, 0.15, 0.3); await wait(0.4); jump(kid, 0.15, 0.3);
      await wait(2.2); unbubble(0);
    }

    // ---------- 見つけた結末 ----------
    const endId = () => R.s1 * 10000 + R.s2 * 1000 + R.s3 * 100 + R.s4 * 10 + R.s5;
    let found = null;
    function loadFound() {
      found = new Uint8Array(12500);
      try { const s = localStorage.getItem(KEY + 'found'); if (s) { const b = atob(s); for (let i = 0; i < Math.min(b.length, found.length); i++) found[i] = b.charCodeAt(i); } } catch {}
    }
    function markFound() {
      const id = endId(); found[id >> 3] |= 1 << (id & 7);
      try { let s = ''; for (let i = 0; i < found.length; i++) s += String.fromCharCode(found[i]); localStorage.setItem(KEY + 'found', btoa(s)); } catch {}
    }
    const mapC = document.getElementById('map');
    function drawMap() {
      const g = mapC.getContext('2d'), img = g.createImageData(800, 500), d = img.data, cur = endId();
      for (let i = 0; i < d.length; i += 4) { d[i] = 44; d[i + 1] = 32; d[i + 2] = 24; d[i + 3] = 255; }
      for (let id = 0; id < 100000; id++) if (found[id >> 3] >> (id & 7) & 1) {
        const x = (id % 400) * 2, y = Math.floor(id / 400) * 2;
        for (const [dx, dy] of [[0, 0], [1, 0], [0, 1], [1, 1]]) { const o = ((y + dy) * 800 + x + dx) * 4; d[o] = 255; d[o + 1] = 214; d[o + 2] = 90; }
      }
      g.putImageData(img, 0, 0);
      const x = (cur % 400) * 2 + 1, y = Math.floor(cur / 400) * 2 + 1;
      g.strokeStyle = '#ff5a4a'; g.lineWidth = 4; g.beginPath(); g.arc(x, y, 14, 0, 7); g.stroke();
    }
    const summary = () => [T().sh1[R.s1], T().sh2[R.s2], T().sh3[R.s3], T().sh4[R.s4], T().sh5[R.s5]].join(' → ');
    function showPanel() {
      panel.style.display = 'flex';
      document.getElementById('endNo').textContent = T().no(endId() + 1);
      document.getElementById('summary').textContent = summary();
      drawMap();
    }

    // ---------- 結果のボタンと共有 ----------
    const shareText = () => `${T().no(endId() + 1)}\n${summary()}\n#分岐ももたろうゲーム`;
    function renderControls() {
      controls.innerHTML = '';
      controls.classList.toggle('hide', mode !== 'result');
      if (mode !== 'result') return;
      const b = document.createElement('button');
      b.className = 'go'; b.textContent = T().again;
      b.addEventListener('click', () => { b.blur(); restart(true); });
      controls.append(b);
      const a = document.createElement('a');
      a.className = 'post'; a.textContent = T().post;
      a.href = `https://x.com/intent/post?text=${encodeURIComponent(shareText())}&url=${encodeURIComponent(SHARE_URL)}`;
      const coarse = matchMedia('(pointer: coarse)').matches;
      if (!coarse) { a.target = '_blank'; a.rel = 'noopener'; }
      // スマホは画像ごと共有シートへ。PCは画像を保存してから投稿画面を開く
      a.addEventListener('click', e => {
        const text = shareText();
        if (coarse && navigator.share) {
          e.preventDefault();
          const file = shareFile();
          const data = file && navigator.canShare?.({ files: [file] }) ? { files: [file], text: `${text}\n${SHARE_URL}` } : { text: `${text}\n${SHARE_URL}` };
          navigator.share(data).catch(() => {});
          return;
        }
        const img = resultImage();
        if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'momotaro-branch.png'; d.click(); }
      });
      controls.append(a);
    }
    let snap = null, shareCache = null, needSnap = false;
    function takeSnap() {
      const src = renderer.domElement;
      // 家の前（家族と主人公たち）が入るように切り抜く
      const focus = new THREE.Vector3(-1.2, 1.0, 0).project(camera);
      const fx = (focus.x + 1) / 2 * src.width, fy = (1 - focus.y) / 2 * src.height;
      const side = Math.min(src.width, src.height);
      const sx = clamp(fx - side / 2, 0, src.width - side), sy = clamp(fy - side / 2, 0, src.height - side);
      snap = document.createElement('canvas'); snap.width = snap.height = 1080;
      snap.getContext('2d').drawImage(src, sx, sy, side, side, 0, 0, 1080, 1080);
      shareCache = null;
    }
    function resultImage() {
      if (!snap) return null;
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const g = c.getContext('2d');
      g.drawImage(snap, 0, 0);
      const font = (px, w = 900) => `${w} ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans KR", "Noto Sans Thai", sans-serif`;
      g.fillStyle = 'rgba(255,251,240,.92)'; g.fillRect(0, 760, 1080, 320);
      g.textAlign = 'center'; g.lineJoin = 'round';
      const text = (str, y, px, max, col, w) => { g.font = font(px, w); const tw = g.measureText(str).width; if (tw > max) { px *= max / tw; g.font = font(px, w); } g.fillStyle = col; g.fillText(str, 540, y); };
      text(T().no(endId() + 1), 860, 110, 980, '#c0392b');
      // あらすじを折り返して2行まで
      g.font = font(40, 700);
      const words = lang === 'en' || lang === 'ko' ? summary().split(' ') : [...summary()];
      const lines = []; let line = '';
      for (const w of words) { const s = line + (line && (lang === 'en' || lang === 'ko') ? ' ' : '') + w; if (g.measureText(s).width > 980 && line) { lines.push(line); line = w; } else line = s; }
      lines.push(line);
      lines.slice(0, 3).forEach((l, i) => text(l, 935 + i * 50, 40, 1000, '#3a2a1a', 700));
      g.font = font(48); g.lineWidth = 10; g.strokeStyle = '#6b3d1c'; g.fillStyle = '#fff'; g.strokeText(T().title, 540, 80); g.fillText(T().title, 540, 80);
      return c;
    }
    function prepareShare() {
      if (!snap) return;
      const key = lang;
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'momotaro-branch.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;

    // ---------- 入力 ----------
    function tap() {
      if (mode === 'result') return;
      if (mode === 'intro') {
        if (!voiced) { voiced = true; restart(false); return; }
        if (introSkippable) { introSkippable = false; clearRun(); enterBook(); }
        return;
      }
      if (gameTap) { gameTap(); return; }
      const f = tapFns; tapFns = []; f.forEach(r => r());
    }
    let introSkippable = false;
    stage.addEventListener('pointerdown', e => { initAudio(); e.preventDefault(); tap(); }, { passive: false });
    stage.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
    addEventListener('keydown', e => {
      if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat && !(e.target instanceof HTMLSelectElement) && !(e.target instanceof HTMLButtonElement) && !(e.target instanceof HTMLAnchorElement)) { e.preventDefault(); initAudio(); tap(); }
    });
    function restart(again) {
      clearRun();
      unbubble(0); unbubble(1);
      panel.style.display = 'none';
      fade.style.opacity = 0;
      bar.style.display = 'none';
      actors = actors.filter(a => a.room);
      if (dio) { bookRoot.remove(dio); dio = null; }
      mode = 'intro'; renderControls();
      if (again) voiced = true;
      introSkippable = voiced;
      intro();
    }

    // ---------- ループ ----------
    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      for (let i = timers.length - 1; i >= 0; i--) { const tm = timers[i]; tm.t -= dt; if (tm.t <= 0) { timers.splice(i, 1); tm.fn(); } }
      const list = anims; anims = [];
      for (const f of list) if (f(dt) !== false) anims.push(f);
      waterTex.offset.x -= dt * 0.12;
      for (const a of actors) animActor(a, dt);
      if (roomRoot.visible) for (const a of roomActors) animActor(a, dt);
      stepFx(dt);
      stepCam(dt);
      renderer.render(scene, camera);
      if (needSnap) { needSnap = false; takeSnap(); prepareShare(); }
      placeBubbles();
      requestAnimationFrame(frame);
    }

    loadFound();
    applyLang();
    // 最初の1回が重くならないように、全部の場面を一度描いておく
    {
      setWorld(false);
      const tmp = [buildVillage(true), buildHome(), buildRoad(), buildIsland(), buildSea()].map(r => r.g);
      const extra = [makeOni(), makeDog(), makeMonkey(), makeKiji(), makeBear(), makeCat(), makePeachWalker(), makeHero('twins'), makeHero('muscle'), makeVillager()].map(a => a.g);
      for (const g of tmp.concat(extra)) bookRoot.add(g);
      for (let i = 0; i < 10; i++) bookRoot.add(makeItem(i));
      layout(); look(0, 0, 0, 8, 0, 1, 0.3, true); stepCam(0);
      renderer.compile(scene, camera); renderer.render(scene, camera);
      bookRoot.children.slice(3).forEach(c => { if (c !== flipPage) bookRoot.remove(c); });
    }
    roomActors.forEach(a => a.room = true);
    intro();
    requestAnimationFrame(t0 => { last = t0; frame(t0); });
  </script>
</body>
