      want[p.k] = { held: true, x: Math.round((p.bx + dx * 1.3) * 1000), y: Math.round((p.by - dy * 1.6) * 1000) };
      const r = rings[p.k], ox = clamp(e.clientX - p.x, -24, 24), oy = clamp(e.clientY - p.y, -24, 24);
      r.firstChild.style.transform = `translate(${ox}px, ${oy}px)`;
    });
    const rings = { footR: document.getElementById('ringL'), footL: document.getElementById('ringR') }; // 画面の左 = 右足
    const up = e => { const p = pointers.get(e.pointerId); if (!p) return; pointers.delete(e.pointerId); want[p.k] = { held: false, x: 0, y: 0 }; rings[p.k].style.display = 'none'; };
    renderer.domElement.addEventListener('pointerup', up);
    renderer.domElement.addEventListener('pointercancel', up);

    // 案内: 両足の上に、上へドラッグする指
    const HINT_SVG = `<svg viewBox="0 0 60 84"><path d="M30 2l-7 9h14z" fill="#fff" stroke="#24304a" stroke-width="2" stroke-linejoin="round" opacity=".9"/><g class="hand"><path d="M24 64V24a5 5 0 0 1 10 0v20l1-3a4 4 0 0 1 7 1v3a4 4 0 0 1 7 1v3a4 4 0 0 1 6 2v10c0 8-6 14-14 14h-4c-6 0-9-3-11-7l-7-11a4 4 0 0 1 7-5z" fill="#fff" stroke="#24304a" stroke-width="2.5" stroke-linejoin="round"/></g></svg>`;
    const hints = { footL: document.getElementById('hintL'), footR: document.getElementById('hintR') };
    for (const k in hints) hints[k].innerHTML = HINT_SVG;
    let hintsOn = true, hintVis = false;
    const showHints = () => { hintsOn = true; };
    const hideHints = () => { hintsOn = false; };
    function placeHints() {
      if (hintsOn !== hintVis) { hintVis = hintsOn; for (const k in hints) hints[k].style.display = hintsOn ? 'block' : 'none'; }
      if (!hintsOn) return;
      // 足の上ではなく、画面の下の方（左右それぞれの真ん中）に出す: どこを触っても、ずらした分だけ足が動く
      for (const k in hints) {
        hints[k].style.left = Math.round(layout.w * (k === 'footR' ? 0.22 : 0.78)) + 'px';
        hints[k].style.top = Math.round(Math.min(layout.H * 0.8, layout.H - 130)) + 'px';
      }
    }

    // ---------- 自動プレイ（調整・確認用。window.__bot = true で動く） ----------
    function bot() {
      const s = core.ball, i = s.p[0] < 0 ? 1 : 0, f = core.feet[i];
      const gap = s.p[1] - core.R - f.p[1];
      want[FOOT_KEYS[i]] = { held: true, x: Math.round(s.p[0] * 1000), y: s.v[1] < 0 && gap < 0.22 ? 380 : 100 };
      want[FOOT_KEYS[1 - i]] = { held: false, x: 0, y: 0 };
    }

    // ---------- カメラ（正面やや横から / 失敗したら寄る） ----------
    const layout = { w: 1, H: 1 };
    const LOOK = V(0, 0.95, 0.6);
    const VIEWS = {
      back: { bottomAlign: true, yaw: 0.32, pitch: 0.3, look: V(0, 1.0, 0), keys: [V(0.6, 0, 0.6), V(-0.6, 0, 0.6), V(0.6, 0, -0.2), V(-0.6, 0, -0.2), V(0.45, 1.9, 0), V(-0.45, 1.9, 0), V(0, 2.4, 0.3), V(0, 1.6, BACK_Z)] },
      front: { yaw: 0.25, pitch: 0.12, look: V(0, 0.9, 0), keys: [V(0.75, 0, 0.35), V(-0.75, 0, 0.35), V(0.55, 1.85, 0), V(-0.55, 1.85, 0), V(0.75, 0, -0.3), V(-0.75, 0, -0.3)] },
    };
    let camBlend = 0, camT0 = 0;
    const fits = {};
    const _p = V(), _dir = V();
    function placeCam(view, d) {
      _dir.set(Math.sin(view.yaw) * Math.cos(view.pitch), Math.sin(view.pitch), Math.cos(view.yaw) * Math.cos(view.pitch));
      camera.position.copy(view.look).addScaledVector(_dir, d);
      camera.lookAt(view.look); camera.updateProjectionMatrix(); camera.updateMatrixWorld();
      let x0 = 9, x1 = -9, y0 = 9, y1 = -9;
      for (const k of view.keys) { _p.copy(k).project(camera); if (_p.z > 1 || _p.z < -1) return null; x0 = Math.min(x0, _p.x); x1 = Math.max(x1, _p.x); y0 = Math.min(y0, _p.y); y1 = Math.max(y1, _p.y); }
      return { x0, x1, y0, y1 };
    }
    // region: 大事な物を入れる画面の範囲（上端・下端の px）
    function fitView(view, top, bottom, l = 0, r = layout.w) {
      const w = Math.max(120, r - l), H = layout.H, hh = Math.max(120, bottom - top);
      camera.aspect = w / hh; camera.clearViewOffset();
      let lo = 0.5, hi = 60;
      for (let i = 0; i < 28; i++) { const mid = (lo + hi) / 2, b = placeCam(view, mid); if (b && (b.x1 - b.x0) / 2 <= 0.95 && (b.y1 - b.y0) / 2 <= 0.94) hi = mid; else lo = mid; }
      const b = placeCam(view, hi);
      // 余った高さは上（空・壁）に回し、大事な物は下に寄せる
      return { d: hi, ww: w, hh, ox: (b.x0 + b.x1) / 2 * w / 2 - l, oy: (view.bottomAlign ? -0.94 - b.y0 : -(b.y0 + b.y1) / 2) * hh / 2 - top };
    }
    function layoutCam() {
      const w = stage.clientWidth, H = stage.clientHeight;
      layout.w = w; layout.H = H;
      renderer.setSize(w, H, false);
      const lowWide = H <= 520 && w / H >= 4 / 3;
      fits.back = fitView(VIEWS.back, lowWide ? 46 : 54, H - 84);
      let top = 54, bottom = H - 84, l = 0, r = w;
      if (lowWide) r = w * 0.56;
      else if (state === 'result') {
        const rb = document.getElementById('rBest').getBoundingClientRect(), cb = document.getElementById('again').getBoundingClientRect();
        top = rb.bottom + 6; bottom = cb.top - 8;
      }
      fits.front = fitView(VIEWS.front, top, bottom, l, r);
      applyCam();
    }
    function applyCam() {
      const k = camBlend, s = k * k * (3 - 2 * k);
      const A = VIEWS.back, B = VIEWS.front, fa = fits.back, fb = fits.front;
      const view = { yaw: lerp(A.yaw, B.yaw + Math.PI * 2 * (B.yaw < A.yaw - Math.PI ? 1 : 0), s), pitch: lerp(A.pitch, B.pitch, s), look: _a.copy(A.look).lerp(B.look, s), keys: [] };
      const hh = lerp(fa.hh, fb.hh, s), ww = lerp(fa.ww, fb.ww, s);
      camera.aspect = ww / hh; camera.clearViewOffset();
      placeCam(view, lerp(fa.d, fb.d, s));
      camera.setViewOffset(ww, hh, Math.round(lerp(fa.ox, fb.ox, s)), Math.round(lerp(fa.oy, fb.oy, s)), layout.w, layout.H);
      camera.updateProjectionMatrix();
    }

    // ---------- ランキング（今日・全期間。.claude/ranking.gs を Google Apps Script で公開した URL） ----------
    // ズル対策: 遊ぶ前にサーバーから整理券をもらっておく（届くのを待たずに遊べる）。登録の時は
    // 乱数の種と「指の動きの記録」を送り、サーバーが core.js と同じ計算で最初から再生して、回数と時間を確かめる。
    const RANK_URL = 'https://script.google.com/macros/s/AKfycbyAE0TZe6QHNZHmRVlMaf2yG6FnfKSyhSrBR57AyhpkJjVmhWfHSz9mL2Tar__EUihGwA/exec';
    const GAME_ID = 'lifting';
    const $ = id => document.getElementById(id);
    let dev = store.get('dev', '');
    if (!dev) { dev = Math.random().toString(36).slice(2) + Date.now().toString(36); store.set('dev', dev); }
    $('rankBtn').hidden = !RANK_URL;
    let rank = { data: null, tab: 'today', err: '', msg: '', sent: false, me: null, busy: false };
    let sess = null;
    async function rpost(body, tries = 3) {
      for (let i = 0; ; i++) {
        try { const r = await fetch(RANK_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }); return await r.json(); }
        catch (e) { if (i + 1 >= tries) throw e; await new Promise(r => setTimeout(r, 800 * (i + 1))); }
      }
    }
    // 次の回の整理券を先にもらっておく（最初の操作までに届いていれば、その回は登録できる）
    function startSession() {
      if (!RANK_URL) return;
      const me = sess = { tok: null, ok: true, chain: null };
      // サーバーが混んでいて断られたら、間をあけて取り直す（遊んでいる間に届けばよい）
      me.chain = (async () => {
        for (let i = 0; i < 7 && sess === me; i++) {
          try { const j = await rpost({ act: 'start', game: GAME_ID, dev }, 1); if (j.ok && j.tok) { me.tok = j.tok; return; } } catch {}
          await new Promise(r => setTimeout(r, 1500 * 2 ** Math.min(i, 3)));
        }
        me.ok = false;
      })();
    }
    function resetRank() { rank.sent = false; rank.me = null; rank.msg = ''; rank.busy = false; }
    function renderRank() {
      const ol = $('rkList'); ol.innerHTML = '';
      $('tabToday').classList.toggle('on', rank.tab === 'today'); $('tabAll').classList.toggle('on', rank.tab === 'all');
      $('rkNote').textContent = rank.tab === 'today' ? t('rkNote') : '';
      const list = rank.data && (rank.data[rank.tab] || []);
      const empty = txt => { const li = document.createElement('li'); li.className = 'empty'; li.textContent = txt; ol.append(li); };
      if (!list) empty(rank.err || t('rkLoad'));
      else if (!list.length) empty(t('rkEmpty'));
      else list.forEach((r, i) => {
        const li = document.createElement('li');
        if (rank.me && r.name === rank.me.name && r.wave === rank.me.score) li.className = 'me';
        for (const [c, v] of [['n', i + 1], ['nm', r.name], ['w', t('count')(r.wave)]]) { const sp = document.createElement('span'); sp.className = c; sp.textContent = v; li.append(sp); }
        ol.append(li);
      });
      $('rkMsg').textContent = rank.msg ? (typeof rank.msg === 'object' ? t('rkYou')(rank.msg.today, rank.msg.all) : t(rank.msg)) : '';
      $('rkForm').hidden = rank.sent || !score;
      $('rkSend').disabled = rank.busy;
    }
    async function loadRank() {
      rank.data = null; rank.err = ''; renderRank();
      try { const r = await fetch(`${RANK_URL}?game=${GAME_ID}`); const j = await r.json(); rank.data = { today: j.today || [], all: j.all || [] }; }
      catch { rank.err = t('rkFail'); }
      renderRank();
    }
    // ランキングを開いている間は結果を隠す（広告もいったん消える）
    $('rankBtn').onclick = () => { resultEl.style.display = 'none'; controlsEl.style.display = 'none'; $('rank').hidden = false; $('rkName').value = store.get('name', ''); loadRank(); };
    $('tabToday').onclick = () => { rank.tab = 'today'; renderRank(); };
    $('tabAll').onclick = () => { rank.tab = 'all'; renderRank(); };
    $('rkClose').onclick = () => { $('rank').hidden = true; if (state === 'result') { resultEl.style.display = 'flex'; controlsEl.style.display = 'flex'; } };
    $('rkForm').onsubmit = async e => {
      e.preventDefault();
      if (rank.busy || rank.sent) return;
      const name = $('rkName').value.replace(/\s+/g, ' ').trim().slice(0, 8);
      if (!name) { $('rkName').focus(); return; }
      store.set('name', name);
      rank.busy = true; rank.msg = 'rkCheck'; renderRank();
      try {
        const me = sess;
        if (me) await me.chain;
        if (!runLive || !me || !me.ok || !me.tok) { rank.msg = 'rkOff'; rank.busy = false; renderRank(); return; }
        const j = await rpost({ act: 'submit', tok: me.tok, name, dev, seed: runSeed, score, steps: runSteps, log: runLog }, 3); // 送り直しても、サーバーは1回目の結果を返す
        if (j.ok) { rank.sent = true; rank.me = { name, score }; rank.data = { today: j.today || [], all: j.all || [] }; rank.msg = j.rank; }
        else rank.msg = j.error === 'ng' ? 'rkNg' : j.error === 'wait' ? 'rkWait' : j.error === 'replay' ? 'rkReplay' : j.error === 'dup' ? 'rkDup' : j.error === 'time' ? 'rkTime' : 'rkBad';
      } catch { rank.msg = 'rkFail'; }
      rank.busy = false; renderRank();
    };
    $('rkName').addEventListener('keydown', e => e.stopPropagation());

    // ---------- 結果画像（X投稿用） ----------
    let snap = null, shareCache = null, needSnap = 0;
    function takeSnap() {
      const src = renderer.domElement;
      _p.set(0, 1.0, 0).project(camera);
      const fx = (_p.x + 1) / 2 * src.width, fy = (1 - _p.y) / 2 * src.height;
      const side = Math.min(src.width, src.height);
      const sx = clamp(fx - side / 2, 0, src.width - side), sy = clamp(fy - side / 2, 0, src.height - side);
      snap = document.createElement('canvas'); snap.width = snap.height = 1080;
      snap.getContext('2d').drawImage(src, sx, sy, side, side, 0, 0, 1080, 1080);
      shareCache = null;
    }
    function resultImage() {
      if (!snap) return null;
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const g = c.getContext('2d');
      g.drawImage(snap, 0, 0);
      let gr = g.createLinearGradient(0, 0, 0, 240); gr.addColorStop(0, 'rgba(0,0,0,.35)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, 1080, 240);
      gr = g.createLinearGradient(0, 720, 0, 1080); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.5)'); g.fillStyle = gr; g.fillRect(0, 720, 1080, 360);
      g.textAlign = 'center'; g.fillStyle = '#fff'; g.lineJoin = 'round';
      const font = px => `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans KR", "Noto Sans Thai", sans-serif`;
      const text = (str, y, px, max) => {
        g.font = font(px);
        const w = g.measureText(str).width; if (w > max) { px *= max / w; g.font = font(px); }
        g.lineWidth = px * .16; g.strokeStyle = '#3a2a6a'; g.strokeText(str, 540, y); g.fillText(str, 540, y);
      };
      text(t('count')(score), 990, 190, 960);
      if (chap) { g.fillStyle = '#ffd75a'; text(t('chap')[chap], 790, 84, 960); g.fillStyle = '#fff'; }
      text(t('title'), 96, 60, 900);
      return c;
    }
    function prepareShare() {
      if (!snap) return;
      const key = lang;
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'lifting.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;
    {
      const coarse = matchMedia('(pointer: coarse)').matches;
      if (!coarse) { shareEl.target = '_blank'; shareEl.rel = 'noopener'; }
      // スマホは画像ごと共有シートへ。PCは画像を保存してから投稿画面を開く
      shareEl.addEventListener('click', e => {
        const text = t('share')(score, t('chap')[chap]);
        if (coarse && navigator.share) {
          e.preventDefault();
          const file = shareFile();
          const data = file && navigator.canShare?.({ files: [file] }) ? { files: [file], text: `${text}\n${SHARE_URL}` } : { text: `${text}\n${SHARE_URL}` };
          navigator.share(data).catch(() => {});
          return;
        }
        const img = resultImage();
        if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'lifting.png'; d.click(); }
      });
    }

    // ---------- ループ ----------
    let lastT = performance.now(), acc = 0, timeScale = 1;
    const shownPos = { footL: V(), footR: V() };
    function render(dt) {
      const alpha = acc / STEP;
      for (const k in LIMB) shownPos[k].lerpVectors(LIMB[k].prev, LIMB[k].pos, alpha);
      poseBody(shownPos, dt);
      for (const b of BALL_LIST) {
        b.rp.lerpVectors(b.prevP, b.p, alpha);
        b.mesh.position.copy(b.rp); b.mesh.quaternion.copy(b.q);
        const hgt = Math.max(0, b.rp.y - b.r);
        b.blob.position.set(b.rp.x, 0.006, b.rp.z);
        b.blob.scale.setScalar(b.r * 2.6 * (1 + hgt * 0.5));
        b.blob.material.opacity = clamp(1 - hgt / 2.2, 0.15, 1) * 0.8;
      }
      h.update(dt);
      if (scout.root.visible) { scout.lookAt(balls.soccer.rp); scout.update(dt); }
      updateDust(dt);
      updateConfetti(dt);
      // 空: プレイの時間とともに夕方から夜へ（ゆっくり）
      if (state === 'play' && !CH[chap].stadium) setDusk(core.t / 80);
      // カメラ: 失敗したら正面へ回り込む
      if (state === 'fail' || state === 'result') {
        const nb = clamp((performance.now() - camT0) / 1600, 0, 1);
        if (nb !== camBlend) { camBlend = nb; applyCam(); }
      }
      placeHints();
      renderer.render(scene, camera);
      if (needSnap && camBlend >= 1) { if (--needSnap === 0) { takeSnap(); prepareShare(); } }
    }
    function loop(now) {
      const dt = Math.min(0.05, (now - lastT) / 1000) * timeScale; lastT = now;
      acc += dt;
      while (acc >= STEP) { step(STEP); acc -= STEP; }
      render(dt);
      requestAnimationFrame(loop);
    }

    addEventListener('resize', layoutCam);
    setDusk(0);
    syncFromCore();
    layoutCam();
    applyLang();
    startSession();
    // テスト用の入口
    window.__game = {
      get state() { return state; }, get t() { return core.t; }, get score() { return score; }, core, want, get log() { return runLog; }, get seed() { return runSeed; }, get live() { return runLive; },
      set timeScale(v) { timeScale = v; }, get chap() { return chap; }, setScore(n) { core.score = n; onEvent(['touch', n]); }, balls, LIMB, camera, hideHints, human: h, fail: () => fail(), start, sim(n) { for (let i = 0; i < n && state === 'play'; i++) step(STEP); return { state, t: core.t, score }; }, reset: () => reset(),
    };
    // 最初の1回が重くならないように、一度描いておく
    renderer.compile(scene, camera); render(0.016);
    requestAnimationFrame(t0 => { lastT = t0; loop(t0); });
  </script>
  <!-- 結果画面の広告（../../ad.js の説明を参照） -->
  <script src="../../ad.js" data-result="#result" data-inline="#adSlot"></script>
