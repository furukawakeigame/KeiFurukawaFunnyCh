    function bot() {
      const s = balls.soccer;
      const k = s.p.x < 0 ? 'footR' : 'footL', F = LIMB[k], o = LIMB[k === 'footR' ? 'footL' : 'footR'];
      F.ptr = 'bot'; o.ptr = null;
      const gap = s.p.y - s.r - F.pos.y;
      F.target.set(s.p.x, s.v.y < 0 && gap < 0.22 ? 0.38 : 0.1, BALL_Z); F.touchT = performance.now(); reach(k, F.target);
    }

    // ---------- カメラ（正面やや横から / 失敗したら寄る） ----------
    const layout = { w: 1, H: 1 };
    const LOOK = V(0, 0.95, 0.6);
    const VIEWS = {
      back: { bottomAlign: true, yaw: 0.32, pitch: 0.3, look: V(0, 1.0, 0), keys: [V(0.6, 0, 0.6), V(-0.6, 0, 0.6), V(0.6, 0, -0.2), V(-0.6, 0, -0.2), V(0.45, 1.9, 0), V(-0.45, 1.9, 0), V(0, 2.4, 0.3), V(0, 1.6, BACK_Z)] },
      front: { yaw: 0.25, pitch: 0.12, look: V(0, 0.9, 0), keys: [V(0.75, 0, 0.35), V(-0.75, 0, 0.35), V(0.55, 1.85, 0), V(-0.55, 1.85, 0), V(0.75, 0, -0.3), V(-0.75, 0, -0.3)] },
    };
    let camBlend = 0, camT0 = 0;
    const fits = {};
    const _p = V(), _dir = V();
    function placeCam(view, d) {
      _dir.set(Math.sin(view.yaw) * Math.cos(view.pitch), Math.sin(view.pitch), Math.cos(view.yaw) * Math.cos(view.pitch));
      camera.position.copy(view.look).addScaledVector(_dir, d);
      camera.lookAt(view.look); camera.updateProjectionMatrix(); camera.updateMatrixWorld();
      let x0 = 9, x1 = -9, y0 = 9, y1 = -9;
      for (const k of view.keys) { _p.copy(k).project(camera); if (_p.z > 1 || _p.z < -1) return null; x0 = Math.min(x0, _p.x); x1 = Math.max(x1, _p.x); y0 = Math.min(y0, _p.y); y1 = Math.max(y1, _p.y); }
      return { x0, x1, y0, y1 };
    }
    // region: 大事な物を入れる画面の範囲（上端・下端の px）
    function fitView(view, top, bottom, l = 0, r = layout.w) {
      const w = Math.max(120, r - l), H = layout.H, hh = Math.max(120, bottom - top);
      camera.aspect = w / hh; camera.clearViewOffset();
      let lo = 0.5, hi = 60;
      for (let i = 0; i < 28; i++) { const mid = (lo + hi) / 2, b = placeCam(view, mid); if (b && (b.x1 - b.x0) / 2 <= 0.95 && (b.y1 - b.y0) / 2 <= 0.94) hi = mid; else lo = mid; }
      const b = placeCam(view, hi);
      // 余った高さは上（空・壁）に回し、大事な物は下に寄せる
      return { d: hi, ww: w, hh, ox: (b.x0 + b.x1) / 2 * w / 2 - l, oy: (view.bottomAlign ? -0.94 - b.y0 : -(b.y0 + b.y1) / 2) * hh / 2 - top };
    }
    function layoutCam() {
      const w = stage.clientWidth, H = stage.clientHeight;
      layout.w = w; layout.H = H;
      renderer.setSize(w, H, false);
      const lowWide = H <= 520 && w / H >= 4 / 3;
      fits.back = fitView(VIEWS.back, lowWide ? 46 : 54, H - 84);
      let top = 54, bottom = H - 84, l = 0, r = w;
      if (lowWide) r = w * 0.56;
      else if (state === 'result') {
        const rb = document.getElementById('rBest').getBoundingClientRect(), cb = document.getElementById('again').getBoundingClientRect();
        top = rb.bottom + 6; bottom = cb.top - 8;
      }
      fits.front = fitView(VIEWS.front, top, bottom, l, r);
      applyCam();
    }
    function applyCam() {
      const k = camBlend, s = k * k * (3 - 2 * k);
      const A = VIEWS.back, B = VIEWS.front, fa = fits.back, fb = fits.front;
      const view = { yaw: lerp(A.yaw, B.yaw + Math.PI * 2 * (B.yaw < A.yaw - Math.PI ? 1 : 0), s), pitch: lerp(A.pitch, B.pitch, s), look: _a.copy(A.look).lerp(B.look, s), keys: [] };
      const hh = lerp(fa.hh, fb.hh, s), ww = lerp(fa.ww, fb.ww, s);
      camera.aspect = ww / hh; camera.clearViewOffset();
      placeCam(view, lerp(fa.d, fb.d, s));
      camera.setViewOffset(ww, hh, Math.round(lerp(fa.ox, fb.ox, s)), Math.round(lerp(fa.oy, fb.oy, s)), layout.w, layout.H);
      camera.updateProjectionMatrix();
    }

    // ---------- 結果画像（X投稿用） ----------
    let snap = null, shareCache = null, needSnap = 0;
    function takeSnap() {
      const src = renderer.domElement;
      _p.set(0, 1.0, 0).project(camera);
      const fx = (_p.x + 1) / 2 * src.width, fy = (1 - _p.y) / 2 * src.height;
      const side = Math.min(src.width, src.height);
      const sx = clamp(fx - side / 2, 0, src.width - side), sy = clamp(fy - side / 2, 0, src.height - side);
      snap = document.createElement('canvas'); snap.width = snap.height = 1080;
      snap.getContext('2d').drawImage(src, sx, sy, side, side, 0, 0, 1080, 1080);
      shareCache = null;
    }
    function resultImage() {
      if (!snap) return null;
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const g = c.getContext('2d');
      g.drawImage(snap, 0, 0);
      let gr = g.createLinearGradient(0, 0, 0, 240); gr.addColorStop(0, 'rgba(0,0,0,.35)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, 1080, 240);
      gr = g.createLinearGradient(0, 720, 0, 1080); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.5)'); g.fillStyle = gr; g.fillRect(0, 720, 1080, 360);
      g.textAlign = 'center'; g.fillStyle = '#fff'; g.lineJoin = 'round';
      const font = px => `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans KR", "Noto Sans Thai", sans-serif`;
      const text = (str, y, px, max) => {
        g.font = font(px);
        const w = g.measureText(str).width; if (w > max) { px *= max / w; g.font = font(px); }
        g.lineWidth = px * .16; g.strokeStyle = '#3a2a6a'; g.strokeText(str, 540, y); g.fillText(str, 540, y);
      };
      text(t('count')(score), 990, 190, 960);
      text(t('title'), 96, 60, 900);
      return c;
    }
    function prepareShare() {
      if (!snap) return;
      const key = lang;
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'lifting.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;
    {
      const coarse = matchMedia('(pointer: coarse)').matches;
      if (!coarse) { shareEl.target = '_blank'; shareEl.rel = 'noopener'; }
      // スマホは画像ごと共有シートへ。PCは画像を保存してから投稿画面を開く
      shareEl.addEventListener('click', e => {
        const text = t('share')(score);
        if (coarse && navigator.share) {
          e.preventDefault();
          const file = shareFile();
          const data = file && navigator.canShare?.({ files: [file] }) ? { files: [file], text: `${text}\n${SHARE_URL}` } : { text: `${text}\n${SHARE_URL}` };
          navigator.share(data).catch(() => {});
          return;
        }
        const img = resultImage();
        if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'lifting.png'; d.click(); }
      });
    }

    // ---------- ループ ----------
    let lastT = performance.now(), acc = 0, timeScale = 1;
    const shownPos = { footL: V(), footR: V() };
    function render(dt) {
      const alpha = acc / STEP;
      for (const k in LIMB) shownPos[k].lerpVectors(LIMB[k].prev, LIMB[k].pos, alpha);
      poseBody(shownPos, dt);
      for (const b of BALL_LIST) {
        b.rp.lerpVectors(b.prevP, b.p, alpha);
        b.mesh.position.copy(b.rp); b.mesh.quaternion.copy(b.q);
        const hgt = Math.max(0, b.rp.y - b.r);
        b.blob.position.set(b.rp.x, 0.006, b.rp.z);
        b.blob.scale.setScalar(b.r * 2.6 * (1 + hgt * 0.5));
        b.blob.material.opacity = clamp(1 - hgt / 2.2, 0.15, 1) * 0.8;
      }
      h.update(dt);
      updateDust(dt);
      // 空: プレイの時間とともに夕方から夜へ（ゆっくり）
      if (state === 'play') setDusk(playT / 80);
      // カメラ: 失敗したら正面へ回り込む
      if (state === 'fail' || state === 'result') {
        const nb = clamp((performance.now() - camT0) / 1600, 0, 1);
        if (nb !== camBlend) { camBlend = nb; applyCam(); }
      }
      placeHints();
      renderer.render(scene, camera);
      if (needSnap && camBlend >= 1) { if (--needSnap === 0) { takeSnap(); prepareShare(); } }
    }
    function loop(now) {
      const dt = Math.min(0.05, (now - lastT) / 1000) * timeScale; lastT = now;
      acc += dt;
      while (acc >= STEP) { step(STEP); acc -= STEP; }
      render(dt);
      requestAnimationFrame(loop);
    }

    addEventListener('resize', layoutCam);
    setDusk(0);
    readyPose();
    placeReady();
    layoutCam();
    applyLang();
    // テスト用の入口
    window.__game = {
      get state() { return state; }, get t() { return playT; }, get score() { return score; },
      set timeScale(v) { timeScale = v; }, balls, LIMB, camera, hideHints, human: h, fail: () => fail(), start, sim(n) { for (let i = 0; i < n && state === 'play'; i++) step(STEP); return { state, t: playT, score }; }, reset: () => reset(),
    };
    // 最初の1回が重くならないように、一度描いておく
    renderer.compile(scene, camera); render(0.016);
    requestAnimationFrame(t0 => { lastT = t0; loop(t0); });
  </script>
  <!-- 結果画面の広告（../../ad.js の説明を参照） -->
  <script src="../../ad.js" data-result="#result" data-inline="#adSlot"></script>
</body>
