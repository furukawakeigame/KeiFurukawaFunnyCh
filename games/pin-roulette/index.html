    lathe([[1.36, -0.12], [1.36, 0.12], [1.33, 0.17], [1.27, 0.185], [1.2, 0.175], [1.18, 0.14]], lacquer(darkWood, 0.4));
    lathe([[1.18, 0.14], [1.1, 0.08], [1.03, 0.03], [1.02, -0.06]], lacquer(lightWood, 0.3));
    lathe([[1.02, -0.06], [0.5, -0.06]], new THREE.MeshStandardMaterial({ color: 0x080402, roughness: 0.9 }));
    // 斜面のダイヤ型の障害物（玉が当たって跳ねる）
    {
      const dg = new THREE.OctahedronGeometry(0.03, 0);
      for (let k = 0; k < 8; k++) {
        const th = k * Math.PI / 4 + Math.PI / 8, rr = 1.085, d = new THREE.Mesh(dg, brass);
        d.position.set(rr * Math.sin(th), surfaceY(rr) + 0.012, -rr * Math.cos(th));
        d.scale.set(0.6, 0.45, 1.6); d.rotation.y = -th; d.castShadow = true; scene.add(d);
        d.userData.deflector = true;
      }
    }

    // 回る盤
    const wheel = new THREE.Group(); scene.add(wheel);
    const faceCanvas = document.createElement('canvas'); faceCanvas.width = faceCanvas.height = 1024;
    const faceTex = new THREE.CanvasTexture(faceCanvas);
    faceTex.encoding = THREE.sRGBEncoding; faceTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    {
      const side = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.0, 0.06, 128, 1, true), lacquer(darkWood, 0.4));
      side.position.y = -0.03; wheel.add(side);
      const face = new THREE.Mesh(new THREE.CircleGeometry(1.0, 128), new THREE.MeshPhysicalMaterial({ map: faceTex, roughness: 0.55, metalness: 0, clearcoat: 0.7, clearcoatRoughness: 0.15 }));
      face.rotation.x = -Math.PI / 2; face.receiveShadow = true; wheel.add(face);
      const ring = new THREE.Mesh(new THREE.TorusGeometry(1.0, 0.012, 8, 128), brass);
      ring.rotation.x = Math.PI / 2; ring.position.y = 0.006; wheel.add(ring);
      // 仕切り（フレット）
      const fretGeo = new THREE.BoxGeometry(0.012, 0.035, 0.56);
      for (let i = 0; i < N; i++) {
        const th = i * STEP, f = new THREE.Mesh(fretGeo, chrome);
        f.position.set(0.71 * Math.sin(th), 0.0175, -0.71 * Math.cos(th)); f.rotation.y = Math.PI - th;
        f.castShadow = true; wheel.add(f);
      }
      // 中央のドーム（真ん中には猫が座る）
      const dome = new THREE.Mesh(new THREE.LatheGeometry([[0.45, 0], [0.43, 0.035], [0.32, 0.09], [0.16, 0.13], [0.07, 0.15], [0, 0.155]]
        .map(([r, y]) => new THREE.Vector2(r, y)), 96), lacquer(lightWood, 0.3));
      dome.castShadow = dome.receiveShadow = true; wheel.add(dome);
    }
    // ---- いつもの猫（作者の目印）：ルーレットの真ん中に、顔の写真をこちら向きに立てる ----
    const CAT_H = 0.5;
    const catTex = new THREE.TextureLoader().load('cat.png'); catTex.encoding = THREE.sRGBEncoding;
    const cat = new THREE.Sprite(new THREE.SpriteMaterial({ map: catTex, transparent: true }));
    cat.scale.set(CAT_H, CAT_H, 1); cat.position.set(0, 0.15 + CAT_H * 0.42, 0); cat.renderOrder = 5; scene.add(cat);
    let catTilt = 0;
    function animateCat(now) {
      // ふだんはゆっくり上下にゆれ、玉が回っている間は玉のいる側へ首をかしげる
      let tt = Math.sin(now / 1900) * 0.05;
      if (ball.visible) {
        const v = ball.position.clone().project(camera), c = cat.position.clone().project(camera);
        tt = Math.max(-0.35, Math.min(0.35, -(v.x - c.x) * 0.9));
      }
      catTilt += (tt - catTilt) * 0.12;
      cat.material.rotation = catTilt;
      cat.position.y = 0.15 + CAT_H * 0.42 + Math.sin(now / 650) * 0.006;
    }
    // ピン・目印・玉
    const pinGroup = new THREE.Group(); wheel.add(pinGroup);
    const markGroup = new THREE.Group(); wheel.add(markGroup);
    const pinGeo = new THREE.CylinderGeometry(0.013, 0.013, 1, 12), headGeo = new THREE.SphereGeometry(0.05, 24, 16);
    const headMats = COLORS.map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.22, metalness: 0.05 }));
    const glowMats = COLORS.map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.2, emissive: c, emissiveIntensity: 0.6 }));
    const markGeo = new THREE.TorusGeometry(0.035, 0.007, 8, 32);
    const markMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 });
    const PIN_R = 0.965, PIN_H = 0.17, HEAD_GAP = 0.085;
    const ball = new THREE.Mesh(new THREE.SphereGeometry(0.045, 32, 20), new THREE.MeshStandardMaterial({ color: 0xfbfbf6, roughness: 0.12, metalness: 0 }));
    ball.castShadow = true; scene.add(ball);
    let selHeads = [], dropMeshes = [];

    function buildPins() {
      pinGroup.clear(); markGroup.clear(); selHeads = [];
      if (!view || (view.phase === 'order' && orderWheelOn())) return;
      const addPin = (i, cols, extra) => {
        const th = i * STEP, x = PIN_R * Math.sin(th), z = -PIN_R * Math.cos(th);
        const n = cols.length + (extra >= 0 ? 1 : 0), h = PIN_H + (n - 1) * HEAD_GAP;
        const p = new THREE.Mesh(pinGeo, chrome); p.scale.y = h; p.position.set(x, h / 2, z); p.castShadow = true; pinGroup.add(p);
        cols.forEach((c, k) => {
          const hd = new THREE.Mesh(headGeo, headMats[c]); hd.position.set(x, PIN_H + k * HEAD_GAP, z); hd.castShadow = true; pinGroup.add(hd);
        });
        if (extra >= 0) {
          const hd = new THREE.Mesh(headGeo, glowMats[extra]); hd.position.set(x, PIN_H + cols.length * HEAD_GAP, z);
          hd.castShadow = true; hd.userData.y = hd.position.y; pinGroup.add(hd); selHeads.push(hd);
        }
      };
      const mine = myTurn() ? sel : [];
      dropMeshes = [];
      for (let i = 0; i < N; i++) {
        const st = view.pins[i].slice(-4), k = drop ? drop.m.pins.indexOf(i) : -1;
        if (k >= 0) {
          // 刺さる途中のピン：下の段はそのまま置き、新しいピン（軸＋頭）だけを上から落とす
          const base = st.slice(0, -1); if (base.length) addPin(i, base, -1);
          const th = i * STEP, x = PIN_R * Math.sin(th), z = -PIN_R * Math.cos(th), h = PIN_H + (st.length - 1) * HEAD_GAP;
          const gp = new THREE.Group(), sh = new THREE.Mesh(pinGeo, chrome), hd = new THREE.Mesh(headGeo, headMats[drop.m.seat]);
          sh.scale.y = h; sh.position.set(x, h / 2, z); hd.position.set(x, h, z); sh.castShadow = hd.castShadow = true;
          gp.add(sh, hd); gp.visible = false; gp.userData.k = k; pinGroup.add(gp); dropMeshes.push(gp);
        } else if (st.length || mine.includes(i)) addPin(i, st, mine.includes(i) ? me : -1);
      }
      if (myTurn()) targets().forEach(i => {
        const th = i * STEP, m = new THREE.Mesh(markGeo, markMat);
        m.rotation.x = Math.PI / 2; m.position.set(PIN_R * Math.sin(th), 0.008, -PIN_R * Math.cos(th)); markGroup.add(m);
      });
    }

    // 盤面の絵（マスの色・名前・当たったときの点数）を Canvas に描いて貼る
    const runsOf = own => {
      const res = [], s0 = own.findIndex((o, i) => o !== own[(i + N - 1) % N]);
      if (s0 < 0) return own[0] >= 0 ? [{ o: own[0], start: 0, len: N }] : [];
      let i = s0;
      do { const o = own[i]; let len = 0; while (len < N && own[(i + len) % N] === o) len++; if (o >= 0) res.push({ o, start: i, len }); i = (i + len) % N; } while (i !== s0);
      return res;
    };
    const orderWheelOn = () => view && view.phase === 'order' && view.spin && view.spin.kind === 'order' && anim.id === view.spin.id;
    function drawFace() {
      const g = faceCanvas.getContext('2d'), W = 1024, C = W / 2, R = C, r0 = R * 0.44;
      const H = Math.PI / 2;
      const sector = (t0, t1, fill, a = r0, b = R) => { g.beginPath(); g.arc(C, C, b, t0 - H, t1 - H); g.arc(C, C, a, t1 - H, t0 - H, true); g.closePath(); if (fill) { g.fillStyle = fill; g.fill(); } };
      const label = (th, text, rIn, rOut, maxH, color = '#fff') => {
        let f = maxH; g.font = `bold ${f}px system-ui, sans-serif`;
        const w = g.measureText(text).width; if (w > rOut - rIn) { f = Math.floor(f * (rOut - rIn) / w); g.font = `bold ${f}px system-ui, sans-serif`; }
        const flip = th > Math.PI, rm = (rIn + rOut) / 2;
        g.save(); g.translate(C, C); g.rotate(th - H + (flip ? Math.PI : 0));
        g.textAlign = 'center'; g.textBaseline = 'middle';
        g.lineWidth = Math.max(3, f * 0.18); g.strokeStyle = 'rgba(0,0,0,.65)'; g.lineJoin = 'round';
        g.strokeText(text, flip ? -rm : rm, 0); g.fillStyle = color; g.fillText(text, flip ? -rm : rm, 0);
        g.restore();
      };
      const nameIn = (th, len, name, pts, w = STEP) => {
        const wide = Math.min(64, len * w * r0 * 1.15 * 0.62 + 10);
        label(th, pts, r0 + 8, r0 + (R - r0) * 0.47, Math.min(60, wide), '#ffe9a8');
        label(th, name, r0 + (R - r0) * 0.5, R - 26, Math.min(50, wide));
      };
      g.clearRect(0, 0, W, W);
      g.fillStyle = '#2a160a'; g.beginPath(); g.arc(C, C, R, 0, 7); g.fill();
      if (orderWheelOn()) {
        const k = anim.segs.length, seg = 2 * Math.PI / k;
        anim.segs.forEach((s, i) => sector(i * seg, (i + 1) * seg, FACE[s]));

      } else {
        const own = view ? (drop ? drop.owner : view.owner) : Array(N).fill(-1);
        for (let i = 0; i < N; i++) sector(i * STEP, (i + 1) * STEP, own[i] >= 0 ? FACE[own[i]] : i % 2 ? '#1c1714' : '#2a1d14');
        let preview = null;
        if (view && myTurn() && sel.length === 2) preview = arcSquares(sel[0], sel[1]);
        if (preview) {
          preview.forEach(i => sector(i * STEP, (i + 1) * STEP, FACE[me]));
          g.save(); g.beginPath(); preview.forEach(i => { sector(i * STEP, (i + 1) * STEP); });
          g.restore();
          g.save();
          preview.forEach(i => { sector(i * STEP, (i + 1) * STEP); g.save(); g.clip(); g.strokeStyle = 'rgba(255,255,255,.45)'; g.lineWidth = 12;
            for (let d = -W; d < W; d += 34) { g.beginPath(); g.moveTo(d, 0); g.lineTo(d + W, W); g.stroke(); } g.restore(); });
          g.restore();
        }
        if (view) {
          const ownNow = view.owner.slice();
          if (preview) preview.forEach(i => { ownNow[i] = me; });
          const cnt = counts(ownNow);

          if (view.phase === 'spin' && view.last) {
            sector(view.last.sq * STEP, (view.last.sq + 1) * STEP);
            g.strokeStyle = '#fff'; g.lineWidth = 12; g.stroke();
          }
        }
      }
      // 陰影と内側の縁
      const sh = g.createRadialGradient(C, C, r0, C, C, R);
      sh.addColorStop(0, 'rgba(0,0,0,.28)'); sh.addColorStop(0.18, 'rgba(0,0,0,0)'); sh.addColorStop(0.85, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(0,0,0,.3)');
      g.fillStyle = sh; g.beginPath(); g.arc(C, C, R, 0, 7); g.arc(C, C, r0, 0, 7, true); g.fill();
      faceTex.needsUpdate = true;
    }
    let faceDirty = true;
    const dirty = () => { faceDirty = true; };

    let lastRsv = -1;
    function resize() {
      const r = stage.getBoundingClientRect(), w = Math.max(60, Math.floor(r.width)), H = Math.max(60, Math.floor(r.height));
      renderer.setSize(w, H, false); cv.style.width = w + 'px'; cv.style.height = H + 'px';
      // 下の 80px とボタン（空のときも同じ高さ）の所には大事な物を置かないので、その上の範囲にルーレットを収める（描画は下まで）
      const cr = $('ctrl').getBoundingClientRect();
      const rsv = Math.max(0, Math.round(r.bottom - (cr.left < r.right - 1 ? cr.top : cr.bottom + 4) + 8));
      if (rsv !== lastRsv) { lastRsv = rsv; stage.style.setProperty('--rsv', rsv + 'px'); }
      const h = Math.max(60, H - rsv);
      camera.setViewOffset(w, h, 0, 0, w, H);
      camera.aspect = w / h;
      const tn = Math.tan(camera.fov * Math.PI / 360);
      const d = Math.max(1.38 / (tn * camera.aspect), (1.42 * Math.sin(TILT) + 0.25) / tn);
      camera.position.set(0, d * Math.sin(TILT), d * Math.cos(TILT));
      camera.lookAt(0, -0.05, 0.02);
      camera.updateProjectionMatrix();
    }
    new ResizeObserver(resize).observe(stage);

    const myTurn = () => view && view.phase === 'pin' && view.turn === me;
    function firstOk(a, lvl) {
      for (let d = 1; d <= MAXW; d++) if (okAt(view, me, a, (a + d) % N, lvl) || okAt(view, me, a, (a - d + N) % N, lvl)) return true;
      return false;
    }
    function targets() {
      const lvl = ruleLevel(view, me), out = [];
      for (let i = 0; i < N; i++) {
        if (sel.includes(i)) continue;
        if (sel.length === 0 ? firstOk(i, lvl) : okAt(view, me, sel[0], i, lvl)) out.push(i);
      }
      return out;
    }

    // 玉の動き：ホストが物理演算した軌跡（毎秒 SIM_FPS コマ）をなめらかにつないで再生する
    let wheelAngle = 0, lastShown = '';
    const qa = new THREE.Quaternion(), qb = new THREE.Quaternion();
    function spinPose(now) {
      const fr = anim.frames, f = Math.max(0, (now - anim.start) / 1000 * anim.fps);
      const i = Math.min(fr.length - 1, Math.floor(f)), j = Math.min(fr.length - 1, i + 1), k = Math.min(1, f - i);
      const L2 = n => fr[i][n] + (fr[j][n] - fr[i][n]) * k;
      // このコマまでに起きた衝突の音を鳴らす（種類と強さつき）
      for (let q = (anim.played ?? -1) + 1; q <= i; q++) if (fr[q][8]) sndImpact(fr[q][8], fr[q][9]);
      anim.played = i;
      qa.set(fr[i][4], fr[i][5], fr[i][6], fr[i][7]); qb.set(fr[j][4], fr[j][5], fr[j][6], fr[j][7]);
      const dW = (fr[j][0] - fr[i][0]) * anim.fps;
      return { wa: L2(0), x: L2(1), y: L2(2), z: L2(3), q: qa.slerp(qb, k), done: i >= fr.length - 1, wheelSpd: Math.abs(dW) };
    }

    function frame(now) {
      requestAnimationFrame(frame);
      if (drop) {
        const e = now - drop.start;
        if (drop.stage === 0 && e >= DROP_MS) { drop.stage = 1; sndPin(); }
        if (e >= DROP_END) { drop = null; sndPin(); faceDirty = true; }   // 2本目が刺さったらマスを塗る
        else dropMeshes.forEach(gp => {
          const q = (e - gp.userData.k * DROP_GAP) / DROP_MS;
          gp.visible = q > 0; gp.position.y = 0.9 * (1 - Math.min(1, Math.max(0, q)) ** 2);
        });
      }
      const key = [drop && drop.m.id, view && view.phase, view && view.turn, sel.join(), lang, view && view.spin && view.spin.id, anim.id, JSON.stringify(view && view.pins), view && view.order.join()].join('|');
      if (key !== lastShown) { lastShown = key; faceDirty = true; buildPins(); }
      if (faceDirty) { faceDirty = false; drawFace(); }
      const showBall = view && view.spin && anim.id === view.spin.id && (orderWheelOn() || view.phase === 'spin');
      if (showBall) {
        const s = spinPose(now);
        wheelAngle = s.wa;
        // 速さに合わせて転がる音を出す
        let spd = 0;
        if (ball.userData.px !== undefined) {
          const d = Math.hypot(s.x - ball.userData.px, s.z - ball.userData.pz, s.y - ball.userData.py);
          spd = d < 0.5 ? d / Math.max(0.001, (now - ball.userData.t) / 1000) : 0;
        }
        ball.userData.px = s.x; ball.userData.py = s.y; ball.userData.pz = s.z; ball.userData.t = now;
        ball.visible = true; ball.position.set(s.x, s.y, s.z); ball.quaternion.copy(s.q);
        const r = Math.hypot(s.x, s.z), grounded = s.y < (r > 1.02 ? surfaceY(r) : 0.035) + BALL_R + 0.012;
        rollSound(s.done ? 0 : Math.min(1, spd / 14) * (grounded ? 1 : 0), r > 1.02);
        wheelSound(s.done ? 0 : Math.min(1, s.wheelSpd / 2.2));
      } else {
        ball.visible = false; ball.userData.px = undefined; rollSound(0); wheelSound(0);
        wheelAngle = view ? view.wheelAngle || 0 : -(now / 9000) % (2 * Math.PI);
      }
      wheel.rotation.y = -wheelAngle;
      animateCat(now);
      selHeads.forEach(h => { h.position.y = h.userData.y + 0.015 + 0.015 * Math.sin(now / 130); });
      markGroup.children.forEach(m => { const s = 1 + 0.25 * Math.sin(now / 200); m.scale.set(s, s, s); });
      // 制限時間のバー
      const left = turnDeadline ? Math.max(0, (turnDeadline - now) / TURN_MS) : 0;
      timerBar.style.transform = `scaleX(${left})`;
      timerBar.parentNode.style.visibility = turnDeadline && view && view.phase === 'pin' ? 'visible' : 'hidden';
      timerBar.style.background = left < 0.25 ? '#ff6b6b' : view && view.turn >= 0 ? COLORS[view.turn] : '#fff';
      renderer.render(scene, camera);
      if (wantSnap) { wantSnap = false; takeSnap(); }   // 描いた直後なら preserveDrawingBuffer なしで読める
    }
    const timerBar = $('timer').firstElementChild;

    // ---- 操作：盤の縁（マスの境目）をタップしてピンを立てる ----
    const ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit = new THREE.Vector3();
    cv.addEventListener('pointerdown', e => {
      e.preventDefault();
      if (!myTurn()) return;
      const rect = cv.getBoundingClientRect();
      ray.setFromCamera({ x: (e.clientX - rect.left) / rect.width * 2 - 1, y: -(e.clientY - rect.top) / rect.height * 2 + 1 }, camera);
      // ピンの頭の高さあたりも押しやすいよう、少し上の面でも当たりを取る
      let best = null;
      for (const hgt of [0, PIN_H]) {
        plane.constant = -hgt;
        if (!ray.ray.intersectPlane(plane, hit)) continue;
        const r = Math.hypot(hit.x, hit.z);
        if (r < 0.4 || r > 1.3) continue;
        let th = Math.atan2(hit.x, -hit.z) - wheelAngle; th = ((th % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
        const i = Math.round(th / STEP) % N, err = Math.abs(th - Math.round(th / STEP) * STEP) * r + Math.abs(r - PIN_R) * 0.3;
        if (!best || err < best.err) best = { i, err };
      }
      if (!best) return;
      const i = best.i, lvl = ruleLevel(view, me), before = sel.join();
      if (sel.includes(i)) sel = sel.filter(x => x !== i);
      else if (sel.length === 0) { if (firstOk(i, lvl)) sel = [i]; }
      else if (okAt(view, me, sel[0], i, lvl)) sel = [sel[0], i];
      else if (firstOk(i, lvl)) sel = [i];
      if (sel.join() !== before) sndTap(sel.includes(i));
      else if (!sel.includes(i) && ruleLevel(view, me) === 2) flashRule = true;   // 置けない所を押したら、決まりの札をゆらして知らせる
      renderCtrl(); renderPlayers(); renderInfo();
      const ru = document.querySelector('#info .rule');
      if (flashRule && ru) { ru.classList.add('flash'); sndMiss(); }
      flashRule = false;
    });
    let flashRule = false;

    applyLang();
    requestAnimationFrame(frame);
  </script>
  <!-- 結果画面の広告（../../ad.js の説明を参照） -->
  <script src="../../ad.js" data-result="#panel.over" data-inline="#adSlot"></script>
