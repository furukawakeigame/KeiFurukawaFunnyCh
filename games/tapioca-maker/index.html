<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>タピオカメーカー</title>
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <!-- X などにURLを貼ったときのカード表示（ここだけは https:// から書く） -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ふるかわけい面白チャンネル">
  <meta property="og:title" content="タピオカメーカー">
  <meta property="og:url" content="https://keifurukawafunnych.com/games/tapioca-maker/">
  <meta property="og:image" content="https://keifurukawafunnych.com/games/tapioca-maker/icon.png">
  <meta name="twitter:card" content="summary">
  <style>
    html, body { margin: 0; height: 100%; background: #f6ece4; color: #5a3824; }
    body {
      display: flex; flex-direction: column; height: 100dvh;
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic UI", system-ui, sans-serif;
      overflow: hidden; touch-action: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; width: 100%; max-width: 560px; margin: 0 auto; box-sizing: border-box;
    }
    header a { color: #a0522d; text-decoration: none; font-weight: bold; }
    .hbtns { display: flex; gap: 6px; }
    .pill {
      font-size: 15px; background: #fff; border: 2px solid #e5cdb8; border-radius: 999px;
      min-width: 44px; height: 36px; cursor: pointer; font-weight: bold; color: #8a4a26; padding: 0 10px;
      display: flex; align-items: center; justify-content: center;
    }
    main {
      flex: 1; min-height: 0; display: flex; flex-direction: column;
      padding-bottom: calc(80px + env(safe-area-inset-bottom));
    }
    #stage { flex: 1; min-height: 0; position: relative; touch-action: none; }
    #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #count {
      position: absolute; top: 4px; left: 0; right: 0; text-align: center; font-weight: bold;
      font-size: 24px; pointer-events: none; text-shadow: 0 2px 0 #fff;
    }
    .bar {
      display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap;
      padding: 8px 12px; min-height: 52px;
    }
    .btn {
      font: inherit; font-weight: bold; font-size: 17px; border: none; border-radius: 999px;
      background: #7a4a2c; color: #fff; height: 46px; padding: 0 20px; cursor: pointer;
      box-shadow: 0 4px 0 #4e2c18; text-decoration: none; display: inline-flex; align-items: center;
    }
    .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #4e2c18; }
    .btn.sub { background: #fff; color: #7a4a2c; box-shadow: 0 4px 0 #e0c8b4; }
    .btn.on { background: #e8763c; color: #fff; box-shadow: 0 4px 0 #a84a1c; }
    .btn:disabled { opacity: .4; cursor: default; }
    .sw {
      width: 40px; height: 40px; border-radius: 50%; border: 3px solid #fff; cursor: pointer; padding: 0;
      box-shadow: 0 0 0 2px #e0c8b4;
    }
    .sw.on { box-shadow: 0 0 0 3px #7a4a2c; }
    .dot { display: inline-block; background: currentColor; border-radius: 50%; }
    .hide { display: none !important; }
    #drop {
      position: absolute; inset: 10px; border: 4px dashed #e8763c; border-radius: 20px;
      background: rgba(255, 255, 255, .5); pointer-events: none;
    }
    #err { position: absolute; top: 40%; left: 0; right: 0; text-align: center; color: #b03020; }
  </style>
</head>
<body>
  <header>
    <a id="back" href="../../">← トップへ戻る</a>
    <div class="hbtns">
      <button id="lang" class="pill">EN</button>
      <button id="snd" class="pill" aria-label="sound"></button>
    </div>
  </header>
  <main>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="count"></div>
      <div id="drop" class="hide"></div>
    </div>
    <div id="barStart" class="bar">
      <button id="pick" class="btn"></button>
    </div>
    <div id="barPaint" class="bar hide">
      <button id="brush" class="btn sub" aria-label="brush"><span class="dot" style="width:11px;height:11px"></span></button>
      <button id="erase" class="btn sub"></button>
      <button id="undo" class="btn sub"></button>
      <button id="done" class="btn" disabled></button>
    </div>
    <div id="barDrink" class="bar hide">
      <button class="sw on" data-c="0" style="background:#c9a27e"></button>
      <button class="sw" data-c="1" style="background:#8fbf6a"></button>
      <button class="sw" data-c="2" style="background:#f2a6b8"></button>
      <button id="save" class="btn"></button>
      <a id="post" class="btn"></a>
      <button id="again" class="btn sub"></button>
    </div>
    <input id="file" type="file" accept="image/*" class="hide">
  </main>
<script>
(() => {
  const SHARE_URL = 'https://keifurukawafunnych.com/games/tapioca-maker/';
  const store = {
    get(k, d) { try { const v = localStorage.getItem('tapioca:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('tapioca:' + k, JSON.stringify(v)); } catch {} },
  };
  const DICT = {
    ja: {
      title: 'タピオカメーカー', back: '← トップへ戻る', pick: '画像をえらぶ', erase: '消す', undo: '戻す',
      done: 'できた', save: '保存', post: 'Xに投稿', again: '画像を変える', count: n => `${n}粒`,
      shareText: n => `画像を${n}粒のタピオカにしました\n#タピオカメーカー`, err: '画像を読み込めませんでした',
    },
    en: {
      title: 'Tapioca Maker', back: '← Back to top', pick: 'Choose image', erase: 'Erase', undo: 'Undo',
      done: 'Done', save: 'Save', post: 'Post on X', again: 'New image', count: n => `${n} pearls`,
      shareText: n => `I turned my picture into ${n} tapioca pearls\n#TapiocaMaker`, err: 'Could not load the image',
    },
  };
  let lang = store.get('lang', (navigator.language || '').startsWith('ja') ? 'ja' : 'en');
  const t = k => DICT[lang][k];
  const $ = id => document.getElementById(id);

  // ---------- sound ----------
  let soundOn = store.get('sound', true), actx = null;
  const SPK = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>';
  function drawSnd() {
    $('snd').innerHTML = SPK + (soundOn ? '<path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>' : '<path d="M17 9l5 6M22 9l-5 6"/>') + '</svg>';
  }
  function plop(vol) {
    if (!soundOn) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain(), now = actx.currentTime;
      o.type = 'sine';
      o.frequency.setValueAtTime(380 + Math.random() * 160, now);
      o.frequency.exponentialRampToValueAtTime(140, now + 0.09);
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(0.25 * vol, now + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
      o.connect(g).connect(actx.destination); o.start(now); o.stop(now + 0.13);
    } catch {}
  }

  // ---------- state ----------
  const cv = $('cv'), ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  let mode = 'start';
  let img = null;                       // source canvas (downscaled)
  let mask = null, mctx = null;         // paint mask
  let view = null;                      // image placement on screen in paint mode
  let brushIdx = 1, erasing = false, undoStack = [];
  let sprite = null;                    // cut-out image
  let pearls = [];
  let colorIdx = store.get('color', 0);
  const DRINKS = [
    { top: '#e6cfb6', bot: '#c49a74' },
    { top: '#cfe4b4', bot: '#86b55e' },
    { top: '#fbd3dd', bot: '#ee9ab0' },
  ];
  const MAX_PEARLS = 60, R = 0.075;
  const CUP = { tw: 1, bw: 0.76, h: 1.42 };
  let liquid = 0;                       // 0..1 fill animation
  let shakeX = 0, shakeV = 0, dragging = null, prevShake = 0, prevShakeV = 0;
  const ice = [[-0.22, 0.2, 0.3], [0.12, 0.15, -0.25], [0.28, 0.32, 0.6], [-0.05, 0.36, 1.1]];

  // ---------- layout ----------
  function resize() {
    const r = $('stage').getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    if (img) placeImage();
    render();
  }
  function cupGeom(w, h) {
    // scale so the cup + straw fits
    const s = Math.min(w * 0.62, (h - 30) / (CUP.h + 0.62));
    return { s, cx: w / 2, top: (h - (CUP.h + 0.36) * s) / 2 + 0.36 * s };
  }

  // ---------- image loading ----------
  function loadFile(f) {
    if (!f || !f.type.startsWith('image/')) return;
    const url = URL.createObjectURL(f);
    const im = new Image();
    im.onload = () => {
      URL.revokeObjectURL(url);
      const k = Math.min(1, 1600 / Math.max(im.width, im.height));
      img = document.createElement('canvas');
      img.width = Math.max(1, Math.round(im.width * k)); img.height = Math.max(1, Math.round(im.height * k));
      img.getContext('2d').drawImage(im, 0, 0, img.width, img.height);
      mask = document.createElement('canvas'); mask.width = img.width; mask.height = img.height;
      mctx = mask.getContext('2d');
      undoStack = []; erasing = false; touches.clear(); pinch = null;
      placeImage();
      setMode('paint');
    };
    im.onerror = () => { URL.revokeObjectURL(url); flashErr(); };
    im.src = url;
  }
  function flashErr() {
    const d = document.createElement('div'); d.id = 'err'; d.textContent = t('err');
    $('stage').appendChild(d); setTimeout(() => d.remove(), 2000);
  }
  function snapFit() { if (view.k <= view.fit * 1.001) { view.x = (W - img.width * view.k) / 2; view.y = (H - img.height * view.k) / 2; } }
  function placeImage() {
    const pad = 12, k = Math.min((W - pad * 2) / img.width, (H - pad * 2) / img.height);
    view = { k, fit: k, x: (W - img.width * k) / 2, y: (H - img.height * k) / 2 };
  }

  // ---------- painting ----------
  let lastPt = null, pinch = null;
  const touches = new Map();
  const mid = (a, b) => { const r = cv.getBoundingClientRect(); return { x: (a.x + b.x) / 2 - r.left, y: (a.y + b.y) / 2 - r.top }; };
  function toImg(e) {
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left - view.x) / view.k, y: (e.clientY - r.top - view.y) / view.k };
  }
  const BRUSH = [8, 22, 50];
  function brushPx() { return BRUSH[brushIdx] / view.k; }
  function stroke(a, b) {
    mctx.save();
    mctx.globalCompositeOperation = erasing ? 'destination-out' : 'source-over';
    mctx.strokeStyle = '#000'; mctx.fillStyle = '#000';
    mctx.lineCap = 'round'; mctx.lineJoin = 'round'; mctx.lineWidth = brushPx();
    mctx.beginPath(); mctx.moveTo(a.x, a.y); mctx.lineTo(b.x, b.y); mctx.stroke();
    mctx.beginPath(); mctx.arc(b.x, b.y, brushPx() / 2, 0, Math.PI * 2); mctx.fill();
    mctx.restore();
  }
  function maskBox() {
    const d = mctx.getImageData(0, 0, mask.width, mask.height).data;
    let x0 = mask.width, y0 = mask.height, x1 = -1, y1 = -1;
    for (let y = 0; y < mask.height; y++) for (let x = 0; x < mask.width; x++) {
      if (d[(y * mask.width + x) * 4 + 3] > 20) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
    return x1 < 0 ? null : { x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1 };
  }
  function updateDone() { $('done').disabled = !maskBox(); }

  function makeSprite() {
    const b = maskBox(); if (!b) return false;
    const k = Math.min(1, 256 / Math.max(b.w, b.h));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(b.w * k)); c.height = Math.max(1, Math.round(b.h * k));
    const g = c.getContext('2d');
    g.drawImage(img, b.x, b.y, b.w, b.h, 0, 0, c.width, c.height);
    g.globalCompositeOperation = 'destination-in';
    g.drawImage(mask, b.x, b.y, b.w, b.h, 0, 0, c.width, c.height);
    sprite = c;
    return true;
  }

  // ---------- pearls / physics (cup-local units, cup top width = 1) ----------
  function addPearl(x) {
    if (pearls.length >= MAX_PEARLS) return;
    const lim = CUP.tw / 2 - R * 1.4;
    pearls.push({
      x: x === undefined ? (Math.random() * 2 - 1) * lim * 0.8 : Math.max(-lim, Math.min(lim, x)),
      y: -0.35 - Math.random() * 0.1, vx: (Math.random() - 0.5) * 0.3, vy: 0,
      a: Math.random() * Math.PI * 2, va: 0, landed: false,
    });
    updateCount();
  }
  const walls = () => {
    const ext = 0.8, hw = CUP.tw / 2, bw = CUP.bw / 2, slope = (hw - bw) / CUP.h;
    return [
      [-hw - slope * ext, -ext, -bw, CUP.h],
      [bw, CUP.h, hw + slope * ext, -ext],
      [-bw, CUP.h, bw, CUP.h],
    ];
  };
  function step(dt, ax) {
    const G = 4.2, ws = walls();
    for (const p of pearls) {
      p.vx += -ax * dt; p.vy += G * dt;
      p.vx *= 0.995; p.vy *= 0.995;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.a += p.va * dt; p.va *= 0.94;
    }
    for (let it = 0; it < 4; it++) {
      for (let i = 0; i < pearls.length; i++) {
        const p = pearls[i];
        for (let j = i + 1; j < pearls.length; j++) {
          const q = pearls[j], dx = q.x - p.x, dy = q.y - p.y, d2 = dx * dx + dy * dy, md = R * 2;
          if (d2 < md * md && d2 > 1e-9) {
            const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, o = (md - d) * 0.25;
            p.x -= nx * o; p.y -= ny * o; q.x += nx * o; q.y += ny * o;
            const rv = (q.vx - p.vx) * nx + (q.vy - p.vy) * ny;
            if (rv < 0) {
              const imp = -rv * 0.55;
              p.vx -= nx * imp; p.vy -= ny * imp; q.vx += nx * imp; q.vy += ny * imp;
              const tv = (q.vx - p.vx) * -ny + (q.vy - p.vy) * nx;
              
            }
          }
        }
        for (const [x1, y1, x2, y2] of ws) {
          const ex = x2 - x1, ey = y2 - y1, L2 = ex * ex + ey * ey;
          let u = ((p.x - x1) * ex + (p.y - y1) * ey) / L2; u = Math.max(0, Math.min(1, u));
          const cx = x1 + ex * u, cy = y1 + ey * u, dx = p.x - cx, dy = p.y - cy, d2 = dx * dx + dy * dy;
          if (d2 < R * R) {
            const d = Math.sqrt(d2) || 1e-6, nx = dx / d, ny = dy / d;
            p.x = cx + nx * R; p.y = cy + ny * R;
            const vn = p.vx * nx + p.vy * ny;
            if (vn < 0) {
              if (!p.landed && vn < -0.6) { p.landed = true; plop(Math.min(1, -vn / 3)); }
              p.vx -= 1.15 * vn * nx; p.vy -= 1.15 * vn * ny;
              p.vx *= 0.85; p.vy *= 0.85;
              
            }
          }
        }
      }
    }
    for (const p of pearls) {
      const sp = Math.hypot(p.vx, p.vy);
      if (sp > 4) { p.vx *= 4 / sp; p.vy *= 4 / sp; }
      // roll with sideways motion; stop spinning once at rest
      if (sp > 0.25) p.va += (p.vx / R * 0.4 - p.va) * 0.2;
      p.va = Math.max(-8, Math.min(8, p.va));
    }
    for (const p of pearls) if (!p.landed && p.vy < 0.2 && p.y > 0.2) p.landed = true;
  }

  // ---------- drawing ----------
  function cupPath(g) {
    const hw = CUP.tw / 2, bw = CUP.bw / 2;
    g.beginPath();
    g.moveTo(-hw, 0); g.lineTo(hw, 0); g.lineTo(bw, CUP.h - 0.05);
    g.quadraticCurveTo(bw, CUP.h, bw - 0.05, CUP.h); g.lineTo(-bw + 0.05, CUP.h);
    g.quadraticCurveTo(-bw, CUP.h, -bw, CUP.h - 0.05); g.closePath();
  }
  function drawDrink(g, s, cx, top, opt) {
    g.save();
    g.translate(cx, top); g.scale(s, s);
    const lw = 1 / s;
    // shadow
    g.fillStyle = 'rgba(90,56,36,.12)';
    g.beginPath(); g.ellipse(0, CUP.h + 0.03, CUP.bw * 0.62, 0.05, 0, 0, Math.PI * 2); g.fill();
    // cup inside
    cupPath(g); g.fillStyle = 'rgba(255,255,255,.55)'; g.fill();
    g.save(); cupPath(g); g.clip();
    // liquid
    const lev = CUP.h - (CUP.h - 0.12) * opt.liquid;
    if (opt.liquid > 0) {
      const d = DRINKS[opt.color];
      const gr = g.createLinearGradient(0, lev, 0, CUP.h);
      gr.addColorStop(0, d.top); gr.addColorStop(1, d.bot);
      g.fillStyle = gr;
      g.beginPath(); g.moveTo(-1, CUP.h + 1);
      const tilt = Math.max(-0.08, Math.min(0.08, -opt.tilt * 0.04));
      for (let x = -0.6; x <= 0.6; x += 0.05) g.lineTo(x, lev + x * tilt + Math.sin(x * 9 + opt.time * 3) * 0.008);
      g.lineTo(1, CUP.h + 1); g.closePath(); g.fill();
    }
    // straw (back part)
    const sx0 = 0.12, sy0 = CUP.h - 0.12, sx1 = 0.34, sy1 = -0.36, sw = 0.11;
    g.save();
    g.strokeStyle = opt.straw; g.lineWidth = sw; g.lineCap = 'butt'; g.globalAlpha = 0.9;
    g.beginPath(); g.moveTo(sx0, sy0); g.lineTo(sx1 * 0.9 + sx0 * 0.1, 0); g.stroke();
    g.restore();
    // pearls
    if (opt.sprite) {
      const sp = opt.sprite, k = (R * 2.3) / Math.max(sp.width, sp.height);
      for (const p of opt.pearls) {
        g.save(); g.translate(p.x, p.y); g.rotate(p.a);
        g.drawImage(sp, -sp.width * k / 2, -sp.height * k / 2, sp.width * k, sp.height * k);
        g.restore();
      }
    }
    // ice
    if (opt.liquid > 0.6) {
      g.globalAlpha = Math.min(1, (opt.liquid - 0.6) * 2.5);
      for (const [x, y, a] of ice) {
        g.save(); g.translate(x, lev + y * 0.5 + Math.sin(opt.time * 2 + a * 3) * 0.006); g.rotate(a);
        g.fillStyle = 'rgba(255,255,255,.45)'; g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 2 * lw;
        roundRect(g, -0.08, -0.08, 0.16, 0.16, 0.03); g.fill(); g.stroke();
        g.restore();
      }
      g.globalAlpha = 1;
    }
    g.restore();
    // straw (above liquid / outside)
    g.save();
    g.strokeStyle = opt.straw; g.lineWidth = sw;
    g.beginPath(); g.moveTo(sx1 * 0.9 + sx0 * 0.1, 0.01); g.lineTo(sx1, sy1); g.stroke();
    g.strokeStyle = 'rgba(255,255,255,.45)'; g.lineWidth = sw * 0.25;
    g.beginPath(); g.moveTo(sx1 * 0.9 + sx0 * 0.1 - 0.025, 0.01); g.lineTo(sx1 - 0.025, sy1); g.stroke();
    g.restore();
    // sealed film + cup outline + shine
    g.fillStyle = 'rgba(255,255,255,.5)';
    g.beginPath(); g.ellipse(0, 0, CUP.tw / 2 + 0.02, 0.045, 0, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#d9c2ae'; g.lineWidth = 3 * lw; g.stroke();
    cupPath(g); g.strokeStyle = '#d9c2ae'; g.lineWidth = 4 * lw; g.stroke();
    g.fillStyle = 'rgba(255,255,255,.35)';
    g.beginPath(); g.moveTo(-0.4, 0.08); g.lineTo(-0.33, 0.08); g.lineTo(-0.26, CUP.h - 0.1); g.lineTo(-0.31, CUP.h - 0.1); g.closePath(); g.fill();
    g.restore();
  }
  function roundRect(g, x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }
  let time = 0;
  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    if (mode === 'paint' && img) {
      const { k, x, y } = view;
      ctx.save();
      ctx.fillStyle = '#3b2a20'; ctx.fillRect(x, y, img.width * k, img.height * k);
      ctx.globalAlpha = 0.35; ctx.drawImage(img, x, y, img.width * k, img.height * k); ctx.globalAlpha = 1;
      const tmp = paintTmp();
      ctx.drawImage(tmp, x, y, img.width * k, img.height * k);
      ctx.restore();
      return;
    }
    const gm = cupGeom(W, H);
    drawDrink(ctx, gm.s, gm.cx + shakeX, gm.top, {
      liquid: mode === 'drink' ? liquid : 0, color: colorIdx, pearls, sprite, time, tilt: shakeV, straw: '#e8763c',
    });
  }
  let tmpC = null;
  function paintTmp() {
    if (!tmpC || tmpC.width !== img.width || tmpC.height !== img.height) {
      tmpC = document.createElement('canvas'); tmpC.width = img.width; tmpC.height = img.height;
    }
    const g = tmpC.getContext('2d');
    g.globalCompositeOperation = 'source-over';
    g.clearRect(0, 0, tmpC.width, tmpC.height);
    g.drawImage(mask, 0, 0);
    g.globalCompositeOperation = 'source-in';
    g.drawImage(img, 0, 0);
    g.globalCompositeOperation = 'source-atop';
    g.fillStyle = 'rgba(60, 220, 110, 0.45)';
    g.fillRect(0, 0, tmpC.width, tmpC.height);
    return tmpC;
  }

  // ---------- loop ----------
  let axS = 0, lastT = performance.now(), spawnLeft = 0, spawnT = 0;
  function loop(now) {
    const dt = Math.min(0.033, (now - lastT) / 1000); lastT = now; time += dt;
    if (mode === 'drink') {
      if (spawnLeft > 0) { spawnT -= dt; if (spawnT <= 0) { addPearl(); spawnLeft--; spawnT = 0.07; } }
      if (spawnLeft === 0 && liquid < 1) liquid = Math.min(1, liquid + dt * 0.7);
      if (!dragging) { shakeV += (-shakeX * 120 - shakeV * 10) * dt; shakeX += shakeV * dt; }
      const gm = cupGeom(W, H);
      const vel = (shakeX - prevShake) / dt; const acc = (vel - prevShakeV) / dt;
      prevShake = shakeX; prevShakeV = vel;
      axS += (Math.max(-15, Math.min(15, acc / gm.s)) - axS) * Math.min(1, dt * 10);
      const sub = 6;
      for (let i = 0; i < sub; i++) step(dt / sub, axS * (liquid > 0.3 ? 0.6 : 1));
      render();
    }
    requestAnimationFrame(loop);
  }

  // ---------- input ----------
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    cv.setPointerCapture(e.pointerId);
    if (mode === 'start') { $('file').click(); return; }
    if (mode === 'paint') {
      touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (touches.size === 1 && !pinch) {
        undoStack.push(mctx.getImageData(0, 0, mask.width, mask.height));
        if (undoStack.length > 20) undoStack.shift();
        lastPt = toImg(e); stroke(lastPt, lastPt); render();
      } else if (touches.size === 2) {
        // second finger: cancel the stroke just started and zoom instead
        if (lastPt) { const d = undoStack.pop(); if (d) mctx.putImageData(d, 0, 0); lastPt = null; }
        const [a, b] = [...touches.values()];
        pinch = { d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, m0: mid(a, b), k0: view.k, x0: view.x, y0: view.y };
        render();
      }
      return;
    }
    if (mode === 'drink') dragging = { x0: e.clientX, s0: shakeX, moved: false, t: performance.now() };
  });
  cv.addEventListener('pointermove', e => {
    if (mode === 'paint' && touches.has(e.pointerId)) {
      touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pinch && touches.size >= 2) {
        const [a, b] = [...touches.values()], m = mid(a, b);
        const k = Math.max(view.fit, Math.min(view.fit * 12, pinch.k0 * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d0));
        view.x = m.x - (pinch.m0.x - pinch.x0) / pinch.k0 * k;
        view.y = m.y - (pinch.m0.y - pinch.y0) / pinch.k0 * k;
        view.k = k; snapFit(); render();
      } else if (lastPt) { const p = toImg(e); stroke(lastPt, p); lastPt = p; render(); }
    }
    if (mode === 'drink' && dragging) {
      const dx = e.clientX - dragging.x0;
      if (Math.abs(dx) > 6) dragging.moved = true;
      if (dragging.moved) shakeX = Math.max(-W * 0.3, Math.min(W * 0.3, dragging.s0 + dx));
    }
  });
  const up = e => {
    if (mode === 'paint') {
      touches.delete(e.pointerId);
      if (touches.size === 0) pinch = null;
      if (lastPt) { lastPt = null; updateDone(); }
    }
    if (mode === 'drink' && dragging) {
      if (!dragging.moved) {
        const gm = cupGeom(W, H), r = cv.getBoundingClientRect();
        addPearl((e.clientX - r.left - gm.cx - shakeX) / gm.s);
      }
      shakeV = 0; dragging = null;
    }
  };
  cv.addEventListener('pointerup', up);
  // PC: wheel zooms around the cursor
  cv.addEventListener('wheel', e => {
    if (mode !== 'paint') return;
    e.preventDefault();
    const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
    const k = Math.max(view.fit, Math.min(view.fit * 12, view.k * Math.exp(-e.deltaY * 0.0015)));
    view.x = mx - (mx - view.x) / view.k * k; view.y = my - (my - view.y) / view.k * k; view.k = k; snapFit();
    render();
  }, { passive: false });
  cv.addEventListener('pointercancel', up);

  $('pick').onclick = () => $('file').click();
  $('again').onclick = () => $('file').click();
  $('file').onchange = e => { loadFile(e.target.files[0]); e.target.value = ''; };
  $('brush').onclick = () => {
    brushIdx = (brushIdx + 1) % BRUSH.length;
    const d = $('brush').firstChild; d.style.width = d.style.height = [5, 11, 20][brushIdx] + 'px';
  };
  $('erase').onclick = () => { erasing = !erasing; $('erase').classList.toggle('on', erasing); };
  $('undo').onclick = () => {
    const d = undoStack.pop(); if (d) { mctx.putImageData(d, 0, 0); render(); updateDone(); }
  };
  $('done').onclick = () => {
    if (!makeSprite()) return;
    pearls = []; liquid = 0; spawnLeft = 30; spawnT = 0; shakeX = 0; shakeV = 0;
    setMode('drink');
  };
  document.querySelectorAll('.sw').forEach(b => b.onclick = () => {
    colorIdx = +b.dataset.c; store.set('color', colorIdx); markSw();
  });
  function markSw() { document.querySelectorAll('.sw').forEach(b => b.classList.toggle('on', +b.dataset.c === colorIdx)); }

  // drag & drop
  ['dragenter', 'dragover'].forEach(ev => window.addEventListener(ev, e => { e.preventDefault(); $('drop').classList.remove('hide'); }));
  ['dragleave', 'drop'].forEach(ev => window.addEventListener(ev, e => { e.preventDefault(); $('drop').classList.add('hide'); }));
  window.addEventListener('drop', e => { const f = e.dataTransfer && e.dataTransfer.files[0]; if (f) loadFile(f); });

  // ---------- export ----------
  function exportCanvas() {
    const c = document.createElement('canvas'); c.width = 1080; c.height = 1350;
    const g = c.getContext('2d');
    g.fillStyle = '#f6ece4'; g.fillRect(0, 0, c.width, c.height);
    const gm = cupGeom(c.width, c.height - 80);
    drawDrink(g, gm.s, gm.cx, gm.top + 40, { liquid: 1, color: colorIdx, pearls, sprite, time, tilt: 0, straw: '#e8763c' });
    g.fillStyle = '#a0522d'; g.font = 'bold 34px sans-serif'; g.textAlign = 'right';
    g.fillText('keifurukawafunnych.com', c.width - 40, c.height - 40);
    return c;
  }
  $('save').onclick = () => {
    exportCanvas().toBlob(async blob => {
      const file = new File([blob], 'tapioca.png', { type: 'image/png' });
      if (matchMedia('(pointer: coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file] }); return; } catch (err) { if (err.name === 'AbortError') return; }
      }
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'tapioca.png';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, 'image/png');
  };

  // ---------- UI text / modes ----------
  function updateCount() { $('count').textContent = mode === 'drink' ? t('count')(pearls.length) : ''; updatePost(); }
  function updatePost() {
    const a = $('post');
    a.href = `https://x.com/intent/post?text=${encodeURIComponent(t('shareText')(pearls.length))}&url=${encodeURIComponent(SHARE_URL)}`;
    if (!matchMedia('(pointer: coarse)').matches) { a.target = '_blank'; a.rel = 'noopener'; }
  }
  function setMode(m) {
    mode = m;
    $('barStart').classList.toggle('hide', m !== 'start');
    $('barPaint').classList.toggle('hide', m !== 'paint');
    $('barDrink').classList.toggle('hide', m !== 'drink');
    if (m === 'paint') { $('erase').classList.remove('on'); updateDone(); }
    updateCount(); render();
  }
  function applyLang() {
    document.documentElement.lang = lang;
    document.title = t('title');
    $('back').textContent = t('back');
    $('lang').textContent = lang === 'ja' ? 'EN' : '日本語';
    for (const k of ['pick', 'erase', 'undo', 'done', 'save', 'post', 'again']) $(k).textContent = t(k);
    updateCount();
  }
  $('lang').onclick = () => { lang = lang === 'ja' ? 'en' : 'ja'; store.set('lang', lang); applyLang(); };
  $('snd').onclick = () => { soundOn = !soundOn; store.set('sound', soundOn); drawSnd(); };

  drawSnd(); applyLang(); markSw();
  new ResizeObserver(resize).observe($('stage'));
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
