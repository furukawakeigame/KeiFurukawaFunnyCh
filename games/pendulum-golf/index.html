  } catch {}

// ---- world (meters) ----

const cv = $('cv'), ctx = cv.getContext('2d');

function step() {

  if (CORE.state === 'done' && !runEnd) runEnd = CORE.steps; // the step the ball stopped (the server replays up to here)

function dist() { return CORE.dist(); }

// ---- input ----
let scale = 100, originX = 0, groundY = 0;

});

$('start').onclick = () => { $('title').hidden = true; reset(); state = 'ready'; beep(600, .1); };
$('again').onclick = () => { $('result').hidden = true; $('rank').hidden = true; reset(); state = 'ready'; startSession(); beep(600, .1); };

function showResult() {

  $('rBest').textContent = `${t('best')} ${(best ?? 0).toFixed(1)}${t('m')}`;
  const a = $('share');
  a.href = `https://x.com/intent/post?text=${encodeURIComponent(L[lang].post(d))}&url=${encodeURIComponent('https://keifurukawafunnych.com/games/pendulum-golf/')}`;
  if (matchMedia('(pointer: coarse)').matches) { a.removeAttribute('target'); a.removeAttribute('rel'); }

}

  if (best === null || finalDist > best) { best = finalDist; store.set('best', best); }
  beep(500, .15, 'square', .2); setTimeout(() => beep(800, .25, 'square', .2), 150);
  const sc = Math.round(finalDist * 10) / 10;

  setTimeout(() => { showResult(); $('result').hidden = false; }, 700);
}

// ---- render ----
function resize() {

addEventListener('resize', resize);

function draw() {

      for (let j = 0; j < 2; j++) {
        const h = Math.abs(Math.sin(i * 12.9898 + j * 78.233) * 43758.5453) % 1;
        const sx = X(i + h), sy = GY + (0.4 + ((h * 7) % 1) * 2.8) * scale;
        if (sy > H + 10) continue;
        ctx.fillStyle = h > 0.5 ? 'rgba(0,0,0,.18)' : 'rgba(255,255,255,.12)';
        ctx.beginPath(); ctx.ellipse(sx, sy, (0.05 + h * 0.08) * scale, (0.03 + h * 0.05) * scale, 0, 0, 7); ctx.fill();
      }
    }
  }
  ctx.fillStyle = '#4aa64a'; ctx.fillRect(0, GY, W, 6);
  // markers
  const step10 = scale < 30 ? 50 : 10;
  ctx.font = 'bold 14px system-ui'; ctx.textAlign = 'center';
  for (let m = Math.floor((camX - originX / scale) / step10) * step10; X(m) < W + 40; m += step10) {
    if (m === 0) continue;
    const x = X(m + BALL_X);
    ctx.fillStyle = '#fff'; ctx.fillRect(x - 1, GY - 26, 3, 26);
    ctx.fillStyle = '#e03131'; ctx.beginPath(); ctx.moveTo(x + 2, GY - 26); ctx.lineTo(x + 18, GY - 21); ctx.lineTo(x + 2, GY - 16); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillText(m + 'm', x, GY + 20);
  }
  if (best !== null && best !== 0) { const x = X(best + BALL_X); if (x > -20 && x < W + 20) { ctx.strokeStyle = '#ffd43b'; ctx.lineWidth = 3; ctx.setLineDash([6, 6]); ctx.beginPath(); ctx.moveTo(x, GY - 60); ctx.lineTo(x, GY); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle = '#e8b500'; ctx.fillText(t('best'), x, GY - 66); } }
  // tee
  ctx.fillStyle = '#fff'; ctx.fillRect(X(BALL_X) - Math.max(2, scale * 0.015), Y(TEE_H), Math.max(4, scale * 0.03), TEE_H * scale + 6); ctx.fillRect(X(BALL_X) - scale * 0.05, Y(TEE_H), scale * 0.1, Math.max(3, scale * 0.02));
  // body (golfer stand)
  ctx.strokeStyle = '#334'; ctx.lineWidth = Math.max(3, scale * 0.06); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(X(-0.15), Y(0)); ctx.lineTo(X(-0.05), Y(1.2)); ctx.lineTo(X(0.05), Y(0)); ctx.moveTo(X(-0.05), Y(1.2)); ctx.lineTo(X(0), Y(SH.y)); ctx.stroke();
  // pendulum
  const cols = ['#e8590c', '#1971c2', '#495057'];
  let prev = SH;
  for (let i = 0; i < 3; i++) {
    const p = pts[i];
    ctx.strokeStyle = cols[i]; ctx.lineWidth = Math.max(3, scale * (i === 2 ? 0.035 : 0.05));
    ctx.beginPath(); ctx.moveTo(X(prev.x), Y(prev.y)); ctx.lineTo(X(p.x), Y(p.y)); ctx.stroke();
    ctx.fillStyle = '#223'; ctx.beginPath(); ctx.arc(X(prev.x), Y(prev.y), Math.max(3, scale * 0.04), 0, 7); ctx.fill();
    prev = p;
  }
  { const hr = scale * 0.32, hx = X(-0.02), hy = Y(SH.y + 0.28);
    if (catImg.complete && catImg.naturalWidth) ctx.drawImage(catImg, hx - hr, hy - hr, hr * 2, hr * 2);
    else { ctx.fillStyle = '#334'; ctx.beginPath(); ctx.arc(hx, hy, hr, 0, 7); ctx.fill(); } }
  // head
  const h = pts[2], h1 = pts[1], ang = Math.atan2(h.y - h1.y, h.x - h1.x);
  ctx.save(); ctx.translate(X(h.x), Y(h.y)); ctx.rotate(-ang);
  ctx.fillStyle = '#343a40'; ctx.beginPath(); ctx.roundRect(-scale * 0.05, -scale * 0.09, scale * 0.12, scale * 0.18, scale * 0.04); ctx.fill();
  ctx.restore();
  // ball
  ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(X(ball.x), Y(0) + 2, BALL_R * scale, BALL_R * scale * 0.3, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#999'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(X(ball.x), Y(ball.y), Math.max(4, BALL_R * scale), 0, 7); ctx.fill(); ctx.stroke();
  // grab line
  const grab = CORE.grab;
  if (grab) { ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(X(h.x), Y(h.y)); ctx.lineTo(X(grab.x), Y(grab.y)); ctx.stroke(); ctx.setLineDash([]); }
  // hint: pulsing ring on head when ready
  if ((state === 'ready' || state === 'swing') && !grab) { const k = (performance.now() / 900) % 1; ctx.strokeStyle = `rgba(255,255,255,${1 - k})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(X(h.x), Y(h.y), 15 + k * 30, 0, 7); ctx.stroke(); }
  ctx.restore();
  $('dist').textContent = (state === 'fly' || state === 'done') ? dist().toFixed(1) + 'm' : '';
}

let last = performance.now();
function loop(now) {
  let fdt = Math.min(0.05, (now - last) / 1000); last = now;
  const sub = 8, dt = 1 / 480;
  let n = Math.round(fdt / dt);
  if (hitStop > 0) hitStop -= fdt;
  else for (let i = 0; i < n && hitStop <= 0; i++) step();
  zoom += ((hitStop > 0 ? 1.6 + hitPow * 1.2 : 1) - zoom) * Math.min(1, fdt * (hitStop > 0 ? 18 : 6));
  if (hitStop <= 0) hitFlash = Math.max(0, hitFlash - fdt * 2);
  if (state === 'fly') {
    const W = cv.clientWidth, H = cv.clientHeight, mg = Math.min(W, H) * 0.35, k = Math.min(1, fdt * 25);
    camX += (ball.x - (W / 2 - originX) / scale - camX) * k;
    camY += (Math.max(0, ball.y - (groundY - H / 2) / scale) - camY) * k;
    camX = Math.min(ball.x - (mg - originX) / scale, Math.max(ball.x - (W - mg - originX) / scale, camX));
    camY = Math.max(0, Math.min(ball.y + (H - mg - groundY) / scale, Math.max(ball.y - (groundY - mg) / scale, camY)));
    if (CORE.state === 'done') finish();
  }
  draw();
  requestAnimationFrame(loop);
}

// ---------- ランキング（今日・全期間。.claude/ranking.gs を Google Apps Script で公開した URL。空なら出さない） ----------
// ズル対策: 遊ぶ前にサーバーから整理券をもらっておき、登録の時は操作の記録を送る。サーバーは core.js と同じ計算で再生して確かめる
const RANK_URL = 'https://script.google.com/macros/s/AKfycbyAE0TZe6QHNZHmRVlMaf2yG6FnfKSyhSrBR57AyhpkJjVmhWfHSz9mL2Tar__EUihGwA/exec';
const GAME_ID = 'pendulum-golf';
let dev = store.get('dev', '');
if (!dev) { dev = Math.random().toString(36).slice(2) + Date.now().toString(36); store.set('dev', dev); }
$('rankBtn').hidden = !RANK_URL;
const rank = { data: null, tab: 'today', err: '', msg: '', detail: '', sent: false, me: null, busy: false, body: null };
let sess = null;
async function rpost(body) { const r = await fetch(RANK_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }); return await r.json(); }
// 次の回の整理券を先にもらっておく（サーバーが混んでいたら、間をあけて取り直す。登録までに届けばよい）
function startSession() {
  if (!RANK_URL) return;
  const me = sess = { tok: null, chain: null };
  me.chain = (async () => {
    for (let i = 0; i < 7 && sess === me; i++) {
      try { const j = await rpost({ act: 'start', game: GAME_ID, dev }); if (j.ok && j.tok) { me.tok = j.tok; return; } } catch {}
      await new Promise(r => setTimeout(r, 1500 * 2 ** Math.min(i, 3)));
    }
  })();
}
// 結果が出たら呼ぶ: この回の登録内容（score と操作の記録）。null なら登録できない
function resetRank(body) { rank.sent = false; rank.me = null; rank.msg = ''; rank.detail = ''; rank.busy = false; rank.body = body; }
function renderRank() {
  const ol = $('rkList'); ol.innerHTML = '';
  $('tabToday').classList.toggle('on', rank.tab === 'today'); $('tabAll').classList.toggle('on', rank.tab === 'all');
  $('rkNote').textContent = rank.tab === 'today' ? t('rkNote') : ''; $('rkRule').textContent = t('rkRule');
  const list = rank.data && (rank.data[rank.tab] || []);
  const row = (cls, n, name, w) => { const li = document.createElement('li'); if (cls) li.className = cls; for (const [c, v] of [['n', n], ['nm', name], ['w', rankFmt(w)]]) { const sp = document.createElement('span'); sp.className = c; sp.textContent = v; li.append(sp); } ol.append(li); };
  const empty = txt => { const li = document.createElement('li'); li.className = 'empty'; li.textContent = txt; ol.append(li); };
  if (!list) empty(rank.err || t('rkLoad'));
  else if (!list.length) empty(t('rkEmpty'));
  else list.forEach((r, i) => row(rank.me && r.name === rank.me.name && r.wave === rank.me.score ? 'me' : '', i + 1, r.name, r.wave));
  // 自分が上位10人の外なら、一覧の下に自分の順位と記録を出す（登録できたことが分かるように）
  const mine = rank.me && typeof rank.msg === 'object' && rank.msg[rank.tab];
  if (list && mine > list.length) { const g = document.createElement('li'); g.className = 'gap'; g.textContent = '…'; ol.append(g); row('me', mine, rank.me.name, rank.me.score); }
  $('rkMsg').textContent = rank.msg ? (typeof rank.msg === 'object' ? t('rkYou')(rank.msg.today, rank.msg.all) : t(rank.msg)) : '';
  $('rkDetail').textContent = rank.msg && typeof rank.msg !== 'object' && rank.msg !== 'rkCheck' ? rank.detail || '' : '';
  $('rkForm').hidden = rank.sent || !rank.body || !(rank.body.score > 0);
  $('rkSend').disabled = rank.busy;
}
async function loadRank() {
  rank.data = null; rank.err = ''; renderRank();
  try { const r = await fetch(`${RANK_URL}?game=${GAME_ID}`); const j = await r.json(); rank.data = { today: j.today || [], all: j.all || [] }; }
  catch { rank.err = t('rkFail'); }
  renderRank();
}
// ランキングを開いている間は結果を隠す（広告もいったん消える）
$('rankBtn').onclick = () => { showResultPanel(false); $('rank').hidden = false; $('rkName').value = store.get('name', ''); loadRank(); };
$('tabToday').onclick = () => { rank.tab = 'today'; renderRank(); };
$('tabAll').onclick = () => { rank.tab = 'all'; renderRank(); };
$('rkClose').onclick = () => { $('rank').hidden = true; if (inResult()) showResultPanel(true); };
$('rkForm').onsubmit = async e => {
  e.preventDefault();
  if (rank.busy || rank.sent || !rank.body) return;
  const name = $('rkName').value.replace(/\s+/g, ' ').trim().slice(0, 8);
  if (!name) { $('rkName').focus(); return; }
  store.set('name', name);
  rank.busy = true; rank.msg = 'rkCheck'; renderRank();
  const body = { act: 'submit', game: GAME_ID, tok: '', name, dev, ...rank.body };
  try {
    const me = sess; if (me) { await me.chain; body.tok = me.tok || ''; } // 整理券がなくても送る（サーバーは「未確認」として登録する）
    const tries = []; let j = null;
    for (let i = 0; i < 3 && !j; i++) {
      try { j = await rpost(body); }
      catch (err) { tries.push('x:' + String(err && (err.message || err.name) || err).slice(0, 24)); await new Promise(r => setTimeout(r, 1000 * (i + 1))); }
    }
    if (!j) { rank.msg = 'rkFail'; rank.detail = tries.join(' '); }
    else if (j.ok) { rank.sent = true; rank.me = { name, score: body.score }; rank.data = { today: j.today || [], all: j.all || [] }; rank.msg = j.rank; rank.detail = ''; }
    else { rank.msg = j.error === 'ng' ? 'rkNg' : j.error === 'wait' ? 'rkWait' : j.error === 'replay' ? 'rkReplay' : j.error === 'dup' ? 'rkDup' : 'rkBad'; rank.detail = [j.error, ...tries].join(' '); }
  } catch { rank.msg = 'rkFail'; }
  rank.busy = false; renderRank();
};
$('rkName').addEventListener('keydown', e => e.stopPropagation());
function applyRankLang() {
  $('rankBtn').textContent = t('rank'); $('rkTitle').textContent = t('rank'); $('tabToday').textContent = t('tabToday'); $('tabAll').textContent = t('tabAll');
  $('rkName').placeholder = t('rkName'); $('rkSend').textContent = t('rkSend');
  if (!$('rank').hidden) renderRank();
}
const rankFmt = n => n.toFixed(1) + 'm';
const inResult = () => state === 'done';
function showResultPanel(on) { $('result').hidden = !on; }
resize(); applyLang(); startSession(); requestAnimationFrame(loop);
</script>
