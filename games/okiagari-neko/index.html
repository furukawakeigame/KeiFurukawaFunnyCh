function startOrbit() { const c = center(); orbit = { x: c.x, y: c.y, yaw: camYaw, pitch: camPitch }; }

function pointerWorld(x, y) { rayAt(x, y); return ray.ray.intersectPlane(dragPlane, hitP) ? hitP.clone() : null; }
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size > 1) { if (act && act.grab) endGrab(false); act = null; startOrbit(); return; }
  const h = catHit(e.clientX, e.clientY);
  act = { id: e.pointerId, x: e.clientX, y: e.clientY, t0: performance.now(), hit: h, moved: false };
});
canvas.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId);
  if (!p) { hover(e.clientX, e.clientY); return; }
  p.x = e.clientX; p.y = e.clientY;
  if (act && act.id === e.pointerId) {
    const d = Math.hypot(e.clientX - act.x, e.clientY - act.y);
    if (!act.moved && d > 8) {
      act.moved = true;
      if (act.hit) beginGrab(act.hit);
      else startOrbit();
    }
    if (act.grab) dragTo(e.clientX, e.clientY);
  }
  if (orbit && (ptrs.size >= 2 || (act && !act.hit))) { const c = center(); camYaw = orbit.yaw; camPitch = orbit.pitch; rotateBy(c.x - orbit.x, c.y - orbit.y); }
});
const endPtr = e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (act && act.id === e.pointerId) {
    if (act.grab) endGrab(e.type === 'pointerup');
    else if (!act.moved && e.type === 'pointerup') {
      if (act.hit) pet(act.hit.point);
      else callTo(e.clientX, e.clientY);
    }
    act = null;
  }
  if (ptrs.size >= 2) startOrbit(); else orbit = null;
};
canvas.addEventListener('pointerup', endPtr);
canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('wheel', e => { e.preventDefault(); rotateBy(e.deltaX * 0.6, e.deltaY * 0.6); }, { passive: false });
// 長押し（動かさない）でもつまむ
function checkHold() {
  if (act && act.hit && !act.moved && !act.grab && performance.now() - act.t0 > 260) { act.moved = true; beginGrab(act.hit); }
}
function beginGrab(h) {
  // つまむ所を通り、カメラに向いた縦の面の上で動かす
  const n = new THREE.Vector3(); camera.getWorldDirection(n); n.y = 0; n.normalize().negate();
  dragPlane.setFromNormalAndCoplanarPoint(n, h.point);
  sim.startGrab(h.object.userData.part, h.point);
  act.grab = true; trail.length = 0;
  canvas.classList.add('grabbing');
  grabbed++;
  $('hint').classList.add('off');
  setFace('content');
  if (Math.random() < 0.6) { mrrp(); openMouth(0.25); }
  purrDelay = 0.6;
  dragTo(act.x, act.y);
}
function dragTo(x, y) {
  // 広告の枠より上へは持ち上げない（猫が広告に隠れないように）
  const p = pointerWorld(x, Math.max(y, topPad + 70)); if (!p) return;
  const now = performance.now();
  p.y = Math.max(0.08, Math.min(1.5, p.y));
  const lim = ROOM - 0.2; p.x = Math.max(-lim, Math.min(lim, p.x)); p.z = Math.max(-lim, Math.min(lim, p.z));
  trail.push({ t: now, p: p.clone() }); while (trail.length && now - trail[0].t > 120) trail.shift();
  let v = { x: 0, y: 0, z: 0 };
  if (trail.length > 1) { const a = trail[0], b = trail[trail.length - 1], dt = Math.max(0.016, (b.t - a.t) / 1000); v = { x: (b.p.x - a.p.x) / dt, y: (b.p.y - a.p.y) / dt, z: (b.p.z - a.p.z) / dt }; }
  sim.moveGrab(p, v);
}
function endGrab(up) {
  // 指を止めてから離したら速さ0（その場で落とす）
  const now = performance.now();
  let sp = 0;
  if (trail.length > 1 && now - trail[trail.length - 1].t < 90) { const a = trail[0], b = trail[trail.length - 1]; sp = a.p.distanceTo(b.p) / Math.max(0.016, (b.t - a.t) / 1000); }
  sim.release(6.5);
  canvas.classList.remove('grabbing');
  act.grab = false;
  purr(false);
  if (sp > 1.5) whoosh(Math.min(1, sp / 6));
  setFace('wow');
}
// なでる
let petT = 0, purrDelay = 0;
function pet(p) {
  if (sim.state !== 'stand') return;
  petT = 2.2;
  setFace('happy');
  purr(true);
  for (let i = 0; i < 2; i++) setTimeout(() => spawnHeart(new THREE.Vector3(p.x, p.y + 0.05, p.z)), i * 250);
  if (Math.random() < 0.5) { mrrp(); openMouth(0.25); }
  // 座ってくつろぐ
  ai.t = Math.max(ai.t, 3);
}
// 床をタップ → そこへ歩いてくる
const callRing = new THREE.Mesh(new THREE.RingGeometry(0.045, 0.058, 40), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, depthWrite: false, toneMapped: false, fog: false }));
callRing.rotation.x = -Math.PI / 2; callRing.renderOrder = 4; scene.add(callRing);
let callT = 1;
const floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
function callTo(x, y) {
  rayAt(x, y);
  const p = new THREE.Vector3();
  if (!ray.ray.intersectPlane(floorPlane, p)) return;
  const lim = ROOM - 0.3; p.x = Math.max(-lim, Math.min(lim, p.x)); p.z = Math.max(-lim, Math.min(lim, p.z));
  callRing.position.set(p.x, sim.floorAt(p.x, p.z) + 0.006, p.z); callT = 0;
  knock();
  sim.look = { x: p.x, y: 0.05, z: p.z }; lookHold = 1.2;
  // （外力なしの歩きは調整中のため、いまはそちらを見るだけ）
  if (sim.state === 'stand' && Math.random() < 0.5) setTimeout(() => { nya(); openMouth(0.18); }, 250);
}
// 指の近くを見る（PC のマウス）
let lookHold = 0;
function hover(x, y) {
  rayAt(x, y);
  const p = new THREE.Vector3();
  if (ray.ray.intersectPlane(floorPlane, p) && p.distanceTo(sim.com) < 2.5) { sim.look = { x: p.x, y: 0.1, z: p.z }; lookHold = 1.5; }
}

// ===== 猫の気まま（立っている時に、座る・伸び・うろうろ）=====
const ai = { t: 3 };
function updateAI(dt) {
  if (lookHold > 0) lookHold -= dt;
  else sim.look = { x: camera.position.x, y: camera.position.y, z: camera.position.z }; // ふだんはこちらを見る
  if (sim.state !== 'stand') return;
  ai.t -= dt;
  if (sim.mode === 'walk') { if (ai.t < 0) { sim.setMode('idle'); ai.t = rnd(2, 4); } return; }
  if (ai.t > 0) return;
  const c = sim.com, far = Math.hypot(c.x, c.z) > 1.2;
  const r = Math.random();
  if (sim.mode === 'sit') { sim.setMode('idle'); ai.t = rnd(1.5, 3); return; }
  if (false) {}
  else { const a = Math.random() * Math.PI * 2; sim.look = { x: c.x + Math.cos(a), y: 0.3, z: c.z + Math.sin(a) }; lookHold = rnd(1, 2); ai.t = rnd(1.5, 3); }
}

// ===== 状態が変わった時の反応 =====
let lastLand = 0;
sim.onLand = (v, upright) => {
  const p = sim.com;
  pat(Math.min(1, 0.3 + v / 4));
  if (v > 1.6) spawnDust({ x: p.x, y: sim.floorAt(p.x, p.z), z: p.z }, Math.round(4 + v * 2), Math.min(1.6, 0.6 + v / 4));
  lastLand = v;
  if (v > 1.2) snapAt = performance.now() + 380;
};
sim.onState = (s, prev) => {
  if (s === 'stand' && (prev === 'land' || prev === 'getup')) {
    setFace('happy');
    setTimeout(() => { if (Math.random() < 0.7) { (lastLand > 3 ? nyaan : nya)(); openMouth(lastLand > 3 ? 0.5 : 0.18); } }, 120);
    setTimeout(() => { if (face === 'happy' && petT <= 0) setFace('normal'); }, 1100);
    ai.t = rnd(1.5, 3);
  }
  if (s === 'air') setFace('wow');
  if (s === 'stand') sim.setMode('idle');
};
sim.onStep = () => {};

// ===== ループ（物理は 1/120 秒きざみ・描画は補間）=====
let acc = 0, last = performance.now(), blinkNext = 2.5;
const hintPos = new THREE.Vector3();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  acc += dt;
  checkHold();
  while (acc >= sim.DT) {
    for (const v of visuals) { v.pp.copy(v.cp); v.pq.copy(v.cq); }
    sim.step();
    for (const v of visuals) readPose(v, { p: v.cp, q: v.cq });
    acc -= sim.DT;
  }
  const a = acc / sim.DT;
  for (const v of visuals) { v.group.position.lerpVectors(v.pp, v.cp, a); v.group.quaternion.slerpQuaternions(v.pq, v.cq, a); }
  // おなかと首
  for (const g of [byName.chest, byName.hips, byName.head]) g.updateMatrixWorld();
  bridge(belly, _a.set(0, 0.01, 0.0).applyMatrix4(byName.chest.matrixWorld), _b.set(0, 0.012, 0.0).applyMatrix4(byName.hips.matrixWorld), 0.058, 0.02);
  bridge(neck, _a.set(0, 0.035, 0.05).applyMatrix4(byName.chest.matrixWorld), _b.set(0, -0.012, -0.02).applyMatrix4(byName.head.matrixWorld), 0.036, 0.012);
  // しっぽの気分
  const st = sim.state;
  tailMood = st === 'held' ? { lift: 0.15, curl: 0.2, sway: 0.15, stiff: 0.25 }
    : st === 'air' ? { lift: 0.55, curl: 0, sway: 0.6, stiff: 0.6 }
    : sim.mode === 'sit' ? { lift: -0.2, curl: 0.1, sway: 0.15, stiff: 0.5 }
    : { lift: 1, curl: 0.55, sway: petT > 0 ? 0.08 : 0.22, stiff: 1 };
  updateTail(dt);
  // 顔
  blinkNext -= dt;
  if (blinkNext <= 0 && blinkT <= 0) { blinkT = 0.13; blinkNext = rnd(2, 5); faceDirty = true; }
  if (blinkT > 0) { blinkT -= dt; if (blinkT <= 0) faceDirty = true; }
  if (mouthT > 0) { mouthT -= dt; if (mouthT <= 0) faceDirty = true; }
  if (petT > 0) { petT -= dt; if (petT <= 0) { purr(false); if (face === 'happy') setFace('normal'); } }
  if (st === 'held') {
    if (purrDelay > 0) { purrDelay -= dt; if (purrDelay <= 0) purr(true); }
  }
  if (st === 'stand' && face === 'wow') setFace('normal');
  if (faceDirty) { faceDirty = false; drawFace(); }
  updateAI(dt);
  // カメラは猫にゆっくりついていく（つまんでいる間は止める）
  {
    const c = sim.com, kf = 1 - Math.exp(-dt * 1.6);
    if (!(act && act.grab)) { camT.x += (c.x - camT.x) * kf; camT.z += (c.z - camT.z) * kf; }
    // 持ち上げた時は、カメラもゆっくり上を向いて高く持ち上げられるようにする
    camT.y += (0.2 + Math.max(0, Math.min(0.6, c.y - 0.25)) * 0.6 - camT.y) * (act && act.grab ? 1 - Math.exp(-dt * 0.9) : kf);
  }
  placeCamera();
  updateParticles(dt);
  if (callT < 1) { callT += dt / 0.6; callRing.material.opacity = 0.85 * (1 - callT); callRing.scale.setScalar(1 + callT * 2); }
  // 最初の合図は背中の位置に
  if (!$('hint').classList.contains('off')) {
    const tp = sim.parts.chest.body.translation(); hintPos.set(tp.x, tp.y + 0.1, tp.z - 0.08).project(camera);
    $('hint').style.left = ((hintPos.x + 1) / 2 * innerWidth) + 'px'; $('hint').style.top = ((1 - hintPos.y) / 2 * innerHeight) + 'px';
  }
  renderer.render(scene, camera);
  if (snapAt && now >= snapAt) { snapAt = 0; snapShot(); }
  requestAnimationFrame(frame);
}

// ===== Xに投稿（着地した瞬間の画面を画像にして付ける）=====
const SHARE_URL = 'https://keifurukawafunnych.com/games/okiagari-neko/', TAG = '#起き上がり猫ゲーム';
let snapAt = 0, shareFile = null;
const snapCv = document.createElement('canvas'); snapCv.width = snapCv.height = 1080;
const rawCv = document.createElement('canvas'); rawCv.width = rawCv.height = 1080;
function snapShot() {
  // 猫を中心に正方形で切り抜く（描画した直後なので canvas から読める）
  const src = renderer.domElement, W = src.width, H = src.height;
  const c = sim.com, v = new THREE.Vector3(c.x, c.y + 0.04, c.z).project(camera);
  const side = Math.min(W, H) * 0.8;
  let sx = (v.x + 1) / 2 * W - side / 2, sy = (1 - v.y) / 2 * H - side / 2;
  sx = Math.max(0, Math.min(W - side, sx)); sy = Math.max(0, Math.min(H - side, sy));
  const r = rawCv.getContext('2d'); r.fillStyle = '#23262d'; r.fillRect(0, 0, 1080, 1080);
  r.drawImage(src, sx, sy, side, side, 0, 0, 1080, 1080);
  updateShare();
}
window.updateShare = function updateShare() {
  const text = `${t('title')}\n${TAG}`;
  const a = $('share');
  a.href = 'https://x.com/intent/post?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(SHARE_URL);
  if (matchMedia('(pointer: coarse)').matches) a.removeAttribute('target'); else { a.target = '_blank'; a.rel = 'noopener'; }
  a.dataset.text = text;
  const x = snapCv.getContext('2d');
  x.drawImage(rawCv, 0, 0);
  const g = x.createLinearGradient(0, 860, 0, 1080); g.addColorStop(0, 'rgba(20,22,27,0)'); g.addColorStop(1, 'rgba(20,22,27,0.85)');
  x.fillStyle = g; x.fillRect(0, 860, 1080, 220);
  x.fillStyle = '#fff'; x.textBaseline = 'alphabetic';
  x.font = '700 56px system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif'; x.globalAlpha = 0.9;
  x.fillText(t('title'), 64, 1030); x.globalAlpha = 1;
  // 共有用ファイルは先に作っておく（押した時に作ると Safari で共有が止まる）
  snapCv.toBlob(b => { if (b) shareFile = new File([b], 'okiagari-neko.png', { type: 'image/png' }); }, 'image/png');
};
$('share').addEventListener('click', e => {
  const text = $('share').dataset.text;
  if (matchMedia('(pointer: coarse)').matches) {
    if (navigator.share && shareFile && navigator.canShare?.({ files: [shareFile] })) {
      e.preventDefault();
      navigator.share({ files: [shareFile], text: `${text}\n${SHARE_URL}` }).catch(() => {});
    }
  } else if (shareFile) {
    const u = URL.createObjectURL(shareFile), d = document.createElement('a');
    d.href = u; d.download = 'okiagari-neko.png'; document.body.appendChild(d); d.click(); d.remove();
    setTimeout(() => URL.revokeObjectURL(u), 4000);
  }
});

initTail();
for (let i = 0; i < 60; i++) updateTail(1 / 60);
renderer.compile(scene, camera);
updateAI(0);
renderer.render(scene, camera);
// 写真が読めてから、立っている姿を投稿用に用意しておく
const firstSnap = () => { drawFace(); renderer.render(scene, camera); snapShot(); };
if (catImg.complete) firstSnap(); else catImg.addEventListener('load', firstSnap);
// 広告は、開いて少したってから読み込む（最初の表示を重くしないため）
setTimeout(() => window.resultAd?.(true), 1500);
requestAnimationFrame(t0 => { last = t0; frame(t0); });
if (location.hash.includes('dbg')) window.__dbg = { sim, camera, camT, setCam: (yaw, pitch, dist) => { camYaw = yaw; camPitch = pitch; if (dist) camDist = dist; }, setFace, pet, callTo };
</script>
