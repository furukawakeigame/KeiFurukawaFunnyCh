  <script type="module">
    import * as THREE from 'three';
    window.GAME_READY = true;

    const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
    const rnd = (a, b) => a + Math.random() * (b - a);
    const pick = a => a[Math.floor(Math.random() * a.length)];

    // ---------- 言語 ----------
    const store = {
      get(k, d) { try { const v = localStorage.getItem('plate-smash:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },

      ko: { title: '무한 접시 깨기', back: '← 처음으로' },
      en: { title: 'Endless Plate Smash', back: '← Back to top' },
      th: { title: 'ทุบจานไม่รู้จบ', back: '← กลับหน้าแรก' },

    const langSel = document.getElementById('lang');

    langSel.addEventListener('change', () => { lang = langSel.value; store.set('lang', lang); applyLang(); });

      document.title = t('title');
      document.getElementById('back').textContent = t('back');
    }

    // ---------- 音 ----------
    let soundOn = store.get('sound', true);
    const soundBtn = document.getElementById('sound');
    const drawSoundBtn = () => {
      soundBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>${soundOn ? '<path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>' : '<path d="M17 9l5 6M22 9l-5 6"/>'}</svg>`;
    };
    drawSoundBtn();
    soundBtn.addEventListener('click', () => { soundOn = !soundOn; store.set('sound', soundOn); drawSoundBtn(); if (master) master.gain.value = soundOn ? 1 : 0; });
    let ac = null, master = null, noiseBuf = null, reverb = null;
    // iPhone の消音モードでも鳴らす

        const n = 4410, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);

        const a = document.createElement('audio');

      } catch {}
    }
    function initAudio() {
      if (ac) { if (ac.state === 'suspended') ac.resume(); return; }

        ac = new (window.AudioContext || window.webkitAudioContext)();

        const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 6; comp.connect(ac.destination);

        const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        // 響き: 中庭の壁に跳ね返る短い残響（ノイズを減衰させた手作りのインパルス応答）
        const len = Math.floor(ac.sampleRate * 1.3), ir = ac.createBuffer(2, len, ac.sampleRate);

        const conv = ac.createConvolver(); conv.buffer = ir;
        reverb = ac.createGain(); reverb.gain.value = 0.5; reverb.connect(conv).connect(master);
        const o = ac.createOscillator(), g = ac.createGain(); g.gain.value = 0;
        o.connect(g).connect(master); o.start(); o.stop(ac.currentTime + 0.05);
        startAmbience();
      } catch { ac = null; }
    }
    addEventListener('pointerdown', initAudio, { capture: true });
    addEventListener('keydown', initAudio, { capture: true });
    const live = () => ac && soundOn;
    // 中庭の空気の音（ごく小さく）
    function startAmbience() {
      const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 300;
      const g = ac.createGain(); g.gain.value = 0.02;
      s.connect(lp).connect(g).connect(master); s.start();
    }
    // 声: のこぎり波を母音の共鳴に通す
    const VOWEL = { a: [800, 1250, 2600], i: [320, 2300, 3000], u: [360, 1300, 2500], e: [520, 1900, 2600], o: [520, 880, 2500], n: [280, 1100, 2400] };
    function speak(syl, f0, vol = 0.5) {
      if (!live()) return;
      const now = ac.currentTime;
      const o = ac.createOscillator(); o.type = 'sawtooth';
      const vib = ac.createOscillator(); vib.frequency.value = rnd(5, 8);
      const vg = ac.createGain(); vg.gain.value = f0 * 0.04; vib.connect(vg).connect(o.frequency);
      const breath = ac.createBufferSource(); breath.buffer = noiseBuf; const bg = ac.createGain(); bg.gain.value = 0.15; breath.connect(bg);
      const mix = ac.createGain(); o.connect(mix); bg.connect(mix);
      const env = ac.createGain(); env.gain.setValueAtTime(0, now);
      const fs = [0, 1, 2].map(fi => { const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = fi ? 9 : 5; const g = ac.createGain(); g.gain.value = [3, 1.8, 0.8][fi]; mix.connect(bp).connect(g).connect(env); return bp; });

      });

    // 猫の「ニャッ」: 母音の並びと高さを毎回少し変える
    const sMeow = () => {
      const f = rnd(560, 760);
      speak(pick([[['i', 0.07, 1.05], ['a', 0.12, 1.2], ['u', 0.12, 0.8]], [['i', 0.06, 1.1], ['e', 0.08, 1.25], ['a', 0.14, 1.0]], [['n', 0.05, 0.9], ['i', 0.06, 1.15], ['a', 0.16, 1.05], ['o', 0.08, 0.7]]]), f, 0.4);
    };
    // ---- 陶器の音（左右の位置と響きつき）----
    // 同時に鳴らす数を抑えて、重なっても濁らない・重くならないようにする
    let voices = 0;
    function bus(pan, wet = 0.35) {
      const g = ac.createGain();
      const p = ac.createStereoPanner ? ac.createStereoPanner() : null;
      if (p) { p.pan.value = clamp(pan, -0.9, 0.9); g.connect(p).connect(master); } else g.connect(master);

      const g = ac.createGain(); g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.0005, at + dur);
      let src = s;
      if (hp) { const h = ac.createBiquadFilter(); h.type = 'highpass'; h.frequency.value = hp; s.connect(h); src = h; }
      for (const [f, q, a] of bands) {
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f * rnd(0.92, 1.08); bp.Q.value = q;
        const bg = ac.createGain(); bg.gain.value = a; src.connect(bp).connect(bg).connect(g);
      }

    }
    // 割れた瞬間: 乾いた「パキッ」→ お皿の鳴り（少し外れた倍音）→ 細かく砕ける「シャラッ」
    let lastCrash = 0;
    function sCrash(k, x) {
      if (!live() || voices > 120) return;
      const now = ac.currentTime;
      const busy = now - lastCrash < 0.04; lastCrash = now;
      k = clamp(k, 0.3, 1.4) * (busy ? 0.6 : 1);
      const d = bus(x / 3.2);

      hiss(d, 0.07, [[2400, 4, 0.9], [4100, 5, 0.7], [6300, 6, 0.5]], 0.6 * k, now);
      const f0 = rnd(1150, 1700);
      if (!busy) for (const [m, a, dd] of [[1, 0.09, 0.22], [1.58, 0.07, 0.17], [2.31, 0.05, 0.13], [3.07, 0.035, 0.1], [4.12, 0.025, 0.08]]) ring(d, f0 * m * rnd(0.99, 1.01), dd * rnd(0.8, 1.2), a * k, now + 0.002);

    const sPop = x => { if (!live() || voices > 100) return; const d = bus(x / 3.2, 0.2); hiss(d, 0.03, [[1800, 6, 1], [3200, 8, 0.5]], 0.05, ac.currentTime); ring(d, rnd(1300, 1700), 0.06, 0.012, ac.currentTime); };

    // ---------- 3D ----------
    const stage = document.getElementById('stage');
    const hintEl = document.getElementById('hint'), floorline = document.getElementById('floorline');
    const renderer = new THREE.WebGLRenderer({ antialias: true });

    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    const FOG = '#cfe3f2';
    scene.fog = new THREE.Fog(FOG, 16, 42);
    const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 120);
    const hemi = new THREE.HemisphereLight('#d6ebff', '#8a7a62', 1.05);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight('#ffe7c6', 2.5); sun.position.set(-4, 11, 7);
    sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); sun.shadow.radius = 3; sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
    Object.assign(sun.shadow.camera, { left: -7, right: 7, top: 8, bottom: -8, near: 1, far: 30 });
    scene.add(sun);

    const canvasTex = (w, h, draw, rep) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; if (rep) { tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.repeat.set(rep[0], rep[1]); } tx.anisotropy = 4; return tx; };

    const shade = o => { o.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); return o; };

    const WALL_Z = -4, WALL_H = 3.4, SIDE_X = 3.8, SIDE_H = 1.1, NEAR_Z = 6.5;
    const THROW_Z = WALL_Z + 4.6, THROW_Y = 1.15; // 投げる人の手の位置（画面の手前の外）
    const CAT_Y = 2.3, CAT_S = 0.78; // 猫の額の中心の高さと大きさ

    {

        side: THREE.BackSide, depthWrite: false, fog: false,
        uniforms: { top: { value: new THREE.Color('#5e9fe0') }, bot: { value: new THREE.Color(FOG) } },

    requestAnimationFrame(t0 => { last = t0; loop(t0); });
  </script>

</body>
