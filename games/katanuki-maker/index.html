    function lose(c) {
      if (state !== 'play') return;
      state = 'lose'; animT = 0; endT = performance.now(); pressing = false; scratchTo(0, 3000);
      resultKind = 'ng'; resultVal = String(cutPercent());
      const tx = snapshotTex();
      // ヒビに沿って板を割る（最初の線はヒビの向き、残りはヒビのまわりから放射状に）
      const toS = ([x, y]) => { const [wx, wz] = worldOf(x, y); return [wx, -wz]; };
      const a = toS(c.pts[0]), b = toS(c.pts[c.pts.length - 1]);
      const mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
      let polys = [Array.from({ length: 64 }, (_, k) => [Math.cos(k / 64 * Math.PI * 2) * S / 2, Math.sin(k / 64 * Math.PI * 2) * S / 2])];
      const lines = [[mid, Math.atan2(b[1] - a[1], b[0] - a[0])]];
      for (let k = 0; k < 2; k++) lines.push([[mid[0] + rnd(-.8, .8), mid[1] + rnd(-.8, .8)], Math.random() * Math.PI]);
      for (const [[px, py], ang] of lines) {
        const nx = -Math.sin(ang), ny = Math.cos(ang), next = [];
        for (const p of polys) { for (const sgn of [1, -1]) { const q = clipHalf(p, px, py, nx * sgn, ny * sgn); if (q.length >= 3 && area(q) > 0.02) next.push(q); } }
        polys = next;
      }
      boardG.visible = false;
      const m = new THREE.MeshStandardMaterial({ map: tx, roughness: 0.85 });
      for (const p of polys) {
        let cx = 0, cy = 0; for (const [x, y] of p) { cx += x; cy += y; } cx /= p.length; cy /= p.length;
        const mesh = slab(p, cx, cy, m);
        const dx = cx - mid[0], dy = cy - mid[1], dl = Math.hypot(dx, dy) || 1;
        const push = rnd(0.04, 0.13);
        chunks.push({ m: mesh, x0: cx, z0: -cy, vx: dx / dl * push, vz: -dy / dl * push, lift: rnd(0.15, 0.4), ax: rnd(-0.5, 0.5), az: rnd(-0.5, 0.5), ry: rnd(-0.35, 0.35), ph: rnd(0, 0.1) });
        scene.add(mesh);
      }
      // ヒビの所からかけらが飛ぶ
      const [wx, wz] = worldOf(c.pts[c.pts.length - 1][0], c.pts[c.pts.length - 1][1]);
      for (let k = 0; k < 14; k++) particle(chipG, chipM, wx, TH + 0.02, wz, rnd(-1, 1), rnd(1, 2.2), rnd(-1, 1), rnd(1.5, 2.2), rnd(0.5, 1.1));
      sBreak();
      setTimeout(() => sCatSad(), 250);
    }
    function stepAnim(dt) {
      animT += dt;
      if (state === 'win' || (state === 'result' && resultKind === 'ok' && piece)) {
        // ポコッと外れて、浮かんでくるくる回る
        const k = Math.min(1, Math.max(0, (animT - 0.25) / 1.0)), e = 1 - (1 - k) ** 3;
        const pop = animT < 0.25 ? Math.sin(animT / 0.25 * Math.PI) * 0.05 : 0;
        const { cx, cz } = piece.userData;
        piece.position.set(cx * (1 - e), 0.001 + pop + e * 0.75 + Math.sin(animT * 2) * 0.03 * e, cz * (1 - e) + e * 0.25);
        piece.rotation.set(e * 0.75, 0, 0);
        piece.children[0].position.set(0, 0, 0);
        piece.rotation.y = 0;
        piece.children[0].rotation.y = Math.sin(animT * 1.3) * 0.5 * e;
        if (state === 'win' && animT > 1.4) finish();
      }
      if (state === 'lose' || (state === 'result' && resultKind === 'ng')) {
        for (const c of chunks) {
          const tt = Math.max(0, animT - c.ph);
          const ex = 1 - Math.exp(-tt * 5);
          // 少し跳ねて落ち着く
          const bounce = c.lift * Math.exp(-tt * 3.2) * Math.abs(Math.sin(tt * 9));
          c.m.position.set(c.x0 + c.vx * ex, bounce, c.z0 + c.vz * ex);
          const tilt = Math.exp(-tt * 3) * Math.sin(tt * 11);
          c.m.rotation.set(c.ax * tilt * 0.5, c.ry * ex, c.az * tilt * 0.5);
        }
        if (state === 'lose' && animT > 1.6) finish();
      }
    }
    function finish() {
      state = 'result';
      showResult(); resultEl.style.display = 'flex';
      renderControls(); resize();
      snap = null; needSnap = true;
    }
    function showResult() { resultEl.children[0].textContent = resultKind === 'ok' ? t('sec')(resultVal) : t('pct')(resultVal); }
    const shareText = () => resultKind === 'ok' ? t('ok')(resultVal) : t('ng')(resultVal);

    // ---------- 結果ボタン・共有 ----------
    function renderControls() {
      controls.innerHTML = '';
      controls.classList.toggle('hide', state !== 'result');
      if (state !== 'result') return;
      const b = document.createElement('button');
      b.className = 'go'; b.textContent = t('again'); b.addEventListener('click', start);
      const p = document.createElement('button');
      p.className = 'pic'; p.setAttribute('aria-label', 'image');
      p.innerHTML = document.getElementById('pick').innerHTML; p.addEventListener('click', e => { e.stopPropagation(); openShapes(); });
      const a = document.createElement('a');
      a.className = 'post'; a.textContent = t('post');
      a.href = `https://x.com/intent/post?text=${encodeURIComponent(shareText())}&url=${encodeURIComponent(SHARE_URL)}`;
      const coarse = matchMedia('(pointer: coarse)').matches;
      if (!coarse) { a.target = '_blank'; a.rel = 'noopener'; }
      // スマホは画像ごと共有シートへ。PCは画像を保存してから投稿画面を開く
      a.addEventListener('click', e => {
        const text = shareText();
        if (coarse && navigator.share) {
          e.preventDefault();
          const file = shareFile();
          navigator.share(file && navigator.canShare?.({ files: [file] }) ? { files: [file], text: `${text}\n${SHARE_URL}` } : { text: `${text}\n${SHARE_URL}` }).catch(() => {});
          return;
        }
        const img = resultImage();
        if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'katanuki-maker.png'; d.click(); }
      });
      controls.append(b, p, a);
    }
    // 結果画像: 結果の画面を正方形に切り抜き、数値とタイトルを重ねる
    let snap = null, shareCache = null;
    function takeSnap() {
      const src = renderer.domElement;
      const focus = (resultKind === 'ok' && piece ? piece.position.clone() : CENTER.clone()).project(camera);
      const fxp = (focus.x + 1) / 2 * src.width, fyp = (1 - focus.y) / 2 * src.height;
      const side = Math.min(src.width, src.height);
      const sx = THREE.MathUtils.clamp(fxp - side / 2, 0, src.width - side), sy = THREE.MathUtils.clamp(fyp - side * 0.45, 0, src.height - side);
      snap = mk(1080, 1080);
      snap.getContext('2d').drawImage(src, sx, sy, side, side, 0, 0, 1080, 1080);
      shareCache = null;
    }
    function resultImage() {
      if (!snap) return null;
      const c = mk(1080, 1080), g = c.getContext('2d');
      g.drawImage(snap, 0, 0);
      g.textAlign = 'center'; g.lineJoin = 'round';
      const font = px => `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans Thai", sans-serif`;
      const text = (str, y, px, max) => {
        g.font = font(px);
        const w = g.measureText(str).width; if (w > max) { px *= max / w; g.font = font(px); }
        g.lineWidth = px * .16; g.strokeStyle = '#7a1f2a'; g.strokeText(str, 540, y); g.fillStyle = '#fff'; g.fillText(str, 540, y);
      };
      text(resultKind === 'ok' ? t('sec')(resultVal) : t('pct')(resultVal), 230, 190, 960);
      text(t('title'), 1030, 56, 900);
      return c;
    }
    function prepareShare() {
      if (!snap) return;
      const key = lang;
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'katanuki-maker.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;

    // ---------- ループ ----------
    let last = performance.now(), clock = 0;
    function frame(dt) {
      clock += dt;
      // 最初に触るまでは、針が溝の上をゆっくりなぞって見せる
      if (demo && state === 'play' && contour.length) {
        const u = (clock * 0.05) % 1, idx = Math.floor(u * contour.length), [x, y] = contour[idx];
        const [wx, wz] = worldOf(x, y);
        needleTarget.set(wx, TH + 0.04 + Math.abs(Math.sin(clock * 3)) * 0.05, wz);
      }
      needle.visible = state === 'play' && (demo || hoverOn || pressing);
      needleAt.lerp(needleTarget, pressing ? 1 : Math.min(1, dt * 18));
      needle.position.copy(needleAt);
      if (pressing && performance.now() - lastMoveAt > 70) { scratchTo(0, 3000); vSm *= 0.5; }
      if (state === 'play' && cutSince && performance.now() > checkAt) {
        cutSince = false; checkAt = performance.now() + 120;
        if (separated()) win();
      }
      if (state !== 'play') stepAnim(dt);
      stepFx(dt);
      lanterns.forEach((l, k) => { if (lanternBase[k]) { l.position.x = lanternBase[k].x + Math.sin(clock * 0.9 + l.userData.ph) * l.scale.x * 0.06; } });
      if (texDirty) compose();
    }
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      frame(dt);
      renderer.render(scene, camera);
      if (needSnap) { needSnap = false; takeSnap(); prepareShare(); }
      requestAnimationFrame(loop);
    }

    // 最初は猫の顔の型
    function boot() {
      useShape(pick(['circle', 'triangle', 'star', 'umbrella']));
      applyLang();
      // 最初の1回が重くならないよう、型とかけらの材質も一度描いておく
      const dummy = slab([[0, 0], [0.1, 0], [0, 0.1]], 0, 0, new THREE.MeshStandardMaterial({ map: colTex, roughness: 0.85 }));
      dummy.position.y = -1; scene.add(dummy);
      renderer.compile(scene, camera); renderer.render(scene, camera);
      scene.remove(dummy); dummy.geometry.dispose();
      requestAnimationFrame(t0 => { last = t0; loop(t0); });
    }
    // 確認用（輪郭の画面上の位置と状態）
    window.KATA = {
      screenContour() { const r = cv.getBoundingClientRect(); return contour.map(([x, y]) => { const [wx, wz] = worldOf(x, y); const v = new THREE.Vector3(wx, TH, wz).project(camera); return [r.left + (v.x + 1) / 2 * r.width, r.top + (1 - v.y) / 2 * r.height]; }); },
      cheat(k) { if (k === "ng") { const c = { pts: [[N * 0.2, N * 0.5]], ang: 0.3, alive: true, inLen: 0 }; cracks.push(c); grow(c, 60); return; } for (let i = 0; i < NN; i++) if (type[i] === 1) { th[i] = 0; cellPaint(i); } cutSince = true; texDirty = true; },
      get state() { return state; }, get cracks() { return cracks.length; }, pct: () => cutPercent(), get vMax() { return vMax; }, maxStress() { let m = 0; for (const v of stress) m = Math.max(m, v); return m; },
    };
    resize();
    if (catImg.complete && catImg.naturalWidth) boot(); else { catImg.onload = boot; catImg.onerror = () => { start(); applyLang(); requestAnimationFrame(t0 => { last = t0; loop(t0); }); }; }
  </script>
</body>
