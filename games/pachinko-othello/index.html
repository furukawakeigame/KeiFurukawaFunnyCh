        win: 'ชนะ', lose: 'แพ้', draw: 'เสมอ',
        share: (b, w) => `โอเทลโลที่ยิงหมากด้วยหนังสติ๊ก ${b > w ? 'ชนะ' : b < w ? 'แพ้' : 'เสมอกับ'}แมว ดำ ${b} เม็ด ขาว ${w} เม็ด #パチンコオセロゲーム` },
    };
    let lang = store.get('lang', null) || autoLang();
    const t = k => DICT[lang][k];
    const langSel = document.getElementById('lang');
    langSel.value = lang;
    langSel.addEventListener('change', () => { lang = langSel.value; store.set('lang', lang); applyLang(); });
    function applyLang() {
      document.documentElement.lang = lang;
      document.title = t('title');
      document.getElementById('back').textContent = t('back');
      renderControls();
      if (state === 'result') { showResult(); prepareShare(); }
    }

    // ---------- 音 ----------
    let soundOn = store.get('sound', true);
    const soundBtn = document.getElementById('sound');
    const drawSoundBtn = () => {
      soundBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>${soundOn ? '<path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>' : '<path d="M17 9l5 6M22 9l-5 6"/>'}</svg>`;
    };
    drawSoundBtn();
    soundBtn.addEventListener('click', () => { soundOn = !soundOn; store.set('sound', soundOn); drawSoundBtn(); });
    let ac = null, clickBuf = null;
    const noiseBuf = dur => { const b = ac.createBuffer(1, Math.max(1, Math.floor(ac.sampleRate * dur)), ac.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b; };
    // iPhone の消音モードでも鳴るようにする
    function unmuteIOS() {
      try { if (navigator.audioSession) { navigator.audioSession.type = 'playback'; return; } } catch {}
      try {
        const n = 4410, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
        const w = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
        w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
        v.setUint32(24, 44100, true); v.setUint32(28, 88200, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
        const a = document.createElement('audio');
        a.src = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' })); a.loop = true; a.setAttribute('playsinline', '');
        a.play().catch(() => {});
      } catch {}
    }
    function initAudio() {
      if (ac) return;
      unmuteIOS();
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        const o = ac.createOscillator(), g = ac.createGain(); g.gain.value = 0;
        o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.05);
        // 「カチッ」「コトッ」の元になる短いノイズ
        clickBuf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.06), ac.sampleRate);
        const d = clickBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ac.sampleRate * 0.003));
      } catch { ac = null; }
    }
    const wake = () => { initAudio(); if (ac && ac.state !== 'running') ac.resume().catch(() => {}); };
    for (const ev of ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown']) addEventListener(ev, wake, { capture: true });
    const ok = () => soundOn && ac;
    function tone(type, f0, f1, dur, vol, delay = 0) {
      if (!ok()) return;
      const now = ac.currentTime + delay;
      const o = ac.createOscillator(); o.type = type;
      o.frequency.setValueAtTime(f0, now); o.frequency.exponentialRampToValueAtTime(f1, now + dur);
      const g = ac.createGain(); g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      o.connect(g).connect(ac.destination); o.start(now); o.stop(now + dur + 0.02);
    }
    // 短いノイズをいくつかの共鳴に通す（硬い物が当たる音）
    function resonate(list, k, delay = 0, rate = 1) {
      if (!ok()) return;
      const now = ac.currentTime + delay;
      const s = ac.createBufferSource(); s.buffer = clickBuf; s.playbackRate.value = rate * (0.92 + Math.random() * 0.16);
      for (const [f, q, g0] of list) {
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f * (0.95 + Math.random() * 0.1); bp.Q.value = q;
        const g = ac.createGain(); g.gain.value = g0 * k; s.connect(bp).connect(g).connect(ac.destination);
      }
      s.start(now);
    }
    // 石どうしの「カチッ」
    const clack = k => resonate([[3100, 20, 2.2], [4700, 24, 1.3], [1900, 12, 1.0], [7200, 18, 0.5]], k);
    // 石が盤に落ちる「コトッ」: 石の硬い音＋盤の木の胴鳴り
    function knock(k) {
      resonate([[1200, 7, 2.0], [2500, 10, 1.0], [560, 5, 1.4]], k);
      tone('sine', 240 + Math.random() * 30, 150, 0.12, 0.35 * k);
    }
    // 畳に落ちる「トッ」
    function floorThud(k) {
      if (!ok()) return;
      const now = ac.currentTime;
      const s = ac.createBufferSource(); s.buffer = noiseBuf(0.08);
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 600; lp.Q.value = 2;
      const g = ac.createGain(); g.gain.setValueAtTime(0.6 * k, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
      s.connect(lp).connect(g).connect(ac.destination); s.start(now);
      tone('sine', 130, 70, 0.12, 0.3 * k);
    }
    // ひっくり返る「パタ」
    function pata() {
      resonate([[1700, 6, 1.2], [3400, 9, 0.6]], 0.6, 0, 1.2);
      knock(0.35);
    }
    // ゴムを引く「ギュッ」
    function creak(p) {
      if (!ok()) return;
      const now = ac.currentTime;
      const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(70 + p * 70, now); o.frequency.linearRampToValueAtTime(90 + p * 80, now + 0.06);
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 700 + p * 900; bp.Q.value = 5;
      const g = ac.createGain(); g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(0.12, now + 0.015); g.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
      o.connect(bp).connect(g).connect(ac.destination); o.start(now); o.stop(now + 0.08);
    }
    // ゴムが戻る「バチン」＋石が風を切る「ヒュッ」
    function snapSnd(p) {
      if (!ok()) return;
      const now = ac.currentTime;
      const s = ac.createBufferSource(); s.buffer = noiseBuf(0.06);
      const hp = ac.createBiquadFilter(); hp.type = 'bandpass'; hp.frequency.value = 1800; hp.Q.value = 1.4;
      const g = ac.createGain(); g.gain.setValueAtTime(0.9 * (0.4 + p), now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

      tone('triangle', 180, 55, 0.12, 0.35 * (0.4 + p));
      const w = ac.createBufferSource(); w.buffer = noiseBuf(0.4);
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 3;
      bp.frequency.setValueAtTime(2400, now + 0.02); bp.frequency.exponentialRampToValueAtTime(500, now + 0.4);
      const wg = ac.createGain(); wg.gain.setValueAtTime(0.001, now); wg.gain.linearRampToValueAtTime(0.18 * (0.3 + p), now + 0.06); wg.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
      w.connect(bp).connect(wg).connect(ac.destination); w.start(now);
    }
    // 声: 声帯の振動（のこぎり波＋ゆらぎ）を、母音ごとの共鳴（フォルマント）に通す
    const VOWEL = { a: [800, 1200, 2600], i: [300, 2300, 3000], u: [350, 1250, 2500], e: [500, 1900, 2600], o: [500, 850, 2500] };
    function voice(f0, seq, dur, vol, { rise = 1.3, fall = 0.7, shake = 0.04, breath = 0.15, vib = 6, delay = 0 } = {}) {
      if (!ok()) return;
      const now = ac.currentTime + delay;
      const o = ac.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(f0 * rise, now);
      o.frequency.linearRampToValueAtTime(f0 * rise * 1.08, now + dur * 0.2);
      o.frequency.exponentialRampToValueAtTime(f0 * fall, now + dur);
      const v = ac.createOscillator(); v.frequency.value = vib + Math.random() * 2;
      const vg = ac.createGain(); vg.gain.value = f0 * shake; v.connect(vg).connect(o.frequency);
      const ns = ac.createBufferSource(); ns.buffer = noiseBuf(dur);
      const ng = ac.createGain(); ng.gain.value = breath;
      const og = ac.createGain(); og.gain.value = 1 - Math.min(0.9, breath);
      const src = ac.createGain();
      o.connect(og).connect(src); ns.connect(ng).connect(src);

      out.gain.setValueAtTime(0, now);

      out.gain.setValueAtTime(vol, now + dur * 0.5);

        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = fi === 0 ? 6 : 9;

      o.stop(now + dur); v.stop(now + dur); ns.stop(now + dur);

    const pick = a => a[Math.floor(Math.random() * a.length)];
    // 猫の声: うまくいくと得意げな「にゃっ」、やられると不満げな「ンニャー」
    function meowHappy() {
      const f0 = 560 + Math.random() * 140;
      voice(f0, pick([['i', 'a'], ['e', 'a'], ['i', 'a', 'u']]), 0.22 + Math.random() * 0.1, 0.32, { rise: 0.95, fall: 1.2, breath: 0.22, vib: 7 });
      if (Math.random() < 0.5) voice(f0 * 1.1, pick([['i', 'a'], ['e', 'a']]), 0.16, 0.26, { rise: 1.0, fall: 1.25, breath: 0.25, delay: 0.26 });
    }
    function meowAngry() {
      const f0 = 330 + Math.random() * 80;

    // ---------- 3D ----------

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 40);

    function canvasTex(w, h, draw, repeat) {

      draw(c.getContext('2d'), w, h);

    // ---------- 石 ----------
    const stoneGeo = new THREE.CylinderGeometry(SR, SR * 0.97, SH / 2, 36);

    const stones = [];

    // 発射する前の石の山（残りの数）

    // ---------- パチンコ ----------

    const catImg = new Image(); catImg.src = 'cat.png';

      catFace.lookAt(camera.position);
    }

    // ---------- 画面 ----------
    const hintEl = document.getElementById('hint');
    function updateHints() { hintEl.style.display = state === 'ready' && !shotOnce ? 'block' : 'none'; }
    let hintKey = '';
    function placeHint() {
      if (hintEl.style.display === 'none') return;
      const sl = slings[1];
      const a = sl.g.localToWorld(tmpV.copy(sl.rest)).project(camera);
      const ax = (a.x + 1) / 2 * view.w, ay = (1 - a.y) / 2 * view.H;
      const b = sl.g.localToWorld(tmpV.copy(sl.rest).add(new THREE.Vector3(0, 0, 0.25))).project(camera);
      const bx = (b.x + 1) / 2 * view.w, by = (1 - b.y) / 2 * view.H;
      const ang = Math.atan2(by - ay, bx - ax) * 180 / Math.PI - 90;
      const w = hintEl.offsetWidth;
      const key = `${Math.round(ax)},${Math.round(ay)},${Math.round(ang)},${w}`;
      if (key === hintKey) return;
      hintKey = key;
      hintEl.style.transformOrigin = `50% ${w * 8 / 60}px`;
      hintEl.style.transform = `translate(${ax - w / 2}px, ${ay - w * 8 / 60}px) rotate(${ang}deg)`;
    }
    function renderControls() {
      controls.innerHTML = '';
      controls.classList.toggle('hide', state !== 'result');
      if (state !== 'result') return;
      const b = document.createElement('button');
      b.className = 'go'; b.textContent = t('again');
      b.addEventListener('click', start);
      controls.append(b);
      const nb = countColor(1), nw = countColor(-1);
      const a = document.createElement('a');
      a.className = 'post'; a.textContent = t('post');
      a.href = `https://x.com/intent/post?text=${encodeURIComponent(t('share')(nb, nw))}&url=${encodeURIComponent(SHARE_URL)}`;
      const coarse = matchMedia('(pointer: coarse)').matches;
      if (!coarse) { a.target = '_blank'; a.rel = 'noopener'; }
      // スマホは画像ごと共有シートへ。PCは画像を保存してから投稿画面を開く
      a.addEventListener('click', e => {
        const text = t('share')(nb, nw);
        if (coarse && navigator.share) {
          e.preventDefault();
          const file = shareFile();
          const data = file && navigator.canShare?.({ files: [file] }) ? { files: [file], text: `${text}\n${SHARE_URL}` } : { text: `${text}\n${SHARE_URL}` };
          navigator.share(data).catch(() => {});
          return;
        }
        const img = resultImage();
        if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = NAME + '.png'; d.click(); }
      });
      controls.append(a);
    }
    // 結果画像: 盤と猫を切り抜き、石の数を重ねる
    let snap = null, shareCache = null, needSnap = false;
    function takeSnap() {
      const src = renderer.domElement;
      let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
      for (const k of keys) {
        const q = tmpV.copy(k).project(camera), px = (q.x + 1) / 2 * src.width, py = (1 - q.y) / 2 * src.height;
        x0 = Math.min(x0, px); x1 = Math.max(x1, px); y0 = Math.min(y0, py); y1 = Math.max(y1, py);
      }
      const side = Math.max(x1 - x0, y1 - y0) * 1.08;
      const sx = (x0 + x1) / 2 - side / 2, sy = (y0 + y1) / 2 - side * 0.46;
      snap = document.createElement('canvas'); snap.width = snap.height = 1080;
      const g = snap.getContext('2d'), k = 1080 / side;
      g.fillStyle = '#b9d4e0'; g.fillRect(0, 0, 1080, 1080);
      const ax = Math.max(0, sx), ay = Math.max(0, sy), bx = Math.min(src.width, sx + side), by = Math.min(src.height, sy + side);
      if (bx > ax && by > ay) g.drawImage(src, ax, ay, bx - ax, by - ay, (ax - sx) * k, (ay - sy) * k, (bx - ax) * k, (by - ay) * k);
      shareCache = null;
    }
    function resultImage() {
      if (!snap) return null;
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const g = c.getContext('2d');
      g.drawImage(snap, 0, 0);
      const sh = g.createLinearGradient(0, 780, 0, 1080); sh.addColorStop(0, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(0,0,0,.6)');
      g.fillStyle = sh; g.fillRect(0, 780, 1080, 300);
      const sh2 = g.createLinearGradient(0, 0, 0, 170); sh2.addColorStop(0, 'rgba(0,0,0,.45)'); sh2.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = sh2; g.fillRect(0, 0, 1080, 170);
      const font = px => `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans Thai", sans-serif`;
      g.lineJoin = 'round'; g.textBaseline = 'middle';
      const text = (str, x, y, px, max, align = 'center') => {
        g.font = font(px); g.textAlign = align;
        const w = g.measureText(str).width; if (w > max) { px *= max / w; g.font = font(px); }
        g.lineWidth = px * .16; g.strokeStyle = '#4a3018'; g.strokeText(str, x, y); g.fillStyle = '#fff'; g.fillText(str, x, y);
      };
      const disc = (x, y, col) => {
        g.beginPath(); g.arc(x, y + 5, 46, 0, Math.PI * 2); g.fillStyle = 'rgba(0,0,0,.4)'; g.fill();
        const gr = g.createRadialGradient(x - 14, y - 16, 6, x, y, 48);
        gr.addColorStop(0, col === 1 ? '#666' : '#fff'); gr.addColorStop(1, col === 1 ? '#0d0d0d' : '#d6d3ca');
        g.beginPath(); g.arc(x, y, 46, 0, Math.PI * 2); g.fillStyle = gr; g.fill();
      };
      const nb = countColor(1), nw = countColor(-1);
      disc(110, 990, 1); text(t('count')(nb), 172, 992, 96, 300, 'left');
      disc(970, 990, -1); text(t('count')(nw), 908, 992, 96, 300, 'right');
      text(nb > nw ? t('win') : nb < nw ? t('lose') : t('draw'), 540, 880, 96, 600);
      text(t('title'), 540, 74, 58, 900);
      return c;
    }
    function prepareShare() {
      if (!snap) return;
      const key = lang;
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], NAME + '.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;
    function showResult() {
      const nb = countColor(1), nw = countColor(-1);
      resultEl.querySelector('.v').textContent = nb > nw ? t('win') : nb < nw ? t('lose') : t('draw');
      resultEl.querySelector('.nb').textContent = t('count')(nb);
      resultEl.querySelector('.nw').textContent = t('count')(nw);
      resultEl.querySelector('.gb').style.width = (nb + nw ? nb / (nb + nw) * 100 : 50) + '%';
    }
    let resultStart = 0;
    function start() {
      for (const s of stones) { s.live = false; s.mesh.visible = false; }
      for (const [i, c] of [[27, -1], [28, 1], [35, 1], [36, -1]]) putCell(newStone(c), i);
      for (const s of stones) if (s.live) { s.px = s.x; s.py = s.y; s.pz = s.z; }
      shotsLeft = { 1: SHOTS, [-1]: SHOTS };
      for (const who of [1, -1]) { const sl = slings[who]; sl.load = null; sl.pull = sl.pv = 0; sl.holding = false; sl.yaw = who === 1 ? 0 : Math.PI; }
      snap = null; shareCache = null; shot = null;
      resultEl.style.display = 'none';
      resultEl.querySelector('.gb').style.width = '50%';
      state = 'ready';
      beginTurn(1);
      renderControls(); resize(); updateHints();
    }
    function finish() {
      state = 'result';
      resultStart = clock;
      showResult();
      resultEl.style.display = 'flex';
      renderControls(); resize(); updateHints();
      const nb = countColor(1), nw = countColor(-1);
      if (nb < nw) setTimeout(meowHappy, 300); else if (nb > nw) { catFx.shake = 1; setTimeout(meowAngry, 300); }
    }

    // ---------- 描画 ----------
    let last = performance.now(), acc = 0;
    function render(alpha, dt) {
      for (const s of stones) {
        if (!s.live) continue;
        s.mesh.position.set(s.px + (s.x - s.px) * alpha, s.py + (s.y - s.py) * alpha, s.pz + (s.z - s.pz) * alpha);
        s.mesh.rotation.set(s.ang, s.yaw, 0);
        s.mesh.scale.setScalar(s.shrink);
      }
      for (const who of [1, -1]) poseSling(slings[who]);
      poseCat(clock);
      updateCamera(dt);
      placeHint();
      if (pend.clack > 0.05) clack(Math.min(1, 0.2 + pend.clack / 2));
      if (pend.knock > 0.3) knock(Math.min(1, 0.25 + pend.knock / 3));
      if (pend.floor > 0) floorThud(0.7);
      pend.clack = pend.knock = pend.floor = 0;
      renderer.render(scene, camera);
      if (state === 'result' && !snap && clock - resultStart > 0.9) needSnap = true;
      if (needSnap) { needSnap = false; takeSnap(); prepareShare(); }
    }
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      acc += dt;
      while (acc >= STEP) { step(STEP); acc -= STEP; }
      render(acc / STEP, dt);
      requestAnimationFrame(loop);
    }

    window.__po = {
      stones, slings, get state() { return state; }, get turn() { return turn; }, shotsLeft: () => shotsLeft, camera, renderer,
      shoot: (yaw, p) => { if (state === 'ready') fire(1, yaw, p); },
      ff: sec => { for (let i = 0; i < sec / STEP; i++) step(STEP); },
      count: () => [countColor(1), countColor(-1)],
      shareImage: () => resultImage()?.toDataURL('image/png'),
      simulateRest, distOf,
      // アイコン用: 石を並べて、好きな位置から 512×512 で写す
      iconShot: (cells, cam, look, fov = 30) => {
        for (const s of stones) { s.live = false; s.mesh.visible = false; }
        for (const [i, c] of cells) putCell(newStone(c), i);
        for (const s of stones) if (s.live) { s.mesh.position.set(s.x, s.y, s.z); s.mesh.rotation.set(s.ang, s.yaw, 0); }
        for (const m of [...piles[1], ...piles[-1]]) m.visible = false;
        for (const who of [1, -1]) { slings[who].load = null; slings[who].pull = who === -1 ? 0.55 : 0; slings[who].yaw = who === 1 ? 0 : Math.PI; slings[who].g.rotation.y = slings[who].yaw; slings[who].g.updateMatrixWorld(); poseSling(slings[who]); }
        { const sl = slings[-1], st = newStone(-1); sl.g.localToWorld(pouchLocal(sl, _p)); st.mesh.position.set(_p.x, _p.y + 0.012, _p.z); st.mesh.rotation.set(Math.PI, 0, 0); }
        poseCat(0);
        const c = new THREE.PerspectiveCamera(fov, 1, 0.01, 30);
        c.position.set(...cam); c.lookAt(...look);
        catFace.lookAt(c.position);
        renderer.setPixelRatio(1); renderer.setSize(512, 512, false);
        renderer.render(scene, c);
        return renderer.domElement.toDataURL('image/png');
      },
    };
    buildRestTable();
    resize();
    start();
    applyLang();
    for (let i = 0; i < 4; i++) step(STEP);
    renderer.compile(scene, camera); render(0, 0.016);
    requestAnimationFrame(t0 => { last = t0; loop(t0); });
  </script>
</body>
</html>
