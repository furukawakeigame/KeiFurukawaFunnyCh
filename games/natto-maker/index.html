<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>納豆メーカー</title>
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <!-- X などにURLを貼ったときのカード表示（ここだけは https:// から書く） -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ふるかわけい面白チャンネル">
  <meta property="og:title" content="納豆メーカー">
  <meta property="og:url" content="https://keifurukawafunnych.com/games/natto-maker/">
  <meta property="og:image" content="https://keifurukawafunnych.com/games/natto-maker/icon.png">
  <meta name="twitter:card" content="summary">
  <style>
    html, body { margin: 0; height: 100%; background: #f3ede0; color: #5a3a1c; }
    body {
      display: flex; flex-direction: column; height: 100dvh;
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic UI", system-ui, sans-serif;
      overflow: hidden; touch-action: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; width: 100%; max-width: 560px; margin: 0 auto; box-sizing: border-box;
    }
    header a { color: #8a5a2b; text-decoration: none; font-weight: bold; }
    .hbtns { display: flex; gap: 6px; }
    .pill {
      font-size: 15px; background: #fff; border: 2px solid #e2d6bf; border-radius: 999px;
      min-width: 44px; height: 36px; cursor: pointer; font-weight: bold; color: #7a4e22; padding: 0 10px;
      display: flex; align-items: center; justify-content: center;
    }
    main {
      flex: 1; min-height: 0; display: flex; flex-direction: column;
      padding-bottom: calc(80px + env(safe-area-inset-bottom));
    }
    #stage { flex: 1; min-height: 0; position: relative; touch-action: none; }
    #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .bar {
      display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap;
      padding: 8px 12px; min-height: 52px;
    }
    .btn {
      font: inherit; font-weight: bold; font-size: 17px; border: none; border-radius: 999px;
      background: #7a4e22; color: #fff; height: 46px; padding: 0 18px; cursor: pointer;
      box-shadow: 0 4px 0 #4f3013; text-decoration: none; display: inline-flex; align-items: center;
    }
    .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #4f3013; }
    .btn.sub { background: #fff; color: #7a4e22; box-shadow: 0 4px 0 #ddd0b8; }
    .btn.on { background: #e0a020; color: #fff; box-shadow: 0 4px 0 #a07010; }
    .btn:disabled { opacity: .4; cursor: default; }
    .dot { display: inline-block; background: currentColor; border-radius: 50%; }
    .hide { display: none !important; }
    #drop {
      position: absolute; inset: 10px; border: 4px dashed #e0a020; border-radius: 20px;
      background: rgba(255, 255, 255, .5); pointer-events: none;
    }
    #err { position: absolute; top: 40%; left: 0; right: 0; text-align: center; color: #b03020; }
  </style>
</head>
<body>
  <header>
    <a id="back" href="../../">← トップへ戻る</a>
    <div class="hbtns">
      <button id="lang" class="pill">EN</button>
      <button id="snd" class="pill" aria-label="sound"></button>
    </div>
  </header>
  <main>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="drop" class="hide"></div>
    </div>
    <div id="barStart" class="bar">
      <button id="pick" class="btn"></button>
      <button id="sample" class="btn sub"></button>
    </div>
    <div id="barPaint" class="bar hide">
      <button id="brush" class="btn sub" aria-label="brush"><span class="dot" style="width:11px;height:11px"></span></button>
      <button id="erase" class="btn sub"></button>
      <button id="undo" class="btn sub"></button>
      <button id="done" class="btn" disabled></button>
    </div>
    <div id="barStir" class="bar hide">
      <button id="save" class="btn"></button>
      <a id="post" class="btn"></a>
      <button id="again" class="btn sub"></button>
    </div>
    <input id="file" type="file" accept="image/*" class="hide">
  </main>
<script>
(() => {
  const SHARE_URL = 'https://keifurukawafunnych.com/games/natto-maker/';
  const store = {
    get(k, d) { try { const v = localStorage.getItem('natto:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('natto:' + k, JSON.stringify(v)); } catch {} },
  };
  const DICT = {
    ja: {
      title: '納豆メーカー', back: '← トップへ戻る', pick: '画像をえらぶ', sample: 'ふつうの豆', erase: '消す', undo: '戻す',
      done: 'できた', save: '保存', post: 'Xに投稿', again: '画像を変える',
      shareText: '好きな画像で納豆を作った\n#納豆メーカー', err: '画像を読み込めませんでした',
    },
    en: {
      title: 'Natto Maker', back: '← Back to top', pick: 'Choose image', sample: 'Plain beans', erase: 'Erase', undo: 'Undo',
      done: 'Done', save: 'Save', post: 'Post on X', again: 'New image',
      shareText: 'I made natto out of my own picture\n#NattoMaker', err: 'Could not load the image',
    },
  };
  let lang = store.get('lang', (navigator.language || '').startsWith('ja') ? 'ja' : 'en');
  const t = k => DICT[lang][k];
  const $ = id => document.getElementById(id);

  // ---------- sound ----------
  let soundOn = store.get('sound', true), actx = null, noiseBuf = null;
  const SPK = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>';
  function drawSnd() {
    $('snd').innerHTML = SPK + (soundOn ? '<path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>' : '<path d="M17 9l5 6M22 9l-5 6"/>') + '</svg>';
  }
  function audio() {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (!noiseBuf) {
      noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.3, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    return actx;
  }
  // sticky "necha" sound: a short band-passed noise squelch
  function necha(vol) {
    if (!soundOn) return;
    try {
      const a = audio(), now = a.currentTime;
      const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
      s.buffer = noiseBuf;
      f.type = 'bandpass'; f.Q.value = 3;
      f.frequency.setValueAtTime(500 + Math.random() * 500, now);
      f.frequency.exponentialRampToValueAtTime(1600 + Math.random() * 800, now + 0.08);
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(0.5 * vol, now + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);
      s.connect(f).connect(g).connect(a.destination); s.start(now, Math.random() * 0.15); s.stop(now + 0.11);
    } catch {}
  }

  // "boing": a stretched string snapping
  function twang(vol) {
    if (!soundOn) return;
    try {
      const a = audio(), o = a.createOscillator(), lfo = a.createOscillator(), lg = a.createGain(), g = a.createGain(), now = a.currentTime;
      o.type = 'triangle';
      o.frequency.setValueAtTime(700 + Math.random() * 300, now); o.frequency.exponentialRampToValueAtTime(180, now + 0.25);
      lfo.frequency.value = 28; lg.gain.value = 60; lfo.connect(lg).connect(o.frequency);
      g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(0.2 * vol, now + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
      o.connect(g).connect(a.destination); o.start(now); lfo.start(now); o.stop(now + 0.3); lfo.stop(now + 0.3);
    } catch {}
  }

  function plop() {
    necha(0.5);
  }

  // ---------- state ----------
  const cv = $('cv'), ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  let mode = 'start';
  let img = null, mask = null, mctx = null, view = null;
  let brushIdx = 1, erasing = false, undoStack = [];
  let sprite = null;
  // pack-local units: the inside of the tray is PW x PH, centered at 0
  const PW = 1, PH = 0.8, R = 0.046, N_BEANS = 54;
  let beans = [], strings = new Map();
  let neba = 0;                 // stickiness 0..2, grows as you stir (past 1 it gets extra gooey)
  let stick = null, recoil = [];             // chopstick: {x, y, vx, vy, holds: [bean idx]}

  // ---------- layout ----------
  function resize() {
    const r = $('stage').getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    if (img) placeImage();
    render();
  }
  function packGeom(w, h) {
    const s = Math.min((w - 24) / (PW + 0.16), (h - 24) / (PH + 0.16) * 0.8);
    // sits low, leaving room above to pull the strings up
    return { s, cx: w / 2, cy: h - 12 - (PH / 2 + 0.08) * s };
  }

  // ---------- image loading ----------
  function loadFile(f) {
    if (!f || !f.type.startsWith('image/')) return;
    const url = URL.createObjectURL(f);
    const im = new Image();
    im.onload = () => {
      URL.revokeObjectURL(url);
      const k = Math.min(1, 1600 / Math.max(im.width, im.height));
      img = document.createElement('canvas');
      img.width = Math.max(1, Math.round(im.width * k)); img.height = Math.max(1, Math.round(im.height * k));
      img.getContext('2d').drawImage(im, 0, 0, img.width, img.height);
      mask = document.createElement('canvas'); mask.width = img.width; mask.height = img.height;
      mctx = mask.getContext('2d');
      undoStack = []; erasing = false; touches.clear(); pinch = null;
      placeImage();
      setMode('paint');
    };
    im.onerror = () => { URL.revokeObjectURL(url); flashErr(); };
    im.src = url;
  }
  function flashErr() {
    const d = document.createElement('div'); d.id = 'err'; d.textContent = t('err');
    $('stage').appendChild(d); setTimeout(() => d.remove(), 2000);
  }
  function snapFit() { if (view.k <= view.fit * 1.001) { view.x = (W - img.width * view.k) / 2; view.y = (H - img.height * view.k) / 2; } }
  function placeImage() {
    const pad = 12, k = Math.min((W - pad * 2) / img.width, (H - pad * 2) / img.height);
    view = { k, fit: k, x: (W - img.width * k) / 2, y: (H - img.height * k) / 2 };
  }
  function sampleSprite() {
    const c = document.createElement('canvas'); c.width = 160; c.height = 120;
    const g = c.getContext('2d');
    const gr = g.createRadialGradient(62, 44, 6, 80, 60, 80);
    gr.addColorStop(0, '#c08a4a'); gr.addColorStop(0.6, '#94602c'); gr.addColorStop(1, '#6a3e18');
    g.fillStyle = gr;
    g.beginPath(); g.ellipse(80, 60, 76, 56, 0, 0, Math.PI * 2); g.fill();
    g.strokeStyle = 'rgba(70,40,15,.5)'; g.lineWidth = 4;
    g.beginPath(); g.ellipse(80, 60, 30, 8, 0, 0, Math.PI * 2); g.stroke();
    return c;
  }

  // ---------- painting (same as Tapioca Maker) ----------
  let lastPt = null, pinch = null;
  const touches = new Map();
  const mid = (a, b) => { const r = cv.getBoundingClientRect(); return { x: (a.x + b.x) / 2 - r.left, y: (a.y + b.y) / 2 - r.top }; };
  function toImg(e) {
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left - view.x) / view.k, y: (e.clientY - r.top - view.y) / view.k };
  }
  const BRUSH = [8, 22, 50];
  function brushPx() { return BRUSH[brushIdx] / view.k; }
  function stroke(a, b) {
    mctx.save();
    mctx.globalCompositeOperation = erasing ? 'destination-out' : 'source-over';
    mctx.strokeStyle = '#000'; mctx.fillStyle = '#000';
    mctx.lineCap = 'round'; mctx.lineJoin = 'round'; mctx.lineWidth = brushPx();
    mctx.beginPath(); mctx.moveTo(a.x, a.y); mctx.lineTo(b.x, b.y); mctx.stroke();
    mctx.beginPath(); mctx.arc(b.x, b.y, brushPx() / 2, 0, Math.PI * 2); mctx.fill();
    mctx.restore();
  }
  function maskBox() {
    const d = mctx.getImageData(0, 0, mask.width, mask.height).data;
    let x0 = mask.width, y0 = mask.height, x1 = -1, y1 = -1;
    for (let y = 0; y < mask.height; y++) for (let x = 0; x < mask.width; x++) {
      if (d[(y * mask.width + x) * 4 + 3] > 20) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
    return x1 < 0 ? null : { x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1 };
  }
  function updateDone() { $('done').disabled = !maskBox(); }
  function makeSprite() {
    const b = maskBox(); if (!b) return false;
    const k = Math.min(1, 200 / Math.max(b.w, b.h));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(b.w * k)); c.height = Math.max(1, Math.round(b.h * k));
    const g = c.getContext('2d');
    g.drawImage(img, b.x, b.y, b.w, b.h, 0, 0, c.width, c.height);
    g.globalCompositeOperation = 'destination-in';
    g.drawImage(mask, b.x, b.y, b.w, b.h, 0, 0, c.width, c.height);
    sprite = c;
    return true;
  }

  // ---------- natto physics (top view, no gravity) ----------
  function startNatto() {
    beans = []; strings = new Map(); neba = 0; stick = null; recoil = [];
    for (let i = 0; i < N_BEANS; i++) {
      const foam = [];
      for (let j = 0; j < 8; j++) foam.push({ a: Math.random() * Math.PI * 2, d: R * (0.6 + Math.random() * 0.7), r: R * (0.18 + Math.random() * 0.22), th: j < 4 ? Math.random() : 1 + Math.random() });
      beans.push({
        x: (Math.random() - 0.5) * (PW - R * 4), y: (Math.random() - 0.5) * (PH - R * 4),
        i, vx: 0, vy: 0, a: Math.random() * Math.PI * 2, va: 0, foam, carry: false, fall: 0,
      });
    }
    setMode('stir');
  }
  const SR = 0.13, STICK_R = 0.022;
  const key = (i, j) => i * 1000 + j;
  let nechaT = 0;
  // pulling the chopstick up out of the tray: a few beans come with it and many strings stretch
  function liftOff() {
    const near = beans.map(b => ({ b, d: Math.hypot(b.x - stick.x, b.y - stick.y) })).filter(o => o.d < 0.3 + neba * 0.1).sort((a, b) => a.d - b.d);
    stick.holds.clear();
    near.forEach((o, n) => {
      if (n < 3) {
        o.b.carry = true;
        o.b.ox = (Math.random() - 0.5) * R * 2; o.b.oy = R * (0.6 + n * 1.3);
      }
      if (n < 14 + neba * 8) stick.holds.set(o.b.i, n < 4 ? 9 : (0.5 + neba * 1.6) * (0.5 + Math.random()));
    });
    necha(0.5);
  }
  function drop() {
    const hx = PW / 2 - R, hy = PH / 2 - R;
    for (const b of beans) if (b.carry) {
      b.carry = false; b.fall = 1;
      b.lx = Math.max(-hx, Math.min(hx, b.x)); b.ly = Math.max(-hy, Math.min(hy, Math.max(b.y, -hy + Math.random() * 0.12)));
      b.vx *= 0.3; b.vy = Math.min(b.vy, 0) * 0.3;
    }
    // the strings let go of the chopstick and spring back to their beans
    for (const [i] of stick.holds) recoil.push({ i, x: stick.x, y: stick.y, vx: 0, vy: 0, t: 0 });
    stick.holds.clear();
  }
  function step(dt) {
    const fr = Math.pow(0.08, dt);                 // tray friction
    const pull = 2 + neba * 10;                    // how strongly the chopstick drags nearby beans
    const lifted = stick && stick.lifted;
    for (const b of beans) {
      if (b.carry) {
        // beans hanging from the lifted chopstick
        const tx = stick.x + b.ox, ty = stick.y + b.oy, k = Math.min(1, dt * 18);
        b.vx = (tx - b.x) * k / dt; b.vy = (ty - b.y) * k / dt;
        b.x += (tx - b.x) * k; b.y += (ty - b.y) * k;
        continue;
      }
      if (b.fall > 0) continue;
      if (lifted && stick.holds.has(b.i)) {
        // a stretched string tugs the bean toward the chopstick
        const dx = stick.x - b.x, dy = stick.y - b.y, d = Math.hypot(dx, dy) || 1;
        b.vx += dx / d * (0.6 + neba) * dt; b.vy += dy / d * (0.6 + neba) * dt;
      }
      if (stick && !lifted) {
        const dx = b.x - stick.x, dy = b.y - stick.y, d = Math.hypot(dx, dy);
        if (d < SR) {
          const w = (1 - d / SR) * Math.min(1, pull * dt);
          b.vx += (stick.vx - b.vx) * w; b.vy += (stick.vy - b.vy) * w;
        }
      }
      b.vx *= fr; b.vy *= fr;
      b.x += b.vx * dt; b.y += b.vy * dt;
      b.va += ((b.vx + b.vy) / R * 0.3 - b.va) * Math.min(1, dt * 4);
      b.a += b.va * dt;
    }
    // sticky strings act as springs
    const rest = R * 2, maxLen = 0.04 + neba * 0.3;
    for (const [k, s] of strings) {
      const p = beans[s.i], q = beans[s.j];
      const dx = q.x - p.x, dy = q.y - p.y, d = Math.hypot(dx, dy) || 1e-6;
      const up = p.carry || q.carry;
      if (d > rest + (up ? 0.25 + neba * 0.9 : maxLen)) { strings.delete(k); if (up) twang(0.3); continue; }
      if (d > rest) {
        const f = (d - rest) * (up ? 0.5 : 1 + neba * 8) * dt;
        p.vx += dx / d * f; p.vy += dy / d * f; q.vx -= dx / d * f; q.vy -= dy / d * f;
      }
    }
    // collisions, walls, chopstick
    const hx = PW / 2 - R, hy = PH / 2 - R;
    for (let it = 0; it < 3; it++) {
      for (let i = 0; i < beans.length; i++) {
        const p = beans[i];
        for (let j = i + 1; j < beans.length; j++) {
          const q = beans[j];
          if (p.carry !== q.carry) continue;
          const dx = q.x - p.x, dy = q.y - p.y, d2 = dx * dx + dy * dy, md = R * 2;
          if (d2 < md * md && d2 > 1e-9) {
            const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, o = (md - d) * 0.5;
            p.x -= nx * o; p.y -= ny * o; q.x += nx * o; q.y += ny * o;
            const rv = (q.vx - p.vx) * nx + (q.vy - p.vy) * ny;
            if (rv < 0) { const imp = -rv * 0.5; p.vx -= nx * imp; p.vy -= ny * imp; q.vx += nx * imp; q.vy += ny * imp; }
            // touching beans get stuck together by a string, more often the more you stir
            if (it === 0 && neba > 0.05 && strings.size < 200 + neba * 200 && Math.random() < neba * dt * 30) {
              const k = key(i, j);
              if (!strings.has(k)) strings.set(k, { i, j, w: 0.5 + Math.random() * 0.8 });
            }
          }
        }
        if (p.carry) continue;
        if (p.fall > 0) {
          // falling back down into the tray, then a small bounce
          if (it === 0) {
            p.vy += 9 * dt; p.x += (p.lx - p.x) * Math.min(1, dt * 6); p.y += p.vy * dt;
            if (p.y >= p.ly) {
              p.y = p.ly;
              if (p.vy > 0.5) { p.vy = -p.vy * 0.25; plop(); } else { p.fall = 0; p.vx = p.vy = 0; }
            }
          }
          continue;
        }
        if (stick && !lifted) {
          const dx = p.x - stick.x, dy = p.y - stick.y, d = Math.hypot(dx, dy), md = R + STICK_R;
          if (d < md && d > 1e-9) { p.x = stick.x + dx / d * md; p.y = stick.y + dy / d * md; }
        }
        if (p.x < -hx) { p.x = -hx; p.vx = Math.abs(p.vx) * 0.3; }
        if (p.x > hx) { p.x = hx; p.vx = -Math.abs(p.vx) * 0.3; }
        if (p.y < -hy) { p.y = -hy; p.vy = Math.abs(p.vy) * 0.3; }
        if (p.y > hy) { p.y = hy; p.vy = -Math.abs(p.vy) * 0.3; }
      }
    }
    // chopstick strings: beans it touched stay hooked and stretch when you pull away
    if (lifted) {
      for (const [i, lim] of stick.holds) {
        const b = beans[i];
        if (!b.carry && Math.hypot(b.x - stick.x, b.y - stick.y) > lim) { stick.holds.delete(i); twang(0.5); }
      }
    } else if (stick) {
      const sp = Math.hypot(stick.vx, stick.vy);
      let near = 0;
      for (let i = 0; i < beans.length; i++) {
        const b = beans[i], d = Math.hypot(b.x - stick.x, b.y - stick.y);
        if (d < SR) near++;
        if (neba > 0.15 && d < R + STICK_R + 0.01 && stick.holds.size < 8 + neba * 6) stick.holds.set(i, 0);
      }
      for (const i of stick.holds.keys()) {
        const b = beans[i], d = Math.hypot(b.x - stick.x, b.y - stick.y);
        if (d > 0.08 + neba * 0.45) stick.holds.delete(i);
      }
      if (near) {
        neba = Math.min(2, neba + sp * dt * 0.06 * Math.min(1, near / 6));
        nechaT -= dt * Math.min(3, sp * 1.5);
        if (nechaT <= 0) { nechaT = 0.18; necha(0.15 + neba * 0.6); }
      }
    }
  }

  function stepRecoil(dt) {
    for (const c of recoil) {
      const b = beans[c.i];
      c.vx += ((b.x - c.x) * 260 - c.vx * 14) * dt; c.vy += ((b.y - c.y) * 260 - c.vy * 14) * dt;
      c.x += c.vx * dt; c.y += c.vy * dt; c.t += dt;
    }
    recoil = recoil.filter(c => c.t < 0.45);
  }

  // ---------- drawing ----------
  function roundRect(g, x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }
  function drawPack(g, s, cx, cy, opt) {
    g.save();
    g.translate(cx, cy); g.scale(s, s);
    const lw = 1 / s, rim = 0.07;
    // shadow + styrofoam tray
    g.fillStyle = 'rgba(90,60,30,.15)';
    roundRect(g, -PW / 2 - rim + 0.01, -PH / 2 - rim + 0.03, PW + rim * 2, PH + rim * 2, 0.08); g.fill();
    g.fillStyle = '#fdfcf7';
    roundRect(g, -PW / 2 - rim, -PH / 2 - rim, PW + rim * 2, PH + rim * 2, 0.08); g.fill();
    g.strokeStyle = '#e4dfd0'; g.lineWidth = 2 * lw; g.stroke();
    g.fillStyle = '#efece2';
    roundRect(g, -PW / 2, -PH / 2, PW, PH, 0.04); g.fill();
    g.save(); roundRect(g, -PW / 2, -PH / 2, PW, PH, 0.04); g.clip();
    // styrofoam grid
    g.strokeStyle = 'rgba(200,192,170,.5)'; g.lineWidth = 1.2 * lw;
    for (let x = -PW / 2; x <= PW / 2; x += 0.1) { g.beginPath(); g.moveTo(x, -PH / 2); g.lineTo(x, PH / 2); g.stroke(); }
    for (let y = -PH / 2; y <= PH / 2; y += 0.1) { g.beginPath(); g.moveTo(-PW / 2, y); g.lineTo(PW / 2, y); g.stroke(); }
    // beans
    const sp = opt.sprite, k = (R * 2.4) / Math.max(sp.width, sp.height);
    const inTray = opt.beans.filter(b => !b.carry && !(b.fall > 0)), up = opt.beans.filter(b => b.carry || b.fall > 0);
    for (const b of inTray) {
      g.fillStyle = 'rgba(70,40,15,.18)';
      g.beginPath(); g.arc(b.x + R * 0.12, b.y + R * 0.2, R * 0.95, 0, Math.PI * 2); g.fill();
    }
    // strings between beans (under the beans, so they look like they run between them)
    drawStrings(g, opt, lw, 0.35, false);
    for (const b of inTray) drawBean(g, b, sp, k);
    // slime gloss and foam, stronger as it gets sticky
    if (opt.neba > 0.05) {
      g.globalAlpha = Math.min(0.85, opt.neba * 1.1);
      for (const b of inTray) for (const f of b.foam) {
        if (f.th > opt.neba * 1.3) continue;
        const x = b.x + Math.cos(f.a + b.a * 0.2) * f.d, y = b.y + Math.sin(f.a + b.a * 0.2) * f.d;
        g.fillStyle = 'rgba(255,253,245,.75)';
        g.beginPath(); g.arc(x, y, f.r, 0, Math.PI * 2); g.fill();
        g.strokeStyle = 'rgba(230,220,200,.9)'; g.lineWidth = 1 * lw; g.stroke();
        g.fillStyle = '#fff';
        g.beginPath(); g.arc(x - f.r * 0.35, y - f.r * 0.35, f.r * 0.25, 0, Math.PI * 2); g.fill();
      }
      g.globalAlpha = 1;
    }
    drawStrings(g, opt, lw, 0.6, false);
    if (opt.neba > 1) {
      // very well stirred: a white sticky film over everything
      const e = opt.neba - 1;
      g.fillStyle = `rgba(255,252,240,${e * 0.08})`; g.fillRect(-PW / 2, -PH / 2, PW, PH);
      drawStrings(g, opt, lw * (1 + e * 1.5), e * 0.25, false);
    }
    g.restore();
    // chopstick strings above everything
    if (opt.stick) {
      const st = opt.stick;
      g.lineCap = 'round';
      for (const [i, lim] of st.holds) {
        const b = opt.beans[i], d = Math.hypot(b.x - st.x, b.y - st.y);
        // long thin strands that thin out as they stretch, swaying a little
        for (let n = 0; n < (st.lifted ? 3 + Math.floor(opt.neba * 1.5) : 1); n++) {
          const sway = Math.sin(opt.time * 3 + i + n * 2) * d * 0.06 + (n - 1) * d * 0.04;
          g.strokeStyle = `rgba(255,255,250,${st.lifted ? 0.7 + 0.25 * (1 - d / (lim || 1)) : 0.8})`;
          g.lineWidth = Math.max(0.9, (st.lifted ? 3.2 - d * 4 : 2.4 - d * 10) * (n ? 0.6 : 1) * (1 + Math.max(0, opt.neba - 1))) * lw;
          g.beginPath(); g.moveTo(st.x, st.y);
          g.quadraticCurveTo((b.x + st.x) / 2 + sway, (b.y + st.y) / 2 + d * 0.12, b.x, b.y); g.stroke();
        }
      }
    }
    // strings springing back after letting go
    for (const c of opt.recoil || []) {
      const b = opt.beans[c.i];
      g.strokeStyle = `rgba(255,255,250,${0.8 * (1 - c.t / 0.45)})`; g.lineWidth = 1.4 * lw;
      g.beginPath(); g.moveTo(c.x, c.y); g.lineTo(b.x, b.y); g.stroke();
    }
    // beans lifted out of the tray float above it, with strings back down to the tray
    drawStrings(g, opt, lw, 0.75, true);
    for (const b of up) {
      g.fillStyle = 'rgba(70,40,15,.15)';
      g.beginPath(); g.arc(b.x + R * 0.5, b.y + R * 0.9, R * 0.9, 0, Math.PI * 2); g.fill();
    }
    for (const b of up) drawBean(g, b, opt.sprite, k);
    if (opt.stick) {
      // the chopstick tip seen from above
      g.fillStyle = '#c99a5e'; g.strokeStyle = '#8a6030'; g.lineWidth = 1.5 * lw;
      g.beginPath(); g.arc(opt.stick.x, opt.stick.y, STICK_R, 0, Math.PI * 2); g.fill(); g.stroke();
    }
    g.restore();
  }
  function drawBean(g, b, sp, k) {
    g.save(); g.translate(b.x, b.y); g.rotate(b.a);
    g.drawImage(sp, -sp.width * k / 2, -sp.height * k / 2, sp.width * k, sp.height * k);
    g.restore();
  }
  function drawStrings(g, opt, lw, alpha, lifted) {
    g.lineCap = 'round';
    for (const s of opt.strings.values()) {
      const p = opt.beans[s.i], q = opt.beans[s.j], d = Math.hypot(q.x - p.x, q.y - p.y);
      if (!!(p.carry || q.carry) !== lifted) continue;
      const stretch = Math.max(0, d - R * 2);
      g.strokeStyle = `rgba(255,255,250,${alpha})`;
      g.lineWidth = Math.max(0.5, (2.2 - stretch * (lifted ? 4 : 18)) * s.w) * lw;
      g.beginPath(); g.moveTo(p.x, p.y);
      g.quadraticCurveTo((p.x + q.x) / 2 + (q.y - p.y) * 0.15 * s.w, (p.y + q.y) / 2 - (q.x - p.x) * 0.15 * s.w, q.x, q.y); g.stroke();
    }
  }
  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    if (mode === 'paint' && img) {
      const { k, x, y } = view;
      ctx.fillStyle = '#3b2a20'; ctx.fillRect(x, y, img.width * k, img.height * k);
      ctx.globalAlpha = 0.35; ctx.drawImage(img, x, y, img.width * k, img.height * k); ctx.globalAlpha = 1;
      ctx.drawImage(paintTmp(), x, y, img.width * k, img.height * k);
      return;
    }
    if (mode === 'start') {
      // an empty pack waiting for beans
      const gm = packGeom(W, H);
      drawPack(ctx, gm.s, gm.cx, gm.cy, { beans: [], strings: new Map(), sprite: startSprite, neba: 0 });
      return;
    }
    const gm = packGeom(W, H);
    drawPack(ctx, gm.s, gm.cx, gm.cy, { beans, strings, sprite, neba, stick, time, recoil });
  }
  const startSprite = sampleSprite();
  let tmpC = null;
  function paintTmp() {
    if (!tmpC || tmpC.width !== img.width || tmpC.height !== img.height) {
      tmpC = document.createElement('canvas'); tmpC.width = img.width; tmpC.height = img.height;
    }
    const g = tmpC.getContext('2d');
    g.globalCompositeOperation = 'source-over';
    g.clearRect(0, 0, tmpC.width, tmpC.height);
    g.drawImage(mask, 0, 0);
    g.globalCompositeOperation = 'source-in';
    g.drawImage(img, 0, 0);
    g.globalCompositeOperation = 'source-atop';
    g.fillStyle = 'rgba(60, 220, 110, 0.45)';
    g.fillRect(0, 0, tmpC.width, tmpC.height);
    return tmpC;
  }

  // ---------- loop ----------
  let lastT = performance.now(), time = 0;
  function loop(now) {
    const dt = Math.min(0.033, (now - lastT) / 1000); lastT = now; time += dt;
    if (mode === 'stir') {
      if (stick) {
        // chopstick velocity from the pointer movement
        const vx = (stick.tx - stick.x) / dt, vy = (stick.ty - stick.y) / dt;
        stick.vx += (vx - stick.vx) * 0.5; stick.vy += (vy - stick.vy) * 0.5;
        stick.x = stick.tx; stick.y = stick.ty;
        const out = stick.lifted ? stick.y < -PH / 2 + R * 0.5 : stick.y < -PH / 2 - R * 1.5;
        if (out && !stick.lifted) { stick.lifted = true; liftOff(); }
        else if (!out && stick.lifted) { stick.lifted = false; drop(); }
      }
      for (let i = 0; i < 4; i++) step(dt / 4);
      stepRecoil(dt);
      render();
    }
    requestAnimationFrame(loop);
  }

  // ---------- input ----------
  function toPack(e) {
    const gm = packGeom(W, H), r = cv.getBoundingClientRect();
    return {
      x: Math.max(-PW / 2, Math.min(PW / 2, (e.clientX - r.left - gm.cx) / gm.s)),
      // above the tray is allowed: that lifts the chopstick out
      y: Math.max(-(gm.cy - 8) / gm.s, Math.min(PH / 2, (e.clientY - r.top - gm.cy) / gm.s)),
    };
  }
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    cv.setPointerCapture(e.pointerId);
    if (mode === 'start') { $('file').click(); return; }
    if (mode === 'paint') {
      touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (touches.size === 1 && !pinch) {
        undoStack.push(mctx.getImageData(0, 0, mask.width, mask.height));
        if (undoStack.length > 20) undoStack.shift();
        lastPt = toImg(e); stroke(lastPt, lastPt); render();
      } else if (touches.size === 2) {
        if (lastPt) { const d = undoStack.pop(); if (d) mctx.putImageData(d, 0, 0); lastPt = null; }
        const [a, b] = [...touches.values()];
        pinch = { d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, m0: mid(a, b), k0: view.k, x0: view.x, y0: view.y };
        render();
      }
      return;
    }
    if (mode === 'stir' && !stick) {
      const p = toPack(e);
      stick = { id: e.pointerId, x: p.x, y: p.y, tx: p.x, ty: p.y, vx: 0, vy: 0, holds: new Map(), lifted: false };
    }
  });
  cv.addEventListener('pointermove', e => {
    if (mode === 'paint' && touches.has(e.pointerId)) {
      touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pinch && touches.size >= 2) {
        const [a, b] = [...touches.values()], m = mid(a, b);
        const k = Math.max(view.fit, Math.min(view.fit * 12, pinch.k0 * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d0));
        view.x = m.x - (pinch.m0.x - pinch.x0) / pinch.k0 * k;
        view.y = m.y - (pinch.m0.y - pinch.y0) / pinch.k0 * k;
        view.k = k; snapFit(); render();
      } else if (lastPt) { const p = toImg(e); stroke(lastPt, p); lastPt = p; render(); }
    }
    if (mode === 'stir' && stick && e.pointerId === stick.id) {
      const p = toPack(e); stick.tx = p.x; stick.ty = p.y;
    }
  });
  const up = e => {
    if (mode === 'paint') {
      touches.delete(e.pointerId);
      if (touches.size === 0) pinch = null;
      if (lastPt) { lastPt = null; updateDone(); }
    }
    if (mode === 'stir' && stick && e.pointerId === stick.id) {
      if (stick.lifted) { if (stick.holds.size) twang(0.8); drop(); }
      else {
        if (stick.holds.size) necha(0.3 + neba * 0.4);
        for (const [i] of stick.holds) recoil.push({ i, x: stick.x, y: stick.y, vx: 0, vy: 0, t: 0 });
      }
      stick = null;
    }
  };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', e => {
    if (mode !== 'paint') return;
    e.preventDefault();
    const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
    const k = Math.max(view.fit, Math.min(view.fit * 12, view.k * Math.exp(-e.deltaY * 0.0015)));
    view.x = mx - (mx - view.x) / view.k * k; view.y = my - (my - view.y) / view.k * k; view.k = k; snapFit();
    render();
  }, { passive: false });

  $('pick').onclick = () => $('file').click();
  $('again').onclick = () => $('file').click();
  $('sample').onclick = () => { sprite = sampleSprite(); startNatto(); };
  $('file').onchange = e => { loadFile(e.target.files[0]); e.target.value = ''; };
  $('brush').onclick = () => {
    brushIdx = (brushIdx + 1) % BRUSH.length;
    const d = $('brush').firstChild; d.style.width = d.style.height = [5, 11, 20][brushIdx] + 'px';
  };
  $('erase').onclick = () => { erasing = !erasing; $('erase').classList.toggle('on', erasing); };
  $('undo').onclick = () => {
    const d = undoStack.pop(); if (d) { mctx.putImageData(d, 0, 0); render(); updateDone(); }
  };
  $('done').onclick = () => { if (makeSprite()) startNatto(); };

  ['dragenter', 'dragover'].forEach(ev => window.addEventListener(ev, e => { e.preventDefault(); $('drop').classList.remove('hide'); }));
  ['dragleave', 'drop'].forEach(ev => window.addEventListener(ev, e => { e.preventDefault(); $('drop').classList.add('hide'); }));
  window.addEventListener('drop', e => { const f = e.dataTransfer && e.dataTransfer.files[0]; if (f) loadFile(f); });

  // ---------- export ----------
  function exportCanvas() {
    const c = document.createElement('canvas'); c.width = 1080; c.height = 1080;
    const g = c.getContext('2d');
    g.fillStyle = '#f3ede0'; g.fillRect(0, 0, c.width, c.height);
    const gm = packGeom(c.width, c.height - 80);
    drawPack(g, gm.s, gm.cx, gm.cy + 20, { beans, strings, sprite, neba });
    g.fillStyle = '#8a5a2b'; g.font = 'bold 34px sans-serif'; g.textAlign = 'right';
    g.fillText('keifurukawafunnych.com', c.width - 40, c.height - 36);
    return c;
  }
  $('save').onclick = () => {
    exportCanvas().toBlob(async blob => {
      const file = new File([blob], 'natto.png', { type: 'image/png' });
      if (matchMedia('(pointer: coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file] }); return; } catch (err) { if (err.name === 'AbortError') return; }
      }
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'natto.png';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, 'image/png');
  };

  // ---------- UI text / modes ----------
  function updatePost() {
    const a = $('post');
    a.href = `https://x.com/intent/post?text=${encodeURIComponent(t('shareText'))}&url=${encodeURIComponent(SHARE_URL)}`;
    if (!matchMedia('(pointer: coarse)').matches) { a.target = '_blank'; a.rel = 'noopener'; }
  }
  function setMode(m) {
    mode = m;
    $('barStart').classList.toggle('hide', m !== 'start');
    $('barPaint').classList.toggle('hide', m !== 'paint');
    $('barStir').classList.toggle('hide', m !== 'stir');
    if (m === 'paint') { $('erase').classList.remove('on'); updateDone(); }
    render();
  }
  function applyLang() {
    document.documentElement.lang = lang;
    document.title = t('title');
    $('back').textContent = t('back');
    $('lang').textContent = lang === 'ja' ? 'EN' : '日本語';
    for (const k of ['pick', 'sample', 'erase', 'undo', 'done', 'save', 'post', 'again']) $(k).textContent = t(k);
    updatePost();
  }
  $('lang').onclick = () => { lang = lang === 'ja' ? 'en' : 'ja'; store.set('lang', lang); applyLang(); };
  $('snd').onclick = () => { soundOn = !soundOn; store.set('sound', soundOn); drawSnd(); };

  drawSnd(); applyLang();
  new ResizeObserver(resize).observe($('stage'));
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
