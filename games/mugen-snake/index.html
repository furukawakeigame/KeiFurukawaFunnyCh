      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(hr * 0.38, sg * hr * 0.45 - hr * 0.1, hr * 0.06, 0, 7); ctx.fill();
    }
    ctx.restore();
  }
}
// the bars at the top: you, and the longest enemy around
function drawHud(W) {
  if (state === 'done' || (state === 'dead' && deadT > 0.9)) return;
  let top = null;
  for (const s of snakes) if (!s.isPlayer && s.alive && (!top || s.cells.length > top.cells.length)) top = s;
  const mine = state === 'dead' ? finalLen : player.cells.length, theirs = top ? top.cells.length : 0;
  const max = Math.max(mine, theirs, 8);
  const bw = Math.min(W * 0.42, 260), bh = 10, x = (W - bw) / 2 + 14, y = TOP + 4;
  const bar = (yy, v, col, icon) => {
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.roundRect(x, yy, bw, bh, bh / 2); ctx.fill();
    ctx.fillStyle = col; ctx.beginPath(); ctx.roundRect(x, yy, Math.max(bh, bw * v / max), bh, bh / 2); ctx.fill();
    icon(x - 14, yy + bh / 2);
  };
  bar(y, mine, '#ffb347', (ix, iy) => { if (catImg.complete) ctx.drawImage(catImg, ix - 11, iy - 11, 22, 22); });
  if (top) bar(y + bh + 8, theirs, top.skin[0], (ix, iy) => {
    ctx.fillStyle = top.skin[0]; ctx.beginPath(); ctx.arc(ix, iy, 7, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ix + 2, iy - 2, 2.4, 0, 7); ctx.arc(ix + 2, iy + 2, 2.4, 0, 7); ctx.fill();
  });
  // one little mark per enemy you took down
  for (let i = 0; i < Math.min(kills, 12); i++) {
    const kx = x + bw + 12 + (i % 6) * 12, ky = y + 5 + Math.floor(i / 6) * 12;
    ctx.fillStyle = '#ffe066'; ctx.strokeStyle = '#7a5b00'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let j = 0; j < 10; j++) { const a = -Math.PI / 2 + j * Math.PI / 5, r = j % 2 ? 2.6 : 5.6; ctx.lineTo(kx + Math.cos(a) * r, ky + Math.sin(a) * r); }
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
}
function draw(fdt, now) {
  const W = cv.clientWidth, H = cv.clientHeight;
  // camera eases after the head
  const pk = Math.min(1, player.acc / player.interval);
  const hp = player.alive ? bodyPath(player, state === 'play' ? pk : 0)[0] : [crash[0] + 0.5, crash[1] + 0.5];
  const f = 1 - Math.exp(-fdt * 8);
  camX += (hp[0] - camX) * f; camY += (hp[1] - camY) * f;
  ctx.save();
  if (shake > 0) { shake -= fdt; const m = shake * cell * 0.4; ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m); }
  drawGround(W, H);
  for (const fd of food.values()) drawFood(fd, now);
  const ks = s => (s.isPlayer && state !== 'play') ? (s.alive ? 0 : 1) : Math.min(1, s.acc / s.interval);
  for (const s of snakes) if (s.alive) drawSnakeShadow(s, ks(s));
  for (const s of snakes) if (s.alive && !s.isPlayer) drawSnake(s, ks(s), now, false);
  if (player.alive) drawSnake(player, ks(player), now, false);
  // the cat flashes where it crashed for a moment
  if (state === 'dead' && deadT < 0.35) {
    ctx.globalAlpha = 1 - deadT / 0.35;
    const [x, y] = toScreen(crash[0] + 0.5, crash[1] + 0.5), r = cell * (0.9 + deadT * 3);
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  }
  if (!player.alive) { // the cat's face stays at the crash, dizzy
    const [x, y] = toScreen(crash[0] + 0.5, crash[1] + 0.5), r = cell * 0.9;
    ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(now / 200) * 0.25 + 0.4);
    if (catImg.complete) ctx.drawImage(catImg, -r, -r, r * 2, r * 2);
    ctx.restore();
    for (let i = 0; i < 3; i++) { // little stars circling the head
      const a = now / 400 + i * Math.PI * 2 / 3, sx = x + Math.cos(a) * cell * 0.9, sy = y - cell * 0.85 + Math.sin(a) * cell * 0.25;
      ctx.fillStyle = '#ffe066'; ctx.beginPath();
      for (let j = 0; j < 10; j++) { const b = -Math.PI / 2 + j * Math.PI / 5, rr = (j % 2 ? 0.07 : 0.16) * cell; ctx.lineTo(sx + Math.cos(b) * rr, sy + Math.sin(b) * rr); }
      ctx.fill();
    }
  }
  // particles
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.t += fdt;
    if (p.t >= p.life) { parts.splice(i, 1); continue; }
    p.x += p.vx * fdt; p.y += p.vy * fdt; p.vx *= 1 - fdt * 3; p.vy *= 1 - fdt * 3;
    const [x, y] = toScreen(p.x, p.y), a = 1 - p.t / p.life;
    ctx.globalAlpha = a; ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(x, y, p.r * cell * (p.star ? a + 0.3 : 1), 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // waiting for the first move: arrows pulse around the cat
  if (state === 'ready') {
    const [x, y] = toScreen(hp[0], hp[1]), ph_ = (now / 700) % 1, off = cell * (1.3 + ph_ * 0.5), sz = cell * 0.3;
    ctx.fillStyle = `rgba(255,255,255,${0.95 * (1 - ph_)})`;
    for (const [dx, dy] of DIRS) {
      const ax = x + dx * off, ay = y + dy * off;
      ctx.beginPath(); ctx.moveTo(ax + dx * sz, ay + dy * sz); ctx.lineTo(ax - dy * sz, ay + dx * sz); ctx.lineTo(ax + dy * sz, ay - dx * sz); ctx.fill();
    }
  }
  ctx.restore();
  // soft vignette for depth
  const vg = ctx.createRadialGradient(W / 2, cy0, Math.min(W, H) * 0.3, W / 2, cy0, Math.max(W, H) * 0.75);
  vg.addColorStop(0, 'rgba(0,30,0,0)'); vg.addColorStop(1, 'rgba(0,30,0,.35)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  drawHud(W);
}

// ---- loop: fixed steps, whatever the frame rate ----
let last = performance.now(), simAcc = 0, hissCool = 2;
function loop(now) {
  const fdt = Math.min(0.05, (now - last) / 1000); last = now;
  simAcc += fdt;
  while (simAcc >= STEP) { sim(STEP); simAcc -= STEP; }
  upkeepT += fdt; if (upkeepT > 0.25) { upkeepT = 0; upkeep(); }
  if (state === 'dead') { deadT += fdt; if (deadT > 1.3) finish(); }
  // an enemy right next to the cat hisses now and then
  hissCool -= fdt;
  if (state === 'play' && hissCool <= 0) {
    const [hx, hy] = ph();
    if (snakes.some(s => !s.isPlayer && s.alive && Math.abs(s.cells[0][0] - hx) + Math.abs(s.cells[0][1] - hy) <= 3)) { sfx.hiss(); hissCool = 3 + Math.random() * 2; }
  }
  draw(fdt, now);
  requestAnimationFrame(loop);
}
reset(); resize(); applyLang(); upkeep(); draw(0, performance.now()); requestAnimationFrame(loop);
</script>
