{

  const mkTube = (col, x, z, ry) => {
    const g = new THREE.Group();
    const lc = document.createElement('canvas'); lc.width = 128; lc.height = 64;
    const lx = lc.getContext('2d'); lx.fillStyle = '#eee8dc'; lx.fillRect(0, 0, 128, 64); lx.fillStyle = col; lx.fillRect(0, 18, 128, 28);
    const lt = new THREE.CanvasTexture(lc); lt.colorSpace = THREE.SRGBColorSpace;
    const body = new THREE.Mesh(tubeGeo, [tubeMat]); body.castShadow = true;
    const label = new THREE.Mesh(new THREE.CylinderGeometry(0.0225, 0.0225, 0.07, 20, 1, true), new THREE.MeshStandardMaterial({ map: lt, roughness: 0.6 }));
    label.position.y = 0.02;
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.011, 0.012, 0.025, 14), capMat); cap.position.y = 0.093; cap.castShadow = true;
    const shoulder = new THREE.Mesh(new THREE.CylinderGeometry(0.009, 0.022, 0.012, 20), tubeMat); shoulder.position.y = 0.086;
    g.add(body, label, cap, shoulder);
    g.rotation.set(Math.PI / 2, 0, ry); g.position.set(x, -0.01, z);
    props.add(g);
  };
  mkTube('#c51f1f', 0.78, -0.62, 0.9);
  mkTube('#2a3fa8', 0.92, -0.42, 1.25);
  mkTube('#f3d01c', -0.85, 0.15, -0.3);
}

// ===== 配置（画面の向きでパレットの位置を変える） =====
let layout = '', topPad = 52, bottomPad = 140;
const box = new THREE.Box3();
let restPos = new THREE.Vector3(), restYaw = 0;
function setLayout(l) {
  layout = l;
  const wide = l === 'wide';
  boardH.visible = !wide; boardV.visible = wide;
  const pc = wide ? new THREE.Vector3(0.75, 0, 0) : new THREE.Vector3(0, 0, 0.74);
  palette.position.copy(pc);
  dabs.forEach((m, i) => {
    const a = i % 4, b = (i / 4) | 0;
    if (wide) m.position.set(-0.075 + b * 0.15, -0.02, -0.32 + a * 0.15);
    else m.position.set(-0.4 + a * 0.15, -0.02, -0.075 + b * 0.15);
  });
  // ナイフの置き場所: パレットの空いた所
  if (wide) { restPos.set(0.77, -0.012, 0.27); restYaw = Math.PI / 2 - 0.15; }
  else { restPos.set(0.33, -0.012, 0.76); restYaw = 0.2; }
  // 画面に収める範囲: キャンバス＋猫のスケッチ＋パレット
  box.makeEmpty();
  box.expandByPoint(new THREE.Vector3(-0.5, 0, -0.78)); box.expandByPoint(new THREE.Vector3(0.5, 0.02, 0.5));
  if (wide) { box.expandByPoint(new THREE.Vector3(0.94, 0, 0.5)); box.expandByPoint(new THREE.Vector3(0.94, 0, -0.5)); }
  else { box.expandByPoint(new THREE.Vector3(-0.52, 0, 0.93)); box.expandByPoint(new THREE.Vector3(0.52, 0, 0.93)); }
  updRing();
}
function updRing() { const d = dabs[cur]; ring.position.set(d.position.x, -0.0195, d.position.z); }

const PITCH = THREE.MathUtils.degToRad(58);
const camT = new THREE.Vector3();
function resize() {
  const w = innerWidth, Hh = innerHeight;
  renderer.setSize(w, Hh, false);
  let h = Math.max(160, Hh - topPad - bottomPad);
  const l = w / h > 1.12 ? 'wide' : 'tall';
  if (l !== layout) setLayout(l);
  // 横長の画面では、下のボタンは左右の角にあるので、真ん中は下の80pxの上まで使う（左右の角だけ空ける）
  let side = 0;
  if (l === 'wide') { h = Math.max(160, Hh - topPad - 84); side = 130; }
  camera.aspect = w / h; camera.clearViewOffset(); camera.updateProjectionMatrix();
  box.getCenter(camT); camT.y = 0;
  // 箱の角がすべて画面（ヘッダーと下の空白を除いた範囲）に入る一番近い距離を探す
  const pts = [];
  for (let q = 0; q < 8; q++) pts.push(new THREE.Vector3(q & 1 ? box.max.x : box.min.x, q & 2 ? box.max.y : box.min.y, q & 4 ? box.max.z : box.min.z));
  const mx = (1 - Math.min(0.12, 24 / w * 2)) * Math.max(0.4, (w - 2 * side) / w), my = 1 - Math.min(0.12, 16 / h * 2);
  const fits = d => {
    camera.position.set(camT.x, camT.y + Math.sin(PITCH) * d, camT.z + Math.cos(PITCH) * d);
    camera.lookAt(camT); camera.updateMatrixWorld();
    let x0 = 9, x1 = -9, y0 = 9, y1 = -9;
    for (const p of pts) { const v = p.clone().project(camera); x0 = Math.min(x0, v.x); x1 = Math.max(x1, v.x); y0 = Math.min(y0, v.y); y1 = Math.max(y1, v.y); }
    return { ok: x1 - x0 <= 2 * mx && y1 - y0 <= 2 * my, cy: (y0 + y1) / 2, cx: (x0 + x1) / 2 };
  };
  let lo = 0.5, hi = 30;
  for (let it = 0; it < 30; it++) { const m = (lo + hi) / 2; if (fits(m).ok) hi = m; else lo = m; }
  // 中心のずれを直す（遠近で手前が大きく見える分）
  for (let it = 0; it < 3; it++) {
    const f = fits(hi);
    camT.z -= f.cy * 0.5 * (box.max.z - box.min.z) * 0.9;
    camT.x += f.cx * 0.5 * (box.max.x - box.min.x) * 0.9;
    lo = 0.5; let hh = 30; for (let k = 0; k < 30; k++) { const m = (lo + hh) / 2; if (fits(m).ok) hh = m; else lo = m; } hi = hh;
  }
  fits(hi);
  camera.setViewOffset(w, h, 0, -topPad, w, Hh);
  camera.updateProjectionMatrix();
  scene.fog.near = hi + 1.5; scene.fog.far = hi + 7;
  placeHint();
}
addEventListener('resize', resize);

// ===== 最初の絵具 =====
function fresh() {
  H.fill(0); AR.fill(0); AG.fill(0); AB.fill(0);
  const gp = (x, z) => [(x + 0.5) * (G - 1), (z + 0.5) * (G - 1)];
  placeBlob(...gp(-0.18, -0.12), 0, 11);
  placeBlob(...gp(0.12, -0.2), 4, 22);
  placeBlob(...gp(0.05, 0.14), 1, 33);
  stepBlobs(1); dirtyAll(); flush();
}
fresh();
resize();

// ===== 操作 =====
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit = new THREE.Vector3();
function toWorld(cx, cy) {
  ndc.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  return ray.ray.intersectPlane(plane, hit) ? hit : null;
}
const toGrid = p => [(p.x + 0.5) * (G - 1), (p.z + 0.5) * (G - 1)];
const onCanvas = p => p && Math.abs(p.x) <= 0.53 && Math.abs(p.z) <= 0.53;
function pickDab(cx, cy) {
  let best = -1, bd = 1e9;
  const v = new THREE.Vector3();
  dabs.forEach((m, i) => {
    m.getWorldPosition(v); v.project(camera);
    const sx = (v.x + 1) / 2 * innerWidth, sy = (1 - v.y) / 2 * innerHeight, d = Math.hypot(sx - cx, sy - cy);
    if (d < bd) { bd = d; best = i; }
  });
  // 山の見た目の大きさに合わせた当たり判定
  const a = new THREE.Vector3(), b = new THREE.Vector3();
  dabs[0].getWorldPosition(a); dabs[1].getWorldPosition(b); a.project(camera); b.project(camera);
  const gap = Math.hypot((a.x - b.x) / 2 * innerWidth, (a.y - b.y) / 2 * innerHeight);
  return bd < gap * 0.55 ? best : -1;
}
let ptr = null; // 今さわっている指
const kn = { x: 0, z: 0, yaw: 0, y: 0.05, show: 0, hover: false, sideSign: 1 };
let started = false;
const cvEl = $('cv');
cvEl.addEventListener('pointerdown', e => {
  if (ptr) return;
  const d = pickDab(e.clientX, e.clientY);
  if (d >= 0) {
    cur = d; updRing(); tick();
    dabs[d].userData.pop = 1;
    return;
  }
  const p = toWorld(e.clientX, e.clientY);
  if (!onCanvas(p)) return;
  cvEl.setPointerCapture(e.pointerId);
  const [gx, gy] = toGrid(p);
  ptr = { id: e.pointerId, sx: e.clientX, sy: e.clientY, t: performance.now(), gx, gy, stroking: false };
  kn.x = p.x; kn.z = p.z; kn.hx = p.x; kn.hz = p.z;
});
function moveTo(e) {
  const p = toWorld(e.clientX, e.clientY);
  if (!p) return;
  kn.hx = p.x; kn.hz = p.z;
  if (!ptr.stroking) {
    if (Math.hypot(e.clientX - ptr.sx, e.clientY - ptr.sy) < 7) return;
    ptr.stroking = true;
    pushUndo(); newStriations();
    st.x = ptr.gx; st.y = ptr.gy; st.has = false;
    if (!started) { started = true; $('hint').classList.add('off'); }
  }
  const [gx, gy] = toGrid(p);
  strokeTo(Math.max(-HALF, Math.min(G - 1 + HALF, gx)), Math.max(-HALF, Math.min(G - 1 + HALF, gy)));
}
cvEl.addEventListener('pointermove', e => {
  if (ptr && e.pointerId === ptr.id) {
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of (evs.length ? evs : [e])) moveTo(ev);
  } else if (e.pointerType === 'mouse') {
    const p = toWorld(e.clientX, e.clientY);
    kn.hover = onCanvas(p);
    if (kn.hover) { kn.hx = p.x; kn.hz = p.z; }
  }
});
function endPtr(e) {
  if (!ptr || e.pointerId !== ptr.id) return;
  if (!ptr.stroking && performance.now() - ptr.t < 600) {
    pushUndo(); placeBlob(ptr.gx, ptr.gy, cur); plop();
    if (!started) { started = true; $('hint').classList.add('off'); }
  }
  ptr = null;
  queueSnap();
}
cvEl.addEventListener('pointerup', endPtr);
cvEl.addEventListener('pointercancel', endPtr);
cvEl.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && !ptr) kn.hover = false; });

// 最初の合図: 白い絵具の上
function placeHint() {
  const v = new THREE.Vector3(-0.18, 0.01, -0.12).project(camera);
  $('hint').style.left = ((v.x + 1) / 2 * innerWidth) + 'px';
  $('hint').style.top = ((1 - v.y) / 2 * innerHeight) + 'px';
}
placeHint();

// ===== 毎フレーム =====
let last = 0, sndT = 0;
function heightAt(x, z) {
  const i = Math.round((x + 0.5) * (G - 1)), j = Math.round((z + 0.5) * (G - 1));
  if (i < 0 || j < 0 || i >= G || j >= G) return -1;
  let m = 0; for (let b = -2; b <= 2; b++) for (let a = -2; a <= 2; a++) { const ii = i + a, jj = j + b; if (ii >= 0 && jj >= 0 && ii < G && jj < G) m = Math.max(m, H[jj * G + ii]); }
  return m;
}
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000 || 0.016); last = now;
  stepBlobs(dt);
  flush();

  // ナイフ: 使っている時は指の所、それ以外はパレットの上で休む
  const active = ptr && ptr.stroking;
  let tx, tz, ty, tyaw;
  if (ptr || kn.hover) {
    if (ptr) { tx = (st.has ? st.x : ptr.gx) / (G - 1) - 0.5; tz = (st.has ? st.y : ptr.gy) / (G - 1) - 0.5; }
    else { tx = kn.hx; tz = kn.hz; }
    // 刃の長い向き＝進む向きに直角。柄は右手前に出す。
    let qx = -st.dy, qz = st.dx;
    if (-qx + -qz * 0.5 < 0) { qx = -qx; qz = -qz; }
    tyaw = Math.atan2(-qz, qx);
    const hh = heightAt(tx, tz);
    ty = (active ? Math.max(0, hh) * HS * 0.5 + 0.0012 : Math.max(0, hh) * HS + 0.012);
  } else { tx = restPos.x; tz = restPos.z; ty = restPos.y; tyaw = restYaw; }
  const kk = 1 - Math.exp(-dt * (active ? 40 : 14));
  kn.x += (tx - kn.x) * kk; kn.z += (tz - kn.z) * kk; kn.y += (ty - kn.y) * kk;
  let dy = tyaw - kn.yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy)); kn.yaw += dy * (1 - Math.exp(-dt * 12));
  knife.position.set(kn.x, kn.y, kn.z); knife.rotation.y = kn.yaw;
  // 置いてある時は柄を下ろして寝かせる
  const roll = ptr || kn.hover ? 0 : 0.36;
  knife.rotation.z += (roll - knife.rotation.z) * (1 - Math.exp(-dt * 10));

  // 選んだ山がぷるっと
  for (const d of dabs) {
    if (d.userData.pop) { d.userData.pop = Math.max(0, d.userData.pop - dt * 4); const s = 1 + 0.25 * Math.sin(d.userData.pop * Math.PI); d.scale.set(0.042 * s, 0.026 * (2 - s), 0.042 * s); }
  }

  // 音: 押した絵具の量と速さで、粘った音とこする音の大きさを決める
  if (bed) {
    const sp = moved / dt / G; // 1秒にキャンバスの何枚分動いたか
    const wet = soundOn && active ? Math.min(0.9, Math.sqrt(pushed / dt) * 0.035) : 0;
    const scr = soundOn && active ? Math.min(0.12, sp * 0.06) * (1 - Math.min(1, wet * 3)) : 0;
    const n = ac.currentTime;
    bed.wet.g.gain.setTargetAtTime(wet * 0.6, n, 0.04);
    bed.wet2.g.gain.setTargetAtTime(wet * 0.9, n, 0.05);
    bed.scr.g.gain.setTargetAtTime(scr, n, 0.04);
    bed.wet.bp.frequency.setTargetAtTime(320 + Math.min(600, sp * 260) + Math.random() * 120, n, 0.03);
    sndT -= dt;
    if (wet > 0.05 && sndT <= 0) { squish(Math.min(0.7, wet * 0.9)); sndT = 0.05 + Math.random() * 0.12 / (0.3 + wet); }
  }
  moved = 0; pushed = 0;

  renderer.render(scene, camera);
  if (snapQueued && !ptr && now > snapQueued) { snapQueued = 0; snapShot(); }
  requestAnimationFrame(frame);
}

// ===== Xに投稿（絵を真上から撮って付ける） =====
const SHARE_URL = 'https://keifurukawafunnych.com/games/oil-knife/', TAG = '#油絵具のばしゲーム';
let shareFile = null, snapQueued = 0;
const queueSnap = () => { snapQueued = performance.now() + 350; };
const ortho = new THREE.OrthographicCamera(-0.5, 0.5, 0.5, -0.5, 0.1, 10);
ortho.position.set(0, 3, 0); ortho.up.set(0, 0, -1); ortho.lookAt(0, 0, 0);
const snapCv = document.createElement('canvas'); snapCv.width = snapCv.height = 1080;
const rawCv = document.createElement('canvas'); rawCv.width = rawCv.height = 1024; // 文字なしの絵
function snapShot() {
  // 真上から撮ると天井の映り込みで白っぽくなるので、撮る間だけ映り込みを消す
  const kv = knife.visible, fog = scene.fog, env = scene.environment;
  knife.visible = false; scene.fog = null; scene.environment = null;
  renderer.setPixelRatio(1); renderer.setSize(1024, 1024, false);
  renderer.render(scene, ortho);
  rawCv.getContext('2d').drawImage(renderer.domElement, 0, 0, 1024, 1024);
  knife.visible = kv; scene.fog = fog; scene.environment = env;
  renderer.setPixelRatio(PR); resize();
  renderer.render(scene, camera);
  updateShare();
}
window.updateShare = function updateShare() {
  const text = `${t('title')}\n${TAG}`;
  const a = $('share');
  a.href = 'https://x.com/intent/post?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(SHARE_URL);
  if (matchMedia('(pointer: coarse)').matches) a.removeAttribute('target'); else { a.target = '_blank'; a.rel = 'noopener'; }
  a.dataset.text = text;
  // 画像: 木の机の上にキャンバス＋小さくタイトル
  const x = snapCv.getContext('2d');
  x.fillStyle = '#3a2a1e'; x.fillRect(0, 0, 1080, 1080);
  x.save(); x.shadowColor = 'rgba(0,0,0,.5)'; x.shadowBlur = 30; x.shadowOffsetY = 10;
  x.fillStyle = '#e9e2d3'; x.fillRect(70, 40, 940, 940); x.restore();
  x.drawImage(rawCv, 0, 0, 1024, 1024, 70, 40, 940, 940);
  x.fillStyle = '#f3ede4'; x.globalAlpha = 0.85; x.textBaseline = 'alphabetic';
  x.font = '700 44px system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif';
  x.fillText(t('title'), 72, 1046); x.globalAlpha = 1;
  // 共有用ファイルは先に作っておく（押した時に作ると Safari で共有が止まる）
  snapCv.toBlob(b => { if (b) shareFile = new File([b], 'oil-knife.png', { type: 'image/png' }); }, 'image/png');
};
$('share').addEventListener('click', e => {
  const text = $('share').dataset.text;
  if (matchMedia('(pointer: coarse)').matches) {
    // スマホ: 画像つきで共有シートを開く（使えなければそのまま X の投稿画面へ）
    if (navigator.share && shareFile && navigator.canShare?.({ files: [shareFile] })) {
      e.preventDefault();
      navigator.share({ files: [shareFile], text: `${text}\n${SHARE_URL}` }).catch(() => {});
    }
  } else if (shareFile) {
    // PC: 画像を保存してから投稿画面を開く（画像は自分で添付する）
    const u = URL.createObjectURL(shareFile), d = document.createElement('a');
    d.href = u; d.download = 'oil-knife.png'; document.body.appendChild(d); d.click(); d.remove();
    setTimeout(() => URL.revokeObjectURL(u), 4000);
  }
});

// 部屋の映り込みは控えめに（窓の光の陰影を目立たせる）
scene.traverse(o => { for (const m of [].concat(o.material || [])) if (m.envMapIntensity === 1) m.envMapIntensity = 0.45; });
renderer.compile(scene, camera);
renderer.render(scene, camera);
snapShot();
requestAnimationFrame(t0 => { last = t0; frame(t0); });
</script>
