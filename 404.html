<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-9E13VFBMWN"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-9E13VFBMWN');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ページが見つかりません | ふるかわけい面白チャンネル</title>
  <meta name="robots" content="noindex">
  <!-- このページはどの階層のURLでも表示されるので、相対パスではなく https:// から書く -->
  <link rel="icon" href="https://keifurukawafunnych.com/icon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap">
  <link rel="stylesheet" href="https://keifurukawafunnych.com/style.css">
  <style>
    .notfound { text-align: center; margin: 32px 0 8px; }
    .notfound .big { font-size: 4em; font-weight: 900; line-height: 1; margin: 0; }
    .notfound p { color: var(--sub); }
    #latest { margin-top: 40px; }
    .home {
      display: inline-block; margin-top: 8px; padding: 12px 28px; border-radius: 999px;
      font-weight: bold; text-decoration: none; color: var(--bg); background: var(--text);
    }
  </style>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6939356439579496" crossorigin="anonymous"></script>
</head>
<body>
  <header>
    <h1>ふるかわけい面白チャンネル</h1>
  </header>

  <main>
    <section class="notfound">
      <p class="big">404</p>
      <h2 style="justify-content: center;">ページが見つかりません</h2>
      <p>URLが変わったか、ページがなくなったのかもしれません。</p>
      <a class="home" href="https://keifurukawafunnych.com/">トップページへ</a>
    </section>

    <section id="latest" hidden>
      <h2>新しいゲーム</h2>
      <ul class="games"></ul>
    </section>
  </main>

  <footer>
    <p><a href="https://keifurukawafunnych.com/about.html">運営者情報・お問い合わせ</a> · <a href="https://keifurukawafunnych.com/privacy.html">プライバシーポリシー</a></p>
    <p>&copy; Kei Furukawa</p>
  </footer>

  <script>
    // トップページの一覧から新しいゲームを6個もらって表示する（ここを書き換える必要はない）
    const BASE = location.hostname === 'keifurukawafunnych.com' ? 'https://keifurukawafunnych.com/' : location.origin + '/';
    fetch(BASE + 'index.html').then(r => r.text()).then(html => {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const items = [...doc.querySelectorAll('.games li')].slice(0, 6);
      if (!items.length) return;
      const ul = document.querySelector('#latest ul');
      items.forEach(li => {
        li.querySelectorAll('[href]').forEach(a => a.href = BASE + a.getAttribute('href'));
        li.querySelectorAll('img').forEach(img => { img.src = BASE + img.getAttribute('src'); img.removeAttribute('loading'); });
        ul.append(document.importNode(li, true));
      });
      document.getElementById('latest').hidden = false;
    }).catch(() => {});
  </script>
</body>
</html>
