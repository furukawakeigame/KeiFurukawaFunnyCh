<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ふるかわけい面白チャンネル</title>
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>ふるかわけい面白チャンネル</h1>
    <p>自作のゲームを置いています。</p>
  </header>

  <main>
    <h2>ゲーム一覧</h2>
    <ul class="games">
      <!-- ゲームを追加するときは、この <li> をコピーして書き換える -->
      <li>
        <a class="icon" href="games/vodka-brim/"><img src="games/vodka-brim/icon.png" alt="" width="72" height="72"></a>
        <div>
          <a href="games/vodka-brim/">ウォッカ表面張力</a>
          <p>表面張力ギリギリまで注げ。あふれたら死ぬ。</p>
        </div>
      </li>
      <li>
        <a class="icon" href="games/cake-three/"><img src="games/cake-three/icon.png" alt="" width="72" height="72"></a>
        <div>
          <a href="games/cake-three/">ケーキ三等分</a>
          <p>ホールケーキを切って、ぴったり三等分できるかな？</p>
        </div>
      </li>
      <li>
        <a class="icon" href="games/doukanbi/"><img src="games/doukanbi/icon.png" alt="" width="72" height="72"></a>
        <div>
          <a href="games/doukanbi/">動肝日</a>
          <p>遺伝子で決まる酒の強さ。30日間でどれだけ飲める？</p>
        </div>
      </li>
      <li>
        <a class="icon" href="games/malatang-250g/"><img src="games/malatang-250g/icon.png" alt="" width="72" height="72"></a>
        <div>
          <a href="games/malatang-250g/">麻辣湯チャレンジ</a>
          <p>具材をボウルに落として、ぴったり250gを目指そう！</p>
        </div>
      </li>
      <li>
        <a class="icon" href="games/dont-step-tail/"><img src="games/dont-step-tail/icon.png" alt="" width="72" height="72"></a>
        <div>
          <a href="games/dont-step-tail/">猫なわとび</a>
          <p>2匹のねこが回すしっぽの大なわを、何回跳べるか挑戦！</p>
        </div>
      </li>
    </ul>
  </main>

  <footer>
    <p>&copy; Kei Furukawa</p>
  </footer>
</body>
</html>
